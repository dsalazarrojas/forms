inputSchema:
  type: object
  properties:
    title: Cultural Performance Highlight Consent Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: performance_type
      label: Performance Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: performance_date
      label: Performance Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: performance_time
      label: Performance Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: performance_location
      label: Performance Location
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: performance_details
      label: Performance Details
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: consent
      label: Consent
      hint: We need your consent to use your performance in our materials.
      type: select_multiple
      options:
      - 'yes'
      - 'no'
      required: false
    - id: 11
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: agreement
      label: Agreement
      hint: null
      type: note
      options: []
      required: false
