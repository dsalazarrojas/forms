      name: name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: street
      label: Street
      hint: Enter street address
      type: text
      options: []
      required: false
    - id: 5
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
