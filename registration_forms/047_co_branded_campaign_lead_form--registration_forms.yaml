inputSchema:
  type: object
  properties:
    title: Co Branded Campaign Lead Form
    pages:
    - id: 1
      name: lead_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: lead_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: lead_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: lead_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: lead_submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: job_title
      label: Job Title or Position
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: industry
      label: Industry
      hint: Select your industry
      type: select_one
      options:
      - Technology
      - Finance
      - Healthcare
      - Manufacturing
      - Retail
      - Services
      - Other
      required: true
    - id: 9
      name: company_size
      label: Company Size
      hint: Number of employees
      type: select_one
      options:
      - Startup (1-10)
      - Small (11-50)
      - Medium (51-250)
      - Large (251-1000)
      - Enterprise (1000+)
      required: true
    - id: 10
      name: campaign_interest
      label: Campaign Interest Level
      hint: Select your interest
      type: select_one
      options:
      - High Interest
      - Moderate Interest
      - Low Interest
      - Just Exploring
      required: true
    - id: 11
      name: partnership_goals
      label: Partnership Goals
      hint: What are you looking for
      type: text
      options: []
      required: true
    - id: 12
      name: budget_range
      label: Budget Range
      hint: Approximate budget available
      type: select_one
      options:
      - Under 10K
      - 10K-50K
      - 50K-100K
      - 100K-500K
      - 500K+
      - Not Determined
      required: true
    - id: 13
      name: timeline
      label: Campaign Timeline
      hint: When would you start
      type: select_one
      options:
      - Immediate
      - Within 1 Month
      - Within 3 Months
      - Within 6 Months
      - Not Determined
      required: true
    - id: 14
      name: target_audience
      label: Target Audience
      hint: Who is your target customer
      type: text
      options: []
      required: false
    - id: 15
      name: additional_info
      label: Additional Information
      hint: Any other details
      type: text
      options: []
      required: false
