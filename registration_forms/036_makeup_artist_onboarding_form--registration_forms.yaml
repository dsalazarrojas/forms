inputSchema:
  type: object
  properties:
    title: Makeup Artist Onboarding Form
    pages:
    - id: 1
      name: artist_info
      label: Artist Information
      hint: Enter your artist name
      type: text
      options: []
      required: true
    - id: 2
      name: contact_info
      label: Contact Information
      hint: Enter your contact details
      type: text
      options: []
      required: true
    - id: 3
      name: availability
      label: Availability
      hint: Select your availability
      type: date
      options: []
      required: true
    - id: 4
      name: work_experience
      label: Work Experience
      hint: Select your work experience
      type: select_one
      options:
      - High School
      - College
      - Some College
      - Bachelor's Degree
      - Master's Degree
      required: true
    - id: 5
      name: experience_photoshop
      label: Experience in Photoshop
      hint: Select your experience level
      type: select_one
      options:
      - Basic
      - Intermediate
      - Advanced
      - Expert
      required: true
    - id: 6
      name: experience_tools
      label: Experience with Makeup Artist Tools
      hint: Select your experience level
      type: select_one
      options:
      - None
      - Brushes
      - Waxes
      - Makeup machines
      required: true
    - id: 7
      name: experience_photography
      label: Experience with Photography
      hint: Select your experience level
      type: select_one
      options:
      - None
      - Basic
      - Intermediate
      - Advanced
      required: true
    - id: 8
      name: work_location
      label: Work Location
      hint: Select your work location
      type: select_one
      options:
      - Online
      - In-store
      - Studio
      required: true
    - id: 9
      name: payment_rate
      label: Payment Rate
      hint: Select your payment rate
      type: select_one
      options:
      - $20/hour
      - $30/hour
      - $40/hour
      required: true
    - id: 10
      name: work_schedule
      label: Work Schedule
      hint: Select your work schedule
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 11
      name: end_date
      label: End Date
      hint: Select your end date
      type: date
      options: []
      required: true
