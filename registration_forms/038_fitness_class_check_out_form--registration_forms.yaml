inputSchema:
  type: object
  properties:
    title: Fitness Class Check Out Form
    pages:
    - id: 1
      name: check_out_info
      label: Check Out Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - credit card
      - bank transfer
      required: false
    - id: 3
      name: class_details
      label: Class Details
      hint: null
      type: select_multiple
      options:
      - morning class
      - evening class
      - weekend class
      - other class
      required: false
    - id: 4
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
