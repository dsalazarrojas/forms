inputSchema:
  type: object
  properties:
    title: Ceramic Painting Workshop Registration Form
    pages:
    - id: 1
      name: section_participant_info
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: For registration confirmation and updates
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: In case we need to contact you regarding the workshop
      type: text
      options: []
      required: true
    - id: 5
      name: age_group
      label: Age Group
      hint: Please select your age category
      type: select_one
      options:
      - Child (Under 12)
      - Teen (12-17)
      - Adult (18-64)
      - Senior (65+)
      required: true
    - id: 6
      name: section_workshop_details
      label: -- Workshop Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: preferred_session
      label: Preferred Session
      hint: Select the date and time you wish to attend
      type: select_one
      options:
      - Morning Session (10:00 AM - 12:00 PM)
      - Afternoon Session (2:00 PM - 4:00 PM)
      - Evening Session (6:00 PM - 8:00 PM)
      required: true
    - id: 8
      name: workshop_date
      label: Workshop Date
      hint: Select the specific date for the session
      type: date
      options: []
      required: true
    - id: 9
      name: ceramic_item_choice
      label: Ceramic Item to Paint
      hint: Choose the item you would like to work on
      type: select_one
      options:
      - Coffee Mug
      - Salad Plate
      - Cereal Bowl
      - Small Vase
      - Figurines
      required: true
    - id: 10
      name: skill_level
      label: Your Experience Level
      hint: How much experience do you have with ceramic painting?
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
    - id: 11
      name: section_safety_consent
      label: -- Safety and Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: health_allergies
      label: Allergies or Health Concerns
      hint: Please list any allergies to materials or health conditions we should
        know about
      type: text
      options: []
      required: false
    - id: 15
      name: photo_release_consent
      label: Photo Release Consent
      hint: I consent to being photographed during the workshop for promotional purposes
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: terms_and_conditions
      label: Terms and Conditions Agreement
      hint: I agree to the workshop rules and safety guidelines
      type: select_one
      options:
      - I Agree
      - Other
      required: true
