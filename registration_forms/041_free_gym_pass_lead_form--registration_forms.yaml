inputSchema:
  type: object
  properties:
    title: Free Gym Pass Lead Form
    pages:
    - id: 1
      name: lead_info
      label: Lead Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: Full name of the individual
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
