inputSchema:
  type: object
  properties:
    title: Birth Registration Form
    pages:
    - id: 1
      name: section_intro
      label: -- Birth Registration --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: intro_text
      label: Register your newborn and create an official birth record
      hint: Complete this form soon after birth
      type: note
      options: []
      required: false
    - id: 3
      name: section_newborn
      label: -- Newborn Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: newborn_first_name
      label: Baby's First Name
      hint: Given name for infant
      type: text
      options: []
      required: true
    - id: 5
      name: newborn_middle_name
      label: Baby's Middle Name
      hint: Middle name if applicable
      type: text
      options: []
      required: false
    - id: 6
      name: newborn_last_name
      label: Baby's Last Name
      hint: Family surname
      type: text
      options: []
      required: true
    - id: 7
      name: birth_date
      label: Date of Birth
      hint: Full date of birth
      type: date
      options: []
      required: true
    - id: 8
      name: birth_time
      label: Time of Birth
      hint: Hour and minute
      type: time
      options: []
      required: true
    - id: 9
      name: sex_of_infant
      label: Sex of Infant
      hint: Male or Female
      type: select_one
      options:
      - Male
      - Female
      required: true
    - id: 10
      name: weight_grams
      label: Weight at Birth
      hint: In pounds and ounces or grams
      type: text
      options: []
      required: true
    - id: 11
      name: length_cm
      label: Length at Birth
      hint: In inches or centimeters
      type: text
      options: []
      required: true
    - id: 12
      name: head_circumference
      label: Head Circumference
      hint: In inches or centimeters
      type: text
      options: []
      required: false
    - id: 13
      name: section_birth_location
      label: -- Birth Location Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: place_of_birth
      label: Place of Birth
      hint: Hospital, birth center, home, etc.
      type: select_one
      options:
      - Hospital
      - Birth Center
      - Home
      - In Transit
      - Other
      required: true
    - id: 15
      name: facility_name
      label: Facility Name
      hint: Name of hospital or center
      type: text
      options: []
      required: false
    - id: 16
      name: city_of_birth
      label: City of Birth
      hint: City where infant was born
      type: text
      options: []
      required: true
    - id: 17
      name: county_of_birth
      label: County of Birth
      hint: County of birth
      type: text
      options: []
      required: true
    - id: 18
      name: state_of_birth
      label: State of Birth
      hint: State where born
      type: text
      options: []
      required: true
    - id: 19
      name: country_of_birth
      label: Country of Birth
      hint: Country of birth
      type: text
      options: []
      required: true
    - id: 20
      name: section_mother_info
      label: -- Mother Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: mother_first_name
      label: Mother First Name
      hint: Mother's given name
      type: text
      options: []
      required: true
    - id: 22
      name: mother_middle_name
      label: Mother Middle Name
      hint: Mother's middle name
      type: text
      options: []
      required: false
    - id: 23
      name: mother_last_name
      label: Mother Last Name
      hint: Mother's current surname
      type: text
      options: []
      required: true
    - id: 24
      name: mother_maiden_name
      label: Mother Maiden Name
      hint: Mother's surname before marriage
      type: text
      options: []
      required: false
    - id: 25
      name: mother_dob
      label: Mother Date of Birth
      hint: Mother's birth date
      type: date
      options: []
      required: true
    - id: 26
      name: mother_age
      label: Mother Age at Birth
      hint: Age when child born
      type: number
      options: []
      required: true
    - id: 27
      name: mother_address
      label: Mother's Current Address
      hint: Complete address
      type: text
      options: []
      required: true
    - id: 28
      name: mother_country_origin
      label: Mother Country of Origin
      hint: Country of origin or citizenship
      type: text
      options: []
      required: false
    - id: 29
      name: section_father_info
      label: -- Father Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 30
      name: father_included
      label: Father's Name on Birth Certificate
      hint: Will father be listed
      type: select_one
      options:
      - true
      - false
      - To Be Determined
      required: true
    - id: 31
      name: father_first_name
      label: Father First Name
      hint: Father's given name
      type: text
      options: []
      required: false
    - id: 32
      name: father_middle_name
      label: Father Middle Name
      hint: Father's middle name
      type: text
      options: []
      required: false
    - id: 33
      name: father_last_name
      label: Father Last Name
      hint: Father's surname
      type: text
      options: []
      required: false
    - id: 34
      name: father_dob
      label: Father Date of Birth
      hint: Father's birth date
      type: date
      options: []
      required: false
    - id: 35
      name: father_age
      label: Father Age at Birth
      hint: Age when child born
      type: number
      options: []
      required: false
    - id: 36
      name: father_address
      label: Father's Current Address
      hint: If different from mother
      type: text
      options: []
      required: false
    - id: 37
      name: father_country_origin
      label: Father Country of Origin
      hint: Country of origin or citizenship
      type: text
      options: []
      required: false
    - id: 38
      name: section_health_info
      label: -- Health Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 39
      name: apgar_score
      label: Apgar Score
      hint: 1-minute and 5-minute scores
      type: text
      options: []
      required: false
    - id: 40
      name: delivery_method
      label: Method of Delivery
      hint: Vaginal or cesarean
      type: select_one
      options:
      - Vaginal Delivery
      - Cesarean Section
      - Assisted Vaginal
      - Other
      required: true
    - id: 41
      name: congenital_conditions
      label: Any Congenital Conditions
      hint: Birth defects or conditions
      type: text
      options: []
      required: false
