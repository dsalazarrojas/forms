inputSchema:
  type: object
  properties:
    title: Parental Consent For Minors Form
    pages:
    - id: 1
      name: user_input
      label: Parental Consent For Minors
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: minor_info
      label: Minor Information
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: parent_info
      label: Parent Information
      hint: Enter parent information
      type: note
      options: []
      required: false
    - id: 4
      name: email_parent
      label: Email Address
      hint: Enter email address of parent or guardian
      type: email
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date Of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: phone_number
      label: Phone Number
      hint: Enter phone number of parent or guardian
      type: text
      options: []
      required: false
    - id: 7
      name: signature
      label: Parent Signature
      hint: null
      type: note
      options: []
      required: false
