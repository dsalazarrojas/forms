inputSchema:
  type: object
  properties:
    title: parent-teacher-meeting-check-in-form
    pages:
    - id: 1
      name: checkin_info
      label: Check In Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Parent's Name
      hint: Parent's name as it appears on student's report card
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Parent's Email
      hint: Parent's email address
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Parent's Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: student_name
      label: Student's Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: teacher_name
      label: Teacher's Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: grade
      label: Grade Level
      hint: null
      type: select_one
      options:
      - K-5
      - 6-8
      - 9-12
      required: true
    - id: 8
      name: meeting_date
      label: Meeting Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: meeting_time
      label: Meeting Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: meeting_location
      label: Meeting Location
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: student_attendance
      label: Student Attendance
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
