      name: applicant_name
      label: Applicant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: program_choice
      label: Select Program
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''program1'', ''label'': ''Program 1''}'
      - '{''id'': 2, ''name'': ''program2'', ''label'': ''Program 2''}'
      - '{''id'': 3, ''name'': ''program3'', ''label'': ''Program 3''}'
