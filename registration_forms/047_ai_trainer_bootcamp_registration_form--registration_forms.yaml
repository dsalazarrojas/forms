inputSchema:
  type: object
  properties:
    title: AI Trainer Bootcamp Registration Form
    pages:
    - id: 1
      name: --participant_details--
      label: -- Participant Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization
      hint: Optional
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email address
      hint: Confirmation will be sent here
      type: email
      options: []
      required: true
    - id: 5
      name: role
      label: Role or job title
      hint: Example Trainer, Educator, Developer
      type: text
      options: []
      required: true
    - id: 6
      name: experience_level
      label: Experience level with AI training
      hint: Select one
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Expert
      required: true
    - id: 7
      name: learning_objectives
      label: Learning objectives
      hint: What do you hope to achieve
      type: text
      options: []
      required: false
    - id: 8
      name: session_selection
      label: Session selection
      hint: Choose preferred sessions
      type: select_multiple
      options:
      - Core curriculum
      - Advanced labs
      - Assessment design
      - Coaching and mentoring
      required: true
    - id: 9
      name: dietary_needs
      label: Dietary needs
      hint: Leave blank if none
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_contact
      label: Emergency contact information
      hint: Optional
      type: text
      options: []
      required: false
