inputSchema:
  type: object
  properties:
    title: trade-season-pass-registration
    pages:
    - id: 1
      name: general_info
      label: General Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: pass_type
      label: Pass Type
      hint: null
      type: select_one
      options:
      - Single Pass
      - Couple Pass
      - Family Pass
      required: false
    - id: 3
      name: pass_preferences
      label: Pass Preferences
      hint: null
      type: select_multiple
      options:
      - Weekend Pass
      - Full Season Pass
      - Single Weekend
      required: false
