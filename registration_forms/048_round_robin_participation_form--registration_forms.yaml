inputSchema:
  type: object
  properties:
    title: Round Robin Participation Form
    pages:
    - id: 1
      name: round_robin_session
      label: Session
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: session_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: session_time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: participant_availability
      label: Availability
      hint: null
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 8
      name: confirm_participant_availability
      label: Confirm Availability
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
