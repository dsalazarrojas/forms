inputSchema:
  type: object
  properties:
    title: Training Program Calendar
    pages:
    - id: 1
      name: page_1
      label: What is the purpose of this training?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: page_2
      label: Which of the following sessions did the participant attend?
      hint: null
      type: select_multiple
      options:
      - Session 1
      - Session 2
      - Session 3
      required: true
    - id: 3
      name: page_3
      label: What is the participant's name?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: page_4
      label: Do you have any questions about the training?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: page_5
      label: What are the notes from the session?
      hint: null
      type: note
      options: []
      required: true
    - id: 6
      name: page_6
      label: What is the participant's availability for follow-up?
      hint: null
      type: select_one
      options:
      - Available
      - Unavailable
      required: true
    - id: 7
      name: page_7
      label: How many tools do you have used during the training?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: page_8
      label: What are the tools used?
      hint: null
      type: select_multiple
      options:
      - Tool 1
      - Tool 2
      - Tool 3
      required: true
    - id: 9
      name: page_9
      label: Do you have any feedback about the tools?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: page_10
      label: What is your overall satisfaction with the training?
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: page_11
      label: What is your rating for the training?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 12
      name: page_12
      label: Would you recommend this training?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: page_13
      label: Do you have any comments about this training?
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: page_14
      label: Is this the end of the form?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
