      name: program_title
      label: Program Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: student_phone
      label: Student Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: date_of_admission
      label: Date of Admission
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: program_level
      label: Program Level
      hint: null
      type: select_multiple
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
    - id: 8
      name: duration_of_program
      label: Duration of Program
      hint: null
      type: number
      options: []
      required: false
