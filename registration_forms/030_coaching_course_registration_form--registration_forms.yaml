inputSchema:
  type: object
  properties:
    title: Coaching Course Registration Form
    pages:
    - id: 1
      name: participant_name
      label: Full Name
      hint: Your legal full name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: mailing_address
      label: Mailing Address
      hint: Your full address
      type: text
      options: []
      required: true
    - id: 5
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: true
    - id: 6
      name: state_province
      label: State or Province
      hint: Your state or province
      type: text
      options: []
      required: true
    - id: 7
      name: zip_postal_code
      label: ZIP or Postal Code
      hint: Your postal code
      type: text
      options: []
      required: true
    - id: 8
      name: country
      label: Country
      hint: Your country
      type: text
      options: []
      required: true
    - id: 9
      name: date_of_birth
      label: Date of Birth
      hint: For age verification
      type: date
      options: []
      required: true
    - id: 10
      name: course_selection
      label: Course Selection
      hint: Which course do you want
      type: select_one
      options:
      - Introduction to Coaching
      - Advanced Coaching Techniques
      - Executive Coaching Certification
      - Life Coaching Fundamentals
      - Career Coaching Program
      - Health Coaching Course
      - Business Coaching Mastery
      required: true
    - id: 11
      name: course_level
      label: Course Level
      hint: What level is appropriate
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Master Level
      required: true
    - id: 12
      name: preferred_start_date
      label: Preferred Start Date
      hint: When do you want to begin
      type: date
      options: []
      required: true
    - id: 13
      name: course_format
      label: Course Format Preference
      hint: How do you want to learn
      type: select_one
      options:
      - Online Self-Paced
      - Online Live Classes
      - In Person
      - Hybrid
      required: true
    - id: 14
      name: time_zone
      label: Your Time Zone
      hint: What time zone are you in
      type: text
      options: []
      required: false
    - id: 15
      name: occupation
      label: Current Occupation
      hint: Your job or profession
      type: text
      options: []
      required: true
    - id: 16
      name: employer
      label: Employer Name
      hint: Name of your organization
      type: text
      options: []
      required: false
    - id: 17
      name: education_level
      label: Highest Education Level
      hint: Your highest completed education
      type: select_one
      options:
      - High School
      - Some College
      - Associate Degree
      - Bachelor Degree
      - Master Degree
      - Doctorate
      required: true
    - id: 18
      name: coaching_experience
      label: Previous Coaching Experience
      hint: Describe any coaching background
      type: text
      options: []
      required: false
    - id: 19
      name: reason_for_taking_course
      label: Why Do You Want to Take This Course
      hint: Your motivation for registering
      type: text
      options: []
      required: true
    - id: 20
      name: learning_goals
      label: What Do You Hope to Learn
      hint: Your learning objectives
      type: text
      options: []
      required: true
    - id: 21
      name: how_will_you_apply_learning
      label: How Will You Apply What You Learn
      hint: Your intended application
      type: text
      options: []
      required: false
    - id: 22
      name: special_accommodations
      label: Special Accommodations Needed
      hint: Any accessibility requirements
      type: text
      options: []
      required: false
    - id: 23
      name: course_fee
      label: Course Fee
      hint: Total cost of the course
      type: select_one
      options:
      - Under $500
      - $500-$1000
      - $1001-$2500
      - $2501-$5000
      - Over $5000
      required: true
    - id: 24
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Bank Transfer
      - PayPal
      - Payment Plan
      - Employer Sponsored
      required: true
    - id: 25
      name: early_bird_discount
      label: Are You Eligible for Early Bird Discount
      hint: Registering before deadline
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 26
      name: group_discount
      label: Are You Registering as a Group
      hint: Multiple people from same organization
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 27
      name: how_heard_about_course
      label: How Did You Hear About This Course
      hint: How did you find us
      type: select_one
      options:
      - Online Search
      - Social Media
      - Referral
      - Advertisement
      - Email
      - Other
      required: false
    - id: 28
      name: referral_name
      label: Who Referred You
      hint: Name of person who referred you
      type: text
      options: []
      required: false
    - id: 29
      name: terms_and_conditions
      label: I Accept Terms and Conditions
      hint: You agree to course policies
      type: select_one
      options:
      - Yes I Accept
      - 'False'
      required: true
    - id: 30
      name: cancellation_policy
      label: I Understand Cancellation Policy
      hint: You understand refund and cancellation
      type: select_one
      options:
      - Yes I Understand
      - No I Need Review
      required: true
    - id: 31
      name: registration_date
      label: Registration Date
      hint: Today date
      type: date
      options: []
      required: true
