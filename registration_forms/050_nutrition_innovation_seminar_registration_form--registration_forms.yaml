inputSchema:
  type: object
  properties:
    title: Nutrition Innovation Seminar Registration Form
    pages:
    - id: 1
      name: registration_name
      label: Registration Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: participant_type
      label: Participant Type
      hint: null
      type: select_multiple
      options:
      - Student
      - Academic
      - Professional
      - Other
      required: false
    - id: 5
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: List any food restrictions or allergies
      type: note
      options: []
      required: false
    - id: 6
      name: dietary_restrictions_other
      label: Other
      hint: Please describe any other dietary restrictions
      type: text
      options: []
      required: false
    - id: 7
      name: special_requirements
      label: Special Requirements
      hint: null
      type: text
      options: []
      required: false
