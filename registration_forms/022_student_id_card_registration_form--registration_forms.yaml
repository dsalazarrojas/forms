inputSchema:
  type: object
  properties:
    title: Student ID Card Registration Form
    pages:
    - id: 1
      name: student_name
      label: Student name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_email
      label: Student email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: student_phone
      label: Student phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: student_address
      label: Student address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: student_photo
      label: Student photo
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: photo_front
      label: Photo Front
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: photo_back
      label: Photo Back
      hint: Please upload a clear and high-quality photo
      type: text
      options: []
      required: false
    - id: 8
      name: student_document
      label: Student document
      hint: Please upload a copy of a valid government-issued ID
      type: text
      options: []
      required: false
    - id: 9
      name: student_signature
      label: Student signature
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: student_id_number
      label: Student ID number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: student_id_type
      label: Student ID type
      hint: null
      type: select_one
      options:
      - Student ID
      - National ID
      - Driver's license
      - Passport
      required: false
    - id: 12
      name: student_id_expiration
      label: Student ID expiration
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: student_id_issued_date
      label: Student ID issued date
      hint: null
      type: date
      options: []
      required: false
