inputSchema:
  type: object
  properties:
    title: educational-program-registration-form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: program_type
      label: Program Type
      hint: null
      type: select_multiple
      options:
      - High School Diploma
      - College
      - University
      required: false
    - id: 6
      name: student_grade
      label: Student Grade
      hint: null
      type: select_one
      options:
      - 9th
      - 10th
      - 11th
      - 12th
      - 1st
      - 2nd
      - 3rd
      - 4th
      - 5th
      - 6th
      - 7th
      - 8th
      required: false
    - id: 7
      name: program_start_date
      label: Program Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: program_end_date
      label: Program End Date
      hint: null
      type: date
      options: []
      required: false
