inputSchema:
  type: object
  properties:
    title: After Hours Park Registration Form
    pages:
    - id: 1
      name: registrant_information_section
      label: Registrant Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Enter your complete legal name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: Your date of birth
      type: date
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Email for registration confirmation and updates
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Phone number for contact regarding your registration
      type: text
      options: []
      required: true
    - id: 6
      name: address
      label: Address
      hint: Your residential address
      type: text
      options: []
      required: true
    - id: 7
      name: emergency_contact
      label: Emergency Contact
      hint: Name and phone number of emergency contact
      type: text
      options: []
      required: true
    - id: 8
      name: park_access_details_section
      label: Park Access Details
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: park_name
      label: Park Name
      hint: Which park are you requesting after-hours access to?
      type: select_one
      options:
      - Central Park
      - Riverside Park
      - Memorial Park
      - Lakeview Park
      - Hillside Recreation Area
      - Woodland Nature Reserve
      - Sunset Sports Complex
      - Other
      required: true
    - id: 10
      name: access_date
      label: Access Date
      hint: Date when you need after-hours park access
      type: date
      options: []
      required: true
    - id: 11
      name: access_start_time
      label: Access Start Time
      hint: What time will you enter the park?
      type: time
      options: []
      required: true
    - id: 12
      name: access_end_time
      label: Access End Time
      hint: What time will you leave the park?
      type: time
      options: []
      required: true
    - id: 13
      name: access_purpose
      label: Purpose of Access
      hint: What is the purpose of your after-hours park visit?
      type: select_one
      options:
      - Photography
      - Stargazing
      - Quiet reflection
      - Organized event
      - Athletic training
      - Scientific observation
      - Other
      required: true
    - id: 14
      name: activity_details
      label: Activity Details
      hint: Describe the specific activities you plan to engage in
      type: text
      options: []
      required: true
    - id: 15
      name: group_size
      label: Group Size
      hint: How many people will be in your group?
      type: number
      options: []
      required: true
    - id: 16
      name: special_equipment
      label: Special Equipment
      hint: Will you be bringing any special equipment?
      type: text
      options: []
      required: false
    - id: 17
      name: safety_compliance_section
      label: Safety and Compliance
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: park_rules_acknowledgment
      label: Park Rules Acknowledgment
      hint: I acknowledge that I will follow all park rules and regulations during
        after-hours access
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: noise_level_agreement
      label: Noise Level Agreement
      hint: I agree to maintain appropriate noise levels that won't disturb nearby
        residents
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 20
      name: waste_disposal_agreement
      label: Waste Disposal Agreement
      hint: I agree to pack out all waste and leave the park in its original condition
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 21
      name: wildlife_protection_agreement
      label: Wildlife Protection Agreement
      hint: I agree to respect wildlife and not disturb natural habitats
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 22
      name: safety_equipment
      label: Safety Equipment
      hint: What safety equipment will you bring?
      type: select_multiple
      options:
      - Flashlights
      - Reflective clothing
      - First aid kit
      - Whistle
      - Cell phone
      - None needed
      required: true
    - id: 23
      name: risk_acknowledgment
      label: Risk Acknowledgment
      hint: I acknowledge that after-hours park access involves inherent risks and
        I assume responsibility for my safety
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 24
      name: access_restrictions_section
      label: Access Restrictions
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: restricted_areas
      label: Restricted Areas
      hint: Are there any park areas you specifically need to access that are normally
        restricted?
      type: text
      options: []
      required: false
    - id: 26
      name: special_permits_needed
      label: Special Permits Needed
      hint: Do you need any special permits for your activities?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 27
      name: permit_details
      label: Permit Details
      hint: If yes, please specify what permits you have or need
      type: text
      options: []
      required: false
    - id: 28
      name: weather_contingency
      label: Weather Contingency Plan
      hint: What will you do if weather conditions deteriorate during your visit?
      type: text
      options: []
      required: true
    - id: 29
      name: registration_confirmation_section
      label: Registration Confirmation
      hint: null
      type: note
      options: []
      required: false
    - id: 30
      name: terms_agreement
      label: Terms Agreement
      hint: I agree to the terms and conditions for after-hours park access
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 31
      name: information_accuracy
      label: Information Accuracy
      hint: I confirm that all information provided is accurate and complete
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 32
      name: signature
      label: Electronic Signature
      hint: Sign to confirm your registration
      type: text
      options: []
      required: true
