inputSchema:
  type: object
  properties:
    title: New Volunteer Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: volunteer_type
      label: Volunteer Type
      hint: null
      type: select_one
      options:
      - Volunteer Type 1
      - Volunteer Type 2
      - Volunteer Type 3
      required: false
    - id: 6
      name: volunteer_shift
      label: Volunteer Shift
      hint: null
      type: select_multiple
      options:
      - Shift 1
      - Shift 2
      - Shift 3
      required: false
    - id: 7
      name: volunteer_date
      label: Volunteer Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: volunteer_time
      label: Volunteer Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
