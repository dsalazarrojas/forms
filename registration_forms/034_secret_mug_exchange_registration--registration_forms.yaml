inputSchema:
  type: object
  properties:
    title: Secret Mug Exchange Registration
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Enter your first name
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: Enter your last name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: Enter your phone number
      type: text
      options: []
      required: true
    - id: 5
      name: event_date
      label: Event Date
      hint: Enter the date of the event
      type: date
      options: []
      required: true
    - id: 6
      name: event_time
      label: Event Time
      hint: Enter the time of the event
      type: time
      options: []
      required: true
    - id: 7
      name: note
      label: Note
      hint: Any additional comments?
      type: text
      options: []
      required: false
    - id: 8
      name: team
      label: Team or Group Affiliation
      hint: Enter your team or group name
      type: text
      options: []
      required: false
    - id: 9
      name: club
      label: Club or Organization
      hint: Enter your club or organization name
      type: text
      options: []
      required: false
    - id: 10
      name: community
      label: Community Involvement
      hint: Enter your community involvement
      type: text
      options: []
      required: false
    - id: 11
      name: participant_preferences
      label: Participant Preferences
      hint: Select your preferences
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 12
      name: assigned_tool
      label: Assigned Tool
      hint: Select your assigned tool
      type: select_one
      options:
      - Tool 1
      - Tool 2
      - Tool 3
      required: true
