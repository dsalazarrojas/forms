      name: partner_name
      label: partner_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: partner_email
      label: partner_email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: partner_phone
      label: partner_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: partner_note
      label: partner_note
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: partner_type
      label: partner_type
      hint: null
      type: select_one
      options:
      - Giveaway Host
      - Organizer
      - Sponsor
      required: false
    - id: 6
      name: partner_location
      label: partner_location
      hint: null
      type: select_multiple
      options:
      - Location 1
      - Location 2
      - Location 3
      required: false
    - id: 7
      name: partner_date
      label: partner_date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: partner_time
      label: partner_time
      hint: null
      type: time
      options: []
      required: false
