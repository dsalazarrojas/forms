inputSchema:
  type: object
  properties:
    title: Online Auction Access Form
    pages:
    - id: 1
      name: registration_information
      label: Registration Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: auction_name
      label: Auction Name
      hint: Required
      type: text
      options: []
      required: false
    - id: 4
      name: auction_type
      label: Auction Type
      hint: null
      type: select_one
      options:
      - Auction
      - Non-Auction
      required: false
    - id: 5
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: participant_notes
      label: Participant Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Bank Transfer
      - PayPal
      required: false
    - id: 10
      name: payment_details
      label: Payment Details
      hint: null
      type: text
      options: []
      required: false
