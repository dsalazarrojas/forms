      name: alternate_person_1_name
      label: Alternate Person 1 Full Name
      hint: Legal name
      type: text
      options: []
      required: true
    - id: 13
      name: alternate_person_1_relationship
      label: Alternate Person 1 Relationship
      hint: Relationship to child
      type: text
      options: []
      required: true
    - id: 14
      name: alternate_person_1_phone
      label: Alternate Person 1 Phone
      hint: Contact number
      type: text
      options: []
