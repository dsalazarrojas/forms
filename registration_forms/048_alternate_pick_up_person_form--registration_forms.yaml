      hint: Parent, guardian, etc.
      type: select_one
      options:
      - Mother
      - Father
      - Legal guardian
      - Foster parent
      - Other
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Primary contact
      type: text
      options: []
      required: true
    - id: 5
      name: alternate_phone
      label: Alternate Phone
      hint: Backup number
      type: text
      options: []
      required: false
    - id: 6
      name: home_address
      label: Home Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 7
      name: child_first_name
      label: Child First Name
      hint: First name
