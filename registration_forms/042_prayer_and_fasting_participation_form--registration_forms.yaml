      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: fasting_participants
      label: Fasting Participants
      hint: null
      type: select_multiple
      options:
      - Self
      - Group
      - Church
      required: false
    - id: 10
      name: fasting_location
      label: Fasting Location
      hint: null
      type: select_multiple
      options:
      - Home
      - Church
      - Public Place
      required: false
    - id: 11
      name: fasting_leaders
      label: Fasting Leaders
      hint: null
      type: select_multiple
      options:
      - Self
      - Other
      required: false
