inputSchema:
  type: object
  properties:
    title: Internal Training Registration Intake Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: training_course
      label: Training Course
      hint: Please select a training course
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: date_of_training
      label: Date of Training
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: time_of_training
      label: Time of Training
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: training_location
      label: Training Location
      hint: Please select multiple training locations
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: trainer_name
      label: Trainer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: confirm
      label: Confirm
      hint: Please confirm your registration
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
