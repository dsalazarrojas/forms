inputSchema:
  type: object
  properties:
    title: Green Logistics Network Application Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: company_info
      label: Company Information
      hint: Provide your company details
      type: text
      options: []
      required: false
    - id: 3
      name: contact_person
      label: Contact Person
      hint: Enter your contact person name
      type: text
      options: []
      required: false
    - id: 4
      name: sustainability_statement
      label: Sustainability Statement
      hint: Explain your sustainability practices
      type: text
      options: []
      required: false
    - id: 5
      name: company_address
      label: Company Address
      hint: Enter your company address
      type: text
      options: []
      required: false
    - id: 6
      name: phone_number
      label: Phone Number
      hint: Enter your phone number
      type: text
      options: []
      required: false
    - id: 7
      name: email_address
      label: Email Address
      hint: Enter your email address
      type: text
      options: []
      required: false
    - id: 8
      name: company_website
      label: Company Website
      hint: Enter your company website
      type: text
      options: []
      required: false
    - id: 9
      name: company_type
      label: Company Type
      hint: Enter your company type
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 10
      name: industry
      label: Industry
      hint: Select your industry
      type: select_multiple
      options:
      - Manufacturing
      - Retail
      - Services
      - Transportation
      - Wholesale
      required: false
    - id: 11
      name: sustainability_practices
      label: Sustainability Practices
      hint: Select all that apply
      type: select_multiple
      options:
      - Carbon offsetting
      - Renewable energy
      - Recycling
      - Supply chain management
      - Sustainable packaging
      required: false
    - id: 12
      name: certification
      label: Certification
      hint: Select your relevant certifications
      type: select_multiple
      options:
      - ISO 14001
      - LEED
      - B Corp
      - FSC
      - GRS
      required: false
    - id: 13
      name: green_fleet
      label: Green Fleet
      hint: Enter your green fleet details
      type: text
      options: []
      required: false
    - id: 14
      name: emissions_target
      label: Emissions Target
      hint: Enter your emissions target
      type: number
      options: []
      required: false
    - id: 15
      name: sustainability_commitment
      label: Sustainability Commitment
      hint: Enter your sustainability commitment
      type: text
      options: []
      required: false
    - id: 16
      name: business_description
      label: Business Description
      hint: Describe your company
      type: text
      options: []
      required: false
    - id: 17
      name: job_type
      label: Job Type
      hint: Select your job type
      type: select_one
      options:
      - Full-time
      - Part-time
      - Freelance
      - Intern
      required: false
    - id: 18
      name: employee_count
      label: Employee Count
      hint: Enter your employee count
      type: number
      options: []
      required: false
    - id: 19
      name: business_hours
      label: Business Hours
      hint: Enter your business hours
      type: time
      options: []
      required: false
    - id: 20
      name: location
      label: Location
      hint: Enter your location
      type: text
      options: []
      required: false
    - id: 21
      name: date_started
      label: Date Started
      hint: Enter the date you started
      type: date
      options: []
      required: false
    - id: 22
      name: company_size
      label: Company Size
      hint: Enter your company size
      type: select_one
      options:
      - Small
      - Medium
      - Large
      - Extra Large
      required: false
    - id: 23
      name: business_focus
      label: Business Focus
      hint: Select your business focus
      type: select_multiple
      options:
      - Environment
      - People
      - Community
      - Economy
      - Society
      required: false
    - id: 24
      name: certification_date
      label: Certification Date
      hint: Enter your certification date
      type: date
      options: []
      required: false
    - id: 25
      name: submission
      label: Submission
      hint: null
      type: select_multiple
      options:
      - I am ready to submit my application
      - I need more information before submitting my application
      required: false
