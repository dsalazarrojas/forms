title: Member satisfaction survey
description: Generate a Member satisfaction survey survey for the "Social surveys" category. Use the template name: "Member satisfaction survey template".
questions:
  - text: Overall, how satisfied are you with member satisfaction survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Member, Satisfaction, Survey, Social]
  - text: How often do you interact with member satisfaction survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
