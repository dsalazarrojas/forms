title: Work life balance survey
description: Generate a Work life balance survey survey for the "Social surveys" category. Use the template name: "Work life balance survey template".
questions:
  - text: Overall, how satisfied are you with work life balance survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Work, Life, Balance, Survey]
  - text: How often do you interact with work life balance survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
