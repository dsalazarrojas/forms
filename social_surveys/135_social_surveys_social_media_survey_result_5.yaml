title: Social media survey
description: Generate a Social media survey survey for the "Social surveys" category. Use the template name: "Social media survey template".
questions:
  - text: Overall, how satisfied are you with social media survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Social, Media, Survey, Surveys]
  - text: How often do you interact with social media survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
