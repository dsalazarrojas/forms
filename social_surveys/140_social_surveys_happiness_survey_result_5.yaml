title: Happiness survey
description: Generate a Happiness survey survey for the "Social surveys" category. Use the template name: "Happiness survey template".
questions:
  - text: Overall, how satisfied are you with happiness survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Happiness, Survey, Social, Surveys]
  - text: How often do you interact with happiness survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
