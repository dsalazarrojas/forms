title: Demographic survey questionnaire
description: Generate a Demographic survey questionnaire survey for the "Social surveys" category. Use the template name: "Demographic survey questionnaire template".
questions:
  - text: Overall, how satisfied are you with demographic survey questionnaire?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Demographic, Survey, Questionnaire, Social]
  - text: How often do you interact with demographic survey questionnaire?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
