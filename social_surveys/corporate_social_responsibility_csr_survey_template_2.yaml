description: A survey to gather feedback on your experience with the Corporate Social
  Responsibility (CSR) survey process.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied are you with the Corporate Social Responsibility (CSR) survey?
  type: single
- options:
  - Frequently
  - Occasionally
  - Rarely
  - Never
  text: How often do you participate in surveys related to corporate social responsibility?
  type: single
- options:
  - Clear
  - Relevant
  - Easy to complete
  - Confusing
  - Too long
  - Irrelevant
  text: Which of the following applied to your experience with this CSR survey? (Select
    all that apply)
