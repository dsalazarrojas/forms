inputSchema:
  type: object
  properties:
    title: Fixed Deposit Application Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: fixed_deposit_amount
      label: Fixed Deposit Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: loan_term
      label: Loan Term
      hint: null
      type: select_one
      options:
      - 6 months
      - 12 months
      - 24 months
      required: true
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: approval_date
      label: Approval Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: fixed_deposit_status
      label: Fixed Deposit Status
      hint: null
      type: text
      options: []
      required: false
