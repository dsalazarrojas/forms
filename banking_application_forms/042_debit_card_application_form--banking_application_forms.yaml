inputSchema:
  type: object
  properties:
    title: Debit Card Application Form
    pages:
    - id: 1
      name: application_information
      label: Application Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_info
      label: Customer Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: card_details
      label: Card Details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: card_type
      label: Card Type
      hint: Select the type of card you would like to apply for
      type: select_one
      options:
      - Cash
      - Debit
      - Credit
      - Prepaid
      required: false
    - id: 5
      name: card_number
      label: Card Number
      hint: 16-digit debit card number
      type: text
      options: []
      required: false
    - id: 6
      name: expiration_date
      label: Expiration Date
      hint: mm/yy or mm/yy
      type: date
      options: []
      required: false
    - id: 7
      name: cvv
      label: CVV
      hint: Card Verification Value (CVV)
      type: text
      options: []
      required: false
