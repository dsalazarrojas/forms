      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: payment_network_integration_main_system
      label: Is the payment network integrated with the main system?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: payment_network_reporting
      label: Is there a process for reporting and addressing payment network issues?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: payment_network_documentation
      label: Is the payment network properly documented and maintained?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
