inputSchema:
  type: object
  properties:
    title: Payment Network Compliance Integration Evaluation Checklist
    pages:
    - id: 1
      name: payment_network_compliance_integration
      label: Is the payment network integrated?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 2
      name: payment_network_compliance_compliance
      label: Is the payment network fully compliant?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: payment_network_security
      label: Is the payment network secure?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: payment_network_update_protocol
      label: Is the payment network up-to-date with the latest security protocols?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: payment_network_compliance_standards
      label: Does the payment network meet the required compliance standards?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: payment_network_activity_monitoring
      label: Is there a clear process for monitoring payment network activity?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
