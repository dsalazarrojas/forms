inputSchema:
  type: object
  properties:
    title: HVAC Installation Checklist Form
    pages:
    - id: 1
      name: installer_name
      label: Installer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: address
      label: address
      hint: Provide the address of the installation site.
      type: text
      options: []
      required: true
    - id: 3
      name: equipment_installed
      label: Equipment Installed
      hint: null
      type: select_multiple
      options:
      - heating
      - ventilation
      - air conditioning
      required: true
    - id: 4
      name: installation_date
      label: Installation Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: technician_name
      label: Technician Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: supervisor_name
      label: Supervisor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
