inputSchema:
  type: object
  properties:
    title: Furnishing Task Entry Checklist
    pages:
    - id: 1
      name: room_number
      label: Room Number
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: task_status
      label: Task Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 3
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: task_name
      label: Task Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: task_description
      label: Task Description
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: task_type
      label: Task Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: deadline
      label: Deadline
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
