inputSchema:
  type: object
  properties:
    title: Mobile Home Attic Access Inspection Checklist
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: exterior_access
      label: Exterior Access
      hint: Check for any obstacles or barriers preventing access to the attic
      type: text
      options: []
      required: false
    - id: 3
      name: floor_plan
      label: Floor Plan
      hint: null
      type: select_one
      options:
      - single-story
      - double-story
      - multi-story
      required: false
    - id: 4
      name: attic_size
      label: Attic Size
      hint: null
      type: select_multiple
      options:
      - small
      - medium
      - large
      required: false
    - id: 5
      name: insulation_type
      label: Insulation Type
      hint: null
      type: select_multiple
      options:
      - fiberglass
      - cellulose
      - foam
      required: false
    - id: 6
      name: insulation_condition
      label: Insulation Condition
      hint: null
      type: select_one
      options:
      - satisfactory
      - unsatisfactory
      required: false
    - id: 7
      name: insulation_thickness
      label: Insulation Thickness
      hint: null
      type: select_one
      options:
      - adequate
      - inadequate
      required: false
    - id: 8
      name: electrical_components
      label: Electrical Components
      hint: null
      type: select_multiple
      options:
      - adequate
      - unsatisfactory
      required: false
    - id: 9
      name: electrical_condition
      label: Electrical Condition
      hint: null
      type: select_one
      options:
      - satisfactory
      - unsatisfactory
      required: false
    - id: 10
      name: venting
      label: Venting
      hint: null
      type: select_multiple
      options:
      - adequate
      - inadequate
      required: false
    - id: 11
      name: roof_condition
      label: Roof Condition
      hint: null
      type: select_one
      options:
      - satisfactory
      - unsatisfactory
      required: false
    - id: 12
      name: attic_accessibility
      label: Attic Accessibility
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: additional_notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: inspector_name
      label: Inspector Name
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: inspector_signature
      label: Inspector Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: inspector_date
      label: Inspector Date
      hint: null
      type: date
      options: []
      required: false
    - id: 17
      name: inspector_time
      label: Inspector Time
      hint: null
      type: time
      options: []
      required: false
