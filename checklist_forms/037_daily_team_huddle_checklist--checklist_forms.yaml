inputSchema:
  type: object
  properties:
    title: Daily Team Huddle Checklist
    pages:
    - id: 1
      name: team_member
      label: Team Member
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: attendance
      label: Attendance
      hint: null
      type: select_one
      options:
      - Attended
      - Absent
      - Late
      - On Vacation
      - Working Remotely
      required: false
    - id: 3
      name: notes
      label: Stand-up Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: blockers
      label: Blockers
      hint: null
      type: select_multiple
      options:
      - Technical Blocker
      - Non-Technical Blocker
      required: false
    - id: 5
      name: next_steps
      label: Next Steps
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: blockers_details
      label: Blocker Details
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: progress_updates
      label: Progress Updates
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - User 1
      - User 2
      - User 3
      required: false
