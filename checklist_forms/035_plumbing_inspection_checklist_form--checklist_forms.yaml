      name: plumbing_inspection_checklist
      label: Plumbing Inspection Checklist
      hint: null
      type: select_multiple
      options:
      - Water supply lines
      - Fixture and fixture bases
      - Drainpipes
      - Faucets
      - Drainline
      - Plumbing Fixtures
      - Water Heaters
      - Shower and Bathtub
      - Sinks
      - Toilets
      required: false
    - id: 2
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: inspection_time
      label: Inspection Time
      hint: null
      type: time
      options: []
      required: false
