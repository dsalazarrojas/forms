inputSchema:
  type: object
  properties:
    title: Stormwater Inspection Form
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: stormwater_system
      label: Stormwater System
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 3
      name: system_functioning
      label: System Functioning
      hint: null
      type: select_multiple
      options:
      - System is functioning as expected
      - System is malfunctioning
      - No issues reported
      required: true
    - id: 4
      name: stormwater_system_components
      label: Stormwater System Components
      hint: Please list all system components
      type: select_multiple
      options:
      - Pipes
      - Pumps
      - Valves
      - Motors
      required: true
    - id: 5
      name: inspection_results
      label: Inspection Results
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: recent_damage
      label: Recent Damage
      hint: Yes or No
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: maintenance_planned
      label: Maintenance Planned
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: regulatory_compliance
      label: Regulatory Compliance
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Partially compliant
      required: true
