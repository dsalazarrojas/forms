inputSchema:
  type: object
  properties:
    title: tape_in_hair_extension_placement_checklist
    pages:
    - id: 1
      name: client_info
      label: Client Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: hair_type
      label: hair_type
      hint: null
      type: select_one
      options:
      - Micro Loop
      - Tape in
      - Hair Bond
      required: false
    - id: 3
      name: hair_length
      label: hair_length
      hint: null
      type: select_multiple
      options:
      - Short
      - Medium
      - Long
      required: false
    - id: 4
      name: hair_thickness
      label: hair_thickness
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: tape_in_type
      label: tape_in_type
      hint: null
      type: select_one
      options:
      - Hand-tied
      - Root
      - Micro
      - Stick-Tie
      required: false
    - id: 6
      name: sectioned
      label: sectioned
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: hair_section
      label: hair_section
      hint: null
      type: select_multiple
      options:
      - Back
      - Sides
      - Top
      - Front
      required: false
    - id: 8
      name: hair_length_section
      label: hair_length_section
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
