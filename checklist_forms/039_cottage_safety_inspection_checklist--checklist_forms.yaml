inputSchema:
  type: object
  properties:
    title: Cottage Safety Inspection Checklist
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: electrical
      label: electrical-safety-checks
      hint: null
      type: select_one
      options:
      - No issues with electrical
      - Some issues with electrical
      - Major electrical issues
      required: false
    - id: 3
      name: plumbing
      label: plumbing-safety-checks
      hint: null
      type: select_one
      options:
      - No issues with plumbing
      - Some issues with plumbing
      - Major plumbing issues
      required: false
    - id: 4
      name: fire_safety
      label: Fire safety
      hint: null
      type: select_one
      options:
      - No issues with fire safety
      - Some issues with fire safety
      - Major fire safety issues
      required: false
    - id: 5
      name: heating_cooling
      label: Heating/Cooling
      hint: null
      type: select_one
      options:
      - No issues with heating/cooling
      - Some issues with heating/cooling
      - Major heating/cooling issues
      required: false
    - id: 6
      name: safety_precautions
      label: Safety Precautions
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: emergency_exits
      label: Emergency Exits
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: emergency_exits_adjacent
      label: Emergency exits adjacent
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: fire_extinguishers
      label: Fire Extinguishers
      hint: null
      type: text
      options: []
      required: true
