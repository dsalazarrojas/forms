inputSchema:
  type: object
  properties:
    title: Art Exhibition Setup Checklist Form
    pages:
    - id: 1
      name: setup_event_header
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: exhibition_title
      label: Exhibition Title
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: setup_coordinator_name
      label: Setup Coordinator Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: setup_date_time
      label: Scheduled Setup Date and Time
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: space_preparation_header
      label: -- Space Preparation Checklist --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: walls_cleaned_prepped
      label: Walls cleaned and prepped for hanging
      hint: null
      type: select_one
      options:
      - Complete
      - In Progress
      - N/A
      required: true
    - id: 7
      name: lighting_adjusted
      label: Lighting adjusted for artwork positions
      hint: null
      type: select_one
      options:
      - Complete
      - In Progress
      - N/A
      required: true
    - id: 8
      name: signage_installed
      label: Entrance and directional signage installed
      hint: null
      type: select_one
      options:
      - Complete
      - In Progress
      - N/A
      required: true
    - id: 9
      name: artwork_installation_header
      label: -- Artwork Installation --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: artwork_delivery_verified
      label: All artworks delivered and inspected for damage
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: hanging_hardware_secured
      label: Hanging hardware and mounts secured
      hint: null
      type: select_one
      options:
      - Complete
      - Pending
      required: true
    - id: 12
      name: labels_placed
      label: Artwork labels and descriptions placed correctly
      hint: null
      type: select_one
      options:
      - Complete
      - Pending
      required: true
    - id: 13
      name: leveling_check
      label: All framed works checked for level
      hint: null
      type: select_one
      options:
      - Complete
      - In Progress
      required: true
    - id: 14
      name: pedestal_stability_check
      label: Pedestals and cases stabilized and locked
      hint: For sculptures and 3D works
      type: select_one
      options:
      - Stable
      - Requires Adjustment
      - N/A
      required: true
    - id: 15
      name: administrative_checklist_header
      label: -- Administrative and Safety --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: insurance_inventory_finalized
      label: Insurance inventory list finalized and signed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 17
      name: price_list_available
      label: Price list available at the front desk
      hint: null
      type: select_one
      options:
      - Ready
      - Not Ready
      required: true
    - id: 18
      name: safety_hazards_check
      label: Floor areas cleared of tripping hazards
      hint: null
      type: select_one
      options:
      - Clear
      - Attention Needed
      required: true
    - id: 19
      name: additional_setup_notes
      label: Additional Setup Observations or Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: checklist_completion_signature
      label: Setup Approved By (Signature)
      hint: null
      type: text
      options: []
      required: true
    - id: 21
      name: completion_timestamp
      label: Time of Completion
      hint: null
      type: time
      options: []
      required: true
