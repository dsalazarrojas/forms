inputSchema:
  type: object
  properties:
    title: Pre Loading Checklist Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: loading_status
      label: Loading Status
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: confirm_loaded
      label: Confirm Loaded
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Applicable
      required: false
    - id: 4
      name: confirm_all_loaded
      label: Confirm All Loaded
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Not Applicable
      - Not Loaded
      required: false
    - id: 5
      name: date_loaded
      label: Date Loaded
      hint: null
      type: date
      options: []
      required: false
