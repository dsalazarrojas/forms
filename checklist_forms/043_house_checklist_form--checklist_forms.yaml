inputSchema:
  type: object
  properties:
    title: House Checklist Form
    pages:
    - id: 1
      name: house_status
      label: House Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 2
      name: systems_workability
      label: Systems Workability
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: basic_systems_engine_status
      label: Basic Systems & Engine Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
    - id: 4
      name: service_requirements
      label: Service Requirements
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: exterior_info
      label: Exterior Information
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: security
      label: Security
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
