    - id: 24
      name: interior_notes
      label: Interior Notes
      hint: Comments on interior
      type: text
      options: []
      required: false
    - id: 25
      name: fire_safety_check
      label: Fire Safety Inspection
      hint: Condition of fire safety
      type: select_one
      options:
      - Pass
      - Fail
      - Needs Repair
      - Not Assessed
      required: true
    - id: 26
      name: fire_safety_notes
      label: Fire Safety Notes
      hint: Comments on fire safety
      type: text
      options: []
