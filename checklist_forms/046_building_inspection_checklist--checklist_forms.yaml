inputSchema:
  type: object
  properties:
    title: Building Inspection Checklist
    pages:
    - id: 1
      name: inspector_name
      label: Inspector Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: company
      label: Company
      hint: Inspection company
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: inspection_date
      label: Inspection Date
      hint: Date of inspection
      type: date
      options: []
      required: true
    - id: 6
      name: building_name
      label: Building Name
      hint: Name of building
      type: text
      options: []
      required: true
    - id: 7
      name: building_address
      label: Building Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 8
      name: property_type
      label: Property Type
      hint: Classification
      type: select_one
      options:
      - Single Family Home
      - Multi Family
      - Commercial
      - Industrial
      - Mixed Use
      - Other
      required: true
    - id: 9
      name: year_built
      label: Year Built
      hint: Construction year
      type: number
      options: []
      required: false
    - id: 10
      name: weather_conditions
      label: Weather Conditions
      hint: During inspection
      type: select_one
      options:
      - Clear/Sunny
      - Cloudy
      - Rainy
      - Snowy
      - Windy
      - Other
      required: false
    - id: 11
      name: exterior_check
      label: Exterior Inspection
      hint: Condition of exterior
      type: select_one
      options:
      - Pass
      - Fail
      - Needs Repair
      - Not Accessible
      required: true
    - id: 12
      name: exterior_notes
      label: Exterior Notes
      hint: Comments on exterior
      type: text
      options: []
      required: false
    - id: 13
