      - Pass
      - Fail
      - Needs Repair
      - Not Assessed
      required: true
    - id: 18
      name: plumbing_notes
      label: Plumbing Notes
      hint: Comments on plumbing
      type: text
      options: []
      required: false
    - id: 19
      name: electrical_check
