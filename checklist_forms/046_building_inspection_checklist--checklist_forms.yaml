      hint: Describe significant issues
      type: text
      options: []
      required: false
    - id: 30
      name: recommendations
      label: Recommendations
      hint: Suggested actions
      type: text
      options: []
      required: false
    - id: 31
      name: overall_result
      label: Overall Inspection Result
      hint: Final assessment
      type: select_one
      options:
      - Pass - No Issues
      - Pass with Minor Issues
      - Conditional Pass
      - Fail - Major Issues
      required: true
    - id: 32
      name: inspector_signature
      label: Inspector Certification
      hint: I certify this inspection is accurate
      type: select_one
      options:
      - Yes - I Certify
      - false
      required: true
