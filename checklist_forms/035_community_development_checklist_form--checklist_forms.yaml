inputSchema:
  type: object
  properties:
    title: Development Checklist Form
    pages:
    - id: 1
      name: project_name
      label: Project name
      hint: Title of development project
      type: text
      options: []
      required: true
    - id: 2
      name: project_lead
      label: Project lead name
      hint: Primary contact for the project
      type: text
      options: []
      required: true
    - id: 3
      name: planning_documents_submitted
      label: Planning documents submitted
      hint: Confirm submission of key documents
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: environmental_review_complete
      label: Environmental review complete
      hint: Has environmental review been completed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: community_engagement_done
      label: Community engagement done
      hint: Has engagement with stakeholders occurred
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: finance_plan_ready
      label: Finance plan ready
      hint: Are funding sources confirmed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: checklist_notes
      label: Checklist notes and next steps
      hint: Any open items or comments
      type: text
      options: []
      required: false
