inputSchema:
  type: object
  properties:
    title: Healthy Relationship Checklist
    pages:
    - id: 1
      name: relationship_survey
      label: Relationship Survey
      hint: null
      type: select_one
      options:
      - Partnership
      - Friendship
      - Family Members
      required: true
    - id: 2
      name: communication
      label: How do you communicate with your partner?
      hint: Please describe your communication style
      type: text
      options: []
      required: true
    - id: 3
      name: intimacy_level
      label: What is your level of physical intimacy?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: conflict_resolution
      label: How do you resolve conflicts?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Applicable
      required: true
    - id: 5
      name: emotional_maturity
      label: What is your partner's emotional maturity level?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: conflict_resolution_options
      label: What are some strategies you use to resolve conflicts?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: relationship_strength
      label: What is the strength of your relationship?
      hint: null
      type: select_one
      options:
      - Strong
      - Medium
      - Weak
      required: true
