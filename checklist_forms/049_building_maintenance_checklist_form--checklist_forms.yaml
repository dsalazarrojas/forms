inputSchema:
  type: object
  properties:
    title: Building Maintenance Checklist Form
    pages:
    - id: 1
      name: inspector_name
      label: Inspector Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: company
      label: Company
      hint: Maintenance company
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: inspection_date
      label: Inspection Date
      hint: Date of inspection
      type: date
      options: []
      required: true
    - id: 6
      name: building_name
      label: Building Name
      hint: Name of building
      type: text
      options: []
      required: true
    - id: 7
      name: building_address
      label: Building Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 8
      name: maintenance_type
      label: Maintenance Type
      hint: Type of maintenance
      type: select_one
      options:
      - Routine Maintenance
      - Preventive Maintenance
      - Seasonal Maintenance
      - Post-Event Inspection
      - Tenant Turnover
      - Emergency Follow-up
      - Annual Inspection
      required: true
    - id: 9
      name: exterior_maintenance
      label: Exterior Maintenance
      hint: Condition and needs
      type: select_one
      options:
      - Good - No Action
      - Fair - Minor Work
      - Poor - Major Work
      - Critical - Immediate
      required: true
    - id: 10
      name: exterior_tasks
      label: Exterior Tasks
      hint: Select completed tasks
      type: select_multiple
      options:
      - None
      - Pressure Washing
      - Window Cleaning
      - Gutter Cleaning
      - Landscape Maintenance
      - Parking Lot Repair
      - Fence/Gate Repair
      - Signage Maintenance
      required: true
    - id: 11
      name: roof_maintenance
      label: Roof Maintenance
      hint: Condition and needs
      type: select_one
      options:
      - Good - No Action
      - Fair - Minor Work
      - Poor - Major Work
      - Critical - Immediate
      required: true
    - id: 12
      name: roof_tasks
      label: Roof Tasks
      hint: Select completed tasks
      type: select_multiple
      options:
      - None
      - Debris Removal
      - Drain Cleaning
      - Leak Repair
      - Shingle Repair
      - Flashing Repair
      - Inspection Only
      required: true
    - id: 13
      name: plumbing_maintenance
      label: Plumbing Maintenance
      hint: Condition and needs
      type: select_one
      options:
      - Good - No Action
      - Fair - Minor Work
      - Poor - Major Work
      - Critical - Immediate
      required: true
    - id: 14
      name: plumbing_tasks
      label: Plumbing Tasks
      hint: Select completed tasks
      type: select_multiple
      options:
      - None
      - Leak Repair
      - Drain Cleaning
      - Fixture Repair
      - Water Heater Service
      - Pipe Insulation
      - Backflow Testing
      required: true
    - id: 15
      name: electrical_maintenance
      label: Electrical Maintenance
      hint: Condition and needs
      type: select_one
      options:
      - Good - No Action
      - Fair - Minor Work
      - Poor - Major Work
      - Critical - Immediate
      required: true
    - id: 16
      name: electrical_tasks
      label: Electrical Tasks
      hint: Select completed tasks
      type: select_multiple
      options:
      - None
      - Light Bulb Replacement
      - Fixture Repair
      - Panel Inspection
      - Outlet Repair
      - Wiring Repair
      - Emergency Light Test
      required: true
    - id: 17
      name: hvac_maintenance
      label: HVAC Maintenance
      hint: Condition and needs
      type: select_one
      options:
      - Good - No Action
      - Fair - Minor Work
      - Poor - Major Work
      - Critical - Immediate
      required: true
    - id: 18
      name: hvac_tasks
      label: HVAC Tasks
      hint: Select completed tasks
      type: select_multiple
      options:
      - None
      - Filter Replacement
      - Duct Cleaning
      - System Tune-up
      - Thermostat Calibration
      - Coil Cleaning
      - Refrigerant Check
      required: true
    - id: 19
      name: interior_maintenance
      label: Interior Maintenance
      hint: Condition and needs
      type: select_one
      options:
      - Good - No Action
      - Fair - Minor Work
      - Poor - Major Work
      - Critical - Immediate
      required: true
    - id: 20
      name: interior_tasks
      label: Interior Tasks
      hint: Select completed tasks
      type: select_multiple
      options:
      - None
      - Painting
      - Flooring Repair
      - Wall Repair
      - Door/Hardware Repair
      - Ceiling Repair
      - Cleaning
      required: true
    - id: 21
      name: fire_safety_maintenance
      label: Fire Safety Maintenance
      hint: Condition and needs
      type: select_one
      options:
      - Good - No Action
      - Fair - Minor Work
      - Poor - Major Work
      - Critical - Immediate
      required: true
    - id: 22
      name: fire_safety_tasks
      label: Fire Safety Tasks
      hint: Select completed tasks
      type: select_multiple
      options:
      - None
      - Extinguisher Inspection
      - Alarm Testing
      - Sprinkler Inspection
      - Exit Sign Check
      - Emergency Light Test
      - Drill Conducted
      required: true
    - id: 23
      name: safety_hazards
      label: Safety Hazards Found
      hint: Describe any hazards
      type: text
      options: []
      required: false
    - id: 24
      name: repairs_needed
      label: Repairs Needed
      hint: List required repairs
      type: text
      options: []
      required: false
    - id: 25
      name: priority_repairs
      label: Priority Repairs
      hint: Urgent repairs
      type: text
      options: []
      required: false
    - id: 26
      name: estimated_cost
      label: Estimated Cost
      hint: For recommended work
      type: select_one
      options:
      - Under $1,000
      - $1,000 - $5,000
      - $5,000 - $10,000
      - $10,000 - $25,000
      - Over $25,000
      required: false
    - id: 27
      name: follow_up_needed
      label: Follow-up Needed
      hint: Is re-inspection needed
      type: select_one
      options:
      - Yes - Within 1 Week
      - Yes - Within 1 Month
      - Yes - Within 3 Months
      - No - All Complete
      required: true
    - id: 28
      name: overall_condition
      label: Overall Building Condition
      hint: Final assessment
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Critical
      required: true
    - id: 29
      name: inspector_signature
      label: Inspector Certification
      hint: I certify this checklist is complete
      type: select_one
      options:
      - Yes - I Certify
      - false
      required: true
