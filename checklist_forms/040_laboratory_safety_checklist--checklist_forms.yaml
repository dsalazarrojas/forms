inputSchema:
  type: object
  properties:
    title: Laboratory Safety Checklist
    pages:
    - id: 1
      name: lab_inspection
      label: Lab Inspection
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: equipment_maintenance
      label: Equipment Maintenance
      hint: Check for worn-out or broken equipment.
      type: select_one
      options:
      - Regularly
      - Occasionally
      - Rarely
      - Never
      required: false
    - id: 3
      name: electrical_hazards
      label: Electrical Hazards
      hint: Check for exposed wiring, frayed cords, etc.
      type: select_multiple
      options:
      - Check for frayed cords
      - Check for loose connections
      - Check for exposed wiring
      required: false
    - id: 4
      name: chemical_hazards
      label: Chemical Hazards
      hint: Check for spills, leaks, and proper storage of chemicals.
      type: select_one
      options:
      - Present
      - Absent
      required: false
    - id: 5
      name: fire_hazards
      label: Fire Hazards
      hint: Check for fire extinguishers, fire alarms, etc.
      type: select_multiple
      options:
      - Present
      - Absent
      required: false
    - id: 6
      name: chemical_stores
      label: Chemical Stores
      hint: Check for proper storage and labeling.
      type: select_multiple
      options:
      - Present
      - Absent
      required: false
    - id: 7
      name: chemical_labels
      label: Chemical Labels
      hint: Check for proper labeling of chemical bottles.
      type: select_multiple
      options:
      - Present
      - Absent
      required: false
    - id: 8
      name: fire_supervision
      label: Fire Supervision
      hint: Check for fire alarm and fire drills.
      type: select_one
      options:
      - Regularly
      - Occasionally
      - Rarely
      - Never
      required: false
    - id: 9
      name: emergency_exit_routes
      label: Emergency Exit Routes
      hint: Check for clear exit signs and emergency exits.
      type: select_one
      options:
      - Present
      - Absent
      required: false
    - id: 10
      name: emergency_exit_lights
      label: Emergency Exit Lights
      hint: Check for working exit lights.
      type: select_one
      options:
      - Present
      - Absent
      required: false
    - id: 11
      name: safety_shoes
      label: Safety Shoes
      hint: Check for proper use of safety shoes.
      type: select_one
      options:
      - Required
      - Recommended
      - Not Required
      required: false
    - id: 12
      name: lab_insurance
      label: Lab Insurance
      hint: Check for lab insurance and coverage.
      type: select_one
      options:
      - Present
      - Absent
      required: false
    - id: 13
      name: lab_equipment
      label: Lab Equipment
      hint: Check for proper maintenance and functioning of lab equipment.
      type: select_multiple
      options:
      - Present
      - Absent
      required: false
    - id: 14
      name: lab_safety_signs
      label: Lab Safety Signs
      hint: Check for proper lab signs and postings.
      type: select_multiple
      options:
      - Present
      - Absent
      required: false
