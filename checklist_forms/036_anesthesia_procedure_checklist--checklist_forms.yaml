inputSchema:
  type: object
  properties:
    title: Anesthesia Procedure Checklist
    pages:
    - id: 1
      name: section_preprocedure
      label: -- Pre procedure Checks --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_id
      label: Patient ID
      hint: Hospital or chart number
      type: text
      options: []
      required: true
    - id: 3
      name: procedure_time
      label: Procedure time
      hint: Scheduled time
      type: time
      options: []
      required: true
    - id: 4
      name: airway_equipment_ready
      label: Airway equipment ready
      hint: Check availability
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: medication_prepared
      label: Medications prepared
      hint: Confirm medications drawn up
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: iv_access
      label: IV access established
      hint: Confirm IV access is present
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: equipment_notes
      label: Equipment notes
      hint: Any additional notes
      type: text
      options: []
      required: false
    - id: 8
      name: checklist_completed_by
      label: Checklist completed by
      hint: Name of staff completing checklist
      type: text
      options: []
      required: true
