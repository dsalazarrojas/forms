inputSchema:
  type: object
  properties:
    title: Beginner Swimming Skills Checklist
    pages:
    - id: 1
      name: section_student_instructor_info
      label: -- Student and Instructor Info --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: lesson_level_name
      label: Lesson Level / Class Name
      hint: e.g. Starfish, Level 1, Beginner 1
      type: text
      options: []
      required: true
    - id: 5
      name: evaluation_date
      label: Date of Evaluation
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: section_water_confidence
      label: -- Water Confidence and Safety --
      hint: Check if skill is mastered
      type: note
      options: []
      required: false
    - id: 7
      name: skill_enter_water_independently
      label: Enters water independently and safely
      hint: null
      type: select_one
      options:
      - Mastered
      - In Progress
      - Not Attempted
      required: true
    - id: 8
      name: skill_bubbles_blowing
      label: Blows bubbles through mouth and nose
      hint: null
      type: select_one
      options:
      - Mastered
      - In Progress
      - Not Attempted
      required: true
    - id: 9
      name: skill_submerge_face
      label: Submerges face in water for 3 seconds
      hint: null
      type: select_one
      options:
      - Mastered
      - In Progress
      - Not Attempted
      required: true
    - id: 10
      name: section_basic_movements
      label: -- Basic Body Movements --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: skill_front_float_supported
      label: Front float (with support)
      hint: null
      type: select_one
      options:
      - Mastered
      - In Progress
      - Not Attempted
      required: true
    - id: 12
      name: skill_back_float_supported
      label: Back float (with support)
      hint: null
      type: select_one
      options:
      - Mastered
      - In Progress
      - Not Attempted
      required: true
    - id: 13
      name: skill_flutter_kick_wall
      label: Flutter kick while holding the wall
      hint: null
      type: select_one
      options:
      - Mastered
      - In Progress
      - Not Attempted
      required: true
    - id: 14
      name: skill_arm_paddling_action
      label: Basic arm paddling action
      hint: null
      type: select_one
      options:
      - Mastered
      - In Progress
      - Not Attempted
      required: true
    - id: 15
      name: section_progression_notes
      label: -- Instructor Observations --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: water_confidence_rating
      label: Overall Water Confidence Level
      hint: 1 low, 5 high
      type: number
      options: []
      required: true
    - id: 17
      name: skills_to_focus_on_next
      label: Key skills to focus on in next lessons
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: recommendation_for_next_level
      label: Recommended for progression to next level?
      hint: null
      type: select_one
      options:
      - 'True'
      - Needs more practice at current level
      required: true
    - id: 19
      name: instructor_comments_detailed
      label: Additional Progress Notes
      hint: null
      type: text
      options: []
      required: false
