      options: []
      required: false
    - id: 12
      name: time_inspected
      label: time_inspected
      hint: null
      type: time
      options: []
      required: false
    - id: 13
      name: vehicle_id
      label: vehicle_id
      hint: null
      type: text
      options: []
      required: false
