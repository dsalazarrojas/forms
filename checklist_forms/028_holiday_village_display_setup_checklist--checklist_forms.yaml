inputSchema:
  type: object
  properties:
    title: HOLIDAY VILLAGE DISPLAY SETUP CHECKLIST
    pages:
    - id: 1
      name: holiday_village_display_setup_checklist_page
      label: Holiday Village Display Setup Checklist
      hint: Check each section carefully to ensure the display is ready for holiday
        season.
      type: note
      options: []
      required: false
    - id: 2
      name: installation_details
      label: What is the installation location?
      hint: Please enter the specific location of the holiday village display.
      type: text
      options: []
      required: true
    - id: 3
      name: installation_location
      label: Installation Location
      hint: Choose the correct location for the holiday village display.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: safety_check_list
      label: Is there a safety check list available?
      hint: Check if the holiday village display has a safety check list.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: safety_check_result
      label: What is the safety check result?
      hint: Please enter the result of the safety check.
      type: text
      options: []
      required: true
    - id: 6
      name: display_type
      label: What is the display type?
      hint: Choose the correct display type for the holiday village display.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: display_location
      label: What is the display location?
      hint: Enter the specific location of the display.
      type: text
      options: []
      required: true
    - id: 8
      name: maintenance_check_list
      label: Is there a maintenance check list?
      hint: Check if the holiday village display has a maintenance check list.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: display_details
      label: What are the display details?
      hint: Please enter the details of the holiday village display.
      type: text
      options: []
      required: true
    - id: 10
      name: safety_check
      label: Are there any issues with the safety checks?
      hint: Check if there are any issues with the safety checks.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: display_type_2
      label: Is the display type correct?
      hint: Check if the display type is correct.
      type: select_one
      options:
