inputSchema:
  type: object
  properties:
    title: Cabinet Cleaning Checklist
    pages:
    - id: 1
      name: inspection_info_header
      label: -- Property and Staff Information --
      hint: Daily/Weekly Cabinet Maintenance Checklist
      type: note
      options: []
      required: false
    - id: 2
      name: property_address
      label: Property or Facility Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: cleaner_name
      label: Cleaning Staff Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: inspection_date
      label: Date of Cleaning
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: cabinet_location
      label: Room or Location of Cabinets
      hint: e.g. Kitchen, Lab A, Office 201
      type: select_one
      options:
      - Kitchen
      - Breakroom
      - Laboratory
      - Patient Room
      - Staff Office
      - Other
      required: true
    - id: 6
      name: exterior_cleaning_header
      label: -- Exterior Cleaning Tasks --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: dust_tops
      label: Dust and wipe cabinet tops
      hint: null
      type: select_one
      options:
      - Done
      - N/A
      required: true
    - id: 8
      name: wipe_doors
      label: Wipe down door surfaces and frames
      hint: check for fingerprints and stains
      type: select_one
      options:
      - Done
      - N/A
      required: true
    - id: 9
      name: polish_hardware
      label: Clean and polish handles/knobs
      hint: null
      type: select_one
      options:
      - Done
      - N/A
      required: true
    - id: 10
      name: kickplate_cleaning
      label: Wipe kickplates and baseboards
      hint: null
      type: select_one
      options:
      - Done
      - N/A
      required: true
    - id: 11
      name: interior_cleaning_header
      label: -- Interior Cleaning Tasks --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: empty_shelves
      label: Shelves emptied and wiped
      hint: null
      type: select_one
      options:
      - Done
      - Partial
      - N/A
      required: true
    - id: 13
      name: sanitize_surfaces
      label: Sanitize interior surfaces
      hint: using approved cleaning agent
      type: select_one
      options:
      - Done
      - N/A
      required: true
    - id: 14
      name: organize_contents
      label: Contents neatly organized upon return
      hint: null
      type: select_one
      options:
      - Done
      - N/A
      required: true
    - id: 15
      name: inspection_notes_header
      label: -- Maintenance Reporting --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: loose_hinges
      label: Are there any loose hinges or hardware
      hint: null
      type: select_one
      options:
      - None
      - Yes - Minor
      - Yes - Repair Needed
      required: true
    - id: 17
      name: visible_damage
      label: Report any visible chips or water damage
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: pest_activity
      label: Any signs of pest activity inside cabinets
      hint: null
      type: select_one
      options:
      - 'False'
      - Yes - Needs immediate attention
      required: true
    - id: 19
      name: additional_comments
      label: General Cleaning Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: completion_time
      label: Time of Completion
      hint: null
      type: time
      options: []
      required: true
