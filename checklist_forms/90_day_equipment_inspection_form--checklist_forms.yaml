inputSchema:
  type: object
  properties:
    title: 90 Day Equipment Inspection Form
    pages:
    - id: 1
      name: section_header_equipment_info
      label: "--- Equipment & Inspection Details ---"
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: inspector_name
      label: Inspector name
      hint: Print full name
      type: text
      options: []
      required: true
    - id: 3
      name: equipment_id
      label: Equipment ID or serial number
      hint: Asset tag or VIN
      type: text
      options: []
      required: true
    - id: 4
      name: equipment_type
      label: Equipment type
      hint: Choose the best match
      type: select_one
      options:
        - Truck / Vehicle
        - Generator
        - Heavy machinery / Excavator
        - Forklift
        - Trailer
        - Other
      required: true
    - id: 5
      name: inspection_date
      label: Inspection date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: operating_hours_or_odometer
      label: Operating hours / Odometer reading
      hint: Hours or miles at time of inspection
      type: decimal
      options: []
      required: false
    - id: 7
      name: visual_condition
      label: Visual condition assessment
      hint: "Quick external checks: dents, corrosion"
      type: select_one
      options:
        - Good
        - Fair
        - Poor
      required: true
    - id: 8
      name: safety_equipment_present
      label: Safety equipment present and functional
      hint: Select all that apply
      type: select_multiple
      options:
        - Fire extinguisher
        - First aid kit
        - Warning lights / beacons
        - Seat belts / restraints
        - Safety guards
        - None
      required: true
    - id: 9
      name: lubrication_and_fluid_check
      label: Lubrication and fluid levels check
      hint: Pass = within recommended range
      type: select_one
      options:
        - Pass
        - Fail
      required: true
    - id: 10
      name: electrical_system_check
      label: Electrical system functional check
      hint: Battery, wiring, lights
      type: select_one
      options:
        - Pass
        - Fail
      required: true
    - id: 11
      name: tires_and_brakes
      label: Tires and brakes condition
      hint: Tread, pressure, brake response
      type: select_one
      options:
        - Good
        - Needs attention
        - Immediate repair required
      required: true
    - id: 12
      name: hydraulic_leaks_checked
      label: Hydraulic leaks observed
      hint: null
      type: select_one
      options:
        - No leaks detected
        - Minor leaks
        - Significant leaks
      required: true
    - id: 13
      name: operational_test
      label: Operational test result
      hint: Engine/startup and basic functions
      type: select_one
      options:
        - Operates normally
        - Intermittent issues
        - Fails to operate
      required: true
    - id: 14
      name: defects_found
      label: Defects or issues found (select all)
      hint: List observed defects; leave blank if none
      type: select_multiple
      options:
        - Fluid leak
        - Damaged hose or belt
        - Electrical fault
        - Brake issue
        - Structural damage
        - None
      required: false
    - id: 15
      name: inspector_notes
      label: Inspector notes and recommended actions
      hint: Describe any repairs, parts needed, or restrictions
      type: text
      options: []
      required: false
    - id: 16
      name: next_inspection_date
      label: Recommended next inspection date
      hint: null
      type: date
      options: []
      required: false
    - id: 17
      name: inspector_signature
      label: Inspector signature (type name)
      hint: Typing name constitutes electronic signature
      type: text
      options: []
      required: true
