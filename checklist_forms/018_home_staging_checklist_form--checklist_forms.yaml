inputSchema:
  type: object
  properties:
    title: Home Staging Checklist Form
    pages:
    - id: 1
      name: main_section_1
      label: Staging Tasks
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: room_types
      label: Room Types
      hint: null
      type: select_one
      options:
      - Kitchen
      - Living Room
      - Bathroom
      - Bedroom
      - Office
      - Outdoor
      - Laundry
      - Utility Room
      - Other
      required: false
