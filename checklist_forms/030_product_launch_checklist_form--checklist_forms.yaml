inputSchema:
  type: object
  properties:
    title: Product Launch Checklist Form
    pages:
    - id: 1
      name: product_launch_checklist
      label: Product Launch Checklist
      hint: null
      type: note
      options: []
      required: true
    - id: 2
      name: product_launch_status
      label: Product Launch Status
      hint: null
      type: select_one
      options:
      - Launched
      - In Development
      - Cancelled
      required: true
    - id: 3
      name: product_launch_date
      label: Product Launch Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: product_launch_time
      label: Product Launch Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: product_launch_responsible
      label: Product Launch Responsible
      hint: null
      type: select_multiple
      options:
      - John Doe
      - Jane Doe
      required: true
    - id: 6
      name: launch_notes
      label: Launch Notes
      hint: null
      type: note
      options: []
      required: false
