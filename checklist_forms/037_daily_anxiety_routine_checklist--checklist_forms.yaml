inputSchema:
  type: object
  properties:
    title: Daily Anxiety Routine Checklist
    pages:
    - id: 1
      name: daily_anxiety_routine_checklist
      label: anxiety_routine_checklist
      hint: null
      type: select_one
      options:
      - Anxious
      - Calm
      - Very anxious
      - Not anxious
      required: true
    - id: 2
      name: coping_strategies
      label: coping_strategies
      hint: What are some strategies you use to cope with anxiety?
      type: text
      options: []
      required: true
    - id: 3
      name: current_mood
      label: current_mood
      hint: null
      type: select_multiple
      options:
      - Happy
      - Sad
      - Angry
      - Frustrated
      - Bored
      - Other
      required: false
    - id: 4
      name: anxiety_triggers
      label: anxiety_triggers
      hint: What triggers your anxiety?
      type: select_multiple
      options:
      - Family
      - School
      - Work
      - Finances
      - Relationships
      - Health
      - Other
      required: false
    - id: 5
      name: sleep_quality
      label: sleep_quality
      hint: How good is your sleep quality?
      type: select_one
      options:
      - 1-2 hours - 2-3 hours - 3-4 hours - 4-5 hours - 5-6 hours - 6-7 hours - 7-8
        hours - More than 8 hours
      - Other
      required: true
    - id: 6
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: time
      label: time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: note
      label: note
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: category
      label: category
      hint: What category does this entry fall under?
      type: select_multiple
      options:
      - Anxiety - Mental Health - Physical Health - Work - Relationships - Other
      - Other
      required: true
    - id: 12
      name: submitted_by
      label: submitted_by
      hint: null
      type: select_one
      options:
      - You
      - Someone else
      required: false
    - id: 13
      name: submitted_date
      label: submitted_date
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: submitted_time
      label: submitted_time
      hint: null
      type: time
      options: []
      required: false
