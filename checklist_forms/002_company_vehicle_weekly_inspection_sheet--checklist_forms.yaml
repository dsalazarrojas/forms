inputSchema:
  type: object
  properties:
    title: Company Vehicle Weekly Inspection Sheet
    pages:
    - id: 1
      name: inspection_header
      label: -- Weekly Inspection Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: inspector_name
      label: inspector name
      hint: name of person performing inspection
      type: text
      options: []
      required: true
    - id: 3
      name: vehicle_plate
      label: vehicle plate or id
      hint: fleet id or license plate
      type: text
      options: []
      required: true
    - id: 4
      name: inspection_date
      label: inspection date
      hint: date of weekly check
      type: date
      options: []
      required: true
    - id: 5
      name: tire_condition
      label: tire condition
      hint: choose best match
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: brakes_functional
      label: brakes functional
      hint: visual and functional check
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: lights_working
      label: lights working
      hint: headlights tail lights indicators
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: fluid_levels
      label: fluid levels
      hint: oil coolant brake fluid windshield washer
      type: select_one
      options:
      - Acceptable
      - Low
      - Needs attention
      required: true
    - id: 9
      name: additional_remarks
      label: additional remarks
      hint: describe issues or maintenance required
      type: text
      options: []
      required: false
    - id: 10
      name: inspector_signature
      label: inspector printed name for record
      hint: not an image signature field
      type: text
      options: []
      required: true
