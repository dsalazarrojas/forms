      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: pre_inspection_items_2
      label: More Pre-Inspection Items
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: equipment_status
      label: Equipment Status
      hint: null
      type: select_one
      options:
