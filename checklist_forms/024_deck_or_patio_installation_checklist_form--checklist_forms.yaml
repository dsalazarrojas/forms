inputSchema:
  type: object
  properties:
    title: Deck Or Patio Installation Checklist Form
    pages:
    - id: 1
      name: contractor_license
      label: Contractor License
      hint: null
      type: select_one
      options:
      - Contractor License Number
      - Other
      required: false
    - id: 2
      name: contractor_experience
      label: Contractor Experience
      hint: null
      type: select_multiple
      options:
      - 1-5 years
      - 5-10 years
      - More than 10 years
      required: false
    - id: 3
      name: insurance_coverage
      label: Insurance Coverage
      hint: null
      type: select_multiple
      options:
      - Liability
      - Workers Compensation
      - Property Damage
      required: false
    - id: 4
      name: site_access
      label: Site Access
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: site_clearance
      label: Site Clearance
      hint: null
      type: select_multiple
      options:
      - Required
      - Recommended
      - Not Required
      required: false
    - id: 6
