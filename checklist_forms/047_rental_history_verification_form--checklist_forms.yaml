inputSchema:
  type: object
  properties:
    title: Rental History Verification Form
    pages:
    - id: 1
      name: applicant_info
      label: Applicant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rental_history
      label: Rental History
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: employment_info
      label: Employment Information
      hint: Check if applicant is employed
      type: select_multiple
      options:
      - Full-time
      - Part-time
      - Contract
      required: false
    - id: 4
      name: rental_info_1
      label: Rental Info 1
      hint: null
      type: select_one
      options:
      - 12 months
      - 24 months
      - 36 months
      required: false
    - id: 5
      name: rental_info_2
      label: Rental Info 2
      hint: null
      type: select_one
      options:
      - 1 month
      - 2 months
      required: false
    - id: 6
      name: property_details
      label: Property Details
      hint: Check if applicant owns property
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: rental_agreement
      label: Rental Agreement
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: lease_term
      label: Lease Term
      hint: null
      type: select_one
      options:
      - Month-to-Month
      - 6 Months
      - 12 Months
      required: false
