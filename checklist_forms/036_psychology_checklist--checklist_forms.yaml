inputSchema:
  type: object
  properties:
    title: Psychology Checklist
    pages:
    - id: 1
      name: introduction
      label: Psychology Checklist
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: assessment
      label: Assessment
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: diagnosis
      label: Diagnosis
      hint: null
      type: select_one
