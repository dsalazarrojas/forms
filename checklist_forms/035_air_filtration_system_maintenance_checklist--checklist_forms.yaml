inputSchema:
  type: object
  properties:
    title: Air Filtration System Maintenance Checklist
    pages:
    - id: 1
      name: maintenance_info_header
      label: -- Maintenance Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: tech_name
      label: Technician Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date
      label: Date of Service
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: unit_id
      label: Unit ID
      hint: Tag number on the unit
      type: text
      options: []
      required: true
    - id: 5
      name: filter_check_header
      label: -- Filter Check --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: filter_status
      label: Filter Status (Visual)
      hint: Condition of main filters
      type: select_one
      options:
      - Clean
      - Slightly Dirty
      - Dirty
      - Clogged / Replace Immediately
      required: true
    - id: 7
      name: pre_filter_changed
      label: Pre-Filter Changed?
      hint: Disposable layer
      type: select_one
      options:
      - 'True'
      - 'False'
      - N/A
      required: true
    - id: 8
      name: hepa_filter_changed
      label: HEPA/Main Filter Changed?
      hint: Long-term filter
      type: select_one
      options:
      - 'True'
      - 'False'
      - N/A
      required: true
    - id: 9
      name: performance_header
      label: -- Performance Data --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: airflow_reading
      label: Airflow Reading (CFM)
      hint: Cubic Feet per Minute
      type: number
      options: []
      required: true
    - id: 11
      name: motor_amps
      label: Motor Amperage Draw
      hint: Current load
      type: number
      options: []
      required: true
    - id: 12
      name: fan_belt
      label: Fan Belt Tension
      hint: If belt driven
      type: select_one
      options:
      - OK
      - Adjusted
      - Replaced
      - N/A (Direct Drive)
      required: true
    - id: 13
      name: housing_cleaned
      label: Housing Cleaned?
      hint: Interior wiped down
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: next_service
      label: Next Service Due Date
      hint: Schedule follow-up
      type: date
      options: []
      required: true
