inputSchema:
  type: object
  properties:
    title: Personal Cyber Security Checklist
    pages:
    - id: 1
      name: user_information
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: password_strength
      label: Password Strength
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: security_question
      label: Security Question
      hint: null
      type: select_one
      options:
      - Is your password more than 12 characters long?
      - Do you use a password manager?
      - Are you using a strong password?
      required: false
    - id: 4
      name: two_factor
      label: Two-Factor
      hint: null
      type: select_multiple
      options:
      - SMS/Text Message
      - U2F (Universal 2nd Factor)
      - Smart Card
      - Other
      required: false
    - id: 5
      name: sensitive_data
      label: Sensitive Data
      hint: null
      type: select_multiple
      options:
      - Bank/Financial Information
      - Personal Address
      - Social Security Number
      - Date of Birth
      - Other
      required: false
    - id: 6
      name: security_questions
      label: Security Questions
      hint: null
      type: select_multiple
      options:
      - Is a friend or family member able to access your account?
      - Have you ever had your account compromised?
      - Have you ever used your account for work or business purposes?
      - Have you ever received a suspicious email related to your account?
      - Other
      required: false
    - id: 7
      name: account_activity
      label: Account Activity
      hint: null
      type: time
      options: []
      required: false
