      - U2F (Universal 2nd Factor)
      - Smart Card
      - Other
      required: false
    - id: 10
      name: sensitive_data_backup
      label: Sensitive Data Backup
      hint: null
      type: select_multiple
      options:
      - Bank/Financial Information
      - Personal Address
      - Social Security Number
      - Date of Birth
      - Other
      required: false
    - id: 11
      name: account_recovery
      label: Account Recovery
      hint: null
      type: select_one
      options:
