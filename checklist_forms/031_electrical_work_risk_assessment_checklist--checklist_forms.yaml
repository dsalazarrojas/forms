inputSchema:
  type: object
  properties:
    title: Electrical Work Risk Assessment Checklist
    pages:
    - id: 1
      name: electrical_work_risk_assessment_1
      label: Is the electrical work area free from overhead hazards?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 2
      name: electrical_work_risk_assessment_2
      label: Is the work area clear from debris and tripping hazards?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 3
      name: electrical_work_risk_assessment_3
      label: Are all electrical cables and wires properly secured and labeled?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: electrical_work_risk_assessment_4
      label: Is there a fire alarm system in place in the work area?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: electrical_work_risk_assessment_5
      label: Is there a risk assessment plan in place for the work area?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: electrical_work_risk_assessment_6
      label: What is the highest risk level for the entire project?
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 7
      name: electrical_work_risk_assessment_7
      label: Risk Level
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: electrical_work_risk_assessment_8
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: electrical_work_risk_assessment_9
      label: Time of Assessment
      hint: null
      type: time
      options: []
      required: true
