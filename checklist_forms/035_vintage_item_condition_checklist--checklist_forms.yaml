      - item j
      - item k
      required: false
    - id: 5
      name: damage
      label: Damage
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: price_range
      label: Price Range
      hint: null
      type: select_one
      options:
      - item l
      - item m
      - item n
      - item o
      required: false
    - id: 7
      name: certification
