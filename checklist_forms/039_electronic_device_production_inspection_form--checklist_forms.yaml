inputSchema:
  type: object
  properties:
    title: Electronic Device Production Inspection Form
    pages:
    - id: 1
      name: production_details
      label: Production Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: inspection_status
      label: Inspection Status
      hint: null
      type: select_one
      options:
      - Passed
      - Failed
      required: true
    - id: 3
      name: production_date
      label: Production Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: production_location
      label: Production Location
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: production_shift
      label: Production Shift
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: production_line
      label: Production Line
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: inspection_result
      label: Inspection Result
      hint: null
      type: select_multiple
      options:
      - Passed
      - Failed
      - In Progress
      required: true
    - id: 8
      name: inspection_notes
      label: Inspection Notes
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: production_bottlenecks
      label: Production Bottlenecks
      hint: null
      type: select_multiple
      options:
      - Material
      - Equipment
      - Labor
      - Other
      required: true
    - id: 10
      name: quality_issues
      label: Quality Issues
      hint: null
      type: select_multiple
      options:
      - Defective
      - Non-Defective
      - Cosmetic
      - Other
      required: false
    - id: 11
      name: root_cause
      label: Root Cause
      hint: null
      type: select_multiple
      options:
      - Human Error
      - Equipment Failure
      - Material Defect
      - Other
      required: true
    - id: 12
      name: corrective_action
      label: Corrective Action
      hint: null
      type: select_multiple
      options:
      - Repair
      - Replace
      - Re-process
      - Other
      required: true
    - id: 13
      name: next_steps
      label: Next Steps
      hint: null
      type: text
      options: []
      required: false
