inputSchema:
  type: object
  properties:
    title: Welding Inspection Form
    pages:
    - id: 1
      name: inspection_area
      label: What is the welding area being inspected?
      hint: null
      type: select_one
      options:
      - Inspection Area
      - Equipment
      - Material
      required: true
    - id: 2
      name: is_wet_area
      label: Is the area wet?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 3
      name: welding_machine
      label: What type of welding machine is being used?
      hint: null
      type: select_one
      options:
      - MIG
      - MAG
      - Arc
      - Other
      required: true
    - id: 4
      name: welder_name
      label: What is the name of the welder?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: inspection_date
      label: When was the inspection performed?
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: inspection_time
      label: What time was the inspection performed?
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: inspection_comments
      label: Do you have any comments or notes on the inspection?
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: is_wet_area_2
      label: Is the area wet again?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 9
      name: welder_name_2
      label: What is the name of the second welder (if applicable)?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: inspection_type_2
      label: What type of inspection is being performed again (if applicable)?
      hint: null
      type: select_one
      options:
      - Inspection Area
      - Equipment
      - Material
      required: false
    - id: 11
      name: inspection_comments_2
      label: Do you have any additional comments or notes for the second inspection?
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: machine_type
      label: What type of welding machine is being used again (if applicable)?
      hint: null
      type: select_one
      options:
      - MIG
      - MAG
      - Arc
      - Other
      required: false
