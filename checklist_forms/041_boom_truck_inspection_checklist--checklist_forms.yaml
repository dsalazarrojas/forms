inputSchema:
  type: object
  properties:
    title: Boom Truck Inspection Checklist
    pages:
    - id: 1
      name: inspection_date
      label: Inspection Date
      hint: Date of this inspection
      type: date
      options: []
      required: true
    - id: 2
      name: truck_id
      label: Truck ID or License Plate
      hint: Vehicle identification
      type: text
      options: []
      required: true
    - id: 3
      name: inspector_name
      label: Inspector Name
      hint: Full name of inspector
      type: text
      options: []
      required: true
    - id: 4
      name: inspection_time
      label: Inspection Time
      hint: Time of inspection
      type: time
      options: []
      required: true
    - id: 5
      name: mileage
      label: Current Mileage
      hint: Odometer reading
      type: number
      options: []
      required: true
    - id: 6
      name: boom_condition
      label: Boom Arm Condition
      hint: Overall condition of boom
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Damaged
      - Needs repair
      required: true
    - id: 7
      name: boom_extension
      label: Boom Extension Test
      hint: Extension mechanism working
      type: select_one
      options:
      - Functional
      - Slow
      - Not working
      - Needs maintenance
      required: true
    - id: 8
      name: hydraulic_system
      label: Hydraulic System
      hint: Hydraulic pressure and leaks
      type: select_one
      options:
      - Normal
      - Low pressure
      - Leaking
      - Damaged hoses
      - Needs service
      required: true
    - id: 9
      name: emergency_stop
      label: Emergency Stop Button
      hint: E-stop functionality
      type: select_one
      options:
      - Working
      - Sluggish
      - Not working
      - Needs repair
      required: true
    - id: 10
      name: safety_belt
      label: Safety Restraint System
      hint: Condition of belts and harness
      type: select_one
      options:
      - Good condition
      - Minor wear
      - Torn or damaged
      - Needs replacement
      required: true
    - id: 11
      name: light_system
      label: Light System
      hint: All lights functioning
      type: select_one
      options:
      - All working
      - Some not working
      - Major issues
      - Needs repair
      required: true
    - id: 12
      name: tire_condition
      label: Tire Condition
      hint: Tire wear and damage
      type: select_one
      options:
      - Good
      - Fair
      - Worn
      - Needs replacement
      - Flat or damaged
      required: true
    - id: 13
      name: brake_system
      label: Brake System
      hint: Brake functionality and wear
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      - Needs service
      - Dangerous
      required: true
    - id: 14
      name: defects_found
      label: Defects or Issues Found
      hint: Describe any problems
      type: text
      options: []
      required: false
    - id: 15
      name: inspection_result
      label: Inspection Result
      hint: Pass or fail
      type: select_one
      options:
      - Pass
      - Pass with minor notes
      - Conditional pass
      - Fail - repair needed
      - Fail - unsafe
      required: true
