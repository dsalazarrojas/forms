inputSchema:
  type: object
  properties:
    title: EMT Field Training Checklist
    pages:
    - id: 1
      name: session_details
      label: Session Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: session_type
      label: Session Type
      hint: null
      type: select_one
      options:
      - Type A
      - Type B
      required: false
    - id: 3
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: session_location
      label: Session Location
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: instructors
      label: Instructors
      hint: null
      type: select_multiple
      options:
      - Instructor 1
      - Instructor 2
      required: false
    - id: 7
      name: trainees
      label: Trainees
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: evaluations
      label: Evaluations
      hint: null
      type: select_one
      options:
      - Eval 1
      - Eval 2
      required: false
    - id: 9
      name: observations
      label: Observations
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
