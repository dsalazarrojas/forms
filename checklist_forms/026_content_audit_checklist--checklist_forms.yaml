inputSchema:
  type: object
  properties:
    title: Content Audit Checklist
    pages:
    - id: 1
      name: section_audit_info
      label: -- Audit Details --
      hint: Please complete this checklist for each page or asset audited.
      type: note
      options: []
      required: false
    - id: 2
      name: auditor_name
      label: Auditor Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: audit_date
      label: Audit Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: section_page_evaluation
      label: -- Page Evaluation --
      hint: Please evaluate the quality and performance of the page.
      type: note
      options: []
      required: false
    - id: 5
      name: page_url
      label: Page URL
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: content_quality_rating
      label: Content Quality Rating
      hint: 1 being poor, 5 being excellent
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 7
      name: seo_status
      label: SEO Status
      hint: null
      type: select_one
      options:
      - Optimized
      - Partially Optimized
      - Needs Optimization
      - Critical Issues
      required: true
    - id: 8
      name: readability_score
      label: Readability Score
      hint: Flesch-Kincaid Grade Level or similar
      type: number
      options: []
      required: false
    - id: 9
      name: content_freshness
      label: Content Freshness
      hint: null
      type: select_one
      options:
      - Up-to-date
      - Needs Review
      - Outdated
      - Archive Needed
      required: true
    - id: 10
      name: section_update_priorities
      label: -- Update Priorities and Recommendations --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: update_priority_level
      label: Update Priority Level
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      - Critical
      required: true
    - id: 12
      name: update_recommendations
      label: Specific Recommendations for Updates
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: key_performance_indicators
      label: Key Performance Indicators (KPIs) Affected
      hint: Select all that apply
      type: select_multiple
      options:
      - Traffic
      - Conversion
      - Engagement
      - Retention
      - Other
      required: false
    - id: 14
      name: section_confirmation
      label: -- Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: audit_completed
      label: Audit Completed?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: additional_comments
      label: Any additional details or comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: signature_confirmation
      label: I confirm that the information provided is accurate
      hint: null
      type: select_one
      options:
      - I Agree
      - I Disagree
      required: true
    - id: 18
      name: audit_submission_date
      label: Date of Audit Submission
      hint: null
      type: date
      options: []
      required: true
