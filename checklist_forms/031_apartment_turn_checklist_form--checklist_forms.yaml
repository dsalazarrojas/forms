inputSchema:
  type: object
  properties:
    title: Apartment Turn Checklist Form
    pages:
    - id: 1
      name: turnover_date
      label: Move-out date
      hint: Tenant departure date
      type: date
      options: []
      required: true
    - id: 2
      name: property_address
      label: Property address
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: unit_number
      label: Unit number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: outgoing_tenant
      label: Outgoing tenant name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: expected_move_in_date
      label: Expected next move-in date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: property_manager
      label: Property manager name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: turnover_inspection_date
      label: Turnover inspection date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: general_cleaning_needed
      label: General cleaning required
      hint: null
      type: select_one
      options:
      - Deep clean needed
      - Standard cleaning
      - Minimal cleaning
      - Already clean
      required: true
    - id: 9
      name: carpet_condition
      label: Carpet condition
      hint: null
      type: select_one
      options:
      - Good - no cleaning needed
      - Fair - can be cleaned
      - Poor - needs replacement
      - N/A - no carpet
      required: true
    - id: 10
      name: carpet_cleaning_scheduled
      label: Carpet cleaning scheduled
      hint: null
      type: select_one
      options:
      - Yes, scheduled
      - No, not needed
      - No, needs repair first
      required: true
    - id: 11
      name: flooring_repairs_needed
      label: Flooring repairs needed
      hint: null
      type: select_one
      options:
      - None
      - Minor repairs
      - Major repairs
      - Replacement needed
      required: true
    - id: 12
      name: paint_needed
      label: Paint needed
      hint: null
      type: select_one
      options:
      - Full apartment repaint
      - Spot painting only
      - Minor touch-ups
      - No paint needed
      required: true
    - id: 13
      name: paint_color_selected
      label: Paint color selected
      hint: Standard or custom
      type: text
      options: []
      required: false
    - id: 14
      name: walls_damage_assessment
      label: Wall damage assessment
      hint: Holes, marks, stains
      type: text
      options: []
      required: false
    - id: 15
      name: appliances_inspection
      label: Appliances inspection needed
      hint: null
      type: select_one
      options:
      - All appliances functioning well
      - Some appliances need repair
      - Multiple appliances need replacement
      required: true
    - id: 16
      name: appliances_details
      label: Appliance issues if any
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: plumbing_inspection
      label: Plumbing inspection needed
      hint: null
      type: select_one
      options:
      - No plumbing issues
      - Minor repairs needed
      - Major repairs needed
      required: true
    - id: 18
      name: plumbing_details
      label: Plumbing issues if any
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: hvac_inspection
      label: HVAC system inspection needed
      hint: null
      type: select_one
      options:
      - System working properly
      - Filter change needed
      - Service needed
      - Replacement needed
      required: true
    - id: 20
      name: pest_control_needed
      label: Pest control treatment needed
      hint: null
      type: select_one
      options:
      - Yes, full treatment
      - Yes, targeted treatment
      - No, not needed
      required: true
    - id: 21
      name: odor_treatment
      label: Odor treatment needed
      hint: Smoke, pet, other odors
      type: select_one
      options:
      - Extensive odor treatment
      - Minor odor removal
      - No odor treatment needed
      required: true
    - id: 22
      name: hardware_replacement
      label: Hardware replacement needed
      hint: Locks, handles, hinges
      type: select_one
      options:
      - Yes, extensive replacement
      - Yes, some items
      - No replacement needed
      required: true
    - id: 23
      name: security_update
      label: Security lock changes needed
      hint: null
      type: select_one
      options:
      - Locks need rekeying
      - Locks need replacement
      - Already changed
      - Not needed
      required: true
    - id: 24
      name: move_out_damages
      label: Move-out damages recorded
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: estimated_repair_costs
      label: Estimated total repair costs
      hint: In dollars
      type: number
      options: []
      required: false
    - id: 26
      name: ready_for_showings
      label: When will unit be ready for showings
      hint: null
      type: date
      options: []
      required: false
    - id: 27
      name: turnover_complete_date
      label: Anticipated turnover completion date
      hint: null
      type: date
      options: []
      required: false
