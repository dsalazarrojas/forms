inputSchema:
  type: object
  properties:
    title: Development Priorities Checklist
    pages:
    - id: 1
      name: project_scope
      label: What is the project scope?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 2
      name: project_team
      label: Who is on the project team?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: project_status
      label: What is the project status?
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 4
      name: project_deadline
      label: What is the project deadline?
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: development_approach
      label: How would you describe the development approach?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: project_lead
      label: Who is the project lead?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: priority_1
      label: What is the priority level (highest)?
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 8
      name: business_impact
      label: What is the business impact?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: risk_level
      label: What is the risk level?
      hint: null
      type: select_one
      options:
      - High
      - Low
      required: false
    - id: 10
      name: complexity
      label: How complex is the project?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: resource_allocation
      label: How would you allocate resources?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: technical_debt
      label: Is there technical debt?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: priority_2
      label: What is the priority level (second highest)?
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 14
      name: priority_3
      label: What is the priority level (third highest)?
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 15
      name: priority
      label: What is your current priority?
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
