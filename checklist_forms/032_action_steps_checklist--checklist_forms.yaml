inputSchema:
  type: object
  properties:
    title: Action Steps Checklist
    pages:
    - id: 1
      name: project_name
      label: Project Name
      hint: Name of the project or task this checklist is for
      type: text
      options: []
      required: true
    - id: 2
      name: responsible_person
      label: Responsible Person
      hint: Name of the person responsible for completing these action steps
      type: text
      options: []
      required: true
    - id: 3
      name: checklist_date
      label: Checklist Date
      hint: Date when this checklist was created or last updated
      type: date
      options: []
      required: true
    - id: 4
      name: step_1
      label: Step 1 - Define project scope and objectives
      hint: Complete the first step of the project
      type: select_one
      options: ["Not Started", "In Progress", "Completed"]
      required: true
    - id: 5
      name: step_2
      label: Step 2 - Identify stakeholders and requirements
      hint: Complete the second step of the project
      type: select_one
      options: ["Not Started", "In Progress", "Completed"]
      required: true
    - id: 6
      name: step_3
      label: Step 3 - Develop project timeline and milestones
      hint: Complete the third step of the project
      type: select_one
      options: ["Not Started", "In Progress", "Completed"]
      required: true
    - id: 7
      name: step_4
      label: Step 4 - Allocate resources and assign tasks
      hint: Complete the fourth step of the project
      type: select_one
      options: ["Not Started", "In Progress", "Completed"]
      required: true
    - id: 8
      name: step_5
      label: Step 5 - Execute planned activities
      hint: Complete the fifth step of the project
      type: select_one
      options: ["Not Started", "In Progress", "Completed"]
      required: true
    - id: 9
      name: step_6
      label: Step 6 - Monitor progress and adjust as needed
      hint: Complete the sixth step of the project
      type: select_one
      options: ["Not Started", "In Progress", "Completed"]
      required: true
    - id: 10
      name: step_7
      label: Step 7 - Review deliverables and quality assurance
      hint: Complete the seventh step of the project
      type: select_one
      options: ["Not Started", "In Progress", "Completed"]
      required: true
    - id: 11
      name: step_8
      label: Step 8 - Communicate progress to stakeholders
      hint: Complete the eighth step of the project
      type: select_one
      options: ["Not Started", "In Progress", "Completed"]
      required: true
    - id: 12
      name: step_9
      label: Step 9 - Document lessons learned
      hint: Complete the ninth step of the project
      type: select_one
      options: ["Not Started", "In Progress", "Completed"]
      required: true
    - id: 13
      name: step_10
      label: Step 10 - Close project and archive documentation
      hint: Complete the tenth step of the project
      type: select_one
      options: ["Not Started", "In Progress", "Completed"]
      required: true
    - id: 14
      name: additional_notes
      label: Additional Notes or Comments
      hint: Any additional notes about the project or checklist
      type: text
      options: []
      required: false
