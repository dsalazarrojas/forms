inputSchema:
  type: object
  properties:
    title: Disinfection Task Log
    pages:
    - id: 1
      name: date_and_time
      label: Date and time
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: location
      label: location
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: disinfection_type
      label: Disinfection type
      hint: null
      type: select_one
      options:
      - Chemical Disinfection
      - Steam Disinfection
      - Other
      required: false
    - id: 4
      name: chemicals_used
      label: Chemicals used
      hint: null
      type: select_multiple
      options:
      - Chemical 1
      - Chemical 2
      - Chemical 3
      required: false
    - id: 5
      name: staff_details
      label: Staff details
      hint: null
      type: select_one
      options:
      - Employee 1
      - Employee 2
      - Employee 3
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: signatures
      label: Signatures
      hint: null
      type: select_multiple
      options:
      - Signature 1
      - Signature 2
      - Signature 3
      required: false
    - id: 8
      name: staff_comments
      label: Staff comments
      hint: null
      type: select_multiple
      options:
      - comment 1
      - comment 2
      - comment 3
      required: false
    - id: 9
      name: staff_signatures
      label: Staff signatures
      hint: null
      type: select_multiple
      options:
      - signature 1
      - signature 2
      - signature 3
      required: false
    - id: 10
      name: chemicals_required
      label: Chemicals required
      hint: null
      type: select_one
      options:
      - Chemical 1
      - Chemical 2
      - Chemical 3
      required: false
    - id: 11
      name: disinfection_status
      label: Disinfection status
      hint: null
      type: select_one
      options:
      - Completed
      - In Progress
      - Not Started
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
