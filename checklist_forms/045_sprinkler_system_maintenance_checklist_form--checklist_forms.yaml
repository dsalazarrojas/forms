inputSchema:
  type: object
  properties:
    title: Sprinkler System Maintenance Checklist Form
    pages:
    - id: 1
      name: sprinkler_system_checklist
      label: sprinkler_system_checklist
      hint: null
      type: select_one
      options:
      - checklist 1a
      - checklist 1b
      - checklist 1c
      required: false
    - id: 2
      name: sprinkler_flow_rate
      label: sprinkler_flow_rate
      hint: null
