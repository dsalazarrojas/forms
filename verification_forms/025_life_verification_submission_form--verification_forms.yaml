    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: date_of_entry
      label: Date of Entry
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: last_updated
      label: Last Updated
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: last_updated_reason
      label: Last Updated Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: status
      label: Status
      hint: null
      type: select_one
