inputSchema:
  type: object
  properties:
    title: Address Verification Form
    pages:
    - id: 1
      name: verification_header
      label: -- Resident Address Verification --
      hint: Please provide the required information to verify your current place of
        residence
      type: note
      options: []
      required: false
    - id: 2
      name: resident_name
      label: Resident Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: social_security_last4
      label: Last 4 Digits of SSN / National ID
      hint: For verification purposes only
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: address_to_verify_header
      label: -- Address to be Verified --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: verified_street_address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: verified_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: verified_state
      label: State / Province
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: verified_zip
      label: Zip / Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: residency_start_date
      label: Date you moved into this address
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: ownership_status
      label: Do you own or rent this property?
      hint: null
      type: select_one
      options:
      - Own
      - Rent
      - Live with Family / Friend
      - Other
      required: true
    - id: 12
      name: documentation_header
      label: -- Verification Documents --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: doc_type_available
      label: Which document will you provide for verification?
      hint: A secure upload link will be provided
      type: select_one
      options:
      - Valid Driver's License
      - Signed Lease Agreement
      - Utility Bill (Water / Electric)
      - Property Tax Statement
      required: true
    - id: 14
      name: contact_phone
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: authorization_ack
      label: I authorize the verification of this address information
      hint: null
      type: select_one
      options:
      - I Authorize
      - Other
      required: true
    - id: 16
      name: verification_date
      label: Verification Request Date
      hint: null
      type: date
      options: []
      required: true
