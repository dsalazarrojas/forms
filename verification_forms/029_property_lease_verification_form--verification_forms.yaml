inputSchema:
  type: object
  properties:
    title: property_lease_verification_form
    pages:
    - id: 1
      name: tenant_info
      label: Tenant Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: lease_details
      label: Lease Details
      hint: null
      type: select_multiple
      options:
      - Lease Status
      - Lease Type
      - Lease Length
      - Lease Terms
      required: false
    - id: 3
      name: tenant_experience
      label: Tenant Experience
      hint: null
      type: select_multiple
      options:
      - Rental History
      - Employment Status
      - Income Verification
      required: false
    - id: 4
      name: property_info
      label: Property Info
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: tenant_references
      label: Tenant References
      hint: null
      type: select_multiple
      options:
      - Landlord Reference
      - Property Manager Reference
      required: false
    - id: 6
      name: lease_end
      label: Lease End
      hint: null
      type: date
      options: []
      required: false
