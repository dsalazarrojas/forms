inputSchema:
  type: object
  properties:
    title: Agent Credentials Verification Form
    pages:
    - id: 1
      name: verification_header
      label: -- Verification Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: agent_name
      label: Agent full name
      hint: Name on credentials
      type: text
      options: []
      required: true
    - id: 3
      name: credential_type
      label: Credential type
      hint: e.g., license, certification, ID
      type: select_one
      options: [Professional license, Certification, Government ID, Other]
      required: true
    - id: 4
      name: issuing_authority
      label: Issuing authority
      hint: Organization issuing the credential
      type: text
      options: []
      required: true
    - id: 5
      name: credential_number
      label: Credential number
      hint: Number on the credential document
      type: text
      options: []
      required: true
    - id: 6
      name: issue_date
      label: Issue date
      hint: Date credential was issued
      type: date
      options: []
      required: false
    - id: 7
      name: expiry_date
      label: Expiry date
      hint: Credential expiration date if any
      type: date
      options: []
      required: false
    - id: 8
      name: supporting_documents
      label: Supporting documents description
      hint: Describe attached verification documents
      type: text
      options: []
      required: false
    - id: 9
      name: verification_status
      label: Verification status
      hint: Result of verification process
      type: select_one
      options: [Verified, Pending, Rejected]
      required: true
    - id: 10
      name: verifier_name
      label: Verifier name
      hint: Staff member who completed verification
      type: text
      options: []
      required: false
