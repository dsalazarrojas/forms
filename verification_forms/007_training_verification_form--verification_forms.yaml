    - id: 7
      name: trainer
      label: Trained By
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: date_trained
      label: Date Trained
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: verified_by
