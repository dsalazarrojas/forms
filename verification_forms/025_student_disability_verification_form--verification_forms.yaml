inputSchema:
  type: object
  properties:
    title: Student Disability Verification Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: student_id
      label: Student ID
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: date_of_disability_verification
      label: Date of Disability Verification
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: disability
      label: Disability
      hint: null
      type: select_one
      options:
      - Hearing
      - Visual
      - Physical
      - Mental
      - Learning Disability
      - Other
      required: false
    - id: 7
      name: disability_description
      label: Disability Description
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: verification_method
      label: Verification Method
      hint: null
      type: select_one
      options:
      - In person
      - Over video conference
      - By mail
      required: false
