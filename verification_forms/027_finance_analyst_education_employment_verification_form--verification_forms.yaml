      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: employment_start_date
      label: Employment Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: employment_end_date
      label: Employment End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: employment_current_status
      label: Employment Current Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Terminated
      - Resigned
      - Retired
      - Deceased
      - Resigned/Left
      required: false
    - id: 14
      name: reason_for_leave
