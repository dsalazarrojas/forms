      - Inactive
      - Terminated
      - Retired
      - Deceased
      - Resigned
      - Resigned/Left
      required: false
    - id: 4
      name: employment_dates
      label: Employment Dates
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: education_level
