      - Master's Degree
      - Other
      required: false
    - id: 6
      name: institution_name
      label: Institution Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: degree_name
      label: Degree Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: field_of_study
      label: Field of Study
      hint: null
      type: text
      options: []
      required: false
