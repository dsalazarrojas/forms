inputSchema:
  type: object
  properties:
    title: Cruise Line Health Incident Report Form
    pages:
    - id: 1
      name: incident_date
      label: Report Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: incident_time
      label: Report Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: incident_location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: incident_description
      label: Incident Description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: incident_type
      label: Incident Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: incident_status
      label: Incident Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 7
      name: incident_reporter
      label: Incident Reporter
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: incident_severeness
      label: Incident Severity
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: incident_follow_up
      label: Follow Up Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 10
      name: incident_notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
