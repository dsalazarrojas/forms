inputSchema:
  type: object
  properties:
    title: Incident Response Dispatch Form
    pages:
    - id: 1
      name: incident_response_dispatch_form_input_1
      label: Incident Report Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: incident_response_dispatch_form_input_2
      label: Dispatching Team
      hint: null
      type: select_one
      options:
      - Team 1
      - Team 2
      required: true
    - id: 3
      name: incident_response_dispatch_form_input_3
      label: Priority Level
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 4
      name: incident_response_dispatch_form_input_4
      label: Response Time
      hint: In hours
      type: time
      options: []
      required: true
    - id: 5
      name: incident_response_dispatch_form_input_5
      label: Dispatching Team Member
      hint: null
      type: select_multiple
      options:
      - John Doe
      - Jane Doe
      required: false
    - id: 6
      name: incident_response_dispatch_form_input_6
      label: Incident Description
      hint: Please provide a brief description of the incident.
      type: text
      options: []
      required: true
    - id: 7
      name: incident_response_dispatch_form_input_7
      label: Incident Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: incident_response_dispatch_form_input_8
      label: Incident Time
      hint: null
      type: time
      options: []
      required: true
