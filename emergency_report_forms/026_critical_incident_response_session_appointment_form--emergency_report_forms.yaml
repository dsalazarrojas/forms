inputSchema:
  type: object
  properties:
    title: Critical Incident Response Session Appointment Form
    pages:
    - id: 1
      name: incident_type
      label: Incident Type
      hint: null
      type: select_one
      options:
      - Critical Accident
      - Critical Incident
      - Other (please specify)
      required: false
    - id: 2
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: incident_time
      label: Incident Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: incident_summary
      label: Incident Summary
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: session_location
      label: Session Location
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: session_start_time
      label: Session Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: session_durations
      label: Session Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: participant_role
      label: Participant Role
      hint: null
      type: select_one
      options:
      - Client
      - Employee
      - Other
      required: false
    - id: 10
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
