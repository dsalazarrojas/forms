      type: number
      options: []
      required: false
    - id: 6
      name: fire_location
      label: Fire Location
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_person_email
      label: Contact Person Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: contact_person_phone
      label: Contact Person Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: fire_description
      label: Fire Description
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: fire_status
      label: Fire Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
    - id: 12
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
