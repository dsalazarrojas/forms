inputSchema:
  type: object
  properties:
    title: CrowdStrike Global Threat Report Form
    pages:
    - id: 1
      name: threat_type
      label: Threat Type
      hint: null
      type: select_one
      options:
      - Threat Actor
      - Malware
      - Phishing
      - Ransomware
      - Other
      required: false
    - id: 2
      name: threat_location
      label: Threat Location
      hint: null
      type: select_multiple
      options:
      - North America
      - South America
      - Europe
      - Africa
      - Asia
      - Other
      required: false
    - id: 3
      name: threat_description
      label: Threat Description
      hint: Provide a detailed description of the threat
      type: text
      options: []
      required: false
    - id: 4
      name: threat_severity
      label: Threat Severity
      hint: How severe do you consider this threat to be?
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 5
      name: threat_frequency
      label: Threat Frequency
      hint: How frequently does this threat occur?
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Less than monthly
      required: false
    - id: 6
      name: threat_impact
      label: Potential Impact
      hint: What are the potential risks of this threat?
      type: text
      options: []
      required: false
    - id: 7
      name: threat_solutions
      label: Threat Solutions
      hint: What are the recommended solutions for mitigating this threat?
      type: text
      options: []
      required: false
    - id: 8
      name: threat_comments
      label: Comments
      hint: Additional comments about this threat
      type: text
      options: []
      required: false
