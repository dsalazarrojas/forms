inputSchema:
  type: object
  properties:
    title: Disaster Recovery Plan Authorization Form
    pages:
    - id: 1
      name: organization_name
      label: Organization Name
      hint: Please enter the name of the organization.
      type: text
      options: []
      required: true
    - id: 2
      name: contact_person_name
      label: Contact Person's Name
      hint: Enter the name of the contact person.
      type: text
      options: []
      required: true
    - id: 3
      name: contact_person_title
      label: Contact Person's Title
      hint: Enter the title of the contact person.
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact Person's Email
      hint: Enter the email address of the contact person.
      type: text
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact Person's Phone
      hint: Enter the phone number of the contact person.
      type: text
      options: []
      required: true
    - id: 6
      name: contact_department
      label: Contact Department
      hint: Enter the department or role of the contact person.
      type: text
      options: []
      required: true
    - id: 7
      name: emergency_contact
      label: Emergency Contact Person
      hint: Is there an emergency contact person?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: emergency_contact_extension
      label: Emergency Contact Extension
      hint: Enter the extension of the emergency contact person.
      type: text
      options: []
      required: false
    - id: 9
      name: emergency_contact_level
      label: Contact Level
      hint: Enter the level (high or low) of the emergency contact person.
      type: select_one
      options:
      - High
      - Low
      required: false
    - id: 10
      name: emergency_contact_info
      label: Emergency Contact Information
      hint: Enter any additional information about the emergency contact person.
      type: text
      options: []
      required: false
    - id: 11
      name: authorized_to_act
      label: Authorized to Act
      hint: Is the contact person authorized to act on behalf of the organization?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: email_subject
      label: Email Subject
      hint: Enter the email subject for the disaster recovery plan.
      type: text
      options: []
      required: true
    - id: 13
      name: email_body
      label: Email Body
      hint: Enter the email body for the disaster recovery plan.
      type: text
      options: []
      required: true
