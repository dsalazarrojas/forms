inputSchema:
  type: object
  properties:
    title: Organizational Culture Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: Please answer the questions honestly to provide valuable feedback for
        the company's improvement
      type: text
      options: []
      required: false
    - id: 2
      name: company_values
      label: What are the company's core values?
      hint: Think about the most important principles that guide the company's behavior
      type: text
      options: []
      required: false
    - id: 3
      name: communication_style
      label: How would you rate the company's communication style?
      hint: Consider how well the company shares information with employees
      type: number
      options: []
      required: true
    - id: 4
      name: decision_making
      label: What do you think is the most significant factor in the company's decision-making
        process?
      hint: Consider the role of employee feedback and involvement
      type: select_one
      options:
      - Employee input is always considered
      - Employee input is sometimes considered
      - Employee input is rarely considered
      - Employee input is never considered
      required: true
    - id: 5
      name: leadership_style
      label: How would you rate the company's leadership style?
      hint: Consider how leaders motivate and support employees
      type: number
      options: []
      required: true
    - id: 6
      name: company_culture
      label: How do you rate the overall culture of the company?
      hint: Consider how well the company promotes a positive work environment
      type: number
      options: []
      required: true
    - id: 7
      name: policy_changes
      label: What changes would you like to see in the company's current policies?
      hint: Be honest and provide specific examples
      type: text
      options: []
      required: false
    - id: 8
      name: manager_support
      label: How would you rate the level of support from your manager?
      hint: Consider how well your manager listens to your concerns
      type: number
      options: []
      required: false
    - id: 9
      name: sick_leave
      label: How many days do you take sick leave per year?
      hint: Only include days actually taken, not expected or available
      type: number
      options: []
      required: false
    - id: 10
      name: role
      label: What is your role in the company?
      hint: Provide your job title and department
      type: text
      options: []
      required: false
    - id: 11
      name: years_with_company
      label: How many years have you been with the company?
      hint: Only include years actually working at the company
      type: number
      options: []
      required: false
    - id: 12
      name: department
      label: What department do you belong to?
      hint: Provide your department name
      type: text
      options: []
      required: false
    - id: 13
      name: submit
      label: Submit
      hint: Please submit your answers
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
