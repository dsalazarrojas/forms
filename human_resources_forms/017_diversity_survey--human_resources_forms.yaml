inputSchema:
  type: object
  properties:
    title: Diversity Survey
    pages:
    - id: 1
      name: page_1
      label: How do you feel about the diversity of the company's workforce?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 2
      name: page_2
      label: Which of the following best describes your experiences with equal opportunities
        at the company?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 3
      name: page_3
      label: How often do you feel that your contributions are valued and recognized?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 4
      name: page_4
      label: Which of the following best describes your experiences with fair treatment
        at the company?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 5
      name: page_5
      label: How important do you think diversity and inclusion are to the company's
        success?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 6
      name: page_6
      label: Do you feel that your company promotes diversity and inclusion in the
        workplace?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      required: false
    - id: 7
      name: page_7
      label: What are the most important reasons you have for not feeling welcome
        at the company? (Select multiple)
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 8
      name: page_8
      label: What are the most important reasons you have for feeling that your contributions
        are not recognized? (Select multiple)
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 9
      name: page_9
      label: How do you feel about the diversity and inclusion initiatives implemented
        by the company?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 10
      name: page_10
      label: Have you ever experienced any form of discrimination or bias in the workplace?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      required: false
    - id: 11
      name: page_11
      label: Have you experienced any form of retaliation for reporting or speaking
        up about diversity and inclusion issues?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      required: false
    - id: 12
      name: page_12
      label: How confident are you about the company's commitment to diversity and
        inclusion?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 13
      name: page_13
      label: Would you like to suggest any diversity and inclusion initiatives that
        the company should implement?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      required: false
