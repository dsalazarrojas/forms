inputSchema:
  type: object
  properties:
    title: intern_feedback_questionnaire
    pages:
    - id: 1
      name: intern_programs
      label: What were your intern programs
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: job_description
      label: What was your job description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: team
      label: What was your team
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: skills_used
      label: What skills were you using
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: job_satisfaction
      label: How satisfied were you with your job
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: intern_satisfaction
      label: How satisfied were you with your intern experience
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: feedback
      label: Please provide feedback
      hint: null
      type: text
      options: []
      required: false
