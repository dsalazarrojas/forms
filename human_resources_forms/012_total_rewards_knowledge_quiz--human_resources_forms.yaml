inputSchema:
  type: object
  properties:
    title: Total Rewards Knowledge Quiz
    pages:
    - id: 1
      name: first_page
      label: total_rewards_knowledge_quiz
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: compensation_page
      label: compensation
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 3
      name: benefits_page
      label: benefits
      hint: null
      type: select_one
      options:
      - $1000-2000
      - $2000-4000
      - $4000-6000
      required: false
    - id: 4
      name: recognition_page
      label: recognition
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
