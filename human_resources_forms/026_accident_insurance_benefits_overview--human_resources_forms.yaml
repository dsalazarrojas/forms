inputSchema:
  type: object
  properties:
    title: Accident Insurance Benefits Overview
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: Full name of the employee
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID
      hint: Employee identification number
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department
      hint: Department where the employee works
      type: text
      options: []
      required: true
    - id: 4
      name: position_title
      label: Position Title
      hint: Current job title of the employee
      type: text
      options: []
      required: true
    - id: 5
      name: hire_date
      label: Hire Date
      hint: Date when the employee was hired
      type: date
      options: []
      required: true
    - id: 6
      name: coverage_effective_date
      label: Coverage Effective Date
      hint: Date when the accident insurance coverage became effective
      type: date
      options: []
      required: true
    - id: 7
      name: coverage_type
      label: Coverage Type
      hint: Type of accident insurance coverage
      type: select_one
      options:
      - Basic Accident Coverage
      - Premium Accident Coverage
      - Extended Accident Coverage
      - Supplemental Accident Coverage
      - Other
      required: true
    - id: 8
      name: coverage_amount
      label: Coverage Amount
      hint: Maximum benefit amount covered under the policy
      type: number
      options: []
      required: true
    - id: 9
      name: premium_amount
      label: Premium Amount
      hint: Monthly premium amount for the coverage
      type: number
      options: []
      required: true
    - id: 10
      name: coverage_eligibility_status
      label: Coverage Eligibility Status
      hint: Is the employee eligible for this coverage?
      type: select_one
      options:
      - Eligible
      - Not Eligible
      - Pending Review
      - Waived Coverage
      required: true
    - id: 11
      name: covered_accidents
      label: Covered Accidents
      hint: What types of accidents are covered?
      type: select_multiple
      options:
      - Work-related accidents
      - Off-duty accidents
      - Travel-related accidents
      - Sports injuries
      - Household accidents
      - Motor vehicle accidents
      - Other
      required: true
    - id: 12
      name: excluded_conditions
      label: Excluded Conditions
      hint: What conditions are not covered?
      type: select_multiple
      options:
      - Self-inflicted injuries
      - Intoxication-related accidents
      - High-risk sports
      - Acts of war
      - Pre-existing conditions
      - Intentional acts
      - Other
      required: true
    - id: 13
      name: benefit_structure
      label: Benefit Structure
      hint: How are benefits paid out?
      type: select_one
      options:
      - Lump sum payment
      - Weekly payments
      - Monthly payments
      - Actual expenses reimbursed
      - Percentage of salary
      - Other
      required: true
    - id: 14
      name: waiting_period
      label: Waiting Period
      hint: How long is the waiting period before benefits begin?
      type: select_one
      options:
      - No waiting period
      - 24 hours
      - 7 days
      - 14 days
      - 30 days
      - Other
      required: true
    - id: 15
      name: benefit_duration
      label: Benefit Duration
      hint: How long are benefits paid?
      type: select_one
      options:
      - Fixed period
      - Until recovery
      - Up to 1 year
      - Up to 2 years
      - Lifetime
      - Other
      required: true
    - id: 16
      name: claim_process_description
      label: Claim Process Description
      hint: How to file a claim under this coverage
      type: text
      options: []
      required: true
    - id: 17
      name: documentation_requirements
      label: Documentation Requirements
      hint: What documentation is required to file a claim?
      type: text
      options: []
      required: true
    - id: 18
      name: coverage_limitations
      label: Coverage Limitations
      hint: Are there any limitations to the coverage?
      type: text
      options: []
      required: true
    - id: 19
      name: employee_acknowledgment
      label: Employee Acknowledgment
      hint: Do you acknowledge that you have read and understood the accident insurance
        benefits?
      type: select_one
      options:
      - Yes, I acknowledge
      - No, I need clarification
      required: true
    - id: 20
      name: additional_questions
      label: Additional Questions
      hint: Do you have any questions about the accident insurance benefits?
      type: text
      options: []
      required: false
