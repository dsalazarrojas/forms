      type: select_one
      options:
      - Pending
      - Resolved
      - In Progress
      required: false
    - id: 9
      name: witness_witnessed
      label: Witness Witnessed
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Partially
      required: false
    - id: 10
      name: witness_witnessed_harasser
      label: Witness Witnessed Harasser
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: employee_witnessed
      label: Employee Witnessed
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
