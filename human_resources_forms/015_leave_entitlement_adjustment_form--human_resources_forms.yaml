inputSchema:
  type: object
  properties:
    title: Leave Entitlement Adjustment Form
    pages:
    - id: 1
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: leave_type
      label: Leave Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: leave_balance
      label: Leave Balance
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: reason_for_adjustment
      label: Reason for adjustment
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: adjustment_amount
      label: Adjustment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
