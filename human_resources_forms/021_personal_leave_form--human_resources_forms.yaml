inputSchema:
  type: object
  properties:
    title: Personal Leave Form
    pages:
    - id: 1
      name: title
      label: Title
      hint: Please enter a brief title for the leave request
      type: text
      options: []
      required: true
    - id: 2
      name: start_date
      label: Date
      hint: Enter the start date of the leave
      type: date
      options: []
      required: true
    - id: 3
      name: start_time
      label: Time
      hint: Enter the start time of the leave
      type: time
      options: []
      required: true
    - id: 4
      name: reason
      label: Reason
      hint: Please enter a brief reason for the leave request
      type: text
      options: []
      required: true
    - id: 5
      name: duration
      label: Duration
      hint: Enter the number of days for the leave
      type: number
      options: []
      required: true
    - id: 6
      name: frequency
      label: Frequency
      hint: Will this be a one-time leave or a recurring request?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: frequency_2
      label: Multiple Leave Days
      hint: Will you be taking multiple leave days during this period?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: start_date_2
      label: Start Date
      hint: Enter the start date of the leave period
      type: date
      options: []
      required: true
    - id: 9
      name: end_date
      label: End Date
      hint: Enter the end date of the leave period
      type: date
      options: []
      required: true
    - id: 10
      name: end_time
      label: End Time
      hint: Enter the end time of the leave
      type: time
      options: []
      required: true
    - id: 11
      name: notes
      label: Notes
      hint: Enter any additional comments or requests regarding the leave
      type: text
      options: []
      required: false
    - id: 12
      name: phone
      label: Phone
      hint: Enter your phone number
      type: text
      options: []
      required: false
    - id: 13
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: false
