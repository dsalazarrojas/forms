inputSchema:
  type: object
  properties:
    title: Career Counseling Volunteer Application Form
    pages:
    - id: 1
      name: volunteer_info
      label: -- Volunteer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Legal name of volunteer
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone number
      hint: Best number to reach volunteer
      type: text
      options: []
      required: false
    - id: 5
      name: availability
      label: Availability
      hint: Days and times available
      type: text
      options: []
      required: true
    - id: 6
      name: relevant_experience
      label: Relevant experience
      hint: Any coaching or mentoring experience
      type: text
      options: []
      required: false
    - id: 7
      name: references
      label: References
      hint: Provide two professional references
      type: text
      options: []
      required: true
    - id: 8
      name: background_check_consent
      label: Consent to background check
      hint: Required for volunteer placement
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: role_preference
      label: Role preference
      hint: Type of volunteer work preferred
      type: select_one
      options:
      - One on one mentoring
      - Group workshops
      - Event support
      required: false
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Anything else to share
      type: text
      options: []
      required: false
