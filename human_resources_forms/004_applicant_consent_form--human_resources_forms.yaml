inputSchema:
  type: object
  properties:
    title: Applicant Consent Form
    pages:
    - id: 1
      name: applicant_name
      label: Applicant name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email address
      hint: Applicant contact email
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone number
      hint: Best phone number to reach applicant
      type: text
      options: []
      required: false
    - id: 4
      name: consent_data_processing
      label: Consent to collect and process personal data
      hint: Applicant permission for data processing
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 5
      name: consent_reference_check
      label: Consent for reference checks
      hint: Permission to contact listed references
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 6
      name: background_check_consent
      label: Consent for background checks
      hint: Permission to perform required checks
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 7
      name: consent_signature
      label: Electronic signature
      hint: Type full name to serve as electronic signature
      type: text
      options: []
      required: true
    - id: 8
      name: signature_date
      label: Signature date
      hint: Date when consent was provided
      type: date
      options: []
      required: true
    - id: 9
      name: notes
      label: Notes
      hint: Additional comments or restrictions
      type: text
      options: []
      required: false
