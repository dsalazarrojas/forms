inputSchema:
  type: object
  properties:
    title: Worker Language Delegation Form
    pages:
    - id: 1
      name: supervisor_name
      label: Supervisor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: supervisor_id
      label: Supervisor ID
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: worker_name
      label: Worker Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: language
      label: Languages
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: language_1
      label: english
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: language_2
      label: french
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: language_3
      label: spanish
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: language_4
      label: german
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: task_description
      label: Task Description
      hint: Describe the task or project
      type: text
      options: []
      required: true
    - id: 10
      name: task_frequency
      label: Task Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      required: true
    - id: 11
      name: task_duration
      label: Task Duration
      hint: null
      type: select_multiple
      options:
      - Short (less than 1 hour)
      - Medium (1-4 hours)
      - Long (more than 4 hours)
      required: true
    - id: 12
      name: start_date
      label: Start Date
      hint: mm/dd/yyyy
      type: date
      options: []
      required: true
    - id: 13
      name: end_date
      label: End Date
      hint: mm/dd/yyyy
      type: date
      options: []
      required: true
    - id: 14
      name: start_time
      label: Start Time
      hint: "hh:mm a"
      type: time
      options: []
      required: true
    - id: 15
      name: end_time
      label: End Time
      hint: "hh:mm a"
      type: time
      options: []
      required: true
    - id: 16
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: task_status
      label: Task Status
      hint: null
      type: select_one
      options:
      - New
      - In Progress
      - Completed
      - On Hold
      required: true
    - id: 18
      name: supervisor_notes
      label: Supervisor Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: worker_notes
      label: Worker Notes
      hint: null
      type: note
      options: []
      required: false
