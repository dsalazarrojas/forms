inputSchema:
  type: object
  properties:
    title: Procurement Authorization Form
    pages:
    - id: 1
      name: procurement_authorization_form
      label: form_title
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: category
      label: category
      hint: null
      type: select_one
      options:
      - Human Resources Forms
      - Procurement Forms
      required: true
    - id: 3
      name: description
      label: description
      hint: Please describe the items or services you are seeking to purchase.
      type: text
      options: []
      required: true
    - id: 4
      name: purchase_requestor
      label: purchase_requestor
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_purchase
      label: date_of_purchase
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: purchase_amount
      label: purchase_amount
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: approved_by
      label: approved_by
      hint: null
      type: select_one
      options:
      - Procurement Manager
      - Procurement Coordinator
      required: true
    - id: 8
      name: comments
      label: comments
      hint: null
      type: note
      options: []
      required: false
