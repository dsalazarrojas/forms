inputSchema:
  type: object
  properties:
    title: Employee Performance Appraisal Feedback Form
    pages:
    - id: 1
      name: employee_performance_appraisal_feedback_form
      label: Employee Performance Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: manager_name
      label: Manager Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Sales
      - Marketing
      - Operations
      required: false
    - id: 5
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: feedback_questions
      label: Feedback Questions
      hint: Please rate the performance of your employee in each of the areas listed
        below
      type: select_multiple
      options:
      - Leadership and Initiative
      - Communication
      - Collaboration and Teamwork
      - Problem Solving and Analysis
      - Time Management
      - Adaptability and Flexibility
      - Continuous Improvement
      required: false
    - id: 7
      name: employee_rating
      label: Employee Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: performance_level
      label: Performance Level
      hint: null
      type: select_one
      options:
      - Below Expectations
      - Meets Expectations
      - Exceeds Expectations
      required: false
    - id: 9
      name: development_plan
      label: Development Plan
      hint: null
      type: text
      options: []
      required: false
