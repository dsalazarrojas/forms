inputSchema:
  type: object
  properties:
    title: Employee Performance Appraisal Feedback Form
    pages:
    - id: 1
      name: employee_performance_appraisal_feedback_form
      label: Employee Performance Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: manager_name
      label: Manager Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - '{''id'': 10, ''label'': ''Sales''}'
      - '{''id'': 20, ''label'': ''Marketing''}'
      - '{''id'': 30, ''label'': ''Operations''}'
      required: false
    - id: 5
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: feedback_questions
      label: Feedback Questions
      hint: Please rate the performance of your employee in each of the areas listed
        below
      type: select_multiple
      options:
      - '{''id'': 40, ''label'': ''Leadership and Initiative''}'
      - '{''id'': 50, ''label'': ''Communication''}'
      - '{''id'': 60, ''label'': ''Collaboration and Teamwork''}'
      - '{''id'': 70, ''label'': ''Problem Solving and Analysis''}'
      - '{''id'': 80, ''label'': ''Time Management''}'
      - '{''id'': 90, ''label'': ''Adaptability and Flexibility''}'
      - '{''id'': 100, ''label'': ''Continuous Improvement''}'
      required: false
    - id: 7
      name: employee_rating
      label: Employee Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: performance_level
      label: Performance Level
      hint: null
      type: select_one
      options:
      - '{''id'': 110, ''label'': ''Below Expectations''}'
      - '{''id'': 120, ''label'': ''Meets Expectations''}'
      - '{''id'': 130, ''label'': ''Exceeds Expectations''}'
      required: false
    - id: 9
      name: development_plan
      label: Development Plan
      hint: null
      type: text
      options: []
      required: false
