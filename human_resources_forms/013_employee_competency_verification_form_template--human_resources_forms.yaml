inputSchema:
  type: object
  properties:
    title: Employee Competency Verification Form Template
    pages:
    - id: 1
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: job_description
      label: Job Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: years_of_experience
      label: Years of Experience
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: job_type
      label: Job Type
      hint: null
      type: select_one
      options:
      - Human Resources
      - Marketing
      - Sales
      - Finance
      - Operations
      required: false
    - id: 5
      name: education_details
      label: Education Details
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: skills_and_qualifications
      label: Skills and Qualifications
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: job_references
      label: Job References
      hint: null
      type: select_multiple
      options:
      - Manager
      - Supervisor
      - Colleague
      - Client
      - None
      required: false
    - id: 8
      name: job_satisfaction
      label: Job Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Moderately Satisfied
      - Neutral
      - Moderately Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 9
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
