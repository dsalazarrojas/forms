inputSchema:
  type: object
  properties:
    title: Compensatory Time Off Request Form
    pages:
    - id: 1
      name: comp_time_request_header
      label: -- Compensatory Time Off (Comp Time) Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name_ct
      label: Employee Full Name
      hint: Enter your full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: department_ct
      label: Department
      hint: Your current working department
      type: text
      options: []
      required: true
    - id: 4
      name: manager_name_ct
      label: Approving Manager
      hint: Name of the manager who authorized the original overtime
      type: text
      options: []
      required: true
    - id: 5
      name: overtime_details_section
      label: -- Overtime Worked Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: date_overtime_worked
      label: Date Overtime was Worked
      hint: The specific day the extra hours were performed
      type: date
      options: []
      required: true
    - id: 7
      name: overtime_hours_worked
      label: Number of Overtime Hours Worked
      hint: Enter the total hours (e.g., 4.5)
      type: number
      options: []
      required: true
    - id: 8
      name: reason_for_overtime
      label: Reason for Overtime
      hint: Briefly describe the project or task that required extra hours
      type: text
      options: []
      required: true
    - id: 9
      name: leave_request_section
      label: -- Comp Time Leave Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: proposed_comp_time_date
      label: Proposed Date for Comp Time Off
      hint: When do you wish to use your accrued hours?
      type: date
      options: []
      required: true
    - id: 11
      name: comp_time_hours_requested
      label: Total Hours of Comp Time Requested
      hint: Must not exceed hours worked
      type: number
      options: []
      required: true
    - id: 12
      name: current_comp_balance
      label: Current Accrued Comp Time Balance
      hint: Your existing balance before this request (if known)
      type: number
      options: []
      required: false
    - id: 13
      name: policy_agreement_ct
      label: I understand that comp time must be used within the fiscal year
      hint: Adherence to HR policy
      type: select_one
      options:
      - Yes, I understand
      - Other
      required: true
    - id: 14
      name: ct_request_submission_date
      label: Date of Submission
      hint: Today's date
      type: date
      options: []
      required: true
