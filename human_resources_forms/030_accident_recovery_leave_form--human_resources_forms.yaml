      type: text
      options: []
      required: true
    - id: 4
      name: position_title
      label: Position Title
      hint: Job title of the employee
      type: text
      options: []
      required: true
    - id: 5
      name: supervisor_name
      label: Supervisor Name
      hint: Name of the employee's direct supervisor
      type: text
      options: []
      required: true
    - id: 6
      name: accident_date
      label: Accident Date
      hint: Date when the accident occurred
      type: date
      options: []
      required: true
    - id: 7
      name: accident_location
      label: Accident Location
      hint: Location where the accident occurred
      type: text
      options: []
      required: true
