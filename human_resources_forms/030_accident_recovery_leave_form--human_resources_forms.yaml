inputSchema:
  type: object
  properties:
    title: Accident Recovery Leave Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: Full name of the employee requesting leave
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID
      hint: Employee identification number
      type: text
      options: []
