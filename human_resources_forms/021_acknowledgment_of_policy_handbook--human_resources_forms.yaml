inputSchema:
  type: object
  properties:
    title: Acknowledgment Of Policy Handbook
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: Full name of the employee acknowledging the handbook
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID
      hint: Employee identification number
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department
      hint: Department where the employee works
      type: text
      options: []
      required: true
    - id: 4
      name: job_title
      label: Job Title
      hint: Current position title of the employee
      type: text
      options: []
      required: true
    - id: 5
      name: hire_date
      label: Hire Date
      hint: Date when the employee was hired
      type: date
      options: []
      required: true
    - id: 6
      name: handbook_version
      label: Policy Handbook Version
      hint: Version of the policy handbook acknowledged
      type: text
      options: []
      required: true
    - id: 7
      name: handbook_receipt_date
      label: Date Received Handbook
      hint: Date when the employee received the policy handbook
      type: date
      options: []
      required: true
    - id: 8
      name: acknowledgment_statement
      label: Acknowledgment Statement
      hint: I acknowledge that I have received, read, and understand the policies outlined in the handbook
      type: select_one
      options: ["Yes, I acknowledge and understand", "No, I have not read the handbook"]
      required: true
    - id: 9
      name: compliance_commitment
      label: Commitment to Compliance
      hint: Do you commit to complying with all policies in the handbook
      type: select_one
      options: ["Yes, I commit to compliance", "No, I cannot commit to compliance"]
      required: true
    - id: 10
      name: questions_about_policies
      label: Do You Have Questions About Any Policies
      hint: Indicate if you have questions about any of the policies
      type: select_one
      options: ["Yes, I have questions", "No, I have no questions"]
      required: true
    - id: 11
      name: policy_violation_understanding
      label: Understanding of Policy Violation Consequences
      hint: Do you understand that policy violations may result in disciplinary action
      type: select_one
      options: ["Yes, I understand consequences", "No, I do not understand consequences"]
      required: true
    - id: 12
      name: signature_date
      label: Signature Date
      hint: Date of acknowledgment and signature
      type: date
      options: []
      required: true
    - id: 13
      name: witness_name
      label: Witness Name (HR Representative)
      hint: Name of HR representative witnessing the acknowledgment
      type: text
      options: []
      required: false
    - id: 14
      name: additional_comments
      label: Additional Comments
      hint: Any additional comments about the policy handbook
      type: text
      options: []
      required: false
