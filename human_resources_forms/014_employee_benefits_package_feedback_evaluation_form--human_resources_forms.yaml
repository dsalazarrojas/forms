inputSchema:
  type: object
  properties:
    title: Employee Benefits Package Feedback Evaluation Form
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: section_one
      label: Package Overview
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Finance
      - Marketing
      - Sales
      required: true
    - id: 5
      name: benefits_offered
      label: Benefits Offered
      hint: null
      type: select_multiple
      options:
      - Health Insurance
      - Dental Insurance
      - Vision Insurance
      required: true
    - id: 6
      name: comments
      label: Comments
      hint: Enter any additional comments about your benefits package
      type: text
      options: []
      required: false
    - id: 7
      name: overall_experience
      label: Overall Experience
      hint: null
      type: date
      options: []
      required: true
