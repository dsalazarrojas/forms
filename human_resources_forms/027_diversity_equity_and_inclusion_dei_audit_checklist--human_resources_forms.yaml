inputSchema:
  type: object
  properties:
    title: Diversity, Equity, And Inclusion (DEI) Audit Checklist
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: diversity_efforts
      label: What diversity and inclusion efforts does your organization have in place?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: employee_recruitment
      label: How does your organization attract and hire diverse talent?
      hint: null
      type: select_one
      options:
      - All of the above
      - None of the above
      - Most of the above
      - Some of the above
      - A little of the above
      required: false
    - id: 4
      name: leadership_accountability
      label: How does your organization hold leaders accountable for promoting diversity
        and inclusion?
      hint: null
      type: select_multiple
      options:
      - All of the above
      - Most of the above
      - Some of the above
      - Quarterly reviews
      - Annual reviews
      - Monthly reviews
      - No reviews
      required: false
    - id: 5
      name: training_development
      label: What training and development opportunities are available for employees
        to learn about diversity and inclusion?
      hint: null
      type: select_multiple
      options:
      - All of the above
      - Most of the above
      - Some of the above
      - Diversity and inclusion training
      - Implicit bias training
      - Microaggression training
      - Harassment prevention training
      - Quarterly training
      required: false
    - id: 6
      name: data_and_analytics
      label: Is there access to data and analytics to track diversity and inclusion
