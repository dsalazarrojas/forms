inputSchema:
  type: object
  properties:
    title: Mental Health Treatment Time Off Form
    pages:
    - id: 1
      name: mental_health_treatment_time_off_form
      label: mental_health_treatment_request
      hint: Please provide a detailed description of your mental health treatment.
      type: text
      options: []
      required: false
    - id: 2
      name: mental_health_condition
      label: mental_health_condition
      hint: null
      type: select_one
      options:
      - Anxiety
      - Depression
      - ADHD
      - PTSD
      - Other
      required: true
    - id: 3
      name: treatment_duration
      label: treatment_duration_days
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: treatment_start_date
      label: treatment_start_date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: treatment_end_date
      label: treatment_end_date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: doctor_name
      label: doctor_name
      hint: Please provide the name of your doctor or mental health professional.
      type: text
      options: []
      required: false
    - id: 7
      name: treatment_location
      label: treatment_location
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: mental_health_treatment_plan
      label: treatment_plan_details
      hint: null
      type: text
      options: []
      required: false
