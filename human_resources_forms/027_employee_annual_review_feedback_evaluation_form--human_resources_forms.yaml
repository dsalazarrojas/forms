inputSchema:
  type: object
  properties:
    title: Employee Annual Review Feedback Evaluation Form
    pages:
    - id: 1
      name: employee_name
      label: employee_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: manager_name
      label: manager_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: feedback_questions
      label: feedback_questions
      hint: null
      type: select_multiple
      options:
      - Feedback on job performance
      - Other
      required: false
    - id: 4
      name: employee_review_date
      label: employee_review_date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: review_rating
      label: review_rating
      hint: null
      type: select_one
      options:
      - Outstanding
      - Average
      - Below Average
      required: false
    - id: 6
      name: feedback
      label: feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: development_areas
      label: development_areas
      hint: null
      type: select_multiple
      options:
      - Communication
      - Leadership
      - Time Management
      required: false
    - id: 8
      name: action_plans
      label: action_plans
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: next_review_date
      label: next_review_date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: assigned_to
      label: assigned_to
      hint: null
      type: select_one
      options:
      - chatjimmy
      - johndoe
      - janedoe
      required: false
