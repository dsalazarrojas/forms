inputSchema:
  type: object
  properties:
    title: Workforce Engagement Questionnaire
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: demographic_data
      label: Employee Demographic Data
      hint: null
      type: select_one
      options:
      - '{''label'': ''Male'', ''value'': ''male''}'
      - '{''label'': ''Female'', ''value'': ''female''}'
      - '{''label'': ''Non-Binary'', ''value'': ''non-binary''}'
      - '{''label'': ''Prefer Not To Say'', ''value'': ''prefer_not_to_say''}'
      - '{''label'': ''Other'', ''value'': ''other''}'
      required: true
    - id: 3
      name: job_satisfaction
      label: job_satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: manager_relationship
      label: How would you rate your relationship with your manager?
      hint: null
      type: select_one
      options:
      - '{''label'': ''Very good'', ''value'': ''very_good''}'
      - '{''label'': ''Good'', ''value'': ''good''}'
      - '{''label'': ''Fair'', ''value'': ''fair''}'
      - '{''label'': ''Poor'', ''value'': ''poor''}'
      - '{''label'': ''Very poor'', ''value'': ''very_poor''}'
      required: true
    - id: 5
      name: communication
      label: communication
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: work_life_balance
      label: Work life balance
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
