inputSchema:
  type: object
  properties:
    title: Workforce Engagement Questionnaire
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: demographic_data
      label: Employee Demographic Data
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      - Prefer Not To Say
      - Other
      required: true
    - id: 3
      name: job_satisfaction
      label: job_satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: manager_relationship
      label: How would you rate your relationship with your manager?
      hint: null
      type: select_one
      options:
      - Very good
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 5
      name: communication
      label: communication
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: work_life_balance
      label: Work life balance
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
