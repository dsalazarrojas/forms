inputSchema:
  type: object
  properties:
    title: Human System Pressure Assessment
    pages:
    - id: 1
      name: workplace_pressure
      label: What is the current state of workplace pressure?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: work_pressure_level
      label: Select the current pressure level
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 3
      name: work_pressure_duration
      label: How long has this pressure been present?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: team_pressure
      label: How many team members report feeling pressure?
      hint: null
      type: select_multiple
      options:
      - Many
      - Few
      - None
      required: false
    - id: 5
      name: manager_pressure
      label: How many managers report feeling pressure?
      hint: null
      type: select_multiple
      options:
      - Many
      - Few
      - None
      required: false
    - id: 6
      name: work_life_balance
      label: Do you have a healthy work-life balance?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: employee_support
      label: How often do you receive employee support?
      hint: null
      type: select_one
      options:
      - Often
      - Occasionally
      - Rarely
      required: false
    - id: 8
      name: work_family_life
      label: How do you handle work-family conflicts?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: work_health
      label: Are you experiencing any health issues due to work pressure?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: stress_management
      label: What stress management techniques are you using?
      hint: null
      type: select_multiple
      options:
      - Mindfulness
      - Exercise
      - Meditation
      required: false
    - id: 11
      name: manager_support
      label: How often do you receive manager support?
      hint: null
      type: select_one
      options:
      - Often
      - Occasionally
      - Rarely
      required: false
    - id: 12
      name: employee_pressure_sources
      label: What causes pressure at work?
      hint: null
      type: select_multiple
      options:
      - Workload
      - Workload/Deadlines
      - Workload/Deadlines and Workload/Work-life balance
      - Workload/Deadlines and Work-life balance
      - Other
      required: false
    - id: 13
      name: work_environment
      label: What is the most stressful work environment aspect?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: team_dysfunction
      label: What causes team dysfunction?
      hint: null
      type: select_multiple
      options:
      - Communication problems
      - Conflicting interests
      - Other
      required: false
    - id: 15
      name: work_schedules
      label: Are you satisfied with work schedules?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 16
      name: work_space
      label: Is your work space comfortable?
      hint: null
      type: select_one
      options:
      - Very comfortable
      - Somewhat comfortable
      - Neutral
      - Somewhat uncomfortable
      - Very uncomfortable
      required: false
    - id: 17
      name: team_leadership
      label: How would you rate team leadership?
      hint: null
      type: select_one
      options:
      - Very effective
      - Somewhat effective
      - Neutral
      - Somewhat ineffective
      - Very ineffective
      required: false
    - id: 18
      name: work_equipment
      label: Is your work equipment adequate?
      hint: null
      type: select_one
      options:
      - Very adequate
      - Somewhat adequate
      - Neutral
      - Somewhat inadequate
      - Very inadequate
      required: false
    - id: 19
      name: work_life_balance_adequate
      label: Is work life balance adequate?
      hint: null
      type: select_one
      options:
      - Very adequate
      - Somewhat adequate
      - Neutral
      - Somewhat inadequate
      - Very inadequate
      required: false
    - id: 20
      name: team_dysfunction_causes
      label: What causes team dysfunction?
      hint: null
      type: select_multiple
      options:
      - Communication problems
      - Conflicting interests
      - Other
      required: false
    - id: 21
      name: work_schedules_satisfaction
      label: Satisfaction with work schedules?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 22
      name: employee_satisfaction
      label: How satisfied are you with your current role?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 23
      name: work_pressure_reduction
      label: How do you reduce work pressure?
      hint: null
      type: select_multiple
      options:
      - Mindfulness
      - Exercise
      - Meditation
      required: false
    - id: 24
      name: work_environment_satisfaction
      label: How satisfied are you with the work environment?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 25
      name: employee_satisfaction_adequate
      label: Is employee satisfaction adequate?
      hint: null
      type: select_one
      options:
      - Very adequate
      - Somewhat adequate
      - Neutral
      - Somewhat inadequate
      - Very inadequate
      required: false
