      options: []
      required: true
    - id: 6
      name: quotation_price
      label: Quotation Price
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 10
