inputSchema:
  type: object
  properties:
    title: Job Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: job_title
      label: Job Title
      hint: null
      type: select_one
      options:
      - Software Engineer
      - Data Scientist
      - Product Manager
      required: false
    - id: 5
      name: job_description
      label: Job Description
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: resume_upload
      label: Resume Upload
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: apply_date
      label: Apply Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: apply_time
      label: Apply Time
      hint: null
      type: time
      options: []
      required: false
