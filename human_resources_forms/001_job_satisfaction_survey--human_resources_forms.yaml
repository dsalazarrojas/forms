inputSchema:
  type: object
  properties:
    title: Job Satisfaction Survey
    pages:
    - id: 1
      name: employee_survey
      label: Employee Feedback
      hint: Please provide feedback on your overall job satisfaction.
      type: text
      options: []
      required: false
    - id: 2
      name: job_satisfaction_scale
      label: Job Satisfaction
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: manager_support
      label: Manager Support
      hint: null
      type: select_multiple
      options:
      - Strongly Support
      - Somewhat Support
      - Neutral
      - Somewhat Neutral
      - Not Support
      - Not at all
      required: true
    - id: 4
      name: manager_communication
      label: Manager Communication
      hint: null
      type: select_multiple
      options:
      - Often
      - Sometimes
      - Rarely
      - Never
      required: true
    - id: 5
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Human Resources
      - Marketing
      - Sales
      - Other
      required: true
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: job_satisfaction_level
      label: Job Satisfaction Level
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 9
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: manager_rating
      label: Manager Rating
      hint: null
      type: number
      options: []
      required: false
