inputSchema:
  type: object
  properties:
    title: Employer Branding Self-Assessment
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: introduction
      label: What are your current thoughts about the company's employer brand?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: introduction
      label: How would you rate the company's employer brand right now?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: introduction
      label: What are three key strengths of the company's employer brand?
      hint: null
      type: select_multiple
      options:
      - company culture
      - employee experience
      - employer brand reputation
      required: false
    - id: 5
      name: introduction
      label: What are three key areas for improvement?
      hint: null
      type: select_multiple
      options:
      - company culture
      - employee experience
      - employer brand reputation
      required: false
    - id: 6
      name: contact_information
      label: Contact Information
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: contact
      label: What is your role in the company?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact
      label: What is your department?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact
      label: Which of the following best describes your work relationship with this
        company?
      hint: null
      type: select_one
      options:
      - Current employee
      - Former employee
      - Contractor
      - Other
      required: false
    - id: 10
      name: contact
      label: How do you prefer to be contacted about this survey?
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - In-person
      - Other
      required: false
    - id: 11
      name: contact
      label: Do you have any other comments about this survey or the company's employer
        brand?
      hint: null
      type: text
      options: []
      required: false
