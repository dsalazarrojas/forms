inputSchema:
  type: object
  properties:
    title: Employee Idea Submission Feedback Evaluation Form
    pages:
    - id: 1
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: submitted_by
      label: Submitted By
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: submitted_to
      label: Submitted To
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: idea_status
      label: Idea Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Approved
      - Rejected
      - On Hold
      required: true
    - id: 10
      name: idea_category
      label: Idea Category
      hint: null
      type: select_multiple
      options:
      - General
      - Product Development
      - Marketing
      - Finance
      - IT
      required: true
    - id: 11
      name: submitted_time
      label: Submitted Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: feedback_date
      label: Feedback Date
      hint: null
      type: date
      options: []
      required: false
