inputSchema:
  type: object
  properties:
    title: performance_review_appointment_form
    pages:
    - id: 1
      name: performance_review_appointment_form_page_1
      label: select_review_type
      hint: Select the review type
      type: select_one
      options:
      - Formal Review
      - Informal Review
      required: false
    - id: 2
      name: performance_review_appointment_form_page_2
      label: select_manager
      hint: null
      type: select_one
      options:
      - Manager 1
      - Manager 2
      - Manager 3
      required: false
    - id: 3
      name: performance_review_appointment_form_page_3
      label: select_employee
      hint: null
      type: select_one
      options:
      - Employee 1
      - Employee 2
      - Employee 3
      required: false
    - id: 4
      name: performance_review_appointment_form_page_4
      label: select_date
      hint: null
      type: select_multiple
      options:
      - Date 1
      - Date 2
      - Date 3
      required: false
    - id: 5
      name: performance_review_appointment_form_page_5
      label: select_time
      hint: null
      type: select_multiple
      options:
      - Time 1
      - Time 2
      - Time 3
      required: false
    - id: 6
      name: add_notes
      label: add_notes
      hint: Add notes
      type: note
      options: []
      required: false
    - id: 7
      name: review_schedule
      label: review_schedule
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: review_status
      label: review_status
      hint: Review status
      type: select_one
      options:
      - Not Started
      - In Progress
      - Done
      required: false
