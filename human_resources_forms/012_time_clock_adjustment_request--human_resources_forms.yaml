inputSchema:
  type: object
  properties:
    title: Time Clock Adjustment Request
    pages:
    - id: 1
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: adjustment_type
      label: Adjustment Type
      hint: null
      type: select_one
      options:
      - Time Off
      - Pay Adjustment
      - Work Adjustment
      required: true
    - id: 6
      name: reason
      label: Reason
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: manager_approval
      label: Manager Approval
      hint: null
      type: select_multiple
      options:
      - Approve
      - Deny
      required: true
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: submitter
      label: Submitter
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: submit_date
      label: Submit Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: submit_time
      label: Submit Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Approved
      - Pending
      - Declined
      required: false
