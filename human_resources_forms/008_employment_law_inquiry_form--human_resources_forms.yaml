inputSchema:
  type: object
  properties:
    title: employment_law_inquiry_form
    pages:
    - id: 1
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employment_type
      label: employment_type
      hint: Select the type of employment you are inquiring about
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: employment_status
      label: Employment Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
    - id: 4
      name: employment_status_hint
      label: Select the employment status you are inquiring about
      hint: null
      type: select_multiple
      options:
      - Employed
      - Unemployed
      - Student
      - Other (please specify)
      required: false
    - id: 5
      name: employment_law_area
      label: Employment Law Area
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: employment_law_area_hint
      label: Select the employment law area you are inquiring about
      hint: null
      type: select_one
      options:
      - Employment Contracts
      - Employment Benefits
      - Employment Discrimination
      - Family and Medical Leave
      required: false
    - id: 7
      name: employment_issue
      label: Employment Issue
      hint: null
      type: text
      options: []
      required: false
