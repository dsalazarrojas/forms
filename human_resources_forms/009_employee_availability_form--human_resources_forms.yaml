inputSchema:
  type: object
  properties:
    title: Employee Availability Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: available_days
      label: Available Days
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: false
    - id: 7
      name: start_time_am_pm
      label: Start Time (AM/PM)
      hint: null
      type: select_one
      options:
      - AM
      - PM
      required: false
    - id: 8
      name: end_time_am_pm
      label: End Time (AM/PM)
      hint: null
      type: select_one
      options:
      - AM
      - PM
      required: false
    - id: 9
      name: available_days_other
      label: Other
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: shift_length
      label: Shift Length
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: break_length
      label: Break Length
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: work_hours
      label: Work Hours
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: break
      label: Break
      hint: null
      type: select_one
      options:
      - None
      - 30 minutes
      - 60 minutes
      - 90 minutes
      required: false
    - id: 14
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: manager_name
      label: Manager Name
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: manager_email
      label: Manager Email
      hint: null
      type: email
      options: []
      required: false
    - id: 17
      name: manager_phone
      label: Manager Phone
      hint: null
      type: text
      options: []
      required: false
