inputSchema:
  type: object
  properties:
    title: Company Credit Card Issuance Form
    pages:
    - id: 1
      name: employee_full_name
      label: Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID Number
      hint: Your employee ID
      type: text
      options: []
      required: true
    - id: 3
      name: employee_email
      label: Email Address
      hint: Company email
      type: email
      options: []
      required: true
    - id: 4
      name: employee_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: department
      label: Department
      hint: Your department
      type: text
      options: []
      required: true
    - id: 6
      name: job_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: true
    - id: 7
      name: manager_name
      label: Manager/Supervisor Name
      hint: Direct supervisor
      type: text
      options: []
      required: true
    - id: 8
      name: manager_email
      label: Manager Email
      hint: For approval
      type: email
      options: []
      required: true
    - id: 9
      name: hire_date
      label: Hire Date
      hint: When you were hired
      type: date
      options: []
      required: true
    - id: 10
      name: employment_status
      label: Employment Status
      hint: Current status
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      - Temporary
      required: true
    - id: 11
      name: request_type
      label: Request Type
      hint: Type of card request
      type: select_one
      options:
      - New Card
      - Replacement Card
      - Limit Increase
      - Additional Card
      required: true
    - id: 12
      name: card_type_requested
      label: Type of Card Requested
      hint: Card level
      type: select_one
      options:
      - Standard Corporate Card
      - Gold Corporate Card
      - Platinum Corporate Card
      - Purchasing Card (P-Card)
      - Travel Card
      - Executive Card
      required: true
    - id: 13
      name: business_justification
      label: Business Justification
      hint: Why do you need a corporate card?
      type: text
      options: []
      required: true
    - id: 14
      name: expected_monthly_spend
      label: Expected Monthly Spend
      hint: Estimated amount
      type: select_one
      options:
      - Under $1,000
      - $1,000-$2,500
      - $2,501-$5,000
      - $5,001-$10,000
      - $10,001-$25,000
      - Over $25,000
      required: true
    - id: 15
      name: requested_credit_limit
      label: Requested Credit Limit
      hint: In dollars
      type: number
      options: []
      required: true
    - id: 16
      name: primary_use
      label: Primary Use of Card
      hint: Main purpose
      type: select_multiple
      options:
      - Travel expenses
      - Client entertainment
      - Office supplies
      - Software subscriptions
      - Conference registrations
      - Emergency purchases
      - Vendor payments
      - Other
      required: true
    - id: 17
      name: expense_categories
      label: Expense Categories You Will Use
      hint: Select all that apply
      type: select_multiple
      options:
      - Airfare
      - Hotel
      - Car rental
      - Meals
      - Ground transportation
      - Office equipment
      - Professional services
      - Training and education
      - Other
      required: false
    - id: 18
      name: previous_card_history
      label: Have you had a corporate card before?
      hint: Prior card history
      type: select_one
      options:
      - No, first time
      - Yes, with this company
      - Yes, with previous employer
      required: true
    - id: 19
      name: previous_card_issues
      label: If yes, were there any issues with previous card?
      hint: Any problems
      type: text
      options: []
      required: false
    - id: 20
      name: card_delivery_method
      label: How should the card be delivered?
      hint: Delivery preference
      type: select_one
      options:
      - Mail to home address
      - Mail to office
      - Pick up at HR
      - Pick up at Finance
      required: true
    - id: 21
      name: home_address
      label: Home Address (if mailing to home)
      hint: Street, city, state, zip
      type: text
      options: []
      required: false
    - id: 22
      name: name_on_card
      label: Name as it should appear on card
      hint: Exactly as you want it
      type: text
      options: []
      required: true
    - id: 23
      name: section_agreement
      label: -- Cardholder Agreement --
      hint: Please read and acknowledge
      type: note
      options: []
      required: false
    - id: 24
      name: agree_card_policy
      label: I have read and understand the corporate card policy
      hint: Policy acknowledgment
      type: select_one
      options:
      - Yes, I Agree
      - No, I Need to Review
      required: true
    - id: 25
      name: agree_personal_use
      label: I understand the card is for business use only
      hint: No personal use
      type: select_one
      options:
      - Yes, I Understand
      - No, I Do Not Understand
      required: true
    - id: 26
      name: agree_timely_reporting
      label: I agree to submit expense reports within required timeframe
      hint: Timely submission
      type: select_one
      options:
      - Yes, I Agree
      - No, I Do Not Agree
      required: true
    - id: 27
      name: agree_receipts
      label: I agree to retain all receipts and documentation
      hint: Record keeping
      type: select_one
      options:
      - Yes, I Agree
      - No, I Do Not Agree
      required: true
    - id: 28
      name: agree_card_security
      label: I agree to keep the card secure and report loss immediately
      hint: Card security
      type: select_one
      options:
      - Yes, I Agree
      - No, I Do Not Agree
      required: true
    - id: 29
      name: agree_consequences
      label: I understand that misuse may result in disciplinary action
      hint: Consequences of misuse
      type: select_one
      options:
      - Yes, I Understand
      - No, I Do Not Understand
      required: true
    - id: 30
      name: section_manager
      label: -- Manager Approval --
      hint: To be completed by manager
      type: note
      options: []
      required: false
    - id: 31
      name: manager_approval_status
      label: Manager Approval
      hint: Approval status
      type: select_one
      options:
      - Pending
      - Approved
      - Denied
      required: false
    - id: 32
      name: manager_approval_date
      label: Manager Approval Date
      hint: Date of approval
      type: date
      options: []
      required: false
    - id: 33
      name: manager_comments
      label: Manager Comments
      hint: Any notes
      type: text
      options: []
      required: false
    - id: 34
      name: section_finance
      label: -- Finance Review --
      hint: For finance use
      type: note
      options: []
      required: false
    - id: 35
      name: finance_approval_status
      label: Finance Approval
      hint: Finance review
      type: select_one
      options:
      - Pending
      - Approved
      - Denied
      required: false
    - id: 36
      name: card_issued_date
      label: Card Issued Date
      hint: When card was issued
      type: date
      options: []
      required: false
    - id: 37
      name: card_last_four
      label: Card Last Four Digits
      hint: For records
      type: text
      options: []
      required: false
    - id: 38
      name: employee_signature
      label: Employee Signature
      hint: Electronic signature
      type: text
      options: []
      required: true
    - id: 39
      name: request_date
      label: Request Date
      hint: Today's date
      type: date
      options: []
      required: true
