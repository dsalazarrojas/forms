inputSchema:
  type: object
  properties:
    title: Staff Longevity And Attrition Survey
    pages:
    - id: 1
      name: survey_start
      label: What is the purpose of this survey?
      hint: Please answer this question honestly
      type: text
      options: []
      required: false
    - id: 2
      name: staff_survey
      label: How long have you been with this company?
      hint: In years
      type: number
      options: []
      required: false
    - id: 3
      name: reason_for_leave
      label: What are the main reasons you would leave your job?
      hint: null
      type: select_multiple
      options:
      - Poor working conditions
      - No career development
      - No salary increase
      - No benefits
      required: false
    - id: 4
      name: job_satisfaction
      label: How satisfied are you with your job?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: false
    - id: 5
      name: manager_survey
      label: How often do you have positive interactions with your manager?
      hint: Scale of 1-5
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 6
      name: feedback
      label: Do you have any additional feedback?
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: org_change
      label: How often do you see changes in the organization?
      hint: null
      type: select_multiple
      options:
      - Often
      - Rarely
      - Never
      required: false
    - id: 8
      name: org_change_type
      label: What kind of changes have you seen in the organization?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Yearly
      required: false
