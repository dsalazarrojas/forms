inputSchema:
  type: object
  properties:
    title: Human Resources Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: job_type
      label: Job Type
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Temporary
      required: false
    - id: 6
      name: job_description
      label: Job Description
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: work_experience
      label: Work Experience (years)
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: education
      label: Education
      hint: null
      type: select_multiple
      options:
      - High School
      - Bachelor's Degree
      - Master's Degree
      - Ph.D.
      - Other
      required: false
    - id: 9
      name: skills
      label: Skills
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: certifications
      label: Certifications
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: work_status
      label: Work Status
      hint: null
      type: select_one
      options:
      - Employed
      - Self-Employed
      - Unemployed
      - Other
      required: false
    - id: 12
      name: job_start_date
      label: Job Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: job_end_date
      label: Job End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
