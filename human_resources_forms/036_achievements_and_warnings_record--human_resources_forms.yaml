inputSchema:
  type: object
  properties:
    title: Achievements And Warnings Record
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: record_type
      label: Record Type
      hint: Select the nature of this entry
      type: select_one
      options:
      - Achievement / Award
      - Performance Warning
      - Behavioral Warning
      - Policy Violation
      required: true
    - id: 4
      name: date_of_incident_or_achievement
      label: Date of Incident or Achievement
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: title_of_record
      label: Title of Record
      hint: e.g., Sales Milestone Q3, Attendance Warning
      type: text
      options: []
      required: true
    - id: 6
      name: detailed_description
      label: Detailed Description
      hint: Provide specific facts and context
      type: text
      options: []
      required: true
    - id: 7
      name: severity_level
      label: Severity Level
      hint: null
      type: select_one
      options:
      - Low
      - Moderate
      - High
      - Critical
      required: true
    - id: 8
      name: witnesses_involved
      label: Witnesses Involved
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - Manager
      - HR Representative
      - Peer
      - External Party
      required: false
    - id: 9
      name: action_taken_or_reward_given
      label: Action Taken or Reward Given
      hint: e.g., Written Warning, 500 dollar Bonus
      type: text
      options: []
      required: true
    - id: 10
      name: follow_up_date_required
      label: Follow-up Date Required
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: manager_signature
      label: Manager Signature
      hint: Type name to sign
      type: text
      options: []
      required: true
    - id: 12
      name: employee_acknowledgment_signature
      label: Employee Acknowledgment Signature
      hint: Employee confirms receipt of record
      type: text
      options: []
      required: false
