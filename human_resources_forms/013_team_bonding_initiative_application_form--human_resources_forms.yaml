inputSchema:
  type: object
  properties:
    title: team_bonding_initiative_application_form
    pages:
    - id: 1
      name: team_bonding_initiative_application_form_page_1
      label: Team Bonding Initiative Application
      hint: Please answer the following questions
      type: text
      options: []
      required: true
    - id: 2
      name: team_bonding_initiative_application_form_page_2
      label: Your Role in the Team
      hint: Please specify your role in the team
      type: select_multiple
      options:
      - Team Member
      - Team Lead
      - Manager
      - Other (please specify)
      required: false
    - id: 3
      name: team_bonding_initiative_application_form_page_3
      label: Department/ Area of Focus
      hint: Please select your department/area of focus
      type: select_one
      options:
      - Sales
      - Marketing
      - IT
      - Finance
      - Operations
      required: false
    - id: 4
      name: team_bonding_initiative_application_form_page_4
      label: Team Bonding Initiative Application Form Page 4
      hint: Please provide your application details
      type: note
      options: []
      required: true
    - id: 5
      name: team_bonding_initiative_application_form_page_5
      label: Available Dates
      hint: Please select your available dates
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: false
    - id: 6
      name: team_bonding_initiative_application_form_page_6
      label: Previous Team Bonding Activities
      hint: Please specify the number of previous activities you participated in
      type: number
      options: []
      required: true
    - id: 7
      name: team_bonding_initiative_application_form_page_7
      label: Preferred Activities
      hint: Please select all that apply
      type: select_multiple
      options:
      - Team sports
      - Group games
      - Escape room
      - Scavenger hunt
      - Creative workshop
      - Outdoor adventure
      required: false
    - id: 8
      name: team_bonding_initiative_application_form_page_8
      label: Availability
      hint: Please select your availability
      type: time
      options: []
      required: true
    - id: 9
      name: team_bonding_initiative_application_form_page_9
      label: Communication Preferences
      hint: Please select your preferred method of communication
      type: select_multiple
      options:
      - Phone
      - Email
      - Text
      - In-app
      required: false
    - id: 10
      name: team_bonding_initiative_application_form_page_10
      label: Emergency Contact
      hint: Please provide your emergency contact information
      type: note
      options: []
      required: true
    - id: 11
      name: team_bonding_initiative_application_form_page_11
      label: Multi-Department Team
      hint: Are you available to work with a team with members from different departments?
