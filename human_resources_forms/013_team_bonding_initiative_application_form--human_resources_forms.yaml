      options:
      - Option A
      - Option B
      required: true
    - id: 12
      name: team_bonding_initiative_application_form_page_12
      label: Previous Team Building Activities
      hint: Have you participated in any team building activities?
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 13
      name: team_bonding_initiative_application_form_page_13
      label: Interested Activities
      hint: Which of the following activities would you be interested in?
      type: select_multiple
      options:
      - Team-building workshop
      - Group discussion
      - Creative projects
      - Volunteering
      - Team sports
      - Team game night
      required: false
    - id: 14
      name: team_bonding_initiative_application_form_page_14
      label: Medical Conditions
      hint: Are there any medical conditions or disabilities we should be aware of?
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
