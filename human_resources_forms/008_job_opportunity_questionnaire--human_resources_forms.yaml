inputSchema:
  type: object
  properties:
    title: Job Opportunity Questionnaire
    pages:
    - id: 1
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: job_type
      label: job_type
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      - Internship
      required: true
    - id: 3
      name: job_category
      label: job_category
      hint: null
      type: select_multiple
      options:
      - Sales
      - Marketing
      - Customer Service
      - Software Development
      - Other
      required: true
    - id: 4
      name: job_level
      label: Job Level
      hint: null
      type: select_one
      options:
      - Entry Level
      - Mid-level
      - Senior
      required: true
    - id: 5
      name: job_location
      label: Job Location
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: job_start_date
      label: Job Start Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: false
    - id: 7
      name: job_end_date
      label: Job End Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: false
    - id: 8
      name: job_description
      label: Job Description
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: job_responsibilities
      label: Job Responsibilities
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: job_requirements
      label: Job Requirements
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: candidate_resume
      label: Candidate Resume
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: role_preferences
      label: Role Preferences
      hint: null
      type: text
      options: []
      required: false
