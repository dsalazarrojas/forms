      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: incident_type
      label: Incident Type
      hint: null
      type: select_one
      options:
      - Type 1
      - Type 2
      - Type 3
      required: true
    - id: 3
      name: incident_location
      label: Incident Location
      hint: null
      type: text
      options: []
      required: false
