      options:
      - Status 1
      - Status 2
      - Status 3
      required: true
    - id: 6
      name: incident_investigation
      label: Incident Investigation
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: incident_outcome
      label: Incident Outcome
      hint: null
      type: select_one
      options:
      - Outcome 1
      - Outcome 2
      required: false
    - id: 8
      name: incident_reviewer
      label: Incident Reviewer
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: incident_review_date
