      type: number
      options: []
      required: true
    - id: 6
      name: actual_outcome
      label: Actual Outcome
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: date_completed
      label: Date Completed
      hint: null
      type: date
      options: []
