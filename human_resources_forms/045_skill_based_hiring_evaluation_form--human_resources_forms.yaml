      options:
      - Intern
      - Junior
      - Mid-level
      - Senior
      required: true
    - id: 5
      name: required_skills
      label: Required Skills
      hint: null
      type: select_multiple
      options:
      - Business Acumen
      - Communication
      - Leadership
      - Problem Solving
      - Time Management
      required: true
    - id: 6
      name: technical_skills
      label: Technical Skills
      hint: null
      type: select_multiple
      options:
