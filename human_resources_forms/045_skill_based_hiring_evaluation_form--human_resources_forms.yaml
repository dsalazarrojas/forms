inputSchema:
  type: object
  properties:
    title: Skill Based Hiring Evaluation Form
    pages:
    - id: 1
      name: candidate
      label: Candidate
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: candidate_skills
      label: Candidate Skills
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: job_title
      label: Job Title
      hint: null
      type: select_one
      options:
      - Account Manager
      - Business Analyst
      - Data Analyst
      - Data Scientist
      - Data Specialist
      - IT Project Manager
      - Project Coordinator
      - Project Manager
      - Researcher
      - Scientist
      required: true
    - id: 4
      name: job_level
      label: Job Level
      hint: null
