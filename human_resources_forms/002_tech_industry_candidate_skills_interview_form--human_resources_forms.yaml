inputSchema:
  type: object
  properties:
    title: Tech Industry Candidate Skills Interview Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: skills
      label: Skills
      hint: null
      type: select_multiple
      options:
      - Programming
      - Soft Skills
      required: false
    - id: 4
      name: experience
      label: Experience
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: bachelor_degree
      label: Bachelor Degree
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: masters_degree
      label: Masters Degree
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: Email
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
