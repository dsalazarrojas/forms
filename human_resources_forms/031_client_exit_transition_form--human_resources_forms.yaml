inputSchema:
  type: object
  properties:
    title: Client Exit Transition Form
    pages:
    - id: 1
      name: client_first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: client_last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: false
    - id: 5
      name: company_name
      label: Company Name
      hint: Your business name
      type: text
      options: []
      required: false
    - id: 6
      name: account_manager
      label: Account Manager Name
      hint: Your primary contact
      type: text
      options: []
      required: false
    - id: 7
      name: service_type
      label: Service Type Being Discontinued
      hint: What service are you ending?
      type: select_one
      options:
      - Consulting Services
      - Software Subscription
      - Support Services
      - Training Services
      - Maintenance Services
      - Professional Services
      - Other
      required: true
    - id: 8
      name: client_since_date
      label: Client Since Date
      hint: When did you start with us?
      type: date
      options: []
      required: true
    - id: 9
      name: exit_date
      label: Desired Exit Date
      hint: When do you want to end services?
      type: date
      options: []
      required: true
    - id: 10
      name: exit_reason_primary
      label: Primary Reason for Leaving
      hint: Main reason for departure
      type: select_one
      options:
      - Cost or Pricing
      - Service Quality Issues
      - Found Alternative Provider
      - Business Closure
      - Change in Business Needs
      - Budget Cuts
      - Poor Customer Support
      - Lack of Features
      - Other
      required: true
    - id: 11
      name: exit_reason_details
      label: Please Elaborate on Your Reason
      hint: More details about your decision
      type: text
      options: []
      required: false
    - id: 12
      name: satisfaction_overall
      label: Overall Satisfaction During Your Time as a Client
      hint: Your overall experience
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 13
      name: service_quality_rating
      label: Service Quality Rating
      hint: Quality of services provided
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: value_for_money
      label: Value for Money
      hint: Was it worth the cost?
      type: select_one
      options:
      - Excellent Value
      - Good Value
      - Fair Value
      - Poor Value
      - Very Poor Value
      required: true
    - id: 15
      name: support_rating
      label: Customer Support Rating
      hint: Quality of support received
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 16
      name: alternative_provider
      label: Are You Switching to a Competitor?
      hint: If applicable
      type: select_one
      options:
      - true
      - false
      - Prefer Not to Say
      required: false
    - id: 17
      name: competitor_name
      label: Competitor Name
      hint: If you are comfortable sharing
      type: text
      options: []
      required: false
    - id: 18
      name: competitor_advantage
      label: What Does the Competitor Offer That We Do Not?
      hint: Their advantage
      type: text
      options: []
      required: false
    - id: 19
      name: improvement_suggestions
      label: What Could We Have Done Differently?
      hint: Suggestions for improvement
      type: text
      options: []
      required: false
    - id: 20
      name: outstanding_issues
      label: Are There Any Outstanding Issues?
      hint: Unresolved problems
      type: text
      options: []
      required: false
    - id: 21
      name: data_transfer_needed
      label: Do You Need Your Data Transferred?
      hint: Data portability
      type: select_one
      options:
      - Yes, Please Transfer
      - Yes, I Will Download
      - No, You May Delete
      - Not Sure
      required: true
    - id: 22
      name: data_transfer_method
      label: Preferred Data Transfer Method
      hint: If applicable
      type: select_one
      options:
      - Email
      - Secure Download
      - Physical Drive
      - Direct Transfer to New Provider
      - Not Applicable
      required: false
    - id: 23
      name: final_invoice_understanding
      label: I Understand I Will Receive a Final Invoice
      hint: Billing acknowledgment
      type: select_one
      options:
      - I Understand
      - I Do Not Understand
      required: true
    - id: 24
      name: return_to_us
      label: Would You Consider Returning as a Client?
      hint: Future possibility
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Undecided
      - Probably No
      - Definitely No
      required: true
    - id: 25
      name: recommend_to_others
      label: Would You Recommend Us to Others?
      hint: Despite leaving
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Undecided
      - Probably No
      - Definitely No
      required: true
    - id: 26
      name: additional_comments
      label: Additional Comments
      hint: Any final thoughts
      type: text
      options: []
      required: false
    - id: 27
      name: exit_interview_requested
      label: Would You Like to Participate in an Exit Interview?
      hint: Optional discussion
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 28
      name: form_completion_date
      label: Form Completion Date
      hint: null
      type: date
      options: []
      required: true
