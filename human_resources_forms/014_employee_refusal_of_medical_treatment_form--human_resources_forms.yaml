inputSchema:
  type: object
  properties:
    title: Employee Refusal Of Medical Treatment Form
    pages:
    - id: 1
      name: employee_refusal_of_medical_treatment_form
      label: Employee Refusal Of Medical Treatment Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: medical_treatment_details
      label: Medical Treatment Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: employee_acknowledgement
      label: Employee Acknowledgement
      hint: null
      type: select_one
      options:
      - I understand the risks of refusal of medical treatment
      - I do not understand the risks of refusal of medical treatment
      required: false
    - id: 4
      name: employer_acknowledgement
      label: Employer Acknowledgement
      hint: null
      type: select_multiple
      options:
      - I am the line manager for this employee
      - I am not the line manager for this employee
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date_of_refusal
      label: Date Of Refusal
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time_of_refusal
      label: Time Of Refusal
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: employee_signature
      label: Employee Signature
      hint: null
      type: text
      options: []
      required: false
