inputSchema:
  type: object
  properties:
    title: Tax Equalization Inquiry Request Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: inquiry_type
      label: Inquiry Type
      hint: null
      type: select_one
      options:
      - Tax Refund
      - Tax Credit
      - Tax Exemption
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: tax_year
      label: Tax Year
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: inquiry_date
      label: Date of Inquiry
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: inquiry_details
      label: Inquiry Details
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: assigned_user
      label: Assigned User
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Pending
      - Completed
      - Declined
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
