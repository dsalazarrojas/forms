inputSchema:
  type: object
  properties:
    title: Non Exempt Employee Dual Service Request Form
    pages:
    - id: 1
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Human-Resources Forms
      - Other
      required: true
    - id: 2
      name: description
      label: Description
      hint: Briefly describe the dual service request
      type: text
      options: []
      required: true
    - id: 3
      name: assigned_to
      label: Assigned to
      hint: null
      type: select_multiple
      options:
      - John
      - Jane
      - Other
      required: true
    - id: 4
      name: date
      label: Date
      hint: Enter date in YYYY-MM-DD format
      type: date
      options: []
      required: true
    - id: 5
      name: time
      label: Time
      hint: 24h format
      type: time
      options: []
      required: true
    - id: 6
      name: submitted_by
      label: Submitted by
      hint: null
      type: select_one
      options:
      - John
      - Jane
      - Other
      required: true
    - id: 7
      name: note
      label: Note
      hint: Additional comments
      type: note
      options: []
      required: true
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Pending
      - Approved
      - Rejected
      required: true
    - id: 11
      name: output_file
      label: Output File
      hint: null
      type: select_one
      options:
      - 022 non exempt employee dual service request form--human resources forms.yaml
      - 022 non exempt employee dual service request form--hrforms.yaml
      required: true
    - id: 12
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_multiple
      options:
      - chatjimmy
      - other
      required: true
