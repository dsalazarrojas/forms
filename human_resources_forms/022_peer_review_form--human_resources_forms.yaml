inputSchema:
  type: object
  properties:
    title: Peer Review Form
    pages:
    - id: 1
      name: reviewer_name
      label: Reviewer Name
      hint: Please enter your name
      type: text
      options: []
      required: true
    - id: 2
      name: review_date
      label: Review Date
      hint: Date of the review
      type: date
      options: []
      required: true
    - id: 3
      name: rating
      label: Rating
      hint: Rate the submission out of 5
      type: select_one
      options:
      - Very satisfied
      - Neutral
      - Dissatisfied
      required: true
    - id: 4
      name: comments
      label: Comments
      hint: Add any comments
      type: note
      options: []
      required: false
    - id: 5
      name: reviewer_email
      label: Reviewer Email
      hint: Enter your email
      type: email
      options: []
      required: true
    - id: 6
      name: submission_date
      label: Submission Date
      hint: Date of the submission
      type: date
      options: []
      required: true
    - id: 7
      name: submission_status
      label: Submission Status
      hint: Status of the submission
      type: select_one
      options:
      - pending
      - approved
      - rejected
      required: true
    - id: 8
      name: work_reviewed
      label: Work Reviewed
      hint: Choose the work being reviewed
      type: select_multiple
      options:
      - work 1
      - work 2
      - work 3
      - work 4
      required: true
    - id: 9
      name: reviewer_signature
      label: Reviewer Signature
      hint: null
      type: text
      options: []
      required: false
