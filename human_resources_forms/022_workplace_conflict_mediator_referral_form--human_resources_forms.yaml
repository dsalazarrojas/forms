inputSchema:
  type: object
  properties:
    title: Workplace Conflict Mediator Referral Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Human Resources
      - Management
      - Other
      required: false
    - id: 3
      name: conflict_type
      label: Conflict Type
      hint: null
      type: select_multiple
      options:
      - Performance
      - Personal
      - Other
      required: false
    - id: 4
      name: description
      label: Description
      hint: A brief description of the conflict.
      type: text
      options: []
      required: false
    - id: 5
      name: employee_position
      label: Employee Position
      hint: null
      type: select_multiple
      options:
      - Manager
      - Non-Manager
      required: false
    - id: 6
      name: employee_status
      label: Employee Status
      hint: null
      type: select_one
      options:
      - Active
      - Retired
      - Other
      required: false
    - id: 7
      name: conflict_severity
      label: Conflict Severity
      hint: null
      type: select_one
      options:
      - Minor
      - Moderate
      - Severe
      required: false
    - id: 8
      name: resolution_outcome
      label: Resolution Outcome
      hint: null
      type: select_multiple
      options:
      - Success
      - Partial Success
      - None
      required: false
    - id: 9
      name: employee_supervisor
      label: Employee Supervisor
      hint: null
      type: select_multiple
      options:
      - Manager
      - Other
      required: false
    - id: 10
      name: conflict_duration
      label: Conflict Duration
      hint: null
      type: select_one
      options:
      - Less than a month
      - 1-3 months
      - 3-6 months
      - 6+ months
      required: false
    - id: 11
      name: conflict_frequency
      label: Conflict Frequency
      hint: null
      type: select_multiple
      options:
      - Single Incident
      - Recurring
      required: false
    - id: 12
      name: conflict_cause
      label: Conflict Cause
      hint: null
      type: select_multiple
      options:
      - Communication Issues
      - Trust Issues
      - Performance Issues
      - Other
      required: false
    - id: 13
      name: mediation_services
      label: Mediation Services
      hint: null
      type: select_multiple
      options:
      - Individual Coaching
      - Team Coaching
      - None
      required: false
    - id: 14
      name: employee_referral_date
      label: Employee Referral Date
      hint: null
      type: date
      options: []
      required: false
    - id: 15
      name: manager_referral_date
      label: Manager Referral Date
      hint: null
      type: date
      options: []
      required: false
    - id: 16
      name: conflict_resolution_date
      label: Conflict Resolution Date
      hint: null
      type: date
      options: []
      required: false
    - id: 17
      name: employee_comments
      label: Employee Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: manager_comments
      label: Manager Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: other_comments
      label: Other Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - Manager
      - Other
      required: false
    - id: 21
      name: submitted_by_manager_name
      label: Manager Name
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: submitted_by_department
      label: Submitted Department
      hint: null
      type: select_multiple
      options:
      - Human Resources
      - Other
      required: false
    - id: 23
      name: submitted_by_position
      label: Submitted By Position
      hint: null
      type: select_multiple
      options:
      - Manager
      - Other
      required: false
    - id: 24
      name: submitted_by_supervisor
      label: Submitted By Supervisor
      hint: null
      type: select_multiple
      options:
      - Manager
      - Other
      required: false
    - id: 25
      name: submitted_by_employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
