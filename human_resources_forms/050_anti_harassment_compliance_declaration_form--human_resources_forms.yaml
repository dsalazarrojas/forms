        hint: null
        type: select_one
        options:
          - "I comply and agree"
          - "I have questions"
          - "I do not agree"
        required: true
      - id: 24
        name: training_completion
        label: I have completed required anti-harassment training
        hint: null
        type: select_one
        options:
          - "Yes - completed"
          - "Scheduled to complete"
          - "Not yet required"
          - "No - have not completed"
        required: true
