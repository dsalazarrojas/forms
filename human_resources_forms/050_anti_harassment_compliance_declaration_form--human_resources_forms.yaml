      - id: 13
        name: non_retaliation_understanding
        label: I understand no retaliation for good faith reports
        hint: null
        type: select_one
        options:
          - "Yes - fully understand"
          - "Yes - generally understand"
          - "Somewhat understand"
          - "No - do not understand"
        required: true
      - id: 14
        name: confidentiality_understanding
        label: I understand confidentiality processes
        hint: How complaints are handled
        type: select_one
        options:
          - "Yes - fully understand"
          - "Yes - generally understand"
          - "Somewhat understand"
          - "No - do not understand"
        required: true
      - id: 15
        name: conduct_commitment
        label: I commit to treating others with respect and dignity
        hint: null
        type: select_one
        options:
          - "Strongly agree"
          - "Agree"
          - "Somewhat agree"
          - "Do not agree"
        required: true
      - id: 16
        name: harassment_acknowledgment
        label: I acknowledge harassment is unacceptable and harmful
        hint: null
        type: select_one
        options:
          - "Yes - strongly agree"
          - "Yes - agree"
          - "Somewhat agree"
          - "Disagree"
        required: true
      - id: 17
        name: reporting_responsibility
        label: I understand my responsibility to report violations
        hint: When I witness inappropriate behavior
        type: select_one
        options:
