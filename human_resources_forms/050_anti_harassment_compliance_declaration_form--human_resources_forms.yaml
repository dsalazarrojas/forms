          - "Mostly understand"
          - "Partially understand"
          - "Do not understand"
          - "Have questions"
        required: true
      - id: 11
        name: prohibited_conduct_knowledge
        label: I understand what conduct is prohibited
        hint: Sexual harassment, discrimination, retaliation
        type: select_one
        options:
          - "Yes - clearly understand"
          - "Yes - generally understand"
          - "Somewhat understand"
          - "No - do not understand"
