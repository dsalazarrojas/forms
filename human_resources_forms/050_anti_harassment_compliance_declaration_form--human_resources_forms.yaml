        hint: Responsibility to support colleagues
        type: select_one
        options:
          - "Yes - clearly understand"
          - "Yes - generally understand"
          - "Somewhat understand"
          - "No - do not understand"
        required: true
      - id: 19
        name: prior_violations
        label: I have no prior harassment or misconduct violations
        hint: null
        type: select_one
        options:
          - "Correct - no violations"
          - "Not applicable - new employee"
          - "Yes - prior violations exist"
          - "Unsure"
        required: true
      - id: 20
        name: violation_details
        label: Details of any prior violations
        hint: If applicable
        type: text
        options: []
        required: false
      - id: 21
        name: workplace_concerns
        label: I have no current workplace harassment concerns
        hint: null
        type: select_one
        options:
          - "Correct - no current concerns"
