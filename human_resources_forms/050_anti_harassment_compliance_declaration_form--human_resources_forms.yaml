inputSchema:
  type: object
  properties:
    title: Anti Harassment Compliance Declaration Form
    pages:
      - id: 1
        name: employee_name
        label: Employee Full Name
        hint: First and last name
        type: text
        options: []
        required: true
      - id: 2
        name: employee_id
        label: Employee ID
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: department
        label: Department
        hint: null
        type: text
        options: []
        required: true
      - id: 4
        name: position_title
        label: Position Title
        hint: Job title
        type: text
        options: []
        required: true
      - id: 5
        name: manager_name
        label: Direct Manager Name
        hint: Supervisor or manager
        type: text
        options: []
        required: true
      - id: 6
        name: employment_type
        label: Employment Type
        hint: null
        type: select_one
        options:
          - "Full-time"
          - "Part-time"
          - "Seasonal"
          - "Temporary"
          - "Contract"
        required: true
      - id: 7
        name: start_date
        label: Employment Start Date
        hint: Date hired
        type: date
        options: []
        required: true
      - id: 8
        name: declaration_date
        label: Declaration Date
        hint: Date of this acknowledgment
        type: date
        options: []
        required: true
      - id: 9
        name: policy_receipt_acknowledgment
        label: I have received and read the anti-harassment policy
        hint: null
        type: select_one
        options:
          - "Yes - received and read"
          - "Yes - reviewed summary"
          - "No - have not received"
          - "In process"
        required: true
      - id: 10
        name: policy_understanding
        label: I understand the anti-harassment policy
