inputSchema:
  type: object
  properties:
    title: Day Worker Intake Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: availability
      label: Availability
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      - Weekend
      required: false
    - id: 7
      name: work_experience
      label: Work Experience
      hint: null
      type: select_one
      options:
      - Less than 1 month
      - 1-3 months
      - 6-12 months
      - 1-2 years
      - 2-5 years
      - More than 5 years
      required: false
    - id: 8
      name: availability_time
      label: Availability Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: job_type
      label: Job Type
      hint: null
      type: select_one
      options:
      - Casual
      - Full-Time
      - Part-Time
      - Contract
      required: false
    - id: 10
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: job_description
      label: Job Description
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
