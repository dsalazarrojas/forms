inputSchema:
  type: object
  properties:
    title: Consultancy Research Analyst Interview Form
    pages:
      - id: 1
        name: section_candidate_information
        label: -- Candidate Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: candidate_name
        label: Candidate name
        hint: Full legal name
        type: text
        options: []
        required: true
      - id: 3
        name: interview_date
        label: Interview date
        hint: Date of interview
        type: date
        options: []
        required: true
      - id: 4
        name: interviewer_name
        label: Interviewer name
        hint: Name of person conducting the interview
        type: text
        options: []
        required: true
      - id: 5
        name: research_skills_rating
        label: Research skills rating
        hint: Rate candidate research capabilities
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 6
        name: technical_skills
        label: Technical skills
        hint: List relevant tools and methodologies known
        type: text
        options: []
        required: false
      - id: 7
        name: case_study_evaluation
        label: Case study evaluation notes
        hint: Interviewers comments on candidate case study
        type: text
        options: []
        required: false
      - id: 8
        name: overall_recommendation
        label: Overall recommendation
        hint: Hiring recommendation from interviewer
        type: select_one
        options:
          - Strong hire
          - Hire
          - Consider
          - Do not hire
        required: true
