inputSchema:
  type: object
  properties:
    title: Character Reference Letter Form
    pages:
    - id: 1
      name: section_author_identity
      label: -- Author Identity and Professional Context --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: author_full_name_identity
      label: Author Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 3
      name: current_job_title_author
      label: Current Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: organization_or_institution_name
      label: Organization or Institution Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: contact_email_for_author
      label: Contact Email for Author
      hint: For follow-up and verification
      type: email
      options: []
      required: true
    - id: 6
      name: section_letter_subject
      label: -- Letter Subject and Recipient --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: applicant_full_name_subject
      label: Applicant Full Name (Subject)
      hint: Who are you writing this letter for?
      type: text
      options: []
      required: true
    - id: 8
      name: recipient_organization_name
      label: Recipient Organization Name
      hint: Who is the recipient of the letter?
      type: text
      options: []
      required: true
    - id: 9
      name: position_or_program_applied_for
      label: Position or Program Applied For
      hint: Select the most accurate description
      type: select_one
      options:
      - Employment
      - Academic Admission
      - Volunteer Role
      - Professional Membership
      - Other
      required: true
    - id: 10
      name: section_relationship_description
      label: -- Relationship Description --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: nature_of_relationship_description
      label: Nature of Relationship Description
      hint: Briefly describe how you know the applicant
      type: text
      options: []
      required: true
    - id: 12
      name: length_of_relationship_years
      label: Length of Relationship (Years)
      hint: How long have you known the applicant?
      type: number
      options: []
      required: true
    - id: 13
      name: frequency_of_interaction_type
      label: Frequency of Interaction Type
      hint: How often are you in touch?
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Annually
      - Infrequently
      required: true
    - id: 14
      name: section_qualitative_character_assessment
      label: -- Qualitative Character Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: summary_of_applicant_integrity
      label: Summary of Applicant's Integrity
      hint: Provide a brief summary of their honesty and moral character
      type: text
      options: []
      required: true
    - id: 16
      name: summary_of_applicant_reliability
      label: Summary of Applicant's Reliability
      hint: Provide a brief summary of their consistency and responsibility
      type: text
      options: []
      required: true
    - id: 17
      name: summary_of_applicant_collaboration
      label: Summary of Applicant's Collaboration
      hint: Provide a brief summary of their ability to work with others
      type: text
      options: []
      required: true
    - id: 18
      name: section_final_recommendation_letter
      label: -- Final Recommendation and Closing --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: overall_recommendation_status
      label: Overall Recommendation Status
      hint: Would you recommend this applicant for the role?
      type: select_one
      options:
      - Highly Recommend
      - Recommend
      - Recommend with Reservations
      - Do Not Recommend
      required: true
    - id: 20
      name: accuracy_confirmation_letter_author
      label: Confirmation of Letter Accuracy
      hint: I confirm that I am providing my honest and fair feedback
      type: select_one
      options:
      - I Confirm and Submit Letter
      - Other
      required: true
    - id: 21
      name: date_of_letter_submission_log
      label: Date of Submission
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 22
      name: additional_comments_letter
      label: Additional Comments or Information
      hint: Any other relevant information or context
      type: text
      options: []
      required: false
    - id: 23
      name: interest_in_follow_up_contact
      label: Would you like to be contacted for a follow-up?
      hint: null
      type: select_one
      options:
      - Yes, please notify me
      - No, thank you
      required: false
