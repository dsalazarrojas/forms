inputSchema:
  type: object
  properties:
    title: Conflict Of Interest Policy Acknowledgement Form
    pages:
      - id: 1
        name: employee_name
        label: Employee Name
        hint: Full legal name of employee
        type: text
        options: []
        required: true
      - id: 2
        name: employee_id
        label: Employee ID Number
        hint: Employee identification number
        type: text
        options: []
        required: true
      - id: 3
        name: email
        label: Email Address
        hint: Work email address
        type: email
        options: []
        required: true
      - id: 4
        name: department
        label: Department
        hint: Your department or division
        type: text
        options: []
        required: true
      - id: 5
        name: position_title
        label: Position Title
        hint: Your job title
        type: text
        options: []
        required: true
      - id: 6
        name: manager_name
        label: Manager Name
        hint: Name of your direct supervisor
        type: text
        options: []
        required: true
      - id: 7
        name: hire_date
        label: Hire Date
        hint: Date of employment start
        type: date
        options: []
        required: true
      - id: 8
        name: acknowledgement_type
        label: Type of Acknowledgement
        hint: Reason for this acknowledgement
        type: select_one
        options:
          - New Employee Onboarding
          - Annual Policy Review
          - Policy Update Notification
          - Requested by Management
        required: true
      - id: 9
        name: policy_received_date
        label: Date Policy Was Received
        hint: When did you receive the conflict of interest policy
        type: date
        options: []
        required: true
      - id: 10
        name: policy_document_version
        label: Policy Document Version
        hint: Version or revision number of policy
        type: text
        options: []
        required: true
      - id: 11
        name: read_policy
        label: I Have Read the Conflict of Interest Policy
        hint: Confirmation that you have read the policy
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 12
        name: understand_policy
        label: I Understand the Policy Requirements
        hint: Confirmation of understanding
        type: select_one
        options:
          - Yes - Fully Understand
          - Yes - Generally Understand
          - No - Need Clarification
        required: true
      - id: 13
        name: clarification_needed
        label: Areas Needing Clarification
        hint: Describe any parts you do not understand
        type: text
        options: []
        required: false
      - id: 14
        name: received_training
        label: Have You Received Conflict of Interest Training
        hint: Any formal training on this policy
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 15
        name: training_date
        label: Training Date
        hint: When was training completed
        type: date
        options: []
        required: false
      - id: 16
        name: comply_with_policy
        label: I Agree to Comply with the Policy
        hint: Commitment to follow policy requirements
        type: select_one
        options:
          - Yes - I Agree
          - No
        required: true
      - id: 17
        name: disclose_conflicts
        label: I Will Disclose Potential Conflicts
        hint: Agreement to report any conflicts
        type: select_one
        options:
          - Yes - I Agree
          - No
        required: true
      - id: 18
        name: annual_disclosure
        label: I Will Complete Annual Disclosures
        hint: Agreement to submit annual declarations
        type: select_one
        options:
          - Yes - I Agree
          - No
        required: true
      - id: 19
        name: report_violations
        label: I Will Report Policy Violations
        hint: Agreement to report observed violations
        type: select_one
        options:
          - Yes - I Agree
          - No
        required: true
      - id: 20
        name: understand_consequences
        label: I Understand Consequences of Violations
        hint: Acknowledgement of disciplinary actions
        type: select_one
        options:
          - Yes - I Understand
          - No
        required: true
      - id: 21
        name: questions_policy
        label: Do You Have Questions About the Policy
        hint: Any questions you would like to ask
        type: text
        options: []
        required: false
      - id: 22
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback about the policy
        type: text
        options: []
        required: false
      - id: 23
        name: employee_signature
        label: Employee Signature
        hint: Type your full name as signature
        type: text
        options: []
        required: true
      - id: 24
        name: signature_date
        label: Date of Signature
        hint: Date when signing this acknowledgement
        type: date
        options: []
        required: true
      - id: 25
        name: witness_name
        label: Witness Name
        hint: Name of witness if applicable
        type: text
        options: []
        required: false
      - id: 26
        name: hr_record
        label: For HR Use - Record Status
        hint: Administrative use only
        type: select_one
        options:
          - Received and Filed
          - Pending Follow-Up
          - Training Required
          - Clarification Needed
        required: false
