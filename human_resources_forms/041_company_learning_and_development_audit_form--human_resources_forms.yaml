      - id: 5
        name: skills_gap
        label: Skills gap observed
        hint: Areas where further development is needed
        type: text
        options: []
        required: false
      - id: 6
        name: recommendations
        label: Recommendations for improvement
        hint: Suggestions for L and D programs
        type: text
        options: []
        required: false
