inputSchema:
  type: object
  properties:
    title: Pharmacy Personal Leave Of Absence Request
    pages:
    - id: 1
      name: submit_request
      label: Submit Request
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: name
      label: Full Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: employee_id
      label: Employee ID
      hint: Enter employee ID
      type: text
      options: []
      required: false
    - id: 4
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: reason_for_leave
      label: Reason For Leave
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: leave_duration
      label: Leave Duration
      hint: null
      type: select_one
      options:
      - 1-3 days
      - 4-5 days
      - 6-7 days
      - 8-14 days
      - 15 or more days
      required: true
    - id: 10
      name: return_to_work_date
      label: Return To Work Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 13
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: supervisor_name
      label: Supervisor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: approval_status
      label: Approval Status
      hint: null
      type: select_one
      options:
      - Not Approved
      - Approved
      - Pending
      required: true
