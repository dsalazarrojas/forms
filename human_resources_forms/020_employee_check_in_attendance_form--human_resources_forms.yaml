inputSchema:
  type: object
  properties:
    title: Employee Check In Attendance Form
    pages:
    - id: 1
      name: employee_check_in_shift
      label: Employee Check In Shift
      hint: null
      type: select_one
      options:
      - Shift 1
      - Shift 2
      - Shift 3
      required: false
    - id: 2
      name: employee_check_in_location
      label: Employee Check In Location
      hint: null
      type: select_multiple
      options:
      - Location 1
      - Location 2
      - Location 3
      required: false
    - id: 3
      name: employee_check_in_date
      label: Employee Check In Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: employee_check_in_time
      label: Employee Check In Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: employee_check_out_location
      label: Employee Check Out Location
      hint: null
      type: select_multiple
      options:
      - Location 1
      - Location 2
      - Location 3
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: employee_check_out_time
      label: Employee Check Out Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - Jim
      - Jane
      - John
      required: false
