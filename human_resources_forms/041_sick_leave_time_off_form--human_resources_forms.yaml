inputSchema:
  type: object
  properties:
    title: Sick Leave Time Off Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: duration
      label: Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: reason
      label: Reason
      hint: Please specify a valid reason for your absence
      type: text
      options: []
      required: false
    - id: 6
      name: manager_note
      label: Manager Note
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: manager_approval
      label: Manager Approval
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Pending
      required: false
    - id: 8
      name: hr_approvals
      label: HR Approvals
      hint: null
      type: select_multiple
      options:
      - HR Approvals 1
      - HR Approvals 2
      - HR Approvals 3
      required: false
    - id: 9
      name: manager_note_2
      label: Manager Note
      hint: null
      type: note
      options: []
      required: false
