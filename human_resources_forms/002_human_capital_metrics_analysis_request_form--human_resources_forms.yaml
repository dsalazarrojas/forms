      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: metric_10
      label: What is the overall rating of the employee?
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: note
      label: Is there any additional note about the employee?
      hint: null
      type: note
      options: []
      required: true
