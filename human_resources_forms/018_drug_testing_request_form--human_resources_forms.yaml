inputSchema:
  type: object
  properties:
    title: drug_testing_request_form
    pages:
    - id: 1
      name: employee
      label: Employee
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: employee_date_of_birth
      label: Employee Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: supervisor
      label: Supervisor
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: testing_type
      label: Testing Type
      hint: null
      type: select_multiple
      options:
      - Random Sample
      - Non-Donor
      - Specimen Type
      required: true
    - id: 5
      name: reason_for_testing
      label: Reason for Testing
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: test_result
      label: Test Result
      hint: null
      type: select_multiple
      options:
      - Negative
      - Positive
      - Not Detected
      required: true
    - id: 7
      name: action_taken
      label: Action Taken
      hint: null
      type: select_multiple
      options:
      - No Action
      - Employee Fired
      required: true
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
