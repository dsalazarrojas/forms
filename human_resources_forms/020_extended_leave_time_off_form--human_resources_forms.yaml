inputSchema:
  type: object
  properties:
    title: Extended Leave Time Off Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: reason
      label: Reason
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: approval_level
      label: Approval Level
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 7
      name: manager_approval
      label: Manager Approval
      hint: null
      type: select_multiple
      options:
      - Manager 1
      - Manager 2
      - Manager 3
      required: false
    - id: 8
      name: request_type
      label: Request Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: extended_leave_days
      label: Extended Leave Days
      hint: null
      type: number
      options: []
      required: false
