inputSchema:
  type: object
  properties:
    title: Employee Engagement Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: Welcome to the Employee Engagement Survey. This survey aims to measure
        employee engagement and satisfaction.
      type: text
      options: []
      required: false
    - id: 2
      name: tenure
      label: How many years have you been with the company?
      hint: Please provide the number of years you've worked for the company.
      type: number
      options: []
      required: false
    - id: 3
      name: job_satisfaction
      label: How satisfied are you with your job?
      hint: Scale - 1-5, where 1 is 'very dissatisfied' and 5 is 'very satisfied'.
      type: number
      options: []
      required: false
    - id: 4
      name: decision_making
      label: How often do you feel empowered to make decisions?
      hint: Select one option - Never, Rarely, Sometimes, Often, Almost Always
      type: select_one
      options:
      - Never
      - Rarely
      - Sometimes
      - Often
      - Almost Always
      required: false
    - id: 5
      name: work_challenges
      label: What are the most significant challenges you face at work?
      hint: Please provide a brief description.
      type: text
      options: []
      required: false
    - id: 6
      name: work_hours
      label: How many hours do you usually work per week?
      hint: Enter a number.
      type: number
      options: []
      required: false
    - id: 7
      name: benefits
      label: Which of the following benefits do you value most?
      hint: Select all that apply
      type: select_multiple
      options:
      - Health Insurance
      - Retirement Plan
      - Paid Time Off
      - Stock Options
      - Other (please specify)
      required: false
    - id: 8
      name: manager_leadership
      label: How would you rate your manager's leadership style?
      hint: Select one option - Autocratic, Democratic, Laissez-Faire, Participative,
        Transformational
      type: select_one
      options:
      - Autocratic
      - Democratic
      - Laissez-Faire
      - Participative
      - Transformational
      required: false
    - id: 9
      name: work_life_balance
      label: Are you satisfied with your work-life balance?
      hint: Select one option - Yes, No
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: open_ended_feedback
      label: What would you like to see improved in the workplace?
      hint: Please provide a brief description.
      type: text
      options: []
      required: false
    - id: 11
      name: recommendation
      label: How likely are you to recommend this organization to a friend or family
        member?
      hint: Select one option - Very Likely, Not Likely, Not Likely at all
      type: select_one
      options:
      - Very Likely
      - Not Likely
      - Not Likely at all
      required: false
    - id: 12
      name: communication_method
      label: What is your preferred mode of communication with your team?
      hint: Select all that apply
      type: select_multiple
      options:
      - Email
      - Phone Call
      - Text Message
      - Instant Messaging
      - Other (please specify)
      required: false
    - id: 13
      name: company_culture
      label: How would you rate the company culture?
      hint: Select one option - Very Positive, Positive, Neutral, Negative, Very Negative
      type: select_one
      options:
      - Very Positive
      - Positive
      - Neutral
      - Negative
      - Very Negative
      required: false
    - id: 14
      name: conclusion
      label: Thank you for participating in this survey. Your input is greatly appreciated.
      hint: This concludes the survey.
      type: text
      options: []
      required: false
