inputSchema:
  type: object
  properties:
    title: Leave Request Form
    pages:
    - id: 1
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: leave_type
      label: Leave Type
      hint: null
      type: select_one
      options:
      - Leave
      - Holiday
      - Sick
      required: false
    - id: 4
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: reason_for_leave
      label: Reason for Leave
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: department
      label: Department
      hint: null
      type: select_multiple
      options:
      - HR
      - Finance
      - Operations
      required: true
    - id: 8
      name: leave_status
      label: Leave Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: attachment
      label: Attachment
      hint: null
      type: text
      options: []
      required: false
