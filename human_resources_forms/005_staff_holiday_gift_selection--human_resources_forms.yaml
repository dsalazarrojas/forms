inputSchema:
  type: object
  properties:
    title: Staff Holiday Gift Selection
    pages:
    - id: 1
      name: employee_preferences
      label: Employee Preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: delivery_method
      label: Delivery Method
      hint: null
      type: select_one
      options:
      - In-person delivery
      - Mail delivery
      - Both options
      - No delivery
      required: false
    - id: 3
      name: gift_confirmation
      label: Gift Confirmation
      hint: Please confirm your holiday gift choice
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: gift_type
      label: Type of Gift
      hint: null
      type: select_one
      options:
      - Gift Card
      - Physical Gift
      - Both options
      - No gift
      required: false
    - id: 5
      name: gift_details
      label: Gift Details
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: delivery_info
      label: Delivery Information
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: gift_delivery_info
      label: Gift Delivery Info
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: employee_confirmation
      label: Employee Confirmation
      hint: null
      type: select_multiple
      options:
      - I confirm I will receive my gift
      - Not yet
      - Unable to confirm
      required: false
