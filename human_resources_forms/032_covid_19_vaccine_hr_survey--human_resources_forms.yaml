inputSchema:
  type: object
  properties:
    title: COVID 19 Vaccine HR Survey
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Work Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: department
      label: Department or Division
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: job_title
      label: Job Title or Position
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: survey_section
      label: -- COVID-19 Vaccination Survey --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: vaccination_interest
      label: Are you interested in receiving the COVID-19 vaccine
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - Yes, probably
      - Unsure
      - Probably not
      - Definitely not
      required: true
    - id: 8
      name: vaccination_urgency
      label: How soon would you like to be vaccinated
      hint: null
      type: select_one
      options:
      - As soon as possible
      - Within 1-2 weeks
      - Within 1 month
      - Flexible timeline
      - No time preference
      required: false
    - id: 9
      name: vaccine_preference
      label: Vaccine Type Preference
      hint: null
      type: select_one
      options:
      - Pfizer
      - Moderna
      - Johnson and Johnson
      - No preference
      - Unsure
      required: true
    - id: 10
      name: health_section
      label: -- Health and Risk Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: age_group
      label: Age Group
      hint: null
      type: select_one
      options:
      - 18-29
      - 30-39
      - 40-49
      - 50-59
      - 60-69
      - 70+
      required: true
    - id: 12
      name: work_location
      label: Work Location Type
      hint: null
      type: select_one
      options:
      - Office
      - Remote
      - Hybrid
      - Field/On-site
      - Healthcare facility
      required: true
    - id: 13
      name: high_risk
      label: Consider yourself at high risk for severe COVID-19
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: true
    - id: 14
      name: underlying_conditions
      label: Have underlying health conditions
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Prefer not to say
      required: true
    - id: 15
      name: household_vulnerable
      label: Live with vulnerable or high-risk individuals
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: concerns_section
      label: -- Concerns and Questions --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: main_concerns
      label: Main Concerns About Vaccination
      hint: Check all that apply
      type: select_multiple
      options:
      - Safety concerns
      - Side effects
      - Allergies
      - Effectiveness
      - Personal choice
      - Religious reasons
      - Medical contraindications
      - Lack of information
      - Cost
      - Other
      required: false
    - id: 18
      name: concerns_details
      label: Explain your concerns in detail
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: information_needed
      label: What additional information would help your decision
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: logistics_section
      label: -- Logistics and Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: preferred_location
      label: Preferred Vaccination Location
      hint: null
      type: select_one
      options:
      - On-site at workplace
      - Nearby clinic
      - Pharmacy
      - Hospital
      - Healthcare provider office
      - Mobile clinic
      - Home or remote
      required: true
    - id: 22
      name: time_preference
      label: Preferred Time for Vaccination
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Flexible
      - During work hours
      - Outside work hours
      required: true
    - id: 23
      name: work_time_off
      label: Willing to use work time for vaccination appointment
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: true
    - id: 24
      name: recovery_time
      label: Expected recovery time after vaccination
      hint: null
      type: select_one
      options:
      - Same day return to work
      - 1 day off
      - 2-3 days off
      - Unsure
      required: false
    - id: 25
      name: questions_comments
      label: Additional Questions or Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 26
      name: followup_contact
      label: May we contact you with vaccination information
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
