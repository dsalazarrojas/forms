inputSchema:
  type: object
  properties:
    title: remote_work_feedback_survey
    pages:
    - id: 1
      name: intro
      label: Remote Work Feedback Survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: remote_work_satisfaction
      label: How satisfied are you with your remote work experience?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 3
      name: challenges
      label: What are some challenges you've faced with remote work?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: collaboration
      label: How has remote work impacted your collaboration with colleagues?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: policies
      label: Have you noticed any policy changes as a result of remote work?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: suggestions
      label: What are your suggestions for improving remote work policies?
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: communication
      label: What communication challenges have you faced with remote work?
      hint: null
      type: select_one
      options:
      - Communication with manager
      - Communication with team
      - Communication with client
      - Other
      required: false
    - id: 8
      name: work_life_balance
      label: How has remote work impacted your work-life balance?
      hint: null
      type: select_one
      options:
      - Very Positive
      - Somewhat Positive
      - Neutral
      - Somewhat Negative
      - Very Negative
      required: false
    - id: 9
      name: technical_support
      label: What technical support do you feel is lacking?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: overall_experience
      label: What is your overall experience with remote work?
      hint: null
      type: select_one
      options:
      - Very Positive
      - Somewhat Positive
      - Neutral
      - Somewhat Negative
      - Very Negative
      required: true
