    - id: 5
      name: grievance_details
      label: Grievance Details
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: grievance_resolution
      label: Desired Resolution
      hint: null
      type: select_one
      options:
      - Resolve internally
      - Escalate to manager
      - Escalate to HR
      required: false
    - id: 7
      name: employee_contact
      label: Employee Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: manager_contact
