      options: []
      required: true
    - id: 6
      name: job_hours
      label: job hours
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: job_notes
      label: job notes
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: employer
      label: employer
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: job_status
      label: job status
      hint: null
