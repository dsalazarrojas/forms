inputSchema:
  type: object
  properties:
    title: Case Study Submission Form
    pages:
    - id: 1
      name: submission_header
      label: Case Study Submission Form
      hint: Submit your case study assignment for job application
      type: note
      options: []
      required: false
    - id: 2
      name: submission_id
      label: Submission ID Number
      hint: Reference number
      type: text
      options: []
      required: false
    - id: 3
      name: submission_date
      label: Submission Date
      hint: Date of submission
      type: date
      options: []
      required: true
    - id: 4
      name: applicant_info
      label: Applicant Information
      hint: Your details
      type: note
      options: []
      required: false
    - id: 5
      name: applicant_name
      label: Full Name
      hint: Legal name
      type: text
      options: []
      required: true
    - id: 6
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone Number
