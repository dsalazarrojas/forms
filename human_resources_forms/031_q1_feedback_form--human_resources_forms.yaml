inputSchema:
  type: object
  properties:
    title: Q1 Feedback Form
    pages:
    - id: 1
      name: q1_feedback_form
      label: Client Feedback
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: q1_feedback_form_client_feedback
      label: Overall Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: q1_feedback_form_comments
      label: Comments
