inputSchema:
  type: object
  properties:
    title: License Renewal Time Off Form
    pages:
    - id: 1
      name: employee_id
      label: Employee Id
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: license_type
      label: License Type
      hint: null
      type: select_one
      options:
      - Security Clearance
      - Professional License
      - Other
      required: false
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: reason_for_renewal
      label: Reason For Renewal
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - User
      - Manager
      - HR Representative
      required: false
    - id: 7
      name: department
      label: Department
      hint: null
      type: select_multiple
      options:
      - HR
      - Accounting
      - IT
      required: false
    - id: 8
      name: manager_signature
      label: Manager Signature
      hint: null
      type: note
      options: []
      required: false
