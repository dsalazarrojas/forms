inputSchema:
  type: object
  properties:
    title: software_developer_interview_form
    pages:
    - id: 1
      name: contact_info
      label: contact info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: candidate_experience
      label: years of experience
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: languages
      label: languages
      hint: null
      type: select_multiple
      options:
      - JavaScript
      - Python
      - Java
      - C++
      - C#
      - C
      required: false
    - id: 4
      name: available_to_relocate
      label: available to relocate
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: desired_salary
      label: desired salary
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: notice_period
      label: notice period
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: resume
      label: resume
      hint: Please attach your resume in PDF format
      type: text
      options: []
      required: false
    - id: 8
      name: skills
      label: skills
      hint: null
      type: select_one
      options:
      - HTML
      - CSS
      - SQL
      - Node.js
      - JavaScript
      - React
      - UI/UX
      - Git
      - SVN
      - Agile
      - Scrum
      - Kanban
      required: false
    - id: 9
      name: certifications
      label: certifications
      hint: List your certifications
      type: text
      options: []
      required: false
    - id: 10
      name: previous_workplace
      label: previous workplace
      hint: null
      type: select_one
      options:
      - Google
      - Amazon
      - Microsoft
      - Facebook
      - Apple
      - IBM
      - LinkedIn
      - Dell
      required: false
    - id: 11
      name: education
      label: education
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: expected_start_date
      label: expected start date
      hint: Please use YYYY-MM-DD format, e.g. 2024-01-01
      type: date
      options: []
      required: false
    - id: 13
      name: expected_end_date
      label: expected end date
      hint: Please use YYYY-MM-DD format, e.g. 2024-12-31
      type: date
      options: []
      required: false
    - id: 14
      name: current_salary
      label: current salary
      hint: Please enter current salary
      type: number
      options: []
      required: false
    - id: 15
      name: notice_period
      label: notice period
      hint: Please enter notice period in months
      type: number
      options: []
      required: false
    - id: 16
      name: notice_salary
      label: notice salary
      hint: Please enter notice salary
      type: number
      options: []
      required: false
    - id: 17
      name: available_start_date
      label: available start date
      hint: Please enter available start date in YYYY-MM-DD format
      type: date
      options: []
      required: false
    - id: 18
      name: notice
      label: notice
      hint: Please select notice period
      type: text
      options: []
      required: false
