inputSchema:
  type: object
  properties:
    title: Consultant Contract Completion Offboarding Form
    pages:
    - id: 1
      name: section_offboarding_overview
      label: -- Offboarding Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: consultant_name
      label: Consultant name
      hint: Name of the consultant being offboarded
      type: text
      options: []
      required: true
    - id: 3
      name: contract_end_date
      label: Contract end date
      hint: Date contract officially ends
      type: date
      options: []
      required: true
    - id: 4
      name: deliverables_completed
      label: Deliverables completed
      hint: Confirm if all contract deliverables are finished
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: final_report_submitted
      label: Final report submitted
      hint: Confirm submission of final report
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: knowledge_transfer_done
      label: Knowledge transfer done
      hint: Confirm if handover sessions completed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: return_of_assets
      label: Return of assets
      hint: Note any company assets returned
      type: text
      options: []
      required: false
