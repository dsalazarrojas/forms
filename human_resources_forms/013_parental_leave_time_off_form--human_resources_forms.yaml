inputSchema:
  type: object
  properties:
    title: Parental Leave Time Off Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: reason_for_leave
      label: Reason for Leave
      hint: null
      type: select_one
      options:
      - Parental leave for adoption
      - Parental leave for pregnancy
      - Other
      required: true
    - id: 6
      name: number_of_days
      label: Number of Days
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: pay_type
      label: Pay Type
      hint: null
      type: select_multiple
      options:
      - Paid
      - Unpaid
      - Unavailable
      required: true
    - id: 8
      name: leave_starting_date
      label: Leave Starting Date
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: pay
      label: Pay
      hint: null
      type: number
      options: []
      required: false
