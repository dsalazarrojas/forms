inputSchema:
  type: object
  properties:
    title: Applicant Reference Form
    pages:
    - id: 1
      name: referee_name
      label: Referee name
      hint: Name of the person providing reference
      type: text
      options: []
      required: true
    - id: 2
      name: referee_relation
      label: Relation to applicant
      hint: Supervisor, colleague, teacher, etc
      type: text
      options: []
      required: true
    - id: 3
      name: applicant_name
      label: Applicant name
      hint: Candidate full name
      type: text
      options: []
      required: true
    - id: 4
      name: duration_known
      label: Duration known
      hint: How long have you known the applicant
      type: text
      options: []
      required: false
    - id: 5
      name: reliability_rating
      label: Reliability rating
      hint: Rate reliability on a scale
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: strengths
      label: Strengths
      hint: Key strengths observed
      type: text
      options: []
      required: false
    - id: 7
      name: areas_for_development
      label: Areas for development
      hint: Constructive feedback where applicable
      type: text
      options: []
      required: false
    - id: 8
      name: would_rehire
      label: Would you rehire or recommend
      hint: Suitability for the role
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 9
      name: contact_information
      label: Referee contact information
      hint: Phone or email
      type: text
      options: []
      required: true
    - id: 10
      name: additional_comments
      label: Additional comments
      hint: Any other remarks
      type: text
      options: []
      required: false
