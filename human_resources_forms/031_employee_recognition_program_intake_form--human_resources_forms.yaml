inputSchema:
  type: object
  properties:
    title: Employee Recognition Program Intake Form
    pages:
    - id: 1
      name: employee_nominations
      label: Employee Nominations
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: award_type
      label: Award Type
      hint: null
      type: select_one
      options:
      - Achievement Award
      - Merit Award
      - Service Award
      required: false
    - id: 4
      name: reason_for_recognition
      label: Reason For Recognition
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: employee_department
      label: Employee Department
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: recognition_date
      label: Recognition Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: manager_name
      label: Manager Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: manager_title
      label: Manager Title
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: employee_title
      label: Employee Title
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: employee_email
      label: Employee Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: manager_email
      label: Manager Email
      hint: null
      type: email
      options: []
      required: false
