inputSchema:
  type: object
  properties:
    title: Workplace Change Update Form
    pages:
    - id: 1
      name: new_location
      label: New location
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: reason_for_change
      label: reason for change
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: manager_approval
      label: Manager Approval
      hint: Select manager
      type: select_one
      options:
      - Approve
      - Reject
      - Pending
      required: false
    - id: 4
      name: updated_by
      label: Updated By
      hint: null
      type: select_one
      options:
      - Employee
      - Manager
      - System
      required: false
    - id: 5
      name: updated_on
      label: Updated On
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: notes
      label: notes
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: new_manager
      label: New manager
      hint: null
      type: select_one
      options:
      - Manager 1
      - Manager 2
      - Manager 3
      required: false
    - id: 8
      name: old_location
      label: Old location
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: old_department
      label: Old department
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: new_department
      label: New department
      hint: null
      type: text
      options: []
      required: false
