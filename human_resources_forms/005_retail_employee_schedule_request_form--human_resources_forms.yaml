inputSchema:
  type: object
  properties:
    title: Retail Employee Schedule Request Form
    pages:
    - id: 1
      name: schedule_changes
      label: Schedule Changes
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: work_hours
      label: Work Hours
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: availability
      label: Availability
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Weekend
      required: true
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
