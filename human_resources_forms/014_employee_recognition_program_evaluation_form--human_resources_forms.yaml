inputSchema:
  type: object
  properties:
    title: employee_recognition_program_evaluation_form
    pages:
    - id: 1
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: department_id
      label: Department ID
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: recognition_initiatives
      label: Recognition Initiatives
      hint: Select all initiatives that are currently offered by your company
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: program_goals
      label: Program Goals
      hint: What specific goals do you want to accomplish with your recognition program?
      type: text
      options: []
      required: false
    - id: 6
      name: frequency_of_recognition
      label: Frequency Of Recognition
      hint: How often does the manager/leader provide recognition?
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Annually
      required: false
    - id: 7
      name: recognition_methods
      label: Recognition Methods
      hint: What types of methods do you use for recognition?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: recognition_channels
      label: Recognition Channels
      hint: Which of the following recognition channels do you use?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: recognition_types
      label: Recognition Types
      hint: What type of recognition do you give?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: recognition_benefits
      label: Recognition Benefits
      hint: What are the benefits that recognition gives?
      type: text
      options: []
      required: false
    - id: 11
      name: evaluation_frequency
      label: Evaluation Frequency
      hint: How often do you evaluate recognition initiatives?
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Semiannually
      - Annually
      required: false
    - id: 12
      name: evaluation_methods
      label: Evaluation Methods
      hint: What are the methods used for evaluation?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: evaluation_benefits
      label: Evaluation Benefits
      hint: What are the benefits of the evaluation?
      type: text
      options: []
      required: false
    - id: 14
      name: employee_response
      label: Employee Response
      hint: What response from employees do you expect?
      type: select_one
      options:
      - Positive
      - Negative
      - Neutral
      required: false
    - id: 15
      name: manager_involvement
      label: Manager Involvement
      hint: How involved are managers in recognizing employees?
      type: select_one
      options:
      - Highly Involved
      - Somewhat Involved
      - Not Involved
      required: false
    - id: 16
      name: employee_satisfaction
      label: Employee Satisfaction
      hint: How satisfied are employees with recognition initiatives?
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 17
      name: manager_satisfaction
      label: Manager Satisfaction
      hint: How satisfied are managers with recognition initiatives?
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 18
      name: recognition_budget
      label: Recognition Budget
      hint: What is your budget for recognition initiatives?
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 19
      name: budget_allocation
      label: Budget Allocation
      hint: How do you allocate your recognition budget?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 20
      name: budget_allocation_methods
      label: Budget Allocation Methods
      hint: How do you allocate budget?
      type: text
      options: []
      required: false
    - id: 21
      name: budget_allocation_benefits
      label: Budget Allocation Benefits
      hint: What are the benefits of budget allocation?
      type: text
      options: []
      required: false
    - id: 22
      name: recognition_implementation
      label: Recognition Implementation
      hint: What are the steps for recognition implementation?
      type: text
      options: []
      required: false
    - id: 23
      name: recognition_process
      label: Recognition Process
      hint: What are the steps of recognition process?
      type: text
      options: []
      required: false
    - id: 24
      name: recognition_results
      label: Recognition Results
      hint: What are the results of recognition initiatives?
      type: text
      options: []
      required: false
    - id: 25
      name: recognition_improve
      label: How to Improve Recognition
      hint: What are the ways to improve recognition initiatives?
      type: text
      options: []
      required: false
