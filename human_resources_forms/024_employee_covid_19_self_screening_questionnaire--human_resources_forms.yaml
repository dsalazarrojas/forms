inputSchema:
  type: object
  properties:
    title: Employee Covid 19 Self Screening Questionnaire
    pages:
    - id: 1
      name: general_info
      label: General Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employee_info
      label: Employee Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: symptoms
      label: Symptoms
      hint: null
      type: select_multiple
      options:
      - Fever
      - Cough
      - Sore Throat
      - Shortness of Breath
      - Other
      required: false
    - id: 4
      name: travel_history
      label: Travel History
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
