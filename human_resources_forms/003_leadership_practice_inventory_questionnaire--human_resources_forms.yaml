inputSchema:
  type: object
  properties:
    title: Leadership Practice Inventory Questionnaire
    pages:
    - id: 1
      name: leadership_practice_inventory_questionnaire_page_1
      label: What is your leadership style (e.g. democratic, autocratic, laissez-faire)?
      hint: null
      type: select_one
      options:
      - Autocratic
      - Democratic
      - Laissez-faire
      required: true
    - id: 2
      name: leadership_practice_inventory_questionnaire_page_2
      label: Which of the following areas do you struggle with the most?
      hint: null
      type: select_multiple
      options:
      - Communication
      - Decision-making
      - Team management
      required: true
    - id: 3
      name: leadership_practice_inventory_questionnaire_page_3
      label: How would you rate your ability to adapt to change?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: leadership_practice_inventoryquestionnaire_page_4
      label: How would you rate your emotional intelligence (e.g. empathy, self-awareness)?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: leadership_practice_inventory_questionnaire_page_5
      label: What is the most significant leadership challenge you face?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: leadership_practice_inventoryquestionnaire_page_6
      label: How do you typically handle conflict or difficult situations?
      hint: null
      type: select_one
      options:
      - Collaborative approach
      - Competitive approach
      - Avoidance
      required: true
    - id: 7
      name: leadership_practice_inventory_questionnaire_page_7
      label: How often do you involve others in your decision-making process?
      hint: null
      type: select_one
      options:
      - Always
      - Sometimes
      - Rarely
      required: true
    - id: 8
      name: leadership_practice_inventoryquestionnaire_page_8
      label: How would you rate your ability to set and achieve goals?
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: leadership_practice_inventoryquestionnaire_page_9
      label: What are some common barriers to your leadership practice?
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: leadership_practice_inventoryquestionnaire_page_10
      label: Who is your primary role model or mentor?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: leadership_practice_inventoryquestionnaire_page_11
      label: How can you be of most value to your team?
      hint: null
      type: select_multiple
      options:
      - Providing feedback and guidance
      - Coaching and developing
      - Supporting and motivating
      - Leading by example
      required: true
    - id: 12
      name: leadership_practice_inventoryquestionnaire_page_12
      label: Which leadership development opportunities would you like to pursue in
        the next 6 months?
      hint: null
      type: select_multiple
      options:
      - Coaching or mentoring
      - Leadership development programs
      - Training or workshops
      - Education or courses
      required: true
    - id: 13
      name: leadership_practice_inventoryquestionnaire_page_13
      label: How do you rate your ability to delegate tasks?
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: leadership_practice_inventoryquestionnaire_page_14
      label: What are some common challenges faced by your team?
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: leadership_practice_inventoryquestionnaire_page_15
      label: How often do you communicate with your team?
      hint: null
      type: select_one
      options:
      - Frequently
      - Occasionally
      - Rarely
      required: true
    - id: 16
      name: leadership_practice_inventoryquestionnaire_page_16
      label: How do you handle conflicts between team members?
      hint: null
      type: select_one
      options:
      - Collaborative approach
      - Competitive approach
      - Avoidance
      required: true
    - id: 17
      name: leadership_practice_inventoryquestionnaire_page_17
      label: How do you ensure that your team members are developing their skills?
      hint: null
      type: select_multiple
      options:
      - Coaching
      - Mentoring
      - Providing feedback
      - Training
      required: false
    - id: 18
      name: leadership_practice_inventoryquestionnaire_page_18
      label: How can you improve your own leadership style in the next 6 months?
      hint: null
      type: text
      options: []
      required: true
