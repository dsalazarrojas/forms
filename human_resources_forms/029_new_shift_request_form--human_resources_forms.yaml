inputSchema:
  type: object
  properties:
    title: New Shift Request Form
    pages:
    - id: 1
      name: new_shift_request_form_1
      label: Employee Name
      hint: Enter your name as it appears on your paycheck.
      type: text
      options: []
      required: true
    - id: 2
      name: new_shift_request_form_2
      label: Shift Start Time
      hint: Enter the start time of the new shift.
      type: time
      options: []
      required: true
    - id: 3
      name: new_shift_request_form_3
      label: Shift End Time
      hint: Enter the end time of the new shift.
      type: time
      options: []
      required: true
    - id: 4
      name: new_shift_request_form_4
      label: Shift Date
      hint: Enter the date of the new shift.
      type: date
      options: []
      required: true
    - id: 5
      name: new_shift_request_form_5
      label: Shift Duration
      hint: Enter the duration of the new shift.
      type: number
      options: []
      required: true
    - id: 6
      name: new_shift_request_form_6
      label: Comment
      hint: Enter your comment about the new shift.
      type: note
      options: []
      required: false
    - id: 7
      name: new_shift_request_form_7
      label: Will you work the shift?
      hint: Enter Yes or No.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: new_shift_request_form_8
      label: Conflicts or Requests
      hint: Enter any conflicts or requests you have for the shift.
      type: text
      options: []
      required: false
    - id: 9
      name: new_shift_request_form_9
      label: Additional Shifts
      hint: Enter any additional shifts you would like to pick up.
      type: text
      options: []
      required: false
    - id: 10
      name: new_shift_request_form_10
      label: New Shift Request Form 10
      hint: Enter any conflicts or requests you have for the additional shifts.
      type: text
      options: []
      required: false
