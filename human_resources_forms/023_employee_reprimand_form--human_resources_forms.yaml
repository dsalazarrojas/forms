inputSchema:
  type: object
  properties:
    title: Employee Reprimand Form
    pages:
    - id: 1
      name: employee_reprimand_form_employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employee_reprimand_form_reason_for_reprimand
      label: Reason for Reprimand
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: employee_reprimand_form_date_of_incident
      label: Date of Incident
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 4
      name: employee_reprimand_form_time_of_incident
      label: Time of Incident
      hint: HH -MM AM/PM
      type: time
      options: []
      required: false
    - id: 5
      name: employee_reprimand_form_description
      label: Description of Incident
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: employee_reprimand_form_safety_violations
      label: Safety Violations
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: employee_reprimand_form_safety_violations_options
      label: options
      hint: null
      type: select_one
      options:
      - Violation of safety rules.
      - Inadequate supervision.
      - Inadequate supervision
      - Failure to follow safety procedures.
      - Other safety related issues
      required: false
    - id: 8
      name: employee_reprimand_form_policies_violations
      label: Policies Violations
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: employee_reprimand_form_policies_violations_options
      label: Employee Reprimand Form Policies Violations Options
      hint: null
      type: select_one
      options:
      - Violation of company policies
      - Inadequate performance
      - Other policies related issues
      required: false
    - id: 10
      name: employee_reprimand_form_attendance_violations
      label: Attendance Violations
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: employee_reprimand_form_attendance_violations_options
      label: Employee Reprimand Form Attendance Violations Options
      hint: null
      type: select_one
      options:
      - Excessive absences
      - Late arrival
      - Early leaving
      required: false
    - id: 12
      name: employee_reprimand_form_action_plan
      label: Action Plan
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: employee_reprimand_form_disciplinary_actions
      label: Disciplinary Actions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: employee_reprimand_form_disciplinary_actions_options
      label: Employee Reprimand Form Disciplinary Actions Options
      hint: null
      type: select_one
      options:
      - Verbal Warning
      - Written Warning
      - Final Written Warning
      - Suspend
      - Terminiation
      required: false
