inputSchema:
  type: object
  properties:
    title: Staff Deployment And Wellbeing Survey
    pages:
    - id: 1
      name: deployment_status
      label: Deployment Status
      hint: null
      type: select_multiple
      options:
      - Active
      - On Leave
      - Resigned
      required: false
    - id: 2
      name: overall_wellbeing
      label: Overall Wellbeing
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Excellent
      required: false
    - id: 3
      name: job_satisfaction
      label: Job Satisfaction
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: engagement_level
      label: Engagement Level
      hint: null
      type: number
      options: []
      required: false
