inputSchema:
  type: object
  properties:
    title: Employment Opportunities Feedback Survey Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: how_did_you_find_out_about_this_job
      label: How did you find out about this job
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: how_would_you_rate_your_interest_in_this_role
      label: How would you rate your interest in this role
      hint: null
      type: select_one
      options:
      - Very high
      - Somewhat high
      - Not very high
      - Not at all
      required: false
    - id: 4
      name: what_do_you_know_about_the_company
      label: What do you know about the company
      hint: null
      type: select_multiple
      options:
      - From website
      - From a friend or colleague
      - From a job ad
      - Other
      required: false
    - id: 5
      name: what_did_you_like_about_the_hiring_process
      label: What did you like about the hiring process
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: what_did_you_dislike_about_the_hiring_process
      label: What did you dislike about the hiring process
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: how_can_we_improve_the_hiring_process
      label: How can we improve the hiring process
      hint: null
      type: text
      options: []
      required: false
