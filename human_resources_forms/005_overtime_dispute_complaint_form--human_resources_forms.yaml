inputSchema:
  type: object
  properties:
    title: Overtime Dispute Complaint Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: manager_name
      label: Manager Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: department
      label: Department
      hint: null
      type: select_multiple
      options:
      - Accounting
      - HR
      - IT
      - Operations
      - Sales
      required: false
    - id: 4
      name: shift_start
      label: Shift Start
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: shift_end
      label: Shift End
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: work_hours
      label: Work Hours
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: hours_worked
      label: Hours Worked
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: overtime_request_date
      label: Overtime Request Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: overtime_dispute_description
      label: Overtime Dispute Description
      hint: Please provide details on what happened.
      type: text
      options: []
      required: false
    - id: 10
      name: dispute_resolution
      label: Dispute Resolution
      hint: null
      type: select_one
      options:
      - Pending
      - Resolved
      required: false
