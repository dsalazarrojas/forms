inputSchema:
  type: object
  properties:
    title: Crisis Response Leave Form
    pages:
    - id: 1
      name: emergency_contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: reason_for_leave
      label: reason for leave
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: return_date
      label: return date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: leave_duration
      label: Leave Duration
      hint: null
      type: select_one
      options:
      - 1-2 days
      - 3-5 days
      - More than 5 days
      required: true
    - id: 7
      name: leave_type
      label: Leave Type
      hint: null
      type: select_one
      options:
      - Emergency
      - Personal
      - Family
      - Other
      required: true
    - id: 8
      name: emergency_status
      label: Emergency Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
    - id: 9
      name: employee_status
      label: Employee Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
    - id: 10
      name: manager_status
      label: Manager Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
    - id: 11
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
