inputSchema:
  type: object
  properties:
    title: Job Information Collection Form
    pages:
    - id: 1
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: job_type
      label: Job Type
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      required: true
    - id: 3
      name: job_description
      label: Job Description
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: job_category
      label: Job Category
      hint: null
      type: select_multiple
      options:
      - Sales
      - Marketing
      - IT
      - Finance
      - Human Resources
      required: true
    - id: 5
      name: job_status
      label: Job Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 6
      name: job_level
      label: Job Level
      hint: null
      type: select_one
      options:
      - High
      - Low
      required: true
    - id: 7
      name: work_experience
      label: Work Experience
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: education_level
      label: Education Level
      hint: null
      type: select_one
      options:
      - High School
      - Bachelor's Degree
      - Master's Degree
      required: true
    - id: 9
      name: skills
      label: Skills
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: job_location
      label: Job Location
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: job_location_type
      label: Job Location Type
      hint: null
      type: select_one
      options:
      - Remote
      - On-site
      required: true
    - id: 12
      name: years_of_experience
      label: Years of Experience
      hint: null
      type: number
      options: []
      required: true
