inputSchema:
  type: object
  properties:
    title: PTO Reimbursement Form
    pages:
    - id: 1
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: pto_start_date
      label: start_date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: pto_end_date
      label: end_date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: days_off
      label: days_off
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: reason
      label: reason
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: reimbursement_type
      label: reimbursement_type
      hint: null
      type: select_one
      options:
      - PTO
      - Vacation
      required: true
    - id: 7
      name: comments
      label: comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: submitted_by
      label: submitted_by
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: submitted_date
      label: submitted_date
      hint: null
      type: date
      options: []
      required: false
