inputSchema:
  type: object
  properties:
    title: HR Operational Excellence Conference Registration
    pages:
    - id: 1
      name: attendee_details
      label: What is your name?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participation_type
      label: What type of participation are you registering for?
      hint: null
      type: select_multiple
      options:
      - Attendee
      - Sponsor
      - Speaker
      required: true
    - id: 3
      name: special_needs
      label: Do you have any special needs or requests for accommodations?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: participant_details
      label: Please provide a detailed description of your participant details.
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: special_needs_2
      label: Special Needs 2
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: first_time_attending
      label: Is this your first time attending the conference?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: previous_experience
      label: Please describe your previous experience with the HR Operational Excellence
        Conference.
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: committee_interest
      label: Are you interested in serving on a conference committee or helping with
        logistics?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
