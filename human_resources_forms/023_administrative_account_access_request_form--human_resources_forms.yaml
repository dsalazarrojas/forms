inputSchema:
  type: object
  properties:
    title: Administrative Account Access Request Form
    pages:
    - id: 1
      name: request_header
      label: -- Administrative Account Access Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Requester Name
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 3
      name: requester_employee_id
      label: Employee ID
      hint: Your employee identification number
      type: text
      options: []
      required: true
    - id: 4
      name: requester_email
      label: Email Address
      hint: Your official email address
      type: email
      options: []
      required: true
    - id: 5
      name: requester_department
      label: Department
      hint: Which department do you belong to?
      type: select_one
      options: ["Administration", "Human Resources", "Finance", "Marketing", "Operations", "IT", "Sales", "Customer Service", "Executive", "Other"]
      required: true
    - id: 6
      name: requester_position
      label: Position/Title
      hint: Your current position or title
      type: text
      options: []
      required: true
    - id: 7
      name: supervisor_name
      label: Supervisor Name
      hint: Name of your immediate supervisor
      type: text
      options: []
      required: true
    - id: 8
      name: supervisor_email
      label: Supervisor Email
      hint: Email address of your supervisor
      type: email
      options: []
      required: true
    - id: 9
      name: requested_access_level
      label: Level of Administrative Access Requested
      hint: What level of administrative access do you need?
      type: select_one
      options: ["Basic Admin", "System Admin", "Network Admin", "Database Admin", "Super User", "Other"]
      required: true
    - id: 10
      name: requested_systems
      label: Systems Requiring Access
      hint: Which systems do you need administrative access to?
      type: select_multiple
      options: ["Network Infrastructure", "Server Management", "Database Systems", "Security Systems", "HR Systems", "Financial Systems", "Email Systems", "File Servers", "Applications", "Other"]
      required: true
    - id: 11
      name: business_justification
      label: Business Justification
      hint: Why do you need administrative access?
      type: text
      options: []
      required: true
    - id: 12
      name: duration_of_access
      label: Duration of Access Needed
      hint: How long do you need this access?
      type: select_one
      options: ["Permanent", "Temporary - Less than 1 month", "Temporary - 1-3 months", "Temporary - 3-6 months", "Temporary - More than 6 months"]
      required: true
    - id: 13
      name: access_start_date
      label: Requested Access Start Date
      hint: When do you need the access to begin?
      type: date
      options: []
      required: true
    - id: 14
      name: access_end_date
      label: Requested Access End Date
      hint: When should the access end (for temporary access)?
      type: date
      options: []
      required: false
    - id: 15
      name: security_training_completed
      label: Security Training Completed
      hint: Have you completed the required security training?
      type: select_one
      options: ["Yes", "No", "In Progress"]
      required: true
    - id: 16
      name: compliance_acknowledged
      label: Compliance Acknowledged
      hint: Do you acknowledge the compliance requirements?
      type: select_one
      options: ["Yes", "No"]
      required: true
    - id: 17
      name: data_handling_training
      label: Data Handling Training
      hint: Have you completed data handling and privacy training?
      type: select_one
      options: ["Yes", "No", "N/A"]
      required: true
    - id: 18
      name: previous_admin_access
      label: Previous Administrative Access
      hint: Have you had administrative access before?
      type: select_one
      options: ["Yes", "No"]
      required: true
    - id: 19
      name: additional_comments
      label: Additional Comments
      hint: Any additional information about your request
      type: text
      options: []
      required: false
    - id: 20
      name: request_date
      label: Request Date
      hint: Date of submitting this request
      type: date
      options: []
      required: true
    - id: 21
      name: requester_signature
      label: Requester Signature
      hint: Electronic signature to confirm request
      type: text
      options: []
      required: true
    - id: 22
      name: supervisor_approval
      label: Supervisor Approval
      hint: Supervisor's approval (to be filled by supervisor)
      type: select_one
      options: ["Approved", "Denied", "Pending"]
      required: false
    - id: 23
      name: it_approval
      label: IT Department Approval
      hint: IT Department approval (to be filled by IT)
      type: select_one
      options: ["Approved", "Denied", "Pending"]
      required: false
