inputSchema:
  type: object
  properties:
    title: hris_mobile_and_web_feedback_form
    pages:
    - id: 1
      name: feedback_type
      label: Feedback Type
      hint: null
      type: select_one
      options:
      - HRIS
      - Technical
      - UI/UX
      required: false
    - id: 2
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: feedback_comment
      label: Additional Comment
      hint: Please provide additional comments or suggestions.
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: feedback_submitted
      label: Has this feedback submitted
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: feedback_submitted_date
      label: Submit Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: submitted_to
      label: Submitted To
      hint: null
      type: select_one
      options:
      - HRIS Team
      - IT Support
      required: false
