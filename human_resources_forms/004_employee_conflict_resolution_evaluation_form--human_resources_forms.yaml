inputSchema:
  type: object
  properties:
    title: employee_conflict_resolution_evaluation_form
    pages:
    - id: 1
      name: root
      label: Conflict Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employee_involved
      label: Employee Involved
      hint: null
      type: select_one
      options:
      - Manager
      - Team Member
      - Team Leader
      - Other
      required: true
    - id: 3
      name: employee_involved_other
      label: Other Employee (if not manager, team member, team leader)
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date_conflict_occurred
      label: Date Conflicts Occurred
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: conflict_description
      label: Describe Conflict
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: resolution_attempted
      label: Yes/No
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: resolution_outcome
      label: Resolution Outcome
      hint: null
      type: select_multiple
      options:
      - Conflicts Resolved
      - Conflicts Not Resolved
      - Pending
      required: true
    - id: 8
      name: resolution_comments
      label: Resolution Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: action_taken
      label: Actions Taken
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: conflict_resolution_form_completed
      label: Conflict Resolution Form Completed
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: conflict_resolution_form_completed_by
      label: Completed By
      hint: null
      type: select_one
      options:
      - HR Manager
      - Team Leader
      - Other
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
