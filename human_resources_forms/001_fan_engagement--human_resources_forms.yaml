inputSchema:
  type: object
  properties:
    title: Fan Engagement
    pages:
    - id: 1
      name: favorite_team
      label: What is your favorite sports team?
      hint: Select your favorite sports team from the list below
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 2
      name: social_media_interaction
      label: How do you currently interact with our team on social media?
      hint: How often do you interact with our team on social media?
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 3
      name: email
      label: Email address associated with your social media handle
      hint: Enter your email address associated with your social media handle
      type: email
      options: []
      required: true
    - id: 4
      name: name
      label: Name
      hint: Enter your name as it appears on your social media profile
      type: text
      options: []
      required: true
    - id: 5
      name: engagement_channel
      label: Favorite way to engage with our team
      hint: Select your favorite way to engage with our team
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 6
      name: engagement_experience
      label: Additional comments about your engagement experience
      hint: Tell us more about your engagement experience
      type: note
      options: []
      required: false
    - id: 7
      name: event_attendance
      label: Have you ever attended any of our events?
      hint: Select "Yes" if you've attended any of our events
      type: select_one
      options:
      - Option 1
      - Option 2
      required: false
    - id: 8
      name: time_of_day
      label: Time of day you usually interact with our team
      hint: Select the time of day you usually interact with our team
      type: time
      options: []
      required: false
    - id: 9
      name: experience_rating
      label: Rate your overall experience with our team
      hint: Rate your experience on a scale of 1-5
      type: number
      options: []
      required: true
    - id: 10
      name: phone
      label: Phone number
      hint: Enter your phone number
      type: text
      options: []
      required: true
    - id: 11
      name: birthday
      label: Birthday
      hint: Enter your birthday in the format MM/DD/YYYY
      type: date
      options: []
      required: true
