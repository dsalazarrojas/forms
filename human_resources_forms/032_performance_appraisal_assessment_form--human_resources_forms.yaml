inputSchema:
  type: object
  properties:
    title: Performance Appraisal Assessment Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: job_title
      label: job title
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: reporting_manager
      label: reporting manager
      hint: null
      type: select_one
      options:
      - manager 1
      - manager 2
      - manager 3
      required: false
    - id: 4
      name: performance_areas
      label: Performance Areas
      hint: null
      type: select_multiple
      options:
      - Communication
      - Teamwork
      - Adaptability
      - Time Management
      - Leadership
      - Initiative
      - Problem Solving
      required: false
    - id: 5
      name: performance_criteria
      label: Performance Criteria
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: overall_performance
      label: Overall Performance
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Needs Improvement
      required: false
    - id: 7
      name: date_last_evaluation
      label: Date Last Evaluation
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: date_next_evaluation
      label: Date Next Evaluation
      hint: null
      type: date
      options: []
      required: false
