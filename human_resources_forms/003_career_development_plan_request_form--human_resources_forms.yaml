inputSchema:
  type: object
  properties:
    title: Career Development Plan Request Form
    pages:
    - id: 1
      name: section_employee_details
      label: -- Employee Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_email
      label: Employee Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: manager_name
      label: Manager Name
      hint: Enter your direct supervisor's name
      type: text
      options: []
      required: true
    - id: 5
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - HR
      - Sales
      - IT
      - R&D
      - Logistics
      - Customer Support
      required: true
    - id: 6
      name: section_request_info
      label: -- Request Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: request_type
      label: Type of Development Request
      hint: null
      type: select_one
      options:
      - Annual Review
      - Mid-year Update
      - New Plan
      required: true
    - id: 8
      name: date_of_request
      label: Date of Request
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: section_career_aspirations
      label: -- Career Aspirations --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: short_term_goals
      label: Short-term Goals (1-2 years)
      hint: What do you hope to achieve in the next 24 months?
      type: text
      options: []
      required: true
    - id: 11
      name: long_term_goals
      label: Long-term Goals (3-5 years)
      hint: Where do you see yourself in five years?
      type: text
      options: []
      required: true
    - id: 12
      name: aspirational_role
      label: Future role you are working towards
      hint: Identify the specific position you're aiming for
      type: text
      options: []
      required: false
    - id: 13
      name: section_development_needs
      label: -- Development Needs --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: development_areas
      label: Key areas for development
      hint: Select the most critical areas for growth
      type: select_multiple
      options:
      - Public Speaking
      - Data Literacy
      - People Management
      - Technical Skills
      - Negotiation
      - Time Management
      required: true
    - id: 15
      name: preferred_learning_style
      label: Preferred Learning Style
      hint: How do you learn best?
      type: select_one
      options:
      - Self-paced online
      - In-person workshops
      - One-on-one coaching
      - Peer mentoring
      required: true
    - id: 16
      name: budget_estimate
      label: Estimated budget required for development
      hint: Provide an approximate cost for courses or certifications
      type: number
      options: []
      required: false
    - id: 17
      name: time_commitment
      label: Expected weekly time commitment (hours)
      hint: Estimate the hours per week you can dedicate to development
      type: number
      options: []
      required: false
    - id: 18
      name: section_impact
      label: -- Impact on Organization --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: organizational_benefit
      label: How will this development benefit the organization?
      hint: Explain the ROI for the company
      type: text
      options: []
      required: true
    - id: 20
      name: success_metrics
      label: How will success be measured?
      hint: Identify specific outcomes or certifications
      type: text
      options: []
      required: false
    - id: 21
      name: additional_comments
      label: Any additional comments or requests
      hint: null
      type: text
      options: []
      required: false
