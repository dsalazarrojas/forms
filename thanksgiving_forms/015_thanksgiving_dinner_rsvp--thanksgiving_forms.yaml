inputSchema:
  type: object
  properties:
    title: Thanksgiving Dinner RSVP
    pages:
    - id: 1
      name: guest_name
      label: Guest Name
      hint: Please enter your name
      type: text
      options: []
      required: true
    - id: 2
      name: contact_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: guest_number
      label: Guest Number
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: attending
      label: Attending
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: null
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Gluten-free
      - Other
      required: false
    - id: 6
      name: rsvp_date
      label: RSVP Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: rsvp_time
      label: RSVP Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
