      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: patient_info
      label: patient_info
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: claim_status
      label: claim_status
      hint: null
      type: select_multiple
      options:
      - Pending
      - Denied
      - Approved
      required: false
