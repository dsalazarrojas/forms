inputSchema:
  type: object
  properties:
    title: Injury Investigation Form
    pages:
    - id: 1
      name: employer_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: incident_date
      label: Date of Incident
      hint: Enter the date of the incident
      type: date
      options: []
      required: false
    - id: 4
      name: incident_time
      label: Time of Incident
      hint: Enter the time of the incident
      type: time
      options: []
      required: false
    - id: 5
      name: incident_location
      label: Location of Incident
      hint: Enter the location of the incident
      type: text
      options: []
      required: false
    - id: 6
      name: incident_description
      label: Description of Incident
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: witness_statement
      label: Witness Statement
      hint: Enter any witness statements or observations
      type: text
      options: []
      required: false
    - id: 9
      name: investigation_status
      label: Investigation Status
      hint: null
      type: select_one
      options:
      - Open
      - Closed
      - Pending
      required: true
    - id: 10
      name: investigation_notes
      label: Investigation Notes
      hint: Additional investigation notes or comments
      type: note
      options: []
      required: false
