inputSchema:
  type: object
  properties:
    title: Pet Insurance Claim Form
    pages:
    - id: 1
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: claim_date
      label: Claim Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: insurance_provider
      label: Insurance Provider
      hint: null
      type: select_one
      options:
      - PetCare Insurance
      - PetShield Insurance
      - PetGuard Insurance
      required: false
    - id: 4
      name: pet_type
      label: Pet Type
      hint: null
      type: select_multiple
      options:
      - Dog
      - Cat
      - Other
      required: false
    - id: 5
      name: medical_expense
      label: Medical Expense
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: claim_amount
      label: Claim Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: vet_bill_copy
      label: Vet Bill Copy
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: supporting_documents
      label: Supporting Documents
      hint: null
      type: text
      options: []
      required: false
