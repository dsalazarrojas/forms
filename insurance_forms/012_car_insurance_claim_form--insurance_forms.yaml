inputSchema:
  type: object
  properties:
    title: Car Insurance Claim Form
    pages:
    - id: 1
      name: claimant_information
      label: Claimant Information
      hint: Your personal and policy details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: Your date of birth
      type: date
      options: []
      required: true
    - id: 5
      name: policy_number
      label: Policy Number
      hint: Your insurance policy number
      type: text
      options: []
      required: true
    - id: 6
      name: claim_number
      label: Claim Number (if known)
      hint: Existing claim number
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email Address
      hint: For claim updates
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 9
      name: address
      label: Street Address
      hint: Your mailing address
      type: text
      options: []
      required: true
    - id: 10
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: true
    - id: 11
      name: state
      label: State
      hint: Your state
      type: text
      options: []
      required: true
    - id: 12
      name: zip_code
      label: ZIP Code
      hint: Your ZIP code
      type: text
      options: []
      required: true
    - id: 13
      name: incident_information
      label: Incident Information
      hint: Details about the incident
      type: note
      options: []
      required: false
    - id: 14
      name: incident_date
      label: Date of Incident
      hint: When did it happen?
      type: date
      options: []
      required: true
    - id: 15
      name: incident_time
      label: Time of Incident
      hint: What time did it occur?
      type: time
      options: []
      required: true
    - id: 16
      name: incident_location
      label: Location of Incident
      hint: Full address or description
      type: text
      options: []
      required: true
    - id: 17
      name: incident_type
      label: Type of Incident
      hint: What type of incident was it?
      type: select_one
      options:
      - Collision with vehicle
      - Collision with object
      - Single vehicle accident
      - Hit and run
      - Vandalism
      - Theft
      - Weather damage
      - Fire
      - Glass damage
      - Other
      required: true
    - id: 18
      name: incident_description
      label: Incident Description
      hint: Describe what happened in detail
      type: text
      options: []
      required: true
    - id: 19
      name: vehicle_information
      label: Vehicle Information
      hint: Details about the insured vehicle
      type: note
      options: []
      required: false
    - id: 20
      name: vehicle_year
      label: Vehicle Year
      hint: Year
      type: text
      options: []
      required: true
    - id: 21
      name: vehicle_make
      label: Vehicle Make
      hint: Manufacturer
      type: text
      options: []
      required: true
    - id: 22
      name: vehicle_model
      label: Vehicle Model
      hint: Model
      type: text
      options: []
      required: true
    - id: 23
      name: vehicle_vin
      label: VIN
      hint: Vehicle Identification Number
      type: text
      options: []
      required: true
    - id: 24
      name: license_plate
      label: License Plate
      hint: Plate number
      type: text
      options: []
      required: true
    - id: 25
      name: vehicle_mileage
      label: Current Mileage
      hint: Odometer reading
      type: number
      options: []
      required: true
    - id: 26
      name: damage_description
      label: Damage Description
      hint: Describe all damage to the vehicle
      type: text
      options: []
      required: true
    - id: 27
      name: damage_location
      label: Location of Damage
      hint: Where is the damage located?
      type: select_multiple
      options:
      - Front
      - Rear
      - Left Side
      - Right Side
      - Roof
      - Hood
      - Trunk
      - Windows/Glass
      - Interior
      - Undercarriage
      required: true
    - id: 28
      name: vehicle_drivable
      label: Is Vehicle Drivable?
      hint: Can the vehicle be driven safely?
      type: select_one
      options:
      - 'True'
      - No - needs towing
      - Unsure
      required: true
    - id: 29
      name: third_party_information
      label: Third Party Information
      hint: Other party details if applicable
      type: note
      options: []
      required: false
    - id: 30
      name: other_party_involved
      label: Was Another Party Involved?
      hint: Yes or no
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 31
      name: other_party_name
      label: Other Party Name
      hint: Full name
      type: text
      options: []
      required: false
    - id: 32
      name: other_party_contact
      label: Other Party Contact
      hint: Phone number
      type: text
      options: []
      required: false
    - id: 33
      name: other_party_insurance
      label: Other Party Insurance
      hint: Insurance company
      type: text
      options: []
      required: false
    - id: 34
      name: other_party_policy
      label: Other Party Policy Number
      hint: Policy number
      type: text
      options: []
      required: false
    - id: 35
      name: witnesses_present
      label: Were There Witnesses?
      hint: Yes or no
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 36
      name: witness_information
      label: Witness Information
      hint: Names and contact details
      type: text
      options: []
      required: false
    - id: 37
      name: police_involvement
      label: Police Involvement
      hint: Was police involved?
      type: select_one
      options:
      - Yes - report filed
      - Yes - no report
      - 'False'
      required: true
    - id: 38
      name: police_report_number
      label: Police Report Number
      hint: If available
      type: text
      options: []
      required: false
    - id: 39
      name: injuries_claimed
      label: Were There Injuries?
      hint: Any injuries to report?
      type: select_one
      options:
      - No injuries
      - Yes - minor
      - Yes - requiring medical attention
      - Yes - serious
      required: true
    - id: 40
      name: medical_treatment
      label: Medical Treatment Received
      hint: Describe any treatment
      type: text
      options: []
      required: false
    - id: 41
      name: claim_amount
      label: Estimated Claim Amount
      hint: Estimated damage cost
      type: number
      options: []
      required: false
    - id: 42
      name: photos_submitted
      label: Photos Submitted
      hint: Have you submitted photos?
      type: select_one
      options:
      - Yes - with this form
      - Yes - separately
      - Will submit later
      - No photos available
      required: true
    - id: 43
      name: preferred_repair_shop
      label: Preferred Repair Shop
      hint: Do you have a preferred shop?
      type: text
      options: []
      required: false
    - id: 44
      name: additional_comments
      label: Additional Comments
      hint: Any other relevant information
      type: text
      options: []
      required: false
    - id: 45
      name: signature_confirmation
      label: Signature Confirmation
      hint: Confirm information is accurate
      type: select_one
      options:
      - I certify this information is true and accurate
      - I cannot certify
      required: true
    - id: 46
      name: submission_date
      label: Submission Date
      hint: Today's date
      type: date
      options: []
      required: true
