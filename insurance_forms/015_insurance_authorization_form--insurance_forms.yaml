inputSchema:
  type: object
  properties:
    title: Insurance Authorization Form
    pages:
    - id: 1
      name: patient_information
      label: Patient Information
      hint: Please enter patient information
      type: text
      options: []
      required: false
    - id: 2
      name: insurance_info
      label: Insurance Information
      hint: Please enter insurance information
      type: text
      options: []
      required: false
    - id: 3
      name: goals
      label: Goals of Care
      hint: null
      type: select_multiple
      options:
      - Medical Treatment
      - Non-Medical
      - Both
      required: true
    - id: 4
      name: medical_history
      label: Medical History
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: authorization_to_disclose
      label: Authorization to Disclose
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date_signed
      label: Date Signed
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time_signed
      label: Time Signed
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: provider_name
      label: Provider Name
      hint: Please enter provider name
      type: text
      options: []
      required: false
    - id: 10
      name: provider_title
      label: Provider Title
      hint: Please enter provider title
      type: text
      options: []
      required: false
