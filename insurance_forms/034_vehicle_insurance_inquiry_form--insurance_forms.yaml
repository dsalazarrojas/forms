inputSchema:
  type: object
  properties:
    title: Vehicle Insurance Inquiry Form
    pages:
    - id: 1
      name: vehicle_make
      label: Vehicle Make
      hint: Please provide the vehicle's make
      type: text
      options: []
      required: true
    - id: 2
      name: vehicle_model
      label: Vehicle Model
      hint: Please provide the vehicle's model
      type: text
      options: []
      required: true
    - id: 3
      name: vehicle_year
      label: Vehicle Year
      hint: Please provide the vehicle's year
      type: number
      options: []
      required: true
    - id: 4
      name: driver_name
      label: Driver's Name
      hint: Please provide the driver's name
      type: text
      options: []
      required: true
    - id: 5
      name: driver_address
      label: Driver's Address
      hint: Please provide the driver's address
      type: text
      options: []
      required: true
    - id: 6
      name: driver_license
      label: Driver's License
      hint: Please provide the driver's license
      type: text
      options: []
      required: true
    - id: 7
      name: date_of_inquiry
      label: Date of Inquiry
      hint: Please provide the date of inquiry
      type: date
      options: []
      required: true
    - id: 8
      name: vehicle_insurance_provider
      label: Vehicle Insurance Provider
      hint: Please select the vehicle's insurance provider
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 9
      name: vehicle_insurance_type
      label: Vehicle Insurance Type
      hint: Please select the vehicle insurance type
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 10
      name: driver_phone
      label: Driver's Phone
      hint: Please provide the driver's phone number
      type: text
      options: []
      required: true
    - id: 11
      name: vehicle_purpose
      label: Vehicle Purpose
      hint: Please select the vehicle's purpose
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 12
      name: note
      label: Note
      hint: Additional information
      type: note
      options: []
      required: false
