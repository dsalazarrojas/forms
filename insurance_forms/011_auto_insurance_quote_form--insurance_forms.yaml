inputSchema:
  type: object
  properties:
    title: Auto Insurance Quote Form
    pages:
    - id: 1
      name: introduction
      label: Get Your Auto Insurance Quote
      hint: Complete this form to receive personalized insurance quotes
      type: note
      options: []
      required: false
    - id: 2
      name: personal_info
      label: Personal Information
      hint: Tell us about yourself
      type: note
      options: []
      required: false
    - id: 3
      name: first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 4
      name: last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: MM-DD-YYYY
      type: date
      options: []
      required: true
    - id: 6
      name: gender
      label: Gender
      hint: Select your gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      required: true
    - id: 7
      name: email
      label: Email Address
      hint: Where should we send your quote
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 9
      name: address
      label: Street Address
      hint: Your home address
      type: text
      options: []
      required: true
    - id: 10
      name: city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 11
      name: state
      label: State
      hint: State of residence
      type: select_one
      options:
      - Alabama
      - Alaska
      - Arizona
      - Arkansas
      - California
      - Colorado
      - Connecticut
      - Delaware
      - Florida
      - Georgia
      - Other
      required: true
    - id: 12
      name: zip_code
      label: ZIP Code
      hint: 5-digit ZIP code
      type: text
      options: []
      required: true
    - id: 13
      name: vehicle_info
      label: Vehicle Information
      hint: Details about your vehicle
      type: note
      options: []
      required: false
    - id: 14
      name: vehicle_year
      label: Vehicle Year
      hint: Year of manufacture
      type: number
      options: []
      required: true
    - id: 15
      name: vehicle_make
      label: Vehicle Make
      hint: Manufacturer name
      type: text
      options: []
      required: true
    - id: 16
      name: vehicle_model
      label: Vehicle Model
      hint: Model name
      type: text
      options: []
      required: true
    - id: 17
      name: vehicle_trim
      label: Trim Level
      hint: Trim or package
      type: text
      options: []
      required: false
    - id: 18
      name: vin
      label: VIN
      hint: Vehicle Identification Number
      type: text
      options: []
      required: false
    - id: 19
      name: mileage
      label: Current Mileage
      hint: Odometer reading
      type: number
      options: []
      required: true
    - id: 20
      name: vehicle_use
      label: Primary Vehicle Use
      hint: How do you use your vehicle
      type: select_one
      options:
      - Commute to Work
      - Business Use
      - Pleasure
      - School
      - Commercial
      required: true
    - id: 21
      name: annual_mileage
      label: Estimated Annual Mileage
      hint: Miles driven per year
      type: select_one
      options:
      - Under 5000
      - 5000-10000
      - 10000-15000
      - 15000-20000
      - Over 20000
      required: true
    - id: 22
      name: driving_history
      label: Driving History
      hint: Your driving record
      type: note
      options: []
      required: false
    - id: 23
      name: accidents_past_3_years
      label: Accidents in Past 3 Years
      hint: At-fault accidents
      type: select_one
      options:
      - None
      - '1'
      - '2'
      - 3 or more
      required: true
    - id: 24
      name: violations_past_3_years
      label: Violations in Past 3 Years
      hint: Traffic tickets
      type: select_one
      options:
      - None
      - '1'
      - '2'
      - 3 or more
      required: true
    - id: 25
      name: dui_conviction
      label: DUI Conviction History
      hint: Any DUI in past 5 years
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 26
      name: coverage_preferences
      label: Coverage Preferences
      hint: What coverage do you want
      type: select_one
      options:
      - State Minimum Liability
      - Standard Coverage
      - Full Coverage
      - Comprehensive Only
      - Collision Only
      - Not Sure
      required: true
    - id: 27
      name: current_coverage
      label: Current Coverage Limits
      hint: Your current limits if known
      type: text
      options: []
      required: false
    - id: 28
      name: deductible_preference
      label: Preferred Deductible
      hint: How much deductible
      type: select_one
      options:
      - $250
      - $500
      - $1000
      - $2000
      - Not Sure
      required: true
    - id: 29
      name: additional_drivers
      label: Additional Drivers
      hint: Will others drive this vehicle
      type: select_one
      options:
      - 'False'
      - Yes spouse
      - Yes children
      - Yes other
      required: true
    - id: 30
      name: vehicles_to_insure
      label: Number of Vehicles
      hint: How many vehicles to insure
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - 4 or more
      required: true
    - id: 31
      name: current_insurance
      label: Current Insurance Company
      hint: Who insures you now
      type: text
      options: []
      required: false
    - id: 32
      name: policy_expiry
      label: Current Policy Expiry
      hint: When does your policy expire
      type: date
      options: []
      required: false
    - id: 33
      name: discounts
      label: Discounts You May Qualify For
      hint: Select all that apply
      type: select_multiple
      options:
      - Multi-Vehicle
      - Multi-Policy
      - Safe Driver
      - Good Student
      - Military
      - Senior
      - Homeowner
      - Anti-Theft Device
      required: false
    - id: 34
      name: quote_delivery
      label: How Soon Do You Need a Quote
      hint: Your timeline
      type: select_one
      options:
      - Immediately
      - Within 24 hours
      - Within 1 week
      - Just shopping
      required: true
