inputSchema:
  type: object
  properties:
    title: Health Insurance Exclusions Review Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: exclusion_type
      label: Exclusion Type
      hint: null
      type: select_one
      options:
      - Medical Exclusion
      - Dental Exclusion
      - Vision Exclusion
      - Hearing Exclusion
      - Mental Health Exclusion
      - Mental Health and Substance Abuse Exclusion
      - Mental Health and Substance Abuse Exclusions
      required: true
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
