inputSchema:
  type: object
  properties:
    title: Health Insurance Claim Form
    pages:
    - id: 1
      name: patient_name
      label: None
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: claimant_address
      label: claimant address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: claimant_phone
      label: claimant phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: claimant_email
      label: claimant email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: claimant_dob
      label: claimant dob
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: claim_type
      label: claim type
      hint: null
      type: select_one
      options:
      - medical
      - non-medical
      required: false
    - id: 7
      name: claimant_insurance_provider
      label: claimant insurance provider
      hint: null
      type: select_one
      options:
      - blue cross
      - gold cross
      - gold plus
      required: false
    - id: 8
      name: claim_date
      label: claim date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: claim_status
      label: claim status
      hint: null
      type: select_one
      options:
      - pending
      - approved
      required: false
    - id: 10
      name: claim_total_claim_cost
      label: claim total cost
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: claim_payment_method
      label: claim payment method
      hint: null
      type: select_one
      options:
      - check
      - credit card
      required: false
