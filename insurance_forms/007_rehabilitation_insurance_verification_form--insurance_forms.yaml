inputSchema:
  type: object
  properties:
    title: Rehabilitation Insurance Verification Form
    pages:
    - id: 1
      name: insurance_info
      label: Client Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rehabilitation_insurance_info
      label: Rehabilitation Insurance Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: policy_number
      label: Policy Number
      hint: Enter policy number
      type: number
      options: []
      required: false
    - id: 4
      name: provider_information
      label: Provider Information
      hint: null
      type: text
      options: []
      required: false
