      type: date
      options: []
      required: false
    - id: 8
      name: service_hours
      label: Service Hours
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submit
      label: Submit
      hint: null
      type: select_multiple
      options:
      - Submit
      - Cancel
      required: false
    - id: 11
      name: client_email
      label: Client Email
      hint: Enter client email address
      type: email
      options: []
      required: false
    - id: 12
      name: phone
      label: Client Phone
      hint: Enter client phone number
      type: text
      options: []
      required: false
