inputSchema:
  type: object
  properties:
    title: Financial Insurance Application Request Form
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: loan_details
      label: Loan Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: credit_score
      label: Credit Score
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: financial_institution
      label: Financial Institution
      hint: null
      type: select_one
      options:
      - Bank of America
      - Wells Fargo
      - Chase
      required: true
    - id: 5
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
