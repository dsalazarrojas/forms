inputSchema:
  type: object
  properties:
    title: home_insurance_information_form
    pages:
    - id: 1
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: zip_code
      label: Zip Code
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: insurance_type
      label: Insurance Type
      hint: null
      type: select_one
      options:
      - Homeowners
      - Renters
      - Flood
      - Fire
      - Liability
      required: true
    - id: 6
      name: square_footage
      label: Square Footage
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: home_value
      label: Home Value
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: mortgage_info
      label: Mortgage Info
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: insurance_provider
      label: Insurance Provider
      hint: null
      type: select_one
      options:
      - State Farm
      - Allstate
      - Nationwide
      required: true
    - id: 10
      name: policy_holder
      label: Policy Holder
      hint: null
      type: select_one
      options:
      - Self
      - Spouse
      - Friend
      - Family
      required: true
    - id: 11
      name: policy_holder_relationship
      label: Policy Holder Relationship
      hint: null
      type: select_one
      options:
      - Parent
      - Child
      - Sibling
      - Spouse
      required: true
    - id: 12
      name: additional_info
      label: Additional Info
      hint: null
      type: note
      options: []
      required: false
