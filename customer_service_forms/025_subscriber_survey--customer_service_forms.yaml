inputSchema:
  type: object
  properties:
    title: subscriber_survey
    pages:
    - id: 1
      name: customer_feedback
      label: 1. What do you think about our service?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: quality_service
      label: 2. How would you rate our service?
      hint: null
      type: select_one
      options:
      - Good
      - Average
      - Bad
      - Very Good
      - Excellent
      required: true
    - id: 3
      name: contact_info
      label: 3. What is your contact information?
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Address
      - Other
      required: true
    - id: 4
      name: contact_date
      label: 4. When would you like to contact us?
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: contact_time
      label: 5. What time of day do you prefer to contact us?
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: source_contact
      label: 6. How did you hear about us?
      hint: null
      type: select_multiple
      options:
      - Social Media
      - Email
      - Phone
      - Word of mouth
      - Online search
      - Other
      required: true
    - id: 7
      name: suggestions
      label: 7. Do you have any suggestions for us?
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: changes
      label: 8. What would you like to see changed?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: improvements
      label: 9. How can we improve our service?
      hint: null
      type: select_multiple
      options:
      - Faster
      - More frequent
      - Better communication
      - Other
      required: false
    - id: 10
      name: other_comments
      label: 10. Do you have any other comments?
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: emotional_experience
      label: 11. How did you feel about our service?
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Neutral
      required: true
    - id: 12
      name: future_visit
      label: 12. Do you plan to come back?
      hint: null
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: true
