inputSchema:
  type: object
  properties:
    title: Beauty Service Client Application Form
    pages:
    - id: 1
      name: client_name
      label: Full Name
      hint: Legal name as it appears on ID
      type: text
      options: []
      required: true
    - id: 2
      name: client_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Phone Number
      hint: Best number to reach you
      type: text
      options: []
      required: true
    - id: 4
      name: client_address
      label: Home Address
      hint: Full street address city and zip code
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: MM-DD-YYYY format
      type: date
      options: []
      required: true
    - id: 6
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name of emergency contact
      type: text
      options: []
      required: true
    - id: 7
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number for emergency contact
      type: text
      options: []
      required: true
    - id: 8
      name: services_interested
      label: Services Interested In
      hint: Select all services you are interested in
      type: select_multiple
      options:
      - Hair Styling
      - Hair Coloring
      - Hair Cutting
      - Manicure
      - Pedicure
      - Facial Treatments
      - Makeup Application
      - Waxing
      - Eyelash Extensions
      - Eyebrow Shaping
      - Massage Therapy
      - Skin Care Consultation
      required: true
    - id: 9
      name: preferred_appointment_time
      label: Preferred Appointment Time
      hint: When do you prefer to schedule appointments
      type: select_one
      options:
      - Morning (9am-12pm)
      - Afternoon (12pm-4pm)
      - Evening (4pm-8pm)
      - Weekend
      - No Preference
      required: true
    - id: 10
      name: medical_conditions
      label: Medical Conditions
      hint: Select any conditions that may affect service
      type: select_multiple
      options:
      - Pregnancy
      - Diabetes
      - High Blood Pressure
      - Heart Condition
      - Epilepsy
      - Skin Conditions
      - Allergies
      - None
      required: true
    - id: 11
      name: skin_type
      label: Skin Type
      hint: Select your skin type
      type: select_one
      options:
      - Normal
      - Dry
      - Oily
      - Combination
      - Sensitive
      - Not Applicable
      required: false
    - id: 12
      name: hair_type
      label: Hair Type
      hint: Select your hair type
      type: select_one
      options:
      - Straight
      - Wavy
      - Curly
      - Coily
      - Fine
      - Thick
      required: false
    - id: 13
      name: product_allergies
      label: Product Allergies
      hint: List any allergies to beauty products
      type: text
      options: []
      required: false
    - id: 14
      name: current_medications
      label: Current Medications
      hint: List any medications that may affect services
      type: text
      options: []
      required: false
    - id: 15
      name: previous_salon
      label: Previous Salon or Service Provider
      hint: Name of previous salon if applicable
      type: text
      options: []
      required: false
    - id: 16
      name: how_heard_about_us
      label: How Did You Hear About Us
      hint: How did you find out about our services
      type: select_one
      options:
      - Google Search
      - Facebook
      - Instagram
      - Friend or Family Referral
      - Advertisement
      - Walked By
      - Other
      required: true
    - id: 17
      name: referral_source
      label: Referral Name
      hint: Who referred you to us
      type: text
      options: []
      required: false
    - id: 18
      name: special_requests
      label: Special Requests or Accommodations
      hint: Any special needs or requests
      type: text
      options: []
      required: false
    - id: 19
      name: terms_acceptance
      label: Terms and Conditions Acceptance
      hint: I have read and agree to all terms and conditions
      type: select_one
      options:
      - I accept
      - I do not accept
      required: true
    - id: 20
      name: privacy_policy
      label: Privacy Policy Agreement
      hint: I agree to the privacy policy
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 21
      name: consent_to_service
      label: Consent to Receive Services
      hint: I consent to receive beauty services
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 22
      name: marketing_communications
      label: Receive Marketing Communications
      hint: Would you like to receive promotional emails and texts
      type: select_one
      options:
      - Yes please
      - No thank you
      required: true
    - id: 23
      name: application_date
      label: Application Date
      hint: Today date
      type: date
      options: []
      required: true
