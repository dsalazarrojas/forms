inputSchema:
  type: object
  properties:
    title: tech_customer_support_assessment_form
    pages:
    - id: 1
      name: customer_experience
      label: Customer Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: resolution_satisfaction
      label: Resolution Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 3
      name: resolution_time
      label: Resolution Time
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: communication_channel
      label: Communication Channel
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Chat
      - In-person
      required: true
    - id: 5
      name: follow_up_report
      label: Follow-up Report
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: issue_description
      label: Issue Description
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: issue_details
      label: Issue Details
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: resolution_channel
      label: Resolution Channel
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Chat
      - In-person
      required: true
    - id: 9
      name: resolution_method
      label: Resolution Method
      hint: null
      type: select_one
      options:
      - Automated
      - Manual
      required: false
    - id: 10
      name: resolution_status
      label: Resolution Status
      hint: null
      type: select_one
      options:
      - Resolved
      - Not Resolved
      required: true
    - id: 11
      name: follow_up_time
      label: Follow-up Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: issue_solved
      label: Issue Solved
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
