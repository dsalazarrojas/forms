inputSchema:
  type: object
  properties:
    title: Retail Customer Service Feedback Form
    pages:
    - id: 1
      name: customer_experience
      label: How was your shopping experience
      hint: Tell us about it
      type: text
      options: []
      required: false
    - id: 2
      name: staff_helpfulness
      label: How helpful were the staff
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 3
      name: staff_attitude
      label: How would you rate the staff attitude
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: product_quality
      label: How would you rate the product quality
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: service_quality
      label: How would you rate the service quality
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: communication_effectiveness
      label: How effective was the communication
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 7
      name: resolution_of_issue
      label: How was the resolution of your issue
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: overall_satisfaction
      label: How satisfied are you overall
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 9
      name: email_address
      label: What is your email address
      hint: null
      type: email
      options: []
      required: false
