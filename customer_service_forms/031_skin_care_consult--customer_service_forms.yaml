inputSchema:
  type: object
  properties:
    title: skin_care_consult
    pages:
    - id: 1
      name: skin_type
      label: What is your skin type?
      hint: Select one of the following options - Normal, Dry, Oily, Combination,
        Sensitive
      type: select_one
      options:
      - Normal
      - Dry
      - Oily
      - Combination
      - Sensitive
      required: true
    - id: 2
      name: skin_condition
      label: Describe your skin condition (e.g. acne, aging, etc.)
      hint: Please provide details about your skin concerns
      type: text
      options: []
      required: true
    - id: 3
      name: skin_care_products
      label: Are you interested in skin care products?
      hint: Select one of the following options - Yes, No
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: followup
      label: How often do you follow-up with your skin care products?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      - Never
      required: true
    - id: 5
      name: followup_method
      label: How do you follow-up with your skin care products?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: skin_care_product_info
      label: Please provide detailed information about your skin care products (e.g.
        name, price, quantity)
      hint: Please provide details about your skin care products
      type: text
      options: []
      required: true
    - id: 7
      name: skin_care_product_info_price
      label: Price of the skin care product
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: skin_care_product_info_price_currency
      label: Currency of the skin care product
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: skin_care_product_info_weight
      label: Weight of the skin care product
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: skin_care_product_info_weight_unit
      label: Unit of the skin care product weight
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: skin_care_product_info_size
      label: Size of the skin care product
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: skin_care_product_info_size_unit
      label: Unit of the skin care product size
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: skin_care_product_info_quantity
      label: Quantity of the skin care product
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: skin_care_product_info_additional
      label: Additional information about the skin care product
      hint: null
      type: text
      options: []
      required: true
