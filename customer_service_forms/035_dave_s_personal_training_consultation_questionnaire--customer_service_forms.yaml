inputSchema:
  type: object
  properties:
    title: Dave's Personal Training Consultation Questionnaire
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date of birth
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: address
      label: Address
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: marital_status
      label: Marital status
      hint: null
      type: select_one
      options:
      - Single
      - Married
      - Divorced
      - In a relationship
      required: false
    - id: 8
      name: training_goals
      label: Training goals
      hint: null
      type: select_multiple
      options:
      - Fitness
      - Nutrition
      - Martial arts
      required: false
    - id: 9
      name: martial_arts_background
      label: Martial arts background
      hint: null
      type: select_multiple
      options:
      - Karate
      - Judo
      - Taekwondo
      required: false
    - id: 10
      name: fitness_level
      label: Fitness level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
    - id: 11
      name: nutrition_plan
      label: Nutrition plan
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: available_days
      label: Available days
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      required: false
    - id: 13
      name: preferred_times
      label: Preferred times
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      - Anytime
      required: false
