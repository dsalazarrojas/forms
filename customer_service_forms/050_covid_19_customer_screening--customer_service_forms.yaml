inputSchema:
  type: object
  properties:
    title: COVID 19 Customer Screening
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: For contact tracing
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: visit_date
      label: Visit Date
      hint: Today date
      type: date
      options: []
      required: true
    - id: 5
      name: visit_time
      label: Visit Time
      hint: Arrival time
      type: time
      options: []
      required: true
    - id: 6
      name: purpose_of_visit
      label: Purpose of Visit
      hint: Why are you here
      type: select_one
      options:
      - Shopping
      - Appointment
      - Delivery
      - Service
      - Inquiry
      - Other
      required: true
    - id: 7
      name: party_size
      label: Party Size
      hint: Number in your group
      type: number
      options: []
      required: true
    - id: 8
      name: current_temperature
      label: Current Temperature
      hint: In Fahrenheit
      type: number
      options: []
      required: true
    - id: 9
      name: feeling_well
      label: Are You Feeling Well
      hint: Overall wellness
      type: select_one
      options:
      - Yes - Feeling well
      - No - Not feeling well
      - Unsure
      required: true
    - id: 10
      name: symptoms_check
      label: Current Symptoms
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - Fever or chills
      - Cough
      - Shortness of breath
      - Fatigue
      - Muscle aches
      - Headache
      - Loss of taste or smell
      - Sore throat
      - Congestion
      - Nausea
      required: true
    - id: 11
      name: known_exposure
      label: Known COVID-19 Exposure
      hint: In past 14 days
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: true
    - id: 12
      name: recent_positive_test
      label: Recent Positive Test
      hint: In past 10 days
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: true
    - id: 13
      name: vaccination_status
      label: Vaccination Status
      hint: COVID-19 vaccine
      type: select_one
      options:
      - Fully vaccinated
      - Partially vaccinated
      - Not vaccinated
      - Prefer not to say
      required: false
    - id: 14
      name: travel_history
      label: Recent Travel
      hint: In past 14 days
      type: select_one
      options:
      - No travel
      - Domestic travel
      - International travel
      required: false
    - id: 15
      name: mask_worn
      label: Mask Worn
      hint: Do you have a mask
      type: select_one
      options:
      - Yes - Wearing now
      - Yes - Have one
      - No - Do not have
      required: true
    - id: 16
      name: mask_provided
      label: Mask Provided
      hint: If customer needs one
      type: select_one
      options:
      - Yes - Provided
      - No - Not needed
      - No - Refused
      required: false
    - id: 17
      name: hand_sanitized
      label: Hand Sanitized
      hint: Upon entry
      type: select_one
      options:
      - 'True'
      - 'False'
      - Refused
      required: true
    - id: 18
      name: entry_approved
      label: Entry Approved
      hint: Can customer enter
      type: select_one
      options:
      - Yes - Approved
      - No - Denied due to symptoms
      - No - Denied due to exposure
      - No - Denied no mask
      - Pending manager review
      required: true
    - id: 19
      name: denial_reason
      label: Denial Reason
      hint: If entry denied
      type: text
      options: []
      required: false
    - id: 20
      name: alternative_service
      label: Alternative Service Offered
      hint: Curbside delivery etc
      type: select_one
      options:
      - Yes - Curbside pickup
      - Yes - Delivery
      - Yes - Phone consultation
      - Yes - Online service
      - No alternatives
      - Not applicable
      required: false
    - id: 21
      name: screener_name
      label: Screener Name
      hint: Staff member
      type: text
      options: []
      required: false
    - id: 22
      name: screener_signature
      label: Screener Signature
      hint: Type full name
      type: text
      options: []
      required: false
    - id: 23
      name: customer_signature
      label: Customer Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 24
      name: additional_notes
      label: Additional Notes
      hint: Any observations
      type: text
      options: []
      required: false
