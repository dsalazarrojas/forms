      hint: null
      type: select_one
      options:
      - '{''label'': ''Billing''}'
      - '{''label'': ''General''}'
      - '{''label'': ''Other''}'
      required: false
    - id: 9
      name: issue_priority
      label: Issue Priority
      hint: null
      type: select_one
      options:
      - '{''label'': ''Low''}'
      - '{''label'': ''Medium''}'
      - '{''label'': ''High''}'
      required: false
    - id: 10
      name: issue_status
      label: Issue Status
      hint: null
      type: select_one
      options:
      - '{''label'': ''Open''}'
      - '{''label'': ''Closed''}'
      - '{''label'': ''In Progress''}'
      required: false
    - id: 11
      name: additional_info
      label: Additional Info
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
