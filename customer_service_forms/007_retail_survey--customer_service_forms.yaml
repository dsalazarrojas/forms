inputSchema:
  type: object
  properties:
    title: retail_survey
    pages:
    - id: 1
      name: page_1
      label: What is the primary reason for your visit?
      hint: null
      type: select_one
      options:
      - social media
      - word of mouth
      - ad
      - other
      required: true
    - id: 2
      name: page_2
      label: How did you find us?
      hint: null
      type: select_one
      options:
      - social media
      - word of mouth
      - ad
      - other
      required: true
    - id: 3
      name: page_3
      label: What is your age?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: page_4
      label: How satisfying is your experience?
      hint: null
      type: select_one
      options:
      - very satisfying
      - somewhat satisfying
      - neither satisfying nor satisfying
      - very unsatisfying
      required: true
    - id: 5
      name: page_5
      label: Do you have a previous experience with us?
      hint: null
      type: select_one
      options:
      - 'yes'
      - 'no'
      required: true
    - id: 6
      name: page_6
      label: How often do you visit our store?
      hint: null
      type: select_multiple
      options:
      - very often
      - often
      - occasionally
      - rarely
      - never
      required: true
    - id: 7
      name: page_7
      label: Have you been to our store today?
      hint: null
      type: select_one
      options:
      - 'yes'
      - 'no'
      required: true
    - id: 8
      name: page_8
      label: How did you get to our store?
      hint: null
      type: select_multiple
      options:
      - car
      - public transportation
      - on foot
      - bicycle
      - other
      required: true
    - id: 9
      name: page_9
      label: Do you have a phone number?
      hint: null
      type: text
      options: []
      required: false
