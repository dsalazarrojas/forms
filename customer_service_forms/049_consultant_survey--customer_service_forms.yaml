inputSchema:
  type: object
  properties:
    title: Consultant Survey
    pages:
    - id: 1
      name: section_customer_ident
      label: -- Customer Identification --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_full_name_ident
      label: Customer Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: customer_email_ident
      label: Customer Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: customer_phone_ident
      label: Customer Phone Number
      hint: Format - (555) 555-5555
      type: text
      options: []
      required: true
    - id: 5
      name: organization_name_ident
      label: Organization Name (If applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: section_consultation_inquiry
      label: -- Consultation Inquiry and Goals --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: primary_consultation_topic
      label: Primary Topic of Interest for Consultation
      hint: Select the most appropriate category
      type: select_one
      options:
      - Strategy/Business Growth
      - Technology/IT Solutions
      - Financial/Risk Management
      - Marketing/Sales Optimization
      - Operational Efficiency
      - Human Resources/Talent
      - Customer Service Improvement
      - Product Development/Innovation
      required: true
    - id: 8
      name: primary_challenge_desc
      label: Brief Summary of the Primary Challenge or Problem
      hint: Max 1000 characters
      type: text
      options: []
      required: true
    - id: 9
      name: desired_consultation_outcome
      label: What is your single most important goal for this consultation?
      hint: One clear and actionable objective
      type: text
      options: []
      required: true
    - id: 10
      name: section_meeting_logistics
      label: -- Meeting Logistics --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: meeting_format_pref
      label: Preferred Meeting Format
      hint: null
      type: select_one
      options:
      - Video Call (Zoom/Teams)
      - Phone Call
      - In-person (At Client Site)
      - In-person (At Consultant Office)
      required: true
    - id: 12
      name: preferred_consultation_date
      label: Preferred Date for Consultation
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: preferred_consultation_time
      label: Preferred Time Slot
      hint: null
      type: time
      options: []
      required: true
    - id: 14
      name: section_budget_readiness
      label: -- Budget and Readiness --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: project_budget_range_ident
      label: Estimated Project Budget Range ($)
      hint: null
      type: select_one
      options:
      - Less than $5,000
      - $5,000 - $25,000
      - $25,000 - $50,000
      - $50,000 - $100,000
      - $100,000+
      required: true
    - id: 16
      name: project_urgency_ident
      label: How soon do you plan to start?
      hint: null
      type: select_one
      options:
      - Immediately
      - Within 1 Month
      - Within 3 Months
      - Within 6 Months
      - Planning Phase (6+ Months)
      required: true
    - id: 17
      name: section_additional_info
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: referral_source_ident
      label: How did you hear about our consultancy?
      hint: null
      type: select_one
      options:
      - Website/Search Engine
      - Professional Referral
      - Conference/Event
      - Social Media (LinkedIn)
      - Advertising/PR
      - Other
      required: false
    - id: 19
      name: additional_comments_desc
      label: Any additional details you'd like to share
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: submission_date
      label: Date of Consultation Request
      hint: null
      type: date
      options: []
      required: true
    - id: 21
      name: authorized_representative_name_label
      label: Authorized Representative Name
      hint: null
      type: text
      options: []
      required: true
    - id: 22
      name: authorized_representative_title_label
      label: Authorized Representative Title
      hint: null
      type: text
      options: []
      required: true
