inputSchema:
  type: object
  properties:
    title: Support Customer Feedback Survey
    pages:
    - id: 1
      name: rating
      label: How would you rate your overall satisfaction with our customer support?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Neutral
      - Very dissatisfied
      required: true
    - id: 2
      name: reason
      label: What was the reason for your last interaction with our support team?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: issue
      label: What was the issue you had with our support team?
      hint: null
      type: select_multiple
      options:
      - Not familiar with the product
      - Not helpful
      - Not responsive
      - Other (please specify)
      required: true
    - id: 4
      name: effectiveness
      label: How would you rate the effectiveness of our support team in resolving
        your issue?
      hint: null
      type: select_one
      options:
      - Very effective
      - Neutral
      - Very ineffective
      required: true
    - id: 5
      name: likelihood_to_recommend
      label: How likely are you to recommend our company to a friend or colleague?
      hint: null
      type: select_one
      options:
      - Very likely
      - Somewhat likely
      - Neutral
      - Somewhat unlikely
      - Very unlikely
      required: true
    - id: 6
      name: resolution
      label: What was the resolution or outcome of your issue?
      hint: null
      type: select_one
      options:
      - Issue was resolved
      - Issue was not resolved
      - I was not sure
      - Other (please specify)
      required: true
    - id: 7
      name: additional_comments
      label: Would you like to provide additional comments or feedback about your
        experience?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 8
      name: support_team
      label: What was the issue with our support team that you experienced?
      hint: null
      type: select_multiple
      options:
      - Not helpful
      - Not responsive
      - Not familiar with the product
      - Other (please specify)
      required: false
    - id: 9
      name: communication
      label: How would you rate the communication from our support team?
      hint: null
      type: select_one
      options:
      - Very good
      - Somewhat good
      - Neutral
      - Somewhat poor
      - Very poor
      required: true
    - id: 10
      name: suggestions
      label: What improvements would you like to see us make to improve customer support?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: other_comments
      label: Any other comments or suggestions?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: open_ended
      label: Additional comments or feedback?
      hint: null
      type: note
      options: []
      required: false
