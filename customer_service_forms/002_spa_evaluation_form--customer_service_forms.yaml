inputSchema:
  type: object
  properties:
    title: SPA Evaluation Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: Please share your experience with our SPA service.
      type: text
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Name
      hint: Please provide your name.
      type: text
      options: []
      required: true
    - id: 3
      name: customer_since
      label: How long have you been a customer?
      hint: Please provide the number of months/years you've been with us.
      type: number
      options: []
      required: true
    - id: 4
      name: medical_condition
      label: Medical Condition
      hint: Please describe any medical conditions we should be aware of.
      type: text
      options: []
      required: false
    - id: 5
      name: medical_info
      label: Do you have any medical conditions?
      hint: Please answer 'Yes' or 'No'.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: product_rating
      label: Product/Service Rating
      hint: Rate our product/service (Good, Fair, Excellent, Bad, Very Bad)
      type: select_one
      options:
      - Good
      - Fair
      - Excellent
      - Bad
      - Very Bad
      required: false
    - id: 7
      name: evaluation_process
      label: Evaluation Process
      hint: Describe our evaluation process.
      type: text
      options: []
      required: false
    - id: 8
      name: eval_clear
      label: Was the evaluation process clear?
      hint: Yes or No.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: customer_satisfaction
      label: Customer Satisfaction
      hint: Rate your satisfaction (Satisfied, Dissatisfied)
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: true
    - id: 10
      name: eval_satisfied
      label: Why are you satisfied/dissatisfied?
      hint: Please provide a brief description.
      type: text
      options: []
      required: true
    - id: 11
      name: additional_notes
      label: Additional Notes
      hint: Share anything else you'd like to tell us about your experience.
      type: text
      options: []
      required: false
    - id: 12
      name: suggestions
      label: Suggestions
      hint: Do you have any suggestions for improving our service?
      type: text
      options: []
      required: false
