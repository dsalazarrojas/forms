inputSchema:
  type: object
  properties:
    title: Customer Service Weekly Interaction Report
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: customer name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time_spent
      label: time spent
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: issue_description
      label: issue description
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: resolution_method
      label: resolution method
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: outcome
      label: outcome
      hint: null
      type: select_one
      options:
      - resolved
      - unresolved
      - pending
      - other
      required: false
    - id: 8
      name: customer_feedback
      label: customer feedback
      hint: null
      type: text
      options: []
      required: false
