inputSchema:
  type: object
  properties:
    title: my_voice_profile
    pages:
    - id: 1
      name: customer_service_form
      label: My Voice Profile
      hint: Please describe your current singing style.
      type: text
      options: []
      required: false
    - id: 2
      name: customer_service_form_singing_lessons
      label: Singing Lessons
      hint: null
      type: select_one
      options:
      - Vocal Technique
      - Voice Type
      required: false
    - id: 3
      name: customer_service_form_singing_lessons_frequency
      label: Singing Lessons Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      required: false
    - id: 4
      name: customer_service_form_singing_style
      label: Singing Style
      hint: null
      type: select_one
      options:
      - Musical Theatre
      - Classical
      - Pop
      required: false
    - id: 5
      name: customer_service_form_singing_style_other
      label: Other Singing Style
      hint: Please specify other singing styles (e.g., jazz, rock).
      type: text
      options: []
      required: false
    - id: 6
      name: customer_service_form_vocal_range
      label: Vocal Range
      hint: Describe your current vocal range.
      type: text
      options: []
      required: false
    - id: 7
      name: customer_service_form_experience
      label: Singing Experience
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
    - id: 8
      name: customer_service_form_audience
      label: Singing in Front of an Audience
      hint: Yes or No
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 9
      name: customer_service_form_goals
      label: Singing Goals
      hint: What are your singing goals?
      type: text
      options: []
      required: false
    - id: 10
      name: customer_service_form_additional_info
      label: Additional Information
      hint: null
      type: note
      options: []
      required: false
