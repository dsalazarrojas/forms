inputSchema:
  type: object
  properties:
    title: Consent Form COVID 19 Pandemic
    pages:
    - id: 1
      name: section_patient_info
      label: -- Patient Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: patient_phone
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: section_symptom_screening
      label: -- Screening Questions --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: current_symptoms
      label: Are you currently experiencing fever, cough, or shortness of breath?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 6
      name: travel_history
      label: Have you traveled internationally in the last 14 days?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 7
      name: contact_history
      label: Have you been in close contact with anyone diagnosed with COVID-19?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 8
      name: section_informed_consent
      label: -- Informed Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: service_risk_acknowledgment
      label: I understand the risks of receiving services during the pandemic
      hint: null
      type: select_one
      options:
      - I understand and acknowledge
      - Other
      required: true
    - id: 10
      name: safety_protocol_agreement
      label: I agree to follow all office safety protocols (masks, distancing)
      hint: null
      type: select_one
      options:
      - I agree
      - Other
      required: true
    - id: 11
      name: telehealth_option_awareness
      label: I am aware that telehealth may be an alternative to in-person visits
      hint: null
      type: select_one
      options:
      - I am aware
      - Other
      required: false
    - id: 12
      name: section_authorization
      label: -- Authorization --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: final_consent_check
      label: Do you consent to proceed with the treatment/service?
      hint: null
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 14
      name: signature
      label: Electronic Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: date_signed
      label: Date
      hint: null
      type: date
      options: []
      required: true
