inputSchema:
  type: object
  properties:
    title: Marketplace Seller Interaction Inquiry Form
    pages:
    - id: 1
      name: buyer_inquiry
      label: buyer_inquiry
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: buyer_info
      label: buyer_info
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: seller_info
      label: seller_info
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: interaction_type
      label: interaction_type
      hint: null
      type: select_one
      options:
      - Phone Call
      - Email
      - Live Chat
      required: true
    - id: 5
      name: date_of_interaction
      label: date_of_interaction
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: time_of_interaction
      label: time_of_interaction
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: follow_up_status
      label: follow_up_status
      hint: null
      type: select_one
      options:
      - Not Followed Up
      - Followed Up
      - Follow Up Scheduled
      required: true
    - id: 8
      name: additional_info
      label: additional_info
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: assigned_agent
      label: assigned_agent
      hint: null
      type: text
      options: []
      required: true
