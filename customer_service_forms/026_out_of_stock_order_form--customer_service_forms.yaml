inputSchema:
  type: object
  properties:
    title: Out Of Stock Order Form
    pages:
    - id: 1
      name: customer_name
      label: customer name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_id
      label: product id
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: customer_email
      label: customer email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: customer_phone
      label: customer phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: product_name
      label: product name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: reason_for_ordering
      label: reason for ordering
      hint: null
      type: select_one
      options:
      - unavailable
      - unavailable due to production delays
      - backorder
      - other
      required: true
    - id: 7
      name: alternative_product_id
      label: alternative product id
      hint: null
      type: select_one
      options:
      - '1234'
      - '5678'
      required: false
    - id: 8
      name: message
      label: message
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: assigned_to
      label: assigned to
      hint: null
      type: select_one
      options:
      - chatjimmy
      - janesmith
      required: true
    - id: 10
      name: customer_message
      label: customer message
      hint: null
      type: text
      options: []
      required: false
