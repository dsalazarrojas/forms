inputSchema:
  type: object
  properties:
    title: Submit Your Questions Or Requests
    pages:
    - id: 1
      name: question_or_request
      label: What's your question or request?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: category
      label: Category
      hint: null
      type: select_multiple
      options:
      - Support
      - General Inquiry
      - Other
      required: false
    - id: 8
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: follow_up_method
      label: How would you like to be followed up on?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: follow_up_time
      label: Follow-up time
      hint: null
      type: time
      options: []
      required: false
