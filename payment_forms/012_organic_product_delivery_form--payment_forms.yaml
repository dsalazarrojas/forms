inputSchema:
  type: object
  properties:
    title: Organic Product Delivery Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: delivery_address
      label: Delivery Address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: organic_product
      label: Organic Product
      hint: null
      type: select_one
      options:
      - Product 1
      - Product 2
      - Product 3
      required: false
    - id: 4
      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: order_instructions
      label: Special Instructions
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: total
      label: Total
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 10
      name: confirm_order
      label: Confirm Order
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
