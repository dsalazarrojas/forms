inputSchema:
  type: object
  properties:
    title: Legal Services Payment Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: Enter client name
      type: text
      options: []
      required: false
    - id: 2
      name: contact_email
      label: Contact Email
      hint: Enter contact email
      type: email
      options: []
      required: false
    - id: 3
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: service_name
      label: Service Name
      hint: Enter service name
      type: text
      options: []
      required: false
    - id: 5
      name: service_description
      label: Service Description
      hint: Describe the service
      type: text
      options: []
      required: false
    - id: 6
      name: amount
      label: Amount
      hint: Enter amount to be paid
      type: number
      options: []
      required: false
    - id: 7
      name: payment_method
      label: Payment Method
      hint: Choose payment method
      type: select_one
      options:
      - '{''label'': ''Bank Transfer''}'
      - '{''label'': ''Credit Card''}'
      - '{''label'': ''Pay via PayPal''}'
      - '{''label'': ''Other''}'
      - '{''label'': ''Wire Transfer''}'
      required: false
    - id: 8
      name: payment_details
      label: Payment Details
      hint: More payment details
      type: text
      options: []
      required: false
