inputSchema:
  type: object
  properties:
    title: Exclusive Color Phone Pre-Order Form
    pages:
    - id: 1
      name: order_info
      label: Order Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Credit Card
      - PayPal
      - Apple Pay
      required: false
    - id: 3
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: billing_info
      label: Billing Info
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: shipping_info
      label: Shipping Info
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: submit_order
      label: Submit Order
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
