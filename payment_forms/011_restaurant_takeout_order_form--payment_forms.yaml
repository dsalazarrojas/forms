inputSchema:
  type: object
  properties:
    title: Restaurant Takeout Order Form
    pages:
    - id: 1
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: customer_name
      label: customer name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_number
      label: contact number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: order_date
      label: order date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: order_time
      label: order time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: order_details
      label: order details
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: order_total
      label: order total
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: payment_status
      label: payment status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
