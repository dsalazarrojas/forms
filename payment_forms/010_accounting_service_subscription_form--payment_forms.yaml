inputSchema:
  type: object
  properties:
    title: Accounting Service Subscription Form
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: Legal name of the company subscribing to accounting services
      type: text
      options: []
      required: true
    - id: 2
      name: contact_person
      label: Contact Person
      hint: Full name of the primary contact person
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact Email
      hint: Business email for communication regarding the subscription
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Contact Phone
      hint: Phone number for communication regarding the subscription
      type: text
      options: []
      required: true
    - id: 5
      name: business_address
      label: Business Address
      hint: Complete business address including street, city, state, and zip code
      type: text
      options: []
      required: true
    - id: 6
      name: service_package
      label: Service Package Selected
      hint: Choose the accounting service package you wish to subscribe to
      type: select_one
      options:
      - Basic Bookkeeping
      - Premium Bookkeeping
      - Tax Preparation Plus
      - Complete Accounting Suite
      - Custom Package
      required: true
    - id: 7
      name: billing_cycle
      label: Billing Cycle
      hint: How often do you want to be billed
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Semi-annually
      - Annually
      required: true
    - id: 8
      name: subscription_start_date
      label: Subscription Start Date
      hint: When should the subscription begin
      type: date
      options: []
      required: true
    - id: 9
      name: services_included
      label: Services Included
      hint: Select all services that are part of your subscription
      type: select_multiple
      options:
      - Monthly bookkeeping
      - Financial reporting
      - Tax preparation
      - Payroll processing
      - Budget planning
      - Advisory consultations
      - Audit support
      required: true
    - id: 10
      name: payment_method
      label: Payment Method
      hint: How will you pay for the subscription
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Bank Transfer
      - Check
      - ACH/Electronic Check
      required: true
    - id: 11
      name: credit_card_number
      label: Credit Card Number
      hint: Enter your credit card number (if selected as payment method)
      type: text
      options: []
      required: false
    - id: 12
      name: card_expiration
      label: Card Expiration Date
      hint: Enter the expiration date of your card (MM/YY)
      type: text
      options: []
      required: false
    - id: 13
      name: billing_zip_code
      label: Billing Zip Code
      hint: Zip code associated with your payment method
      type: text
      options: []
      required: false
    - id: 14
      name: terms_agreement
      label: Terms Agreement
      hint: Do you agree to the terms and conditions of the subscription
      type: select_one
      options:
      - Yes, I agree to the terms and conditions
      - No, I do not agree to the terms and conditions
      required: true
