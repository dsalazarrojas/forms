inputSchema:
  type: object
  properties:
    title: Stablecoin Payment Information Request
    pages:
    - id: 1
      name: payment_details
      label: Payment Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Card number
      - Account number
      - Bank transfer
      - Other
      required: true
    - id: 3
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: payee_details
      label: Payee Details
      hint: null
      type: select_multiple
      options:
      - Individual
      - Organization
      required: true
