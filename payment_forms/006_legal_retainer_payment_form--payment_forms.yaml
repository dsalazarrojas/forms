inputSchema:
  type: object
  properties:
    title: legal_retainer_payment_form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: Enter the client name
      type: text
      options: []
      required: false
    - id: 2
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: retainer_term
      label: Retainer Term
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: retainer_type
      label: Retainer Type
      hint: null
      type: select_multiple
      options:
      - Flat Fee
      - Hourly Rate
      required: false
    - id: 5
      name: payment_terms
      label: Payment Terms
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Draft
      - Under Review
      - Paid
      required: false
    - id: 7
      name: client_email
      label: Client Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: client_phone
      label: Client Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Cash
      - Bank Transfer
      - Credit Card
      required: false
    - id: 10
      name: payment_note
      label: Payment Note
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: additional_terms
      label: Additional Terms
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: payment_date
      label: Payment Date
      hint: null
      type: time
      options: []
      required: false
    - id: 13
      name: assigned_user
      label: Assigned User
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: assigned_user_email
      label: Assigned User Email
      hint: null
      type: email
      options: []
      required: false
