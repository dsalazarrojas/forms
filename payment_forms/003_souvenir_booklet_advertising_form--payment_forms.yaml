inputSchema:
  type: object
  properties:
    title: Souvenir Booklet Advertising Form
    pages:
    - id: 1
      name: business_details
      label: Business Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: ad_size
      label: Ad Size
      hint: null
      type: select_one
      options:
      - '{''name'': ''small'', ''label'': ''Small''}'
      - '{''name'': ''large'', ''label'': ''Large''}'
      - '{''name'': ''extra_large'', ''label'': ''Extra Large''}'
      required: false
    - id: 3
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: payment_details
      label: Payment Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - '{''name'': ''card'', ''label'': ''Card''}'
      - '{''name'': ''banktransfer'', ''label'': ''Bank Transfer''}'
      required: false
    - id: 6
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
