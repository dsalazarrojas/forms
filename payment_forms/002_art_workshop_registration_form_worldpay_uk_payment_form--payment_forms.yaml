inputSchema:
  type: object
  properties:
    title: Art Workshop Registration Form WorldPay UK Payment Form
    pages:
    - id: 1
      name: section_header_1
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: We will send confirmation to this address
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Contact number for the workshop
      type: text
      options: []
      required: true
    - id: 6
      name: section_header_2
      label: -- Workshop Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: workshop_type
      label: Select Workshop
      hint: Choose the art workshop you wish to attend
      type: select_one
      options:
      - Oil Painting Fundamentals
      - Watercolor Techniques
      - Sculpture Basics
      - Digital Art - Introduction
      - Mixed Media Collage
      - Portrait Drawing
      - Advanced Acrylic Painting
      required: true
    - id: 8
      name: workshop_date
      label: Preferred Workshop Date
      hint: Select your preferred session
      type: date
      options: []
      required: true
    - id: 9
      name: experience_level
      label: Experience Level
      hint: Your prior art experience
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Professional
      required: true
    - id: 10
      name: section_header_3
      label: -- Materials & Fees --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: materials_included
      label: Materials Package
      hint: Select if you need materials provided by the workshop
      type: select_one
      options:
      - Yes, include materials (GBP 25)
      - No, I will provide my own
      required: true
    - id: 12
      name: registration_fee
      label: Registration Fee
      hint: Base fee for workshop attendance
      type: number
      options: []
      required: true
    - id: 13
      name: materials_fee
      label: Materials Fee
      hint: Optional materials package fee
      type: number
      options: []
      required: false
    - id: 14
      name: total_amount
      label: Total Amount (GBP)
      hint: Sum of all fees
      type: number
      options: []
      required: true
    - id: 15
      name: section_header_4
      label: -- Payment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: payment_method
      label: Payment Method
      hint: Select your preferred payment option
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Bank Transfer
      required: true
    - id: 17
      name: cardholder_name
      label: Cardholder Name
      hint: Name as it appears on your card
      type: text
      options: []
      required: true
    - id: 18
      name: section_header_5
      label: -- Additional Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: dietary_requirements
      label: Dietary Requirements or Allergies
      hint: Let us know if you have any special requirements
      type: text
      options: []
      required: false
    - id: 20
      name: accessibility_needs
      label: Accessibility Needs
      hint: Do you require any accessibility accommodations?
      type: select_one
      options:
      - false
      - Wheelchair Access
      - Hearing Loop
      - Large Print Materials
      - Other
      required: false
    - id: 21
      name: emergency_contact
      label: Emergency Contact Name
      hint: Name of emergency contact
      type: text
      options: []
      required: false
    - id: 22
      name: emergency_phone
      label: Emergency Contact Phone
      hint: Phone number of emergency contact
      type: text
      options: []
      required: false
    - id: 23
      name: terms_accepted
      label: I agree to the terms and conditions
      hint: Please confirm you accept our workshop policies
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 24
      name: marketing_consent
      label: Receive updates about future workshops
      hint: Optional - we will not share your information
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 25
      name: additional_comments
      label: Additional Comments or Questions
      hint: Any other information you would like to share
      type: text
      options: []
      required: false
