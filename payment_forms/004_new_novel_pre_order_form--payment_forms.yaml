inputSchema:
  type: object
  properties:
    title: New Novel Pre Order Form
    pages:
    - id: 1
      name: book_title
      label: Book Title
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: author
      label: author
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: signed_request
      label: Signed or Gift
      hint: Check if book is signed or gifted
      type: select_multiple
      options:
      - Signed
      - Gift
      - Neither
      required: false
    - id: 4
      name: shipping_name
      label: Shipping Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: shipping_email
      label: Shipping Email
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: shipping_phone
      label: Shipping Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: shipping_city
      label: Shipping City
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: shipping_state
      label: Shipping State
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: shipping_zip
      label: Shipping Zip
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: shipping_country
      label: Shipping Country
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: shipping_date
      label: Shipping Date
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: shipping_method
      label: Shipping Method
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: order_comments
      label: Order Comments
      hint: null
      type: text
      options: []
      required: false
