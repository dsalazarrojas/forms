inputSchema:
  type: object
  properties:
    title: Reusable Takeout Container Order Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: order_type
      label: Order Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Credit Card'', ''label'': ''Credit Card''}'
      - '{''id'': 2, ''name'': ''Cash'', ''label'': ''Cash''}'
      required: false
    - id: 7
      name: order_note
      label: Order Note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: customer_note
      label: Customer Note
      hint: null
      type: note
      options: []
      required: false
