    - id: 9
      name: customer_message
      label: customer_message
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: merchant_message
      label: merchant_message
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: support_message
      label: support_message
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: dispute_date
      label: dispute_date
      hint: null
      type: date
