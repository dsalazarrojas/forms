inputSchema:
  type: object
  properties:
    title: Mobile Payment Not Received Dispute Form
    pages:
    - id: 1
      name: mobile_payment_not_received_dispute_form_1
      label: mobile_payment_details
      hint: null
      type: select_multiple
      options:
      - Payment method not received
      - Payment method wrong
      - Payment method not recognized
      required: true
    - id: 2
      name: mobile_payment_not_received_dispute_form_2
      label: order_details
      hint: null
      type: select_multiple
      options:
      - Order amount
      - Order date
      - Order time
      - Order status
      required: true
    - id: 3
      name: mobile_payment_not_received_dispute_form_3
      label: user_info
      hint: null
      type: select_one
      options:
      - Customer
      - Merchant
      - Support
      - Other
      required: true
    - id: 4
      name: mobile_payment_not_received_dispute_form_4
      label: reason_for_dispute
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: mobile_payment_not_received_dispute_form_5
      label: attachment_1
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: mobile_payment_not_received_dispute_form_6
      label: attachment_2
      hint: null
      type: text
      options: []
      required: false
    - id: 7
