inputSchema:
  type: object
  properties:
    title: Historical Society Donation Form
    pages:
    - id: 1
      name: donation_amount
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: donor_info
      label: Donor Information
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: donor_name
      label: Donor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: donor_email
      label: Donor Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: donor_phone
      label: Donor Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Stripe
      - PayPal
      - Bank Transfer
      required: true
    - id: 7
      name: donor_comment
      label: Donor Comment
      hint: null
      type: text
      options: []
      required: false
