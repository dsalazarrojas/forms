inputSchema:
  type: object
  properties:
    title: Property Reservation Payment Form
    pages:
    - id: 1
      name: payment_form
      label: payment_form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: reservation_details
      label: reservation_details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: guest_email
      label: guest_email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: payment_method
      label: payment_method
      hint: null
      type: select_one
      options:
      - card
      - cash
      - paypal
      - paypals
      required: false
    - id: 5
      name: payment_amount
      label: payment_amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: payment_date
      label: payment_date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: payment_time
      label: payment_time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: note
      label: note
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: payment_status
      label: payment_status
      hint: null
      type: select_multiple
      options:
      - pending
      - completed
      - cancelled
      required: false
    - id: 10
      name: reservation_id
      label: reservation_id
      hint: null
      type: number
      options: []
      required: false
