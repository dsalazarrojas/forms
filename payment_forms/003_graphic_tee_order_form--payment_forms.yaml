inputSchema:
  type: object
  properties:
    title: Graphic Tee Order Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: Enter a valid email address
      type: email
      options: []
      required: false
    - id: 4
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: shipping_city
      label: City
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: shipping_state
      label: State
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: shipping_zip
      label: Zip
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''credit_card''}'
      - '{''id'': 2, ''name'': ''paypal''}'
      - '{''id'': 3, ''name'': ''bank_transfer''}'
      - '{''id'': 4, ''name'': ''cash_on_delivery''}'
      required: false
    - id: 9
      name: confirm_email
      label: Confirm Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: total_amount
      label: Total Amount
      hint: null
      type: number
      options: []
      required: false
