inputSchema:
  type: object
  properties:
    title: Travel Payment Form
    pages:
    - id: 1
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: travel_type
      label: travel type
      hint: null
      type: text
      options: []
      required: false
