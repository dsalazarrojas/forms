      - Food
      - Transportation
      - Other
      required: false
    - id: 5
      name: expense_amount
      label: Expense Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: expense_note
      label: Expense Note
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: traveler_count
      label: Traveler Count
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_user
      label: Assigned User
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: assigned_group
      label: Assigned Group
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: expense_status
      label: Expense Status
      hint: null
      type: select_one
      options:
      - Pending
      - Paid
      required: false
    - id: 11
      name: expense_submitted_by
      label: Expense Submitted By
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: travel_payment_amount
      label: Travel Payment Amount
      hint: null
      type: number
      options: []
      required: false
