inputSchema:
  type: object
  properties:
    title: Online Account Recharge Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: account_number
      label: Account Number
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: account_type
      label: Account Type
      hint: null
      type: select_one
      options:
      - Prepaid
      - Digital Wallet
      - Membership
      required: false
    - id: 4
      name: amount
      label: Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Card
      - Bank Transfer
      - Online Pay
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
    - id: 10
      name: form_id
      label: Form ID
      hint: null
      type: number
      options: []
      required: false
