inputSchema:
  type: object
  properties:
    title: Reception Check Out Form
    pages:
    - id: 1
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Paid
      - Unpaid
      required: true
    - id: 4
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: true
    - id: 5
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: payment_time
      label: Payment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: payment_terms
      label: Payment Terms
      hint: null
      type: note
      options: []
      required: true
    - id: 10
      name: payment_details
      label: Payment Details
      hint: null
      type: note
      options: []
      required: true
    - id: 11
      name: form_submitted_at
      label: Form Submitted At
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: total_amount
      label: Total
      hint: null
      type: number
      options: []
      required: false
