inputSchema:
  type: object
  properties:
    title: PTA School Improvement Donation Form
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: donation_amount
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - '{''option1'': ''Credit Card''}'
      - '{''option2'': ''Bank Transfer''}'
      - '{''option3'': ''Check''}'
      required: false
    - id: 7
      name: payment_details
      label: Payment Details
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - '{''option1'': ''Send''}'
      - '{''option2'': ''Cancel''}'
      required: false
    - id: 10
      name: email_send
      label: Email Send
      hint: null
      type: select_one
      options:
      - '{''option1'': True}'
      - '{''option2'': False}'
      required: false
