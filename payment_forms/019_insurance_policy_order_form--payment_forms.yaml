      - Health
      - Auto
      - Home
      - Other
      required: false
    - id: 6
      name: policy_start_date
      label: Policy Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: policy_end_date
      label: Policy End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: policy_status
      label: Policy Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 9
      name: policy_amount
      label: Policy Amount
      hint: null
      type: number
      options: []
      required: false
