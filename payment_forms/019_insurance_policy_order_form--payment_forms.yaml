inputSchema:
  type: object
  properties:
    title: Insurance Policy Order Form
    pages:
    - id: 1
      name: user_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: user_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: user_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: user_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: insurance_type
      label: Insurance Type
      hint: null
      type: select_one
      options:
