      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: adjustment_type
      label: Adjustment Type
      hint: null
