      - Cancellation Adjustment
      - Refund Adjustment
      required: false
    - id: 5
      name: amount
      label: Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Bank Transfer
      - Check
      required: false
    - id: 8
      name: payment_terms
      label: Payment Terms
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: submit_button
      label: Submit
      hint: null
      type: text
      options: []
      required: false
