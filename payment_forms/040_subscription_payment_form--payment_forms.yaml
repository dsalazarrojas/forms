inputSchema:
  type: object
  properties:
    title: Subscription Payment Form
    pages:
    - id: 1
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - credit card
      - debit card
      - paypal
      - bank transfer
      required: false
    - id: 2
      name: billing_address
      label: Billing Address
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: billing_frequency
      label: Billing Frequency
      hint: null
      type: select_one
      options:
      - monthly
      - quarterly
      - annually
      required: false
    - id: 8
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: payment_frequency
      label: Payment Frequency
      hint: null
      type: select_multiple
      options:
      - weekly
      - monthly
      - quarterly
      - annually
      required: false
