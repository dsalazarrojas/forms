inputSchema:
  type: object
  properties:
    title: Afterpay Shoes Order Form
    pages:
    - id: 1
      name: customer_full_name
      label: Customer Full Name
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Email Address
      hint: Enter your email for order confirmation
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Phone Number
      hint: Enter your phone number for delivery updates
      type: text
      options: []
      required: true
    - id: 4
      name: shipping_address
      label: Shipping Address
      hint: Enter the complete address for delivery
      type: text
      options: []
      required: true
    - id: 5
      name: billing_address_same_as_shipping
      label: Billing Address Same as Shipping
      hint: Is your billing address the same as your shipping address?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: billing_address
      label: Billing Address
      hint: Enter the complete billing address if different from shipping
      type: text
      options: []
      required: false
    - id: 7
      name: foot_measurement_header
      label: -- Foot Measurement --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: shoe_size_us
      label: Shoe Size (US)
      hint: Enter your US shoe size
      type: number
      options: []
      required: true
    - id: 9
      name: foot_width
      label: Foot Width
      hint: What is your foot width?
      type: select_one
      options:
      - Narrow
      - Medium
      - Wide
      - Extra Wide
      required: true
    - id: 10
      name: dominant_foot
      label: Dominant Foot
      hint: Which foot is larger or more dominant?
      type: select_one
      options:
      - Left
      - Right
      - Both Equal
      required: false
    - id: 11
      name: shoe_category_header
      label: -- Shoe Category --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: shoe_category
      label: Shoe Category
      hint: Select the type of shoes you're looking for
      type: select_one
      options:
      - Athletic
      - Casual
      - Dress
      - Work/Professional
      - Sandals
      - Boots
      - Slippers
      - Specialty (Running, Hiking, etc.)
      required: true
    - id: 13
      name: specific_shoe_type
      label: Specific Shoe Type
      hint: Enter the specific type of shoe you want
      type: text
      options: []
      required: true
    - id: 14
      name: brand_preference
      label: Brand Preference
      hint: Do you have a preferred shoe brand?
      type: text
      options: []
      required: false
    - id: 15
      name: color_preference
      label: Color Preference
      hint: What color would you like for your shoes?
      type: text
      options: []
      required: false
    - id: 16
      name: material_preference
      label: Material Preference
      hint: Do you have a preference for the material of the shoes?
      type: select_one
      options:
      - Leather
      - Canvas
      - Synthetic
      - Mesh
      - Suede
      - Rubber
      - No Preference
      required: false
    - id: 17
      name: special_features
      label: Special Features
      hint: Do you need any special features in your shoes?
      type: select_multiple
      options:
      - Waterproof
      - Breathable
      - Arch Support
      - Cushioned
      - Non-slip
      - Orthotic Compatible
      - Lightweight
      - None
      required: false
    - id: 18
      name: intended_use
      label: Intended Use
      hint: What will you primarily use these shoes for?
      type: text
      options: []
      required: false
    - id: 19
      name: quantity
      label: Quantity
      hint: How many pairs of shoes would you like to order?
      type: number
      options: []
      required: true
    - id: 20
      name: budget_range
      label: Budget Range
      hint: What is your budget for these shoes?
      type: select_one
      options:
      - Under $50
      - $50-$100
      - $100-$150
      - $150-$200
      - $200-$300
      - Over $300
      required: false
    - id: 21
      name: shipping_preference
      label: Shipping Preference
      hint: Select your preferred shipping method
      type: select_one
      options:
      - Standard (5-7 business days)
      - Express (2-3 business days)
      - Overnight
      - Store Pickup
      required: true
    - id: 22
      name: payment_method
      label: Payment Method
      hint: Select Afterpay as your payment method
      type: select_one
      options:
      - Afterpay (Buy Now, Pay Later)
      - Credit Card
      - Debit Card
      - PayPal
      required: true
    - id: 23
      name: terms_agreement
      label: Terms Agreement
      hint: Do you agree to the store's terms and Afterpay conditions?
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
