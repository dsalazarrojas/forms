inputSchema:
  type: object
  properties:
    title: outdoor_fitness_park_donation_form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: amount
      label: Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Visa
      - Mastercard
      - Amex
      - Payoneer
      required: true
    - id: 6
      name: frequency
      label: Frequency
      hint: null
      type: select_multiple
      options:
      - Daily
      - Monthly
      - Quarterly
      - Annually
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: confirm_donation
      label: Confirm Donation
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: donor_info_agreement
      label: Donor Information Agreement
      hint: null
      type: select_one
      options:
      - I have read and agree to the terms and conditions
      - I have not read and do not agree to the terms and conditions
      required: true
