inputSchema:
  type: object
  properties:
    title: youth-sports-fund-donation-form
    pages:
    - id: 1
      name: donor_name
      label: Donor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: donor_email
      label: Donor Email
      hint: Enter a valid email address
      type: email
      options: []
      required: true
    - id: 3
      name: donor_amount
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: donation_frequency
      label: Donation Frequency
      hint: null
      type: select_one
      options:
      - monthly
      - annually
      - one-time
      required: true
    - id: 5
      name: frequency_hint
      label: Frequency Hint
      hint: How often do you plan to make this donation?
      type: text
      options: []
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - credit card
      - bank account
      - other
      required: true
    - id: 7
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: payment_time
      label: Payment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: payment_note
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
