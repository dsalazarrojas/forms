inputSchema:
  type: object
  properties:
    title: Local Farmer Product Order Form
    pages:
    - id: 1
      name: name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: customer_requests
      label: Do you have any special orders or requests?
      hint: null
      type: note
      options: []
      required: true
    - id: 5
      name: order_type
      label: What is the type of order you would like to place?
      hint: null
      type: select_one
      options:
      - Regular Order
      - Special Order
      required: true
    - id: 6
      name: order_status
      label: What is the status of your order?
      hint: null
      type: select_one
      options:
      - Placed
      - Pending
      - Delivered
      required: true
    - id: 7
      name: additional_comments
      label: Do you have any additional comments or notes about your order?
      hint: null
      type: note
      options: []
      required: true
    - id: 8
      name: shipping_requests
      label: Do you have any special requests for shipping?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: customer_info
      label: Do you want to receive any special information or updates about your
        order?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: other_info
      label: Do we have any other information about the customer or order?
      hint: null
      type: note
      options: []
      required: true
