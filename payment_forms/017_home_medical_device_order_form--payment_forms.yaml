inputSchema:
  type: object
  properties:
    title: Home Medical Device Order Form
    pages:
    - id: 1
      name: order_type
      label: Order Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: medical_device
      label: Medical Device
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: price
      label: Price
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: patient_info
      label: Patient Info
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: provider_info
      label: Provider Info
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: order_notes
      label: Order Notes
      hint: null
      type: note
      options: []
      required: false
