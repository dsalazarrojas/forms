inputSchema:
  type: object
  properties:
    title: Afterpay Electronic Product Order Form
    pages:
    - id: 1
      name: buyer
      label: -- Buyer Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: buyer_name
      label: Buyer name
      hint: Full name for records
      type: text
      options: []
      required: true
    - id: 3
      name: buyer_email
      label: Buyer email
      hint: Email for receipts
      type: email
      options: []
      required: true
    - id: 4
      name: product_model
      label: Product model
      hint: Model number or SKU
      type: text
      options: []
      required: true
    - id: 5
      name: warranty_required
      label: Warranty required
      hint: Select if warranty purchase desired
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: quantity
      label: Quantity
      hint: Number of units
      type: number
      options: []
      required: true
    - id: 7
      name: shipping_option
      label: Shipping option
      hint: Choose delivery speed
      type: select_one
      options:
      - Standard
      - Express
      - Overnight
      required: true
    - id: 8
      name: afterpay
      label: Pay with Afterpay
      hint: Select yes to use Afterpay
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: delivery_address
      label: Delivery address
      hint: Street city postal code
      type: text
      options: []
      required: true
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Any required installation notes
      type: text
      options: []
      required: false
