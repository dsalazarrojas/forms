inputSchema:
  type: object
  properties:
    title: PTA Fundraising Sponsorship Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: donation_type
      label: Donation Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: amount_donated
      label: Amount Donated
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: payment_frequency
      label: Payment Frequency
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: payment_frequency_other
      label: Other Payment Frequency
      hint: Specify your payment frequency
      type: text
      options: []
      required: false
    - id: 10
      name: acknowledgement
      label: I acknowledge this donation and understand that
      hint: null
      type: note
      options: []
      required: true
