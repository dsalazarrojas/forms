inputSchema:
  type: object
  properties:
    title: Afterpay Furniture Order Form
    pages:
    - id: 1
      name: buyer_info
      label: -- Buyer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: buyer_name
      label: Buyer name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: For order updates
      type: email
      options: []
      required: true
    - id: 4
      name: furniture_description
      label: Furniture description
      hint: Item name model and finish
      type: text
      options: []
      required: true
    - id: 5
      name: dimensions
      label: Dimensions
      hint: Width x depth x height
      type: text
      options: []
      required: false
    - id: 6
      name: color_finish
      label: Color or finish
      hint: Preferred finish
      type: text
      options: []
      required: false
    - id: 7
      name: delivery_service
      label: Delivery service
      hint: Select type of delivery
      type: select_one
      options: [Standard, White glove, Curbside]
      required: true
    - id: 8
      name: afterpay
      label: Use Afterpay
      hint: Select to pay with Afterpay
      type: select_one
      options: [Yes, No]
      required: true
    - id: 9
      name: installation_required
      label: Installation required
      hint: Does the item require professional setup
      type: select_one
      options: [Yes, No]
      required: false
    - id: 10
      name: delivery_address
      label: Delivery address
      hint: Street city postal code
      type: text
      options: []
      required: true
