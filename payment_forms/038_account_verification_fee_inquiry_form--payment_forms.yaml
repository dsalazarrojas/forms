inputSchema:
  type: object
  properties:
    title: Account Verification Fee Inquiry Form
    pages:
    - id: 1
      name: section_inquirer_info
      label: -- Inquirer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company or Organization Name (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: section_account_info
      label: -- Account Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: account_number
      label: Account Number or ID
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: account_type
      label: Account Type
      hint: null
      type: select_one
      options:
      - Individual
      - Business
      - Corporate
      - Non-profit
      - Other
      required: true
    - id: 9
      name: section_fee_inquiry
      label: -- Fee Inquiry Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: inquiry_type
      label: Type of Fee Inquiry
      hint: null
      type: select_one
      options:
      - What is the verification fee
      - Why was I charged a verification fee
      - Request for fee waiver
      - Request for fee refund
      - Fee discrepancy or incorrect charge
      - Other
      required: true
    - id: 11
      name: fee_amount_charged
      label: Fee Amount Charged (if applicable)
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: charge_date
      label: Date of Charge (if applicable)
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: verification_type
      label: Type of Verification
      hint: null
      type: select_one
      options:
      - Identity verification
      - Address verification
      - Bank account verification
      - Business verification
      - Not sure
      required: true
    - id: 14
      name: inquiry_details
      label: Detailed Description of Your Inquiry
      hint: Please provide as much context as possible
      type: text
      options: []
      required: true
    - id: 15
      name: preferred_response_method
      label: Preferred Response Method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Mail
      required: true
    - id: 16
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
