inputSchema:
  type: object
  properties:
    title: Yoga Mat Customization Order Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: mat_info
      label: Mat Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: size
      label: Size
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: color
      label: Color
      hint: Select a color from below
      type: select_one
      options:
      - '{''id'': 1, ''value'': ''Green''}'
      - '{''id'': 2, ''value'': ''Blue''}'
      - '{''id'': 3, ''value'': ''Red''}'
      required: false
    - id: 5
      name: material
      label: Material
      hint: null
      type: select_one
      options:
