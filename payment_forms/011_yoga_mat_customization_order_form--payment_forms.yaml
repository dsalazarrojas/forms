      type: select_one
      options:
      - '{''id'': 1, ''value'': ''Solid''}'
      - '{''id'': 2, ''value'': ''Striped''}'
      - '{''id'': 3, ''value'': ''Polka Dots''}'
      required: false
    - id: 7
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: price
      label: Price
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''value'': ''Credit Card''}'
      - '{''id'': 2, ''value'': ''PayPal''}'
      - '{''id'': 3, ''value'': ''Bank Transfer''}'
      required: false
    - id: 10
      name: submit_form
      label: Submit Form
      hint: null
      type: text
      options: []
      required: false
