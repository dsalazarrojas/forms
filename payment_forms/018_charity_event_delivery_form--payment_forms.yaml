inputSchema:
  type: object
  properties:
    title: Charity Event Delivery Form
    pages:
    - id: 1
      name: organization_name
      label: Organization Name
      hint: Charity or nonprofit name
      type: text
      options: []
      required: true
    - id: 2
      name: contact_name
      label: Contact Person Name
      hint: Primary contact
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact Email
      hint: Email address
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Contact Phone
      hint: Phone number
      type: text
      options: []
      required: true
    - id: 5
      name: delivery_date
      label: Delivery Date
      hint: When to deliver
      type: date
      options: []
      required: true
    - id: 6
      name: delivery_time
      label: Delivery Time
      hint: Preferred time
      type: time
      options: []
      required: true
    - id: 7
      name: delivery_address
      label: Delivery Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 8
      name: delivery_type
      label: Type of Delivery
      hint: What is being delivered
      type: select_one
      options:
      - Food and meals
      - Clothing and supplies
      - Medical supplies
      - Educational materials
      - Emergency relief items
      - Other goods
      required: true
    - id: 9
      name: quantity_estimate
      label: Estimated Quantity
      hint: Number of items or people
      type: number
      options: []
      required: true
    - id: 10
      name: special_requirements
      label: Special Requirements
      hint: Accessibility or handling
      type: text
      options: []
      required: false
    - id: 11
      name: recipient_name
      label: Recipient Name
      hint: Who will receive
      type: text
      options: []
      required: true
    - id: 12
      name: recipient_phone
      label: Recipient Phone
      hint: Contact at delivery
      type: text
      options: []
      required: true
    - id: 13
      name: access_instructions
      label: Access Instructions
      hint: Gate codes building info
      type: text
      options: []
      required: false
    - id: 14
      name: parking_info
      label: Parking Information
      hint: Where to park
      type: text
      options: []
      required: false
    - id: 15
      name: payment_method
      label: Payment Method for Delivery
      hint: How to pay
      type: select_one
      options:
      - Prepaid
      - Credit card on delivery
      - Invoice
      - Donation covered
      required: true
    - id: 16
      name: delivery_fee
      label: Delivery Fee Amount
      hint: If applicable
      type: number
      options: []
      required: false
    - id: 17
      name: signature_required
      label: Is Signature Required
      hint: Proof of delivery
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 18
      name: additional_notes
      label: Additional Notes
      hint: Other delivery details
      type: text
      options: []
      required: false
