inputSchema:
  type: object
  properties:
    title: Afterpay Electronic Product Order Form
    pages:
    - id: 1
      name: customer_full_name
      label: Customer Full Name
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Email Address
      hint: Enter your email for order confirmation and updates
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Phone Number
      hint: Enter your phone number for delivery updates
      type: text
      options: []
      required: true
    - id: 4
      name: shipping_address
      label: Shipping Address
      hint: Enter the complete address for delivery
      type: text
      options: []
      required: true
    - id: 5
      name: billing_address_same_as_shipping
      label: Billing Address Same as Shipping
      hint: Is your billing address the same as your shipping address?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: billing_address
      label: Billing Address
      hint: Enter the complete billing address if different from shipping
      type: text
      options: []
      required: false
    - id: 7
      name: product_category_header
      label: -- Product Category --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: product_category
      label: Product Category
      hint: Select the category of electronic product you're ordering
      type: select_one
      options:
      - Smartphones
      - Tablets
      - Laptops
      - Desktop Computers
      - Audio Equipment
      - Video Equipment
      - Gaming Consoles
      - Smart Home Devices
      - Wearables
      - Accessories
      required: true
    - id: 9
      name: product_brand
      label: Product Brand
      hint: Enter the brand of the electronic product
      type: text
      options: []
      required: true
    - id: 10
      name: product_model
      label: Product Model
      hint: Enter the specific model of the product
      type: text
      options: []
      required: true
    - id: 11
      name: product_specifications
      label: Specifications
      hint: Enter desired specifications (storage, RAM, etc.)
      type: text
      options: []
      required: false
    - id: 12
      name: quantity
      label: Quantity
      hint: How many units would you like to order?
      type: number
      options: []
      required: true
    - id: 13
      name: product_condition
      label: Product Condition
      hint: What condition of the product do you prefer?
      type: select_one
      options:
      - New
      - Certified Refurbished
      - Like New
      - Very Good
      - Good
      required: true
    - id: 14
      name: warranty_selection
      label: Warranty Selection
      hint: Would you like to purchase an extended warranty?
      type: select_one
      options:
      - No Warranty
      - 1-Year Extended
      - 2-Year Extended
      - 3-Year Extended
      required: false
    - id: 15
      name: accessories_required
      label: Accessories Required
      hint: Do you need any accessories with your product?
      type: text
      options: []
      required: false
    - id: 16
      name: technical_support_needed
      label: Technical Support Needed
      hint: Do you require setup assistance or technical support?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Maybe
      required: false
    - id: 17
      name: shipping_preference
      label: Shipping Preference
      hint: Select your preferred shipping method
      type: select_one
      options:
      - Standard (5-7 business days)
      - Express (2-3 business days)
      - Overnight
      - Store Pickup
      required: true
    - id: 18
      name: payment_method
      label: Payment Method
      hint: Select Afterpay as your payment method
      type: select_one
      options:
      - Afterpay (Buy Now, Pay Later)
      - Credit Card
      - Debit Card
      - PayPal
      required: true
    - id: 19
      name: terms_agreement
      label: Terms Agreement
      hint: Do you agree to the store's terms and Afterpay conditions?
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
