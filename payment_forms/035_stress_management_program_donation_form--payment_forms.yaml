inputSchema:
  type: object
  properties:
    title: Stress Management Program Donation Form
    pages:
    - id: 1
      name: donation_amount
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: frequency_of_donation
      label: Frequency of Donation
      hint: null
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Annually
      required: false
    - id: 3
      name: donation_method
      label: Donation Method
      hint: null
      type: select_multiple
      options:
      - Credit Card
      - Check
      - Bank Transfer
      required: false
    - id: 4
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: donation_date
      label: Donation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
