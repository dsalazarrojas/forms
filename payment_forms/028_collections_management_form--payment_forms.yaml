inputSchema:
  type: object
  properties:
    title: Collections Management Form
    pages:
    - id: 1
      name: account_manager
      label: Account Manager Name
      hint: Assigned manager
      type: text
      options: []
      required: true
    - id: 2
      name: account_manager_email
      label: Account Manager Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: management_date
      label: Management Date
      hint: Date of entry
      type: date
      options: []
      required: true
    - id: 4
      name: customer_name
      label: Customer Name
      hint: Debtor name
      type: text
      options: []
      required: true
    - id: 5
      name: customer_id
      label: Customer ID
      hint: Account number
      type: text
      options: []
      required: true
    - id: 6
      name: customer_type
      label: Customer Type
      hint: Individual or business
      type: select_one
      options:
      - Individual Consumer
      - Small Business
      - Corporation
      - Government Entity
      - Non-Profit
      required: true
    - id: 7
      name: customer_address
      label: Customer Address
      hint: Current address
      type: text
      options: []
      required: true
    - id: 8
      name: customer_phone
      label: Customer Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 9
      name: customer_email
      label: Customer Email
      hint: Email address
      type: email
      options: []
      required: false
    - id: 10
      name: invoice_numbers
      label: Invoice Numbers
      hint: All outstanding invoices
      type: text
      options: []
      required: true
    - id: 11
      name: invoice_dates
      label: Invoice Dates
      hint: Date range
      type: text
      options: []
      required: true
    - id: 12
      name: total_amount_due
      label: Total Amount Due
      hint: Combined balance
      type: text
      options: []
      required: true
    - id: 13
      name: amount_past_due
      label: Amount Past Due
      hint: Overdue amount
      type: text
      options: []
      required: true
    - id: 14
      name: amount_current
      label: Amount Current
      hint: Not yet due
      type: text
      options: []
      required: false
    - id: 15
      name: oldest_invoice_date
      label: Oldest Invoice Date
      hint: Earliest outstanding
      type: date
      options: []
      required: true
    - id: 16
      name: payment_terms
      label: Original Payment Terms
      hint: Agreed terms
      type: select_one
      options:
      - Net 10
      - Net 15
      - Net 30
      - Net 45
      - Net 60
      - Net 90
      - Due on Receipt
      - Custom Terms
      required: true
    - id: 17
      name: credit_limit
      label: Credit Limit
      hint: Approved limit
      type: text
      options: []
      required: false
    - id: 18
      name: credit_status
      label: Credit Status
      hint: Current standing
      type: select_one
      options:
      - Good Standing
      - At Risk
      - On Hold
      - Suspended
      - Revoked
      required: true
    - id: 19
      name: payment_history
      label: Payment History
      hint: Past payment behavior
      type: select_one
      options:
      - Always Pays On Time
      - Usually Pays On Time
      - Sometimes Late
      - Frequently Late
      - Rarely Pays On Time
      required: true
    - id: 20
      name: previous_delinquencies
      label: Previous Delinquencies
      hint: Past due incidents
      type: number
      options: []
      required: false
    - id: 21
      name: contact_attempts
      label: Contact Attempts Made
      hint: Number of attempts
      type: number
      options: []
      required: true
    - id: 22
      name: last_contact_date
      label: Last Contact Date
      hint: Most recent contact
      type: date
      options: []
      required: true
    - id: 23
      name: last_contact_method
      label: Last Contact Method
      hint: How contacted
      type: select_one
      options:
      - Phone Call
      - Email
      - Letter
      - Text Message
      - In Person
      - Voicemail
      required: true
    - id: 24
      name: customer_response
      label: Customer Response
      hint: What did they say
      type: text
      options: []
      required: false
    - id: 25
      name: payment_commitment
      label: Payment Commitment
      hint: Did they promise to pay
      type: text
      options: []
      required: false
    - id: 26
      name: promised_payment_date
      label: Promised Payment Date
      hint: When they will pay
      type: date
      options: []
      required: false
    - id: 27
      name: promised_payment_amount
      label: Promised Payment Amount
      hint: How much they will pay
      type: text
      options: []
      required: false
    - id: 28
      name: dispute_status
      label: Dispute Status
      hint: Is there a dispute
      type: select_one
      options:
      - No Dispute
      - Dispute Under Review
      - Dispute Resolved
      - Dispute Escalated
      required: true
    - id: 29
      name: dispute_reason
      label: Dispute Reason
      hint: If disputed
      type: text
      options: []
      required: false
    - id: 30
      name: collection_status
      label: Collection Status
      hint: Current stage
      type: select_one
      options:
      - Internal Collections
      - External Agency
      - Legal Action
      - Settlement Negotiation
      - Payment Plan Active
      - Charged Off
      - Closed
      required: true
    - id: 31
      name: action_plan
      label: Action Plan
      hint: Next steps
      type: text
      options: []
      required: true
    - id: 32
      name: follow_up_date
      label: Follow-Up Date
      hint: When to follow up
      type: date
      options: []
      required: true
    - id: 33
      name: risk_level
      label: Risk Level
      hint: Collection risk
      type: select_one
      options:
      - Low Risk
      - Moderate Risk
      - High Risk
      - Very High Risk
      - Write Off Candidate
      required: true
    - id: 34
      name: notes
      label: Additional Notes
      hint: Any other information
      type: text
      options: []
      required: false
