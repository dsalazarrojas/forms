inputSchema:
  type: object
  properties:
    title: Pest Control Service Check Out Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: service_address
      label: Service Address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: service_date
      label: Service Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: service_time
      label: Service Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: service_price
      label: Service Price
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - Debit Card
      required: false
    - id: 7
      name: payment_total
      label: Payment Total
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
