inputSchema:
  type: object
  properties:
    title: Urban Farming Education Fund Donation Form
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: amount_donated
      label: Amount Donated
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Check
      - Bank Transfer
      - Credit Card
      required: true
    - id: 6
      name: comment
      label: Comment
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: organization
      label: Organization
      hint: null
      type: select_multiple
      options:
      - Urban Farming Initiative
      - Local Organization
      - Other
      required: true
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: true
