inputSchema:
  type: object
  properties:
    title: Afterpay Fitness Equipment Order Form
    pages:
    - id: 1
      name: customer_full_name
      label: Customer Full Name
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Email Address
      hint: Enter your email for order confirmation
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Phone Number
      hint: Enter your phone number for delivery updates
      type: text
      options: []
      required: true
    - id: 4
      name: shipping_address
      label: Shipping Address
      hint: Enter the complete address for delivery
      type: text
      options: []
      required: true
    - id: 5
      name: billing_address_same_as_shipping
      label: Billing Address Same as Shipping
      hint: Is your billing address the same as your shipping address?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: billing_address
      label: Billing Address
      hint: Enter the complete billing address if different from shipping
      type: text
      options: []
      required: false
    - id: 7
      name: fitness_goals_header
      label: -- Fitness Goals and Needs --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: fitness_goals
      label: Primary Fitness Goals
      hint: What are your main fitness goals?
      type: select_multiple
      options:
      - Weight Loss
      - Strength Training
      - Cardiovascular Health
      - Flexibility
      - Muscle Building
      - General Fitness
      - Rehabilitation
      required: false
    - id: 9
      name: exercise_experience_level
      label: Exercise Experience Level
      hint: What is your current fitness level?
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Athlete
      required: true
    - id: 10
      name: equipment_category_header
      label: -- Equipment Category --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: equipment_category
      label: Equipment Category
      hint: Select the category of fitness equipment you're interested in
      type: select_one
      options:
      - Cardio Equipment
      - Strength Training
      - Flexible Training
      - Home Gym Systems
      - Accessories
      - Recovery Equipment
      required: true
    - id: 12
      name: specific_equipment_type
      label: Specific Equipment Type
      hint: Enter the specific type of equipment you're looking for
      type: text
      options: []
      required: true
    - id: 13
      name: brand_preference
      label: Brand Preference
      hint: Do you have a preferred brand for the equipment?
      type: text
      options: []
      required: false
    - id: 14
      name: equipment_features
      label: Desired Features
      hint: What features are important to you in this equipment?
      type: text
      options: []
      required: false
    - id: 15
      name: space_constraints
      label: Space Constraints
      hint: Do you have space limitations for this equipment?
      type: select_one
      options:
      - Small Space (apartment)
      - Medium Space
      - Large Space (garage/gym)
      - No Space Limitations
      required: true
    - id: 16
      name: budget_range
      label: Budget Range
      hint: What is your budget for this equipment?
      type: select_one
      options:
      - Under $100
      - $100-$300
      - $300-$600
      - $600-$1000
      - $1000-$2000
      - Over $2000
      required: false
    - id: 17
      name: assembly_preference
      label: Assembly Preference
      hint: Do you prefer pre-assembled or DIY assembly?
      type: select_one
      options:
      - Pre-assembled
      - DIY Assembly
      - Professional Assembly Service
      required: false
    - id: 18
      name: shipping_preference
      label: Shipping Preference
      hint: Select your preferred shipping method
      type: select_one
      options:
      - Standard (5-7 business days)
      - Express (2-3 business days)
      - White Glove Delivery
      - Store Pickup
      required: true
    - id: 19
      name: payment_method
      label: Payment Method
      hint: Select Afterpay as your payment method
      type: select_one
      options:
      - Afterpay (Buy Now, Pay Later)
      - Credit Card
      - Debit Card
      - PayPal
      required: true
    - id: 20
      name: terms_agreement
      label: Terms Agreement
      hint: Do you agree to the store's terms and Afterpay conditions?
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
