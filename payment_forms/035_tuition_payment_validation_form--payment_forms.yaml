inputSchema:
  type: object
  properties:
    title: Tuition Payment Validation Form
    pages:
    - id: 1
      name: user_id
      label: User ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: tuition_amount
      label: Tuition Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - Online Banking
      required: false
    - id: 6
      name: payment_status
      label: Payment Status
      hint: null
      type: select_multiple
      options:
      - Confirmed
      - Pending
      - Rejected
      required: true
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: student_school
      label: Student School
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: tuition_term
      label: Tuition Term
      hint: null
      type: text
      options: []
      required: true
