inputSchema:
  type: object
  properties:
    title: Credit Card Payment Feedback Form
    pages:
    - id: 1
      name: card_type
      label: Card Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: payment_experience
      label: Payment Experience
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: transaction_amount
      label: Transaction Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: customer_satisfaction
      label: Customer Satisfaction
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: customer_feedback
      label: Customer Feedback
      hint: null
      type: text
      options: []
      required: false
