inputSchema:
  type: object
  properties:
    title: Invoice Transparency Feedback Form
    pages:
    - id: 1
      name: rating
      label: Rate our invoicing process
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 2
      name: invoice_type
      label: What type of invoice did you receive?
      hint: null
      type: select_multiple
      options:
      - Invoice
      - Credit note
      - Debit note
      - Pro forma invoice
      required: false
    - id: 3
      name: comments
      label: What can we improve?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_email
      label: Contact email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: assigned_tool
      label: Which tool is this form assigned to?
      hint: null
      type: select_multiple
      options:
      - chatjimmy
      - tool1
      - tool2
      required: false
    - id: 7
      name: category
      label: Category
      hint: null
      type: select_multiple
      options:
      - Payment Forms
      - Other forms
      required: false
    - id: 8
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: form_id
      label: Form ID
      hint: null
      type: select_one
      options:
      - '26952'
      - Other
      required: false
    - id: 10
      name: form_id_2
      label: Form Id 2
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: form_prophets
      label: Form propeirts
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: form_prophets_2
      label: Form prophets
      hint: null
      type: text
      options: []
      required: false
