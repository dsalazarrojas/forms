    - id: 6
      name: honorarium_reason
      label: Honorarium Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: payment_time
      label: Payment Time
      hint: null
      type: time
      options: []
      required: false
