inputSchema:
  type: object
  properties:
    title: plumbing_services_billing_form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: service_date
      label: Service Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: service_time
      label: Service Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: billing_address
      label: Billing Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Plumber
      - Plumber's Assistant
      - Plumber's Service
      required: false
    - id: 6
      name: service_cost
      label: Service Cost
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Credit Card
      - Cash
      - Bank Transfer
      required: false
    - id: 8
      name: total_cost
      label: Total Cost
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: payment_status
      label: Payment Status
      hint: null
      type: select_multiple
      options:
      - Paid
      - Unpaid
      - Pending
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
