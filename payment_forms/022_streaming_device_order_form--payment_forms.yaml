inputSchema:
  type: object
  properties:
    title: Streaming Device Order Form
    pages:
    - id: 1
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_info
      label: Payment Info
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: payment_gateway
      label: Payment Gateway
      hint: null
      type: select_one
      options:
      - Stripe
      - PayPal
      - Apple Pay
      required: false
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Credit Card
      - ACH
      - EFT
      required: false
    - id: 6
      name: shipping_method
      label: Shipping Method
      hint: null
      type: select_multiple
      options:
      - Standard
      - Express
      required: false
    - id: 7
      name: shipping_cost
      label: Shipping Cost
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: device_type
      label: Device Type
      hint: null
      type: select_one
      options:
      - Streaming Device A
      - Streaming Device B
      - Streaming Device C
      required: false
