inputSchema:
  type: object
  properties:
    title: Domain Name Registration Payment Form
    pages:
    - id: 1
      name: domain_name
      label: Enter Domain Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: false
    - id: 3
      name: payment_details
      label: Payment Details
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: confirm_payment
      label: Confirm Payment
      hint: null
      type: select_one
      options:
      - Confirm Payment
      - Cancel Payment
      required: false
    - id: 5
      name: domain_details
      label: Domain Details
      hint: null
      type: text
      options: []
      required: false
