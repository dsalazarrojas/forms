inputSchema:
  type: object
  properties:
    title: Payment Prioritization Request Form
    pages:
    - id: 1
      name: payment_payout_request
      label: What is the payment request date?
      hint: Please select a payment request date.
      type: date
      options: []
      required: false
    - id: 2
      name: payment_vendor
      label: Vendor
      hint: null
      type: select_one
      options:
      - ABC Corporation
      - DEF Corporation
      required: false
    - id: 3
      name: payment_amount
      label: Total amount due
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: payment_priority
      label: Priority level
      hint: Select the priority level.
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 5
      name: payment_documentation
      label: Document reason
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: payment_urgent
      label: Is this payment urgent?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: payment_note
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: payment_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
