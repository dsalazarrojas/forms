      options: []
      required: true
    - id: 13
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 14
      name: price_range
      label: Price Range
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 15
      name: participant_details
      label: Participant Details
