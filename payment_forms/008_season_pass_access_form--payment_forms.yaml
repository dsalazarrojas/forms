inputSchema:
  type: object
  properties:
    title: Season Pass Access Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: user_email
      label: user_email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Other
      required: false
    - id: 4
      name: application_type
      label: Application Type
      hint: null
      type: select_multiple
      options:
      - Season Pass
      - Guest Pass
      - Membership Pass
      required: false
    - id: 5
      name: season_start
      label: Season Start
      hint: null
      type: select_one
      options:
      - January
      - February
      - March
      - April
      - May
      - June
      - July
      - August
      - September
      required: false
    - id: 6
      name: season_end
      label: Season End
      hint: null
      type: select_one
      options:
      - June
      - July
      - August
      - September
      required: false
    - id: 7
      name: submit_button
      label: Submit
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: organization
      label: Organization
      hint: null
      type: select_multiple
      options:
      - ABC Corp
      - DEF Corp
      - GHI Corp
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: season_pass_id
      label: Season Pass ID
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: season_name
      label: Season Name
      hint: null
      type: text
      options: []
      required: false
