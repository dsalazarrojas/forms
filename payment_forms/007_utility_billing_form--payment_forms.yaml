      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: billing_info
      label: billing_info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_method
      label: payment_method
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: payment_amount
      label: payment_amount
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: payment_frequency
      label: payment_frequency
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: account_status
      label: account_status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 7
      name: note
      label: note
      hint: null
      type: note
      options: []
      required: false
