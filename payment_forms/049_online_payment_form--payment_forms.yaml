inputSchema:
  type: object
  properties:
    title: online-payment-form
    pages:
    - id: 1
      name: form_control
      label: Form Control
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: payment_methods
      label: Payment Methods
      hint: null
      type: select_multiple
      options:
      - credit_card
      - debit_card
      - paypal
      - apple_pay
      - google_pay
      required: false
    - id: 3
      name: amount
      label: Amount
      hint: The total amount of the payment.
      type: number
      options: []
      required: false
    - id: 4
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: payment_time
      label: Payment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: Additional notes about the payment.
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: city_state_zip
      label: City State ZIP
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: cvv
      label: CVV
      hint: null
      type: text
      options: []
      required: false
