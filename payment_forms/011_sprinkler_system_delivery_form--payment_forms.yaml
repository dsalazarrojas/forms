inputSchema:
  type: object
  properties:
    title: Sprinkler System Delivery Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: order_number
      label: Order Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: sprinkler_system
      label: Sprinkler System
      hint: null
      type: select_one
      options:
      - System1
      - System2
      - System3
      required: false
    - id: 6
      name: delivery_status
      label: Delivery Status
      hint: null
      type: select_multiple
      options:
      - Delivered
      - Pending
      - Canceled
      required: false
    - id: 7
      name: delivery_address
      label: Delivery Address
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
