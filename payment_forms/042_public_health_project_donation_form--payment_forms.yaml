inputSchema:
  type: object
  properties:
    title: public_health_project_donation_form
    pages:
    - id: 1
      name: donation_amount
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: donation_frequency
      label: How often would you like to donate?
      hint: null
      type: select_multiple
      options:
      - Once
      - Monthly
      - Quarterly
      - Annually
      required: true
    - id: 3
      name: donation_frequency_start_date
      label: When would you like to start donating?
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: donor_name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: phone_number
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: address
      label: What is your address?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: project_name
      label: What is the name of the project you would like to donate to?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: payment_method
      label: How would you like to pay for your donation?
      hint: null
      type: select_one
      options:
      - Card
      - Bank Transfer
      - PayPal
      required: true
    - id: 9
      name: donation_frequency_donors
      label: How frequent are you in donating?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: organization_name
      label: What is the name of the organization receiving the donation?
      hint: null
      type: text
      options: []
      required: true
