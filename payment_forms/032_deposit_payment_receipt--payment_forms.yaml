inputSchema:
  type: object
  properties:
    title: Deposit Payment Receipt
    pages:
    - id: 1
      name: landlord_name
      label: Landlord Name
      hint: Please enter the landlord's name
      type: text
      options: []
      required: true
    - id: 2
      name: lessee_name
      label: Lessee Name
      hint: Please enter the lessee's name
      type: text
      options: []
      required: true
    - id: 3
      name: contact_number
      label: Lessee Contact Number
      hint: Please enter the lessee's contact number
      type: number
      options: []
      required: true
    - id: 4
      name: lessee_address
      label: Lessee Address
      hint: Please enter the lessee's address
      type: text
      options: []
      required: true
    - id: 5
      name: amount_received
      label: Amount Received
      hint: Please enter the amount received
      type: number
      options: []
      required: true
    - id: 6
      name: payment_date
      label: Payment Date
      hint: Please enter the payment date
      type: date
      options: []
      required: true
    - id: 7
      name: lessee_signature
      label: Lessee's Signature
      hint: Please sign here
      type: text
      options: []
      required: true
    - id: 8
      name: document_date
      label: Document Date
      hint: Please enter the document date
      type: date
      options: []
      required: false
    - id: 9
      name: lessee_phone
      label: Lessee's Phone
      hint: Please enter the lessee's phone number (optional)
      type: text
      options: []
      required: false
    - id: 10
      name: amount_received_lessee
      label: Lessee's Amount Received
      hint: Please enter the amount received by the lessee
      type: number
      options: []
      required: false
    - id: 11
      name: payment_date_lessee
      label: Lessee's Payment Date
      hint: Please enter the payment date of the lessee (optional)
      type: date
      options: []
      required: false
    - id: 12
      name: lessee_phone_lessee
      label: Lessee Phone Lessee
      hint: Please enter the lessee's phone number (optional)
      type: text
      options: []
      required: false
