inputSchema:
  type: object
  properties:
    title: Dish Pricing Setup Form
    pages:
    - id: 1
      name: menu_items
      label: Menu Items
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 2
      name: effective_price
      label: Effective Price
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: price_updates
      label: Price Updates
      hint: null
      type: select_one
      options:
      - Update 1
      - Update 2
      - Update 3
      - Update 4
      - Update 5
      required: false
    - id: 4
      name: price_update_frequency
      label: Update Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Yearly
      required: false
    - id: 5
      name: price_update_date
      label: Price Update Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: price_update_time
      label: Price Update Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: effective_price_currency
      label: Currency
      hint: null
      type: select_one
      options:
      - USD
      - EUR
      - GBP
      - AUD
      - JPY
      required: false
    - id: 8
      name: price_update_reason
      label: Price Update Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: menu_items_description
      label: Menu Items Description
      hint: null
      type: text
      options: []
      required: false
