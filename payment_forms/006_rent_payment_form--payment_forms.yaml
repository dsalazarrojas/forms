inputSchema:
  type: object
  properties:
    title: Rent Payment Form
    pages:
    - id: 1
      name: tenant_info
      label: Tenant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: payment_details
      label: Payment Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_date
      label: Date of Payment
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: payment_amount
      label: Amount Paid
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Check
      - Credit Card
      - Bank Transfer
      - Other
      required: false
    - id: 6
      name: tenant_signature
      label: Tenant Signature
      hint: null
      type: select_multiple
      options:
      - Signed
      - Unsigned
      required: false
    - id: 7
      name: landlord_verification
      label: Landlord Verification
      hint: null
      type: select_multiple
      options:
      - Verified
      - Not Verified
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: tenant_id
      label: Tenant ID
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: landlord_id
      label: Landlord ID
      hint: null
      type: number
      options: []
      required: false
