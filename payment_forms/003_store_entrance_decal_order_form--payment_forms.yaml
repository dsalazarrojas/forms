inputSchema:
  type: object
  properties:
    title: Store Entrance Decal Order Form
    pages:
    - id: 1
      name: order_type
      label: Order Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: order_date
      label: Date of Order
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: store_name
      label: Store Name
      hint: Enter store name here
      type: text
      options: []
      required: false
    - id: 4
      name: order_details
      label: Order Details
      hint: Description of the order
      type: text
      options: []
      required: false
    - id: 5
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: order_total
      label: Total
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: customer_name
      label: Customer Name
      hint: Enter customer name here
      type: text
      options: []
      required: false
    - id: 8
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: store_entrance_type
      label: Type of Decal
      hint: null
      type: select_one
      options:
      - Standard
      - Custom
      required: false
    - id: 11
      name: order_status
      label: Status of Order
      hint: null
      type: select_one
      options:
      - Pending
      - In Progress
      - Completed
      - Cancelled
      required: false
