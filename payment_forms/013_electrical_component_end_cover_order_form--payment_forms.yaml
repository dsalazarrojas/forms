inputSchema:
  type: object
  properties:
    title: electrical_component_end_cover_order_form
    pages:
    - id: 1
      name: supplier_name
      label: Supplier Name
      hint: Please enter the supplier's name
      type: text
      options: []
      required: true
    - id: 2
      name: contact_person
      label: Contact Person
      hint: Enter the contact person's name
      type: text
      options: []
      required: true
    - id: 3
      name: purchase_order_number
      label: Purchase Order Number
      hint: Enter the purchase order number
      type: number
      options: []
      required: true
    - id: 4
      name: delivery_address
      label: Delivery Address
      hint: Enter the delivery address
      type: text
      options: []
      required: false
    - id: 5
      name: delivery_method
      label: Delivery Method
      hint: Select how you would like to receive the delivery
      type: select_one
      options:
      - Online
      - Email
      - Phone
      - In Person
      - Pickup
      required: true
    - id: 6
      name: payment_method
      label: Payment Method
      hint: Select the preferred payment method
      type: select_multiple
      options:
      - Bank Transfer
      - Credit Card
      required: true
    - id: 7
      name: payment_terms
      label: Payment Terms
      hint: Enter the payment terms
      type: text
      options: []
      required: true
    - id: 8
      name: delivery_date
      label: Delivery Date
      hint: Enter the delivery date
      type: date
      options: []
      required: true
    - id: 9
      name: delivery_time
      label: Delivery Time
      hint: Enter the delivery time
      type: time
      options: []
      required: true
    - id: 10
      name: note
      label: Additional Notes
      hint: Enter any additional notes for this order
      type: note
      options: []
      required: false
    - id: 11
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 12
      name: phone
      label: Phone
      hint: Enter your phone number
      type: text
      options: []
      required: true
    - id: 13
      name: status
      label: Status
      hint: Select the order status
      type: select_multiple
      options:
      - Open
      - Completed
      - Cancelled
      required: true
