inputSchema:
  type: object
  properties:
    title: online_payment_feedback_form
    pages:
    - id: 1
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - '{''label'': ''Credit Card''}'
      - '{''label'': ''PayPal''}'
      - '{''label'': ''Bank Transfer''}'
      required: true
    - id: 2
      name: payment_status
      label: Payment Status
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''Paid''}'
      - '{''label'': ''Pending''}'
      - '{''label'': ''Failed''}'
      required: false
    - id: 3
      name: customer_feedback
      label: How would you rate your experience with our online payment method?
      hint: null
      type: note
      options: []
      required: true
    - id: 4
      name: additional_comments
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date_of_last_payment
      label: Date of last payment
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: time_of_last_payment
      label: Time of last payment
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: customer_satisfaction
      label: How satisfied are you with our online payment method?
      hint: null
      type: select_one
      options:
      - '{''label'': ''Very Satisfied''}'
      - '{''label'': ''Satisfied''}'
      - '{''label'': ''Not Satisfied''}'
      required: true
    - id: 10
      name: would_use_again
      label: Would you use our online payment method again?
      hint: null
      type: select_one
      options:
      - '{''label'': True}'
      - '{''label'': False}'
      required: true
    - id: 11
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: feedback_comments
      label: Feedback Comments
      hint: null
      type: note
      options: []
      required: true
    - id: 13
      name: business_name
      label: Business Name
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: business_email
      label: Business Email
      hint: null
      type: email
      options: []
      required: true
    - id: 15
      name: business_phone
      label: Business Phone
      hint: null
      type: text
      options: []
      required: true
