inputSchema:
  type: object
  properties:
    title: Concert Organizer Check Out Form
    pages:
    - id: 1
      name: purchaser_name
      label: Purchaser name
      hint: Name of the person completing this checkout
      type: text
      options: []
      required: true
    - id: 2
      name: organization
      label: Organization name
      hint: If purchase is on behalf of an organization
      type: text
      options: []
      required: false
    - id: 3
      name: billing_email
      label: Billing email
      hint: Email for invoices and receipts
      type: email
      options: []
      required: true
    - id: 4
      name: payment_method
      label: Payment method
      hint: Select the method of payment
      type: select_one
      options:
      - Credit card
      - Bank transfer
      - PayPal
      - Offline payment
      required: true
    - id: 5
      name: ticket_package
      label: Ticket package selected
      hint: Choose the package for checkout
      type: select_one
      options:
      - General admission
      - VIP package
      - Group package
      required: true
    - id: 6
      name: quantity
      label: Number of tickets
      hint: Enter total ticket quantity
      type: number
      options: []
      required: true
    - id: 7
      name: billing_address
      label: Billing address
      hint: Street address for billing
      type: text
      options: []
      required: true
    - id: 8
      name: order_notes
      label: Order notes
      hint: Delivery preferences or special instructions
      type: text
      options: []
      required: false
    - id: 9
      name: contact_phone
      label: Contact phone
      hint: Phone for order questions
      type: text
      options: []
      required: false
    - id: 10
      name: confirmation_note
      label: Confirmation and next steps
      hint: Read only information about processing time
      type: note
      options: []
      required: false
