inputSchema:
  type: object
  properties:
    title: Beach Supply Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Business name if applicable
      type: text
      options: []
