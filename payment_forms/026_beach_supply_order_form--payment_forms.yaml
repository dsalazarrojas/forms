      label: Subtotal
      hint: Before tax and shipping
      type: number
      options: []
      required: false
    - id: 19
      name: shipping_cost
      label: Shipping Cost
      hint: Delivery fee
      type: number
      options: []
      required: false
    - id: 20
      name: total_amount
      label: Total Amount
      hint: Final total
      type: number
      options: []
      required: true
    - id: 21
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - PayPal
      - Bank Transfer
      - Invoice
      required: true
    - id: 22
      name: special_instructions
      label: Special Instructions
      hint: Delivery notes
      type: text
      options: []
      required: false
