      type: number
      options: []
      required: false
    - id: 12
      name: boogie_boards_qty
      label: Boogie Boards Quantity
      hint: Number of boards
      type: number
      options: []
      required: false
    - id: 13
      name: surfboards_qty
      label: Surfboards Quantity
      hint: Number of surfboards
      type: number
      options: []
      required: false
    - id: 14
      name: snorkel_sets_qty
      label: Snorkel Sets Quantity
      hint: Number of sets
      type: number
      options: []
      required: false
    - id: 15
      name: beach_toys_qty
      label: Beach Toys Quantity
      hint: Number of toy sets
      type: number
      options: []
      required: false
    - id: 16
      name: sunscreen_qty
      label: Sunscreen Quantity
      hint: Number of bottles
      type: number
      options: []
      required: false
    - id: 17
      name: other_items
      label: Other Items
