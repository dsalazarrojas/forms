inputSchema:
  type: object
  properties:
    title: Treadmill Pre Order Form
    pages:
    - id: 1
      name: pre_order
      label: Treadmill Pre Order
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: customer_name
      label: customer name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Customer E-mail
      hint: Enter customer email
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Customer Phone
      hint: Enter customer phone number
      type: text
      options: []
      required: false
    - id: 5
      name: date_requested
      label: Date Requested
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: quantity
      label: Quantity Ordered
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: supplier_name
      label: Supplier Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: order_status
      label: Order Status
      hint: Order status
      type: select_one
      options:
      - New
      - In Progress
      - Delivered
      required: true
