      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: form_input_5
      label: Currency Code
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: form_group_3
      label: Payment Options
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: form_input_7
      label: Bank
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: form_group_4
