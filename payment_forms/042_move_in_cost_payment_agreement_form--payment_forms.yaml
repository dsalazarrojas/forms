inputSchema:
  type: object
  properties:
    title: Move In Cost Payment Agreement Form
    pages:
    - id: 1
      name: move_in_cost_payment_agreement_form
      label: Move In Cost Payment Agreement
      hint: Please fill out the following information to complete the move-in cost
        payment agreement
      type: text
      options: []
      required: false
    - id: 2
      name: move_in_cost_payment_agreement_form_move_in_date
      label: Move In Date
      hint: The date the tenant will move in
      type: date
      options: []
      required: true
    - id: 3
      name: move_in_cost_payment_agreement_form_rent_amount
      label: Rent Amount
      hint: The total rent amount for the first month
      type: number
      options: []
      required: true
    - id: 4
      name: move_in_cost_payment_agreement_form_security_deposit
      label: Security Deposit
      hint: The security deposit amount required for move-in
      type: number
      options: []
      required: true
    - id: 5
      name: move_in_cost_payment_agreement_form_payment_method
      label: Payment Method
      hint: The method the tenant will use to pay rent
      type: select_one
      options:
      - Credit Card
      - Check
      - Money Order
      required: true
    - id: 6
      name: move_in_cost_payment_agreement_form_bond_info
      label: Security Deposit Bond
      hint: Is a bond required for the security deposit?
      type: text
      options: []
      required: true
    - id: 7
      name: move_in_cost_payment_agreement_form_move_in_cost
      label: Move In Cost
      hint: Additional costs for move-in (e.g. utility deposits, fees)
      type: number
      options: []
      required: true
