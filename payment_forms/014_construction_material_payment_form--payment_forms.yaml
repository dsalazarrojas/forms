inputSchema:
  type: object
  properties:
    title: Construction Material Payment Form
    pages:
    - id: 1
      name: section_billing_contact
      label: -- Customer and Billing Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Full Name or Business Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: billing_email
      label: Billing Email Address
      hint: Invoice and receipt will be sent here
      type: email
      options: []
      required: true
    - id: 4
      name: billing_phone
      label: Billing Phone Number
      hint: Format - (555) 555-5555
      type: text
      options: []
      required: true
    - id: 5
      name: billing_address
      label: Billing Address
      hint: City, State, ZIP
      type: text
      options: []
      required: true
    - id: 6
      name: section_material_details
      label: -- Material and Order Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: invoice_number
      label: Invoice or Order Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: project_reference
      label: Project Reference (Project Name or ID)
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: material_categories
      label: Material Categories Purchased
      hint: Check all that apply
      type: select_multiple
      options:
      - Concrete/Cement
      - Lumber/Wood Products
      - Steel/Metal Framing
      - Roofing Materials
      - Electrical Supplies
      - Plumbing/HVAC
      - Drywall/Insulation
      - Finishing (Paint, Flooring)
      required: true
    - id: 10
      name: material_description_summary
      label: Brief Summary of Materials
      hint: e.g., 500 Sheets of 1/2in Drywall
      type: text
      options: []
      required: true
    - id: 11
      name: section_payment_info
      label: -- Payment and Transaction Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: subtotal_amount
      label: Subtotal Amount ($)
      hint: Before taxes and delivery fees
      type: number
      options: []
      required: true
    - id: 13
      name: taxes_and_fees
      label: Taxes and Delivery Fees ($)
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: total_payment_amount
      label: Total Amount to Pay ($)
      hint: Sum of subtotal plus taxes and fees
      type: number
      options: []
      required: true
    - id: 15
      name: payment_method_pref
      label: Preferred Payment Method
      hint: We'll process this after form submission
      type: select_one
      options:
      - Credit/Debit Card
      - Bank Transfer (ACH)
      - Check (Already Sent/Dropped off)
      - Internal Business Account/PO
      required: true
    - id: 16
      name: purchase_order_number
      label: Purchase Order (PO) Number
      hint: Required for business account payments
      type: text
      options: []
      required: false
    - id: 17
      name: section_delivery_verification
      label: -- Delivery and Receipt --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: materials_received_confirmed
      label: Materials Have Been Received
      hint: null
      type: select_one
      options:
      - Yes - All items delivered
      - Partial Delivery - Remainder pending
      - Not yet received - Pre-payment only
      required: true
    - id: 19
      name: additional_comments
      label: Additional Billing or Delivery Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: submission_date
      label: Date of Submission
      hint: null
      type: date
      options: []
      required: true
