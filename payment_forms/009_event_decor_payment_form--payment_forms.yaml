      name: event_decor_payment_form
      label: Payment Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Visa
      - Mastercard
      - Amex
      required: true
    - id: 3
      name: amount
      label: Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: payment_time
      label: Payment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: payment_note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
