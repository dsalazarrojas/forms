inputSchema:
  type: object
  properties:
    title: Co-Working Desk Rental Application Form
    pages:
    - id: 1
      name: applicant_name
      label: Applicant Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: section_workspace_pref
      label: -- Workspace Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: desk_type
      label: Type of Desk or Workspace Required
      hint: null
      type: select_one
      options:
      - Hot Desk
      - Dedicated Desk
      - Private Office
      required: true
    - id: 6
      name: start_date
      label: Desired Lease Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: rental_duration
      label: Initial Rental Duration
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - 6 Months
      - 12 Months
      required: true
    - id: 8
      name: section_business_details
      label: -- Business Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: company_name
      label: Company Name
      hint: Leave blank if individual
      type: text
      options: []
      required: false
    - id: 10
      name: team_size
      label: Total Number of Team Members requiring access
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: industry_profession
      label: Industry or Profession
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: section_access
      label: -- Amenities and Access --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: access_24_7_req
      label: Do you require 24-7 building access?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: mailing_service_req
      label: Do you need a professional mailing address service?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 15
      name: section_payment_terms
      label: -- Payment and Terms --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: payment_method_pref
      label: Preferred Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Bank Transfer
      - PayPal
      required: false
    - id: 17
      name: terms_service_ack
      label: I agree to the co-working space terms of service and community guidelines
      hint: null
      type: select_one
      options:
      - 'True'
      - I agree
      required: true
    - id: 18
      name: digital_signature
      label: Applicant Digital Signature
      hint: null
      type: text
      options: []
      required: true
