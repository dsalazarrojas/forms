inputSchema:
  type: object
  properties:
    title: Vision Support Donation Form
    pages:
    - id: 1
      name: donation_amount
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: frequency
      label: Frequency
      hint: null
      type: select_one
      options:
      - Monthly
      - One Time
      required: false
    - id: 3
      name: frequency_interval
      label: Interval
      hint: How often you want to receive the donation
      type: select_multiple
