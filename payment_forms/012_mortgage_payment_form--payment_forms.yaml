inputSchema:
  type: object
  properties:
    title: Mortgage Payment Form
    pages:
    - id: 1
      name: mortgage_payment_form_first_name
      label: First name
      hint: Required
      type: text
      options: []
      required: true
    - id: 2
      name: mortgage_payment_form_last_name
      label: Last name
      hint: Required
      type: text
      options: []
      required: true
    - id: 3
      name: mortgage_payment_form_payment_amount
      label: Payment amount
      hint: The payment amount
      type: number
      options: []
      required: true
    - id: 4
      name: mortgage_payment_form_payment_method
      label: Payment method
      hint: Select the payment method
      type: select_one
      options:
      - Mortgage Payment
      - Rent Payment
      required: true
    - id: 5
      name: mortgage_payment_form_payment_status
      label: Payment status
      hint: Select the payment status
      type: select_one
      options:
      - Paid
      - Pending
      required: true
    - id: 6
      name: mortgage_payment_form_payment_reference
      label: Payment reference
      hint: Enter a reference number
      type: text
      options: []
      required: true
    - id: 7
      name: mortgage_payment_form_address
      label: Address
      hint: Enter your address
      type: text
      options: []
      required: true
    - id: 8
      name: mortgage_payment_form_city
      label: City
      hint: Enter the city
      type: text
      options: []
      required: true
    - id: 9
      name: mortgage_payment_form_state
      label: State
      hint: Enter the state
      type: text
      options: []
      required: true
    - id: 10
      name: mortgage_payment_form_zip
      label: ZIP
      hint: Enter the ZIP code
      type: text
      options: []
      required: true
    - id: 11
      name: mortgage_payment_form_note
      label: Note
      hint: Any additional note
      type: note
      options: []
      required: false
    - id: 12
      name: mortgage_payment_form_submit_button
      label: Submit
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: mortgage_payment_form_phone
      label: Phone
      hint: Enter your phone number
      type: text
      options: []
      required: false
    - id: 14
      name: mortgage_payment_form_email
      label: Email
      hint: Enter your email
      type: email
      options: []
      required: false
