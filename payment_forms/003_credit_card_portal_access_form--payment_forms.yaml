inputSchema:
  type: object
  properties:
    title: credit_card_portal_access_form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Enter the customer's name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Email
      hint: Enter the customer's email
      type: email
      options: []
      required: true
    - id: 3
      name: expirate_month
      label: Expiration Month
      hint: Select the expiration month
      type: select_one
      options:
      - January
      - February
      - March
      - April
      - May
      - June
      - July
      - August
      - September
      - October
      - November
      - December
      required: true
    - id: 4
      name: expirate_year
      label: Expiration Year
      hint: Select the expiration year
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 5
      name: card_number
      label: Card Number
      hint: Enter the 16-digit card number
      type: text
      options: []
      required: true
    - id: 6
      name: cvv
      label: Cvv
      hint: Enter the cvv
      type: text
      options: []
      required: true
    - id: 7
      name: billing_address
      label: Billing Address
      hint: Enter the billing address
      type: text
      options: []
      required: true
    - id: 8
      name: zip_code
      label: Zip Code
      hint: Enter the zip code
      type: text
      options: []
      required: true
    - id: 9
      name: expirate_date
      label: Expiration Date
      hint: Select the expiration date
      type: date
      options: []
      required: true
