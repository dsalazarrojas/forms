inputSchema:
  type: object
  properties:
    title: Tidy Order Form
    pages:
    - id: 1
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - Other
      required: false
    - id: 3
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: billing_address
      label: Billing Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: order_notes
      label: Order Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
