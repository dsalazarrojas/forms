inputSchema:
  type: object
  properties:
    title: Fitness Class Series Pre Order Form
    pages:
    - id: 1
      name: schedule_preferences
      label: Schedule Preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_preferences
      label: Participant Preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_details
      label: Payment Details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: confirm_session
      label: Confirm Session
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: participant_acknowledgements
      label: Participant Acknowledgments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: schedule_preferences_schedule
      label: Schedule Preferences Schedule
      hint: Schedule preferences and schedule conflicts
      type: select_one
      options:
      - Mon
      - Tue
      - Wed
      - Thu
      - Fri
      - Sat
      - Sun
      required: false
    - id: 7
      name: participant_preferences_participant_type
      label: Participant Type
      hint: null
      type: select_multiple
      options:
      - Male
      - Female
      - Other
      required: false
    - id: 8
      name: participant_preferences_participant_preferences
      label: Participant Preferences Participant Preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: payment_details_payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Credit card
      - PayPal
      - Bank transfer
      required: false
    - id: 10
      name: payment_details_payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: confirm_session_schedule_conflict
      label: Schedule Conflict
      hint: null
      type: select_multiple
      options:
      - No conflict
      - Conflicted
      required: false
    - id: 12
      name: participant_acknowledgements_acknowledgments
      label: Acknowledgments
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: confirm_session_confirmation
      label: Confirm Session Confirmation
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: confirm_session_confirmed
      label: Confirmed
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: participant_acknowledgements_participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
