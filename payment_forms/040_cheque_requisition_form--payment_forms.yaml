inputSchema:
  type: object
  properties:
    title: Cheque Requisition Form
    pages:
    - id: 1
      name: requester_name
      label: Requester Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: requester_id
      label: Requester ID
      hint: Your employee ID number
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department
      hint: Your department
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Your contact number
      type: text
      options: []
      required: true
    - id: 6
      name: request_date
      label: Request Date
      hint: Date of this request
      type: date
      options: []
      required: true
    - id: 7
      name: payment_urgency
      label: Payment Urgency
      hint: How urgent is this payment
      type: select_one
      options:
      - Routine
      - Standard
      - Urgent
      - Emergency
      required: true
    - id: 8
      name: required_by_date
      label: Required By Date
      hint: When do you need the cheque
      type: date
      options: []
      required: true
    - id: 9
      name: payee_name
      label: Payee Name
      hint: Name of person or entity to be paid
      type: text
      options: []
      required: true
    - id: 10
      name: payee_type
      label: Payee Type
      hint: Type of payee
      type: select_one
      options:
      - Individual
      - Company
      - Government agency
      - Non-profit organization
      - Vendor
      - Contractor
      - Employee
      required: true
    - id: 11
      name: payee_address
      label: Payee Address
      hint: Full address of payee
      type: text
      options: []
      required: true
    - id: 12
      name: payment_amount
      label: Payment Amount
      hint: Amount to be paid
      type: number
      options: []
      required: true
    - id: 13
      name: currency
      label: Currency
      hint: Currency of payment
      type: select_one
      options:
      - USD - US Dollar
      - CAD - Canadian Dollar
      - EUR - Euro
      - GBP - British Pound
      - AUD - Australian Dollar
      - Other
      required: true
    - id: 14
      name: payment_purpose
      label: Payment Purpose
      hint: What is this payment for
      type: select_one
      options:
      - Vendor payment
      - Contractor payment
      - Refund
      - Reimbursement
      - Service fee
      - Purchase payment
      - Loan payment
      - Other
      required: true
    - id: 15
      name: payment_description
      label: Payment Description
      hint: Detailed description of payment purpose
      type: text
      options: []
      required: true
    - id: 16
      name: invoice_number
      label: Invoice Number
      hint: Related invoice number if applicable
      type: text
      options: []
      required: false
    - id: 17
      name: invoice_date
      label: Invoice Date
      hint: Date of invoice if applicable
      type: date
      options: []
      required: false
    - id: 18
      name: purchase_order_number
      label: Purchase Order Number
      hint: PO number if applicable
      type: text
      options: []
      required: false
    - id: 19
      name: account_to_charge
      label: Account to Charge
      hint: Budget account or cost center
      type: text
      options: []
      required: true
    - id: 20
      name: budget_code
      label: Budget Code
      hint: Budget code for this expense
      type: text
      options: []
      required: true
    - id: 21
      name: supporting_documents
      label: Supporting Documents Attached
      hint: Have you attached all supporting documents
      type: select_one
      options:
      - Yes, all attached
      - Some attached
      - Will provide later
      - Not applicable
      required: true
    - id: 22
      name: document_types
      label: Types of Documents
      hint: Select all documents attached
      type: select_multiple
      options:
      - Invoice
      - Purchase order
      - Contract
      - Receipt
      - Approval email
      - Quote
      - Other
      required: false
    - id: 23
      name: previous_payments
      label: Previous Payments to This Payee
      hint: Have you paid this payee before
      type: select_one
      options:
      - Yes, multiple times
      - Yes, once
      - No, first time
      required: true
    - id: 24
      name: tax_implications
      label: Tax Implications
      hint: Are there tax implications for this payment
      type: select_one
      options:
      - Yes, 1099 required
      - Yes, other tax forms
      - No tax implications
      - Not sure
      required: true
    - id: 25
      name: special_instructions
      label: Special Instructions
      hint: Any special instructions for payment
      type: text
      options: []
      required: false
    - id: 26
      name: supervisor_approval
      label: Supervisor Approval
      hint: Has your supervisor approved this request
      type: select_one
      options:
      - Yes, approved
      - Pending approval
      - Not yet requested
      required: true
    - id: 27
      name: supervisor_name
      label: Supervisor Name
      hint: Name of approving supervisor
      type: text
      options: []
      required: false
    - id: 28
      name: supervisor_signature_date
      label: Supervisor Signature Date
      hint: Date of supervisor approval
      type: date
      options: []
      required: false
    - id: 29
      name: finance_approval
      label: Finance Approval
      hint: Has finance approved this request
      type: select_one
      options:
      - Yes, approved
      - Pending approval
      - Not yet submitted
      required: true
    - id: 30
      name: requester_signature
      label: Requester Signature
      hint: I certify this request is accurate
      type: select_one
      options:
      - Yes, I certify
      - false
      required: true
    - id: 31
      name: cheque_pickup
      label: Cheque Pickup Method
      hint: How will you receive the cheque
      type: select_one
      options:
      - Pick up in person
      - Mail to payee
      - Internal mail
      - Courier
      required: true
    - id: 32
      name: tracking_notes
      label: Tracking Notes
      hint: For finance use only
      type: text
      options: []
      required: false
