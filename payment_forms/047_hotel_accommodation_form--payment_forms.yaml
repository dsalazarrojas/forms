inputSchema:
  type: object
  properties:
    title: <string>
    pages:
    - id: 1
      name: reservation_details
      label: Hotel Reservation
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: guest_info
      label: Guest Information
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: accommodation_type
      label: Accommodation Type
      hint: null
      type: select_one
      options:
      - Room
      - Suite
      - Apartment
      required: false
    - id: 4
      name: accommodation_date
      label: Accommodation Dates
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: accommodation_time
      label: Check-in Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: guest_phone
      label: Guest Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: special_requests
      label: Special Requests
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: additional_info
      label: Additional Info
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: guest_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: guest_gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: false
    - id: 13
      name: guest_dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: guest_nationality
      label: Nationality
      hint: null
      type: text
      options: []
      required: true
