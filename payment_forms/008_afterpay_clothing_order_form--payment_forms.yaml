inputSchema:
  type: object
  properties:
    title: Afterpay Clothing Order Form
    pages:
    - id: 1
      name: customer
      label: -- Customer --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer name
      hint: Full name for order registration
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: For order confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: item_description
      label: Item description
      hint: Include SKU, color, and size
      type: text
      options: []
      required: true
    - id: 5
      name: size
      label: Size
      hint: Select size or enter measurement
      type: select_one
      options:
      - XS
      - S
      - M
      - L
      - XL
      - XXL
      required: true
    - id: 6
      name: color
      label: Color
      hint: Preferred color choice
      type: text
      options: []
      required: false
    - id: 7
      name: quantity
      label: Quantity
      hint: Number of units
      type: number
      options: []
      required: true
    - id: 8
      name: afterpay
      label: Use Afterpay
      hint: Select yes to split payment
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 9
      name: shipping_address
      label: Shipping address
      hint: Street city postal code
      type: text
      options: []
      required: true
    - id: 10
      name: special_instructions
      label: Special instructions
      hint: Notes for fulfillment or gift options
      type: text
      options: []
      required: false
