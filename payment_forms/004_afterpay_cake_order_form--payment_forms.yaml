inputSchema:
  type: object
  properties:
    title: Afterpay Cake Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_contact_number
      label: Contact Number
      hint: Enter your phone number for order updates
      type: text
      options: []
      required: true
    - id: 3
      name: customer_email
      label: Email Address
      hint: Enter your email for order confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: delivery_date
      label: Delivery/Pickup Date
      hint: Select the date you need the cake delivered or picked up
      type: date
      options: []
      required: true
    - id: 5
      name: delivery_time
      label: Preferred Delivery/Pickup Time
      hint: Select your preferred time for delivery or pickup
      type: time
      options: []
      required: true
    - id: 6
      name: cake_details_header
      label: -- Cake Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: cake_size
      label: Cake Size
      hint: Select the size of the cake you'd like
      type: select_one
      options:
      - 6 inch (serves 6-8)
      - 8 inch (serves 8-12)
      - 10 inch (serves 12-16)
      - 12 inch (serves 16-20)
      - Custom Size
      required: true
    - id: 8
      name: cake_flavor
      label: Cake Flavor
      hint: Choose your preferred cake flavor
      type: select_one
      options:
      - Vanilla
      - Chocolate
      - Red Velvet
      - Carrot
      - Lemon
      - Strawberry
      - Marble
      - Custom Flavor
      required: true
    - id: 9
      name: frosting_type
      label: Frosting Type
      hint: Select the type of frosting for your cake
      type: select_one
      options:
      - Buttercream
      - Cream Cheese
      - Whipped Cream
      - Fondant
      - Ganache
      - Custom Frosting
      required: true
    - id: 10
      name: filling_options
      label: Filling Options
      hint: Choose any fillings you'd like inside your cake
      type: select_multiple
      options:
      - None
      - Raspberry Jam
      - Custard
      - Chocolate Ganache
      - Fresh Fruit
      - Buttercream
      - Cream Cheese
      required: false
    - id: 11
      name: cake_theme_occasion
      label: Theme or Occasion
      hint: Describe the occasion or theme for the cake
      type: text
      options: []
      required: false
    - id: 12
      name: special_instructions
      label: Special Instructions
      hint: Any special decorations, messages, or dietary requirements
      type: text
      options: []
      required: false
    - id: 13
      name: delivery_option
      label: Delivery Option
      hint: How would you like to receive your cake?
      type: select_one
      options:
      - Delivery
      - Pickup
      required: true
    - id: 14
      name: delivery_address
      label: Delivery Address
      hint: Enter the address where the cake should be delivered (if applicable)
      type: text
      options: []
      required: false
    - id: 15
      name: estimated_cost
      label: Estimated Cost
      hint: What is your budget for the cake?
      type: number
      options: []
      required: false
    - id: 16
      name: payment_method
      label: Payment Method
      hint: Select Afterpay as your payment method
      type: select_one
      options:
      - Afterpay (Buy Now, Pay Later)
      - Credit Card
      - Cash
      - Other
      required: true
    - id: 17
      name: terms_agreement
      label: Terms Agreement
      hint: Do you agree to the bakery's terms and Afterpay conditions?
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
