inputSchema:
  type: object
  properties:
    title: University Endowment Donation Form
    pages:
    - id: 1
      name: donor_name
      label: Donor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: donor_address
      label: Donor Address
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: donor_phone
      label: Donor Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: gift_amount
      label: Gift Amount
      hint: Enter a whole number
      type: number
      options: []
      required: true
    - id: 5
      name: gift_fund
      label: Gift Fund
      hint: null
      type: select_one
      options:
      - Fund A
      - Fund B
      - Fund C
      required: true
    - id: 6
      name: gift_recurring
      label: Recurring Gifts
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: gift_frequency
      label: Gift Frequency
      hint: null
      type: select_one
      options:
      - Monthly
      - One-time
      required: true
    - id: 8
      name: gift_start_date
      label: Gift Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: gift_end_date
      label: Gift End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: gift_comment
      label: Gift Comment
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: donor_email
      label: Donor E-mail
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: donor_agreement
      label: Donor Agreement
      hint: null
      type: note
      options: []
      required: true
    - id: 13
      name: gift_receipt_method
      label: Gift Receipt Method
      hint: null
      type: select_one
      options:
      - Email
      - Mail
      required: true
    - id: 14
      name: gift_notification
      label: Gift Notification
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
