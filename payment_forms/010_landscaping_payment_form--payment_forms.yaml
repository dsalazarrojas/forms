inputSchema:
  type: object
  properties:
    title: Landscaping Payment Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: service
      label: Service
      hint: null
      type: select_one
      options:
      - Lawn Care
      - Gardening
      - Landscaping
      - Irrigation
      - Other
      required: false
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: amount
      label: Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Cash
      - Credit Card
      - PayPal
      - Bank Draft
      required: true
    - id: 7
      name: client_note
      label: Client Note
      hint: null
      type: text
      options: []
      required: false
