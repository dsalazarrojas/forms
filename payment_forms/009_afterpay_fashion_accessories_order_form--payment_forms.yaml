inputSchema:
  type: object
  properties:
    title: Afterpay Fashion Accessories Order Form
    pages:
    - id: 1
      name: customer_full_name
      label: Customer Full Name
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Email Address
      hint: Enter your email for order confirmation
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Phone Number
      hint: Enter your phone number for delivery updates
      type: text
      options: []
      required: true
    - id: 4
      name: shipping_address
      label: Shipping Address
      hint: Enter the complete address for delivery
      type: text
      options: []
      required: true
    - id: 5
      name: billing_address_same_as_shipping
      label: Billing Address Same as Shipping
      hint: Is your billing address the same as your shipping address?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: billing_address
      label: Billing Address
      hint: Enter the complete billing address if different from shipping
      type: text
      options: []
      required: false
    - id: 7
      name: accessory_category_header
      label: -- Accessory Category --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: accessory_category
      label: Accessory Category
      hint: Select the type of fashion accessory you're interested in
      type: select_one
      options:
      - Jewelry
      - Handbags
      - Belts
      - Scarves
      - Hats
      - Sunglasses
      - Watches
      - Wallets
      - Fashion Hair Accessories
      - Other
      required: true
    - id: 9
      name: specific_item_name
      label: Specific Item Name
      hint: Enter the name of the specific accessory you want to order
      type: text
      options: []
      required: true
    - id: 10
      name: brand_preference
      label: Brand Preference
      hint: Do you have a preferred brand for this accessory?
      type: text
      options: []
      required: false
    - id: 11
      name: color_preference
      label: Color Preference
      hint: Specify your preferred color for the accessory
      type: text
      options: []
      required: false
    - id: 12
      name: size_specifications
      label: Size Specifications
      hint: Enter size specifications if applicable
      type: text
      options: []
      required: false
    - id: 13
      name: material_preference
      label: Material Preference
      hint: Do you have a preference for the material of the accessory?
      type: select_one
      options:
      - Leather
      - Fabric
      - Metal
      - Plastic
      - Wood
      - Other
      - No Preference
      required: false
    - id: 14
      name: quantity
      label: Quantity
      hint: How many of this accessory would you like to order?
      type: number
      options: []
      required: true
    - id: 15
      name: price_range
      label: Price Range
      hint: What is your preferred price range for this accessory?
      type: select_one
      options:
      - Under $25
      - $25-$50
      - $50-$100
      - $100-$200
      - $200-$500
      - Over $500
      required: false
    - id: 16
      name: occasion_use
      label: Occasion or Use
      hint: What occasion or purpose is this accessory for?
      type: text
      options: []
      required: false
    - id: 17
      name: shipping_preference
      label: Shipping Preference
      hint: Select your preferred shipping method
      type: select_one
      options:
      - Standard (5-7 business days)
      - Express (2-3 business days)
      - Priority (1-2 business days)
      - Store Pickup
      required: true
    - id: 18
      name: payment_method
      label: Payment Method
      hint: Select Afterpay as your payment method
      type: select_one
      options:
      - Afterpay (Buy Now, Pay Later)
      - Credit Card
      - Debit Card
      - PayPal
      required: true
    - id: 19
      name: terms_agreement
      label: Terms Agreement
      hint: Do you agree to the store's terms and Afterpay conditions?
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
