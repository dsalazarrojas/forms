inputSchema:
  type: object
  properties:
    title: Insurance Relief Donation Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: donation_amount
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Card
      - PayPal
      - Bank Transfer
      - Check
      required: true
    - id: 4
      name: card_type
      label: Card Type
      hint: null
      type: select_one
      options:
      - Visa
      - Mastercard
      - American Express
      - Discover
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: submit_form
      label: Submit Form
      hint: null
      type: text
      options: []
      required: false
