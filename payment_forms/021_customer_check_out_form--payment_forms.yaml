inputSchema:
  type: object
  properties:
    title: customer_check_out_form
    pages:
    - id: 1
      name: full_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: order_type
      label: Order Type
      hint: null
      type: select_one
      options:
      - Order 1
      - Order 2
      - Order 3
      required: true
    - id: 4
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Credit Card
      - PayPal
      required: true
    - id: 7
      name: credit_card_number
      label: Card Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: cvv
      label: CVV
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: confirmation
      label: Confirmation
      hint: null
      type: text
      options: []
      required: true
