inputSchema:
  type: object
  properties:
    title: Food Store Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: order_details
      label: Order
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Customer Phone
      hint: Enter phone number
      type: text
      options: []
      required: false
    - id: 4
      name: total_cost
      label: Total Cost
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: payment_method
      label: Payment
      hint: Select payment method
      type: select_multiple
      options:
      - '{''name'': ''Credit Card''}'
      - '{''name'': ''PayPal''}'
      - '{''name'': ''Cash''}'
      required: true
    - id: 6
      name: payment_gateway
      label: Payment Gateway
      hint: Select payment gateway
      type: select_one
      options:
      - '{''name'': ''Stripe''}'
      - '{''name'': ''Square''}'
      - '{''name'': ''Authorize''}'
      required: true
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: order_status
      label: Order Status
      hint: null
      type: note
      options: []
      required: true
    - id: 10
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: customer_notes
      label: Customer Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: store_id
      label: Store ID
      hint: null
      type: number
      options: []
      required: true
