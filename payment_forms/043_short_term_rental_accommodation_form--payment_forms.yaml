inputSchema:
  type: object
  properties:
    title: Short Term Rental Accommodation Form
    pages:
    - id: 1
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: check_in_date
      label: Check In Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: check_out_date
      label: Check Out Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: room_type
      label: Room Type
      hint: null
      type: select_one
      options:
      - Studio
      - One Bedroom
      - Two Bedroom
      - Three Bedroom
      required: false
    - id: 5
      name: room_number
      label: Room Number
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: room_description
      label: Room Description
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: special_requests
      label: Special Requests
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: false
    - id: 9
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
