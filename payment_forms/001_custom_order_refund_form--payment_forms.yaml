inputSchema:
  type: object
  properties:
    title: Custom Order Refund Form
    pages:
    - id: 1
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: refund_reason
      label: Reason for Refund
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: refund_amount
      label: Refund Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: true
    - id: 6
      name: refund_date
      label: Refund Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: refund_time
      label: Refund Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: order_notes
      label: Order Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: customer_comments
      label: Customer Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: refund_status
      label: Refund Status
      hint: null
      type: select_one
      options:
      - Pending
      - Approved
      - Rejected
      required: true
    - id: 11
      name: additional_notes
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
