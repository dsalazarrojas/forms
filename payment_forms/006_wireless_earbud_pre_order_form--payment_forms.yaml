inputSchema:
  type: object
  properties:
    title: Wireless Earbud Pre Order Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 5
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: shipping_date
      label: Shipping Date
      hint: YYYY-MM-DD
      type: date
      options: []
      required: true
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - cash
      - credit card
      - paypal
      - apple pay
      required: true
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: customer_message
      label: Customer Message
      hint: null
      type: text
      options: []
      required: false
