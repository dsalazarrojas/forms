inputSchema:
  type: object
  properties:
    title: sales_tax_calculator
    pages:
    - id: 1
      name: purchase_amount
      label: Purchase Amount
      hint: Enter the purchase amount
      type: number
      options: []
      required: true
    - id: 2
      name: sales_tax_rate
      label: Sales Tax Rate
      hint: Enter the sales tax rate
      type: number
      options: []
      required: true
    - id: 3
      name: calculate_tax
      label: Calculate Tax
      hint: Click to calculate tax
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: total_amount
      label: Total Amount
      hint: The total amount including tax
      type: number
      options: []
      required: true
    - id: 5
      name: category
      label: Category
      hint: Enter the category
      type: text
      options: []
      required: false
    - id: 6
      name: description
      label: Description
      hint: Enter a description
      type: text
      options: []
      required: false
    - id: 7
      name: output_file
      label: Output File
      hint: Click to save the output file
      type: text
      options: []
      required: false
