inputSchema:
  type: object
  properties:
    title: Martial Arts Testing Payment Form
    pages:
    - id: 1
      name: testing_type
      label: Testing Type
      hint: null
      type: select_one
      options:
      - Testing for Belt
      - Testing for Promotion
      - Other
      required: false
    - id: 2
      name: test_name
      label: Test Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: student_phone
      label: Student Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Cash
      required: false
    - id: 7
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: dojo_name
      label: Dojo Name
      hint: null
      type: text
      options: []
      required: false
