    - id: 4
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: minimum_payment
      label: Minimum Payment
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: total_interest
      label: Total Interest
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: total_paid
      label: Total Paid
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: field_8
      label: Field 8
      hint: null
      type: text
      options: []
      required: false
