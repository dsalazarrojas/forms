inputSchema:
  type: object
  properties:
    title: Minimum Payment Calculator Form
    pages:
    - id: 1
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: interest_rate
      label: Interest Rate
      hint: null
      type: select_one
      options:
      - '9.99'
      - '12.99'
      - '18.99'
      - '20.99'
      - '24.99'
      required: false
    - id: 3
      name: payment_term
