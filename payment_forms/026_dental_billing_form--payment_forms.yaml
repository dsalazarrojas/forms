inputSchema:
  type: object
  properties:
    title: dental_billing_form
    pages:
    - id: 1
      name: patient_info
      label: patient_info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: billing_info
      label: billing_info
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: payment_method
      label: payment_method
      hint: null
      type: select_multiple
      options:
      - Cash
      - Credit Card
      - Debit Card
      - Eft/Transfer
      required: false
    - id: 4
      name: payment_status
      label: payment_status
      hint: null
      type: select_one
      options:
      - Paid
      - Pending
      - Overdue
      required: true
    - id: 5
      name: total_amount
      label: total_amount
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: payment_notes
      label: payment_notes
      hint: null
      type: text
      options: []
      required: false
