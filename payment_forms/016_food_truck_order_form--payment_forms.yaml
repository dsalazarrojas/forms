      - '{''id'': 4, ''name'': ''Delivered'', ''label'': ''Delivered''}'
      - '{''id'': 5, ''name'': ''Cancelled'', ''label'': ''Cancelled''}'
      required: false
    - id: 10
      name: date_of_order
      label: Date of Order
      hint: null
      type: date
      options: []
