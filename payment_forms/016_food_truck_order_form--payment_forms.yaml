      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: address
      label: Delivery Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: order_notes
      label: Order Notes
      hint: null
      type: note
      options: []
      required: false
