inputSchema:
  type: object
  properties:
    title: Digital Payment Integration Request Form
    pages:
    - id: 1
      name: digital_payment_integration_request_form
      label: What is the type of integration you are requesting?
      hint: null
      type: select_one
      options:
      - Payment Gateway
      - API Key
      required: false
    - id: 2
      name: payment_method
      label: What is the payment method you are using?
      hint: null
      type: select_multiple
      options:
      - Stripe
      - PayPal
      - Bank Transfer
      required: false
    - id: 3
      name: payment_method_description
      label: Describe your payment method in more detail.
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: payment_gateway_description
      label: Describe your payment gateway in more detail.
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: merchant_id
      label: What is the merchant ID?
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: merchant_key
      label: What is the merchant key?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: api_key
      label: What is the API key?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: api_secret
      label: What is the API secret?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: confirm
      label: Do you confirm your payment method selection?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: payment_gateway_details
      label: Payment Gateway Details
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: payment_method_details
      label: Payment Method Details
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: payment_method_details_2
      label: Is the merchant account already set up?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 13
      name: payment_gateway_details_2
      label: If set up, provide more details about the merchant account.
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: payment_method_details_3
      label: Are you sure about your payment method selection?
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: payment_gateway_details_3
      label: Is everything correct?
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: payment_method_details_4
      label: Do you have any further questions or concerns?
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: payment_gateway_details_4
      label: Describe the payment gateway you selected.
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: payment_gateway_details_5
      label: Payment Gateway Details 5
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: payment_gateway_details_6
      label: Payment Gateway Details 6
      hint: null
      type: note
      options: []
      required: false
