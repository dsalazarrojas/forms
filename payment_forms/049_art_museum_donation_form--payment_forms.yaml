inputSchema:
  type: object
  properties:
    title: Art Museum Donation Form
    pages:
    - id: 1
      name: donor_info_header
      label: -- Donor Information --
      hint: Thank you for supporting the arts!
      type: note
      options: []
      required: false
    - id: 2
      name: donor_full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: donor_email
      label: Email Address
      hint: For your donation receipt
      type: email
      options: []
      required: true
    - id: 4
      name: donor_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: donor_address
      label: Mailing Address
      hint: Required for tax-deductible receipts
      type: text
      options: []
      required: true
    - id: 6
      name: donation_details_header
      label: -- Donation Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: donation_amount
      label: Donation Amount
      hint: null
      type: select_one
      options:
      - $25
      - $50
      - $100
      - $250
      - $500
      - Other Amount
      required: true
    - id: 8
      name: other_donation_amount
      label: Specify Other Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: donation_frequency
      label: Donation Frequency
      hint: null
      type: select_one
      options:
      - One-time Donation
      - Monthly Recurring
      - Annual Recurring
      required: true
    - id: 10
      name: designation_of_funds
      label: Where would you like your donation to go?
      hint: null
      type: select_one
      options:
      - General Operating Fund
      - Education and Outreach Programs
      - Special Exhibitions Fund
      - Permanent Collection Acquisition
      - Building and Maintenance
      required: true
    - id: 11
      name: recognition_preferences_header
      label: -- Recognition --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: recognition_name
      label: Name as it should appear in recognition materials
      hint: e.g., Mr. and Mrs. Smith, Anonymous
      type: text
      options: []
      required: true
    - id: 13
      name: in_honor_of
      label: Is this donation in honor or memory of someone?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: payment_method_header
      label: -- Payment --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: payment_type
      label: Preferred Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      - Send Check by Mail
      required: true
    - id: 16
      name: company_match
      label: Will your employer match this donation?
      hint: null
      type: select_one
      options:
      - true
      - false
      - I don't know
      required: false
    - id: 17
      name: matching_company_name
      label: Company Name for Matching
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 18
      name: donation_date
      label: Date of Donation
      hint: null
      type: date
      options: []
      required: true
