inputSchema:
  type: object
  properties:
    title: Global Shipping Information Form
    pages:
    - id: 1
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: shipping_city
      label: Shipping City
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: shipping_state
      label: Shipping State
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: shipping_zip
      label: Shipping Zip
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: shipping_country
      label: Shipping Country
      hint: null
      type: select_one
      options:
      - United States
      - Canada
      - Mexico
      required: false
    - id: 6
      name: shipping_date
      label: Shipping Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: shipping_time
      label: Shipping Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: shipping_phone
      label: Shipping Phone
      hint: null
      type: text
      options: []
      required: false
