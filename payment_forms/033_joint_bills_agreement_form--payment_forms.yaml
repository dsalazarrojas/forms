      - Weekly
      - Bi-Weekly
      - Monthly
      - Quarterly
      - Semi-Annually
      - Annually
      required: false
    - id: 7
      name: billers_phone
      label: Biller Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: billers_address
      label: Biller Address
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: bill_amount
      label: Bill Amount
      hint: Please specify the total amount of each bill
      type: number
      options: []
      required: false
    - id: 10
      name: bill_due_date
      label: Due Date
      hint: null
      type: date
      options: []
      required: false
