inputSchema:
  type: object
  properties:
    title: Joint Bills Agreement Form
    pages:
    - id: 1
      name: roommate_name
      label: Roommate Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: roommate_email
      label: Roommate Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
