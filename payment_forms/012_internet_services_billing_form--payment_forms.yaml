inputSchema:
  type: object
  properties:
    title: Internet Services Billing Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Internet
      - TV
      - Mobile
      - Home Phone
      required: false
    - id: 7
      name: service_plan
      label: Service Plan
      hint: null
      type: select_multiple
      options:
      - Basic
      - Premium
      - Ultimate
      - Pro
      required: false
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Bank Transfer
      - Credit Card
      - PayPal
      required: false
    - id: 9
      name: payment_details
      label: Payment Details
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: date_of_service
      label: Date of Service
      hint: null
      type: date
      options: []
      required: false
