inputSchema:
  type: object
  properties:
    title: Donation Refund Claim Form
    pages:
    - id: 1
      name: donour_id
      label: Donor ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: reason
      label: Reason for Refund
      hint: Please provide your reason for requesting a refund.
      type: text
      options: []
      required: true
    - id: 3
      name: donation_date
      label: Donation Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - EFT
      required: true
    - id: 8
      name: amount
      label: Amount
      hint: null
      type: number
      options: []
      required: true
