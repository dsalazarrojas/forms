inputSchema:
  type: object
  properties:
    title: Emergency Ward Donation Form
    pages:
    - id: 1
      name: donation_amount
      label: Donation Amount
      hint: 'null'
      type: number
      options: []
      required: false
    - id: 2
      name: donor_info
      label: Donor Info
      hint: 'null'
      type: select_one
      options:
      - Individual
      - Organization
      - Other
      required: false
    - id: 3
      name: donation_date
      label: Donation Date
      hint: 'null'
      type: date
      options: []
      required: false
    - id: 4
      name: payment_method
      label: Payment Method
      hint: 'null'
      type: select_multiple
      options:
      - Cash
      - Bank Transfer
      - Credit Card
      required: false
    - id: 5
      name: donor_name
      label: Donor Name
      hint: 'null'
      type: text
      options: []
      required: false
    - id: 6
      name: donor_email
      label: Email
      hint: 'null'
      type: email
      options: []
      required: false
    - id: 7
      name: donor_phone
      label: Phone
      hint: 'null'
      type: text
      options: []
      required: false
    - id: 8
      name: donor_notes
      label: Notes
      hint: 'null'
      type: note
      options: []
      required: false
