inputSchema:
  type: object
  properties:
    title: prepaid_one_time_payment_form
    pages:
    - id: 1
      name: one_time_payment
      label: one-time-payment
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: purchase_price
      label: product-price
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: purchase_amount
      label: purchase-amount
      hint: null
      type: select_one
      options:
      - $20.00
      - $15.00
      - $25.00
      - $30.00
      required: false
    - id: 4
      name: payment_method
      label: payment-method
      hint: null
      type: select_multiple
      options:
      - Bank Transfer
      - Credit/Debit Card
      - PayPal
      - Other
      required: false
    - id: 5
      name: confirm_payment
      label: confirm-payment
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: address
      label: address
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: city
      label: city
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: zip
      label: zip
      hint: null
      type: text
      options: []
      required: false
