inputSchema:
  type: object
  properties:
    title: Invoice Payment Form
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: invoice_details
      label: Invoice Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_info
      label: Payment Information
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: total_amount
      label: Total Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Bank Transfer
      - Other
      required: true
    - id: 6
      name: card_number
      label: Card Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: exp_date
      label: Expiration Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: exp_mm
      label: Expiration Month
      hint: null
      type: select_one
      options:
      - Jan
      - Feb
      - Mar
      - Apr
      - May
      - Jun
      - Jul
      - Aug
      - Sep
      - Oct
      - Nov
      - Dec
      required: true
    - id: 9
      name: cvv
      label: CVV
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: cvv_exp
      label: CVV Expiration
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: amount
      label: Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
