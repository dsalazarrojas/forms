inputSchema:
  type: object
  properties:
    title: Music Streaming Subscription Form
    pages:
    - id: 1
      name: payment_details
      label: Music Streaming Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: payment_info
      label: Payment Info
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: plan_selection
      label: Plan Selection
      hint: null
      type: select_one
      options:
      - Apple Music
      - Spotify
      - Tidal
      required: false
    - id: 4
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: payment_plan
      label: Payment Plan
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: plan_start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: subscription_plan
      label: Subscription Plan
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
