inputSchema:
  type: object
  properties:
    title: Online Course Billing Form
    pages:
    - id: 1
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: customer_name
      label: customer name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: customer_email
      label: customer email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: course_title
      label: course title
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: billing_address
      label: billing address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: amount_due
      label: amount due
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: payment_status
      label: payment status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 8
      name: payment_date
      label: payment date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: payment_time
      label: payment time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: customer_phone
      label: customer phone
      hint: null
      type: text
      options: []
      required: false
