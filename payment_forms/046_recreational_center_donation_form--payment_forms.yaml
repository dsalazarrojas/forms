inputSchema:
  type: object
  properties:
    title: recreational_center_donation_form
    pages:
    - id: 1
      name: donor_info
      label: Donor Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: donation_amount
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Card Number
      - E-check/ACH
      - Cash
      - Other
      required: false
    - id: 4
      name: card_number
      label: Card Number
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: e_check_ach
      label: E-check/ACh
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: payment_time
      label: Payment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: other_payment_method
      label: Other (If other, please specify)
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: confirm_payment
      label: Confirm Payment
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: donation_confirmation
      label: Donation Confirmation
      hint: null
      type: select_one
      options:
      - I confirm I have made a donation.
      - I have not made a donation.
      required: false
