inputSchema:
  type: object
  properties:
    title: Chiropractic Table Order Form
    pages:
    - id: 1
      name: customer_information
      label: Customer Information
      hint: Your contact details
      type: note
      options: []
      required: false
    - id: 2
      name: customer_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: customer_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: practice_name
      label: Practice Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: practice_address
      label: Practice Address
      hint: Delivery address
      type: text
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: table_selection
      label: Table Selection
      hint: Choose your table type
      type: note
      options: []
      required: false
    - id: 9
      name: table_type
      label: Table Type
      hint: null
      type: select_one
      options:
      - Stationary adjusting table
      - Elevation adjusting table
      - Flexion-distraction table
      - Drop table
      - Hi-Lo table
      - Portable table
      - Pregnancy table
      - Pediatric table
      - Combination table
      - Custom configuration
      required: true
    - id: 10
      name: quantity
      label: Quantity
      hint: Number of tables
      type: number
      options: []
      required: true
    - id: 11
      name: table_model
      label: Preferred Model
      hint: If known
      type: text
      options: []
      required: false
    - id: 12
      name: table_features
      label: Table Features
      hint: Desired features
      type: note
      options: []
      required: false
    - id: 13
      name: upholstery_color
      label: Upholstery Color
      hint: null
      type: select_one
      options:
      - Black
      - Blue
      - Burgundy
      - Green
      - Gray
      - Tan
      - Purple
      - Custom color
      required: true
    - id: 14
      name: headpiece_type
      label: Headpiece Type
      hint: null
      type: select_one
      options:
      - Standard fixed
      - Adjustable
      - Drop headpiece
      - Elevation headpiece
      - Flexion headpiece
      - No headpiece
      required: true
    - id: 15
      name: armrests
      label: Armrests
      hint: null
      type: select_one
      options:
      - Fixed armrests
      - Adjustable armrests
      - Flip-up armrests
      - No armrests
      required: true
    - id: 16
      name: leg_section
      label: Leg Section
      hint: null
      type: select_one
      options:
      - Standard
      - Drop leg piece
      - Flexion leg piece
      - Elevation leg piece
      - Split leg design
      required: true
    - id: 17
      name: drop_system
      label: Drop System
      hint: null
      type: select_one
      options:
      - No drop system
      - Cervical drop
      - Thoracic drop
      - Lumbar drop
      - Pelvic drop
      - Full drop system
      required: true
    - id: 18
      name: height_adjustment
      label: Height Adjustment
      hint: null
      type: select_one
      options:
      - Fixed height
      - Manual elevation
      - Power elevation
      - Hi-Lo power
      required: true
    - id: 19
      name: cushioning
      label: Cushioning Firmness
      hint: null
      type: select_one
      options:
      - Standard firmness
      - Medium firmness
      - Soft cushioning
      - Extra firm
      - Memory foam
      required: true
    - id: 20
      name: additional_features
      label: Additional Features
      hint: Select all that apply
      type: select_multiple
      options:
      - Paper roll holder
      - Instrument tray
      - Storage drawer
      - Face paper dispenser
      - Foot control
      - Hand control
      - Timer
      - Heating element
      - Vibration massage
      - None
      required: false
    - id: 21
      name: accessories
      label: Accessories
      hint: Additional items
      type: note
      options: []
      required: false
    - id: 22
      name: table_accessories
      label: Table Accessories Needed
      hint: Select all that apply
      type: select_multiple
      options:
      - Headrest covers
      - Face paper rolls
      - Table pads
      - Bolsters
      - Pillows
      - Straps
      - Cleaning supplies
      - Table carry case
      - None
      required: false
    - id: 23
      name: warranty
      label: Warranty Options
      hint: Coverage selection
      type: note
      options: []
      required: false
    - id: 24
      name: warranty_selection
      label: Warranty Selection
      hint: null
      type: select_one
      options:
      - Standard warranty
      - Extended 3-year
      - Extended 5-year
      - Lifetime warranty
      required: true
    - id: 25
      name: delivery_installation
      label: Delivery and Installation
      hint: Shipping options
      type: note
      options: []
      required: false
    - id: 26
      name: shipping_method
      label: Shipping Method
      hint: null
      type: select_one
      options:
      - Standard ground
      - Expedited shipping
      - White glove delivery
      - Will call pickup
      required: true
    - id: 27
      name: installation_needed
      label: Is Professional Installation Needed
      hint: null
      type: select_one
      options:
      - Yes, please include
      - No, I will install
      - Not sure
      required: true
    - id: 28
      name: delivery_instructions
      label: Special Delivery Instructions
      hint: Access considerations
      type: text
      options: []
      required: false
    - id: 29
      name: pricing_payment
      label: Pricing and Payment
      hint: Payment details
      type: note
      options: []
      required: false
    - id: 30
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit card
      - Debit card
      - Check
      - Wire transfer
      - Financing
      - Lease
      required: true
    - id: 31
      name: financing_needed
      label: Is Financing Needed
      hint: null
      type: select_one
      options:
      - Yes, interested
      - No, paying in full
      required: true
    - id: 32
      name: purchase_order
      label: Purchase Order Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 33
      name: estimated_budget
      label: Estimated Budget Range
      hint: null
      type: select_one
      options:
      - Under $1,000
      - $1,000-$2,500
      - $2,501-$5,000
      - $5,001-$10,000
      - Over $10,000
      required: false
    - id: 34
      name: timeline
      label: Timeline
      hint: When do you need delivery
      type: note
      options: []
      required: false
    - id: 35
      name: delivery_timeline
      label: Expected Delivery Timeline
      hint: null
      type: select_one
      options:
      - ASAP
      - Within 2 weeks
      - Within 1 month
      - Within 3 months
      - Flexible
      required: true
    - id: 36
      name: trade_in
      label: Do you have an old table to trade in
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 37
      name: trade_in_details
      label: Trade-In Details
      hint: Brand, model, condition
      type: text
      options: []
      required: false
    - id: 38
      name: questions_comments
      label: Questions or Comments
      hint: Anything else we should know
      type: text
      options: []
      required: false
    - id: 39
      name: how_did_you_hear
      label: How Did You Hear About Us
      hint: null
      type: select_one
      options:
      - Internet search
      - Referral
      - Trade show
      - Advertisement
      - Catalog
      - Previous customer
      - Other
      required: false
    - id: 40
      name: terms_acceptance
      label: I accept the terms and conditions
      hint: null
      type: select_one
      options:
      - Yes, I accept
      - No, I do not accept
      required: true
    - id: 41
      name: customer_signature
      label: Customer Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 42
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: true
