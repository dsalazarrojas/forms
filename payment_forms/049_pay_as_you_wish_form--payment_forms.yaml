inputSchema:
  type: object
  properties:
    title: pay_as_you_wish_form
    pages:
    - id: 1
      name: payment_amount
      label: Donation amount
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: payment_frequency
      label: How often do you want to make recurring payments?
      hint: null
      type: select_multiple
      options:
      - Monthly
      - Quarterly
      - Yearly
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: note
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: payment_method
      label: Payment method
      hint: null
      type: select_one
      options:
      - Credit card
      - Bank transfer
      - Check
      required: false
    - id: 7
      name: payment_date
      label: Payment date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: payment_time
      label: Payment time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: payment_status
      label: Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 10
      name: payment_frequency_type
      label: Frequency type
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 11
      name: payment_frequency_unit
      label: Frequency unit
      hint: null
      type: select_one
      options:
      - Year
      - Month
      - Day
      required: false
