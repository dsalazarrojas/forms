      - gift
      - other
      required: false
    - id: 6
      name: item_description
      label: Item Description
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: item_price
      label: Item Price
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: total_cost
      label: Total Cost
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: delivery_address
      label: Delivery Address
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
