inputSchema:
  type: object
  properties:
    title: Employee Merchandise Order Form
    pages:
    - id: 1
      name: employee_order_form
      label: Employee Order Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: payment_details
      label: Payment Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - card number
      - check
      required: false
    - id: 4
      name: order_item_list
      label: Order Item List
      hint: null
      type: select_multiple
      options:
