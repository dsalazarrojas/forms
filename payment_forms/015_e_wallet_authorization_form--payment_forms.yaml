inputSchema:
  type: object
  properties:
    title: E Wallet Authorization Form
    pages:
    - id: 1
      name: customer_id
      label: Customer ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: e_wallet_id
      label: E-Wallet ID
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: e_wallet_type
      label: E-Wallet Type
      hint: null
      type: select_one
      options:
      - Apple Pay
      - Google Pay
      - PayPal
      required: false
    - id: 7
      name: authorization_amount
      label: Authorization Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: authorization_date
      label: Authorization Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: submission_id
      label: Submission ID
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: submission_data
      label: Submission Data
      hint: null
      type: text
      options: []
      required: false
