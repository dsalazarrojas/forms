      name: conflict_zones_form
      label: Conflict Zones
      hint: null
      type: select_multiple
      options:
      - Africa
      - Asia
      - Europe
      - North America
      required: false
    - id: 2
      name: amount_donated
      label: Amount Donated
      hint: null
      type: number
      options: []
