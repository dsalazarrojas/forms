      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - PayPal
      required: false
    - id: 4
      name: date_donated
      label: Date Donated
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: time_donated
      label: Time Donated
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: donation_note
      label: Donation Note
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
