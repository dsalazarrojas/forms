      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: contact_info
      label: Contact Info
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: date_available
      label: Date Available
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: personal_statement
      label: Personal Statement
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
