inputSchema:
  type: object
  properties:
    title: Solar System Purchase Order Form
    pages:
    - id: 1
      name: supplier_id
      label: Supplier ID
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: total_cost
      label: Total Cost
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: product_type
      label: Product Type
      hint: null
      type: select_one
      options:
      - Solar Panel
      - Inverter
      - Mounting System
      required: false
    - id: 8
      name: payment_terms
      label: Payment Terms
      hint: null
      type: select_multiple
      options:
      - Net 30
      - Net 60
      - Net 90
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
