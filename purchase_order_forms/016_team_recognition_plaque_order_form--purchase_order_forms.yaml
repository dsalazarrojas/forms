inputSchema:
  type: object
  properties:
    title: Team Recognition Plaque Order Form
    pages:
    - id: 1
      name: team_name
      label: Team Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: team_leader_name
      label: team_leaders_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Stripe
      - PayPal
      required: true
    - id: 5
      name: team_description
      label: team_description
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: team_size
      label: team_size
      hint: null
      type: select_one
      options:
      - Large
      - Medium
      - Small
      required: true
    - id: 7
      name: team_size_other
      label: team_size_other
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: plaque_size
      label: plaque_size
      hint: null
      type: select_one
      options:
      - 2x4
      - 3x5
      - 4x6
      required: true
    - id: 9
      name: plaque_material
      label: plaque_material
      hint: null
      type: select_one
      options:
      - Aluminum
      - Stainless Steel
      - Wood
      required: true
    - id: 10
      name: message_for_plaque
      label: message_for_plaque
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: team_name_2
      label: team_leaders_name
      hint: null
      type: text
      options: []
      required: false
