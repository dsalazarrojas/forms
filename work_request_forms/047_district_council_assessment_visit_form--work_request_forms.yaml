inputSchema:
  type: object
  properties:
    title: District Council Assessment Visit Form
    pages:
    - id: 1
      name: form_title
      label: Form Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: form_description
      label: Form Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: assessment_type
      label: Assessment Type
      hint: null
      type: select_one
      options:
      - smoke
      - heat
      - multi sensor
      - carbon monoxide
      required: false
    - id: 4
      name: assessment_location
      label: Assessment Location
      hint: null
      type: select_multiple
      options:
      - office
      - site
      - other
      required: false
    - id: 5
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: assessment_time
      label: Assessment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: assessment_time_duration
      label: Assessment Time Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: notes
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
