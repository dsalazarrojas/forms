inputSchema:
  type: object
  properties:
    title: Initial Fire Incident Report Form
    pages:
    - id: 1
      name: incident_details
      label: Incident Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: incident_type
      label: Incident Type
      hint: null
      type: select_one
      options:
      - Fire
      - Non-fire
      - Other
      required: false
    - id: 3
      name: incident_description
      label: Incident Description
      hint: Describe the incident
      type: text
      options: []
      required: false
    - id: 4
      name: incident_date
      label: Date of Incident
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: incident_time
      label: Time of Incident
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: incident_location
      label: Incident Location
      hint: Location of incident
      type: text
      options: []
      required: false
    - id: 7
      name: incident_investigation
      label: Investigation
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: incident_status
      label: Incident Status
      hint: null
      type: select_one
      options:
      - Open
      - Closed
      - In progress
      required: false
    - id: 9
      name: incident_escalation
      label: Escalation
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: incident_responders
      label: Responders
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: incident_injuries
      label: Injuries
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: incident_damage
      label: Damage
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: incident_deaths
      label: Deaths
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: incident_funds
      label: Fund Allocation
      hint: null
      type: number
      options: []
      required: false
