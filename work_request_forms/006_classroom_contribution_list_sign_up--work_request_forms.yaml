inputSchema:
  type: object
  properties:
    title: Classroom Contribution List Sign Up
    pages:
    - id: 1
      name: parent_header
      label: -- Parent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: parent_full_name
      label: Parent Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: classroom_number
      label: Classroom Number or Grade
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: sign_up_header
      label: -- Weekly Contribution Sign-Up --
      hint: Please select the item you would like to contribute
      type: note
      options: []
      required: false
    - id: 8
      name: contribution_item
      label: Contribution Item
      hint: null
      type: select_one
      options:
      - Fresh Fruit
      - Healthy Crackers
      - Cheese Sticks
      - Paper Towels
      - Wet Wipes
      - Hand Sanitizer
      - Art Supplies (Glue, Paper, etc.)
      required: true
    - id: 9
      name: week_of_contribution
      label: Week of Contribution
      hint: null
      type: select_one
      options:
      - Week 1 (Oct 1st - 5th)
      - Week 2 (Oct 8th - 12th)
      - Week 3 (Oct 15th - 19th)
      - Week 4 (Oct 22nd - 26th)
      required: true
    - id: 10
      name: quantity_description
      label: Quantity or Specifics
      hint: e.g. 2 bags of apples, 3 packs of wipes
      type: text
      options: []
      required: true
    - id: 11
      name: dietary_notes
      label: Any dietary notes or allergens?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: reminder_opt_in
      label: Would you like a text reminder the day before?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 13
      name: thank_you_note
      label: Thank you for supporting our classroom!
      hint: null
      type: note
      options: []
      required: false
