      label: Budget Range
      hint: null
      type: select_one
      options:
      - Less than $50,000
      - $50,000 - $100,000
      - $100,000 - $250,000
      - $250,000 - $500,000
      - $500,000 - $1,000,000
      - $1,000,000 - $5,000,000
      - Over $5,000,000
      - Not determined
      required: false
