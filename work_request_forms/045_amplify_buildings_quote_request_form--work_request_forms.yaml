      type: text
      options: []
      required: false
    - id: 32
      name: financing_secured
      label: Is Financing Secured
      hint: null
      type: select_one
      options:
      - Yes - Fully secured
      - Yes - Partially secured
      - In progress
      - Not yet
      - Not applicable
      required: false
    - id: 33
      name: section_plans
      label: -- Plans and Documents --
      hint: null
      type: note
      options: []
      required: false
