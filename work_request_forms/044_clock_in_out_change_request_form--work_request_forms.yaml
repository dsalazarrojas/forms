inputSchema:
  type: object
  properties:
    title: Clock In Out Change Request Form
    pages:
    - id: 1
      name: form_header
      label: Clock In-Out Change Request Form
      hint: Use this form to request changes to your time clock records
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Administration
      - Facilities
      - Maintenance
      - Security
      - Housekeeping
      - Grounds
      - IT
      - Human Resources
      - Other
      required: true
    - id: 5
      name: supervisor_name
      label: Supervisor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: request_date
      label: Request Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: change_type
      label: Type of Change Requested
      hint: null
      type: select_one
      options:
      - Clock-In Time Correction
      - Clock-Out Time Correction
      - Missed Clock-In
      - Missed Clock-Out
      - Wrong Time Entry
      - System Error
      - Other
      required: true
    - id: 8
      name: date_of_incident
      label: Date of Incident
      hint: When did this occur
      type: date
      options: []
      required: true
    - id: 9
      name: scheduled_start
      label: Scheduled Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: scheduled_end
      label: Scheduled End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 11
      name: actual_clock_in
      label: Actual or Correct Clock-In Time
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: actual_clock_out
      label: Actual or Correct Clock-Out Time
      hint: null
      type: time
      options: []
      required: true
    - id: 13
      name: current_recorded_in
      label: Currently Recorded Clock-In
      hint: If applicable
      type: time
      options: []
      required: false
    - id: 14
      name: current_recorded_out
      label: Currently Recorded Clock-Out
      hint: If applicable
      type: time
      options: []
      required: false
    - id: 15
      name: reason_for_change
      label: Reason for Change Request
      hint: null
      type: select_one
      options:
      - Forgot to Clock In
      - Forgot to Clock Out
      - System Malfunction
      - Emergency Situation
      - Worked Through Break
      - Stayed Late for Project
      - Arrived Early
      - Other
      required: true
    - id: 16
      name: reason_details
      label: Please Explain the Situation
      hint: Provide details
      type: text
      options: []
      required: true
    - id: 17
      name: work_performed
      label: Describe Work Performed During Discrepancy
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: witness_name
      label: Witness Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 19
      name: witness_contact
      label: Witness Contact
      hint: Email or phone
      type: text
      options: []
      required: false
    - id: 20
      name: previous_requests
      label: Have You Submitted Similar Requests Before
      hint: In the past 6 months
      type: select_one
      options:
      - Yes Once
      - Yes Multiple Times
      - 'False'
      required: false
    - id: 21
      name: approval_needed
      label: Is Supervisor Approval Required
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Sure
      required: true
    - id: 22
      name: urgency
      label: Request Urgency
      hint: null
      type: select_one
      options:
      - Routine - Next Pay Period
      - Urgent - This Pay Period
      - Critical - Immediate
      required: true
    - id: 23
      name: employee_signature
      label: Employee Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 24
      name: signature_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 25
      name: supervisor_approval
      label: Supervisor Approval
      hint: null
      type: select_one
      options:
      - Approved
      - Denied
      - Pending Review
      required: false
    - id: 26
      name: supervisor_signature
      label: Supervisor Signature
      hint: Type full name
      type: text
      options: []
      required: false
    - id: 27
      name: hr_use_only
      label: HR Use Only - Processed By
      hint: null
      type: text
      options: []
      required: false
    - id: 28
      name: hr_processed_date
      label: HR Processed Date
      hint: null
      type: date
      options: []
      required: false
