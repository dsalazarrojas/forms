inputSchema:
  type: object
  properties:
    title: Computer Repair Work Order Form
    pages:
      - id: 1
        name: section_work_order
        label: -- Repair Work Order --
        hint: Submit repair requests and track resolution
        type: note
        options: []
        required: false
      - id: 2
        name: requester_name
        label: Requester name
        hint: Name of person requesting repair
        type: text
        options: []
        required: true
      - id: 3
        name: contact_email
        label: Contact email
        hint: For updates about repair status
        type: email
        options: []
        required: true
      - id: 4
        name: device_type
        label: Device type
        hint: Laptop, Desktop, or other
        type: select_one
        options: [Laptop, Desktop, Tablet, Mobile, Other]
        required: true
      - id: 5
        name: problem_description
        label: Problem description
        hint: Detailed description of the issue
        type: text
        options: []
        required: true
      - id: 6
        name: priority
        label: Priority
        hint: Request priority for scheduling
        type: select_one
        options: [Low, Normal, High, Urgent]
        required: true
      - id: 7
        name: location
        label: Location
        hint: Where the device is located
        type: text
        options: []
        required: false
      - id: 8
        name: work_performed
        label: Work performed
        hint: For technician to record actions taken
        type: text
        options: []
        required: false
      - id: 9
        name: resolution_status
        label: Resolution status
        hint: Open, In progress, Completed
        type: select_one
        options: [Open, In progress, Completed]
        required: false
