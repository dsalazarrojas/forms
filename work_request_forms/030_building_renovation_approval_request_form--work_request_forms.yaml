inputSchema:
  type: object
  properties:
    title: Building Renovation Approval Request Form
    pages:
    - id: 1
      name: request_date
      label: Request Date
      hint: When submitting this request
      type: date
      options: []
      required: true
    - id: 2
      name: property_address
      label: Property Address
      hint: Location of renovation
      type: text
      options: []
      required: true
    - id: 3
      name: unit_number
      label: Unit or Space Number
      hint: Apartment, office, or unit number
      type: text
      options: []
      required: false
    - id: 4
      name: requestor_name
      label: Requestor Name
      hint: Who is requesting this
      type: text
      options: []
      required: true
    - id: 5
      name: requestor_email
      label: Requestor Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 6
      name: requestor_phone
      label: Requestor Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 7
      name: requestor_relationship
      label: Relationship to Property
      hint: Owner, tenant, manager, etc
      type: select_one
      options:
      - Property Owner
      - Tenant
      - Property Manager
      - Contractor
      - Other
      required: true
    - id: 8
      name: renovation_scope
      label: Scope of Renovation
      hint: What work is being requested
      type: text
      options: []
      required: true
    - id: 9
      name: renovation_areas
      label: Areas or Rooms Affected
      hint: Which parts of the property
      type: select_multiple
      options:
      - Kitchen
      - Bathrooms
      - Living Areas
      - Bedrooms
      - Flooring
      - Walls
      - Exterior
      - Entire Property
      required: true
    - id: 10
      name: renovation_type
      label: Type of Renovation
      hint: Category of work
      type: select_one
      options:
      - Cosmetic Updates
      - Structural Modifications
      - System Upgrades
      - Accessibility Improvements
      - Energy Efficiency
      - Complete Remodel
      - Other
      required: true
    - id: 11
      name: estimated_budget
      label: Estimated Budget
      hint: Total cost estimate
      type: number
      options: []
      required: false
    - id: 12
      name: project_timeline
      label: Proposed Start Date
      hint: When to begin work
      type: date
      options: []
      required: true
    - id: 13
      name: expected_completion
      label: Expected Completion Date
      hint: When will it be done
      type: date
      options: []
      required: false
    - id: 14
      name: contractor_selection
      label: Contractor Selected
      hint: Do you have a contractor
      type: select_one
      options:
      - true
      - false
      - Need Recommendations
      required: true
    - id: 15
      name: contractor_name
      label: Contractor Name
      hint: If contractor is selected
      type: text
      options: []
      required: false
    - id: 16
      name: contractor_license
      label: Contractor License Number
      hint: Professional credentials
      type: text
      options: []
      required: false
    - id: 17
      name: permits_required
      label: Building Permits Required
      hint: Will permits be needed
      type: select_one
      options:
      - true
      - false
      - Unsure
      required: true
    - id: 18
      name: detailed_plans
      label: Detailed Plans Attached
      hint: Do you have blueprints
      type: select_one
      options:
      - true
      - false
      - In Progress
      required: false
    - id: 19
      name: insurance_coverage
      label: Insurance Coverage Available
      hint: Homeowner or liability insurance
      type: select_one
      options:
      - true
      - false
      - Unsure
      required: true
    - id: 20
      name: occupancy_impact
      label: Impact on Occupancy
      hint: Will property be vacant
      type: select_one
      options:
      - No Impact
      - Partial Vacancy
      - Complete Vacancy
      - Temporary Relocation
      required: true
    - id: 21
      name: noise_duration
      label: Expected Duration of Disruptions
      hint: How long will work affect occupants
      type: select_one
      options:
      - Less than 1 Week
      - 1-2 Weeks
      - 2-4 Weeks
      - 1-3 Months
      - Over 3 Months
      required: false
    - id: 22
      name: environmental_concerns
      label: Environmental or Safety Concerns
      hint: Any special considerations
      type: text
      options: []
      required: false
