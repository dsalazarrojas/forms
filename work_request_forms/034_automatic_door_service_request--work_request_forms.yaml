inputSchema:
  type: object
  properties:
    title: Automatic Door Service Request
    pages:
    - id: 1
      name: introduction
      label: Automatic Door Service Request
      hint: Request service for your automatic door
      type: note
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Information
      hint: Your details
      type: note
      options: []
      required: false
    - id: 3
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 4
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: Business name
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email Address
      hint: Primary email
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 8
      name: address
      label: Street Address
      hint: Your address
      type: text
      options: []
      required: true
    - id: 9
      name: city
      label: City
      hint: City
      type: text
      options: []
      required: true
    - id: 10
      name: state
      label: State
      hint: State
      type: select_one
      options:
      - Alabama
      - Alaska
      - Arizona
      - Arkansas
      - California
      - Colorado
      - Connecticut
      - Delaware
      - Florida
      - Georgia
      - Other
      required: true
    - id: 11
      name: zip_code
      label: ZIP Code
      hint: 5-digit ZIP code
      type: text
      options: []
      required: true
    - id: 12
      name: service_location
      label: Service Location
      hint: Where is the door
      type: note
      options: []
      required: false
    - id: 13
      name: building_type
      label: Building Type
      hint: What type of building
      type: select_one
      options:
      - Office Building
      - Retail Store
      - Hospital
      - School
      - Warehouse
      - Restaurant
      - Hotel
      - Residential
      - Other
      required: true
    - id: 14
      name: door_location
      label: Door Location
      hint: Where is the door located
      type: select_one
      options:
      - Main Entrance
      - Side Entrance
      - Rear Entrance
      - Interior Door
      - Elevator Lobby
      - Other
      required: true
    - id: 15
      name: door_info
      label: Door Information
      hint: Details about the door
      type: note
      options: []
      required: false
    - id: 16
      name: door_type
      label: Door Type
      hint: What type of automatic door
      type: select_one
      options:
      - Sliding Door
      - Swing Door
      - Revolving Door
      - Folding Door
      - Low Energy Operator
      - Not Sure
      required: true
    - id: 17
      name: door_manufacturer
      label: Door Manufacturer
      hint: Brand if known
      type: text
      options: []
      required: false
    - id: 18
      name: door_model
      label: Door Model
      hint: Model if known
      type: text
      options: []
      required: false
    - id: 19
      name: installation_date
      label: Installation Date
      hint: When installed
      type: date
      options: []
      required: false
    - id: 20
      name: number_of_doors
      label: Number of Doors
      hint: How many doors
      type: number
      options: []
      required: true
    - id: 21
      name: service_info
      label: Service Information
      hint: What service is needed
      type: note
      options: []
      required: false
    - id: 22
      name: service_type
      label: Type of Service
      hint: What do you need
      type: select_one
      options:
      - Repair
      - Maintenance
      - Inspection
      - Emergency Service
      - Installation
      - Replacement
      - Upgrade
      - Other
      required: true
    - id: 23
      name: problem_description
      label: Problem Description
      hint: Describe the issue
      type: text
      options: []
      required: true
    - id: 24
      name: symptoms
      label: Symptoms
      hint: What is happening
      type: select_multiple
      options:
      - Door Not Opening
      - Door Not Closing
      - Slow Operation
      - Making Noise
      - Jerky Movement
      - Sensor Issues
      - Remote Not Working
      - Intermittent Operation
      - Other
      required: false
    - id: 25
      name: urgency
      label: Urgency Level
      hint: How urgent
      type: select_one
      options:
      - Emergency
      - High Priority
      - Normal
      - Low Priority
      - Scheduled Maintenance
      required: true
    - id: 26
      name: safety_concern
      label: Safety Concern
      hint: Any safety issues
      type: select_one
      options:
      - Yes Immediate Attention
      - Minor Concern
      - No Safety Issues
      required: true
    - id: 27
      name: safety_details
      label: Safety Details
      hint: Describe safety concern
      type: text
      options: []
      required: false
    - id: 28
      name: appointment_preferences
      label: Appointment Preferences
      hint: When for service
      type: note
      options: []
      required: false
    - id: 29
      name: preferred_date
      label: Preferred Service Date
      hint: When to come
      type: date
      options: []
      required: true
    - id: 30
      name: preferred_time
      label: Preferred Time
      hint: What time
      type: time
      options: []
      required: false
    - id: 31
      name: time_flexibility
      label: Time Flexibility
      hint: How flexible
      type: select_one
      options:
      - Very Flexible
      - Somewhat Flexible
      - Need Specific Time
      - After Hours Only
      - Weekend Only
      required: true
    - id: 32
      name: after_hours_service
      label: After Hours Service
      hint: Can we work after hours
      type: select_one
      options:
      - Yes Preferred
      - Yes If Needed
      - No Business Hours Only
      required: false
    - id: 33
      name: access_info
      label: Access Information
      hint: How to access
      type: note
      options: []
      required: false
    - id: 34
      name: building_access
      label: Building Access
      hint: How to enter
      type: select_one
      options:
      - Someone Will Be Present
      - Lockbox Available
      - Security Desk
      - Call on Arrival
      - Other
      required: true
    - id: 35
      name: contact_on_site
      label: On-Site Contact
      hint: Who will be there
      type: text
      options: []
      required: false
    - id: 36
      name: contact_phone
      label: On-Site Contact Phone
      hint: Their number
      type: text
      options: []
      required: false
    - id: 37
      name: parking_info
      label: Parking Information
      hint: Where to park
      type: text
      options: []
      required: false
    - id: 38
      name: service_history
      label: Service History
      hint: Previous service
      type: note
      options: []
      required: false
    - id: 39
      name: previous_service
      label: Previous Service Provider
      hint: Who serviced before
      type: text
      options: []
      required: false
    - id: 40
      name: last_service_date
      label: Last Service Date
      hint: When last serviced
      type: date
      options: []
      required: false
    - id: 41
      name: service_contract
      label: Service Contract
      hint: Do you have a contract
      type: select_one
      options:
      - Yes Active
      - Yes Expired
      - false
      - Not Sure
      required: false
    - id: 42
      name: contract_number
      label: Contract Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 43
      name: parts_needed
      label: Parts Known to Be Needed
      hint: If you know
      type: text
      options: []
      required: false
    - id: 44
      name: budget_range
      label: Budget Range
      hint: Expected cost
      type: select_one
      options:
      - Under $500
      - $500-$1000
      - $1000-$2500
      - $2500-$5000
      - Over $5000
      - Need Estimate First
      required: false
    - id: 45
      name: estimate_required
      label: Estimate Required
      hint: Before work begins
      type: select_one
      options:
      - Yes Required
      - No Go Ahead
      - Call First
      required: true
    - id: 46
      name: additional_notes
      label: Additional Notes
      hint: Any other details
      type: text
      options: []
      required: false
    - id: 47
      name: how_heard
      label: How Did You Hear About Us
      hint: How did you find us
      type: select_one
      options:
      - Google Search
      - Referral
      - Previous Customer
      - Advertisement
      - Building Management
      - Other
      required: false
    - id: 48
      name: requester_signature
      label: Requester Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 49
      name: request_date
      label: Request Date
      hint: Today date
      type: date
      options: []
      required: true
