inputSchema:
  type: object
  properties:
    title: Steel Work Order Form
    pages:
    - id: 1
      name: client_id
      label: Client ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: work_order_type
      label: Work Order Type
      hint: null
      type: select_one
      options:
      - Fabricated
      - Non-Fabricated
      - Custom
      required: true
    - id: 4
      name: material_type
      label: Material Type
      hint: null
      type: select_multiple
      options:
      - Aluminum
      - Steel
      - Stainless Steel
      - Copper
      - Brass
      required: true
    - id: 5
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: unit_price
      label: Unit Price
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: discount
      label: Discount
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
