inputSchema:
  type: object
  properties:
    title: Floodlight Maintenance Request Form
    pages:
    - id: 1
      name: user_input
      label: User input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: facility_id
      label: Facility ID
      hint: Enter facility ID here
      type: select_one
      options:
      - Option 1
      - Option 2
      required: true
    - id: 3
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: issue_description
      label: Issue description
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 6
      name: scheduled_service
      label: Scheduled service
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: service_requestor
      label: Service requestor
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
