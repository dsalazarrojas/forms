inputSchema:
  type: object
  properties:
    title: Operations Planning Assistance Request Form
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: priority
      label: Priority
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - '{''value'': ''Pending''}'
      - '{''value'': ''In Progress''}'
      - '{''value'': ''Done''}'
      required: true
    - id: 9
      name: request_type
      label: Request Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
