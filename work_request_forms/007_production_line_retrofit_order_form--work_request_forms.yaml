inputSchema:
  type: object
  properties:
    title: Production Line Retrofit Order Form
    pages:
    - id: 1
      name: production_line
      label: Production Line
      hint: What is the production line to be retrofitted?
      type: select_one
      options:
      - Production Line 1
      - Production Line 2
      - Production Line 3
      required: false
    - id: 2
      name: date
      label: Date
      hint: What is the current date?
      type: date
      options: []
      required: false
    - id: 3
      name: start_time
      label: Start Time
      hint: What is the start time?
      type: time
      options: []
      required: false
    - id: 4
      name: duration
      label: Duration
      hint: How long does the retrofit take?
      type: number
      options: []
      required: false
    - id: 5
      name: description
      label: Description
      hint: Please describe the retrofit
      type: text
      options: []
      required: false
    - id: 6
      name: consent
      label: Consent
      hint: I consent to the terms and conditions
      type: select_one
      options:
      - I agree
      - I do not agree
      required: false
    - id: 7
      name: additional_info
      label: Additional Info
      hint: Is there any additional information to provide?
      type: text
      options: []
      required: false
    - id: 8
      name: production_line_manager_name
      label: Production Line Manager Name
      hint: Who is the production line manager responsible?
      type: text
      options: []
      required: false
    - id: 9
      name: production_line_manager_email
      label: Production Line Manager Email
      hint: What is the production line manager's email?
      type: email
      options: []
      required: false
    - id: 10
      name: production_line_manager_phone
      label: Production Line Manager Phone
      hint: What is the production line manager's phone number?
      type: number
      options: []
      required: false
