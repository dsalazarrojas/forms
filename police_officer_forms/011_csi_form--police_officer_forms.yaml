inputSchema:
  type: object
  properties:
    title: CSI Form
    pages:
    - id: 1
      name: officer_name
      label: Officer name
      hint: Name of reporting officer
      type: text
      options: []
      required: true
    - id: 2
      name: case_number
      label: Case number
      hint: Department assigned case id
      type: text
      options: []
      required: true
    - id: 3
      name: incident_date
      label: Incident date
      hint: Date of incident
      type: date
      options: []
      required: true
    - id: 4
      name: location_of_scene
      label: Location of scene
      hint: Address or GPS reference
      type: text
      options: []
      required: true
    - id: 5
      name: evidence_collected
      label: Evidence collected
      hint: Brief description of items
      type: text
      options: []
      required: true
    - id: 6
      name: chain_of_custody
      label: Chain of custody confirmed
      hint: Confirmed procedures followed
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 7
      name: photos_taken
      label: Photos taken at scene
      hint: Number of photos or reference
      type: number
      options: []
      required: false
    - id: 8
      name: additional_notes
      label: Additional investigative notes
      hint: Observations and witness details
      type: text
      options: []
      required: false
