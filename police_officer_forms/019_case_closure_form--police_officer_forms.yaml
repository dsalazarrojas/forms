inputSchema:
  type: object
  properties:
    title: Case Closure Form
    pages:
    - id: 1
      name: closure_header
      label: Case Closure Report
      hint: Official documentation for case closure
      type: note
      options: []
      required: false
    - id: 2
      name: case_number
      label: Case Number
      hint: Official case identifier
      type: text
      options: []
      required: true
    - id: 3
      name: closure_date
      label: Closure Date
      hint: Date of case closure
      type: date
      options: []
      required: true
    - id: 4
      name: closure_time
      label: Closure Time
      hint: Time of closure
      type: time
      options: []
      required: false
    - id: 5
      name: case_info
      label: Case Information
      hint: Original case details
      type: note
      options: []
      required: false
    - id: 6
      name: case_type
      label: Type of Case
      hint: Case classification
      type: select_one
      options:
      - Criminal investigation
      - Traffic incident
      - Missing person
      - Property crime
      - Violent crime
      - Fraud or financial
      - Drug related
      - Juvenile
      - Domestic
      - Other
      required: true
    - id: 7
      name: case_category
      label: Case Category
      hint: Specific category
      type: text
      options: []
      required: true
    - id: 8
      name: date_opened
      label: Date Case Opened
      hint: Original opening date
      type: date
      options: []
      required: true
    - id: 9
      name: case_duration
      label: Case Duration
      hint: Total investigation time
      type: select_one
      options:
      - Less than 24 hours
      - 1 to 7 days
      - 1 to 4 weeks
      - 1 to 3 months
      - 3 to 6 months
      - Over 6 months
      required: true
    - id: 10
      name: investigating_officer
      label: Primary Investigating Officer
      hint: Lead officer name
      type: text
      options: []
      required: true
    - id: 11
      name: officer_badge
      label: Officer Badge Number
      hint: Badge or ID number
      type: text
      options: []
      required: true
    - id: 12
      name: closure_reason
      label: Reason for Case Closure
      hint: Why case is closing
      type: select_one
      options:
      - Case solved - arrest made
      - Case solved - citation issued
      - Case solved - other resolution
      - Insufficient evidence
      - Unable to identify suspect
      - Victim uncooperative
      - Case referred to other agency
      - False report
      - Unfounded
      - Other
      required: true
    - id: 13
      name: closure_details
      label: Detailed Closure Explanation
      hint: Comprehensive explanation
      type: text
      options: []
      required: true
    - id: 14
      name: suspect_info
      label: Suspect Information
      hint: If applicable
      type: note
      options: []
      required: false
    - id: 15
      name: suspect_identified
      label: Was a Suspect Identified
      hint: Identification status
      type: select_one
      options:
      - Yes - one suspect
      - Yes - multiple suspects
      - No - unknown
      - Not applicable
      required: true
    - id: 16
      name: suspect_names
      label: Suspect Names
      hint: If identified
      type: text
      options: []
      required: false
    - id: 17
      name: arrest_made
      label: Was an Arrest Made
      hint: Arrest status
      type: select_one
      options:
      - Yes - arrested
      - Yes - summoned
      - Yes - cited
      - 'False'
      - Not applicable
      required: true
    - id: 18
      name: charges_filed
      label: Charges Filed
      hint: If applicable
      type: select_multiple
      options:
      - None
      - Misdemeanor
      - Felony
      - Traffic violation
      - Municipal ordinance
      - Other
      required: false
    - id: 19
      name: evidence_status
      label: Evidence Status
      hint: Evidence handling
      type: note
      options: []
      required: false
    - id: 20
      name: evidence_collected
      label: Was Evidence Collected
      hint: Evidence collection
      type: select_one
      options:
      - Yes - physical evidence
      - Yes - digital evidence
      - Yes - both types
      - No evidence collected
      - Not applicable
      required: true
    - id: 21
      name: evidence_disposition
      label: Evidence Disposition
      hint: What happened to evidence
      type: select_one
      options:
      - Stored in evidence room
      - Returned to owner
      - Destroyed per policy
      - Transferred to court
      - Other
      required: true
    - id: 22
      name: victim_info
      label: Victim Information
      hint: Victim status
      type: note
      options: []
      required: false
    - id: 23
      name: victim_notified
      label: Was Victim Notified of Closure
      hint: Victim communication
      type: select_one
      options:
      - Yes - in person
      - Yes - by phone
      - Yes - in writing
      - No victim identified
      - Unable to contact
      required: true
    - id: 24
      name: victim_satisfaction
      label: Victim Satisfaction with Resolution
      hint: If contact made
      type: select_one
      options:
      - Satisfied
      - Neutral
      - Dissatisfied
      - Not applicable
      - Unknown
      required: false
    - id: 25
      name: case_outcome
      label: Case Outcome
      hint: Final result
      type: select_one
      options:
      - Cleared by arrest
      - Cleared exceptionally
      - Unfounded
      - False report
      - Suspended
      - Referred for prosecution
      - Other
      required: true
    - id: 26
      name: court_referral
      label: Is Case Referred to Court
      hint: Court status
      type: select_one
      options:
      - Yes - filed
      - Yes - pending filing
      - 'False'
      - Not applicable
      required: true
    - id: 27
      name: court_date
      label: Court Date
      hint: If scheduled
      type: date
      options: []
      required: false
    - id: 28
      name: related_cases
      label: Are There Related Cases
      hint: Case connections
      type: select_one
      options:
      - Yes - see below
      - 'False'
      required: true
    - id: 29
      name: related_case_numbers
      label: Related Case Numbers
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 30
      name: supervisor_review
      label: Supervisor Review
      hint: Management approval
      type: note
      options: []
      required: false
    - id: 31
      name: supervisor_name
      label: Reviewing Supervisor Name
      hint: Supervisor name
      type: text
      options: []
      required: true
    - id: 32
      name: supervisor_badge
      label: Supervisor Badge Number
      hint: Badge number
      type: text
      options: []
      required: true
    - id: 33
      name: review_status
      label: Review Status
      hint: Approval status
      type: select_one
      options:
      - Approved - case closed
      - Approved with comments
      - Pending additional information
      - Rejected - reopen case
      required: true
    - id: 34
      name: supervisor_comments
      label: Supervisor Comments
      hint: Review notes
      type: text
      options: []
      required: false
    - id: 35
      name: officer_signature_date
      label: Officer Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
