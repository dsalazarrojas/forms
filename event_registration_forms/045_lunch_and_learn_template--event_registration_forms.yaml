inputSchema:
  type: object
  properties:
    title: Lunch And Learn Template
    pages:
    - id: 1
      name: user_email
      label: user_email
      hint: null
      type: email
      options: []
      required: false
    - id: 2
      name: user_name
      label: user_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time
      label: time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: event_type
      label: event_type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: event_type_options
      label: event_type_options
      hint: Select one event type
      type: select_one
      options:
      - option 1
      - option 2
      - option 3
      required: true
    - id: 7
      name: event_description
      label: event_description
      hint: Describe the event
      type: note
      options: []
      required: false
    - id: 8
      name: event_location
      label: event_location
      hint: null
      type: text
      options: []
      required: false
