      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: participant_details_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: participant_details_note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: workshop_preferences
      label: Workshop Preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: workshop_preferences_diet
      label: Dietary Requirements
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: workshop_preferences_other_dietary
      label: Other Dietary Preferences
      hint: null
      type: text
      options: []
