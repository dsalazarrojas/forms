inputSchema:
  type: object
  properties:
    title: Workshop Participant Registration Form
    pages:
    - id: 1
      name: workshop_participant_registration_form
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: workshop_participant_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: workshop_participant_email
      label: Email
      hint: example@example.com
      type: email
      options: []
      required: true
    - id: 4
      name: workshop_participant_phone
      label: Phone Number
      hint: format - XXX-XXXX
      type: text
      options: []
      required: true
    - id: 5
      name: workshop_event_preference
      label: Event Preference
      hint: null
      type: select_one
      options:
      - Event 1
      - Event 2
      - Event 3
      required: true
    - id: 6
      name: workshop_participant_info
      label: Participant Information
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: workshop_event_details
      label: Event Details
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: workshop_participant_details
      label: Participant Details
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: workshop_additional_info
      label: Additional Info
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: workshop_confirm
      label: Confirm
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: workshop_submit
      label: Submit
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: workshop_error_message
      label: Error Message
      hint: null
      type: text
      options: []
      required: false
