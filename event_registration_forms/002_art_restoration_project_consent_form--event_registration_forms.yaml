inputSchema:
  type: object
  properties:
    title: Art Restoration Project Consent Form
    pages:
    - id: 1
      name: owner_full_name
      label: Artwork Owner Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_email
      label: Contact Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: artwork_title
      label: Title of the Artwork
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: artist_name
      label: Original Artist Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: medium_materials
      label: Medium and Materials
      hint: e.g. Oil on Canvas, Marble, etc.
      type: text
      options: []
      required: true
    - id: 6
      name: current_condition
      label: Description of Current Condition
      hint: Please list any visible damage or aging
      type: text
      options: []
      required: true
    - id: 7
      name: restoration_goals
      label: Desired Restoration Outcomes
      hint: What are you hoping to achieve
      type: text
      options: []
      required: false
    - id: 8
      name: consent_procedures
      label: Consent to Restoration Procedures
      hint: Check all that apply
      type: select_multiple
      options:
      - Surface Cleaning
      - Varnish Removal
      - In-painting
      - Structural Stabilization
      - Framing Adjustment
      required: true
    - id: 9
      name: risk_acknowledgment
      label: I acknowledge the inherent risks in art restoration
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: signature_date
      label: Date of Consent
      hint: null
      type: date
      options: []
      required: true
