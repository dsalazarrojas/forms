inputSchema:
  type: object
  properties:
    title: Animal Shelter Marketing Workshop Registration Form
    pages:
    - id: 1
      name: participant_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: participant_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: participant_email
      label: Email Address
      hint: For workshop communications
      type: email
      options: []
      required: true
    - id: 4
      name: participant_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: organization_name
      label: Organization Name
      hint: Name of your shelter or rescue
      type: text
      options: []
      required: true
    - id: 6
      name: organization_type
      label: Organization Type
      hint: What kind of animal organization
      type: select_one
      options:
      - Animal Shelter
      - Animal Rescue
      - Wildlife Rescue
      - Sanctuary
      - Humane Society
      - Other
      required: true
    - id: 7
      name: job_title
      label: Your Job Title
      hint: Your position at organization
      type: text
      options: []
      required: true
    - id: 8
      name: years_in_role
      label: Years in Current Role
      hint: How long in this position
      type: number
      options: []
      required: false
    - id: 9
      name: section_workshop_selection
      label: -- Workshop Selection --
      hint: Choose which workshops you want
      type: note
      options: []
      required: false
    - id: 10
      name: workshop_date
      label: Workshop Date
      hint: Date you will attend
      type: date
      options: []
      required: true
    - id: 11
      name: workshops_interested
      label: Workshops You Want to Attend
      hint: Select all that apply
      type: select_multiple
      options:
      - Social Media Strategies
      - Digital Marketing
      - Fundraising Campaigns
      - Community Outreach
      - Branding for Shelters
      - Email Marketing
      - Event Planning
      - All Workshops
      required: true
    - id: 12
      name: skill_level
      label: Current Marketing Skill Level
      hint: Your experience with marketing
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: true
    - id: 13
      name: primary_interest
      label: Primary Interest Area
      hint: Main focus for the workshop
      type: select_one
      options:
      - Animal Adoption Promotion
      - Fundraising
      - Volunteer Recruitment
      - Community Education
      - Media Relations
      - Other
      required: true
    - id: 14
      name: section_logistics
      label: -- Workshop Logistics --
      hint: Attendance details
      type: note
      options: []
      required: false
    - id: 15
      name: attendance_format
      label: Attendance Format
      hint: How you will participate
      type: select_one
      options:
      - In-person
      - Virtual
      - Hybrid
      required: true
    - id: 16
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Any dietary needs for meals
      type: text
      options: []
      required: false
    - id: 17
      name: accessibility_needs
      label: Accessibility Needs
      hint: Any accommodations needed
      type: text
      options: []
      required: false
    - id: 18
      name: roommate_request
      label: Roommate Request (if applicable)
      hint: Preference for housing
      type: text
      options: []
      required: false
    - id: 19
      name: section_payment
      label: -- Payment Information --
      hint: Workshop registration fees
      type: note
      options: []
      required: false
    - id: 20
      name: registration_fee
      label: Registration Fee Amount
      hint: Total fee for selected workshops
      type: number
      options: []
      required: true
    - id: 21
      name: payment_method
      label: Payment Method
      hint: How you will pay
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Check
      - Wire Transfer
      - PayPal
      - Organization Invoice
      required: true
    - id: 22
      name: sponsorship_interested
      label: Interested in Sponsorship Opportunities
      hint: Want to sponsor the workshop
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 23
      name: section_expectations
      label: -- Learning Expectations --
      hint: What you hope to gain
      type: note
      options: []
      required: false
    - id: 24
      name: key_learning_goals
      label: Key Learning Goals
      hint: What do you hope to learn
      type: text
      options: []
      required: true
    - id: 25
      name: current_challenges
      label: Current Marketing Challenges
      hint: What problems are you facing
      type: text
      options: []
      required: false
    - id: 26
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
