inputSchema:
  type: object
  properties:
    title: Event Space Rental Payment Form
    pages:
    - id: 1
      name: event_details
      label: Event details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: event_space
      label: Event space
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 3
      name: payment_method
      label: Payment method
      hint: null
      type: select_multiple
      options:
      - credit card
      - bank transfer
      required: true
    - id: 4
      name: payment_amount
      label: Payment amount
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: event_start_date
      label: Event start date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: event_end_date
      label: Event end date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: event_start_time
      label: Event start time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: event_end_time
      label: Event end time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: payment_status
      label: Payment status
      hint: null
      type: select_multiple
      options:
      - paid
      - pending
      required: true
