inputSchema:
  type: object
  properties:
    title: Finger Food Event Registration
    pages:
    - id: 1
      name: event_title
      label: Event Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: rsvp
      label: RSVP
      hint: null
      type: select_one
      options:
      - Yes, I will attend
      - 'No'
      required: false
    - id: 5
      name: attendee_name
      label: Attendee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: dietary_preferences
      label: Dietary Preferences
      hint: null
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Gluten-Free
      required: false
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: number_of_guests
      label: Number of Guests
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: special_requests
      label: Special Requests
      hint: null
      type: text
      options: []
      required: false
