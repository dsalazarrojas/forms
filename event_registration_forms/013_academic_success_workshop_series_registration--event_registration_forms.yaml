inputSchema:
  type: object
  properties:
    title: Academic Success Workshop Series Registration
    pages:
    - id: 1
      name: section_registrant_info
      label: -- Registrant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Full Name
      hint: First and Last Name
      type: text
      options: []
      required: true
    - id: 3
      name: student_email
      label: University Email Address
      hint: Official .edu email preferred
      type: email
      options: []
      required: true
    - id: 4
      name: student_id
      label: Student ID Number
      hint: Your unique campus ID
      type: text
      options: []
      required: true
    - id: 5
      name: academic_year
      label: Current Year of Study
      hint: Select your current level
      type: select_one
      options:
      - First Year
      - Second Year
      - Third Year
      - Fourth Year
      - Graduate
      required: true
    - id: 6
      name: section_workshops
      label: -- Workshop Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: workshops_selected
      label: Select the workshops you wish to attend
      hint: You may choose multiple sessions
      type: select_multiple
      options:
      - Time Management
      - Critical Thinking
      - Research Strategies
      - Exam Preparation
      - Academic Writing
      - Stress Management
      required: true
    - id: 8
      name: preferred_format
      label: Preferred workshop format
      hint: Choose your preferred mode of learning
      type: select_one
      options:
      - In-person
      - Online or Zoom
      - Hybrid
      required: true
    - id: 9
      name: section_goals
      label: -- Interests and Goals --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: specific_goals
      label: What do you hope to achieve by attending these workshops?
      hint: Your personal learning objectives
      type: text
      options: []
      required: false
    - id: 11
      name: current_gpa_range
      label: Optional - Current GPA Range
      hint: Used for program evaluation purposes
      type: select_one
      options:
      - 3.5-4.0
      - 3.0-3.4
      - 2.5-2.9
      - Below 2.5
      required: false
    - id: 12
      name: section_accommodations
      label: -- Accommodations and Dietary --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: special_accommodations
      label: Do you require any special accommodations?
      hint: e.g. ASL, screen readers, etc.
      type: text
      options: []
      required: false
    - id: 14
      name: dietary_restrictions
      label: For in-person sessions, do you have dietary restrictions?
      hint: For sessions including snacks or meals
      type: select_one
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Halal
      - Other
      required: false
    - id: 15
      name: section_confirmation
      label: -- Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: attendance_commitment
      label: I confirm my registration and intend to attend all selected sessions
      hint: Reliability commitment
      type: select_one
      options:
      - Yes - Confirmed
      - Other
      required: true
