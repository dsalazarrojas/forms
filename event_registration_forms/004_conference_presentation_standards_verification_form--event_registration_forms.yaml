inputSchema:
  type: object
  properties:
    title: Conference Presentation Standards Verification Form
    pages:
      - id: 1
        name: header
        label: -- Presentation Standards Verification --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: presenter_name
        label: Presenter full name
        hint: Name as listed in program materials
        type: text
        options: []
        required: true
      - id: 3
        name: presentation_title
        label: Presentation title
        hint: Exact title to appear in the schedule
        type: text
        options: []
        required: true
      - id: 4
        name: slide_format
        label: Slide format follows guidelines
        hint: Slides should be 16 by 9 aspect ratio and non animated when possible
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 5
        name: speaker_bio_length
        label: Speaker bio within word limit
        hint: Bio should not exceed 150 words
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 6
        name: content_appropriateness
        label: Content appropriate for audience
        hint: No explicit or discriminatory material
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 7
        name: av_requirements
        label: AV requirements
        hint: List projector, microphone, laptop adapter needs
        type: text
        options: []
        required: false
      - id: 8
        name: slide_submission_date
        label: Slide submission due date
        hint: Submit slides by this date to meet deadlines
        type: date
        options: []
        required: false
      - id: 9
        name: compliance_signature
        label: Confirmation of compliance
        hint: Type your full name to confirm compliance
        type: text
        options: []
        required: true
