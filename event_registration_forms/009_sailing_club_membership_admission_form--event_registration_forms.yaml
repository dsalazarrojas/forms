inputSchema:
  type: object
  properties:
    title: Sailing Club Membership Admission Form
    pages:
    - id: 1
      name: new_member_info
      label: New Member Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: sailing_experience
      label: Sailing Experience
      hint: null
      type: select_multiple
      options:
      - Sailing Club Member
      - Racing Team Member
      - Sailing Instructor
      required: false
    - id: 4
      name: sailing_frequency
      label: Sailing Frequency
      hint: null
      type: select_multiple
      options:
      - 1-5 times a year
      - 6-11 times a year
      - 12 or more times a year
      required: false
    - id: 5
      name: membership_type
      label: Membership Type
      hint: null
      type: select_one
      options:
      - Individual Member
      - Family Member
      required: false
    - id: 6
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: emergency_contact_relationship
      label: Relationship
      hint: null
      type: select_multiple
      options:
      - Partner
      - Spouse
      - Friend
      required: false
    - id: 8
      name: emergency_contact_info
      label: Emergency Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: additional_info
      label: Additional Info
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: sailing_club_memberships
      label: Sailing Club Memberships
      hint: null
      type: select_multiple
      options:
      - Sailing Club of New York
      - Sailing Club of Chicago
      - Sailing Club of San Francisco
      required: false
    - id: 12
      name: sailing_equipment
      label: Sailing Equipment
      hint: null
      type: select_multiple
      options:
      - Sailboat
      - Kayak
      - Paddleboard
      required: false
    - id: 13
      name: sailing_boat
      label: Sailing Boat
      hint: null
      type: select_multiple
      options:
      - 1-20 ft
      - 21-30 ft
      - 31-40 ft
      required: false
    - id: 14
      name: sailing_boat_type
      label: Sailing Boat Type
      hint: null
      type: select_multiple
      options:
      - Monohull
      - Jib
      - Ketch
      required: false
    - id: 15
      name: sailing_boat_size
      label: Sailing Boat Size
      hint: null
      type: select_multiple
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 16
      name: sailing_boat_color
      label: Sailing Boat Color
      hint: null
      type: select_multiple
      options:
      - Red
      - Blue
      - Green
      required: false
    - id: 17
      name: sailing_license
      label: Sailing License
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 18
      name: sailing_license_number
      label: Sailing License Number
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: sailing_license_type
      label: Sailing License Type
      hint: null
      type: select_multiple
      options:
      - Power
      - Sail
      required: false
    - id: 20
      name: sailing_club_address
      label: Sailing Club Address
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: sailing_club_phone
      label: Sailing Club Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: sailing_club_email
