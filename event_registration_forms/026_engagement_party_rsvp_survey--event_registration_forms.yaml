inputSchema:
  type: object
  properties:
    title: Engagement Party RSVP Survey
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: will_attend
      label: Will Attend
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: rsvp_date
      label: RSVP Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: will_arrive
      label: Will Arrive
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: arrival_time
      label: Arrival Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: will_dine
      label: Will Dine
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Vegetarian
      - Vegan
      - Gluten-free
      - Other (Please specify)
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
