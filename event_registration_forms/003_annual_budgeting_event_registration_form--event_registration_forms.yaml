inputSchema:
  type: object
  properties:
    title: Annual Budgeting Event Registration Form
    pages:
    - id: 1
      name: section_registration
      label: -- Registration Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: registrant_name
      label: Registrant full name
      hint: Name of the person completing this form
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization or department
      hint: Provide department or company name
      type: text
      options: []
      required: false
    - id: 4
      name: role
      label: Role or job title
      hint: Your role related to budgeting responsibilities
      type: text
      options: []
      required: false
    - id: 5
      name: contact_email
      label: Contact email
      hint: Used for event communications
      type: email
      options: []
      required: true
    - id: 6
      name: sessions_selected
      label: Sessions to attend
      hint: Select all sessions you plan to attend
      type: select_multiple
      options:
      - Kickoff and overview
      - Departmental breakouts
      - Budget modeling workshop
      - Funding strategy session
      - Q and A panel
      required: true
    - id: 7
      name: attendance_type
      label: Attendance type
      hint: In person or virtual participation
      type: select_one
      options:
      - In person
      - Virtual
      - Hybrid
      required: true
    - id: 8
      name: dietary_restrictions
      label: Dietary restrictions
      hint: List any food allergies or preferences
      type: text
      options: []
      required: false
    - id: 9
      name: require_invoice
      label: Require invoice for payment
      hint: Indicates if an official invoice is needed
      type: select_one
      options:
      - false
      - true
      required: false
    - id: 10
      name: emergency_contact
      label: Emergency contact phone number
      hint: Provide a contact in case of emergency
      type: text
      options: []
      required: false
