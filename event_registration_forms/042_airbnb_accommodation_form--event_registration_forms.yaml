inputSchema:
  type: object
  properties:
    title: Airbnb Accommodation Form
    pages:
    - id: 1
      name: guest_name
      label: Guest name
      hint: Main guest for the reservation
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email address
      hint: For reservation confirmation
      type: email
      options: []
      required: true
    - id: 3
      name: check_in_date
      label: Check in date
      hint: Arrival date
      type: date
      options: []
      required: true
    - id: 4
      name: check_out_date
      label: Check out date
      hint: Departure date
      type: date
      options: []
      required: true
    - id: 5
      name: number_of_guests
      label: Number of guests
      hint: Total guests staying
      type: number
      options: []
      required: true
    - id: 6
      name: special_requests
      label: Special requests
      hint: E.g., late check in or extra bedding
      type: text
      options: []
      required: false
    - id: 7
      name: payment_method
      label: Payment method
      hint: Preferred method for payment
      type: select_one
      options:
      - Credit card
      - Bank transfer
      - Cash
      - Other
      required: true
    - id: 8
      name: emergency_contact
      label: Emergency contact name and phone
      hint: For urgent communications
      type: text
      options: []
      required: false
    - id: 9
      name: house_rules_acknowledgement
      label: House rules acknowledgement
      hint: Agree to property rules and conduct
      type: note
      options: []
      required: true
