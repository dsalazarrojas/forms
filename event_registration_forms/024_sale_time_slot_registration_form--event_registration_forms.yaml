inputSchema:
  type: object
  properties:
    title: Sale Time Slot Registration Form
    pages:
    - id: 1
      name: sale_details
      label: Sale Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: customer_details
      label: Customer Details
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: time_slot_available
      label: Time Slot Available
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: sale_time_slot
      label: Sale Time Slot
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: sale_time_slot_options
      label: Sale Time Slot Options
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
