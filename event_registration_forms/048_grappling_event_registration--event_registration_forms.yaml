inputSchema:
  type: object
  properties:
    title: grappling_event_registration
    pages:
    - id: 1
      name: participant_info
      label: Participant Info
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: divisions
      label: Divisions
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: experience_level
      label: Experience Level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
    - id: 4
      name: waiver
      label: Waiver
      hint: null
      type: select_one
      options:
      - I accept
      - Decline
      required: false
    - id: 5
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: true
