inputSchema:
  type: object
  properties:
    title: outdoor_recreation_expo_registration_form
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: preferred_days
      label: Preferred Days
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 3
      name: interests
      label: Interests
      hint: null
      type: select_one
      options:
      - camping
      - hiking
      - cycling
      - kayaking
      - swimming
      - skiing
      - fishing
      - boating
      - other
      required: true
    - id: 4
      name: requirements
      label: Requirements
      hint: null
      type: select_multiple
      options:
      - water
      - food
      - shelter
      - first aid
      - other
      required: true
    - id: 5
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
