inputSchema:
  type: object
  properties:
    title: Community Outreach Event Reservation Form
    pages:
    - id: 1
      name: event_details
      label: Event Details
      hint: Provide information about your event
      type: note
      options: []
      required: false
    - id: 2
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Workshop
      - Conference
      - Community Meeting
      - Fundraiser
      - Training Session
      - Social Gathering
      - Other
      required: true
    - id: 4
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: event_start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: event_end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: expected_attendees
      label: Expected Number of Attendees
      hint: Estimated count
      type: number
      options: []
      required: true
    - id: 8
      name: organizer_information
      label: Organizer Information
      hint: Contact details for the event organizer
      type: note
      options: []
      required: false
    - id: 9
      name: organizer_name
      label: Organizer Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 10
      name: organization_name
      label: Organization Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 11
      name: organizer_email
      label: Organizer Email
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: organizer_phone
      label: Organizer Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: venue_requirements
      label: Venue Requirements
      hint: Specify your needs
      type: note
      options: []
      required: false
    - id: 14
      name: room_setup
      label: Preferred Room Setup
      hint: null
      type: select_one
      options:
      - Theater Style
      - Classroom Style
      - U-Shape
      - Round Tables
      - Open Floor
      - No Preference
      required: true
    - id: 15
      name: equipment_needed
      label: Equipment Needed
      hint: Select all that apply
      type: select_multiple
      options:
      - Projector
      - Microphone
      - Speakers
      - Whiteboard
      - Flip Charts
      - Tables
      - Chairs
      - WiFi Access
      required: false
    - id: 16
      name: catering_needed
      label: Is Catering Required
      hint: null
      type: select_one
      options:
      - true
      - false
      - Maybe
      required: true
    - id: 17
      name: accessibility_needs
      label: Accessibility Requirements
      hint: Describe any special needs
      type: text
      options: []
      required: false
    - id: 18
      name: additional_requests
      label: Additional Requests or Comments
      hint: Any other information we should know
      type: text
      options: []
      required: false
