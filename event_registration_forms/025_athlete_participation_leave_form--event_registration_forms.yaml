inputSchema:
  type: object
  properties:
    title: Athlete Participation Leave Form
    pages:
    - id: 1
      name: leave_details_header
      label: -- Athlete Leave Request Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: athlete_name
      label: Athlete Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: athlete_team
      label: Team or Squad Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: leave_category
      label: Category of Leave
      hint: Select the primary reason for absence
      type: select_one
      options:
      - Major Competition / Tournament
      - National Team Selection / Duty
      - Specialized External Training
      - Injury Recovery or Medical Leave
      - Personal or Family Commitment
      required: true
    - id: 5
      name: absence_period_header
      label: -- Absence Period --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: start_date
      label: Leave Start Date
      hint: First day of absence
      type: date
      options: []
      required: true
    - id: 7
      name: end_date
      label: Leave End Date
      hint: Last day of absence
      type: date
      options: []
      required: true
    - id: 8
      name: training_sessions_missed
      label: Total Number of Training Sessions Missed
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: games_missed
      label: Total Number of Games or Competitions Missed
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: reason_header
      label: -- Event and Supporting Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: event_description
      label: Event Name and Description
      hint: What event are you attending?
      type: text
      options: []
      required: true
    - id: 12
      name: event_location
      label: Location of Event
      hint: City and Country
      type: text
      options: []
      required: true
    - id: 13
      name: school_absence
      label: Is this a school-related absence?
      hint: Will you be missing classes?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 14
      name: school_notification
      label: Have school authorities been notified?
      hint: Principal, Teacher, or Registrar
      type: select_one
      options:
      - true
      - false
      - Not Applicable
      required: true
    - id: 15
      name: additional_comments
      label: Additional Comments or Details
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: approval_header
      label: -- Notification and Approval --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: coach_notification
      label: Has your primary coach been notified?
      hint: null
      type: select_one
      options:
      - Yes, via Email
      - Yes, via Phone
      - No, not yet
      required: true
    - id: 18
      name: admin_approval_note
      label: -- For Administrative Use --
      hint: Head of Program Approval and System Update
      type: note
      options: []
      required: false
    - id: 19
      name: athlete_signature
      label: Athlete or Guardian Electronic Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 20
      name: request_date
      label: Date of Request
      hint: null
      type: date
      options: []
      required: true
