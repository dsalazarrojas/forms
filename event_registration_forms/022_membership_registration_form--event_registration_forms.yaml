inputSchema:
  type: object
  properties:
    title: Membership Registration Form
    pages:
    - id: 1
      name: first_name
      label: first_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: last_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: password
      label: password
      hint: Password must be at least 8 characters long
      type: text
      options: []
      required: false
    - id: 5
      name: confirm
      label: confirm
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: membership_type
      label: membership_type
      hint: null
      type: select_one
      options:
      - Basic
      - Premium
      - Free
      required: false
    - id: 9
      name: membership_level
      label: membership_level
      hint: null
      type: select_multiple
      options:
      - Silver
      - Gold
      - Bronze
      required: false
    - id: 10
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
