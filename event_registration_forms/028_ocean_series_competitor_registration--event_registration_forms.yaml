inputSchema:
  type: object
  properties:
    title: Ocean Series Competitor Registration
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: team_name
      label: Team Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: waiver_acceptance
      label: Waiver Acceptance
      hint: Please indicate you have read and agree to our waiver.
      type: select_multiple
      options:
      - I have read and agree to our waiver
      - I have not read and do not agree to our waiver
      required: true
    - id: 8
      name: participant_address
      label: Participant Address
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: participant_city
      label: Participant City
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: participant_state
      label: Participant State
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: participant_zip
      label: Participant Zip
      hint: null
      type: text
      options: []
      required: true
