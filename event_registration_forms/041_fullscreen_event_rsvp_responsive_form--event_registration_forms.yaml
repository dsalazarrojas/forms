inputSchema:
  type: object
  properties:
    title: Fullscreen Event RSVP Responsive Form
    pages:
    - id: 1
      name: rsvp_information
      label: RSVP Information
      hint: Provide your name and contact information.
      type: text
      options: []
      required: true
    - id: 2
      name: event_details
      label: Event Details
      hint: Please describe the event in details.
      type: text
      options: []
      required: true
    - id: 3
      name: event_rsvp
      label: Event RSVP
      hint: Choose the number of people attending
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - 5 or more
      required: true
    - id: 4
      name: additional_info
      label: Additional Information
      hint: Provide any additional information about the event.
      type: text
      options: []
      required: false
    - id: 5
      name: summary
      label: Summary
      hint: Summarize the event in a few words.
      type: text
      options: []
      required: true
    - id: 6
      name: event_registration
      label: Event Registration
      hint: Confirm event registration.
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 7
      name: submit_rsvp
      label: Submit RSVP
      hint: Confirm your RSVP.
      type: radio
      options:
      - Option A
      - Option B
      required: true
    - id: 8
      name: confirm_rsvp
      label: Confirm RSVP
      hint: Confirm your attendance.
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: event_date
      label: Event Date
      hint: Event date and time.
      type: date
      options: []
      required: true
    - id: 10
      name: event_time
      label: Event Time
      hint: Event start and end time.
      type: time
      options: []
      required: true
