inputSchema:
  type: object
  properties:
    title: industry-networking-event-attendance-form
    pages:
    - id: 1
      name: event_information
      label: Event Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: Enter participant name
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: Optional phone number
      type: text
      options: []
      required: false
    - id: 5
      name: participant_relationship
      label: Relationship with Industry
      hint: null
      type: select_one
      options:
      - Attendee
      - Speaker
      - Exhibitor
      - Vendor
      - Media
      - Organizer
      required: false
    - id: 6
      name: event_questions
      label: Do you have any questions about the event?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: special_requests
      label: Do you have any special requests?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: confirm_participation
      label: Confirm Participation
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: notes
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: confirm_email
      label: Confirm Email
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
