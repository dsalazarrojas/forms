inputSchema:
  type: object
  properties:
    title: Class Attendance Form
    pages:
    - id: 1
      name: class_info_header
      label: -- Class Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: class_name
      label: Class Name or Section
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: teacher_name
      label: Teacher Name
      hint: Instructor or facilitator
      type: text
      options: []
      required: true
    - id: 4
      name: attendance_date
      label: Attendance Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: class_time
      label: Class Time
      hint: Start time of the class
      type: time
      options: []
      required: true
    - id: 6
      name: student_info_header
      label: -- Student Attendance Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: total_students
      label: Total Number of Students in Class
      hint: Expected attendance
      type: number
      options: []
      required: true
    - id: 8
      name: students_present
      label: Number of Students Present
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: students_absent
      label: Number of Students Absent
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: students_late
      label: Number of Students Late
      hint: Arrived after class start time
      type: number
      options: []
      required: false
    - id: 11
      name: absent_students_header
      label: -- Details of Absent Students --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: absent_student_names
      label: Names of Absent Students
      hint: Comma-separated list
      type: text
      options: []
      required: false
    - id: 13
      name: absence_reason
      label: Reason for Absences
      hint: null
      type: select_one
      options:
      - Unexcused absence
      - Excused absence
      - Illness
      - Family emergency
      - Other
      - Not provided
      required: false
    - id: 14
      name: absent_documentation
      label: Documentation provided for absence
      hint: null
      type: select_one
      options:
      - Yes, doctor note
      - Yes, parent note
      - Yes, other documentation
      - No documentation
      - Not applicable
      required: false
    - id: 15
      name: attendance_header
      label: -- Attendance Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: attendance_percentage
      label: Attendance Percentage
      hint: Will auto-calculate based on numbers
      type: number
      options: []
      required: false
    - id: 17
      name: participation_quality
      label: Class Participation Quality
      hint: Overall engagement level
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not applicable
      required: false
    - id: 18
      name: lesson_covered
      label: Lesson or Topics Covered
      hint: Brief summary
      type: text
      options: []
      required: false
    - id: 19
      name: special_notes_header
      label: -- Special Notes and Comments --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: special_notes
      label: Special Notes or Observations
      hint: Incidents, behavior, achievements, etc.
      type: text
      options: []
      required: false
    - id: 21
      name: follow_up_needed
      label: Follow-up needed
      hint: Any students needing attention
      type: select_one
      options:
      - Yes, for attendance
      - Yes, for academic concerns
      - Yes, for behavioral concerns
      - No follow-up needed
      required: false
    - id: 22
      name: follow_up_details
      label: Follow-up Details
      hint: Who needs follow-up and why
      type: text
      options: []
      required: false
