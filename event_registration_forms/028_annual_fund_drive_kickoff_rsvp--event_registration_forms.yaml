inputSchema:
  type: object
  properties:
    title: Annual Fund Drive Kickoff RSVP
    pages:
    - id: 1
      name: guest_name
      label: Full Name
      hint: Please enter your full name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: For confirmation and updates
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: false
    - id: 4
      name: organization
      label: Organization or Company
      hint: Your organization if applicable
      type: text
      options: []
      required: false
    - id: 5
      name: donor_status
      label: Donor Status
      hint: What is your relationship with us?
      type: select_one
      options:
      - Current Donor
      - Past Donor
      - Prospective Donor
      - Volunteer
      - Community Member
      - Other
      required: true
    - id: 6
      name: rsvp_status
      label: Will You Attend?
      hint: Please confirm your attendance
      type: select_one
      options:
      - Yes, I Will Attend
      - No, I Cannot Attend
      - Maybe, Will Confirm Later
      required: true
    - id: 7
      name: number_of_guests
      label: Number of Guests
      hint: Total in your party including yourself
      type: number
      options: []
      required: true
    - id: 8
      name: guest_names
      label: Guest Names
      hint: List names of all attendees
      type: text
      options: []
      required: false
    - id: 9
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Dairy-Free
      - Nut Allergies
      - Shellfish Allergies
      - Kosher
      - Halal
      - Other
      required: true
    - id: 10
      name: dietary_details
      label: Dietary Details
      hint: Please specify any allergies
      type: text
      options: []
      required: false
    - id: 11
      name: meal_selection
      label: Meal Selection
      hint: Choose your preferred entree
      type: select_one
      options:
      - Beef
      - Chicken
      - Fish
      - Vegetarian
      - Vegan
      - No Preference
      required: true
    - id: 12
      name: beverage_preference
      label: Beverage Preference
      hint: What will you be drinking?
      type: select_one
      options:
      - Full Bar
      - Wine and Beer
      - Non-Alcoholic Only
      - No Preference
      required: false
    - id: 13
      name: donation_pledge
      label: Donation Pledge
      hint: Will you be making a pledge?
      type: select_one
      options:
      - Yes, Planning to Pledge
      - Considering
      - Not at This Time
      required: false
    - id: 14
      name: pledge_range
      label: Pledge Range
      hint: Approximate pledge amount
      type: select_one
      options:
      - Under $500
      - $500-$1,000
      - $1,001-$5,000
      - $5,001-$10,000
      - $10,001-$25,000
      - Over $25,000
      - Not Sure
      required: false
    - id: 15
      name: volunteer_interest
      label: Volunteer Interest
      hint: Would you like to volunteer for the drive?
      type: select_one
      options:
      - Yes, Interested
      - Maybe
      - No, Thank You
      required: false
    - id: 16
      name: committee_interest
      label: Committee Interest
      hint: Would you join the planning committee?
      type: select_one
      options:
      - Yes, Interested
      - No, Thank You
      required: false
    - id: 17
      name: hosting_interest
      label: Hosting Interest
      hint: Would you host a house party?
      type: select_one
      options:
      - Yes, Interested
      - Maybe
      - No, Thank You
      required: false
    - id: 18
      name: accessibility_requirements
      label: Accessibility Requirements
      hint: Any special accommodations needed?
      type: text
      options: []
      required: false
    - id: 19
      name: parking_needed
      label: Parking Needed
      hint: Will you need parking?
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 20
      name: transportation_needed
      label: Transportation Assistance
      hint: Do you need transportation help?
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 21
      name: photo_consent
      label: Photo Consent
      hint: May we use photos for marketing?
      type: select_one
      options:
      - Yes, I Consent
      - No, Please Do Not
      required: true
    - id: 22
      name: how_heard
      label: How Did You Hear About This Event?
      hint: Select all that apply
      type: select_multiple
      options:
      - Direct Invitation
      - Email
      - Social Media
      - Website
      - Word of Mouth
      - Previous Event
      - Other
      required: false
    - id: 23
      name: special_requests
      label: Special Requests
      hint: Any other needs or requests?
      type: text
      options: []
      required: false
    - id: 24
      name: emergency_contact
      label: Emergency Contact Name
      hint: In case of emergency
      type: text
      options: []
      required: false
    - id: 25
      name: emergency_phone
      label: Emergency Contact Phone
      hint: Emergency contact number
      type: text
      options: []
      required: false
