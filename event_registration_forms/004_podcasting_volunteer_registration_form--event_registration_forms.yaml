inputSchema:
  type: object
  properties:
    title: Podcasting Volunteer Registration Form
    pages:
    - id: 1
      name: volunteer_type
      label: Volunteer Type
      hint: null
      type: select_multiple
      options:
      - volunteer
      - staff
      - volunteer-staff
      - other
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: role
      label: Role
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: event_id
      label: Event ID
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: event_start_time
      label: Event Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: event_end_time
      label: Event End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: false
