inputSchema:
  type: object
  properties:
    title: Conference Enrollment Form
    pages:
      - id: 1
        name: registrant_name
        label: Registrant name
        hint: Full name for enrollment
        type: text
        options: []
        required: true
      - id: 2
        name: organization
        label: Organization or affiliation
        hint: Company or institution
        type: text
        options: []
        required: false
      - id: 3
        name: email
        label: Email address
        hint: For enrollment confirmation
        type: email
        options: []
        required: true
      - id: 4
        name: registration_type
        label: Registration type
        hint: Choose pass or ticket type
        type: select_one
        options:
          - Full conference
          - One day pass
          - Student pass
          - Virtual attendance
        required: true
      - id: 5
        name: meal_option
        label: Meal option
        hint: Meal preferences for on site meals
        type: select_one
        options:
          - Regular
          - Vegetarian
          - Vegan
          - Gluten free
        required: false
      - id: 6
        name: payment_status
        label: Payment status
        hint: Paid or pending
        type: select_one
        options:
          - Paid
          - Pending
          - Invoice
        required: true
      - id: 7
        name: accessibility_needs
        label: Accessibility needs
        hint: Request any accommodations
        type: text
        options: []
        required: false
      - id: 8
        name: emergency_contact
        label: Emergency contact
        hint: Name and phone
        type: text
        options: []
        required: false
      - id: 9
        name: special_requests
        label: Special requests
        hint: Any other requirements or notes
        type: text
        options: []
        required: false
      - id: 10
        name: confirmation_note
        label: Enrollment confirmation note
        hint: Read only next steps and badge pick up
        type: note
        options: []
        required: false
