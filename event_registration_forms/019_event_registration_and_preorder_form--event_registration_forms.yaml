    - id: 4
      name: event_details_form_page_4
      label: Event Details
      hint: null
      type: select_multiple
      options:
      - Event 1
      - Event 2
      required: false
    - id: 5
      name: payment_form_page_5
      label: Payment
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: payment_method_form_page_6
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Card
      - PayPal
      required: false
