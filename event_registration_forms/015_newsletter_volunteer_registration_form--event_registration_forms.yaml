inputSchema:
  type: object
  properties:
    title: Newsletter Volunteer Registration Form
    pages:
    - id: 1
      name: form_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: form_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: form_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: form_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: form_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: form_time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: form_volunteer_type
      label: Volunteer Type
      hint: null
      type: select_one
      options:
      - Volunteer Coordinator
      - Editor
      - Designer
      - Writer
      - Proofreader
      - Translator
      - Social Media Manager
      - Other
      required: true
    - id: 8
      name: form_volunteer_shift
      label: Shift
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      - Weekend
      required: true
    - id: 9
      name: form_message
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: form_agree
      label: Agree
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: form_agree_message
      label: Agree Message
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: form_agree_terms
      label: Agree Terms
      hint: null
      type: select_multiple
      options:
      - I understand and agree to the terms and conditions of the project.
      - I do not understand and do not agree to the terms and conditions of the project.
      required: true
