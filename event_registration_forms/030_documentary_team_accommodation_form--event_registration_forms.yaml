inputSchema:
  type: object
  properties:
    title: Documentary Team Accommodation Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: accommodation_name
      label: Accommodation Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: accommodation_type
      label: Accommodation Type
      hint: null
      type: select_one
      options:
      - Hotel
      - Motel
      - Resort
      - Hostel
      - Airbnb
      required: false
    - id: 6
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: post_code
      label: Post Code
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
