inputSchema:
  type: object
  properties:
    title: Appreciation Certificate Submission Form
    pages:
    - id: 1
      name: submitter_info
      label: Submitter Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: submitter_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: submitter_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: submitter_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: organization
      label: Organization or Company
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: certificate_details
      label: Certificate Details
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: recipient_name
      label: Certificate Recipient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: award_category
      label: Award or Appreciation Category
      hint: null
      type: select_one
      options:
      - Employee of the Month
      - Service Excellence
      - Leadership
      - Innovation
      - Community Service
      - Other
      required: true
    - id: 9
      name: award_date
      label: Award Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: reason_for_award
      label: Reason for Certificate
      hint: Describe why this person is receiving the certificate
      type: text
      options: []
      required: true
    - id: 11
      name: achievement_highlights
      label: Key Achievements or Accomplishments
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: certificate_design
      label: Preferred Certificate Design Style
      hint: null
      type: select_one
      options:
      - Modern
      - Traditional
      - Colorful
      - Minimalist
      required: false
    - id: 13
      name: additional_notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
