inputSchema:
  type: object
  properties:
    title: Content Creation Masterclass Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: We will send confirmation and details here
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: Name of your organization
      type: text
      options: []
      required: false
    - id: 6
      name: job_title
      label: Job Title
      hint: Your current position
      type: text
      options: []
      required: true
    - id: 7
      name: industry
      label: Industry
      hint: What industry do you work in?
      type: select_one
      options:
      - Marketing and Advertising
      - Media and Entertainment
      - Technology
      - Education
      - Healthcare
      - Retail
      - Finance
      - Nonprofit
      - Government
      - Other
      required: true
    - id: 8
      name: experience_level
      label: Content Creation Experience Level
      hint: How would you describe your experience?
      type: select_one
      options:
      - Beginner (0-1 years)
      - Intermediate (1-3 years)
      - Advanced (3-5 years)
      - Expert (5+ years)
      required: true
    - id: 9
      name: masterclass_date
      label: Preferred Masterclass Date
      hint: Which session would you like to attend?
      type: select_one
      options:
      - March 15, 2026
      - March 22, 2026
      - April 5, 2026
      - April 19, 2026
      - May 3, 2026
      required: true
    - id: 10
      name: attendance_type
      label: Attendance Type
      hint: How will you attend?
      type: select_one
      options:
      - In Person
      - Virtual Live
      - Recorded Access Only
      required: true
    - id: 11
      name: topics_of_interest
      label: Topics of Interest
      hint: What topics are you most interested in?
      type: select_multiple
      options:
      - Content Strategy
      - Video Production
      - Social Media Content
      - Copywriting
      - Visual Design
      - SEO for Content
      - Content Analytics
      - Personal Branding
      required: true
    - id: 12
      name: learning_goals
      label: Learning Goals
      hint: What do you hope to learn from this masterclass?
      type: text
      options: []
      required: true
    - id: 13
      name: current_challenges
      label: Current Challenges
      hint: What content creation challenges do you face?
      type: text
      options: []
      required: false
    - id: 14
      name: dietary_requirements
      label: Dietary Requirements
      hint: For in-person attendees only
      type: text
      options: []
      required: false
    - id: 15
      name: how_did_you_hear
      label: How Did You Hear About Us?
      hint: How did you learn about this masterclass?
      type: select_one
      options:
      - Social Media
      - Email Newsletter
      - Website
      - Colleague Referral
      - Search Engine
      - Advertisement
      - Other
      required: true
    - id: 16
      name: payment_method
      label: Payment Method
      hint: How will you pay for this masterclass?
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - PayPal
      - Bank Transfer
      - Company Invoice
      required: true
    - id: 17
      name: registration_type
      label: Registration Type
      hint: Type of registration
      type: select_one
      options:
      - Individual - $299
      - Team (2-5 people) - $999
      - Corporate (6+ people) - $1,999
      - Student Discount - $149
      required: true
    - id: 18
      name: terms_accepted
      label: Terms and Conditions
      hint: I agree to the terms and conditions
      type: select_one
      options:
      - Yes, I Accept
      - No, I Do Not Accept
      required: true
    - id: 19
      name: marketing_consent
      label: Marketing Consent
      hint: May we send you marketing communications?
      type: select_one
      options:
      - Yes, please send me updates
      - No, thank you
      required: true
    - id: 20
      name: registration_date
      label: Registration Date
      hint: Date of registration
      type: date
      options: []
      required: true
    - id: 21
      name: additional_comments
      label: Additional Comments
      hint: Any other information you would like to share
      type: text
      options: []
      required: false
