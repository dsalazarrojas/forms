inputSchema:
  type: object
  properties:
    title: Catering Service Approval Form
    pages:
    - id: 1
      name: section_request_details
      label: -- Request Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: request_id
      label: Request ID
      hint: Unique identifier for this request
      type: text
      options: []
      required: true
    - id: 3
      name: request_date
      label: Request Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: requester_name
      label: Requester Name
      hint: Person submitting the request
      type: text
      options: []
      required: true
    - id: 5
      name: requester_email
      label: Requester Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: section_event_information
      label: -- Event Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Corporate
      - Wedding
      - Fundraiser
      - Conference
      - Celebration
      - Meeting
      - Other
      required: true
    - id: 11
      name: guest_count
      label: Guest Count
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: section_catering_details
      label: -- Catering Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: catering_vendor
      label: Catering Vendor
      hint: Name of proposed catering company
      type: text
      options: []
      required: true
    - id: 14
      name: vendor_contact
      label: Vendor Contact Information
      hint: Phone and email
      type: text
      options: []
      required: true
    - id: 15
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Buffet
      - Plated Service
      - Cocktail Reception
      - Family Style
      - Combination
      required: true
    - id: 16
      name: total_cost
      label: Total Catering Cost
      hint: null
      type: number
      options: []
      required: true
    - id: 17
      name: cost_per_person
      label: Cost Per Person
      hint: null
      type: number
      options: []
      required: false
    - id: 18
      name: section_budget_approval
      label: -- Budget Approval --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: budget_available
      label: Is budget available for this event?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Needs Review
      required: true
    - id: 20
      name: budget_code
      label: Budget Code
      hint: Cost center or account code
      type: text
      options: []
      required: false
    - id: 21
      name: section_approval_decision
      label: -- Approval Decision --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: approval_status
      label: Approval Status
      hint: null
      type: select_one
      options:
      - Approved
      - Approved with Conditions
      - Requires Revision
      - Denied
      - Pending Review
      required: true
    - id: 23
      name: approval_comments
      label: Approval Comments
      hint: Reasons for decision, conditions, revisions needed
      type: text
      options: []
      required: false
    - id: 24
      name: approver_name
      label: Approver Name
      hint: Person approving or reviewing the request
      type: text
      options: []
      required: true
    - id: 25
      name: approval_date
      label: Approval Date
      hint: null
      type: date
      options: []
      required: true
