inputSchema:
  type: object
  properties:
    title: Paymentwall Hotel Reservation Form
    pages:
    - id: 1
      name: booking_dates
      label: Booking Dates
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: reservation_type
      label: Reservation Type
      hint: Choose your reservation type
      type: select_one
      options:
      - Hotel
      - Package
      required: true
    - id: 3
      name: room_type
      label: Room Type
      hint: null
      type: select_multiple
      options:
