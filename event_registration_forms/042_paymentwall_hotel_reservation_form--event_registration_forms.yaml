      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: guest_email
      label: Guest Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: special_request
      label: Special Request
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Visa
      - Mastercard
      - American Express
      required: true
