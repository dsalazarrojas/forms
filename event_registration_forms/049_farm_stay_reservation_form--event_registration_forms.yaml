inputSchema:
  type: object
  properties:
    title: Farm Stay Reservation Form
    pages:
    - id: 1
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: stay_type
      label: Stay Type
      hint: null
      type: select_one
      options:
      - Farm Stay
      - Glamping
      required: false
    - id: 3
      name: checkin
      label: Checkin
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: checkout
      label: Checkout
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: guest_count
      label: Guest Count
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: guest_names
      label: Guest Names
      hint: Enter guest names
      type: text
      options: []
      required: false
    - id: 7
      name: phone_number
      label: Phone Number
      hint: Enter phone number
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: Enter email
      type: email
      options: []
      required: false
    - id: 9
      name: stay_duration
      label: Stay Duration
      hint: null
      type: select_multiple
      options:
      - 1 day
      - 2 days
      - 3 days
      - 4 days
      - 5 days
      - 6 days
      required: false
    - id: 10
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: payment_type
      label: Payment Type
      hint: null
      type: select_one
      options:
      - Cash
      - Online
      required: false
    - id: 12
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - PayPal
      - Stripe
      required: false
    - id: 13
      name: payment_amount
      label: Payment Amount
      hint: Enter payment amount
      type: number
      options: []
      required: false
    - id: 14
      name: farm_name
      label: Farm Name
      hint: null
      type: text
      options: []
      required: false
