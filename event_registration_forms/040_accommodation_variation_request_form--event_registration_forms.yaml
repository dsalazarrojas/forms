inputSchema:
  type: object
  properties:
    title: Accommodation Variation Request Form
    pages:
    - id: 1
      name: guest_full_name
      label: Guest Full Name
      hint: Your full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: booking_reference_number
      label: Booking Reference Number
      hint: Your booking reference number
      type: text
      options: []
      required: true
    - id: 3
      name: guest_email
      label: Guest Email
      hint: Your email address for confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: guest_phone
      label: Guest Phone
      hint: Your phone number for contact
      type: text
      options: []
      required: true
    - id: 5
      name: original_check_in_date
      label: Original Check In Date
      hint: Original check-in date for the booking
      type: date
      options: []
      required: true
    - id: 6
      name: original_check_out_date
      label: Original Check Out Date
      hint: Original check-out date for the booking
      type: date
      options: []
      required: true
    - id: 7
      name: original_room_type
      label: Original Room Type
      hint: Original room type booked
      type: select_one
      options:
      - Single Room
      - Double Room
      - Twin Room
      - Suite
      - Family Room
      - Other
      required: true
    - id: 8
      name: variation_request_type
      label: Variation Request Type
      hint: What type of variation are you requesting?
      type: select_one
      options:
      - Date Change
      - Room Type Change
      - Extension
      - Early Arrival
      - Cancellation
      - Special Requirements
      - Other
      required: true
    - id: 9
      name: requested_new_check_in_date
      label: Requested New Check In Date
      hint: New check-in date (if applicable)
      type: date
      options: []
      required: false
    - id: 10
      name: requested_new_check_out_date
      label: Requested New Check Out Date
      hint: New check-out date (if applicable)
      type: date
      options: []
      required: false
    - id: 11
      name: requested_room_type
      label: Requested Room Type
      hint: New room type (if applicable)
      type: select_one
      options:
      - Single Room
      - Double Room
      - Twin Room
      - Suite
      - Family Room
      - Other
      required: false
    - id: 12
      name: number_of_additional_nights
      label: Number of Additional Nights
      hint: Number of additional nights requested (if extension)
      type: number
      options: []
      required: false
    - id: 13
      name: reason_for_variation
      label: Reason for Variation
      hint: Why are you requesting this variation?
      type: text
      options: []
      required: true
    - id: 14
      name: special_requirements
      label: Special Requirements
      hint: Any special requirements for the variation
      type: text
      options: []
      required: false
    - id: 15
      name: accessibility_needs
      label: Accessibility Needs
      hint: Any accessibility needs related to the variation
      type: select_multiple
      options:
      - Wheelchair accessible
      - Visual aids
      - Hearing accessible
      - Mobility aids
      - None
      - Other
      required: false
    - id: 16
      name: smoking_preference
      label: Smoking Preference
      hint: Smoking preference for the new accommodation
      type: select_one
      options:
      - Non-smoking
      - Smoking
      - No preference
      required: false
    - id: 17
      name: meal_plan_change
      label: Meal Plan Change
      hint: Do you want to change your meal plan?
      type: select_one
      options:
      - No change
      - Add breakfast
      - Remove breakfast
      - Change to half board
      - Change to full board
      required: false
    - id: 18
      name: expected_response_date
      label: Expected Response Date
      hint: By what date do you need a response?
      type: date
      options: []
      required: true
    - id: 19
      name: additional_comments
      label: Additional Comments
      hint: Any additional comments about your request
      type: text
      options: []
      required: false
    - id: 20
      name: guest_declaration
      label: Guest Declaration
      hint: I declare that the information provided is accurate and I understand that
        variations are subject to availability and may incur additional charges
      type: select_one
      options:
      - Yes, I agree
      - 'No'
      required: true
