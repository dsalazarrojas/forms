inputSchema:
  type: object
  properties:
    title: Photography Club Attendance Form
    pages:
    - id: 1
      name: meeting_date
      label: Meeting Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: meeting_time
      label: Meeting Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: attendee_name
      label: Attendee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: attendee_email
      label: Attendee Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: attendee_phone
      label: Attendee Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: attendees
      label: Attendees
      hint: List of attendees separated by commas
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: attendees_other
      label: Other Attendees
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
