inputSchema:
  type: object
  properties:
    title: Basketball Tryout Registration Form
    pages:
    - id: 1
      name: player_first_name
      label: First Name
      hint: Player first name
      type: text
      options: []
      required: true
    - id: 2
      name: player_last_name
      label: Last Name
      hint: Player last name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: Player birth date
      type: date
      options: []
      required: true
    - id: 4
      name: grade_level
      label: Grade Level
      hint: Current grade in school
      type: select_one
      options:
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: true
    - id: 5
      name: height
      label: Height
      hint: Player height in feet and inches
      type: text
      options: []
      required: true
    - id: 6
      name: weight
      label: Weight
      hint: Player weight in pounds
      type: number
      options: []
      required: false
    - id: 7
      name: primary_position
      label: Primary Position
      hint: Main position played
      type: select_one
      options:
      - Point Guard
      - Shooting Guard
      - Small Forward
      - Power Forward
      - Center
      required: true
    - id: 8
      name: secondary_position
      label: Secondary Position
      hint: Alternative position
      type: select_one
      options:
      - Point Guard
      - Shooting Guard
      - Small Forward
      - Power Forward
      - Center
      - None
      required: false
    - id: 9
      name: years_experience
      label: Years of Basketball Experience
      hint: How long have you played
      type: select_one
      options:
      - Less than 1 year
      - 1-2 years
      - 3-4 years
      - 5+ years
      required: true
    - id: 10
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 11
      name: parent_email
      label: Parent or Guardian Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 12
      name: parent_phone
      label: Parent or Guardian Phone
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 13
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name of emergency contact
      type: text
      options: []
      required: true
    - id: 14
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number
      type: text
      options: []
      required: true
    - id: 15
      name: medical_conditions
      label: Medical Conditions or Allergies
      hint: List any relevant medical information
      type: text
      options: []
      required: false
    - id: 16
      name: previous_team
      label: Previous Team or School
      hint: Where did you last play
      type: text
      options: []
      required: false
    - id: 17
      name: tryout_date
      label: Preferred Tryout Date
      hint: Select your preferred date
      type: date
      options: []
      required: true
    - id: 18
      name: t_shirt_size
      label: T-Shirt Size
      hint: For tryout shirt
      type: select_one
      options:
      - Youth Small
      - Youth Medium
      - Youth Large
      - Adult Small
      - Adult Medium
      - Adult Large
      - Adult XL
      required: true
    - id: 19
      name: additional_comments
      label: Additional Comments
      hint: Anything else we should know
      type: text
      options: []
      required: false
