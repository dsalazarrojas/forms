inputSchema:
  type: object
  properties:
    title: Tour Guide License Application Form
    pages:
    - id: 1
      name: user_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: birth_date
      label: Birth Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: license_type
      label: License Type
      hint: null
      type: select_one
      options:
      - Tour Guide
      - Tour Guide (International)
      - Tour Guide (Specialty)
      required: false
    - id: 7
      name: years_of_experience
      label: Years of Experience
      hint: null
      type: select_multiple
      options:
      - 1-2 years
      - 3-5 years
      - 6-10 years
      - More than 10 years
      required: false
    - id: 8
      name: education_level
      label: Educational Level
      hint: null
      type: select_multiple
      options:
      - Primary
      - Secondary
      - Higher
      - Doctoral
      required: false
    - id: 9
      name: languages_spoken
      label: Languages Spoken
      hint: null
      type: select_multiple
      options:
      - English
      - Spanish
      - French
      - Portuguese
      - Other
      required: false
    - id: 10
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: agreement
      label: Agreement
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: agreement_2
      label: Agreement 2
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: agreement_3
      label: Agreement 3
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 14
      name: license_status
      label: License Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      - Pending
      required: false
    - id: 15
      name: license_expiration_date
      label: License Expiration Date
      hint: null
      type: date
      options: []
      required: false
