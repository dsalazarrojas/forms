inputSchema:
  type: object
  properties:
    title: Birthday Party Invitation Template
    pages:
    - id: 1
      name: section_intro
      label: -- Birthday Party Invitation --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: invitation_message
      label: You are invited to a birthday celebration
      hint: Please complete this form to RSVP
      type: note
      options: []
      required: false
    - id: 3
      name: section_party_details
      label: -- Party Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: birthday_name
      label: Birthday Person Name
      hint: Who is celebrating their birthday
      type: text
      options: []
      required: true
    - id: 5
      name: birthday_date
      label: Date of Party
      hint: When is the celebration
      type: date
      options: []
      required: true
    - id: 6
      name: birthday_time
      label: Time
      hint: What time should guests arrive
      type: time
      options: []
      required: true
    - id: 7
      name: time_duration
      label: Party Duration
      hint: How long will the party last
      type: text
      options: []
      required: false
    - id: 8
      name: party_venue
      label: Location
      hint: Where is the party being held
      type: text
      options: []
      required: true
    - id: 9
      name: venue_address
      label: Full Address
      hint: Street address with city and ZIP
      type: text
      options: []
      required: true
    - id: 10
      name: theme_description
      label: Party Theme
      hint: Any special theme or dress code
      type: text
      options: []
      required: false
    - id: 11
      name: section_invitee_info
      label: -- Your Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: invitee_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 13
      name: invitee_email
      label: Email Address
      hint: Your email
      type: email
      options: []
      required: true
    - id: 14
      name: invitee_phone
      label: Phone Number
      hint: Your contact number
      type: text
      options: []
      required: false
    - id: 15
      name: section_rsvp_response
      label: -- RSVP Response --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: will_attend
      label: Will You Attend
      hint: Please respond
      type: select_one
      options:
      - Yes, I Will Attend
      - No, I Cannot Attend
      - Maybe, I Will Confirm Later
      required: true
    - id: 17
      name: number_of_guests
      label: Number of Guests in Your Party
      hint: Including yourself
      type: number
      options: []
      required: true
    - id: 18
      name: names_additional_guests
      label: Names of Additional Guests
      hint: Who else is coming with you
      type: text
      options: []
      required: false
    - id: 19
      name: section_preferences
      label: -- Guest Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: dietary_needs
      label: Dietary Restrictions or Allergies
      hint: Any food allergies or preferences
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Nut Allergy
      - Shellfish Allergy
      - Dairy-Free
      - Other Allergy
      - None
      required: false
    - id: 21
      name: dietary_details
      label: Details About Dietary Needs
      hint: Describe your specific requirements
      type: text
      options: []
      required: false
    - id: 22
      name: transportation
      label: Do You Need Transportation Help
      hint: Will you need a ride to the party
      type: select_one
      options:
      - No, I Have Transportation
      - Yes, Please Arrange
      - Maybe, Will Confirm
      required: false
    - id: 23
      name: mobility_assistance
      label: Mobility or Accessibility Needs
      hint: Any accessibility requirements
      type: text
      options: []
      required: false
    - id: 24
      name: section_activities
      label: -- Activity Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: activity_interests
      label: Activities You Are Interested In
      hint: What sounds fun to you
      type: select_multiple
      options:
      - Games
      - Dancing
      - Crafts
      - Sports
      - Karaoke
      - Photo Booth
      - Movies
      - Other Activities
      required: false
    - id: 26
      name: music_requests
      label: Song Requests for Party Music
      hint: Any songs you'd like to hear
      type: text
      options: []
      required: false
    - id: 27
      name: section_gift_info
      label: -- Gift Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 28
      name: gift_registry_link
      label: Gift Registry Information
      hint: Where gifts can be purchased
      type: text
      options: []
      required: false
    - id: 29
      name: gift_preference
      label: Birthday Person Gift Preference
      hint: What would they like
      type: text
      options: []
      required: false
    - id: 30
      name: section_notes
      label: -- Additional Notes --
      hint: null
      type: note
      options: []
      required: false
    - id: 31
      name: birthday_message
      label: Birthday Message for Celebrant
      hint: Share a special message
      type: text
      options: []
      required: false
    - id: 32
      name: special_requests
      label: Special Requests or Questions
      hint: Anything else the host should know
      type: text
      options: []
      required: false
    - id: 33
      name: section_confirmation
      label: -- Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 34
      name: email_confirmation
      label: Send me an email confirmation
      hint: Would you like a confirmation email
      type: select_one
      options:
      - Yes, Send Confirmation
      - No, No Confirmation Needed
      required: true
