inputSchema:
  type: object
  properties:
    title: Pool Party Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Please enter your first name
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: Please enter your last name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Please enter a valid email address
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone
      hint: Please enter your phone number
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: Please enter your date of birth
      type: date
      options: []
      required: true
    - id: 6
      name: time_of_arrival
      label: Time of Arrival
      hint: Please enter the time of your arrival
      type: time
      options: []
      required: true
    - id: 7
      name: age
      label: Age
      hint: Calculated from date of birth
      type: number
      options: []
      required: true
    - id: 8
      name: select_one
      label: Select One
      hint: Choose one option
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 9
      name: select_multiple
      label: Select Multiple
      hint: Choose multiple options
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      - Option 5
      required: true
    - id: 10
      name: note
      label: Note
      hint: Optional note
      type: text
      options: []
      required: false
    - id: 11
      name: event_type
      label: Event Type
      hint: Choose an event type
      type: text
      options: []
      required: true
