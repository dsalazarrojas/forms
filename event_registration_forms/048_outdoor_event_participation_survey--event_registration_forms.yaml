inputSchema:
  type: object
  properties:
    title: Outdoor Event Participation Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_type
      label: How many days did you participate in the event?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: event_length
      label: How many hours did you participate in the event?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: event_frequency
      label: How often do you participate in similar events?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Rarely
      required: false
    - id: 5
      name: feedback
      label: What would you like to see improved at this type of event?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: suggestions
      label: Do you have any further suggestions?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: event_satisfaction
      label: How satisfied are you with the overall event?
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: event_satisfaction_breakdown
      label: Event Satisfaction Breakdown
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neither Satisfied nor Dissatisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 11
      name: attendance
      label: How many people attended the event?
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: recommendation
      label: Would you recommend this event?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Undecided
      required: false
    - id: 13
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: event_type_frequency
      label: What type of event would you like to participate in most often?
      hint: null
      type: select_multiple
      options:
      - Music Festivals
      - Food Festivals
      - Sports Tournaments
      - Cultural Fairs
      - Other
      required: false
    - id: 15
      name: event_location
      label: Which location would you prefer for this type of event?
      hint: null
      type: select_multiple
      options:
      - Urban
      - Rural
      - Beachside
      - Park
      - Other
      required: false
    - id: 16
      name: age
      label: How old are you?
      hint: null
      type: number
      options: []
      required: false
    - id: 17
      name: gender
      label: What is your gender?
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      required: false
    - id: 18
      name: income
      label: What is your annual income?
      hint: null
      type: select_one
      options:
      - Less than $20,000
      - $20,000-$30,000
      - $30,000-$40,000
      - $40,000-$50,000
      - $50,000-$60,000
      - More than $60,000
      required: false
    - id: 19
      name: education
      label: What is your level of education?
      hint: null
      type: select_one
      options:
      - High School Diploma or Equivalent
      - Some College or Associates Degree
      - Bachelors Degree or Equivalent
      - Masters Degree or Equivalent
      - Doctoral Degree or Equivalent
      required: false
    - id: 20
      name: occupation
      label: What is your occupation?
      hint: null
      type: select_multiple
      options:
      - Student
      - Full-time Employee
      - Part-time Employee
      - Self-employed
      - Unemployed
      required: false
    - id: 21
      name: how_heard
      label: How did you hear about this event?
      hint: null
      type: select_multiple
      options:
      - Word of Mouth
      - Social Media
      - Print Media
      - Online Search
      - Other
      required: false
    - id: 22
      name: attended_previous_events
      label: Have you attended a similar event organized by this event organizer before?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 23
      name: would_participate
      label: Would you participate in a similar event organized by this event organizer
        again?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Undecided
      required: false
    - id: 24
      name: how_often_would_participate
      label: How often would you participate in a similar event organized by this
        event organizer?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Rarely
      required: false
    - id: 25
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
