inputSchema:
  type: object
  properties:
    title: Speech Writing Workshop Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: role
      label: Role
      hint: null
      type: select_one
      options:
      - '{''label'': ''Participant''}'
      - '{''label'': ''Speaker''}'
      required: true
    - id: 6
      name: workshop_date
      label: Workshop Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: workshop_time
      label: Workshop Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: workshop_duration
      label: Workshop Duration
      hint: null
      type: number
      options: []
      required: false
