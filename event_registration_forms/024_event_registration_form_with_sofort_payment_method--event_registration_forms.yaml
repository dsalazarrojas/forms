inputSchema:
  type: object
  properties:
    title: Event Registration Form With Sofort Payment Method
    pages:
    - id: 1
      name: registration_info
      label: Registration Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_info
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: participant_info
      label: Participant Info
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Sofort
      - PayPal
      - Stripe
      required: false
    - id: 5
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
