inputSchema:
  type: object
  properties:
    title: Clinical Research Literacy Session Registration
    pages:
    - id: 1
      name: form_header
      label: Clinical Research Literacy Session Registration
      hint: Register for our clinical research literacy educational session
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: organization
      label: Organization or Institution
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: job_title
      label: Job Title or Role
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: professional_category
      label: Professional Category
      hint: null
      type: select_one
      options:
      - Physician
      - Nurse
      - Research Coordinator
      - Clinical Research Associate
      - Data Manager
      - Pharmacist
      - Lab Technician
      - Student
      - Administrator
      - Patient Advocate
      - Other
      required: true
    - id: 9
      name: years_experience
      label: Years of Experience in Clinical Research
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - 10+ years
      - New to Field
      required: true
    - id: 10
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: session_date
      label: Preferred Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: session_format
      label: Session Format Preference
      hint: null
      type: select_one
      options:
      - In-Person
      - Virtual Live
      - Recorded On-Demand
      - No Preference
      required: true
    - id: 13
      name: topics_of_interest
      label: Topics of Interest
      hint: Select all that apply
      type: select_multiple
      options:
      - Research Ethics
      - Informed Consent Process
      - Protocol Development
      - Data Management
      - Regulatory Compliance
      - Patient Recruitment
      - Study Monitoring
      - Adverse Event Reporting
      - GCP Guidelines
      - Statistical Analysis
      - Publishing Results
      - Other
      required: true
    - id: 14
      name: current_knowledge_level
      label: Current Knowledge Level in Clinical Research
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Expert
      required: true
    - id: 15
      name: learning_objectives
      label: What Are Your Learning Objectives
      hint: What do you hope to gain
      type: text
      options: []
      required: true
    - id: 16
      name: research_involvement
      label: How Are You Involved in Clinical Research
      hint: Select all that apply
      type: select_multiple
      options:
      - Principal Investigator
      - Co-Investigator
      - Study Coordinator
      - Research Assistant
      - Data Entry
      - Monitoring
      - Ethics Review
      - Patient Care
      - Administrative Support
      - Not Currently Involved
      - Other
      required: true
    - id: 17
      name: institution_type
      label: Institution Type
      hint: null
      type: select_one
      options:
      - Academic Medical Center
      - Community Hospital
      - Private Practice
      - Research Organization
      - Pharmaceutical Company
      - Government Agency
      - Non-Profit
      - Other
      required: false
    - id: 18
      name: certification_goals
      label: Are You Pursuing Clinical Research Certification
      hint: null
      type: select_one
      options:
      - Yes CCRP
      - Yes CCRCA
      - Yes ACRP
      - Yes Other
      - false
      - Not Sure
      required: false
    - id: 19
      name: dietary_requirements
      label: Dietary Requirements
      hint: If attending in-person
      type: select_one
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Kosher
      - Halal
      - Other
      required: false
    - id: 20
      name: accessibility_needs
      label: Accessibility Requirements
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: how_did_you_hear
      label: How Did You Hear About This Session
      hint: null
      type: select_one
      options:
      - Email
      - Colleague
      - Website
      - Social Media
      - Conference
      - Professional Organization
      - Other
      required: false
    - id: 22
      name: ceu_credits_needed
      label: Do You Need CEU or CME Credits
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 23
      name: license_number
      label: Professional License Number
      hint: If applicable for credits
      type: text
      options: []
      required: false
    - id: 24
      name: license_state
      label: License State or Country
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: questions_for_presenter
      label: Questions You Would Like Addressed
      hint: null
      type: text
      options: []
      required: false
    - id: 26
      name: additional_comments
      label: Additional Comments
      hint: Anything else we should know
      type: text
      options: []
      required: false
    - id: 27
      name: terms_accepted
      label: I Accept Terms and Conditions
      hint: null
      type: select_one
      options:
      - Yes I Accept
      - No I Do Not Accept
      required: true
    - id: 28
      name: registration_date
      label: Registration Date
      hint: null
      type: date
      options: []
      required: true
