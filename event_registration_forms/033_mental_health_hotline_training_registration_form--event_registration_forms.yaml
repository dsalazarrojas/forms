inputSchema:
  type: object
  properties:
    title: Mental Health Hotline Training Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date Of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: organization
      label: Organization
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: position
      label: Position
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: role
      label: Role
      hint: Please specify your role in the organization
      type: select_one
      options:
      - Staff
      - Faculty
      - Student
      required: true
    - id: 9
      name: training_session
      label: Training Session
      hint: null
      type: select_multiple
      options:
      - Session 1
      - Session 2
      - Session 3
      required: true
