inputSchema:
  type: object
  properties:
    title: Charity Drive Preparation Checklist
    pages:
    - id: 1
      name: section_general_info
      label: -- General Drive Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: drive_title
      label: Drive Title
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: drive_coordinator
      label: Lead Coordinator
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: planned_drive_date
      label: Planned Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: target_goal
      label: Fundraising / Collection Goal
      hint: Describe the main objective
      type: text
      options: []
      required: true
    - id: 6
      name: section_prep_tasks
      label: -- Preparation Tasks --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: task_venue_secured
      label: Venue or Location Secured
      hint: Is the physical space confirmed
      type: select_one
      options:
      - 'True'
      - In Progress
      - 'False'
      required: true
    - id: 8
      name: task_permits_obtained
      label: Necessary Permits Obtained
      hint: City or county fundraising permits
      type: select_one
      options:
      - 'True'
      - N/A
      - In Progress
      required: true
    - id: 9
      name: task_volunteers_recruited
      label: Volunteer Team Recruited
      hint: null
      type: select_one
      options:
      - 'True'
      - Partial
      - Not Started
      required: true
    - id: 10
      name: task_marketing_materials
      label: Marketing Materials Created
      hint: Flyers, social media posts, etc.
      type: select_one
      options:
      - 'True'
      - In Progress
      - 'False'
      required: true
    - id: 11
      name: section_logistics
      label: -- Logistics and Budget --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: equipment_needed
      label: Equipment and Supplies Needed
      hint: List tables, chairs, collection boxes, etc.
      type: text
      options: []
      required: false
    - id: 13
      name: budget_status
      label: Current Budget Status
      hint: null
      type: select_one
      options:
      - Under Budget
      - On Budget
      - Over Budget
      required: true
    - id: 14
      name: risk_assessment
      label: Potential Risks or Obstacles
      hint: e.g. weather, low turnout
      type: text
      options: []
      required: false
    - id: 15
      name: last_updated
      label: Last Updated Date
      hint: null
      type: date
      options: []
      required: true
    - id: 16
      name: coordinator_notes
      label: Coordinator Additional Notes
      hint: null
      type: text
      options: []
      required: false
