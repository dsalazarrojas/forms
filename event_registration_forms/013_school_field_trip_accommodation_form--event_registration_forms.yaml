inputSchema:
  type: object
  properties:
    title: School Field Trip Accommodation Form
    pages:
    - id: 1
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_count
      label: Number of Students
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: accommodation_type
      label: Accommodation Type
      hint: null
      type: select_multiple
      options:
      - '{''option_a'': ''On-site''}'
      - '{''option_b'': ''Nearby Hotel''}'
      - '{''option_c'': ''Other (Please specify)''}'
      required: true
    - id: 4
      name: accommodation_start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: accommodation_end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: accommodation_address
      label: Accommodation Address
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: accommodation_details
      label: Accommodation Details
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: accommodation_other
      label: Other Accommodation
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: true
