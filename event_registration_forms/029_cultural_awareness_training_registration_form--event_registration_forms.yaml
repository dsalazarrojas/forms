inputSchema:
  type: object
  properties:
    title: Cultural Awareness Training Registration Form
    pages:
    - id: 1
      name: participant_info
      label: Participant Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: training_session
      label: Training Session
      hint: null
      type: select_multiple
      options:
      - English
      - Spanish
      - French
      required: false
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: training_location
      label: Training Location
      hint: null
      type: select_one
      options:
      - Chicago, IL
      - New York, NY
      - Los Angeles, CA
      required: false
    - id: 6
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: participant_email
      label: Participant E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
