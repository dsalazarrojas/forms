inputSchema:
  type: object
  properties:
    title: Class Attendance Sign In Form
    pages:
    - id: 1
      name: sign_in_header
      label: -- Sign-In Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: Print clearly or select from list
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 4
      name: email_address
      label: Email Address
      hint: Optional
      type: email
      options: []
      required: false
    - id: 5
      name: class_info_header
      label: -- Class Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: class_name
      label: Class Name or Section
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: class_date
      label: Class Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: sign_in_time
      label: Sign-in Time
      hint: Time of arrival
      type: time
      options: []
      required: true
    - id: 9
      name: attendance_status
      label: Attendance Status
      hint: null
      type: select_one
      options:
      - Present
      - Late arrival
      - Excused absence
      - Unexcused absence
      - Partial attendance
      required: true
    - id: 10
      name: arrival_details_header
      label: -- Arrival Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: late_reason
      label: If late, reason for lateness
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: missing_materials
      label: Missing any required materials
      hint: null
      type: select_one
      options:
      - true
      - false
      - Not applicable
      required: false
    - id: 13
      name: missing_materials_details
      label: Details of missing materials
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: health_header
      label: -- Health and Wellness Check --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: health_status
      label: Health and Wellness Status
      hint: null
      type: select_one
      options:
      - Good
      - Tired or fatigued
      - Not feeling well
      - Injured
      - Other health concern
      - Prefer not to say
      required: false
    - id: 16
      name: health_concerns
      label: Any health concerns to report
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: contact_info_header
      label: -- Emergency Contact Update --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: contact_info_update
      label: Need to update contact information
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 19
      name: new_contact_info
      label: New contact information
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: additional_notes
      label: Additional Notes or Comments
      hint: Special circumstances, concerns, etc.
      type: text
      options: []
      required: false
    - id: 21
      name: verification
      label: I confirm this information is accurate
      hint: null
      type: select_one
      options:
      - Yes, confirmed
      - false
      required: true
