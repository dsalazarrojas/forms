inputSchema:
  type: object
  properties:
    title: Golf Score Prediction Contest
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: predicted_score
      label: Predicted Score
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: participant_tshirt_size
      label: T-Shirt Size
      hint: null
      type: select_multiple
      options:
      - L
      - XL
      - X
      - Xl
      - M
      - S
      - Sm
      required: true
    - id: 4
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
