inputSchema:
  type: object
  properties:
    title: Photography Use Authorization Form
    pages:
    - id: 1
      name: form_submit_button
      label: Submit
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: photographer_name
      label: Photographer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: photographer_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: client_contact
      label: Client Contact
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: usage_rights
      label: Usage Rights
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: true
    - id: 10
      name: submitter_name
      label: Submitter Name
      hint: null
      type: text
      options: []
      required: true
