inputSchema:
  type: object
  properties:
    title: Skincare Webinar Registration Form
    pages:
    - id: 1
      name: registration_form
      label: Registration Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: What is your name?
      hint: Please enter your name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: What is your email address?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: phone
      label: What is your phone number?
      hint: Optional
      type: text
      options: []
      required: false
    - id: 5
      name: segment_audience
      label: Which segment are you interested in?
      hint: Select one or both
      type: select_multiple
      options:
      - Segment A
      - Segment B
      required: true
    - id: 6
      name: comments
      label: Do you have any comments or questions for the speaker?
      hint: Feel free to add any additional comments
      type: text
      options: []
      required: false
