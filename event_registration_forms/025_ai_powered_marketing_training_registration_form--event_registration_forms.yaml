inputSchema:
  type: object
  properties:
    title: AI Powered Marketing Training Registration Form
    pages:
    - id: 1
      name: --participant_information--
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization
      hint: Company or affiliation
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email address
      hint: Confirmation will be sent here
      type: email
      options: []
      required: true
    - id: 5
      name: role
      label: Job role
      hint: Marketing, product, analyst, etc
      type: text
      options: []
      required: true
    - id: 6
      name: session_choice
      label: Preferred session
      hint: Select one preferred training session
      type: select_one
      options:
      - Morning session
      - Afternoon session
      - Full day intensive
      required: true
    - id: 7
      name: dietary_requirements
      label: Dietary requirements
      hint: Leave blank if none
      type: text
      options: []
      required: false
    - id: 8
      name: accessibility_needs
      label: Accessibility needs
      hint: Any accommodations required
      type: text
      options: []
      required: false
    - id: 9
      name: payment_needed
      label: Will you require an invoice or payment link
      hint: Select one
      type: select_one
      options:
      - Invoice
      - Payment link
      - No payment required
      required: true
    - id: 10
      name: additional_comments
      label: Additional comments or requests
      hint: Optional
      type: text
      options: []
      required: false
