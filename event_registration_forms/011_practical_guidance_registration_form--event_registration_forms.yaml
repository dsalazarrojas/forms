inputSchema:
  type: object
  properties:
    title: Practical Guidance Registration Form
    pages:
    - id: 1
      name: event_details
      label: Event Information
      hint: Please provide event details below
      type: text
      options: []
      required: true
    - id: 2
      name: participant_details
      label: Participant Information
      hint: Please provide participant details below
      type: text
      options: []
      required: false
    - id: 3
      name: event_date
      label: Event Date
      hint: Please select event date
      type: date
      options: []
      required: true
    - id: 4
      name: event_time
      label: Event Time
      hint: Please select event time
      type: time
      options: []
      required: true
    - id: 5
      name: participant_email
      label: Participant Email
      hint: Please enter participant email
      type: email
      options: []
      required: true
    - id: 6
      name: participant_phone
      label: Participant Phone
      hint: Please enter participant phone number
      type: text
      options: []
      required: true
