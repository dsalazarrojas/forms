inputSchema:
  type: object
  properties:
    title: Transportation Schedule Communication Form
    pages:
    - id: 1
      name: transportation_schedule
      label: Transportation Schedule
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_id
      label: event id
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: schedule_type
      label: Schedule Type
      hint: null
      type: select_one
      options:
      - Single
      - Multiple
      - Continuous
      required: false
    - id: 4
      name: start_time
      label: start time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: end_time
      label: end time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: vehicle_type
      label: Vehicle Type
      hint: null
      type: select_multiple
      options:
      - Car
      - Bus
      - Train
      required: false
    - id: 7
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
