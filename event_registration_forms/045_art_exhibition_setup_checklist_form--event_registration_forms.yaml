inputSchema:
  type: object
  properties:
    title: Art Exhibition Setup Checklist Form
    pages:
    - id: 1
      name: section_event
      label: -- Event Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: exhibition_name
      label: Exhibition Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: event_date
      label: Exhibition Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: setup_date
      label: Setup Date
      hint: When will setup begin
      type: date
      options: []
      required: true
    - id: 5
      name: coordinator_name
      label: Setup Coordinator Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_artwork
      label: -- Artwork Preparation --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: artwork_catalogued
      label: All Artwork Catalogued and Inventoried
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - In progress
      required: true
    - id: 8
      name: artwork_condition
      label: All Artwork Condition Checked
      hint: No damage upon arrival
      type: select_one
      options:
      - 'True'
      - 'False'
      - Issues noted
      required: true
    - id: 9
      name: artwork_insured
      label: All Artwork Insured
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Partially
      required: true
    - id: 10
      name: display_specs_ready
      label: Display Specifications Ready for Each Piece
      hint: Size, height, lighting, hanging method
      type: select_one
      options:
      - 'True'
      - 'False'
      - Some completed
      required: true
    - id: 11
      name: section_venue
      label: -- Venue Preparation --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: walls_prepared
      label: Walls Prepared and Painted
      hint: If necessary
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not needed
      required: true
    - id: 13
      name: lighting_tested
      label: All Lighting Tested and Adjusted
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - In progress
      required: true
    - id: 14
      name: climate_control
      label: Climate Control Operational
      hint: Temperature and humidity appropriate
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not applicable
      required: true
    - id: 15
      name: security_measures
      label: Security Measures in Place
      hint: Alarms, cameras, security personnel
      type: select_one
      options:
      - 'True'
      - 'False'
      - Partially
      required: true
    - id: 16
      name: section_signage
      label: -- Signage and Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: entrance_signage
      label: Entrance and Directional Signage Installed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - In progress
      required: true
    - id: 18
      name: artwork_labels
      label: All Artwork Labels and Descriptions Ready
      hint: Title, artist, date, price if applicable
      type: select_one
      options:
      - 'True'
      - 'False'
      - Partially
      required: true
    - id: 19
      name: exhibition_title_display
      label: Exhibition Title Prominently Displayed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - In progress
      required: true
    - id: 20
      name: section_logistics
      label: -- Logistics and Services --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: refreshment_setup
      label: Refreshment Area Set Up
      hint: Beverages, snacks, etc.
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not planned
      required: true
    - id: 22
      name: seating_arranged
      label: Seating and Rest Areas Arranged
      hint: If needed
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not needed
      required: true
    - id: 23
      name: restroom_access
      label: Restroom Access Available
      hint: Clearly marked and accessible
      type: select_one
      options:
      - 'True'
      - 'False'
      - Limited
      required: true
    - id: 24
      name: section_staff
      label: -- Staff and Planning --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: staff_trained
      label: Staff Trained on Exhibition Details
      hint: Artwork information, emergency procedures
      type: select_one
      options:
      - 'True'
      - 'False'
      - In progress
      required: true
    - id: 26
      name: opening_ready
      label: Exhibition Ready for Opening
      hint: All items above completed
      type: select_one
      options:
      - Yes, fully ready
      - Mostly ready
      - Still in progress
      required: true
