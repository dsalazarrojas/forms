inputSchema:
  type: object
  properties:
    title: Temporary Accommodation Request Form
    pages:
    - id: 1
      name: event_registration_forms_booking_forms
      label: Event Registration Forms,Booking Forms
      hint: null
      type: select_one
      options:
      - Event Registration Forms
      - Booking Forms
      required: false
    - id: 2
      name: accommodation_request_form
      label: accommodation_request_form
      hint: null
      type: select_multiple
      options:
      - Request Accommodation
      - Confirm Accommodation Request
      required: false
    - id: 3
      name: accommodation_request_date
      label: accommodation_request_date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: accommodation_request_time
      label: accommodation_request_time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: accommodation_request_duration
      label: accommodation_request_duration
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: accommodation_request_type
      label: accommodation_request_type
      hint: null
      type: select_one
      options:
      - Short-term housing solution
      - Long-term housing solution
      required: false
    - id: 7
      name: accommodation_request_status
      label: accommodation_request_status
      hint: null
      type: select_one
      options:
      - Pending
      - Approved
      - Declined
      required: false
    - id: 8
      name: accommodation_request_notes
      label: accommodation_request_notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: user_notes
      label: user_notes
      hint: null
      type: note
      options: []
      required: false
