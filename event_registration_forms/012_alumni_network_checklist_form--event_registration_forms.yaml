inputSchema:
  type: object
  properties:
    title: Alumni Network Checklist Form
    pages:
    - id: 1
      name: section_checklist
      label: -- Checklist --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: attendee_name
      label: Attendee name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: checked_in
      label: Checked in
      hint: Indicate if attendee checked in
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: session_attended
      label: Sessions attended
      hint: List sessions attended
      type: text
      options: []
      required: false
    - id: 5
      name: networking_interest
      label: Interested in networking
      hint: Select yes or no
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: volunteer_interest
      label: Interested in volunteering
      hint: Select yes or no
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: follow_up_needed
      label: Follow up needed
      hint: Indicate if follow up required
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: notes
      label: Staff notes
      hint: Internal notes about attendee
      type: text
      options: []
      required: false
