inputSchema:
  type: object
  properties:
    title: entrepreneurial_networking_event_registration_form
    pages:
    - id: 1
      name: about_yourself
      label: About Your Yourself
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: are_you_a_member_of_the_entrepreneurial_network
      label: Are you a member of the Entrepreneurial Network?
      hint: null
      type: select_one
      options:
      - I am a member
      - I am not a member
      required: true
    - id: 3
      name: have_you_attended_an_entrepreneurial_network_event_before
      label: Have you attended an Entrepreneurial Network event before?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: what_do_you_want_to_gain_from_the_event
      label: What do you want to gain from the event?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: are_you_willing_to_share_your_story
      label: Are you willing to share your story?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: what_is_your_role
      label: What is your role?
      hint: null
      type: select_multiple
      options:
      - CEO/Founder
      - Investor/Advisor
      - Other
      required: true
    - id: 7
      name: how_did_you_hear_about_the_event
      label: How did you hear about the event?
      hint: null
      type: select_multiple
      options:
      - Social Media
      - Friend/Colleague
      - Online Search
      required: true
    - id: 8
      name: what_is_your_company_name
      label: What is your company name?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: what_is_your_title_at_your_company
      label: What is your title at your company?
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: are_you_willing_to_provide_your_contact_info
      label: Are you willing to provide your contact information?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: consent_to_use_your_story_in_promotional_materials
      label: Consent to use your story in promotional materials?
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 12
      name: consent_to_publish_your_story_on_social_media
      label: Consent to publish your story on social media?
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 13
      name: do_you_have_a_photo
      label: Do you have a photo?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: do_you_have_a_logo
      label: Do you have a logo?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: do_you_have_social_media_accounts
      label: Do you have social media accounts?
      hint: null
      type: select_multiple
      options:
      - LinkedIn
      - Twitter
      - Instagram
      required: true
    - id: 16
      name: can_we_follow_your_account
      label: Can we follow your account?
      hint: null
      type: select_multiple
      options:
      - LinkedIn
      - Twitter
      - Instagram
      required: true
    - id: 17
      name: do_you_want_us_to_share_your_story_on_your_account
      label: Do you want us to share your story on your account?
      hint: null
      type: select_multiple
      options:
      - LinkedIn
      - Twitter
      - Instagram
      required: true
    - id: 18
      name: is_this_the_primary_contact
      label: Is this the primary contact?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
