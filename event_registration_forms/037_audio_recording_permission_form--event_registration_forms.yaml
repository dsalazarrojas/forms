inputSchema:
  type: object
  properties:
    title: Audio Recording Permission Form
    pages:
    - id: 1
      name: section_presenter
      label: -- Presenter/Registrant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: registrant_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: affiliation_company
      label: Affiliation or Company
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: section_event
      label: -- Event and Session Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: event_name
      label: Name of the Event
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: session_title
      label: Title of Presentation or Session
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: section_permissions
      label: -- Recording Permissions --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: permission_to_record
      label: Do you grant permission to record your session?
      hint: null
      type: select_one
      options:
      - Yes, Full Session
      - Yes, Excluding Q&A
      - No, I do not want to be recorded
      required: true
    - id: 10
      name: permission_to_share
      label: Permission to share the recording with event attendees
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: permission_marketing
      label: Permission to use highlights for future event marketing
      hint: Snippets of 1-3 minutes
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: specific_restrictions
      label: Any specific restrictions or conditions for the recording?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: contact_email
      label: Email Address for Confirmation
      hint: null
      type: email
      options: []
      required: true
    - id: 14
      name: digital_signature
      label: Presenter Signature (Type Name)
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: agreement_date
      label: Date Signed
      hint: null
      type: date
      options: []
      required: true
