inputSchema:
  type: object
  properties:
    title: Crafting Club Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: member_type
      label: member type
      hint: null
      type: select_one
      options:
      - Regular Member
      - VIP Member
      - Guest
      required: false
    - id: 6
      name: craft_preferences
      label: Craft Preferences
      hint: null
      type: select_multiple
      options:
      - Crafting
      - Art
      - Music
      - Dance
      - Theater
      required: false
    - id: 7
      name: craft_frequency
      label: Craft Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: false
    - id: 8
      name: registration_date
      label: Registration Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: registration_time
      label: Registration Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: first_time_member
      label: first time member
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
