inputSchema:
  type: object
  properties:
    title: Field Trip Authorization Form
    pages:
    - id: 1
      name: school_id
      label: school id
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: trip_date
      label: Trip Date
      hint: The date of the trip
      type: date
      options: []
      required: false
    - id: 3
      name: trip_details
      label: Trip Details
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: student_grade
      label: Student Grade
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: parent_phone
      label: Parent Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: trip_location
      label: Trip Location
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: trip_duration
      label: Trip Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: student_signature
      label: Student Signature
      hint: null
      type: note
      options: []
      required: true
    - id: 11
      name: parent_signature
      label: Parent Signature
      hint: null
      type: note
      options: []
      required: true
