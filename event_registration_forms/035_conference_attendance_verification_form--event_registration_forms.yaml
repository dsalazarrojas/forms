inputSchema:
  type: object
  properties:
    title: Conference Attendance Verification Form
    pages:
      - id: 1
        name: attendee_name
        label: Attendee name
        hint: Full name as registered
        type: text
        options: []
        required: true
      - id: 2
        name: registration_id
        label: Registration ID
        hint: Provided at registration
        type: text
        options: []
        required: true
      - id: 3
        name: check_in_date
        label: Check in date
        hint: Date of check in
        type: date
        options: []
        required: true
      - id: 4
        name: session_attended
        label: Sessions attended
        hint: List session IDs or titles
        type: text
        options: []
        required: false
      - id: 5
        name: badge_scanned
        label: Badge scanned confirmation
        hint: Indicates if badge was scanned
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 6
        name: attendee_signature
        label: Attendee signature instructions
        hint: Signature recorded electronically
        type: note
        options: []
        required: false
      - id: 7
        name: verifier_name
        label: Verifier name
        hint: Staff verifying attendance
        type: text
        options: []
        required: true
      - id: 8
        name: verifier_comments
        label: Verifier comments
        hint: Any notes about attendance verification
        type: text
        options: []
        required: false
      - id: 9
        name: verification_time
        label: Verification time
        hint: Time the attendance was confirmed
        type: time
        options: []
        required: false
      - id: 10
        name: confirmation_status
        label: Confirmation status
        hint: Final attendance confirmation
        type: select_one
        options:
          - Confirmed
          - Unconfirmed
        required: true
