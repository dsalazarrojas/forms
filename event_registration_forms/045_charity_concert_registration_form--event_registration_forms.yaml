inputSchema:
  type: object
  properties:
    title: Charity Concert Registration Form
    pages:
    - id: 1
      name: header
      label: -- Concert Registration --
      hint: Register attendees and manage ticketing for the charity concert
      type: note
      options: []
      required: false
    - id: 2
      name: attendee_name
      label: attendee name
      hint: full name for ticketing
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: email
      hint: e ticket delivery and updates
      type: email
      options: []
      required: true
    - id: 4
      name: ticket_type
      label: ticket type
      hint: select ticket category
      type: select_one
      options:
      - General Admission
      - VIP
      - Backstage
      required: true
    - id: 5
      name: ticket_quantity
      label: ticket quantity
      hint: number of tickets to purchase
      type: number
      options: []
      required: true
    - id: 6
      name: payment_status
      label: payment status
      hint: payment confirmation or pending
      type: select_one
      options:
      - Paid
      - Pending
      - Reserved
      required: true
    - id: 7
      name: volunteer_interest
      label: volunteer interest
      hint: indicate willingness to volunteer at the event
      type: select_one
      options:
      - true
      - false
      - Maybe
      required: false
    - id: 8
      name: special_accommodations
      label: special accommodations
      hint: accessibility or seating requests
      type: text
      options: []
      required: false
    - id: 9
      name: donation_addon
      label: donation addon
      hint: optional additional donation at checkout
      type: number
      options: []
      required: false
    - id: 10
      name: consent_terms
      label: consent terms
      hint: agree to event policies and code of conduct
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
