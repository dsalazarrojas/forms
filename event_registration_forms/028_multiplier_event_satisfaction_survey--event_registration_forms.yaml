inputSchema:
  type: object
  properties:
    title: Multiplier Event Satisfaction Survey
    pages:
    - id: 1
      name: multiplier_event_satisfaction
      label: How did you find the online multiplier event?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_organization
      label: How would you rate the organization of the event?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: event_content
      label: How would you rate the content of the event?
      hint: null
      type: select_one
      options:
      - Too much
      - Just right
      - Too little
      required: false
    - id: 4
      name: overall_experience
      label: How would you rate your overall experience at the event?
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: event_feedback
      label: What do you think we could have done better?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
