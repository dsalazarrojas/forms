inputSchema:
  type: object
  properties:
    title: DIY Workshop Attendance Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: workshop_date
      label: Workshop Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: workshop_time
      label: Workshop Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: workshop_session
      label: Workshop Session
      hint: null
      type: select_one
      options:
      - 9:00-10:00
      - 10:00-11:00
      - 11:00-12:00
      - 12:00-13:00
      - 13:00-14:00
      required: true
    - id: 7
      name: workshop_location
      label: Workshop Location
      hint: null
      type: select_multiple
      options:
      - Location 1
      - Location 2
      - Location 3
      required: true
    - id: 8
      name: workshop_notes
      label: Workshop Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: participant_comments
      label: Participant Comments
      hint: null
      type: note
      options: []
      required: false
