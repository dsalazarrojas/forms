inputSchema:
  type: object
  properties:
    title: Network Participation Form
    pages:
    - id: 1
      name: event_organizer
      label: Event Organizer
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: network_type
      label: What kind of network
      hint: null
      type: select_one
      options:
      - Networks
      - Partners
      - Other
      required: true
    - id: 3
      name: organization_name
      label: Organization Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_name
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: zip_code
      label: Zip Code
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: network_participation_terms
      label: Network Participation Terms
      hint: Read our network participation terms at the bottom of this form
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 10
      name: terms_agreement
      label: Network Participation Terms Agreement
      hint: null
      type: select_one
      options:
      - I Agree
      - I Disagree
      required: true
    - id: 11
      name: notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: submitted_by
      label: Submitted By
      hint: null
      type: text
      options: []
      required: false
