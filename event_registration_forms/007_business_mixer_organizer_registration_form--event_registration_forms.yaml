inputSchema:
  type: object
  properties:
    title: Business Mixer Organizer Registration Form
    pages:
    - id: 1
      name: organizer_name
      label: Organizer Full Name
      hint: Name of event organizer
      type: text
      options: []
      required: true
    - id: 2
      name: organizer_title
      label: Title or Position
      hint: Job title or role
      type: text
      options: []
      required: false
    - id: 3
      name: organizer_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: organizer_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 5
      name: organizing_company
      label: Organizing Company/Organization
      hint: Name of organization hosting the mixer
      type: text
      options: []
      required: true
    - id: 6
      name: event_name
      label: Mixer Event Name
      hint: Name of the networking event
      type: text
      options: []
      required: true
    - id: 7
      name: event_date
      label: Event Date
      hint: When is the mixer scheduled?
      type: date
      options: []
      required: true
    - id: 8
      name: event_start_time
      label: Event Start Time
      hint: What time does the mixer begin?
      type: time
      options: []
      required: true
    - id: 9
      name: event_end_time
      label: Event End Time
      hint: When does the mixer end?
      type: time
      options: []
      required: true
    - id: 10
      name: event_location
      label: Event Location
      hint: Physical address or venue name
      type: text
      options: []
      required: true
    - id: 11
      name: expected_attendance
      label: Expected Number of Attendees
      hint: How many people do you expect?
      type: number
      options: []
      required: true
    - id: 12
      name: event_format
      label: Event Format
      hint: What type of mixer is this?
      type: select_one
      options:
      - In-Person
      - Virtual
      - Hybrid
      required: true
    - id: 13
      name: target_audience
      label: Target Audience
      hint: Who is this event for?
      type: text
      options: []
      required: true
    - id: 14
      name: registration_fee
      label: Registration Fee
      hint: Will there be a registration fee?
      type: select_one
      options:
      - Free
      - Paid
      - Sliding Scale
      - Sponsor Dependent
      required: true
    - id: 15
      name: fee_amount
      label: Fee Amount (if applicable)
      hint: Cost per attendee in USD
      type: number
      options: []
      required: false
    - id: 16
      name: agenda_topics
      label: Main Agenda Topics
      hint: What will be discussed?
      type: text
      options: []
      required: false
    - id: 17
      name: speakers_or_panelists
      label: Speakers or Panelists
      hint: Who will be speaking at the event?
      type: text
      options: []
      required: false
    - id: 18
      name: special_requirements
      label: Special Requirements or Accommodations
      hint: Any accessibility or special needs?
      type: text
      options: []
      required: false
    - id: 19
      name: contact_backup
      label: Backup Contact Person
      hint: Secondary contact information
      type: text
      options: []
      required: false
    - id: 20
      name: additional_notes
      label: Additional Information
      hint: Any other relevant details?
      type: text
      options: []
      required: false
