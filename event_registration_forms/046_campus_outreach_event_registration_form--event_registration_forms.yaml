inputSchema:
  type: object
  properties:
    title: Campus Outreach Event Registration Form
    pages:
    - id: 1
      name: section_attendee_info
      label: -- Attendee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: attendee_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: attendee_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: attendee_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: attendee_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: attendee_school
      label: School or University
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: attendee_status
      label: Current Status
      hint: null
      type: select_one
      options:
      - High School Student
      - College/University Student
      - Prospective Student
      - Parent/Guardian
      - Community Member
      - Other
      required: true
    - id: 8
      name: section_event_details
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: event_location
      label: Event Location or Building
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: section_interests
      label: -- Interests and Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: academic_interests
      label: Academic Interests or Major Areas
      hint: null
      type: select_multiple
      options:
      - Engineering
      - Business
      - Science
      - Arts and Humanities
      - Medicine and Health
      - Law
      - Education
      - Other
      required: false
    - id: 15
      name: program_sessions
      label: Sessions You Plan to Attend
      hint: null
      type: select_multiple
      options:
      - Opening Keynote
      - Campus Tour
      - Admissions Information
      - Student Panel
      - Lunch
      - Breakout Sessions
      - Closing Reception
      required: true
    - id: 16
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: For lunch or refreshments
      type: text
      options: []
      required: false
    - id: 17
      name: section_accessibility
      label: -- Accessibility and Accommodations --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: accessibility_needs
      label: Accessibility or Special Accommodations Needed
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: wheelchair_accessible
      label: Wheelchair accessibility required
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not applicable
      required: false
    - id: 20
      name: sign_language_interpreter
      label: Sign language interpreter needed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 21
      name: section_additional
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: how_heard
      label: How did you hear about this event
      hint: null
      type: select_one
      options:
      - Email
      - Social Media
      - Campus Poster
      - Teacher Referral
      - Friend Referral
      - Website
      - Other
      required: false
    - id: 23
      name: campus_visit_first
      label: Is this your first campus visit
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 24
      name: questions_comments
      label: Questions or Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: consent_communication
      label: I consent to receive future event notifications
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
