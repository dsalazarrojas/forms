inputSchema:
  type: object
  properties:
    title: Fundraising Event Permission Form
    pages:
    - id: 1
      name: event_name
      label: event name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: participant_name
      label: participant name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: guardian_permission
      label: guardian permission
      hint: null
      type: select_one
      options:
      - Participant permission is not obtained.
      - Participant permission is obtained.
      - Unable to obtain participant permission.
      required: true
    - id: 4
      name: participant_contact_info
      label: participant contact info
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: event_date
      label: event date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: event_time
      label: event time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: participant_permission_note
      label: participant permission note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: participant_permission_details
      label: participant permission details
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_person_name
      label: contact person name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: contact_person_phone
      label: contact person phone
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: participant_email
      label: participant email
      hint: null
      type: email
      options: []
      required: true
