inputSchema:
  type: object
  properties:
    title: Match Attendance Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: team_name
      label: Team Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: participant_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: participant_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: attendance_status
      label: Attendance Status
      hint: null
      type: select_one
      options:
      - Confirmed
      - Absent
      - Late
      required: true
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
