inputSchema:
  type: object
  properties:
    title: Community Center Workshop Enrollment Form
    pages:
    - id: 1
      name: participant_first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: participant_last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: For workshop communications
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Primary contact number
      type: text
      options: []
      required: true
    - id: 6
      name: address
      label: Street Address
      hint: Your home address
      type: text
      options: []
      required: true
    - id: 7
      name: city_state_zip
      label: City, State, ZIP
      hint: City, state, and ZIP code
      type: text
      options: []
      required: true
    - id: 8
      name: workshop_selection
      label: Workshop Selection
      hint: Which workshop would you like to attend?
      type: select_one
      options:
      - Digital Literacy Basics
      - Creative Writing
      - Photography Fundamentals
      - Cooking Classes
      - Financial Planning
      - Art and Painting
      - Yoga and Wellness
      - Public Speaking
      required: true
    - id: 9
      name: workshop_date
      label: Preferred Workshop Date
      hint: Select your preferred date
      type: date
      options: []
      required: true
    - id: 10
      name: experience_level
      label: Experience Level
      hint: What is your experience with this topic?
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: true
    - id: 11
      name: how_did_you_hear
      label: How Did You Hear About This Workshop
      hint: Where did you learn about this opportunity?
      type: select_one
      options:
      - Community Center Website
      - Social Media
      - Email Newsletter
      - Friend or Family
      - Flyer or Poster
      - Local Newspaper
      - Other
      required: false
    - id: 12
      name: accessibility_needs
      label: Accessibility Needs
      hint: Do you require any accommodations?
      type: text
      options: []
      required: false
    - id: 13
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: If refreshments are provided
      type: text
      options: []
      required: false
    - id: 14
      name: payment_method
      label: Payment Method
      hint: How will you pay for this workshop?
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Cash
      - Check
      - Scholarship
      - Waiver
      required: true
    - id: 15
      name: scholarship_needed
      label: Do You Need Financial Assistance
      hint: Scholarships available for those who qualify
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 16
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name of emergency contact
      type: text
      options: []
      required: true
    - id: 17
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number for emergency contact
      type: text
      options: []
      required: true
    - id: 18
      name: waiver_agreement
      label: Liability Waiver Agreement
      hint: I agree to the liability waiver terms
      type: select_one
      options:
      - Yes, I Agree
      - Other
      required: true
    - id: 19
      name: additional_comments
      label: Additional Comments or Questions
      hint: Anything else you would like us to know?
      type: text
      options: []
      required: false
