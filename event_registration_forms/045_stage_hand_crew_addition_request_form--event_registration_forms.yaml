      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: role
      label: Role
      hint: null
      type: select_one
      options:
      - Stagehand
      - Production Assistant
      - Sound Technician
      - Stage Manager
      - Event Coordinator
      - Volunteer
      required: true
    - id: 6
      name: crew_size
      label: Crew Size
      hint: null
      type: number
      options: []
      required: false
