      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: studio_name
      label: Studio Name
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: preferred_session
      label: Preferred Session
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: session_time
      label: Session Time
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: participant_notes
      label: Participant Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
