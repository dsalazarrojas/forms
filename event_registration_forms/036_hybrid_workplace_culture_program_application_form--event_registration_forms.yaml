      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Team-building''}'
      - '{''id'': 2, ''label'': ''Training''}'
      - '{''id'': 3, ''label'': ''Other''}'
      required: true
    - id: 5
      name: program_date
      label: Program Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: program_location
      label: Program Location
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: attendees
      label: Attendees
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''label'': ''Self''}'
      - '{''id'': 2, ''label'': ''Colleague''}'
      - '{''id'': 3, ''label'': ''Supervisor''}'
      - '{''id'': 4, ''label'': ''Other''}'
      required: false
    - id: 11
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''chatjimmy''}'
      - '{''id'': 2, ''label'': ''tony''}'
