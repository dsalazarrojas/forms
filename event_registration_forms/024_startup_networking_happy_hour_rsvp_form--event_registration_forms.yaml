      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: null
      type: select_multiple
      options:
      - Vegetarian
      - Non-vegetarian
      - Pescatarian
      required: false
    - id: 6
      name: arrival_time
      label: Arrival Time
      hint: null
      type: time
      options: []
      required: false
