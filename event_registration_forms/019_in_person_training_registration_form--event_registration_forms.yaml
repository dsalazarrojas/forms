inputSchema:
  type: object
  properties:
    title: In Person Training Registration Form
    pages:
    - id: 1
      name: training_session
      label: Training Session
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: training_location
      label: Training Location
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: training_date
      label: Training Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: training_time
      label: Training Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
