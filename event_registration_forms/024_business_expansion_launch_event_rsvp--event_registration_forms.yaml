inputSchema:
  type: object
  properties:
    title: Business Expansion Launch Event RSVP
    pages:
    - id: 1
      name: event_details
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_name
      label: Event Name
      hint: Name of the launch event
      type: text
      options: []
      required: true
    - id: 3
      name: event_date
      label: Event Date
      hint: Date of the event
      type: date
      options: []
      required: true
    - id: 4
      name: event_location
      label: Event Location
      hint: Where the event will be held
      type: text
      options: []
      required: true
    - id: 5
      name: attendee_info
      label: -- Attendee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: email_address
      label: Email Address
      hint: For event updates and confirmations
      type: email
      options: []
      required: true
    - id: 9
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: company_name
      label: Company Name
      hint: Your company or organization
      type: text
      options: []
      required: true
    - id: 11
      name: job_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: false
    - id: 12
      name: rsvp_section
      label: -- RSVP Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: will_attend
      label: Will you attend this event?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Maybe
      required: true
    - id: 14
      name: number_of_guests
      label: Number of guests (including yourself)
      hint: How many people will attend?
      type: number
      options: []
      required: true
    - id: 15
      name: guest_names
      label: Names of additional guests
      hint: List other attendees from your company
      type: text
      options: []
      required: false
    - id: 16
      name: dietary_section
      label: -- Dietary Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: dietary_restrictions
      label: Dietary restrictions
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Kosher
      - Halal
      - Other
      required: false
    - id: 18
      name: dietary_details
      label: Dietary details
      hint: Specify any restrictions for all guests
      type: text
      options: []
      required: false
    - id: 19
      name: sessions_section
      label: -- Session Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: interested_sessions
      label: Sessions you are interested in
      hint: Select all that apply
      type: select_multiple
      options:
      - Opening Keynote
      - Product Launch
      - Market Expansion Strategy
      - Networking Lunch
      - Case Studies
      - Q and A Panel
      required: false
    - id: 21
      name: logistics_section
      label: -- Logistics --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: transportation
      label: Do you need parking or transportation assistance?
      hint: null
      type: select_one
      options:
      - 'No'
      - Parking only
      - Shuttle service
      - Both
      required: false
    - id: 23
      name: accessibility_needs
      label: Accessibility accommodations needed
      hint: Do you require special accommodations?
      type: select_one
      options:
      - 'No'
      - Yes - please specify
      required: false
    - id: 24
      name: accessibility_details
      label: Accessibility details
      hint: Describe what you need
      type: text
      options: []
      required: false
    - id: 25
      name: communication_section
      label: -- Communication Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: preferred_contact
      label: Preferred contact method
      hint: How should we reach you?
      type: select_one
      options:
      - Email
      - Phone
      - Text Message
      required: false
    - id: 27
      name: additional_comments
      label: Additional comments or questions
      hint: Anything else we should know?
      type: text
      options: []
      required: false
