inputSchema:
  type: object
  properties:
    title: Sports Event Broadcasting Permission Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: media_outlet
      label: Media Outlet
      hint: null
      type: select_one
      options:
      - ABC News
      - CBS News
      - ESPN
      - Fox Sports
      - NBC News
      - Other (Specify)
      - The Sports Network
      required: true
    - id: 4
      name: consent_date
      label: Consent Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: broadcasting_details
      label: Broadcasting Details
      hint: Provide a brief description of the broadcasting details.
      type: text
      options: []
      required: false
    - id: 6
      name: photo_video_audio_permission
      label: Photo, Video, Audio Permission
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Undecided
      required: true
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: Any additional comments, questions, or concerns.
      type: text
      options: []
      required: false
