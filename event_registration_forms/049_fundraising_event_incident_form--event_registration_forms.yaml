inputSchema:
  type: object
  properties:
    title: Fundraising Event Incident Form
    pages:
    - id: 1
      name: event_organizer_id
      label: Event Organizer
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: incident_time
      label: Incident Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: incident_location
      label: Incident Location
      hint: null
      type: select_one
      options:
      - '{''option1'': ''Event Venue''}'
      - '{''option2'': ''Event Route''}'
      - '{''option3'': ''Other''}'
      required: false
    - id: 5
      name: incident_type
      label: Incident Type
      hint: null
      type: select_one
      options:
      - '{''option1'': ''Injury''}'
      - '{''option2'': ''Medical Issue''}'
      - '{''option3'': ''Property Damage''}'
      - '{''option4'': ''Other''}'
      required: false
    - id: 6
      name: incident_description
      label: Incident Description
      hint: Brief description of the incident
      type: text
      options: []
      required: false
    - id: 7
      name: action_taken
      label: Action Taken
      hint: null
      type: select_multiple
      options:
      - '{''option1'': ''First Aid''}'
      - '{''option2'': ''Medical Transport''}'
      - '{''option3'': ''Reporting to Authorities''}'
      - '{''option4'': ''Other''}'
      required: false
    - id: 8
      name: incident_reporter_id
      label: Incident Reporter
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
