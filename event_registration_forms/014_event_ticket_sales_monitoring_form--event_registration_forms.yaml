inputSchema:
  type: object
  properties:
    title: Event Ticket Sales Monitoring Form
    pages:
    - id: 1
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: ticket_type
      label: Ticket Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: ticket_price
      label: Ticket Price
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: ticket_sales
      label: Ticket Sales
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: attendee_info
      label: Attendee Information
      hint: null
      type: note
      options: []
      required: true
    - id: 7
      name: contact_person
      label: Contact Person
      hint: Enter contact person's phone number
      type: text
      options: []
      required: true
    - id: 8
      name: attendee_email
      label: Attendee Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: event_status
      label: Event Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: true
    - id: 10
      name: ticket_availability
      label: Ticket Availability
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
