inputSchema:
  type: object
  properties:
    title: Camping Ground Access Form
    pages:
    - id: 1
      name: section_visitor_info
      label: -- Visitor Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: visitor_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: visitor_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: visitor_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: visitor_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: visitor_id
      label: Valid Photo ID
      hint: null
      type: select_one
      options:
      - Driver License
      - State ID
      - Passport
      - Military ID
      - Other
      required: true
    - id: 7
      name: section_vehicle_info
      label: -- Vehicle Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: vehicle_make
      label: Vehicle Make
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: vehicle_model
      label: Vehicle Model
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: vehicle_year
      label: Vehicle Year
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: vehicle_license_plate
      label: License Plate Number
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: vehicle_color
      label: Vehicle Color
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: vehicle_type
      label: Vehicle Type
      hint: null
      type: select_one
      options:
      - Car
      - Truck
      - Van
      - RV
      - Motorcycle
      - Other
      required: true
    - id: 14
      name: section_visit_details
      label: -- Visit Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: access_date
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: true
    - id: 16
      name: access_time
      label: Estimated Time of Arrival
      hint: null
      type: time
      options: []
      required: true
    - id: 17
      name: visit_duration
      label: Length of Stay
      hint: null
      type: select_one
      options:
      - Less than 4 hours
      - 4-8 hours
      - 1-2 days
      - 3-7 days
      - 1-4 weeks
      - Monthly pass
      required: true
    - id: 18
      name: number_of_occupants
      label: Number of Occupants in Vehicle
      hint: null
      type: number
      options: []
      required: true
    - id: 19
      name: section_campsite
      label: -- Campsite Assignment --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: campsite_number
      label: Campsite Number or Site Name
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: reservation_confirmation
      label: Reservation Confirmation Number
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: section_acknowledgment
      label: -- Acknowledgment and Agreement --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: rules_agreement
      label: I agree to abide by campground rules and regulations
      hint: null
      type: select_one
      options:
      - Yes, I agree
      - false
      required: true
    - id: 24
      name: safety_acknowledgment
      label: I understand and accept all safety requirements
      hint: null
      type: select_one
      options:
      - Yes, I understand
      - false
      required: true
    - id: 25
      name: liability_waiver
      label: I acknowledge the liability waiver and terms
      hint: null
      type: select_one
      options:
      - Yes, I acknowledge
      - false
      required: true
