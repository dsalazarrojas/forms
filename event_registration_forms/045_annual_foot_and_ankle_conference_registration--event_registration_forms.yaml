inputSchema:
  type: object
  properties:
    title: Annual Foot And Ankle Conference Registration
    pages:
    - id: 1
      name: attendee_info_header
      label: -- Attendee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: For conference communications
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: professional_info_header
      label: -- Professional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: profession
      label: Professional Title or Role
      hint: Your position or specialty
      type: select_one
      options:
      - Podiatrist
      - Orthopedic Surgeon
      - Physician Assistant
      - Nurse Practitioner
      - Physical Therapist
      - Athletic Trainer
      - Medical Student
      - Resident or Fellow
      - Healthcare Administrator
      - Other Healthcare Professional
      required: true
    - id: 8
      name: facility_name
      label: Facility or Hospital Name
      hint: Your workplace
      type: text
      options: []
      required: false
    - id: 9
      name: specialty
      label: Specialty or Sub-specialty
      hint: Your area of focus
      type: text
      options: []
      required: false
    - id: 10
      name: years_experience
      label: Years of Professional Experience
      hint: How long in your field
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - 10-20 years
      - 20+ years
      required: false
    - id: 11
      name: registration_header
      label: -- Conference Registration --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: registration_type
      label: Registration Type
      hint: Select your registration package
      type: select_one
      options:
      - Full Conference (3 days)
      - 2-Day Registration
      - 1-Day Registration
      - Single Session Pass
      - Virtual Attendance
      required: true
    - id: 13
      name: conference_dates
      label: Conference Dates
      hint: Which dates will you attend
      type: select_multiple
      options:
      - Day 1 - Opening Keynote and Sessions
      - Day 2 - Advanced Workshops
      - Day 3 - Case Studies and Networking
      required: false
    - id: 14
      name: workshop_header
      label: -- Workshop Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: workshop_interests
      label: Workshop Topics of Interest
      hint: Select sessions you want to attend
      type: select_multiple
      options:
      - Diabetic Foot Care
      - Surgical Innovations
      - Sports Medicine and Injuries
      - Pediatric Foot Problems
      - Wound Care Management
      - Advanced Imaging
      - Pharmacological Treatments
      - Preventive Care Strategies
      required: false
    - id: 16
      name: meals_header
      label: -- Meals and Dining --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: meal_plan
      label: Meal Plan Option
      hint: Include meals with registration
      type: select_one
      options:
      - Include all meals
      - Breakfast and lunch only
      - Lunch only
      - No meals included
      required: true
    - id: 18
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Any food allergies or preferences
      type: text
      options: []
      required: false
    - id: 19
      name: accommodation_header
      label: -- Hotel Accommodation --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: accommodation_needed
      label: Hotel Accommodation Needed
      hint: Do you need hotel arrangements
      type: select_one
      options:
      - Yes, book hotel for me
      - No, arranging own accommodation
      - Unsure
      required: true
    - id: 21
      name: accommodation_nights
      label: Number of Nights Needed
      hint: How many nights you need hotel
      type: number
      options: []
      required: false
    - id: 22
      name: room_type
      label: Room Type Preference
      hint: Single or double room
      type: select_one
      options:
      - Single Room
      - Double Room
      - Suite
      - No preference
      required: false
    - id: 23
      name: payment_header
      label: -- Payment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: payment_method
      label: Payment Method
      hint: How you will pay
      type: select_one
      options:
      - Credit Card
      - Check
      - Bank Transfer
      - Purchase Order
      - Other
      required: true
    - id: 25
      name: special_requests
      label: Special Requests or Additional Information
      hint: Any other needs or questions
      type: text
      options: []
      required: false
