inputSchema:
  type: object
  properties:
    title: Event Seating Arrangement Form
    pages:
    - id: 1
      name: event_seating_arrangement_form
      label: Event Seating Arrangement Form
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_type
      label: event_type
      hint: null
      type: select_one
      options:
      - wedding
      - conference
      - festival
      required: false
    - id: 3
      name: number_of_guests
      label: number_of_guests
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: seating_arrangement
      label: seating_arrangement
      hint: null
      type: select_multiple
      options:
      - round table
      - rectangular table
      - buffet
      required: false
    - id: 5
      name: table_size
      label: table_size
      hint: null
      type: select_one
      options:
      - small
      - large
      - extra large
      required: false
    - id: 6
      name: table_layout
      label: table_layout
      hint: null
      type: select_multiple
      options:
      - linear
      - u shaped
      - horseshoe
      required: true
    - id: 7
      name: seat_position
      label: seat_position
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: tablecloth
      label: tablecloth
      hint: null
      type: select_one
      options:
      - white
      - black
      - red
      required: false
    - id: 9
      name: chair_type
      label: chair_type
      hint: null
      type: select_one
      options:
      - standard
      - vip
      - wheelchair accessible
      required: false
    - id: 10
      name: tablecloth_type
      label: tablecloth_type
      hint: null
      type: select_one
      options:
      - plain
      - lace
      - flowers
      required: false
