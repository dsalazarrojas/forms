inputSchema:
  type: object
  properties:
    title: Photography Release Consent Form
    pages:
    - id: 1
      name: client_consent
      label: Client Consent
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Undecided
      required: true
    - id: 2
      name: event_details
      label: Event Details
      hint: Briefly describe the event
      type: text
      options: []
      required: true
    - id: 3
      name: photographer_info
      label: Photographer's Information
      hint: Provide your name, email, and contact number
      type: text
      options: []
      required: true
    - id: 4
      name: contact_info
      label: Contact Information
      hint: Provide a valid phone number and email
      type: text
      options: []
      required: true
    - id: 5
      name: photo_release_consent
      label: Photo Release Consent
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: photo_usage_rights
      label: Photo Usage Rights
      hint: null
      type: select_multiple
      options:
      - Print
      - Web
      - Social Media
      - Email
      - Other
      required: true
    - id: 7
      name: photo_credit_line
      label: Photo Credit Line
      hint: Include your name and role
      type: text
      options: []
      required: true
    - id: 8
      name: photographer_contact_number
      label: Photographer's Contact Number
      hint: A valid phone number
      type: text
      options: []
      required: true
    - id: 9
      name: email
      label: Email
      hint: A valid email address
      type: email
      options: []
      required: true
    - id: 10
      name: event_date
      label: Event Date
      hint: YYYY-MM-DD
      type: date
      options: []
      required: true
    - id: 11
      name: event_time
      label: Event Time
      hint: HH -MM
      type: time
      options: []
      required: true
    - id: 12
      name: event_location
      label: Event Location
      hint: Provide the venue name and address
      type: text
      options: []
      required: true
    - id: 13
      name: event_description
      label: Event Description
      hint: Briefly describe the event
      type: text
      options: []
      required: true
    - id: 14
      name: date_taken
      label: Date Taken
      hint: YYYY-MM-DD
      type: date
      options: []
      required: true
    - id: 15
      name: time_taken
      label: Time Taken
      hint: HH -MM
      type: time
      options: []
      required: true
    - id: 16
      name: photographer_info_2
      label: Photographer's Information (Additional)
      hint: Provide any additional details
      type: text
      options: []
      required: true
    - id: 17
      name: photo_credit_line_2
      label: Photo Credit Line 2
      hint: Include your name and role
      type: text
      options: []
      required: true
    - id: 18
      name: photographer_contact
      label: Photographer's Contact
      hint: A valid phone number
      type: text
      options: []
      required: true
