inputSchema:
  type: object
  properties:
    title: Asset Risk Evaluation Workshop Registration
    pages:
    - id: 1
      name: participant_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: participant_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: Your organization
      type: text
      options: []
      required: true
    - id: 6
      name: job_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: true
    - id: 7
      name: industry_sector
      label: Industry Sector
      hint: What industry do you work in?
      type: select_one
      options:
      - Financial Services
      - Insurance
      - Technology
      - Manufacturing
      - Real Estate
      - Healthcare
      - Consulting
      - Other
      required: true
    - id: 8
      name: experience_level
      label: Experience Level with Asset Risk
      hint: Your background and expertise
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Expert
      required: true
    - id: 9
      name: workshop_session
      label: Preferred Workshop Session
      hint: Which session works best?
      type: select_one
      options:
      - Morning Session 9am - 12pm
      - Afternoon Session 1pm - 4pm
      - Full Day Workshop
      required: true
    - id: 10
      name: workshop_date
      label: Workshop Date
      hint: Preferred date
      type: date
      options: []
      required: true
    - id: 11
      name: primary_interest_areas
      label: Primary Interest Areas
      hint: Select all that apply
      type: select_multiple
      options:
      - Property Risk Assessment
      - Equipment Valuation
      - Risk Mitigation Strategies
      - Insurance Optimization
      - Compliance and Documentation
      - Legal Issues
      required: true
    - id: 12
      name: learning_objectives
      label: Your Learning Objectives
      hint: What do you hope to learn?
      type: text
      options: []
      required: true
    - id: 13
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Any dietary needs for meals?
      type: select_one
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-free
      - Other
      required: false
    - id: 14
      name: accessibility_needs
      label: Accessibility or Accommodation Needs
      hint: Any special requirements?
      type: text
      options: []
      required: false
    - id: 15
      name: team_members
      label: Number of Team Members Attending
      hint: How many from your organization?
      type: number
      options: []
      required: true
    - id: 16
      name: prior_workshop_attendance
      label: Have you attended our workshops before?
      hint: Yes or no
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 17
      name: referring_organization
      label: How did you hear about this workshop?
      hint: Source of referral
      type: select_one
      options:
      - Email Newsletter
      - Website
      - Professional Network
      - LinkedIn
      - Colleague Referral
      - Search Engine
      - Other
      required: true
    - id: 18
      name: registration_type
      label: Registration Type
      hint: Individual or group rate?
      type: select_one
      options:
      - Individual
      - Group Rate (3+)
      - Corporate
      - Non-profit
      required: true
    - id: 19
      name: payment_method
      label: Payment Method
      hint: How will you pay?
      type: select_one
      options:
      - Credit Card
      - Bank Transfer
      - Check
      - Purchase Order
      required: true
    - id: 20
      name: additional_comments
      label: Additional Comments or Questions
      hint: Anything else we should know?
      type: text
      options: []
      required: false
    - id: 21
      name: terms_agreement
      label: I agree to the workshop terms and conditions
      hint: Check to confirm
      type: select_one
      options:
      - I Agree
      - Other
      required: true
    - id: 22
      name: registration_date
      label: Registration Date
      hint: Date of registration
      type: date
      options: []
      required: true
