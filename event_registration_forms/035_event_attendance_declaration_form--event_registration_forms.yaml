inputSchema:
  type: object
  properties:
    title: Event Attendance Declaration Form
    pages:
    - id: 1
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: time_arrived
      label: Time Arrived
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: event_attendance_type
      label: Event Attendance Type
      hint: Choose one or many
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 4
      name: attendee_name
      label: Attendee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: attendee_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: attendee_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: team_name
      label: Team Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: team_lead
      label: Team Lead
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: team_size
      label: Team Size
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: event_details
      label: Event Details
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: event_status
      label: Event Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Pending
      required: false
    - id: 14
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - Tool 1
      - Tool 2
      - Tool 3
      required: false
