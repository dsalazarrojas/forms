inputSchema:
  type: object
  properties:
    title: Volunteer Duty Checklist
    pages:
    - id: 1
      name: volunteer_details
      label: What time do you usually start and finish your day?
      hint: null
      type: time
      options: []
      required: true
    - id: 2
      name: event_status
      label: Are you available to volunteer for this event?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: contact_email
      label: Please enter your email address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Do you have a landline phone number?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: event_type
      label: What type of event is this?
      hint: null
      type: select_one
      options:
      - Event type 1
      - Event type 2
      - Event type 3
      required: true
    - id: 6
      name: contact_preferences
      label: How would you like to be contacted?
      hint: null
      type: select_multiple
      options:
      - Email
      - SMS
      - Phone
      required: true
    - id: 7
      name: event_date
      label: Event start date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: event_details
      label: What details do you want to include about the event?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: volunteer_role
      label: What type of volunteer role are you interested in?
      hint: null
      type: select_multiple
      options:
      - Role 1
      - Role 2
      - Role 3
      required: true
    - id: 10
      name: communication_updates
      label: Do you want to receive email updates?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: communication_sms
      label: Do you want to receive SMS updates?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
