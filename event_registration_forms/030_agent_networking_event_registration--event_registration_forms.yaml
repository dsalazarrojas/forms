inputSchema:
  type: object
  properties:
    title: Agent Networking Event Registration
    pages:
    - id: 1
      name: attendee_full_name
      label: Attendee Full Name
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 2
      name: attendee_email
      label: Attendee Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 3
      name: attendee_phone
      label: Attendee Phone
      hint: Enter your phone number
      type: text
      options: []
      required: true
    - id: 4
      name: professional_title
      label: Professional Title
      hint: Enter your job title
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: Enter the name of your company
      type: text
      options: []
      required: true
    - id: 6
      name: industry_sector
      label: Industry Sector
      hint: Select your industry sector
      type: select_one
      options:
      - Real Estate
      - Insurance
      - Sales
      - Finance
      - Marketing
      - Technology
      - Healthcare
      - Legal
      - Other
      required: true
    - id: 7
      name: business_specialization
      label: Business Specialization
      hint: Describe your area of specialization
      type: text
      options: []
      required: true
    - id: 8
      name: networking_goals_header
      label: -- Networking Goals --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: networking_objectives
      label: Networking Objectives
      hint: What are your primary objectives for attending this event?
      type: select_multiple
      options:
      - Find Potential Clients
      - Build Professional Relationships
      - Learn About Industry Trends
      - Explore Partnership Opportunities
      - Share Expertise
      - Recruit Talent
      - Promote Services
      required: true
    - id: 10
      name: experience_level
      label: Experience Level
      hint: How many years of experience do you have in your field?
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 4-7 years
      - 8-15 years
      - More than 15 years
      required: true
    - id: 11
      name: event_information_header
      label: -- Event Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: event_name
      label: Event Name
      hint: Enter the name of the event you're registering for
      type: text
      options: []
      required: true
    - id: 13
      name: event_date
      label: Event Date
      hint: Enter the date of the event
      type: date
      options: []
      required: true
    - id: 14
      name: event_location
      label: Event Location
      hint: Enter the location of the event
      type: text
      options: []
      required: true
    - id: 15
      name: attendance_type
      label: Attendance Type
      hint: How will you attend the event?
      type: select_one
      options:
      - In-Person
      - Virtual
      - Hybrid
      required: true
    - id: 16
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Do you have any dietary restrictions or preferences?
      type: text
      options: []
      required: false
    - id: 17
      name: special_accommodations
      label: Special Accommodations
      hint: Do you require any special accommodations?
      type: text
      options: []
      required: false
    - id: 18
      name: communication_consent_header
      label: -- Communication Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: contact_consent
      label: Contact Consent
      hint: Do you consent to being contacted by other attendees after the event?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 20
      name: newsletter_subscription
      label: Newsletter Subscription
      hint: Would you like to subscribe to our newsletter for future events?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 21
      name: social_media_connect
      label: Social Media Connection
      hint: Would you like to connect with other attendees on social media?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 22
      name: additional_comments
      label: Additional Comments
      hint: Any additional information you'd like to share
      type: text
      options: []
      required: false
