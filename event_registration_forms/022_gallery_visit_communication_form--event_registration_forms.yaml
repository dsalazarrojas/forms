inputSchema:
  type: object
  properties:
    title: Gallery Visit Communication Form
    pages:
    - id: 1
      name: visitor_feedback
      label: Visitor Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: appointment_request
      label: Appointment Request
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 3
      name: contact_info
      label: Contact Information
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: email_address
      label: Email Address
      hint: Enter your email address
      type: email
      options: []
      required: false
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date_time
      label: Date and Time
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: art_piece
      label: Art Piece
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: art_piece_description
      label: Art Piece Description
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: visitor_type
      label: Visitor Type
      hint: null
      type: select_one
      options:
      - Gallery Staff
      - Gallery Visitor
      - Gallery Volunteer
      required: false
    - id: 11
      name: event_attend
      label: Event Attend
      hint: null
      type: select_one
      options:
      - Event 1
      - Event 2
      - Event 3
      required: false
    - id: 12
      name: visit_frequency
      label: Visit Frequency
      hint: null
      type: select_one
      options:
      - Once
      - Multiple
      - Regular
      required: false
