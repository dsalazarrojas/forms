      name: guest_response
      label: Guest Response
      hint: For RSVP
      type: note
      options: []
      required: false
    - id: 33
      name: guest_name
      label: Guest Name
      hint: Who is responding
      type: text
      options: []
      required: false
    - id: 34
      name: will_attend
      label: Will you attend the christening
      hint: null
      type: select_one
      options:
      - Yes, with joy
      - No, regretfully cannot attend
      - Maybe, will confirm later
      required: false
    - id: 35
      name: number_of_guests
      label: Number of Guests Attending
      hint: Including yourself
      type: number
      options: []
      required: false
    - id: 36
      name: attending_ceremony
      label: Will you attend the ceremony
      hint: null
      type: select_one
      options:
      - true
      - false
      - Reception only
      required: false
    - id: 37
      name: attending_reception
      label: Will you attend the reception
      hint: null
      type: select_one
      options:
      - true
      - false
      - Ceremony only
      required: false
    - id: 38
      name: dietary_requirements
      label: Dietary Requirements
      hint: For reception
      type: text
      options: []
      required: false
    - id: 39
      name: song_requests
      label: Song Requests or Dedications
      hint: Optional
      type: text
      options: []
      required: false
    - id: 40
      name: invitation_customization
      label: Invitation Customization
      hint: Personal touches
      type: note
      options: []
      required: false
    - id: 41
      name: invitation_style
      label: Invitation Style Preference
      hint: null
      type: select_one
      options:
      - Traditional
      - Modern
      - Religious
      - Simple
      - Elegant
      - Playful
      required: false
    - id: 42
      name: preferred_colors
      label: Preferred Colors
      hint: null
      type: text
      options: []
      required: false
    - id: 43
      name: include_photo
      label: Will you include a photo of the child
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 44
      name: special_message
      label: Special Message or Verse
      hint: For the invitation
      type: text
      options: []
      required: false
    - id: 45
      name: additional_information
      label: Additional Information
      hint: For guests
      type: note
      options: []
      required: false
    - id: 46
      name: dress_code
      label: Dress Code
      hint: If any
      type: text
      options: []
      required: false
    - id: 47
      name: parking_information
      label: Parking Information
      hint: For guests
      type: text
      options: []
      required: false
    - id: 48
      name: accommodation_info
      label: Accommodation Information
      hint: For out-of-town guests
      type: text
      options: []
      required: false
    - id: 49
      name: gift_preferences
      label: Gift Preferences
      hint: If you want to specify
      type: text
      options: []
      required: false
    - id: 50
      name: additional_notes
      label: Additional Notes for Guests
      hint: null
      type: text
      options: []
      required: false
    - id: 51
      name: parent_signature
      label: Parent Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 52
      name: invitation_date
      label: Date of Invitation
      hint: null
      type: date
      options: []
      required: true
