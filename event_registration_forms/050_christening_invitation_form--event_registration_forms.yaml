inputSchema:
  type: object
  properties:
    title: Christening Invitation Form
    pages:
    - id: 1
      name: child_information
      label: Child Information
      hint: About the child being christened
      type: note
      options: []
      required: false
    - id: 2
      name: child_first_name
      label: Child's First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: child_middle_name
      label: Child's Middle Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: child_last_name
      label: Child's Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: child_date_of_birth
      label: Child's Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: child_gender
      label: Child's Gender
      hint: null
      type: select_one
      options:
      - Boy
      - Girl
      required: true
    - id: 7
      name: parents_information
      label: Parents Information
      hint: Host details
      type: note
      options: []
      required: false
    - id: 8
      name: parent_first_name_1
      label: First Parent's First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: parent_last_name_1
      label: First Parent's Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: parent_first_name_2
      label: Second Parent's First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: parent_last_name_2
      label: Second Parent's Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: family_name
      label: Family Name
      hint: For invitation heading
      type: text
      options: []
      required: true
    - id: 13
      name: ceremony_details
      label: Ceremony Details
      hint: Event information
      type: note
      options: []
      required: false
    - id: 14
      name: ceremony_date
      label: Ceremony Date
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: ceremony_time
      label: Ceremony Time
      hint: null
      type: time
      options: []
      required: true
