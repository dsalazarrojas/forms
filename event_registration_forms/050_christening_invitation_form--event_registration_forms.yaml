      name: reception_details
      label: Reception Details
      hint: After ceremony
      type: note
      options: []
      required: false
    - id: 20
      name: reception_held
      label: Will there be a reception
      hint: null
      type: select_one
      options:
      - Yes, immediately after
      - Yes, at a later time
      - No reception
      required: true
    - id: 21
      name: reception_location
      label: Reception Location
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: reception_address
      label: Reception Address
      hint: Full address
      type: text
      options: []
      required: false
    - id: 23
      name: reception_time
      label: Reception Time
      hint: null
      type: time
      options: []
      required: false
    - id: 24
      name: godparents_information
      label: Godparents Information
      hint: If applicable
      type: note
      options: []
      required: false
    - id: 25
      name: have_godparents
      label: Will the child have godparents
      hint: null
      type: select_one
      options:
      - true
      - false
      - To be determined
      required: false
    - id: 26
      name: godparent_names
      label: Godparent Names
      hint: If known
      type: text
      options: []
      required: false
    - id: 27
      name: rsvp_information
      label: RSVP Information
      hint: Response details
      type: note
      options: []
      required: false
    - id: 28
      name: rsvp_required
      label: Is RSVP Required
      hint: null
      type: select_one
      options:
      - true
      - false
      - Optional
      required: true
    - id: 29
      name: rsvp_deadline
      label: RSVP Deadline
      hint: null
      type: date
      options: []
      required: false
    - id: 30
      name: rsvp_contact
      label: RSVP Contact
      hint: Name and phone or email
      type: text
      options: []
      required: false
    - id: 31
      name: rsvp_method
      label: Preferred RSVP Method
      hint: null
      type: select_one
      options:
      - Phone call
      - Text message
      - Email
      - Online form
      - Mail
      required: false
