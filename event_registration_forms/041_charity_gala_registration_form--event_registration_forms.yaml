inputSchema:
  type: object
  properties:
    title: Charity Gala Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: organization
      label: Organization or Company
      hint: Business name
      type: text
      options: []
      required: false
    - id: 6
      name: gala_name
      label: Gala Event
      hint: Which gala
      type: text
      options: []
      required: true
    - id: 7
      name: gala_date
      label: Gala Date
      hint: Event date
      type: date
      options: []
      required: true
    - id: 8
      name: ticket_type
      label: Ticket Type
      hint: Admission level
      type: select_one
      options:
      - Individual seat
      - Couple seats
      - Table of 10
      - VIP table
      - Sponsor table
      required: true
    - id: 9
      name: number_of_guests
      label: Number of Guests
      hint: Total attendees
      type: number
      options: []
      required: true
    - id: 10
      name: guest_names
      label: Guest Names
      hint: List all attendees
      type: text
      options: []
      required: false
    - id: 11
      name: dietary_requirements
      label: Dietary Requirements
      hint: Restrictions or allergies
      type: select_multiple
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-free
      - Dairy-free
      - Nut allergy
      - Halal
      - Kosher
      - Other
      required: true
    - id: 12
      name: table_preference
      label: Table Preference
      hint: Seating request
      type: text
      options: []
      required: false
    - id: 13
      name: auction_interest
      label: Interested in Auction
      hint: Participation
      type: select_one
      options:
      - Yes definitely
      - Maybe
      - false
      required: true
    - id: 14
      name: donation_add_on
      label: Additional Donation
      hint: Support the cause
      type: select_one
      options:
      - No donation
      - $50
      - $100
      - $250
      - $500
      - $1000
      - Other amount
      required: false
    - id: 15
      name: payment_method
      label: Payment Method
      hint: How to pay
      type: select_one
      options:
      - Credit card
      - Debit card
      - PayPal
      - Bank transfer
      - Check
      - Invoice request
      required: true
    - id: 16
      name: accessibility_needs
      label: Accessibility Needs
      hint: Accommodations
      type: text
      options: []
      required: false
    - id: 17
      name: how_heard
      label: How Did You Hear About This Gala
      hint: Marketing source
      type: select_one
      options:
      - Email invitation
      - Social media
      - Website
      - Friend or colleague
      - Print media
      - Other
      required: false
    - id: 18
      name: terms_agreement
      label: Do You Agree to Terms
      hint: Cancellation policy
      type: select_one
      options:
      - Yes I agree
      - No I do not agree
      required: true
