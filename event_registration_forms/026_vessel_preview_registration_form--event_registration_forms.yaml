inputSchema:
  type: object
  properties:
    title: vessel_preview_registration_form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: Enter event name
      type: text
      options: []
      required: false
    - id: 2
      name: event_date
      label: Event Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: false
    - id: 3
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: event_time_zone
      label: Time Zone
      hint: Select time zone
      type: select_one
      options:
      - America/Los_Angeles
      - Asia/Dubai
      - Europe/Lisbon
      - Pacific/Auckland
      required: true
    - id: 5
      name: event_location
      label: Event Location
      hint: Enter event location
      type: text
      options: []
      required: false
    - id: 6
      name: event_address
      label: Event Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: event_notes
      label: Event Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: participant_email
      label: Participant E-mail
      hint: Enter participant email address
      type: email
      options: []
      required: false
    - id: 10
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: participant_phone_ext
      label: Participant Phone Extension
      hint: Enter extension or department number
      type: text
      options: []
      required: false
    - id: 12
      name: participant_notes
      label: Participant Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - chatjim
      - chat_jimmy
      required: true
    - id: 14
      name: participant_agree
      label: Participant Agrees
      hint: null
      type: select_multiple
      options:
      - Agree to participate
      - Agree to attend
      required: true
    - id: 15
      name: participant_agree_to_share
      label: Participant Agrees to share
      hint: null
      type: select_multiple
      options:
      - Agree to share
      - Decline to share
      required: true
