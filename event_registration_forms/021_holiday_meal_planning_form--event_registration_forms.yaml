inputSchema:
  type: object
  properties:
    title: holiday_meal_planning_form
    pages:
    - id: 1
      name: meal_preferences
      label: What type of meal are you interested in
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: dietary_restrictions
      label: Do you have any dietary restrictions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: number_of_guests
      label: Number of guests attending
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: date_of_event
      label: Date of event
      hint: null
      type: date
      options: []
      required: false
