inputSchema:
  type: object
  properties:
    title: Donor Breakfast Meeting Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Breakfast
      - Lunch
      - Dinner
      required: false
    - id: 6
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: null
      type: select_multiple
      options:
      - vegetarian
      - vegan
      - gluten-free
      - dairy-free
      required: false
    - id: 7
      name: attendance_date
      label: Attendance Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: attendance_time
      label: Attendance Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
