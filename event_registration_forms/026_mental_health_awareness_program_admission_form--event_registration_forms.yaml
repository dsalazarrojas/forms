inputSchema:
  type: object
  properties:
    title: Mental Health Awareness Program Admission Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: consent_form
      label: Consent Form
      hint: null
      type: select_one
      options:
      - I have read and understand the terms of the mental health program.
      - I have not read and do not understand the terms of the mental health program.
      required: false
    - id: 6
      name: emergency_contact_first_name
      label: Emergency Contact First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: emergency_contact_last_name
      label: Emergency Contact Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: null
      type: select_multiple
      options:
      - Parent
      - Friend
      - Other
      required: false
    - id: 9
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
