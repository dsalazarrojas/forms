inputSchema:
  type: object
  properties:
    title: Six Sigma Training Registration Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: participant_email
      label: participant_email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: participant_company
      label: Participant Company
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: participant_job_title
      label: Participant Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: training_program
      label: Training Program
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: training_date
      label: Training Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: training_time
      label: Training Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: training_location
      label: Training Location
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: participant_notes
      label: Participant Notes
      hint: null
      type: note
      options: []
      required: false
