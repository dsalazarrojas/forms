inputSchema:
  type: object
  properties:
    title: Banquet Hall Inquiry Form
    pages:
    - id: 1
      name: inquirer_full_name
      label: Full Name
      hint: Your name
      type: text
      options: []
      required: true
    - id: 2
      name: inquirer_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: inquirer_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 4
      name: organization
      label: Organization
      hint: Company or group
      type: text
      options: []
      required: false
    - id: 5
      name: event_type
      label: Event Type
      hint: What kind of event
      type: select_one
      options:
      - Wedding Reception
      - Corporate Event
      - Birthday Party
      - Anniversary
      - Graduation
      - Holiday Party
      - Fundraiser
      - Quinceanera
      - Baby Shower
      - Other
      required: true
    - id: 6
      name: event_name
      label: Event Name
      hint: Event title
      type: text
      options: []
      required: false
    - id: 7
      name: preferred_date
      label: Preferred Date
      hint: First choice
      type: date
      options: []
      required: true
    - id: 8
      name: alternate_date
      label: Alternate Date
      hint: Backup date
      type: date
      options: []
      required: false
    - id: 9
      name: event_start_time
      label: Event Start Time
      hint: Begin time
      type: time
      options: []
      required: true
    - id: 10
      name: event_end_time
      label: Event End Time
      hint: End time
      type: time
      options: []
      required: true
    - id: 11
      name: expected_guests
      label: Expected Number of Guests
      hint: Headcount
      type: number
      options: []
      required: true
    - id: 12
      name: guest_count_range
      label: Guest Count Range
      hint: Approximate size
      type: select_one
      options:
      - Under 50
      - 50-100
      - 100-200
      - 200-300
      - 300-500
      - Over 500
      required: true
    - id: 13
      name: room_preference
      label: Room Preference
      hint: Which hall
      type: select_one
      options:
      - Grand Ballroom
      - Main Hall
      - Garden Room
      - Terrace Room
      - Private Dining
      - No Preference
      required: false
    - id: 14
      name: catering_needed
      label: Catering Needed
      hint: Do you need food service
      type: select_one
      options:
      - Yes, full catering
      - Yes, appetizers only
      - Yes, dessert only
      - No, external caterer
      - No catering needed
      required: true
    - id: 15
      name: bar_service
      label: Bar Service
      hint: Alcohol service
      type: select_one
      options:
      - Full Bar
      - Beer and Wine Only
      - Cash Bar
      - No Alcohol
      - Undecided
      required: false
    - id: 16
      name: setup_style
      label: Setup Style
      hint: Seating arrangement
      type: select_one
      options:
      - Round Tables
      - Long Tables
      - Theater Style
      - Classroom Style
      - Cocktail Style
      - Undecided
      required: false
    - id: 17
      name: audio_visual_requirements
      label: Audio Visual Requirements
      hint: Equipment needed
      type: select_multiple
      options:
      - Microphone
      - Projector
      - Screen
      - Sound System
      - Lighting
      - Stage
      - WiFi
      - None
      required: false
    - id: 18
      name: decoration_policy
      label: Decoration Policy
      hint: Will you decorate
      type: select_one
      options:
      - Yes, will decorate
      - Yes, with coordinator help
      - No, venue to decorate
      - Undecided
      required: false
    - id: 19
      name: budget_range
      label: Budget Range
      hint: Estimated budget
      type: select_one
      options:
      - Under $2500
      - $2500-$5000
      - $5000-$10000
      - $10000-$25000
      - $25000-$50000
      - Over $50000
      required: false
    - id: 20
      name: parking_requirements
      label: Parking Requirements
      hint: Parking needs
      type: select_one
      options:
      - Standard Parking
      - Valet Parking
      - Shuttle Service
      - No Special Needs
      required: false
    - id: 21
      name: accessibility_needs
      label: Accessibility Needs
      hint: Special accommodations
      type: select_multiple
      options:
      - Wheelchair Access
      - Elevator Access
      - Accessible Restrooms
      - Sign Language Interpreter
      - None
      required: false
    - id: 22
      name: how_heard_about
      label: How Did You Hear About Us
      hint: Marketing source
      type: select_one
      options:
      - Website
      - Social Media
      - Friend or Family
      - Wedding Planner
      - Advertisement
      - Drive By
      - Other
      required: false
    - id: 23
      name: tour_requested
      label: Tour Requested
      hint: Want to visit
      type: select_one
      options:
      - Yes, schedule tour
      - No, not needed
      - Maybe
      required: true
    - id: 24
      name: preferred_tour_date
      label: Preferred Tour Date
      hint: When to visit
      type: date
      options: []
      required: false
    - id: 25
      name: additional_questions
      label: Additional Questions
      hint: What else do you want to know
      type: text
      options: []
      required: false
    - id: 26
      name: special_requests
      label: Special Requests
      hint: Any requirements
      type: text
      options: []
      required: false
    - id: 27
      name: best_time_to_contact
      label: Best Time to Contact
      hint: When to reach you
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Weekend
      - Anytime
      required: false
