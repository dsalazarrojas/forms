inputSchema:
  type: object
  properties:
    title: Church Event RSVP Lead Form
    pages:
    - id: 1
      name: header_rsvp_status
      label: -- RSVP Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: rsvp_confirmation_status
      label: Will you be attending?
      hint: null
      type: select_one
      options:
      - Yes - I'll be there
      - No - Cannot attend
      - Maybe - Remind me later
      required: true
    - id: 3
      name: attendee_name_lead
      label: Your Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email_lead
      label: Your Email
      hint: For event details and reminders
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number_lead
      label: Phone Number (Optional)
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: header_party_info
      label: -- Your Party --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: total_guests_in_party
      label: Total number of people in your party
      hint: Including yourself
      type: number
      options: []
      required: true
    - id: 8
      name: guest_names_and_ages
      label: Names of others in your party
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: header_preferences_rsvp
      label: -- Preferences and Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: dietary_needs_rsvp
      label: Any dietary restrictions or allergies in your party?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: mobility_concerns
      label: Do you or anyone in your party have mobility concerns?
      hint: e.g., Wheelchair access, elevator needed
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 12
      name: hear_about_event_rsvp
      label: How did you hear about this event?
      hint: null
      type: select_one
      options:
      - Email
      - Social Media
      - Website
      - Word of Mouth
      - Announcement
      required: false
    - id: 13
      name: question_for_organizers
      label: Do you have a question for the organizers?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: rsvp_submission_timestamp
      label: Date of RSVP
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: future_outreach_consent
      label: Keep me informed of future church events
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
