inputSchema:
  type: object
  properties:
    title: Scuba Diving Gear Checklist Form
    pages:
    - id: 1
      name: diving_gear_form
      label: Diving_Gear_Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: personal_equipment
      label: Personal_Equipment
      hint: null
      type: select_multiple
      options:
      - Mask
      - Fins Regulator
      - Boot
      - Dive Comp
      - Dive Computer
      - Knife
      - Weight Bag
      - Weight Scales
      - Dive Light
      - Dive Bag
      - Dive Slate
      - Dive Signal Device
      - Underwater Camera
      - Underwater Lamp
      - Dive Flag
      - Underwater Videocamera
      - Dive Wet Suit
      required: false
    - id: 3
      name: equipment_status
      label: Equipment_Status
      hint: null
      type: select_one
      options:
      - New
      - Used
      - Broken
      required: false
    - id: 4
      name: checked_equipment
      label: Checked_Equipment
      hint: null
      type: select_multiple
      options:
      - Regulator
      - Fins
      - Dive Computer
      - Mask
      required: false
    - id: 5
      name: missing_equipment
      label: Missing_Equipment
      hint: null
      type: select_multiple
      options:
      - Regulator
      - Fins
      - Dive Computer
      - Mask
      required: false
    - id: 6
      name: special_equipment
      label: Special_Equipment
      hint: null
      type: select_multiple
      options:
      - Underwater Camera
      - Underwater Lamp
      - Dive Flag
      - Dive Signal Device
      - Dive Wet Suit
      required: false
    - id: 7
      name: other_equipment
      label: Other_Equipment
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
