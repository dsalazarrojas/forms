inputSchema:
  type: object
  properties:
    title: Food Festival Vendor Booking Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_start_date
      label: event_start_date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: event_end_date
      label: event_end_date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: event_start_time
      label: event_start_time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: vendor_name
      label: Vendor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: vendor_email
      label: vendor_email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: vendor_phone
