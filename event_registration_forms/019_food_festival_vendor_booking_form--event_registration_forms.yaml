      hint: null
      type: time
      options: []
      required: false
    - id: 24
      name: vendor_notes
      label: vendor_notes
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
    - id: 26
      name: assigned_user
      label: Assigned User
      hint: null
      type: select_multiple
      options:
      - chatjimmy
      - Other
      required: false
