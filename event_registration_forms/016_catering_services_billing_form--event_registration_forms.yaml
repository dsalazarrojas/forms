inputSchema:
  type: object
  properties:
    title: Catering Services Billing Form
    pages:
    - id: 1
      name: section_client_info
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: section_event_details
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: number_of_guests
      label: Number of Guests
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: section_service_details
      label: -- Service Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Buffet Service
      - Plated Service
      - Family Style
      - Cocktail Reception
      - Stations
      required: true
    - id: 13
      name: cost_per_person
      label: Cost Per Person
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: subtotal
      label: Subtotal (Guests x Rate)
      hint: null
      type: number
      options: []
      required: true
    - id: 15
      name: additional_services
      label: Additional Services Charges
      hint: Setup, cleanup, staffing, etc.
      type: number
      options: []
      required: false
    - id: 16
      name: section_charges
      label: -- Charges and Fees --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: service_fee_percentage
      label: Service Fee (%)
      hint: null
      type: number
      options: []
      required: false
    - id: 18
      name: service_fee_amount
      label: Service Fee Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 19
      name: tax_amount
      label: Tax Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 20
      name: section_totals
      label: -- Total & Payment --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: total_amount
      label: Total Amount Due
      hint: null
      type: number
      options: []
      required: true
    - id: 22
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Bank Transfer
      - Check
      - Cash
      - PayPal
      - Other
      required: true
    - id: 23
      name: payment_terms
      label: Payment Terms
      hint: null
      type: select_one
      options:
      - Full Payment Due
      - 50% Deposit, 50% Final
      - Installment Plan
      - Due Upon Delivery
      required: true
    - id: 24
      name: invoice_notes
      label: Invoice Notes or Special Instructions
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: billing_confirmation
      label: I authorize billing for the amount specified
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
