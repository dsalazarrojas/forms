inputSchema:
  type: object
  properties:
    title: Attendance Record Form
    pages:
    - id: 1
      name: event_information
      label: -- Event Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_name
      label: Event Name
      hint: Name of the event or class
      type: text
      options: []
      required: true
    - id: 3
      name: event_date
      label: Event Date
      hint: Date of the event
      type: date
      options: []
      required: true
    - id: 4
      name: event_time
      label: Event Time
      hint: Start time
      type: time
      options: []
      required: true
    - id: 5
      name: instructor_organizer
      label: Instructor/Organizer
      hint: Person conducting the event
      type: text
      options: []
      required: true
    - id: 6
      name: attendee_information
      label: -- Attendee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: name
      label: Name
      hint: Attendee full name
      type: text
      options: []
      required: true
    - id: 8
      name: employee_student_id
      label: Employee/Student ID
      hint: Unique identification number
      type: text
      options: []
      required: true
    - id: 9
      name: department_class
      label: Department/Class
      hint: Which department or class?
      type: text
      options: []
      required: true
    - id: 10
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: attendance_status
      label: -- Attendance Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: present_absent
      label: Present or Absent
      hint: Mark attendance status
      type: select_one
      options:
      - Present
      - Absent
      - Late
      - Left Early
      - Excused Absence
      required: true
    - id: 13
      name: check_in_time
      label: Check-In Time
      hint: Time of arrival
      type: time
      options: []
      required: false
    - id: 14
      name: check_out_time
      label: Check-Out Time
      hint: Time of departure
      type: time
      options: []
      required: false
    - id: 15
      name: hours_attended
      label: Hours Attended
      hint: Total hours present
      type: number
      options: []
      required: false
    - id: 16
      name: reason_for_absence
      label: Reason for Absence
      hint: If absent, why?
      type: text
      options: []
      required: false
    - id: 17
      name: absence_approval
      label: Absence Approval
      hint: Was absence approved?
      type: select_one
      options:
      - Approved
      - Pending Approval
      - Unapproved
      required: false
    - id: 18
      name: signature_confirmation
      label: -- Signature Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: attendee_signature
      label: Attendee Signature Confirmed
      hint: Confirm your attendance record
      type: select_one
      options:
      - Confirmed
      - Not Confirmed
      required: true
    - id: 20
      name: signature_date
      label: Signature Date
      hint: Date of confirmation
      type: date
      options: []
      required: true
    - id: 21
      name: recorder_name
      label: Record Keeper Name
      hint: Person recording attendance
      type: text
      options: []
      required: false
    - id: 22
      name: remarks_notes
      label: -- Remarks and Notes --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: special_circumstances
      label: Special Circumstances
      hint: Any special notes?
      type: text
      options: []
      required: false
    - id: 24
      name: follow_up_action
      label: Follow-Up Action Required
      hint: Is follow-up needed?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 25
      name: additional_comments
      label: Additional Comments
      hint: Any other information?
      type: text
      options: []
      required: false
