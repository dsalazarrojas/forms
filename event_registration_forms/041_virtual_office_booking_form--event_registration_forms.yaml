inputSchema:
  type: object
  properties:
    title: Virtual Office Booking Form
    pages:
    - id: 1
      name: user_id
      label: user_id
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: start_date
      label: start_date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: end_date
      label: end_date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: room_type
      label: room_type
      hint: null
      type: select_multiple
      options:
      - Meeting Room
      - Conference Room
      - Training Room
      required: true
    - id: 5
      name: room_name
      label: room_name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: booking_duration
      label: booking_duration
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: start_time
      label: start_time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: end_time
      label: end_time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: booking_status
      label: booking_status
      hint: null
      type: select_one
      options:
      - Pending
      - Confirmed
      - Cancelled
      required: true
    - id: 10
      name: booking_description
      label: booking_description
      hint: null
      type: text
      options: []
      required: false
