inputSchema:
  type: object
  properties:
    title: Community Participation Release Form
    pages:
    - id: 1
      name: waiver_intro
      label: -- Event Participation Waiver --
      hint: Please read and complete this form before participating in our event.
      type: note
      options: []
      required: false
    - id: 2
      name: participant_full_name
      label: Participant Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: participant_dob
      label: Participant Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: participant_gender
      label: Participant Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      - Prefer not to say
      required: true
    - id: 5
      name: participating_event_title
      label: Event Title
      hint: Name of the event you are participating in.
      type: text
      options: []
      required: true
    - id: 6
      name: participating_event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: liability_release_check
      label: Release of Liability
      hint: I agree to release the organization from any claims or liability.
      type: select_one
      options:
      - Yes - I agree
      - No - I do not agree
      required: true
    - id: 8
      name: medical_treatment_consent
      label: Consent for Medical Treatment
      hint: I authorize medical personnel to provide treatment in an emergency.
      type: select_one
      options:
      - Yes - I consent
      - No - I do not consent
      required: true
    - id: 9
      name: media_release_consent
      label: Photo and Video Release
      hint: I grant permission to use images or video of me for promotional purposes.
      type: select_one
      options:
      - Yes - I consent
      - No - I do not consent
      required: true
    - id: 10
      name: emergency_contact_name
      label: Emergency Contact Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: emergency_contact_phone
      label: Emergency Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: medical_concerns_list
      label: Medical Conditions or Allergies
      hint: List any conditions we should be aware of.
      type: text
      options: []
      required: false
    - id: 13
      name: participation_agreement_check
      label: General Participation Agreement
      hint: I agree to follow all instructions and rules of the event.
      type: select_one
      options:
      - Yes - I agree
      - No - I do not agree
      required: true
    - id: 14
      name: agreement_statement_note
      label: -- Agreement Statement --
      hint: By typing your name - you agree that this electronic signature is as binding
        as a physical one.
      type: note
      options: []
      required: false
    - id: 15
      name: digital_signature_text
      label: Digital Signature
      hint: Type your full name here.
      type: text
      options: []
      required: true
    - id: 16
      name: agreement_date
      label: Today - s Date
      hint: null
      type: date
      options: []
      required: true
