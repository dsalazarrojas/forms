inputSchema:
  type: object
  properties:
    title: halloween_registration_form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: event_type_options
      label: Event Type
      hint: null
      type: select_multiple
      options:
      - Halloween Party
      - Trick-or-Treat
      - Costume Contest
      required: true
    - id: 11
      name: attendees
      label: Attendees
      hint: Enter a list of attendees separated by comma
      type: note
      options: []
      required: true
    - id: 12
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
