inputSchema:
  type: object
  properties:
    title: Community Outreach Program Quotation Form
    pages:
    - id: 1
      name: contact_info
      label: Contact Information
      hint: Your organization details
      type: note
      options: []
      required: false
    - id: 2
      name: organization_name
      label: Organization Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_person
      label: Contact Person Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 4
      name: contact_title
      label: Contact Person Title
      hint: Job title or role
      type: text
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: organization_address
      label: Organization Address
      hint: Full mailing address
      type: text
      options: []
      required: true
    - id: 8
      name: program_details
      label: Program Details
      hint: Describe the outreach program
      type: note
      options: []
      required: false
    - id: 9
      name: program_type
      label: Program Type
      hint: null
      type: select_one
      options:
      - Health Screening
      - Educational Workshop
      - Community Event
      - Training Program
      - Awareness Campaign
      - Support Group
      - Other
      required: true
    - id: 10
      name: program_description
      label: Program Description
      hint: Detailed description of activities
      type: text
      options: []
      required: true
    - id: 11
      name: target_audience
      label: Target Audience
      hint: Who will participate
      type: text
      options: []
      required: true
    - id: 12
      name: expected_participants
      label: Expected Number of Participants
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: program_date
      label: Proposed Program Date
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: program_duration
      label: Program Duration
      hint: null
      type: select_one
      options:
      - Half Day (4 hours)
      - Full Day (8 hours)
      - Multi-Day Event
      - Weekly Sessions
      - Monthly Sessions
      - Ongoing
      required: true
    - id: 15
      name: location
      label: Program Location
      hint: Venue or address
      type: text
      options: []
      required: true
    - id: 16
      name: services_needed
      label: Services Required
      hint: Select all that apply
      type: select_multiple
      options:
      - Staffing
      - Equipment Rental
      - Materials and Supplies
      - Venue Setup
      - Catering
      - Transportation
      - Marketing Materials
      - Translation Services
      required: true
    - id: 17
      name: special_requirements
      label: Special Requirements
      hint: Accessibility, dietary, etc.
      type: text
      options: []
      required: false
    - id: 18
      name: budget_range
      label: Estimated Budget Range
      hint: null
      type: select_one
      options:
      - Under $1,000
      - $1,000 - $5,000
      - $5,000 - $10,000
      - $10,000 - $25,000
      - $25,000 - $50,000
      - Over $50,000
      required: true
    - id: 19
      name: funding_source
      label: Funding Source
      hint: How is this program funded
      type: text
      options: []
      required: false
    - id: 20
      name: quotation_deadline
      label: Quotation Needed By
      hint: null
      type: date
      options: []
      required: true
    - id: 21
      name: additional_notes
      label: Additional Notes or Comments
      hint: Any other relevant information
      type: text
      options: []
      required: false
