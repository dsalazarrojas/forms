inputSchema:
  type: object
  properties:
    title: Digital Solutions Workshop Feedback
    pages:
    - id: 1
      name: participant_name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: event_date
      label: When was the workshop event held?
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: session_time
      label: What time did you attend the session?
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: rating
      label: How would you rate the session?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      required: true
    - id: 6
      name: venue
      label: Which venue did you attend?
      hint: null
      type: select_one
      options:
      - Venue 1
      - Venue 2
      - Venue 3
      required: true
    - id: 7
      name: session_topic
      label: Which session topic did you find most valuable?
      hint: null
      type: select_multiple
      options:
      - Topic 1
      - Topic 2
      - Topic 3
      required: true
    - id: 8
      name: participant_comment
      label: What comments do you have about the session?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: session_tools
      label: Were there any tools assigned to you?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: session_title
      label: What is the event title?
      hint: null
      type: text
      options: []
      required: false
