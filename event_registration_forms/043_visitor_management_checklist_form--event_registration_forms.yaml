inputSchema:
  type: object
  properties:
    title: Visitor Management Checklist Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: Please take a moment to read this form carefully.
      type: note
      options: []
      required: false
    - id: 2
      name: visitor_contact_info
      label: Visitor Contact Information
      hint: Please fill in the visitor's contact information below.
      type: text
      options: []
      required: true
    - id: 3
      name: visitor_photo
      label: Photo
      hint: Please take a photo of the visitor.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 4
      name: tool_assignment
      label: Tool Assignment
      hint: Choose the tool to be assigned to the visitor.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 5
      name: security_question
      label: Security Question
      hint: Please answer the security question to ensure the visitor's identity.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 6
      name: visit_date_and_time
      label: Visit Date and Time
      hint: Please enter the visit date and time.
      type: date
      options: []
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: Please provide any additional comments.
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: Please enter the visitor's email.
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone
      hint: Please enter the visitor's phone number.
      type: text
      options: []
      required: false
    - id: 10
      name: review_and_confirmation
      label: Review and Confirmation
      hint: Please review and confirm the visit information.
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: additional_security_question
      label: Additional Security Question
      hint: Please answer the additional security question.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 12
      name: photo_capture
      label: Photo Capture
      hint: Please capture the visitor's photo.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
