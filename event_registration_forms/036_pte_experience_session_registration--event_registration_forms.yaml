      name: participant_details
      label: Participant Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: session_selection
      label: Select Session
      hint: Select session to register for
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: participant_email
      label: Participant E-mail
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: session_type
      label: Session Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: session_notes
      label: Session Notes
      hint: null
      type: note
      options: []
      required: false
