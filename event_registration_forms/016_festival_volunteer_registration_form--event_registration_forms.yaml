      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: volunteer_slots
      label: Volunteer Slots
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: available_slots
      label: Available Slots
      hint: Select all the timeslots that you will be available
      type: select_multiple
      options:
