      name: parent_info
      label: Parent Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: kid_info
      label: Kid Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: event_sessions
      label: Event Sessions
      hint: null
      type: select_one
      options:
      - Monopoly Event 1
      - Monopoly Event 2
      - Monopoly Event 3
      required: true
    - id: 4
      name: guardian_questions
      label: Guardian Questions
      hint: null
      type: select_multiple
      options:
      - Do you give permission for your child to participate in the Monopoly game?
      - How do you plan to transport your child to and from the game session?
      - Are there any medical conditions we should be aware of?
      required: true
    - id: 5
      name: kid_consent
      label: Kid Consent
