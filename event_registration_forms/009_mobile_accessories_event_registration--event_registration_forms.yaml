inputSchema:
  type: object
  properties:
    title: Mobile Accessories Event Registration
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Enter your first name.
      type: text
      options: []
      required: true
    - id: 2
      name: company
      label: Company
      hint: Your company name.
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: Enter a valid email address.
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: Enter your phone number.
      type: text
      options: []
      required: true
    - id: 5
      name: attendee_type
      label: Attendee Type
      hint: Choose your type.
      type: select_one
      options:
      - Visitor
      - Speaker
      - Organizer
      - Exhibitor
      required: true
    - id: 6
      name: segments_of_interest
      label: Segments Of Interest
      hint: Select your interests.
      type: select_multiple
      options:
      - Mobile Accessories
      - Electronics
      - Gadgets
      - Novelties
      required: true
    - id: 7
      name: sign_up_for
      label: Sign up for
      hint: Select events.
      type: select_multiple
      options:
      - Trade Show
      - Launch
      - Workshop
      required: true
    - id: 8
      name: event_date
      label: Event Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 9
      name: event_time
      label: Event Time
      hint: HH -MM AM/PM
      type: time
      options: []
      required: true
    - id: 10
      name: additional_comments
      label: Additional Comments
      hint: Any additional comments?
      type: note
      options: []
      required: false
    - id: 11
      name: event_date_2
      label: Event Date 2
      hint: MM/DD/YYYY
      type: date
      options: []
      required: false
    - id: 12
      name: event_time_2
      label: Event Time 2
      hint: HH -MM AM/PM
      type: time
      options: []
      required: false
    - id: 13
      name: segments_of_interest_2
      label: Segments Of Interest 2
      hint: Select interests.
      type: select_multiple
      options:
      - Mobile Accessories
      - Electronics
      - Gadgets
      - Novelties
      required: false
