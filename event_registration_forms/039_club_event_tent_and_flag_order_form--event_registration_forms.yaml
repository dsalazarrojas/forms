inputSchema:
  type: object
  properties:
    title: Club Event Tent And Flag Order Form
    pages:
    - id: 1
      name: section_organizer
      label: -- Event Organizer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: contact_name
      label: Contact Person Name
      hint: Person placing the order
      type: text
      options: []
      required: true
    - id: 3
      name: club_name
      label: Club Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: section_event
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: event_date
      label: Event Date
      hint: When is the event?
      type: date
      options: []
      required: true
    - id: 9
      name: event_start_time
      label: Event Start Time
      hint: When does event begin?
      type: time
      options: []
      required: true
    - id: 10
      name: event_end_time
      label: Event End Time
      hint: When does event finish?
      type: time
      options: []
      required: true
    - id: 11
      name: event_location
      label: Event Location - Venue
      hint: Where will event be held?
      type: text
      options: []
      required: true
    - id: 12
      name: expected_attendance
      label: Expected Number of Attendees
      hint: Estimate
      type: number
      options: []
      required: true
    - id: 13
      name: section_tent
      label: -- Tent Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: tent_needed
      label: Tent Required
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 15
      name: tent_quantity
      label: Number of Tents
      hint: How many tents needed?
      type: number
      options: []
      required: false
    - id: 16
      name: tent_size
      label: Tent Size Preference
      hint: null
      type: select_one
      options:
      - 10x10 ft
      - 10x20 ft
      - 20x20 ft
      - 20x40 ft
      - Other size
      required: false
    - id: 17
      name: tent_type
      label: Tent Type
      hint: null
      type: select_one
      options:
      - Standard canopy
      - Frame tent
      - Dome tent
      - High-peak tent
      - No preference
      required: false
    - id: 18
      name: tent_color
      label: Tent Color
      hint: null
      type: select_one
      options:
      - White
      - Blue
      - Clear
      - Club colors
      - Other
      required: false
    - id: 19
      name: section_flags
      label: -- Flag Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: flag_needed
      label: Flags Required
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 21
      name: flag_quantity
      label: Number of Flags
      hint: How many flags needed?
      type: number
      options: []
      required: false
    - id: 22
      name: flag_type
      label: Flag Type
      hint: null
      type: select_one
      options:
      - Club banner
      - Promotional flags
      - Team colors
      - Custom design
      - Other
      required: false
    - id: 23
      name: flag_size
      label: Flag Size
      hint: null
      type: select_one
      options:
      - Small - 3x5 ft
      - Medium - 5x8 ft
      - Large - 8x12 ft
      - Extra large
      - Other
      required: false
    - id: 24
      name: flag_design
      label: Flag Design Description
      hint: What will be displayed on flags?
      type: text
      options: []
      required: false
    - id: 25
      name: section_logistics
      label: -- Delivery and Setup --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: delivery_setup
      label: Need Delivery and Setup Service
      hint: null
      type: select_one
      options:
      - Yes - full setup
      - Yes - delivery only
      - No - will pick up and set up
      required: true
    - id: 27
      name: pickup_date
      label: Pickup Date - If Applicable
      hint: null
      type: date
      options: []
      required: false
    - id: 28
      name: equipment_protection
      label: Weather Protection Needed
      hint: Wind bracing, sandbags, etc
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
