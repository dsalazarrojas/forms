      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: training_date
