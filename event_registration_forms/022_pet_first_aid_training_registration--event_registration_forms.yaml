    - id: 14
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: payment_method
      label: payment_method
      hint: null
      type: select_one
      options:
      - '{''label'': ''Bank Transfer (EFT)''}'
      - '{''label'': ''Cash''}'
      required: false
    - id: 16
      name: confirmation
      label: confirmation
      hint: null
      type: select_one
      options:
      - '{''label'': ''I understand that by signing this form, I am confirming that
        I have read the course policies.''}'
