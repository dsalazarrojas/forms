inputSchema:
  type: object
  properties:
    title: Educational Leadership Training Registration Form
    pages:
    - id: 1
      name: personal_info
      label: Personal Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: registration_info
      label: Registration Information
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: training_session
      label: Training Session
      hint: null
      type: select_one
      options:
      - Session 1
      - Session 2
      - Session 3
      required: false
    - id: 6
      name: training_location
      label: Training Location
      hint: null
      type: select_multiple
      options:
      - Location 1
      - Location 2
      - Location 3
      required: false
