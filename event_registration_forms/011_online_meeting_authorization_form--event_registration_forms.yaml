inputSchema:
  type: object
  properties:
    title: Online Meeting Authorization Form
    pages:
    - id: 1
      name: meeting_details
      label: Meeting Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: meeting_date
      label: Meeting Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: meeting_time
      label: Meeting Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: meeting_location
      label: Meeting Location
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: participant_role
      label: Participant Role
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: participant_consent
      label: Participant Consent
      hint: null
