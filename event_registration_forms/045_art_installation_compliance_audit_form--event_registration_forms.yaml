inputSchema:
  type: object
  properties:
    title: Art Installation Compliance Audit Form
    pages:
      - id: 1
        name: audit_overview_header
        label: -- Audit Overview --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: auditor_name
        label: Auditor Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: audit_date
        label: Date of Audit
        hint: null
        type: date
        options: []
        required: true
      - id: 4
        name: installation_title
        label: Art Installation Title
        hint: null
        type: text
        options: []
        required: true
      - id: 5
        name: installation_location
        label: Location - Gallery Number - Site
        hint: null
        type: text
        options: []
        required: true
      - id: 6
        name: safety_compliance_header
        label: -- Structural and Safety Compliance --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: structural_integrity_check
        label: Structural Integrity and Mounting Security
        hint: Is the work safely secured according to specifications?
        type: select_one
        options:
          - Compliant
          - Minor Adjustment Needed
          - Non-compliant - Safety Hazard
        required: true
      - id: 8
        name: tripping_hazards_check
        label: Absence of Tripping or Physical Hazards
        hint: null
        type: select_one
        options:
          - Compliant
          - Non-compliant
        required: true
      - id: 9
        name: fire_safety_compliance
        label: Fire Safety and Exit Path Compliance
        hint: Ensure the work does not block exits or fire suppressors
        type: select_one
        options:
          - Compliant
          - Non-compliant
        required: true
      - id: 10
        name: electrical_safety_audit
        label: Electrical and Lighting Safety (If applicable)
        hint: Cords secured, no overheating components
        type: select_one
        options:
          - Compliant
          - Needs Maintenance
          - N/A
        required: true
      - id: 11
        name: documentation_compliance_header
        label: -- Documentation and Signage --
        hint: null
        type: note
        options: []
        required: false
      - id: 12
        name: insurance_documents_verified
        label: Insurance Documentation Verified for Installation
        hint: null
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 13
        name: signage_accuracy_check
        label: Signage Accuracy (Artist, Title, Year)
        hint: null
        type: select_one
        options:
          - Accurate
          - Corrections Required
        required: true
      - id: 14
        name: accessibility_compliance
        label: ADA - Accessibility Standards Met
        hint: Can visitors with disabilities view the installation safely?
        type: select_one
        options:
          - Fully Accessible
          - Partially Accessible
          - Not Accessible
        required: true
      - id: 15
        name: audit_outcome_header
        label: -- Audit Outcome --
        hint: null
        type: note
        options: []
        required: false
      - id: 16
        name: audit_status
        label: Overall Audit Status
        hint: null
        type: select_one
        options:
          - Passed - No Further Action
          - Conditional Pass - Minor Adjustments Required
          - Failed - Immediate Remediation Required
        required: true
      - id: 17
        name: remediation_instructions
        label: Remediation Instructions
        hint: If audit failed or conditional pass was given
        type: text
        options: []
        required: false
      - id: 18
        name: follow_up_audit_required
        label: Is a follow-up audit required?
        hint: null
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 19
        name: auditor_digital_signature
        label: Auditor Digital Signature (Type Name)
        hint: null
        type: text
        options: []
        required: true
      - id: 20
        name: audit_completion_time
        label: Time of Completion
        hint: null
        type: time
        options: []
        required: true
