      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: email_optin
      label: Email Opt-in
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 14
      name: agree_terms
      label: Agree to Terms and Conditions
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
