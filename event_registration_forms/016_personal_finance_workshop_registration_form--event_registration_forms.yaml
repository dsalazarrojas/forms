      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: workshop_date
      label: Workshop Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: workshop_time
      label: Workshop Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: registration_type
