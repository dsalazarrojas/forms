inputSchema:
  type: object
  properties:
    title: E Sports Event Outcome Report Form
    pages:
    - id: 1
      name: tournament_outcome
      label: Tournament Outcome
      hint: null
      type: select_multiple
      options:
      - outcome 1
      - outcome 2
      required: false
    - id: 2
      name: event_outcome
      label: Event Outcome
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: player_performance
      label: Player Performance
      hint: null
      type: select_one
      options:
      - excellent
      - good
      - average
      - poor
      required: false
    - id: 4
      name: audience_engagement
      label: Audience Engagement
      hint: null
      type: select_multiple
      options:
      - excellent
      - good
      - average
      - poor
      required: false
    - id: 5
      name: overall_event_success
      label: Overall Event Success
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: player_comments
      label: Player Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: event_comments
      label: Event Comments
      hint: null
      type: note
      options: []
      required: false
