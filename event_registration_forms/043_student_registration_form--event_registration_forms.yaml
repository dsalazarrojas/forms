inputSchema:
  type: object
  properties:
    title: Student Registration Form
    pages:
    - id: 1
      name: user_info
      label: First and Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: student_program
      label: Student Program
      hint: null
      type: select_one
      options:
      - High School Diploma
      - Bachelor's Degree
      - Master's Degree
      - Doctorate
      required: true
    - id: 7
      name: student_program_other
      label: Other Program
      hint: null
      type: select_multiple
      options:
      - High School Diploma
      - Bachelor's Degree
      - Master's Degree
      - Doctorate
      required: false
    - id: 8
      name: student_start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
