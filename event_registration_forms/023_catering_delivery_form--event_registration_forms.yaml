inputSchema:
  type: object
  properties:
    title: Catering Delivery Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Your contact phone
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Your company if applicable
      type: text
      options: []
      required: false
    - id: 5
      name: delivery_date
      label: Delivery Date
      hint: When do you need delivery
      type: date
      options: []
      required: true
    - id: 6
      name: delivery_time
      label: Delivery Time
      hint: Preferred delivery time
      type: time
      options: []
      required: true
    - id: 7
      name: delivery_address
      label: Delivery Address
      hint: Complete delivery address
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: true
    - id: 9
      name: state
      label: State
      hint: Your state
      type: text
      options: []
      required: true
    - id: 10
      name: zip_code
      label: ZIP Code
      hint: Your ZIP code
      type: text
      options: []
      required: true
    - id: 11
      name: delivery_instructions
      label: Delivery Instructions
      hint: Gate codes - building access - etc
      type: text
      options: []
      required: false
    - id: 12
      name: contact_on_arrival
      label: Contact on Arrival
      hint: Who to call when driver arrives
      type: text
      options: []
      required: true
    - id: 13
      name: order_type
      label: Order Type
      hint: Type of catering order
      type: select_one
      options:
      - Drop-off Only
      - Drop-off with Setup
      - Full Service
      - Pickup Order
      required: true
    - id: 14
      name: menu_items
      label: Menu Items Ordered
      hint: List your ordered items
      type: text
      options: []
      required: true
    - id: 15
      name: quantity
      label: Quantity
      hint: Number of servings
      type: number
      options: []
      required: true
    - id: 16
      name: special_requests
      label: Special Requests
      hint: Any special requirements
      type: text
      options: []
      required: false
    - id: 17
      name: dietary_notes
      label: Dietary Notes
      hint: Any dietary restrictions
      type: text
      options: []
      required: false
    - id: 18
      name: equipment_needed
      label: Equipment Needed
      hint: Chafing dishes - serving utensils - etc
      type: select_multiple
      options:
      - Chafing Dishes
      - Serving Utensils
      - Plates
      - Napkins
      - Cups
      - None
      required: false
    - id: 19
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Cash
      - Check
      - Invoice
      - Already Paid
      required: true
    - id: 20
      name: tip_amount
      label: Tip Amount
      hint: Gratuity for delivery
      type: number
      options: []
      required: false
    - id: 21
      name: delivery_fee
      label: Delivery Fee Accepted
      hint: Do you accept the delivery fee
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 22
      name: order_confirmation
      label: Order Confirmation Number
      hint: If you have one
      type: text
      options: []
      required: false
    - id: 23
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
