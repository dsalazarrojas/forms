inputSchema:
  type: object
  properties:
    title: Culinary Masterclass RSVP Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: participant_address
      label: Participant Address
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: preferred_cuisine
      label: Preferred Cuisine
      hint: null
      type: select_multiple
      options:
      - Asian
      - Italian
      - Mexican
      - Greek
      required: false
    - id: 9
      name: participant_message
      label: Participant Message
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: participant_notes
      label: Participant Notes
      hint: null
      type: note
      options: []
      required: false
