inputSchema:
  type: object
  properties:
    title: Catering Service Contract Form
    pages:
    - id: 1
      name: client_name
      label: Client Full Name
      hint: Your legal name
      type: text
      options: []
      required: true
    - id: 2
      name: client_email
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Phone Number
      hint: Your contact phone
      type: text
      options: []
      required: true
    - id: 4
      name: client_address
      label: Address
      hint: Your address
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 6
      name: caterer_name
      label: Catering Company Name
      hint: Name of caterer
      type: text
      options: []
      required: true
    - id: 7
      name: caterer_representative
      label: Caterer Representative
      hint: Contact person
      type: text
      options: []
      required: true
    - id: 8
      name: contract_date
      label: Contract Date
      hint: Date of contract
      type: date
      options: []
      required: true
    - id: 9
      name: event_name
      label: Event Name
      hint: Name of event
      type: text
      options: []
      required: true
    - id: 10
      name: event_type
      label: Event Type
      hint: Type of event
      type: select_one
      options:
      - Wedding
      - Corporate Event
      - Birthday Party
      - Anniversary
      - Conference
      - Private Party
      - Other
      required: true
    - id: 11
      name: event_date
      label: Event Date
      hint: Date of event
      type: date
      options: []
      required: true
    - id: 12
      name: event_start_time
      label: Event Start Time
      hint: Start time
      type: time
      options: []
      required: true
    - id: 13
      name: event_end_time
      label: Event End Time
      hint: End time
      type: time
      options: []
      required: true
    - id: 14
      name: venue_name
      label: Venue Name
      hint: Location name
      type: text
      options: []
      required: true
    - id: 15
      name: venue_address
      label: Venue Address
      hint: Complete address
      type: text
      options: []
      required: true
    - id: 16
      name: guest_count
      label: Guaranteed Guest Count
      hint: Final number of guests
      type: number
      options: []
      required: true
    - id: 17
      name: menu_package
      label: Menu Package
      hint: Selected package
      type: select_one
      options:
      - Basic Package
      - Standard Package
      - Premium Package
      - Deluxe Package
      - Custom Menu
      required: true
    - id: 18
      name: menu_details
      label: Menu Details
      hint: Specific dishes
      type: text
      options: []
      required: true
    - id: 19
      name: beverage_package
      label: Beverage Package
      hint: Selected beverage service
      type: select_one
      options:
      - Non-Alcoholic
      - Beer and Wine
      - Full Bar
      - Coffee and Tea
      - None
      required: true
    - id: 20
      name: additional_services
      label: Additional Services
      hint: Extra services
      type: select_multiple
      options:
      - Setup
      - Cleanup
      - Tables and Chairs
      - Linens
      - China and Silverware
      - Serving Staff
      - Bartenders
      - Decorations
      required: false
    - id: 21
      name: total_cost
      label: Total Contract Cost
      hint: Total amount
      type: number
      options: []
      required: true
    - id: 22
      name: deposit_amount
      label: Deposit Amount
      hint: Required deposit
      type: number
      options: []
      required: true
    - id: 23
      name: deposit_due_date
      label: Deposit Due Date
      hint: When deposit is due
      type: date
      options: []
      required: true
    - id: 24
      name: balance_due_date
      label: Balance Due Date
      hint: When final payment is due
      type: date
      options: []
      required: true
    - id: 25
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit Card
      - Check
      - Bank Transfer
      - Cash
      required: true
    - id: 26
      name: cancellation_policy
      label: Cancellation Policy Accepted
      hint: Do you accept the policy
      type: select_one
      options:
      - Yes - I Accept
      - false
      required: true
    - id: 27
      name: terms_conditions
      label: Terms and Conditions Accepted
      hint: Do you agree to terms
      type: select_one
      options:
      - Yes - I Accept
      - false
      required: true
    - id: 28
      name: client_signature_date
      label: Client Signature Date
      hint: Date of signature
      type: date
      options: []
      required: true
    - id: 29
      name: caterer_signature_date
      label: Caterer Signature Date
      hint: Date of caterer signature
      type: date
      options: []
      required: false
    - id: 30
      name: special_provisions
      label: Special Provisions
      hint: Any additional terms
      type: text
      options: []
      required: false
