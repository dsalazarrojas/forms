inputSchema:
  type: object
  properties:
    title: Athlete Audition Registration
    pages:
    - id: 1
      name: audition_header
      label: -- Audition Scheduling --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: preferred_date
      label: Preferred Audition Date
      hint: Select one of the available slots
      type: select_one
      options:
      - Saturday, March 15 - 9:00 AM
      - Saturday, March 15 - 1:00 PM
      - Sunday, March 16 - 9:00 AM
      - Sunday, March 16 - 1:00 PM
      required: true
    - id: 3
      name: audition_venue
      label: Audition Venue
      hint: null
      type: select_one
      options:
      - Main Stadium - Field A
      - Community Sports Complex
      - Indoor Training Center
      required: true
    - id: 4
      name: athlete_profile_header
      label: -- Athlete Profile --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: athlete_name
      label: Athlete Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: birth_date
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      required: true
    - id: 8
      name: primary_sport
      label: Primary Sport
      hint: e.g. Soccer, Basketball, Track and Field
      type: text
      options: []
      required: true
    - id: 9
      name: athlete_position
      label: Primary Position or Event
      hint: e.g. Goalkeeper, Point Guard, 100m Dash
      type: text
      options: []
      required: true
    - id: 10
      name: experience_years
      label: Years of Competitive Experience
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: current_organization
      label: Current Club or School
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: contact_header
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: email_address
      label: Email Address
      hint: example@domain.com
      type: email
      options: []
      required: true
    - id: 14
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: guardian_name
      label: Parent or Guardian Name
      hint: Required if athlete is under 18
      type: text
      options: []
      required: false
    - id: 16
      name: safety_header
      label: -- Medical and Safety --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: medical_conditions
      label: Allergies or Medical Conditions
      hint: Please list any conditions coaches should be aware of
      type: text
      options: []
      required: false
    - id: 18
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: waiver_agreement
      label: I agree to the terms of the Audition Waiver and Release
      hint: View terms on our website
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 21
      name: fee_payment_method
      label: Registration Fee Payment Method
      hint: null
      type: select_one
      options:
      - Online Credit Card
      - Bank Transfer
      - Pay at Venue
      required: true
