inputSchema:
  type: object
  properties:
    title: Auditorium Reservation Form
    pages:
    - id: 1
      name: reservation_date
      label: Reservation Request Date
      hint: Date you are making the reservation
      type: date
      options: []
      required: true
    - id: 2
      name: event_name
      label: Event Name
      hint: Name of the event
      type: text
      options: []
      required: true
    - id: 3
      name: event_type
      label: Type of Event
      hint: What kind of event
      type: select_one
      options:
      - Conference
      - Concert
      - Theater Production
      - Lecture
      - Corporate Meeting
      - Educational Event
      - Community Event
      - Other
      required: true
    - id: 4
      name: event_description
      label: Event Description
      hint: Brief description of the event
      type: text
      options: []
      required: true
    - id: 5
      name: event_date
      label: Event Date
      hint: When will the event occur
      type: date
      options: []
      required: true
    - id: 6
      name: event_start_time
      label: Event Start Time
      hint: What time does event begin
      type: time
      options: []
      required: true
    - id: 7
      name: event_end_time
      label: Event End Time
      hint: What time does event end
      type: time
      options: []
      required: true
    - id: 8
      name: setup_time_needed
      label: Setup Time Needed Before Event
      hint: Hours needed for setup
      type: number
      options: []
      required: true
    - id: 9
      name: expected_attendance
      label: Expected Attendance
      hint: Approximate number of attendees
      type: number
      options: []
      required: true
    - id: 10
      name: auditorium_size
      label: Preferred Auditorium Size
      hint: Room capacity needed
      type: select_one
      options:
      - Small - 50-100 Seats
      - Medium - 100-300 Seats
      - Large - 300-500 Seats
      - Very Large - 500+ Seats
      - Flexible - No Preference
      required: true
    - id: 11
      name: theater_seating
      label: Theater Seating Arrangement
      hint: How should seating be arranged
      type: select_one
      options:
      - Theater Style - Rows Facing Stage
      - Classroom Style - Rows with Tables
      - Banquet - Round Tables
      - U-Shape - Tables in U
      - Other - Custom
      required: true
    - id: 12
      name: stage_needed
      label: Stage or Platform Needed
      hint: Will you need a raised stage
      type: select_one
      options:
      - Yes - Full Stage
      - Yes - Small Platform
      - No - Floor Level
      required: true
    - id: 13
      name: lighting_requirements
      label: Lighting Requirements
      hint: Special lighting needed
      type: select_multiple
      options:
      - Standard House Lighting
      - Spotlight
      - Stage Lighting
      - Projection Capability
      - Dimming Capability
      - None - Daylight
      required: false
    - id: 14
      name: audio_requirements
      label: Audio Requirements
      hint: Sound system needs
      type: select_multiple
      options:
      - Microphone System
      - Speaker System
      - Sound Board
      - Wireless Microphones
      - Recording Capability
      - None
      required: false
    - id: 15
      name: parking_available
      label: Parking Space Needed
      hint: Approximate number of spaces
      type: number
      options: []
      required: false
    - id: 16
      name: catering_needed
      label: Catering or Food Service
      hint: Will catering be provided
      type: select_one
      options:
      - Yes - Full Service
      - Yes - Beverages Only
      - Yes - Snacks Only
      - No - Bring Our Own
      - No - Not Needed
      required: true
    - id: 17
      name: tables_chairs_required
      label: Additional Tables and Chairs
      hint: Extra furniture needed
      type: text
      options: []
      required: false
    - id: 18
      name: alcohol_service
      label: Alcoholic Beverages
      hint: Will alcohol be served
      type: select_one
      options:
      - Yes - Beer and Wine Only
      - Yes - Full Bar
      - No - Non-Alcoholic Only
      required: false
    - id: 19
      name: organization_name
      label: Organization/Company Name
      hint: Name of organization holding event
      type: text
      options: []
      required: true
    - id: 20
      name: organizer_name
      label: Event Organizer Name
      hint: Name of person coordinating
      type: text
      options: []
      required: true
    - id: 21
      name: organizer_email
      label: Organizer Email
      hint: Email for confirmation
      type: email
      options: []
      required: true
    - id: 22
      name: organizer_phone
      label: Organizer Phone
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 23
      name: special_requests
      label: Special Requests or Accommodations
      hint: Any special needs
      type: text
      options: []
      required: false
    - id: 24
      name: budget_information
      label: Event Budget (Optional)
      hint: Estimated budget for event
      type: number
      options: []
      required: false
