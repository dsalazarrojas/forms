inputSchema:
  type: object
  properties:
    title: Community Dialogue Series Registration
    pages:
    - id: 1
      name: participant_first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: participant_last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: For event communications
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Primary contact number
      type: text
      options: []
      required: false
    - id: 5
      name: organization
      label: Organization or Affiliation
      hint: Any organization you represent
      type: text
      options: []
      required: false
    - id: 6
      name: dialogue_series
      label: Dialogue Series Selection
      hint: Which series are you registering for?
      type: select_one
      options:
      - Racial Equity Dialogue
      - Community Policing Discussion
      - Youth Engagement Series
      - Housing and Development
      - Environmental Justice
      - Economic Opportunity
      - Full Series Pass
      required: true
    - id: 7
      name: session_preference
      label: Session Time Preference
      hint: When do you prefer to attend?
      type: select_one
      options:
      - Weekday Mornings
      - Weekday Afternoons
      - Weekday Evenings
      - Weekend Mornings
      - Weekend Afternoons
      required: true
    - id: 8
      name: attendance_type
      label: Attendance Type
      hint: How will you attend?
      type: select_one
      options:
      - In Person
      - Virtual
      - Hybrid
      required: true
    - id: 9
      name: dialogue_experience
      label: Previous Dialogue Experience
      hint: Have you participated in dialogues before?
      type: select_one
      options:
      - First Time
      - Some Experience
      - Regular Participant
      - Facilitator
      required: true
    - id: 10
      name: topics_of_interest
      label: Topics of Interest
      hint: What topics matter most to you?
      type: select_multiple
      options:
      - Social Justice
      - Community Building
      - Policy Reform
      - Grassroots Organizing
      - Conflict Resolution
      - Youth Issues
      - Senior Issues
      required: true
    - id: 11
      name: accessibility_needs
      label: Accessibility Needs
      hint: Do you require accommodations?
      type: text
      options: []
      required: false
    - id: 12
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: If refreshments are provided
      type: text
      options: []
      required: false
    - id: 13
      name: childcare_needed
      label: Childcare Needed
      hint: Do you need childcare services?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 14
      name: transportation_needed
      label: Transportation Assistance Needed
      hint: Do you need help getting to the event?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 15
      name: how_did_you_hear
      label: How Did You Hear About This Series
      hint: Where did you learn about us?
      type: select_one
      options:
      - Website
      - Social Media
      - Email Newsletter
      - Friend or Colleague
      - Community Organization
      - Flyer or Poster
      - Other
      required: false
    - id: 16
      name: goals_expectations
      label: Goals and Expectations
      hint: What do you hope to gain?
      type: text
      options: []
      required: false
    - id: 17
      name: facilitator_interest
      label: Interested in Facilitating
      hint: Would you like to be a facilitator?
      type: select_one
      options:
      - true
      - false
      - Maybe in Future
      required: true
