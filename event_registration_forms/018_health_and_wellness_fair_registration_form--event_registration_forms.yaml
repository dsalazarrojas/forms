inputSchema:
  type: object
  properties:
    title: health_and_wellness_fair_registration_form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_email
      label: participant_email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: contact_phone
      label: participant_phone
      hint: 'Format: 10 digits, including country code'
      type: text
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: date_of_birth
      hint: 'Format: YYYY-MM-DD'
      type: date
      options: []
      required: false
    - id: 5
      name: participant_address
      label: participant_address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: dietary_requirements
      label: dietary_requirements
      hint: null
      type: select_multiple
      options:
      - Gluten-free
      - Vegan
      - Vegetarian
      - Other
      required: true
    - id: 7
      name: attending_with
      label: attending_with
      hint: null
      type: select_one
      options:
      - Self
      - Partner/Spouse
      - Friend
      - Family Member
      - Other (Specify)
      required: true
    - id: 8
      name: registration_date
      label: registration_date
      hint: 'Format: YYYY-MM-DD'
      type: date
      options: []
      required: false
    - id: 9
      name: participant_type
      label: participant_type
      hint: null
      type: select_multiple
      options:
      - Vendor
      - Vendor Staff
      - Volunteer
      - Participant
      - Guest
      required: true
    - id: 10
      name: vendor_info
      label: vendor_info
      hint: Vendor Information (if applicable)
      type: text
      options: []
      required: false
