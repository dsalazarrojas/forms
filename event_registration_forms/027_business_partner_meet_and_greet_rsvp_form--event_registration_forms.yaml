inputSchema:
  type: object
  properties:
    title: Business Partner Meet And Greet RSVP Form
    pages:
    - id: 1
      name: attendee_name
      label: Your Name
      hint: Full name of attendee
      type: text
      options: []
      required: true
    - id: 2
      name: attendee_email
      label: Email Address
      hint: Primary email contact
      type: email
      options: []
      required: true
    - id: 3
      name: attendee_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Your company or organization
      type: text
      options: []
      required: true
    - id: 5
      name: job_title
      label: Job Title
      hint: Your position or role
      type: text
      options: []
      required: true
    - id: 6
      name: event_name
      label: Event Name
      hint: Which event are you attending?
      type: text
      options: []
      required: true
    - id: 7
      name: event_date
      label: Event Date
      hint: Date of the event
      type: date
      options: []
      required: true
    - id: 8
      name: event_time
      label: Event Time
      hint: Start time of the event
      type: time
      options: []
      required: true
    - id: 9
      name: event_location
      label: Event Location
      hint: Venue or address
      type: text
      options: []
      required: false
    - id: 10
      name: rsvp_status
      label: RSVP Status
      hint: Will you attend?
      type: select_one
      options:
      - Yes, I Will Attend
      - No, I Cannot Attend
      - Maybe, Unsure
      required: true
    - id: 11
      name: number_of_guests
      label: Number of Guests Including You
      hint: How many total attendees?
      type: number
      options: []
      required: true
    - id: 12
      name: guest_names
      label: Guest Names
      hint: Names of additional attendees
      type: text
      options: []
      required: false
    - id: 13
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Any special dietary needs?
      type: select_one
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-free
      - Kosher
      - Halal
      - Other
      required: false
    - id: 14
      name: dietary_details
      label: Dietary Details
      hint: If other, please specify
      type: text
      options: []
      required: false
    - id: 15
      name: networking_interests
      label: Networking Interests
      hint: What types of connections interest you?
      type: text
      options: []
      required: false
    - id: 16
      name: accessibility_needs
      label: Accessibility Needs
      hint: Any accommodations needed?
      type: text
      options: []
      required: false
    - id: 17
      name: prefer_to_network_with
      label: Industries You Want to Network With
      hint: Types of companies/professionals
      type: text
      options: []
      required: false
    - id: 18
      name: prior_event_attendance
      label: Have You Attended Our Events Before?
      hint: Previous attendance
      type: select_one
      options:
      - Yes, Multiple Times
      - Yes, Once
      - No, First Time
      required: false
    - id: 19
      name: additional_comments
      label: Additional Comments
      hint: Any other information?
      type: text
      options: []
      required: false
