inputSchema:
  type: object
  properties:
    title: Board Member Training Enrollment Form
    pages:
    - id: 1
      name: training_header
      label: -- Training Enrollment --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant name
      hint: Full name for registration
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: Confirmation and materials will be sent
      type: email
      options: []
      required: true
    - id: 4
      name: training_session
      label: Training session
      hint: Choose preferred session
      type: select_one
      options:
      - Governance basics
      - Financial oversight
      - Fundraising strategies
      required: true
    - id: 5
      name: dietary_restrictions
      label: Dietary restrictions
      hint: For catering if applicable
      type: text
      options: []
      required: false
    - id: 6
      name: accessibility_requirements
      label: Accessibility requirements
      hint: Mobility hearing or visual needs
      type: text
      options: []
      required: false
    - id: 7
      name: payment_required
      label: Payment required
      hint: Confirm if payment is needed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: emergency_contact
      label: Emergency contact
      hint: Name and phone
      type: text
      options: []
      required: false
