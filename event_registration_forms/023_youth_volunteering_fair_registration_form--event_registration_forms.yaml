inputSchema:
  type: object
  properties:
    title: Youth Volunteering Fair Registration Form
    pages:
    - id: 1
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: student_school_id
      label: school_id
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: student_school_class
      label: grade_level
      hint: null
      type: select_one
      options:
      - '9'
      - '10'
      - '11'
      - '12'
      required: true
    - id: 5
      name: student_phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: student_email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: student_interests
      label: student_interests
      hint: null
      type: select_multiple
      options:
      - Interest in arts
      - Interest in sports
      - Interest in technology
      required: true
    - id: 8
      name: student_address
      label: Address
      hint: null
      type: text
      options: []
      required: false
