inputSchema:
  type: object
  properties:
    title: Speechwriting Workshop Booking Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: preferred_language
      label: Preferred Language
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - French
      required: true
    - id: 7
      name: workshop_id
      label: Workshop ID
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: workshop_date
      label: Workshop Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: workshop_time
      label: Workshop Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: workshop_duration
      label: Workshop Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
