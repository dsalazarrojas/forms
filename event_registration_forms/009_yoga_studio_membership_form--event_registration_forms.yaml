inputSchema:
  type: object
  properties:
    title: Yoga Studio Membership Form
    pages:
    - id: 1
      name: membership_plan
      label: choose-membership-plan
      hint: null
      type: select_one
      options:
      - basic
      - premium
      - deluxe
      required: false
    - id: 2
      name: first_name
      label: first-name
      hint: First name
      type: text
      options: []
      required: false
    - id: 3
      name: last_name
      label: last-name
      hint: Last name
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: email
      hint: Email address
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: address
      label: address
      hint: Home address
      type: text
      options: []
      required: false
    - id: 7
      name: join_date
      label: join-date
      hint: Membership start date
      type: date
      options: []
      required: false
    - id: 8
      name: payment_method
      label: payment-method
      hint: null
      type: select_one
      options:
      - credit-card
      - bank-transfer
      - cash
      required: false
    - id: 9
      name: payment_info
      label: payment-info
      hint: Payment information (e.g., card number, bank transfer details)
      type: text
      options: []
      required: false
