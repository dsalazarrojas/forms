      type: text
      options: []
      required: true
    - id: 6
      name: minor_name
      label: Minor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: minor_dob
      label: Minor DOB
      hint: Minor's Date of Birth
      type: date
      options: []
      required: true
    - id: 8
      name: minor_signature
      label: Minor Signature
      hint: Minor's Signature
      type: note
      options: []
      required: true
    - id: 9
      name: parent_signature
      label: Parent Signature
      hint: Parent/Guardian Signature
      type: text
      options: []
      required: true
    - id: 10
      name: date
      label: Date
