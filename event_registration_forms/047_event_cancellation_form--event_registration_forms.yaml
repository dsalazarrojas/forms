inputSchema:
  type: object
  properties:
    title: Event Cancellation Form
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: reason
      label: Cancellation Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: refund_amount
      label: Refund Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: refund_method
      label: Refund Method
      hint: null
      type: select_one
      options:
      - Bank Transfer
      - Cheque
      - Cash
      - PayPal
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_info
      label: Contact Info
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: confirm_cancel
      label: Confirm Cancellation
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: confirm_refund
      label: Confirm Refund
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: confirm_cancel_reason
      label: Confirm Cancellation Reason
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
