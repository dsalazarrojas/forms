inputSchema:
  type: object
  properties:
    title: Social Enterprise Seminar Attendance Form
    pages:
    - id: 1
      name: seminar_registration
      label: Seminar Registration
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email_address
      label: Email Address
      hint: Enter your email address
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: seminar_attendance
      label: Attendees
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: date_of_attendance
      label: Date of Attendance
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time_of_attendance
      label: Time of Attendance
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: event_date
      label: Event Date
      hint: null
      type: select_one
      options:
      - '2022-01-01'
      - '2022-01-15'
      - '2022-02-01'
      required: false
    - id: 11
      name: event_time
      label: Event Time
      hint: null
      type: select_one
      options:
      - 08:00
      - '14:00'
      - '18:00'
      required: false
