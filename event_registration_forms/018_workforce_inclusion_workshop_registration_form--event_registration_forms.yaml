inputSchema:
  type: object
  properties:
    title: Workforce Inclusion Workshop Registration Form
    pages:
    - id: 1
      name: registration_form
      label: Registration Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: role
      label: Role
      hint: null
      type: select_one
      options:
      - '{''name'': ''Participant''}'
      - '{''name'': ''Facilitator''}'
      - '{''name'': ''Organizer''}'
      required: true
    - id: 6
      name: workshop_date
      label: Workshop Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: workshop_time
      label: Workshop Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: event_time
      label: Event Time
      hint: null
      type: number
      options: []
      required: false
