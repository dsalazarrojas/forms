inputSchema:
  type: object
  properties:
    title: Tournament Volunteer Shirt Printing Order Form
    pages:
    - id: 1
      name: volunteer_name
      label: Volunteer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: volunteer_email
      label: Volunteer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: shirt_size
      label: Shirt Size
      hint: null
      type: select_one
      options:
      - Large
      - X-Large
      - Medium
      - Small
      - Extra Small
      required: false
    - id: 4
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: event_name
      label: Event Name
      hint: null
      type: select_multiple
      options:
      - Event 1
      - Event 2
      - Event 3
      required: false
    - id: 6
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
