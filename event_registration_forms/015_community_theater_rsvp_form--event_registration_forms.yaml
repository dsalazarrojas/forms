inputSchema:
  type: object
  properties:
    title: Community Theater RSVP Form
    pages:
    - id: 1
      name: guest_full_name
      label: Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: guest_email
      label: Email Address
      hint: For confirmation and updates
      type: email
      options: []
      required: true
    - id: 3
      name: guest_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 4
      name: rsvp_event
      label: Which event are you RSVPing for?
      hint: Select the performance or event
      type: select_one
      options:
      - Opening Night Gala
      - Spring Musical - Evening Show
      - Spring Musical - Matinee
      - Summer Drama Series
      - Fall Play - Opening Weekend
      - Fall Play - Closing Weekend
      - Winter Holiday Show
      - Children's Theater Performance
      - Behind the Scenes Tour
      - Cast Meet and Greet
      - Donor Appreciation Event
      - Other
      required: true
    - id: 5
      name: event_date
      label: Event Date
      hint: Select the date
      type: date
      options: []
      required: true
    - id: 6
      name: attendance_status
      label: Will you be attending?
      hint: Your attendance status
      type: select_one
      options:
      - Yes, I will attend
      - No, I cannot attend
      - Maybe, will confirm later
      required: true
    - id: 7
      name: number_of_guests
      label: How many guests will attend with you?
      hint: Including yourself
      type: number
      options: []
      required: true
    - id: 8
      name: guest_names
      label: Names of Additional Guests
      hint: List full names of all attendees
      type: text
      options: []
      required: false
    - id: 9
      name: seating_preference
      label: Seating Preference
      hint: Where would you like to sit?
      type: select_one
      options:
      - Orchestra (Front)
      - Orchestra (Middle)
      - Orchestra (Back)
      - Mezzanine
      - Balcony
      - No preference
      - Accessible seating needed
      required: true
    - id: 10
      name: ticket_type
      label: Ticket Type
      hint: Type of admission
      type: select_one
      options:
      - General Admission
      - Senior (65+)
      - Student (with ID)
      - Child (under 12)
      - Subscriber
      - Donor/Member
      - Complimentary
      - Press/Media
      required: true
    - id: 11
      name: section_dining
      label: -- Dinner Options --
      hint: If applicable for the event
      type: note
      options: []
      required: false
    - id: 12
      name: dinner_attendance
      label: Will you join us for the pre-show dinner?
      hint: If available for this event
      type: select_one
      options:
      - true
      - false
      - Maybe
      required: false
    - id: 13
      name: dietary_restrictions
      label: Any dietary restrictions or allergies?
      hint: For meal planning
      type: select_multiple
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Dairy-Free
      - Nut Allergy
      - Shellfish Allergy
      - Kosher
      - Halal
      - Other
      required: false
    - id: 14
      name: dietary_details
      label: Please specify any other dietary needs
      hint: Additional details
      type: text
      options: []
      required: false
    - id: 15
      name: section_accessibility
      label: -- Accessibility Needs --
      hint: We want to accommodate everyone
      type: note
      options: []
      required: false
    - id: 16
      name: accessibility_needs
      label: Do you require any accessibility accommodations?
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - Wheelchair accessible seating
      - Assistive listening device
      - Large print program
      - Sign language interpreter
      - Audio description
      - Service animal accommodation
      - Other
      required: false
    - id: 17
      name: accessibility_details
      label: Please describe your accessibility needs
      hint: So we can best accommodate you
      type: text
      options: []
      required: false
    - id: 18
      name: section_transportation
      label: -- Transportation --
      hint: Getting to the theater
      type: note
      options: []
      required: false
    - id: 19
      name: transportation_method
      label: How will you get to the theater?
      hint: Transportation method
      type: select_one
      options:
      - Personal vehicle
      - Public transportation
      - Rideshare (Uber/Lyft)
      - Theater shuttle (if available)
      - Walking
      - Other
      required: false
    - id: 20
      name: parking_needed
      label: Will you need parking information?
      hint: Parking near the theater
      type: select_one
      options:
      - No, I'm familiar with the area
      - Yes, please send parking info
      - Yes, I need accessible parking
      required: false
    - id: 21
      name: section_interests
      label: -- Additional Interests --
      hint: Enhance your theater experience
      type: note
      options: []
      required: false
    - id: 22
      name: backstage_tour
      label: Are you interested in a backstage tour?
      hint: If available
      type: select_one
      options:
      - Yes, very interested
      - Maybe, depends on schedule
      - No, not interested
      required: false
    - id: 23
      name: cast_meetgreet
      label: Would you like to attend a cast meet and greet?
      hint: Post-show opportunity
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 24
      name: merchandise_interest
      label: Are you interested in purchasing merchandise?
      hint: Programs, souvenirs, etc.
      type: select_one
      options:
      - Yes, definitely
      - Maybe
      - No, thank you
      required: false
    - id: 25
      name: first_time_attendee
      label: Is this your first time at our theater?
      hint: Welcome!
      type: select_one
      options:
      - Yes, first time
      - No, I've been before
      - I'm a regular subscriber
      required: true
    - id: 26
      name: how_heard_about
      label: How did you hear about this event?
      hint: Referral source
      type: select_one
      options:
      - Email Newsletter
      - Social Media
      - Theater Website
      - Friend or Family
      - Newspaper/ Magazine
      - Radio
      - Previous Attendee
      - Other
      required: false
    - id: 27
      name: special_occasion
      label: Are you celebrating a special occasion?
      hint: Birthday, anniversary, etc.
      type: select_one
      options:
      - false
      - Birthday
      - Anniversary
      - Date Night
      - Family Outing
      - Corporate Event
      - Other
      required: false
    - id: 28
      name: special_occasion_details
      label: If yes, please describe
      hint: We may have a special surprise
      type: text
      options: []
      required: false
    - id: 29
      name: additional_comments
      label: Any additional comments or requests?
      hint: We're here to help
      type: text
      options: []
      required: false
    - id: 30
      name: rsvp_date
      label: RSVP Date
      hint: Today's date
      type: date
      options: []
      required: true
