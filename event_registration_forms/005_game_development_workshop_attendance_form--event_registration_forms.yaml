inputSchema:
  type: object
  properties:
    title: Game Development Workshop Attendance Form
    pages:
    - id: 1
      name: workshop_date
      label: Workshop Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: email_confirmation
      label: Confirm Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: role
      label: Participant Role
      hint: null
      type: select_one
      options:
      - Game Developer
      - Student
      - Guest
      required: false
    - id: 7
      name: team
      label: Team
      hint: null
      type: select_multiple
      options:
      - Front End
      - Back End
      - Game Development
      required: false
    - id: 8
      name: company
      label: Company
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submit_confirmation
      label: Confirm Submission
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
