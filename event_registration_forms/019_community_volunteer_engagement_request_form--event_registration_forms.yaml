inputSchema:
  type: object
  properties:
    title: Community Volunteer Engagement Request Form
    pages:
    - id: 1
      name: volunteer_full_name
      label: Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: volunteer_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: volunteer_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: mailing_address
      label: Mailing Address
      hint: Street, city, state, zip
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: Must be 14 or older
      type: date
      options: []
      required: true
    - id: 6
      name: engagement_type
      label: What type of volunteer engagement are you seeking?
      hint: Select your interest
      type: select_one
      options:
      - One-time Event
      - Short-term Project (1-3 months)
      - Long-term Commitment (6+ months)
      - Ongoing Regular Volunteering
      - Flexible/As Needed
      - Virtual Volunteering
      required: true
    - id: 7
      name: cause_interest
      label: What causes interest you most?
      hint: Select all that apply
      type: select_multiple
      options:
      - Education and Youth
      - Health and Wellness
      - Environment
      - Animal Welfare
      - Arts and Culture
      - Homelessness and Housing
      - Hunger and Food Security
      - Senior Services
      - Disability Services
      - Veterans Services
      - Community Development
      - Disaster Relief
      - Other
      required: true
    - id: 8
      name: specific_program
      label: Do you have a specific program in mind?
      hint: If you know which program
      type: text
      options: []
      required: false
    - id: 9
      name: skills_to_offer
      label: What skills can you offer?
      hint: Select all that apply
      type: select_multiple
      options:
      - Teaching/Tutoring
      - Mentoring
      - Administrative Support
      - Event Planning
      - Marketing/Social Media
      - Graphic Design
      - Photography/Videography
      - Web Development
      - Writing/Editing
      - Fundraising
      - Grant Writing
      - Counseling
      - Legal Services
      - Medical/Healthcare
      - Construction/Handyman
      - Gardening/Landscaping
      - Cooking/Food Prep
      - Driving/Delivery
      - Translation/Interpretation
      - Other
      required: true
    - id: 10
      name: skills_description
      label: Please describe your skills in detail
      hint: Level of expertise and experience
      type: text
      options: []
      required: false
    - id: 11
      name: availability_weekdays
      label: Weekday Availability
      hint: Select all that apply
      type: select_multiple
      options:
      - Monday Morning
      - Monday Afternoon
      - Monday Evening
      - Tuesday Morning
      - Tuesday Afternoon
      - Tuesday Evening
      - Wednesday Morning
      - Wednesday Afternoon
      - Wednesday Evening
      - Thursday Morning
      - Thursday Afternoon
      - Thursday Evening
      - Friday Morning
      - Friday Afternoon
      - Friday Evening
      required: true
    - id: 12
      name: availability_weekends
      label: Weekend Availability
      hint: Select all that apply
      type: select_multiple
      options:
      - Saturday Morning
      - Saturday Afternoon
      - Saturday Evening
      - Sunday Morning
      - Sunday Afternoon
      - Sunday Evening
      - Not Available Weekends
      required: true
    - id: 13
      name: hours_per_week
      label: How many hours per week can you volunteer?
      hint: Time commitment
      type: select_one
      options:
      - 1-2 hours
      - 3-5 hours
      - 6-10 hours
      - 11-15 hours
      - 16-20 hours
      - 20+ hours
      required: true
    - id: 14
      name: start_date
      label: When can you start volunteering?
      hint: Available start date
      type: date
      options: []
      required: true
    - id: 15
      name: prior_volunteer_experience
      label: Do you have prior volunteer experience?
      hint: Previous volunteering
      type: select_one
      options:
      - No, first time
      - Yes, 1-2 organizations
      - Yes, 3-5 organizations
      - Yes, 6+ organizations
      required: true
    - id: 16
      name: experience_details
      label: Please describe your volunteer experience
      hint: Organizations and roles
      type: text
      options: []
      required: false
    - id: 17
      name: group_volunteer
      label: Are you interested in group volunteering?
      hint: With friends, family, or coworkers
      type: select_one
      options:
      - No, individual only
      - Yes, with family
      - Yes, with friends
      - Yes, with coworkers
      - Yes, with school group
      - Yes, interested in both
      required: true
    - id: 18
      name: group_size
      label: If yes, approximately how many people?
      hint: Group size
      type: number
      options: []
      required: false
    - id: 19
      name: transportation_access
      label: Do you have reliable transportation?
      hint: Getting to volunteer sites
      type: select_one
      options:
      - Yes, personal vehicle
      - Yes, public transportation
      - No, need assistance
      required: true
    - id: 20
      name: background_check_consent
      label: I consent to a background check if required
      hint: Some positions require verification
      type: select_one
      options:
      - Yes, I Consent
      - No, I Do Not Consent
      required: true
    - id: 21
      name: training_availability
      label: Are you available for required training sessions?
      hint: Orientation and training
      type: select_one
      options:
      - Yes, definitely
      - Yes, with advance notice
      - Depends on schedule
      required: true
    - id: 22
      name: physical_requirements
      label: Are there any physical activities you cannot perform?
      hint: Lifting, standing, walking, etc.
      type: text
      options: []
      required: false
    - id: 23
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 24
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number
      type: text
      options: []
      required: true
    - id: 25
      name: how_heard_about
      label: How did you hear about volunteer opportunities?
      hint: Referral source
      type: select_one
      options:
      - Organization Website
      - Social Media
      - Friend or Family
      - Community Event
      - School/University
      - Workplace
      - Volunteer Matching Site
      - Newspaper/Magazine
      - Other
      required: true
    - id: 26
      name: motivation_statement
      label: Why do you want to volunteer with us?
      hint: Your motivation and goals
      type: text
      options: []
      required: true
    - id: 27
      name: additional_comments
      label: Any additional comments or questions?
      hint: Anything else
      type: text
      options: []
      required: false
    - id: 28
      name: request_date
      label: Request Date
      hint: Today's date
      type: date
      options: []
      required: true
