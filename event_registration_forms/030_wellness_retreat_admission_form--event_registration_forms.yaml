inputSchema:
  type: object
  properties:
    title: Wellness Retreat Admission Form
    pages:
    - id: 1
      name: name
      label: Full Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: time
      label: End Date
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: select_one
      label: Preferred Time Slot
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: false
    - id: 7
      name: select_multiple
      label: Interests
      hint: null
      type: select_multiple
      options:
      - Meditation
      - Yoga
      - Fitness
      - Wellness
      required: false
    - id: 8
      name: note
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
