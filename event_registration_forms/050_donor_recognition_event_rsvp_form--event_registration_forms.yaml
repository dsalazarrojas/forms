inputSchema:
  type: object
  properties:
    title: Donor Recognition Event RSVP Form
    pages:
    - id: 1
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: contact_method
      label: Contact Method
      hint: null
      type: select_one
      options:
      - '{''label'': ''Phone'', ''value'': ''phone''}'
      - '{''label'': ''Email'', ''value'': ''email''}'
      - '{''label'': ''Mail'', ''value'': ''mail''}'
      - '{''label'': ''Other'', ''value'': ''other''}'
      required: false
    - id: 5
      name: rsvp_response
      label: RSVP Response
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''Attending'', ''value'': ''attending''}'
      - '{''label'': ''Not Attending'', ''value'': ''not_attending''}'
      - '{''label'': ''Maybe'', ''value'': ''maybe''}'
      required: false
    - id: 6
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
