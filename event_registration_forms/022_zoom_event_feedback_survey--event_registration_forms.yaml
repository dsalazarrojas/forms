      options: []
      required: false
    - id: 8
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''User 1''}'
      - '{''id'': 2, ''label'': ''User 2''}'
      - '{''id'': 3, ''label'': ''User 3''}'
      required: true
