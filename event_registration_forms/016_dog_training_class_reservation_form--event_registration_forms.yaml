      - 'No'
      required: false
    - id: 5
      name: class_date
      label: Class Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: class_time
      label: Class Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: training_class_additional_info
      label: Additional Class Info
      hint: null
      type: text
      options: []
      required: false
