inputSchema:
  type: object
  properties:
    title: Birthday Party Itinerary Form
    pages:
    - id: 1
      name: section_intro
      label: -- Birthday Party Itinerary --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: intro_message
      label: Check out the party schedule and confirm your availability
      hint: Complete this form to confirm attendance details
      type: note
      options: []
      required: false
    - id: 3
      name: section_event_basics
      label: -- Event Basics --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: birthday_person
      label: Birthday Celebrant
      hint: Who is the birthday person
      type: text
      options: []
      required: true
    - id: 5
      name: party_date
      label: Party Date
      hint: When is the party
      type: date
      options: []
      required: true
    - id: 6
      name: party_time_start
      label: Party Start Time
      hint: What time does it begin
      type: time
      options: []
      required: true
    - id: 7
      name: party_time_end
      label: Party End Time
      hint: What time does it end
      type: time
      options: []
      required: true
    - id: 8
      name: party_location
      label: Party Location
      hint: Where is the party
      type: text
      options: []
      required: true
    - id: 9
      name: section_itinerary
      label: -- Party Schedule/Itinerary --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: itinerary_description
      label: Party Schedule
      hint: Times for activities, meals, etc.
      type: text
      options: []
      required: false
    - id: 11
      name: arrival_time
      label: Guest Arrival Time
      hint: When should guests arrive
      type: time
      options: []
      required: true
    - id: 12
      name: greeting_activity
      label: Greeting Activity or Icebreaker
      hint: What happens upon arrival
      type: text
      options: []
      required: false
    - id: 13
      name: activity1_time
      label: First Activity Time
      hint: When does first activity start
      type: time
      options: []
      required: false
    - id: 14
      name: activity1_description
      label: First Activity Description
      hint: What is the first activity
      type: text
      options: []
      required: false
    - id: 15
      name: meal_time
      label: Meal or Snack Time
      hint: When is food served
      type: time
      options: []
      required: false
    - id: 16
      name: activity2_time
      label: Second Activity Time
      hint: When does second activity start
      type: time
      options: []
      required: false
    - id: 17
      name: activity2_description
      label: Second Activity Description
      hint: What is the second activity
      type: text
      options: []
      required: false
    - id: 18
      name: cake_cutting_time
      label: Cake Cutting Time
      hint: When will cake be served
      type: time
      options: []
      required: false
    - id: 19
      name: gift_opening_time
      label: Gift Opening Time
      hint: When will gifts be opened
      type: time
      options: []
      required: false
    - id: 20
      name: cleanup_time
      label: Cleanup/Departure Time
      hint: When will party end
      type: time
      options: []
      required: true
    - id: 21
      name: section_guest_info
      label: -- Guest Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: guest_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 23
      name: guest_email
      label: Email Address
      hint: Your email
      type: email
      options: []
      required: true
    - id: 24
      name: guest_phone
      label: Phone Number
      hint: Your contact number
      type: text
      options: []
      required: false
    - id: 25
      name: section_attendance
      label: -- Attendance Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: will_attend
      label: Will You Attend
      hint: Confirm your attendance
      type: select_one
      options:
      - Yes, Will Attend
      - No, Cannot Attend
      - Unsure - Will Confirm Later
      required: true
    - id: 27
      name: arrival_confirmation
      label: Can You Arrive at Scheduled Time
      hint: Confirm arrival time works for you
      type: select_one
      options:
      - Yes, Can Arrive on Time
      - Will Arrive Late
      - Early Arrival
      required: false
    - id: 28
      name: guests_in_party
      label: Number of Guests in Your Party
      hint: Total people attending
      type: number
      options: []
      required: true
    - id: 29
      name: section_preferences
      label: -- Preferences and Needs --
      hint: null
      type: note
      options: []
      required: false
    - id: 30
      name: dietary_restrictions
      label: Dietary Restrictions or Allergies
      hint: Any dietary needs
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Nut Allergy
      - Dairy-Free
      - Other
      - None
      required: false
    - id: 31
      name: dietary_notes
      label: Dietary Notes
      hint: Specific requirements
      type: text
      options: []
      required: false
    - id: 32
      name: activity_restrictions
      label: Activities Your Group Cannot Participate In
      hint: Any limitations or restrictions
      type: text
      options: []
      required: false
    - id: 33
      name: mobility_needs
      label: Mobility or Accessibility Needs
      hint: Any accommodations needed
      type: text
      options: []
      required: false
    - id: 34
      name: section_gifts
      label: -- Gift Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 35
      name: bringing_gift
      label: Will You Bring a Gift
      hint: Plan to bring a gift
      type: select_one
      options:
      - Yes, Will Bring Gift
      - No, Prefer Not To
      - Maybe
      - Gift Already Sent
      required: false
    - id: 36
      name: gift_preference
      label: Gift Ideas or Preferences
      hint: What does birthday person need
      type: text
      options: []
      required: false
    - id: 37
      name: section_special
      label: -- Special Requests --
      hint: null
      type: note
      options: []
      required: false
    - id: 38
      name: birthday_message
      label: Birthday Message for Celebrant
      hint: Special message
      type: text
      options: []
      required: false
    - id: 39
      name: special_requests
      label: Special Requests or Comments
      hint: Anything else hosts should know
      type: text
      options: []
      required: false
    - id: 40
      name: confirmation
      label: I confirm this information is correct
      hint: Check to confirm
      type: select_one
      options:
      - Confirmed
      - Not Confirmed
      required: true
