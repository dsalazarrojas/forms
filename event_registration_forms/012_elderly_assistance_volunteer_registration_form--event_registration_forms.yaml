inputSchema:
  type: object
  properties:
    title: Elderly Assistance Volunteer Registration Form
    pages:
    - id: 1
      name: volunteer_name
      label: Volunteer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: organization
      label: organization
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: volunteer_role
      label: volunteer_role
      hint: Select your role
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: available_time
      label: available_time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: available_days
      label: available_days
      hint: Select your available days
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: preferred_time
      label: preferred_time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: preferred_time_end
      label: preferred_time_end
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: available_location
      label: available_location
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: volunteer_note
      label: volunteer_note
      hint: Additional comments or notes about the volunteer.
      type: note
      options: []
      required: false
