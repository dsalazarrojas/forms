inputSchema:
  type: object
  properties:
    title: Color Wheel Project Registration
    pages:
    - id: 1
      name: header
      label: -- Project Registration --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone number
      hint: Contact phone
      type: text
      options: []
      required: false
    - id: 5
      name: project_title
      label: Project title
      hint: Short title for project
      type: text
      options: []
      required: true
    - id: 6
      name: age_group
      label: Age group
      hint: Participant age group
      type: select_one
      options:
      - Child
      - Teen
      - Adult
      - Senior
      required: false
    - id: 7
      name: materials_needed
      label: Materials needed
      hint: List supplies required
      type: text
      options: []
      required: false
    - id: 8
      name: preferred_session
      label: Preferred session time
      hint: Morning, afternoon, evening
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: false
    - id: 9
      name: emergency_contact
      label: Emergency contact
      hint: Name and phone
      type: text
      options: []
      required: false
    - id: 10
      name: special_needs
      label: Special needs or accessibility
      hint: Any accommodations required
      type: text
      options: []
      required: false
