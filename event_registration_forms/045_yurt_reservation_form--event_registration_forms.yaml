inputSchema:
  type: object
  properties:
    title: Yurt Reservation Form
    pages:
    - id: 1
      name: name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date
      label: Arrival Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: time
      label: Arrival Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: yurt_selection
      label: Yurt Selection
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: room
      label: Room Type
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
