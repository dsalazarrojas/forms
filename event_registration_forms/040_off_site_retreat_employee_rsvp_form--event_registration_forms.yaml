inputSchema:
  type: object
  properties:
    title: off_site_retreat_employee_rsvp_form
    pages:
    - id: 1
      name: employee_details
      label: Employee Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: attendance
      label: Attendance
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: checkin_time
      label: Checkin Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: checkout_time
      label: Checkout Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: accommodation
      label: Accommodation
      hint: null
      type: select_one
      options:
      - Onsite
      - Offsite
      - Both
      required: false
    - id: 6
      name: meal_preferences
      label: Meal Preferences
      hint: null
      type: select_multiple
      options:
      - Breakfast
      - Dinner
      - Lunch
      - Snacks
      required: false
    - id: 7
      name: special_requests
      label: Special Requests
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: rsvp
      label: RSVP
      hint: null
      type: select_multiple
      options:
      - Confirmed
      - Tentative
      - No Show
      required: false
