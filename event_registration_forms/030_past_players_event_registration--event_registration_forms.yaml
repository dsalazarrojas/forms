inputSchema:
  type: object
  properties:
    title: Past Players Event Registration
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: event_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: attendees
      label: Number of Attendees
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Event Type 1
      - Event Type 2
      - Event Type 3
      required: true
    - id: 7
      name: event_category
      label: Event Category
      hint: null
      type: select_one
      options:
      - Category 1
      - Category 2
      - Category 3
      required: true
    - id: 8
      name: output_file
      label: Output File
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: rsvp
      label: RSVP
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: form_ids
      label: Form IDs
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
