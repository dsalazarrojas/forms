inputSchema:
  type: object
  properties:
    title: Retreat Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: time_of_birth
      label: Time of Birth
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: select_one
      label: How did you hear about this retreat?
      hint: null
      type: select_one
      options:
      - Facebook
      - Instagram
      - Twitter
      - Word of mouth
      - Online Search
      required: true
    - id: 8
      name: select_multiple
      label: What are your interests?
      hint: null
      type: select_multiple
      options:
      - Hiking
      - Biking
      - Camping
      required: false
