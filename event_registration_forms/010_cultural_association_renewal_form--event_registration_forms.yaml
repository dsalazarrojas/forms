inputSchema:
  type: object
  properties:
    title: Cultural Association Renewal Form
    pages:
    - id: 1
      name: membership_renewal_process
      label: Membership Renewal Process
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: member_name
      label: Member Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: membership_details
      label: Membership Details
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: membership_expiration_date
      label: Membership Expiration Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: renewal_confirmation
      label: Renewal Confirmation
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: membership_type
      label: Membership Type
      hint: null
      type: select_one
      options:
      - Individual
      - Organization
      required: false
    - id: 9
      name: membership_status
      label: Membership Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Pending
      - Inactive
      required: false
    - id: 10
      name: submit_form
      label: Submit Form
      hint: null
      type: text
      options: []
      required: false
