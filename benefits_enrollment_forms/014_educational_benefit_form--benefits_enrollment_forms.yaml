inputSchema:
  type: object
  properties:
    title: Educational Benefit Form
    pages:
    - id: 1
      name: educational_benefit_form
      label: Educational Benefit Form
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_name
      label: Student Name
      hint: Student name is required
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: student_phone
      label: Student Phone
      hint: 10 digits
      type: text
      options: []
      required: true
    - id: 6
      name: student_address
      label: Student Address
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: financial_aid_amount
      label: Financial Aid Amount
      hint: $ amount only
      type: number
      options: []
      required: true
    - id: 8
      name: financial_aid_type
      label: Financial Aid Type
      hint: null
      type: select_multiple
      options:
      - Federal
      - Institutional
      - Private
      required: true
    - id: 9
      name: date_of_benefit
      label: Date of Benefit
      hint: mm/dd/yyyy
      type: date
      options: []
      required: true
    - id: 10
      name: date_of_disbursement
      label: Date of Disbursement
      hint: mm/dd/yyyy
      type: date
      options: []
      required: true
    - id: 11
      name: benefit_amount
      label: Benefit Amount
      hint: $ amount only
      type: number
      options: []
      required: true
    - id: 12
      name: benefit_status
      label: Benefit Status
      hint: null
      type: select_one
      options:
      - Pending
      - Approved
      - Denied
      required: true
    - id: 13
      name: reason_for_denial
      label: Reason for Denial
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
