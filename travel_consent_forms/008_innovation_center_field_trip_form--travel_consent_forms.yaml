inputSchema:
  type: object
  properties:
    title: innovation_center_field_trip_form
    pages:
    - id: 1
      name: student_id
      label: student_id
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: guardian_name
      label: guardian_name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_number
      label: contact_number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: student_dob
      label: student_dob
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: student_grade_level
      label: student_grade_level
      hint: null
      type: select_one
      options:
      - '9'
      - '10'
      - '11'
      - '12'
      required: true
    - id: 7
      name: guardian_relationship
      label: guardian_relationship
      hint: null
      type: select_one
      options:
      - Mother
      - Father
      - Other
      - Mother and Father
      required: true
    - id: 8
      name: school_name
      label: school_name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: student_consent
      label: student_consent
      hint: Please sign this form to confirm that your school has permission to send
        you on this field trip
      type: note
      options: []
      required: false
    - id: 10
      name: guardian_consent
      label: guardian_consent
      hint: Please sign this form to give your permission for your child to participate
        in this trip
      type: note
      options: []
      required: false
