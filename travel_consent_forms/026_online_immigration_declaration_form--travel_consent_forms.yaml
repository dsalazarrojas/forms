inputSchema:
  type: object
  properties:
    title: Online Immigration Declaration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: birth_date
      label: Birth Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: nationality
      label: Nationality
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: passport_number
      label: Passport Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: passport_expiration_date
      label: Passport Expiration Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: country_of_residence
      label: Country of Residence
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: reason_for_travel
      label: Reason for Travel
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: travel_dates
      label: Travel Dates
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: travel_duration
      label: Travel Duration
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: mode_of_transportation
      label: Mode of Transportation
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: travel_document
      label: Travel Document
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
