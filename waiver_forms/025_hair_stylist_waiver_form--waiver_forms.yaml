inputSchema:
  type: object
  properties:
    title: Hair Stylist Waiver Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: service_date
      label: Service Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: service_start_time
      label: Service Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: stylist_name
      label: Stylist Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: release_of_liability
      label: Release of Liability
      hint: Check the box below to sign and release the stylist.
      type: select_multiple
      options:
      - I release the service provider for any liabilities
      - Other
      required: true
    - id: 6
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: client_signature
      label: Client Signature
      hint: null
      type: note
      options: []
      required: false
