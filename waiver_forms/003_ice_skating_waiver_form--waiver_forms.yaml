inputSchema:
  type: object
  properties:
    title: Ice Skating Waiver Form
    pages:
    - id: 1
      name: form_id
      label: Form Id
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: category
      label: Category
      hint: null
      type: select_multiple
      options:
      - Waiver Forms
      - Entertainment Forms
      - Event Planner Forms
      required: true
    - id: 3
      name: description
      label: Description
      hint: null
      type: text
      options: []
