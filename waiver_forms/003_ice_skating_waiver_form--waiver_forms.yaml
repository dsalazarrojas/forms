    - id: 6
      name: save_as_pdf
      label: Save as PDFs
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: no_coding
      label: No Coding
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: response_files
      label: Response Files
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: terms_and_conditions_text
      label: Terms and Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: waiver_text
      label: Waiver
      hint: null
      type: text
      options: []
      required: true
