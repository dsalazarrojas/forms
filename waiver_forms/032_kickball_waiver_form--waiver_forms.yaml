inputSchema:
  type: object
  properties:
    title: Kickball Waiver Form
    pages:
    - id: 1
      name: name
      label: Player Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: prophets
      label: Date of prophets meeting
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: waiver_type
      label: Waiver type
      hint: null
      type: select_one
      options:
      - Football
      - Hockey
      - Soccer
      - Baseball
      - Kickball
      required: false
    - id: 5
      name: waiver_version
      label: Waiver version
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: player_consent
      label: Player Consent
      hint: null
      type: select_multiple
      options:
      - I consent to being a part of the Kickball league
      - I consent to being a part of the Kickball league. I will participate in all
        games, including playoffs.
      - I consent to being a part of the Kickball league and will not participate
        in any games.
      required: false
    - id: 7
      name: file
      label: File
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
