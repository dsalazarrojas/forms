inputSchema:
  type: object
  properties:
    title: Before And Afterschool Care Registration
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: student_dob
      label: Student Date of Birth
      hint: MM-DD-YYYY
      type: date
      options: []
      required: true
    - id: 3
      name: student_age
      label: Student Age
      hint: Current age
      type: number
      options: []
      required: true
    - id: 4
      name: student_gender
      label: Student Gender
      hint: Gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      - Other
      required: true
    - id: 5
      name: student_address
      label: Student Address
      hint: Full street address
      type: text
      options: []
      required: true
    - id: 6
      name: school_name
      label: School Name
      hint: Which school does student attend
      type: text
      options: []
      required: true
    - id: 7
      name: grade_level
      label: Grade Level
      hint: Current grade
      type: select_one
      options:
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      required: true
    - id: 8
      name: guardian_name
      label: Primary Guardian Name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 9
      name: guardian_relationship
      label: Guardian Relationship
      hint: Relationship to student
      type: select_one
      options:
      - Mother
      - Father
      - Grandparent
      - Legal Guardian
      - Foster Parent
      - Other
      required: true
    - id: 10
      name: guardian_email
      label: Guardian Email
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 11
      name: guardian_phone
      label: Guardian Phone
      hint: Best number to reach you
      type: text
      options: []
      required: true
    - id: 12
      name: guardian_work_phone
      label: Guardian Work Phone
      hint: Work number
      type: text
      options: []
      required: false
    - id: 13
      name: second_guardian_name
      label: Second Guardian Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 14
      name: second_guardian_phone
      label: Second Guardian Phone
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 15
      name: emergency_contact_1
      label: Emergency Contact 1
      hint: Name relationship and phone
      type: text
      options: []
      required: true
    - id: 16
      name: emergency_contact_2
      label: Emergency Contact 2
      hint: Name relationship and phone
      type: text
      options: []
      required: true
    - id: 17
      name: emergency_contact_3
      label: Emergency Contact 3
      hint: Name relationship and phone
      type: text
      options: []
      required: false
    - id: 18
      name: physician_name
      label: Physician Name
      hint: Doctor name
      type: text
      options: []
      required: true
    - id: 19
      name: physician_phone
      label: Physician Phone
      hint: Doctor phone number
      type: text
      options: []
      required: true
    - id: 20
      name: medical_insurance
      label: Medical Insurance
      hint: Provider and policy number
      type: text
      options: []
      required: false
    - id: 21
      name: health_history
      label: Health History
      hint: Any significant health history
      type: text
      options: []
      required: false
    - id: 22
      name: current_medications
      label: Current Medications
      hint: List all medications with dosages
      type: text
      options: []
      required: false
    - id: 23
      name: allergies
      label: Allergies
      hint: Food medication or environmental
      type: text
      options: []
      required: false
    - id: 24
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Any food restrictions
      type: text
      options: []
      required: false
    - id: 25
      name: immunization_status
      label: Immunization Status
      hint: Are immunizations up to date
      type: select_one
      options:
      - Yes up to date
      - No not up to date
      - Medical Exemption
      - Religious Exemption
      required: true
    - id: 26
      name: special_needs
      label: Special Needs
      hint: Any special needs or accommodations
      type: text
      options: []
      required: false
    - id: 27
      name: behavioral_concerns
      label: Behavioral Concerns
      hint: Any behavioral considerations
      type: text
      options: []
      required: false
    - id: 28
      name: transportation_plan
      label: Transportation Plan
      hint: How will student get to and from program
      type: text
      options: []
      required: true
    - id: 29
      name: authorized_pickup
      label: Authorized Pickup List
      hint: All people authorized to pick up student
      type: text
      options: []
      required: true
    - id: 30
      name: program_schedule
      label: Program Schedule
      hint: Select days and times
      type: select_multiple
      options:
      - Monday After School
      - Tuesday After School
      - Wednesday After School
      - Thursday After School
      - Friday After School
      - Monday Before School
      - Tuesday Before School
      - Wednesday Before School
      - Thursday Before School
      - Friday Before School
      required: true
    - id: 31
      name: start_date
      label: Start Date
      hint: When will student begin
      type: date
      options: []
      required: true
    - id: 32
      name: how_heard
      label: How Did You Hear About Us
      hint: How did you find our program
      type: select_one
      options:
      - School Referral
      - Friend or Family
      - Online Search
      - Social Media
      - Advertisement
      - Community Event
      - Other
      required: false
    - id: 33
      name: terms_acceptance
      label: Terms and Conditions
      hint: I agree to all program terms and policies
      type: select_one
      options:
      - I accept
      - I do not accept
      required: true
    - id: 34
      name: signature
      label: Guardian Signature
      hint: By selecting yes I agree to all terms
      type: select_one
      options:
      - I agree as parent or guardian
      - I do not agree
      required: true
    - id: 35
      name: registration_date
      label: Registration Date
      hint: Today date
      type: date
      options: []
      required: true
