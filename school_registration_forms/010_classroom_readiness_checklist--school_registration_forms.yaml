inputSchema:
  type: object
  properties:
    title: Classroom Readiness Checklist
    pages:
      - id: 1
        name: checklist_header
        label: -- Classroom Readiness Checklist --
        hint: Perform this check before the first day of school
        type: note
        options: []
        required: false
      - id: 2
        name: teacher_name
        label: Teacher Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: room_number
        label: Room Number
        hint: null
        type: text
        options: []
        required: true
      - id: 4
        name: check_date
        label: Inspection Date
        hint: null
        type: date
        options: []
        required: true
      - id: 5
        name: furniture_ready
        label: All desks and chairs are accounted for and in good repair
        hint: Physical Environment
        type: select_one
        options:
          - Completed
          - In Progress
          - Needs Attention
        required: true
      - id: 6
        name: supplies_stocked
        label: Basic classroom supplies (markers, paper, etc.) are stocked
        hint: null
        type: select_one
        options:
          - Completed
          - In Progress
          - Needs Attention
        required: true
      - id: 7
        name: tech_check
        label: Computer, projector, and speakers are functioning
        hint: Technology
        type: select_one
        options:
          - Completed
          - In Progress
          - Needs Attention
        required: true
      - id: 8
        name: safety_items
        label: Fire extinguisher, first aid kit, and emergency maps are present
        hint: Safety
        type: select_one
        options:
          - Completed
          - In Progress
          - Needs Attention
        required: true
      - id: 9
        name: displays_ready
        label: Bulletin boards and wall displays are updated
        hint: null
        type: select_one
        options:
          - Completed
          - In Progress
          - Needs Attention
        required: true
      - id: 10
        name: student_materials
        label: Name tags and cubby labels are prepared
        hint: null
        type: select_one
        options:
          - Completed
          - In Progress
          - Needs Attention
        required: true
      - id: 11
        name: curriculum_ready
        label: First week lesson plans and materials are organized
        hint: Instruction
        type: select_one
        options:
          - Completed
          - In Progress
          - Needs Attention
        required: true
      - id: 12
        name: cleaning_verified
