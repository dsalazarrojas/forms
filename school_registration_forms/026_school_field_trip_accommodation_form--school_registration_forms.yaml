inputSchema:
  type: object
  properties:
    title: School Field Trip Accommodation Form
    pages:
    - id: 1
      name: trip_name
      label: Trip Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: trip_date
      label: Trip Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: arrival_time
      label: Arrival Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: departure_time
      label: Departure Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: accommodation_type
      label: Accommodation Type
      hint: null
