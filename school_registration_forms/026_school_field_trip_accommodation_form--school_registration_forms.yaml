      - Hotel
      - Other
      required: false
    - id: 6
      name: student_count
      label: Student Count
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: accommodation_address
      label: Accommodation Address
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: school_email
      label: School Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: school_phone
      label: School Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: accommodation_provider
      label: Accommodation Provider
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
