inputSchema:
  type: object
  properties:
    title: School Trip Waiver Form
    pages:
    - id: 1
      name: trip_date
      label: Trip Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: trip_length
      label: Trip Length
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: parent_consent
      label: Parent Consent
      hint: null
      type: select_multiple
      options:
      - Parent A
      - Parent B
      - Parent C
      required: true
