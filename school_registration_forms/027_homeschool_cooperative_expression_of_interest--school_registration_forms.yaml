      name: family_demographics
      label: Family Demographics
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: family_goals
      label: Family Goals
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: school_goals
      label: School Goals
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: teacher_qualifications
      label: Teacher Qualifications
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: references
      label: References
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: co_op_fees
      label: Co-op Fees
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: co_op_commitment
      label: Co-op Commitment
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: co_op_role
      label: Co-op Role
      hint: null
      type: select_one
      options:
      - Member
      - Non-Member
      required: true
    - id: 16
      name: family_commitment
      label: Family Commitment
      hint: null
      type: text
      options: []
