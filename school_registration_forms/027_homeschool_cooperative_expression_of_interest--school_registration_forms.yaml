inputSchema:
  type: object
  properties:
    title: Homeschool Cooperative Expression Of Interest
    pages:
    - id: 1
      name: family_interest
      label: Family Interest
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: school_background
      label: School Background
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_info
      label: Contact Info
      hint: Please provide your email and phone number
      type: email
      options: []
      required: false
    - id: 4
      name: home_schooling_method
      label: Homeschooling Method
      hint: null
      type: select_multiple
      options:
      - Classical
      - Charlotte Mason
      - Literature-Based
      - Eclectic
      - Relaxed
      - Other (please specify)
      required: true
    - id: 5
      name: school_formation
      label: School Formation
      hint: null
      type: select_one
      options:
      - Co-op
      - Co-op and Homeschool
      - Homeschool
      required: true
    - id: 6
      name: family_values
      label: Family Values
      hint: null
      type: text
      options: []
      required: true
