inputSchema:
  type: object
  properties:
    title: Optional Support Class Selection
    pages:
    - id: 1
      name: select_interest
      label: Select Student Interest
      hint: null
      type: select_one
      options:
      - Interest in subject matter
      - Other
      required: false
    - id: 2
      name: select_grade_level
      label: Select Grade Level
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      - '6'
      required: false
    - id: 3
      name: preferred_times
      label: Select Preferred Time
      hint: null
      type: select_multiple
      options:
      - 9:00am
      - 10:00am
      - 11:00am
      - 12:00pm
      - 1:00pm
      - 2:00pm
      - 3:00pm
      - 4:00pm
      - 5:00pm
      - 6:00pm
      - 7:00pm
      required: false
    - id: 4
      name: select_session_days
      label: Select Session Days
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 5
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: select_tutor
      label: Select Tutor
      hint: null
      type: select_one
      options:
      - Tutor 1
      - Tutor 2
      - Tutor 3
      - Tutor 4
      - Tutor 5
      required: false
