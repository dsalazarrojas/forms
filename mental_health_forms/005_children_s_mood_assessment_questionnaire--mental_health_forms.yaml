inputSchema:
  type: object
  properties:
    title: Children's Mood Assessment Questionnaire
    pages:
    - id: 1
      name: child_information
      label: Child Information
      hint: Basic details about the child
      type: note
      options: []
      required: false
    - id: 2
      name: child_name
      label: Child's Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: child_date_of_birth
      label: Child's Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: child_age
      label: Child's Current Age
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: child_gender
      label: Child's Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      - Other
      required: false
    - id: 6
      name: grade_level
      label: Current Grade Level
      hint: null
      type: select_one
      options:
      - Pre-K
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: false
    - id: 7
      name: caregiver_information
      label: Caregiver Information
      hint: Parent or guardian details
      type: note
      options: []
      required: false
    - id: 8
      name: caregiver_name
      label: Caregiver Name
      hint: Parent or legal guardian
      type: text
      options: []
      required: true
    - id: 9
      name: caregiver_relationship
      label: Relationship to Child
      hint: null
      type: select_one
      options:
      - Mother
      - Father
      - Grandparent
      - Foster parent
      - Legal guardian
      - Other relative
      - Other
      required: true
    - id: 10
      name: caregiver_email
      label: Caregiver Email
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: caregiver_phone
      label: Caregiver Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: assessment_period
      label: Assessment Period
      hint: Time frame for this assessment
      type: note
      options: []
      required: false
    - id: 13
      name: assessment_date
      label: Date of Assessment
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: assessment_period_range
      label: What time period does this assessment cover
      hint: null
      type: select_one
      options:
      - Today only
      - Past 3 days
      - Past week
      - Past 2 weeks
      - Past month
      required: true
    - id: 15
      name: mood_observations
      label: Mood Observations
      hint: Observations from caregiver or staff
      type: note
      options: []
      required: false
    - id: 16
      name: overall_mood
      label: Overall mood during this period
      hint: Select the best description
      type: select_one
      options:
      - Very happy and cheerful
      - Generally happy
      - Neutral or mixed
      - Generally sad or down
      - Very sad or depressed
      required: true
    - id: 17
      name: mood_changes
      label: Have you noticed any significant mood changes
      hint: null
      type: select_one
      options:
      - Yes, significant improvement
      - Yes, slight improvement
      - No noticeable change
      - Yes, slight decline
      - Yes, significant decline
      required: true
    - id: 18
      name: emotional_indicators
      label: Emotional Indicators
      hint: Select all that have been observed
      type: select_multiple
      options:
      - Smiles frequently
      - Appears anxious or worried
      - Shows interest in activities
      - Withdrawn or isolated
      - Irritable or easily frustrated
      - Calm and relaxed
      - Tearful or crying often
      - Energetic and enthusiastic
      - Fatigued or low energy
      - Aggressive or defiant
      required: true
    - id: 19
      name: behavioral_observations
      label: Behavioral Observations
      hint: Changes in behavior patterns
      type: note
      options: []
      required: false
    - id: 20
      name: sleep_patterns
      label: Sleep Patterns
      hint: null
      type: select_one
      options:
      - Sleeping well, no issues
      - Minor sleep difficulties
      - Moderate sleep problems
      - Significant sleep disturbances
      - Not sure
      required: true
    - id: 21
      name: appetite_changes
      label: Appetite and Eating
      hint: null
      type: select_one
      options:
      - Normal appetite
      - Slightly increased
      - Slightly decreased
      - Significantly increased
      - Significantly decreased
      - Not sure
      required: true
    - id: 22
      name: social_interactions
      label: Social Interactions with Others
      hint: null
      type: select_one
      options:
      - Very social and engaged
      - Moderately social
      - Normal for this child
      - Less social than usual
      - Very withdrawn
      required: true
    - id: 23
      name: academic_performance
      label: Academic Performance or Concentration
      hint: If applicable
      type: select_one
      options:
      - Performing well
      - Slight decline
      - Noticeable decline
      - Significant decline
      - Not applicable
      - Not sure
      required: false
    - id: 24
      name: specific_concerns
      label: Specific Concerns or Behaviors Noticed
      hint: Please describe any concerning behaviors
      type: text
      options: []
      required: false
    - id: 25
      name: triggers_identified
      label: Are there any identified triggers for mood changes
      hint: Events, situations, or times that affect mood
      type: text
      options: []
      required: false
    - id: 26
      name: coping_strategies
      label: What coping strategies seem to help the child
      hint: null
      type: text
      options: []
      required: false
    - id: 27
      name: support_needed
      label: Support and Intervention
      hint: Additional support needs
      type: note
      options: []
      required: false
    - id: 28
      name: currently_receiving_support
      label: Is the child currently receiving any mental health support
      hint: null
      type: select_one
      options:
      - Yes, regular therapy
      - Yes, occasional counseling
      - Yes, medication management
      - No, but being considered
      - No support at this time
      required: true
    - id: 29
      name: additional_services_needed
      label: What additional services might be helpful
      hint: Select all that apply
      type: select_multiple
      options:
      - Individual counseling
      - Family therapy
      - Group therapy
      - Psychiatric evaluation
      - School-based support
      - Peer support groups
      - Parenting support
      - None at this time
      required: false
    - id: 30
      name: caregiver_comments
      label: Additional Comments from Caregiver
      hint: Any other observations or concerns
      type: text
      options: []
      required: false
    - id: 31
      name: staff_comments
      label: Comments from Staff or Professionals
      hint: If completing as a professional
      type: text
      options: []
      required: false
    - id: 32
      name: follow_up_needed
      label: Is follow-up recommended
      hint: null
      type: select_one
      options:
      - Yes, urgent
      - Yes, within 1-2 weeks
      - Yes, within 1 month
      - Routine follow-up
      - No follow-up needed
      required: true
