inputSchema:
  type: object
  properties:
    title: Alcohol Withdrawal Symptom Tracker
    pages:
    - id: 1
      name: participant_id
      label: Participant ID
      hint: Unique identifier
      type: text
      options: []
      required: true
    - id: 2
      name: participant_name
      label: Participant Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: check_in_date
      label: Check-in Date
      hint: Date of this check-in
      type: date
      options: []
      required: true
    - id: 4
      name: check_in_time
      label: Check-in Time
      hint: Time of this check-in
      type: time
      options: []
      required: true
    - id: 5
      name: days_since_last_drink
      label: Days Since Last Drink
      hint: Number of days sober
      type: number
      options: []
      required: true
    - id: 6
      name: hours_since_last_drink
      label: Hours Since Last Drink
      hint: Additional hours if less than a day
      type: number
      options: []
      required: false
    - id: 7
      name: overall_severity
      label: Overall Withdrawal Severity
      hint: Rate your overall symptoms
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      - Very Severe
      required: true
    - id: 8
      name: anxiety_level
      label: Anxiety Level
      hint: Rate your anxiety
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      - Very Severe
      required: true
    - id: 9
      name: tremor_severity
      label: Tremor/Shakiness Severity
      hint: Rate hand/body tremors
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      - Very Severe
      required: true
    - id: 10
      name: sweating_level
      label: Sweating Level
      hint: Rate excessive sweating
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      - Very Severe
      required: true
    - id: 11
      name: nausea_level
      label: Nausea Level
      hint: Rate nausea/vomiting
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      - Very Severe
      required: true
    - id: 12
      name: headache_severity
      label: Headache Severity
      hint: Rate headache pain
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      - Very Severe
      required: true
    - id: 13
      name: insomnia_severity
      label: Insomnia Severity
      hint: Rate sleep difficulties
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      - Very Severe
      required: true
    - id: 14
      name: irritability_level
      label: Irritability Level
      hint: Rate irritability/agitation
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      - Very Severe
      required: true
    - id: 15
      name: depression_level
      label: Depression Level
      hint: Rate feelings of depression
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      - Very Severe
      required: true
    - id: 16
      name: confusion_level
      label: Confusion Level
      hint: Rate mental confusion
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      - Very Severe
      required: true
    - id: 17
      name: heart_palpitations
      label: Heart Palpitations
      hint: Experiencing rapid heartbeat?
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      - Very Severe
      required: true
    - id: 18
      name: hallucinations
      label: Hallucinations
      hint: Experiencing hallucinations?
      type: select_one
      options:
      - None
      - Mild (questioning reality)
      - Moderate (brief episodes)
      - Severe (frequent episodes)
      - Very Severe (continuous)
      required: true
    - id: 19
      name: seizure_activity
      label: Seizure Activity
      hint: Any seizure activity?
      type: select_one
      options:
      - None
      - Possible warning signs
      - Minor episode
      - Major episode
      required: true
    - id: 20
      name: appetite_level
      label: Appetite Level
      hint: Rate your appetite
      type: select_one
      options:
      - Normal
      - Slightly decreased
      - Significantly decreased
      - No appetite
      - Nauseated at thought of food
      required: true
    - id: 21
      name: hydration_status
      label: Hydration Status
      hint: How well are you staying hydrated?
      type: select_one
      options:
      - Well hydrated
      - Adequately hydrated
      - Somewhat dehydrated
      - Dehydrated
      - Severely dehydrated
      required: true
    - id: 22
      name: medications_taken
      label: Medications Taken Today
      hint: List any medications
      type: text
      options: []
      required: false
    - id: 23
      name: medication_compliance
      label: Medication Compliance
      hint: Taking prescribed medications?
      type: select_one
      options:
      - All medications as prescribed
      - Most medications
      - Some medications
      - No medications taken
      - Not prescribed any
      required: true
    - id: 24
      name: cravings_intensity
      label: Alcohol Cravings Intensity
      hint: Rate your cravings
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      - Overwhelming
      required: true
    - id: 25
      name: coping_strategies_used
      label: Coping Strategies Used
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - Deep breathing
      - Meditation
      - Exercise
      - Called sponsor
      - Attended meeting
      - Distracted with activity
      - Journaling
      - Talked to therapist
      - Prayer
      required: false
    - id: 26
      name: support_contact_made
      label: Contacted Support Today
      hint: Did you reach out for support?
      type: select_one
      options:
      - Yes, multiple times
      - Yes, once
      - No, but wanted to
      - No, didn't feel need
      required: true
    - id: 27
      name: sleep_hours_last_night
      label: Hours of Sleep Last Night
      hint: Total hours slept
      type: number
      options: []
      required: false
    - id: 28
      name: sleep_quality
      label: Sleep Quality
      hint: Rate sleep quality
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: false
    - id: 29
      name: mood_rating
      label: Overall Mood Rating
      hint: Rate your mood today
      type: select_one
      options:
      - Very Good
      - Good
      - Neutral
      - Bad
      - Very Bad
      required: true
    - id: 30
      name: relapse_risk_self_assessment
      label: Self-Assessed Relapse Risk
      hint: How at risk do you feel?
      type: select_one
      options:
      - No risk
      - Low risk
      - Moderate risk
      - High risk
      - Very high risk
      required: true
    - id: 31
      name: emergency_contact_needed
      label: Need Emergency Contact
      hint: Do you need immediate help?
      type: select_one
      options:
      - No, I'm okay
      - Would like to talk to someone
      - Yes, need urgent help
      - Medical emergency
      required: true
    - id: 32
      name: additional_symptoms
      label: Additional Symptoms
      hint: Any other symptoms not listed
      type: text
      options: []
      required: false
    - id: 33
      name: notes_for_counselor
      label: Notes for Counselor
      hint: Anything to share with your counselor
      type: text
      options: []
      required: false
