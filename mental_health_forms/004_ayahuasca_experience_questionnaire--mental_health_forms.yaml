inputSchema:
  type: object
  properties:
    title: Ayahuasca Experience Questionnaire
    pages:
    - id: 1
      name: participant_name
      label: Full Name
      hint: Your legal name
      type: text
      options: []
      required: true
    - id: 2
      name: participant_age
      label: Age
      hint: Your current age
      type: number
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Email Address
      hint: For follow-up communication
      type: email
      options: []
      required: true
    - id: 4
      name: experience_date
      label: Date of Ayahuasca Experience
      hint: When did you participate?
      type: date
      options: []
      required: true
    - id: 5
      name: location
      label: Location of Experience
      hint: Where did the ceremony take place?
      type: text
      options: []
      required: false
    - id: 6
      name: prior_experience
      label: Had you participated in ayahuasca ceremonies before?
      hint: null
      type: select_one
      options:
      - No, this was my first time
      - Yes, 1-2 times
      - Yes, 3-5 times
      - Yes, more than 5 times
      required: true
    - id: 7
      name: intention_statement
      label: What was your primary intention or reason for participating?
      hint: Describe what you hoped to gain
      type: text
      options: []
      required: true
    - id: 8
      name: physical_sensations
      label: Describe physical sensations you experienced
      hint: Include nausea, visions, body sensations, etc.
      type: text
      options: []
      required: false
    - id: 9
      name: emotional_experience
      label: Describe your emotional experience
      hint: What emotions did you feel during the ceremony?
      type: text
      options: []
      required: false
    - id: 10
      name: insights_gained
      label: What insights or realizations did you gain?
      hint: Describe any personal breakthroughs or understanding
      type: text
      options: []
      required: false
    - id: 11
      name: challenging_aspects
      label: What was the most challenging part of the experience?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: positive_aspects
      label: What was the most positive aspect?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: post_experience_changes
      label: Have there been changes in your life since the experience?
      hint: Describe shifts in perspective, behavior, or wellbeing
      type: text
      options: []
      required: false
    - id: 14
      name: mental_health_status
      label: Current mental health status
      hint: How are you feeling now?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Struggling
      required: false
    - id: 15
      name: additional_notes
      label: Any additional observations or notes?
      hint: null
      type: text
      options: []
      required: false
