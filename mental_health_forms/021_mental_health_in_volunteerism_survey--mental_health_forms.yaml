inputSchema:
  type: object
  properties:
    title: Mental Health In Volunteerism Survey
    pages:
    - id: 1
      name: volunteer_programs
      label: volunteer_programs
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: frequency_of_volunteering
      label: frequency_of_volunteering
      hint: null
      type: select_one
      options:
      - '{''label'': ''Less than 1 hour a week''}'
      - '{''label'': ''1-2 hours a week''}'
      - '{''label'': ''2-5 hours a week''}'
      - '{''label'': ''5 hours a week or more''}'
      required: false
    - id: 3
      name: mental_health_status
      label: mental_health_status
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: volunteer_satisfaction
      label: volunteer_satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: feedback
      label: feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: additional_comments
      label: additional_comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_information
      label: contact_information
      hint: null
      type: text
      options: []
      required: false
