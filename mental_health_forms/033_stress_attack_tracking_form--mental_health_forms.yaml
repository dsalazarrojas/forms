inputSchema:
  type: object
  properties:
    title: Stress Attack Tracking Form
    pages:
    - id: 1
      name: stress_attack_tracking_form
      label: Form title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: attack_type
      label: Attack type
      hint: null
      type: select_one
      options:
      - Physical
      - Emotional
      - Mental
      - Financial
      - Social
      - Other
      required: true
    - id: 5
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: severity
      label: Severity
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      - Critical
      - None
      required: true
    - id: 7
      name: duration
      label: Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: frequency
      label: Frequency
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
