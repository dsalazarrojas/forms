      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: support_system
      label: support system
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: self_care_plans
      label: self care plans
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: mental_health_services
      label: mental health services
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: mental_health_services_frequencies
      label: mental health services frequencies
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
