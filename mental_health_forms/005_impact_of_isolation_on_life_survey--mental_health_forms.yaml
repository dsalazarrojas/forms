inputSchema:
  type: object
  properties:
    title: Impact Of Isolation On Life Survey
    pages:
    - id: 1
      name: introduction
      label: What is your relationship with the person you live with
      hint: null
      type: select_one
      options:
      - Isolated
      - Alone
      - With others
      required: false
    - id: 2
      name: relationship_type
      label: What type of relationship you have with the person you live with
      hint: null
      type: select_multiple
      options:
      - Partner
      - Spouse
      - Boyfriend
      - Girlfriend
      - Partner
      - Ex-partner
      - Family member
      - Friend
      - Other
      required: false
    - id: 3
      name: loneliness_level
      label: How often do you feel lonely
      hint: null
      type: select_one
      options:
      - '0'
      - 1-2 days
      - 3-4 days
      - 5-7 days
      - Almost every day
      required: false
    - id: 4
      name: social_support
      label: What types of social support do you have
      hint: null
      type: select_multiple
      options:
      - Family
      - Friends
      - Community
      - Online community
      - Other
      required: false
    - id: 5
      name: coping_mechanism
      label: What is your main coping mechanism for loneliness
      hint: null
      type: select_one
      options:
      - Talk to friends or family
      - Exercise
      - Hobbies
      - Watching movies or TV shows
      - Sleeping
      - Reading
      - Other
      required: false
    - id: 6
      name: life_change
      label: Has your life changed significantly since the start of the lockdown
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: emotional_change
      label: How have you felt emotionally since the start of the lockdown
      hint: null
      type: select_one
      options:
      - Better
      - Worse
      - About the same
      required: false
    - id: 8
      name: sleep_quality
      label: What is the quality of your sleep
      hint: null
      type: select_one
      options:
      - Better
      - Worse
      - About the same
      required: false
    - id: 9
      name: physical_health
      label: How would you rate your physical health
      hint: null
      type: select_one
      options:
      - Much better
      - A bit better
      - About the same
      - A bit worse
      - Much worse
      required: false
    - id: 10
      name: mental_health
      label: How would you rate your mental health
      hint: null
      type: select_one
      options:
      - Much better
      - A bit better
      - About the same
      - A bit worse
      - Much worse
      required: false
    - id: 11
      name: anxiety_level
      label: What is your level of anxiety
      hint: null
      type: select_one
      options:
      - '0'
      - 1-2
      - 3-4
      - 5-7
      - 8-10
      required: false
    - id: 12
      name: note
      label: Do you have any other comments or concerns that you would like to share
        with us
      hint: null
      type: note
      options: []
      required: false
