inputSchema:
  type: object
  properties:
    title: mental health facility discharge form
    pages:
    - id: 1
      name: facility_name
      label: facility_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: patient_name
      label: patient name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_discharge
      label: date of discharge
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time_of_discharge
      label: time of discharge
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: medical_record_number
      label: medical record number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: discharge_status
      label: discharge status
      hint: null
      type: select_one
      options:
      - Discharged
      - Transferred
      - Deceased
      required: false
    - id: 7
      name: discharge_diagnosis
      label: discharge diagnosis
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: follow_up_care
      label: follow up care
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: next_care_setting
      label: next care setting
      hint: null
      type: select_multiple
      options:
      - Home
      - Outpatient
      - Inpatient
      required: false
    - id: 10
      name: next_provider
      label: next provider
      hint: null
      type: text
      options: []
      required: false
