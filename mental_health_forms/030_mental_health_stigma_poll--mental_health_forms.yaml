      options: []
      required: false
    - id: 2
      name: stigma_scale
      label: How stigmatizing do you think mental health issues are in your community?
      hint: null
      type: select_one
      options:
      - Not stigmatizing at all
      - Somewhat stigmatizing
      - Very stigmatizing
      - Extremely stigmatizing
      required: false
