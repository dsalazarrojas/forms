inputSchema:
  type: object
  properties:
    title: psychiatry_progress_note
    pages:
    - id: 1
      name: session_details
      label: Session Details
      hint: Provide date, time, and location of the session
      type: text
      options: []
      required: false
    - id: 2
      name: chief_complaint
      label: Chief Complaint
      hint: List the patient's chief complaint or reason for visit
      type: text
      options: []
      required: false
    - id: 3
      name: diagnosis
      label: Diagnosis
      hint: Current psychiatric diagnosis
      type: text
      options: []
      required: false
    - id: 4
      name: medications
      label: Medications
      hint: List the patient's current medications
      type: select_multiple
      options:
      - Medication 1
      - Medication 2
      - Medication 3
      - Medication 4
      - Medication 5
      - Medication 6
      required: false
    - id: 5
      name: allergies
      label: Allergies
      hint: List the patient's allergies
      type: text
      options: []
      required: false
    - id: 6
      name: medical_history
      label: Medical History
      hint: List the patient's medical history
      type: text
      options: []
      required: false
    - id: 7
      name: vital_signs
      label: Vital Signs
      hint: List the patient's vital signs (e.g., blood pressure, pulse)
      type: text
      options: []
      required: false
    - id: 8
      name: mental_status
      label: Mental Status
      hint: Describe the patient's mental status (e.g., mood, behavior)
      type: text
      options: []
      required: false
    - id: 9
      name: follow_up
      label: Follow-Up
      hint: Schedule follow-up appointments
      type: date
      options: []
      required: false
    - id: 10
      name: signed_by
      label: Signed By
      hint: Provider's signature
      type: text
      options: []
      required: false
    - id: 11
      name: follow_up_frequency
      label: Follow-up Frequency
      hint: How often do you want to see this patient?
      type: select_one
      options:
      - Daily
      - Weekly
      - Bi-Weekly
      - Monthly
      required: false
    - id: 12
      name: signed_by_date
      label: Signed Date
      hint: Date of signature
      type: date
      options: []
      required: false
    - id: 13
      name: signed_by_provider
      label: Signed By Provider
      hint: Provider's name
      type: text
      options: []
      required: false
    - id: 14
      name: follow_up_time
      label: Follow-up Time
      hint: Follow-up time
      type: time
      options: []
      required: false
