inputSchema:
  type: object
  properties:
    title: Addiction Counseling Specialist Referral Form
    pages:
    - id: 1
      name: --referral_information
      label: -- Referral Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: referrer_name
      label: Referrer name
      hint: Person making the referral
      type: text
      options: []
      required: true
    - id: 3
      name: client_name
      label: Client name
      hint: Individual being referred
      type: text
      options: []
      required: true
    - id: 4
      name: contact_information
      label: Contact information for client
      hint: Phone and email if available
      type: text
      options: []
      required: true
    - id: 5
      name: reason_for_referral
      label: Reason for referral
      hint: Symptoms concerns or observations
      type: text
      options: []
      required: true
    - id: 6
      name: risk_assessment
      label: Risk assessment summary
      hint: Suicidal or self harm risk present
      type: select_one
      options: [Low, Moderate, High]
      required: true
    - id: 7
      name: preferred_treatment
      label: Preferred treatment recommendations
      hint: Individual therapy group intensive outpatient
      type: select_one
      options: [Individual therapy, Group therapy, IOP, Residential]
