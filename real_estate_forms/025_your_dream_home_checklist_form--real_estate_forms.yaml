inputSchema:
  type: object
  properties:
    title: Your Dream Home Checklist Form
    pages:
    - id: 1
      name: home_type
      label: Home Type
      hint: null
      type: select_one
      options:
      - Condo
      - Single Family Home
      - Townhouse
      - Other
      required: false
    - id: 2
      name: number_of_bedrooms
      label: Number of Bedrooms
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      - 4 or more
      required: false
    - id: 3
      name: price_range
      label: Price Range
      hint: null
      type: select_one
      options:
      - Under 200,000
      - 200,000-400,000
      - 400,000 or more
      required: false
    - id: 4
      name: location
      label: Location
      hint: null
      type: select_multiple
      options:
      - City
      - Suburb
      - Rural
      required: false
    - id: 5
      name: desired_move_in_date
      label: Desired Move In Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: budget_range
      label: Budget Range
      hint: Enter your budget range
      type: number
      options: []
      required: false
    - id: 7
      name: preferred_language
      label: Preferred Language
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - French
      required: false
    - id: 8
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - In Person
      required: false
