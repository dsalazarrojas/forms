inputSchema:
  type: object
  properties:
    title: Apartment Lease Agreement
    pages:
    - id: 1
      name: lease_date
      label: Lease agreement date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: landlord_name
      label: Landlord or property owner name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: landlord_address
      label: Landlord address
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: landlord_email
      label: Landlord email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: landlord_phone
      label: Landlord phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: tenant_name
      label: Tenant full name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: tenant_address
      label: Tenant current address
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: tenant_email
      label: Tenant email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: tenant_phone
      label: Tenant phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: tenant_dob
      label: Tenant date of birth
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: co_tenant
      label: Is there a co-tenant or additional occupant?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: co_tenant_name
      label: Co-tenant full name
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: property_address
      label: Property address being rented
      hint: Full address
      type: text
      options: []
      required: true
    - id: 14
      name: unit_number
      label: Unit or apartment number
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: lease_start_date
      label: Lease start date
      hint: null
      type: date
      options: []
      required: true
    - id: 16
      name: lease_end_date
      label: Lease end date
      hint: null
      type: date
      options: []
      required: true
    - id: 17
      name: lease_term_months
      label: Lease term in months
      hint: null
      type: number
      options: []
      required: true
    - id: 18
      name: monthly_rent
      label: Monthly rent amount
      hint: In dollars
      type: number
      options: []
      required: true
    - id: 19
      name: rent_due_date
      label: Rent due date each month
      hint: Day of month
      type: number
      options: []
      required: true
    - id: 20
      name: late_fee
      label: Late fee for overdue rent
      hint: In dollars or percentage
      type: text
      options: []
      required: false
    - id: 21
      name: security_deposit
      label: Security deposit amount
      hint: In dollars
      type: number
      options: []
      required: true
    - id: 22
      name: deposit_due_date
      label: When security deposit is due
      hint: null
      type: date
      options: []
      required: true
    - id: 23
      name: utilities_included
      label: Utilities included in rent
      hint: Select all that apply
      type: select_multiple
      options:
      - Water
      - Electricity
      - Gas
      - Garbage
      - Internet
      - Cable
      - None
      required: true
    - id: 24
      name: utilities_tenant_pays
      label: Utilities tenant is responsible for
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: pet_policy
      label: Pet policy
      hint: null
      type: select_one
      options:
      - No pets allowed
      - Cats only
      - Dogs only
      - Pets allowed with deposit
      - All pets allowed
      required: true
    - id: 26
      name: pet_deposit
      label: Pet deposit if applicable
      hint: In dollars
      type: number
      options: []
      required: false
    - id: 27
      name: smoking_allowed
      label: Smoking policy
      hint: null
      type: select_one
      options:
      - No smoking allowed
      - Smoking allowed
      - Smoking only on balcony
      - Smoking in designated areas
      required: true
    - id: 28
      name: parking_included
      label: Parking included
      hint: null
      type: select_one
      options:
      - Yes, included
      - Yes, additional fee
      - Street parking only
      - No parking available
      required: true
    - id: 29
      name: parking_fee
      label: Monthly parking fee if applicable
      hint: In dollars
      type: number
      options: []
      required: false
    - id: 30
      name: maintenance_responsibility
      label: Tenant maintenance responsibilities
      hint: null
      type: text
      options: []
      required: false
    - id: 31
      name: landlord_agrees
      label: Landlord agrees to lease terms
      hint: null
      type: select_one
      options:
      - I agree and accept
      - I do not agree
      required: true
    - id: 32
      name: tenant_agrees
      label: Tenant agrees to lease terms
      hint: null
      type: select_one
      options:
      - I agree and accept
      - I do not agree
      required: true
    - id: 33
      name: landlord_signature_date
      label: Landlord signature date
      hint: null
      type: date
      options: []
      required: true
    - id: 34
      name: tenant_signature_date
      label: Tenant signature date
      hint: null
      type: date
      options: []
      required: true
