inputSchema:
  type: object
  properties:
    title: Rental Living Spaces Form
    pages:
    - id: 1
      name: registration
      label: Registration Form
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: property_type
      label: Property Type
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Apartment''}'
      - '{''id'': 2, ''name'': ''House''}'
      - '{''id'': 3, ''name'': ''Condo''}'
      required: false
    - id: 7
      name: square_footage
      label: Square Footage
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: number_of_bedrooms
      label: Number of Bedrooms
      hint: null
      type: number
      options: []
      required: false
