      name: listing_type
      label: Listing type
      hint: null
      type: select_one
      options:
      - New listing
      - Renovation
      - Realty
      required: true
    - id: 2
      name: property_type
      label: Property type
      hint: null
      type: select_one
      options:
      - Residential
      - Commercial
      - Agricultural
      required: true
    - id: 3
      name: property_value
      label: Property value
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: property_street
      label: Street address
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: property_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: property_state
      label: State
      hint: null
      type: select_one
      options:
      - California
      - New York
      - Florida
      required: true
    - id: 7
      name: property_zip
      label: Zip code
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: seller_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: seller_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: seller_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: seller_company
      label: Company
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: property_design_and_build
      label: Property design and build
      hint: null
      type: text
      options: []
      required: true
