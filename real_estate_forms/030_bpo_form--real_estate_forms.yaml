inputSchema:
  type: object
  properties:
    title: BPO Form
    pages:
    - id: 1
      name: section_report_info
      label: -- Report Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: report_date
      label: Report Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: broker_name
      label: Broker Name
      hint: Person preparing the BPO
      type: text
      options: []
      required: true
    - id: 4
      name: broker_contact
      label: Broker Contact Information
      hint: Phone and email
      type: text
      options: []
      required: false
    - id: 5
      name: section_property_info
      label: -- Property Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: property_address
      label: Property Address
      hint: Full street address
      type: text
      options: []
      required: true
    - id: 7
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: state_zip
      label: State and ZIP Code
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: property_type
      label: Property Type
      hint: null
      type: select_one
      options:
      - Single Family Home
      - Condo
      - Townhome
      - Multi-Family
      - Commercial
      - Land
      - Other
      required: true
    - id: 10
      name: year_built
      label: Year Built
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: total_square_footage
      label: Total Square Footage
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: lot_size
      label: Lot Size
      hint: In acres or square feet
      type: text
      options: []
      required: false
    - id: 13
      name: bedrooms
      label: Number of Bedrooms
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: bathrooms
      label: Number of Bathrooms
      hint: null
      type: number
      options: []
      required: true
    - id: 15
      name: garage_spaces
      label: Garage Spaces
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: property_condition
      label: Overall Property Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Needs Significant Work
      required: true
    - id: 17
      name: roof_condition
      label: Roof Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Needs Repair
      - Needs Replacement
      required: false
    - id: 18
      name: foundation_condition
      label: Foundation Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Problematic
      - Unknown
      required: false
    - id: 19
      name: hvac_status
      label: HVAC System Status
      hint: Heating, Ventilation, Air Conditioning
      type: select_one
      options:
      - New
      - Good
      - Fair
      - Needs Repair
      - Needs Replacement
      required: false
    - id: 20
      name: section_valuation
      label: -- Valuation --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: estimated_value
      label: Estimated Property Value
      hint: In dollars
      type: number
      options: []
      required: true
    - id: 22
      name: value_basis
      label: Basis for Valuation
      hint: Comparable sales, cost approach, etc.
      type: text
      options: []
      required: true
    - id: 23
      name: comparable_sales
      label: Comparable Sales Analyzed
      hint: How many recent comparable properties?
      type: number
      options: []
      required: false
    - id: 24
      name: market_conditions
      label: Market Conditions Assessment
      hint: Current market status
      type: text
      options: []
      required: false
