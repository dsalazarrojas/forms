inputSchema:
  type: object
  properties:
    title: Real Estate Lead Form
    pages:
    - id: 1
      name: lead_generation_form
      label: Lead Generation
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: customer_details
      label: Customer Details
      hint: null
      type: select_one
      options:
      - Full Name
      - Email
      - Phone
      - Address
      required: false
    - id: 3
      name: property_details
      label: Property Details
      hint: null
      type: select_one
      options:
      - Property Type
      - Property Location
      required: false
    - id: 4
      name: customer_purpose
      label: Customer Purpose
      hint: null
      type: select_one
      options:
      - To Buy
      - To Rent
      - Other
      required: false
    - id: 5
      name: preferred_commute
      label: Preferred Commute
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: desired_move_in_date
      label: Desired Move In Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: preferred_move_in_month
      label: Preferred Move In Month
      hint: null
      type: select_one
      options:
      - Month 1
      - Month 2
      - Month 3
      required: false
    - id: 8
      name: preferred_move_in_year
      label: Preferred Move In Year
      hint: null
      type: select_one
      options:
      - Year 1
      - Year 2
      - Year 3
      required: false
