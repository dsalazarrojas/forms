inputSchema:
  type: object
  properties:
    title: Buyers Application
    pages:
    - id: 1
      name: applicant_name
      label: Full Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_email
      label: Email Address
      hint: Your contact email
      type: email
      options: []
      required: true
    - id: 3
      name: applicant_phone
      label: Phone Number
      hint: Your contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: applicant_address
      label: Current Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 5
      name: years_real_estate_experience
      label: Years of Real Estate Investment Experience
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: investment_goals
      label: Investment Goals
      hint: What are you looking to achieve?
      type: select_multiple
      options:
      - Passive income
      - Capital appreciation
      - Portfolio diversification
      - Retirement planning
      - Wealth building
      - Long-term hold
      - Short-term profit
      required: true
    - id: 7
      name: investment_strategy
      label: Preferred Investment Strategy
      hint: null
      type: select_one
      options:
      - Buy and hold for long term
      - Rental income focus
      - Flip for profit
      - Mixed strategy
      - Hands-off passive investment
      required: true
    - id: 8
      name: property_type_interest
      label: Property Type Interest
      hint: Select all that apply
      type: select_multiple
      options:
      - Single-family homes
      - Multi-family properties
      - Commercial real estate
      - Land
      - Condos
      - Townhouses
      - Mixed-use properties
      required: true
    - id: 9
      name: investment_markets
      label: Geographic Markets of Interest
      hint: Cities or regions
      type: text
      options: []
      required: true
    - id: 10
      name: budget_range
      label: Investment Budget Range
      hint: In USD or local currency
      type: select_one
      options:
      - Under $50000
      - $50000 - $100000
      - $100000 - $250000
      - $250000 - $500000
      - $500000 - $1 million
      - Over $1 million
      - Flexible
      required: true
    - id: 11
      name: cash_reserves
      label: Available Cash Reserves
      hint: Amount available for investment
      type: number
      options: []
      required: false
    - id: 12
      name: financing_available
      label: Financing Available or Needed
      hint: null
      type: select_one
      options:
      - All cash
      - 20-50% down payment available
      - Less than 20% down available
      - Need 100% financing
      - Unsure
      required: true
    - id: 13
      name: credit_score_estimate
      label: Estimated Credit Score Range
      hint: null
      type: select_one
      options:
      - Below 600
      - 600 - 650
      - 650 - 700
      - 700 - 750
      - Above 750
      - Not sure
      required: false
    - id: 14
      name: property_management
      label: Property Management Preference
      hint: null
      type: select_one
      options:
      - Self-manage properties
      - Hire professional management
      - Want completely hands-off
      - Undecided
      required: true
    - id: 15
      name: rental_experience
      label: Rental Property Management Experience
      hint: null
      type: select_one
      options:
      - Extensive experience
      - Some experience
      - No experience
      - Do not want to manage
      required: false
    - id: 16
      name: expected_roi
      label: Expected Return on Investment
      hint: Percentage per year
      type: number
      options: []
      required: false
    - id: 17
      name: risk_tolerance
      label: Risk Tolerance
      hint: null
      type: select_one
      options:
      - Conservative
      - Moderate
      - Aggressive
      - Very aggressive
      required: true
    - id: 18
      name: time_commitment
      label: Time You Can Commit
      hint: null
      type: select_one
      options:
      - Full-time real estate investor
      - Part-time investor
      - Minimal time - passive only
      - Other arrangement
      required: true
    - id: 19
      name: additional_interests
      label: Additional Information About Your Investment Interests
      hint: Any other details important to you?
      type: text
      options: []
      required: false
    - id: 20
      name: ready_to_invest
      label: Are You Ready to Invest in Qualified Deals?
      hint: null
      type: select_one
      options:
      - Yes, ready immediately
      - Yes, within 3-6 months
      - Yes, within 12 months
      - Exploring options
      - Not yet ready
      required: true
