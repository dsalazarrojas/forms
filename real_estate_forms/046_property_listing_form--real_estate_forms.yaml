inputSchema:
  type: object
  properties:
    title: Property Listing Form
    pages:
    - id: 1
      name: property_owner_name
      label: Owner's Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: property_owner_address
      label: Owner's Address
      hint: Enter a full address
      type: text
      options: []
      required: true
    - id: 3
      name: property_preferred_price
      label: Preferred Price
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: property_details
      label: Property Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: property_ammenities
      label: Property Amenities
      hint: null
      type: select_multiple
      options:
      - Basement
      - Parking
      - Pool
      - Yard
      required: true
    - id: 6
      name: property_pictures
      label: Property Pictures
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: property_agents_name
      label: Agent's Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: property_agents_contact
      label: Agent's Contact
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: property_agents_email
      label: Agent's Email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: property_agents_relationship
      label: Agent's Relationship
      hint: null
      type: select_one
      options:
      - Friend
      - Relative
      - Client
      required: true
