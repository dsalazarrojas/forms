inputSchema:
  type: object
  properties:
    title: Property Inspection Report
    pages:
    - id: 1
      name: property_inspection_report_property_details
      label: Property Details
      hint: null
      type: select_one
      options:
      - Option 1
      - Tenants
      - Agent
      required: false
    - id: 2
      name: property_inspection_report_inspector
      label: Property Inspector
      hint: null
      type: select_multiple
      options:
      - Mr John
      - Ms Jane
      - Mr Smith
      required: true
    - id: 3
      name: property_inspection_report_inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: property_inspection_report_reported_problem
      label: Reported Problem
      hint: null
      type: select_one
      options:
      - No problems
      - 'True'
      required: false
    - id: 5
      name: property_inspection_report_description_of_problem
      label: Description of Problem
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: property_inspection_report_recommendation
      label: Recommendation
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: property_inspection_report_inspector_signature
      label: Property Inspector Signature
      hint: null
      type: select_multiple
      options:
      - John
      - Jane
      - Smith
      required: true
    - id: 8
      name: property_inspection_report_inspector_date
      label: Property Inspector Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: property_inspection_report_landlord_comments
      label: Landlord Comments
      hint: null
      type: text
      options: []
      required: false
