      hint: Contact person
      type: text
      options: []
      required: false
    - id: 17
      name: loan_officer_phone
      label: Loan Officer Phone
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 18
      name: appraisal_contingency
      label: Appraisal Contingency
      hint: Is appraisal required?
      type: select_one
      options:
      - 'True'
      - 'False'
      - Waived
      required: true
    - id: 19
      name: inspection_contingency
      label: Inspection Contingency
      hint: Is inspection required?
      type: select_one
      options:
      - Yes, general
      - Yes, general and specialized
      - 'False'
      - Waived
      required: true
    - id: 20
      name: inspection_date
      label: Inspection Date
      hint: When scheduled?
      type: date
