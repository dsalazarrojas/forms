inputSchema:
  type: object
  properties:
    title: Contract To Close
    pages:
    - id: 1
      name: buyer_name
      label: Buyer Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: buyer_email
      label: Buyer Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: buyer_phone
      label: Buyer Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 4
      name: seller_name
      label: Seller Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 5
      name: seller_email
      label: Seller Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 6
      name: seller_phone
      label: Seller Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 7
      name: property_address
      label: Property Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 8
      name: property_type
      label: Property Type
      hint: Type of property
      type: select_one
      options:
      - Single family home
      - Condominium
      - Townhouse
      - Multi-family
      - Commercial
      - Land
      - Other
      required: true
    - id: 9
      name: purchase_price
      label: Purchase Price
      hint: Sale amount
      type: number
      options: []
      required: true
    - id: 10
      name: earnest_money
      label: Earnest Money
      hint: Deposit amount
      type: number
      options: []
      required: true
    - id: 11
      name: closing_date
      label: Closing Date
      hint: When to close?
      type: date
      options: []
      required: true
    - id: 12
      name: closing_location
      label: Closing Location
      hint: Where to close?
      type: text
      options: []
      required: true
    - id: 13
      name: financing_type
      label: Financing Type
      hint: How is buyer paying?
      type: select_one
      options:
      - Conventional loan
      - FHA loan
      - VA loan
      - USDA loan
      - Cash
      - Seller financing
      - Other
      required: true
    - id: 14
      name: loan_amount
      label: Loan Amount
      hint: Mortgage amount
      type: number
      options: []
      required: false
    - id: 15
      name: lender_name
      label: Lender Name
      hint: Mortgage company
      type: text
      options: []
      required: false
    - id: 16
      name: loan_officer
