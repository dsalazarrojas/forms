inputSchema:
  type: object
  properties:
    title: Mortgage Lien Release Form
    pages:
    - id: 1
      name: loan_amount
      label: Loan Amount
      hint: Enter the total amount of the loan
      type: number
      options: []
      required: true
    - id: 2
      name: lender_info
      label: Lender Information
      hint: Provide information about the lender
      type: select_one
      options:
      - Lender Name
      - Lender Phone
      - Lender Email
      required: false
    - id: 3
      name: property_address
      label: Property Address
      hint: Enter the property address
      type: text
      options: []
      required: true
    - id: 4
      name: loan_release_dates
      label: Loan and Release Dates
      hint: null
      type: select_one
      options:
      - Loan Date
      - Release Date
      required: false
    - id: 5
      name: lien_and_release_amounts
      label: Lien and Release Amounts
      hint: null
      type: select_one
      options:
      - Lien Amount
      - Release Amount
      required: false
    - id: 6
      name: payment_confirmation
      label: Payment Confirmation
      hint: Confirm that payment has been made
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: release_instructions
      label: Release Instructions
      hint: Provide instructions for release
      type: note
      options: []
      required: true
    - id: 8
      name: additional_comments
      label: Additional Comments
      hint: Enter any additional comments
      type: note
      options: []
      required: false
    - id: 9
      name: release_fees
      label: Release Fees
      hint: Enter any release fees
      type: number
      options: []
      required: false
    - id: 10
      name: lender_fees
      label: Lender Fees
      hint: Enter any lender fees
      type: number
      options: []
      required: false
    - id: 11
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
