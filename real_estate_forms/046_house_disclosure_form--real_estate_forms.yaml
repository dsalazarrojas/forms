      name: square_footage
      label: square footage
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: num_bedrooms
      label: number of bedrooms
      hint: null
      type: select_multiple
      options:
      - 2-3
      - 4-5
      - 6-7
      - 8-9
      - 10 or more
      required: false
    - id: 9
      name: num_bathrooms
      label: number of bathrooms
      hint: null
      type: select_multiple
      options:
