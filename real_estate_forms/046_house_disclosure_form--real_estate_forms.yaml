inputSchema:
  type: object
  properties:
    title: House Disclosure Form
    pages:
    - id: 1
      name: seller_info
      label: seller information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: property_address
      label: property address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: property_type
      label: property type
      hint: null
      type: select_one
      options:
      - single family home
      - townhouse
      - condo
      - duplex
      - other
      required: false
    - id: 4
      name: year_built
      label: year built
      hint: null
      type: number
      options: []
      required: false
