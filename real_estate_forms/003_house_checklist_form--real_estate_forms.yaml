inputSchema:
  type: object
  properties:
    title: House Checklist Form
    pages:
    - id: 1
      name: house_status
      label: house status
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 2
      name: basic_systems_status
      label: basic systems status
      hint: null
      type: select_multiple
      options:
      - Working
      - Not Working
      - Unknown
      required: false
    - id: 3
      name: engines_status
