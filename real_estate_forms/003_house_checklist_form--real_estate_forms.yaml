      options: []
      required: false
    - id: 5
      name: exteriors_info
      label: exteriors information
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: security_info
      label: security information
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: additional_info
      label: additional information
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: house_location
      label: house location
      hint: null
      type: select_one
      options:
      - Urban
      - Rural
      - Unknown
      required: false
    - id: 9
      name: has_pool
      label: has pool
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: has_garage
      label: has garage
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
