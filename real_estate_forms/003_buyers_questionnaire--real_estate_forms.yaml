inputSchema:
  type: object
  properties:
    title: Real Estate Buyer Questionnaire
    pages:
    - id: 1
      name: introductory_note
      label: -- Real Estate Search Criteria --
      hint: Please provide as much detail as possible to help us find your perfect
        home.
      type: note
      options: []
      required: false
    - id: 2
      name: buyer_names
      label: Names of all prospective buyers
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: current_housing_status
      label: What is your current housing situation?
      hint: null
      type: select_one
      options:
      - Renting
      - Own (need to sell)
      - Own (staying)
      - Living with family
      required: true
    - id: 4
      name: property_type_preference
      label: Desired property type
      hint: null
      type: select_one
      options:
      - Single Family Home
      - Condo
      - Townhouse
      - Multi-Family
      - Land Only
      required: true
    - id: 5
      name: target_locations
      label: Preferred neighborhoods or cities
      hint: List up to 3 areas
      type: text
      options: []
      required: true
    - id: 6
      name: minimum_bedrooms
      label: Minimum number of bedrooms
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: minimum_bathrooms
      label: Minimum number of bathrooms
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: must_have_features
      label: Must-have features
      hint: Select all that apply
      type: select_multiple
      options:
      - Garage
      - Fenced Yard
      - Modern Kitchen
      - Home Office
      - Basement
      - Pool
      required: false
    - id: 9
      name: financial_section
      label: -- Financial Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: maximum_price
      label: Maximum purchase price
      hint: Your upper limit
      type: number
      options: []
      required: true
    - id: 11
      name: pre_approval_status
      label: Have you been pre-approved for a mortgage?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - In progress
      required: true
    - id: 12
      name: down_payment_percentage
      label: Intended down payment percentage
      hint: e.g., 20.0
      type: number
      options: []
      required: false
    - id: 13
      name: timeline_section
      label: -- Timeline --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: desired_closing_date
      label: Ideal closing date
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: decision_factors
      label: What is the most important factor in your search?
      hint: null
      type: select_one
      options:
      - Location
      - Price
      - School District
      - Square Footage
      - Lot Size
      required: true
    - id: 16
      name: additional_requirements
      label: Any other specific requirements or concerns?
      hint: null
      type: text
      options: []
      required: false
