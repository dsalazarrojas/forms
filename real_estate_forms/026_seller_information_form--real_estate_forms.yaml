inputSchema:
  type: object
  properties:
    title: Seller Information Form
    pages:
    - id: 1
      name: seller_information
      label: seller_information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: best_time_to_contact
      label: best_time_to_contact
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Anytime
      required: false
    - id: 3
      name: how_soon_to_sell
      label: how_soon_to_sell
      hint: null
      type: select_one
      options:
      - Immediately
      - 1-3 months
      - 4-6 months
      - More than 6 months
