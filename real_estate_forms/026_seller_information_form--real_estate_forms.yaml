    - id: 4
      name: move_out_section
      label: move_out_section
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: seller_phone
      label: seller_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: seller_address
      label: seller_address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: property_address
      label: property_address
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: seller_name
      label: seller_name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: seller_email
      label: seller_email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: property_type
      label: property_type
      hint: null
      type: select_one
      options:
      - House
      - Apartment
      - Condo
      required: false
    - id: 11
      name: reason_to_sell
      label: reason_to_sell
      hint: null
      type: select_multiple
      options:
      - Financial difficulties
      - Moving to a new city
      - Other
      required: false
