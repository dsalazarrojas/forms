      options:
      - Self-Employed
      - Employed
      - Retired
      - Unemployed
      - Disabled
      required: false
    - id: 11
      name: employment_type
      label: employment type
      hint: null
      type: select_multiple
      options:
      - Part-time
      - Full-time
      - Self-Employed
      - Seasonal
      required: false
    - id: 12
      name: rental_history
      label: rental history
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: criminal_record
      label: criminal record
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
