inputSchema:
  type: object
  properties:
    title: Apartment Comparison Checklist
    pages:
    - id: 1
      name: search_criteria_budget
      label: Budget range for rent
      hint: Monthly rent in dollars
      type: text
      options: []
      required: true
    - id: 2
      name: number_bedrooms
      label: Number of bedrooms needed
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: number_bathrooms
      label: Number of bathrooms needed
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: square_footage
      label: Desired square footage
      hint: Approximate size in sq ft
      type: number
      options: []
      required: false
    - id: 5
      name: location_preferences
      label: Preferred neighborhood or area
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: commute_distance
      label: Maximum commute distance to work or school
      hint: In minutes or miles
      type: text
      options: []
      required: false
    - id: 7
      name: public_transit
      label: Must have access to public transportation
      hint: null
      type: select_one
      options:
      - Yes, essential
      - Preferred but not essential
      - Not necessary
      required: true
    - id: 8
      name: parking_need
      label: Parking requirement
      hint: null
      type: select_one
      options:
      - Must have parking
      - Prefer parking
      - Street parking acceptable
      - No parking needed
      required: true
    - id: 9
      name: outdoor_space
      label: Outdoor space desired
      hint: null
      type: select_multiple
      options:
      - Balcony or patio
      - Yard
      - Rooftop access
      - Community garden
      - None needed
      required: false
    - id: 10
      name: pet_requirements
      label: Pet-friendly requirements
      hint: null
      type: select_one
      options:
      - Must allow pets
      - Prefer pet-friendly
      - No pets
      required: true
    - id: 11
      name: amenities_desired
      label: Desired building amenities
      hint: Select all that apply
      type: select_multiple
      options:
      - Gym or fitness center
      - Pool
      - Security system
      - Doorman or concierge
      - Laundry facilities
      - Community lounge
      - Roof deck
      - On-site parking
      - Elevator building
      - None essential
      required: false
    - id: 12
      name: lease_term_preference
      label: Preferred lease term
      hint: null
      type: select_one
      options:
      - Month-to-month
      - 3-6 months
      - 1 year
      - 2+ years
      - Flexible
      required: true
    - id: 13
      name: furnished_preference
      label: Furnished apartment preference
      hint: null
      type: select_one
      options:
      - Furnished
      - Semi-furnished
      - Unfurnished
      - No preference
      required: true
    - id: 14
      name: utilities_preference
      label: Utilities included preference
      hint: null
      type: select_one
      options:
      - All included
      - Some included
      - Tenant pays all
      - No preference
      required: true
    - id: 15
      name: appliances_needed
      label: Required appliances
      hint: Select all that apply
      type: select_multiple
      options:
      - Refrigerator
      - Stove and oven
      - Dishwasher
      - Washer
      - Dryer
      - Air conditioning
      - Heat
      - None essential
      required: false
    - id: 16
      name: noise_tolerance
      label: Noise tolerance level
      hint: null
      type: select_one
      options:
      - Quiet neighborhood essential
      - Prefer quiet but flexible
      - Noise not a concern
      required: true
    - id: 17
      name: neighborhood_priorities
      label: Neighborhood priorities
      hint: Select all that apply
      type: select_multiple
      options:
      - Shopping nearby
      - Restaurants and dining
      - Parks and recreation
      - Schools nearby
      - Nightlife
      - Cultural attractions
      - Safe area
      - Quiet area
      - Young professional area
      - Family-friendly
      required: false
    - id: 18
      name: move_in_timeline
      label: Timeline for moving in
      hint: null
      type: select_one
      options:
      - Immediately
      - Within 2 weeks
      - Within 1 month
      - 1-3 months
      - Flexible
      required: true
    - id: 19
      name: must_haves
      label: Absolute must-haves
      hint: Non-negotiable features
      type: text
      options: []
      required: false
    - id: 20
      name: nice_to_haves
      label: Nice-to-have features
      hint: Desired but not essential
      type: text
      options: []
      required: false
    - id: 21
      name: deal_breakers
      label: Deal-breaker issues
      hint: What would make you pass
      type: text
      options: []
      required: false
