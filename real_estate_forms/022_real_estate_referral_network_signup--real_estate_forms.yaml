inputSchema:
  type: object
  properties:
    title: real_estate_referral_network_signup
    pages:
    - id: 1
      name: partner_details
      label: What is your real estate agency's name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: partner_name
      label: What is your partner's name?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: referral_method
      label: How will you refer your partners?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: partner_location
      label: Is your partner's location in your service area?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 5
      name: partner_email
      label: What is your partner's email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: referral_terms
      label: Do you agree with our referral terms?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: feedback_referral_terms
      label: Can you provide feedback on our referral terms?
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: confirm_contact
      label: Can you confirm your partner's contact details?
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: partner_confirm
      label: Partner Confirm
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: feedback_confusion
      label: Are you sure about our referral terms?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 11
      name: additional_feedback
      label: Additional Feedback
      hint: null
      type: note
      options: []
      required: false
