inputSchema:
  type: object
  properties:
    title: property_move_in_information_for_the_buyer_form
    pages:
    - id: 1
      name: contact_details
      label: buyer_contact_details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: property_details
      label: property_details
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: property_type
      label: property_type
      hint: null
      type: select_one
      options:
      - single family
      - multi family
      - condo
      - townhouse
      - other
      required: false
    - id: 4
      name: property_size
      label: property_size
      hint: null
      type: select_multiple
      options:
      - '1'
      - 2-3
      - 4-6
      - 7-10
      - 11-15
      - other
      required: false
    - id: 5
      name: agent_details
      label: realtor_details
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: buyer_agreed_to_terms
      label: buyer_agreed_to_terms
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
