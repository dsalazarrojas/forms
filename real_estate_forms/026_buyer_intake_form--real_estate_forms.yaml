inputSchema:
  type: object
  properties:
    title: Buyer Intake Form
    pages:
    - id: 1
      name: prospect_name
      label: Prospect Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: prospect_email
      label: Email Address
      hint: Your email
      type: email
      options: []
      required: true
    - id: 3
      name: prospect_phone
      label: Phone Number
      hint: Your contact number
      type: text
      options: []
      required: true
    - id: 4
      name: spouse_name
      label: Spouse or Co-Buyer Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 5
      name: spouse_phone
      label: Spouse Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: purchase_timeline
      label: Purchase Timeline
      hint: When do you want to buy
      type: select_one
      options:
      - Within 1 month
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - More than 1 year
      - Not sure
      required: true
    - id: 7
      name: estimated_budget
      label: Estimated Budget
      hint: Select your price range
      type: select_one
      options:
      - Less than 200000
      - 200000 - 400000
      - 400000 - 600000
      - 600000 - 800000
      - 800000 - 1000000
      - Over 1000000
      required: true
    - id: 8
      name: financing_status
      label: Financing Status
      hint: Are you pre-approved
      type: select_one
      options:
      - Pre-approved
      - Pre-qualified
      - In process
      - Not started
      - Paying cash
      required: true
    - id: 9
      name: property_type
      label: Preferred Property Type
      hint: What are you looking for
      type: select_multiple
      options:
      - Single Family Home
      - Condo
      - Townhouse
      - Multi-family
      - Land
      - Other
      required: true
    - id: 10
      name: desired_locations
      label: Desired Locations or Areas
      hint: Where would you like to live
      type: text
      options: []
      required: true
    - id: 11
      name: must_have_features
      label: Must Have Features
      hint: Essential amenities or characteristics
      type: select_multiple
      options:
      - Garage
      - Backyard
      - Pool
      - Modern Kitchen
      - Fireplace
      - Basement
      - Large Lot
      - Other
      required: false
    - id: 12
      name: number_bedrooms
      label: Number of Bedrooms
      hint: Required bedroom count
      type: number
      options: []
      required: true
    - id: 13
      name: number_bathrooms
      label: Number of Bathrooms
      hint: Required bathroom count
      type: number
      options: []
      required: true
    - id: 14
      name: square_footage
      label: Preferred Square Footage Range
      hint: Approximate size
      type: text
      options: []
      required: false
    - id: 15
      name: lot_size
      label: Preferred Lot Size
      hint: Acres or square feet
      type: text
      options: []
      required: false
    - id: 16
      name: commute_importance
      label: Commute Importance
      hint: How important is commute distance
      type: select_one
      options:
      - Very Important
      - Important
      - Somewhat Important
      - Not Important
      required: true
    - id: 17
      name: school_district
      label: School District Requirements
      hint: Is school quality important
      type: select_one
      options:
      - Very Important
      - Important
      - Somewhat Important
      - Not Important
      - Not Applicable
      required: true
    - id: 18
      name: homeowners_association
      label: Homeowners Association Preference
      hint: Do you prefer HOA communities
      type: select_one
      options:
      - Prefer HOA
      - Prefer No HOA
      - No preference
      required: true
    - id: 19
      name: additional_notes
      label: Additional Notes or Preferences
      hint: Anything else we should know
      type: text
      options: []
      required: false
