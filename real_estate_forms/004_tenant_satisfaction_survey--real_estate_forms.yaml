      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Mail
      - Other (please specify)
      required: false
    - id: 25
      name: lease_renewal_notice
      label: What is the ideal time for lease renewal notice?
      hint: null
      type: select_one
      options:
      - 1-2 months
      - 3-6 months
      - 7-9 months
      - More than 9 months
      required: false
