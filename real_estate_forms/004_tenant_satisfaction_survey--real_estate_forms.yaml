inputSchema:
  type: object
  properties:
    title: Tenant Satisfaction Survey
    pages:
    - id: 1
      name: satisfaction_level
      label: What is your satisfaction level with your home?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      required: false
    - id: 2
      name: lease_renewal_likelihood
      label: How likely are you to renew your lease?
      hint: null
      type: select_one
      options:
      - Highly Likely
      - Somewhat Likely
      - Not Likely
      required: false
    - id: 3
      name: communication_communication
      label: How do you like communication from your landlord/property manager?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: maintenance_maintenance
      label: How would you rate the maintenance and repairs in your home?
      hint: null
      type: select_one
      options:
      - Very Good
      - Somewhat Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: rent_level
      label: How would you rate the level of rent in your home?
      hint: null
      type: select_one
      options:
      - Very Low
      - Somewhat Low
      - Just Right
      - Very High
      required: false
    - id: 6
      name: space_and_amenities
      label: How would you rate the space and amenities in your home?
