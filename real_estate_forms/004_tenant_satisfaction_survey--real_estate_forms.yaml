      options: []
      required: false
    - id: 9
      name: rent_payment
      label: How do you like the payment of rent?
      hint: null
      type: select_one
      options:
      - Very Good
      - Somewhat Good
      - Fair
      - Poor
      required: false
    - id: 10
      name: lease_security
      label: How secure do you feel about your tenancy?
