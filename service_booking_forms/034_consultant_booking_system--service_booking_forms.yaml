        hint: Select a preferred time
        type: time
        options: []
        required: true
      - id: 6
        name: meeting_format
        label: Meeting format
        hint: Choose in person or virtual
        type: select_one
        options:
          - In person
          - Virtual
        required: true
      - id: 7
        name: additional_notes
        label: Additional notes
        hint: Any special requests or background information
        type: text
        options: []
