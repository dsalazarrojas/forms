inputSchema:
  type: object
  properties:
    title: Consultation Questionnaire
    pages:
    - id: 1
      name: section_personal_info
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Enter your legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: We will send confirmation here
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Include area code
      type: text
      options: []
      required: true
    - id: 5
      name: section_consultation_details
      label: -- Consultation Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: preferred_consultation_date
      label: Preferred Consultation Date
      hint: Select a date that works for you
      type: date
      options: []
      required: true
    - id: 7
      name: preferred_time_slot
      label: Preferred Time Slot
      hint: Choose your preferred time of day
      type: select_one
      options:
      - Morning (9 AM - 12 PM)
      - Afternoon (12 PM - 5 PM)
      - Evening (5 PM - 8 PM)
      required: true
    - id: 8
      name: service_of_interest
      label: Service of Interest
      hint: Which service are you inquiring about?
      type: select_one
      options:
      - Business Strategy
      - Financial Planning
      - Marketing Audit
      - Operational Efficiency
      - Other
      required: true
    - id: 9
      name: primary_goal
      label: Primary Goal for Consultation
      hint: What do you hope to achieve?
      type: text
      options: []
      required: true
    - id: 10
      name: current_challenges
      label: Current Challenges
      hint: Briefly describe any obstacles you are facing
      type: text
      options: []
      required: false
    - id: 11
      name: budget_range
      label: Estimated Budget Range
      hint: This helps us tailor our advice
      type: select_one
      options:
      - Under $1,000
      - $1,000 - $5,000
      - $5,000 - $10,000
      - $10,000+
      required: false
    - id: 12
      name: how_did_you_hear_about_us
      label: How did you hear about us?
      hint: Referral, social media, etc.
      type: text
      options: []
      required: false
    - id: 13
      name: additional_comments
      label: Additional Comments
      hint: Any other information you would like to share
      type: text
      options: []
      required: false
