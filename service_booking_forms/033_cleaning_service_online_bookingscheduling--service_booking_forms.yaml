inputSchema:
  type: object
  properties:
    title: Cleaning Service Online Booking and Scheduling
    pages:
    - id: 1
      name: section_header_customer
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: For booking confirmation
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: section_header_service
      label: -- Service Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: service_type
      label: Type of Cleaning Service
      hint: What cleaning service do you need?
      type: select_one
      options:
      - Regular Cleaning
      - Deep Cleaning
      - Move-In/Move-Out
      - Window Cleaning
      - Carpet Cleaning
      - Tile and Grout Cleaning
      - Post-Construction Cleaning
      - Other
      required: true
    - id: 8
      name: property_type
      label: Property Type
      hint: What type of property needs cleaning?
      type: select_one
      options:
      - Single Family Home
      - Apartment
      - Condo
      - Office
      - Commercial Space
      - Other
      required: true
    - id: 9
      name: property_size
      label: Property Size
      hint: Approximate square footage
      type: text
      options: []
      required: false
    - id: 10
      name: number_rooms
      label: Number of Rooms
      hint: Approximate number of rooms
      type: number
      options: []
      required: false
    - id: 11
      name: service_address
      label: Service Address
      hint: Full address of property
      type: text
      options: []
      required: true
    - id: 12
      name: section_header_frequency
      label: -- Service Frequency --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: frequency
      label: How Often Do You Need Service?
      hint: Select your preferred frequency
      type: select_one
      options:
      - One-Time Service
      - Weekly
      - Bi-weekly
      - Monthly
      - As Needed
      required: true
    - id: 14
      name: preferred_start_date
      label: Preferred Start Date
      hint: When would you like service to begin?
      type: date
      options: []
      required: true
    - id: 15
      name: preferred_day
      label: Preferred Day of Week
      hint: Which days work best?
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: false
    - id: 16
      name: preferred_time
      label: Preferred Time of Day
      hint: What time is best?
      type: select_one
      options:
      - Early Morning (6-9 AM)
      - Morning (9 AM - 12 PM)
      - Afternoon (12-5 PM)
      - Evening (5-8 PM)
      - Flexible
      required: true
    - id: 17
      name: section_header_areas
      label: -- Areas to Clean --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: areas_to_clean
      label: Areas You Want Cleaned
      hint: Select all applicable areas
      type: select_multiple
      options:
      - Kitchen
      - Bathrooms
      - Bedrooms
      - Living/Dining Areas
      - Hallways
      - Floors
      - Windows
      - Carpets
      - All Areas
      required: true
    - id: 19
      name: special_requests
      label: Special Requests or Preferences
      hint: Any specific cleaning needs?
      type: text
      options: []
      required: false
    - id: 20
      name: section_header_pricing
      label: -- Pricing Quote --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: estimated_duration
      label: Estimated Service Duration
      hint: How long should the service take?
      type: select_one
      options:
      - 2 hours
      - 3 hours
      - 4 hours
      - 5 hours
      - 6+ hours
      required: true
    - id: 22
      name: base_price
      label: Base Service Price
      hint: Calculated based on service type and size
      type: number
      options: []
      required: false
    - id: 23
      name: additional_services
      label: Additional Services
      hint: Any extra services needed?
      type: text
      options: []
      required: false
    - id: 24
      name: additional_cost
      label: Additional Service Cost
      hint: Cost of extra services
      type: number
      options: []
      required: false
    - id: 25
      name: total_price
      label: Total Estimated Price
      hint: Complete service cost
      type: number
      options: []
      required: false
    - id: 26
      name: section_header_access
      label: -- Property Access --
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: access_method
      label: How Will We Access the Property?
      hint: null
      type: select_one
      options:
      - I will be home
      - Hidden key location
      - Keypad code
      - Garage door opener
      - Other arrangement
      required: true
    - id: 28
      name: access_instructions
      label: Access Instructions
      hint: Detailed instructions if needed
      type: text
      options: []
      required: false
    - id: 29
      name: pets
      label: Pets in the Home
      hint: null
      type: select_one
      options:
      - No Pets
      - Dogs
      - Cats
      - Other
      required: true
    - id: 30
      name: section_header_confirmation
      label: -- Booking Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 31
      name: confirm_details
      label: I confirm the above information is accurate
      hint: null
      type: select_one
      options:
      - Yes, I Confirm
      - I Need to Make Changes
      required: true
    - id: 32
      name: agree_terms
      label: I agree to our service terms and conditions
      hint: null
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
    - id: 33
      name: booking_date
      label: Booking Date
      hint: Today's date
      type: date
      options: []
      required: true
