inputSchema:
  type: object
  properties:
    title: Appointment Booking Form For Advancement
    pages:
    - id: 1
      name: client_information
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: client_company
      label: Company or Organization
      hint: Optional
      type: text
      options: []
      required: false
    - id: 6
      name: appointment_scheduling
      label: -- Appointment Scheduling --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: appointment_type
      label: Type of Advancement Consultation
      hint: null
      type: select_one
      options:
      - Career advancement
      - Skill development
      - Leadership coaching
      - Professional development
      - Other
      required: true
    - id: 8
      name: preferred_date
      label: Preferred Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: preferred_time
      label: Preferred Time Slot
      hint: null
      type: select_one
      options:
      - 8 AM - 9 AM
      - 9 AM - 10 AM
      - 10 AM - 11 AM
      - 11 AM - 12 PM
      - 1 PM - 2 PM
      - 2 PM - 3 PM
      - 3 PM - 4 PM
      required: true
    - id: 10
      name: appointment_duration
      label: Preferred Session Duration
      hint: null
      type: select_one
      options:
      - 30 minutes
      - 1 hour
      - 1.5 hours
      - 2 hours
      required: false
    - id: 11
      name: meeting_format
      label: Meeting Format
      hint: null
      type: select_one
      options:
      - In-person
      - Video call
      - Phone call
      - Hybrid - flexible
      required: true
    - id: 12
      name: advancement_focus
      label: -- Advancement Focus --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: current_role
      label: Current Role or Position
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: career_goals
      label: Career Goals
      hint: What do you want to achieve?
      type: text
      options: []
      required: true
    - id: 15
      name: advancement_areas
      label: Areas for advancement
      hint: Select all that apply
      type: select_multiple
      options:
      - Technical skills
      - Leadership skills
      - Communication
      - Networking
      - Education and credentials
      - Career planning
      required: false
    - id: 16
      name: challenges
      label: Current challenges or concerns
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: previous_coaching
      label: Have you had coaching or mentoring before?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not sure
      required: false
    - id: 18
      name: additional_information
      label: Additional information about your advancement goals
      hint: null
      type: text
      options: []
      required: false
