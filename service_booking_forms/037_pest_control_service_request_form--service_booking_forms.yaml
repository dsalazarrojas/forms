      type: date
      options: []
      required: false
    - id: 7
      name: service_time
      label: Service Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: service_notes
      label: Service Notes
      hint: null
      type: text
      options: []
      required: false
