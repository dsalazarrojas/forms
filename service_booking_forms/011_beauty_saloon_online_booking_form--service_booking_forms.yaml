inputSchema:
  type: object
  properties:
    title: Beauty Saloon Online Booking Form
    pages:
    - id: 1
      name: section_contact_info
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: section_booking_details
      label: -- Booking Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: service_requested
      label: Service Requested
      hint: null
      type: select_one
      options:
      - Haircut
      - Hair Coloring
      - Facial
      - Manicure
      - Pedicure
      - Waxing
      - Massage
      required: true
    - id: 7
      name: preferred_stylist
      label: Preferred Stylist
      hint: null
      type: select_one
      options:
      - No Preference
      - Alex Smith
      - Jordan Lee
      - Casey Brown
      - Taylor Reed
      required: true
    - id: 8
      name: appointment_date
      label: Preferred Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: appointment_time
      label: Preferred Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: first_time_client
      label: Is this your first time with us?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: special_requests
      label: Special Requests or Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: section_confirmation
      label: -- Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: cancellation_policy_agreement
      label: I agree to the 24-hour cancellation policy
      hint: Cancellations within 24 hours may incur a fee
      type: select_one
      options:
      - I Agree
      - Other
      required: true
