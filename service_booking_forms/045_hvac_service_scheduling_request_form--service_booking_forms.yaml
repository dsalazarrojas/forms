inputSchema:
  type: object
  properties:
    title: HVAC Service Scheduling Request Form
    pages:
    - id: 1
      name: service_scheduling_request
      label: Service Scheduling Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: service_requested
      label: Service Requested
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - '{''option1'': ''Heating''}'
      - '{''option2'': ''Air Conditioning''}'
      - '{''option3'': ''Plumbing''}'
      required: false
    - id: 5
      name: service_date
      label: Service Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: service_time
      label: Service Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: contact_message
      label: Contact Message
      hint: null
      type: text
      options: []
      required: false
