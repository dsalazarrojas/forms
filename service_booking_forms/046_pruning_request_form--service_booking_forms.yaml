inputSchema:
  type: object
  properties:
    title: Pruning Request Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: service_type
      label: Type of Service
      hint: null
      type: select_one
      options:
      - Pruning Service
      - Tree Trimming
      - Branch Pruning
      - Other
      required: false
    - id: 6
      name: service_location
      label: Service Location
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
