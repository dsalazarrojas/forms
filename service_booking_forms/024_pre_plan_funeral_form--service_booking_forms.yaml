inputSchema:
  type: object
  properties:
    title: Pre Plan Funeral Form
    pages:
    - id: 1
      name: funeral_name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: funeral_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: funeral_time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: funeral_location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: funeral_time_zone
      label: Time Zone
      hint: null
      type: select_one
      options:
      - Eastern
      - Central
      - Mountain
      - Pacific
      required: false
    - id: 6
      name: funeral_service_type
      label: Service Type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: client_name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
