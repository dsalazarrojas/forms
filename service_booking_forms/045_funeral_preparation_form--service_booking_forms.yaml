inputSchema:
  type: object
  properties:
    title: Funeral Preparation Form
    pages:
    - id: 1
      name: personal_info
      label: Personal Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: funeral_info
      label: Funeral Info
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: next_of_kin
      label: Select a relative
      hint: null
      type: select_one
      options:
      - Spouse
      - Child
      - Parent
      - Sibling
      - Other
      required: false
    - id: 5
      name: funeral_services
      label: Select Services
      hint: null
      type: select_multiple
      options:
      - Burial
      - Cremation
      - Memorial
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: submit_button
      label: Submit
      hint: null
      type: text
      options: []
      required: false
