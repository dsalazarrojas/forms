inputSchema:
  type: object
  properties:
    title: Live Session Scheduling Form
    pages:
    - id: 1
      name: live_session_scheduling_form
      label: Live Session Scheduling Form
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: session_details
      label: Session Details
      hint: null
      type: select_one
      options:
      - Coaching
      - Tutoring
      - Consulting
      required: true
    - id: 3
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: duration
      label: Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: coach_details
      label: Coach Details
      hint: null
      type: select_multiple
      options:
      - Coach
      - Team Member
      - Both
      required: true
    - id: 8
      name: session_topic
      label: Session Topic
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: session_notes
      label: Session Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: session_status
      label: Session Status
      hint: null
      type: select_one
      options:
      - Scheduled
      - Confirmed
      - Completed
      required: true
    - id: 11
      name: confirm_booking
      label: Confirm Booking
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
