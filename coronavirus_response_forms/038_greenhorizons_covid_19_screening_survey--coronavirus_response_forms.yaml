inputSchema:
  type: object
  properties:
    title: Greenhorizons COVID 19 Screening Survey
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: symptoms
      label: Symptoms
      hint: null
      type: select_multiple
      options:
      - Fever
      - Cough
      - Shortness of Breath
      - Fatigue
      - Muscle and Joint Pain
      required: true
    - id: 5
      name: recent_travel
      label: Recent Travel
      hint: null
      type: select_one
      options:
      - Within the last 14 days
      - More than 14 days ago
      required: true
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: healthcare
      label: Healthcare
      hint: null
      type: select_one
      options:
      - Private
      - Public
      required: true
    - id: 10
      name: follow_up
      label: Follow-Up
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: follow_up_time
      label: Follow-up Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
