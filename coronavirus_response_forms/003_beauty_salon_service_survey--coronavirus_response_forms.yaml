inputSchema:
  type: object
  properties:
    title: Beauty Salon Service Survey
    pages:
    - id: 1
      name: client_name
      label: Full Name
      hint: Optional - you may remain anonymous
      type: text
      options: []
      required: false
    - id: 2
      name: visit_date
      label: Date of Visit
      hint: When did you visit our salon
      type: date
      options: []
      required: true
    - id: 3
      name: service_received
      label: Service Received
      hint: Select the service you received
      type: select_one
      options:
      - Haircut
      - Hair Color
      - Highlights
      - Balayage
      - Perm
      - Straightening Treatment
      - Blowout and Styling
      - Updo
      - Hair Extensions
      - Bridal Hair
      - Manicure
      - Pedicure
      - Facial
      - Makeup Application
      - Waxing
      - Other
      required: true
    - id: 4
      name: stylist_name
      label: Stylist or Technician Name
      hint: Who provided your service
      type: text
      options: []
      required: false
    - id: 5
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied were you with your experience
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 6
      name: cleanliness_rating
      label: Cleanliness Rating
      hint: Rate our salon cleanliness
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 7
      name: covid_safety_measures
      label: COVID-19 Safety Measures
      hint: How would you rate our COVID-19 safety protocols
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      - Not Applicable
      required: true
    - id: 8
      name: safety_protocols_observed
      label: Safety Protocols Observed
      hint: Select all safety measures you noticed
      type: select_multiple
      options:
      - Staff wore masks
      - Temperature checks
      - Hand sanitizer available
      - Social distancing markers
      - Enhanced cleaning between clients
      - Limited waiting room capacity
      - Contactless payment
      - None observed
      required: true
    - id: 9
      name: staff_friendliness
      label: Staff Friendliness
      hint: How friendly was our staff
      type: select_one
      options:
      - Very Friendly
      - Friendly
      - Neutral
      - Unfriendly
      - Very Unfriendly
      required: true
    - id: 10
      name: service_quality
      label: Service Quality
      hint: Rate the quality of service received
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 11
      name: wait_time
      label: Wait Time
      hint: How long did you wait for your service
      type: select_one
      options:
      - No wait
      - Less than 10 minutes
      - 10-20 minutes
      - 20-30 minutes
      - More than 30 minutes
      required: true
    - id: 12
      name: value_for_money
      label: Value for Money
      hint: Do you feel the service was worth the price
      type: select_one
      options:
      - Excellent Value
      - Good Value
      - Fair Value
      - Poor Value
      - Very Poor Value
      required: true
    - id: 13
      name: likelihood_recommend
      label: Likelihood to Recommend
      hint: How likely are you to recommend us to friends
      type: select_one
      options:
      - Very Likely
      - Likely
      - Neutral
      - Unlikely
      - Very Unlikely
      required: true
    - id: 14
      name: will_return
      label: Will You Return
      hint: Do you plan to visit us again
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 15
      name: favorite_aspect
      label: What Did You Like Most
      hint: Your favorite part of the experience
      type: text
      options: []
      required: false
    - id: 16
      name: areas_improvement
      label: Areas for Improvement
      hint: What could we do better
      type: text
      options: []
      required: false
    - id: 17
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback you would like to share
      type: text
      options: []
      required: false
    - id: 18
      name: contact_permission
      label: May We Contact You
      hint: Can we follow up about your feedback
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
