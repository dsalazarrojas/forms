    - id: 3
      name: covid_symptoms
      label: COVID-19 Symptoms
      hint: Check all that apply
      type: select_multiple
      options:
      - Fever
      - Cough
      - Shortness of breath
      - Fatigue
      - Muscle or body aches
      - Headache
      - Sore throat
      - Runny nose/congestion
      - Diarrhea
      - Nausea or vomiting
      - New loss of taste or smell
      - New loss of appetite
      - Confusion or difficulty concentrating
      - New numbness or tingling in hands or feet
      - Feeling like I am going to pass out
      required: true
