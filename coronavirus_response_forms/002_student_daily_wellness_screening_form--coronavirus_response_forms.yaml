inputSchema:
  type: object
  properties:
    title: Student Daily Wellness Screening Form
    pages:
    - id: 1
      name: parent_or_guardian_info
      label: Parent or Guardian Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
