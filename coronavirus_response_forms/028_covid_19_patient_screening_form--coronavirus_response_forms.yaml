inputSchema:
  type: object
  properties:
    title: COVID 19 Patient Screening Form
    pages:
    - id: 1
      name: section_patient_details
      label: -- Patient Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: patient_id
      label: Patient ID or Medical Record Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: contact_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: contact_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: screening_date
      label: Date of Screening
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: section_health_screening
      label: -- Health Screening Questions --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: fever
      label: Do you have a fever above 100.4 degrees Fahrenheit?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      - Not checked
      required: true
    - id: 10
      name: cough
      label: Do you have a new cough?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 11
      name: shortness_breath
      label: Do you have shortness of breath?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 12
      name: sore_throat
      label: Do you have a sore throat?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 13
      name: loss_taste_smell
      label: Have you lost your sense of taste or smell?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 14
      name: body_aches
      label: Do you have body aches or chills?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 15
      name: section_exposure_history
      label: -- Exposure History --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: covid_diagnosis
      label: Have you been diagnosed with COVID-19 in the past 14 days?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 17
      name: close_contact_covid
      label: Have you been in close contact with someone with COVID-19?
      hint: In the past 14 days
      type: select_one
      options:
      - 'False'
      - 'True'
      - Unsure
      required: true
    - id: 18
      name: travel
      label: Have you traveled outside the area in the past 14 days?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 19
      name: section_assessment
      label: -- Screening Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: cleared_to_visit
      label: Based on this screening, patient is cleared to visit
      hint: null
      type: select_one
      options:
      - 'True'
      - No - requires further evaluation
      - Requires precautions
      required: true
    - id: 21
      name: screening_notes
      label: Screener Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: screener_name
      label: Screener Name
      hint: null
      type: text
      options: []
      required: true
