inputSchema:
  type: object
  properties:
    title: Drive Thru Testing Appointment Form
    pages:
    - id: 1
      name: appointment_time
      label: Choose an Appointment Time
      hint: null
      type: select_one
      options:
      - 8:00 AM
      - 9:00 AM
      - 10:00 AM
      - 11:00 AM
      - 12:00 PM
      - 1:00 PM
      required: false
    - id: 2
      name: test_type
      label: What kind of test?
      hint: null
      type: select_multiple
      options:
      - Rapid Test
      - PCR Test
      - Antibody Test
      required: false
    - id: 3
      name: test_result
      label: Test Result
      hint: Enter test result
      type: text
      options: []
      required: false
    - id: 4
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: false
