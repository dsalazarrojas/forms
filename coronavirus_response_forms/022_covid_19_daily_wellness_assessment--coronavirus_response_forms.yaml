inputSchema:
  type: object
  properties:
    title: COVID 19 Daily Wellness Assessment
    pages:
    - id: 1
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: assessment_time
      label: Assessment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 3
      name: participant_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: participant_id
      label: ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: department_school
      label: Department or School
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_header_1
      label: -- Physical Wellness --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: overall_health
      label: Overall Health Today
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: fever_today
      label: Do you have a fever today?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: fever_reading
      label: Temperature Reading
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: respiratory_symptoms
      label: Respiratory Symptoms
      hint: Select all that apply
      type: select_multiple
      options:
      - Cough
      - Shortness of breath
      - Sore throat
      - Runny nose
      - Sneezing
      - None
      required: true
    - id: 11
      name: other_symptoms
      label: Other Symptoms
      hint: Select all that apply
      type: select_multiple
      options:
      - Headache
      - Body aches
      - Chills
      - Fatigue
      - Loss of taste or smell
      - Nausea or vomiting
      - Diarrhea
      - None
      required: true
    - id: 12
      name: section_header_2
      label: -- Wellness and Exposure --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: felt_well_past_24_hours
      label: Have you felt well in the past 24 hours?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 14
      name: covid_exposure_past_24
      label: COVID-19 Exposure in Past 24 Hours
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unsure
      required: true
    - id: 15
      name: quarantine_household
      label: Household Member in Quarantine
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 16
      name: section_header_3
      label: -- Mental and Emotional Wellness --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: stress_level
      label: Stress Level
      hint: null
      type: select_one
      options:
      - No stress
      - Low stress
      - Moderate stress
      - High stress
      - Extreme stress
      required: true
    - id: 18
      name: anxiety_level
      label: Anxiety Level
      hint: null
      type: select_one
      options:
      - No anxiety
      - Mild anxiety
      - Moderate anxiety
      - Severe anxiety
      required: true
    - id: 19
      name: sleep_quality
      label: Sleep Quality Last Night
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 20
      name: section_header_4
      label: -- Screening Result --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: wellness_check_result
      label: Wellness Check Result
      hint: null
      type: select_one
      options:
      - Cleared to attend
      - Recommend staying home
      - Seek medical evaluation
      required: true
    - id: 22
      name: additional_concerns
      label: Additional Wellness Concerns
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: ready_for_activities
      label: Ready to participate in activities today
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
