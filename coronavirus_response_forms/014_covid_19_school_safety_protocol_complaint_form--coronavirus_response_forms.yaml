inputSchema:
  type: object
  properties:
    title: COVID 19 School Safety Protocol Complaint Form
    pages:
    - id: 1
      name: complaint_date
      label: Complaint Date
      hint: Date of complaint
      type: date
      options: []
      required: true
    - id: 2
      name: complainant_name
      label: Your Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: complainant_email
      label: Your Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: complainant_phone
      label: Your Phone
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 5
      name: relationship_to_school
      label: Your Relationship to the School
      hint: Select your role
      type: select_one
      options:
      - Parent or guardian
      - Student
      - Teacher or staff
      - Administrator
      - Community member
      - Other
      required: true
    - id: 6
      name: student_name
      label: Student Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 7
      name: student_grade
      label: Student Grade Level
      hint: If applicable
      type: select_one
      options:
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      - Not applicable
      required: false
    - id: 8
      name: school_name
      label: School Name
      hint: Which school
      type: text
      options: []
      required: true
    - id: 9
      name: incident_date
      label: Date of Incident
      hint: When did this occur
      type: date
      options: []
      required: true
    - id: 10
      name: incident_time
      label: Time of Incident
      hint: Approximate time
      type: time
      options: []
      required: false
    - id: 11
      name: incident_location
      label: Location of Incident
      hint: Where did this occur
      type: text
      options: []
      required: true
    - id: 12
      name: complaint_category
      label: Category of Complaint
      hint: Select primary category
      type: select_one
      options:
      - Mask policy violation
      - Social distancing violation
      - Inadequate cleaning or sanitation
      - Poor ventilation
      - Lack of health screening
      - Inadequate contact tracing
      - Failure to report positive cases
      - Discrimination related to COVID-19
      - Retaliation for raising concerns
      - Other safety concern
      required: true
    - id: 13
      name: individuals_involved
      label: Individuals Involved
      hint: Names or descriptions
      type: text
      options: []
      required: true
    - id: 14
      name: complaint_description
      label: Detailed Description of Complaint
      hint: Please provide full details
      type: text
      options: []
      required: true
    - id: 15
      name: previous_reporting
      label: Have you reported this issue before
      hint: Previous reports
      type: select_one
      options:
      - Yes to school administration
      - Yes to school board
      - Yes to health department
      - No this is the first report
      required: true
    - id: 16
      name: previous_response
      label: What was the response to previous reports
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 17
      name: witnesses_present
      label: Were there any witnesses
      hint: Witness information
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 18
      name: witness_information
      label: Witness Information
      hint: Names and contact info
      type: text
      options: []
      required: false
    - id: 19
      name: evidence_available
      label: Do you have any evidence to support your complaint
      hint: Photos, emails, documents
      type: select_one
      options:
      - Yes I will attach evidence
      - Yes but I need help submitting
      - false
      required: true
    - id: 20
      name: desired_outcome
      label: What outcome are you seeking
      hint: Resolution desired
      type: text
      options: []
      required: true
    - id: 21
      name: anonymity_request
      label: Would you like to remain anonymous
      hint: Confidentiality request
      type: select_one
      options:
      - Yes keep my identity confidential
      - No you may share my name
      required: true
    - id: 22
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we contact you
      type: select_one
      options:
      - Email
      - Phone call
      - Text message
      - Mail
      required: true
    - id: 23
      name: urgency_level
      label: How urgent is this complaint
      hint: Priority level
      type: select_one
      options:
      - Low - general concern
      - Medium - should be addressed soon
      - High - needs immediate attention
      - Critical - ongoing safety risk
      required: true
    - id: 24
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
    - id: 25
      name: complainant_signature_date
      label: Signature Date
      hint: Date submitted
      type: date
      options: []
      required: true
