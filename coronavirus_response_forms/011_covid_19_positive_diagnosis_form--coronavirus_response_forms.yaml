inputSchema:
  type: object
  properties:
    title: COVID 19 Positive Diagnosis Form
    pages:
    - id: 1
      name: section_employee_info
      label: -- Employee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: employee_dept
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: section_test_info
      label: -- Diagnosis Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: test_date
      label: Date of Positive Test
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: test_type
      label: Type of Test Performed
      hint: null
      type: select_one
      options:
      - PCR
      - Rapid Antigen
      - Antibody
      - Other
      required: true
    - id: 8
      name: symptoms_start_date
      label: Date Symptoms Started
      hint: If asymptomatic, enter the date of the test
      type: date
      options: []
      required: true
    - id: 9
      name: last_work_day
      label: Last Day at Workplace
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: workplace_contacts
      label: Close Contacts at Work
      hint: List names of colleagues you were in close contact with (within 6ft for
        15+ mins)
      type: text
      options: []
      required: false
    - id: 11
      name: current_status
      label: Current Health Status
      hint: null
      type: select_one
      options:
      - Recovering at home
      - Hospitalized
      - Asymptomatic
      required: true
    - id: 12
      name: expected_return
      label: Expected Return Date
      hint: Subject to medical clearance
      type: date
      options: []
      required: false
    - id: 13
      name: confidentiality_acknowledgment
      label: I understand this information will be used for workplace safety purposes
      hint: null
      type: select_one
      options:
      - I acknowledge
      - Other
      required: true
