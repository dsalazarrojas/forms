inputSchema:
  type: object
  properties:
    title: Covid 19 Daily Status Update Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_dob
      label: patient_dob
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Not Vaccinated
      - Partially Vaccinated
      - Fully Vaccinated
      required: true
    - id: 4
      name: vaccination_date
      label: vaccination_date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: medical_team_name
      label: Medical Team Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: medical_team_email
      label: Medical Team Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: hospital_name
      label: Hospital Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: medical_record_number
      label: Medical Record Number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
