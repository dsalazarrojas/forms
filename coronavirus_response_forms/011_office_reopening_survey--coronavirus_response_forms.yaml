inputSchema:
  type: object
  properties:
    title: Office Reopening Survey
    pages:
    - id: 1
      name: office_reopening_survey_1
      label: Is the office ready to reopen?
      hint: null
      type: select_multiple
      options:
      - Open
      - Not Yet
      - Still Considering
      required: false
    - id: 2
      name: reopening_date_planned
      label: What date do you plan to reopen?
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: office_capacity
      label: How many employees can fit in the office?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: safety_measures
      label: Are you going to implement safety measures like hand sanitizer and masks?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: false
    - id: 5
      name: employee_testing
      label: What testing would be necessary for employees?
      hint: null
      type: select_multiple
      options:
      - Temperature Check
      - PCR Test
      - Rapid Antigen Test
      required: false
    - id: 6
      name: employee_vaccination
      label: Are employees required to be vaccinated?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: remote_work_options
      label: Will remote work be available after reopening?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Only for certain roles
      required: false
