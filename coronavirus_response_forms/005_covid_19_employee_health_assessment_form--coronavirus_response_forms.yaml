inputSchema:
  type: object
  properties:
    title: COVID 19 Employee Health Assessment Form
    pages:
    - id: 1
      name: section_employee_info
      label: -- Employee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_assessment
      label: Date of Assessment
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: employee_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: employee_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: section_health_status
      label: -- Current Health Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: overall_health
      label: How would you rate your overall health?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 10
      name: current_symptoms
      label: Are you currently experiencing any of the following symptoms?
      hint: null
      type: select_multiple
      options:
      - Fever or chills
      - Cough
      - Shortness of breath
      - Fatigue
      - Headache
      - Loss of taste or smell
      - Sore throat
      - No symptoms
      required: true
    - id: 11
      name: symptom_severity
      label: If experiencing symptoms, how severe are they?
      hint: null
      type: select_one
      options:
      - Mild
      - Moderate
      - Severe
      - Not applicable
      required: false
    - id: 12
      name: section_covid_status
      label: -- COVID-19 Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: vaccination_status
      label: What is your COVID-19 vaccination status?
      hint: null
      type: select_one
      options:
      - Fully vaccinated
      - Partially vaccinated
      - Not vaccinated
      - Prefer not to answer
      required: true
    - id: 14
      name: covid_diagnosis
      label: Have you been diagnosed with COVID-19?
      hint: null
      type: select_one
      options:
      - false
      - Yes, currently
      - Yes, previously
      required: true
    - id: 15
      name: covid_diagnosis_date
      label: Date of COVID-19 diagnosis (if applicable)
      hint: null
      type: date
      options: []
      required: false
    - id: 16
      name: close_contact
      label: Have you had close contact with a confirmed COVID-19 case?
      hint: In the last 14 days
      type: select_one
      options:
      - false
      - true
      - Unsure
      required: true
    - id: 17
      name: section_work_capacity
      label: -- Work Capacity Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: work_readiness
      label: Are you able to perform your job duties safely?
      hint: null
      type: select_one
      options:
      - Yes, fully capable
      - Yes, with accommodations
      - No, not at this time
      required: true
    - id: 19
      name: work_environment
      label: What is your work environment?
      hint: null
      type: select_one
      options:
      - Remote
      - On-site
      - Hybrid
      required: true
    - id: 20
      name: section_employer_notes
      label: -- Employer Notes --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: recommended_action
      label: Recommended action
      hint: null
      type: select_one
      options:
      - Continue normal work
      - Work from home
      - Medical leave
      - Requires medical evaluation
      required: true
    - id: 22
      name: additional_notes
      label: Additional notes
      hint: null
      type: text
      options: []
      required: false
