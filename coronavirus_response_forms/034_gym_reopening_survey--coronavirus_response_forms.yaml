inputSchema:
  type: object
  properties:
    title: Gym Reopening Survey
    pages:
    - id: 1
      name: user_info
      label: 1. What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_week_visit
      label: 2. Why did you not visit the gym last week?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: feel_safe_again
      label: 3. What is the earliest date you would feel safe visiting the gym again?
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: safety_measures
      label: 4. What safety measures do you expect the gym to have in place?
      hint: null
      type: select_multiple
      options:
      - Hand Sanitizer
      - Temperature Check
      - Mask Required
      - Social Distancing
      - Reduced Capacity
      required: true
    - id: 5
      name: visit_other_places
      label: 5. How often do you visit other places like restaurants?
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: visit_expectation
      label: 6. What do you expect from us when you visit the gym again?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: communicate_with_us
      label: 7. How do you prefer to communicate with us?
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Message
      required: true
    - id: 8
      name: other_comments
      label: 8. Do you have any other comments or concerns?
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: visit_frequency
      label: 9. How often do you plan to visit the gym this week?
      hint: null
      type: select_one
      options:
      - This week
      - Next week
      - Next month
      required: true
    - id: 10
      name: notification_preference
      label: 10. How do you prefer to be notified?
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      required: true
    - id: 11
      name: friends_family_member
      label: 11. Do you have any friends or family members that visit the gym?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: gym_in_your_area
      label: 12. Are there any other gyms in your area?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: other_gyms
      label: Other Gyms
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: visit_gym_again
      label: 14. Are you planning to visit the gym again?
      hint: null
      type: select_one
      options:
      - This week
      - Next week
      - Next month
      required: false
    - id: 15
      name: rating
      label: 15. How would you rate your last visit?
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: other_comments_2
      label: 16. Do you have any other comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: rating_2
      label: 17. How satisfied are you with our service?
      hint: null
      type: number
      options: []
      required: false
