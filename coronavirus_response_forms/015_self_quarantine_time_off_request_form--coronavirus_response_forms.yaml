inputSchema:
  type: object
  properties:
    title: Self Quarantine Time Off Request Form
    pages:
    - id: 1
      name: employee
      label: Employee
      hint: Please select your name from the list
      type: select_multiple
      options:
      - Employee 1
      - Employee 2
      - Employee 3
      required: true
    - id: 2
      name: reason_for_requesting_time_off
      label: Reason for requesting time off
      hint: Explain your reason for requesting time off
      type: text
      options: []
      required: true
    - id: 3
      name: quarantine_start_date
      label: Quarantine start date
      hint: Enter the date you started your quarantine
      type: date
      options: []
      required: true
    - id: 4
      name: return_to_work_date
      label: Return to work date
      hint: Enter the date you expect to return to work
      type: date
      options: []
      required: true
    - id: 5
      name: contact_information
      label: Contact information
      hint: Enter your email or phone number
      type: email
      options: []
      required: false
    - id: 6
      name: manager
      label: Manager
      hint: Please select your manager
      type: select_one
      options:
      - Manager 1
      - Manager 2
      - Manager 3
      required: true
    - id: 7
      name: manager_notes
      label: Manager notes
      hint: Any additional information from your manager
      type: text
      options: []
      required: true
    - id: 8
      name: employee_signature
      label: Employee signature
      hint: Please sign your name
      type: note
      options: []
      required: true
    - id: 9
      name: manager_signature
      label: Manager signature
      hint: Please sign your name below
      type: note
      options: []
      required: true
    - id: 10
      name: date
      label: Date
      hint: Enter the date
      type: date
      options: []
      required: true
