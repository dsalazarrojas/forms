inputSchema:
  type: object
  properties:
    title: COVID 19 Symptom Screening Questionnaire Form
    pages:
    - id: 1
      name: full_name
      label: Full name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: screening_date
      label: Screening date
      hint: Date of screening
      type: date
      options: []
      required: true
    - id: 3
      name: symptoms_present
      label: Do you currently have any of the following symptoms
      hint: Select all that apply
      type: select_multiple
      options:
      - Fever
      - Cough
      - Shortness of breath
      - Sore throat
      - Loss of taste or smell
      required: true
    - id: 4
      name: recent_travel
      label: Recent international travel in past 14 days
      hint: Travel history relevant to exposure
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 5
      name: exposure_to_confirmed_case
      label: Exposure to a confirmed case
      hint: Close contact within 14 days
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 6
      name: temperature_celsius
      label: Measured temperature in celsius
      hint: Provide numeric value if available
      type: number
      options: []
      required: false
    - id: 7
      name: healthcare_provider_contact
      label: Do you have a healthcare provider to contact
      hint: Useful for follow up
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 8
      name: comments
      label: Additional comments
      hint: Any other relevant information
      type: text
      options: []
      required: false
