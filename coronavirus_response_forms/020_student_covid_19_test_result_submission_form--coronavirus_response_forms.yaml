inputSchema:
  type: object
  properties:
    title: Student COVID 19 Test Result Submission Form
    pages:
    - id: 1
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: test_date
      label: Test Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: test_result
      label: Test Result
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Positive'', ''label'': ''Positive''}'
      - '{''id'': 2, ''name'': ''Negative'', ''label'': ''Negative''}'
      - '{''id'': 3, ''name'': ''Pending'', ''label'': ''Pending''}'
      required: true
    - id: 4
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: test_result_notes
      label: Test Result Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: teacher_email
      label: Teacher Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: test_result_date
      label: Test Result Date
      hint: null
      type: date
      options: []
      required: false
