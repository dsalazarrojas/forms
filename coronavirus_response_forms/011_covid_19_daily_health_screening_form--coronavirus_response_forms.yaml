inputSchema:
  type: object
  properties:
    title: COVID 19 Daily Health Screening Form
    pages:
    - id: 1
      name: header
      label: -- Daily Health Screening --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: screening_date
      label: Screening Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: screening_time
      label: Screening Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: id_number
      label: ID or Badge Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: department_area
      label: Department or Area
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: temperature_section
      label: -- Vital Signs --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: temperature
      label: Body Temperature
      hint: Enter temperature in Fahrenheit
      type: number
      options: []
      required: true
    - id: 9
      name: temperature_pass
      label: Temperature screening result
      hint: null
      type: select_one
      options:
      - Passed (Below 100.4F)
      - Failed (100.4F or Above)
      required: true
    - id: 10
      name: symptoms_section
      label: -- Symptom Screening --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: fever
      label: Fever or chills in past 24 hours
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 12
      name: cough
      label: Persistent cough
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 13
      name: shortness_of_breath
      label: Shortness of breath or difficulty breathing
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 14
      name: fatigue
      label: Fatigue or malaise
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 15
      name: loss_of_taste_smell
      label: Loss of taste or smell
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 16
      name: headache
      label: Headache or body aches
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 17
      name: exposure_section
      label: -- Exposure History --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: known_exposure
      label: Exposed to confirmed COVID-19 case in past 14 days
      hint: null
      type: select_one
      options:
      - true
      - false
      - Unknown
      required: true
    - id: 19
      name: close_contact
      label: Had close contact with someone with symptoms
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 20
      name: travel
      label: Recent travel or visited high-risk area
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 21
      name: clearance_section
      label: -- Clearance --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: cleared
      label: Screening Result
      hint: null
      type: select_one
      options:
      - Cleared to Enter
      - Denied Entry
      - Refer to Medical
      required: true
    - id: 23
      name: screener_name
      label: Screener Name
      hint: null
      type: text
      options: []
      required: true
