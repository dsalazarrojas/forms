inputSchema:
  type: object
  properties:
    title: Social Club Health Screening Form
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: temperature
      label: Temperature
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: symptoms
      label: Symptoms
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: travel_history
      label: Travel History
      hint: 'null'
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: travel_country
      label: Country
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: health_status
      label: Health Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
