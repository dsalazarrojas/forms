inputSchema:
  type: object
  properties:
    title: COVID 19 Phase 1A Vaccination Registration Form
    pages:
    - id: 1
      name: section_personal_info
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: zip_code
      label: ZIP Code
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: section_phase_1a_criteria
      label: -- Phase 1A Eligibility --
      hint: Healthcare workers and long-term care residents
      type: note
      options: []
      required: false
    - id: 12
      name: phase_1a_category
      label: Which Phase 1A category applies to you?
      hint: null
      type: select_one
      options:
      - Healthcare worker
      - Long-term care resident
      - Both
      required: true
    - id: 13
      name: healthcare_facility
      label: Healthcare Facility Name (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: section_medical_history
      label: -- Medical Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: known_allergies
      label: Known Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: chronic_conditions
      label: Do you have chronic health conditions?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 17
      name: immunocompromised
      label: Are you immunocompromised?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      - Unsure
      required: true
    - id: 18
      name: section_vaccine_info
      label: -- Vaccine Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: previous_covid_vaccine
      label: Have you received COVID-19 vaccine before?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 20
      name: preferred_vaccine
      label: Vaccine Preference (if available)
      hint: null
      type: select_one
      options:
      - No preference
      - Pfizer
      - Moderna
      - Johnson & Johnson
      required: false
    - id: 21
      name: section_attestation
      label: -- Attestation --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: certify_eligibility
      label: I certify that I meet Phase 1A eligibility criteria
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 23
      name: registration_date
      label: Registration Date
      hint: null
      type: date
      options: []
      required: true
