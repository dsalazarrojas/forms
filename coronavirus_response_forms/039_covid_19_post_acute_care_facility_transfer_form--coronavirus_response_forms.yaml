      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: patient_age
      label: Age
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: contact_phone
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: false
