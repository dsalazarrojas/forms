inputSchema:
  type: object
  properties:
    title: Dental Studio COVID 19 Prescreening Form
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: main_page
      label: Have you travelled recently?
      hint: null
      type: select_multiple
      options:
      - Fever
      - Cough
      - Shortness of breath
      - Sore Throat
      - Runny Nose
      - Sore Throat
      - Difficulty Breathing
      - Chest Pain
      required: false
    - id: 3
      name: main_page
      label: Have you had any close contact with someone who has tested positive for
        COVID-19 in the last 14 days?
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      required: false
    - id: 4
      name: main_page
      label: Do you currently have any of the following?
      hint: null
      type: select_multiple
      options:
      - Fever
      - Cough
      - Fatigue
      - Muscle or body aches
      - Headache
      - Sore Throat
      - Shortness of breath
      - Runny Nose
