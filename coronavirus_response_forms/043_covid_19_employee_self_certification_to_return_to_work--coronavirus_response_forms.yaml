inputSchema:
  type: object
  properties:
    title: COVID 19 Employee Self Certification To Return To Work
    pages:
    - id: 1
      name: certification_date
      label: Certification Date
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 2
      name: employee_name
      label: Employee Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: position
      label: Position/Title
      hint: Your job title
      type: text
      options: []
      required: true
    - id: 6
      name: last_work_date
      label: Last Date of Work
      hint: Before your COVID-19 absence
      type: date
      options: []
      required: true
    - id: 7
      name: proposed_return_date
      label: Proposed Date to Return to Work
      hint: When do you want to come back?
      type: date
      options: []
      required: true
    - id: 8
      name: covid_status
      label: COVID-19 Status
      hint: null
      type: select_one
      options:
      - Recovered from confirmed COVID-19 diagnosis
      - Recovered from suspected COVID-19
      - Completed quarantine after exposure
      - Other
      required: true
    - id: 9
      name: covid_test_result
      label: COVID-19 Test Result
      hint: Final test status before return
      type: select_one
      options:
      - Negative test
      - Never tested
      - Prefer not to disclose
      required: true
    - id: 10
      name: symptom_free
      label: I am symptom-free
      hint: No fever, cough, shortness of breath, loss of taste/smell
      type: select_one
      options:
      - Yes, completely symptom-free
      - Yes, but mild residual symptoms
      - No, still have symptoms
      - Unsure
      required: true
    - id: 11
      name: fever_free_duration
      label: Days Fever-Free Without Medication
      hint: Number of days without fever reducer
      type: number
      options: []
      required: false
    - id: 12
      name: medical_clearance
      label: Medical Clearance Obtained
      hint: Has healthcare provider cleared you?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not required
      required: true
    - id: 13
      name: physician_name
      label: Physician or Healthcare Provider Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 14
      name: quarantine_completion
      label: I have completed the recommended quarantine period
      hint: As per CDC or local health guidelines
      type: select_one
      options:
      - Yes, completed
      - Partial completion
      - Not applicable
      - Unsure of requirements
      required: true
    - id: 15
      name: isolation_conditions
      label: I meet isolation conditions for return to work
      hint: COVID-19 symptoms resolved, non-contagious
      type: select_one
      options:
      - Yes, I meet conditions
      - No, I do not meet conditions
      - Unsure
      required: true
    - id: 16
      name: household_members_covid
      label: Any Household Members Have COVID-19?
      hint: Potential ongoing exposure
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Unsure
      required: false
    - id: 17
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully vaccinated
      - Partially vaccinated
      - Not vaccinated
      - Prefer not to say
      required: false
    - id: 18
      name: work_accommodations_needed
      label: Work Accommodations Needed Upon Return
      hint: Modified duties, schedule, etc.
      type: text
      options: []
      required: false
    - id: 19
      name: health_insurance_notice
      label: I understand health insurance may require documentation
      hint: Healthcare provider records may be requested
      type: select_one
      options:
      - I acknowledge
      - I do not acknowledge
      required: true
    - id: 20
      name: accuracy_certification
      label: I certify that the information above is accurate and complete
      hint: To the best of my knowledge
      type: select_one
      options:
      - I certify
      - I do not certify
      required: true
    - id: 21
      name: supervisor_notification
      label: Supervisor Name for Notification
      hint: Your direct supervisor
      type: text
      options: []
      required: true
    - id: 22
      name: return_to_work_agreement
      label: I agree to return to work under our company COVID-19 protocols
      hint: Masking, testing, reporting symptoms, etc.
      type: select_one
      options:
      - I agree
      - I do not agree
      - Have questions
      required: true
