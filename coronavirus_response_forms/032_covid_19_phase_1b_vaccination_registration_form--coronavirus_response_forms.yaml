inputSchema:
  type: object
  properties:
    title: COVID 19 Phase 1B Vaccination Registration Form
    pages:
    - id: 1
      name: section_personnel_info
      label: -- Personnel Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: badge_number
      label: Badge or Employee Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: zip_code
      label: ZIP Code
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: section_employment
      label: -- Employment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: employment_type
      label: Employment Type
      hint: null
      type: select_one
      options:
      - Law Enforcement
      - Fire Personnel
      - Both Law Enforcement and Fire
      required: true
    - id: 14
      name: agency_name
      label: Agency Name
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: years_service
      label: Years of Service
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: section_medical_info
      label: -- Medical Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: known_allergies
      label: Known Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: medical_conditions
      label: Pre-existing Medical Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: medications
      label: Current Medications
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: section_vaccination_history
      label: -- Vaccination History --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: previous_vaccine
      label: Have you received COVID-19 vaccine before?
      hint: null
      type: select_one
      options:
      - false
      - true
      required: true
    - id: 22
      name: severe_reaction
      label: History of severe allergic reactions to vaccines?
      hint: null
      type: select_one
      options:
      - false
      - true
      required: true
    - id: 23
      name: section_confirmation
      label: -- Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: confirm_phase_1b
      label: I confirm I am eligible for Phase 1B vaccination
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 25
      name: consent_vaccination
      label: I consent to receive the COVID-19 vaccine
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 26
      name: registration_date
      label: Registration Date
      hint: null
      type: date
      options: []
      required: true
