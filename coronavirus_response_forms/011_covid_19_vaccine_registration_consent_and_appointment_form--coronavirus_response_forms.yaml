inputSchema:
  type: object
  properties:
    title: COVID 19 Vaccine Registration, Consent And Appointment Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: street_address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: city_state_zip
      label: City, State, ZIP
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Unvaccinated
      - One dose received
      - Fully vaccinated
      - Boosted
      required: true
    - id: 8
      name: dose_seeking
      label: Dose Being Sought
      hint: null
      type: select_one
      options:
      - First dose
      - Second dose
      - Booster dose
      - Additional booster
      required: true
    - id: 9
      name: vaccine_preference
      label: Vaccine Type Preference
      hint: null
      type: select_one
      options:
      - Pfizer-BioNTech
      - Moderna
      - Johnson & Johnson
      - No preference
      required: false
    - id: 10
      name: allergies
      label: Known Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: medical_conditions
      label: Medical Conditions
      hint: That might affect vaccination
      type: text
      options: []
      required: false
    - id: 12
      name: medications
      label: Current Medications
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: pregnant
      label: Pregnant or Breastfeeding
      hint: null
      type: select_one
      options:
      - Yes, pregnant
      - Yes, breastfeeding
      - false
      required: false
    - id: 14
      name: recent_vaccine
      label: Other Vaccines in Past 14 Days
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 15
      name: fever
      label: Currently Have Fever or Illness
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 16
      name: vaccine_understanding
      label: Understand Benefits and Risks
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 17
      name: consent_agreement
      label: I Consent to COVID-19 Vaccination
      hint: Voluntary agreement to receive vaccine
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 18
      name: appointment_date
      label: Preferred Appointment Date
      hint: Select from available dates
      type: date
      options: []
      required: true
    - id: 19
      name: appointment_time
      label: Preferred Appointment Time
      hint: Select from available times
      type: time
      options: []
      required: true
    - id: 20
      name: signature
      label: Electronic Signature
      hint: Type your full name
      type: text
      options: []
      required: true
