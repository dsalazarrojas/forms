inputSchema:
  type: object
  properties:
    title: Workplace Entry Screening Form
    pages:
    - id: 1
      name: employee_info
      label: Employee Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: travel_history
      label: Travel History
      hint: Provide travel history for the past 14 days
      type: text
      options: []
      required: false
    - id: 3
      name: symptoms
      label: Symptoms
      hint: null
      type: select_one
      options:
      - Fever
      - Cough
      - Shortness of breath or difficulty breathing
      - Chest pain or discomfort
      - Sore Throat
      - Muscle aches or pains
      - Diarrhea
      - Vomiting
      - Runny nose/congestion
      - Headache
      - Fatigue
      - New or unexplained loss of taste or smell
      - Nausea or vomiting
      - Dizziness
      - Confusion or disorientation
      - Difficulty staying or falling asleep
      required: true
    - id: 4
      name: travel_details
      label: Travel Details
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: close_contact
      label: Close Contact
      hint: null
      type: select_multiple
      options:
      - 'False'
      - 'True'
      - Partner or spouse
      - Family member
      - Close friend
      - Neighbor
      - Coworker
      - Classmate
      - Team member
      - Someone in same household
      required: true
    - id: 6
      name: exposure_risk
      label: Exposure Risk
      hint: null
      type: select_one
      options:
      - Low
      - Moderate
      - High
      required: true
    - id: 7
      name: health_certificate
      label: Health Certificate
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Sure
      required: true
    - id: 8
      name: test_results
      label: Test Results
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Done
      required: true
    - id: 9
      name: travel_restrictions
      label: Travel Restrictions
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: contact_tracing
      label: Contact Tracing
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: self_isolation
      label: Self Isolation
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: health_clinics
      label: Health Clinics
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
