      name: outbreak_source
      label: Suspected Source of Outbreak
      hint: null
      type: select_one
      options:
      - Unknown
      - Community transmission
      - Staff member
      - Visitor
      - Patient admission
      - Healthcare worker
      - Other
      required: true
    - id: 19
      name: investigation_status
      label: Investigation Status
      hint: null
      type: select_one
      options:
      - Ongoing
      - Initial assessment
      - Complete
      - No investigation needed
      required: true
    - id: 20
      name: section_response_measures
      label: -- Response Measures Taken --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: measures_implemented
      label: Measures Implemented
      hint: null
      type: select_multiple
      options:
      - Isolation protocols
      - Enhanced cleaning
      - Testing program
      - Staff training
      - Visitor restrictions
      - PPE distribution
      - Reporting to health department
      required: true
    - id: 22
      name: section_reporting_official
