inputSchema:
  type: object
  properties:
    title: COVID 19 Booster Vaccine Appointment Form
    pages:
    - id: 1
      name: appointment_date
      label: Preferred Appointment Date
      hint: Date you would like to receive your booster vaccine
      type: date
      options: []
      required: true
    - id: 2
      name: appointment_time
      label: Preferred Time Slot
      hint: null
      type: select_one
      options:
      - 8:00 AM - 9:00 AM
      - 9:00 AM - 10:00 AM
      - 10:00 AM - 11:00 AM
      - 11:00 AM - 12:00 PM
      - 1:00 PM - 2:00 PM
      - 2:00 PM - 3:00 PM
      - 3:00 PM - 4:00 PM
      - 4:00 PM - 5:00 PM
      required: true
    - id: 3
      name: patient_name
      label: Patient Name
      hint: Your full legal name
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: street_address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: zip_code
      label: Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: insurance_provider
      label: Insurance Provider
      hint: Name of your health insurance company
      type: text
      options: []
      required: false
    - id: 13
      name: insurance_id
      label: Insurance ID Number
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: initial_vaccine
      label: Initial COVID-19 Vaccine Received
      hint: What vaccine did you initially get?
      type: select_one
      options:
      - Pfizer
      - Moderna
      - Johnson and Johnson
      - AstraZeneca
      - Other
      - Not sure
      required: true
    - id: 15
      name: initial_vaccine_date
      label: Date of Initial Vaccination
      hint: When did you receive your primary series?
      type: date
      options: []
      required: true
    - id: 16
      name: previous_booster_dates
      label: Previous Booster Shot Dates
      hint: If you had boosters before
      type: text
      options: []
      required: false
    - id: 17
      name: booster_vaccine_preference
      label: Booster Vaccine Preference
      hint: What type would you prefer?
      type: select_one
      options:
      - Same vaccine as primary
      - Pfizer
      - Moderna
      - Johnson and Johnson
      - No preference
      required: false
    - id: 18
      name: allergies
      label: Known Allergies
      hint: Any allergies to vaccine components?
      type: text
      options: []
      required: false
    - id: 19
      name: medical_conditions
      label: Current Medical Conditions
      hint: Any conditions we should know about?
      type: text
      options: []
      required: false
    - id: 20
      name: current_medications
      label: Current Medications
      hint: List any medications you are taking
      type: text
      options: []
      required: false
    - id: 21
      name: pregnancy_status
      label: Pregnancy Status
      hint: Are you pregnant or trying to become pregnant?
      type: select_one
      options:
      - Not applicable
      - Not pregnant
      - Pregnant
      - Trying to conceive
      - Prefer not to say
      required: false
    - id: 22
      name: recent_illness
      label: Recent Illness
      hint: Any fever or illness in past 2 weeks?
      type: select_one
      options:
      - No recent illness
      - Cold symptoms
      - Flu-like symptoms
      - COVID-19 suspected
      - COVID-19 confirmed
      required: true
    - id: 23
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: In case of medical emergency
      type: text
      options: []
      required: false
    - id: 24
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
