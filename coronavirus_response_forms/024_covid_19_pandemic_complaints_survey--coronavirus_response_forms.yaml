      name: evidence
      label: Do you have evidence or documentation?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 20
      name: follow_up_desired
      label: Do you want follow-up on this complaint?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 21
      name: preferred_contact
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - In-person
      - No preference
      required: false
    - id: 22
      name: survey_date
      label: Survey Submission Date
      hint: null
      type: date
      options: []
      required: true
