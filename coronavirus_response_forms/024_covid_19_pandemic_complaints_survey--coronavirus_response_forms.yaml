      name: personal_impact
      label: How has this affected you personally?
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: severity
      label: Severity Level
      hint: null
      type: select_one
      options:
      - Low
      - Moderate
      - High
      - Critical
      required: true
    - id: 18
      name: section_additional_info
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
