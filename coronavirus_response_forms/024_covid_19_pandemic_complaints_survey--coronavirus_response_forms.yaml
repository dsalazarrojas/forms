inputSchema:
  type: object
  properties:
    title: COVID 19 Pandemic Complaints Survey
    pages:
    - id: 1
      name: section_respondent_info
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: respondent_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: organization
      label: Organization or Workplace
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: respondent_role
      label: Your Role
      hint: null
      type: select_one
      options:
      - Employee
      - Business owner
      - Customer
      - Community member
      - Healthcare worker
      - Student
      - Other
      required: true
    - id: 7
      name: section_complaint_type
      label: -- Complaint or Feedback Type --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: feedback_type
      label: Type of Feedback
      hint: null
      type: select_one
      options:
      - Complaint
      - Compliment
      - Suggestion
      - Question
      - Other
      required: true
    - id: 9
      name: complaint_category
      label: Category of Complaint or Feedback
      hint: null
      type: select_one
      options:
      - Government response
      - Healthcare services
      - Business closure
      - Economic impact
      - Mental health
      - Education disruption
      - Safety measures
      - Vaccination information
      - Other
      required: true
    - id: 10
      name: section_details
      label: -- Complaint or Feedback Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: complaint_summary
      label: Brief Summary
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: complaint_details
      label: Detailed Description
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: incident_date
      label: Date of Incident or Observation
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: section_impact
      label: -- Impact Assessment --
      hint: null
      type: note
      options: []
      required: false
