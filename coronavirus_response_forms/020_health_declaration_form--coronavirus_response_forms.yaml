inputSchema:
  type: object
  properties:
    title: Health Declaration Form
    pages:
    - id: 1
      name: travel_history
      label: Travel History
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: symptoms
      label: Symptoms
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: contact_trace
      label: Contact Trace
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: health_status
      label: Health Status
      hint: null
      type: select_one
      options:
      - No symptoms
      - Mild symptoms
      - Severe symptoms
      - No symptoms but exposed to someone with symptoms
      required: false
    - id: 5
      name: travel_details
      label: Travel Details
      hint: Flight number, date of travel, country traveled from
      type: text
      options: []
      required: false
    - id: 6
      name: travel_type
      label: Travel Type
      hint: null
      type: select_one
      options:
      - Traveler
      - Patient
      - Event attendee
      - Student
      - Visitor
      - Employee
      required: false
    - id: 7
      name: travel_destination
      label: Travel Destination
      hint: Country or region traveled from, if traveling
      type: text
      options: []
      required: false
    - id: 8
      name: medical_attention
      label: Medical Attention
      hint: null
      type: date
      options: []
