      name: medical_facility
      label: Medical Facility
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: medical_treatment
      label: Medical Treatment
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: medical_result
      label: Medical Result
      hint: null
      type: select_one
      options:
      - No result
      - Positive
      - Negative
