inputSchema:
  type: object
  properties:
    title: COVID 19 Health Screening Questionnaire
    pages:
    - id: 1
      name: header
      label: -- Health Screening Questionnaire --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: screening_date
      label: Screening Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: symptom_section
      label: -- Symptom Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: fever
      label: Do you have a fever or high temperature
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 9
      name: cough
      label: Do you have a new or persistent cough
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 10
      name: breathlessness
      label: Do you have shortness of breath
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 11
      name: fatigue
      label: Unusual tiredness or fatigue
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 12
      name: loss_sense
      label: Loss of taste or smell
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 13
      name: sore_throat
      label: Sore throat or difficulty swallowing
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 14
      name: exposure_section
      label: -- Exposure History --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: close_contact
      label: Close contact with confirmed COVID-19 case
      hint: null
      type: select_one
      options:
      - true
      - false
      - Unknown
      required: true
    - id: 16
      name: contact_date
      label: Date of last contact if applicable
      hint: null
      type: date
      options: []
      required: false
    - id: 17
      name: contact_isolation
      label: Person with confirmed case quarantined
      hint: null
      type: select_one
      options:
      - true
      - false
      - Unknown
      required: false
    - id: 18
      name: work_healthcare
      label: Do you work in healthcare setting
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 19
      name: risk_section
      label: -- Risk Factors --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: underlying_conditions
      label: Pre-existing medical conditions
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 21
      name: condition_description
      label: Type of conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: immunocompromised
      label: Are you immunocompromised
      hint: null
      type: select_one
      options:
      - true
      - false
      - Unknown
      required: true
    - id: 23
      name: vaccines
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully Vaccinated
      - Partially Vaccinated
      - Not Vaccinated
      - Unknown
      required: true
    - id: 24
      name: recommendation
      label: Screening Recommendation
      hint: null
      type: select_one
      options:
      - Home Quarantine Recommended
      - Monitor for Symptoms
      - Seek Medical Evaluation
      - No Action Needed
      required: true
