inputSchema:
  type: object
  properties:
    title: COVID 19 Dance Studio Registration Form
    pages:
    - id: 1
      name: section_header_1
      label: -- Class Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: class_date
      label: Class Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: class_time
      label: Class Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: class_type
      label: Class Type
      hint: null
      type: select_one
      options:
      - Ballet
      - Jazz
      - Hip Hop
      - Contemporary
      - Tap
      - Salsa
      - Ballroom
      - Other
      required: true
    - id: 5
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: studio_location
      label: Studio Location
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: section_header_2
      label: -- Student Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: student_id
      label: Student ID
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: student_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: student_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: experience_level
      label: Experience Level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Professional
      required: true
    - id: 14
      name: section_header_3
      label: -- Health Screening --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: health_screening_pass
      label: Health Screening Completed
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 16
      name: fever_screening
      label: Temperature Check - Normal
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 17
      name: symptoms_present
      label: COVID-19 Symptoms Present
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 18
      name: symptom_types
      label: If yes, describe symptoms
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: covid_exposure
      label: Exposure to COVID-19 Positive Person
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unsure
      required: true
    - id: 20
      name: section_header_4
      label: -- Vaccination Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully vaccinated with booster
      - Fully vaccinated without booster
      - Partially vaccinated
      - Not vaccinated
      - Prefer not to disclose
      required: true
    - id: 22
      name: section_header_5
      label: -- Acknowledgment --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: safety_protocols_acknowledged
      label: I acknowledge the studio safety protocols
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 24
      name: waiver_accepted
      label: I accept the COVID-19 liability waiver
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 25
      name: registration_date
      label: Registration Date
      hint: null
      type: date
      options: []
      required: true
