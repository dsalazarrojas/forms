inputSchema:
  type: object
  properties:
    title: COVID 19 Grant Application Form
    pages:
    - id: 1
      name: section_header_1
      label: -- Business Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: business_name
      label: Business Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: business_type
      label: Type of Business
      hint: null
      type: select_one
      options:
      - Retail
      - Food and Beverage
      - Professional Services
      - Manufacturing
      - Healthcare
      - Hospitality
      - Entertainment
      - Other
      required: true
    - id: 4
      name: business_registration
      label: Business Registration Number
      hint: EIN or Tax ID
      type: text
      options: []
      required: true
    - id: 5
      name: business_address
      label: Business Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: business_phone
      label: Business Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: business_email
      label: Business Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: section_header_2
      label: -- Owner Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: owner_name
      label: Owner Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: owner_title
      label: Owner Title
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: owner_email
      label: Owner Email
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: section_header_3
      label: -- Business Statistics --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: employees_count
      label: Number of Employees
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: annual_revenue
      label: Annual Revenue 2019
      hint: Before COVID-19
      type: number
      options: []
      required: true
    - id: 15
      name: current_revenue
      label: Current Annual Revenue
      hint: null
      type: number
      options: []
      required: true
    - id: 16
      name: section_header_4
      label: -- COVID-19 Impact and Grant Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: impact_description
      label: How COVID-19 Has Impacted Your Business
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: grant_amount_requested
      label: Grant Amount Requested
      hint: null
      type: number
      options: []
      required: true
    - id: 19
      name: grant_purpose
      label: Purpose of Grant Funds
      hint: Select all that apply
      type: select_multiple
      options:
      - Payroll
      - Rent or mortgage
      - Utilities
      - Equipment
      - Inventory
      - Debt payment
      - Other expenses
      required: true
    - id: 20
      name: grant_justification
      label: Justify Why Grant Is Needed
      hint: null
      type: text
      options: []
      required: true
    - id: 21
      name: section_header_5
      label: -- Supporting Documents --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: supporting_documents
      label: Supporting Documents Attached
      hint: Select all that apply
      type: select_multiple
      options:
      - Tax returns
      - Financial statements
      - Bank statements
      - Business license
      - Payroll records
      - Lease agreement
      - Other
      required: true
    - id: 23
      name: certification
      label: I certify the information above is true and accurate
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 24
      name: application_date
      label: Application Date
      hint: null
      type: date
      options: []
      required: true
    - id: 25
      name: acknowledgment
      label: I understand fraudulent applications may result in penalties
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
