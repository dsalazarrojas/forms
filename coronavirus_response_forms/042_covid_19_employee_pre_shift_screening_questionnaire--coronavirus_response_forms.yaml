inputSchema:
  type: object
  properties:
    title: COVID 19 Employee Pre Shift Screening Questionnaire
    pages:
    - id: 1
      name: screening_date
      label: Screening Date
      hint: Date of your shift
      type: date
      options: []
      required: true
    - id: 2
      name: shift_time
      label: Shift Time
      hint: What time is your shift?
      type: time
      options: []
      required: false
    - id: 3
      name: employee_name
      label: Employee Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 4
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: temperature
      label: Body Temperature
      hint: In Fahrenheit
      type: number
      options: []
      required: false
    - id: 7
      name: fever_present
      label: Do you have a fever?
      hint: 100.4 degrees F or higher
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Did not check
      required: true
    - id: 8
      name: cough
      label: Do you have a cough?
      hint: New or worsening cough
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: true
    - id: 9
      name: shortness_of_breath
      label: Do you have shortness of breath?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: true
    - id: 10
      name: loss_taste_smell
      label: Have you lost your sense of taste or smell?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: true
    - id: 11
      name: sore_throat
      label: Do you have a sore throat?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 12
      name: body_aches
      label: Do you have body aches?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 13
      name: fatigue
      label: Do you feel unusual fatigue?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 14
      name: headache
      label: Do you have a headache?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 15
      name: nausea_vomiting
      label: Do you have nausea or vomiting?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 16
      name: diarrhea
      label: Do you have diarrhea?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 17
      name: covid_exposure
      label: Have you been exposed to COVID-19?
      hint: In the past 14 days
      type: select_one
      options:
      - No exposure
      - Possible exposure
      - Confirmed exposure
      - Not sure
      - Prefer not to say
      required: true
    - id: 18
      name: covid_positive_test
      label: Have you tested positive for COVID-19?
      hint: In the past 10 days
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Prefer not to say
      required: true
    - id: 19
      name: quarantine_isolation
      label: Are you currently under quarantine or isolation?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: true
    - id: 20
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully vaccinated
      - Partially vaccinated
      - Not vaccinated
      - Prefer not to say
      required: false
    - id: 21
      name: screening_result
      label: Screening Result
      hint: null
      type: select_one
      options:
      - Cleared to work
      - Refer to manager
      - Not cleared - stay home
      - Pending review
      required: true
    - id: 22
      name: manager_notification
      label: Manager Notification Required
      hint: Does manager need to be informed?
      type: select_one
      options:
      - 'No'
      - Yes - symptoms present
      - Yes - positive test
      - Yes - exposure
      required: false
    - id: 23
      name: notes
      label: Additional Notes or Concerns
      hint: Any other health information to report
      type: text
      options: []
      required: false
