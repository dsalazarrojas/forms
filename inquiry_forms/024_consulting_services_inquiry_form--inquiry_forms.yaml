inputSchema:
  type: object
  properties:
    title: Consulting Services Inquiry Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: Primary email for contact
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: Name of your organization
      type: text
      options: []
      required: false
    - id: 6
      name: job_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: false
    - id: 7
      name: industry
      label: Industry
      hint: Your industry sector
      type: select_one
      options:
      - Technology
      - Finance
      - Healthcare
      - Manufacturing
      - Retail
      - Energy
      - Government
      - Education
      - Nonprofit
      - Other
      required: true
    - id: 8
      name: company_size
      label: Company Size
      hint: Number of employees
      type: select_one
      options:
      - 1-10
      - 11-50
      - 51-200
      - 201-500
      - 501-1000
      - 1000+
      required: false
    - id: 9
      name: service_interest
      label: Service of Interest
      hint: Which service are you interested in
      type: select_one
      options:
      - Strategy Consulting
      - Management Consulting
      - IT Consulting
      - Financial Advisory
      - HR Consulting
      - Operations Consulting
      - Change Management
      - Business Development
      - Multiple Services
      - Not Sure
      required: true
    - id: 10
      name: inquiry_type
      label: Type of Inquiry
      hint: What best describes your inquiry
      type: select_one
      options:
      - General Information
      - Request for Proposal
      - Consultation Request
      - Partnership Inquiry
      - Speaking Engagement
      - Other
      required: true
    - id: 11
      name: project_description
      label: Project Description
      hint: Describe your project or needs
      type: text
      options: []
      required: true
    - id: 12
      name: current_challenges
      label: Current Challenges
      hint: What challenges are you facing
      type: text
      options: []
      required: true
    - id: 13
      name: desired_outcomes
      label: Desired Outcomes
      hint: What results do you hope to achieve
      type: text
      options: []
      required: true
    - id: 14
      name: project_timeline
      label: Project Timeline
      hint: When do you need this completed
      type: select_one
      options:
      - Immediate
      - Within 1 Month
      - 1-3 Months
      - 3-6 Months
      - 6+ Months
      - Flexible
      required: true
    - id: 15
      name: budget_range
      label: Budget Range
      hint: Estimated budget
      type: select_one
      options:
      - Under $10,000
      - $10,000 - $25,000
      - $25,000 - $50,000
      - $50,000 - $100,000
      - $100,000 - $250,000
      - Over $250,000
      - To Be Determined
      required: false
    - id: 16
      name: decision_timeframe
      label: Decision Timeframe
      hint: When will you decide
      type: select_one
      options:
      - Within 1 Week
      - Within 2 Weeks
      - Within 1 Month
      - 1-3 Months
      - Not Sure
      required: false
    - id: 17
      name: decision_makers
      label: Decision Makers
      hint: Who will be involved in the decision
      type: text
      options: []
      required: false
    - id: 18
      name: previous_consulting
      label: Have You Used Consultants Before
      hint: Select if you have prior experience
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 19
      name: how_did_you_hear
      label: How Did You Hear About Us
      hint: Source of referral
      type: select_one
      options:
      - Website
      - Social Media
      - Referral
      - Conference
      - Advertisement
      - Search Engine
      - Other
      required: false
    - id: 20
      name: referral_source
      label: Referred By
      hint: Who referred you
      type: text
      options: []
      required: false
    - id: 21
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we contact you
      type: select_one
      options:
      - Email
      - Phone
      - Either
      required: true
    - id: 22
      name: best_time_to_contact
      label: Best Time to Contact
      hint: When are you available
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Anytime
      required: false
    - id: 23
      name: additional_comments
      label: Additional Comments
      hint: Any other information to share
      type: text
      options: []
      required: false
