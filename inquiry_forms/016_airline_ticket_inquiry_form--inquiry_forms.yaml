inputSchema:
  type: object
  properties:
    title: Airline Ticket Inquiry Form
    pages:
    - id: 1
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: section_trip
      label: -- Trip Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: departure_city
      label: Departure City/Airport
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: destination_city
      label: Destination City/Airport
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: travel_dates
      label: Preferred Departure Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: return_date
      label: Preferred Return Date (If round trip)
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: ticket_type
      label: Ticket Type
      hint: null
      type: select_one
      options:
      - One Way
      - Round Trip
      - Multi-City
      required: true
    - id: 10
      name: cabin_class_preference
      label: Preferred Cabin Class
      hint: null
      type: select_one
      options:
      - Economy
      - Premium Economy
      - Business
      - First Class
      required: true
    - id: 11
      name: number_of_adults
      label: Number of Adults
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: number_of_children
      label: Number of Children (2-11)
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: budget_range
      label: Estimated Budget
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: flexible_dates
      label: Are your travel dates flexible?
      hint: null
      type: select_one
      options:
      - Yes (+/- 3 days)
      - 'False'
      required: true
    - id: 15
      name: additional_comments
      label: Any other special requests or airlines preferred?
      hint: null
      type: text
      options: []
      required: false
