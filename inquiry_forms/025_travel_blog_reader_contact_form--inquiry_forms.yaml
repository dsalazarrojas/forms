inputSchema:
  type: object
  properties:
    title: Travel Blog Reader Contact Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: question_type
      label: Type of inquiry
      hint: Select one
      type: select_one
      options:
      - Question
      - Feedback
      - Collaboration
      required: true
    - id: 3
      name: user_email
      label: Email
      hint: Enter a valid email address
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: message
      label: Message
      hint: Write a message
      type: note
      options: []
      required: true
    - id: 6
      name: user_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: question
      label: Question
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: user_phone_type
      label: Type of phone
      hint: null
      type: select_one
      options:
      - Mobile
      - Landline
      required: false
