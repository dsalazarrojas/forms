inputSchema:
  type: object
  properties:
    title: Flight Details Inquiry Form
    pages:
    - id: 1
      name: flight_type
      label: What type of flight is this?
      hint: null
      type: select_one
      options:
      - Flight
      - Non-flight (e.g. train, bus)
      required: true
    - id: 2
      name: travel_dates
      label: When were you planning to travel?
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: number_of_travelers
      label: How many travelers?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: passenger_details
      label: Passenger Names and IDs
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: special_requests
      label: Are there any special requests?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: flight_numbers
      label: Which flight numbers do you have?
      hint: null
      type: select_multiple
      options:
      - Flight Number 1
      - Alternate Flight Number 1
      required: true
    - id: 7
      name: seats_needed
      label: How many seats do you need?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: travel_class
      label: What is the travel class?
      hint: null
      type: select_one
      options:
      - Economy
      - Business
      - First Class
      required: true
    - id: 9
      name: boarding_assistance
      label: Do you need assistance with boarding?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 10
      name: special_requirements
      label: Do you have any special requirements?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: flight_details
      label: Add any flight details
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: confirmation
      label: Confirm
      hint: null
      type: radio
      options:
      - 'True'
      - 'False'
      required: true
