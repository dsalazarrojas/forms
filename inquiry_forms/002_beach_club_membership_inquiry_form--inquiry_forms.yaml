inputSchema:
  type: object
  properties:
    title: Beach Club Membership Inquiry Form
    pages:
    - id: 1
      name: section_personal_info
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: mailing_address
      label: Mailing Address
      hint: Street, City, State, ZIP
      type: text
      options: []
      required: false
    - id: 6
      name: section_membership_preferences
      label: -- Membership Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: membership_type_interest
      label: Membership Type Interest
      hint: Select the membership level you are interested in
      type: select_one
      options:
      - Individual Membership
      - Family Membership
      - Junior Membership (Under 30)
      - Seasonal Membership
      - Corporate Membership
      required: true
    - id: 8
      name: family_members_count
      label: Number of Family Members
      hint: Including yourself, if applying for family membership
      type: number
      options: []
      required: false
    - id: 9
      name: preferred_contact_method
      label: Preferred Method of Contact
      hint: null
      type: select_one
      options:
      - Email
      - Phone Call
      - Text Message
      required: false
    - id: 10
      name: how_did_you_hear
      label: How did you hear about us?
      hint: null
      type: select_one
      options:
      - Word of Mouth
      - Social Media
      - Local Advertisement
      - Referral from Member
      - Other
      required: false
    - id: 11
      name: interest_areas
      label: Areas of Interest
      hint: Select all that apply
      type: select_multiple
      options:
      - Private Beach Access
      - Swimming Pool
      - Fitness Center
      - Dining and Social Events
      - Tennis Courts
      - Youth Programs
      required: false
    - id: 12
      name: additional_questions
      label: Questions or Comments
      hint: null
      type: text
      options: []
      required: false
