      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: course
      label: Which course are you interested in?
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      required: true
    - id: 6
      name: language
      label: What language are you fluent in?
      hint: null
      type: select_multiple
      options:
      - English
      - Spanish
      required: false
    - id: 7
      name: message
      label: Message
      hint: null
      type: note
      options: []
