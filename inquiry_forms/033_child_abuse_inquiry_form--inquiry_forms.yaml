inputSchema:
  type: object
  properties:
    title: Child Abuse Inquiry Form
    pages:
    - id: 1
      name: inquiry_intro
      label: -- Child Abuse Inquiry Form --
      hint: Document concerns about child safety and welfare
      type: note
      options: []
      required: false
    - id: 2
      name: report_date
      label: Report date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: report_time
      label: Report time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: reporter_name
      label: Reporter name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: reporter_relationship
      label: Your relationship to the child
      hint: null
      type: select_one
      options:
      - Parent or guardian
      - Teacher
      - School staff
      - Neighbor
      - Family member
      - Healthcare provider
      - Social worker
      - Other mandatory reporter
      - Concerned citizen
      required: true
    - id: 6
      name: reporter_contact_info
      label: Contact information
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: child_first_name
      label: Child's first name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: child_last_name
      label: Child's last name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: child_date_of_birth
      label: Child's date of birth
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: child_age
      label: Child's age
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: child_gender
      label: Child's gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: true
    - id: 12
      name: child_address
      label: Child's address
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: zip_code
      label: Zip code
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: concern_type
      label: Type of concern
      hint: Select all that apply
      type: select_multiple
      options:
      - Physical abuse
      - Emotional abuse
      - Sexual abuse
      - Neglect
      - Exposure to domestic violence
      - Substance abuse exposure
      - Other
      required: true
    - id: 17
      name: observation_details
      label: Detailed description of observations
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: injury_description
      label: Description of any injuries or concerns
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: behavioral_changes
      label: Any behavioral or emotional changes noticed
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: child_statement
      label: Statement made by the child (if any)
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: suspected_perpetrator
      label: Information about suspected perpetrator (if known)
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: previous_concerns
      label: Previous concerns or incidents reported
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: true
    - id: 23
      name: immediate_danger
      label: Is the child in immediate danger?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Possibly
      required: true
    - id: 24
      name: safety_plan
      label: Safety plan in place
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - In progress
      required: true
    - id: 25
      name: authorities_contacted
      label: Have authorities been contacted?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Pending
      required: true
    - id: 26
      name: additional_information
      label: Additional information or context
      hint: null
      type: text
      options: []
      required: false
