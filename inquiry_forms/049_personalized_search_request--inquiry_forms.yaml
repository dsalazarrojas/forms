inputSchema:
  type: object
  properties:
    title: Personalized Search Request
    pages:
    - id: 1
      name: search_term
      label: search_term
      hint: Enter search term
      type: text
      options: []
      required: true
    - id: 2
      name: search_type
      label: search_type
      hint: null
      type: select_multiple
      options:
      - Keyword
      - Category
      - Author
      - Date
      - File
      required: false
    - id: 3
      name: priority
      label: priority
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 4
      name: search_date
      label: search_date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: search_location
      label: search_location
      hint: Enter search location
      type: text
      options: []
      required: false
    - id: 6
      name: search_time
      label: search_time
      hint: Enter search time
      type: time
      options: []
      required: false
    - id: 7
      name: additional_info
      label: additional_info
      hint: Any additional information?
      type: text
      options: []
      required: true
