inputSchema:
  type: object
  properties:
    title: Commercial Insurance Inquiry Form
    pages:
    - id: 1
      name: business_name
      label: Business Name
      hint: Legal business name
      type: text
      options: []
      required: true
    - id: 2
      name: contact_name
      label: Contact Name
      hint: Primary contact person
      type: text
      options: []
      required: true
    - id: 3
      name: contact_title
      label: Contact Title
      hint: Position in company
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: Business email
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: section_header_business_details
      label: -- Business Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: business_type
      label: Business Type
      hint: Industry or sector
      type: select_one
      options:
      - Retail
      - Office
      - Manufacturing
      - Restaurant
      - Healthcare
      - Construction
      - Technology
      - Professional Services
      - Other
      required: true
    - id: 8
      name: years_in_business
      label: Years in Business
      hint: How long operating
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - 10+ years
      required: true
    - id: 9
      name: number_of_employees
      label: Number of Employees
      hint: Total employees
      type: number
      options: []
      required: true
    - id: 10
      name: annual_revenue
      label: Annual Revenue
      hint: Revenue range
      type: select_one
      options:
      - Under $500K
      - $500K-$1M
      - $1M-$5M
      - $5M-$10M
      - $10M-$50M
      - $50M+
      required: true
    - id: 11
      name: section_header_property_info
      label: -- Property Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: property_owned
      label: Do You Own Business Property
      hint: Property ownership
      type: select_one
      options:
      - Yes Own Building
      - Yes Own Multiple Buildings
      - Rent or Lease
      - Work From Home
      required: true
    - id: 13
      name: property_value
      label: Property Value
      hint: Estimated value
      type: number
      options: []
      required: false
    - id: 14
      name: business_contents_value
      label: Business Contents Value
      hint: Equipment and inventory value
      type: number
      options: []
      required: false
    - id: 15
      name: section_header_coverage_interest
      label: -- Coverage Interest --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: coverage_types
      label: Coverage Types Interested In
      hint: Select all that apply
      type: select_multiple
      options:
      - General Liability
      - Property Insurance
      - Business Interruption
      - Workers Compensation
      - Professional Liability
      - Cyber Liability
      - Commercial Auto
      - Equipment Breakdown
      - Other
      required: true
    - id: 17
      name: current_insurance
      label: Do You Have Current Insurance
      hint: Current coverage status
      type: select_one
      options:
      - true
      - false
      - Expired
      required: true
    - id: 18
      name: current_carrier
      label: Current Insurance Carrier
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 19
      name: policy_renewal_date
      label: Policy Renewal Date
      hint: When does current policy renew
      type: date
      options: []
      required: false
    - id: 20
      name: section_header_claims_history
      label: -- Claims History --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: previous_claims
      label: Previous Insurance Claims
      hint: Any claims in past 5 years
      type: select_one
      options:
      - None
      - 1 claim
      - 2-3 claims
      - 4+ claims
      required: true
    - id: 22
      name: claims_details
      label: Claims Details
      hint: Describe if applicable
      type: text
      options: []
      required: false
    - id: 23
      name: section_header_timeline
      label: -- Timeline --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: coverage_start_date
      label: Desired Coverage Start Date
      hint: When do you need coverage
      type: date
      options: []
      required: true
    - id: 25
      name: quote_timeline
      label: Quote Timeline
      hint: How soon do you need quote
      type: select_one
      options:
      - Immediately
      - Within 1 week
      - Within 2 weeks
      - Within 1 month
      - Just Researching
      required: true
    - id: 26
      name: section_header_contact_preference
      label: -- Contact Preference --
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we contact you
      type: select_one
      options:
      - Email
      - Phone
      - Text Message
      - Mail
      required: true
    - id: 28
      name: best_time_to_contact
      label: Best Time to Contact
      hint: Preferred contact time
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Any Time
      required: true
    - id: 29
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
