inputSchema:
  type: object
  properties:
    title: Return Eligibility Inquiry Form
    pages:
    - id: 1
      name: return_eligibility_inquiry_form
      label: Order Details
      hint: Please provide the order number and date of purchase.
      type: text
      options: []
      required: false
    - id: 2
      name: return_eligibility_inquiry_form_orders
      label: Order Details
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Order 1''}'
      - '{''id'': 2, ''name'': ''Order 2''}'
      required: false
    - id: 3
      name: return_eligibility_inquiry_form_order_id
      label: Order ID
      hint: Enter the order ID
      type: number
      options: []
      required: false
    - id: 4
      name: return_eligibility_inquiry_form_date
      label: Date of Purchase
      hint: Enter the date of purchase
      type: date
      options: []
      required: false
    - id: 5
      name: return_eligibility_inquiry_form_date_of_purchase
      label: Date of Purchase
      hint: Enter the date of purchase
      type: date
      options: []
      required: false
    - id: 6
      name: return_eligibility_inquiry_form_reason
      label: Return Reason
      hint: Please select the return reason
      type: select_multiple
      options:
      - '{''id'': 1, ''name'': ''Item was not as described''}'
      - '{''id'': 2, ''name'': ''Item was damaged''}'
      - '{''id'': 3, ''name'': ''I changed my mind''}'
      required: false
    - id: 7
      name: return_eligibility_inquiry_form_notes
      label: Notes
      hint: Additional notes about the return request
      type: note
      options: []
      required: false
    - id: 8
      name: return_eligibility_inquiry_form_status
      label: Eligibility Status
      hint: Select a status for the return request
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Eligible''}'
      - '{''id'': 2, ''name'': ''Not Eligible''}'
      required: false
    - id: 9
      name: return_eligibility_inquiry_form_comments
      label: Comment
      hint: null
      type: note
      options: []
      required: false
