inputSchema:
  type: object
  properties:
    title: Math Lesson Inquiry Form
    pages:
    - id: 1
      name: subject
      label: Subject
      hint: null
      type: select_one
      options:
      - Math
      - Science
      - Language Arts
      - Social Studies
      required: true
    - id: 2
      name: lesson_plan
      label: Lesson Plan
      hint: null
      type: select_multiple
      options:
      - Algebra I
      - Geometry
      - Pre-Calculus
      - Calculus
      - Trigonometry
      - Statistics
      - Probability
      - Linear Algebra
      required: true
    - id: 3
      name: format
      label: Format
      hint: null
      type: select_one
      options:
      - In-person
      - Online
      - Phone
      - Video
      - Other
      required: true
    - id: 4
      name: preferred_time
      label: Preferred Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: available_times
      label: Available Time
      hint: null
      type: select_multiple
      options:
      - 7:00 AM - 8:00 AM
      - 8:00 AM - 9:00 AM
      - 9:00 AM - 10:00 AM
      - 10:00 AM - 11:00 AM
      - 11:00 AM - 12:00 PM
      - 12:00 PM - 1:00 PM
      - 1:00 PM - 2:00 PM
      - prophets not supported
      required: true
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: grade_level
      label: Grade Level
      hint: null
      type: select_one
      options:
      - K-5
      - 6-8
      - 9-12
      required: true
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: student_contact
      label: Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: tutor_name
      label: Tutor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: tutor_email
      label: Tutor Email
      hint: null
      type: email
      options: []
      required: false
    - id: 15
      name: tutor_phone
      label: Tutor Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: tutor_notes
      label: Tutor Notes
      hint: null
      type: note
      options: []
      required: false
