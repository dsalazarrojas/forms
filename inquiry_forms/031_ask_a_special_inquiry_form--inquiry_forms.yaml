inputSchema:
  type: object
  properties:
    title: Ask A Specialist Inquiry Form
    pages:
    - id: 1
      name: user_name_spec
      label: Your Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: user_email_spec
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: specialist_category_spec
      label: Specialist Category
      hint: Select the expert domain you need
      type: select_one
      options:
      - Medical and Healthcare
      - Legal and Regulatory
      - Technical and IT
      - Financial and Investment
      - Career and HR
      required: true
    - id: 4
      name: specific_area_spec
      label: Specific Area of Interest
      hint: e.g. Tax law, Cloud migration, Nutrition
      type: text
      options: []
      required: false
    - id: 5
      name: inquiry_title_spec
      label: Inquiry Title
      hint: A brief summary of your question
      type: text
      options: []
      required: true
    - id: 6
      name: detailed_inquiry_spec
      label: Detailed Inquiry
      hint: Please provide as much context as possible
      type: text
      options: []
      required: true
    - id: 7
      name: urgency_level_spec
      label: Is this an urgent inquiry
      hint: null
      type: select_one
      options:
      - Yes - Requires response within 24 hours
      - No - Standard response time
      required: true
    - id: 8
      name: response_format_spec
      label: Preferred Response Format
      hint: null
      type: select_one
      options:
      - Email Response
      - Scheduled Video Call
      - Phone Consultation
      required: true
    - id: 9
      name: contact_time_spec
      label: Best Time for Contact
      hint: Include your time zone
      type: text
      options: []
      required: false
    - id: 10
      name: previous_consultation_spec
      label: Have you consulted with us before
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
