inputSchema:
  type: object
  properties:
    title: Walt Disney World Vacation Inquiry Form
    pages:
    - id: 1
      name: vacation_info
      label: Walt Disney World Vacation Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: guest_info
      label: Guest Information
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: travel_plans
      label: Travel Plans
      hint: null
      type: select_multiple
      options:
      - '{''value'': ''1-7''}'
      - '{''value'': ''7-14''}'
      - '{''value'': ''14+''}'
      required: false
    - id: 4
      name: special_diet
      label: Special Dietary Needs
      hint: null
      type: select_one
      options:
      - '{''value'': False}'
      - '{''value'': True}'
      required: false
    - id: 5
      name: accommodation_preferences
      label: Accommodation Preferences
      hint: null
      type: select_one
      options:
      - '{''value'': ''Hotel''}'
      - '{''value'': ''Resort''}'
      - '{''value'': ''Vacation Home''}'
      required: false
    - id: 6
      name: arrival_date
      label: Arrival Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: Enter guest email
      type: email
      options: []
      required: false
    - id: 8
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
