inputSchema:
  type: object
  properties:
    title: Accommodation Management Inquiry Form
    pages:
    - id: 1
      name: section_inquirer_info
      label: -- Inquirer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Text message
      required: true
    - id: 6
      name: section_inquiry_details
      label: -- Inquiry Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: inquiry_type
      label: Type of Inquiry
      hint: null
      type: select_one
      options:
      - Availability check
      - Pricing and rates
      - Amenities and facilities
      - Lease terms
      - Pet policy
      - Maintenance request
      - General question
      required: true
    - id: 8
      name: property_of_interest
      label: Property of Interest
      hint: Name or address of the property you are inquiring about
      type: text
      options: []
      required: true
    - id: 9
      name: accommodation_type
      label: Accommodation Type Desired
      hint: null
      type: select_one
      options:
      - Studio
      - One-bedroom
      - Two-bedroom
      - Three-bedroom
      - House or villa
      - Shared accommodation
      - Other
      required: true
    - id: 10
      name: desired_move_in_date
      label: Desired Move-In or Check-In Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: stay_duration
      label: Expected Duration of Stay
      hint: null
      type: select_one
      options:
      - Less than 1 month
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - More than 12 months
      - Not sure yet
      required: true
    - id: 12
      name: number_of_occupants
      label: Number of Occupants
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: monthly_budget
      label: Monthly Budget Range
      hint: null
      type: select_one
      options:
      - Under $500
      - $500 - $1000
      - $1000 - $1500
      - $1500 - $2000
      - $2000 - $3000
      - Over $3000
      required: false
    - id: 14
      name: specific_requirements
      label: Specific Requirements or Preferences
      hint: e.g., parking, laundry, furnished, pet-friendly
      type: text
      options: []
      required: false
    - id: 15
      name: inquiry_message
      label: Your Inquiry or Message
      hint: Provide any additional details about your inquiry
      type: text
      options: []
      required: true
