inputSchema:
  type: object
  properties:
    title: Structured Inquiry Form
    pages:
    - id: 1
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      - Urgent
      required: false
    - id: 6
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Support
      - Sales
      - Marketing
      - Other
      required: false
    - id: 7
      name: due_date
      label: Due Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: status
      label: Status
      hint: null
      type: select_multiple
      options:
      - In Progress
      - Resolved
      - Reopened
      - Cancelled
      required: false
