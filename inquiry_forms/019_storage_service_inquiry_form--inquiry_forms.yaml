inputSchema:
  type: object
  properties:
    title: Storage Service Inquiry Form
    pages:
    - id: 1
      name: storage_service_inquiry
      label: Storage Service Inquiry
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_method
      label: Contact Method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Chat
      required: true
    - id: 3
      name: storage_location
      label: Storage Location
      hint: null
      type: select_multiple
      options:
      - Downtown
      - Uptown
      - Eastside
      required: true
    - id: 4
      name: inquiry_description
      label: Inquiry Description
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: storage_options
      label: Storage Options
      hint: null
      type: text
      options: []
      required: false
