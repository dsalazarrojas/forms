inputSchema:
  type: object
  properties:
    title: Dining Table Product Inquiry Form
    pages:
    - id: 1
      name: dining_table_product
      label: Dining Table Product
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_info
      label: Customer Info
      hint: null
      type: select_multiple
      options:
      - First Name
      - Last Name
      - Email
      - Phone
      required: false
    - id: 3
      name: product_details
      label: Product Details
      hint: null
      type: select_one
      options:
      - Table Size
      - Material
      - Color
      - Brand
      required: false
    - id: 4
      name: custom_requests
      label: Custom Requests
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: delivery_lead_time
      label: Delivery Lead Time
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: shipping_address
      label: Shipping Address
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: sales_channel
      label: Sales Channel
      hint: null
      type: select_multiple
      options:
      - Retailer
      - Showroom
      - Custom Maker
      required: false
    - id: 8
      name: follow_up_info
      label: Follow Up Info
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: follow_up_requests
      label: Follow Up Requests
      hint: null
      type: text
      options: []
      required: false
