inputSchema:
  type: object
  properties:
    title: Prospective Student Inquiry Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: inquiry_type
      label: Inquiry Type
      hint: null
      type: select_one
      options:
      - Admission
      - Program
      - Course
      - General
      required: false
    - id: 6
      name: program_of_interest
      label: Program of Interest
      hint: null
      type: select_multiple
      options:
      - Master
      - Bachelor
      - Certificate
      - Diploma
      required: false
    - id: 7
      name: preferred_date
      label: Preferred Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time_of_day
      label: Time of Day
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
