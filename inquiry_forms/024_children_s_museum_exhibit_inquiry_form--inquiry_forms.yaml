inputSchema:
  type: object
  properties:
    title: Children's Museum Exhibit Inquiry Form
    pages:
    - id: 1
      name: contact_information
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Name of exhibit proposer
      type: text
      options: []
      required: true
    - id: 3
      name: organization_name
      label: Organization or Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: position_title
      label: Your Position
      hint: Title or role
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: exhibit_proposal
      label: -- Exhibit Proposal --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: exhibit_title
      label: Proposed Exhibit Title
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: exhibit_description
      label: Detailed Exhibit Description
      hint: What is the exhibit about and how does it work
      type: text
      options: []
      required: true
    - id: 10
      name: learning_objectives
      label: Learning Objectives
      hint: What will children learn from this exhibit
      type: text
      options: []
      required: true
    - id: 11
      name: target_age_group
      label: Target Age Group
      hint: null
      type: select_multiple
      options:
      - Ages 2-4
      - Ages 5-7
      - Ages 8-10
      - Ages 11-13
      - Ages 14-18
      - All ages
      required: true
    - id: 12
      name: exhibit_details
      label: -- Exhibit Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: exhibit_duration
      label: Proposed Duration
      hint: How long should the exhibit run
      type: select_one
      options:
      - Permanent
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - Traveling exhibit
      required: true
    - id: 14
      name: space_requirements
      label: Space Requirements
      hint: Estimated square footage
      type: number
      options: []
      required: true
    - id: 15
      name: special_requirements
      label: Special Equipment or Requirements
      hint: Electricity, water, climate control, etc.
      type: text
      options: []
      required: false
    - id: 16
      name: interactive_elements
      label: Interactive or Hands-on Elements
      hint: How will children engage with the exhibit
      type: text
      options: []
      required: true
    - id: 17
      name: accessibility_features
      label: Accessibility Features
      hint: ADA compliance, accommodations, etc.
      type: text
      options: []
      required: false
    - id: 18
      name: educational_value
      label: -- Educational Value --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: curriculum_alignment
      label: Alignment with educational standards
      hint: How does this exhibit connect to learning
      type: text
      options: []
      required: false
    - id: 20
      name: teacher_resources
      label: Will you provide teacher resources or guides
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 21
      name: logistics_section
      label: -- Logistics and Support --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: setup_assistance
      label: Will you provide setup and installation
      hint: null
      type: select_one
      options:
      - Yes, full setup
      - Yes, partial support
      - No, museum will handle
      required: true
    - id: 23
      name: maintenance_support
      label: What maintenance support do you provide
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: budget_section
      label: -- Budget and Costs --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: estimated_cost
      label: Estimated Total Cost
      hint: null
      type: number
      options: []
      required: false
