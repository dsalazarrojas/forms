      required: false
    - id: 7
      name: app_version
      label: App version
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: operating_system
      label: Operating system
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: device_info
      label: Device information
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: form_submission
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: submitted_by
      label: Submitted by
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: goals
      label: What are your goals with our app?
      hint: null
      type: text
      options: []
      required: false
