inputSchema:
  type: object
  properties:
    title: Luxury Home Inquiry Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: home_type
      label: Home Type
      hint: What kind of property are you looking for?
      type: select_one
      options:
      - Luxury Home
      - Townhouse
      - Condo
      - Apartment
      - Land
      required: false
    - id: 3
      name: location
      label: Location
      hint: null
      type: select_multiple
      options:
      - Downtown
      - Uptown
      - Downtown South
      - Uptown West
      required: false
    - id: 4
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: date_of_visit
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: real_estate_agent
      label: Real Estate Agent
      hint: null
      type: select_one
      options:
      - John Doe
      - Jane Doe
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: form_submitted_by
      label: Form Submitted By
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: form_submitted_on
      label: Form Submitted On
      hint: null
      type: date
      options: []
      required: false
