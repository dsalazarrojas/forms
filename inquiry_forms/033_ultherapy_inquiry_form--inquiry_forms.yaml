inputSchema:
  type: object
  properties:
    title: Ultherapy Inquiry Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: inquiry_type
      label: Inquiry Type
      hint: null
      type: select_one
      options:
      - Ultherapy Treatment
      - Other (please specify)
      required: true
    - id: 6
      name: inquiry_details
      label: Inquiry Details
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: other_inquiry_type
      label: Other (please specify)
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - Text Message
      required: true
    - id: 9
      name: preferred_contact_time
      label: Preferred Contact Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: clinic_location
      label: Clinic Location
      hint: null
      type: select_multiple
      options:
      - New York
      - Los Angeles
      - Chicago
      - Houston
      - Seattle
      required: false
    - id: 11
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
