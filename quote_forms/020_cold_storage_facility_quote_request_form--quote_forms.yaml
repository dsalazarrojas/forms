inputSchema:
  type: object
  properties:
    title: Cold Storage Facility Quote Request Form
    pages:
    - id: 1
      name: header
      label: -- Quote Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: company_name
      label: Company name
      hint: Requesting organization
      type: text
      options: []
      required: true
    - id: 3
      name: contact_name
      label: Contact name
      hint: Primary contact for the quote
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact email
      hint: Email address
      type: email
      options: []
      required: true
    - id: 5
      name: storage_capacity_needed
      label: Storage capacity needed in cubic meters
      hint: Numeric estimate
      type: number
      options: []
      required: true
    - id: 6
      name: temperature_requirements
      label: Temperature requirements
      hint: Range or setpoint
      type: text
      options: []
      required: true
    - id: 7
      name: required_services
      label: Required services
      hint: Select services needed
      type: select_multiple
      options:
      - Short term storage
      - Long term storage
      - Inventory management
      - Distribution
      required: false
    - id: 8
      name: preferred_start_date
      label: Preferred start date
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 9
      name: budget_estimate
      label: Budget estimate
      hint: Estimated budget for storage
      type: number
      options: []
      required: false
    - id: 10
      name: additional_information
      label: Additional information
      hint: Any other project details
      type: text
      options: []
      required: false
