inputSchema:
  type: object
  properties:
    title: Lawn Topdressing Quote Request
    pages:
    - id: 1
      name: user_name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email_address
      label: Email address
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone_number
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: job_type
      label: Job Type
      hint: null
      type: select_multiple
      options:
      - Grass
      - Landscaping
      required: false
    - id: 5
      name: job_area
      label: Job Area
      hint: null
      type: select_multiple
      options:
      - Local
      - Regional
      required: false
    - id: 6
      name: schedule_type
      label: Schedule
      hint: null
      type: select_one
      options:
      - One-time
      - Ongoing
      - Recurring
      required: false
    - id: 7
      name: estimated_job_size
      label: Estimated Job Size
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: finish_date
      label: Finish Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: job_duration
      label: Job Duration
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: address
      label: Address
      hint: null
      type: select_one
      options:
      - Single
      - Duplex
      - Multi
      - Single-Family
      - Condo
      - Townhouse
      - Apartment
      - Office Building
      - Farm
      required: false
    - id: 12
      name: follow_up_method
      label: Follow-up Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - In-person
      required: false
    - id: 13
      name: follow_up_schedule
      label: Follow-up Schedule
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 14
      name: estimated_job_cost
      label: Estimated Job Cost
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: payment_terms
      label: Payment Terms
      hint: null
      type: select_multiple
      options:
      - Cash
      - Check
      - Credit Card
      - Online Banking
      required: false
