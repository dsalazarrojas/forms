inputSchema:
  type: object
  properties:
    title: Administrative Assistant Quote Form
    pages:
    - id: 1
      name: client_information
      label: Client information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client name
      hint: Company or individual requesting quote
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact email
      hint: For quote delivery
      type: email
      options: []
      required: true
    - id: 4
      name: services_required
      label: Services required
      hint: Describe administrative services requested
      type: text
      options: []
      required: true
    - id: 5
      name: estimated_hours
      label: Estimated hours per month
      hint: Approximate monthly hours needed
      type: number
      options: []
      required: true
    - id: 6
      name: hourly_rate
      label: Hourly rate USD
      hint: Proposed billing rate
      type: number
      options: []
      required: true
    - id: 7
      name: monthly_estimate
      label: Monthly estimate USD
      hint: Calculated estimate for budgeting
      type: number
      options: []
      required: false
    - id: 8
      name: preferred_start_date
      label: Preferred start date
      hint: When service should begin
      type: date
      options: []
      required: false
    - id: 9
      name: special_terms
      label: Special terms or conditions
      hint: Any contract or SLA items
      type: text
      options: []
      required: false
    - id: 10
      name: approval_signature
      label: Approval signature name
      hint: Typed name to approve quote
      type: text
      options: []
      required: true
