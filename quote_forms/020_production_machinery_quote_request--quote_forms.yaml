inputSchema:
  type: object
  properties:
    title: Production Machinery Quote Request
    pages:
    - id: 1
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: quote_request_details
      label: Quote Request Details
      hint: Enter a brief description of the quote request
      type: text
      options: []
      required: false
    - id: 3
      name: request_date
      label: Request Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: requested_by
      label: Requested By
      hint: null
      type: select_one
      options:
      - John Doe
      - Jane Doe
      - Jim Doe
      required: false
    - id: 5
      name: contact_person
      label: Contact Person
      hint: null
      type: select_multiple
      options:
      - John
      - Jane
      - Jim
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: machinery_type
      label: Machinery Type
      hint: null
      type: select_one
      options:
      - CNC
      - Lathe
      - Milling Machine
      required: false
    - id: 9
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: price_range
      label: Price Range
      hint: null
      type: select_multiple
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 11
      name: additional_info
      label: Additional Info
      hint: null
      type: text
      options: []
      required: false
