      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: num_adults
      label: num_adults
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: num_children
      label: num_children
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: num_rooms
      label: num_rooms
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: num_travelers
      label: num_travelers
      hint: null
      type: number
      options: []
      required: false
