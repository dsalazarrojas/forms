inputSchema:
  type: object
  properties:
    title: Aerial Photography Quote Form
    pages:
    - id: 1
      name: client_info_header
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Name / Company
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: project_details_header
      label: -- Project Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: project_type
      label: Project Type
      hint: What are we shooting?
      type: select_one
      options:
      - Real Estate (Residential)
      - Commercial Property
      - Event Coverage
      - Construction Progress
      - Landscape / Scenic
      - Inspection / Survey
      required: true
    - id: 7
      name: location_address
      label: Shoot Location Address
      hint: Please provide full address or coordinates.
      type: text
      options: []
      required: true
    - id: 8
      name: requested_date
      label: Requested Shoot Date
      hint: Weather permitting.
      type: date
      options: []
      required: true
    - id: 9
      name: deliverables
      label: Required Deliverables
      hint: What files do you need?
      type: select_multiple
      options:
      - High Res Photos (JPEG/RAW)
      - 4K Video Footage
      - Edited Video Highlight Reel
      - 360 Panorama
      - Orthomosaic Map
      required: true
    - id: 10
      name: airspace_check
      label: Airspace Awareness
      hint: Is the location near an airport or restricted zone?
      type: select_one
      options:
      - No / Unknown
      - Yes, near airport
      - Yes, in restricted zone
      required: false
    - id: 11
      name: usage_rights
      label: Intended Usage
      hint: How will the images be used?
      type: select_one
      options:
      - Personal Use
      - Web / Social Media
      - Print Advertising
      - Broadcast TV
      required: true
    - id: 12
      name: budget_range
      label: Budget Range
      hint: Optional.
      type: select_one
      options:
      - Under $300
      - $300 - $600
      - $600 - $1,000
      - $1,000+
      required: false
    - id: 13
      name: additional_details
      label: Additional Details
      hint: Specific shots list or creative direction.
      type: text
      options: []
      required: false
