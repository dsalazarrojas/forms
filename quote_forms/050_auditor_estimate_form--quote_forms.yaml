inputSchema:
  type: object
  properties:
    title: Auditor Estimate Form
    pages:
    - id: 1
      name: client_full_name
      label: Client Full Name
      hint: Name of person requesting estimate
      type: text
      options: []
      required: true
    - id: 2
      name: client_email
      label: Email Address
      hint: Contact email address
      type: email
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Name of company or organization
      type: text
      options: []
      required: true
    - id: 5
      name: company_address
      label: Company Address
      hint: Full company address
      type: text
      options: []
      required: true
    - id: 6
      name: request_date
      label: Request Date
      hint: Date of this estimate request
      type: date
      options: []
      required: true
    - id: 7
      name: company_type
      label: Company Type
      hint: What type of entity is your company?
      type: select_one
      options:
      - Corporation
      - LLC
      - Partnership
      - Sole Proprietorship
      - Non-Profit
      - Government Entity
      - Other
      required: true
    - id: 8
      name: industry
      label: Industry
      hint: What industry is your company in?
      type: select_one
      options:
      - Financial Services
      - Healthcare
      - Manufacturing
      - Technology
      - Retail
      - Construction
      - Professional Services
      - Non-Profit
      - Government
      - Other
      required: true
    - id: 9
      name: annual_revenue
      label: Annual Revenue
      hint: Approximate annual revenue
      type: select_one
      options:
      - Under $1 million
      - $1-5 million
      - $5-10 million
      - $10-50 million
      - $50-100 million
      - Over $100 million
      required: true
    - id: 10
      name: number_of_employees
      label: Number of Employees
      hint: Approximate number of employees
      type: select_one
      options:
      - 1-10
      - 11-50
      - 51-100
      - 101-250
      - 251-500
      - Over 500
      required: true
    - id: 11
      name: audit_type_needed
      label: Audit Type Needed
      hint: What type of audit do you need?
      type: select_one
      options:
      - Financial Statement Audit
      - Review
      - Compilation
      - Internal Audit
      - Compliance Audit
      - IT Audit
      - Forensic Audit
      - Other
      required: true
    - id: 12
      name: audit_purpose
      label: Audit Purpose
      hint: What is the purpose of the audit?
      type: select_one
      options:
      - Regulatory requirement
      - Lender requirement
      - Investor requirement
      - Board requirement
      - Voluntary
      - Other
      required: true
    - id: 13
      name: fiscal_year_end
      label: Fiscal Year End
      hint: When is your fiscal year end?
      type: date
      options: []
      required: true
    - id: 14
      name: desired_completion
      label: Desired Completion
      hint: When do you need the audit completed?
      type: date
      options: []
      required: true
    - id: 15
      name: prior_auditor
      label: Prior Auditor
      hint: Did you have a prior auditor?
      type: select_one
      options:
      - Yes, same firm
      - Yes, different firm
      - No, first audit
      required: true
    - id: 16
      name: prior_auditor_name
      label: Prior Auditor Name
      hint: Name of prior audit firm
      type: text
      options: []
      required: false
    - id: 17
      name: reason_for_change
      label: Reason for Change
      hint: Why are you changing auditors?
      type: text
      options: []
      required: false
    - id: 18
      name: special_circumstances
      label: Special Circumstances
      hint: Any special circumstances to note?
      type: text
      options: []
      required: false
    - id: 19
      name: additional_services
      label: Additional Services
      hint: What additional services are needed?
      type: select_multiple
      options:
      - Tax preparation
      - Bookkeeping
      - Consulting
      - Internal controls review
      - Risk assessment
      - None
      required: true
    - id: 20
      name: budget_range
      label: Budget Range
      hint: Expected budget range for audit
      type: select_one
      options:
      - Under $10,000
      - $10,000-$25,000
      - $25,000-$50,000
      - $50,000-$100,000
      - Over $100,000
      required: false
    - id: 21
      name: how_did_you_hear
      label: How Did You Hear About Us
      hint: How did you find our firm?
      type: select_one
      options:
      - Referral
      - Website
      - Advertisement
      - Professional association
      - Previous relationship
      - Other
      required: false
    - id: 22
      name: referred_by
      label: Referred By
      hint: Who referred you?
      type: text
      options: []
      required: false
    - id: 23
      name: client_signature
      label: Client Signature
      hint: Type your full name as electronic signature
      type: text
      options: []
      required: true
