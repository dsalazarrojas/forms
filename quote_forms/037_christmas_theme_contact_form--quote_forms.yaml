inputSchema:
  type: object
  properties:
    title: Christmas Theme Contact Form
    pages:
    - id: 1
      name: contact_info
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: company_name
      label: Company Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 7
      name: inquiry_section
      label: -- Inquiry Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: inquiry_type
      label: Type of Inquiry
      hint: null
      type: select_one
      options:
      - Holiday event planning
      - Product inquiry
      - Services quote
      - Partnership opportunity
      - Feedback
      - Other
      required: true
    - id: 9
      name: event_type
      label: Event Type (if applicable)
      hint: null
      type: select_one
      options:
      - Corporate holiday party
      - Family gathering
      - Community event
      - Fundraiser
      - Wedding
      - Other
      required: false
    - id: 10
      name: event_date
      label: Event Date (if applicable)
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: budget_range
      label: Budget Range
      hint: null
      type: select_one
      options:
      - Under $500
      - $500 - $1,000
      - $1,000 - $2,500
      - $2,500 - $5,000
      - Over $5,000
      - Not set
      required: false
    - id: 12
      name: message_section
      label: -- Your Message --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: subject
      label: Subject
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: message
      label: Message
      hint: Tell us about your holiday needs
      type: text
      options: []
      required: true
    - id: 15
      name: urgency
      label: How Urgent is Your Request?
      hint: null
      type: select_one
      options:
      - Very urgent
      - Urgent
      - Moderate
      - Not urgent
      required: false
    - id: 16
      name: preferences_section
      label: -- Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: preferred_contact
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Text message
      - Either
      required: true
    - id: 18
      name: best_time_contact
      label: Best Time to Contact You
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: newsletter
      label: Subscribe to our holiday newsletter
      hint: null
      type: select_one
      options:
      - Yes, subscribe me
      - No thanks
      required: false
