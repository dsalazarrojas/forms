inputSchema:
  type: object
  properties:
    title: Responsive Life Insurance Quote Form
    pages:
    - id: 1
      name: life_insurance_type
      label: Life Insurance Type
      hint: Choose type of life insurance
      type: select_one
      options:
      - Life Insurance
      - Term Life Insurance
      - Whole Life Insurance
      required: true
    - id: 2
      name: life_insurance_amount
      label: Life Insurance Amount
      hint: Enter life insurance amount
      type: number
      options: []
      required: true
    - id: 3
      name: policyholder_name
      label: Policyholder Name
      hint: Enter policyholder name
      type: text
      options: []
      required: true
    - id: 4
      name: policyholder_email
      label: Policyholder Email
      hint: Enter policyholder email
      type: email
      options: []
      required: true
    - id: 5
      name: policyholder_phone
      label: Policyholder Phone
      hint: Enter policyholder phone number
      type: text
      options: []
      required: false
    - id: 6
      name: policyholder_address
      label: Policyholder Address
      hint: Enter policyholder address
      type: text
      options: []
      required: false
    - id: 7
      name: smoking_status
      label: Smoking Status
      hint: Non-smoker or smoker?
      type: select_one
      options:
      - Non-smoker
      - Smoker
      required: true
    - id: 8
      name: policyholder_age
      label: Policyholder Age
      hint: Enter policyholder age
      type: number
      options: []
      required: true
    - id: 9
      name: policyholder_date_of_birth
      label: Policyholder Date of Birth
      hint: Enter policyholder date of birth
      type: date
      options: []
      required: true
    - id: 10
      name: employment_status
      label: Employment Status
      hint: Select employment status
      type: select_one
      options:
      - Employed
      - Unemployed
      - Self-Employed
      required: true
    - id: 11
      name: income_level
      label: Income Level
      hint: Enter policyholder income level
      type: number
      options: []
      required: true
    - id: 12
      name: existing_medical_conditions
      label: Existing Medical Conditions
      hint: Enter any existing medical conditions
      type: note
      options: []
      required: false
