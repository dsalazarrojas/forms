inputSchema:
  type: object
  properties:
    title: Video Consent Form
    pages:
    - id: 1
      name: videographer_details
      label: Videographer Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: video_details
      label: Video Details
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: consent
      label: None
      hint: null
      type: select_multiple
      options:
      - I am 18 or older
      - I am under 18 but I am a parent or guardian and I give consent
      - I am under 18 and I give consent
      required: true
    - id: 4
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: agreement
      label: None
      hint: null
      type: note
      options: []
      required: true
    - id: 6
      name: signature
      label: None
      hint: null
      type: select_multiple
      options:
      - I have read, understand and agree to the terms of this video release agreement
      - I have not read, do not understand and do not agree to the terms of this video
        release agreement
      required: false
    - id: 7
      name: additional_comments
      label: None
      hint: null
      type: note
      options: []
      required: false
