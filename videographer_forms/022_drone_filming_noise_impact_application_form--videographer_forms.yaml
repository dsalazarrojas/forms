inputSchema:
  type: object
  properties:
    title: Drone Filming Noise Impact Application Form
    pages:
    - id: 1
      name: operator_info
      label: What is the operator's contact information?
      hint: Please provide the operator's name and contact details.
      type: text
      options: []
      required: true
    - id: 2
      name: location
      label: What is the location of the drone filming operation?
      hint: Please enter the location where the operation took place.
      type: text
      options: []
      required: true
    - id: 3
      name: start_time
      label: What is the start time of the drone filming operation?
      hint: Please enter the start time of the operation.
      type: time
      options: []
      required: true
    - id: 4
      name: end_time
      label: What is the end time of the drone filming operation?
      hint: Please enter the end time of the operation.
      type: time
      options: []
      required: true
    - id: 5
      name: noise_level
      label: What is the noise level of the drone filming operation?
      hint: Please rate the noise level of the operation.
      type: number
      options: []
      required: true
    - id: 6
      name: priority
      label: Is the drone filming operation a priority for noise impact?
      hint: Please select the priority level.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: assigned_to
      label: Is the drone filming operation assigned to a specific team member?
      hint: Please select if the operation is assigned to a team member.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: form_status
      label: What is the status of the form (Active or Inactive)?
      hint: Please select the status of the form.
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 9
      name: comments
      label: Any comments about the drone filming operation?
      hint: Please provide any comments about the operation.
      type: note
      options: []
      required: true
    - id: 10
      name: operator_comments
      label: Any comments from the operator about the drone filming operation?
      hint: Please provide any comments from the operator.
      type: note
      options: []
      required: true
    - id: 11
      name: submitted_by
      label: Who submitted the form?
      hint: Please select who submitted the form.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: form_status_2
      label: What is the status of the form?
      hint: Please select the status of the form.
      type: select_one
      options:
      - Active
      - Inactive
      required: true
