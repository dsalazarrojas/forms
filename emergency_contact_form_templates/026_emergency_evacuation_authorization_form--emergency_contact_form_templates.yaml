      name: name
      label: employee_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: phone
      label: contact_number
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
