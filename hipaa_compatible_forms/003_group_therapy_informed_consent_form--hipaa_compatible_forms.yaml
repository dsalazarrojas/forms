inputSchema:
  type: object
  properties:
    title: Group Therapy Informed Consent Form
    pages:
    - id: 1
      name: intro
      label: Group Therapy Informed Consent Form
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: services_provided
      label: Services Provided
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: confidentiality
      label: Confidentiality
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: group_therapy
      label: Group Therapy
      hint: null
      type: select_one
      options:
      - Individual Therapy
      - Group Therapy
      - Marriage/Couples Therapy
      - Family Therapy
      required: true
    - id: 5
      name: services_provided_details
      label: Services Provided Details
      hint: This is where you will detail the services you will provide.
      type: text
      options: []
      required: true
    - id: 6
      name: risks
      label: Risks
      hint: null
      type: select_one
      options:
      - Risk 1
      - Risk 2
      - Risk 3
      required: false
    - id: 7
      name: benefits
      label: Benefits
      hint: null
      type: select_one
      options:
      - Benefit 1
      - Benefit 2
      - Benefit 3
      required: false
    - id: 8
      name: services_provided_what_will_happen
      label: Services Provided What Will Happen
      hint: null
      type: select_one
      options:
      - Something 1
      - Something 2
      - Something 3
      required: true
    - id: 9
      name: services_provided_what_wont_happen
      label: Services Provided What Will Not Happen
      hint: null
      type: select_one
      options:
      - Nothing 1
      - Nothing 2
      - Nothing 3
      required: false
    - id: 10
      name: services_provided_consequences
      label: Services Provided Consequences
      hint: This is where you will detail the consequences of the services you will
        provide.
      type: text
      options: []
      required: true
    - id: 11
      name: client_consent
      label: Client Consent
      hint: null
      type: select_one
      options:
      - Consent 1
      - Consent 2
      - Consent 3
      required: true
    - id: 12
      name: consent_form_signed
      label: Consent Form Signed
      hint: null
      type: select_one
      options:
      - Consent Form 1
      - Consent Form 2
      required: false
    - id: 13
      name: signature
      label: Signature
      hint: This is where you will collect the clients signature.
      type: text
      options: []
      required: true
    - id: 14
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 15
      name: date_time
      label: Date Time
      hint: null
      type: time
      options: []
      required: false
    - id: 16
      name: therapist
      label: Therapist
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: contact
      label: Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: consent_form_reviewed_by
      label: Consent Form Reviewed By
      hint: null
      type: select_one
      options:
      - Reviewer 1
      - Reviewer 2
      - Reviewer 3
      required: false
    - id: 22
      name: consent_form_signed_by
      label: Consent Form Signed By
      hint: null
      type: select_one
      options:
      - Signer 1
      - Signer 2
      required: false
    - id: 23
      name: date_signed
      label: Date Signed
      hint: null
      type: date
      options: []
      required: true
    - id: 24
      name: time_signed
      label: Time Signed
      hint: null
      type: time
      options: []
      required: true
    - id: 25
      name: signature_image
      label: Signature Image
      hint: null
      type: text
      options: []
      required: false
