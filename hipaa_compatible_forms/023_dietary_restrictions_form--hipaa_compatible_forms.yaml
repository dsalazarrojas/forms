inputSchema:
  type: object
  properties:
    title: Dietary Restrictions Form
    pages:
    - id: 1
      name: patient_allergies
      label: Patient Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: null
      type: select_one
      options:
      - None
      - Allergies
      - Other (Please specify)
      required: true
    - id: 3
      name: medical_conditions
      label: Medical Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: medication_list
      label: Medications List
      hint: null
      type: select_multiple
      options:
      - None
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: dietary_lifestyle
      label: Dietary Lifestyle
      hint: null
      type: select_one
      options:
      - Vegetarian
      - Non-Vegetarian
      - Other (Please specify)
      required: false
    - id: 6
      name: medical_conditions_description
      label: Medical Conditions Description
      hint: Briefly describe the condition
      type: text
      options: []
      required: false
    - id: 7
      name: medical_specialist_referral
      label: Medical Specialist Referral
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: medical_test_results
      label: Medical Test Results
      hint: null
      type: select_one
      options:
      - Within 1-2 weeks
      - Within 1-6 months
      - Within 1-2 years
      - Within 2-5 years
      - More than 5 years
      required: false
    - id: 9
      name: date_last_medical_test
      label: Date Last Medical Test
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: date_last_medical_checkup
      label: Date Last Medical Check-up
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: height_feet
      label: Height (in feet)
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: weight_lbs
      label: Weight (lbs)
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 15
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 16
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
