inputSchema:
  type: object
  properties:
    title: Veterinary Maternity Leave Of Absence Form
    pages:
    - id: 1
      name: employee_id
      label: employee_id
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: employee_name
      label: employee_name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: start_date
      label: start_date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: leave_type
      label: leave_type
      hint: null
      type: select_one
      options:
      - Maternity Leave
      - Parental Leave
      - Paternity Leave
      - Adoption Leave
      - Medical Leave
      - Other
      required: true
    - id: 5
      name: end_date
      label: end_date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: reason
      label: reason
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: confirmation
      label: confirmation
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: manager_comments
      label: manager_comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: staff_confirmation
      label: staff_confirmation
      hint: null
      type: text
      options: []
      required: false
