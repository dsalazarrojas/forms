inputSchema:
  type: object
  properties:
    title: Animal Breeder Job Application Form
    pages:
    - id: 1
      name: applicant_name
      label: Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: address
      label: Home Address
      hint: Street, city, state, zip code
      type: text
      options: []
      required: true
    - id: 5
      name: application_intro
      label: Animal Breeder Position Application
      hint: Thank you for your interest in joining our breeding program. Please complete
        all sections.
      type: note
      options: []
      required: false
    - id: 6
      name: position_type
      label: Position Type
      hint: Select desired position
      type: select_one
      options:
      - Full-time animal breeder
      - Part-time animal breeder
      - Breeding assistant
      - Kennel manager
      - Breeding consultant
      - Apprentice
      required: true
    - id: 7
      name: available_start_date
      label: Available Start Date
      hint: When can you begin
      type: date
      options: []
      required: true
    - id: 8
      name: salary_expectations
      label: Salary Expectations
      hint: Expected compensation
      type: text
      options: []
      required: false
    - id: 9
      name: experience_section
      label: Experience Section
      hint: Your breeding and animal care experience
      type: note
      options: []
      required: false
    - id: 10
      name: years_experience
      label: Years of Animal Breeding Experience
      hint: Total experience
      type: select_one
      options:
      - No formal experience
      - Less than 1 year
      - 1-3 years
      - 4-7 years
      - 8-15 years
      - More than 15 years
      required: true
    - id: 11
      name: species_experience
      label: Which species have you worked with
      hint: Select all that apply
      type: select_multiple
      options:
      - Dogs
      - Cats
      - Horses
      - Cattle
      - Sheep
      - Goats
      - Pigs
      - Poultry
      - Rabbits
      - Exotic animals
      required: true
    - id: 12
      name: breeds_specialization
      label: Which breeds do you specialize in
      hint: List specific breeds
      type: text
      options: []
      required: false
    - id: 13
      name: breeding_programs
      label: Describe previous breeding programs you have managed
      hint: Experience details
      type: text
      options: []
      required: false
    - id: 14
      name: education_section
      label: Education Section
      hint: Your educational background
      type: note
      options: []
      required: false
    - id: 15
      name: highest_education
      label: Highest Level of Education
      hint: Education level
      type: select_one
      options:
      - High school or equivalent
      - Some college
      - Associate degree
      - Bachelor's degree
      - Master's degree
      - Doctorate or DVM
      required: true
    - id: 16
      name: degree_field
      label: Degree or Field of Study
      hint: Major or concentration
      type: text
      options: []
      required: false
    - id: 17
      name: certifications
      label: Relevant Certifications
      hint: Professional certifications
      type: text
      options: []
      required: false
    - id: 18
      name: skills_section
      label: Skills and Knowledge
      hint: Your professional skills
      type: note
      options: []
      required: false
    - id: 19
      name: technical_skills
      label: Technical Skills
      hint: Select all that apply
      type: select_multiple
      options:
      - Artificial insemination
      - Pregnancy diagnosis
      - Whelping assistance
      - Neonatal care
      - Genetic testing
      - Pedigree analysis
      - Health screening
      - Nutrition planning
      - Record keeping
      required: true
    - id: 20
      name: knowledge_areas
      label: Areas of Expertise
      hint: Select all that apply
      type: select_multiple
      options:
      - Genetics and heredity
      - Reproductive physiology
      - Animal nutrition
      - Behavior and temperament
      - Disease prevention
      - Breed standards
      - Show preparation
      - Business management
      required: false
    - id: 21
      name: employment_history
      label: Employment History
      hint: Previous employers in animal breeding
      type: text
      options: []
      required: true
    - id: 22
      name: references
      label: Professional References
      hint: Names and contact information
      type: text
      options: []
      required: true
    - id: 23
      name: physical_requirements
      label: Can you meet physical demands of the job
      hint: Lifting, standing, outdoor work
      type: select_one
      options:
      - Yes - no limitations
      - Yes - with minor accommodations
      - No - have limitations
      required: true
    - id: 24
      name: schedule_flexibility
      label: Are you available for irregular hours
      hint: Breeding often requires flexible schedules
      type: select_one
      options:
      - Yes - fully flexible
      - Yes - with some limitations
      - No - regular hours only
      required: true
    - id: 25
      name: why_interested
      label: Why are you interested in this position
      hint: Motivation
      type: text
      options: []
      required: true
    - id: 26
      name: career_goals
      label: What are your career goals in animal breeding
      hint: Professional aspirations
      type: text
      options: []
      required: false
    - id: 27
      name: background_check
      label: Are you willing to undergo a background check
      hint: Employment requirement
      type: select_one
      options:
      - Yes - I consent
      - false
      required: true
    - id: 28
      name: drug_screening
      label: Are you willing to undergo drug screening
      hint: If required
      type: select_one
      options:
      - Yes - I consent
      - false
      required: false
    - id: 29
      name: additional_info
      label: Additional Information
      hint: Anything else you would like us to know
      type: text
      options: []
      required: false
    - id: 30
      name: applicant_signature
      label: Applicant Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 31
      name: signature_date
      label: Date
      hint: Today's date
      type: date
      options: []
      required: true
