inputSchema:
  type: object
  properties:
    title: Veterinary Client Satisfaction Benchmark Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: visit_info
      label: Visit Information
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: question_4
      label: How likely are you to recommend our vet clinic to a friend or family
        member on a scale of 1-5?
      hint: null
      type: select_one
      options:
      - 1 - Not at all
      - 2 - Slightly
      - 3 - Neutral
      - 4 - Somewhat
      - 5 - Highly
      required: false
    - id: 5
      name: question_5
      label: How satisfied are you with our clinic on a scale of 1-5?
      hint: null
      type: select_one
      options:
      - 1 - Very dissatisfied
      - 2 - Somewhat dissatisfied
      - 3 - Neutral
      - 4 - Somewhat satisfied
      - 5 - Very satisfied
      required: false
    - id: 6
      name: question_6
      label: What did you come in for?
      hint: null
      type: select_multiple
      options:
      - Initial Exam
      - Vaccination
      - Routine Check-up
      - Medical Procedure
      - Other (please describe)
      required: false
    - id: 7
      name: question_7
      label: What time did you arrive at the clinic?
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: question_8
      label: What time did you leave the clinic?
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: question_9
      label: How long did your visit take?
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: question_10
      label: Was the staff friendly?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: question_11
      label: Do you have any additional comments or suggestions for our clinic?
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: question_12
      label: What could we have done to improve your visit?
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: question_13
      label: How can we improve our clinic?
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: question_14
      label: Was the waiting time reasonable?
      hint: null
      type: select_one
      options:
      - Less than 15 minutes
      - Between 15-30 minutes
      - More than 30 minutes
      required: false
    - id: 15
      name: question_15
      label: How satisfied are you with the quality of care provided by our clinic?
      hint: null
      type: select_one
      options:
      - Very dissatisfied
      - Somewhat dissatisfied
      - Neutral
      - Somewhat satisfied
      - Very satisfied
      required: false
    - id: 16
      name: question_16
      label: How likely are you to return to our clinic for future visits?
      hint: null
      type: select_one
      options:
      - Not at all
      - Somewhat
      - Likely
      - Very likely
      - Highly likely
      required: false
    - id: 17
      name: question_17
      label: Was the staff helpful and knowledgeable?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 18
      name: question_18
      label: Additional comments or suggestions?
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: question_19
      label: Question 19
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: question_20
      label: Question 20
      hint: null
      type: note
      options: []
      required: false
