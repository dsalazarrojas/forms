inputSchema:
  type: object
  properties:
    title: Animal Adoption Appointment Form
    pages:
    - id: 1
      name: section_appointment_header
      label: -- Adoption Appointment Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: visitor_name
      label: Visitor Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: visitor_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: contact_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: section_appointment_details
      label: -- Appointment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: requested_appointment_date
      label: Requested Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: preferred_start_time
      label: Preferred Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: appointment_type
      label: Type of Appointment
      hint: null
      type: select_one
      options:
      - Initial Meet and Greet
      - Secondary Visit with Current Pets
      - Final Adoption Signing
      required: true
    - id: 9
      name: animal_you_wish_to_meet
      label: Name of Animal You Wish to Meet
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: section_visitor_info
      label: -- Visitor Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: number_of_people_attending
      label: Number of People Attending Appointment
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: bringing_current_dog_for_intro
      label: Are you bringing a current dog for an introduction?
      hint: null
      type: select_one
      options:
      - true
      - false
      - N / A
      required: true
    - id: 13
      name: section_confirmation
      label: -- Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: receive_sms_reminders
      label: Would you like to receive SMS appointment reminders?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 15
      name: additional_questions_for_staff
      label: Additional Questions for Staff
      hint: null
      type: text
      options: []
      required: false
