inputSchema:
  type: object
  properties:
    title: Rabbit Adoption Application Form
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: species
      label: Species
      hint: null
      type: select_one
      options:
      - Rabbit
      - Other
      required: true
    - id: 6
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: weight
      label: Weight
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: health_condition
      label: Health Condition
      hint: null
      type: select_one
      options:
      - Healthy
      - Injured
      - Fur-bald
      required: true
    - id: 9
      name: suitable_for_family_with_children
      label: Suitable for family with children
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Unknown
      required: false
    - id: 10
      name: suitable_for_active_lifestyle
      label: Suitable for active lifestyle
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Unknown
      required: false
    - id: 11
      name: previous_pet_experience
      label: Previous pet experience
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Unknown
      required: false
    - id: 12
      name: previous_pets_lived_with
      label: Previous pets lived with
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Unknown
      required: false
