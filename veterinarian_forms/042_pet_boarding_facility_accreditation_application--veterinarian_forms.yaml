inputSchema:
  type: object
  properties:
    title: Pet Boarding Facility Accreditation Application
    pages:
    - id: 1
      name: facility_name
      label: Facility Name
      hint: Enter the name of the facility.
      type: text
      options: []
      required: true
    - id: 2
      name: facility_address
      label: Facility Address
      hint: Enter the address of the facility.
      type: text
      options: []
      required: true
    - id: 3
      name: facility_license
      label: Facility License
      hint: Check if the facility has a license.
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: facility_license_number
      label: Facility License Number
      hint: Enter the facility's license number.
      type: text
      options: []
      required: true
    - id: 5
      name: facility_license_expiration
      label: Facility License Expiration
      hint: Enter the date of the facility's license expiration.
      type: date
      options: []
      required: false
    - id: 6
      name: facility_insurance
      label: Facility Insurance
      hint: Check if the facility has insurance.
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: facility_insurance_provider
      label: Facility Insurance Provider
      hint: Enter the name of the facility's insurance provider.
      type: text
      options: []
      required: true
    - id: 8
      name: facility_insurance_provider_phone
      label: Facility Insurance Provider Phone
      hint: Enter the facility's insurance provider phone number.
      type: text
      options: []
      required: true
    - id: 9
      name: facility_insurance_provider_email
      label: Facility Insurance Provider Email
      hint: Enter the facility's insurance provider email.
      type: email
      options: []
      required: true
    - id: 10
      name: facility_insurance_provider_address
      label: Facility Insurance Provider Address
      hint: Enter the facility's insurance provider address.
      type: text
      options: []
      required: true
    - id: 11
      name: facility_insurance_provider_tax_id
      label: Facility Insurance Provider Tax ID
      hint: Enter the facility's insurance provider tax ID.
      type: text
      options: []
      required: true
    - id: 12
      name: facility_insurance_provider_national_id
      label: Facility Insurance Provider National ID
      hint: Enter the facility's insurance provider national ID.
      type: text
      options: []
      required: true
    - id: 13
      name: facility_insurance_provider_license
      label: Facility Insurance Provider License
      hint: Enter the facility's insurance provider license.
      type: text
      options: []
      required: true
    - id: 14
      name: facility_insurance_provider_license_number
      label: Facility Insurance Provider License Number
      hint: Enter the facility's insurance provider license number.
      type: text
      options: []
      required: true
    - id: 15
      name: facility_insurance_provider_license_expiration
      label: Facility Insurance Provider License Expiration
      hint: Enter the date of the facility's insurance provider license expiration.
      type: date
      options: []
      required: false
    - id: 16
      name: facility_insurance_provider_licence
      label: Facility Insurance Provider Licence
      hint: Enter the facility's insurance provider license.
      type: text
      options: []
      required: true
    - id: 17
      name: facility_insurance_provider_license_type
      label: Facility Insurance Provider License Type
      hint: Enter the type of the facility's insurance provider license.
      type: text
      options: []
      required: true
    - id: 18
      name: facility_insurance_provider_country
      label: Facility Insurance Provider Country
      hint: Enter the country of the facility's insurance provider.
      type: text
      options: []
      required: true
    - id: 19
      name: facility_insurance_provider_state
      label: Facility Insurance Provider State
      hint: Enter the state of the facility's insurance provider.
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 20
      name: facility_insurance_provider_postcode
      label: Facility Insurance Provider Postcode
      hint: Enter the postcode of the facility's insurance provider.
      type: text
      options: []
      required: true
    - id: 21
      name: facility_insurance_provider_city
      label: Facility Insurance Provider City
      hint: Enter the city of the facility's insurance provider.
      type: text
      options: []
      required: true
