inputSchema:
  type: object
  properties:
    title: Veterinary Public Health Resource Request Form
    pages:
    - id: 1
      name: resource_request
      label: Resource Requested
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: animal_type
      label: Type of Animal
      hint: null
      type: select_one
      options:
      - Dog
      - Cat
      - Other
      required: false
    - id: 6
      name: service_request
      label: Type of Service Requested
      hint: null
      type: select_one
      options:
      - General Consultation
      - Emergency Service
      - Other
      required: false
    - id: 7
      name: resource_type
      label: Types of Resources Needed
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: resource_description
      label: Resource Description
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: resource_availability
      label: Resource Availability
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: follow_up
      label: Follow-up Needed
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: contact_phone
      label: Contact Phone
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: resource_requester_comment
      label: Resource Requester Comment
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: resource_requester_agreement
      label: Resource Requester Agreement
      hint: null
      type: checkbox
      options:
      - I agree
      - I do not agree
      required: true
    - id: 14
      name: resource_requester_signature
      label: Resource Requester Signature
      hint: null
      type: radio
      options:
      - Option A
      - Option B
      required: true
    - id: 15
      name: resource_requester_date
      label: Resource Requester Date
      hint: null
      type: date
      options: []
      required: true
    - id: 16
      name: resource_requester_time
      label: Resource Requester Time
      hint: null
      type: time
      options: []
      required: true
    - id: 17
      name: resource_requester_notes
      label: Resource Requester Notes
      hint: null
      type: text
      options: []
      required: true
