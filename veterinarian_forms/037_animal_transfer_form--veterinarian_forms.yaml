      name: receiving_party_name
      label: Name
      hint: Full name of receiving party
      type: text
      options: []
      required: true
    - id: 11
      name: receiving_party_address
      label: Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 12
      name: receiving_party_city
      label: City
      hint: City
      type: text
      options: []
      required: true
    - id: 13
      name: receiving_party_state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 14
      name: receiving_party_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 15
      name: receiving_party_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: false
    - id: 16
      name: section_animal_info
      label: -- Animal Information --
      hint: Details about the animal
      type: note
      options: []
      required: false
    - id: 17
      name: animal_name
      label: Animal Name
      hint: Pet's name
      type: text
      options: []
      required: true
    - id: 18
      name: animal_species
      label: Species
      hint: Type of animal
      type: select_one
      options:
      - Dog
      - Cat
      - Bird
      - Rabbit
      - Reptile
      - Horse
      - Exotic Animal
      - Other
      required: true
    - id: 19
      name: animal_breed
      label: Breed
      hint: Breed or mix
      type: text
      options: []
      required: false
