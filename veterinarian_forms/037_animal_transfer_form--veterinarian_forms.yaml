inputSchema:
  type: object
  properties:
    title: Animal Transfer Form
    pages:
    - id: 1
      name: transfer_date
      label: Date of Transfer
      hint: Date animal is being transferred
      type: date
      options: []
      required: true
    - id: 2
      name: section_transferring_party
      label: -- Transferring Party Information --
      hint: Current owner or caretaker
      type: note
      options: []
      required: false
    - id: 3
      name: transferring_party_name
      label: Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 4
      name: transferring_party_address
      label: Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 5
      name: transferring_party_city
      label: City
      hint: City
      type: text
      options: []
      required: true
    - id: 6
      name: transferring_party_state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 7
      name: transferring_party_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
