      - 'No'
      - Unknown
      required: true
    - id: 32
      name: veterinarian_name
      label: Current Veterinarian Name
      hint: Name of vet
      type: text
      options: []
      required: false
    - id: 33
      name: veterinarian_contact
      label: Veterinarian Contact Information
      hint: Phone or email
      type: text
      options: []
      required: false
    - id: 34
      name: section_behavior
      label: -- Behavioral Information --
      hint: Behavioral characteristics
      type: note
      options: []
      required: false
    - id: 35
      name: behavioral_notes
      label: Behavioral Notes
      hint: Temperament and personality
      type: text
      options: []
      required: false
    - id: 36
      name: known_issues
      label: Known Behavioral or Medical Issues
      hint: Any concerns
      type: text
      options: []
      required: false
    - id: 37
      name: special_care_needs
      label: Special Care or Training Needs
      hint: Specific requirements
      type: text
      options: []
      required: false
    - id: 38
      name: section_transfer_reason
      label: -- Reason for Transfer --
      hint: Why animal is being transferred
      type: note
      options: []
      required: false
    - id: 39
      name: transfer_reason
      label: Reason for Transfer
      hint: Explanation
      type: select_one
      options:
      - Adoption
      - Rescue Transfer
      - Sanctuary Placement
      - Breeding Program
      - Relocation
      - End of Life Care
      - Other
      required: true
