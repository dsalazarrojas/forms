      name: acknowledge_receipt
      label: Receiving Party Acknowledges Receipt
      hint: Confirm receipt of animal
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 43
      name: acknowledge_condition
      label: Receiving Party Acknowledges Condition
      hint: Accept animal in current condition
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 44
      name: release_transferring_party
      label: Transferring Party Released from Liability
      hint: Confirm release of responsibility
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 45
      name: additional_notes
      label: Additional Notes
      hint: Any other relevant information
      type: text
      options: []
      required: false
