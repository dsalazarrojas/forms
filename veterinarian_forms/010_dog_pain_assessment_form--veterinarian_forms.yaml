inputSchema:
  type: object
  properties:
    title: Dog Pain Assessment Form
    pages:
    - id: 1
      name: dog_pain_assessment_form
      label: Pain Assessment Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: owner_info
      label: Owner Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: pain_type
      label: What Type of Pain
      hint: null
      type: select_one
      options:
      - Dog Arthritis
      - Dog Cancer
      - Dog Injury
      - Other
      required: true
    - id: 4
      name: pain_level
      label: Pain Level
      hint: null
      type: select_multiple
      options:
      - Level 1
      - Level 2
      - Level 3
      - Level 4
      - Level 5
      required: true
    - id: 5
      name: pain_duration
      label: Pain Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: pain_frequency
      label: Pain Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: true
    - id: 7
      name: pain_severity
      label: Pain Severity
      hint: null
      type: select_multiple
      options:
      - Mild
      - Moderate
      - Severe
      required: true
    - id: 8
      name: medication
      label: Medication
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
