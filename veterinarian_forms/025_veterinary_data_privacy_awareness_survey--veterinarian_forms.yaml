      name: data_protection_policy
      label: data_protection_policy
      hint: Do you have a data protection policy in our organization?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Partially
      required: true
    - id: 6
      name: data_collector
      label: data_collector
      hint: Who in the organization is responsible for collecting and managing data?
      type: select_multiple
      options:
      - Data Protection Officer
      - IT Department
      - Management
      - Data Team
      required: true
    - id: 7
