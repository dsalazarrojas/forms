inputSchema:
  type: object
  properties:
    title: Veterinary Data Privacy Awareness Survey
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: role
      label: role
      hint: null
      type: select_one
      options:
      - Veterinarian
      - Technician
      - Manager
      - Student
      - Other
      required: true
    - id: 4
      name: department
      label: department
      hint: null
      type: text
      options: []
      required: false
