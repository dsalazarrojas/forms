inputSchema:
  type: object
  properties:
    title: Veterinary Employee Evaluation Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: job_title
      label: job title
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: performance_rating
      label: Performance Rating
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 4
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: evaluation_period
      label: Evaluation Period
      hint: null
      type: select_multiple
      options:
      - Q1
      - Q2
      - Q3
      - Q4
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Veterinarian
      - Veterinary Assistant
      - Veterinarian Assistant Manager
      required: false
    - id: 11
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - Manager
      - Team Member
      - Veterinarian Manager
      required: false
    - id: 12
      name: submitted_to
      label: Submitted To
      hint: null
      type: select_one
      options:
      - Manager
      - Team Member
      - Veterinarian Manager
      required: false
