inputSchema:
  type: object
  properties:
    title: Pet Health Record Form
    pages:
    - id: 1
      name: pet_name
      label: pet_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: pet_type
      label: pet_type
      hint: null
      type: select_one
      options:
      - Cat
      - Dog
      - Bird
      required: false
    - id: 3
      name: vaccination_status
