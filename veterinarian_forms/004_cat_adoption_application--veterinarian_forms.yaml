inputSchema:
  type: object
  properties:
    title: Cat Adoption Application
    pages:
    - id: 1
      name: section_adopter_info
      label: -- Adopter Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_residence
      label: -- Residence Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: street_address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: state_province
      label: State/Province
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: postal_code
      label: Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: residence_type
      label: Type of Residence
      hint: null
      type: select_one
      options:
      - House
      - Apartment
      - Condo
      - Townhouse
      - Other
      required: true
    - id: 12
      name: own_or_rent
      label: Do you own or rent?
      hint: null
      type: select_one
      options:
      - Own
      - Rent
      required: true
    - id: 13
      name: landlord_allows_pets
      label: If renting, does landlord allow cats?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - N/A - Own the home
      required: true
    - id: 14
      name: section_household
      label: -- Household Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: number_of_adults
      label: Number of Adults in Household
      hint: null
      type: number
      options: []
      required: true
    - id: 16
      name: number_of_children
      label: Number of Children in Household
      hint: null
      type: number
      options: []
      required: true
    - id: 17
      name: children_ages
      label: Ages of Children
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: other_pets
      label: Do you have other pets?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 19
      name: pet_description
      label: If yes, describe other pets
      hint: Type, breed, age, temperament
      type: text
      options: []
      required: false
    - id: 20
      name: section_cat_preferences
      label: -- Cat Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: cat_age_preference
      label: Preferred Cat Age
      hint: null
      type: select_one
      options:
      - Kitten (under 1 year)
      - Young Adult (1-5 years)
      - Adult (5-10 years)
      - Senior (10+ years)
      - No preference
      required: true
    - id: 22
      name: energy_level
      label: Preferred Energy Level
      hint: null
      type: select_one
      options:
      - Very Active
      - Moderate
      - Calm
      - No preference
      required: false
    - id: 23
      name: special_care_willing
      label: Willing to provide special care for medical needs?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 24
      name: veterinary_care_plan
      label: Do you have a veterinarian or veterinary clinic?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Will find one
      required: true
    - id: 25
      name: commitment_acknowledgment
      label: I agree to provide lifetime care for the adopted cat
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
