inputSchema:
  type: object
  properties:
    title: football_awards_nomination_survey
    pages:
    - id: 1
      name: nomination_form
      label: Nomination Form
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: player_name
      label: Player Name
      hint: The name of the player to be nominated.
      type: text
      options: []
      required: false
    - id: 3
      name: school_club_league
      label: School Club League
      hint: The school, club, or league associated with the player.
      type: select_one
      options:
      - Option 1
      - Option 2
      required: false
    - id: 4
      name: nomination_reason
      label: Nomination Reason
      hint: Please provide the reason for the nomination.
      type: text
      options: []
      required: false
    - id: 5
      name: nomination_year
      label: Nomination Year
      hint: The year for which the player is being nominated.
      type: select_one
      options:
      - '2020'
      - '2021'
      - '2022'
      required: false
    - id: 6
      name: award_level
      label: Award Level
      hint: The award level for which the player is being nominated (e.g. Player of
        the Year, Rookie of the Year).
      type: select_one
      options:
      - Player of the Year
      - Rookie of the Year
      - MVP
      required: false
    - id: 7
      name: submission_date
      label: Submission Date
      hint: The date the nomination was submitted.
      type: date
      options: []
      required: false
    - id: 8
      name: submission_time
      label: Submission Time
      hint: The time the nomination was submitted.
      type: time
      options: []
      required: false
    - id: 9
      name: submission_user
      label: Submission User
      hint: The user who submitted the nomination.
      type: text
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: Additional notes for the nomination.
      type: note
      options: []
      required: false
    - id: 11
      name: email
      label: Email
      hint: The email address associated with the nomination.
      type: email
      options: []
      required: false
    - id: 12
      name: phone
      label: Phone
      hint: The phone number associated with the nomination.
      type: text
      options: []
      required: false
    - id: 13
      name: award_year
      label: Award Year
      hint: The award year for which the player is being nominated.
      type: select_one
      options:
      - '2020'
      - '2021'
      - '2022'
      required: false
    - id: 14
      name: award_month
      label: Award Month
      hint: The award month for which the player is being nominated.
      type: select_one
      options:
      - January
      - February
      - March
      required: false
    - id: 15
      name: award_day
      label: Award Day
      hint: The award day for which the player is being nominated.
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      required: false
    - id: 16
      name: award_year_range
      label: Award Year Range
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 17
      name: submission_ip
      label: Submission IP
      hint: The IP address of the user who submitted the nomination.
      type: text
      options: []
      required: false
    - id: 18
      name: submission_browser
      label: Submission Browser
      hint: The browser used to submit the nomination.
      type: text
      options: []
      required: false
    - id: 19
      name: submission_os
      label: Submission OS
      hint: The operating system used to submit the nomination.
      type: text
      options: []
      required: false
    - id: 20
      name: submission_device
      label: Submission Device
      hint: The device used to submit the nomination.
      type: text
      options: []
      required: false
    - id: 21
      name: submission_user_agent
      label: Submission User Agent
      hint: The user agent used to submit the nomination.
      type: text
      options: []
      required: false
    - id: 22
      name: submission_url
      label: Submission URL
      hint: The URL used to submit the nomination.
      type: text
      options: []
      required: false
    - id: 23
      name: submission_referrer
      label: Submission Referrer
      hint: The referrer used to submit the nomination.
      type: text
      options: []
      required: false
    - id: 24
      name: submission_user_id
      label: Submission User ID
      hint: The user ID of the user who submitted the nomination.
      type: text
      options: []
      required: false
    - id: 25
      name: submission_country
      label: Submission Country
      hint: The country of the user who submitted the nomination.
      type: text
      options: []
      required: false
