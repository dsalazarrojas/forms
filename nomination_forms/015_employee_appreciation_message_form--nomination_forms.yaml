inputSchema:
  type: object
  properties:
    title: Employee Appreciation Message Form
    pages:
    - id: 1
      name: nomination_forms_employee_appreciation_message_form_page_1
      label: Nomination Forms Employee Appreciation Message Form Page 1
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: nominee_information
      label: Nominee Information
      hint: null
      type: select_one
      options:
      - Jane Doe
      - John Doe
      - Bob Smith
      required: true
    - id: 3
      name: message
      label: Appreciation Message
      hint: Share a message with the team about why you're recognizing this nominee.
      type: text
      options: []
      required: false
    - id: 4
      name: sender_information
      label: Sender Information
      hint: null
      type: select_one
      options:
      - Jane Doe
      - John Doe
      - Bob Smith
      required: true
    - id: 5
      name: routing
      label: Routing
      hint: null
      type: select_multiple
      options:
      - Team Lead
      - Manager
      - Director
      - CEO
      - Other
      required: true
    - id: 6
      name: followup
      label: Follow Up
      hint: null
      type: select_one
      options:
      - Send a thank you note
      - Meet with the team lead
      - Review and follow up in 1 month
      - Review and follow up in 3 months
      - Review and follow up in 6 months
      required: true
    - id: 7
      name: review_date
      label: Review Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: review_time
      label: Review Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: review_location
      label: Review Location
      hint: null
      type: text
      options: []
      required: false
