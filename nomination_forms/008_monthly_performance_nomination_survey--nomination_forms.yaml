inputSchema:
  type: object
  properties:
    title: Monthly Performance Nomination Survey
    pages:
    - id: 1
      name: nomination_form_1
      label: Nomination
      hint: Nominate an employee
      type: select_multiple
      options:
      - '{''value'': ''Team Member''}'
      - '{''value'': ''Department''}'
      - '{''value'': ''Manager''}'
      required: false
    - id: 2
      name: nominator_name
      label: Nominator Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: nominator_department
      label: Nominator Department
      hint: Select a department
      type: select_one
      options:
      - '{''value'': ''Sales''}'
      - '{''value'': ''Marketing''}'
      - '{''value'': ''IT''}'
      - '{''value'': ''HR''}'
      required: false
    - id: 4
      name: nomination_date
      label: Nomination Date
      hint: MM/DD/YY
      type: date
      options: []
      required: false
    - id: 5
      name: nominator_phone
      label: Nominator Phone
      hint: Optional
      type: text
      options: []
      required: false
    - id: 6
      name: nomination_form_5
      label: Nomination Form
      hint: null
      type: select_multiple
      options:
      - '{''value'': ''Form 1''}'
      - '{''value'': ''Form 2''}'
      - '{''value'': ''Form 3''}'
      required: false
    - id: 7
      name: nomination_comments
      label: Nomination Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: nominator_email
      label: Nominator Email
      hint: null
      type: email
      options: []
      required: false
