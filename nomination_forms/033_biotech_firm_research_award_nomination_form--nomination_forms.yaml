inputSchema:
  type: object
  properties:
    title: Biotech Firm Research Award Nomination Form
    pages:
    - id: 1
      name: nominator_information
      label: Nominator Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: nominator_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: nominator_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: nominator_title
      label: Professional Title
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: nominator_organization
      label: Organization
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: nominator_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: nominator_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: award_category
      label: Award Category
      hint: null
      type: select_one
      options:
      - Innovation in Drug Discovery
      - Clinical Development Excellence
      - Manufacturing Innovation
      - Regulatory Achievement
      - Young Researcher Award
      - Lifetime Achievement
      - Team Excellence Award
      - Emerging Technology Award
      required: true
    - id: 9
      name: nomination_year
      label: Nomination Year
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: research_title
      label: Research Title
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: research_summary
      label: Research Summary
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: research_field
      label: Research Field
      hint: null
      type: select_one
      options:
      - Gene Therapy
      - Immunotherapy
      - Oncology
      - Rare Diseases
      - Infectious Diseases
      - Neuroscience
      - Regenerative Medicine
      - Diagnostics
      - Biomanufacturing
      - Other
      required: true
    - id: 13
      name: research_duration
      label: Research Duration
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - 10+ years
      required: true
    - id: 14
      name: key_achievements
      label: Key Achievements
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: innovation_description
      label: Description of Innovation
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: impact_assessment
      label: Impact Assessment
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: publications
      label: Related Publications
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: cv_attached
      label: CV or Resume Attached
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Will Submit Separately
      required: true
    - id: 19
      name: letters_of_support
      label: Number of Support Letters
      hint: null
      type: number
      options: []
      required: true
    - id: 20
      name: additional_materials
      label: List any Other Supporting Materials
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: eligibility_confirmation
      label: Eligibility Confirmation
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: eligibility_status
      label: Eligibility Status
      hint: null
      type: select_one
      options:
      - Yes - Meets All Requirements
      - Yes - With Exceptions Noted
      - No - Does Not Meet Requirements
      required: true
    - id: 23
      name: eligibility_exceptions
      label: Eligibility Exceptions
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: conflict_of_interest
      label: Conflict of Interest
      hint: null
      type: select_one
      options:
      - No Conflict of Interest
      - Potential Conflict - Disclosed Below
      - Yes - Cannot Nominate
      required: true
    - id: 25
      name: conflict_description
      label: Conflict Description
      hint: null
      type: text
      options: []
      required: false
    - id: 26
      name: previous_nominations
      label: Previous Nominations
      hint: null
      type: select_one
      options:
      - No - First Nomination
      - Yes - Previously Nominated
      - Yes - Previous Winner
      required: false
    - id: 27
      name: nomination_statement
      label: Nomination Statement
      hint: Why should this person or team receive this award
      type: text
      options: []
      required: true
    - id: 28
      name: submission_status
      label: Submission Status
      hint: null
      type: select_one
      options:
      - Submitted
      - Under Review
      - Shortlisted
      - Approved
      - Not Selected
      required: false
    - id: 29
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: false
    - id: 30
      name: submission_notes
      label: Submission Notes
      hint: null
      type: note
      options: []
      required: false
