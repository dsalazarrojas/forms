    - id: 9
      name: nominee_first_name
      label: First Name
      hint: Nominee's first name
      type: text
      options: []
      required: true
    - id: 10
      name: nominee_last_name
      label: Last Name
      hint: Nominee's last name
      type: text
      options: []
      required: true
    - id: 11
      name: nominee_title
      label: Professional Title
      hint: Nominee's current position
      type: text
      options: []
      required: true
    - id: 12
      name: nominee_organization
      label: Organization
      hint: Nominee's company or institution
      type: text
      options: []
      required: true
    - id: 13
      name: nominee_department
      label: Department
      hint: Nominee's department or division
      type: text
      options: []
      required: false
    - id: 14
      name: nominee_email
      label: Email Address
      hint: Nominee's contact email
      type: email
      options: []
      required: true
    - id: 15
      name: award_information
      label: Award Information
      hint: Specify award details
      type: note
      options: []
      required: false
    - id: 16
      name: award_category
      label: Award Category
      hint: Which award category
      type: select_one
      options:
      - Innovation in Drug Discovery
      - Clinical Development Excellence
      - Manufacturing Innovation
      - Regulatory Achievement
      - Young Researcher Award
      - Lifetime Achievement
      - Team Excellence Award
      - Emerging Technology Award
      required: true
    - id: 17
      name: nomination_year
      label: Nomination Year
      hint: Year for this nomination
      type: number
      options: []
      required: true
    - id: 18
      name: research_details
      label: Research Details
      hint: Describe the nominated work
      type: note
      options: []
      required: false
    - id: 19
      name: research_title
      label: Research Title
      hint: Title of the research or project
      type: text
      options: []
      required: true
    - id: 20
      name: research_summary
      label: Research Summary
      hint: Brief summary of the research
      type: text
      options: []
      required: true
    - id: 21
      name: research_field
      label: Research Field
      hint: Primary field of research
      type: select_one
      options:
      - Gene Therapy
      - Immunotherapy
      - Oncology
      - Rare Diseases
      - Infectious Diseases
      - Neuroscience
      - Regenerative Medicine
      - Diagnostics
      - Biomanufacturing
      - Other
      required: true
    - id: 22
      name: research_duration
      label: Research Duration
      hint: How long was the research conducted
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - 10+ years
      required: true
    - id: 23
      name: key_achievements
      label: Key Achievements
      hint: List major accomplishments
      type: text
      options: []
      required: true
    - id: 24
      name: innovation_description
      label: Description of Innovation
      hint: What makes this work innovative
      type: text
      options: []
      required: true
    - id: 25
      name: impact_assessment
      label: Impact Assessment
      hint: Describe the impact of this work
      type: text
      options: []
      required: true
    - id: 26
      name: publications
      label: Related Publications
      hint: List key publications
      type: text
      options: []
      required: false
    - id: 27
      name: patents
      label: Patents
      hint: List any related patents
      type: text
      options: []
      required: false
    - id: 28
      name: supporting_documents
      label: Supporting Documents
      hint: Documents to include
      type: note
      options: []
      required: false
    - id: 29
      name: cv_attached
      label: CV or Resume Attached
      hint: Has nominee CV been included
      type: select_one
      options:
      - true
      - false
      - Will Submit Separately
      required: true
    - id: 30
      name: letters_of_support
      label: Letters of Support
      hint: Number of support letters
      type: number
      options: []
      required: true
    - id: 31
      name: additional_materials
      label: Additional Materials
      hint: List any other supporting materials
      type: text
      options: []
      required: false
    - id: 32
      name: eligibility_confirmation
      label: Eligibility Confirmation
      hint: Confirm nominee eligibility
      type: note
      options: []
      required: false
    - id: 33
      name: eligibility_status
      label: Eligibility Status
      hint: Is nominee eligible for this award
      type: select_one
      options:
      - Yes - Meets All Requirements
      - Yes - With Exceptions Noted
      - No - Does Not Meet Requirements
      required: true
    - id: 34
      name: eligibility_exceptions
      label: Eligibility Exceptions
      hint: Describe any exceptions if applicable
      type: text
      options: []
      required: false
    - id: 35
      name: conflict_of_interest
      label: Conflict of Interest
      hint: Do you have any conflict of interest
      type: select_one
      options:
      - No Conflict of Interest
      - Potential Conflict - Disclosed Below
      - Yes - Cannot Nominate
      required: true
    - id: 36
      name: conflict_description
      label: Conflict Description
      hint: Describe any conflicts
      type: text
      options: []
      required: false
    - id: 37
      name: previous_nominations
      label: Previous Nominations
      hint: Has nominee been nominated before
      type: select_one
      options:
      - No - First Nomination
      - Yes - Previously Nominated
      - Yes - Previous Winner
      required: false
    - id: 38
      name: nomination_statement
      label: Nomination Statement
      hint: Why should this person or team receive this award
      type: text
      options: []
      required: true
    - id: 39
      name: reviewer_use_only
      label: For Review Committee Use Only
      hint: Scoring section
      type: note
      options: []
      required: false
    - id: 40
      name: submission_status
      label: Submission Status
      hint: Current status
      type: select_one
      options:
      - Submitted
      - Under Review
      - Shortlisted
      - Approved
      - Not Selected
      required: false
    - id: 41
      name: submission_date
      label: Submission Date
      hint: Date of nomination
      type: date
      options: []
      required: true
    - id: 42
      name: nominator_signature
      label: Nominator Signature
      hint: Confirm nomination accuracy
      type: select_one
      options:
      - I certify this nomination is accurate
      - I endorse this nomination
      required: true
