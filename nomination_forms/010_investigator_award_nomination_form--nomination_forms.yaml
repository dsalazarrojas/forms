      type: text
      options: []
      required: false
    - id: 5
      name: submitter_info
      label: Your Information
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: submitter_name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: submitter_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: submitter_phone
      label: Phone
      hint: null
      type: text
      options: []
