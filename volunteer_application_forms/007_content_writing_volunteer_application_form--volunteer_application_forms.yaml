inputSchema:
  type: object
  properties:
    title: Content Writing Volunteer Application Form
    pages:
    - id: 1
      name: full_name
      label: Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: Primary email
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 4
      name: location
      label: Location
      hint: City and state
      type: text
      options: []
      required: false
    - id: 5
      name: organization_interest
      label: Organization of Interest
      hint: Which organization do you want to volunteer with?
      type: text
      options: []
      required: true
    - id: 6
      name: volunteer_role
      label: Volunteer Role
      hint: Position you are applying for
      type: select_one
      options:
      - Content Writer
      - Blog Writer
      - Social Media Writer
      - Grant Writer
      - Technical Writer
      - Editor
      - Proofreader
      required: true
    - id: 7
      name: availability_schedule
      label: Availability Schedule
      hint: When are you available?
      type: select_multiple
      options:
      - Weekdays mornings
      - Weekdays afternoons
      - Weekday evenings
      - Weekends
      - Flexible
      required: true
    - id: 8
      name: hours_per_week
      label: Hours Per Week
      hint: Estimated volunteer hours
      type: select_one
      options:
      - 1-5 hours
      - 5-10 hours
      - 10-20 hours
      - 20+ hours
      required: true
    - id: 9
      name: writing_experience
      label: Writing Experience
      hint: Years of writing experience
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - 10+ years
      required: true
    - id: 10
      name: writing_samples
      label: Writing Samples
      hint: Links to 2-3 samples
      type: text
      options: []
      required: true
    - id: 11
      name: content_specialties
      label: Content Specialties
      hint: Areas of expertise
      type: select_multiple
      options:
      - Blog Posts
      - Newsletters
      - Social Media
      - Grant Proposals
      - Technical Documentation
      - Press Releases
      - Case Studies
      - Website Content
      required: true
    - id: 12
      name: industry_knowledge
      label: Industry Knowledge
      hint: Industries you know well
      type: select_multiple
      options:
      - Nonprofit
      - Education
      - Healthcare
      - Environment
      - Social Services
      - Arts and Culture
      - Technology
      - Other
      required: false
    - id: 13
      name: education_background
      label: Education Background
      hint: Highest degree earned
      type: select_one
      options:
      - High School
      - Associate Degree
      - Bachelor's Degree
      - Master's Degree
      - Doctorate
      required: false
    - id: 14
      name: field_of_study
      label: Field of Study
      hint: Major or concentration
      type: text
      options: []
      required: false
    - id: 15
      name: motivation
      label: Motivation for Volunteering
      hint: Why do you want to volunteer?
      type: text
      options: []
      required: true
    - id: 16
      name: cause_passion
      label: Cause You Are Passionate About
      hint: What causes matter to you?
      type: text
      options: []
      required: true
    - id: 17
      name: previous_volunteer_experience
      label: Previous Volunteer Experience
      hint: Describe past volunteer work
      type: text
      options: []
      required: false
    - id: 18
      name: skills_beyond_writing
      label: Skills Beyond Writing
      hint: Other relevant skills
      type: select_multiple
      options:
      - Graphic Design
      - Social Media Management
      - SEO
      - Video Editing
      - Photography
      - Web Development
      - Marketing
      required: false
    - id: 19
      name: start_date_preference
      label: Start Date Preference
      hint: When can you begin?
      type: date
      options: []
      required: true
    - id: 20
      name: commitment_duration
      label: Commitment Duration
      hint: How long can you volunteer?
      type: select_one
      options:
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - 1+ years
      - Ongoing
      required: true
    - id: 21
      name: references
      label: References
      hint: Names and contact info for 2 references
      type: text
      options: []
      required: false
    - id: 22
      name: background_check_consent
      label: Background Check Consent
      hint: Do you consent to a background check?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 23
      name: additional_comments
      label: Additional Comments
      hint: Anything else to share
      type: text
      options: []
      required: false
