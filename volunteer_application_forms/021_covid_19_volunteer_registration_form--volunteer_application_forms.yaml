inputSchema:
  type: object
  properties:
    title: Covid-19 Volunteer Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: First name of the volunteer
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: Last name of the volunteer
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Email address of the volunteer
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: Contact phone number of the volunteer
      type: text
      options: []
      required: true
    - id: 5
      name: address
      label: Address
      hint: Address of the volunteer
      type: text
      options: []
      required: true
    - id: 6
      name: city
      label: City
      hint: City of the volunteer
      type: text
      options: []
      required: true
    - id: 7
      name: state
      label: State
      hint: State of the volunteer
      type: text
      options: []
      required: true
    - id: 8
      name: zip
      label: Zip
      hint: Zip code of the volunteer
      type: number
      options: []
      required: true
    - id: 9
      name: birth_date
      label: Birth Date
      hint: Date of birth of the volunteer
      type: date
      options: []
      required: false
    - id: 10
      name: volunteer_type
      label: Volunteer Type
      hint: Type of volunteer (e.g. doctor, nurse etc.)
      type: select_one
      options:
      - Emergency Medical Technician (EMT)
      - Doctor
      - Nurse
      - Other
      required: true
    - id: 11
      name: medical_practice
      label: Medical Practice
      hint: Medical practice the volunteer will be working with
      type: select_multiple
      options:
      - Practice 1
      - Practice 2
      - Practice 3
      required: true
    - id: 12
      name: shift
      label: Shift
      hint: Shift of the volunteer
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      required: false
    - id: 13
      name: availability
      label: Availability
      hint: Availability of the volunteer (e.g. weekdays, weekends etc.)
      type: select_multiple
      options:
      - Weekdays
      - Weekends
      required: false
    - id: 14
      name: emergency_contact_first_name
      label: Emergency Contact First Name
      hint: First name of the emergency contact
      type: text
      options: []
      required: false
    - id: 15
      name: emergency_contact_last_name
      label: Emergency Contact Last Name
      hint: Last name of the emergency contact
      type: text
      options: []
      required: false
    - id: 16
      name: emergency_contact_relationship
      label: Relationship
      hint: Relationship of the emergency contact
      type: text
      options: []
      required: false
