inputSchema:
  type: object
  properties:
    title: Generic Volunteer Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: availability
      label: Availability
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      required: false
    - id: 6
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - In Person
      required: false
