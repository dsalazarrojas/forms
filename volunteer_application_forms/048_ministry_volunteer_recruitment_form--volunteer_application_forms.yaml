inputSchema:
  type: object
  properties:
    title: Ministry Volunteer Recruitment Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: ministry_interest
      label: Ministry Interest
      hint: null
      type: select_one
      options:
      - Biblical Studies
      - Children's Ministry
      - Counseling
      - Worship
      - Youth Ministry
      required: false
    - id: 6
      name: volunteer_role
      label: Volunteer Role
      hint: null
      type: select_multiple
      options:
      - Leader
      - Member
      - Supporter
      required: false
    - id: 7
      name: availability
      label: Availability
      hint: 'Format: MM/DD/YYYY to MM/DD/YYYY'
      type: date
      options: []
      required: false
    - id: 8
      name: available_time
      label: Available Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: how_did_you_find_us
      label: How Did You Find Us
      hint: null
      type: select_one
      options:
      - Google Search
      - Social Media
      - Referral
      - Other
      required: false
    - id: 11
      name: volunteer_referral
      label: Volunteer Referral
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: volunteer_since
      label: Volunteer Since
      hint: 'Format: MM/DD/YYYY'
      type: date
      options: []
      required: false
    - id: 13
      name: last_volunteered
      label: Last Volunteered
      hint: 'Format: MM/DD/YYYY'
      type: date
      options: []
      required: false
    - id: 14
      name: volunteer_frequency
      label: Volunteer Frequency
      hint: null
      type: select_multiple
      options:
      - Occasional
      - Regular
      - As Available
      required: false
    - id: 15
      name: volunteer_hours
      label: Volunteer Hours
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: volunteer_comments
      label: Volunteer Comments
      hint: null
      type: text
      options: []
      required: false
