inputSchema:
  type: object
  properties:
    title: Character Reference Form
    pages:
    - id: 1
      name: section_reference_identity
      label: -- Reference Identity and Contact --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: reference_full_name_identity
      label: Reference Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email_for_reference
      label: Contact Email for Reference
      hint: For follow-up and verification
      type: email
      options: []
      required: true
    - id: 4
      name: reference_phone_number
      label: Reference Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: current_occupation_reference
      label: Current Occupation
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_applicant_info
      label: -- Applicant and Relationship Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: applicant_full_name_reference
      label: Applicant Full Name
      hint: Who are you providing a reference for?
      type: text
      options: []
      required: true
    - id: 8
      name: relationship_to_applicant
      label: Relationship to Applicant
      hint: Select the most accurate description
      type: select_one
      options:
      - Personal Friend
      - Family Member
      - Professional Colleague
      - Mentor or Teacher
      - Other
      required: true
    - id: 9
      name: duration_of_relationship
      label: How long have you known the applicant?
      hint: e.g., 2 years, 10 years, Since childhood
      type: text
      options: []
      required: true
    - id: 10
      name: frequency_of_contact
      label: Frequency of Contact
      hint: How often are you in touch?
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Annually
      - Infrequently
      required: true
    - id: 11
      name: section_character_assessment
      label: -- Character and Skills Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: integrity_honesty_rating
      label: Integrity and Honesty Rating
      hint: Rate from 1 (Poor) to 5 (Excellent)
      type: number
      options: []
      required: true
    - id: 13
      name: reliability_responsibility_rating
      label: Reliability and Responsibility Rating
      hint: Rate from 1 (Poor) to 5 (Excellent)
      type: number
      options: []
      required: true
    - id: 14
      name: teamwork_collaboration_rating
      label: Teamwork and Collaboration Rating
      hint: Rate from 1 (Poor) to 5 (Excellent)
      type: number
      options: []
      required: true
    - id: 15
      name: empathy_and_compassion_rating
      label: Empathy and Compassion Rating
      hint: Rate from 1 (Poor) to 5 (Excellent)
      type: number
      options: []
      required: true
    - id: 16
      name: section_qualitative_evaluation
      label: -- Qualitative Evaluation --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: major_strengths_of_applicant
      label: Major Strengths of Applicant
      hint: List 2-3 significant positive traits
      type: text
      options: []
      required: true
    - id: 18
      name: areas_for_growth_applicant
      label: Areas for Growth or Improvement
      hint: What might the applicant work on?
      type: text
      options: []
      required: true
    - id: 19
      name: general_character_comment_summary
      label: General Character Comment Summary
      hint: Provide a brief summary of the applicant's character
      type: text
      options: []
      required: true
    - id: 20
      name: section_final_recommendation
      label: -- Final Recommendation --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: final_recommendation_status
      label: Final Recommendation Status
      hint: Would you recommend this applicant for the role?
      type: select_one
      options:
      - Highly Recommend
      - Recommend
      - Recommend with Reservations
      - Do Not Recommend
      required: true
    - id: 22
      name: accuracy_confirmation_reference_taker
      label: Confirmation of Reference Details
      hint: I confirm that I am providing my honest and fair feedback
      type: select_one
      options:
      - I Confirm and Submit Reference
      - Other
      required: true
    - id: 23
      name: date_of_reference_log_submission
      label: Date of Submission
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 24
      name: additional_comments_reference
      label: Additional Comments or Information
      hint: Any other relevant information or context
      type: text
      options: []
      required: false
