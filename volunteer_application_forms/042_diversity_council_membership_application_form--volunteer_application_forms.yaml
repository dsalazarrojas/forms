inputSchema:
  type: object
  properties:
    title: Diversity Council Membership Application Form
    pages:
    - id: 1
      name: first_page
      label: Form Instructions
      hint: This is the first page of the application form.
      type: text
      options: []
      required: false
    - id: 2
      name: member_information
      label: Member Information
      hint: Please enter your first and last name.
      type: text
      options: []
      required: true
    - id: 3
      name: position
      label: Position
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: skills
      label: Skills
      hint: Select multiple skills you possess.
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: date
      label: Available Date
      hint: When are you available for a meeting or event?
      type: date
      options: []
      required: false
    - id: 6
      name: time
      label: Preferred Time
      hint: What time would you prefer for a meeting or event?
      type: time
      options: []
      required: false
    - id: 7
      name: email
      label: Email Address
      hint: Please enter your email address.
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: Phone Number
      hint: Please enter your phone number.
      type: text
      options: []
      required: true
    - id: 9
      name: committee
      label: Committee
      hint: Would you like to join a committee?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: interests
      label: Interests
      hint: Select multiple interests you have.
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: note
      label: Note
      hint: Add any additional comments or notes.
      type: note
      options: []
      required: false
