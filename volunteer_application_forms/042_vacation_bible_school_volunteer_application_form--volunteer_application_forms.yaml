inputSchema:
  type: object
  properties:
    title: Vacation Bible School Volunteer Application Form
    pages:
    - id: 1
      name: volunteer_application_form
      label: Volunteer Information
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: A valid email address
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: A valid phone number
      type: text
      options: []
      required: false
    - id: 5
      name: role
      label: Role
      hint: What role are you interested in?
      type: select_one
      options:
      - Teacher
      - Helper
      - Helper/Teacher
      required: true
    - id: 6
      name: available_hours
      label: Available Hours
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: volunteer_hours
      label: Volunteer Hours
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: available_date
      label: Available Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: volunteer_start_date
      label: Volunteer Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: volunteer_end_date
      label: Volunteer End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: volunteer_status
      label: Volunteer Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
    - id: 14
      name: volunteer_activity
      label: Volunteer Activity
      hint: null
      type: select_one
      options:
      - Bible Study
      - Music
      - Teaching
      - Games
      - Snack Service
      - Arts & Crafts
      - Other (please describe)
      required: true
    - id: 15
      name: bio
      label: Volunteer Bio
      hint: A brief bio
      type: text
      options: []
      required: false
