inputSchema:
  type: object
  properties:
    title: Montessori School Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: parental_consent
      label: Parental Consent
      hint: null
      type: select_one
      options:
      - I give my consent for my child to attend this school
      - I do not give my consent for my child to attend this school
      required: true
    - id: 8
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_contact_number
      label: Emergency Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: medical_conditions
      label: Medical Conditions
      hint: null
      type: select_multiple
      options:
      - Diabetes
      - Asthma
      - Allergies
      - Epilepsy
      - Other
      required: false
    - id: 12
      name: school_attended
      label: School Attended
      hint: null
      type: select_one
      options:
      - ABC School
      - DEF School
      - GHI School
      - JKL School
      - Other
      required: true
    - id: 13
      name: contact_method
      label: Contact Method
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
