      - Master of Theology
      - Master of Divinity
      - Certificate program
      - Doctoral program
      - Other program
      required: true
    - id: 29
      name: major_field
      label: Preferred Field of Study
      hint: Major or concentration
      type: select_one
      options:
      - Biblical Studies
      - Theology
      - Pastoral Studies
      - Missions
      - Christian Education
      - Counseling
      - Church History
      - Practical Theology
      required: true
    - id: 30
      name: start_semester
      label: Desired Start Semester
      hint: When do you want to begin?
      type: select_one
      options:
      - Fall semester
      - Spring semester
      - Summer session
      - Flexible
      required: true
    - id: 31
      name: section_header_essay
      label: -- Application Essay --
      hint: null
      type: note
      options: []
      required: false
    - id: 32
      name: statement_purpose
      label: Statement of Purpose
      hint: Why do you want to attend this university?
      type: text
      options: []
      required: true
    - id: 33
      name: additional_information
      label: Additional Information
      hint: Anything else we should know?
      type: text
      options: []
      required: false
