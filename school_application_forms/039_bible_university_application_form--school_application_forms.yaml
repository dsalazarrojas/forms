      name: faith_background
      label: Religious or Faith Background
      hint: Describe your faith journey
      type: text
      options: []
      required: true
    - id: 24
      name: church_affiliation
      label: Church or Faith Community Affiliation
      hint: Your current community
      type: text
      options: []
      required: true
    - id: 25
      name: conversion_story
      label: Brief Testimony or Conversion Story
      hint: Your faith experience
      type: text
      options: []
      required: true
