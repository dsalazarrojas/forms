      type: select_one
      options:
      - Pastoral ministry
      - Missions
      - Biblical scholarship
      - Educational ministry
      - Counseling ministry
      - Personal enrichment
      - Other ministry
      required: true
    - id: 27
      name: section_header_program
      label: -- Program Selection --
      hint: null
      type: note
      options: []
      required: false
