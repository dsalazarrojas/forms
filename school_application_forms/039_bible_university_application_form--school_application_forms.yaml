      name: high_school_graduation
      label: Graduation Year
      hint: When did you graduate?
      type: text
      options: []
      required: true
    - id: 18
      name: high_school_gpa
      label: High School GPA
      hint: Grade Point Average
      type: number
      options: []
      required: false
    - id: 19
      name: college_experience
      label: Prior College or University Experience
      hint: Have you attended college?
      type: select_one
      options:
      - Yes, completed degree
      - Yes, some college
      - Yes, currently enrolled
      - No prior college
      required: true
    - id: 20
      name: previous_institution
      label: Previous Institution Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 21
      name: previous_gpa
      label: College GPA
      hint: If applicable
      type: number
      options: []
      required: false
