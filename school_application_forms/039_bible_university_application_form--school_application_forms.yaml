    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: middle_name
      label: Middle Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: Month - Day - Year
      type: date
      options: []
      required: true
    - id: 6
      name: citizenship
      label: Citizenship
      hint: Country of citizenship
      type: text
      options: []
      required: true
    - id: 7
      name: section_header_contact
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
