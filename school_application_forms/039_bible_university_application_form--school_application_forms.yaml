      name: postal_code
      label: Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: country
      label: Country
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: section_header_education
      label: -- Educational Background --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: high_school_name
      label: High School or Secondary School
      hint: Name of institution
      type: text
      options: []
      required: true
