      name: degree_level
      label: Degree Level
      hint: What level of degree are you pursuing?
      type: select_one
      options:
      - Certificate
      - Diploma
      - Associate
      - Bachelor's
      - Master's
      - Doctorate
      - Other
      required: true
    - id: 13
      name: start_term
      label: Start Term
      hint: Which term do you wish to start?
      type: select_one
      options:
      - Fall
      - Spring
      - Summer
      - Winter
      - Other
      required: true
    - id: 14
      name: start_year
      label: Start Year
      hint: What year do you wish to start?
      type: number
      options: []
      required: true
    - id: 15
      name: reason_for_admission
