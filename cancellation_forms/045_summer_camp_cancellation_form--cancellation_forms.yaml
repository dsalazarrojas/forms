inputSchema:
  type: object
  properties:
    title: Summer Camp Cancellation Form
    pages:
    - id: 1
      name: parent_request
      label: Parent Request
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: reason_select
      label: Parent Reason
      hint: null
      type: select_one
      options:
      - Cancellation due to change of schedule
      - Cancellation due to family emergency
      - Cancellation due to personal issue
      required: false
    - id: 3
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: parent_response
      label: Parent Response
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: staff
      label: Staff
      hint: null
      type: select_one
      options:
      - Jimmy
      - John
      - Jane
      required: true
    - id: 7
      name: reason
      label: Reason
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
