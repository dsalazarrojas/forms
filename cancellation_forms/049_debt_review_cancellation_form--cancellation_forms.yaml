inputSchema:
  type: object
  properties:
    title: Debt Review Cancellation Form
    pages:
    - id: 1
      name: debt_review_cancellation_form
      label: Debt Review Cancellation
      hint: null
      type: select_one
      options:
      - Cancel
      - Continue
      required: true
    - id: 2
      name: reason_for_cancellation
      label: Reason for Cancellation
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: dispute_with_counselor
      label: Dispute with Counselor
      hint: null
      type: select_multiple
      options:
      - Error in debt review process
      - Misrepresentation by debt counselor
      - Other
      required: false
    - id: 4
      name: dispute_with_agency
      label: Dispute with Agency
      hint: null
      type: select_multiple
      options:
      - Error in debt review process
      - Misrepresentation by agency
      - Other
      required: false
    - id: 5
      name: error_in_enrollment
      label: Error in Debt Review Enrollment
      hint: Please provide details
      type: text
      options: []
      required: true
    - id: 6
      name: resolution
      label: Resolution
      hint: null
      type: select_one
      options:
      - Cancel debt review
      - Re-enroll in debt review
      required: true
