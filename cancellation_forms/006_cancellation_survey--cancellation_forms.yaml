inputSchema:
  type: object
  properties:
    title: Cancellation Survey
    pages:
    - id: 1
      name: intro_header
      label: -- Service Cancellation Survey --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: intro_text
      label: We would like to understand your reasons for cancelling. Your feedback
        helps us improve our services.
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: customer_info_header
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: full_name
      label: Full Name
      hint: Your name
      type: text
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: Your email
      type: email
      options: []
      required: true
    - id: 6
      name: customer_id
      label: Customer or Account ID (if available)
      hint: Optional
      type: text
      options: []
      required: false
    - id: 7
      name: cancellation_info_header
      label: -- Cancellation Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: service_type
      label: What service are you cancelling?
      hint: Select one
      type: select_one
      options:
      - Monthly Subscription
      - Annual Subscription
      - Premium Plan
      - Basic Plan
      - Additional Feature/Add-on
      - Other Service
      required: true
    - id: 9
      name: cancellation_date
      label: When did you cancel?
      hint: Approximate date
      type: date
      options: []
      required: true
    - id: 10
      name: subscription_duration
      label: How long were you a customer?
      hint: Select one
      type: select_one
      options:
      - Less than 1 month
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - 1-2 years
      - 2-5 years
      - More than 5 years
      required: true
    - id: 11
      name: reasons_section
      label: -- Reasons for Cancellation --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: primary_reason
      label: What is the primary reason for your cancellation?
      hint: Select the main reason
      type: select_one
      options:
      - Too expensive
      - Found a better alternative
      - Service did not meet expectations
      - Not using the service
      - Poor customer support
      - Technical issues
      - Personal/Financial reasons
      - Switching to competitor
      - Other reason
      required: true
    - id: 13
      name: specific_issues
      label: If applicable, which issues frustrated you most?
      hint: Select all that apply
      type: select_multiple
      options:
      - High pricing
      - Limited features
      - Poor user interface
      - Slow performance
      - Unresponsive support
      - Billing problems
      - Unexpected charges
      - Privacy concerns
      - Reliability issues
      - Competitor was better
      required: false
    - id: 14
      name: satisfaction_section
      label: -- Service Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: overall_satisfaction
      label: How satisfied were you with our service overall?
      hint: Rate your satisfaction
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 16
      name: feature_satisfaction
      label: How well did our service meet your needs?
      hint: Rate your experience
      type: select_one
      options:
      - Exceeded expectations
      - Met expectations
      - Partially met expectations
      - Did not meet expectations
      required: false
    - id: 17
      name: support_satisfaction
      label: How would you rate our customer support?
      hint: Rate the support experience
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: false
    - id: 18
      name: improvements_section
      label: -- Feedback and Improvements --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: improvement_suggestions
      label: What could we have done better?
      hint: Please share your suggestions
      type: text
      options: []
      required: false
    - id: 20
      name: would_return
      label: Would you consider returning to our service in the future?
      hint: Select one
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Undecided
      - Probably not
      - Definitely not
      required: false
    - id: 21
      name: return_conditions
      label: What would need to change for you to return?
      hint: Optional - if applicable
      type: text
      options: []
      required: false
    - id: 22
      name: contact_section
      label: -- Follow-Up --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: contact_permission
      label: May we follow up with you about this feedback?
      hint: Select one
      type: select_one
      options:
      - Yes, email me
      - Yes, call me
      - No, thank you
      required: false
    - id: 24
      name: phone_number
      label: Phone Number (if you want follow-up)
      hint: Optional
      type: text
      options: []
      required: false
