inputSchema:
  type: object
  properties:
    title: Children's Charity Fun Run Sponsorship Form
    pages:
    - id: 1
      name: participant_info
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: Child runner name
      type: text
      options: []
      required: true
    - id: 3
      name: participant_age
      label: Participant Age
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: school_class
      label: School or Class
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: parent_guardian
      label: Parent or Guardian Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: parent_email
      label: Parent Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: parent_phone
      label: Parent Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: event_info
      label: -- Event Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: event_date
      label: Fun Run Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: charity_name
      label: Charity or Organization Supported
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: pledge_section
      label: -- Sponsorship Pledges --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: pledge_type
      label: Sponsorship Type
      hint: null
      type: select_one
      options:
      - Per mile pledge
      - Flat donation
      - Corporate sponsorship
      required: true
    - id: 14
      name: pledge_amount
      label: Pledge Amount
      hint: Dollars per mile or total amount
      type: number
      options: []
      required: true
    - id: 15
      name: estimated_miles
      label: Estimated miles to be run
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: estimated_total
      label: Estimated total pledge
      hint: Calculated amount
      type: number
      options: []
      required: false
    - id: 17
      name: sponsor_info
      label: -- Sponsor Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: sponsor_name
      label: Sponsor Name
      hint: Individual or company name
      type: text
      options: []
      required: true
    - id: 19
      name: sponsor_address
      label: Sponsor Address
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: sponsor_phone
      label: Sponsor Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: sponsor_email
      label: Sponsor Email
      hint: null
      type: email
      options: []
      required: true
    - id: 22
      name: payment_section
      label: -- Payment Method --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: payment_method
      label: Preferred Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Check
      - Credit Card
      - Bank Transfer
      - Online Payment
      required: true
    - id: 24
      name: payment_timing
      label: When will pledge be paid
      hint: null
      type: select_one
      options:
      - On event day
      - Within one week
      - Within two weeks
      - End of month
      required: true
    - id: 25
      name: recognition
      label: Yes, recognize my sponsorship publicly
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
