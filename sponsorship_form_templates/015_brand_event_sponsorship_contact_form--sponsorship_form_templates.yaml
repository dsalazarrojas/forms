inputSchema:
  type: object
  properties:
    title: Brand Event Sponsorship Contact Form
    pages:
      - id: 1
        name: sponsor_name
        label: Sponsor name
        hint: Company or individual name
        type: text
        options: []
        required: true
      - id: 2
        name: contact_person
        label: Contact person
        hint: Name of sponsorship contact
        type: text
        options: []
        required: true
      - id: 3
        name: contact_email
        label: Contact email
        hint: Email for sponsorship correspondence
        type: email
        options: []
        required: true
      - id: 4
        name: sponsorship_interest_level
        label: Sponsorship interest level
        hint: General level of interest
        type: select_one
        options:
          - Title sponsor
          - Major sponsor
          - Supporting sponsor
          - In-kind sponsor
        required: true
      - id: 5
        name: budget_capacity
        label: Budget capacity
        hint: Approximate budget available
        type: text
        options: []
        required: false
      - id: 6
        name: activation_ideas
        label: Activation ideas
        hint: How sponsor would like to be visible at event
        type: text
        options: []
        required: false
      - id: 7
        name: timeline
        label: Timeline
        hint: Key dates or deadlines
        type: text
        options: []
        required: false
      - id: 8
        name: follow_up_preference
        label: Follow up preference
        hint: Preferred contact method
        type: select_one
        options:
          - Email
          - Phone
          - Meeting
        required: false
