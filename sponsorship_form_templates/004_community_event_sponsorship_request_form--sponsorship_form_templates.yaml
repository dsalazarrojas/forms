inputSchema:
  type: object
  properties:
    title: Community Event Sponsorship Request Form
    pages:
      - id: 1
        name: sponsor_contact
        label: -- Sponsor Contact Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: sponsor_name
        label: Sponsor name
        hint: Company or individual name
        type: text
        options: []
        required: true
      - id: 3
        name: contact_person
        label: Contact person full name
        hint: Primary contact at sponsoring organization
        type: text
        options: []
        required: true
      - id: 4
        name: contact_email
        label: Contact email
        hint: For sponsorship agreements
        type: email
        options: []
        required: true
      - id: 5
        name: sponsorship_level
        label: Preferred sponsorship level
        hint: Choose the package level
        type: select_one
        options:
          - Platinum
          - Gold
          - Silver
          - Bronze
          - Custom
        required: true
      - id: 6
        name: contribution_type
        label: Contribution type
        hint: Monetary, in kind, or services
        type: select_one
        options:
          - Monetary
          - In kind
          - Services
          - Combination
        required: true
      - id: 7
        name: amount_or_description
        label: Amount or description of in kind support
        hint: Enter dollar amount or item description
        type: text
        options: []
        required: true
      - id: 8
        name: recognition_preferences
        label: Recognition preferences
        hint: How sponsor wants to be acknowledged
        type: text
        options: []
        required: false
      - id: 9
        name: agreement_summary
        label: Agreement summary
        hint: Any special terms or conditions
        type: text
        options: []
        required: false
      - id: 10
        name: signature_name
        label: Authorized signature name
        hint: Name of person signing on behalf of sponsor
        type: text
        options: []
        required: true
