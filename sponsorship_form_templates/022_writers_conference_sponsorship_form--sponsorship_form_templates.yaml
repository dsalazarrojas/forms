inputSchema:
  type: object
  properties:
    title: Writers Conference Sponsorship Form
    pages:
    - id: 1
      name: sponsor_details
      label: Sponsor Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: package_selection
      label: Package Selection
      hint: null
      type: select_one
      options:
      - Bronze
      - Silver
      - Gold
      required: true
    - id: 3
      name: recognition_preferences
      label: Recognition Preferences
      hint: null
      type: select_multiple
      options:
      - Logo on Conference Materials
      - Social Media Promotion
      - Website Promotion
      - Verbal Recognition
      - Press Release
      required: true
    - id: 4
      name: sponsor_signature
      label: Sponsor Signature
      hint: null
      type: note
      options: []
      required: true
