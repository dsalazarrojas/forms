      - Fiscal Sponsor with 501(c)(3) status
      - Other Tax-Exempt Status
      required: true
    - id: 29
      name: section_narrative
      label: '--- Narrative Questions ---'
      hint: Detailed responses for grant consideration
      type: note
      options: []
      required: false
