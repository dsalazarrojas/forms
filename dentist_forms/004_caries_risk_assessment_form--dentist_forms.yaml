      name: clinical_risk_factors
      label: -- Clinical Risk Factors --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: visible_cavities
      label: Any visible cavities in past 12 months?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Uncertain
      required: true
    - id: 8
      name: white_spot_lesions
      label: White spot lesions (early demineralization)?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Uncertain
      required: true
    - id: 9
      name: existing_restorations
      label: Existing fillings or restorations
      hint: null
      type: select_one
      options:
