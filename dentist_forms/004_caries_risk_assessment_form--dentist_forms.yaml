      name: patient_information_section
      label: -- Patient Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: patient_dob
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 4
      name: patient_age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: assessment_date
      label: Assessment Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
