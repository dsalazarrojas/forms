      - Multiple (3 or more)
      required: true
    - id: 10
      name: gum_disease
      label: Signs of gum disease or gingivitis
      hint: null
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      required: true
    - id: 11
      name: plaque_buildup
      label: Visible plaque or biofilm on teeth
      hint: null
      type: select_one
      options:
      - Minimal
      - Moderate
      - Extensive
      required: true
    - id: 12
      name: behavioral_risk_factors
      label: -- Behavioral Risk Factors --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: brushing_frequency
      label: How often do you brush your teeth daily?
      hint: null
      type: select_one
      options:
      - Three or more times
      - Twice daily
      - Once daily
      - Less than once daily
      required: true
    - id: 14
      name: uses_fluoride
      label: Do you use fluoride toothpaste or rinse?
      hint: null
      type: select_one
      options:
