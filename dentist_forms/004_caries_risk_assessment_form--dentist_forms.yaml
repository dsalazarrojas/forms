      - Occasionally
      - Never
      - Uncertain
      required: true
    - id: 15
      name: flosses_regularly
      label: Do you floss between teeth?
      hint: null
      type: select_one
      options:
      - Daily
      - Several times per week
      - Weekly
      - Rarely
      - Never
      required: true
    - id: 16
      name: dietary_risk_factors
      label: -- Dietary Risk Factors --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: sugary_drinks
      label: Frequency of sugary drinks consumption
      hint: null
      type: select_one
      options:
      - Never or rarely
      - A few times per week
      - Daily
      - Multiple times daily
      required: true
    - id: 18
      name: snacking_frequency
      label: How often do you snack between meals?
      hint: null
      type: select_one
      options:
      - Rarely
      - A few times per week
      - Daily
      - Multiple times per day
      required: true
    - id: 19
      name: sticky_foods
      label: Frequent consumption of sticky or sugary foods
      hint: null
      type: select_one
      options:
