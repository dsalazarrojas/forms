      name: professional_fluoride
      label: Received professional fluoride treatment in past year?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Uncertain
      required: true
    - id: 22
      name: water_fluoridation
      label: Does your water supply contain fluoride?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Uncertain
      required: true
    - id: 23
      name: risk_assessment_summary
      label: -- Risk Assessment Summary --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: overall_caries_risk
      label: Overall Caries Risk Level
      hint: Based on all factors assessed
      type: select_one
      options:
