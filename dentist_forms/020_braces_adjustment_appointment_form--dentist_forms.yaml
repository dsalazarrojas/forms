inputSchema:
  type: object
  properties:
    title: Braces Adjustment Appointment Form
    pages:
    - id: 1
      name: section_header_patient
      label: -- Patient Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 4
      name: patient_email
      label: Email Address
      hint: For appointment confirmations
      type: email
      options: []
      required: true
    - id: 5
      name: patient_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 6
      name: section_header_appointment
      label: -- Appointment Scheduling --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: preferred_date
      label: Preferred Appointment Date
      hint: When would you like to come in
      type: date
      options: []
      required: true
    - id: 8
      name: preferred_time
      label: Preferred Time
      hint: Morning or afternoon
      type: time
      options: []
      required: true
    - id: 9
      name: appointment_duration
      label: Estimated Duration Needed
      hint: Length of appointment
      type: select_one
      options:
      - 30 minutes
      - 45 minutes
      - 1 hour
      - 1.5 hours
      - Unsure
      required: false
    - id: 10
      name: section_header_ortho
      label: -- Orthodontic Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: treatment_type
      label: Current Braces Type
      hint: What type of braces you have
      type: select_one
      options:
      - Traditional metal
      - Ceramic
      - Lingual
      - Aligners (clear)
      - Other
      required: true
    - id: 12
      name: treatment_duration
      label: How Long Have You Had Braces
      hint: Months or years
      type: text
      options: []
      required: false
    - id: 13
      name: last_adjustment_date
      label: Date of Last Adjustment
      hint: When was your last appointment
      type: date
      options: []
      required: false
    - id: 14
      name: section_header_concerns
      label: -- Patient Concerns --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: patient_concerns
      label: Current Concerns or Issues
      hint: Any pain, discomfort, or breakage
      type: select_multiple
      options:
      - Pain or soreness
      - Broken bracket
      - Loose wire
      - Food trap
      - Bleeding gums
      - Discoloration
      - No concerns
      required: false
    - id: 16
      name: additional_concerns
      label: Detailed Description of Concerns
      hint: Provide more information
      type: text
      options: []
      required: false
    - id: 17
      name: section_header_care
      label: -- Oral Care and Habits --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: brushing_frequency
      label: How Often Do You Brush
      hint: Daily brushing habits
      type: select_one
      options:
      - Once daily
      - Twice daily
      - Three times daily
      - After every meal
      - Irregular
      required: false
    - id: 19
      name: flossing_frequency
      label: How Often Do You Floss
      hint: Daily flossing habits
      type: select_one
      options:
      - Daily
      - Several times weekly
      - Weekly
      - Rarely
      - Never
      required: false
    - id: 20
      name: section_header_consent
      label: -- Appointment Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: appointment_confirmation
      label: I confirm my appointment request
      hint: Check to schedule appointment
      type: select_one
      options:
      - Confirmed
      - Pending approval
      required: true
