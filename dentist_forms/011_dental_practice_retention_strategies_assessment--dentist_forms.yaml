inputSchema:
  type: object
  properties:
    title: Dental Practice Retention Strategies Assessment
    pages:
    - id: 1
      name: patient_identification
      label: Patient Identification
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: current_retention_efforts
      label: Current Retention Efforts
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      required: false
    - id: 3
      name: retention_efforts_rating
      label: Retention Efforts Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: comparison_with_others
      label: Comparison with Others
      hint: null
      type: select_one
      options:
      - Above
      - Average
      - Below
      required: false
    - id: 5
      name: improvement_strategies
      label: Improvement Strategies
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: current_strategies_used
      label: Current Strategies Used
      hint: null
      type: select_multiple
      options:
      - Regularly Review Schedules
      - Respond to Online Reviews
      - Use Social Media
      - Other (Specify)
      required: false
    - id: 7
      name: effectiveness_of_current_strategies
      label: Effectiveness of Current Strategies
      hint: null
      type: select_one
      options:
      - Very Effective
      - Somewhat Effective
      - Not Very Effective
      required: false
    - id: 8
      name: areas_for_improvement
      label: Areas for Improvement
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: suggestions_for_improvement
      label: Suggestions for Improvement
      hint: null
      type: text
      options: []
      required: false
