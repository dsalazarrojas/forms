inputSchema:
  type: object
  properties:
    title: Denture Processing Checklist
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: patient_info
      label: Patient Info
      hint: null
      type: select_one
      options:
      - Patient Name
      - Date of Birth
      - ID Number
      - Address
      - Phone Number
      - Email
      required: false
    - id: 3
      name: dental_history
      label: Dental History
      hint: null
      type: select_multiple
      options:
      - Dental Insurance
      - Dental Coverage
      - Dental Coverage Type
      required: false
    - id: 4
      name: impression_info
      label: Impression Info
      hint: null
      type: select_one
      options:
      - Impression Material
      - Impression Type
      - Impression Size
      required: true
    - id: 5
      name: fabrication_info
      label: Fabrication Info
      hint: null
      type: select_one
      options:
      - Fabrication Method
      - Fabrication Type
      - Fabrication Date
      required: true
    - id: 6
      name: quality_control
      label: Quality Control
      hint: null
      type: select_multiple
      options:
      - Quality Check
      - Quality Issue
      - Quality Status
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
