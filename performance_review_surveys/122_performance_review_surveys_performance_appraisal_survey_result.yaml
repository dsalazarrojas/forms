title: Performance appraisal survey
description: Generate a Performance appraisal survey survey for the "Performance review surveys" category. Use the template name: "Performance appraisal survey template".
questions:
  - text: Overall, how satisfied are you with performance appraisal survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Performance, Appraisal, Survey, Review]
  - text: How often do you interact with performance appraisal survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
