title: Employee performance survey
description: Generate a Employee performance survey survey for the "Performance review surveys" category. Use the template name: "Employee performance survey template".
questions:
  - text: Overall, how satisfied are you with employee performance survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Employee, Performance, Survey, Review]
  - text: How often do you interact with employee performance survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
