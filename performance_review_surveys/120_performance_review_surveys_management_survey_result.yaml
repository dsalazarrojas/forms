title: Management survey
description: Generate a Management survey survey for the "Performance review surveys" category. Use the template name: "Management survey template".
questions:
  - text: Overall, how satisfied are you with management survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Management, Survey, Performance, Review]
  - text: How often do you interact with management survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
