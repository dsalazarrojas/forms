title: 360 degree feedback form
description: Generate a 360 degree feedback form survey for the "Performance review surveys" category. Use the template name: "360 degree feedback form template".
questions:
  - text: Overall, how satisfied are you with 360 degree feedback form?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Degree, Feedback, Form, Performance]
  - text: How often do you interact with 360 degree feedback form?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
