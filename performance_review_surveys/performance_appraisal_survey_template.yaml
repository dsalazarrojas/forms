description: Gather feedback on the effectiveness and experience of our performance
  appraisal process.
questions:
- options:
  - Very satisfied
  - Satisfied
  - Neutral
  - Dissatisfied
  - Very dissatisfied
  text: How satisfied are you with the overall performance appraisal process?
  type: single
- options:
  - Annually
  - Bi-annually
  - Quarterly
  - Less often
  - Never
  text: How often do you participate in performance appraisals (as appraiser or appraisee)?
  type: single
- options:
  - Clear expectations
  - Fair assessment
  - Constructive feedback
  - Goal-oriented
  - Time-consuming
  - Stressful
  - Not helpful
  text: Which of the following describe your experience with the performance appraisal
    process? (select all that apply)
  type: multiple
- text: What specific improvements would you suggest for the performance appraisal
    process?
  type: text
- text: Do you have any additional comments or feedback regarding performance reviews?
  type: text
title: Performance appraisal survey
