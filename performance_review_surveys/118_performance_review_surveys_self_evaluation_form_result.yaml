title: Self evaluation form
description: Generate a Self evaluation form survey for the "Performance review surveys" category. Use the template name: "Self evaluation form template".
questions:
  - text: Overall, how satisfied are you with self evaluation form?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Self, Evaluation, Form, Performance]
  - text: How often do you interact with self evaluation form?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
