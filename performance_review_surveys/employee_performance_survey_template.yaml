description: Gathering feedback on employee performance, satisfaction, and development.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: Overall, how satisfied are you with your role at the organization?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  text: How would you rate communication from management?
  type: single
- options:
  - true
  - false
  - Somewhat
  text: Do you feel supported in your professional development?
  type: single
- options:
  - Project work
  - Team collaboration
  - Learning new skills
  - Client interaction
  - Problem-solving
  text: Which aspects of your role do you find most engaging? (Select all that apply)
  type: multiple
- options:
  - Always
  - Often
  - Sometimes
  - Rarely
  - Never
  text: Do you feel recognized for your contributions?
  type: single
- text: What could improve your overall experience at work?
  type: text
- text: Do you have any additional comments or suggestions?
  type: text
title: Employee performance survey
