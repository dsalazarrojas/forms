inputSchema:
  type: object
  properties:
    title: Student Peer Evaluation Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: evaluation_time
      label: Evaluation Time
      hint: null
      type: time
      options: []
      required: true
    - id: 3
      name: rating_scale
      label: Rating Scale
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Unresponsive
      required: true
    - id: 4
      name: student_contribution
      label: Student Contribution
      hint: null
      type: select_multiple
      options:
      - Communication
      - Teamwork
      - Time Management
      - Leadership
      - Problem Solving
      - Adaptability
      - Creativity
      - Organization
      required: true
    - id: 5
      name: overall_evaluation
      label: Overall Evaluation
      hint: null
      type: select_one
      options:
      - Satisfactory
      - Needs Improvement
      - Needs Significant Improvement
      required: true
    - id: 6
      name: feedback
      label: Feedback
      hint: null
      type: note
      options: []
      required: true
    - id: 7
      name: student_attendance
      label: Student Attendance
      hint: null
      type: select_one
      options:
      - Attends all sessions
      - Attends some sessions
      - Misses some sessions
      - Rarely attends
      required: true
    - id: 8
      name: student_demeanor
      label: Student Demeanor
      hint: null
      type: select_multiple
      options:
      - Punctual
      - Respectful
      - Positive attitude
      - Helpful
      - Cooperative
      - Independent
      - Flexible
      required: true
    - id: 9
      name: student_work
      label: Student Work
      hint: null
      type: select_one
      options:
      - Completes all tasks
      - Completes most tasks
      - Completes some tasks
      - Rarely completes tasks
      required: true
    - id: 10
      name: student_communication
      label: Student Communication
      hint: null
      type: select_one
      options:
      - Good communication
      - Fair communication
      - Poor communication
      required: false
