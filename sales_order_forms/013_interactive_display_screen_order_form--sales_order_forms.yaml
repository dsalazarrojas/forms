inputSchema:
  type: object
  properties:
    title: Interactive Display Screen Order Form
    pages:
    - id: 1
      name: customer_information
      label: What is the customer's name?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_notes
      label: What are the customer's notes?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: order_details
      label: What is the order date and time?
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: order_status
      label: What is the order status?
      hint: null
      type: select_one
      options:
      - New
      - In Progress
      - Delivered
      - Cancelled
      required: true
    - id: 5
      name: payment_method
      label: What is the payment method?
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: true
    - id: 6
      name: customer_address
      label: What is the customer's address?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: delivery_details
      label: What is the delivery information?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: payment_details
      label: What is the payment information?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: customer_acceptance
      label: Is the customer accepting the terms and conditions?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 10
      name: delivery_notes
      label: What are the delivery notes?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: payment_confirmation
      label: What is the payment confirmation?
      hint: null
      type: text
      options: []
      required: false
