inputSchema:
  type: object
  properties:
    title: Smart Safety Helmet Order Form
    pages:
    - id: 1
      name: shipping_details
      label: Shipping Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: delivery_preferences
      label: Delivery Preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: product_options
      label: Product Options
      hint: null
      type: select_multiple
      options:
      - Smart Helmet 1
      - Smart Helmet 2
      - Smart Helmet 3
      required: true
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Stripe
      - PayPal
      required: true
    - id: 9
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
