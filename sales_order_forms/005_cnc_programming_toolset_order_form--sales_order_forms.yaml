inputSchema:
  type: object
  properties:
    title: CNC Programming Toolset Order Form
    pages:
    - id: 1
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: order_number
      label: Order Number
      hint: Auto-generated system ID
      type: text
      options: []
      required: false
    - id: 3
      name: customer_name
      label: Customer Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: customer_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: customer_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: toolset_package
      label: CNC Programming Toolset Package
      hint: null
      type: select_one
      options:
      - Beginner Package
      - Professional Package
      - Enterprise Package
      - Custom Package
      required: true
    - id: 8
      name: software_components
      label: Software Components Needed
      hint: Select all required components
      type: select_multiple
      options:
      - CAM Software
      - G-Code Generator
      - Machine Simulator
      - Post-Processor
      - Tool Management Module
      - Documentation
      required: true
    - id: 9
      name: quantity
      label: Quantity of Toolsets
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: machine_type
      label: Machine Types Supported
      hint: Select all applicable
      type: select_multiple
      options:
      - Mill
      - Lathe
      - Router
      - Wire EDM
      - Plasma Cutter
      - Multi-axis Machine
      required: true
    - id: 11
      name: training_required
      label: Training and Support Required
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: training_type
      label: Type of Training
      hint: null
      type: select_one
      options:
      - Online training videos
      - Live webinar training
      - On-site training
      - Manual documentation only
      required: false
    - id: 13
      name: billing_address
      label: Billing Address
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: shipping_method
      label: Preferred Shipping Method
      hint: null
      type: select_one
      options:
      - Standard Shipping
      - Expedited Shipping
      - Overnight Shipping
      - Digital Download Only
      required: true
    - id: 16
      name: po_number
      label: Purchase Order Number
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Bank Transfer
      - Check
      - Purchase Order
      required: true
    - id: 18
      name: special_requests
      label: Special Requests or Notes
      hint: null
      type: text
      options: []
      required: false
