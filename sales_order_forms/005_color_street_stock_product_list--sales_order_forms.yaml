inputSchema:
  type: object
  properties:
    title: Color Street Stock Product List
    pages:
    - id: 1
      name: sales_rep_name
      label: Sales Representative Name
      hint: Name of the sales representative
      type: text
      options: []
      required: true
    - id: 2
      name: order_date
      label: Order Date
      hint: Date of the sales order
      type: date
      options: []
      required: true
    - id: 3
      name: customer_name
      label: Customer Name
      hint: Name of the purchasing customer
      type: text
      options: []
      required: true
    - id: 4
      name: customer_email
      label: Customer Email
      hint: Customer email address
      type: email
      options: []
      required: true
    - id: 5
      name: section_header_stock_products
      label: -- Stock Product Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: classic_collection_items
      label: Classic Collection Items
      hint: Select classic collection products
      type: select_multiple
      options:
      - Simply Red
      - Nude Attitude
      - Pink Champagne
      - Black Magic
      - French Kiss
      - White Wedding
      required: true
    - id: 7
      name: glitter_collection_items
      label: Glitter Collection Items
      hint: Select glitter collection products
      type: select_multiple
      options:
      - Disco Doll
      - Gold Rush
      - Silver Screen
      - Glitterbug
      - Sparkle Party
      - Diamond Dreams
      required: true
    - id: 8
      name: matte_collection_items
      label: Matte Collection Items
      hint: Select matte collection products
      type: select_multiple
      options:
      - Matte Black
      - Matte Navy
      - Matte Burgundy
      - Matte Olive
      - Matte Mauve
      required: false
    - id: 9
      name: shimmer_collection_items
      label: Shimmer Collection Items
      hint: Select shimmer collection products
      type: select_multiple
      options:
      - Rose Gold
      - Bronze Beauty
      - Copper Glow
      - Pearl Essence
      - Moonlight Shimmer
      required: false
    - id: 10
      name: section_header_quantities
      label: -- Order Quantities --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: total_sets_ordered
      label: Total Sets Ordered
      hint: Total number of nail strip sets
      type: number
      options: []
      required: true
    - id: 12
      name: subtotal_amount
      label: Subtotal Amount
      hint: Order subtotal before tax and shipping
      type: number
      options: []
      required: true
    - id: 13
      name: discount_applied
      label: Discount Applied
      hint: Discount amount if any
      type: number
      options: []
      required: false
    - id: 14
      name: tax_amount
      label: Tax Amount
      hint: Sales tax amount
      type: number
      options: []
      required: true
    - id: 15
      name: shipping_cost
      label: Shipping Cost
      hint: Shipping and handling fee
      type: number
      options: []
      required: true
    - id: 16
      name: total_amount
      label: Total Amount
      hint: Final order total
      type: number
      options: []
      required: true
    - id: 17
      name: section_header_fulfillment
      label: -- Fulfillment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: shipping_address
      label: Shipping Address
      hint: Complete delivery address
      type: text
      options: []
      required: true
    - id: 19
      name: delivery_preference
      label: Delivery Preference
      hint: Preferred delivery timeframe
      type: select_one
      options:
      - Standard (5-7 business days)
      - Express (2-3 business days)
      - Overnight (1 business day)
      - Pick Up at Store
      required: true
    - id: 20
      name: order_notes
      label: Order Notes
      hint: Any special instructions for the order
      type: text
      options: []
      required: false
