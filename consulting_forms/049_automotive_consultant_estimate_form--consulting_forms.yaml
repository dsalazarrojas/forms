      name: vehicle_year
      label: Vehicle Year
      hint: Year
      type: number
      options: []
      required: true
    - id: 13
      name: vehicle_make
      label: Vehicle Make
      hint: Manufacturer
      type: text
      options: []
      required: true
    - id: 14
      name: vehicle_model
      label: Vehicle Model
      hint: Model
      type: text
      options: []
      required: true
    - id: 15
      name: vehicle_trim
