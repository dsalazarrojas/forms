      - $500-$1000
      - $1000-$2500
      - $2500-$5000
      - Over $5000
      - No Limit
      required: false
    - id: 32
      name: parts_preference
      label: Parts Preference
      hint: What type
      type: select_one
      options:
      - OEM Only
      - Aftermarket OK
      - Cheapest Available
      - Best Quality
      - No Preference
      required: false
    - id: 33
      name: consultant_info
      label: Consultant Information
      hint: For internal use
      type: note
      options: []
      required: false
    - id: 34
      name: assigned_consultant
      label: Assigned Consultant
      hint: Who will handle
      type: text
      options: []
      required: false
    - id: 35
      name: consultation_fee
      label: Consultation Fee
      hint: If applicable
