      name: estimate_valid
      label: Estimate Valid For
      hint: Days valid
      type: select_one
      options:
      - 7 Days
      - 14 Days
      - 30 Days
      - 60 Days
      - 90 Days
      required: false
    - id: 38
      name: labor_rate
      label: Labor Rate
      hint: Per hour
      type: number
      options: []
      required: false
    - id: 39
      name: estimated_hours
      label: Estimated Hours
      hint: Time needed
      type: number
      options: []
      required: false
    - id: 40
      name: parts_estimate
      label: Parts Estimate
      hint: Parts cost
      type: number
      options: []
      required: false
    - id: 41
      name: total_estimate
      label: Total Estimate
      hint: Total cost
      type: number
      options: []
      required: false
    - id: 42
      name: estimate_notes
      label: Estimate Notes
      hint: Additional notes
      type: text
      options: []
      required: false
    - id: 43
      name: recommendations
      label: Recommendations
      hint: Suggested actions
      type: text
      options: []
      required: false
    - id: 44
      name: priority_level
      label: Priority Level
      hint: How urgent
      type: select_one
      options:
      - Low
      - Normal
      - High
      - Critical
