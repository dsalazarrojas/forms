inputSchema:
  type: object
  properties:
    title: Automotive Consultant Estimate Form
    pages:
    - id: 1
      name: introduction
      label: Automotive Consultant Estimate Form
      hint: Request an estimate for automotive services
      type: note
      options: []
      required: false
    - id: 2
      name: customer_info
      label: Customer Information
      hint: Your details
      type: note
      options: []
      required: false
    - id: 3
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 4
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 7
      name: address
      label: Street Address
      hint: Your address
      type: text
      options: []
      required: false
    - id: 8
      name: city
