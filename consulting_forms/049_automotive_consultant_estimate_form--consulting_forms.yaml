      - Colorado
      - Connecticut
      - Delaware
      - Florida
      - Georgia
      - Other
      required: false
    - id: 10
      name: zip_code
      label: ZIP Code
      hint: 5-digit ZIP code
      type: text
      options: []
      required: false
