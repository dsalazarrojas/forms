      - While Idling
      - While Driving
      - When Braking
      - When Accelerating
      - When Turning
      - All the Time
      - Intermittent
      required: false
    - id: 24
      name: warning_lights
      label: Warning Lights
      hint: Any on dashboard
      type: select_multiple
      options:
