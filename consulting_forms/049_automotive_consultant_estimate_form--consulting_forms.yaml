      - Repair
      - Maintenance
      - Inspection
      - Consultation
      - Second Opinion
      - Pre-Purchase Inspection
      - Other
      required: true
    - id: 21
      name: problem_description
      label: Problem Description
      hint: Describe the issue
      type: text
      options: []
      required: true
