inputSchema:
  type: object
  properties:
    title: Consultancy Registration Form
    pages:
    - id: 1
      name: section_prospect_ident
      label: -- Prospect Identification --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: company_legal_name
      label: Company/Organization Legal Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: primary_contact_person
      label: Primary Contact Person
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: primary_contact_email
      label: Primary Email Address
      hint: Follow-up communication will be sent here
      type: email
      options: []
      required: true
    - id: 5
      name: primary_contact_phone
      label: Primary Phone Number
      hint: Format - (555) 555-5555
      type: text
      options: []
      required: true
    - id: 6
      name: company_website_ident
      label: Company Website
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: company_location_address
      label: Company Location (City, State, Country)
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: section_consultancy_req
      label: -- Consultancy Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: consultancy_service_needed
      label: Primary Consultancy Service Needed
      hint: Select the most appropriate category
      type: select_one
      options:
      - Management/Strategy Consulting
      - Technology/IT Transformation
      - Financial/Risk Advisory
      - Human Capital/Talent Strategy
      - Operations/Process Optimization
      - Marketing/Growth Strategy
      - Sustainability/ESG Advisory
      - Other Specialized Service
      required: true
    - id: 10
      name: primary_project_objective
      label: What is your primary project objective?
      hint: Max 1000 characters
      type: text
      options: []
      required: true
    - id: 11
      name: estimated_project_duration
      label: Estimated Project Duration
      hint: null
      type: select_one
      options:
      - Less than 1 Month (Assessment only)
      - 1-3 Months (Phase 1)
      - 3-6 Months (Standard Delivery)
      - 6-12 Months (Transformation)
      - Ongoing Partnership
      required: true
    - id: 12
      name: section_logistics_budget
      label: -- Logistics and Budget --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: estimated_project_budget
      label: Estimated Project Budget Range ($)
      hint: null
      type: select_one
      options:
      - Less than $10,000
      - $10,000 - $50,000
      - $50,000 - $100,000
      - $100,000 - $250,000
      - $250,000+
      required: true
    - id: 14
      name: project_urgency_ident
      label: How soon do you plan to start?
      hint: null
      type: select_one
      options:
      - Immediately
      - Within 1 Month
      - Within 3 Months
      - Within 6 Months
      - Planning Phase (6+ Months)
      required: true
    - id: 15
      name: preferred_engagement_model
      label: Preferred Engagement Model
      hint: null
      type: select_one
      options:
      - Time and Materials (T&M)
      - Fixed Price/Scope
      - Retainer-based
      - Performance/Success-based
      required: true
    - id: 16
      name: section_additional_info
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: referral_source_ident
      label: How did you hear about our consultancy?
      hint: null
      type: select_one
      options:
      - Website/Search Engine
      - Professional Referral
      - Conference/Event
      - Social Media (LinkedIn)
      - Advertising/PR
      - Other
      required: false
    - id: 18
      name: additional_comments_desc
      label: Any additional details you'd like to share
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: registration_date
      label: Date of Registration
      hint: null
      type: date
      options: []
      required: true
    - id: 20
      name: confirmation_email_opt_in
      label: Would you like to receive our quarterly industry insights?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
