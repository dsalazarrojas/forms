inputSchema:
  type: object
  properties:
    title: Buyer Consultation Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: client_company
      label: Company Name
      hint: Your organization
      type: text
      options: []
      required: false
    - id: 3
      name: client_email
      label: Email Address
      hint: Your business email
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: consultation_type
      label: Consultation Type
      hint: What do you need help with
      type: select_one
      options:
      - Product Purchase Decision
      - Vendor Selection
      - Contract Review
      - Procurement Strategy
      - Supplier Evaluation
      - Other
      required: true
    - id: 6
      name: current_situation
      label: Describe Your Current Situation
      hint: What are you trying to accomplish
      type: text
      options: []
      required: true
    - id: 7
      name: specific_goals
      label: Specific Goals and Objectives
      hint: What outcomes do you want
      type: text
      options: []
      required: true
    - id: 8
      name: budget_range
      label: Budget Range
      hint: Estimated spending
      type: select_one
      options:
      - Under 1000
      - 1000 - 5000
      - 5000 - 10000
      - 10000 - 50000
      - Over 50000
      - Not yet determined
      required: true
    - id: 9
      name: timeline
      label: Timeline for Decision
      hint: When do you need to decide
      type: select_one
      options:
      - Urgent - within 1 week
      - Soon - within 2-4 weeks
      - Medium - within 1-3 months
      - Flexible - over 3 months
      required: true
    - id: 10
      name: key_requirements
      label: Key Requirements
      hint: Must-have features or criteria
      type: text
      options: []
      required: true
    - id: 11
      name: potential_challenges
      label: Potential Challenges or Concerns
      hint: Any obstacles you anticipate
      type: text
      options: []
      required: false
    - id: 12
      name: decision_makers
      label: Number of Decision Makers
      hint: How many people involved in decision
      type: number
      options: []
      required: false
    - id: 13
      name: preferred_approach
      label: Preferred Consultation Approach
      hint: How would you like to be advised
      type: select_one
      options:
      - Phone consultation
      - Video meeting
      - In-person meeting
      - Email communication
      - Mixed approach
      required: true
    - id: 14
      name: additional_information
      label: Additional Information
      hint: Anything else we should know
      type: text
      options: []
      required: false
