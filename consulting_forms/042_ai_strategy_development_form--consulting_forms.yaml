inputSchema:
  type: object
  properties:
    title: AI Strategy Development Form
    pages:
    - id: 1
      name: --organization_context--
      label: -- Organization Context --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: organization_name
      label: Organization name
      hint: Optional
      type: text
      options: []
      required: true
    - id: 3
      name: contact_person
      label: Contact person
      hint: Name of the strategy lead
      type: text
      options: []
      required: true
    - id: 4
      name: current_objectives
      label: Current business objectives
      hint: Briefly list the top 3 objectives
      type: text
      options: []
      required: true
    - id: 5
      name: pain_points
      label: Primary pain points AI should address
      hint: Select all that apply
      type: select_multiple
      options:
      - Operational efficiency
      - Customer experience
      - Revenue growth
      - Risk management
      required: true
    - id: 6
      name: success_criteria
      label: Success criteria for AI strategy
      hint: How will success be measured
      type: text
      options: []
      required: true
    - id: 7
      name: constraints
      label: Constraints to consider
      hint: Budget, regulatory, talent, etc
      type: text
      options: []
      required: false
    - id: 8
      name: timeline_priority
      label: Timeline priority for delivery
      hint: Select one
      type: select_one
      options:
      - Immediate (1-3 months)
      - Short term (3-6 months)
      - Medium term (6-12 months)
      - Long term (12+ months)
      required: true
    - id: 9
      name: governance_needs
      label: Governance and oversight needs
      hint: Select all that apply
      type: select_multiple
      options:
      - Compliance reviews
      - Ethical guidelines
      - Technical audit
      - Stakeholder steering committee
      required: false
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Optional
      type: text
      options: []
      required: false
