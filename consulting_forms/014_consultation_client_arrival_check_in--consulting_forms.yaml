inputSchema:
  type: object
  properties:
    title: Consultation Client Arrival Check In
    pages:
    - id: 1
      name: client_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: client_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: false
    - id: 5
      name: company_name
      label: Company Name
      hint: Your organization
      type: text
      options: []
      required: false
    - id: 6
      name: appointment_date
      label: Appointment Date
      hint: Scheduled date
      type: date
      options: []
      required: true
    - id: 7
      name: appointment_time
      label: Appointment Time
      hint: Scheduled time slot
      type: time
      options: []
      required: true
    - id: 8
      name: consultant_name
      label: Consultant Name
      hint: Who is your appointment with
      type: select_one
      options:
      - Dr. Sarah Johnson
      - Michael Chen
      - Emily Rodriguez
      - David Thompson
      - Lisa Anderson
      - James Wilson
      - Walk-in
      required: true
    - id: 9
      name: service_type
      label: Service Type
      hint: Type of consultation
      type: select_one
      options:
      - Initial Consultation
      - Follow-up
      - Strategy Session
      - Review Meeting
      - Assessment
      - Other
      required: true
    - id: 10
      name: appointment_format
      label: Appointment Format
      hint: How is the meeting conducted
      type: select_one
      options:
      - In Person
      - Video Call
      - Phone Call
      required: true
    - id: 11
      name: number_in_party
      label: Number in Your Party
      hint: How many people are attending
      type: number
      options: []
      required: true
    - id: 12
      name: attendee_names
      label: Attendee Names
      hint: Names of all attendees
      type: text
      options: []
      required: false
    - id: 13
      name: first_time_visitor
      label: Is This Your First Visit
      hint: Select if this is your first consultation
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: referral_source
      label: How Did You Hear About Us
      hint: Source of referral
      type: select_one
      options:
      - Website
      - Social Media
      - Referral
      - Advertisement
      - Previous Client
      - Other
      required: false
    - id: 15
      name: referred_by
      label: Referred By
      hint: Who referred you
      type: text
      options: []
      required: false
    - id: 16
      name: arrival_time
      label: Arrival Time
      hint: Time of check-in
      type: time
      options: []
      required: true
    - id: 17
      name: waiting_preference
      label: Waiting Preference
      hint: How would you like to wait
      type: select_one
      options:
      - Waiting Room
      - Outside and Text Me
      - Walk Around
      required: false
    - id: 18
      name: special_needs
      label: Special Needs or Accommodations
      hint: Any accessibility requirements
      type: text
      options: []
      required: false
    - id: 19
      name: consultation_topic
      label: Main Topic of Consultation
      hint: Brief description of what you want to discuss
      type: text
      options: []
      required: true
    - id: 20
      name: documents_brought
      label: Did You Bring Required Documents
      hint: Select if you have all necessary documents
      type: select_one
      options:
      - Yes, All Documents
      - Some Documents
      - No Documents
      required: false
    - id: 21
      name: additional_notes
      label: Additional Notes
      hint: Any other information for the consultant
      type: text
      options: []
      required: false
