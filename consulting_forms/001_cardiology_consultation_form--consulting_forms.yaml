inputSchema:
  type: object
  properties:
    title: Cardiology Consultation Form
    pages:
    - id: 1
      name: patient_full_name
      label: Patient Full Name
      hint: Enter first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      - Other
      required: true
    - id: 4
      name: contact_phone
      label: Contact Phone Number
      hint: Include area code
      type: text
      options: []
      required: true
    - id: 5
      name: contact_email
      label: Email Address
      hint: For appointment confirmations
      type: email
      options: []
      required: true
    - id: 6
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name of emergency contact
      type: text
      options: []
      required: true
    - id: 7
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: reason_for_visit
      label: Primary Reason for Visit
      hint: Describe your main cardiac concern
      type: text
      options: []
      required: true
    - id: 9
      name: symptoms_checklist
      label: Current Symptoms
      hint: Select all that apply
      type: select_multiple
      options:
      - Chest pain or discomfort
      - Shortness of breath
      - Palpitations or irregular heartbeat
      - Dizziness or lightheadedness
      - Fatigue or weakness
      - Swelling in legs or ankles
      - Fainting or near-fainting
      - None of the above
      required: true
    - id: 10
      name: symptom_duration
      label: How Long Have You Experienced These Symptoms
      hint: null
      type: select_one
      options:
      - Less than a week
      - 1-2 weeks
      - 2-4 weeks
      - 1-3 months
      - More than 3 months
      required: true
    - id: 11
      name: pain_scale
      label: Pain Level (0-10)
      hint: 0 = no pain, 10 = worst pain imaginable
      type: number
      options: []
      required: true
    - id: 12
      name: medical_history
      label: Relevant Medical History
      hint: Select all that apply
      type: select_multiple
      options:
      - High blood pressure (hypertension)
      - High cholesterol
      - Diabetes
      - Previous heart attack
      - Previous heart surgery
      - Arrhythmia
      - Heart failure
      - Stroke or TIA
      - None of the above
      required: true
    - id: 13
      name: current_medications
      label: Current Medications
      hint: List all medications and dosages
      type: text
      options: []
      required: true
    - id: 14
      name: family_history
      label: Family History of Heart Disease
      hint: Select all that apply
      type: select_multiple
      options:
      - Parent with heart disease
      - Sibling with heart disease
      - Early heart disease in family (before age 55)
      - No known family history
      - Unknown
      required: true
    - id: 15
      name: lifestyle_factors
      label: Lifestyle Factors
      hint: Select all that apply
      type: select_multiple
      options:
      - Current smoker
      - Former smoker
      - Never smoked
      - Regular alcohol consumption
      - Sedentary lifestyle
      - Regular exercise (3+ times per week)
      - High-stress occupation
      required: true
    - id: 16
      name: previous_cardiac_tests
      label: Previous Cardiac Tests
      hint: Select all that you have had
      type: select_multiple
      options:
      - ECG/EKG
      - Echocardiogram
      - Stress test
      - Holter monitor
      - Cardiac catheterization
      - CT angiogram
      - None
      required: false
    - id: 17
      name: insurance_provider
      label: Insurance Provider
      hint: Name of your insurance company
      type: text
      options: []
      required: true
    - id: 18
      name: referral_source
      label: Referral Source
      hint: Who referred you to this consultation
      type: select_one
      options:
      - Primary care physician
      - Specialist
      - Self-referred
      - Emergency department
      - Other healthcare provider
      required: true
    - id: 19
      name: additional_notes
      label: Additional Notes or Concerns
      hint: Any other information you would like to share
      type: text
      options: []
      required: false
