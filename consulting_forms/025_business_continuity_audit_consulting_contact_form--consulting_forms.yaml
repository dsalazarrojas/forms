inputSchema:
  type: object
  properties:
    title: Business Continuity Audit Consulting Contact Form
    pages:
    - id: 1
      name: company_information
      label: -- Company Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: company_name
      label: Company Name
      hint: Legal business name
      type: text
      options: []
      required: true
    - id: 3
      name: industry_sector
      label: Industry Sector
      hint: Your primary industry
      type: text
      options: []
      required: true
    - id: 4
      name: company_location
      label: Company Headquarters Location
      hint: City and state
      type: text
      options: []
      required: true
    - id: 5
      name: number_of_locations
      label: Number of Operating Locations
      hint: How many facilities do you operate
      type: number
      options: []
      required: true
    - id: 6
      name: employee_count
      label: Total Employees
      hint: Overall staff count
      type: number
      options: []
      required: true
    - id: 7
      name: contact_information
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: contact_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 9
      name: contact_title
      label: Your Title
      hint: Your position or role
      type: text
      options: []
      required: true
    - id: 10
      name: department
      label: Your Department
      hint: Department or function
      type: text
      options: []
      required: true
    - id: 11
      name: email_address
      label: Email Address
      hint: Your business email
      type: email
      options: []
      required: true
    - id: 12
      name: phone_number
      label: Phone Number
      hint: Direct contact number
      type: text
      options: []
      required: true
    - id: 13
      name: consultation_focus
      label: -- Consultation Focus --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: audit_type
      label: Type of Audit Needed
      hint: What audit do you need
      type: select_one
      options:
      - Business Continuity Plan Audit
      - Disaster Recovery Audit
      - Risk Assessment Audit
      - Compliance Audit
      - Technology Resilience Audit
      - Supply Chain Continuity Audit
      - Crisis Management Audit
      required: true
    - id: 15
      name: audit_scope
      label: Audit Scope
      hint: What areas to focus on
      type: select_multiple
      options:
      - People and Staffing
      - Technology Systems
      - Facilities and Infrastructure
      - Suppliers and Vendors
      - Financial Systems
      - Data and Information
      - Communications
      - Customer Service
      required: true
    - id: 16
      name: critical_functions
      label: Most Critical Business Functions
      hint: Your critical operations
      type: text
      options: []
      required: true
    - id: 17
      name: current_bc_status
      label: Current BC Program Status
      hint: What exists currently
      type: select_one
      options:
      - No formal program
      - Plan exists but untested
      - Plan tested annually
      - Continuous improvement
      - Integrated with risk management
      required: true
    - id: 18
      name: audit_goals
      label: Audit Goals
      hint: What do you want to achieve
      type: text
      options: []
      required: true
    - id: 19
      name: audit_concerns
      label: Specific Concerns or Issues
      hint: Any known gaps or problems
      type: text
      options: []
      required: true
    - id: 20
      name: previous_audits
      label: Previous BC Audits
      hint: Have you had audits before
      type: select_one
      options:
      - true
      - false
      - Third-party assessment only
      required: false
    - id: 21
      name: timeline
      label: Preferred Audit Timeline
      hint: When should audit occur
      type: select_one
      options:
      - Immediate
      - Within 1 month
      - Within 3 months
      - Within 6 months
      - Flexible
      required: true
    - id: 22
      name: budget
      label: Estimated Budget
      hint: Budget range for audit
      type: select_one
      options:
      - Under 5000
      - 5000-15000
      - 15000-30000
      - 30000-50000
      - 50000+
      - To be determined
      required: false
    - id: 23
      name: additional_notes
      label: Additional Notes
      hint: Any other information
      type: text
      options: []
      required: false
