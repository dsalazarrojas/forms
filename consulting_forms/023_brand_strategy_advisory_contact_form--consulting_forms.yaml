inputSchema:
  type: object
  properties:
    title: Brand Strategy Advisory Contact Form
    pages:
      - id: 1
        name: contact_name
        label: Contact name
        hint: Name of person requesting advisory
        type: text
        options: []
        required: true
      - id: 2
        name: contact_email
        label: Contact email
        hint: Best email for scheduling
        type: email
        options: []
        required: true
      - id: 3
        name: company_name
        label: Company name
        hint: Organization name
        type: text
        options: []
        required: false
      - id: 4
        name: advisory_focus
        label: Advisory focus
        hint: Areas where advice is needed
        type: select_multiple
        options:
          - Brand positioning
          - Messaging
          - Visual identity
          - Go to market
        required: true
      - id: 5
        name: budget_estimate
        label: Budget estimate
        hint: Anticipated budget for advisory work
        type: text
        options: []
        required: false
      - id: 6
        name: preferred_contact_method
        label: Preferred contact method
        hint: How should we reach you
        type: select_one
        options:
          - Email
          - Phone
          - Video call
        required: false
      - id: 7
        name: project_timeline
        label: Project timeline
        hint: Desired start and end dates
        type: text
        options: []
        required: false
      - id: 8
        name: additional_notes
        label: Additional notes
        hint: Any other information to share
        type: text
        options: []
        required: false
