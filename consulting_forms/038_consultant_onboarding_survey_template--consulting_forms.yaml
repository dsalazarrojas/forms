inputSchema:
  type: object
  properties:
    title: Consultant Onboarding Survey Template
    pages:
      - id: 1
        name: section_onboarding_experience
        label: -- Onboarding Experience --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: consultant_name
        label: Consultant name
        hint: New consultant full name
        type: text
        options: []
        required: true
      - id: 3
        name: start_date
        label: Start date
        hint: First working day
        type: date
        options: []
        required: true
      - id: 4
        name: clarity_of_role
        label: Clarity of role
        hint: How clear the role and expectations were
        type: select_one
        options:
          - Very clear
          - Somewhat clear
          - Unclear
        required: true
      - id: 5
        name: onboarding_support
        label: Onboarding support
        hint: Rate support provided during onboarding
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 6
        name: training_needs
        label: Training needs identified
        hint: Any additional training requested by the consultant
        type: text
        options: []
        required: false
      - id: 7
        name: feedback_on_process
        label: Feedback on onboarding process
        hint: Suggestions to improve onboarding
        type: text
        options: []
        required: false
