inputSchema:
  type: object
  properties:
    title: Consultant Report Submission
    pages:
    - id: 1
      name: section_report_metadata
      label: -- Report Metadata --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: consultant_name
      label: Consultant name
      hint: Person submitting the report
      type: text
      options: []
      required: true
    - id: 3
      name: client_name
      label: Client name
      hint: Organization receiving the report
      type: text
      options: []
      required: true
    - id: 4
      name: report_title
      label: Report title
      hint: Short descriptive title
      type: text
      options: []
      required: true
    - id: 5
      name: submission_date
      label: Submission date
      hint: Date the report is submitted
      type: date
      options: []
      required: true
    - id: 6
      name: executive_summary
      label: Executive summary
      hint: Brief summary of key findings
      type: text
      options: []
      required: true
    - id: 7
      name: recommendations
      label: Recommendations
      hint: Actionable recommendations from the report
      type: text
      options: []
      required: true
    - id: 8
      name: attachments_included
      label: Attachments included
      hint: Indicate if supporting files are attached
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
