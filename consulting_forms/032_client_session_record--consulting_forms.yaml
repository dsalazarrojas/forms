inputSchema:
  type: object
  properties:
    title: Client Session Record
    pages:
    - id: 1
      name: session_info_header
      label: -- Session Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: session_duration
      label: Session Duration (minutes)
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: consultant_name
      label: Consultant or Coach Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: session_type
      label: Type of Session
      hint: null
      type: select_one
      options:
      - One-on-one coaching
      - Group session
      - Strategy session
      - Follow-up session
      - Initial consultation
      - Other
      required: true
    - id: 8
      name: session_format
      label: Session Format
      hint: null
      type: select_one
      options:
      - In-person
      - Virtual
      - Phone
      - Hybrid
      required: true
    - id: 9
      name: agenda_topics
      label: Session Agenda and Topics Covered
      hint: What was discussed in this session?
      type: text
      options: []
      required: true
    - id: 10
      name: key_points_discussed
      label: Key Points and Discussions
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: client_progress
      label: Client Progress Update
      hint: How is the client progressing towards their goals?
      type: text
      options: []
      required: false
    - id: 12
      name: action_items
      label: Action Items for Client
      hint: What should the client do before the next session?
      type: text
      options: []
      required: true
    - id: 13
      name: homework_assignments
      label: Homework or Assignments
      hint: Any work to be completed before next meeting
      type: text
      options: []
      required: false
    - id: 14
      name: progress_measurement
      label: Measurable Progress or Outcomes
      hint: Specific results or improvements noted
      type: text
      options: []
      required: false
    - id: 15
      name: challenges_obstacles
      label: Challenges or Obstacles Identified
      hint: Any blockers or difficulties discussed
      type: text
      options: []
      required: false
    - id: 16
      name: next_session_focus
      label: Focus Area for Next Session
      hint: What will we work on next?
      type: text
      options: []
      required: false
    - id: 17
      name: follow_up_required
      label: Follow-up Required?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 18
      name: next_session_date
      label: Scheduled Next Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 19
      name: additional_notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
