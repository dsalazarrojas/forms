inputSchema:
  type: object
  properties:
    title: Consulting Partnership Value Survey
    pages:
    - id: 1
      name: section_client_information
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client name
      hint: Full name of primary client contact
      type: text
      options: []
      required: true
    - id: 3
      name: client_organization
      label: Client organization
      hint: Company or division name
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact email
      hint: Use a business email for follow up
      type: email
      options: []
      required: true
    - id: 5
      name: engagement_phase
      label: Engagement phase
      hint: Select the current phase of the engagement
      type: select_one
      options:
      - Discovery
      - Implementation
      - Ongoing support
      - Completed
      required: true
    - id: 6
      name: perceived_value_score
      label: Perceived value overall
      hint: Rate the overall value delivered on a scale of 1 to 5
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 7
      name: satisfaction_with_communication
      label: Satisfaction with communication
      hint: How satisfied are you with consultant communication
      type: select_one
      options:
      - Very dissatisfied
      - Somewhat dissatisfied
      - Neutral
      - Somewhat satisfied
      - Very satisfied
      required: true
    - id: 8
      name: most_valuable_outcome
      label: Most valuable outcome achieved
      hint: Describe the top outcome from the partnership
      type: text
      options: []
      required: false
    - id: 9
      name: improvement_suggestions
      label: Improvement suggestions
      hint: What could consulting teams do differently to increase value
      type: text
      options: []
      required: false
    - id: 10
      name: recommend_to_peer
      label: Recommend consulting partner to peer
      hint: Would you recommend this partner to others
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 11
      name: additional_comments
      label: Additional comments
      hint: Any other feedback or notes
      type: text
      options: []
      required: false
