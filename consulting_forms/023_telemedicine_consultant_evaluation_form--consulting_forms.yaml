inputSchema:
  type: object
  properties:
    title: Telemedicine Consultant Evaluation Form
    pages:
    - id: 1
      name: consulting_form
      label: Consultant Evaluation
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: consultant_name
      label: Consultant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 4
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: Enter a valid email address
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: has_visited
      label: Has Visited
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
