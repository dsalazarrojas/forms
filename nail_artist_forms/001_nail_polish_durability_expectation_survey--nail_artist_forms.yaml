inputSchema:
  type: object
  properties:
    title: Nail Polish Durability Expectation Survey
    pages:
    - id: 1
      name: streaking_frequency
      label: How often do you notice streaks with this polish?
      hint: null
      type: select_multiple
      options:
      - Often
      - Rarely
      - Never
      required: false
    - id: 2
      name: overall_quality
      label: How would you rate the overall quality of the polish?
      hint: null
      type: select_one
      options:
      - Not satisfied
      - Slightly satisfied
      - Satisfied
      - Very satisfied
      required: false
    - id: 3
      name: nail_polish_duration
      label: How long does it last on your nails?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: nail_strengthening
      label: How much does it strengthen your nails?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: color_durability
      label: How would you rate the color durability?
      hint: null
      type: select_one
      options:
      - Not satisfied
      - Slightly satisfied
      - Satisfied
      - Very satisfied
      required: false
    - id: 6
      name: reapply_frequency
      label: How often do you reapply this polish?
      hint: null
      type: select_multiple
      options:
      - Often
      - Rarely
      - Never
      required: false
    - id: 7
      name: wear_quality
      label: How would you rate the wear quality?
      hint: null
      type: select_one
      options:
      - Not satisfied
      - Slightly satisfied
      - Satisfied
      - Very satisfied
      required: false
    - id: 8
      name: nail_strengthening_2
      label: Nail Strengthening 2
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: quality_assurance
      label: How would you rate the quality of the polish?
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: overall_quality_2
      label: Overall quality?
      hint: null
      type: select_one
      options:
      - Not satisfied
      - Slightly satisfied
      - Satisfied
      - Very satisfied
      required: false
