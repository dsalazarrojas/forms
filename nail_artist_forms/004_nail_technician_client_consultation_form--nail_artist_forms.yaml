inputSchema:
  type: object
  properties:
    title: Nail Technician Client Consultation Form
    pages:
    - id: 1
      name: client_name
      label: Client's Name
      hint: Enter client's name
      type: text
      options: []
      required: false
    - id: 2
      name: nail_type
      label: Nail Type
      hint: Select nail type
      type: select_one
      options:
      - Nail
      - Acrylic
      - Gel
      - Dipping
      - Dip powder
      required: true
    - id: 3
      name: nail_shape
      label: Nail Shape
      hint: Select nail shape
      type: select_multiple
      options:
      - Oval
      - Square
      - Almond
      - Stiletto
      - Squoval
      required: false
    - id: 4
      name: nail_color
      label: Nail Color
      hint: Select nail color
      type: select_one
      options:
      - Pink
      - Red
      - Purple
      - Blue
      - Silver
      - Clear
      required: false
    - id: 5
      name: nail_length
      label: Nail Length
      hint: Enter nail length
      type: number
      options: []
      required: false
    - id: 6
      name: nail_width
      label: Nail Width
      hint: Enter nail width
      type: number
      options: []
      required: false
    - id: 7
      name: nail_thickening
      label: Nail Thickening
      hint: Select nail thickening
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: nail_strengthening
      label: Nail Strengthening
      hint: Select nail strengthening
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: shape_strengthening
      label: Shape Strengthening
      hint: Select nail shape strengthening
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: color_strengthening
      label: Color Strengthening
      hint: Select nail color strengthening
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: client_contact
      label: Client's Contact Information
      hint: Enter client's contact information
      type: text
      options: []
      required: false
    - id: 12
      name: additional_comments
      label: Additional Comments
      hint: Enter any additional comments
      type: text
      options: []
      required: false
