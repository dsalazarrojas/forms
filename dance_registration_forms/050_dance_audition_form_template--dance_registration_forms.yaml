inputSchema:
  type: object
  properties:
    title: Dance Audition Form Template
    pages:
    - id: 1
      name: dancer_info
      label: dancer info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: contact info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: dance_experience
      label: dance experience
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Prefer not to answer
      required: false
    - id: 4
      name: dance_background
      label: dance background
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: emergency_contact_info
      label: emergency contact info
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: emergency_name
      label: name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: emergency_phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: dance_audition_experience
      label: dance audition experience
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: available_dance_days
      label: available dance days
      hint: List all days you are available
      type: text
      options: []
      required: false
    - id: 10
      name: preferred_dance_days
      label: preferred dance days
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 11
      name: available_time_slots
      label: available time slots
      hint: List all time slots you are available
      type: text
      options: []
      required: false
    - id: 12
      name: preferred_time_slots
      label: preferred time slots
      hint: null
      type: select_multiple
      options:
      - AM
      - PM
      - All Day
      required: true
    - id: 13
      name: available_dance_styles
      label: available dance styles
      hint: List all styles you are interested in
      type: text
      options: []
      required: false
    - id: 14
      name: preferred_dance_styles
      label: preferred dance styles
      hint: null
      type: select_multiple
      options:
      - Ballet
      - Tap
      - Jazz
      - Hip Hop
      required: true
    - id: 15
      name: audition_date
      label: audition date
      hint: null
      type: date
      options: []
      required: false
    - id: 16
      name: audition_time
      label: audition time
      hint: null
      type: time
      options: []
      required: false
