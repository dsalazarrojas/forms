inputSchema:
  type: object
  properties:
    title: Season Ticket Order Form
    pages:
    - id: 1
      name: season_ticket_order_form
      label: Season Ticket Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: season_ticket_order_form_tickets
      label: Tickets
      hint: null
      type: select_multiple
      options:
      - 1-4 tickets
      - 5-8 tickets
      - 9-12 tickets
      - 13-16 tickets
      required: false
    - id: 3
      name: season_ticket_order_form_payment_type
      label: Payment Type
      hint: null
      type: select_one
      options:
      - Credit Card
      - Check
      - Cash
      required: false
    - id: 4
      name: season_ticket_order_form_billing_address
      label: Billing Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: season_ticket_order_form_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: season_ticket_order_form_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: season_ticket_order_form_additional_information
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: season_ticket_order_form_comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
