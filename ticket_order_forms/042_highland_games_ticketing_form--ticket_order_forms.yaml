inputSchema:
  type: object
  properties:
    title: Highland Games Ticketing Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: select_ticket_type
      label: Select Ticket Type
      hint: null
      type: select_one
      options:
      - General Admission Ticket
      - VIP Ticket
      - Family Ticket
      required: false
    - id: 6
      name: select_multiple_ticket_types
      label: Select Multiple Ticket Types
      hint: Select all applicable ticket types
      type: select_multiple
      options:
      - General Admission Ticket
      - VIP Ticket
      - Family Ticket
      required: false
    - id: 7
      name: event_date
      label: Event Date
      hint: Select date of the event
      type: date
      options: []
      required: false
    - id: 8
      name: event_time
      label: Event Time
      hint: Select time of the event
      type: time
      options: []
      required: false
    - id: 9
      name: ticket_price
      label: Ticket Price
      hint: Price of the ticket
      type: number
      options: []
      required: false
    - id: 10
      name: note
      label: Note
      hint: Any additional information about the order
      type: note
      options: []
      required: false
    - id: 11
      name: ticket_status
      label: Ticket Status
      hint: Status of the ticket
      type: select_one
      options:
      - New
      - Sold
      - Cancelled
      required: false
    - id: 12
      name: ticket_status_note
      label: Ticket Status Note
      hint: Additional information about ticket status
      type: note
      options: []
      required: false
    - id: 13
      name: ticket_quantity
      label: Ticket Quantity
      hint: Number of tickets purchased
      type: number
      options: []
      required: false
