inputSchema:
  type: object
  properties:
    title: Pizza Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: phone_number
      label: Phone Number
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: pizza_size
      label: Pizza Size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 7
      name: toppings
      label: Toppings
      hint: null
      type: select_multiple
      options:
      - Sausage
      - Mushrooms
      - Onions
      - Pepperoni
      - Extra Cheese
      required: false
    - id: 8
      name: special_instructions
      label: Special Instructions
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Cash
      - PayPal
      required: false
    - id: 10
      name: order_status
      label: Order Status
      hint: null
      type: select_one
      options:
      - New
      - In Progress
      - Complete
      - Cancelled
      - Closed
      required: false
