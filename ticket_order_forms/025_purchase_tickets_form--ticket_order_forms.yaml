inputSchema:
  type: object
  properties:
    title: Purchase Tickets Form
    pages:
    - id: 1
      name: ticket_form
      label: Ticket Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: ticket_count
      label: ticket_count
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: gift_registry
      label: gift_registry
      hint: null
