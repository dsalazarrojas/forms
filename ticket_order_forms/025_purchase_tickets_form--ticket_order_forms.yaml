      options:
      - '{''value'': 10, ''label'': 5}'
      - '{''value'': 25, ''label'': 10}'
      required: false
    - id: 4
      name: purchase_tickets
      label: purchase_tickets
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: available_tickets
      label: available_tickets
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: gift_registry_settings
      label: gift_registry_settings
      hint: null
      type: select_one
      options:
      - '{''value'': 10, ''label'': 5}'
      - '{''value'': 25, ''label'': 10}'
      - '{''value'': 0, ''label'': ''Unrestricted''}'
      required: false
    - id: 7
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - '{''value'': ''submit'', ''label'': ''Submit''}'
      - '{''value'': ''cancel'', ''label'': ''Cancel''}'
      required: false
    - id: 8
      name: errors
      label: errors
      hint: null
      type: note
      options: []
      required: false
