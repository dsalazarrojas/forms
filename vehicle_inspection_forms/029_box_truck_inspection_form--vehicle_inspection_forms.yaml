inputSchema:
  type: object
  properties:
    title: Box Truck Inspection Form
    pages:
    - id: 1
      name: inspection_date
      label: Inspection Date
      hint: Date of inspection
      type: date
      options: []
      required: true
    - id: 2
      name: inspection_time
      label: Inspection Time
      hint: Time of inspection
      type: time
      options: []
      required: true
    - id: 3
      name: inspector_name
      label: Inspector Name
      hint: Full name of inspector
      type: text
      options: []
      required: true
    - id: 4
      name: inspector_id
      label: Inspector ID
      hint: Employee identification number
      type: text
      options: []
      required: true
    - id: 5
      name: truck_id
      label: Truck ID
      hint: Vehicle identification number or fleet number
      type: text
      options: []
      required: true
    - id: 6
      name: truck_make
      label: Truck Make
      hint: Manufacturer
      type: text
      options: []
      required: true
    - id: 7
      name: truck_model
      label: Truck Model
      hint: Model name
      type: text
      options: []
      required: true
    - id: 8
      name: truck_year
      label: Truck Year
      hint: Year of manufacture
      type: number
      options: []
      required: true
    - id: 9
      name: odometer_reading
      label: Odometer Reading
      hint: Current mileage
      type: number
      options: []
      required: true
    - id: 10
      name: license_plate
      label: License Plate Number
      hint: Plate number
      type: text
      options: []
      required: true
    - id: 11
      name: inspection_type
      label: Inspection Type
      hint: Type of inspection being performed
      type: select_one
      options:
      - Pre-rental inspection
      - Post-rental inspection
      - Routine maintenance inspection
      - Pre-trip inspection
      - Post-trip inspection
      - Annual inspection
      - Damage assessment
      required: true
    - id: 12
      name: exterior_condition
      label: Exterior Condition
      hint: Overall exterior condition
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: body_damage
      label: Body Damage
      hint: Any dents, scratches, or damage
      type: select_one
      options:
      - None
      - Minor
      - Moderate
      - Severe
      required: true
    - id: 14
      name: damage_description
      label: Damage Description
      hint: Describe any damage found
      type: text
      options: []
      required: false
    - id: 15
      name: tire_condition
      label: Tire Condition
      hint: Overall tire condition
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor - needs replacement
      required: true
    - id: 16
      name: tire_pressure
      label: Tire Pressure
      hint: Is tire pressure adequate
      type: select_one
      options:
      - All tires adequate
      - Some tires low
      - Multiple tires low
      required: true
    - id: 17
      name: lights_functional
      label: Lights Functional
      hint: Are all lights working
      type: select_one
      options:
      - All lights working
      - Some lights out
      - Multiple lights out
      required: true
    - id: 18
      name: brakes_condition
      label: Brakes Condition
      hint: Brake system condition
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Needs attention
      required: true
    - id: 19
      name: fluid_levels
      label: Fluid Levels
      hint: Are fluid levels adequate
      type: select_one
      options:
      - All fluids adequate
      - Some fluids low
      - Multiple fluids low
      required: true
    - id: 20
      name: cargo_area_condition
      label: Cargo Area Condition
      hint: Condition of box or cargo area
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 21
      name: cargo_area_cleanliness
      label: Cargo Area Cleanliness
      hint: Is cargo area clean
      type: select_one
      options:
      - Clean
      - Moderately clean
      - Dirty
      - Very dirty
      required: true
    - id: 22
      name: lift_gate_operation
      label: Lift Gate Operation
      hint: Does lift gate work properly
      type: select_one
      options:
      - Working properly
      - Minor issues
      - Not working
      - Not applicable
      required: true
    - id: 23
      name: doors_operation
      label: Doors Operation
      hint: Do all doors operate properly
      type: select_one
      options:
      - All doors working
      - Some issues
      - Multiple issues
      required: true
    - id: 24
      name: interior_condition
      label: Cab Interior Condition
      hint: Condition of driver area
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 25
      name: safety_equipment
      label: Safety Equipment
      hint: Is safety equipment present
      type: select_multiple
      options:
      - Fire extinguisher
      - First aid kit
      - Warning triangles
      - Reflective vests
      - All present
      - Some missing
      required: true
    - id: 26
      name: overall_rating
      label: Overall Vehicle Rating
      hint: Overall assessment
      type: select_one
      options:
      - Excellent - ready for use
      - Good - minor issues noted
      - Fair - needs attention
      - Poor - not recommended for use
      required: true
    - id: 27
      name: repairs_needed
      label: Repairs Needed
      hint: List any repairs required
      type: text
      options: []
      required: false
    - id: 28
      name: vehicle_approved
      label: Vehicle Approved for Use
      hint: Is vehicle approved
      type: select_one
      options:
      - Yes, approved
      - Yes, with noted issues
      - No, not approved
      required: true
    - id: 29
      name: inspector_signature
      label: Inspector Signature
      hint: Electronic signature
      type: text
      options: []
      required: true
    - id: 30
      name: driver_acknowledgment
      label: Driver Acknowledgment
      hint: Driver signature if applicable
      type: text
      options: []
      required: false
