inputSchema:
  type: object
  properties:
    title: Forklift Daily Inspection Checklist Form
    pages:
    - id: 1
      name: pre_start_check
      label: pre_start_check
      hint: null
      type: select_multiple
      options:
      - Forklift horn is functioning correctly
      - Forklift is securely fastened to the load
      - All safety devices are in working order
      - All controls are functioning correctly
      required: true
    - id: 2
      name: during_operation
      label: during_operation
      hint: null
      type: select_multiple
      options:
      - Check for any issues during the operation
      - Forklift is running smoothly
      - All safety devices are functioning correctly
      - Controls are operating properly
      required: true
    - id: 3
      name: post_operation
      label: post_operation
      hint: null
      type: select_multiple
      options:
      - Check for any issues after the operation
      - Forklift is parked correctly
      - All safety devices are functioning correctly
      - Controls are in the correct position
      required: true
    - id: 4
      name: maintenance_check
      label: maintenance_check
      hint: Record maintenance issues here
      type: text
      options: []
      required: false
    - id: 5
      name: inspection_date
      label: inspection_date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: inspection_time
      label: inspection_time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: notes
      label: notes
      hint: Add any further notes here
      type: text
      options: []
      required: false
    - id: 8
      name: forklift_operator
      label: forklift_operator
      hint: null
      type: select_one
      options:
      - John
      - Jane
      - Jimmy
      required: true
    - id: 9
      name: assigned_to
      label: assigned_to
      hint: null
      type: select_one
      options:
      - chatjimmy
      - warehouse
      - distribution
      - center
      required: true
