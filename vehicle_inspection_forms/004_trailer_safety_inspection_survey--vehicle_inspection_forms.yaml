inputSchema:
  type: object
  properties:
    title: Trailer Safety Inspection Survey
    pages:
    - id: 1
      name: trailer_type
      label: Trailer Type
      hint: null
      type: select_one
      options:
      - Dry Freight
      - Livestock
      - Tank
      - Other
      required: false
    - id: 2
      name: safety_standards
      label: Safety Standards
      hint: null
      type: select_one
      options:
      - FHVSS
      - US DOT
      - Other
      required: false
    - id: 3
      name: safety_features
      label: Safety Features
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: safety_equipment
      label: Safety Equipment
      hint: null
      type: text
      options: []
      required: false
