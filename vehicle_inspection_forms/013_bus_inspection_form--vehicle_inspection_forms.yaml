inputSchema:
  type: object
  properties:
    title: Bus Inspection Form
    pages:
    - id: 1
      name: inspection_header
      label: Inspection Header
      hint: Basic inspection details
      type: note
      options: []
      required: false
    - id: 2
      name: inspection_date
      label: Inspection Date
      hint: Date of inspection
      type: date
      options: []
      required: true
    - id: 3
      name: inspection_time
      label: Inspection Time
      hint: Time of inspection
      type: time
      options: []
      required: true
    - id: 4
      name: inspector_name
      label: Inspector Name
      hint: Name of inspector
      type: text
      options: []
      required: true
    - id: 5
      name: inspector_id
      label: Inspector ID
      hint: Inspector employee ID
      type: text
      options: []
      required: true
    - id: 6
      name: vehicle_info
      label: Vehicle Information
      hint: Bus details
      type: note
      options: []
      required: false
    - id: 7
      name: bus_number
      label: Bus Number
      hint: Vehicle identification
      type: text
      options: []
      required: true
    - id: 8
      name: bus_model
      label: Bus Model
      hint: Make and model
      type: text
      options: []
      required: true
    - id: 9
      name: license_plate
      label: License Plate
      hint: Vehicle license plate number
      type: text
      options: []
      required: true
    - id: 10
      name: odometer_reading
      label: Odometer Reading
      hint: Current mileage
      type: number
      options: []
      required: true
    - id: 11
      name: inspection_type
      label: Inspection Type
      hint: Type of inspection being conducted
      type: select_one
      options:
      - Pre-Trip Inspection
      - Post-Trip Inspection
      - Monthly Inspection
      - Annual Inspection
      - Random Inspection
      - Post-Incident Inspection
      required: true
    - id: 12
      name: exterior_check
      label: Exterior Check
      hint: External vehicle inspection
      type: note
      options: []
      required: false
    - id: 13
      name: body_condition
      label: Body Condition
      hint: Overall body condition
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Needs Repair
      required: true
    - id: 14
      name: windows_mirrors
      label: Windows and Mirrors
      hint: Condition of windows and mirrors
      type: select_one
      options:
      - All Intact and Clean
      - Minor Issues
      - Needs Cleaning
      - Damaged
      - Needs Replacement
      required: true
    - id: 15
      name: lights
      label: Lights
      hint: All exterior lights
      type: select_one
      options:
      - All Functional
      - Most Functional
      - Some Issues
      - Major Issues
      - Not Functional
      required: true
    - id: 16
      name: tires
      label: Tires
      hint: Tire condition and pressure
      type: select_one
      options:
      - Excellent Condition
      - Good Condition
      - Acceptable
      - Needs Attention
      - Needs Replacement
      required: true
    - id: 17
      name: interior_check
      label: Interior Check
      hint: Internal vehicle inspection
      type: note
      options: []
      required: false
    - id: 18
      name: seats_condition
      label: Seats Condition
      hint: Condition of passenger seats
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Damaged
      required: true
    - id: 19
      name: floor_condition
      label: Floor Condition
      hint: Condition of floor and aisles
      type: select_one
      options:
      - Clean and Safe
      - Minor Issues
      - Needs Cleaning
      - Damaged
      - Hazardous
      required: true
    - id: 20
      name: emergency_exits
      label: Emergency Exits
      hint: Are emergency exits functional
      type: select_one
      options:
      - All Functional
      - Most Functional
      - Some Issues
      - Major Issues
      - Not Functional
      required: true
    - id: 21
      name: hvac_system
      label: HVAC System
      hint: Heating and air conditioning
      type: select_one
      options:
      - Fully Functional
      - Mostly Functional
      - Partial Issues
      - Major Issues
      - Not Functional
      required: true
    - id: 22
      name: mechanical_check
      label: Mechanical Check
      hint: Mechanical systems inspection
      type: note
      options: []
      required: false
    - id: 23
      name: engine_condition
      label: Engine Condition
      hint: Engine performance
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Needs Immediate Attention
      required: true
    - id: 24
      name: brakes
      label: Brakes
      hint: Brake system condition
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Needs Immediate Attention
      required: true
    - id: 25
      name: steering
      label: Steering
      hint: Steering system condition
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Needs Immediate Attention
      required: true
    - id: 26
      name: safety_equipment
      label: Safety Equipment
      hint: Fire extinguisher, first aid kit, etc.
      type: select_one
      options:
      - All Present and Valid
      - Most Present
      - Some Missing or Expired
      - Major Issues
      - Not Compliant
      required: true
    - id: 27
      name: defects_found
      label: Defects Found
      hint: Were any defects discovered
      type: select_one
      options:
      - No Defects
      - Minor Defects
      - Major Defects
      - Critical Defects
      required: true
    - id: 28
      name: defect_description
      label: Defect Description
      hint: Describe any defects found
      type: text
      options: []
      required: false
    - id: 29
      name: vehicle_status
      label: Vehicle Status
      hint: Is the vehicle approved for service
      type: select_one
      options:
      - Approved for Service
      - Approved with Restrictions
      - Needs Minor Repairs
      - Needs Major Repairs
      - Out of Service
      required: true
    - id: 30
      name: additional_notes
      label: Additional Notes
      hint: Any other observations
      type: text
      options: []
      required: false
