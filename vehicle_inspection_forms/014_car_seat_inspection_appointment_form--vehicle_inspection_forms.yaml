inputSchema:
  type: object
  properties:
    title: Car Seat Inspection Appointment Form
    pages:
    - id: 1
      name: parent_guardian_name
      label: Parent or guardian name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: preferred_contact_method
      label: Preferred contact method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Text Message
      - Either
      required: false
    - id: 5
      name: number_of_children
      label: Number of children to have car seats inspected
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: child_1_age
      label: Child 1 - Age
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: child_1_weight
      label: Child 1 - Weight (lbs)
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: child_1_height
      label: Child 1 - Height (inches)
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: car_seat_type_1
      label: Child 1 - Car seat type
      hint: null
      type: select_one
      options:
      - Infant Rear-Facing
      - Convertible Rear-Facing
      - Forward-Facing
      - Booster Seat
      - Combination
      - Other
      required: true
    - id: 10
      name: car_seat_brand_model_1
      label: Child 1 - Car seat brand and model
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: child_2_age
      label: Child 2 - Age
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: child_2_weight
      label: Child 2 - Weight (lbs)
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: car_seat_type_2
      label: Child 2 - Car seat type
      hint: null
      type: select_one
      options:
      - Infant Rear-Facing
      - Convertible Rear-Facing
      - Forward-Facing
      - Booster Seat
      - Combination
      - Other
      required: false
    - id: 14
      name: vehicle_make_model
      label: Vehicle year, make, model
      hint: e.g., 2020 Honda Accord
      type: text
      options: []
      required: true
    - id: 15
      name: vehicle_color
      label: Vehicle color
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: preferred_appointment_date
      label: Preferred appointment date
      hint: null
      type: date
      options: []
      required: true
    - id: 17
      name: preferred_appointment_time
      label: Preferred appointment time
      hint: null
      type: time
      options: []
      required: true
    - id: 18
      name: alternative_dates
      label: Alternative appointment dates
      hint: If preferred date is unavailable
      type: text
      options: []
      required: false
    - id: 19
      name: appointment_location
      label: Appointment location preference
      hint: null
      type: select_one
      options:
      - Our Facility
      - Your Home
      - Your Vehicle Location
      - Mobile Service
      - Online Consultation
      required: true
    - id: 20
      name: appointment_address
      label: Appointment address (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: concerns_questions
      label: Specific concerns or questions
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: previous_inspection
      label: Has this car seat been inspected before?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Sure
      required: false
    - id: 23
      name: seat_issues
      label: Any current issues with the car seat?
      hint: Damage, difficulty installing, etc.
      type: text
      options: []
      required: false
    - id: 24
      name: assistance_needed
      label: Assistance needed (select all that apply)
      hint: null
      type: select_multiple
      options:
      - Installation Help
      - Correct Harness Adjustment
      - Recline Angle Check
      - Seat Positioning
      - Replacement Recommendations
      - Vehicle Safety Assessment
      required: false
    - id: 25
      name: parent_availability
      label: Days and times you are available for appointment
      hint: null
      type: text
      options: []
      required: false
