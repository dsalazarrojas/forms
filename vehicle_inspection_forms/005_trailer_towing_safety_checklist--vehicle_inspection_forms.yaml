inputSchema:
  type: object
  properties:
    title: Trailer Towing Safety Checklist
    pages:
    - id: 1
      name: trailer_towing_safety_checklist
      label: Pre-Inspection
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: trailer_towing_safety_checklist_roadside
      label: Roadside Checklist
      hint: Check vehicle and trailer before beginning a trip
      type: text
      options: []
      required: false
    - id: 3
      name: trailer_towing_safety_checklist_maintenance
      label: Regular Maintenance
      hint: Check and perform necessary maintenance
      type: select_one
      options:
      - 'True'
      - 'False'
      - N/A
      required: false
    - id: 4
      name: trailer_towing_safety_checklist_vehicle_condition
      label: Vehicle Condition
      hint: Check vehicle condition before towing
      type: select_multiple
      options:
      - Good
      - Fair
      - Poor
      - N/A
      - Failed
      required: false
    - id: 5
      name: trailer_towing_safety_checklist_driver_experience
      label: Driver Experience
      hint: Check driver experience and qualifications
      type: select_one
      options:
      - Experienced
      - Inexperienced
      - N/A
      required: false
    - id: 6
      name: trailer_towing_safety_checklist_weather_conditions
      label: Weather Conditions
      hint: Check weather conditions before towing
      type: date
      options: []
      required: false
    - id: 7
      name: trailer_towing_safety_checklist_trailer_condition
      label: Trailer Condition
      hint: Check trailer condition before towing
      type: select_multiple
      options:
      - Good
      - Fair
      - Poor
      - N/A
      required: false
    - id: 8
      name: trailer_towing_safety_checklist_traction
      label: Traction
      hint: Check traction before towing
      type: text
      options: []
      required: false
    - id: 9
      name: trailer_towing_safety_checklist_weight_distribution
      label: Weight Distribution
      hint: Check weight distribution before towing
      type: select_one
      options:
      - Within Limits
      - Not within Limits
      - N/A
      required: false
    - id: 10
      name: trailer_towing_safety_checklist_brakes
      label: Brakes
      hint: Check brake functionality before towing
      type: text
      options: []
      required: false
