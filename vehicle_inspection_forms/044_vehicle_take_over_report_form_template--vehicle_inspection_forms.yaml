inputSchema:
  type: object
  properties:
    title: Vehicle Take Over Report Form Template
    pages:
    - id: 1
      name: vehicle_mileage
      label: Vehicle Mileage
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: vehicle_fuel
      label: Vehicle Fuel
      hint: null
      type: number
      options: []
      required: false
