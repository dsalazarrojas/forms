      name: section_header_brake
      label: -- Brake System Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: brake_pad_condition
      label: Brake Pad Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Needs Replacement
      required: true
    - id: 13
      name: brake_fluid_level
      label: Brake Fluid Level
      hint: null
      type: select_one
      options:
      - Full
      - Adequate
      - Low
      - Critical
      required: true
    - id: 14
      name: brake_lines_condition
      label: Brake Lines and Hoses Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Leaking
      - Damaged
      required: true
    - id: 15
      name: section_header_suspension
      label: -- Suspension and Steering --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: suspension_condition
      label: Suspension System Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Worn
      - Damaged
      required: true
    - id: 17
      name: tire_condition
      label: Tire Condition and Tread Depth
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Unsafe
      required: true
    - id: 18
      name: steering_responsiveness
      label: Steering Responsiveness
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 19
      name: section_header_lights
      label: -- Lighting and Visibility --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: headlights_condition
      label: Headlights Function and Brightness
      hint: null
      type: select_one
      options:
      - Both Working
      - One Damaged
      - Both Damaged
      - Both Inoperative
      required: true
    - id: 21
      name: tail_lights
      label: Tail Lights and Brake Lights
      hint: null
      type: select_one
      options:
      - All Working
      - Some Not Working
      - All Inoperative
      required: true
    - id: 22
      name: windshield_wipers
      label: Windshield Wipers and Washer
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Not Working
      required: true
    - id: 23
      name: section_header_overall
      label: -- Overall Safety Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: safety_rating
      label: Overall Safety Rating
      hint: null
      type: select_one
      options:
      - Pass - Safe
      - Pass with Maintenance
      - Fail - Unsafe
      - Fail - Immediate Action Required
      required: true
    - id: 25
      name: recommendations
      label: Safety Recommendations
      hint: Required repairs or maintenance
      type: text
      options: []
      required: true
