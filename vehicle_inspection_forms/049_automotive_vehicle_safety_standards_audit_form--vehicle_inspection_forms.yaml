inputSchema:
  type: object
  properties:
    title: Automotive Vehicle Safety Standards Audit Form
    pages:
    - id: 1
      name: section_header_audit
      label: -- Audit Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: audit_date
      label: Audit Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: audit_time
      label: Audit Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: auditor_name
      label: Auditor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: section_header_vehicle
      label: -- Vehicle Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: vehicle_year
      label: Vehicle Year
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: vehicle_make
      label: Vehicle Make
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: vehicle_model
      label: Vehicle Model
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: vehicle_vin
      label: Vehicle VIN
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: mileage
      label: Current Mileage
      hint: null
      type: number
      options: []
      required: true
