inputSchema:
  type: object
  properties:
    title: Bocce League Free Agent Registration
    pages:
    - id: 1
      name: player_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: player_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: player_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: player_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: player_age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: player_address
      label: Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 7
      name: player_city_state_zip
      label: City - State - Zip
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: bocce_experience
      label: Bocce Experience Level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Professional
      - Never Played
      required: true
    - id: 9
      name: league_season
      label: Which Season Are You Registering For
      hint: null
      type: select_one
      options:
      - Spring Season
      - Summer Season
      - Fall Season
      - Winter Season
      - Year-Round
      required: true
    - id: 10
      name: team_preference
      label: Do you have a preferred team
      hint: null
      type: select_one
      options:
      - Yes - team name
      - No - any team
      - Prefer specific division
      required: true
    - id: 11
      name: preferred_team_name
      label: Preferred Team Name
      hint: If you have a preference
      type: text
      options: []
      required: false
    - id: 12
      name: availability_days
      label: Which days are you available
      hint: Select all that apply
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 13
      name: availability_times
      label: Preferred Match Times
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      - Weekend
      - Flexible
      required: true
    - id: 14
      name: player_strengths
      label: Your Bocce Strengths
      hint: null
      type: select_multiple
      options:
      - Accuracy
      - Strategy
      - Physical Ability
      - Teamwork
      - Leadership
      - All around player
      required: false
    - id: 15
      name: player_position_preference
      label: Preferred Playing Position
      hint: null
      type: select_one
      options:
      - Lead
      - Second
      - Third
      - Skip
      - No Preference
      - Unsure
      required: true
    - id: 16
      name: medical_conditions
      label: Any medical conditions we should know about
      hint: For player safety
      type: text
      options: []
      required: false
    - id: 17
      name: waiver_acceptance
      label: I accept the league waiver and rules
      hint: null
      type: select_one
      options:
      - I Accept
      - I Do Not Accept
      required: true
    - id: 18
      name: league_fee_amount
      label: League Registration Fee
      hint: Amount due
      type: number
      options: []
      required: true
    - id: 19
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Check
      - Credit Card
      - Bank Transfer
      - Online Payment
      required: true
    - id: 20
      name: prior_league_experience
      label: Have you played in bocce leagues before
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Competitive only
      - Casual only
      required: true
    - id: 21
      name: additional_comments
      label: Additional Information or Comments
      hint: null
      type: text
      options: []
      required: false
