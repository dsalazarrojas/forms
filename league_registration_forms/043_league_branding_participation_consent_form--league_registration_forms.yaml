inputSchema:
  type: object
  properties:
    title: League Branding Participation Consent Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: participant_email
      label: participant_email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: league_branding_permission
      label: League Branding Permission
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: participant_image_permission
      label: Participant Image Permission
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: participant_likeness_permission
      label: Participant Likenesses Permission
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: notes
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: signature
      label: Participant Signature
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: date_signed
      label: Date Signed
      hint: null
      type: date
      options: []
      required: false
