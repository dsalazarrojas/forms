inputSchema:
  type: object
  properties:
    title: Library Reading Program Evaluation Form
    pages:
    - id: 1
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_info
      label: Participant Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: reading_experience
      label: Reading Experience
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Highly Satisfactory
      - Satisfactory
      - Needs Improvement
      - Not Satisfactory
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: date_of_event
      label: Date of Event
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time_of_event
      label: Time of Event
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: follow_up
      label: Follow-Up
      hint: null
      type: note
      options: []
      required: false
