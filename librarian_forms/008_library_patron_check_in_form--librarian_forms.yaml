inputSchema:
  type: object
  properties:
    title: Library Patron Check In Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: checkin_time
      label: Check-in Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: purpose_visit
      label: Purpose of Visit
      hint: null
      type: select_one
      options:
      - Library Book Dropoff
      - Library Meeting Room Reservations
      - Library Program Participation
      - Other
      required: true
    - id: 6
      name: staff_assisted
      label: Staff Assisted
      hint: null
      type: select_multiple
      options:
      - Reference
      - Program
      - Computer
      - Other
      required: false
    - id: 7
      name: feedback
      label: Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email_note
      label: Note
      hint: null
      type: email
      options: []
      required: false
