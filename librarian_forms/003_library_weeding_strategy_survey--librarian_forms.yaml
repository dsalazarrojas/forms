inputSchema:
  type: object
  properties:
    title: Library Weeding Strategy Survey
    pages:
    - id: 1
      name: weeding_frequency
      label: Weeding Frequency
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 2
      name: decision_criteria
      label: Decision Criteria
      hint: What are your criteria for weeding books in this library collection?
      type: text
      options: []
      required: false
