inputSchema:
  type: object
  properties:
    title: Library Resources Feedback Request Form
    pages:
    - id: 1
      name: patron_feedback
      label: Patron Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: resource_usage
      label: How often do you use the resource?
      hint: null
      type: select_multiple
      options:
      - Always
      - Occasionally
      - Never
      required: false
    - id: 3
      name: satisfaction_level
      label: What is your level of satisfaction?
      hint: null
      type: select_one
      options:
      - Highly Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      required: true
    - id: 4
      name: improvement_opportunities
      label: What opportunities for improvement do you see?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: resource_feedback
      label: Additional Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: resource_suggestions
      label: Suggested Improvements
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: resource_recommendations
      label: Recommended Resources
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: librarian_response
      label: Librarian Response
      hint: null
      type: text
      options: []
      required: false
