inputSchema:
  type: object
  properties:
    title: Book Recommendation Form
    pages:
      - id: 1
        name: recommendation_header
        label: -- Recommendation Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: recommender_name
        label: Recommender name
        hint: Optional for follow system suggestions
        type: text
        options: []
        required: false
      - id: 3
        name: email
        label: Email address
        hint: For clarification if needed
        type: email
        options: []
        required: false
      - id: 4
        name: book_title
        label: Book title
        hint: Title you recommend
        type: text
        options: []
        required: true
      - id: 5
        name: author
        label: Author
        hint: Book author
        type: text
        options: []
        required: true
      - id: 6
        name: reason_for_recommendation
        label: Reason for recommendation
        hint: Why this book should be acquired
        type: text
        options: []
        required: true
      - id: 7
        name: audience
        label: Intended audience
        hint: Who will benefit from this book
        type: select_one
        options:
          - Children
          - Teens
          - Adults
          - All ages
        required: false
      - id: 8
        name: notes
        label: Additional notes
        hint: Any other helpful information
        type: text
        options: []
        required: false
