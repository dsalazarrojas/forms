inputSchema:
  type: object
  properties:
    title: Library Program Engagement Assessment Form
    pages:
    - id: 1
      name: event_participants
      label: Event participants
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: event_attendance
      label: Event attendance
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: satisfaction_level
      label: Satisfaction level
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: true
    - id: 4
      name: favorite_program
      label: Favorite program
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: program_frequency
      label: How often do you visit library
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: favorite_program_type
      label: Favorite program type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: library_visits
      label: How many times have you visited the library in the past year
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: program_interests
      label: What interests you about our programs?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: program_recommendations
      label: Do you have any program recommendations
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: contact_info
      label: Contact information
      hint: null
      type: text
      options: []
      required: false
