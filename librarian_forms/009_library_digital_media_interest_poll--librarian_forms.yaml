inputSchema:
  type: object
  properties:
    title: Library Digital Media Interest Poll
    pages:
    - id: 1
      name: digital_media_usage
      label: Digital Media Usage
      hint: null
      type: select_multiple
      options:
      - E-books
      - Audiobooks
      - Streaming services
      - Music
      - Movies
      required: false
    - id: 2
      name: satisfaction
      label: Satisfaction
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 3
      name: future_needs
      label: Future Needs
      hint: null
      type: select_multiple
      options:
      - More e-books
      - More streaming services
      - More audiobooks
      - Other (please specify)
      required: false
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: workshop_interest
      label: Workshop Interest
      hint: null
      type: select_multiple
      options:
      - More digital media workshops
      - More digital media collections development
      - Other (please specify)
      required: false
    - id: 8
      name: workshop_comments
      label: Workshop Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: other_needs
      label: Other Needs
      hint: null
      type: select_multiple
      options:
      - More programming
      - More author readings
      - Other (please specify)
      required: false
