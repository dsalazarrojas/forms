inputSchema:
  type: object
  properties:
    title: Library Feedback Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Very poor
      - Poor
      - Neutral
      - Good
      - Excellent
      required: true
    - id: 6
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Complaint
      - Praise
      - Problem
      - Suggestion
      required: true
    - id: 7
      name: other_category
      label: Other category
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: other_comments
      label: Other comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: other_category_2
      label: Other category 2
      hint: null
      type: select_one
      options:
      - Category 1
      - Category 2
      - Category 3
      required: false
    - id: 10
      name: other_rating
      label: Other rating
      hint: null
      type: select_multiple
      options:
      - Very poor
      - Poor
      - Neutral
      - Good
      - Excellent
      required: false
    - id: 11
      name: other_comments_2
      label: Other comments 2
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: true
