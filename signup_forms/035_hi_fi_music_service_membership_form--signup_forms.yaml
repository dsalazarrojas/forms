inputSchema:
  type: object
  properties:
    title: Hi Fi Music Service Membership Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 4
      name: email_confirmation
      label: Confirm Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: password
      label: Password
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: password_confirmation
      label: Confirm Password
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: music_service
      label: Music Service
      hint: null
      type: select_one
      options:
      - Spotify
      - Apple Music
      - Google Play Music
      required: true
    - id: 9
      name: music_service_other
      label: Other Music Service
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: agree_terms
      label: Agree to terms
      hint: null
      type: text
      options: []
