inputSchema:
  type: object
  properties:
    title: Cable Service Free Trial Registration
    pages:
      - id: 1
        name: full_name
        label: Full name
        hint: For trial sign up
        type: text
        options: []
        required: true
      - id: 2
        name: email
        label: Email address
        hint: Trial activation will use this
        type: email
        options: []
        required: true
      - id: 3
        name: address
        label: Service address
        hint: Where trial service will be provided
        type: text
        options: []
        required: true
      - id: 4
        name: preferred_start_date
        label: Preferred start date
        hint: When you want trial to begin
        type: date
        options: []
        required: false
      - id: 5
        name: equipment_required
        label: Equipment required
        hint: Modem router or installation
        type: select_multiple
        options:
          - Modem
          - Router
          - Professional installation
        required: false
      - id: 6
        name: acceptance_terms
        label: Acceptance of trial terms
        hint: Agree to service terms and conditions
        type: select_one
        options:
          - I agree
          - I do not agree
        required: true
      - id: 7
        name: referral_code
        label: Referral code
        hint: Optional
        type: text
        options: []
        required: false
      - id: 8
        name: comments
        label: Comments or questions
        hint: Any additional information
        type: text
        options: []
        required: false
