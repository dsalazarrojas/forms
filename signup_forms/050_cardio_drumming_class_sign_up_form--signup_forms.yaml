inputSchema:
  type: object
  properties:
    title: Cardio Drumming Class Sign Up Form
    pages:
    - id: 1
      name: participant_information
      label: -- PARTICIPANT INFORMATION --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: age_group
      label: Age group
      hint: null
      type: select_one
      options:
      - Under 18
      - 18-25
      - 26-35
      - 36-45
      - 46-55
      - 56-65
      - 65+
      required: false
    - id: 7
      name: fitness_level
      label: Fitness level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Not Sure
      required: true
    - id: 8
      name: class_details
      label: -- CLASS SELECTION --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: class_name
      label: Class name or title
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: class_date
      label: Preferred class date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: class_time
      label: Preferred class time
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: session_type
      label: Session type
      hint: null
      type: select_one
      options:
      - Drop-in Class
      - 4-Week Package
      - 8-Week Package
      - 12-Week Package
      - Unlimited Monthly
      required: true
    - id: 13
      name: instructor_preference
      label: Instructor preference (if available)
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: additional_classes
      label: Additional classes to register for
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: health_information
      label: -- HEALTH & SAFETY --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: medical_conditions
      label: Do you have any medical conditions we should know about?
      hint: Heart condition, arthritis, injuries, etc.
      type: text
      options: []
      required: false
    - id: 17
      name: injuries_limitations
      label: Current injuries or physical limitations?
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: medications
      label: Any medications affecting exercise?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Sure
      required: false
    - id: 19
      name: doctor_clearance
      label: Do you have doctor clearance for aerobic exercise?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Required
      required: true
    - id: 20
      name: waiver_agreement
      label: I understand the risks of participating in cardio drumming class
      hint: null
      type: select_one
      options:
      - Yes - I Agree
      - No - I Do Not Agree
      required: true
    - id: 21
      name: class_experience
      label: -- CLASS EXPERIENCE --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: drumming_experience
      label: Drumming experience
      hint: null
      type: select_one
      options:
      - No Experience
      - Some Background
      - Experienced Drummer
      required: false
    - id: 23
      name: motivation
      label: What motivates you to take this class?
      hint: null
      type: select_multiple
      options:
      - Fitness and Cardio
      - Fun and Music
      - Stress Relief
      - Community
      - Rhythm Coordination
      - Weight Management
      required: false
    - id: 24
      name: pricing_and_payment
      label: Class fee
      hint: null
      type: number
      options: []
      required: true
    - id: 25
      name: consent_confirmation
      label: I confirm my information is accurate and I consent to participate
      hint: null
      type: select_one
      options:
      - Yes - I Consent
      - No - I Do Not Consent
      required: true
