      - Has conflicts — contact for details
      required: false
    - id: 22
      name: consent_for_nomination
      label: Nominee consent to be nominated
      hint: Must be confirmed before finalizing the ballot
      type: select_one
      options:
      - Yes, nominee consents to be nominated
      - No, nominee does not consent
      required: true
    - id: 23
      name: additional_comments
      label: Additional comments or notes
      hint: Optional—use for endorsements, references, or special instructions
      type: text
      options: []
      required: false
