inputSchema:
  type: object
  properties:
    title: Open Science Education Community Registration Form
    pages:
    - id: 1
      name: member_details
      label: Member Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: member_interests
      label: Member Interests
      hint: Select all that apply
      type: select_multiple
      options:
      - Science
      - Education
      - Open Science
      - Community Development
      - Research
      required: true
    - id: 3
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: contact_info
      label: Contact Info
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: science_focus_area
      label: Science Focus Area
      hint: null
      type: select_one
      options:
      - Astrophysics
      - Biology
      - Chemistry
      - Physics
      - Earth and Planetary Science
      - Engineering
      - Mathematics
      - Medicine
      - Other
      required: true
    - id: 7
      name: educational_background
      label: Educational Background
      hint: null
      type: select_one
      options:
      - Bachelor's
      - Master's
      - PhD
      required: false
    - id: 8
      name: research_interests
      label: Research Interests
      hint: null
      type: select_multiple
      options:
      - Artificial Intelligence
      - Biomechanics
      - Computational Biology
      - Data Science
      - Machine Learning
      - Neuroscience
      - Quantum Mechanics
      - Robotics
      - Sustainability
      required: false
    - id: 9
      name: skills
      label: Skills
      hint: null
      type: select_multiple
      options:
      - Communication
      - Leadership
      - Project Management
      - Time Management
      - Team Management
      required: false
    - id: 10
      name: language_spoken
      label: Language Spoken
      hint: Select all that apply
      type: select_multiple
      options:
      - English
      - Mandarin
      - Spanish
      - French
      - Japanese
      - German
      - Portuguese
      - Italian
      required: false
    - id: 11
      name: agree_terms
      label: Agree to Terms
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
