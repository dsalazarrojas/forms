inputSchema:
  type: object
  properties:
    title: signature_verification_form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: select_option
      label: Option
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: date_signed
      label: Date Signed
      hint: Date the signature was made
      type: date
      options: []
      required: true
    - id: 4
      name: time_signed
      label: Time Signed
      hint: Time the signature was made
      type: time
      options: []
      required: true
    - id: 5
      name: verification_status
      label: Verification Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 6
      name: signature_type
      label: Signature Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: reason_for_rejection
      label: Reason for Rejection
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
