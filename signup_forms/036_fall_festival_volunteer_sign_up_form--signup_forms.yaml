inputSchema:
  type: object
  properties:
    title: Fall Festival Volunteer Sign Up Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: availability
      label: Availability
      hint: null
      type: select_multiple
      options:
      - Shift 1
      - Shift 2
      - Shift 3
      required: false
    - id: 6
      name: volunteer_role
      label: Volunteer Role
      hint: null
      type: select_one
      options:
      - Event Volunteer
      - Event Staff
      - Festival Coordinator
      required: true
    - id: 7
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
