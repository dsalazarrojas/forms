inputSchema:
  type: object
  properties:
    title: Clubhouse Moderator Sign Up Form
    pages:
    - id: 1
      name: moderator_name
      label: Your Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: moderator_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: moderator_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: clubhouse_username
      label: Clubhouse Username
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: signup_date
      label: Sign-Up Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: room_topic
      label: Room Topic or Theme
      hint: What is the room about
      type: text
      options: []
      required: true
    - id: 7
      name: session_date
      label: Planned Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: session_time
      label: Session Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: expected_attendees
      label: Expected Number of Attendees
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: moderation_experience
      label: Moderation Experience Level
      hint: Your experience level
      type: select_one
      options:
      - First Time
      - Some Experience
      - Regular Moderator
      - Experienced Leader
      required: true
    - id: 11
      name: contribution_areas
      label: How Will You Contribute to the Session
      hint: Select all that apply
      type: select_multiple
      options:
      - Lead Discussion
      - Manage Questions
      - Facilitate Networking
      - Share Expertise
      - Keep Time
      - Monitor Chat
      required: true
    - id: 12
      name: expertise_area
      label: Your Area of Expertise
      hint: What you specialize in
      type: text
      options: []
      required: true
    - id: 13
      name: commitment_level
      label: Commitment Level
      hint: How involved will you be
      type: select_one
      options:
      - Minimal Participation
      - Moderate Involvement
      - Significant Involvement
      - Full Leadership
      required: true
    - id: 14
      name: special_requests
      label: Special Requests or Requirements
      hint: Any specific needs
      type: text
      options: []
      required: false
    - id: 15
      name: acceptance_terms
      label: I Accept Moderator Responsibilities
      hint: Agree to guidelines
      type: select_one
      options:
      - I Accept
      - I Do Not Accept
      required: true
