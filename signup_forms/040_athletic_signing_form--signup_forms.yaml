inputSchema:
  type: object
  properties:
    title: Athletic Signing Form
    pages:
    - id: 1
      name: athlete_name
      label: Athlete Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: MM-DD-YYYY format
      type: date
      options: []
      required: true
    - id: 3
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      - Prefer Not to Say
      required: true
    - id: 4
      name: school_name
      label: School Name
      hint: Name of school
      type: text
      options: []
      required: true
    - id: 5
      name: grade_level
      label: Grade Level
      hint: Current grade
      type: select_one
      options:
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: true
    - id: 6
      name: sport
      label: Sport
      hint: Primary sport
      type: select_one
      options:
      - Football
      - Basketball
      - Soccer
      - Track and Field
      - Swimming
      - Volleyball
      - Baseball
      - Softball
      - Tennis
      - Wrestling
      - Cross Country
      - Golf
      - Cheerleading
      - Other
      required: true
    - id: 7
      name: team_level
      label: Team Level
      hint: Competition level
      type: select_one
      options:
      - Varsity
      - Junior Varsity
      - Freshman
      - Club Team
      required: true
    - id: 8
      name: season
      label: Season
      hint: Which season
      type: select_one
      options:
      - Fall
      - Winter
      - Spring
      - Summer
      required: true
    - id: 9
      name: school_year
      label: School Year
      hint: Academic year
      type: text
      options: []
      required: true
    - id: 10
      name: jersey_number_preference
      label: Jersey Number Preference
      hint: Preferred number if applicable
      type: number
      options: []
      required: false
    - id: 11
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 12
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 13
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 14
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of emergency contact
      type: text
      options: []
      required: true
    - id: 15
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Emergency contact number
      type: text
      options: []
      required: true
    - id: 16
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: Relationship to athlete
      type: text
      options: []
      required: true
    - id: 17
      name: medical_conditions
      label: Medical Conditions or Allergies
      hint: List any conditions or allergies
      type: text
      options: []
      required: true
    - id: 18
      name: current_medications
      label: Current Medications
      hint: List any medications
      type: text
      options: []
      required: false
    - id: 19
      name: insurance_provider
      label: Health Insurance Provider
      hint: Name of insurance company
      type: text
      options: []
      required: true
    - id: 20
      name: insurance_policy_number
      label: Insurance Policy Number
      hint: Policy or member number
      type: text
      options: []
      required: true
    - id: 21
      name: physician_name
      label: Primary Physician Name
      hint: Name of regular doctor
      type: text
      options: []
      required: true
    - id: 22
      name: physician_phone
      label: Primary Physician Phone
      hint: Doctor contact number
      type: text
      options: []
      required: true
    - id: 23
      name: physical_exam_date
      label: Physical Examination Date
      hint: Date of sports physical
      type: date
      options: []
      required: true
    - id: 24
      name: medical_clearance
      label: Medical Clearance Status
      hint: Is athlete cleared for participation
      type: select_one
      options:
      - Cleared Without Restrictions
      - Cleared With Restrictions
      - Not Cleared
      - Pending Review
      required: true
    - id: 25
      name: code_of_conduct
      label: Code of Conduct Agreement
      hint: I agree to follow the athletic code of conduct
      type: select_one
      options:
      - Yes - I Agree
      - 'No'
      required: true
    - id: 26
      name: sportsmanship_agreement
      label: Sportsmanship Agreement
      hint: I agree to demonstrate good sportsmanship
      type: select_one
      options:
      - Yes - I Agree
      - 'No'
      required: true
    - id: 27
      name: assumption_of_risk
      label: Assumption of Risk
      hint: I understand and accept the risks of athletic participation
      type: select_one
      options:
      - Yes - I Understand
      - 'No'
      required: true
    - id: 28
      name: medical_treatment_permission
      label: Medical Treatment Permission
      hint: Permission to seek emergency medical treatment
      type: select_one
      options:
      - Yes - I Grant Permission
      - 'No'
      required: true
    - id: 29
      name: media_release
      label: Media Release
      hint: Permission for photos and media coverage
      type: select_one
      options:
      - Yes - Allowed
      - No - Not Allowed
      required: true
    - id: 30
      name: commitment_statement
      label: Commitment Statement
      hint: I commit to giving my best effort throughout the season
      type: select_one
      options:
      - Yes - I Commit
      - 'No'
      required: true
    - id: 31
      name: athlete_signature
      label: Athlete Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 32
      name: parent_guardian_signature
      label: Parent or Guardian Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 33
      name: signature_date
      label: Signature Date
      hint: Date of signature
      type: date
      options: []
      required: true
