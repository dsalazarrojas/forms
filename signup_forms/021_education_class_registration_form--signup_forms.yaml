      type: email
      options: []
      required: true
    - id: 13
      name: class_schedule_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: student_email_phone
      label: Email/Phone
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      required: false
    - id: 15
      name: class_schedule_address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: student_schedule
      label: Schedule
      hint: null
