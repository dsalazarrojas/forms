    - id: 6
      name: student_preferences
      label: Student Preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: student_goals
      label: Student Goals
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: student_notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: class_schedule_time
      label: Class Schedule Time
      hint: null
      type: time
      options: []
      required: false
