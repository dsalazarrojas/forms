inputSchema:
  type: object
  properties:
    title: Alis Wonderland Team East Members
    pages:
    - id: 1
      name: student_first_name
      label: First Name
      hint: Student first name
      type: text
      options: []
      required: true
    - id: 2
      name: student_last_name
      label: Last Name
      hint: Student last name
      type: text
      options: []
      required: true
    - id: 3
      name: student_email
      label: Student Email
      hint: School or personal email
      type: email
      options: []
      required: true
    - id: 4
      name: grade_level
      label: Grade Level
      hint: Current grade
      type: select_one
      options:
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: true
    - id: 5
      name: school_name
      label: School Name
      hint: Your school
      type: select_one
      options:
      - Hot Springs Middle School
      - Hot Springs High School
      - Hot Springs High School East Lab
      - Other
      required: true
    - id: 6
      name: parent_guardian_name
      label: Parent/Guardian Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 7
      name: parent_guardian_email
      label: Parent/Guardian Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 8
      name: parent_guardian_phone
      label: Parent/Guardian Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 9
      name: home_address
      label: Home Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 10
      name: t_shirt_size
      label: T-Shirt Size
      hint: For team shirts
      type: select_one
      options:
      - Youth Small
      - Youth Medium
      - Youth Large
      - Adult Small
      - Adult Medium
      - Adult Large
      - Adult XL
      - Adult 2XL
      required: true
    - id: 11
      name: team_interest
      label: Area of Interest
      hint: What interests you?
      type: select_multiple
      options:
      - Community service
      - Environmental projects
      - Technology
      - Arts and creativity
      - Sports and fitness
      - Education and tutoring
      - Event planning
      - Marketing and communications
      - Leadership
      - All areas
      required: true
    - id: 12
      name: availability_days
      label: Available Days
      hint: Select all that apply
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 13
      name: availability_time
      label: Available Times
      hint: When are you free?
      type: select_multiple
      options:
      - After school (3-5 PM)
      - Evening (5-8 PM)
      - Weekend mornings
      - Weekend afternoons
      - Flexible
      required: true
    - id: 14
      name: transportation
      label: Transportation Method
      hint: How will you get to events?
      type: select_one
      options:
      - Parent/guardian drop-off
      - Parent/guardian pick-up
      - School bus
      - Walk/bike
      - Other arrangement
      required: true
    - id: 15
      name: previous_volunteer_experience
      label: Previous Volunteer Experience
      hint: Describe any experience
      type: text
      options: []
      required: false
    - id: 16
      name: skills_and_talents
      label: Skills and Talents
      hint: What are you good at?
      type: text
      options: []
      required: false
    - id: 17
      name: why_join
      label: Why Do You Want to Join?
      hint: Your motivation
      type: text
      options: []
      required: true
    - id: 18
      name: goals_for_team
      label: What Do You Hope to Achieve?
      hint: Your goals
      type: text
      options: []
      required: true
    - id: 19
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: If different from parent
      type: text
      options: []
      required: false
    - id: 20
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Emergency number
      type: text
      options: []
      required: true
    - id: 21
      name: medical_conditions
      label: Medical Conditions/Allergies
      hint: Any conditions we should know
      type: text
      options: []
      required: false
    - id: 22
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: For events with food
      type: text
      options: []
      required: false
    - id: 23
      name: photo_release
      label: Photo Release
      hint: Allow photos for publicity?
      type: select_one
      options:
      - Yes, photos may be taken and used
      - No, do not take photos
      - Yes, but only for internal use
      required: true
    - id: 24
      name: media_release
      label: Media Release
      hint: Allow use in social media?
      type: select_one
      options:
      - Yes, I grant permission
      - No, I do not grant permission
      required: true
    - id: 25
      name: code_of_conduct
      label: Code of Conduct Agreement
      hint: Agree to follow rules?
      type: select_one
      options:
      - Yes, I agree to follow the code of conduct
      - 'False'
      required: true
    - id: 26
      name: commitment_understanding
      label: Commitment Understanding
      hint: Do you understand the time commitment?
      type: select_one
      options:
      - Yes, I understand and commit
      - No, I need more information
      required: true
    - id: 27
      name: how_hear_about_program
      label: How Did You Hear About Us?
      hint: Source of information
      type: select_one
      options:
      - School announcement
      - Teacher referral
      - Friend
      - Parent
      - Social media
      - Community event
      - Other
      required: false
    - id: 28
      name: additional_comments
      label: Additional Comments
      hint: Anything else to share
      type: text
      options: []
      required: false
