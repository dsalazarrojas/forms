inputSchema:
  type: object
  properties:
    title: Startup App Beta Tester Signup Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 4
      name: email_confirmation
      label: Confirm Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: password
      label: Password
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: confirm_password
      label: Confirm Password
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: beta_program
      label: Beta Program
      hint: null
      type: select_one
      options:
      - Beta Program A
      - Beta Program B
      - Beta Program C
      required: true
    - id: 9
      name: terms_of_service
      label: I accept the terms of service
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: how_did_you_hear
      label: How did you hear about the beta program?
      hint: null
      type: select_one
      options:
      - Social Media
      - Friend
      - Online Search
      - Other
      required: false
    - id: 11
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
