inputSchema:
  type: object
  properties:
    title: Community Defense Signal Group Sign Up
    pages:
    - id: 1
      name: participant_name
      label: Name or Alias
      hint: Your name or preferred alias
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: For initial contact and verification
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Number associated with Signal account
      type: text
      options: []
      required: true
    - id: 4
      name: neighborhood
      label: Neighborhood or Area
      hint: Which area do you represent?
      type: text
      options: []
      required: true
    - id: 5
      name: join_reason
      label: Reason for Joining
      hint: Why do you want to join this group?
      type: select_one
      options:
      - Neighborhood Safety
      - Emergency Preparedness
      - Community Organizing
      - Mutual Aid
      - Information Sharing
      - General Interest
      required: true
    - id: 6
      name: skills_resources
      label: Skills or Resources You Can Offer
      hint: What can you contribute to the group?
      type: text
      options: []
      required: false
    - id: 7
      name: availability
      label: Availability for Response
      hint: When are you available to help?
      type: select_multiple
      options:
      - Weekday Mornings
      - Weekday Afternoons
      - Weekday Evenings
      - Weekend Mornings
      - Weekend Afternoons
      - Weekend Evenings
      - On Call
      required: true
    - id: 8
      name: security_clearance
      label: Have You Verified Your Identity
      hint: Identity verification required
      type: select_one
      options:
      - Yes, Ready to Verify
      - Need Instructions
      required: true
    - id: 9
      name: signal_installed
      label: Do You Have Signal Installed
      hint: Signal app is required for this group
      type: select_one
      options:
      - true
      - No, Will Install
      required: true
    - id: 10
      name: communication_preferences
      label: Preferred Communication Methods
      hint: How do you prefer to communicate?
      type: select_multiple
      options:
      - Signal Messages
      - Signal Calls
      - Signal Video Calls
      - Email
      - In Person Meetings
      required: true
    - id: 11
      name: guidelines_agreement
      label: Agree to Group Guidelines
      hint: I agree to follow group security protocols
      type: select_one
      options:
      - Yes, I Agree
      - Other
      required: true
    - id: 12
      name: confidentiality_agreement
      label: Confidentiality Agreement
      hint: I will not share group information externally
      type: select_one
      options:
      - Yes, I Agree
      - Other
      required: true
    - id: 13
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Person to contact in emergencies
      type: text
      options: []
      required: false
    - id: 14
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Emergency contact number
      type: text
      options: []
      required: false
    - id: 15
      name: additional_comments
      label: Additional Information
      hint: Anything else you want us to know?
      type: text
      options: []
      required: false
