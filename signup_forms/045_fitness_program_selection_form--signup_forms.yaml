inputSchema:
  type: object
  properties:
    title: Fitness Program Selection Form
    pages:
    - id: 1
      name: client_details
      label: Client Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: programs
      label: Select a Program
      hint: null
      type: select_one
      options:
      - Weight Lifting
      - Yoga
      - Pilates
      - Cardio Kickboxing
      - Cycling
      - Dance
      - Hiking
      - Running
      - Swimming
      - Tennis
      required: true
    - id: 3
      name: preferred_time
      label: Preferred Time
      hint: null
      type: select_multiple
      options:
      - Mornings
      - Afternoons
      - Evenings
      - Weekends
      required: true
    - id: 4
      name: frequency
      label: Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - 3x per week
      - 2x per week
      - Less than 2x per week
      required: true
    - id: 5
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: trainer
      label: Preferred Trainer
      hint: null
      type: select_one
      options:
      - John Doe
      - Jane Doe
      - Jim Smith
      - Jane Smith
      required: true
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: location
      label: Location
      hint: null
      type: select_one
      options:
      - City Center
      - Suburbs
      - Regional
      required: true
    - id: 11
      name: preferred_language
      label: Preferred Language
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - Mandarin
      required: true
    - id: 12
      name: additional_information
