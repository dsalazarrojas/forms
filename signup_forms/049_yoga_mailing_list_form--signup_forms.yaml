inputSchema:
  type: object
  properties:
    title: Yoga Mailing List Form
    pages:
    - id: 1
      name: name
      label: Full Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: confirm_email
      label: Confirm Email
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: accept_terms
      label: Accept Terms
      hint: null
      type: select_one
      options:
      - I accept the terms and conditions
      - I decline the terms and conditions
      required: false
    - id: 6
      name: accept_newsletter
      label: Accept Newsletter
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: country
      label: Country
      hint: null
      type: select_multiple
      options:
      - Canada
      - USA
      - India
      required: false
    - id: 8
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: false
