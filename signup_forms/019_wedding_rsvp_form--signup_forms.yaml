inputSchema:
  type: object
  properties:
    title: Wedding RSVP Form
    pages:
    - id: 1
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: attending
      label: Attending
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
    - id: 5
      name: rsvp_date
      label: RSVP Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: special_requests
      label: Special Requests
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: guest_count
      label: Guest Count
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: null
      type: select_one
      options:
      - Gluten Free
      - Vegetarian
      - Vegan
      - None
      required: false
    - id: 10
      name: meal_preferences
      label: Meal Preferences
      hint: null
      type: select_multiple
      options:
      - Grilled Steak
      - Baked Salmon
      - Vegetarian Option
      - None
      required: false
    - id: 11
      name: time_arrival
      label: Time of Arrival
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: message2
      label: Message 2
      hint: null
      type: note
      options: []
      required: false
