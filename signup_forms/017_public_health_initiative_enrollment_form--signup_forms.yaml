      required: false
    - id: 6
      name: phone_number
      label: phone_number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: follow_up_date
      label: follow_up_date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: assigned_to
      label: assigned_to
      hint: null
      type: select_one
      options:
      - chatjimmy
      - user2
      - user3
      required: false
    - id: 10
      name: medical_notes
      label: medical_notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: follow_up_status
      label: follow_up_status
      hint: null
      type: select_one
      options:
      - pending
      - completed
      - missed
      required: false
