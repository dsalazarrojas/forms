inputSchema:
  type: object
  properties:
    title: Mpox Vaccine Sign Up Form
    pages:
    - id: 1
      name: user_info
      label: user_info
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: mpox_vaccine_choice
      label: Choose Mpox Vaccine
      hint: null
      type: select_one
      options:
      - J&J
      - Pfizer
      - Moderna
      required: true
    - id: 3
      name: schedule_vaccine
      label: schedule_vaccine
      hint: null
      type: date
      options: []
      required: true
