inputSchema:
  type: object
  properties:
    title: Business Registration Form
    pages:
    - id: 1
      name: business_name
      label: Business Name
      hint: Legal name of your business
      type: text
      options: []
      required: true
    - id: 2
      name: business_type
      label: Type of Business
      hint: Select the category that best describes your business
      type: select_one
      options:
      - Sole Proprietorship
      - Partnership
      - Corporation
      - Limited Liability Company
      - Nonprofit Organization
      required: true
    - id: 3
      name: owner_first_name
      label: Owner First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: owner_last_name
      label: Owner Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: owner_email
      label: Owner Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 6
      name: owner_phone
      label: Owner Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 7
      name: business_address
      label: Business Address
      hint: Street address or physical location
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: state
      label: State or Province
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: zip_code
      label: ZIP or Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: country
      label: Country
      hint: Country where business is located
      type: text
      options: []
      required: true
    - id: 12
      name: business_phone
      label: Business Phone Number
      hint: Main business contact number
      type: text
      options: []
      required: false
    - id: 13
      name: business_website
      label: Business Website
      hint: Your company website URL if available
      type: text
      options: []
      required: false
    - id: 14
      name: startup_date
      label: Business Start Date
      hint: When did you start this business
      type: date
      options: []
      required: true
    - id: 15
      name: number_of_employees
      label: Number of Employees
      hint: How many people work for your business
      type: number
      options: []
      required: true
    - id: 16
      name: business_description
      label: Brief Business Description
      hint: Tell us about your business
      type: text
      options: []
      required: true
