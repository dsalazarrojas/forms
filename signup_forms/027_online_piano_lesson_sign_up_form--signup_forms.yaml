inputSchema:
  type: object
  properties:
    title: Online Piano Lesson Sign Up Form
    pages:
    - id: 1
      name: sign_up_details
      label: Sign Up Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: lesson_scheduling
      label: Lesson Scheduling
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: preferred_time
      label: Preferred Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: select_instructor
      label: Select Instructor
      hint: null
      type: select_one
      options:
      - Mr. Smith
      - Ms. Johnson
      - Mr. Johnson
      required: true
    - id: 8
      name: select_lesson_type
      label: Select Lesson Type
      hint: null
      type: select_one
      options:
      - Private Lessons
      - Group Lessons
      - Trial Lessons
      required: true
    - id: 9
      name: message
      label: Message to Instructor
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: sign_up_confirmation
      label: Sign Up Confirmation
      hint: null
      type: text
      options: []
      required: false
