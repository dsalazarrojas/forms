inputSchema:
  type: object
  properties:
    title: Axe Throwing Tournament Form
    pages:
    - id: 1
      name: section_team_info
      label: -- Team Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: team_name_axe
      label: Team Name
      hint: Choose a unique and catchy name
      type: text
      options: []
      required: true
    - id: 3
      name: captain_name
      label: Team Captain Full Name
      hint: Primary point of contact
      type: text
      options: []
      required: true
    - id: 4
      name: captain_email
      label: Captain Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: captain_phone
      label: Captain Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_roster
      label: -- Team Roster --
      hint: List all members of the team
      type: note
      options: []
      required: false
    - id: 7
      name: member_1_name
      label: Team Member 1 Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: member_2_name
      label: Team Member 2 Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: member_3_name
      label: Team Member 3 Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 10
      name: member_4_name
      label: Team Member 4 Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 11
      name: section_tournament_details
      label: -- Tournament Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: tournament_category
      label: Tournament Category
      hint: Select the appropriate skill level
      type: select_one
      options:
      - Amateur (New Throwers)
      - Professional (Competitive)
      - Corporate (Team Building)
      - Mixed (Mixed Skills)
      required: true
    - id: 13
      name: tournament_date_axe
      label: Date of Tournament
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: venue_location_axe
      label: Venue Location
      hint: e.g. Central Axe Hall
      type: text
      options: []
      required: true
    - id: 15
      name: section_payment_safety
      label: -- Payment and Safety --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: entry_fee_status
      label: Entry Fee Status
      hint: Confirm payment of the entry fee
      type: select_one
      options:
      - Yes, Paid in Full
      - No, Need to Pay
      - Pending Approval
      required: true
    - id: 17
      name: payment_method_axe
      label: Preferred Payment Method
      hint: null
      type: select_one
      options:
      - Credit/Debit Card
      - Cash at Venue
      - Team Account Transfer
      required: true
    - id: 18
      name: experience_axe
      label: Previous Tournament Experience
      hint: How many tournaments has your team entered?
      type: select_one
      options:
      - None (First time)
      - 1 - 3 Tournaments
      - 4+ Tournaments
      required: true
    - id: 19
      name: safety_agreement_axe
      label: I agree to all Tournament Safety Rules
      hint: null
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 20
      name: waiver_confirmation_axe
      label: All team members have signed the liability waiver
      hint: Required for participation
      type: select_one
      options:
      - Yes, Confirmed
      - Other
      required: true
    - id: 21
      name: captain_signature_axe
      label: Captain Digital Signature
      hint: Type full name to sign for the team
      type: text
      options: []
      required: true
