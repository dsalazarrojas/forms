inputSchema:
  type: object
  properties:
    title: Daily Currency Exchange Rate Preferences
    pages:
    - id: 1
      name: update_frequency
      label: Update frequency
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 2
      name: preferred_update_time
      label: Preferred update time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: delivery_method
      label: Delivery method
      hint: null
      type: select_one
      options:
      - Email
      - SMS
      - Push
      required: false
    - id: 4
      name: preferred_currencies
      label: Preferred currencies
      hint: null
      type: select_multiple
      options:
      - USD
      - EUR
      - JPY
      - CNY
      required: false
    - id: 5
      name: start_date
      label: Start date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: end_date
      label: End date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: timezone
      label: Timezone
      hint: null
      type: select_one
      options:
      - UTC
      - EST
      - PST
      required: false
    - id: 8
      name: timezone_offset
      label: Timezone offset
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: delivery_frequency
      label: Delivery frequency
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 10
      name: currency_update_time
      label: Currency update time
      hint: null
      type: time
      options: []
      required: false
