inputSchema:
  type: object
  properties:
    title: Join The Housing Co Operative Mailing List
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: interests
      label: Interests
      hint: null
      type: select_multiple
      options:
      - Community housing
      - Cooperative living
      - Community events
      - Other
      required: true
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: join_method
      label: How did you hear about us?
      hint: null
      type: select_one
      options:
      - Social media
      - Word of mouth
      - Online Search
      - Friend/Neighbor
      required: false
    - id: 10
      name: how_do_we_communicate
      label: How would you like us to communicate with you?
      hint: null
      type: select_one
      options:
      - Email
      - Phone call
      - Text message
      - Mail
      - Never
      required: true
    - id: 11
      name: how_often_to_communicate
      label: How often would you like us to communicate with you?
      hint: null
      type: select_multiple
      options:
      - As needed
      - Weekly
      - Bi-weekly
      - Monthly
      - Quarterly
      - Never
      required: true
    - id: 12
      name: how_do_you_prefer
      label: How do you prefer to contact us?
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Mail
      - None
      required: false
    - id: 13
      name: other_notes
      label: Other comments or notes
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: other_contact_info
      label: Other contact info
      hint: null
      type: text
      options: []
      required: false
