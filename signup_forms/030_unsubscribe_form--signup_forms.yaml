inputSchema:
  type: object
  properties:
    title: Unsubscribe Form
    pages:
    - id: 1
      name: form_title
      label: form_title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: form_description
      label: form_description
      hint: null
      type: text
      options: []
