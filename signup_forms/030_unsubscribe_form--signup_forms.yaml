      name: confirm_email
      label: confirm_email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: reason
      label: reason
      hint: Why are you leaving?
      type: text
      options: []
      required: false
    - id: 6
      name: unsubscribe
      label: unsubscribe
      hint: null
      type: select_multiple
      options:
