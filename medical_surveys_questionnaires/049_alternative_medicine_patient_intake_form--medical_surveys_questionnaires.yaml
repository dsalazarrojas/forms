inputSchema:
  type: object
  properties:
    title: Alternative Medicine Patient Intake Form
    pages:
    - id: 1
      name: patient_first_name
      label: First Name
      hint: Patient first name
      type: text
      options: []
      required: true
    - id: 2
      name: patient_last_name
      label: Last Name
      hint: Patient last name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 4
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 7
      name: mailing_address
      label: Mailing Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 8
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Who to call in emergency?
      type: text
      options: []
      required: true
    - id: 9
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Emergency number
      type: text
      options: []
      required: true
    - id: 10
      name: occupation
      label: Occupation
      hint: Current job
      type: text
      options: []
      required: false
    - id: 11
      name: marital_status
      label: Marital Status
      hint: Current status
      type: select_one
      options:
      - Single
      - Married
      - Divorced
      - Widowed
      - Separated
      - Partnered
      required: false
    - id: 12
      name: primary_health_concern
      label: Primary Health Concern
      hint: Main reason for visit
      type: text
      options: []
      required: true
    - id: 13
      name: health_concern_duration
      label: How Long Have You Had This Concern?
      hint: Duration
      type: select_one
      options:
      - Less than 1 month
      - 1-6 months
      - 6 months - 1 year
      - 1-5 years
      - Over 5 years
      required: true
    - id: 14
      name: previous_conventional_treatment
      label: Previous Conventional Treatment
      hint: Have you seen MDs?
      type: select_one
      options:
      - Yes, currently under care
      - Yes, in the past
      - No, never
      required: true
    - id: 15
      name: current_medications
      label: Current Medications
      hint: List all prescriptions
      type: text
      options: []
      required: true
    - id: 16
      name: supplements_herbs
      label: Supplements and Herbs
      hint: List all supplements
      type: text
      options: []
      required: false
    - id: 17
      name: medication_allergies
      label: Medication Allergies
      hint: Any drug allergies?
      type: text
      options: []
      required: true
    - id: 18
      name: food_allergies
      label: Food Allergies
      hint: Any food allergies?
      type: text
      options: []
      required: false
    - id: 19
      name: other_allergies
      label: Other Allergies
      hint: Environmental, etc.
      type: text
      options: []
      required: false
    - id: 20
      name: alternative_medicine_experience
      label: Alternative Medicine Experience
      hint: Have you tried before?
      type: select_one
      options:
      - Yes, extensive experience
      - Yes, some experience
      - Yes, limited experience
      - No, first time
      required: true
    - id: 21
      name: previous_alternative_treatments
      label: Previous Alternative Treatments
      hint: What have you tried?
      type: select_multiple
      options:
      - Acupuncture
      - Herbal medicine
      - Homeopathy
      - Naturopathy
      - Chiropractic
      - Massage therapy
      - Energy healing
      - Ayurveda
      - Traditional Chinese Medicine
      - None
      required: false
    - id: 22
      name: treatment_effectiveness
      label: How Effective Were Previous Treatments?
      hint: Rate effectiveness
      type: select_one
      options:
      - Very effective
      - Somewhat effective
      - Not effective
      - Made symptoms worse
      - Not applicable
      required: false
    - id: 23
      name: interest_in_treatments
      label: Treatments of Interest
      hint: What interests you?
      type: select_multiple
      options:
      - Herbal medicine
      - Nutritional counseling
      - Acupuncture
      - Homeopathy
      - Lifestyle counseling
      - Stress management
      - Detoxification
      - Mind-body techniques
      - Other
      required: true
    - id: 24
      name: diet_description
      label: Describe Your Diet
      hint: Typical eating habits
      type: text
      options: []
      required: false
    - id: 25
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Any restrictions?
      type: text
      options: []
      required: false
    - id: 26
      name: exercise_frequency
      label: Exercise Frequency
      hint: How often?
      type: select_one
      options:
      - Daily
      - 4-6 times per week
      - 2-3 times per week
      - Once a week
      - Rarely
      - Never
      required: false
    - id: 27
      name: sleep_quality
      label: Sleep Quality
      hint: Rate your sleep
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 28
      name: stress_level
      label: Stress Level
      hint: Rate your stress
      type: select_one
      options:
      - Very low
      - Low
      - Moderate
      - High
      - Very high
      required: true
    - id: 29
      name: stress_management
      label: How Do You Manage Stress?
      hint: Coping methods
      type: text
      options: []
      required: false
    - id: 30
      name: tobacco_use
      label: Tobacco Use
      hint: Do you smoke/vape?
      type: select_one
      options:
      - Never
      - Former
      - Current
      required: true
    - id: 31
      name: alcohol_use
      label: Alcohol Use
      hint: How much?
      type: select_one
      options:
      - None
      - Occasional
      - Moderate
      - Regular
      required: true
    - id: 32
      name: caffeine_use
      label: Caffeine Use
      hint: Coffee, tea, etc.
      type: select_one
      options:
      - None
      - Occasional
      - Moderate
      - Heavy
      required: false
    - id: 33
      name: recreational_drug_use
      label: Recreational Drug Use
      hint: Any use?
      type: select_one
      options:
      - Never
      - Past use only
      - Occasional
      - Regular
      required: false
    - id: 34
      name: medical_history
      label: Medical History
      hint: Past illnesses/surgeries
      type: text
      options: []
      required: true
    - id: 35
      name: family_medical_history
      label: Family Medical History
      hint: Hereditary conditions
      type: text
      options: []
      required: false
    - id: 36
      name: current_symptoms
      label: Current Symptoms
      hint: List all symptoms
      type: text
      options: []
      required: true
    - id: 37
      name: symptom_triggers
      label: Symptom Triggers
      hint: What makes it worse?
      type: text
      options: []
      required: false
    - id: 38
      name: symptom_relief
      label: What Provides Relief?
      hint: What helps?
      type: text
      options: []
      required: false
    - id: 39
      name: health_goals
      label: Health Goals
      hint: What do you want to achieve?
      type: text
      options: []
      required: true
    - id: 40
      name: treatment_expectations
      label: Treatment Expectations
      hint: What do you expect?
      type: text
      options: []
      required: false
    - id: 41
      name: willingness_to_lifestyle_changes
      label: Willingness to Make Lifestyle Changes
      hint: How committed are you?
      type: select_one
      options:
      - Very willing
      - Somewhat willing
      - Neutral
      - Somewhat unwilling
      - Unwilling
      required: true
    - id: 42
      name: disclaimer_acknowledgment
      label: Disclaimer Acknowledgment
      hint: Do you understand this is alternative medicine?
      type: select_one
      options:
      - Yes, I understand this is not conventional medicine
      - No, I need more information
      required: true
    - id: 43
      name: consent_to_treatment
      label: Consent to Treatment
      hint: Do you consent?
      type: select_one
      options:
      - Yes, I consent to alternative medicine treatment
      - false
      required: true
    - id: 44
      name: information_accuracy
      label: Information Accuracy
      hint: I certify this is accurate
      type: select_one
      options:
      - Yes, all information is accurate
      - false
      required: true
    - id: 45
      name: patient_signature
      label: Patient Signature
      hint: Signature
      type: select_one
      options:
      - I sign and agree
      - Not yet signed
      required: true
    - id: 46
      name: signature_date
      label: Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
