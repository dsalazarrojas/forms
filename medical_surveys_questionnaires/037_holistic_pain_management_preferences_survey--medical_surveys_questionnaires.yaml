      - Low
      required: false
    - id: 2
      name: page_2
      label: current-treatments
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: page_3
      label: therapies-of-interest
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: page_4
      label: pain-management-strategies
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 5
      name: page_5
      label: pain-impact
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: page_6
      label: medical-concerns
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
