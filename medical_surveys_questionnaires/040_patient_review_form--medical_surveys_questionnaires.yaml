    - id: 8
      name: doctor_referral
      label: Doctor Referral
      hint: null
      type: select_one
      options:
      - Dr. Smith
      - Dr. Lee
      - Dr. Thompson
      - Dr. Johnson
      required: false
    - id: 9
      name: patient_review
      label: Patient Review
      hint: null
      type: text
      options: []
