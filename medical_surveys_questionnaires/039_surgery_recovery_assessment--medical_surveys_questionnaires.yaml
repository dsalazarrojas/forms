inputSchema:
  type: object
  properties:
    title: Surgery Recovery Assessment
    pages:
    - id: 1
      name: surgery_recovery
      label: How did you feel today?
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Neutral
      - Bad
      required: false
    - id: 2
      name: pain_level_1
      label: pain level
      hint: null
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      required: false
    - id: 3
      name: surgery_type
