inputSchema:
  type: object
  properties:
    title: Baseline Cognitive Assessment Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY format
      type: date
      options: []
      required: true
    - id: 3
      name: gender
      label: Gender
      hint: Select option
      type: select_one
      options:
      - Male
      - Female
      - Other
      - Prefer not to say
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: For communications
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 6
      name: assessment_date
      label: Assessment Date
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 7
      name: clinician_name
      label: Clinician Name
      hint: Administering clinician
      type: text
      options: []
      required: true
    - id: 8
      name: education_level
      label: Education Level
      hint: Highest level completed
      type: select_one
      options:
      - Less than high school
      - High school graduate
      - Some college
      - College graduate
      - Graduate degree
      required: true
    - id: 9
      name: primary_language
      label: Primary Language
      hint: First language
      type: select_one
      options:
      - English
      - Spanish
      - Chinese
      - French
      - Other
      required: true
    - id: 10
      name: handedness
      label: Handedness
      hint: Dominant hand
      type: select_one
      options:
      - Right handed
      - Left handed
      - Ambidextrous
      required: true
    - id: 11
      name: reason_for_assessment
      label: Reason for Assessment
      hint: Why is this being done
      type: select_one
      options:
      - Baseline screening
      - Pre employment
      - Sports clearance
      - Follow up evaluation
      - Research study
      - Other
      required: true
    - id: 12
      name: medical_history
      label: Relevant Medical History
      hint: Any neurological conditions
      type: text
      options: []
      required: false
    - id: 13
      name: current_medications
      label: Current Medications
      hint: List all medications
      type: text
      options: []
      required: false
    - id: 14
      name: sleep_quality
      label: Sleep Quality Last Night
      hint: How well did you sleep
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 15
      name: caffeine_intake
      label: Caffeine Intake Today
      hint: How much caffeine consumed
      type: select_one
      options:
      - None
      - 1 to 2 servings
      - 3 to 4 servings
      - 5 or more servings
      required: true
    - id: 16
      name: mood_rating
      label: Current Mood Rating
      hint: How do you feel right now
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 17
      name: pain_level
      label: Current Pain Level
      hint: Rate your pain 0 to 10
      type: select_one
      options:
      - 0 - No pain
      - 1 to 3 - Mild pain
      - 4 to 6 - Moderate pain
      - 7 to 9 - Severe pain
      - 10 - Worst pain
      required: true
    - id: 18
      name: vision_corrected
      label: Vision Corrected
      hint: Are you wearing glasses or contacts
      type: select_one
      options:
      - true
      - false
      - Not applicable
      required: true
    - id: 19
      name: hearing_aid
      label: Using Hearing Aid
      hint: Are you using hearing assistance
      type: select_one
      options:
      - true
      - false
      - Not applicable
      required: true
    - id: 20
      name: test_environment
      label: Test Environment
      hint: Where is test administered
      type: select_one
      options:
      - Clinic
      - Hospital
      - Home
      - School
      - Other
      required: true
    - id: 21
      name: distractions_present
      label: Distractions Present
      hint: Any environmental distractions
      type: select_one
      options:
      - None
      - Minimal
      - Moderate
      - Significant
      required: true
    - id: 22
      name: assistance_needed
      label: Assistance Needed
      hint: Does patient need help
      type: select_one
      options:
      - None
      - Minimal
      - Moderate
      - Extensive
      required: true
    - id: 23
      name: consent_given
      label: Informed Consent
      hint: I consent to this assessment
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 24
      name: understanding_confirmed
      label: Understanding Confirmed
      hint: Patient understands the purpose
      type: select_one
      options:
      - Yes, fully understood
      - Partially understood
      - Did not understand
      required: true
    - id: 25
      name: patient_signature
      label: Patient Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 26
      name: clinician_signature
      label: Clinician Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 27
      name: assessment_complete
      label: Assessment Completed
      hint: Was assessment finished
      type: select_one
      options:
      - Yes, completed
      - Partially completed
      - Not completed
      required: true
    - id: 28
      name: notes
      label: Clinician Notes
      hint: Any observations
      type: text
      options: []
      required: false
