inputSchema:
  type: object
  properties:
    title: Medical Research Data Declaration Form
    pages:
    - id: 1
      name: participant_information
      label: Participant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: medical_history
      label: Medical History
      hint: Provide your medical history.
      type: text
      options: []
      required: false
    - id: 4
      name: medical_condition
      label: Medical Condition
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: medical_specialty
      label: Medical Specialty
      hint: null
      type: select_one
      options:
      - cardiovascular specialist
      - neurologist
      - pulmonologist
      required: false
    - id: 6
      name: medications
      label: Medications
      hint: Please list the name of your medications.
      type: note
      options: []
      required: false
    - id: 7
      name: allergies
      label: Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: emergency_contacts
      label: Emergency Contacts
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: health_insurance
      label: Health Insurance
      hint: null
      type: select_one
      options:
      - private
      - public
      - none
      required: false
    - id: 10
      name: medical_record_number
      label: Medical Record Number
      hint: Please enter your medical record number.
      type: text
      options: []
      required: false
