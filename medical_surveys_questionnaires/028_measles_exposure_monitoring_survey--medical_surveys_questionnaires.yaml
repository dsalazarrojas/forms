inputSchema:
  type: object
  properties:
    title: Measles Exposure Monitoring Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: contact_information
      label: Contact Information
      hint: Please provide contact information.
      type: text
      options: []
      required: true
    - id: 3
      name: exposure_information
      label: Exposure Information
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: symptoms
      label: Symptoms
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 6
      name: travel_history
      label: Travel History
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: additional_info
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: review
      label: Review
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
