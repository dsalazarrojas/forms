inputSchema:
  type: object
  properties:
    title: HIPAA Notice Of Privacy Practices & Acknowledgement Form
    pages:
    - id: 1
      name: form_title
      label: Form Title
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Medical Surveys & Questionnaires
      - Other
      required: true
    - id: 3
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: acknowledgement
      label: I acknowledge that I have received and understood this notice and that
        I will comply with its requirements.
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: form_category
      label: Form Category
      hint: null
      type: select_multiple
      options:
      - Medical Surveys & Questionnaires
      - Other
      - HIPAA Notice of Privacy Practices
      required: true
    - id: 6
      name: form_number
      label: Form Number
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: output_file
      label: Output File
      hint: null
      type: text
      options: []
      required: true
