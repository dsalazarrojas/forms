inputSchema:
  type: object
  properties:
    title: Medical Procedure Knowledge Quiz
    pages:
    - id: 1
      name: medical_procedure_knowledge_quiz_specialty
      label: What is your specialty?
      hint: null
      type: select_one
      options:
      - Cardiology
      - Dermatology
      - Gastroenterology
      - Nephrology
      required: true
    - id: 2
      name: medical_procedure_knowledge_quiz_procedures
      label: What medical procedures do you perform most often?
      hint: null
      type: select_multiple
      options:
      - Blood test
      - Biopsy
      - MRI scan
      - CT scan
      - X-ray
      - Endoscopy
      required: true
    - id: 3
      name: medical_procedure_knowledge_quiz_license_number
      label: What is your medical license number?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: medical_procedure_knowledge_quiz_hospital_affiliation
      label: What is your hospital affiliation?
      hint: null
      type: select_one
      options:
      - Hospital 1
      - Hospital 2
      - Hospital 3
      - Hospital 4
      required: true
    - id: 5
      name: medical_procedure_knowledge_quiz_equipment
      label: What type of medical equipment do you have access to?
      hint: null
      type: select_multiple
      options:
      - Ultrasound machines
      - ECG machine
      - Blood analyzer
      required: false
    - id: 6
      name: medical_procedure_knowledge_quiz_experience
      label: How long have you been working in the medical field?
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1-5 years
      - 5-10 years
      - More than 10 years
      required: true
    - id: 7
      name: medical_procedure_knowledge_quiz_notes
      label: Additional comments or notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: question_8
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: question_9
      label: What is your email?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: question_10
      label: What is your date of birth?
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: question_11
      label: What is your time of birth?
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: question_12
      label: Question 12
      hint: null
      type: note
      options: []
      required: false
