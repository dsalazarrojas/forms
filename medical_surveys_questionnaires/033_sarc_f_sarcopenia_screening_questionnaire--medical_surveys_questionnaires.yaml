inputSchema:
  type: object
  properties:
    title: SARC F Sarcopenia Screening Questionnaire
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: question_1
      label: What is your current level of physical activity?
      hint: null
      type: select_one
      options:
      - Very active
      - Moderately active
      - Less active
      - Unable to perform activities
      required: true
    - id: 3
      name: question_2
      label: What is the best time to contact you?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: question_2_1
      label: Do you experience difficulty with any of the following?
      hint: null
      type: select_multiple
      options:
      - Fatigue
      - Muscle weakness
      - Difficulty swallowing
      - Difficulty walking
      - Dizziness or drowsiness
      - Difficulty speaking
      - Memory loss
      - Sleep disturbances
      - Decreased appetite
      - Poor concentration
      - Difficulty with daily activities
      required: true
    - id: 5
      name: summary
      label: Summary
      hint: null
      type: text
      options: []
      required: false
