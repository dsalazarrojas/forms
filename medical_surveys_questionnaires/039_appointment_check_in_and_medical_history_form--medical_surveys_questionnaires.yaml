inputSchema:
  type: object
  properties:
    title: Appointment Check In And Medical History Form
    pages:
    - id: 1
      name: patient_information
      label: -- Patient Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: patient_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: patient_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: appointment_details
      label: -- Appointment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: provider_name
      label: Healthcare Provider Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: visit_reason
      label: Reason for Visit
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: medical_history
      label: -- Medical History --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: chronic_conditions
      label: Do you have any chronic conditions?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: conditions_list
      label: Please list your chronic conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: current_medications
      label: Are you currently taking medications?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: medications_list
      label: List current medications and dosages
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: allergies
      label: Do you have any allergies?
      hint: null
      type: select_one
      options:
      - Yes - drug allergies
      - Yes - food allergies
      - Yes - other allergies
      - 'False'
      required: true
    - id: 17
      name: allergy_details
      label: Please describe your allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: surgeries
      label: Have you had any surgeries?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 19
      name: surgery_details
      label: Please describe surgeries and dates
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: family_medical_history
      label: -- Family Medical History --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: family_conditions
      label: Do you have family history of medical conditions?
      hint: Select all that apply
      type: select_multiple
      options:
      - Heart disease
      - Diabetes
      - Cancer
      - High blood pressure
      - Stroke
      - Mental health issues
      - Other
      required: false
    - id: 22
      name: lifestyle_habits
      label: -- Lifestyle Habits --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: smoking_status
      label: Do you smoke?
      hint: null
      type: select_one
      options:
      - Never smoked
      - Former smoker
      - Current smoker
      - Prefer not to say
      required: false
    - id: 24
      name: exercise_frequency
      label: How often do you exercise?
      hint: null
      type: select_one
      options:
      - Daily
      - 3-4 times per week
      - 1-2 times per week
      - Rarely
      - Never
      required: false
