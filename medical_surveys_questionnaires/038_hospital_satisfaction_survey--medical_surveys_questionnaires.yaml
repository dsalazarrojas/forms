inputSchema:
  type: object
  properties:
    title: Hospital Satisfaction Survey
    pages:
    - id: 1
      name: staff_satisfaction
      label: How satisfied are you with the quality of hospital staff?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Not satisfied
      required: true
    - id: 2
      name: clinics_satisfaction
      label: How satisfied are you with the clinics?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Bad
      required: true
    - id: 3
      name: patient_satisfaction
      label: What is your overall satisfaction score for the patient?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Not satisfied
      required: true
    - id: 4
      name: visited_clinics
      label: How many clinics have you visited in the hospital recently?
      hint: Enter a number
      type: number
      options: []
      required: true
    - id: 5
      name: last_visit_date
      label: What is the date of your last visit?
      hint: Format - YYYY-MM-DD
      type: date
      options: []
      required: true
    - id: 6
      name: last_visit_time
      label: What is the time of your last visit?
      hint: Format - HH -MM -SS
      type: time
      options: []
      required: true
    - id: 7
      name: patient_email
      label: Patient Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: patient_phone
      label: Patient Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: additional_comments
      label: Additional comments
      hint: null
      type: note
      options: []
      required: true
    - id: 10
      name: hospital_score
      label: Hospital Satisfaction Score
      hint: Enter a number between 1 and 5
      type: number
      options: []
      required: true
