      name: sleep_disorder_info
      label: Sleep Disorder Info
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: sleep_pattern
      label: Sleep Pattern
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: sleep_quality
      label: Sleep Quality
      hint: null
      type: select_multiple
      options:
      - Poor
      - Fair
      - Good
      - Excellent
      required: true
    - id: 4
      name: insomnia_days
      label: Insomnia Days
      hint: null
      type: number
      options: []
