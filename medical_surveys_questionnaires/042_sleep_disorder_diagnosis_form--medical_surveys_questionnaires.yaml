      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: sleep_disorder_treatment
      label: Sleep Disorder Treatment
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: sleep_disorder_outlook
      label: Sleep Disorder Outlook
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Excellent
      required: true
    - id: 14
      name: sleep_disorder_recommendations
      label: Sleep Disorder Recommendations
      hint: null
      type: text
      options: []
