inputSchema:
  type: object
  properties:
    title: Eye And Ear Infection Quiz
    pages:
    - id: 1
      name: first_page
      label: How long have you been experiencing symptoms?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: first_page_symptoms
      label: Symptoms
      hint: null
      type: select_multiple
      options:
      - Ear ache
      - Eye pain
      - Discharge or pus
      - Redness or swelling
      - Other
      required: true
    - id: 3
      name: first_page_additional_symptoms
      label: Additional symptoms
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: ear_infection_symptoms
      label: Ear infection symptoms
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: doctor_visits
      label: Have you visited a doctor for any of these issues?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: ear_infection_medication
      label: Have you been taking any medications for these symptoms?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: medication_details
      label: Please provide details about the medication(s) you are taking
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: second_page
      label: Have you experienced any of the following?
      hint: null
      type: select_multiple
      options:
      - Fever
      - Chills
      - Headache
      - Nausea or vomiting
      - Joint pain
      required: true
    - id: 9
      name: additional_info
      label: Additional information
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: ear_infection_treatment
      label: Have you received treatment for any of these ear infections?
      hint: null
      type: select_multiple
      options:
      - Antibiotic
      - Other
      required: true
    - id: 11
      name: treatment_details
      label: Please provide details about treatment received
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: previous_medical_conditions
      label: Have you had any previous medical conditions?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 13
      name: previous_medical_conditions_details
      label: Please provide details about previous medical conditions
      hint: null
      type: text
      options: []
      required: true
    - id: 14
