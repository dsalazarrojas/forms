inputSchema:
  type: object
  properties:
    title: Food Allergy Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: has_food_allergy
      label: Do you have any food allergies?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: food_items
      label: If yes, which food items do you have a food allergy to?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: food_items_2
      label: Milk, Eggs, Peanuts, Tree Nuts, Shellfish, Soy, Wheat, Fish
      hint: null
      type: select_multiple
      options:
      - Milk
      - Eggs
      - Peanuts
      - Tree nuts
      - Shellfish
      - Soy
      - Wheat
      - Fish
      required: true
    - id: 5
      name: allergy_severity
      label: What is the severity of your food allergy?
      hint: null
      type: select_multiple
      options:
      - None
      - Mild
      - Moderate
      - Severe
      required: true
    - id: 6
      name: additional_allergies
      label: Do you have any other allergies besides food allergies?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: emergency_contacts
      label: Who would you like to contact in case of an emergency?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Mother
      - Father
      - School/Daycare
      - Teacher/Instructor
      - Another adult at home
      - Another staff member of this summer camp
      required: true
    - id: 8
      name: emergency_number
      label: What is the emergency contact number?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: allergy_treatment
      label: How would you like to treat your food allergy?
      hint: null
      type: select_multiple
      options:
      - EpiPen
      - Epipen
      - Epipen II
      - Other
      required: true
    - id: 10
      name: food_restriction
      label: Are there any food restrictions due to your allergy?
      hint: null
      type: select_multiple
      options:
      - None
      - No food restriction
      - Avoid all nuts
      - Avoid all dairy
      - Avoid all eggs
      - Avoid fish
      - Avoid shellfish
      - Avoid soy
      - Avoid wheat
      required: false
    - id: 11
      name: medical_conditions
      label: Do you have any other medical conditions?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: doctor
      label: Name of your doctor
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: doctor_2
      label: Contact information of your doctor
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: medical_history
      label: Your medical history
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: submission_date
      label: Submission date
      hint: null
      type: date
      options: []
      required: true
    - id: 17
      name: food_restrictions
      label: Additional food restrictions
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: other_medical_conditions
      label: Other medical conditions
      hint: null
      type: text
      options: []
      required: false
