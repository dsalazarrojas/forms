inputSchema:
  type: object
  properties:
    title: Memory Assessment Questionnaire
    pages:
    - id: 1
      name: memory_assessment_questionnaire
      label: How often do you feel overwhelmed?
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: memory_assessment_questionnaire_page_1_1
      label: How often do you find yourself repeating tasks or activities?
      hint: null
      type: select_multiple
      options:
      - Often
      - Sometimes
      - Rarely
      - Never
      required: true
    - id: 3
      name: memory_assessment_questionnaire_page_1_2
      label: How often do you experience memory problems?
      hint: null
      type: select_one
      options:
      - Memory problems with daily activities
      - Memory problems with concentration and focus
      - Memory problems with communication
      - Memory problems with emotions
      required: true
    - id: 4
      name: memory_assessment_questionnaire_page_1_3
      label: How often do you get lost while performing tasks?
      hint: null
      type: select_one
      options:
      - Getting lost while performing simple tasks
      - Getting lost while performing complex tasks
      - Never getting lost
      required: true
    - id: 5
      name: memory_assessment_questionnaire_page_1_4
      label: How often do you experience difficulty with memory?
      hint: null
      type: select_multiple
      options:
      - Difficulty with memory recall
      - Difficulty with memory encoding
      - Difficulty with memory recognition
      required: true
    - id: 6
      name: memory_assessment_questionnaire_page_1_5
      label: How often do you forget appointments or events?
      hint: null
      type: select_multiple
      options:
      - Forgetting appointments or events
      - Forgetting phone numbers or names
      - Forgetting conversations or details
      required: true
    - id: 7
      name: memory_assessment_questionnaire_page_1_6
      label: Do you experience difficulty concentrating?
      hint: null
      type: select_one
      options:
      - Difficulty concentrating
      - No difficulty concentrating
      required: true
    - id: 8
      name: memory_assessment_questionnaire_page_1_7
      label: Do you experience difficulty with organization?
      hint: null
      type: select_one
      options:
      - Difficulty with organization
      - No difficulty with organization
      required: true
    - id: 9
      name: memory_assessment_questionnaire_page_1_8
      label: How often do you feel confused?
      hint: null
      type: select_one
      options:
      - Feeling confused
      - No feeling of confusion
      required: true
    - id: 10
      name: memory_assessment_questionnaire_page_1_9
      label: Do you feel anxious or nervous about memory difficulties?
      hint: null
      type: select_one
      options:
      - Feeling anxious or nervous about memory difficulties
      - No feeling of anxiety or nervousness
      required: true
    - id: 11
      name: memory_assessment_questionnaire_page_2_1
      label: Do you often rely on aids such as calendars or lists?
      hint: null
      type: select_one
      options:
      - Often rely on aids
      - Rarely rely on aids
      required: true
    - id: 12
      name: memory_assessment_questionnaire_page_2_2
      label: Do you often write things down to remember?
      hint: null
      type: select_one
      options:
      - Often write things down
      - Rarely write things down
      required: true
    - id: 13
      name: memory_assessment_questionnaire_page_2_3
      label: Do you often use reminders?
      hint: null
      type: select_one
      options:
      - Often use reminders
      - Rarely use reminders
      required: true
    - id: 14
      name: memory_assessment_questionnaire_page_2_4
      label: Do you often check lists or schedules?
      hint: null
      type: select_one
      options:
      - Often check lists or schedules
      - Rarely check lists or schedules
      required: true
    - id: 15
      name: memory_assessment_questionnaire_page_2_5
      label: Do you often use memory aids such as post-it notes?
      hint: null
      type: select_one
      options:
      - Often use post-it notes
      - Rarely use post-it notes
      required: true
    - id: 16
      name: memory_assessment_questionnaire_page_2_6
      label: Do you often use technology such as calendars or apps?
      hint: null
      type: select_one
      options:
      - Often use technology
      - Rarely use technology
      required: true
    - id: 17
      name: memory_assessment_questionnaire_page_2_7
      label: How much do you rely on others for memory support?
      hint: null
      type: number
      options: []
      required: true
    - id: 18
      name: memory_assessment_questionnaire_page_2_8
      label: Do you experience any memory-related anxiety?
      hint: null
      type: select_one
      options:
      - Experience memory-related anxiety
      - No experience of memory-related anxiety
      required: true
    - id: 19
      name: memory_assessment_questionnaire_page_2_9
      label: Do you experience any memory-related distress or concern?
      hint: null
      type: select_one
      options:
      - Experience memory-related distress
      - No experience of memory-related distress
      required: true
    - id: 20
      name: memory_assessment_questionnaire_page_3_1
      label: Do you have any memory-related fears or worries?
      hint: null
      type: select_one
      options:
      - Have memory-related fears or worries
      - No memory-related fears or worries
      required: true
    - id: 21
      name: memory_assessment_questionnaire_page_3_2
      label: Do you feel overwhelmed by memory-related concerns?
      hint: null
      type: select_one
      options:
      - Feeling overwhelmed by memory-related concerns
      - No feeling of being overwhelmed
      required: true
    - id: 22
      name: memory_assessment_questionnaire_page_4_1
      label: Do you feel embarrassed or frustrated about memory difficulties?
      hint: null
      type: select_one
      options:
      - Feeling embarrassed or frustrated
      - No feeling of being embarrassed or frustrated
      required: true
