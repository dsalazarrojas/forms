inputSchema:
  type: object
  properties:
    title: Nutrition and Digestion Survey
    pages:
    - id: 1
      name: survey_welcome
      label: Welcome Page
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: intake_frequency
      label: How often do you drink liquids?
      hint: null
      type: select_one
      options:
      - Water
      - Soda
      - Juice
      - Other
      required: false
    - id: 3
      name: liquid_intake
      label: How much liquid do you drink per day?
      hint: null
      type: select_one
      options:
      - 0-100ml
      - 101-250ml
      - 251-500ml
      - 501-1000ml
      - 1001-2000ml
      - 2001ml+
      required: false
    - id: 4
      name: food_intake_frequency
      label: How often do you eat?
      hint: null
      type: select_multiple
      options:
      - Never
      - Rarely
      - Occasionally
      - Frequently
      - Always
      required: false
    - id: 5
      name: food_intake_type
      label: What do you eat?
      hint: null
      type: select_multiple
      options:
      - Meat
      - Fish
      - Fruits
      - Vegetables
      - Grains
      - Snacks
      required: false
    - id: 6
      name: digestive_health
      label: What are your current digestive health issues?
      hint: Please be as specific as possible.
      type: text
      options: []
      required: false
    - id: 7
      name: hydration_frequency
      label: How often do you drink?
      hint: null
      type: select_one
      options:
