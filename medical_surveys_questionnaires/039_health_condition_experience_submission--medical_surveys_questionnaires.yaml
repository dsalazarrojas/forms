inputSchema:
  type: object
  properties:
    title: health-condition-experience-submission
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: Enter your phone number
      type: text
      options: []
      required: false
    - id: 5
      name: condition_name
      label: Condition Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: condition_description
      label: Condition Description
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: consent_to_share
      label: Share with researchers and support organizations
      hint: null
      type: select_one
      options:
      - Consent to share with researchers
      - Consent to share with support organizations
      - Do not share
      required: true
    - id: 8
      name: consent_to_educational_use
      label: Consent for educational use
      hint: null
      type: select_one
      options:
      - Consent for educational use
      - No consent
      required: true
