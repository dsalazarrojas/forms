inputSchema:
  type: object
  properties:
    title: COVID 19 Student Online Health Screening Form
    pages:
    - id: 1
      name: screening_date
      label: Screening Date
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 2
      name: student_first_name
      label: Student First Name
      hint: Legal first name
      type: text
      options: []
      required: true
    - id: 3
      name: student_last_name
      label: Student Last Name
      hint: Legal last name
      type: text
      options: []
      required: true
    - id: 4
      name: student_id
      label: Student ID Number
      hint: School ID
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 6
      name: grade_level
      label: Grade Level
      hint: Current grade
      type: select_one
      options:
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: true
    - id: 7
      name: school_name
      label: School Name
      hint: Which school
      type: text
      options: []
      required: true
    - id: 8
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 9
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 10
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 11
      name: home_address
      label: Home Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 12
      name: current_temperature
      label: Current Temperature
      hint: In Fahrenheit
      type: number
      options: []
      required: true
    - id: 13
      name: fever_check
      label: Does the student have a fever of 100.4 F or higher
      hint: Fever screening
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 14
      name: current_symptoms
      label: Is the student experiencing any COVID-19 symptoms today
      hint: Symptom screening
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 15
      name: symptom_list
      label: Which symptoms
      hint: Select all that apply
      type: select_multiple
      options:
      - New cough
      - Shortness of breath
      - Sore throat
      - Runny nose or congestion
      - Loss of taste or smell
      - Headache
      - Muscle aches
      - Fatigue
      - Nausea or vomiting
      - Diarrhea
      - Chills
      required: false
    - id: 16
      name: household_positive
      label: Has anyone in the household tested positive for COVID-19 in the past
        14 days
      hint: Household cases
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 17
      name: household_symptoms
      label: Is anyone in the household experiencing COVID-19 symptoms
      hint: Household symptoms
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 18
      name: close_contact_exposure
      label: Has the student had close contact with a confirmed COVID-19 case in the
        past 14 days
      hint: Exposure history
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 19
      name: travel_history
      label: Has the student traveled outside the area in the past 14 days
      hint: Travel history
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 20
      name: travel_locations
      label: List travel locations
      hint: Cities and states visited
      type: text
      options: []
      required: false
    - id: 21
      name: vaccination_status
      label: What is the student's COVID-19 vaccination status
      hint: Vaccination status
      type: select_one
      options:
      - Fully vaccinated
      - Partially vaccinated
      - Not vaccinated
      - Not eligible yet
      - Prefer not to say
      required: false
    - id: 22
      name: testing_status
      label: Has the student been tested for COVID-19 in the past 14 days
      hint: Recent testing
      type: select_one
      options:
      - 'False'
      - Yes pending results
      - Yes tested negative
      - Yes tested positive
      required: true
    - id: 23
      name: clearance_status
      label: Is the student cleared to attend school today
      hint: Attendance clearance
      type: select_one
      options:
      - Yes cleared for in-person attendance
      - Yes cleared for remote learning only
      - No not cleared - symptoms present
      - No not cleared - exposure risk
      required: true
    - id: 24
      name: additional_comments
      label: Additional Health Information
      hint: Other relevant information
      type: text
      options: []
      required: false
    - id: 25
      name: parent_attestation
      label: I attest that the information provided is true and accurate
      hint: Parent certification
      type: select_one
      options:
      - Yes I attest to this information
      - No I cannot attest
      required: true
    - id: 26
      name: signature_date
      label: Signature Date
      hint: Date submitted
      type: date
      options: []
      required: true
