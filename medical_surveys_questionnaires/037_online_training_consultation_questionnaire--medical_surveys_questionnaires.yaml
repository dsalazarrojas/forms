inputSchema:
  type: object
  properties:
    title: Online Training Consultation Questionnaire
    pages:
    - id: 1
      name: primary_reason_for_training
      label: What is the primary reason for the online training consultation?
      hint: null
      type: select_one
      options:
      - Improve my skills
      - Meet a certification requirement
      - Advance my career
      - Other (please specify)
      - Personal development
      required: true
    - id: 2
      name: short_term_goals
      label: What are your short-term goals for the training?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: long_term_goals
      label: What are your long-term goals for the training?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: achieve_goals
      label: How will you achieve your short-term and long-term goals?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: medical_clearance
      label: Have you received any medical clearance for the training?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: health_details
      label: What are your health details (e.g., medications, allergies, injuries,
        etc.)?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: progress_report
      label: What is your current progress report?
      hint: null
      type: text
      options: []
      required: true
