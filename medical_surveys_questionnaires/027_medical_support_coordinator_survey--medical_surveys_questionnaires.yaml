      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Not satisfied at all
      required: true
    - id: 18
      name: medical_support_team_member_knowledge
      label: How knowledgeable do you think the support team member was
      hint: null
      type: select_multiple
      options:
      - Very knowledgeable
      - Somewhat knowledgeable
      - Neutral
      - Somewhat unconfident
      - Not confident at all
      required: true
    - id: 19
      name: follow_up_call_frequency
      label: How often would you like to be contacted for follow-up on your issue
      hint: null
      type: select_multiple
      options:
      - Always
