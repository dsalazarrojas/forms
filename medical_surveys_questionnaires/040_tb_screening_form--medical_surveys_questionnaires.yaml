inputSchema:
  type: object
  properties:
    title: <string>
    pages:
    - id: 1
      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: travel_info
      label: Travel Information
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: medical_info
      label: Medical Information
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: symptoms
      label: Symptoms
      hint: null
      type: select_multiple
      options:
      - Fatigue
      - Cough
      - Chest pain
      - Other (specify)
      required: false
    - id: 6
      name: vaccine_info
      label: Vaccine Information
      hint: null
      type: select_multiple
      options:
      - Received TB vaccine
      - Not Received TB vaccine
      - Unknown
      required: false
    - id: 7
      name: medical_procedure
      label: Medical Procedure
      hint: null
      type: select_multiple
      options:
      - Chest X-ray
      - Blood test
      - Other (specify)
      required: false
    - id: 8
      name: additional_info
      label: Additional Information
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
