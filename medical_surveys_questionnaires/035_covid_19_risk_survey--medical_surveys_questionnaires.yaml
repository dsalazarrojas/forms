inputSchema:
  type: object
  properties:
    title: COVID 19 Risk Survey
    pages:
    - id: 1
      name: person_name_full
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: person_age_val
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: person_gender_cat
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      required: true
    - id: 4
      name: chronic_cond_list
      label: Do you have any of the following chronic conditions?
      hint: select all that apply
      type: select_multiple
      options:
      - Diabetes
      - Heart Disease
      - Hypertension
      - Respiratory Issue
      - Immunocompromised
      - None
      required: true
    - id: 5
      name: smoker_status_cat
      label: Smoker Status
      hint: null
      type: select_one
      options:
      - Never
      - Former Smoker
      - Current Smoker
      - Occasional Smoker
      required: true
    - id: 6
      name: public_exposure_cat
      label: Frequency of Public Exposure
      hint: How often do you go to grocery stores or public transit?
      type: select_one
      options:
      - Daily
      - 2-3 times per week
      - Weekly
      - Rarely
      - Not at all
      required: true
    - id: 7
      name: exposure_known_case_yn
      label: Recent Exposure to a Known COVID-19 Case
      hint: Within the last 14 days
      type: select_one
      options:
      - true
      - false
      - Unsure
      required: true
    - id: 8
      name: symptoms_14d_list
      label: Symptoms Experienced in the Last 14 Days
      hint: null
      type: select_multiple
      options:
      - Fever
      - Cough
      - Loss of taste/smell
      - Fatigue
      - Body aches
      - None
      required: true
    - id: 9
      name: vaccination_status_cat
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Not vaccinated
      - Partially (1 dose)
      - Fully vaccinated (2 doses)
      - Fully vaccinated + Booster
      required: true
    - id: 10
      name: risk_percep_val
      label: Risk Perception Level
      hint: Scale of 1 (Low) to 10 (High) - How at risk do you feel?
      type: number
      options: []
      required: true
    - id: 11
      name: household_size_val
      label: Household Size
      hint: Number of people living in your home
      type: number
      options: []
      required: true
    - id: 12
      name: location_zip_val
      label: Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: info_usage_ack
      label: I understand this survey is for research and risk estimation purposes
      hint: null
      type: select_one
      options:
      - I understand
      - Other
      required: true
