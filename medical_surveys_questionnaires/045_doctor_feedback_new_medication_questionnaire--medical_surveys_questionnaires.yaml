inputSchema:
  type: object
  properties:
    title: 'Doctor Feedback: New Medication Questionnaire'
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: medication_name
      label: what_is_the_name_of_the_new_medication
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: medication_dosage
      label: what_is_the_dosage
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: patient_outcomes
      label: what_are_the_outcome_results
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Neutral
      required: false
    - id: 5
      name: patient_side_effects
      label: what_are_the_side_effects
      hint: null
      type: select_multiple
      options:
      - Dizziness
      - Fatigue
      - Nausea
      - Headache
      - Other
      required: false
    - id: 6
      name: clinician_comments
      label: please_provide_your_comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: overall_satisfaction
      label: how_satisfied_are_you
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 8
      name: comparative_satisfaction
      label: how_comparative_is_it_to_other_medications
      hint: null
      type: select_one
      options:
      - Much Better
      - A Little Better
      - No Different
      - A Little Worse
      - Much Worse
      required: false
