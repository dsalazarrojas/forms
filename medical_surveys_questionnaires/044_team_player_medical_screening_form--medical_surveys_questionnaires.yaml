      - I have a valid medical insurance
      - I have a valid medical insurance with a copay
      - Other (please specify)
      required: true
    - id: 5
      name: team_player_medical_screening_form_page_5
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: emergency_contact_relation
      label: Emergency Contact Relation
      hint: null
      type: text
      options: []
      required: true
