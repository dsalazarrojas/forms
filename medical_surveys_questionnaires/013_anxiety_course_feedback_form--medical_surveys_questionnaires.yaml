inputSchema:
  type: object
  properties:
    title: Anxiety Course Feedback Form
    pages:
      - id: 1
        name: participant_name
        label: Participant name
        hint: null
        type: text
        options: []
        required: false
      - id: 2
        name: course_name
        label: Name of anxiety course attended
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: course_date
        label: Course completion date
        hint: null
        type: date
        options: []
        required: true
      - id: 4
        name: instructor_name
        label: Instructor name
        hint: null
        type: text
        options: []
        required: true
      - id: 5
        name: overall_satisfaction
        label: Overall satisfaction with the course
        hint: null
        type: select_one
        options:
          - Very satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very dissatisfied
        required: true
      - id: 6
        name: content_relevance
        label: Was course content relevant to your needs?
        hint: null
        type: select_one
        options:
          - Very relevant
          - Somewhat relevant
          - Neutral
          - Not very relevant
          - Not relevant
        required: true
      - id: 7
        name: learning_objectives
        label: Did the course meet its stated learning objectives?
        hint: null
        type: select_one
        options:
          - All objectives met
          - Most objectives met
          - Some objectives met
          - Few objectives met
          - No objectives met
        required: true
      - id: 8
        name: practical_tools_acquired
        label: Did you acquire practical tools or techniques?
        hint: null
        type: select_one
        options:
          - Yes, many tools
          - Yes, some tools
          - Neutral
          - Few tools
          - No practical tools
        required: true
      - id: 9
        name: tools_usable
        label: Are the tools applicable to your life?
        hint: null
        type: select_one
        options:
          - Very applicable
          - Somewhat applicable
          - Neutral
          - Limited applicability
          - Not applicable
        required: true
      - id: 10
        name: instructor_knowledge
        label: How would you rate the instructor's knowledge?
        hint: null
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Very poor
        required: true
      - id: 11
        name: instructor_communication
        label: How well did the instructor communicate?
        hint: null
        type: select_one
        options:
          - Excellent communication
          - Good communication
          - Fair communication
          - Poor communication
          - Very poor communication
        required: true
      - id: 12
        name: course_organization
        label: Was the course well organized?
        hint: null
        type: select_one
        options:
          - Excellently organized
          - Well organized
          - Adequately organized
          - Poorly organized
          - Very poorly organized
        required: true
      - id: 13
        name: pacing
        label: Was the course pacing appropriate?
        hint: null
        type: select_one
        options:
          - Too fast
          - Somewhat fast
          - Just right
          - Somewhat slow
          - Too slow
        required: true
      - id: 14
        name: materials_quality
        label: Quality of course materials
        hint: Handouts, slides, resources, etc
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Very poor
        required: true
      - id: 15
        name: group_dynamics
        label: How were group dynamics and interaction?
        hint: null
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - N/A - individual course
        required: true
      - id: 16
        name: sufficient_practice
        label: Was there sufficient practice or hands-on work?
        hint: null
        type: select_one
        options:
