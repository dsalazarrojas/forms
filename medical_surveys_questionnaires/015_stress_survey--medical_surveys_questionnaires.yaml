inputSchema:
  type: object
  properties:
    title: Stress Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: stress_score
      label: How stressed do you feel right now?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: stress_level
      label: What is your stress level?
      hint: null
      type: select_multiple
      options:
      - Very low
      - Low
      - Medium
      - High
      required: false
    - id: 4
      name: physical_symptoms
      label: Do you experience any of the following physical symptoms?
      hint: null
      type: select_multiple
      options:
      - Fatigue
      - Headaches
      - Sleep difficulties
      - Difficulty concentrating
      - Irritability
      - Mood swings
      required: false
    - id: 5
      name: emotional_symptoms
      label: Do you experience any of the following emotional symptoms?
      hint: null
      type: select_multiple
      options:
      - Anxiety
      - Fear
      - Loss of interest
      - Difficulty making decisions
      - Mood swings
      required: false
    - id: 6
      name: cognitive_symptoms
      label: Do you experience any of the following cognitive symptoms?
      hint: null
      type: select_multiple
      options:
      - Difficulty concentrating
      - Memory difficulties
      - Confusion
      - Lack of focus
      required: false
    - id: 7
      name: behavioral_symptoms
      label: Do you experience any of the following behavioral symptoms?
      hint: null
      type: select_multiple
      options:
      - Irritability
      - Mood swings
      - Difficulty relaxing
      - Lack of motivation
      required: false
    - id: 8
      name: stress_impact
      label: What impact does stress have on you?
      hint: null
      type: select_multiple
      options:
      - Physical
      - Emotional
      - Social
      - Professional
      - Financial
      required: false
    - id: 9
      name: help_sources
      label: What sources of support do you have to help you deal with stress?
      hint: null
      type: select_multiple
      options:
      - Spouse/partner
      - Family
      - Friends
      - Therapist
      - Support group
      required: false
    - id: 10
      name: self_care
      label: How do you take care of yourself?
      hint: null
      type: select_multiple
      options:
      - Exercise
      - Diet
      - Relaxation techniques
      - Sleep schedule
      required: false
    - id: 11
      name: self_help
      label: Have you reached out for help?
      hint: null
