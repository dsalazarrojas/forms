inputSchema:
  type: object
  properties:
    title: Healthcare Knowledge Sharing Culture Survey
    pages:
    - id: 1
      name: introduction
      label: What do you value most in your workplace?
      hint: null
      type: select_one
      options:
      - Integrity
      - Teamwork
      - Knowledge Sharing
      - Innovative Solutions
      - Clear Communication
      - Collaboration
      - Diversity
      required: false
    - id: 2
      name: teamwork
      label: What is the best way to work with your team?
      hint: null
      type: select_multiple
      options:
      - Collaborative
      - Independent
      - Flexible
      required: false
    - id: 3
      name: knowledge_sharing
      label: How would you rate your knowledge sharing culture in your workplace?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: innovative_solutions
      label: How often do you use new technologies to improve your work?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: clear_communication
      label: How do you prefer to receive information in your workplace?
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Meetings
      - Text Message
      required: false
    - id: 6
      name: collaboration
      label: How would you rate the level of collaboration among your team members?
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 7
      name: diversity
      label: How would you rate the diversity of ideas among your team members?
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 8
      name: culture
      label: How important is it to share knowledge and expertise in your team?
      hint: null
      type: select_one
      options:
      - Very Important
      - Somewhat Important
      - Not Very Important
      required: false
    - id: 9
      name: communication
      label: How do you prefer to receive feedback from your team members?
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Meetings
      - Text Message
      required: false
    - id: 10
      name: communication_style
      label: How would you describe the communication style of your team?
      hint: null
      type: select_one
      options:
      - Formal
      - Informal
      required: false
    - id: 11
      name: innovation
      label: How often do you encourage innovative thinking in your team?
      hint: null
      type: select_one
      options:
      - Often
      - Sometimes
      - Rarely
      required: false
    - id: 12
      name: knowledge_sharing_encouragement
      label: How would you rate the encouragement of knowledge sharing in your team?
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 13
      name: knowledge_sharing_barriers
      label: What are some common barriers to knowledge sharing in your team?
      hint: null
      type: select_multiple
      options:
      - Distrust
      - Fear of criticism
      - Lack of Time
      required: false
    - id: 14
      name: knowledge_sharing_impact
      label: What impact does knowledge sharing have on your team?
      hint: null
      type: select_multiple
      options:
      - Positive
      - Negative
      - No Impact
      required: false
    - id: 15
      name: knowledge_sharing_challenges
      label: What are some common challenges to knowledge sharing in your team?
      hint: null
      type: select_multiple
      options:
      - Fear of sharing knowledge
      - Distrust
      - Lack of resources
      required: false
    - id: 16
      name: knowledge_sharing_opportunities
      label: What opportunities exist for knowledge sharing in your team?
      hint: null
      type: select_multiple
      options:
      - Regular feedback
      - Team discussions
      - Knowledge sharing events
      required: false
    - id: 17
      name: knowledge_sharing_future
      label: What is the future of knowledge sharing in your team?
      hint: null
      type: select_multiple
      options:
      - Growing
      - Stagnating
      - Declining
      required: false
    - id: 18
      name: knowledge_sharing_effectiveness
      label: How effective is knowledge sharing in your team?
      hint: null
      type: select_one
      options:
      - Very Effective
      - Somewhat Effective
      - Not Very Effective
      required: false
    - id: 19
      name: knowledge_sharing_satisfaction
      label: How satisfied are you with the knowledge sharing in your team?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Very Satisfied
      required: false
    - id: 20
      name: conclusion
      label: What is the main thing you learned from this survey?
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: submission
      label: Submission
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: submission2
      label: Submission 2
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: submission3
      label: Submission 3
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: submission4
      label: Submission 4
