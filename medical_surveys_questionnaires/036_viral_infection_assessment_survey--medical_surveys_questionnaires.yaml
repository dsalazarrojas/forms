inputSchema:
  type: object
  properties:
    title: viral-infection-assessment-survey
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: exposure_2
      label: Exposure
      hint: Please select all that apply
      type: select_multiple
      options:
      - None
      - Family Member
      - Healthcare Worker
      - Public Place
      - School/Work
      required: true
    - id: 4
      name: symptoms_3
      label: Symptoms
      hint: List the symptoms that you are experiencing
      type: note
      options: []
      required: false
    - id: 5
      name: health_history_4
      label: Health History
      hint: Please select all that apply
      type: select_one
      options:
      - None
      - Vaccinated
      - Previously Infected
      required: true
    - id: 6
      name: screening_5
      label: Screening Date
      hint: The date of the screening
      type: date
      options: []
      required: true
    - id: 7
      name: test_results_6
      label: Test Results
      hint: Please select all that apply
      type: select_one
      options:
      - Negative
      - Positive
      required: true
    - id: 8
      name: treatment_7
      label: Treatment
      hint: Please select all that apply
      type: select_multiple
      options:
      - None
      - Antibiotics
      - Antiviral
      - Antimalarial
      - Antifungal
      required: false
    - id: 9
      name: follow_up_8
      label: Follow up
      hint: The date of the follow-up
      type: date
      options: []
      required: false
    - id: 10
      name: medical_history_9
      label: Medical History
      hint: Please select all that apply
      type: select_one
      options:
      - None
      - Allergies
      - Chronic Conditions
      required: true
    - id: 11
      name: next_steps_10
      label: Next Steps
      hint: What do you want your healthcare provider to do next? Please provide more
        information
      type: text
      options: []
      required: false
    - id: 12
      name: provider_info_11
      label: Provider Info
      hint: Please provide more information about your healthcare provider
      type: note
      options: []
      required: false
    - id: 13
      name: contact_info_12
      label: Contact Info
      hint: Please provide your contact information
      type: text
      options: []
      required: false
    - id: 14
      name: additional_comments_13
      label: Additional Comments
      hint: Please provide any additional comments
      type: text
      options: []
      required: false
    - id: 15
      name: medical_facility_14
      label: Medical Facility
      hint: Please select all that apply
      type: select_multiple
      options:
      - None
      - Hospital
      - Clinic
      - Doctor
      - Urgent Care
      required: true
    - id: 16
      name: medical_provider_15
      label: Medical Provider
      hint: Please select all that apply
      type: select_multiple
      options:
      - None
      - Doctor
      - NP
      - PA
      - RN
      required: false
