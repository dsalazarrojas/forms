inputSchema:
  type: object
  properties:
    title: Emergency Medical Form
    pages:
    - id: 1
      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: patient_dob
      label: Date Of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: patient_gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: false
    - id: 5
      name: medical_condition
      label: Medical Condition
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: treatment_needed
      label: Treatment Needed
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
