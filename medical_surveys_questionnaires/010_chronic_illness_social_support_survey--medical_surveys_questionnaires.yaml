inputSchema:
  type: object
  properties:
    title: Chronic Illness Social Support Survey
    pages:
    - id: 1
      name: header_demographics
      label: -- General Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: age
      label: Current Age
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: diagnosis_duration
      label: How long have you lived with your primary chronic condition?
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - Over 10 years
      required: true
    - id: 4
      name: header_social_network
      label: -- Social Support Network --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: primary_support_source
      label: Who is your primary source of day-to-day support?
      hint: null
      type: select_one
      options:
      - Spouse/Partner
      - Parent
      - Adult Child
      - Sibling
      - Friend
      - Professional Caregiver
      - Online Community
      required: true
    - id: 6
      name: support_satisfaction_emotional
      label: Rate satisfaction with EMOTIONAL support received
      hint: Having someone to talk to, empathy, and understanding
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 7
      name: support_satisfaction_practical
      label: Rate satisfaction with PRACTICAL support received
      hint: Help with chores, transportation, and medical appointments
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 8
      name: frequency_of_contact
      label: How often do you interact with people who support you?
      hint: null
      type: select_one
      options:
      - Daily
      - Several times a week
      - Once a week
      - Monthly
      - Rarely
      required: true
    - id: 9
      name: isolation_frequency
      label: How often do you feel socially isolated due to your illness?
      hint: null
      type: select_one
      options:
      - Never
      - Rarely
      - Sometimes
      - Often
      - Always
      required: true
    - id: 10
      name: header_unmet_needs
      label: -- Unmet Support Needs --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: desired_support_types
      label: What types of support do you wish you had MORE of?
      hint: Select all that apply
      type: select_multiple
      options:
      - Help with housework
      - Financial assistance
      - Understanding of invisible symptoms
      - Mental health counseling
      - Social outings
      - Help navigating the healthcare system
      required: true
    - id: 12
      name: barriers_to_support
      label: What are the main barriers to receiving support?
      hint: null
      type: select_multiple
      options:
      - Difficulty asking for help
      - Physical distance from family/friends
      - People don't understand my illness
      - Financial constraints
      - Fatigue/lack of energy to socialize
      required: true
    - id: 13
      name: online_support_utility
      label: How helpful are online support groups/communities for you?
      hint: null
      type: select_one
      options:
      - Extremely Helpful
      - Moderately Helpful
      - Slightly Helpful
      - Not at all Helpful
      - I don't use them
      required: true
    - id: 14
      name: additional_comments
      label: Is there anything else you want to share about your support needs?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: future_participation
      label: Would you be willing to participate in a follow-up interview?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 16
      name: email_for_followup
      label: Email Address (if willing to follow up)
      hint: null
      type: email
      options: []
      required: false
