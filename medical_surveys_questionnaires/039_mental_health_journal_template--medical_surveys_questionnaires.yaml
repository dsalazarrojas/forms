      hint: null
      type: select_one
      options:
      - Family
      - Friends
      - Partner
      - Alone
      required: false
    - id: 7
      name: sleep
      label: Sleep
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: nutrition
      label: Nutrition
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: exercise
      label: Exercise
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: mental_health_professional
      label: Mental Health Professional
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: mental_health_notes
      label: Mental Health Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: mental_health_progress
      label: Mental Health Progress
      hint: null
      type: select_one
      options:
      - Progress
      - No Progress
      - Unknown
      - Stopped Making Progress
      required: false
