inputSchema:
  type: object
  properties:
    title: Canine Heartworm Prevalence Survey
    pages:
    - id: 1
      name: section_personal_information
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: clinic_name
      label: Clinic name
      hint: Enter official clinic or hospital name
      type: text
      options: []
      required: true
    - id: 3
      name: veterinarian_name
      label: Veterinarian name
      hint: Full name of reporting veterinarian
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact email
      hint: Provide an address for follow up
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact phone
      hint: Clinic phone number
      type: text
      options: []
      required: false
    - id: 6
      name: report_date
      label: Report date
      hint: Date the data covers
      type: date
      options: []
      required: true
    - id: 7
      name: number_tested
      label: Number of dogs tested
      hint: Enter whole number tested during reporting period
      type: number
      options: []
      required: true
    - id: 8
      name: number_positive
      label: Number of positive cases
      hint: Enter whole number testing positive
      type: number
      options: []
      required: true
    - id: 9
      name: diagnostic_methods
      label: Diagnostic methods used
      hint: Select all that apply
      type: select_multiple
      options:
      - Antigen test
      - Microfilaria test
      - PCR
      - Necropsy
      - Other
      required: true
    - id: 10
      name: prevention_practices
      label: Prevention practices reported
      hint: Select common prevention measures used in clinic
      type: select_multiple
      options:
      - Monthly preventives
      - Annual injection
      - Topical application
      - Owner education
      - None reported
      required: false
    - id: 11
      name: region
      label: Region
      hint: Geographic region or county
      type: select_one
      options:
      - North
      - South
      - East
      - West
      - Central
      required: true
    - id: 12
      name: additional_notes
      label: Additional notes
      hint: Any relevant observations or comments
      type: text
      options: []
      required: false
