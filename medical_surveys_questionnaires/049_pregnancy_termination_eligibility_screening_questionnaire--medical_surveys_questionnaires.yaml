inputSchema:
  type: object
  properties:
    title: Pregnancy Termination Eligibility Screening Questionnaire
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: medical_history
      label: Medical History
      hint: null
      type: select_multiple
      options:
      - High Blood Pressure
      - Diabetes
      - Heart Disease
      - Kidney Disease
      - Option 5
      required: false
    - id: 3
      name: social_determinants
      label: Social Determinants
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: family_history
      label: Family History
      hint: null
      type: select_one
      options:
      - High Blood Pressure
      - Diabetes
      - Cancer
      - Other
      required: false
    - id: 5
      name: current_medication
      label: Current Medication
      hint: List your current medications and dosages
      type: text
      options: []
      required: false
    - id: 6
      name: medical_provider
      label: Medical Provider
      hint: null
      type: select_multiple
      options:
      - Family Doctor
      - Specialist
      - Other
      required: false
    - id: 7
      name: medical_history_condition
      label: Medical History Condition
      hint: List all medical conditions you have or have had in the past
      type: text
      options: []
      required: false
    - id: 8
      name: medical_condition_description
      label: Medical History Description
      hint: Describe each medical condition and treatment details
      type: text
      options: []
      required: false
    - id: 9
      name: medical_provider_contact
      label: Medical Provider Contact
      hint: null
      type: select_multiple
      options:
      - Family Doctor
      - Specialist
      - Other
      required: false
    - id: 10
      name: medical_provider_address
      label: Medical Provider Address
      hint: null
      type: select_multiple
      options:
      - Address 1
      - Address 2
      - Address 3
      - Other
      required: false
    - id: 11
      name: medical_history_notes
      label: Medical History Notes
      hint: Additional comments or questions
      type: note
      options: []
      required: false
