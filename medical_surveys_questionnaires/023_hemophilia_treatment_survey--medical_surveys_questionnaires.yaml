inputSchema:
  type: object
  properties:
    title: Hemophilia Treatment Survey
    pages:
    - id: 1
      name: treatment_regimens
      label: What is your current treatment regimen?
      hint: null
      type: select_one
      options:
      - Factor VIII
      - None
      - Desmotesplexin
      - Other (please specify)
      required: false
    - id: 2
      name: bleeding_frequency
      label: How often do you experience bleeding episodes?
      hint: Please provide frequency of bleeding episodes in a month.
      type: select_multiple
      options:
      - Rarely
      - Occasionally
      - Frequently
      - Almost daily
      required: false
    - id: 3
      name: satisfaction
      label: How satisfied are you with your current treatment?
      hint: On a scale of 1-5, where 1 is very dissatisfied and 5 is very satisfied.
      type: select_one
      options:
      - 1 - Very dissatisfied
      - 2 - Somewhat dissatisfied
      - 3 - Neutral
      - 4 - Somewhat satisfied
      - 5 - Very satisfied
      required: false
    - id: 4
      name: bleeding_history
      label: How long have you been experiencing bleeding episodes?
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: treatment_goals
      label: What are your treatment goals?
      hint: null
      type: select_multiple
      options:
      - Reduce frequency of bleeding episodes
      - Improve quality of life
      - Manageable treatment regimen
      - Other (please specify)
      required: false
    - id: 6
      name: medical_history
      label: What medical conditions do you have?
      hint: null
      type: select_multiple
      options:
      - Hemophilia A
      - Hemophilia B
      - von Willebrand Disease
      - Factor XII deficiency
      - Other (please specify)
      required: false
    - id: 7
      name: healthcare_team
      label: Who is part of your healthcare team?
      hint: null
      type: select_multiple
      options:
      - Hemophilia specialist
      - Primary care physician
      - Nurse practitioner
      - Other (please specify)
      required: false
    - id: 8
      name: treatment_preferences
      label: What are your preferences for treatment?
      hint: null
      type: select_multiple
      options:
      - Injections
      - Infusions
      - Oral medications
      - Other (please specify)
      required: false
    - id: 9
      name: bleeding_history_date
      label: When did you first experience a bleeding episode?
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: note
