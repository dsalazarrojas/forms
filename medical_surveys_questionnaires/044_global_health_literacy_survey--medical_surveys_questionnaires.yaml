      - '{''id'': 2, ''label'': ''low''}'
      - '{''id'': 3, ''label'': ''fair''}'
      - '{''id'': 4, ''label'': ''good''}'
      - '{''id'': 5, ''label'': ''very_good''}'
      - '{''id'': 6, ''label'': ''extremely_good''}'
      required: false
