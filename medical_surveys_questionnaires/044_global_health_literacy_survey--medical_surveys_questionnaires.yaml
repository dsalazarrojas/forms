inputSchema:
  type: object
  properties:
    title: global_health_literacy_survey
    pages:
    - id: 1
      name: general_health_info
      label: What is general health information?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: demographics
      label: what_are_your_age_group
      hint: null
      type: select_one
      options:
      - 18-24
      - 25-34
      - 35-44
      - 45-54
      - 55 or above
      required: false
    - id: 3
      name: health_literacy_level
      label: How would you rate your health literacy level?
      hint: null
      type: select_one
      options:
      - very low
      - low
      - fair
      - good
      - very good
      - extremely good
      required: false
    - id: 4
      name: health_conceptual_understanding
      label: Which of the following best describes your health conceptual understanding?
      hint: null
      type: select_one
      options:
      - I have a good understanding
      - I have some understanding
      - I have very little understanding
      - I do not understand
      required: false
    - id: 5
      name: risk_benefit_assessment
      label: Which of the following best describes your general risk-benefit assessment?
      hint: null
      type: select_one
      options:
      - very high risk
      - high
      - moderate
      - low
      - very low
      - not applicable
      required: false
    - id: 6
      name: health_conceptual_understanding_scale
      label: Which of the following best describes your health conceptual understanding
        on the scale?
      hint: null
      type: select_multiple
      options:
      - 0-25
      - 26-50
      - 51-75
      - 76-100
      required: false
    - id: 7
      name: health_systems_navigating
      label: Which of the following best describes your ability to navigate health
        systems?
      hint: null
      type: select_one
      options:
      - very easy
      - easy
      - moderate
      - difficult
      - very difficult
      required: false
    - id: 8
      name: health_literacy_score
