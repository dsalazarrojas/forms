inputSchema:
  type: object
  properties:
    title: Cardiovascular Knowledge Assessment
    pages:
    - id: 1
      name: respondent_details_header
      label: -- Respondent Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name_full
      label: Respondent Name
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: knowledge_quiz_header
      label: -- Cardiovascular Health Quiz --
      hint: Answer based on your current knowledge
      type: note
      options: []
      required: false
    - id: 5
      name: normal_blood_pressure_range
      label: What is considered a normal blood pressure range?
      hint: Select one
      type: select_one
      options:
      - label: Less than 120/80 mmHg
        value: normal
      - label: 130/90 mmHg
        value: pre_htn
      - label: 140/90 mmHg
        value: stage1
      - label: 150/100 mmHg
        value: stage2
      required: true
    - id: 6
      name: heart_attack_symptoms_common
      label: Which of the following are common heart attack symptoms?
      hint: Select all that apply
      type: select_multiple
      options:
      - label: Chest pain or pressure
        value: chest_pain
      - label: Shortness of breath
        value: sob
      - label: Nausea or lightheadedness
        value: nausea
      - label: Pain in jaw, neck, or back
        value: pain_jaw
      required: true
    - id: 7
      name: aerobic_exercise_benefits_cardio
      label: What is a primary benefit of regular aerobic exercise?
      hint: null
      type: select_one
      options:
      - label: Decreased heart efficiency
        value: decrease_efficiency
      - label: Lowered resting heart rate
        value: lower_rhr
      - label: Increased LDL cholesterol
        value: inc_ldl
      - label: Decreased lung capacity
        value: dec_lung
      required: true
    - id: 8
      name: atherosclerosis_risk_factors
      label: Which factors increase the risk of atherosclerosis?
      hint: Arterial hardening/plaque
      type: select_multiple
      options:
      - label: High saturated fat diet
        value: high_fat
      - label: Regular physical activity
        value: physical_activity
      - label: Chronic stress
        value: stress
      - label: Tobacco use
        value: tobacco
      required: true
    - id: 9
      name: self_assessed_knowledge_level
      label: Rate your self-assessed heart health knowledge
      hint: 1 - Low, 5 - High
      type: number
      options: []
      required: true
    - id: 10
      name: interests_topics_cardio
      label: Which topics would you like to learn more about?
      hint: null
      type: select_multiple
      options:
      - label: Heart-Healthy Nutrition
        value: nutrition
      - label: Stress Management
        value: stress_mgmt
      - label: Blood Pressure Control
        value: bp_control
      - label: Medication Management
        value: med_mgmt
      required: false
    - id: 11
      name: preferred_learning_method_style
      label: Preferred method for learning about heart health
      hint: null
      type: select_one
      options:
      - label: Video Tutorials
        value: video
      - label: Interactive Webinars
        value: webinars
      - label: Reading Material (PDFs/Blogs)
        value: reading
      - label: In-person Workshops
        value: workshops
      required: true
    - id: 12
      name: additional_comments_questions
      label: Do you have any specific questions about heart health?
      hint: null
      type: text
      options: []
      required: false
