inputSchema:
  type: object
  properties:
    title: Covid 19 Daily Status Update Form
    pages:
    - id: 1
      name: patient_id
      label: Patient Id
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully Vaccinated
      - Partially Vaccinated
      - Not Vaccinated
      required: false
    - id: 4
      name: symptoms
      label: Symptoms
      hint: null
      type: select_multiple
      options:
      - Fever
      - Cough
      - Runny Nose/Stuffy Nose
      - Sore Throat
      - Runny Eyes
      - Headache
      - Fatigue
      - Diarrhea
      - Nausea
      - Vomiting
      - Abdominal Pain
      - Abdominal Cramping
      - Dizziness
      - Muscle Aches
      - Joint Pain
      required: false
    - id: 5
      name: temperature
      label: Temperature
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: date_last_vaccination
      label: Date Last Vaccinated
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time_of_last_vaccination
      label: Time Of Last Vaccination
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: date_status_update
      label: Date Status Update
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time_status_update
      label: Time Status Update
      hint: null
      type: time
      options: []
      required: false
