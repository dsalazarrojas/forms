      type: select_one
      options:
      - Normal
      - Using a respirator
      - Other
      required: false
    - id: 13
      name: oxygen_level
      label: Oxygen level
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: prosthesis
      label: Prosthesis
      hint: null
