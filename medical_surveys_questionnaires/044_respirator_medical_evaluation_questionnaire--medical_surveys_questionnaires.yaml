    - id: 5
      name: medical_surgical_history
      label: Surgical History
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: family_history
      label: Family History
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: smoking_history
      label: Smoking History
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: alcohol_history
      label: Alcohol History
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: respirator_use
      label: Respirator Use
      hint: null
      type: select_multiple
