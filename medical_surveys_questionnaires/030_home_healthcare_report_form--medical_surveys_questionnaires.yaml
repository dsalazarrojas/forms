inputSchema:
  type: object
  properties:
    title: Home Healthcare Report Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_visit
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: primary_complaint
      label: Primary Complaint
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: patient_status
      label: Patient Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 5
      name: visit_type
      label: Visit Type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: medical_condition
      label: Medical Condition
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: medication
      label: Medication
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: family_members_cared_for
      label: Family Members Cared For
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: visit_duration
      label: Visit Duration
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: patient_notes
      label: Patient Notes
      hint: null
      type: note
      options: []
      required: true
    - id: 12
      name: staff_notes
      label: Staff Notes
      hint: null
      type: text
      options: []
      required: true
