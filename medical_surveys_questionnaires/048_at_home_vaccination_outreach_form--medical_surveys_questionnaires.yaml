inputSchema:
  type: object
  properties:
    title: At Home Vaccination Outreach Form
    pages:
    - id: 1
      name: respondent_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: respondent_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: Your birth date
      type: date
      options: []
      required: true
    - id: 4
      name: age_group
      label: Age Group
      hint: Select your age range
      type: select_one
      options:
      - 0-6 months
      - 6-12 months
      - 1-2 years
      - 3-5 years
      - 6-11 years
      - 12-18 years
      - 19-64 years
      - 65+ years
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 7
      name: mailing_address
      label: Mailing Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 9
      name: state_province
      label: State/Province
      hint: State or province
      type: text
      options: []
      required: true
    - id: 10
      name: zip_code
      label: ZIP/Postal Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 11
      name: country
      label: Country
      hint: Country of residence
      type: text
      options: []
      required: true
    - id: 12
      name: vaccination_status
      label: Current Vaccination Status
      hint: Are you currently vaccinated?
      type: select_one
      options:
      - Fully Vaccinated
      - Partially Vaccinated
      - Not Vaccinated
      - Prefer Not to Say
      required: true
    - id: 13
      name: interested_vaccines
      label: Interested In Getting Vaccinated For
      hint: Select all vaccines of interest
      type: select_multiple
      options:
      - COVID-19
      - Influenza (Flu)
      - Pneumococcal
      - Shingles
      - Measles/Mumps/Rubella
      - Pertussis (Whooping Cough)
      - Tetanus/Diphtheria
      - Hepatitis B
      - Other
      required: true
    - id: 14
      name: vaccine_hesitation
      label: Vaccine Hesitation Concerns
      hint: Any concerns about vaccines?
      type: select_multiple
      options:
      - Side Effects
      - Safety
      - Ingredients
      - Effectiveness
      - Religious Beliefs
      - Medical Conditions
      - No Concerns
      required: false
    - id: 15
      name: medical_conditions
      label: Current Medical Conditions
      hint: Any health conditions?
      type: text
      options: []
      required: false
    - id: 16
      name: allergies
      label: Known Allergies
      hint: Medication or ingredient allergies?
      type: text
      options: []
      required: false
    - id: 17
      name: current_medications
      label: Current Medications
      hint: Any medications being taken?
      type: text
      options: []
      required: false
    - id: 18
      name: pregnancy_status
      label: Pregnancy Status
      hint: If applicable
      type: select_one
      options:
      - Not Applicable
      - Currently Pregnant
      - Breastfeeding
      - Recently Postpartum
      - Prefer Not to Say
      required: true
    - id: 19
      name: healthcare_provider
      label: Current Healthcare Provider
      hint: Doctor or clinic name
      type: text
      options: []
      required: false
    - id: 20
      name: insurance_status
      label: Insurance Status
      hint: Do you have health insurance?
      type: select_one
      options:
      - Insured
      - Uninsured
      - Underinsured
      - Prefer Not to Say
      required: true
    - id: 21
      name: preferred_vaccination_location
      label: Preferred Vaccination Location
      hint: Where would you prefer to get vaccinated?
      type: select_one
      options:
      - At Home
      - Healthcare Provider Office
      - Pharmacy
      - Community Health Center
      - Mobile Clinic
      - No Preference
      required: true
    - id: 22
      name: language_preference
      label: Language Preference
      hint: Preferred language for communication
      type: select_one
      options:
      - English
      - Spanish
      - French
      - Mandarin
      - Vietnamese
      - Other
      required: true
    - id: 23
      name: vaccination_information_source
      label: How Did You Hear About This Vaccination Outreach
      hint: Source of information
      type: select_one
      options:
      - Email
      - Phone Call
      - Text Message
      - Community Organization
      - Healthcare Provider
      - Social Media
      - News Media
      - Word of Mouth
      - Other
      required: true
    - id: 24
      name: additional_information
      label: Additional Questions or Information
      hint: Any other relevant details?
      type: text
      options: []
      required: false
    - id: 25
      name: form_submission_date
      label: Form Submission Date
      hint: Date form completed
      type: date
      options: []
      required: true
