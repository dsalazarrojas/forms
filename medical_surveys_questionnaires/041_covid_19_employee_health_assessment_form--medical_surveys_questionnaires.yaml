inputSchema:
  type: object
  properties:
    title: COVID 19 Employee Health Assessment Form
    pages:
    - id: 1
      name: assessment_date
      label: Assessment Date
      hint: Date of health assessment
      type: date
      options: []
      required: true
    - id: 2
      name: employee_name
      label: Employee Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: overall_health
      label: Overall Health Status
      hint: How would you rate your health?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 8
      name: fever
      label: Do you have a fever?
      hint: 100.4 degrees F or higher
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: true
    - id: 9
      name: cough
      label: Do you have a cough?
      hint: New or worsening cough
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: true
    - id: 10
      name: shortness_of_breath
      label: Do you have shortness of breath?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: true
    - id: 11
      name: loss_taste_smell
      label: Have you lost taste or smell?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: true
    - id: 12
      name: sore_throat
      label: Do you have a sore throat?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 13
      name: body_aches
      label: Do you have body aches?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 14
      name: fatigue
      label: Do you feel unusual fatigue?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Severe
      required: false
    - id: 15
      name: headache
      label: Do you have a headache?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 16
      name: nausea_vomiting
      label: Do you have nausea or vomiting?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 17
      name: diarrhea
      label: Do you have diarrhea?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 18
      name: covid_exposure
      label: Have you been exposed to COVID-19?
      hint: In the past 14 days
      type: select_one
      options:
      - No exposure
      - Possible exposure
      - Confirmed exposure
      - Not sure
      - Prefer not to say
      required: true
    - id: 19
      name: covid_diagnosis
      label: Have you been diagnosed with COVID-19?
      hint: null
      type: select_one
      options:
      - 'No'
      - Yes - currently sick
      - Yes - recovered
      - Prefer not to answer
      required: true
    - id: 20
      name: quarantine_isolation
      label: Are you currently under quarantine/isolation?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Uncertain
      required: true
    - id: 21
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully vaccinated
      - Partially vaccinated
      - Not vaccinated
      - Prefer not to say
      required: false
    - id: 22
      name: chronic_conditions
      label: Chronic Health Conditions
      hint: Select all that apply
      type: select_multiple
      options:
      - Diabetes
      - Heart disease
      - High blood pressure
      - Asthma
      - COPD
      - Kidney disease
      - Liver disease
      - Immunocompromised
      - Cancer
      - Other
      - None
      required: false
    - id: 23
      name: current_medications
      label: Current Medications
      hint: List any medications you take
      type: text
      options: []
      required: false
    - id: 24
      name: mental_health
      label: Mental Health Status
      hint: How is your mental health?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: false
    - id: 25
      name: stress_level
      label: Stress Level
      hint: null
      type: select_one
      options:
      - Very Low
      - Low
      - Moderate
      - High
      - Very High
      required: false
    - id: 26
      name: work_ability
      label: Are you able to perform your work duties?
      hint: null
      type: select_one
      options:
      - Yes - fully capable
      - Yes - with accommodations
      - No - unable to work
      - Uncertain
      required: true
