inputSchema:
  type: object
  properties:
    title: Behavior Observation Form
    pages:
    - id: 1
      name: section_observation_header
      label: -- Student and Observer Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: observer_name
      label: Observer Name / Role
      hint: e.g. Ms. Smith - Classroom Teacher
      type: text
      options: []
      required: true
    - id: 4
      name: observation_date
      label: Date of Observation
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: observation_start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: observation_end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: classroom_setting
      label: Setting / Activity during observation
      hint: e.g. Math Lesson, Recess, Small Group
      type: text
      options: []
      required: true
    - id: 8
      name: section_observed_behaviors
      label: -- Observed Behaviors --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: positive_behaviors_noted
      label: Positive / On-task Behaviors Observed
      hint: Select all that apply
      type: select_multiple
      options:
      - Followed directions promptly
      - Remained in seat / designated area
      - Participated in discussion
      - Completed assigned work
      - Helped a peer
      - Self-corrected behavior
      required: false
    - id: 10
      name: target_behaviors_for_improvement
      label: Behaviors Targeted for Improvement
      hint: Select all that apply
      type: select_multiple
      options:
      - Out of seat without permission
      - Talking out of turn
      - Physical aggression
      - Refusal to follow directions
      - Distracting others
      - Off-task (staring, playing with items)
      required: false
    - id: 11
      name: frequency_of_target_behavior
      label: Frequency of Targeted Behavior
      hint: Approx. number of occurrences during session
      type: number
      options: []
      required: true
    - id: 12
      name: behavioral_intensity_rating
      label: Intensity of Behavior
      hint: 1 mild, 5 severe
      type: number
      options: []
      required: true
    - id: 13
      name: section_antecedent_consequence
      label: -- Context and Results --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: antecedent_trigger
      label: Antecedent (What happened right before the behavior?)
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: teacher_response_consequence
      label: Consequence (How did the teacher/observer respond?)
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: section_follow_up
      label: -- Follow-up and Recommendations --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: recommendation_for_parent_support
      label: Recommended strategies for home/school support
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: follow_up_meeting_required
      label: Is a follow-up meeting with parents required?
      hint: null
      type: select_one
      options:
      - true
      - false
      - To be decided
      required: true
    - id: 19
      name: observer_signature_name
      label: Observer Signature (Print Name)
      hint: null
      type: text
      options: []
      required: true
