inputSchema:
  type: object
  properties:
    title: dyspnea-assessment-survey
    pages:
    - id: 1
      name: survey_title
      label: Survey Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: medical_conditions
      label: Medical Conditions
      hint: null
      type: select_multiple
      options:
      - COPD
      - Cardiovascular
      - Respiratory
      required: false
    - id: 4
      name: symptom_duration
      label: Duration of Symptoms
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: symptom_frequency
      label: Frequency of Symptoms
      hint: null
      type: select_one
      options:
      - Constantly
      - Occasionally
      - Rarely
      required: false
    - id: 6
      name: shortness_of_breath_questions
      label: Shortness of Breath Questions
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: trigger_questions
      label: Triggers
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: medical_history
      label: Medical History
      hint: null
      type: note
      options: []
      required: false
