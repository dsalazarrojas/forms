      options:
      - Never
      - Less than an hour a day
      - 1-2 hours a day
      - 2-4 hours a day
      - 4 or more hours a day
      required: false
    - id: 3
      name: eating_disorders
      label: Eating Disorders
      hint: null
      type: select_one
      options:
      - No problem
      - Sometimes
      - Often
      - Frequently
      required: false
    - id: 4
      name: behavioral_insights
      label: Behavioral Insights
      hint: null
      type: text
      options: []
      required: false
