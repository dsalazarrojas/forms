inputSchema:
  type: object
  properties:
    title: Virtual Health Consultation Perception Survey
    pages:
    - id: 1
      name: survey_header
      label: Survey Header
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: question_1
      label: How would you rate the ease of scheduling an appointment?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: question_2
      label: How easy was it to find what you needed in our health portal?
      hint: null
      type: select_one
      options:
      - '{1: ''Very Easy''}'
      - '{2: ''Somewhat Easy''}'
      - '{3: ''Not Easy''}'
      - '{4: ''Not at all Easy''}'
      required: true
    - id: 4
      name: question_3
      label: How would you rate your overall experience with this telehealth visit?
      hint: null
      type: select_multiple
      options:
      - '{1: ''Excellent''}'
      - '{2: ''Somewhat Good''}'
      - '{3: ''Somewhat Bad''}'
      - '{4: ''Very Bad''}'
      required: true
    - id: 5
      name: question_4
      label: Would you like to receive a follow-up call after your appointment?
      hint: null
      type: select_one
      options:
      - '{1: True}'
      - '{2: False}'
      required: false
