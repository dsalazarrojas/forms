      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: years_of_experience_in_biotech
      label: Years of Experience in Biotech
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: section_self
      label: -- Expertise Self-Assessment --
      hint: Rate your proficiency level
      type: note
      options: []
      required: false
    - id: 6
      name: proficiency_in_bioprocessing
      label: Proficiency in Bioprocessing
      hint: null
