      - Beginner
      - None
      required: true
    - id: 7
      name: proficiency_in_bioinformatics
      label: Proficiency in Bioinformatics
      hint: Computational biology and data analysis
      type: select_one
      options:
      - Advanced
      - Intermediate
      - Beginner
      - None
      required: true
    - id: 8
      name: proficiency_in_regulatory_affairs
      label: Proficiency in Regulatory Affairs
      hint: Compliance and clinical trials
      type: select_one
      options:
      - Advanced
      - Intermediate
      - Beginner
      - None
      required: true
