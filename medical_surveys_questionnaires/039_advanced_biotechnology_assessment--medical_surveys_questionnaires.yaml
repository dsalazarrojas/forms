inputSchema:
  type: object
  properties:
    title: Advanced Biotechnology Assessment
    pages:
    - id: 1
      name: section_prof
      label: -- Professional Profile --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: professional_full_name
      label: Professional Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
