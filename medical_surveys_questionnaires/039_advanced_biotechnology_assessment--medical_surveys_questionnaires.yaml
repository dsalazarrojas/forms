      name: specific_research_goals
      label: Specific Research Goals
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: section_feed
      label: -- Program Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: suggestions_for_future_biotech_training_programs
      label: Suggestions for Future Biotech Training Programs
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: interest_in_collaboration_opportunities
      label: Interest in Collaboration Opportunities
      hint: null
      type: select_one
      options:
      - High
      - Moderate
      - Low
      required: true
