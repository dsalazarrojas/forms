      name: primary_challenges_faced
      label: Primary Challenges Faced
      hint: Select the top barriers in your work
      type: select_multiple
      options:
      - Funding Constraints
      - Regulatory Hurdles
      - Technical Limitations
      - Data Management
      - Ethical Concerns
      required: false
    - id: 11
      name: description_of_biggest_technical_bottleneck
      label: Description of Biggest Technical Bottleneck
      hint: Provide detail on a specific challenge
      type: text
      options: []
      required: true
    - id: 12
      name: section_rd
