inputSchema:
  type: object
  properties:
    title: Community Program Leadership Award Nomination Form
    pages:
    - id: 1
      name: nominator_info
      label: Nominator Information
      hint: Your contact details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: organization
      label: Organization
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 7
      name: relationship
      label: Relationship to Nominee
      hint: null
      type: select_one
      options:
      - Colleague
      - Supervisor
      - Community Member
      - Program Participant
      - Friend
      - Family Member
      - Other
      required: true
    - id: 8
      name: nominee_info
      label: Nominee Information
      hint: Details about the person being nominated
      type: note
      options: []
      required: false
    - id: 9
      name: nominee_first_name
      label: Nominee First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: nominee_last_name
      label: Nominee Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: nominee_email
      label: Nominee Email
      hint: If available
      type: email
      options: []
      required: false
    - id: 12
      name: nominee_phone
      label: Nominee Phone
      hint: If available
      type: text
      options: []
      required: false
    - id: 13
      name: nominee_organization
      label: Nominee Organization
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: nominee_title
      label: Nominee Title or Role
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: years_service
      label: Years of Community Service
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - 10+ years
      required: true
    - id: 16
      name: award_category
      label: Award Category
      hint: null
      type: select_one
      options:
      - Outstanding Leadership
      - Emerging Leader
      - Lifetime Achievement
      - Volunteer Excellence
      - Innovation in Service
      - Community Impact
      - Youth Leadership
      required: true
    - id: 17
      name: nomination_statement
      label: Nomination Statement
      hint: Why does this person deserve this award
      type: text
      options: []
      required: true
    - id: 18
      name: leadership_qualities
      label: Leadership Qualities Demonstrated
      hint: Select all that apply
      type: select_multiple
      options:
      - Vision
      - Integrity
      - Communication
      - Empathy
      - Decision Making
      - Team Building
      - Problem Solving
      - Mentoring
      - Innovation
      - Accountability
      required: true
    - id: 19
      name: achievements
      label: Key Achievements
      hint: List specific accomplishments
      type: text
      options: []
      required: true
    - id: 20
      name: impact_description
      label: Describe the Impact on the Community
      hint: Be specific about outcomes
      type: text
      options: []
      required: true
    - id: 21
      name: programs_led
      label: Programs or Initiatives Led
      hint: List and describe
      type: text
      options: []
      required: true
    - id: 22
      name: challenges_overcome
      label: Challenges Overcome
      hint: Describe obstacles faced
      type: text
      options: []
      required: false
    - id: 23
      name: supporting_documents
      label: Supporting Documents
      hint: What are you including
      type: select_multiple
      options:
      - Letters of Support
      - Photos
      - News Articles
      - Certificates
      - Program Reports
      - Testimonials
      - Other
      required: false
    - id: 24
      name: additional_supporters
      label: Number of Additional Supporters
      hint: Others endorsing this nomination
      type: number
      options: []
      required: false
    - id: 25
      name: previous_awards
      label: Has the Nominee Received Awards Before
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 26
      name: previous_awards_details
      label: Previous Awards Details
      hint: List if yes
      type: text
      options: []
      required: false
    - id: 27
      name: nominee_availability
      label: Will the Nominee Attend the Award Ceremony
      hint: If selected
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unknown
      required: false
    - id: 28
      name: additional_comments
      label: Additional Comments
      hint: Anything else to share
      type: text
      options: []
      required: false
    - id: 29
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
