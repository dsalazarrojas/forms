inputSchema:
  type: object
  properties:
    title: Awards Nomination 1 Responsive
    pages:
    - id: 1
      name: nomination_category
      label: Nomination Category
      hint: Which award category
      type: select_one
      options:
      - Student of the year
      - Teacher of the year
      - Employee of the year
      - Leadership award
      - Innovation award
      - Community service
      - Team achievement
      - Rising star
      - Lifetime achievement
      - Other
      required: true
    - id: 2
      name: nominator_name
      label: Nominator Full Name
      hint: Your complete name
      type: text
      options: []
      required: true
    - id: 3
      name: nominator_email
      label: Email Address
      hint: Your contact email
      type: email
      options: []
      required: true
    - id: 4
      name: nominator_phone
      label: Phone Number
      hint: Your contact phone
      type: text
      options: []
      required: false
    - id: 5
      name: nominator_relationship
      label: Your Relationship to Nominee
      hint: How do you know the nominee
      type: select_one
      options:
      - Self-nomination
      - Colleague/coworker
      - Supervisor/manager
      - Student
      - Teacher/professor
      - Client/customer
      - Friend
      - Family member
      - Other
      required: true
    - id: 6
      name: nominee_name
      label: Nominee Full Name
      hint: Complete name of person being nominated
      type: text
      options: []
      required: true
    - id: 7
      name: nominee_email
      label: Nominee Email
      hint: Nominee's contact email
      type: email
      options: []
      required: false
    - id: 8
      name: nominee_phone
      label: Nominee Phone
      hint: Nominee's contact phone
      type: text
      options: []
      required: false
    - id: 9
      name: nominee_organization
      label: Nominee Organization
      hint: School, company, or institution
      type: text
      options: []
      required: true
    - id: 10
      name: nominee_title
      label: Nominee Title or Position
      hint: Their job title or role
      type: text
      options: []
      required: true
    - id: 11
      name: years_of_service
      label: Years of Service
      hint: How long has the nominee been in this role
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 4-7 years
      - 8-15 years
      - More than 15 years
      required: true
    - id: 12
      name: nomination_statement
      label: Nomination Statement
      hint: Why is this person deserving of this award
      type: text
      options: []
      required: true
    - id: 13
      name: key_achievements
      label: Key Achievements
      hint: List 3-5 major accomplishments
      type: text
      options: []
      required: true
    - id: 14
      name: impact_description
      label: Impact Description
      hint: How has this person made a difference
      type: text
      options: []
      required: true
    - id: 15
      name: supporting_documents
      label: Supporting Documents
      hint: Resume, letters of support, etc
      type: text
      options: []
      required: false
    - id: 16
      name: additional_references
      label: Additional References
      hint: Names of others who can provide references
      type: text
      options: []
      required: false
    - id: 17
      name: previous_awards
      label: Previous Awards Received
      hint: List any relevant prior awards
      type: text
      options: []
      required: false
    - id: 18
      name: nominee_qualities
      label: Outstanding Qualities
      hint: What qualities make this person stand out
      type: select_multiple
      options:
      - Leadership
      - Innovation
      - Dedication
      - Teamwork
      - Integrity
      - Creativity
      - Excellence
      - Perseverance
      - Compassion
      - Vision
      required: true
    - id: 19
      name: confidentiality
      label: Confidentiality Preference
      hint: Should the nominee know about this nomination
      type: select_one
      options:
      - Yes, nominee is aware
      - No, keep confidential
      - Contact nominee after review
      required: true
    - id: 20
      name: submission_deadline
      label: Are You Aware of Deadline
      hint: Do you know the submission deadline
      type: select_one
      options:
      - Yes, submitting on time
      - Need deadline extension
      - Unsure
      required: true
    - id: 21
      name: how_heard_about_awards
      label: How Did You Hear About This Award
      hint: Your referral source
      type: select_one
      options:
      - Email announcement
      - Website
      - Social media
      - Colleague
      - Supervisor
      - Previous recipient
      - Other
      required: false
    - id: 22
      name: nominator_signature
      label: I Certify This Information Is Accurate
      hint: Check to confirm accuracy
      type: select_one
      options:
      - Yes, I certify
      - Other
      required: true
    - id: 23
      name: submission_date
      label: Submission Date
      hint: Today's date
      type: date
      options: []
      required: true
