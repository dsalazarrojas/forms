inputSchema:
  type: object
  properties:
    title: Real Estate Sustainability Award Application Form
    pages:
    - id: 1
      name: project_details
      label: Project Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: project_impacts
      label: What are the environmental impacts of your project?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: project_documents
      label: Supporting documents
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: sustainability_impacts
      label: How will your project address sustainability?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: award_programs
      label: Award Programs
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: project_location
      label: Project Location
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: applicant_name
      label: Applicant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: applicant_contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
