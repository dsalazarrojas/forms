inputSchema:
  type: object
  properties:
    title: Referee Of The Year Voting
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: First name of the referee
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: Last name of the referee
      type: text
      options: []
      required: false
    - id: 3
      name: rating
      label: Rating
      hint: Rate the referee on a scale of 1-5
      type: number
      options: []
      required: false
    - id: 4
      name: feedback
      label: Feedback
      hint: Additional feedback about the referee
      type: text
      options: []
      required: false
    - id: 5
      name: category
      label: Category
      hint: Select category for the referee
      type: select_one
      options:
      - Referee A
      - Referee B
      - Referee C
      required: false
    - id: 6
      name: select_multiple
      label: Select Multiple
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: date
      label: Date
      hint: Date of the event
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: Time of the event
      type: time
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: Contact phone number of the referee
      type: text
      options: []
      required: false
    - id: 11
      name: select_one
      label: Select One
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 12
      name: select_multiple2
      label: Select Multiple 2
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
