inputSchema:
  type: object
  properties:
    title: Award Certificate Form
    pages:
      - id: 1
        name: section_recipient_info
        label: -- Recipient Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: recipient_full_name
        label: Recipient Full Name
        hint: As it should appear on the certificate
        type: text
        options: []
        required: true
      - id: 3
        name: recipient_email
        label: Recipient Email Address
        hint: For digital certificate delivery
        type: email
        options: []
        required: true
      - id: 4
        name: section_award_details
        label: -- Award and Honor Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 5
        name: award_type
        label: Type of Award
        hint: e.g. Excellence, Service, Completion
        type: text
        options: []
        required: true
      - id: 6
        name: award_title
        label: Award Title
        hint: The official name of the award
        type: text
        options: []
        required: true
      - id: 7
        name: reason_for_award
        label: Reason for the Award
        hint: Briefly describe the accomplishment
        type: text
        options: []
        required: true
      - id: 8
        name: award_date
        label: Date of the Award
        hint: null
        type: date
        options: []
        required: true
      - id: 9
        name: section_issuing_info
        label: -- Issuing Authority Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 10
        name: issuing_organization
        label: Issuing Institution or Organization
        hint: Full name of the company or school
        type: text
        options: []
        required: true
      - id: 11
        name: issuing_department
        label: Issuing Department
        hint: e.g. HR, Sales, Academic Affairs
        type: text
        options: []
        required: true
      - id: 12
        name: presenter_name
        label: Presenter Name
        hint: Name of the person signing or presenting
        type: text
        options: []
        required: true
      - id: 13
        name: presenter_title
        label: Presenter Title
        hint: e.g. CEO, Principal, Manager
        type: text
        options: []
        required: true
      - id: 14
        name: certificate_format
        label: Certificate Format
        hint: How would you like the certificate?
        type: select_one
        options:
          - Digital PDF Only
          - Physical Print Only
          - Both Digital and Physical
        required: true
      - id: 15
        name: template_style
        label: Certificate Template Style
        hint: Choose the visual theme
        type: select_one
        options:
          - Classic and Traditional
          - Modern and Bold
          - Minimalist and Clean
          - Elegant and Ornate
        required: true
      - id: 16
        name: mailing_address
        label: Mailing Address for Physical Copy
        hint: If applicable
        type: text
        options: []
        required: false
      - id: 17
        name: special_instructions
        label: Special Instructions or Customizations
        hint: Any specific wording or logo requests
        type: text
        options: []
        required: false
