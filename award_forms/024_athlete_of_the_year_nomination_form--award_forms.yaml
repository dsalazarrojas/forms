inputSchema:
  type: object
  properties:
    title: Athlete of the Year Nomination Form
    pages:
    - id: 1
      name: nominator_info_header
      label: -- Nominator Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: nominator_name
      label: Nominator Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: nominator_relationship
      label: Relationship to Nominee
      hint: null
      type: select_one
      options:
      - Coach
      - Teammate
      - Teacher / Professor
      - Parent / Guardian
      - Community Member
      required: true
    - id: 4
      name: nominator_email
      label: Nominator Email Address
      hint: example@domain.com
      type: email
      options: []
      required: true
    - id: 5
      name: nominator_phone
      label: Nominator Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: nominee_info_header
      label: -- Nominee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: nominee_name
      label: Nominee Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: nominee_sport
      label: Nominee Primary Sport(s)
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: nominee_academic_year
      label: Nominee Grade or Year of Study
      hint: e.g. 11th Grade, Sophomore
      type: text
      options: []
      required: true
    - id: 10
      name: nominee_team
      label: Nominee Team or Club Affiliation
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: achievements_header
      label: -- Athletic Achievements and Performance --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: athletic_achievements
      label: Significant Athletic Achievements this Year
      hint: Championships, records, or major milestones
      type: text
      options: []
      required: true
    - id: 13
      name: statistical_highlights
      label: Statistical Highlights
      hint: e.g. points scored, personal best times, batting average
      type: text
      options: []
      required: false
    - id: 14
      name: awards_won
      label: Other Team or Individual Awards Won
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: character_header
      label: -- Character and Leadership --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: leadership_qualities
      label: Description of Nominee Leadership Qualities
      hint: How do they lead on and off the field?
      type: text
      options: []
      required: true
    - id: 17
      name: sportsmanship_attitude
      label: Description of Nominee Sportsmanship and Attitude
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: community_academic_excellence
      label: Community Involvement and Academic Excellence
      hint: Contributions outside of athletics
      type: text
      options: []
      required: false
    - id: 19
      name: summary_header
      label: -- Nomination Summary --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: nomination_reason
      label: Why should this athlete be named Athlete of the Year?
      hint: Provide a compelling case for the selection committee
      type: text
      options: []
      required: true
    - id: 21
      name: supporting_links
      label: Supporting Documents or Media Links
      hint: Links to news articles, highlight reels, etc.
      type: text
      options: []
      required: false
    - id: 22
      name: nomination_date
      label: Date of Nomination
      hint: null
      type: date
      options: []
      required: true
