    - id: 2
      name: nominee_full_name
      label: Nominee full name
      hint: As appears on official records
      type: text
      options: []
      required: true
    - id: 3
      name: nominee_club
      label: Nominee club or branch
      hint: e.g., Bondi SLSC
      type: text
      options: []
      required: true
    - id: 4
      name: nominee_role
      label: Nominee primary role
      hint: e.g., Lifesaver, Coach, Volunteer
      type: text
      options: []
      required: true
    - id: 5
      name: award_category
      label: Award category nominated for
      hint: Select one category
      type: select_one
      options:
      - Volunteer of the Year
      - Lifesaver of the Year
      - Coach of the Year
      - Young Volunteer Award
      - Team Award
      - Innovation Award
      - Community Impact Award
      required: true
    - id: 6
      name: nomination_date
      label: Date of nomination
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: nominator_name
      label: Nominator full name
      hint: Person submitting this nomination
      type: text
      options: []
      required: true
    - id: 8
      name: nominator_email
      label: Nominator email address
      hint: We'll contact you for verification
      type: email
      options: []
      required: true
    - id: 9
      name: nominator_phone
      label: Nominator phone number
      hint: Optional — include country code if outside Australia
      type: phone
      options: []
      required: false
    - id: 10
      name: eligibility_confirmation
      label: Does the nominee meet eligibility criteria?
      hint: Confirm eligibility before submitting
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 11
      name: nomination_statement
      label: Nomination statement
      hint: Describe why the nominee deserves this award (200-500 words)
      type: text
      options: []
      required: true
    - id: 12
      name: achievements_summary
      label: Key achievements and impact
      hint: Concise bullet points or short paragraphs highlighting achievements
      type: text
      options: []
      required: true
    - id: 13
      name: attributes_matched
      label: Attributes demonstrated by nominee (select all that apply)
      hint: Select all that apply
      type: select_multiple
      options:
      - Leadership
      - Community Impact
      - Skill Excellence
      - Innovation
      - Longevity of Service
      - Teamwork
      required: false
    - id: 14
      name: supporting_evidence_instructions
