inputSchema:
  type: object
  properties:
    title: Table Saw Extension Request Form
    pages:
    - id: 1
      name: form_title
      label: Form Title
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Equipment
      - Consumable
      required: true
    - id: 3
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: supervisor_review
      label: Supervisor Review
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: extension_date
      label: Extension Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: form_submitter
      label: Form Submitter
      hint: null
      type: text
      options: []
      required: false
