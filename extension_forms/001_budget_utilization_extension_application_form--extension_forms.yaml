inputSchema:
  type: object
  properties:
    title: Budget Utilization Extension Application Form
    pages:
    - id: 1
      name: form_header
      label: -- Application Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_name
      label: Applicant Name
      hint: Full name of the person requesting an extension
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department or Unit
      hint: Department responsible for the budget
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact Email
      hint: Provide an email for follow up
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact Phone
      hint: Optional phone number for urgent contact
      type: text
      options: []
      required: false
    - id: 6
      name: project_name
      label: Project or Initiative Name
      hint: Name of project associated with the budget
      type: text
      options: []
      required: true
    - id: 7
      name: budget_line_item
      label: Budget Line Item
      hint: Identify the budget line that requires extension
      type: text
      options: []
      required: true
    - id: 8
      name: current_utilization_percent
      label: Current Utilization Percent
      hint: Enter the percentage of funds already used, e g 75
      type: number
      options: []
      required: true
    - id: 9
      name: requested_extension_days
      label: Requested Extension Period
      hint: Select the number of additional days requested
      type: select_one
      options:
      - 30 days
      - 60 days
      - 90 days
      - 120 days
      required: true
    - id: 10
      name: justification
      label: Justification for Extension
      hint: Explain why additional time is needed and planned activities
      type: text
      options: []
      required: true
    - id: 11
      name: expected_completion_date
      label: Expected Completion Date
      hint: Anticipated date when remaining activities will be complete
      type: date
      options: []
      required: true
    - id: 12
      name: manager_comments
      label: Manager Comments
      hint: For reviewer use to record approval notes or conditions
      type: note
      options: []
      required: false
    - id: 13
      name: approval_status
      label: Approval Status
      hint: Administrative decision for extension request
      type: select_one
      options:
      - Pending
      - Approved
      - Denied
      required: true
