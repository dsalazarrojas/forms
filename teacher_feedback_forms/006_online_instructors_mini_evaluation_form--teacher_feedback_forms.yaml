inputSchema:
  type: object
  properties:
    title: Online Instructors Mini Evaluation Form
    pages:
    - id: 1
      name: instructor_performance
      label: Instructors Performance
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: course_organization
      label: How well was the course organized
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: communication_skills
      label: Effective Communication
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: technical_skills
      label: Technical Skills
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: response_rate
      label: How quickly did the instructor respond to questions
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: course_difficulty
      label: How difficult was the course
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: instructor_support
      label: How much support did the instructor provide
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: overall_satisfaction
      label: Overall satisfaction with instructor
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 9
      name: would_take_class_again
      label: Would you take this class again
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: instructor_rating
      label: Rating for Instructor
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: comment_for_instructor
      label: Comments for Instructor
      hint: null
      type: note
      options: []
      required: false
