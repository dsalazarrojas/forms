inputSchema:
  type: object
  properties:
    title: Teachers Assessment Form
    pages:
    - id: 1
      name: teacher_id
      label: Teacher ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: subject
      label: Subject
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: strengths
      label: Strengths
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: weaknesses
      label: Weaknesses
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: teacher_rating
      label: Teacher Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 10
      name: teacher_feedback
      label: Teacher Feedback
      hint: null
      type: text
      options: []
      required: false
