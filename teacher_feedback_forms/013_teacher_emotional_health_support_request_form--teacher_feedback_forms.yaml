inputSchema:
  type: object
  properties:
    title: Teacher Emotional Health Support Request Form
    pages:
    - id: 1
      name: teacher_emotional_health_support_request_form_page_1
      label: How do you feel about your current emotional state?
      hint: Please be honest and specific about your feelings.
      type: select_one
      options:
      - Highly Stressed
      - Somewhat Stressed
      - Neither Stressed nor Unstressed
      - Highly Unstressed
      required: true
    - id: 2
      name: teacher_emotional_health_support_request_form_page_2
      label: What are your concerns about your well-being?
      hint: null
      type: note
      options: []
      required: true
    - id: 3
      name: teacher_emotional_health_support_request_form_page_3
      label: How often do you feel overwhelmed or stressed?
      hint: null
      type: select_one
      options:
      - Almost Daily
      - Several Times a Week
      - Rarely
      required: true
    - id: 4
      name: teacher_emotional_health_support_request_form_page_4
      label: What are your needs for support within the school environment?
      hint: null
      type: select_multiple
      options:
      - Mental Health Support
      - Physical Health Support
      - Social Support
      - Academic Support
      required: true
    - id: 5
      name: teacher_emotional_health_support_request_form_page_5
      label: How supported do you feel by your colleagues?
      hint: null
      type: select_multiple
      options:
      - Very Supported
      - Somewhat Supported
      - Not Very Supported
      - Not at All Supported
      required: true
    - id: 6
      name: teacher_emotional_health_support_request_form_page_6
      label: How supported do you feel by your administrators?
      hint: null
      type: select_multiple
      options:
      - Very Supported
      - Somewhat Supported
      - Not Very Supported
      - Not at All Supported
      required: true
    - id: 7
      name: teacher_emotional_health_support_request_form_page_7
      label: How would you like to be contacted for support?
      hint: null
      type: select_multiple
      options:
      - Phone Call
      - Email
      - Text Message
      - Video Conference
      required: true
    - id: 8
      name: teacher_emotional_health_support_request_form_page_8
      label: Do you have any additional comments or concerns?
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: teacher_emotional_health_support_request_form_page_9
      label: What specific support requests do you have?
      hint: null
      type: select_multiple
      options:
      - Individualized Support
      - Group Support
      - Online Support
      - In-person Support
      required: true
    - id: 10
      name: teacher_emotional_health_support_request_form_page_10
      label: Can we best support you during this time?
      hint: Please be specific about your needs.
      type: select_multiple
      options:
      - Yes, with regular check-ins
      - Yes, with occasional check-ins
      - No, only in emergency situations
      required: true
