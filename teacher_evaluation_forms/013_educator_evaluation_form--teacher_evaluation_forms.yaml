inputSchema:
  type: object
  properties:
    title: Educator Evaluation Form
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Contact phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - '1.0'
      - '2.0'
      - '3.0'
      required: true
    - id: 6
      name: knowledge_application
      label: knowledge application
      hint: null
      type: note
      options: []
      required: true
    - id: 7
      name: classroom_management
      label: Classroom management
      hint: null
      type: note
      options: []
      required: true
    - id: 8
      name: additional_comments
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: assigned_tool
      label: Assigned tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: true
