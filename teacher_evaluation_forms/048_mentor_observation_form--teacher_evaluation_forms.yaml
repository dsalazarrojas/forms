inputSchema:
  type: object
  properties:
    title: Mentor Observation Form
    pages:
    - id: 1
      name: new_teacher
      label: New Teacher
      hint: null
      type: select_one
      options:
      - new teacher 1
      - new teacher 2
      required: false
    - id: 2
      name: date_of_first_observation
      label: Date of First Observation
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: frequency_of_observation
      label: Frequency of Observation
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: observation_duration
      label: Duration of Observation
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: areas_for_improvement
      label: Areas for Improvement
      hint: null
      type: select_multiple
      options:
      - communication
      - lesson plan
      - classroom management
      required: false
    - id: 7
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - very satisfied
      - somewhat satisfied
      - not satisfied
      required: false
