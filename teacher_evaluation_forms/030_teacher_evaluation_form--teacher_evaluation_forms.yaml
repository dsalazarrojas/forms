inputSchema:
  type: object
  properties:
    title: teacher_evaluation_form
    pages:
    - id: 1
      name: general_info
      label: General Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: evaluation_criterion
      label: Evaluation Criteria
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: teacher_info
      label: Teacher Info
      hint: null
      type: select_multiple
      options:
      - Mr
      - Ms
      - Dr
      required: false
    - id: 4
      name: evaluation_scale
      label: Evaluation Scale
      hint: null
      type: select_multiple
      options:
      - Scale 5
      - Scale 7
      - Scale 9
      - Scale 10
      required: false
    - id: 5
      name: evaluation_comment
      label: Evaluation Comment
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: teacher_evaluation
      label: Teacher Evaluation
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Average
      required: false
    - id: 7
      name: date_of_evaluation
      label: Date of Evaluation
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: teacher_email
      label: Teacher Email
      hint: null
      type: email
      options: []
      required: false
