      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: feedback_on_safety
      label: feedback_on_safety
      hint: null
      type: select_multiple
      options:
      - Always Safe
      - Mostly Safe
      - Sometimes Safe
      - Never Safe
      required: false
    - id: 13
      name: suggestions
      label: suggestions
      hint: Do you have any suggestions?
      type: text
      options: []
      required: false
