    - id: 7
      name: student_performance
      label: student_performance
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time
      label: time
      hint: null
      type: time
      options: []
      required: false
