      label: Student Engagement
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: student_progress
      label: Student Progress
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: classroom_environment
      label: Classroom Environment
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: teacher_availability
      label: Teacher Availability
      hint: Please enter the teacher's availability
      type: note
      options: []
      required: false
    - id: 12
      name: teacher_comments
      label: Teacher Comments
      hint: null
      type: note
      options: []
      required: false
