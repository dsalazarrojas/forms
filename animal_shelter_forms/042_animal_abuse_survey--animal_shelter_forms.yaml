inputSchema:
  type: object
  properties:
    title: Animal Abuse Survey
    pages:
    - id: 1
      name: section_report_information
      label: -- Report Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: reporter_name
      label: Reporter name
      hint: Optional to remain anonymous
      type: text
      options: []
      required: false
    - id: 3
      name: contact_email
      label: Contact email
      hint: For follow up if provided
      type: email
      options: []
      required: false
    - id: 4
      name: incident_location
      label: Incident location
      hint: Where the incident occurred
      type: text
      options: []
      required: true
    - id: 5
      name: incident_date
      label: Incident date
      hint: Date of abuse or neglect
      type: date
      options: []
      required: false
    - id: 6
      name: animal_description
      label: Animal description
      hint: Breed, color, size
      type: text
      options: []
      required: true
    - id: 7
      name: evidence_available
      label: Evidence available
      hint: Photos or witness contact
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: additional_details
      label: Additional details
      hint: Describe the situation
      type: text
      options: []
      required: false
