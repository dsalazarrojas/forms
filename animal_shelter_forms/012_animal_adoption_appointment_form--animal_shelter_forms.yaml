inputSchema:
  type: object
  properties:
    title: Animal Adoption Appointment Form
    pages:
    - id: 1
      name: applicant_name
      label: Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: For appointment confirmation
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: address
      label: Home Address
      hint: Street address, city, state, zip
      type: text
      options: []
      required: true
    - id: 5
      name: appointment_intro
      label: Schedule Your Adoption Appointment
      hint: Thank you for your interest in adopting. Please fill out this form to
        schedule an appointment to meet our available animals.
      type: note
      options: []
      required: false
    - id: 6
      name: preferred_date
      label: Preferred Appointment Date
      hint: First choice of date
      type: date
      options: []
      required: true
    - id: 7
      name: preferred_time
      label: Preferred Appointment Time
      hint: First choice of time
      type: select_one
      options:
      - Morning - 9 AM to 12 PM
      - Afternoon - 12 PM to 4 PM
      - Evening - 4 PM to 6 PM
      required: true
    - id: 8
      name: alternative_date
      label: Alternative Date
      hint: Second choice if first is unavailable
      type: date
      options: []
      required: false
    - id: 9
      name: animal_interest
      label: What type of animal are you interested in adopting
      hint: Select all that apply
      type: select_multiple
      options:
      - Dog
      - Cat
      - Rabbit
      - Bird
      - Small animal - hamster, guinea pig
      - Reptile
      - Not sure yet
      required: true
    - id: 10
      name: specific_animal
      label: Are you interested in a specific animal
      hint: If you saw an animal online or in person
      type: text
      options: []
      required: false
    - id: 11
      name: household_members
      label: How many people live in your household
      hint: Total number including yourself
      type: select_one
      options:
      - 1 - Just me
      - 2
      - 3
      - 4
      - 5 or more
      required: true
    - id: 12
      name: children_ages
      label: Do you have children under 18
      hint: Children in the household
      type: select_one
      options:
      - No children
      - Yes - under 5 years
      - Yes - 5 to 12 years
      - Yes - 13 to 17 years
      - Yes - multiple age groups
      required: true
    - id: 13
      name: current_pets
      label: Do you currently have pets
      hint: Current pets in household
      type: select_one
      options:
      - No - first pet
      - Yes - 1 pet
      - Yes - 2 pets
      - Yes - 3 or more pets
      required: true
    - id: 14
      name: pet_details
      label: Please describe your current pets
      hint: Type, breed, age, sex
      type: text
      options: []
      required: false
    - id: 15
      name: housing_type
      label: What type of housing do you live in
      hint: Housing situation
      type: select_one
      options:
      - House with yard
      - House without yard
      - Apartment
      - Condo or townhouse
      - Farm or rural property
      - Other
      required: true
    - id: 16
      name: ownership_status
      label: Do you own or rent your home
      hint: Housing status
      type: select_one
      options:
      - Own
      - Rent
      - Live with family
      - Military housing
      required: true
    - id: 17
      name: landlord_approval
      label: If renting, do you have landlord approval for pets
      hint: Rental approval
      type: select_one
      options:
      - Yes - written approval
      - Yes - verbal approval
      - No - not yet
      - Not applicable - I own
      required: false
    - id: 18
      name: yard_info
      label: Do you have a fenced yard
      hint: Yard information
      type: select_one
      options:
      - Yes - fully fenced
      - Yes - partially fenced
      - No fence
      - Not applicable
      required: false
    - id: 19
      name: adoption_experience
      label: Have you adopted from a shelter before
      hint: Previous adoption experience
      type: select_one
      options:
      - Yes - multiple times
      - Yes - once
      - No - first time adopting
      required: true
    - id: 20
      name: lifestyle
      label: How would you describe your activity level
      hint: Lifestyle match for pet
      type: select_one
      options:
      - Very active - outdoor enthusiast
      - Moderately active - regular walks
      - Somewhat active - occasional walks
      - Low activity - prefer indoor time
      required: true
    - id: 21
      name: work_schedule
      label: How many hours per day are you away from home
      hint: Time away from home
      type: select_one
      options:
      - Less than 4 hours
      - 4-6 hours
      - 7-9 hours
      - 10 or more hours
      - Work from home
      required: true
    - id: 22
      name: veterinarian_name
      label: Do you have a veterinarian
      hint: Current or planned vet
      type: text
      options: []
      required: false
    - id: 23
      name: special_requests
      label: Any special requests or questions
      hint: Additional information
      type: text
      options: []
      required: false
    - id: 24
      name: referral_source
      label: How did you hear about us
      hint: Referral source
      type: select_one
      options:
      - Website
      - Social media
      - Friend or family
      - Previous adopter
      - Community event
      - Other
      required: false
