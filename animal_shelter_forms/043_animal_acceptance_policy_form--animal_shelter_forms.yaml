inputSchema:
  type: object
  properties:
    title: Animal Acceptance Policy Form
    pages:
    - id: 1
      name: section_policy
      label: -- Acceptance Policy --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_name
      label: Applicant name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: property_type
      label: Property type
      hint: Residence type
      type: select_one
      options:
      - House
      - Apartment
      - Farm
      required: false
    - id: 4
      name: has_other_pets
      label: Do you have other pets
      hint: Select yes or no
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: acceptance_agreement
      label: I agree to the animal acceptance policy
      hint: Confirm agreement
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: signature
      label: Signature printed name
      hint: Type name to sign
      type: text
      options: []
      required: true
    - id: 7
      name: date_signed
      label: Date signed
      hint: Date of acceptance
      type: date
      options: []
      required: true
