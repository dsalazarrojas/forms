inputSchema:
  type: object
  properties:
    title: Rehoming Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact Email
      hint: Please provide your email address.
      type: email
      options: []
      required: true
    - id: 4
      name: animal_type
      label: Animal Type
      hint: null
      type: select_one
      options:
      - Cat
      - Dog
      - Other
      required: true
    - id: 5
      name: reason_for_rehoming
      label: Reason for Rehoming
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: pet_name
      label: Pet Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: pet_age
      label: Pet Age
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: pet_description
      label: Pet Description
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: owner_signature
      label: Owner Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: vet_certificate
      label: Vet Certificate
      hint: If your pet has a vet certicate, please provide it.
      type: text
      options: []
      required: false
    - id: 11
      name: photo_permission
      label: Photo Permission
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: adoption_agreement
      label: Adoption Agreement
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: surrender_form_signed
      label: Surrender Form Signed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Declined
      required: true
    - id: 14
      name: date_of_adoption
      label: Date of Adoption
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: date_of_surrender
      label: Date of Surrender
      hint: null
      type: date
      options: []
      required: true
    - id: 16
      name: signature_of_owner
      label: Signature of Owner
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: signature_of_surrenderer
      label: Signature of Surrenderer
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: photo_of_pet
      label: Photo of Pet
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: additional_notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: photo_of_owner
      label: Photo of Owner
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: photo_of_surrenderer
      label: Photo of Surrenderer
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: photo_of_animal
      label: Photo of Animal
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: photo_of_surrender_location
      label: Photo of Surrender Location
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: photo_of_surrender_vehicle
      label: Photo of Surrender Vehicle
      hint: null
