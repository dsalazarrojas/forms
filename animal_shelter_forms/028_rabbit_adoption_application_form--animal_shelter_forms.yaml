inputSchema:
  type: object
  properties:
    title: Rabbit Adoption Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
