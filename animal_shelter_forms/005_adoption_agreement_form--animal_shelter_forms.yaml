inputSchema:
  type: object
  properties:
    title: Adoption Agreement Form
    pages:
    - id: 1
      name: agreement_header
      label: -- Adoption Agreement --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: adopter_name
      label: Adopter full name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: adopter_contact
      label: Contact phone or email
      hint: Provide best contact method
      type: text
      options: []
      required: true
    - id: 4
      name: pet_name
      label: Pet name
      hint: Name of the adopted animal
      type: text
      options: []
      required: true
    - id: 5
      name: adoption_date
      label: Adoption date
      hint: Date of transfer
      type: date
      options: []
      required: true
    - id: 6
      name: terms_and_conditions
      label: Agreement terms acknowledged
      hint: Confirm you understand the care responsibilities
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 7
      name: return_policy_understanding
      label: Return policy understanding
      hint: Acknowledge shelter return policy
      type: select_one
      options:
      - I understand
      - I do not understand
      required: true
    - id: 8
      name: vaccination_record_received
      label: Vaccination record received
      hint: Shelter will provide records if available
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: emergency_contact
      label: Emergency contact
      hint: Name and phone number
      type: text
      options: []
      required: false
    - id: 10
      name: signature
      label: Adopter signature name
      hint: Type full name as electronic signature
      type: text
      options: []
      required: true
    - id: 11
      name: signature_date
      label: Signature date
      hint: Date of agreement
      type: date
      options: []
      required: true
