inputSchema:
  type: object
  properties:
    title: Community Tree Preference Survey
    pages:
    - id: 1
      name: respondent_name
      label: Respondent name
      hint: Optional for follow up
      type: text
      options: []
      required: false
    - id: 2
      name: neighborhood
      label: Neighborhood or ward
      hint: Helps map preferences by area
      type: text
      options: []
      required: true
    - id: 3
      name: tree_support_priority
      label: Tree planting priority
      hint: Rank importance of tree planting in your area
      type: select_one
      options:
      - Very important
      - Important
      - Neutral
      - Not important
      required: true
    - id: 4
      name: preferred_species
      label: Preferred tree species
      hint: Select species you prefer
      type: select_multiple
      options:
      - Shade trees
      - Flowering trees
      - Evergreen
      - Native species
      required: false
    - id: 5
      name: preferred_location
      label: Preferred locations for planting
      hint: Street, park, or yard
      type: select_multiple
      options:
      - Street verge
      - Park
      - School grounds
      - Private yard
      required: false
    - id: 6
      name: concerns_about_trees
      label: Concerns about tree planting
      hint: Roots, allergies, maintenance, other
      type: text
      options: []
      required: false
    - id: 7
      name: volunteer_interest
      label: Interest in volunteering for planting
      hint: Select if you want to help
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
