inputSchema:
  type: object
  properties:
    title: Government Public Service Community Feedback Assessment Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: 'null'
      type: email
      options: []
      required: false
    - id: 3
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: service_area
      label: Service Area
      hint: null
      type: select_one
      options:
      - Public Services
      - Community Services
      - Other Services
      required: false
    - id: 7
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: rating
      label: Rating
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Unsatisfactory
      required: false
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
