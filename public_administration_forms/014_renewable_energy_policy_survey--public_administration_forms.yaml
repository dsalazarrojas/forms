inputSchema:
  type: object
  properties:
    title: Renewable Energy Policy Survey
    pages:
    - id: 1
      name: current_status
      label: What is the current status of renewable energy policy in your country/region?
      hint: Please choose one of the options
      type: select_one
      options:
      - In Progress
      - Implemented
      - Not Applicable
      - Other (please specify)
      required: true
    - id: 2
      name: energy_sources
      label: Which renewable energy sources are currently being utilized in your country/region?
      hint: null
      type: select_multiple
      options:
      - Solar
      - Wind
      - Hydro
      - Geothermal
      - Other (please specify)
      required: true
    - id: 3
      name: challenges
      label: What are the main challenges facing the implementation of renewable energy
        policies in your country/region?
      hint: Please provide a brief description
      type: text
      options: []
      required: true
    - id: 4
      name: government_support
      label: How does the government support the development of renewable energy technologies?
      hint: null
      type: select_one
      options:
      - Financial Support
      - Regulatory Support
      - Technical Support
      - Other (please specify)
      - Not Sufficient
      required: true
    - id: 5
      name: benefits
      label: What are the main benefits of renewable energy policies in your country/region?
      hint: Please provide a brief description
      type: text
      options: []
      required: true
    - id: 6
      name: solutions
      label: What are some potential solutions to the challenges facing renewable
        energy policies?
      hint: Please provide a brief description
      type: text
      options: []
      required: true
    - id: 7
      name: public_perception
      label: How does the public perceive renewable energy policies in your country/region?
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Neutral
      - Other (please specify)
      required: true
    - id: 8
      name: media_promotion
      label: What role does the media play in promoting renewable energy policies?
      hint: null
      type: select_one
      options:
      - Active Support
      - Passive Support
      - No Support
      - Other (please specify)
      required: true
    - id: 9
      name: laws_and_regulations
      label: Are there any specific laws or regulations that support or hinder renewable
        energy policies?
      hint: null
      type: select_multiple
      options:
      - Supportive
      - Hindrance
      - Neutral
      - Other (please specify)
      required: true
    - id: 10
      name: additional_comments
      label: Can you provide any additional comments or suggestions on the current
        state of renewable energy policies?
      hint: Please provide a brief description
      type: text
      options: []
      required: false
