inputSchema:
  type: object
  properties:
    title: Family Benefits Application Feedback
    pages:
    - id: 1
      name: application_date
      label: Application Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: feedback
      label: feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: rating
      label: Overall Satisfaction
      hint: Rate your overall satisfaction with our benefits application experience
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 4
      name: suggestion
      label: Suggestions
      hint: null
      type: select_multiple
      options:
      - Improved application form
      - Improved website
      - Improved customer service
      - Improved communication
      required: true
    - id: 5
      name: contact_information
      label: How did you contact us
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - Walk-in
      - Online Chat
      required: true
    - id: 6
      name: contact_person
      label: Contact Person
      hint: null
      type: select_one
      options:
      - Jim
      - John
      - Jane
      - Other
      required: true
    - id: 7
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: comment
      label: Comments
      hint: null
      type: note
      options: []
      required: false
