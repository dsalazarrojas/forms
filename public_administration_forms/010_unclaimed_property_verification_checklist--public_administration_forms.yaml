      type: number
      options: []
      required: false
    - id: 6
      name: uploaded_documents
      label: upload documents
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: review_date
      label: review date
      hint: YYYY-MM-dd
      type: date
      options: []
      required: false
    - id: 8
      name: review_time
      label: review time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: customer_name
      label: customer name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: customer_email
      label: customer email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: customer_phone
      label: customer phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: verification_team
      label: verification team
      hint: null
      type: select_multiple
      options:
      - Team 1
      - Team 2
      - Team 3
      required: false
