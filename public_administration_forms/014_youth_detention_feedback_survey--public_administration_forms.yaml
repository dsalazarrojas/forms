inputSchema:
  type: object
  properties:
    title: Youth Detention Feedback Survey
    pages:
    - id: 1
      name: safety_ratings
      label: Safety Ratings
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: staff_support
      label: Staff Support
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: services_provided
      label: Services Provided
      hint: null
      type: select_multiple
      options:
      - Counseling
      - Education
      - Recreational
      - Medical
      - Other
      required: false
    - id: 4
      name: resident_feedback
      label: Resident Feedback
      hint: What do you have to say about your stay here?
      type: text
      options: []
      required: false
    - id: 5
      name: safety_concerns
      label: Safety Concerns
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: resident_suggestion
      label: Resident Suggestion
      hint: Do you have any suggestions for improvement?
      type: text
      options: []
      required: false
    - id: 7
      name: staff_feedback
      label: Staff Feedback
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: program_services
      label: Program Services
      hint: null
      type: select_multiple
      options:
      - Counseling
      - Education
      - Recreational
      - Medical
      - Other
      required: false
    - id: 9
      name: resident_signature
      label: Resident Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: staff_signature
      label: Staff Signature
      hint: null
      type: text
      options: []
      required: false
