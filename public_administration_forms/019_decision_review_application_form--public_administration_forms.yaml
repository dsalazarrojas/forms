inputSchema:
  type: object
  properties:
    title: Decision Review Application Form
    pages:
    - id: 1
      name: form_submission_details
      label: Submission Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: case_details
      label: Case Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: review_request
      label: Review Request
      hint: null
      type: select_multiple
      options:
      - Review and Approve
      - Send for Review
      - Revoke
      required: false
    - id: 4
      name: review_details
      label: Review Details
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: review_status
      label: Review Status
      hint: null
      type: select_one
      options:
      - In Progress
      - Complete
      - Cancelled
      required: false
    - id: 6
      name: review_notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
