inputSchema:
  type: object
  properties:
    title: Veteran CDL Skills Test Waiver Application
    pages:
    - id: 1
      name: veteran_cdl_skills_test_waiver_application_form
      label: Section 1 - Veteran CDL Skills Test Waiver Application
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: waiver_request
      label: Waiver Request
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: military_service
      label: Military Service
      hint: List dates of active military service (DD MMM YYYY - DD MMM YYYY) or 'Never
        served in the military'
      type: text
      options: []
      required: false
    - id: 6
      name: veteran_status
      label: Veteran Status
      hint: 'Select one of the following: ''Active Duty'', ''Discharged'', ''Retired'',
        or ''Never served in the military'''
      type: text
      options: []
      required: false
    - id: 7
      name: veteran_cdl_license_number
      label: Veteran CDL License Number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: state_license_number
      label: State CDL License Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: state_license_expires
      label: State CDL License Expires
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: driver_license_number
      label: Driver License Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: driver_license_expires
      label: Driver License Expires
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: cdl_skill_tests_completed
      label: CDL Skill Tests Completed
      hint: null
      type: select_multiple
      options:
      - Air Braking
      - Back-Off-Over
      - Pre-Trip Inspection
      - Skid Pad
      required: false
    - id: 13
      name: veteran_cdl_waiver_approved
      label: Veteran CDL Waiver Approved
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: veteran_cdl_waiver_reason
      label: Veteran CDL Waiver Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: veteran_comments
      label: Veteran Comments
      hint: Comments about the waiver request
      type: text
      options: []
      required: false
    - id: 16
      name: state_administrators_name
      label: State Administrator's Name
      hint: Name of state CDL administrator approving or denying the waiver request
      type: text
      options: []
      required: false
    - id: 17
      name: state_administrators_signature
      label: State Administrator's Signature
      hint: Date of the administrator's signature
      type: text
      options: []
      required: false
    - id: 18
      name: state_administrators_title
      label: State Administrator's Title
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: state_administrators_date
      label: State Administrator's Date
      hint: Date of the administrator's signature
      type: date
      options: []
      required: false
