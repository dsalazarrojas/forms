inputSchema:
  type: object
  properties:
    title: Municipality Transition Plan Survey
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: readiness
      label: readiness
      hint: Please answer on a scale from 1 to 5.
      type: number
      options: []
      required: false
    - id: 3
      name: concerns
      label: concerns
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Maybe
      required: false
    - id: 4
      name: improvement_ideas
      label: improvement-ideas
      hint: null
      type: select_multiple
      options:
      - Idea 1
      - Idea 2
      - Idea 3
      required: false
    - id: 5
      name: contact_info
      label: contact-info
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone_number
      label: phone-number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: stakeholder
      label: stakeholders
      hint: null
      type: select_multiple
      options:
      - Stakeholder 1
      - Stakeholder 2
      - Stakeholder 3
      required: false
