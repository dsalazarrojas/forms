inputSchema:
  type: object
  properties:
    title: Parking Ticket Hearing Request Form
    pages:
    - id: 1
      name: parking_ticket_hearing_request
      label: parking_ticket_hearing_request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: parking_ticket_details
      label: parking_ticket_details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: preferred_hearing_date
      label: preferred_hearing_date
      hint: Please select a date
      type: date
      options: []
      required: true
    - id: 4
      name: preferred_hearing_time
      label: preferred_hearing_time
      hint: Please select a time
      type: time
      options: []
      required: true
    - id: 5
      name: supporting_documentation
      label: supporting_documentation
      hint: Upload your supporting documentation (e.g. photo of parking ticket)
      type: note
      options: []
      required: true
    - id: 6
      name: parking_ticket_number
      label: parking_ticket_number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: hearing_preferences
      label: hearing_preferences
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 8
      name: submit
      label: submit
      hint: null
      type: select_one
      options:
      - Submit
      - Cancel
      required: true
