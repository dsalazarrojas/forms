inputSchema:
  type: object
  properties:
    title: Government Instrumentality Feedback Survey
    pages:
    - id: 1
      name: service_name
      label: Service Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: agency_rating
      label: Agency Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: rating_score
      label: Rating Score
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: comment
      label: Comments
      hint: Please provide any additional comments about your experience.
      type: note
      options: []
      required: false
    - id: 8
      name: follow_up_frequency
      label: Follow Up Frequency
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      required: true
    - id: 9
      name: follow_up_method
      label: Follow Up Method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - In Person
      required: true
    - id: 10
      name: follow_up_status
      label: Follow Up Status
      hint: null
      type: select_one
      options:
      - In Progress
      - Completed
      - Not Started
      required: true
    - id: 11
      name: follow_up_notes
      label: Follow Up Notes
      hint: null
      type: note
      options: []
      required: true
    - id: 12
      name: follow_up_next_action
      label: Follow Up Next Action
      hint: null
      type: note
      options: []
      required: true
