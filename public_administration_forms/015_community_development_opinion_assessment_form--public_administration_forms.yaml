inputSchema:
  type: object
  properties:
    title: Community Development Opinion Assessment Form
    pages:
      - id: 1
        name: resident_name
        label: Name (Optional)
        hint: Your name if you wish to share
        type: text
        options: []
        required: false
      - id: 2
        name: email_address
        label: Email Address
        hint: For follow-up communications
        type: email
        options: []
        required: false
      - id: 3
        name: neighborhood
        label: Neighborhood or District
        hint: Where do you live?
        type: text
        options: []
        required: true
      - id: 4
        name: residency_type
        label: Residency Type
        hint: What is your housing situation?
        type: select_one
        options:
          - Homeowner
          - Renter
          - Living with Family
          - Other
        required: true
      - id: 5
        name: years_resident
        label: Years as Resident
        hint: How long have you lived here?
        type: select_one
        options:
          - Less than 1 year
          - 1-3 years
          - 3-5 years
          - 5-10 years
          - More than 10 years
        required: true
      - id: 6
        name: development_satisfaction
        label: Satisfaction with Current Development
        hint: How satisfied are you?
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 7
        name: housing_needs
        label: Housing Needs Priority
        hint: Rate the importance
        type: select_one
        options:
          - Critical
          - High
          - Medium
          - Low
          - Not a Priority
        required: true
      - id: 8
        name: commercial_development
        label: Commercial Development Priority
        hint: Rate the importance
        type: select_one
        options:
          - Critical
          - High
          - Medium
          - Low
          - Not a Priority
        required: true
      - id: 9
        name: infrastructure_improvements
        label: Infrastructure Improvements Priority
        hint: Rate the importance
        type: select_one
        options:
          - Critical
          - High
          - Medium
          - Low
          - Not a Priority
        required: true
      - id: 10
        name: green_spaces
        label: Parks and Green Spaces Priority
        hint: Rate the importance
        type: select_one
        options:
          - Critical
          - High
          - Medium
          - Low
          - Not a Priority
        required: true
      - id: 11
        name: traffic_concerns
        label: Traffic and Transportation Priority
        hint: Rate the importance
        type: select_one
        options:
          - Critical
          - High
          - Medium
          - Low
          - Not a Priority
        required: true
      - id: 12
        name: development_pace
        label: Current Development Pace
        hint: Is development happening too fast or slow?
        type: select_one
        options:
          - Too Fast
          - About Right
          - Too Slow
        required: true
      - id: 13
        name: community_character
        label: Is Community Character Being Preserved
        hint: Your opinion on preservation
        type: select_one
        options:
          - Yes, Definitely
          - Somewhat
          - No
          - Not Sure
        required: true
      - id: 14
        name: specific_concerns
        label: Specific Concerns or Issues
        hint: Describe any concerns
        type: text
        options: []
        required: false
      - id: 15
        name: improvement_suggestions
        label: Suggestions for Improvement
        hint: Your ideas for better development
        type: text
        options: []
        required: false
      - id: 16
        name: attend_meetings
        label: Would You Attend Planning Meetings
        hint: Are you interested in participating?
        type: select_one
        options:
          - Yes, Regularly
          - Occasionally
          - No
        required: true
