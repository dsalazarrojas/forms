inputSchema:
  type: object
  properties:
    title: inmate-release-log-form
    pages:
    - id: 1
      name: release_date
      label: Release Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: release_reason
      label: Release Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: inmate_id
      label: Inmate ID
      hint: null
      type: select_one
      options:
      - '12345'
      - '67890'
      required: false
    - id: 4
      name: return_date
      label: Return Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: staff_signature
      label: Staff Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: property_return_confirmation
      label: Property Return Confirmation
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: confirm_release
      label: Confirm Release
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: form_complete
      label: Form Complete
      hint: null
      type: select_one
      options:
      - Complete
      - Incomplete
      required: false
