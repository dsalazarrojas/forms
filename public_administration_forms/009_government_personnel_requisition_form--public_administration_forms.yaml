inputSchema:
  type: object
  properties:
    title: Government Personnel Requisition Form
    pages:
    - id: 1
      name: job_request
      label: Job Request
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: job_title
      label: Job Title
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: department
      label: Department
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: job_status
      label: Job Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 5
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: job_description
      label: Job Description
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: job_start_date
      label: Job Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: job_end_date
      label: Job End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: contact_person
      label: Contact Person
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: job_notes
      label: Job Notes
      hint: null
      type: note
      options: []
      required: false
