inputSchema:
  type: object
  properties:
    title: Public Project Expenditure Audit Form
    pages:
    - id: 1
      name: project_details
      label: Project Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: spending_reviews
      label: Spending Reviews
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: review_date
      label: Review Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: project_expenditure_type
      label: Project Expenditure Type
      hint: null
      type: select_one
      options:
      - Government
      - Grant
      - Other
      required: false
    - id: 5
      name: expenditure_amount
      label: Expenditure Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: expenditure_frequency
      label: Expenditure Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Bi-Annual
      - Annually
      required: false
    - id: 7
      name: project_start_date
      label: Project Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: project_end_date
      label: Project End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: project_status
      label: Project Status
      hint: null
      type: select_one
      options:
      - Active
      - Completed
      - Cancelled
      required: false
    - id: 10
      name: account_number
      label: Account Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: reviewer_name
      label: Reviewer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: reviewer_email
      label: Reviewer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 13
      name: reviewer_phone
      label: Reviewer Phone
      hint: null
      type: text
      options: []
      required: false
