inputSchema:
  type: object
  properties:
    title: Soccer Uniform Order Form
    pages:
    - id: 1
      name: user_input
      label: first_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: size
      label: jersey_size
      hint: null
      type: select_one
      options:
      - extra small
      - small
      - medium
      - large
      - extra large
      - x-large
      required: true
    - id: 4
      name: team_id
      label: team
      hint: null
      type: select_multiple
      options:
      - Team A
      - Team B
      - Team C
      required: true
    - id: 5
      name: payment_method
      label: payment_method
      hint: null
      type: select_one
      options:
      - Square
      - PayPal
      - Stripe
      required: true
    - id: 6
      name: payment_amount
      label: payment_amount
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: order_date
      label: date_ordered
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: order_time
      label: time_ordered
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: first_name
      label: first_name
      hint: null
      type: text
      options: []
      required: false
