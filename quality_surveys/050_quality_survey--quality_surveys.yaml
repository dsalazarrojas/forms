inputSchema:
  type: object
  properties:
    title: Quality Survey
    pages:
    - id: 1
      name: introduction
      label: Quality Survey is a survey that measures the satisfaction of customers
        after a purchase or during a service or delivery.
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_satisfaction
      label: How satisfied are you with your purchase?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      - Not At All Satisfied
      required: false
    - id: 3
      name: customer_satisfaction_what_did_we_get_right
      label: what_did_we_get_right
      hint: null
      type: select_multiple
      options:
      - The product met my expectations
      - The product exceeded my expectations
      - The product did not meet my expectations
      required: false
