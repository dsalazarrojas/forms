inputSchema:
  type: object
  properties:
    title: Candle Survey
    pages:
      - id: 1
        name: customer_name
        label: Your Name
        hint: Optional
        type: text
        options: []
        required: false
      - id: 2
        name: customer_email
        label: Email Address
        hint: For follow-up
        type: email
        options: []
        required: false
      - id: 3
        name: purchase_date
        label: Date of Purchase
        hint: When did you buy
        type: date
        options: []
        required: true
      - id: 4
        name: candle_type
        label: Type of Candle Purchased
        hint: Product type
        type: select_one
        options:
          - Jar candle
          - Pillar candle
          - Votive candle
          - Tea light
          - Taper candle
          - Container candle
          - Soy candle
          - Beeswax candle
        required: true
      - id: 5
        name: candle_scent
        label: Scent or Fragrance
        hint: Which scent
        type: text
        options: []
        required: true
      - id: 6
        name: candle_size
        label: Candle Size
        hint: Product size
        type: select_one
        options:
          - Small
          - Medium
          - Large
          - Extra large
        required: true
      - id: 7
        name: purchase_location
        label: Where Did You Purchase
        hint: Store or channel
        type: select_one
        options:
          - Online store
          - Physical retail store
          - Farmers market
          - Craft fair
          - Gift shop
          - Department store
          - Other
        required: true
      - id: 8
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: Rate your satisfaction
        type: select_one
        options:
          - Very satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very dissatisfied
        required: true
      - id: 9
        name: scent_quality_rating
        label: Scent Quality Rating
        hint: Rate the fragrance
        type: select_one
        options:
          - Excellent
          - Very good
          - Good
          - Fair
          - Poor
        required: true
      - id: 10
        name: scent_strength
        label: Scent Strength
        hint: Is scent too strong or weak
        type: select_one
        options:
          - Too strong
          - Slightly strong
          - Just right
          - Slightly weak
          - Too weak
        required: true
      - id: 11
        name: scent_longevity
        label: How Long Does Scent Last
        hint: Scent duration when burning
        type: select_one
        options:
          - Entire burn time
          - Most of burn time
          - Half of burn time
          - Briefly
          - No scent when burning
        required: true
      - id: 12
        name: burn_quality
        label: Burn Quality
        hint: How well does it burn
        type: select_one
        options:
          - Excellent - even burn
          - Very good
          - Good
          - Fair - some tunneling
          - Poor - significant tunneling
        required: true
      - id: 13
        name: burn_time
        label: Total Burn Time
        hint: How long candle lasted
        type: select_one
        options:
          - As expected
          - Longer than expected
          - Shorter than expected
          - Much shorter than expected
        required: true
      - id: 14
        name: wax_quality
        label: Wax Quality Rating
        hint: Rate wax quality
        type: select_one
        options:
          - Excellent
          - Very good
          - Good
          - Fair
          - Poor
        required: true
      - id: 15
        name: wick_performance
        label: Wick Performance
        hint: How well does wick work
        type: select_one
        options:
          - Excellent - no issues
          - Very good
          - Good
          - Fair - some mushrooming
          - Poor - frequent issues
        required: true
      - id: 16
        name: container_quality
        label: Container or Jar Quality
        hint: Rate container
        type: select_one
        options:
          - Excellent
          - Very good
          - Good
          - Fair
          - Poor
          - Not applicable
        required: false
      - id: 17
        name: packaging_rating
        label: Packaging Rating
        hint: Rate packaging
        type: select_one
        options:
          - Excellent
          - Very good
          - Good
          - Fair
          - Poor
        required: true
      - id: 18
        name: packaging_condition
        label: Did Product Arrive Damaged
        hint: Shipping condition
        type: select_one
        options:
          - No - perfect condition
          - Minor damage
          - Moderate damage
          - Severe damage
          - Did not ship
        required: false
      - id: 19
        name: value_for_money
        label: Value for Money
        hint: Is it worth the price
        type: select_one
        options:
          - Excellent value
          - Good value
          - Fair value
          - Poor value
          - Very poor value
        required: true
      - id: 20
        name: would_purchase_again
        label: Would You Purchase Again
        hint: Repeat purchase likelihood
        type: select_one
        options:
          - Definitely yes
          - Probably yes
          - Not sure
          - Probably no
          - Definitely no
        required: true
      - id: 21
        name: would_recommend
        label: Would You Recommend to Others
        hint: Recommendation likelihood
        type: select_one
        options:
          - Definitely yes
          - Probably yes
          - Not sure
          - Probably no
          - Definitely no
        required: true
      - id: 22
        name: favorite_aspect
        label: What Do You Like Most
        hint: Best feature
        type: text
        options: []
        required: false
      - id: 23
        name: areas_for_improvement
        label: What Could Be Improved
        hint: Suggestions
        type: text
        options: []
        required: false
      - id: 24
        name: desired_scents
        label: What Scents Would You Like to See
        hint: Future product ideas
        type: text
        options: []
        required: false
      - id: 25
        name: additional_comments
        label: Additional Comments
        hint: Other feedback
        type: text
        options: []
        required: false
      - id: 26
        name: survey_date
        label: Survey Date
        hint: Date completed
        type: date
        options: []
        required: true
