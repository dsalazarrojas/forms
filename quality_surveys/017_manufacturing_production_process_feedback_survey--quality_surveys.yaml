inputSchema:
  type: object
  properties:
    title: Manufacturing Production Process Feedback Survey
    pages:
    - id: 1
      name: production_team
      label: Production Team
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: production_process
      label: What production process is this feedback about?
      hint: null
      type: select_one
      options:
      - Assembly
      - Inspection
      - Other
      required: false
    - id: 3
      name: safety_concerns
      label: Safety Concerns
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: training_needs
      label: Training Needs
      hint: null
      type: select_multiple
      options:
      - On-the-job
      - Classroom
      - Both
      required: false
