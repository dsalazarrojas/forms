inputSchema:
  type: object
  properties:
    title: Aerospace Component Inspection Form
    pages:
    - id: 1
      name: inspection_info_header
      label: -- Inspection Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: inspector_id
      label: Inspector ID
      hint: Enter your employee ID.
      type: text
      options: []
      required: true
    - id: 3
      name: inspection_date
      label: Date of Inspection
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: inspection_time
      label: Time of Inspection
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: component_info_header
      label: -- Component Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: part_number
      label: Part Number
      hint: Alphanumeric code.
      type: text
      options: []
      required: true
    - id: 7
      name: serial_number
      label: Serial Number
      hint: Unique identifier.
      type: text
      options: []
      required: true
    - id: 8
      name: component_name
      label: Component Name / Description
      hint: e.g., Turbine Blade, Landing Gear Strut.
      type: text
      options: []
      required: true
    - id: 9
      name: manufacturer
      label: Manufacturer
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: inspection_results_header
      label: -- Findings --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: visual_condition
      label: Visual Condition
      hint: Any visible defects?
      type: select_one
      options:
      - No Defects Visible
      - Scratches/Dents
      - Corrosion Present
      - Cracks Identified
      - Deformation
      required: true
    - id: 12
      name: dimensional_check
      label: Dimensional Check
      hint: Measurements within tolerance?
      type: select_one
      options:
      - Pass
      - Fail
      - N/A
      required: true
    - id: 13
      name: ndt_results
      label: NDT Results (if applicable)
      hint: Non-Destructive Testing outcome.
      type: select_one
      options:
      - Pass
      - Fail
      - N/A
      required: false
    - id: 14
      name: defect_description
      label: Description of Defects
      hint: Provide details if any issues found.
      type: text
      options: []
      required: false
    - id: 15
      name: final_disposition
      label: Final Disposition
      hint: What happens to the part?
      type: select_one
      options:
      - Accepted (Serviceable)
      - Rejected (Scrap)
      - Hold for Review (MRB)
      - Repair Required
      required: true
    - id: 16
      name: signature
      label: Digital Signature
      hint: I certify this inspection is accurate.
      type: select_one
      options:
      - Signed
      - Other
      required: true
