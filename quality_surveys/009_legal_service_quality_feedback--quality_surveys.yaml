inputSchema:
  type: object
  properties:
    title: Legal Service Quality Feedback
    pages:
    - id: 1
      name: introduction
      label: What is the main reason for your legal service request?
      hint: Tell us about your legal service request
      type: text
      options: []
      required: false
    - id: 2
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Legal Consultation
      - Legal Representation
      - Other
      required: true
    - id: 3
      name: subcategory
      label: Subcategory
      hint: null
      type: select_one
      options:
      - Family Law
      - Civil Law
      - Criminal Law
      required: false
    - id: 4
      name: question_1
      label: Did you have a positive experience with our legal service?
      hint: null
      type: select_multiple
      options:
      - Positive
      - Negative
      - Mixed
      required: true
    - id: 5
      name: question_2
      label: Was your legal case resolved?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: question_3
      label: Would you recommend our legal service to others?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: date_of_service
      label: Date of Service
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: comments
      label: Comments about our service
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_person
      label: Contact Person
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
