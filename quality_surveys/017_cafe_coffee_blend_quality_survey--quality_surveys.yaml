inputSchema:
  type: object
  properties:
    title: Cafe Coffee Blend Quality Survey
    pages:
      - id: 1
        name: customer_name
        label: Your Name
        hint: Optional - for follow-up
        type: text
        options: []
        required: false
      - id: 2
        name: visit_date
        label: Visit Date
        hint: When did you visit
        type: date
        options: []
        required: true
      - id: 3
        name: visit_time
        label: Visit Time
        hint: What time of day
        type: select_one
        options:
          - Morning before 10am
          - Mid-morning 10am-12pm
          - Afternoon 12pm-4pm
          - Evening after 4pm
        required: true
      - id: 4
        name: blend_sampled
        label: Coffee Blend Sampled
        hint: Which blend did you try
        type: select_one
        options:
          - House Blend
          - Morning Roast
          - Espresso Blend
          - Single Origin Ethiopia
          - Single Origin Colombia
          - Dark Roast
          - Decaf Blend
          - Seasonal Special
        required: true
      - id: 5
        name: flavor_rating
        label: Flavor Rating
        hint: How would you rate the flavor
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 6
        name: aroma_rating
        label: Aroma Rating
        hint: How would you rate the aroma
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 7
        name: strength_rating
        label: Strength Rating
        hint: How was the coffee strength
        type: select_one
        options:
          - Too weak
          - Slightly weak
          - Just right
          - Slightly strong
          - Too strong
        required: true
      - id: 8
        name: acidity_rating
        label: Acidity Rating
        hint: How was the acidity level
        type: select_one
        options:
          - Too low
          - Low
          - Just right
          - High
          - Too high
        required: true
      - id: 9
        name: smoothness_rating
        label: Smoothness Rating
        hint: How smooth was the coffee
        type: select_one
        options:
          - Very smooth
          - Smooth
          - Average
          - Rough
          - Very rough
        required: true
      - id: 10
        name: temperature_rating
        label: Temperature Rating
        hint: Was the coffee served at right temperature
        type: select_one
        options:
          - Too cold
          - Slightly cool
          - Just right
          - Slightly hot
          - Too hot
        required: true
      - id: 11
        name: value_for_price
        label: Value for Price
        hint: How do you feel about the price
        type: select_one
        options:
          - Excellent value
          - Good value
          - Fair value
          - Poor value
          - Overpriced
        required: true
      - id: 12
        name: would_purchase_again
        label: Would You Purchase Again
        hint: Would you order this blend again
        type: select_one
        options:
          - Definitely yes
          - Probably yes
          - Not sure
          - Probably not
          - Definitely not
        required: true
      - id: 13
        name: flavor_notes_detected
        label: Flavor Notes Detected
        hint: What flavors did you notice
        type: select_multiple
        options:
          - Chocolate
          - Caramel
          - Nutty
          - Fruity
          - Floral
          - Spicy
          - Earthy
          - Smoky
          - None
        required: false
      - id: 14
        name: preferred_brewing_method
        label: Preferred Brewing Method
        hint: How was your coffee prepared
        type: select_one
        options:
          - Drip
          - French Press
          - Pour Over
          - Espresso
          - Cold Brew
          - AeroPress
        required: false
      - id: 15
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: How satisfied were you overall
        type: select_one
        options:
          - Very satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very dissatisfied
        required: true
      - id: 16
        name: improvement_suggestions
        label: Suggestions for Improvement
        hint: How could we improve this blend
        type: text
        options: []
        required: false
      - id: 17
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback about the coffee
        type: text
        options: []
        required: false
