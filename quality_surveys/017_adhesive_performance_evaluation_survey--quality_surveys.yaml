inputSchema:
  type: object
  properties:
    title: Adhesive Performance Evaluation Survey
    pages:
    - id: 1
      name: survey_header
      label: -- Adhesive Performance Evaluation Survey --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: evaluator_name
      label: Evaluator Name
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 3
      name: evaluator_email
      label: Evaluator Email
      hint: Your email for follow-up
      type: email
      options: []
      required: false
    - id: 4
      name: evaluation_date
      label: Evaluation Date
      hint: Date of the evaluation
      type: date
      options: []
      required: true
    - id: 5
      name: adhesive_product_name
      label: Adhesive Product Name
      hint: Name of the adhesive being evaluated
      type: text
      options: []
      required: true
    - id: 6
      name: adhesive_batch_number
      label: Batch/Lot Number
      hint: Batch or lot number of the adhesive sample
      type: text
      options: []
      required: true
    - id: 7
      name: substrate_type
      label: Substrate Type
      hint: What materials were bonded together?
      type: select_one
      options:
      - Wood
      - Metal
      - Plastic
      - Glass
      - Fabric
      - Paper/Cardboard
      - Composite
      - Other
      required: true
    - id: 8
      name: application_temperature
      label: Application Temperature (°F)
      hint: Temperature during application
      type: number
      options: []
      required: false
    - id: 9
      name: bond_strength_rating
      label: Bond Strength Rating
      hint: Rate the strength of the bond formed
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 10
      name: cure_time_rating
      label: Cure Time Rating
      hint: How would you rate the curing time?
      type: select_one
      options:
      - Too Fast
      - Appropriate
      - Too Slow
      - Did Not Cure
      required: true
    - id: 11
      name: viscosity_rating
      label: Viscosity Rating
      hint: How would you rate the viscosity?
      type: select_one
      options:
      - Too Thick
      - Appropriate
      - Too Thin
      - Difficult to Apply
      required: true
    - id: 12
      name: coverage_rate
      label: Coverage Rate
      hint: How much area does the adhesive cover per unit?
      type: select_one
      options:
      - Above expectations
      - Met expectations
      - Below expectations
      - Unknown
      required: false
    - id: 13
      name: durability_rating
      label: Durability Rating
      hint: How durable is the bond over time?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: temperature_resistance
      label: Temperature Resistance
      hint: How well does the bond withstand temperature changes?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: water_resistance
      label: Water/Moisture Resistance
      hint: How well does the bond withstand water/moisture?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 16
      name: chemical_resistance
      label: Chemical Resistance
      hint: How well does the bond withstand chemicals?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 17
      name: application_ease
      label: Ease of Application
      hint: How easy was it to apply the adhesive?
      type: select_one
      options:
      - Very Easy
      - Easy
      - Moderate
      - Difficult
      - Very Difficult
      required: true
    - id: 18
      name: cleanup_ease
      label: Ease of Cleanup
      hint: How easy was it to clean up after application?
      type: select_one
      options:
      - Very Easy
      - Easy
      - Moderate
      - Difficult
      - Very Difficult
      required: true
    - id: 19
      name: odor_rating
      label: Odor Rating
      hint: How would you rate the odor of the adhesive?
      type: select_one
      options:
      - No odor
      - Mild
      - Moderate
      - Strong
      - Overpowering
      required: true
    - id: 20
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied are you with the adhesive performance?
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 21
      name: recommendation_likelihood
      label: Recommendation Likelihood
      hint: How likely are you to recommend this adhesive?
      type: number
      options: []
      required: true
    - id: 22
      name: improvement_suggestions
      label: Suggestions for Improvement
      hint: What improvements would you suggest?
      type: text
      options: []
      required: false
    - id: 23
      name: additional_comments
      label: Additional Comments
      hint: Any other comments about the adhesive?
      type: text
      options: []
      required: false
