inputSchema:
  type: object
  properties:
    title: Building Energy Transition Readiness Survey
    pages:
    - id: 1
      name: survey_date
      label: Survey Date
      hint: When is this assessment conducted
      type: date
      options: []
      required: true
    - id: 2
      name: property_name
      label: Property Name
      hint: Name of the building
      type: text
      options: []
      required: true
    - id: 3
      name: property_address
      label: Property Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 4
      name: total_square_feet
      label: Total Square Footage
      hint: Building size in sqft
      type: number
      options: []
      required: false
    - id: 5
      name: building_age
      label: Building Age
      hint: Years since construction
      type: number
      options: []
      required: false
    - id: 6
      name: current_heating_system
      label: Current Heating System Type
      hint: Gas, electric, other
      type: select_one
      options:
      - Natural Gas Furnace
      - Electric Heat
      - Oil Heat
      - Geothermal
      - Unknown
      required: true
    - id: 7
      name: heating_efficiency
      label: Current Heating System Efficiency
      hint: How well is it working
      type: select_one
      options:
      - High Efficiency
      - Good
      - Fair
      - Poor
      - Unknown
      required: true
    - id: 8
      name: cooling_system
      label: Current Cooling System
      hint: AC, window units, none
      type: select_one
      options:
      - Central AC
      - Heat Pump
      - Window Units
      - None
      - Unknown
      required: true
    - id: 9
      name: insulation_status
      label: Building Insulation Status
      hint: How well insulated is the building
      type: select_one
      options:
      - Well Insulated
      - Adequately Insulated
      - Poor Insulation
      - Unknown
      required: true
    - id: 10
      name: window_condition
      label: Window Condition
      hint: Single pane, double pane, etc
      type: select_one
      options:
      - Modern Double/Triple Pane
      - Older Double Pane
      - Single Pane
      - Mixed
      required: true
    - id: 11
      name: air_sealing_needs
      label: Air Sealing and Weatherization Needs
      hint: Drafts, gaps, leaks evident
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 12
      name: renewable_energy_interest
      label: Interest in Renewable Energy
      hint: Solar, wind, geothermal
      type: select_one
      options:
      - Very Interested
      - Somewhat Interested
      - Not Sure
      - Not Interested
      required: true
    - id: 13
      name: renewable_feasibility
      label: Building Feasibility for Renewables
      hint: Roof condition, orientation, space
      type: select_one
      options:
      - Highly Feasible
      - Feasible
      - Limited Feasibility
      - Not Feasible
      required: false
    - id: 14
      name: budget_available
      label: Approximate Budget Available
      hint: For energy transition project
      type: select_one
      options:
      - Under 50000
      - 50000 - 100000
      - 100000 - 250000
      - 250000 - 500000
      - Over 500000
      - TBD
      required: false
    - id: 15
      name: timeline_preference
      label: Preferred Timeline for Transition
      hint: When to implement changes
      type: select_one
      options:
      - Immediate
      - Within 1 Year
      - 1-3 Years
      - 3-5 Years
      - No Specific Timeline
      required: true
    - id: 16
      name: key_concerns
      label: Key Concerns About Energy Transition
      hint: What worries you most
      type: select_multiple
      options:
      - Cost
      - Disruption
      - Technology
      - Funding
      - ROI
      required: false
    - id: 17
      name: additional_notes
      label: Additional Notes or Questions
      hint: Any other relevant information
      type: text
      options: []
      required: false
