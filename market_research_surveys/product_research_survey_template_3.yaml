description: Gathering feedback to understand perceptions and areas for improvement
  regarding our product.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied are you with our product?
  type: single
- options:
  - Design
  - Price
  - Performance
  - Features
  - Support
  - Ease of use
  - Reliability
  text: Which aspects most influenced your opinion of our product? (Select all that
    apply)
  type: multiple
- options:
  - true
  - false
  - Maybe
  text: Would you recommend this product to others?
  type: single
- text: What would you improve or change about our product?
  type: text
- text: Are there any specific features you'd like to see added or enhanced?
  type: text
- options:
  - Very valuable
  - Somewhat valuable
  - Neutral
  - Not very valuable
  - Not valuable at all
  text: Overall, how valuable is this product to you?
  type: single
title: Product research survey
