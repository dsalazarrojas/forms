inputSchema:
  type: object
  properties:
    title: Camper Personal Information Request Form
    pages:
    - id: 1
      name: camper_first_name
      label: Camper First Name
      hint: First name
      type: text
      options: []
      required: true
    - id: 2
      name: camper_last_name
      label: Camper Last Name
      hint: Last name
      type: text
      options: []
      required: true
    - id: 3
      name: camper_nickname
      label: Camper Nickname
      hint: What they like to be called
      type: text
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: Birth date
      type: date
      options: []
      required: true
    - id: 5
      name: age
      label: Age
      hint: Current age
      type: number
      options: []
      required: true
    - id: 6
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      - Other
      required: true
    - id: 7
      name: grade_completed
      label: Grade Completed
      hint: Select grade
      type: select_one
      options:
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: true
    - id: 8
      name: school_name
      label: School Name
      hint: Name of school
      type: text
      options: []
      required: false
    - id: 9
      name: school_grade_next_year
      label: Grade for Next School Year
      hint: What grade will they enter
      type: text
      options: []
      required: false
    - id: 10
      name: parent_guardian_1_name
      label: Parent or Guardian 1 Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 11
      name: parent_guardian_1_relationship
      label: Parent or Guardian 1 Relationship
      hint: Mother, father, guardian
      type: text
      options: []
      required: true
    - id: 12
      name: parent_guardian_1_phone
      label: Parent or Guardian 1 Phone
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 13
      name: parent_guardian_1_email
      label: Parent or Guardian 1 Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 14
      name: parent_guardian_1_occupation
      label: Parent or Guardian 1 Occupation
      hint: Job title
      type: text
      options: []
      required: false
    - id: 15
      name: parent_guardian_2_name
      label: Parent or Guardian 2 Full Name
      hint: Optional second parent
      type: text
      options: []
      required: false
    - id: 16
      name: parent_guardian_2_relationship
      label: Parent or Guardian 2 Relationship
      hint: Relationship to camper
      type: text
      options: []
      required: false
    - id: 17
      name: parent_guardian_2_phone
      label: Parent or Guardian 2 Phone
      hint: Contact phone
      type: text
      options: []
      required: false
    - id: 18
      name: parent_guardian_2_email
      label: Parent or Guardian 2 Email
      hint: Contact email
      type: email
      options: []
      required: false
    - id: 19
      name: home_address
      label: Home Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 20
      name: city
      label: City
      hint: City or town
      type: text
      options: []
      required: true
    - id: 21
      name: state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 22
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 23
      name: home_phone
      label: Home Phone
      hint: Landline
      type: text
      options: []
      required: false
    - id: 24
      name: siblings_at_camp
      label: Do You Have Siblings Attending Camp
      hint: Yes or no
      type: select_one
      options:
      - false
      - Yes - 1 sibling
      - Yes - 2 siblings
      - Yes - 3 or more
      required: true
    - id: 25
      name: sibling_names
      label: Sibling Names
      hint: List names
      type: text
      options: []
      required: false
    - id: 26
      name: previous_camp_experience
      label: Has Camper Attended Camp Before
      hint: Yes or no
      type: select_one
      options:
      - Yes - at this camp
      - Yes - at other camps
      - No - first time
      required: true
    - id: 27
      name: previous_camp_details
      label: Previous Camp Details
      hint: Describe if applicable
      type: text
      options: []
      required: false
    - id: 28
      name: how_heard_about_camp
      label: How Did You Hear About This Camp
      hint: Select all that apply
      type: select_multiple
      options:
      - School referral
      - Friend or family
      - Social media
      - Website
      - Previous camper
      - Community flyer
      - Other
      required: false
    - id: 29
      name: camper_interests
      label: Camper Interests and Hobbies
      hint: Select all that apply
      type: select_multiple
      options:
      - Sports
      - Arts and crafts
      - Music
      - Reading
      - Swimming
      - Nature and outdoors
      - Science
      - Drama
      - Dance
      - Video games
      - Other
      required: true
    - id: 30
      name: camper_favorite_subject
      label: Camper Favorite School Subject
      hint: What do they enjoy most
      type: text
      options: []
      required: false
    - id: 31
      name: camper_personality
      label: How Would You Describe Camper Personality
      hint: Select all that apply
      type: select_multiple
      options:
      - Outgoing
      - Shy
      - Energetic
      - Calm
      - Creative
      - Analytical
      - Leader
      - Follower
      - Independent
      - Team player
      required: true
    - id: 32
      name: special_talents
      label: Does Camper Have Special Talents
      hint: Describe
      type: text
      options: []
      required: false
    - id: 33
      name: goals_for_camp
      label: What Are Camper Goals for Camp
      hint: What do they hope to achieve
      type: text
      options: []
      required: false
    - id: 34
      name: additional_information
      label: Additional Information
      hint: Anything else we should know
      type: text
      options: []
      required: false
    - id: 35
      name: parent_signature
      label: Parent or Guardian Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 36
      name: signature_date
      label: Date Signed
      hint: Date
      type: date
      options: []
      required: true
