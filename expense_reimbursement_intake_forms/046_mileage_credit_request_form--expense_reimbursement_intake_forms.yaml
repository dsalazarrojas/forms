inputSchema:
  type: object
  properties:
    title: Mileage Credit Request Form
    pages:
    - id: 1
      name: trip_details
      label: Trip Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: trip_type
      label: trip_type
      hint: null
      type: select_one
      options:
      - 'Business: Business travel'
      - 'Personal: Personal'
      - 'Other: Other'
      required: false
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: trip_destination
      label: Destination
      hint: null
      type: select_multiple
      options:
      - 'Chicago: Chicago'
      - 'Dallas: Dallas'
      - 'New York City: New York City'
      required: false
    - id: 6
      name: mileage_miles
      label: Mileage (miles)
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: expense_amount
      label: Expense Amount
      hint: null
      type: number
      options: []
      required: false
