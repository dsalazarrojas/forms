      name: customer_service_agent_forms_refunded_amount
      label: Refunded Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: customer_service_agent_forms_agent_refund_comments
      label: Agent Refund Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: customer_service_agent_forms_customer_refund_type
      label: Customer Refund Type
      hint: null
      type: select_one
      options:
      - Full Refund
      - Partial Refund
      required: false
