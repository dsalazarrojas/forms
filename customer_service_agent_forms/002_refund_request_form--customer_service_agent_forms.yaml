inputSchema:
  type: object
  properties:
    title: Refund Request Form
    pages:
    - id: 1
      name: customer_service_agent_forms_customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_service_agent_forms_reason_for_refund
      label: Reason for Refund
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: customer_service_agent_forms_refund_amount
      label: Refund Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: customer_service_agent_forms_customer_service_agent
      label: Customer Service Agent
      hint: null
      type: select_one
      options:
      - Agent 1
      - Agent 2
      - Agent 3
      required: false
    - id: 5
      name: customer_service_agent_forms_customer_service_agent_comments
      label: Customer Service Agent Comments
      hint: null
      type: text
      options: []
      required: false
