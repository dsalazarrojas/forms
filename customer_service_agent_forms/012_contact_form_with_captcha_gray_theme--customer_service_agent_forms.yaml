inputSchema:
  type: object
  properties:
    title: Contact Form With Captcha Gray Theme
    pages:
      - id: 1
        name: header
        label: -- Contact Support --
        hint: Fill the form below and complete verification to submit
        type: note
        options: []
        required: false
      - id: 2
        name: full_name
        label: Full name
        hint: Your full name for the support request
        type: text
        options: []
        required: true
      - id: 3
        name: email
        label: Email address
        hint: Provide an email for follow up
        type: email
        options: []
        required: true
      - id: 4
        name: subject
        label: Subject
        hint: Brief subject of your message
        type: text
        options: []
        required: true
      - id: 5
        name: message
        label: Message
        hint: Describe the issue or inquiry in detail
        type: text
        options: []
        required: true
      - id: 6
        name: attach_files_note
        label: Attach supporting files via email
        hint: For screenshots or logs send via email if large
        type: note
        options: []
        required: false
      - id: 7
        name: captcha_note
        label: CAPTCHA verification required
        hint: Complete the verification before submitting
        type: note
        options: []
        required: true
      - id: 8
        name: preferred_contact_method
        label: Preferred contact method
        hint: How would you like a response
        type: select_one
        options:
          - Email
          - Phone
        required: false
      - id: 9
        name: additional_details
        label: Additional details
        hint: Any extra context for the support team
        type: text
        options: []
        required: false
