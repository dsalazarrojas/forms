inputSchema:
  type: object
  properties:
    title: Full Width Contact Page Responsive
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Customer Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: customer_comments
      label: Message/Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: customer_id
      label: Customer ID Number (if applicable)
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: how_did_you_hear
      label: How Did You Hear About Us?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 7
      name: contact_method
      label: How Can We Contact You?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 8
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 9
      name: additional_info
      label: Additional Information (Optional)
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: any_other_question
      label: Any Other Question (Optional)
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: customer_email_confirm
      label: Confirm Customer Email
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: happy_with_service
      label: Are You Happy with Our Service?
      hint: null
      type: radio
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
