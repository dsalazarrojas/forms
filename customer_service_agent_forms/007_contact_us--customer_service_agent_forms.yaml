inputSchema:
  type: object
  properties:
    title: Contact Us
    pages:
    - id: 1
      name: section_intro
      label: -- Contact Our Support Team --
      hint: Please fill out the form below to get in touch with us.
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Your Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Your Phone Number
      hint: Optional
      type: text
      options: []
      required: false
    - id: 6
      name: subject_type
      label: Subject of Inquiry
      hint: Select the most relevant category
      type: select_one
      options:
      - General Question
      - Technical Support
      - Billing Inquiry
      - Feedback
      - Request Call Back
      required: true
    - id: 7
      name: message_details
      label: Message / Description of the Issue
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: reference_number
      label: Reference Number (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: preferred_contact_method
      label: How should we contact you?
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - SMS
      - No preference
      required: true
    - id: 10
      name: newsletter_opt_in
      label: Sign up for our newsletter?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
