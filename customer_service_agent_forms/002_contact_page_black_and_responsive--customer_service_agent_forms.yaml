inputSchema:
  type: object
  properties:
    title: Contact Page Black and Responsive
    pages:
    - id: 1
      name: section_contact_us
      label: -- Contact Our Support Team --
      hint: We'd love to hear from you. Please fill out the form below.
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Optional - For callbacks
      type: text
      options: []
      required: false
    - id: 5
      name: inquiry_type
      label: Inquiry Type
      hint: What can we help you with today?
      type: select_one
      options:
      - General Support
      - Billing Question
      - Technical Issue
      - Feedback
      - Feature Request
      - Other
      required: true
    - id: 6
      name: priority_level
      label: Priority Level
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      - Urgent
      required: false
    - id: 7
      name: message_subject
      label: Subject
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: message_details
      label: Message Details
      hint: Please provide as much detail as possible
      type: text
      options: []
      required: true
    - id: 9
      name: section_satisfaction
      label: -- Help Us Improve --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: satisfaction_rating
      label: Overall Website Satisfaction
      hint: How was your experience on our site today?
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Unsatisfied
      - Very Unsatisfied
      required: false
    - id: 11
      name: referral_source
      label: How did you find us?
      hint: null
      type: select_one
      options:
      - Search Engine
      - Social Media
      - Referral
      - Advertisement
      - Other
      required: false
    - id: 12
      name: preferred_response_time
      label: Preferred Response Time
      hint: null
      type: select_one
      options:
      - Within 24 Hours
      - 1-3 Business Days
      - No Rush
      required: false
