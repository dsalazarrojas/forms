inputSchema:
  type: object
  properties:
    title: Service Desk Satisfaction Survey
    pages:
    - id: 1
      name: intro_section
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: question_1
      label: How would you rate the service desk's response to your query?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: question_2
      label: How would you rate your overall satisfaction with the service desk?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: question_3
      label: What can the service desk do to improve?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: question_4
      label: How long did it take to resolve your issue?
      hint: null
      type: time
      options: []
      required: false
