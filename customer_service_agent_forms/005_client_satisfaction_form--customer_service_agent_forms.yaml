inputSchema:
  type: object
  properties:
    title: Client Satisfaction Form
    pages:
    - id: 1
      name: respondent_section
      label: -- Your Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: customer_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: contact_method_preference
      label: Preferred contact method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - SMS
      - No contact needed
      required: false
    - id: 5
      name: experience_section
      label: -- Your Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: interaction_date
      label: Date of your recent interaction
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: interaction_type
      label: Type of interaction
      hint: null
      type: select_one
      options:
      - Phone call
      - Email
      - Chat
      - In-person
      - Other
      required: true
    - id: 8
      name: service_agent
      label: Name of service agent (if known)
      hint: Optional
      type: text
      options: []
      required: false
    - id: 9
      name: overall_satisfaction
      label: Overall satisfaction with the interaction
      hint: null
      type: select_one
      options:
      - Very Dissatisfied
      - Dissatisfied
      - Neutral
      - Satisfied
      - Very Satisfied
      required: true
    - id: 10
      name: rating_section
      label: -- Service Ratings --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: agent_helpfulness
      label: Agent was helpful in resolving your issue
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 12
      name: issue_resolution
      label: Your issue was resolved satisfactorily
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 13
      name: wait_time
      label: Wait time was acceptable
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 14
      name: knowledge_rating
      label: Agent demonstrated product knowledge
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 15
      name: courtesy_rating
      label: Agent was courteous and professional
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 16
      name: recommendation_section
      label: -- Recommendation --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: recommendation
      label: How likely are you to recommend us to a friend?
      hint: Rate 0 to 10
      type: number
      options: []
      required: true
    - id: 18
      name: improvement_suggestions
      label: What could we do better?
      hint: Optional feedback
      type: text
      options: []
      required: false
    - id: 19
      name: positive_feedback
      label: What did we do well?
      hint: Optional
      type: text
      options: []
      required: false
