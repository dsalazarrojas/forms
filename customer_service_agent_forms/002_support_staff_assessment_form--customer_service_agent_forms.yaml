inputSchema:
  type: object
  properties:
    title: Support Staff Assessment Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: staff_name
      label: Staff Name
      hint: The name of the staff member being assessed
      type: text
      options: []
      required: false
    - id: 3
      name: role
      label: Role
      hint: The role of the staff member being assessed
      type: select_one
      options:
      - Support
      - Customer Service
      - Operations
      - Other
      required: false
    - id: 4
      name: start_date
      label: Start Date
      hint: The start date of the staff member's employment
      type: date
      options: []
      required: false
    - id: 5
      name: end_date
      label: End Date
      hint: The end date of the staff member's employment
      type: date
      options: []
      required: false
    - id: 6
      name: manager
      label: Manager
      hint: The name of the staff member's manager
      type: text
      options: []
      required: false
    - id: 7
      name: evaluation_date
      label: Evaluation Date
      hint: The date of the last evaluation
      type: date
      options: []
      required: false
    - id: 8
      name: overall_performance
      label: Overall Performance
      hint: A description of the staff member's overall performance
      type: text
      options: []
      required: false
    - id: 9
      name: strengths
      label: Strengths
      hint: A list of the staff member's strengths
      type: text
      options: []
      required: false
    - id: 10
      name: weaknesses
      label: Weaknesses
      hint: A list of the staff member's weaknesses
      type: text
      options: []
      required: false
    - id: 11
      name: development_plan
      label: Development Plan
      hint: A plan outlining areas of development for the staff member
      type: text
      options: []
      required: false
