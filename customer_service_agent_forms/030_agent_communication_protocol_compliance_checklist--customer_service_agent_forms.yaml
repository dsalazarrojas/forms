inputSchema:
  type: object
  properties:
    title: Agent Communication Protocol Compliance Checklist
    pages:
    - id: 1
      name: checklist_header
      label: -- Compliance Checklist --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: agent_name
      label: Agent name
      hint: Name of the agent under review
      type: text
      options: []
      required: true
    - id: 3
      name: evaluation_date
      label: Evaluation date
      hint: Date of the compliance check
      type: date
      options: []
      required: true
    - id: 4
      name: greeting_protocol
      label: Greeting protocol followed
      hint: Did agent use the standard greeting
      type: select_one
      options: [Yes, No, Partially]
      required: true
    - id: 5
      name: tone_and_professionalism
      label: Tone and professionalism
      hint: Rate communication tone
      type: select_one
      options: [Excellent, Good, Fair, Poor]
      required: true
    - id: 6
      name: call_closing_protocol
      label: Call closing protocol followed
      hint: Did agent close the call per script
      type: select_one
      options: [Yes, No, Partially]
      required: true
    - id: 7
      name: data_privacy_compliance
      label: Data privacy compliance
      hint: Was customer data handled correctly
      type: select_one
      options: [Compliant, Non compliant]
      required: true
    - id: 8
      name: script_adherence
      label: Script adherence
      hint: Level of adherence to approved scripts
      type: select_one
      options: [High, Moderate, Low]
      required: true
    - id: 9
      name: action_items
      label: Action items from review
      hint: Coaching or remedial steps required
      type: text
      options: []
      required: false
    - id: 10
      name: reviewer_notes
      label: Reviewer notes
      hint: Additional evaluator comments
      type: text
      options: []
      required: false
