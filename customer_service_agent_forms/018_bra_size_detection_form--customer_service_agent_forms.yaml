inputSchema:
  type: object
  properties:
    title: Bra Size Detection Form
    pages:
    - id: 1
      name: section_header_customer
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: customer_email
      label: Email Address
      hint: For size recommendations
      type: email
      options: []
      required: true
    - id: 4
      name: customer_phone
      label: Phone Number
      hint: Contact information
      type: text
      options: []
      required: false
    - id: 5
      name: section_header_sizing
      label: -- Size Measurements --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: band_measurement
      label: Underbust Measurement
      hint: Measure directly under bust in inches
      type: number
      options: []
      required: true
    - id: 7
      name: bust_measurement
      label: Full Bust Measurement
      hint: Measure around fullest part of bust
      type: number
      options: []
      required: true
    - id: 8
      name: section_header_preferences
      label: -- Fit Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: coverage_preference
      label: Preferred Coverage
      hint: How much coverage desired
      type: select_one
      options:
      - Full coverage
      - Moderate coverage
      - Minimal coverage
      - No preference
      required: false
    - id: 10
      name: cup_shape_preference
      label: Preferred Cup Shape
      hint: How bra cup sits on body
      type: select_one
      options:
      - Balconette
      - Full cup
      - Demi-cup
      - Plunge
      - No preference
      required: false
    - id: 11
      name: strap_preference
      label: Strap Preference
      hint: Style of straps
      type: select_one
      options:
      - Standard straps
      - Convertible
      - Strapless
      - Racerback
      - No preference
      required: false
    - id: 12
      name: section_header_fit
      label: -- Current Fit Issues --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: fit_issues
      label: Current Fit Problems
      hint: Select issues experienced
      type: select_multiple
      options:
      - Band too tight
      - Band too loose
      - Cups overflow
      - Cups too big
      - Straps fall down
      - Underwire uncomfortable
      - No fit issues
      required: false
    - id: 14
      name: section_header_lifestyle
      label: -- Lifestyle and Activity --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: activity_level
      label: Primary Activity Level
      hint: What you use the bra for mostly
      type: select_one
      options:
      - Everyday wear
      - Athletic activity
      - Work/professional
      - Special occasions
      - Mixed activities
      required: false
    - id: 16
      name: sports_type
      label: Sports or High Impact Activities
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 17
      name: section_header_materials
      label: -- Material Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: material_preference
      label: Preferred Material
      hint: Fabric type preference
      type: select_multiple
      options:
      - Cotton
      - Microfiber
      - Lace
      - Satin
      - Gel
      - Memory foam
      - Moisture-wicking
      required: false
    - id: 19
      name: section_header_budget
      label: -- Budget and Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: budget_range
      label: Budget Range
      hint: Price range preferred
      type: select_one
      options:
      - Under 30 dollars
      - 30-50 dollars
      - 50-75 dollars
      - 75-100 dollars
      - Over 100 dollars
      required: false
    - id: 21
      name: sizing_consent
      label: I consent to sizing recommendations
      hint: Check to receive recommendations
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
