inputSchema:
  type: object
  properties:
    title: Baseball Team Registration Form
    pages:
    - id: 1
      name: player_first_name
      label: Player First Name
      hint: First name
      type: text
      options: []
      required: true
    - id: 2
      name: player_last_name
      label: Player Last Name
      hint: Last name
      type: text
      options: []
      required: true
    - id: 3
      name: player_date_of_birth
      label: Player Date of Birth
      hint: MM/DD/YYYY format
      type: date
      options: []
      required: true
    - id: 4
      name: player_gender
      label: Player Gender
      hint: Select option
      type: select_one
      options:
      - Male
      - Female
      - Other
      - Prefer not to say
      required: true
    - id: 5
      name: parent_guardian_name
      label: Parent or Guardian Full Name
      hint: Legal guardian
      type: text
      options: []
      required: true
    - id: 6
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: For team communications
      type: email
      options: []
      required: true
    - id: 7
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 8
      name: home_address
      label: Home Address
      hint: Complete street address
      type: text
      options: []
      required: true
    - id: 9
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: true
    - id: 10
      name: state
      label: State
      hint: Your state
      type: text
      options: []
      required: true
    - id: 11
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 12
      name: team_name
      label: Team Name
      hint: Which team
      type: text
      options: []
      required: true
    - id: 13
      name: division
      label: Division or Age Group
      hint: Which division
      type: select_one
      options:
      - 8U
      - 10U
      - 12U
      - 14U
      - 16U
      - 18U
      required: true
    - id: 14
      name: jersey_number_preference
      label: Jersey Number Preference
      hint: First and second choice
      type: text
      options: []
      required: false
    - id: 15
      name: positions_played
      label: Positions Played
      hint: Select all that apply
      type: select_multiple
      options:
      - Pitcher
      - Catcher
      - First base
      - Second base
      - Third base
      - Shortstop
      - Outfield
      required: true
    - id: 16
      name: bats
      label: Bats
      hint: Which hand
      type: select_one
      options:
      - Right
      - Left
      - Switch
      required: true
    - id: 17
      name: throws
      label: Throws
      hint: Which hand
      type: select_one
      options:
      - Right
      - Left
      required: true
    - id: 18
      name: years_experience
      label: Years of Experience
      hint: How long played
      type: select_one
      options:
      - First year
      - 1 to 2 years
      - 3 to 4 years
      - 5 plus years
      required: true
    - id: 19
      name: school_name
      label: School Name
      hint: Current school
      type: text
      options: []
      required: false
    - id: 20
      name: medical_conditions
      label: Medical Conditions or Allergies
      hint: Any conditions we should know
      type: text
      options: []
      required: false
    - id: 21
      name: medications
      label: Current Medications
      hint: List any medications
      type: text
      options: []
      required: false
    - id: 22
      name: insurance_provider
      label: Medical Insurance Provider
      hint: Insurance company
      type: text
      options: []
      required: true
    - id: 23
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 24
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number
      type: text
      options: []
      required: true
    - id: 25
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: How are they related
      type: text
      options: []
      required: true
    - id: 26
      name: uniform_size
      label: Uniform Size
      hint: Jersey and pants size
      type: select_one
      options:
      - Youth small
      - Youth medium
      - Youth large
      - Adult small
      - Adult medium
      - Adult large
      - Adult XL
      - Adult XXL
      required: true
    - id: 27
      name: equipment_needed
      label: Equipment Package Needed
      hint: Do you need equipment
      type: select_one
      options:
      - Yes, full package
      - Yes, partial
      - No, have own equipment
      required: true
    - id: 28
      name: transportation_needs
      label: Transportation Assistance
      hint: Need help with rides
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 29
      name: volunteer_interest
      label: Parent Volunteer Interest
      hint: Will you help
      type: select_one
      options:
      - Yes, as coach
      - Yes, as team parent
      - Yes, occasional
      - 'False'
      required: true
    - id: 30
      name: photo_consent
      label: Photo and Video Consent
      hint: May team use photos
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 31
      name: waiver_agreement
      label: Liability Waiver Agreement
      hint: I understand and accept risks
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 32
      name: parent_signature
      label: Parent or Guardian Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 33
      name: signature_date
      label: Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
