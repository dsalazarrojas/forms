inputSchema:
  type: object
  properties:
    title: Sailing Club Racing Survey
    pages:
    - id: 1
      name: race_schedule
      label: What is your experience with the race schedule?
      hint: null
      type: select_multiple
      options:
      - On time
      - Late
      - Early
      required: true
    - id: 2
      name: event_quality
      label: How would you rate the quality of events?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: communication
      label: How would you rate our communication?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: participant_experience
      label: What could we do to improve your participant experience?
      hint: Please provide details and suggestions
      type: text
      options: []
      required: true
    - id: 5
      name: overall_experience
      label: What is your overall experience with the sailing club?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: schedule_changes
      label: Have you experienced any schedule changes during the past season?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: schedule_flexibility
      label: How important is schedule flexibility for you?
      hint: null
      type: select_one
      options:
      - Very important
      - Somewhat important
      - Not important
      required: false
    - id: 8
      name: participation
      label: How likely are you to participate in future sailing events?
      hint: null
      type: select_one
      options:
      - Very likely
      - Somewhat likely
      - Not likely
      required: false
    - id: 9
      name: event_frequency
      label: How often do you attend sailing events?
      hint: null
      type: select_one
      options:
      - Regularly
      - Occasionally
      - Rarely
      required: false
    - id: 10
      name: race_location
      label: How would you rate the race location?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 11
      name: event_safety
      label: How would you rate event safety?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 12
      name: event_facilities
      label: How would you rate event facilities?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 13
      name: social_experience
      label: How would you rate social experience?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 14
      name: participant_satisfaction
      label: How satisfied are you with your participation?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 15
      name: participation_frequency
      label: How often do you participate in sailing events?
      hint: null
      type: select_one
      options:
      - Regularly
      - Occasionally
      - Rarely
      required: false
    - id: 16
      name: communication_channels
      label: What communication channels do you prefer?
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Facebook
      - Twitter
      - Other
      required: false
    - id: 17
      name: comments
      label: Do you have any comments about the sailing events?
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: email
      label: Can we contact you by email?
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: phone
      label: Can we contact you by phone?
      hint: null
      type: email
      options: []
      required: false
    - id: 20
      name: social_links
      label: Can we add you to our social media groups?
      hint: Please provide your social media handles
      type: text
      options: []
      required: false
    - id: 21
      name: contact
      label: Is there a specific contact person or department for sailing events?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 22
      name: contact_details
      label: What contact details would you like to share with us?
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: follow_up
      label: Would you like to be contacted for future sailing events?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 24
      name: follow_up_details
      label: What follow-up information would you like to receive?
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: feedback
      label: Is there anything else you would like to feedback to us?
      hint: null
      type: note
      options: []
      required: false
