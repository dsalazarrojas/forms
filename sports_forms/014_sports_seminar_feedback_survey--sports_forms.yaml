inputSchema:
  type: object
  properties:
    title: Sports Seminar Feedback Survey
    pages:
    - id: 1
      name: seminar_date
      label: Seminar Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: session_name
      label: Session Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: session_location
      label: Session Location
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: seminar_topic
      label: Seminar Topic
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: seminar_outcomes
      label: Seminar Outcomes
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: seminar_facilities
      label: Seminar Facilities
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: seminar_organization
      label: Seminar Organisation
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: seminar_notes
      label: Seminar Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: other_comments
      label: Other Comments
      hint: null
      type: text
      options: []
      required: false
