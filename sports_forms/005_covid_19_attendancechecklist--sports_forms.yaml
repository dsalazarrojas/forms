inputSchema:
  type: object
  properties:
    title: COVID 19 AttendanceChecklist
    pages:
    - id: 1
      name: class_header
      label: -- Class Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: class_date
      label: Class Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: class_time
      label: Class Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: class_type
      label: Class Type
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Kids
      - Other
      required: true
    - id: 6
      name: attendance_header
      label: -- Student Attendance --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: student_id
      label: Student ID Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: membership_status
      label: Current Member
      hint: null
      type: select_one
      options:
      - Active
      - Trial
      - Suspended
      - Expired
      required: true
    - id: 10
      name: health_check
      label: Student health screening completed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: symptom_screening
      label: Any COVID-19 symptoms reported
      hint: null
      type: select_one
      options:
      - No Symptoms
      - Mild Symptoms
      - Unable to Attend
      required: true
    - id: 12
      name: vaccination_confirmed
      label: Vaccination status confirmed
      hint: null
      type: select_one
      options:
      - Vaccinated
      - Partially Vaccinated
      - Not Vaccinated
      - Unknown
      required: true
    - id: 13
      name: temperature_check
      label: Temperature screening passed
      hint: null
      type: select_one
      options:
      - Passed
      - Failed
      - Not Checked
      required: true
    - id: 14
      name: attendance_status
      label: Class Attendance
      hint: null
      type: select_one
      options:
      - Present
      - Excused Absence
      - Unexcused Absence
      - Cancelled
      required: true
    - id: 15
      name: notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
