      name: class_rating
      label: Class Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: class_value
      label: Class Value
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Average
      - Poor
      required: false
    - id: 7
      name: class_improvement
      label: Class Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: instructor_improvement
      label: Instructor Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
