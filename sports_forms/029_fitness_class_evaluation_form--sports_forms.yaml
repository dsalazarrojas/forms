      name: fitness_class_evaluation_form
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: instructor
      label: Instructor
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: class_name
      label: Class Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: instructor_rating
      label: Instructor Rating
      hint: null
      type: number
      options: []
      required: false
