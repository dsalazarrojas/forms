inputSchema:
  type: object
  properties:
    title: Soccer Coach Evaluation Form
    pages:
    - id: 1
      name: soccer_coach_evaluation_form
      label: Soccer Coach Evaluation
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: team_performance
      label: Team Performance
      hint: How well does the team perform during games?
      type: select_one
      options:
      - Team is very effective
      - Team is somewhat effective
      - Team is somewhat ineffective
      - Team is very ineffective
      required: false
    - id: 3
      name: communication_with_coaches
      label: Communication with Coaches
      hint: How well do you think the coaches communicate with the team?
      type: select_multiple
      options:
      - Clear and timely instructions
      - Encouraging
      - Fair and consistent feedback
      - None of the above
      required: false
    - id: 4
      name: communication_with_players
      label: Communication with Players
      hint: How well do you think the coaches communicate with the players?
      type: select_multiple
      options:
      - Clear and timely instructions
      - Encouraging
      - Fair and consistent feedback
      - None of the above
      required: false
    - id: 5
      name: coaching_style
      label: Coaching Style
      hint: How would you describe the coach's coaching style?
      type: select_one
      options:
      - Encouraging and motivating
      - Firm but fair
      - Too firm
      - Too lenient
      required: false
    - id: 6
      name: organization
      label: Organization and Logistics
      hint: How well does the team organize and logistically prepare for games?
      type: select_one
      options:
      - Very well
      - Somewhat well
      - Not very well
      - Not at all
      required: false
    - id: 7
      name: safety_and_prevention
      label: Safety and Prevention
      hint: How well does the team address safety concerns and prevent injuries?
      type: select_multiple
      options:
      - Strongly emphasizes safety
      - Somewhat emphasizes safety
      - Does not emphasize safety at all
      - None of the above
      required: false
    - id: 8
      name: game_planning
      label: Game Planning
      hint: How well does the team plan and prepare for games?
      type: select_multiple
      options:
      - Strongly emphasizes game planning
      - Somewhat emphasizes game planning
      - Does not emphasize game planning at all
      - None of the above
      required: false
