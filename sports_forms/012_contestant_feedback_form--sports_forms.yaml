inputSchema:
  type: object
  properties:
    title: Contestant Feedback Form
    pages:
      - id: 1
        name: contestant_name
        label: Contestant Name
        hint: Full name
        type: text
        options: []
        required: true
      - id: 2
        name: email_address
        label: Email Address
        hint: Contact email
        type: email
        options: []
        required: true
      - id: 3
        name: contest_name
        label: Contest Name
        hint: Which contest did you participate in?
        type: text
        options: []
        required: true
      - id: 4
        name: contest_date
        label: Contest Date
        hint: Date of event
        type: date
        options: []
        required: true
      - id: 5
        name: category
        label: Competition Category
        hint: Your category
        type: select_one
        options:
          - Individual Sports
          - Team Sports
          - Art Competition
          - Music Competition
          - Dance Competition
          - Academic Competition
          - Other
        required: true
      - id: 6
        name: overall_experience
        label: Overall Experience
        hint: Rate your overall experience
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 7
        name: registration_process
        label: Registration Process
        hint: Rate the registration experience
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 8
        name: communication_quality
        label: Communication Quality
        hint: Rate pre-event communication
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 9
        name: venue_facilities
        label: Venue Facilities
        hint: Rate the venue
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: false
      - id: 10
        name: staff_friendliness
        label: Staff Friendliness
        hint: Rate staff helpfulness
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 11
        name: judging_fairness
        label: Judging Fairness
        hint: Rate the fairness of judging
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 12
        name: event_organization
        label: Event Organization
        hint: Rate how well organized the event was
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
