inputSchema:
  type: object
  properties:
    title: Climbing Booking Form
    pages:
    - id: 1
      name: customer_section
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: For minors, parent/guardian info required
      type: date
      options: []
      required: true
    - id: 6
      name: booking_section
      label: -- Booking Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: booking_date
      label: Desired Booking Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: booking_time
      label: Preferred Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: duration
      label: Session Duration
      hint: null
      type: select_one
      options:
      - 1 hour
      - 2 hours
      - 3 hours
      - Half day (4 hours)
      - Full day (8 hours)
      required: true
    - id: 10
      name: party_size
      label: Number of Participants
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: climbing_type
      label: Type of Climbing
      hint: null
      type: select_one
      options:
      - Bouldering
      - Top-rope
      - Sport climbing
      - Lead climbing
      - Outdoor rock climbing
      required: true
    - id: 12
      name: experience_section
      label: -- Experience Level --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: experience_level
      label: Climbing experience level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Expert
      required: true
    - id: 14
      name: first_time
      label: First time climbing at our facility?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 15
      name: instruction_section
      label: -- Instruction --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: instruction_needed
      label: Do you need instruction or guidance?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 17
      name: guide_type
      label: Type of guidance needed
      hint: null
      type: select_one
      options:
      - Beginner lesson
      - Equipment training
      - Technique coaching
      - Lead climbing certification
      - None
      required: false
    - id: 18
      name: health_section
      label: -- Health and Safety --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: medical_conditions
      label: Any medical conditions we should know about?
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: physical_limitations
      label: Physical limitations or injuries
      hint: Optional
      type: text
      options: []
      required: false
    - id: 21
      name: waiver_acceptance
      label: I accept the facility waiver and liability terms
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 22
      name: special_requests
      label: Special requests or preferences
      hint: Optional
      type: text
      options: []
      required: false
