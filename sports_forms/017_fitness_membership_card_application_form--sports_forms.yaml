inputSchema:
  type: object
  properties:
    title: Fitness Membership Card Application Form
    pages:
    - id: 1
      name: membership_period
      label: Membership Period
      hint: Select your membership period
      type: select_multiple
      options:
      - Monthly
      - Quarterly
      - Yearly
      required: false
    - id: 2
      name: terms_and_conditions
      label: Terms and Conditions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: accept_terms
      label: Accept Terms
      hint: Please read and accept the terms
      type: note
      options: []
      required: false
    - id: 4
      name: membership_start_date
      label: Membership Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: membership_end_date
      label: Membership End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: membership_type
      label: Membership Type
      hint: null
      type: select_one
      options:
      - Individual
      - Couple
      - Family
      required: false
    - id: 7
      name: membership_status
      label: Membership Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 8
      name: membership_card_number
      label: Membership Card Number
      hint: Enter your membership card number
      type: number
      options: []
      required: true
    - id: 9
      name: membership_card_expiration_date
      label: Membership Card Expiration Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: accept_terms_and_conditions
      label: Accept Terms and Conditions
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
