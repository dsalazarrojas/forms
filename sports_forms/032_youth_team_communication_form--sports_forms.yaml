inputSchema:
  type: object
  properties:
    title: Youth Team Communication Form
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: preferred_communication_method
      label: Preferred communication method
      hint: null
      type: select_one
      options:
      - text
      - email
      - phone
      required: true
    - id: 6
      name: consent
      label: Receive team updates and urgent messages?
      hint: We will send you updates about practice schedules, game reminders, and
        other important team news.
      type: note
      options: []
      required: false
    - id: 7
      name: emergency_contact_name
      label: Emergency contact name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: emergency_contact_phone
      label: Emergency contact phone
      hint: null
      type: text
      options: []
      required: false
