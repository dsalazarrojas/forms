inputSchema:
  type: object
  properties:
    title: Athletic Performance Program Application Form
    pages:
    - id: 1
      name: applicant_name
      label: Applicant Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: MM-DD-YYYY format
      type: date
      options: []
      required: true
    - id: 3
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      - Prefer Not to Say
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 6
      name: address
      label: Street Address
      hint: Home address
      type: text
      options: []
      required: true
    - id: 7
      name: city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 8
      name: state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 9
      name: zip_code
      label: ZIP Code
      hint: ZIP or postal code
      type: text
      options: []
      required: true
    - id: 10
      name: school_name
      label: School Name
      hint: Current school
      type: text
      options: []
      required: true
    - id: 11
      name: grade_level
      label: Grade Level
      hint: Current grade
      type: select_one
      options:
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      - College
      - Post-Graduate
      required: true
    - id: 12
      name: sport
      label: Primary Sport
      hint: Main sport
      type: select_one
      options:
      - Football
      - Basketball
      - Soccer
      - Track and Field
      - Swimming
      - Volleyball
      - Baseball
      - Softball
      - Tennis
      - Other
      required: true
    - id: 13
      name: position
      label: Primary Position
      hint: Main position played
      type: text
      options: []
      required: true
    - id: 14
      name: years_experience
      label: Years of Experience
      hint: How long have you played
      type: number
      options: []
      required: true
    - id: 15
      name: current_team
      label: Current Team
      hint: School or club team
      type: text
      options: []
      required: true
    - id: 16
      name: coach_name
      label: Coach Name
      hint: Current coach
      type: text
      options: []
      required: true
    - id: 17
      name: coach_contact
      label: Coach Contact
      hint: Email or phone
      type: text
      options: []
      required: false
    - id: 18
      name: height
      label: Height
      hint: In feet and inches or cm
      type: text
      options: []
      required: true
    - id: 19
      name: weight
      label: Weight
      hint: In pounds or kg
      type: number
      options: []
      required: true
    - id: 20
      name: athletic_achievements
      label: Athletic Achievements
      hint: List awards, honors, records
      type: text
      options: []
      required: true
    - id: 21
      name: personal_records
      label: Personal Records or Stats
      hint: List key statistics
      type: text
      options: []
      required: false
    - id: 22
      name: program_selection
      label: Program Selection
      hint: Which program are you applying for
      type: select_one
      options:
      - Strength and Conditioning
      - Speed and Agility
      - Sport-Specific Training
      - Elite Performance
      - Rehabilitation and Recovery
      - Complete Performance Package
      required: true
    - id: 23
      name: training_goals
      label: Primary Training Goals
      hint: What do you want to achieve
      type: text
      options: []
      required: true
    - id: 24
      name: availability
      label: Training Availability
      hint: When can you train
      type: select_multiple
      options:
      - Early Morning (5-8 AM)
      - Morning (8-12 PM)
      - Afternoon (12-5 PM)
      - Evening (5-9 PM)
      - Weekends
      required: true
    - id: 25
      name: days_per_week
      label: Days Available Per Week
      hint: How many days can you train
      type: number
      options: []
      required: true
    - id: 26
      name: injury_history
      label: Injury History
      hint: List any significant injuries
      type: text
      options: []
      required: true
    - id: 27
      name: current_injuries
      label: Current Injuries or Limitations
      hint: Any current issues
      type: text
      options: []
      required: true
    - id: 28
      name: medical_clearance
      label: Medical Clearance Status
      hint: Are you cleared for full activity
      type: select_one
      options:
      - Yes - Fully Cleared
      - Yes - With Restrictions
      - No - Pending Clearance
      required: true
    - id: 29
      name: previous_training
      label: Previous Training Experience
      hint: Describe any previous programs
      type: text
      options: []
      required: false
    - id: 30
      name: why_this_program
      label: Why Do You Want to Join This Program
      hint: What motivates you
      type: text
      options: []
      required: true
    - id: 31
      name: referral_source
      label: How Did You Hear About Us
      hint: Source of referral
      type: select_one
      options:
      - Coach Recommendation
      - Friend or Teammate
      - Social Media
      - School
      - Website
      - Other
      required: true
    - id: 32
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 33
      name: parent_guardian_contact
      label: Parent or Guardian Contact
      hint: Phone or email
      type: text
      options: []
      required: false
    - id: 34
      name: application_date
      label: Application Date
      hint: Date of application
      type: date
      options: []
      required: true
    - id: 35
      name: additional_comments
      label: Additional Comments
      hint: Anything else we should know
      type: text
      options: []
      required: false
