inputSchema:
  type: object
  properties:
    title: Sports Event Hosting Application
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: school_club_name
      label: School Club Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: venue_name
      label: Venue Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: event_duration
      label: Event Duration
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: event_type
      label: Event Type
      hint: null
      type: select_multiple
      options:
      - Soccer
      - Tennis
      - Basketball
      - Other
      required: true
    - id: 8
      name: event_capacity
      label: Event Capacity
      hint: null
      type: select_one
      options:
      - Less than 50
      - 50-100
      - 100-200
      - More than 200
      required: true
    - id: 9
      name: event_status
      label: Event Status
      hint: null
      type: select_one
      options:
      - Available
      - Not Available
      required: true
    - id: 10
      name: event_address
      label: Event Address
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: event_phone
      label: Event Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: event_email
      label: Event Email
      hint: null
      type: email
      options: []
      required: true
