inputSchema:
  type: object
  properties:
    title: Virtual Running Event Registration Form
    pages:
    - id: 1
      name: form_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: form_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: form_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: form_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: form_dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: form_event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Virtual Event
      - In-person Event
      required: true
    - id: 7
      name: form_event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: form_event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: form_number_of_participants
      label: Number of Participants
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: form_additional_info
      label: Additional Information
      hint: null
      type: note
      options: []
      required: false
