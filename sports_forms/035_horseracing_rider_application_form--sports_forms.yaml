inputSchema:
  type: object
  properties:
    title: Horseracing Rider Application Form
    pages:
    - id: 1
      name: personal_details
      label: Personal Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: horse_racing_experience
      label: Horse Racing Experience
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1-2 years
      - 2-5 years
      - 5-10 years
      - More than 10 years
      required: false
    - id: 4
      name: jockey_info
      label: Jockey Info
      hint: null
      type: note
      options: []
      required: false
