inputSchema:
  type: object
  properties:
    title: National Team Player Eligibility Form
    pages:
    - id: 1
      name: player_name
      label: Enter player name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: team_id
      label: team
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: sport_id
      label: Sport
      hint: null
      type: text
      options: []
      required: false
