inputSchema:
  type: object
  properties:
    title: Youth Athlete Confidence Survey
    pages:
    - id: 1
      name: athlete_name
      label: What is your name?
      hint: This is the athlete's name
      type: text
      options: []
      required: true
    - id: 2
      name: age_group
      label: What is your age group?
      hint: Please select the age group of the athlete
      type: select_one
      options:
      - U11
      - U12
      - U13
      - U14
      - U15
      - U16
      - U17
      - U18
      required: true
    - id: 3
      name: events_competed
      label: Which events have you competed in?
      hint: Please select the events that the athlete has competed in
      type: select_multiple
      options:
      - Running
      - Swimming
      - Cycling
      - Basketball
      - Soccer
      - Tennis
      - Volleyball
      - Baseball
      - Softball
      - Golf
      - Other
      required: true
    - id: 4
      name: sports_competed
      label: Which sports have you competed in?
      hint: Please select the sports that the athlete has competed in
      type: select_multiple
      options:
      - Running
      - Swimming
      - Cycling
      - Basketball
      - Soccer
      - Tennis
      - Volleyball
      - Baseball
      - Softball
      - Golf
      - Other
      required: true
    - id: 5
      name: gender
      label: What is your gender?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: sports_competed_other
      label: Have you competed in any other sports?
      hint: Please enter other sports
      type: text
      options: []
      required: false
    - id: 7
      name: events_competed_other
      label: Have you competed in any other events?
      hint: Please enter other events
      type: text
      options: []
      required: false
    - id: 8
      name: overall_confidence
      label: What is your overall confidence level in competitions?
      hint: On a scale of 1-10
      type: number
      options: []
      required: true
    - id: 9
      name: event_confidence
      label: How confident are you in your performance in events?
      hint: On a scale of 1-10
      type: number
      options: []
      required: true
    - id: 10
      name: competition_confidence
      label: Competition Confidence
      hint: On a scale of 1-10
      type: number
      options: []
      required: true
    - id: 11
      name: overall_confidence_2
      label: How confident are you in your overall performance?
      hint: On a scale of 1-10
      type: number
      options: []
      required: true
    - id: 12
      name: training_confidence
      label: How confident are you in your training?
      hint: On a scale of 1-10
      type: number
      options: []
      required: true
    - id: 13
      name: performance_event
      label: Performance Event
      hint: On a scale of 1-10
      type: number
      options: []
      required: true
    - id: 14
      name: training_performance
      label: Training Performance
      hint: On a scale of 1-10
      type: number
      options: []
      required: true
    - id: 15
      name: competition_training_confidence
      label: How confident are you in your performance in competitions?
      hint: On a scale of 1-10
      type: number
      options: []
      required: true
    - id: 16
      name: performance_competition
      label: Performance Competition
      hint: On a scale of 1-10
      type: number
      options: []
      required: true
    - id: 17
      name: overall_training_confidence
      label: How confident are you in your overall training?
      hint: On a scale of 1-10
      type: number
      options: []
      required: true
    - id: 18
      name: performance_training
      label: How confident are you in your performance in training?
      hint: On a scale of 1-10
      type: number
      options: []
      required: true
