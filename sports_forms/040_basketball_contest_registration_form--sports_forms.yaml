inputSchema:
  type: object
  properties:
    title: Basketball Contest Registration Form
    pages:
    - id: 1
      name: section_header_1
      label: -- Team Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: team_name
      label: Team name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: team_code
      label: Team code or number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: home_city
      label: Home city
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: section_header_2
      label: -- Team Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: coach_name
      label: Coach name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: coach_email
      label: Coach email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: coach_phone
      label: Coach phone
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: section_header_3
      label: -- Division and Category --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: division
      label: Division
      hint: null
      type: select_one
      options:
      - Youth
      - High School
      - College
      - Amateur
      - Professional
      required: true
    - id: 11
      name: age_bracket
      label: Age bracket
      hint: null
      type: select_one
      options:
      - Under 12
      - 12-15
      - 16-18
      - 19-30
      - 30-40
      - 40+
      required: false
    - id: 12
      name: skill_level
      label: Team skill level
      hint: null
      type: select_one
      options:
      - Recreational
      - Competitive
      - Elite
      required: true
    - id: 13
      name: section_header_4
      label: -- Tournament Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: tournament_name
      label: Tournament name
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: tournament_date
      label: Tournament date
      hint: null
      type: date
      options: []
      required: true
    - id: 16
      name: tournament_location
      label: Tournament location
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: section_header_5
      label: -- Team Roster --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: number_of_players
      label: Number of players on roster
      hint: null
      type: number
      options: []
      required: true
    - id: 19
      name: section_header_6
      label: -- Entry Fee and Payment --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: entry_fee
      label: Entry fee amount
      hint: null
      type: number
      options: []
      required: false
    - id: 21
      name: payment_method
      label: Payment method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Check
      - Cash
      - Bank Transfer
      - PayPal
      required: true
    - id: 22
      name: section_header_7
      label: -- Agreement and Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: rules_agreement
      label: I agree to the tournament rules and regulations
      hint: null
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
    - id: 24
      name: liability_agreement
      label: I acknowledge and accept liability waiver
      hint: null
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
    - id: 25
      name: registration_confirmation
      label: I confirm all information is accurate
      hint: null
      type: select_one
      options:
      - I Confirm
      - I Need to Review
      required: true
