inputSchema:
  type: object
  properties:
    title: sports_event_concessions_feedback_survey
    pages:
    - id: 1
      name: concession_quality
      label: What was the quality of food and beverage options?
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 2
      name: concession_service
      label: How was the service from the vendors?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: future_purchase_intent
      label: What is your future purchase intent for concessions at this event?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Undecided
      required: false
    - id: 4
      name: event_attendance
      label: Which events have you attended?
      hint: null
      type: select_multiple
      options:
      - Sports events
      - Music events
      - Theater events
      - Other events
      required: false
    - id: 5
      name: feedback
      label: Additional comments or feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone_number
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
