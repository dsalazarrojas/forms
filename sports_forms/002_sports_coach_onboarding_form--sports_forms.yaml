inputSchema:
  type: object
  properties:
    title: Sports Coach Onboarding Form
    pages:
    - id: 1
      name: coach_full_name
      label: Coach Full Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: coach_email
      label: Coach Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: coach_license
      label: Coach License
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: coach_experience_years
      label: Coach Experience Years
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: coach_education_level
      label: Coach Education Level
      hint: null
      type: select_one
      options:
      - High School
      - Bachelor's Degree
      - Master's Degree
      - Doctoral Degree
      - Other
      required: false
    - id: 6
      name: coach_availability
      label: Coach Availability
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: coach_availability_notes
      label: Coach Availability Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: coach_work_hours
      label: Coach Work Hours
      hint: null
      type: text
      options: []
      required: false
