inputSchema:
  type: object
  properties:
    title: Cheer Tryout Registration Form
    pages:
    - id: 1
      name: participant_first_name
      label: First Name
      hint: Participant's first name
      type: text
      options: []
      required: true
    - id: 2
      name: participant_last_name
      label: Last Name
      hint: Participant's last name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: Birth date
      type: date
      options: []
      required: true
    - id: 4
      name: age
      label: Age
      hint: Current age
      type: number
      options: []
      required: true
    - id: 5
      name: gender
      label: Gender
      hint: Gender identification
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      required: true
    - id: 6
      name: school_name
      label: School Name
      hint: Name of school
      type: text
      options: []
      required: true
    - id: 7
      name: grade_level
      label: Grade Level
      hint: Current grade
      type: select_one
      options:
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      - College
      - Other
      required: true
    - id: 8
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 9
      name: phone_number
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 10
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Full name of parent or guardian
      type: text
      options: []
      required: true
    - id: 11
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: Parent email address
      type: email
      options: []
      required: true
    - id: 12
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Parent contact number
      type: text
      options: []
      required: true
    - id: 13
      name: tryout_date
      label: Tryout Date
      hint: Which tryout date will you attend
      type: select_one
      options:
      - May 15, 2026
      - May 16, 2026
      - May 22, 2026
      - May 23, 2026
      - Make-up date
      required: true
    - id: 14
      name: years_experience
      label: Years of Cheer Experience
      hint: How many years have you cheered
      type: select_one
      options:
      - 0 years
      - 1 year
      - 2-3 years
      - 4-5 years
      - 6+ years
      required: true
    - id: 15
      name: previous_team_name
      label: Previous Team Name
      hint: Name of your previous team
      type: text
      options: []
      required: false
    - id: 16
      name: tumbling_skills
      label: Tumbling Skills
      hint: Select your tumbling level
      type: select_multiple
      options:
      - Cartwheel
      - Roundoff
      - Back handspring
      - Back tuck
      - Front tuck
      - Layout
      - Full twist
      required: true
    - id: 17
      name: stunting_experience
      label: Stunting Experience
      hint: Select applicable stunting skills
      type: select_multiple
      options:
      - Basic stunts
      - Extended stunts
      - Liberty
      - Heel stretch
      - Basket tosses
      - Pyramid experience
      - No stunting experience
      required: true
    - id: 18
      name: jump_skills
      label: Jump Skills
      hint: Select your jump abilities
      type: select_multiple
      options:
      - Toe touch
      - Pike
      - Hurkie
      - Double nine
      - Full down
      - Advanced jumps
      required: true
    - id: 19
      name: t_shirt_size
      label: T-Shirt Size
      hint: For tryout shirt
      type: select_one
      options:
      - Youth Small
      - Youth Medium
      - Youth Large
      - Adult Small
      - Adult Medium
      - Adult Large
      - Adult XL
      - Adult 2XL
      required: true
    - id: 20
      name: medical_conditions
      label: Medical Conditions or Allergies
      hint: List any medical conditions
      type: text
      options: []
      required: false
    - id: 21
      name: current_medications
      label: Current Medications
      hint: List any medications
      type: text
      options: []
      required: false
    - id: 22
      name: insurance_provider
      label: Insurance Provider
      hint: Name of insurance company
      type: text
      options: []
      required: false
    - id: 23
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of emergency contact
      type: text
      options: []
      required: true
    - id: 24
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Emergency contact number
      type: text
      options: []
      required: true
    - id: 25
      name: medical_release
      label: Medical Release
      hint: I authorize emergency medical treatment
      type: select_one
      options:
      - Yes, I authorize
      - false
      required: true
    - id: 26
      name: liability_waiver
      label: Liability Waiver
      hint: I accept the liability waiver
      type: select_one
      options:
      - Yes, I accept
      - false
      required: true
    - id: 27
      name: code_of_conduct
      label: Code of Conduct
      hint: I agree to follow team conduct rules
      type: select_one
      options:
      - Yes, I agree
      - false
      required: true
    - id: 28
      name: registration_fee
      label: Registration Fee Payment
      hint: Have you paid the tryout fee
      type: select_one
      options:
      - Yes, paid
      - No, will pay at tryout
      - Requesting waiver
      required: true
    - id: 29
      name: how_did_you_hear
      label: How did you hear about tryouts
      hint: How did you learn about tryouts
      type: select_one
      options:
      - School announcement
      - Social media
      - Friend or teammate
      - Coach referral
      - Website
      - Other
      required: false
    - id: 30
      name: additional_comments
      label: Additional Comments
      hint: Anything else you want to share
      type: text
      options: []
      required: false
