inputSchema:
  type: object
  properties:
    title: Fitness And Health Survey
    pages:
    - id: 1
      name: user_information
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: general_health
      label: General Health
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Bad
      required: false
    - id: 3
      name: physical_education_participation
      label: Physical Education Participation
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Rarely
      - Never
      required: false
    - id: 4
      name: health_habits
      label: Health Habits
      hint: What are your daily habits?
      type: text
      options: []
      required: false
    - id: 5
      name: fitness_activities
      label: Fitness Activities
      hint: null
      type: select_multiple
      options:
      - Running
      - Biking
      - Dancing
      - Hiking
      required: false
    - id: 6
      name: health_status
      label: Health Status
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Bad
      required: false
    - id: 7
      name: physical_education_classes
      label: Physical Education Classes
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Rarely
      - Never
      required: false
    - id: 8
      name: physical_education_frequency
      label: Physical Education Frequency
      hint: null
      type: select_one
      options:
      - Less than once a week
      - 1-2 times a week
      - 3-4 times a week
      - Almost every day
      required: false
    - id: 9
      name: physical_education_duration
      label: Physical Education Duration
      hint: null
      type: select_one
      options:
      - Less than 30 minutes
      - 30-60 minutes
      - 1-2 hours
      - 2-4 hours
      required: false
    - id: 10
      name: physical_education_frequency_of_classes
      label: Physical Education Frequency Of Classes
      hint: null
      type: select_one
      options:
      - Never
      - 1-2 per month
      - 2-4 per month
      - 5 or more per month
      required: false
