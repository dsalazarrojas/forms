      - Level 2
      - Level 3
      required: false
    - id: 6
      name: sports
      label: Sports
      hint: null
      type: select_one
      options:
      - Football
      - Basketball
      - Soccer
      required: false
    - id: 7
      name: certification_date
      label: Certification Date
      hint: null
      type: date
      options: []
