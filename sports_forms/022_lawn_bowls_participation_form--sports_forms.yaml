inputSchema:
  type: object
  properties:
    title: Lawn Bowls Participation Form
    pages:
    - id: 1
      name: form_header
      label: Form Header
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: session_preferences
      label: Session Preferences
      hint: Select one or more sessions
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: participant_details
      label: Participant Details
      hint: Enter some details about yourself
      type: note
      options: []
      required: false
    - id: 8
      name: participant_skills
      label: Participant Skills
      hint: Select your skills (if any)
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: participant_experience
      label: Participant Experience
      hint: Select relevant experience (if any)
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: participant_formation
      label: Participant Formation
      hint: Select formation (if any)
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: session_preferences_formation
      label: Session Preferences
      hint: Select one or more session preferences
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: Enter any notes about the session
      type: note
      options: []
      required: false
