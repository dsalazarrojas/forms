inputSchema:
  type: object
  properties:
    title: Baseball Simulator Waiver Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY format
      type: date
      options: []
      required: true
    - id: 3
      name: gender
      label: Gender
      hint: Select option
      type: select_one
      options:
      - Male
      - Female
      - Other
      - Prefer not to say
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: For communications
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 6
      name: home_address
      label: Home Address
      hint: Complete street address
      type: text
      options: []
      required: true
    - id: 7
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: true
    - id: 8
      name: state
      label: State
      hint: Your state
      type: text
      options: []
      required: true
    - id: 9
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 10
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 11
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number
      type: text
      options: []
      required: true
    - id: 12
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: How are they related
      type: text
      options: []
      required: true
    - id: 13
      name: visit_date
      label: Visit Date
      hint: Date of simulator session
      type: date
      options: []
      required: true
    - id: 14
      name: visit_time
      label: Visit Time
      hint: Scheduled time
      type: time
      options: []
      required: true
    - id: 15
      name: simulator_type
      label: Simulator Type
      hint: Which simulator
      type: select_one
      options:
      - Batting simulator
      - Pitching simulator
      - Catching simulator
      - Full experience package
      required: true
    - id: 16
      name: experience_level
      label: Baseball Experience Level
      hint: How experienced are you
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Professional
      required: true
    - id: 17
      name: medical_conditions
      label: Medical Conditions or Injuries
      hint: Any conditions we should know
      type: text
      options: []
      required: false
    - id: 18
      name: physical_limitations
      label: Physical Limitations
      hint: Any restrictions on activity
      type: text
      options: []
      required: false
    - id: 19
      name: insurance_provider
      label: Medical Insurance Provider
      hint: Insurance company
      type: text
      options: []
      required: false
    - id: 20
      name: assumption_of_risk
      label: Assumption of Risk
      hint: I understand simulator use involves physical activity
      type: select_one
      options:
      - I understand and accept the risks
      - I do not accept
      required: true
    - id: 21
      name: liability_release
      label: Liability Release
      hint: I release the facility from liability for ordinary negligence
      type: select_one
      options:
      - I agree to release liability
      - I do not agree
      required: true
    - id: 22
      name: equipment_use
      label: Equipment Use Agreement
      hint: I will use equipment as instructed
      type: select_one
      options:
      - I agree to follow all instructions
      - I do not agree
      required: true
    - id: 23
      name: facility_rules
      label: Facility Rules Agreement
      hint: I will follow all facility rules
      type: select_one
      options:
      - I agree to follow all rules
      - I do not agree
      required: true
    - id: 24
      name: photo_video_consent
      label: Photo and Video Consent
      hint: May facility use photos or videos
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 25
      name: minor_participant
      label: Is Participant Under 18
      hint: Parental consent required for minors
      type: select_one
      options:
      - Yes, participant is a minor
      - No, participant is 18 or older
      required: true
    - id: 26
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Required if under 18
      type: text
      options: []
      required: false
    - id: 27
      name: parent_guardian_signature
      label: Parent or Guardian Signature
      hint: Type full name as signature
      type: text
      options: []
      required: false
    - id: 28
      name: participant_signature
      label: Participant Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 29
      name: signature_date
      label: Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
    - id: 30
      name: staff_witness
      label: Staff Witness Initials
      hint: For facility use
      type: text
      options: []
      required: false
