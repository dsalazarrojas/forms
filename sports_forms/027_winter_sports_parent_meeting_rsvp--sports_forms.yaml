inputSchema:
  type: object
  properties:
    title: Winter Sports Parent Meeting RSVP
    pages:
    - id: 1
      name: parent_attendance
      label: Parent Attendance
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: headcount
      label: Headcount
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: question_1
      label: What is your name?
      hint: null
      type: select_one
      options:
      - John Doe
      - Jane Doe
      - Other (please specify)
      required: false
    - id: 4
      name: question_2
      label: Are you bringing any guests?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: question_3
      label: What time do you arrive?
      hint: null
      type: time
      options: []
      required: false
