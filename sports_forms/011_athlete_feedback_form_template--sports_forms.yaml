inputSchema:
  type: object
  properties:
    title: Athlete Feedback Form Template
    pages:
      - id: 1
        name: athlete_name
        label: Athlete Full Name
        hint: First and last name
        type: text
        options: []
        required: true
      - id: 2
        name: athlete_id
        label: Athlete ID Number
        hint: Student or team identification number
        type: text
        options: []
        required: false
      - id: 3
        name: parent_guardian_name
        label: Parent or Guardian Name
        hint: If applicable
        type: text
        options: []
        required: false
      - id: 4
        name: sport
        label: Sport
        hint: Primary sport
        type: select_one
        options:
          - Football
          - Basketball
          - Soccer
          - Track and Field
          - Swimming
          - Volleyball
          - Baseball
          - Softball
          - Tennis
          - Gymnastics
          - Other
        required: true
      - id: 5
        name: team_level
        label: Team Level
        hint: Competition level
        type: select_one
        options:
          - Varsity
          - Junior Varsity
          - Freshman
          - Club Team
          - Recreational
        required: true
      - id: 6
        name: coach_name
        label: Coach Name
        hint: Primary coach
        type: text
        options: []
        required: true
      - id: 7
        name: feedback_period
        label: Feedback Period
        hint: What period does this feedback cover
        type: select_one
        options:
          - Fall Season
          - Winter Season
          - Spring Season
          - Full Year
          - Specific Event
        required: true
      - id: 8
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: How satisfied are you with the program
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 9
        name: coaching_quality
        label: Coaching Quality
        hint: Rate the quality of coaching
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 10
        name: facility_quality
        label: Facility Quality
        hint: Rate the training facilities
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 11
        name: equipment_quality
        label: Equipment Quality
        hint: Rate the quality of equipment provided
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 12
        name: communication_rating
        label: Communication Rating
        hint: Rate communication from coaching staff
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 13
        name: training_effectiveness
        label: Training Effectiveness
        hint: How effective are the training sessions
        type: select_one
        options:
          - Very Effective
          - Effective
          - Neutral
          - Ineffective
          - Very Ineffective
        required: true
      - id: 14
        name: safety_measures
        label: Safety Measures
        hint: Rate the safety measures in place
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 15
        name: program_highlights
        label: Program Highlights
        hint: What did you enjoy most about the program
        type: text
        options: []
        required: true
      - id: 16
        name: areas_for_improvement
        label: Areas for Improvement
        hint: What could be improved
        type: text
        options: []
        required: true
      - id: 17
        name: additional_services
        label: Additional Services Desired
        hint: What additional services would you like to see
        type: select_multiple
        options:
          - Strength and Conditioning
          - Nutrition Counseling
          - Mental Skills Training
          - Video Analysis
          - Injury Prevention Programs
          - More Practice Time
          - Tournament Participation
          - None
        required: false
      - id: 18
        name: recommend_program
        label: Would You Recommend This Program
        hint: To other athletes
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Not Sure
          - Probably No
          - Definitely No
        required: true
      - id: 19
        name: return_next_season
        label: Will You Return Next Season
        hint: Do you plan to continue
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Not Sure
          - Probably No
          - Definitely No
        required: true
      - id: 20
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback you would like to share
        type: text
        options: []
        required: false
      - id: 21
        name: follow_up_requested
        label: Follow-Up Requested
        hint: Would you like someone to contact you about your feedback
        type: select_one
        options:
          - "Yes"
          - "No"
        required: true
