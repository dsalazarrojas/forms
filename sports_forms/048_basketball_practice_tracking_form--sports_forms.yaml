inputSchema:
  type: object
  properties:
    title: Basketball Practice Tracking Form
    pages:
    - id: 1
      name: section_header_1
      label: -- Practice Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: practice_date
      label: Practice date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: practice_time
      label: Practice time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: practice_location
      label: Practice location
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: section_header_2
      label: -- Team Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: team_name
      label: Team name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: coach_name
      label: Coach name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: section_header_3
      label: -- Attendance --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: player_name
      label: Player name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: player_number
      label: Player number
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: attendance_status
      label: Attendance status
      hint: null
      type: select_one
      options:
      - Present
      - Absent
      - Late
      - Excused Absence
      - Injured
      required: true
    - id: 12
      name: section_header_4
      label: -- Performance Notes --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: effort_level
      label: Effort level during practice
      hint: Scale 1-5
      type: number
      options: []
      required: false
    - id: 14
      name: focus
      label: Focus and concentration
      hint: Scale 1-5
      type: number
      options: []
      required: false
    - id: 15
      name: performance_notes
      label: Performance notes
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: section_header_5
      label: -- Practice Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: practice_focus
      label: Practice focus or drills
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: section_header_6
      label: -- Health and Safety --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: injury_status
      label: Any injuries or concerns?
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: tracking_confirmation
      label: I confirm this attendance record is accurate
      hint: null
      type: select_one
      options:
      - I Confirm
      - I Need to Review
      required: true
