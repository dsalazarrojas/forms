inputSchema:
  type: object
  properties:
    title: Sports Equipment Usability Feedback Survey
    pages:
    - id: 1
      name: sports_equipment_usability_feedback_survey_1
      label: What type of sports do you enjoy?
      hint: Please select one or more sports that you are interested in playing with
        this equipment.
      type: select_multiple
      options:
      - Basketball
      - Soccer
      - Tennis
      - Other
      - Specify other
      required: true
    - id: 2
      name: overall_usability
      label: Overall usability of equipment
      hint: Rate the overall usability of this equipment from 1 to 5.
      type: number
      options: []
      required: true
    - id: 3
      name: rating_overall_usability
      label: What do you like about this equipment?
      hint: Please specify the reasons why you liked this equipment.
      type: text
      options: []
      required: true
    - id: 4
