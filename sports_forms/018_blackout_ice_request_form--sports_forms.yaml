inputSchema:
  type: object
  properties:
    title: Blackout Ice Request Form
    pages:
    - id: 1
      name: request_intro
      label: Blackout Ice Request Form
      hint: Request blackout ice time for your team or event
      type: note
      options: []
      required: false
    - id: 2
      name: requestor_name
      label: Requestor Name
      hint: Full name of person making request
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization or Team
      hint: Name of your team or organization
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: event_type
      label: Event Type
      hint: What type of event is this
      type: select_one
      options:
      - Hockey Game
      - Figure Skating
      - Practice Session
      - Tournament
      - Special Event
      - Other
      required: true
    - id: 7
      name: requested_date
      label: Requested Date
      hint: Primary date choice
      type: date
      options: []
      required: true
    - id: 8
      name: requested_start_time
      label: Requested Start Time
      hint: When should ice time begin
      type: time
      options: []
      required: true
    - id: 9
      name: requested_end_time
      label: Requested End Time
      hint: When should ice time end
      type: time
      options: []
      required: true
    - id: 10
      name: alternate_date_1
      label: Alternate Date 1
      hint: First backup date
      type: date
      options: []
      required: false
    - id: 11
      name: alternate_date_2
      label: Alternate Date 2
      hint: Second backup date
      type: date
      options: []
      required: false
    - id: 12
      name: number_of_participants
      label: Number of Participants
      hint: Expected number of skaters
      type: number
      options: []
      required: true
    - id: 13
      name: team_name
      label: Team Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 14
      name: age_group
      label: Age Group
      hint: Participant age category
      type: select_one
      options:
      - Youth under 12
      - Teen 13-17
      - Adult 18 plus
      - Mixed Ages
      required: true
    - id: 15
      name: skill_level
      label: Skill Level
      hint: Average skill level of participants
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Professional
      required: true
    - id: 16
      name: equipment_needed
      label: Equipment Needed
      hint: What equipment do you need provided
      type: select_multiple
      options:
      - Scoreboard
      - Sound System
      - Timing System
      - Penalty Box
      - Zamboni Show
      - None
      required: false
    - id: 17
      name: concession_needed
      label: Concession Services
      hint: Do you want concession services
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 18
      name: security_needed
      label: Security Services
      hint: Do you need security staff
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 19
      name: special_requests
      label: Special Requests
      hint: Any additional requirements
      type: text
      options: []
      required: false
    - id: 20
      name: previous_bookings
      label: Have You Booked Before
      hint: Previous blackout ice requests
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 21
      name: how_did_you_hear
      label: How Did You Hear About Us
      hint: Source of information
      type: select_one
      options:
      - Website
      - Referral
      - Social Media
      - Previous Event
      - Other
      required: false
    - id: 22
      name: additional_notes
      label: Additional Notes
      hint: Any other information
      type: text
      options: []
      required: false
