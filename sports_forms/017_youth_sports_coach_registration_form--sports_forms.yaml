inputSchema:
  type: object
  properties:
    title: Youth Sports Coach Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: sport
      label: Sport
      hint: null
      type: select_one
      options:
      - Football
      - Basketball
      - Baseball
      - Soccer
      - Hockey
      - Tennis
      required: true
    - id: 6
      name: coaching_level
      label: Coaching Level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: true
    - id: 7
      name: experience_years
      label: Coaching Experience
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_contact_phone
      label: Emergency Contact Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: emergency_contact_address
      label: Emergency Contact Address
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: emergency_contact_relationship_level
      label: Emergency Contact Relationship Level
      hint: null
      type: select_multiple
      options:
      - Parent
      - Parent's Spouse
      - Grandparent
      - Other
      required: false
    - id: 13
      name: coach_license_status
      label: Coach License Status
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Pending
      required: true
    - id: 14
      name: coach_license_number
      label: Coach License Number
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: coach_experience
      label: Coaching Experience
      hint: null
      type: date
      options: []
      required: false
    - id: 17
      name: coach_education
      label: Coach Education
      hint: null
      type: text
      options: []
      required: false
