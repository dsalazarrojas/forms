inputSchema:
  type: object
  properties:
    title: sports_club_membership_survey
    pages:
    - id: 1
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: true
    - id: 2
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: membership_duration
      label: Membership Duration
      hint: null
      type: select_multiple
      options:
      - Less than 1 year
      - 1-3 years
      - More than 3 years
      required: true
    - id: 9
      name: frequency_of_visits
      label: Frequency of Visits
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: true
    - id: 10
      name: preferred_activity
      label: Preferred Activity
      hint: null
      type: select_one
      options:
      - Soccer
      - Basketball
      - Volleyball
      - Other
      required: true
    - id: 11
      name: preferred_time_of_day
      label: Preferred Time of Day
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - No preference
      required: true
    - id: 12
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: true
