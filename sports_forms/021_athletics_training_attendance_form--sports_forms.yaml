inputSchema:
  type: object
  properties:
    title: Athletics Training Attendance Form
    pages:
      - id: 1
        name: session_information
        label: -- Training Session Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: training_date
        label: Training Date
        hint: Date of the training session
        type: date
        options: []
        required: true
      - id: 3
        name: training_time_start
        label: Session Start Time
        hint: When did training start?
        type: time
        options: []
        required: true
      - id: 4
        name: training_time_end
        label: Session End Time
        hint: When did training end?
        type: time
        options: []
        required: true
      - id: 5
        name: training_type
        label: Training Type
        hint: What type of training session?
        type: select_one
        options: ['Strength Training', 'Conditioning', 'Skill Development', 'Team Practice', 'Individual Training', 'Recovery', 'Other']
        required: true
      - id: 6
        name: location
        label: Location
        hint: Where was training held?
        type: text
        options: []
        required: true
      - id: 7
        name: coach_name
        label: Coach/Instructor Name
        hint: Person conducting the session
        type: text
        options: []
        required: true
      - id: 8
        name: participant_information
        label: -- Participant Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 9
        name: athlete_name
        label: Athlete Name
        hint: Name of attendee
        type: text
        options: []
        required: true
      - id: 10
        name: attendance_status
        label: Attendance Status
        hint: Was the athlete present?
        type: select_one
        options: ['Present', 'Absent', 'Late', 'Excused Absence']
        required: true
      - id: 11
        name: arrival_time
        label: Arrival Time
        hint: When did athlete arrive?
        type: time
        options: []
        required: false
      - id: 12
        name: participation_level
        label: Participation Level
        hint: Level of active participation
        type: select_one
        options: ['Full Participation', 'Partial Participation', 'Limited Participation', 'Observer Only']
        required: true
      - id: 13
        name: performance_notes
        label: -- Performance Notes --
        hint: null
        type: note
        options: []
        required: false
      - id: 14
        name: effort_rating
        label: Effort Rating
        hint: Rate the athlete's effort
        type: select_one
        options: ['Excellent', 'Good', 'Fair', 'Poor']
        required: true
      - id: 15
        name: focus_concentration
        label: Focus and Concentration
        hint: Rate focus during session
        type: select_one
        options: ['Excellent', 'Good', 'Fair', 'Poor']
        required: true
      - id: 16
        name: technique_quality
        label: Technique Quality
        hint: Quality of execution
        type: select_one
        options: ['Excellent', 'Good', 'Fair', 'Needs Improvement']
        required: true
      - id: 17
        name: physical_condition
        label: Physical Condition
        hint: How did athlete appear physically?
        type: select_one
        options: ['Excellent', 'Good', 'Fair', 'Fatigued', 'Injured']
        required: true
      - id: 18
        name: attitude_behavior
        label: Attitude and Behavior
        hint: Assessment of attitude during session
        type: select_one
        options: ['Positive', 'Cooperative', 'Neutral', 'Negative', 'Disruptive']
        required: true
      - id: 19
        name: injury_incident
        label: -- Injury/Incident Report --
        hint: null
        type: note
        options: []
        required: false
      - id: 20
        name: any_injury_incidents
        label: Any Injuries or Incidents?
        hint: null
        type: select_one
        options: ['Yes', 'No']
        required: true
      - id: 21
        name: injury_description
        label: Injury/Incident Description
        hint: If yes, describe what happened
        type: text
        options: []
        required: false
      - id: 22
        name: medical_attention_needed
        label: Medical Attention Needed?
        hint: null
        type: select_one
        options: ['Yes', 'No']
        required: false
      - id: 23
        name: comments_notes
        label: -- Additional Comments --
        hint: null
        type: note
        options: []
        required: false
      - id: 24
        name: coach_comments
        label: Coach Comments
        hint: Any additional observations or notes
        type: text
        options: []
        required: false
      - id: 25
        name: follow_up_actions
        label: Follow-up Actions Needed
        hint: Any follow-up required for this athlete?
        type: text
        options: []
        required: false
