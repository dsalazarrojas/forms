inputSchema:
  type: object
  properties:
    title: Spring Tennis Challenge Registration Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: challenge_name
      label: Challenge Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: challenge_date
      label: Challenge Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: challenge_start_time
      label: Challenge Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: challenge_end_time
      label: Challenge End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: participant_formation_type
      label: Participant Formation
      hint: null
      type: select_one
      options:
      - Single Player
      - Team Player
      required: true
    - id: 8
      name: participant_formation_size
      label: Team Size
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      required: true
    - id: 9
      name: participant_formation
      label: Team Members
      hint: null
      type: select_multiple
      options:
      - John Doe
      - Jane Doe
      - Jim
      required: true
    - id: 10
      name: participant_experience
      label: Participant Tennis Experience
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      required: true
    - id: 11
      name: participant_gender
      label: Participant Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: true
    - id: 12
      name: participant_age
      label: Participant Age
      hint: null
      type: number
      options: []
      required: true
