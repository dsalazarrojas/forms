inputSchema:
  type: object
  properties:
    title: Adult Sports Roster Form
    pages:
    - id: 1
      name: section_team
      label: -- Team Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: team_name
      label: Team Name
      hint: null
      type: text
      options: []
      required: true
