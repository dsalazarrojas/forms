inputSchema:
  type: object
  properties:
    title: Lincoln East Band Forms
    pages:
    - id: 1
      name: application_form
      label: Application And Consent Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: t_shirt_size
      label: T-shirt size
      hint: null
      type: select_one
      options:
      - Large
      - X-Large
      - Small
      - X-Small
      required: false
    - id: 3
      name: other_materials
      label: Other materials
      hint: null
      type: select_multiple
      options:
      - Materials
      - Equipment
      required: false
    - id: 4
      name: payments
      label: Payments
      hint: null
      type: select_one
      options:
      - Cash
      - Check
      - Online
      required: false
    - id: 5
      name: student_name
      label: Student Name
      hint: Enter student name
      type: text
      options: []
      required: false
    - id: 6
      name: student_email
      label: Student Email
      hint: Enter student email
      type: email
      options: []
      required: false
    - id: 7
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: parent_email
      label: Parent Email
      hint: Enter parent email
      type: email
      options: []
      required: false
    - id: 9
      name: student_grade
      label: Student Grade
      hint: null
      type: select_one
      options:
      - 9th
      - 10th
      - 11th
      - 12th
      required: false
    - id: 10
      name: parent_phone
      label: Parent Phone
      hint: Enter parent phone
      type: text
      options: []
      required: false
