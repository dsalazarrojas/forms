inputSchema:
  type: object
  properties:
    title: Soccer Coach Evaluation Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: overall_performance
      label: Overall Performance
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: coaching_technique
      label: Coaching Technique
      hint: Provide your feedback about your coach's technique and methods of instruction.
      type: text
      options: []
      required: false
    - id: 4
      name: communication_style
      label: Communication Style
      hint: Rate your coach's communication style during team meetings and training
        sessions.
      type: select_one
      options:
      - Positive
      - Fair
      - Negative
      required: false
    - id: 5
      name: positive_environment
      label: Positive Environment
      hint: Rate the positive environment at your team's practices and games.
      type: select_multiple
      options:
      - Encouraging
      - Supportive
      - Motivating
      - Negative
      required: false
    - id: 6
      name: feedback_to_players
      label: Feedback to Players
      hint: Rate the quality and helpfulness of the feedback provided to players.
      type: select_one
      options:
      - Consistently
      - Occasionally
      - Rarely
      - Never
      required: false
    - id: 7
      name: player_development
      label: Player Development
      hint: Rate your coach's ability to help players grow and improve their skills.
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 8
      name: coach_likability
      label: Coach LikaBility
      hint: Rate your coach's likability and relatability.
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 9
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: overall_rating
      label: Overall Rating
      hint: Rate your overall experience with your coach.
      type: number
      options: []
      required: false
    - id: 11
      name: coaching_style_scale
      label: Coaching Style Scale
      hint: Rate your coach's coaching style based on the provided options.
      type: select_one
      options:
      - Highly Effective
      - Somewhat Effective
      - Not Very Effective
      required: false
    - id: 12
      name: player_development_scale
      label: Player Development Scale
      hint: Rate your coach's ability to help players grow and improve their skills.
      type: select_one
      options:
      - Highly Effective
      - Somewhat Effective
      - Not Very Effective
      required: false
    - id: 13
      name: communication_scale
      label: Communication Scale
      hint: Rate your coach's ability to communicate effectively.
      type: select_one
      options:
      - Highly Effective
      - Somewhat Effective
      - Not Very Effective
      required: false
    - id: 14
      name: likability_scale
      label: Likability Scale
      hint: Rate your coach's likability and relatability.
      type: select_one
      options:
      - Highly Likable
      - Somewhat Likable
      - Not Very Likable
      required: false
    - id: 15
      name: team_environment_scale
      label: Team Environment Scale
      hint: Rate the positive and negative aspects of the team environment.
      type: select_multiple
      options:
      - Positive
      - Negative
      required: false
    - id: 16
      name: feedback_scale
      label: Feedback Scale
      hint: Rate the quality and helpfulness of feedback provided to players.
      type: select_multiple
      options:
      - Consistently
      - Occasionally
      - Rarely
      - Never
      required: false
    - id: 17
      name: overall_likability
      label: Overall Likability
      hint: Rate the likability and relatability of your coach.
      type: select_multiple
      options:
      - Highly Likable
      - Somewhat Likable
      - Not Very Likable
      required: false
    - id: 18
      name: overall_environment
      label: Overall Environment
      hint: Rate the overall positive and negative aspects of your team's environment.
      type: select_multiple
      options:
      - Encouraging
      - Supportive
      - Motivating
      - Negative
      required: false
    - id: 19
      name: player_performance
      label: Player Performance
      hint: Rate the performance of players under their coach's guidance.
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 20
      name: communication
      label: Communication
      hint: Rate your coach's communication during team meetings and practices.
      type: text
      options: []
      required: false
    - id: 21
      name: additional_comments_2
      label: Additional Comments 2
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: overall_performance_2
      label: Overall Performance 2
      hint: null
      type: number
      options: []
      required: false
    - id: 23
      name: coaching_approach
      label: Coaching Approach
      hint: Rate the coach's approach to coaching and leading players.
      type: text
      options: []
      required: false
    - id: 24
      name: communication_style_2
      label: Communication Style 2
      hint: Rate your coach's communication style.
      type: text
      options: []
      required: false
    - id: 25
      name: overall_rating_2
      label: Overall Rating 2
      hint: Rate your overall experience with your coach.
      type: number
      options: []
      required: false
