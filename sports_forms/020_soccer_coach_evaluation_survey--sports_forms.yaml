      hint: Rate your coach's ability to communicate effectively.
      type: select_one
      options:
      - '{''label'': ''Highly Effective''}'
      - '{''label'': ''Somewhat Effective''}'
      - '{''label'': ''Not Very Effective''}'
      required: false
    - id: 14
      name: likability_scale
      label: Likability Scale
      hint: Rate your coach's likability and relatability.
      type: select_one
      options:
      - '{''label'': ''Highly Likable''}'
      - '{''label'': ''Somewhat Likable''}'
      - '{''label'': ''Not Very Likable''}'
