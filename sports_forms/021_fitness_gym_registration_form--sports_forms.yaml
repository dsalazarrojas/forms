inputSchema:
  type: object
  properties:
    title: Fitness Gym Registration Form
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: membership_plan
      label: Membership Plan
      hint: null
      type: select_multiple
      options:
      - Monthly
      - Quarterly
      - Yearly
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Card number
      - Bank transfer
      - PayPal
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: birthdate
      label: Birthdate
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time_preferred
      label: Preferred Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
