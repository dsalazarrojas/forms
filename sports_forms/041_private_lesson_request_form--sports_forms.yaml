inputSchema:
  type: object
  properties:
    title: Private Lesson Request Form
    pages:
    - id: 1
      name: lesson_date
      label: Lesson Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: lesson_time
      label: Lesson Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: lesson_duration
      label: Lesson Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: instructor_id
      label: Instructor
      hint: null
      type: select_one
      options:
      - Instructor 1
      - Instructor 2
      - Instructor 3
      required: false
    - id: 5
      name: student_name
      label: Student Name
      hint: Enter student's full name
      type: text
      options: []
      required: false
    - id: 6
      name: lesson_topic
      label: Lesson Topic
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: lesson_type
      label: Lesson Type
      hint: null
      type: select_one
      options:
      - Swimming
      - Tennis
      - Gymnastics
      required: false
    - id: 8
      name: student_email
      label: Student Email
      hint: Student's email address
      type: email
      options: []
      required: false
    - id: 9
      name: student_phone
      label: Student Phone
      hint: Student's phone number
      type: text
      options: []
      required: false
