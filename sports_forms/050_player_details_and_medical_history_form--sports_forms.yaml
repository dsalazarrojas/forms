      - Shellfish
      - Tree Nuts
      - Soy
      required: true
    - id: 5
      name: medical_conditions
      label: Medical Conditions
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: medications
      label: Medications
      hint: null
      type: text
      options: []
      required: true
