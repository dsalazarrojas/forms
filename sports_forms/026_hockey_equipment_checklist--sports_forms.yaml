inputSchema:
  type: object
  properties:
    title: Hockey Equipment Checklist
    pages:
    - id: 1
      name: team_details
      label: Team Details
      hint: Provide team information
      type: text
      options: []
      required: true
    - id: 2
      name: hockey_equipment_list
      label: Hockey Equipment List
      hint: Select the required equipment for the team
      type: select_multiple
      options:
      - Stick
      - Helmet
      - Pads
      - Gloves
      - Skates
      - Shin Guards
      required: false
    - id: 3
      name: player_position_1
      label: Goalie Position
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: player_position_2
      label: Forward Position
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: player_position_3
      label: Defense Position
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: goalie_equipment
      label: Goalie Equipment
      hint: null
      type: select_one
      options:
      - Goalie Mask
      - Goalie Gloves
      - Shin Guards
      - Pads
      required: false
    - id: 7
      name: additional_equipement_types
      label: Additional Equipment Types
      hint: null
      type: select_multiple
      options:
      - Goalie
      - Equipment
      required: false
    - id: 8
      name: player_position_4
      label: Player Position 4
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: player_position_5
      label: Player Position 5
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: defense_position
      label: Defense Position (2)
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: player_position_6
      label: Player Position
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: goalie_mask
      label: Goalie Mask
      hint: null
      type: select_one
      options:
      - Goalie Mask
      - Goalie Gloves
      required: false
