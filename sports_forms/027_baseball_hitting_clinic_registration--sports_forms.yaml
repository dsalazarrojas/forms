inputSchema:
  type: object
  properties:
    title: Baseball Hitting Clinic Registration
    pages:
    - id: 1
      name: player_first_name
      label: Player First Name
      hint: First name
      type: text
      options: []
      required: true
    - id: 2
      name: player_last_name
      label: Player Last Name
      hint: Last name
      type: text
      options: []
      required: true
    - id: 3
      name: player_date_of_birth
      label: Player Date of Birth
      hint: MM/DD/YYYY format
      type: date
      options: []
      required: true
    - id: 4
      name: parent_guardian_name
      label: Parent or Guardian Full Name
      hint: Legal guardian name
      type: text
      options: []
      required: true
    - id: 5
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: For clinic communications
      type: email
      options: []
      required: true
    - id: 6
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 7
      name: home_address
      label: Home Address
      hint: Complete street address
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: true
    - id: 9
      name: state
      label: State
      hint: Your state
      type: text
      options: []
      required: true
    - id: 10
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 11
      name: clinic_date
      label: Clinic Date
      hint: Which session
      type: select_one
      options:
      - Saturday January 15
      - Saturday January 22
      - Saturday January 29
      - Saturday February 5
      - Full series - all dates
      required: true
    - id: 12
      name: age_group
      label: Age Group
      hint: Player age category
      type: select_one
      options:
      - 7 to 9 years
      - 10 to 12 years
      - 13 to 15 years
      - 16 to 18 years
      required: true
    - id: 13
      name: school_name
      label: School Name
      hint: Current school
      type: text
      options: []
      required: false
    - id: 14
      name: grade_level
      label: Grade Level
      hint: Current grade
      type: select_one
      options:
      - 1st grade
      - 2nd grade
      - 3rd grade
      - 4th grade
      - 5th grade
      - 6th grade
      - 7th grade
      - 8th grade
      - 9th grade
      - 10th grade
      - 11th grade
      - 12th grade
      required: true
    - id: 15
      name: experience_level
      label: Baseball Experience Level
      hint: How experienced
      type: select_one
      options:
      - Beginner - first year
      - Intermediate - 2 to 3 years
      - Advanced - 4 plus years
      required: true
    - id: 16
      name: bats
      label: Bats
      hint: Which hand
      type: select_one
      options:
      - Right
      - Left
      - Switch
      required: true
    - id: 17
      name: primary_position
      label: Primary Position
      hint: Main position
      type: select_one
      options:
      - Pitcher
      - Catcher
      - Infield
      - Outfield
      - Multiple positions
      required: true
    - id: 18
      name: hitting_goals
      label: Hitting Goals
      hint: What do you want to improve
      type: select_multiple
      options:
      - Batting average
      - Power hitting
      - Plate discipline
      - Baserunning
      - Swing mechanics
      - Mental approach
      - All aspects
      required: true
    - id: 19
      name: medical_conditions
      label: Medical Conditions or Allergies
      hint: Any conditions we should know
      type: text
      options: []
      required: false
    - id: 20
      name: current_medications
      label: Current Medications
      hint: List any medications
      type: text
      options: []
      required: false
    - id: 21
      name: insurance_provider
      label: Medical Insurance Provider
      hint: Insurance company
      type: text
      options: []
      required: true
    - id: 22
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 23
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number
      type: text
      options: []
      required: true
    - id: 24
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: How are they related
      type: text
      options: []
      required: true
    - id: 25
      name: t_shirt_size
      label: T-Shirt Size
      hint: For clinic shirt
      type: select_one
      options:
      - Youth small
      - Youth medium
      - Youth large
      - Adult small
      - Adult medium
      - Adult large
      - Adult XL
      required: true
    - id: 26
      name: equipment_provided
      label: Equipment Provided
      hint: What will you bring
      type: select_multiple
      options:
      - Bat
      - Helmet
      - Batting gloves
      - Cleats
      - Nothing - need equipment
      required: true
    - id: 27
      name: waiver_agreement
      label: Liability Waiver Agreement
      hint: I understand and accept the risks
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 28
      name: photo_consent
      label: Photo and Video Consent
      hint: May we use photos for marketing
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 29
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit card
      - Debit card
      - Cash at clinic
      - Check
      required: true
    - id: 30
      name: how_did_you_hear
      label: How Did You Hear About This Clinic
      hint: We appreciate knowing
      type: select_one
      options:
      - Coach referral
      - Social media
      - School flyer
      - Friend referral
      - Previous participant
      - Online search
      - Other
      required: true
    - id: 31
      name: additional_comments
      label: Additional Comments or Questions
      hint: Anything else
      type: text
      options: []
      required: false
    - id: 32
      name: parent_signature
      label: Parent or Guardian Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 33
      name: signature_date
      label: Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
