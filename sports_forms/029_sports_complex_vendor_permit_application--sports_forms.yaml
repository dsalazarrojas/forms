inputSchema:
  type: object
  properties:
    title: Sports Complex Vendor Permit Application
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: permit_start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: permit_end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: permit_status
      label: Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      - Cancelled
      required: true
    - id: 7
      name: insurance_status
      label: Insurance Status
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: terms_acceptance
      label: Terms Acceptance
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
