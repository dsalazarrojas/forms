inputSchema:
  type: object
  properties:
    title: Uniform Distribution Form
    pages:
    - id: 1
      name: staff_member_details
      label: Staff Member Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: staff_number
      label: Staff Number
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: staff_name
      label: Staff Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: team_name
      label: Team Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: number_of_uniforms
      label: Number of Uniforms
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: uniform_type
      label: Uniform Type
      hint: null
      type: select_one
      options:
      - Baseball
      - Basketball
      - Football
      - Soccer
      - Hockey
      - Volleyball
      - Tennis
      - Track
      required: false
    - id: 7
      name: size
      label: Size
      hint: null
      type: select_multiple
      options:
      - Small
      - Medium
      - Large
      - Extra Large
      required: false
    - id: 8
      name: color
      label: Color
      hint: null
      type: select_multiple
      options:
      - Red
      - Blue
      - Green
      - Yellow
      - Orange
      - Purple
      required: false
    - id: 9
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
