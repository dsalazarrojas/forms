inputSchema:
  type: object
  properties:
    title: Pool Chemicals Check Form
    pages:
    - id: 1
      name: pool_chemicals_check
      label: Pool Chemicals Check Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: pool_maintenance_chemicals
      label: What is the current chemical used for pool maintenance?
      hint: null
      type: select_one
      options:
      - Algaecide
      - Stabilizer
      - Clarifier
      required: false
    - id: 3
      name: algaecide
      label: Algaecide
      hint: null
      type: select_one
      options:
      - Algaecide
      - 'False'
      required: false
    - id: 4
      name: stabilizer
      label: Stabilizer
      hint: null
      type: select_one
      options:
      - Stabilizer
      - 'False'
      required: false
    - id: 5
      name: clarifier
      label: Clarifier
      hint: null
      type: select_one
      options:
      - Clarifier
      - 'False'
      required: false
    - id: 6
      name: other_chemicals
      label: Other chemicals
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: other_chemicals_used
      label: What are these other chemicals?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: chemical_1
      label: What is the brand name of the pool chemicals used?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: algaecide_expiration
      label: What is the expiration date of the Algaecide?
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: stabilizer_expiration
      label: What is the expiration date of the Stabilizer?
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: clarifier_expiration
      label: What is the expiration date of the Clarifier?
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: pool_check
      label: Pool Check
      hint: null
      type: radio
      options:
      - 'True'
      - 'False'
      required: true
