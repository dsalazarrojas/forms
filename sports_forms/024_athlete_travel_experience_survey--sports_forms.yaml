          - Basketball
          - Soccer
          - Track and Field
          - Swimming
          - Volleyball
          - Baseball
          - Softball
          - Tennis
          - Other
        required: true
      - id: 4
        name: team_name
        label: Team Name
        hint: Name of team
        type: text
        options: []
        required: true
      - id: 5
        name: survey_date
        label: Survey Date
        hint: Date of survey
        type: date
        options: []
        required: true
      - id: 6
        name: recent_trip_destination
        label: Recent Trip Destination
        hint: Where did you recently travel
        type: text
        options: []
        required: true
      - id: 7
        name: trip_date
        label: Trip Date
        hint: When was the trip
        type: date
        options: []
        required: true
      - id: 8
        name: trip_purpose
        label: Trip Purpose
        hint: Reason for travel
        type: select_one
