inputSchema:
  type: object
  properties:
    title: Athletic League Registration Form
    pages:
    - id: 1
      name: athlete_name
      label: Athlete Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: MM-DD-YYYY format
      type: date
      options: []
      required: true
    - id: 3
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      - Prefer Not to Say
      required: true
    - id: 4
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 5
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 6
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 7
      name: address
      label: Street Address
      hint: Home address
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 9
      name: state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 10
      name: zip_code
      label: ZIP Code
      hint: ZIP or postal code
      type: text
      options: []
      required: true
    - id: 11
      name: school_name
      label: School Name
      hint: Current school
      type: text
      options: []
      required: true
    - id: 12
      name: grade_level
      label: Grade Level
      hint: Current grade
      type: select_one
      options:
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: true
    - id: 13
      name: sport_selection
      label: Sport Selection
      hint: Primary sport to register for
      type: select_one
      options:
      - Football
      - Basketball
      - Soccer
      - Track and Field
      - Swimming
      - Volleyball
      - Baseball
      - Softball
      - Tennis
      - Wrestling
      - Cross Country
      - Golf
      required: true
    - id: 14
      name: secondary_sport
      label: Secondary Sport
      hint: Second sport if applicable
      type: select_one
      options:
      - None
      - Football
      - Basketball
      - Soccer
      - Track and Field
      - Swimming
      - Volleyball
      - Baseball
      - Softball
      - Tennis
      - Wrestling
      - Cross Country
      - Golf
      required: false
    - id: 15
      name: league_division
      label: League Division
      hint: Based on age or skill level
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Competitive
      - Recreational
      required: true
    - id: 16
      name: previous_experience
      label: Previous Experience
      hint: Years of experience in this sport
      type: number
      options: []
      required: true
    - id: 17
      name: team_preference
      label: Team Preference
      hint: Any preference for team assignment
      type: text
      options: []
      required: false
    - id: 18
      name: friend_request
      label: Friend or Carpool Request
      hint: List names of friends to be placed with
      type: text
      options: []
      required: false
    - id: 19
      name: coach_request
      label: Coach Request
      hint: Any specific coach request
      type: text
      options: []
      required: false
    - id: 20
      name: registration_type
      label: Registration Type
      hint: Type of registration
      type: select_one
      options:
      - Early Bird
      - Regular
      - Late Registration
      - Walk-In
      required: true
    - id: 21
      name: registration_fee
      label: Registration Fee
      hint: Fee amount in USD
      type: number
      options: []
      required: true
    - id: 22
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Check
      - Cash
      - Online Payment
      - Scholarship or Financial Aid
      required: true
    - id: 23
      name: scholarship_needed
      label: Scholarship or Financial Aid Needed
      hint: Do you need financial assistance
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 24
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of emergency contact
      type: text
      options: []
      required: true
    - id: 25
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Emergency contact number
      type: text
      options: []
      required: true
    - id: 26
      name: medical_conditions
      label: Medical Conditions or Allergies
      hint: List any conditions or allergies
      type: text
      options: []
      required: true
    - id: 27
      name: current_medications
      label: Current Medications
      hint: List any medications
      type: text
      options: []
      required: false
    - id: 28
      name: insurance_provider
      label: Health Insurance Provider
      hint: Name of insurance company
      type: text
      options: []
      required: true
    - id: 29
      name: t_shirt_size
      label: T-Shirt Size
      hint: For team uniform
      type: select_one
      options:
      - Youth Small
      - Youth Medium
      - Youth Large
      - Adult Small
      - Adult Medium
      - Adult Large
      - Adult XL
      - Adult 2XL
      required: true
    - id: 30
      name: how_heard
      label: How Did You Hear About the League
      hint: Source of referral
      type: select_one
      options:
      - School
      - Social Media
      - Friend or Family
      - Website
      - Flyer or Poster
      - Previous Participant
      - Other
      required: true
    - id: 31
      name: volunteer_interest
      label: Volunteer Interest
      hint: Would you like to volunteer
      type: select_one
      options:
      - Yes - As Coach
      - Yes - As Assistant
      - Yes - Other Role
      - 'No'
      required: true
    - id: 32
      name: additional_comments
      label: Additional Comments
      hint: Anything else we should know
      type: text
      options: []
      required: false
