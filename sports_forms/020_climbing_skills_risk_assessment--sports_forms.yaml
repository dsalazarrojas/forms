inputSchema:
  type: object
  properties:
    title: Climbing Skills Risk Assessment
    pages:
    - id: 1
      name: form_header
      label: Climbing Skills and Risk Assessment
      hint: This assessment evaluates climbing ability and helps ensure safe participation
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: climbing_experience
      label: Climbing Experience Level
      hint: null
      type: select_one
      options:
      - Beginner - No Experience
      - Beginner - Less Than 6 Months
      - Intermediate - 6 Months to 2 Years
      - Advanced - 2 to 5 Years
      - Expert - Over 5 Years
      required: true
    - id: 11
      name: climbing_disciplines
      label: Climbing Disciplines Practiced
      hint: Select all that apply
      type: select_multiple
      options:
      - Bouldering
      - Top Rope
      - Lead Climbing
      - Sport Climbing
      - Traditional Climbing
      - Multi-Pitch Climbing
      - Ice Climbing
      - Alpine Climbing
      required: true
    - id: 12
      name: highest_grade_boulder
      label: Highest Bouldering Grade Completed
      hint: null
      type: select_one
      options:
      - V0-V1
      - V2-V3
      - V4-V5
      - V6-V7
      - V8+
      - Not Applicable
      required: false
    - id: 13
      name: highest_grade_sport
      label: Highest Sport Climbing Grade Completed
      hint: null
      type: select_one
      options:
      - 5.6-5.8
      - 5.9-5.10
      - 5.11-5.12
      - 5.13-5.14
      - 5.15+
      - Not Applicable
      required: false
    - id: 14
      name: belay_certification
      label: Do You Have Belay Certification
      hint: null
      type: select_one
      options:
      - Yes Current
      - Yes Expired
      - 'False'
      - Not Applicable
      required: false
    - id: 15
      name: belay_device_types
      label: Belay Devices You Can Use
      hint: Select all that apply
      type: select_multiple
      options:
      - Tube Style (ATC)
      - Assisted Braking (GriGri)
      - Figure 8
      - Reverso
      - Other
      - Not Applicable
      required: false
    - id: 16
      name: lead_climbing_experience
      label: Lead Climbing Experience
      hint: null
      type: select_one
      options:
      - No Experience
      - Beginner - Learning
      - Intermediate - Can Lead Indoors
      - Advanced - Can Lead Outdoors
      - Expert - Multi-Pitch Lead
      required: true
    - id: 17
      name: number_of_falls
      label: Have You Taken Significant Falls
      hint: null
      type: select_one
      options:
      - Never
      - 1-2 Minor Falls
      - Multiple Minor Falls
      - 1-2 Significant Falls
      - Multiple Significant Falls
      required: false
    - id: 18
      name: injury_history
      label: Climbing-Related Injury History
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - Finger Injuries
      - Shoulder Injuries
      - Elbow Injuries
      - Ankle Injuries
      - Knee Injuries
      - Back Injuries
      - Head Injuries
      - Other
      required: false
    - id: 19
      name: current_injuries
      label: Do You Have Any Current Injuries
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 20
      name: injury_details
      label: Injury Details
      hint: Describe current injuries
      type: text
      options: []
      required: false
    - id: 21
      name: medical_conditions
      label: Relevant Medical Conditions
      hint: Heart conditions asthma etc.
      type: text
      options: []
      required: false
    - id: 22
      name: fitness_level
      label: Overall Fitness Level
      hint: null
      type: select_one
      options:
      - Sedentary
      - Lightly Active
      - Moderately Active
      - Very Active
      - Extremely Active
      required: true
    - id: 23
      name: climbing_frequency
      label: How Often Do You Climb
      hint: null
      type: select_one
      options:
      - First Time
      - Less Than Once a Month
      - 1-3 Times Per Month
      - Once a Week
      - 2-3 Times Per Week
      - 4+ Times Per Week
      required: true
    - id: 24
      name: risk_awareness
      label: Do You Understand Climbing Risks
      hint: Falls equipment failure etc.
      type: select_one
      options:
      - Yes Completely
      - Yes Mostly
      - Somewhat
      - Not Really
      - 'False'
      required: true
    - id: 25
      name: safety_equipment_knowledge
      label: Knowledge of Safety Equipment
      hint: Harnesses ropes anchors etc.
      type: select_one
      options:
      - Expert Level
      - Advanced
      - Intermediate
      - Basic
      - Beginner
      required: true
    - id: 26
      name: equipment_inspection
      label: Do You Inspect Equipment Before Use
      hint: null
      type: select_one
      options:
      - Always
      - Usually
      - Sometimes
      - Rarely
      - Never
      required: true
    - id: 27
      name: climbing_goals
      label: What Are Your Climbing Goals
      hint: null
      type: text
      options: []
      required: false
    - id: 28
      name: assessment_score
      label: Assessor Use Only - Risk Score
      hint: null
      type: select_one
      options:
      - Low Risk
      - Moderate Risk
      - Elevated Risk
      - High Risk
      required: false
    - id: 29
      name: assessor_name
      label: Assessor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 30
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 31
      name: waiver_signed
      label: Liability Waiver Signed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 32
      name: additional_comments
      label: Additional Comments
      hint: Any other relevant information
      type: text
      options: []
      required: false
