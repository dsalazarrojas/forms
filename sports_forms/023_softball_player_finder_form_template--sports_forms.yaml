inputSchema:
  type: object
  properties:
    title: Softball Player Finder Form Template
    pages:
    - id: 1
      name: player_info
      label: Player Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: age_group
      label: age_group
      hint: null
      type: select_one
      options:
      - 9-12
      - 13-15
      - 16-18
      required: false
    - id: 4
      name: height
      label: height
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: position
      label: position
      hint: null
      type: select_one
      options:
      - Pitcher
      - Catcher
      - Infielder
      - Outfielder
      required: false
    - id: 6
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: medical_condition
      label: Medical Condition
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: availability
      label: Availability
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      required: false
    - id: 10
      name: player_skills
      label: Player Skills
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: experience
      label: Experience
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: team_affiliations
      label: Team Affiliations
      hint: null
      type: select_one
      options:
      - None
      - Local Team
      - Regional Team
      - National Team
      required: false
    - id: 13
      name: coach_name
      label: Coach Name
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: coach_phone
      label: Coach Phone
      hint: null
      type: text
      options: []
      required: false
