inputSchema:
  type: object
  properties:
    title: registration_for_running_safari
    pages:
    - id: 1
      name: running_event_details
      label: Running Event
      hint: null
      type: select_one
      options:
      - 5K
      - 10K
      - half marathon
      - full marathon
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: dietary_requirements
      label: Dietary Requirements
      hint: null
      type: select_multiple
      options:
      - Vegetarian
      - Non-Vegetarian
      - Vegan
      - Kosher
      required: false
    - id: 6
      name: special_requirements
      label: Special Requirements
      hint: null
      type: select_multiple
      options:
      - Water bottle
      - Shower
      - Blanket
      required: false
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Stripe
      - PayPal
      - Bank Transfer
      required: false
    - id: 8
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
