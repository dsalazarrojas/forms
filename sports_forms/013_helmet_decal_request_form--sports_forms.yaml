inputSchema:
  type: object
  properties:
    title: Helmet Decal Request Form
    pages:
    - id: 1
      name: team
      label: Team or School Affiliation
      hint: Please enter your team or school name
      type: text
      options: []
      required: false
    - id: 2
      name: artwork
      label: Artwork Description
      hint: Describe the design or artwork you would like to have on your helmet decals
      type: text
      options: []
      required: false
    - id: 3
      name: size
      label: Decal Size
      hint: Select a size for your decal (e.g., small, medium, large)
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 4
      name: color
      label: Color(s) Choice
      hint: Select the color(s) for your decal
      type: select_multiple
      options:
      - Black
      - White
      - Red
      required: false
    - id: 5
      name: quantity
      label: Quantity
      hint: How many decals would you like to order?
      type: number
      options: []
      required: true
    - id: 6
      name: print_shop
      label: Print Shop
      hint: Select your preferred print shop
      type: select_multiple
      options:
      - Local Print Shop
      - National Print Shop
      - Online Print Shop
      required: false
    - id: 7
      name: artwork_2
      label: Additional Artwork
      hint: Would you like to add any additional artwork to your order?
      type: text
      options: []
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: Any additional notes or requirements for your order?
      type: note
      options: []
      required: false
