inputSchema:
  type: object
  properties:
    title: Martial Arts Course Registration Form
    pages:
    - id: 1
      name: personal_info
      label: Personal Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: belt_status
      label: Belt Status
      hint: null
      type: select_one
      options:
      - White Belt
      - Orange Belt
      - Yellow Belt
      - Green Belt
      - Black Belt
      - Red Belt
      - Brown Belt
      - Blue Belt
      required: false
    - id: 4
      name: payment_plan
      label: Payment Plan
      hint: null
      type: select_multiple
      options:
      - Package 1
      - Package 2
      - Package 3
      required: false
    - id: 5
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: medical_history
      label: Medical History
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: course_package
      label: Course Package
      hint: null
      type: select_one
      options:
      - Package A
      - Package B
      - Package C
      required: false
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Card
      - Cash
      - Check
      required: false
