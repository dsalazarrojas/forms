inputSchema:
  type: object
  properties:
    title: Student Re Enrollment Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: student_grade
      label: Student Grade
      hint: null
      type: select_one
      options:
      - 1st
      - 2nd
      - 3rd
      - 4th
      - 5th
      - 6th
      - 7th
      - 8th
      - 9th
      - 10th
      - 11th
      - 12th
      required: false
    - id: 4
      name: guardian_name
      label: Guardian Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: guardian_phone
      label: Guardian Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: student_address
      label: Student Address
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: reason_for_re_enrollment
      label: Reason for Re-Enrollment
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
