inputSchema:
  type: object
  properties:
    title: Student Form
    pages:
    - id: 1
      name: student_form
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: school_year
      label: School Year
      hint: null
      type: select_one
      options:
      - Freshman
      - Sophomore
      - Junior
      - Senior
      required: false
    - id: 4
      name: email
      label: Email
      hint: Please enter a valid email address
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: Please enter a valid phone number
      type: text
      options: []
      required: false
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: Please enter a valid date of birth
      type: date
      options: []
      required: false
    - id: 7
      name: time_of_birth
      label: Time of Birth
      hint: Please enter a valid time of birth
      type: time
      options: []
      required: false
    - id: 8
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
