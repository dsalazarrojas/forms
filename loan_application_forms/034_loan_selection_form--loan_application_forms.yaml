inputSchema:
  type: object
  properties:
    title: <string>
    pages:
    - id: 1
      name: loan_selection_form
      label: loan_selection
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: applicant_type
      label: applicant_type
      hint: ขอ
      type: select_multiple
      options:
      - Individual
      - Business
      - Non-Profit
      required: false
    - id: 3
      name: loan_type
      label: loan_type
      hint: null
      type: select_one
      options:
      - Home Equity
      - Home Improvement
      - Personal
      - Vehicle
      - Student
      - Other
      required: false
    - id: 4
      name: loan_term
      label: loan_term
      hint: null
      type: select_one
      options:
      - 6 Months
      - 12 Months
      - 24 Months
      - 36 Months
      - 48 Months
      - 60 Months
      required: false
    - id: 5
      name: applicant_income
      label: applicant_income
      hint: null
      type: select_multiple
      options:
      - Less than $25,000
      - $25,001 to $50,000
      - $50,001 to $75,000
      - $75,001 to $100,000
      - $100,001 to $150,000
      - $150,001 to $200,000
      - $200,001 to $250,000
      - $250,001 to $300,000
      required: false
    - id: 6
      name: loan_amount
      label: loan_amount
      hint: null
      type: select_one
      options:
      - $5,000
      - $10,000
      - $15,000
      - $20,000
      - $25,000
      - $30,000
      - $35,000
      - $40,000
      - $45,000
      required: false
    - id: 7
      name: applicant_credit_score
      label: applicant_credit_score
      hint: null
      type: select_one
      options:
      - 300-399
      - 400-499
      - 500-599
      - 600-699
      - 700-799
      - 800-899
      - 900-999
      - 1,000
      required: false
    - id: 8
      name: loan_status
      label: loan_status
      hint: null
      type: select_one
      options:
      - Approved
      - Denied
      - Pending
      required: false
    - id: 9
      name: loan_date
      label: loan_date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: loan_time
      label: loan_time
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: notes
      label: notes
      hint: Notes about loan
      type: note
      options: []
      required: false
    - id: 12
      name: applicant_phone
      label: applicant_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: loan_amount_in_cents
      label: loan_amount_in_cents
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: applicant_income_in_cents
      label: applicant_income_in_cents
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: loan_rate
      label: loan_rate
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: loan_fees
      label: loan_fees
      hint: null
      type: number
      options: []
      required: false
    - id: 17
      name: loan_fees_in_cents
      label: loan_fees_in_cents
      hint: null
      type: number
      options: []
      required: false
    - id: 18
      name: loan_fees_percent
      label: loan_fees_percent
      hint: null
      type: number
      options: []
      required: false
    - id: 19
      name: loan_term_in_years
      label: loan_term_in_years
      hint: null
      type: number
      options: []
      required: false
    - id: 20
      name: applicant_age
      label: applicant_age
      hint: null
      type: number
      options: []
      required: false
