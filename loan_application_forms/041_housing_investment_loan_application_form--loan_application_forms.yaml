inputSchema:
  type: object
  properties:
    title: Housing Investment Loan Application Form
    pages:
    - id: 1
      name: loan_application_form
      label: Loan Application Form
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: applicant_details
      label: Applicant Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: property_details
      label: Property Details
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: financial_details
      label: Financial Details
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: loan_amount
      label: Loan Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: loan_term
      label: Loan Term
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: loan_rate
      label: Loan Rate
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 8
      name: loan_security
      label: Loan Security
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
