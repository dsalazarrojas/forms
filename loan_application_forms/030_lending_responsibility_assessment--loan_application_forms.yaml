inputSchema:
  type: object
  properties:
    title: Lending Responsibility Assessment
    pages:
    - id: 1
      name: borrower_name
      label: Borrower Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employment_status
      label: Employment Status
      hint: null
      type: select_one
      options:
      - Employed
      - Unemployed
      - Retired
      - Disabled
      - Student
      - Homemaker
      - Self-Employed
      - Other
      - Prefer not to disclose
      required: false
    - id: 3
      name: annual_income
      label: Annual Income
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: monthly_debt
      label: Monthly Debt
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: monthly_expenses
      label: Monthly Expenses
      hint: null
      type: select_multiple
      options:
      - Rent or mortgage
      - Utilities
      - Food
      - Transportation
      - Other
      required: false
    - id: 6
      name: credit_score
      label: Credit Score
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - No Credit Check
      required: false
    - id: 7
      name: income_verification
      label: Income Verification
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: employment_verification
      label: Employment Verification
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
