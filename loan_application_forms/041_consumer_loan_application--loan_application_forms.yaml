inputSchema:
  type: object
  properties:
    title: Consumer Loan Application
    pages:
    - id: 1
      name: applicant_first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: applicant_email
      label: Email Address
      hint: Primary email address
      type: email
      options: []
      required: true
    - id: 4
      name: applicant_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: Your date of birth
      type: date
      options: []
      required: true
    - id: 6
      name: social_security_number
      label: Social Security Number
      hint: SSN for credit check
      type: text
      options: []
      required: true
    - id: 7
      name: street_address
      label: Street Address
      hint: Current residence address
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 9
      name: state
      label: State
      hint: State of residence
      type: text
      options: []
      required: true
    - id: 10
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 11
      name: residence_type
      label: Residence Type
      hint: Select your housing situation
      type: select_one
      options:
      - Own
      - Rent
      - Live with Family
      - Other
      required: true
    - id: 12
      name: monthly_housing_payment
      label: Monthly Housing Payment
      hint: Rent or mortgage amount
      type: number
      options: []
      required: true
    - id: 13
      name: employment_status
      label: Employment Status
      hint: Current employment status
      type: select_one
      options:
      - Employed Full-Time
      - Employed Part-Time
      - Self-Employed
      - Unemployed
      - Retired
      - Student
      - Other
      required: true
    - id: 14
      name: employer_name
      label: Employer Name
      hint: Name of current employer
      type: text
      options: []
      required: false
    - id: 15
      name: job_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: false
    - id: 16
      name: employment_length
      label: Length of Employment
      hint: How long at current job
      type: select_one
      options:
      - Less than 1 Year
      - 1-3 Years
      - 3-5 Years
      - 5-10 Years
      - 10+ Years
      required: false
    - id: 17
      name: annual_income
      label: Annual Income
      hint: Gross annual income
      type: number
      options: []
      required: true
    - id: 18
      name: additional_income
      label: Additional Income
      hint: Other sources of income
      type: number
      options: []
      required: false
    - id: 19
      name: loan_amount_requested
      label: Loan Amount Requested
      hint: Amount you wish to borrow
      type: number
      options: []
      required: true
    - id: 20
      name: loan_purpose
      label: Loan Purpose
      hint: What is the loan for
      type: select_one
      options:
      - Debt Consolidation
      - Home Improvement
      - Medical Expenses
      - Education
      - Vehicle Purchase
      - Major Purchase
      - Emergency
      - Other
      required: true
    - id: 21
      name: loan_term_preference
      label: Preferred Loan Term
      hint: Desired repayment period
      type: select_one
      options:
      - 12 Months
      - 24 Months
      - 36 Months
      - 48 Months
      - 60 Months
      - 72 Months
      required: true
    - id: 22
      name: checking_account
      label: Do You Have a Checking Account
      hint: Select if you have a checking account
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 23
      name: savings_account
      label: Do You Have a Savings Account
      hint: Select if you have a savings account
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 24
      name: monthly_expenses
      label: Total Monthly Expenses
      hint: Sum of all monthly obligations
      type: number
      options: []
      required: true
    - id: 25
      name: existing_loans
      label: Do You Have Existing Loans
      hint: Select if you have current loans
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 26
      name: existing_debt_amount
      label: Total Existing Debt
      hint: Amount of current debt
      type: number
      options: []
      required: false
    - id: 27
      name: bankruptcy_history
      label: Have You Filed for Bankruptcy
      hint: Select if you have bankruptcy history
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 28
      name: references
      label: Personal References
      hint: Names and contact info of references
      type: text
      options: []
      required: false
    - id: 29
      name: authorization_signature
      label: Authorization Signature
      hint: Type your full name as signature
      type: text
      options: []
      required: true
    - id: 30
      name: application_date
      label: Application Date
      hint: Date of submission
      type: date
      options: []
      required: true
