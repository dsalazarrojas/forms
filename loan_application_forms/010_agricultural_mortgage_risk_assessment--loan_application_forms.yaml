inputSchema:
  type: object
  properties:
    title: Agricultural Mortgage Risk Assessment
    pages:
    - id: 1
      name: borrower_details_header
      label: -- Borrower Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: borrower_name
      label: Borrower Name
      hint: Primary applicant
      type: text
      options: []
      required: true
    - id: 3
      name: farm_name
      label: Farm Name
      hint: Legal entity name
      type: text
      options: []
      required: true
    - id: 4
      name: loan_amount
      label: Loan Amount Requested
      hint: In local currency
      type: number
      options: []
      required: true
    - id: 5
      name: farm_operations_header
      label: -- Farm Operations --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: farm_size
      label: Farm Size
      hint: Total acres operated
      type: number
      options: []
      required: true
    - id: 7
      name: ownership_status
      label: Ownership Status
      hint: Land tenure
      type: select_one
      options:
      - Fully Owned
      - Leased
      - Mixed (Owned & Leased)
      - Sharecropping
      required: true
    - id: 8
      name: annual_revenue
      label: Annual Revenue
      hint: Gross revenue from last tax year
      type: number
      options: []
      required: true
    - id: 9
      name: years_operation
      label: Years in Operation
      hint: How long has the farm been active?
      type: number
      options: []
      required: true
    - id: 10
      name: financial_metrics_header
      label: -- Financial Metrics --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: credit_score
      label: Credit Score
      hint: Current FICO or equivalent
      type: number
      options: []
      required: true
    - id: 12
      name: collateral_description
      label: Collateral Description
      hint: Assets pledged for the loan
      type: text
      options: []
      required: true
    - id: 13
      name: dti_ratio
      label: Debt-to-Income Ratio
      hint: Current DTI percentage
      type: number
      options: []
      required: true
    - id: 14
      name: risk_factors
      label: Risk Factors
      hint: Identify potential risks (market, weather, etc.)
      type: text
      options: []
      required: true
    - id: 15
      name: recommendation
      label: Approval Recommendation
      hint: Officer's initial assessment
      type: select_one
      options:
      - Approve
      - Deny
      - Further Review Required
      - Conditional Approval
      required: true
    - id: 16
      name: officer_notes
      label: Officer Notes
      hint: Internal comments
      type: text
      options: []
      required: false
