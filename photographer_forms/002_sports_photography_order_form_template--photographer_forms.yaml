inputSchema:
  type: object
  properties:
    title: sports_photography_order_form_template
    pages:
    - id: 1
      name: client_info
      label: What is your name?
      hint: Please provide your name.
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email address
      hint: Please provide your email address.
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone number
      hint: Please provide your phone number.
      type: text
      options: []
      required: true
    - id: 4
      name: session_details
      label: Session details
      hint: Please provide the date and time of the photography session.
      type: text
      options: []
      required: true
    - id: 5
      name: location
      label: Location
      hint: Please provide the location of the photography session.
      type: select_one
      options:
      - Studio
      - Location
      required: true
    - id: 6
      name: photography_session
      label: Choose a photography session
      hint: Please select one or multiple photography sessions.
      type: select_multiple
      options:
      - Half
      - Full
      required: true
    - id: 7
      name: packages
      label: Packages
      hint: Please select a package.
      type: select_one
      options:
      - Basic
      - Premium
      required: true
    - id: 8
      name: payment_info
      label: Payment information
      hint: Please select a payment method and amount.
      type: text
      options: []
      required: false
    - id: 9
      name: order_note
      label: Order note
      hint: Please add any additional notes about your order.
      type: note
      options: []
      required: false
    - id: 10
      name: payment_confirmation
      label: Payment confirmation
      hint: Please confirm your payment information.
      type: text
      options: []
      required: false
    - id: 11
      name: review
      label: Review
      hint: Please review your order.
      type: text
      options: []
      required: false
    - id: 12
      name: confirmation
      label: Confirmation
      hint: Please confirm your order.
      type: text
      options: []
      required: true
