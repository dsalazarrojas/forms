inputSchema:
  type: object
  properties:
    title: Photography Equipment Rental Registration Form
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: equipment_type
      label: Equipment Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: equipment_condition
      label: Equipment Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: rental_start_date
      label: Rental Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: rental_end_date
      label: Rental End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: rental_duration
      label: Rental Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: special_instructions
      label: Special Instructions
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: photographer
      label: Photographer
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: rental_status
      label: Rental Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 12
      name: additional_info
      label: Additional Info
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: equipment_list
      label: Equipment List
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: total_price
      label: Total Price
      hint: null
      type: number
      options: []
      required: true
