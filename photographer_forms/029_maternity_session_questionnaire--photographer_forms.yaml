inputSchema:
  type: object
  properties:
    title: Maternity Session Questionnaire
    pages:
    - id: 1
      name: session_details
      label: Session Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: client_info
      label: Client Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: birth_details
      label: Birth Details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_preferences
      label: Contact Preferences
      hint: null
      type: select_one
      options:
      - First name
      - Last name
      - Phone number
      - Email
      - Text
      - Other (Specify)
      required: true
    - id: 5
      name: contact_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: contact_phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: photographer_info
      label: Photographer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: other_info
      label: Other
      hint: null
      type: text
      options: []
      required: false
