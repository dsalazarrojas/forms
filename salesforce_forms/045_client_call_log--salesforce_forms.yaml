inputSchema:
  type: object
  properties:
    title: Client Call Log
    pages:
    - id: 1
      name: call_info_header
      label: -- Call Details --
      hint: Record of interaction with the client.
      type: note
      options: []
      required: false
    - id: 2
      name: staff_member_name
      label: Staff Member/Counselor Name
      hint: Person making or receiving the call
      type: text
      options: []
      required: true
    - id: 3
      name: client_name
      label: Client Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: client_id
      label: Client ID/Case Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_call
      label: Date of Call
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: time_of_call
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: duration_minutes
      label: Duration (Minutes)
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: log_entry_header
      label: -- Interaction Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: call_type
      label: Type of Call
      hint: null
      type: select_one
      options:
      - Outbound (Check-in)
      - Inbound (Inquiry)
      - Scheduled Session
      - Crisis/Emergency
      - Billing/Admin
      required: true
    - id: 10
      name: call_status
      label: Call Status
      hint: null
      type: select_one
      options:
      - Completed
      - Left Voicemail
      - No Answer
      - Line Busy
      - Client unavailable
      required: true
    - id: 11
      name: primary_topic
      label: Primary Topic of Discussion
      hint: null
      type: select_one
      options:
      - Progress Update
      - Support/Guidance
      - Scheduling/Rescheduling
      - Feedback/Complaint
      - New Service Inquiry
      required: true
    - id: 12
      name: call_summary
      label: Detailed Summary of Conversation
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: emotional_state_obs
      label: Client's Emotional State (if applicable)
      hint: null
      type: select_one
      options:
      - Calm/Stable
      - Anxious
      - Frustrated
      - Uplifted/Positive
      - Distressed/Crisis
      required: false
    - id: 14
      name: follow_up_header
      label: -- Action Items --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: follow_up_required
      label: Is follow-up required?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 16
      name: follow_up_action
      label: Description of Follow-up Action
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: sync_to_salesforce
      label: Sync this log to Salesforce/CRM?
      hint: null
      type: select_one
      options:
      - true
      - Already synced
      - false
      required: false
    - id: 18
      name: private_internal_note
      label: Internal Private Notes
      hint: Not visible to client
      type: text
      options: []
      required: false
    - id: 19
      name: supervisor_review_needed
      label: Request Supervisor Review of this call?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 20
      name: call_log_footer
      label: -- Log Saved Successfully --
      hint: null
      type: note
      options: []
      required: false
