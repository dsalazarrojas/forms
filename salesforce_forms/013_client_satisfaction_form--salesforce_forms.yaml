inputSchema:
  type: object
  properties:
    title: Client Satisfaction Form
    pages:
    - id: 1
      name: intro_section
      label: Tell us what you think
      hint: Your feedback helps us serve you better
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Optional
      type: text
      options: []
      required: false
    - id: 6
      name: contact_date
      label: When was your last interaction with us?
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: service_interaction
      label: What type of service or product interaction was this?
      hint: null
      type: select_one
      options:
      - Purchase
      - Support
      - Consultation
      - Demo
      - Implementation
      - Training
      - Other
      required: true
    - id: 8
      name: satisfaction_section
      label: -- Experience Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: overall_satisfaction
      label: How satisfied are you with your overall experience?
      hint: null
      type: select_one
      options:
      - Very Unsatisfied
      - Unsatisfied
      - Neutral
      - Satisfied
      - Very Satisfied
      required: true
    - id: 10
      name: experience_rating
      label: Rate your experience - 1 to 10
      hint: 1 = Poor, 10 = Excellent
      type: number
      options: []
      required: true
    - id: 11
      name: product_quality_section
      label: -- Product or Service Quality --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: product_quality
      label: The quality of our product or service is
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 13
      name: expectations_met
      label: Our offering met your expectations
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 14
      name: features_satisfaction
      label: The features and functions available are adequate
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 15
      name: service_quality_section
      label: -- Service and Support Quality --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: service_quality
      label: The quality of our service and support is
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 17
      name: support_responsiveness
      label: Our support team is responsive and helpful
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 18
      name: easy_to_work_with
      label: We are easy to work with
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 19
      name: value_section
      label: -- Value and Pricing --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: value_perception
      label: You received excellent value for your investment
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 21
      name: pricing_satisfaction
      label: Are you satisfied with our pricing?
      hint: null
      type: select_one
      options:
      - Very Unsatisfied
      - Unsatisfied
      - Neutral
      - Satisfied
      - Very Satisfied
      required: false
    - id: 22
      name: recommendation_section
      label: -- Recommendation and Loyalty --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: referral_likelihood
      label: How likely are you to recommend us? Scale 1-10
      hint: 1 = Not at all, 10 = Extremely likely
      type: number
      options: []
      required: true
    - id: 24
      name: repeat_purchase
      label: Would you do business with us again?
      hint: null
      type: select_one
      options:
      - Definitely Not
      - Probably Not
      - Maybe
      - Probably Yes
      - Definitely Yes
      required: true
    - id: 25
      name: feedback_section
      label: -- Additional Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: strengths
      label: What did we do well?
      hint: null
      type: text
      options: []
      required: false
    - id: 27
      name: improvements
      label: What can we improve?
      hint: null
      type: text
      options: []
      required: false
    - id: 28
      name: other_feedback
      label: Any other comments?
      hint: null
      type: text
      options: []
      required: false
