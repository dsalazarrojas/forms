inputSchema:
  type: object
  properties:
    title: Shipping Quote Form
    pages:
    - id: 1
      name: shipping_quote_form
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email_address
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: shipping_service
      label: Shipping Service
      hint: null
      type: select_one
      options:
      - UPS
      - FedEx
      - DHL
      required: true
    - id: 7
      name: package_details
      label: Package Details
      hint: null
      type: note
      options: []
      required: true
    - id: 8
      name: estimated_cost
      label: Estimated Cost
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Bank Transfer
      - PayPal
      - Credit Card
      required: false
    - id: 10
      name: customer_signature
      label: Customer Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: salesperson_signature
      label: Salesperson Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: additional_info
      label: Additional Info
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: shipping_quote_terms
      label: Shipping Quote Terms
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: terms_and_conditions
      label: Terms and Conditions
      hint: null
      type: select_multiple
      options:
      - Yes, I agree to the terms and conditions
      - No, I do not agree to the terms and conditions
      required: true
    - id: 15
      name: confirm_terms
      label: Confirm Terms
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: shipping_quote_number
      label: Shipping Quote Number
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: quote_expires
      label: Quote Expires
      hint: null
      type: select_one
      options:
      - 3 days
      - 7 days
      - 14 days
      required: false
    - id: 18
      name: estimated_delivery_time
      label: Estimated Delivery Time
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: delivery_address
      label: Delivery Address
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: delivery_city
      label: Delivery City
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: delivery_state
      label: Delivery State
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: delivery_zip
      label: Delivery Zip
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 25
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
