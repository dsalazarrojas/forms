inputSchema:
  type: object
  properties:
    title: Appointment Form
    pages:
    - id: 1
      name: client_details
      label: -- Client Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: scheduling_information
      label: -- Scheduling Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: appointment_type
      label: Type of Appointment
      hint: null
      type: select_one
      options:
      - Doctor visit
      - Legal consultation
      - Business meeting
      - Consultation call
      - Other professional
      required: true
    - id: 7
      name: preferred_date
      label: Preferred Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: preferred_time
      label: Preferred Time
      hint: null
      type: select_one
      options:
      - 9 AM - 10 AM
      - 10 AM - 11 AM
      - 11 AM - 12 PM
      - 2 PM - 3 PM
      - 3 PM - 4 PM
      - 4 PM - 5 PM
      required: true
    - id: 9
      name: appointment_duration
      label: Appointment Duration
      hint: null
      type: select_one
      options:
      - 30 minutes
      - 1 hour
      - 1.5 hours
      - 2 hours
      required: false
    - id: 10
      name: reason_for_appointment
      label: Reason for Appointment
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: additional_details
      label: Additional Details or Special Requests
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: confirmation_method
      label: -- Confirmation Method --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: preferred_contact_method
      label: Preferred contact method for confirmation
      hint: null
      type: select_one
      options:
      - Email
      - Phone call
      - SMS text
      - No preference
      required: false
    - id: 14
      name: reminder_preference
      label: Would you like appointment reminders?
      hint: null
      type: select_one
      options:
      - Yes, email reminder
      - Yes, phone reminder
      - Yes, both
      - No reminders
      required: false
    - id: 15
      name: follow_up_information
      label: -- Follow-up Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: documents_to_bring
      label: Documents or information to bring
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: questions_for_appointment
      label: Questions you would like to discuss
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: cancellation_policy
      label: I acknowledge the cancellation policy
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: false
