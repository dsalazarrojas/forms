inputSchema:
  type: object
  properties:
    title: Prayer Request Form
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: prayer_type
      label: Prayer Type
      hint: null
      type: select_one
      options:
      - General Prayer Request
      - Birthday Prayer Request
      - Get Well Request
      required: false
    - id: 6
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: prayer_request_date
      label: Prayer Request Date
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: assigned_to
      label: Assigned to
      hint: null
      type: select_multiple
      options:
      - ChatJIMMY
      - Another Option
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
