inputSchema:
  type: object
  properties:
    title: Vacation Bible School Volunteer Application Form
    pages:
    - id: 1
      name: volunteer_info
      label: Volunteer Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: volunteer_details
      label: Volunteer Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: availability
      label: Availability
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: volunteer_hours
      label: Volunteer Hours
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: first_time_volunteer
      label: First Time Volunteer
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: experience_vacation_bible_school
      label: Experience With Vacation Bible School
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: medical_condition
      label: Medical Conditions
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: volunteer_agreement
      label: Volunteer Agreement
      hint: null
      type: checkbox
      options:
      - I agree
      - I do not agree
      required: true
    - id: 11
      name: agreement
      label: I Agree
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: agreement_text
      label: Agreement Text
      hint: null
      type: text
      options: []
      required: false
