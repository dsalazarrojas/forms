inputSchema:
  type: object
  properties:
    title: Request An Appointment Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: appointment_type
      label: Appointment Type
      hint: null
      type: select_multiple
      options:
      - Consultation
      - Check-up
      - Follow-up
      - Other
      required: true
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: doctor
      label: Doctor
      hint: null
      type: select_one
      options:
      - Dr. Smith
      - Dr. Johnson
      - Dr. Wilson
      required: true
    - id: 9
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: true
