      hint: Enter order date
      type: date
      options: []
      required: false
    - id: 12
      name: entry_12
      label: Total Price
      hint: Enter total price
      type: number
      options: []
      required: false
    - id: 13
      name: entry_13
      label: Payment Status
      hint: Payment status
      type: select_one
      options:
      - Paid
      - Not Paid
      required: false
