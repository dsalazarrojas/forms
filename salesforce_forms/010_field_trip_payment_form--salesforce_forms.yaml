inputSchema:
  type: object
  properties:
    title: Field Trip Payment Form
    pages:
    - id: 1
      name: trip_details
      label: Trip Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: payment_method
      label: Payment Method
      hint: Select one of the following options.
      type: select_one
      options:
      - Bank Transfer
      - Cash
      - Credit Card
      required: true
    - id: 5
      name: student_count
      label: Student Count
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: trip_date
      label: Trip Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: payment_status
      label: Payment Status
      hint: Select one of the following options.
      type: select_one
      options:
      - Pending
      - Paid
      - Unpaid
      required: true
    - id: 10
      name: notes
      label: Notes
      hint: Optional notes for the payment.
      type: note
      options: []
      required: false
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
