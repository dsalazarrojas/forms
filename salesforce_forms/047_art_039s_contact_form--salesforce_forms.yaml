inputSchema:
  type: object
  properties:
    title: Art's Contact Form
    pages:
    - id: 1
      name: submission_date
      label: Submission Date
      hint: Date of submission
      type: date
      options: []
      required: true
    - id: 2
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: Email address for response
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone
      hint: Contact phone number
      type: text
      options: []
      required: false
    - id: 6
      name: company
      label: Company
      hint: Company name if applicable
      type: text
      options: []
      required: false
    - id: 7
      name: job_title
      label: Job Title
      hint: Your job title
      type: text
      options: []
      required: false
    - id: 8
      name: contact_reason
      label: Contact Reason
      hint: Reason for contacting us
      type: select_one
      options:
      - General Inquiry
      - Product Information
      - Pricing Request
      - Technical Support
      - Sales Inquiry
      - Partnership Opportunity
      - Feedback
      - Complaint
      - Other
      required: true
    - id: 9
      name: subject
      label: Subject
      hint: Subject of your message
      type: text
      options: []
      required: true
    - id: 10
      name: message
      label: Message
      hint: Your message or inquiry
      type: text
      options: []
      required: true
    - id: 11
      name: product_interest
      label: Product Interest
      hint: Select products you are interested in
      type: select_multiple
      options:
      - Original Artwork
      - Prints
      - Custom Commissions
      - Art Consultation
      - Framing Services
      - Art Classes
      - Gallery Events
      - Other
      required: false
    - id: 12
      name: budget_range
      label: Budget Range
      hint: Your budget range if applicable
      type: select_one
      options:
      - Under £500
      - £500 - £1,000
      - £1,000 - £5,000
      - £5,000 - £10,000
      - £10,000 - £50,000
      - Over £50,000
      - Not Sure
      required: false
    - id: 13
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we contact you
      type: select_one
      options:
      - Email
      - Phone Call
      - Text Message
      - Any Method
      required: true
    - id: 14
      name: best_time_to_contact
      label: Best Time to Contact
      hint: Best time to reach you
      type: select_one
      options:
      - Morning (9 AM - 12 PM)
      - Afternoon (12 PM - 5 PM)
      - Evening (5 PM - 8 PM)
      - Any Time
      required: false
    - id: 15
      name: urgency
      label: Urgency
      hint: How urgent is your inquiry
      type: select_one
      options:
      - Very Urgent - Within 24 Hours
      - Urgent - Within 48 Hours
      - Normal - Within 1 Week
      - Not Urgent - When Convenient
      required: true
    - id: 16
      name: how_heard
      label: How Heard
      hint: How did you hear about us
      type: select_one
      options:
      - Website
      - Social Media
      - Search Engine
      - Friend or Family
      - Advertisement
      - Gallery Visit
      - Art Fair
      - Magazine or Publication
      - Other
      required: false
    - id: 17
      name: referral_source
      label: Referral Source
      hint: Who referred you
      type: text
      options: []
      required: false
    - id: 18
      name: newsletter_signup
      label: Newsletter Signup
      hint: Would you like to receive our newsletter
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 19
      name: privacy_consent
      label: Privacy Consent
      hint: I agree to the privacy policy
      type: select_one
      options:
      - Yes - I Agree
      - false
      required: true
    - id: 20
      name: additional_information
      label: Additional Information
      hint: Any other relevant information
      type: text
      options: []
      required: false
