inputSchema:
  type: object
  properties:
    title: paypal_business_payment_form
    pages:
    - id: 1
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: business_name
      label: Business Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_email
      label: Contact E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - PayPal
      - Stripe
      - Authorize.net
      required: false
    - id: 7
      name: submit
      label: Submit
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: confirm_payment
      label: Confirm Payment
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
    - id: 9
      name: payment_method_other
      label: Other Payment Method
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: other_payment_method
      label: Other Payment Method
      hint: null
      type: text
      options: []
      required: false
