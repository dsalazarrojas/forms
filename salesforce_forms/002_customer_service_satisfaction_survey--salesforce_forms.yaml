inputSchema:
  type: object
  properties:
    title: Customer Service Satisfaction Survey
    pages:
    - id: 1
      name: customer_service_satisfaction_survey_page_1
      label: Customer Service Satisfaction Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: question_1
      label: How would you rate your overall experience with our customer service?
      hint: null
      type: select_one
      options:
      - very satisfied
      - satisfied
      - neutral
      - dissatisfied
      - not satisfied
      required: false
    - id: 3
      name: question_2
      label: How would you rate your overall experience with our customer service?
      hint: null
      type: select_multiple
      options:
      - very satisfied
      - satisfied
      - neutral
      - dissatisfied
      - not satisfied
      required: false
    - id: 4
      name: contact_method
      label: How did you contact our customer service?
      hint: null
      type: select_multiple
      options:
      - phone call
      - email
      - chat
      - in person
      - in store
      required: false
    - id: 5
      name: question_5
      label: How did you find our service?
      hint: null
      type: select_one
      options:
      - helpful
      - somewhat helpful
      - not helpful
      - very helpful
      required: false
    - id: 6
      name: question_6
      label: What did you like or dislike about your experience?
      hint: Please describe your thoughts.
      type: note
      options: []
      required: false
