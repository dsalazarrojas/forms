inputSchema:
  type: object
  properties:
    title: Traveler Preferences Form
    pages:
    - id: 1
      name: first_page
      label: First Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: destination
      label: Destination
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_departure
      label: Date of Departure
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: travel_class
      label: Travel Class
      hint: null
      type: select_one
      options:
      - Economy
      - Business
      - First Class
      required: false
    - id: 5
      name: flight_duration
      label: Flight Duration
      hint: null
      type: select_multiple
      options:
      - Less than 3 hours
      - 3-6 hours
      - More than 6 hours
      required: false
    - id: 6
      name: accommodation_type
      label: Accommodation Type
      hint: null
      type: select_one
      options:
      - Hotel
      - Resort
      - Hostel
      required: false
    - id: 7
      name: travel_agent
      label: Travel Agent
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: date_of_arrival
      label: Date of Arrival
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: travel_documents
      label: Travel Documents
      hint: null
      type: select_multiple
      options:
      - Passport
      - Visa
      - Travel Insurance
      required: false
