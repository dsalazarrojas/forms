inputSchema:
  type: object
  properties:
    title: Honeymoon Travel Information Form
    pages:
    - id: 1
      name: travel_destination
      label: travel_destination
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: travel_dates
      label: travel_dates
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: travel_type
      label: travel_type
      hint: null
      type: select_one
      options:
      - Beach
      - City
      - Adventure
      - Cruise
      - Road Trip
      required: false
    - id: 4
      name: travel_budget
      label: travel_budget
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: travel_group_size
      label: travel_group_size
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: travel_language
      label: travel_language
      hint: null
      type: select_multiple
      options:
      - English
      - Spanish
      - French
      - German
      - Italian
      - Portuguese
      required: false
    - id: 7
      name: travel_currency
      label: travel_currency
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: travel_duration
      label: travel_duration
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: travel_agent
      label: travel_agent
      hint: null
      type: text
      options: []
      required: false
