inputSchema:
  type: object
  properties:
    title: Wildlife Photographer Accommodation Form
    pages:
    - id: 1
      name: start_date
      label: start_date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: end_date
      label: end_date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: num_guests
      label: num_guests
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: special_requests
      label: special_requests
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: accommodation_type
      label: accommodation_type
      hint: House, apartment, or hotel
      type: select_multiple
      options:
      - House
      - Apartment
      - Hotel
      required: false
    - id: 6
      name: accommodation_location
      label: accommodation_location
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: equipment_type
      label: equipment_type
      hint: null
      type: select_one
      options:
      - Camera
      - Lens
      - Tripod
      - Flash
      - Microphone
      - Drone
      - Computer
      - Other
      required: false
    - id: 8
      name: special_equipment
      label: special_equipment
      hint: null
      type: text
      options: []
      required: false
