inputSchema:
  type: object
  properties:
    title: travel_declaration_form
    pages:
    - id: 1
      name: travel_status
      label: Current Travel Status
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: symptoms
      label: Symptoms of COVID-19
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: temperature
      label: Body Temperature (in Celsius)
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: travel_date
      label: Travel Date
      hint: 'Format: YYYY-MM-DD'
      type: date
      options: []
      required: true
    - id: 5
      name: travel_time
      label: Travel Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: country_visited
      label: Country Visited
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: form_submission_date
      label: Form Submission Date
      hint: 'Format: YYYY-MM-DD'
      type: date
      options: []
      required: true
