inputSchema:
  type: object
  properties:
    title: Vacation Packing Checklist Form
    pages:
    - id: 1
      name: trip_details
      label: trip_details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: destination
      label: Destination
      hint: null
      type: select_one
      options:
      - Miami
      - New Orleans
      - New York
      required: false
    - id: 3
      name: duration
      label: Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: packing_list
      label: Packing List
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: clothing
      label: Clothing
      hint: null
      type: select_multiple
      options:
      - Shirts
      - Pants
      - Socks
      required: false
    - id: 6
      name: travel_docs
      label: Travel Docs
      hint: null
      type: select_one
      options:
      - Passport
      - ID Card
      - Credit Card
      required: false
    - id: 7
      name: flight_info
      label: Flight Info
      hint: null
      type: select_multiple
      options:
      - Departure
      - Arrival
      - Flight Number
      required: false
    - id: 8
      name: hotel_info
      label: Hotel Info
      hint: null
      type: select_one
      options:
      - Name
      - Address
      - Phone
      required: false
    - id: 9
      name: car_rental
      label: Car Rental
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: travel_agents
      label: Travel Agents
      hint: null
      type: select_multiple
      options:
      - John
      - Jane
      - Joe
      required: false
    - id: 11
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
