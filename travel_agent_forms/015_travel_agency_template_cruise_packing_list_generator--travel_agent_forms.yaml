      type: text
      options: []
      required: false
    - id: 6
      name: ship_name
      label: Ship Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: cabin_type
      label: Cabin Type
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: travel_documents
      label: Travel Documents
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: packing_list
