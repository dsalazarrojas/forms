inputSchema:
  type: object
  properties:
    title: Visa Quotation Request Form
    pages:
    - id: 1
      name: travel_details
      label: Travel Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: destination
      label: Destination
      hint: null
      type: select_one
      options:
      - Australia
      - Canada
      - United States
      required: false
    - id: 3
      name: travel_type
      label: Travel Type
      hint: null
      type: select_multiple
      options:
      - Tourism
      - Business
      - Study
      required: false
    - id: 4
      name: departure_date
      label: Departure Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: return_date
      label: Return Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: travel_duration
      label: Travel Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: travel_agent
      label: Travel Agent
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: travel_agency
      label: Travel Agency
      hint: null
      type: select_one
      options:
      - Travel Agency 1
      - Travel Agency 2
      - Travel Agency 3
      required: false
    - id: 12
      name: visa_type
      label: Visa Type
      hint: null
      type: select_multiple
      options:
      - Type 1
      - Type 2
      - Type 3
      required: false
