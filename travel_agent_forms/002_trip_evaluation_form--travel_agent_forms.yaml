    - id: 6
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: client_email
      label: Client Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: client_phone
      label: Client Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: trip_notes
      label: Trip Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: event_planner
      label: Event Planner
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: trip_evaluation
      label: Trip Evaluation
      hint: null
      type: number
      options: []
      required: true
