inputSchema:
  type: object
  properties:
    title: travel_agent_business_inquiry_form
    pages:
    - id: 1
      name: client_info
      label: Client Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: travel_info
      label: Travel Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_travel
      label: Date of Travel
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: travel_agency
      label: Travel Agency
      hint: null
      type: select_multiple
      options:
      - Travel Agency A, Travel Agency B, Other
      - Other
      required: true
    - id: 5
      name: inquiry_details
      label: Inquiry Details
      hint: null
      type: note
      options: []
      required: true
    - id: 6
      name: inquiry_type
      label: Inquiry Type
      hint: null
      type: select_one
      options:
      - Travel Package Inquiry, Travel Service Inquiry
      - Other
      required: true
    - id: 7
      name: preferred_language
      label: Preferred Language
      hint: null
      type: select_one
      options:
      - English, Spanish, French, Mandarin, Other
      - Other
      required: true
    - id: 8
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
