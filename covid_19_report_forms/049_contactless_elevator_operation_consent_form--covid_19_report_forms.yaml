inputSchema:
  type: object
  properties:
    title: Contactless Elevator Operation Consent Form
    pages:
    - id: 1
      name: header
      label: -- Contactless Elevator Consent --
      hint: Collect consent for contactless elevator operation protocols
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant name
      hint: Full name of the occupant or employee
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization
      hint: Company or building name
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email address
      hint: Contact email for confirmation
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone number
      hint: Optional phone for urgent notices
      type: text
      options: []
      required: false
    - id: 6
      name: consent_statement
      label: Consent statement
      hint: Confirm you agree to participate in contactless protocols
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 7
      name: effective_date
      label: Consent effective date
      hint: Date consent becomes active
      type: date
      options: []
      required: true
    - id: 8
      name: data_use_purpose
      label: Purpose of data use
      hint: Brief description of how personal data will be used
      type: text
      options: []
      required: true
    - id: 9
      name: withdrawal_process
      label: Withdrawal process information
      hint: How to withdraw consent if needed
      type: note
      options: []
      required: false
    - id: 10
      name: additional_comments
      label: Additional comments
      hint: Any other information to note about the consent
      type: text
      options: []
      required: false
