inputSchema:
  type: object
  properties:
    title: Covid Testing Registration
    pages:
    - id: 1
      name: test_name
      label: Test Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: test_date
      label: Test Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: test_type
      label: Test Type
      hint: null
      type: select_one
      options:
      - PCR
      - Rapid Antigen Test
      - Rapid Antibody Test
      required: true
    - id: 4
      name: test_result
      label: Test Result
      hint: null
      type: select_multiple
      options:
      - Positive
      - Negative
      required: true
    - id: 5
      name: symptoms
      label: Symptoms
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: provider_name
      label: Provider Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: patient_email
      label: Patient Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: patient_phone
      label: Patient Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: patient_address
      label: Patient Address
      hint: null
      type: text
      options: []
      required: false
