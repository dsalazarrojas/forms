inputSchema:
  type: object
  properties:
    title: Student COVID 19 Self Certification And Verification Form
    pages:
    - id: 1
      name: daily_screening
      label: Daily Screening
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: question_1
      label: Do you have any of the following symptoms?
      hint: null
      type: select_multiple
      options:
      - cough
      - sore throat
      - fever
      - shortness of breath
      - muscle pains
      - headache
      - new loss of smell
      - new loss of taste
      - nausea vomiting
      - diarrhoea
      - fatigue
      - difficulty breathing
      - loss of appetite
      - runny nose
      - congestion
      - loss of speech
      - loss of taste
      - loss of smell
      - chest tightness
      - chest pain
      - loss of energy
      - loss of concentration
      - loss of sleep
      - loss of memory
      - loss of saliva
      required: true
    - id: 3
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: question_2
      label: Have you traveled recently?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: question_3
