inputSchema:
  type: object
  properties:
    title: covid_19_liability_acknowledgment_form
    pages:
    - id: 1
      name: participant_info
      label: Participant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: risk_protocol
      label: Risk Protocol
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: safety_measures
      label: Safety Measures
      hint: null
      type: select_multiple
      options:
      - Wear a face mask
      - Maintain social distancing
      - Stay home if sick
      required: false
    - id: 4
      name: liability_acknowledgment
      label: Liability Acknowledgment
      hint: null
      type: select_one
      options:
      - I understand and agree
      - I do not understand and do not agree
      required: false
    - id: 5
      name: signature
      label: Signature
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: signature_date
      label: Date
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: participant_address
      label: Participant Address
      hint: null
      type: text
      options: []
      required: false
