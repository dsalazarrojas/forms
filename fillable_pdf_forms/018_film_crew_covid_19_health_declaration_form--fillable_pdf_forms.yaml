inputSchema:
  type: object
  properties:
    title: Film Crew COVID 19 Health Declaration Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: Please read this form carefully and answer all questions
      type: note
      options: []
      required: false
    - id: 2
      name: film_crew_member_name
      label: Film Crew Member Name
      hint: Full name of the film crew member
      type: text
      options: []
      required: true
    - id: 3
      name: contact_details
      label: Contact Details
      hint: Please provide your contact details
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: medical_history
      label: Medical History
      hint: Have you experienced any medical conditions in the last 2 years?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: recent_contacts
      label: Recent Contacts
      hint: Have you had any recent contacts with someone with COVID-19?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: travel_history
      label: Travel History
      hint: Have you traveled anywhere in the last 2 weeks?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: review_status
      label: Review and Sign
      hint: Please review and sign this form
      type: text
      options: []
      required: true
    - id: 8
      name: additional_comments
      label: Additional Comments
      hint: Any additional comments or information
      type: text
      options: []
      required: false
    - id: 9
      name: contact_details_2
      label: Contact Details 2
      hint: Please provide your contact details
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
