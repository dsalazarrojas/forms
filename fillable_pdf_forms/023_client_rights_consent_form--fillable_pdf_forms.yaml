inputSchema:
  type: object
  properties:
    title: Client Rights Consent Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: client_age
      label: Age
      hint: Confirm you are 18 years or older
      type: number
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: service_type
      label: Type of Service or Treatment
      hint: null
      type: select_one
      options:
      - Healthcare
      - Therapeutic
      - Legal
      - Financial advisory
      - Fitness
      - Beauty services
      - Other
      required: true
    - id: 6
      name: provider_name
      label: Service Provider Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: consent_date
      label: Date of Consent
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: rights_acknowledgment
      label: I acknowledge that I have been informed of my rights
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 9
      name: confidentiality_agreement
      label: I understand my information will be kept confidential
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 10
      name: privacy_policy_agreement
      label: I have read and agree to the privacy policy
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 11
      name: consent_to_treatment
      label: I consent to the proposed service or treatment
      hint: null
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 12
      name: risks_acknowledged
      label: I understand the risks involved in this service
      hint: null
      type: select_one
      options:
      - Yes, I understand
      - No, I do not understand
      required: true
    - id: 13
      name: alternative_options_discussed
      label: Alternative options have been discussed with me
      hint: null
      type: select_one
      options:
      - true
      - false
      - Not applicable
      required: false
    - id: 14
      name: questions_answered
      label: All my questions have been answered satisfactorily
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 15
      name: emergency_contact
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: emergency_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: final_acknowledgment
      label: I acknowledge that I have read this form and consent to the service
      hint: null
      type: select_one
      options:
      - I agree and consent
      - I do not agree
      required: true
    - id: 18
      name: form_completion_date
      label: Date Completed
      hint: null
      type: date
      options: []
      required: true
