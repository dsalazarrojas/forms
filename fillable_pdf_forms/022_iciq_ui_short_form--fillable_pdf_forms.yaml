inputSchema:
  type: object
  properties:
    title: ICIQ UI Short Form
    pages:
    - id: 1
      name: patient_information
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: chief_complaint
      label: Chief Complaint
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: chief_complaint_date
      label: Chief Complaint Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: ui_scales
      label: Urinary Incontinence Scales
      hint: null
      type: select_multiple
      options:
      - Incontinence is not present
      - Mild
      - Moderate
      - Severe
      required: false
    - id: 5
      name: pad_worn_last_24hrs
      label: Pad worn in last 24 hours
      hint: null
      type: select_one
      options:
      - Never
      - Less than 24 hours
      - 1-2 days
      - 3-7 days
      - More than 1 week
      required: false
    - id: 6
      name: fluid_intake_last_24hrs
      label: Fluid intake in last 24 hours
      hint: null
      type: select_one
      options:
      - 0-1 L
      - 1-2 L
      - 2-3 L
      - More than 3 L
      required: false
    - id: 7
      name: bladder_control
      label: Bladder control
      hint: null
      type: select_one
      options:
      - Normal
      - Abnormal
      required: false
    - id: 8
      name: pad_used_last_24hrs
      label: Pad used in last 24 hours
      hint: null
      type: select_one
      options:
      - Never
      - 1-2 times
      - 3-5 times
      - More than 5 times
      required: false
    - id: 9
      name: continence_type
      label: Type of incontinence
      hint: null
      type: select_multiple
      options:
      - Urine leakage
      - Gas and stools
      - Fecal incontinence
      - Urine and feces
      required: false
    - id: 10
      name: pad_capacity_last_24hrs
      label: Pad capacity last 24 hours
      hint: null
      type: select_one
      options:
      - 0-1 L
      - 1-2 L
      - 2-3 L
      - More than 3 L
      required: false
    - id: 11
      name: voiding_frequency
      label: Voiding frequency
      hint: null
      type: select_one
      options:
      - Less than 1 hour
      - 1-2 hours
      - 2-4 hours
      - More than 4 hours
      required: false
    - id: 12
      name: continence_frequency
      label: Incontinence frequency
      hint: null
      type: select_one
      options:
      - Never
      - Less than 1 day
      - 1-2 days
      - 3-5 days
      - 1 week or more
      required: false
    - id: 13
      name: voided_volume_last_24hrs
      label: Volume voided last 24 hours
      hint: null
      type: select_one
      options:
      - 0-1 mL
      - 1-2 mL
      - 2-5 mL
      - More than 5 mL
      required: false
    - id: 14
      name: fluid_intake_last_24hrs_units
      label: Fluid intake last 24 hours units
      hint: null
      type: select_one
      options:
      - L
      - mL
      required: false
    - id: 15
      name: bladder_sensation
      label: Bladder sensation
      hint: null
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      required: false
    - id: 16
      name: urgency
      label: Urgency
      hint: null
      type: select_one
      options:
      - Never
      - Less than 1 hour
      - More than 1 hour
      required: false
    - id: 17
      name: frequency
      label: Frequency
      hint: null
      type: select_one
      options:
      - Never
      - Less than 1 day
      - More than 1 day
      required: false
    - id: 18
      name: nocturia_frequency
      label: Nocturia frequency
      hint: null
      type: select_one
      options:
      - Never
      - 1-2 times
      - 3-5 times
      - More than 5 times
      required: false
    - id: 19
      name: voided_volume_last_24hrs_units
      label: Volume voided last 24 hours units
      hint: null
      type: select_one
      options:
      - mL
      - L
      required: false
    - id: 20
      name: pad_used_last_24hrs_units
      label: Pad used last 24 hours units
      hint: null
      type: select_one
      options:
      - times
      - Other
      required: false
    - id: 21
      name: continence_frequency_units
      label: Incontinence frequency units
      hint: null
      type: select_one
      options:
      - times
      - days
      required: false
    - id: 22
      name: voided_volume_last_24hrs_units2
      label: Volume voided last 24 hours units2
      hint: null
      type: select_one
      options:
      - mL
      - L
      required: false
    - id: 23
      name: pad_used_last_24hrs_units2
      label: Pad used last 24 hours units2
      hint: null
      type: select_one
      options:
      - times
      - Other
      required: false
    - id: 24
      name: continence_frequency_units2
      label: Incontinence frequency units2
      hint: null
      type: select_one
      options:
      - times
      - days
      required: false
    - id: 25
      name: pad_used_last_24hrs_units3
      label: Pad used last 24 hours units3
      hint: null
      type: select_one
      options:
      - times
      - Other
      required: false
