inputSchema:
  type: object
  properties:
    title: website_handover_confirmation_form
    pages:
    - id: 1
      name: client_confirmation
      label: Client Confirmation
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: project_details
      label: Project Details
      hint: null
      type: select_one
      options:
      - Project A
      - Project B
      - Project C
      required: true
    - id: 3
      name: transfer_date
      label: Transfer Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: transfer_time
      label: Transfer Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: website_url
      label: Website URL
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: transfer_method
      label: Transfer Method
      hint: null
      type: select_multiple
      options:
      - FTP
      - SFTP
      - WebDAV
      - Other
      required: true
    - id: 7
      name: transfer_status
      label: Transfer Status
      hint: null
      type: select_one
      options:
      - Pending
      - In Progress
      - Complete
      - Cancelled
      required: true
    - id: 8
      name: confirmation_code
      label: Confirmation Code
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
