inputSchema:
  type: object
  properties:
    title: Budget Conference Entry Confirmation Form
    pages:
      - id: 1
        name: attendee_name
        label: Attendee name
        hint: Full name of conference attendee
        type: text
        options: []
        required: true
      - id: 2
        name: registration_id
        label: Registration ID
        hint: Confirmation or registration identifier
        type: text
        options: []
        required: true
      - id: 3
        name: session_choices
        label: Session choices
        hint: Selected conference sessions
        type: select_multiple
        options:
          - Keynote
          - Workshop A
          - Workshop B
          - Panel discussion
        required: false
      - id: 4
        name: special_requirements
        label: Special requirements
        hint: Dietary accessibility or mobility needs
        type: text
        options: []
        required: false
      - id: 5
        name: payment_status
        label: Payment status
        hint: Confirm registration payment status
        type: select_one
        options:
          - Paid
          - Pending
          - Waived
        required: true
      - id: 6
        name: contact_email
        label: Contact email
        hint: For conference updates
        type: email
        options: []
        required: true
      - id: 7
        name: badge_name
        label: Badge name
        hint: Name to display on badge
        type: text
        options: []
        required: false
      - id: 8
        name: confirmation_notes
        label: Confirmation notes
        hint: Additional confirmation details
        type: text
        options: []
        required: false
