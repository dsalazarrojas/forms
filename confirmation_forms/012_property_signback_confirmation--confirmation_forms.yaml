inputSchema:
  type: object
  properties:
    title: Property Signback Confirmation
    pages:
    - id: 1
      name: property_update_confirmation
      label: Property Update Confirmation
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: signature
      label: Signature
      hint: null
      type: select_one
      options:
      - '---'
      - Client Acknowledged and accepted the updates
      - Client did not understand and needs clarification
      - Client is not interested and does not want to confirm
      - Client declined to confirm
      - Other
      required: true
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date_and_time
      label: Date and Time
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: property_details
      label: Property Details
      hint: null
      type: select_multiple
      options:
      - '---'
      - Location
      - Status
      - Type
      - Other
      required: false
    - id: 10
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - '---'
      - chatjimmy
      - other
      required: true
    - id: 11
      name: assigned_date
      label: Assigned Date
      hint: null
      type: date
      options: []
      required: false
