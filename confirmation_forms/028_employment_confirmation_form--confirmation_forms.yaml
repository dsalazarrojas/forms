inputSchema:
  type: object
  properties:
    title: Employment Confirmation Form
    pages:
    - id: 1
      name: employment_confirmation_form
      label: employment_confirmation
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: confirmation_status
      label: employment_status
      hint: null
      type: select_one
      options:
      - Active
      - Terminated
      - Retired
      - Other
      required: true
    - id: 3
      name: employment_type
      label: employment_type
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      - Temporary
      required: true
    - id: 4
      name: employment_start_date
      label: employment_start_date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: false
    - id: 5
      name: employment_end_date
      label: employment_end_date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: false
    - id: 6
      name: employment_eligibility
      label: employment_eligibility
      hint: null
      type: select_one
      options:
      - Eligible
      - Ineligible
      required: true
    - id: 7
      name: employer_name
      label: employer_name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: employer_address
      label: employer_address
      hint: (optional)
      type: text
      options: []
      required: false
    - id: 9
      name: job_title
      label: job_title
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: employment_length
      label: employment_length
      hint: Number of months
      type: number
      options: []
      required: false
    - id: 11
      name: employment_notes
      label: employment_notes
      hint: (optional)
      type: text
      options: []
      required: false
    - id: 12
      name: confirmation_notes
      label: confirmation_notes
      hint: (optional)
      type: text
      options: []
      required: false
