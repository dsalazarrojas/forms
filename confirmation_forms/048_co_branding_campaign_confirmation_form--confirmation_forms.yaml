    - id: 16
      name: success_metrics
      label: Success Metrics
      hint: How will you measure success
      type: text
      options: []
      required: true
    - id: 17
      name: approval_status
      label: Campaign Approved by Both Parties
      hint: null
      type: select_one
      options:
      - Yes, Both Parties Approve
      - Pending Approval
      - Requires Revision
      required: true
