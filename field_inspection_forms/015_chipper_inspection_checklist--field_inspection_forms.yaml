inputSchema:
  type: object
  properties:
    title: Chipper Inspection Checklist
    pages:
    - id: 1
      name: inspection_information
      label: Inspection Information
      hint: Basic details about this inspection
      type: note
      options: []
      required: false
    - id: 2
      name: inspection_date
      label: Date of Inspection
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: inspection_time
      label: Time of Inspection
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: inspector_name
      label: Inspector Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: inspector_company
      label: Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: equipment_information
      label: Equipment Information
      hint: Chipper details
      type: note
      options: []
      required: false
    - id: 7
      name: equipment_id
      label: Equipment ID or Tag Number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: chipper_manufacturer
      label: Chipper Manufacturer
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: chipper_model
      label: Chipper Model
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: chipper_serial
      label: Serial Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: chipper_year
      label: Year of Manufacture
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: hours_of_operation
      label: Current Hours of Operation
      hint: Hour meter reading
      type: number
      options: []
      required: false
    - id: 13
      name: location
      label: Equipment Location
      hint: Job site or yard
      type: text
      options: []
      required: true
    - id: 14
      name: safety_inspection
      label: Safety Inspection
      hint: Critical safety items
      type: note
      options: []
      required: false
    - id: 15
      name: safety_decals
      label: Safety Decals Present and Legible
      hint: Warning labels
      type: select_one
      options:
      - Yes, all present
      - Most present
      - Some missing or faded
      - Many missing
      required: true
    - id: 16
      name: emergency_shutoff
      label: Emergency Shutoff Functional
      hint: null
      type: select_one
      options:
      - Yes, tested and working
      - Yes, appears working
      - No, needs repair
      - Not tested
      required: true
    - id: 17
      name: safety_barriers
      label: Safety Barriers and Guards in Place
      hint: Protective covers
      type: select_one
      options:
      - Yes, all in place
      - Most in place
      - Some missing
      - Many missing
      required: true
    - id: 18
      name: infeed_chute
      label: Infeed Chute Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Damaged
      required: true
    - id: 19
      name: discharge_chute
      label: Discharge Chute Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Damaged
      required: true
    - id: 20
      name: mechanical_inspection
      label: Mechanical Inspection
      hint: Component condition
      type: note
      options: []
      required: false
    - id: 21
      name: cutting_blades
      label: Cutting Blades Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair - some wear
      - Poor - needs sharpening
      - Critical - needs replacement
      required: true
    - id: 22
      name: blade_bolts
      label: Blade Bolts Tight and Secure
      hint: null
      type: select_one
      options:
      - Yes, all secure
      - Yes, checked
      - Some loose
      - Multiple loose
      required: true
    - id: 23
      name: rotor_condition
      label: Rotor Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Damaged
      required: true
    - id: 24
      name: anvil_condition
      label: Anvil Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair - some wear
      - Poor - needs adjustment
      - Critical - needs replacement
      required: true
    - id: 25
      name: anvil_gap
      label: Anvil Gap Setting
      hint: Within specification
      type: select_one
      options:
      - Yes, within spec
      - Slightly off
      - Needs adjustment
      - Not checked
      required: true
    - id: 26
      name: bearings
      label: Bearings Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Noisy or rough
      - Failed
      required: true
    - id: 27
      name: engine_inspection
      label: Engine Inspection
      hint: Power unit condition
      type: note
      options: []
      required: false
    - id: 28
      name: engine_oil_level
      label: Engine Oil Level
      hint: null
      type: select_one
      options:
      - Full
      - Adequate
      - Low
      - Very low
      - Not checked
      required: true
    - id: 29
      name: engine_oil_condition
      label: Engine Oil Condition
      hint: null
      type: select_one
      options:
      - Clean
      - Slightly dirty
      - Dirty
      - Very dirty
      - Not checked
      required: true
    - id: 30
      name: air_filter
      label: Air Filter Condition
      hint: null
      type: select_one
      options:
      - Clean
      - Slightly dirty
      - Dirty - needs cleaning
      - Clogged - needs replacement
      - Not checked
      required: true
    - id: 31
      name: fuel_system
      label: Fuel System Condition
      hint: Lines, filter, tank
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Leaks present
      required: true
    - id: 32
      name: spark_plug
      label: Spark Plug Condition
      hint: If applicable
      type: select_one
      options:
      - Good
      - Fair
      - Needs replacement
      - Not applicable
      - Not checked
      required: false
    - id: 33
      name: hydraulic_inspection
      label: Hydraulic System Inspection
      hint: If equipped
      type: note
      options: []
      required: false
    - id: 34
      name: hydraulic_fluid_level
      label: Hydraulic Fluid Level
      hint: null
      type: select_one
      options:
      - Full
      - Adequate
      - Low
      - Very low
      - Not applicable
      required: false
    - id: 35
      name: hydraulic_leaks
      label: Hydraulic Leaks Present
      hint: null
      type: select_one
      options:
      - No leaks
      - Minor seepage
      - Active dripping
      - Significant leaks
      - Not applicable
      required: false
    - id: 36
      name: hydraulic_hoses
      label: Hydraulic Hoses Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair - some wear
      - Poor - cracking
      - Not applicable
      required: false
    - id: 37
      name: tire_wheel_inspection
      label: Tire and Wheel Inspection
      hint: Trailer or wheels
      type: note
      options: []
      required: false
    - id: 38
      name: tire_condition
      label: Tire Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair - some wear
      - Poor - needs replacement
      - Not applicable
      required: true
    - id: 39
      name: tire_pressure
      label: Tire Pressure Adequate
      hint: null
      type: select_one
      options:
      - Yes, all good
      - Most good
      - Some low
      - All low
      - Not applicable
      required: true
    - id: 40
      name: lug_nuts
      label: Lug Nuts Tight and Present
      hint: null
      type: select_one
      options:
      - Yes, all secure
      - Yes, checked
      - Some loose
      - Missing lug nuts
      required: true
    - id: 41
      name: trailer_components
      label: Trailer Components
      hint: Lights, brakes, hitch
      type: note
      options: []
      required: false
    - id: 42
      name: trailer_lights
      label: Trailer Lights Functional
      hint: null
      type: select_one
      options:
      - All working
      - Most working
      - Some not working
      - None working
      - Not applicable
      required: true
    - id: 43
      name: trailer_brakes
      label: Trailer Brakes Functional
      hint: null
      type: select_one
      options:
      - Yes, tested
      - Appears functional
      - Needs attention
      - Not applicable
      required: true
    - id: 44
      name: hitch_condition
      label: Hitch Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Damaged
      required: true
    - id: 45
      name: safety_chains
      label: Safety Chains Present and Secure
      hint: null
      type: select_one
      options:
      - Yes, both secure
      - Yes, present
      - One damaged
      - Missing or damaged
      required: true
    - id: 46
      name: operational_test
      label: Operational Test
      hint: Performance check
      type: note
      options: []
      required: false
    - id: 47
      name: engine_start
      label: Engine Starts Easily
      hint: null
      type: select_one
      options:
      - Yes, immediately
      - Yes, after brief cranking
      - Difficult to start
      - Will not start
      required: true
    - id: 48
      name: engine_operation
      label: Engine Runs Smoothly
      hint: null
      type: select_one
      options:
      - Yes, smoothly
      - Yes, with minor issues
      - Runs rough
      - Will not run
      required: true
    - id: 49
      name: chipper_operation
      label: Chipper Operates Properly
      hint: Feeding and discharge
      type: select_one
      options:
      - Yes, excellent
      - Yes, acceptable
      - Some issues
      - Will not operate
      required: true
    - id: 50
      name: unusual_noises
      label: Unusual Noises Present
      hint: null
      type: select_one
      options:
      - No unusual noises
      - Minor noises
      - Concerning noises
      - Loud or severe noises
      required: true
    - id: 51
      name: excessive_vibration
      label: Excessive Vibration
      hint: null
      type: select_one
      options:
      - No vibration issues
      - Minor vibration
      - Moderate vibration
      - Severe vibration
      required: true
    - id: 52
      name: findings_summary
      label: Findings Summary
      hint: Overall assessment
      type: note
      options: []
      required: false
    - id: 53
      name: overall_condition
      label: Overall Equipment Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Critical
      required: true
    - id: 54
      name: safe_to_operate
      label: Is the chipper safe to operate
      hint: null
      type: select_one
      options:
      - Yes, safe
      - Yes, with minor concerns
      - No, needs repairs
      - No, unsafe
      required: true
    - id: 55
      name: immediate_repairs
      label: Immediate Repairs Needed
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - Blade sharpening
      - Blade replacement
      - Oil change
      - Filter replacement
      - Belt replacement
      - Hydraulic repair
      - Safety decal replacement
      - Tire replacement
      - Structural repair
      required: true
    - id: 56
      name: inspector_notes
      label: Additional Inspector Notes
      hint: Detailed observations
      type: text
      options: []
      required: false
    - id: 57
      name: recommended_action
      label: Recommended Action
      hint: null
      type: select_one
      options:
      - Continue normal operation
      - Monitor and schedule maintenance
      - Schedule repairs soon
      - Remove from service
      - Tag out - do not operate
      required: true
    - id: 58
      name: next_inspection_date
      label: Recommended Next Inspection
      hint: null
      type: date
      options: []
      required: false
    - id: 59
      name: inspector_signature
      label: Inspector Signature
      hint: null
      type: text
      options: []
      required: true
