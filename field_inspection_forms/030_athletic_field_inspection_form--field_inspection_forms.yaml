inputSchema:
  type: object
  properties:
    title: Athletic Field Inspection Form
    pages:
      - id: 1
        name: inspector_name
        label: Inspector Name
        hint: Name of person conducting inspection
        type: text
        options: []
        required: true
      - id: 2
        name: inspector_role
        label: Inspector Role
        hint: Position or title
        type: text
        options: []
        required: true
      - id: 3
        name: inspection_date
        label: Inspection Date
        hint: Date of inspection
        type: date
        options: []
        required: true
      - id: 4
        name: inspection_time
        label: Inspection Time
        hint: Time of inspection
        type: time
        options: []
        required: true
      - id: 5
        name: field_name
        label: Field Name or Number
        hint: Which field is being inspected
        type: text
        options: []
        required: true
      - id: 6
        name: field_location
        label: Field Location
        hint: Address or location description
        type: text
        options: []
        required: true
      - id: 7
        name: field_type
        label: Field Type
        hint: Type of playing surface
        type: select_one
        options:
          - Natural Grass
          - Artificial Turf
          - Hybrid Surface
          - Clay or Dirt
          - Hardwood Court
          - Track Surface
          - Other
        required: true
      - id: 8
        name: sport_usage
        label: Primary Sport Usage
        hint: What sport is played on this field
        type: select_one
        options:
          - Football
          - Soccer
          - Baseball
          - Softball
          - Lacrosse
          - Field Hockey
          - Multi-Purpose
          - Other
        required: true
      - id: 9
        name: weather_conditions
        label: Weather Conditions
        hint: Current weather
        type: select_one
        options:
          - Sunny
          - Cloudy
          - Rainy
          - Snowy
          - Foggy
          - Windy
        required: true
      - id: 10
        name: temperature
        label: Temperature
        hint: In Fahrenheit or Celsius
        type: text
        options: []
        required: false
      - id: 11
        name: recent_weather_impact
        label: Recent Weather Impact
        hint: Has weather affected field conditions
        type: select_one
        options:
          - No Impact
          - Minor Impact
          - Moderate Impact
          - Severe Impact
        required: true
      - id: 12
        name: surface_condition
        label: Overall Surface Condition
        hint: Rate the playing surface
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Unplayable
        required: true
      - id: 13
        name: surface_issues
        label: Surface Issues
        hint: Select all that apply
        type: select_multiple
        options:
          - Bare Spots
          - Uneven Surface
          - Standing Water
          - Mud or Soft Spots
          - Excessive Wear
          - Damaged Turf
          - Debris Present
          - No Issues
        required: true
      - id: 14
        name: field_markings
        label: Field Markings Condition
        hint: Are markings visible and accurate
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Need Repainting
        required: true
      - id: 15
        name: goal_posts_condition
        label: Goal Posts Condition
        hint: If applicable
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Not Applicable
          - Not Present
        required: true
      - id: 16
        name: fencing_condition
        label: Fencing Condition
        hint: Perimeter fencing status
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Damaged
          - Not Present
        required: true
      - id: 17
        name: lighting_condition
        label: Lighting Condition
        hint: Field lighting status
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Not Functional
          - Not Present
        required: true
      - id: 18
        name: drainage_condition
        label: Drainage Condition
        hint: How well does the field drain
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Unknown
        required: true
      - id: 19
        name: safety_hazards
        label: Safety Hazards Present
        hint: Select all that apply
        type: select_multiple
        options:
          - Holes or Depressions
          - Exposed Roots
          - Broken Equipment
          - Sharp Objects
          - Glass or Debris
          - Slippery Surfaces
          - Obstructed Exits
          - No Hazards
        required: true
      - id: 20
        name: hazard_description
        label: Hazard Description
        hint: Describe any hazards found
        type: text
        options: []
        required: false
      - id: 21
        name: equipment_inspection
        label: Equipment Inspection
        hint: Condition of field equipment
        type: select_one
        options:
          - All Equipment Functional
          - Minor Issues Found
          - Major Issues Found
          - Equipment Missing
          - Not Applicable
        required: true
      - id: 22
        name: field_accessibility
        label: Field Accessibility
        hint: Is field accessible for all users
        type: select_one
        options:
          - Fully Accessible
          - Partially Accessible
          - Not Accessible
          - Needs Improvements
        required: true
      - id: 23
        name: playability_status
        label: Playability Status
        hint: Is the field playable
        type: select_one
        options:
          - Fully Playable
          - Playable with Caution
          - Limited Play
          - Not Playable
          - Needs Closure
        required: true
      - id: 24
        name: maintenance_needed
        label: Maintenance Needed
        hint: Select all that apply
        type: select_multiple
        options:
          - Mowing
          - Line Painting
          - Irrigation Repair
          - Drainage Work
          - Surface Repair
          - Debris Removal
          - Equipment Repair
          - No Maintenance Needed
        required: true
      - id: 25
        name: priority_level
        label: Priority Level
        hint: Urgency of needed work
        type: select_one
        options:
          - Low Priority
          - Medium Priority
          - High Priority
          - Emergency
        required: true
      - id: 26
        name: recommended_actions
        label: Recommended Actions
        hint: What should be done
        type: text
        options: []
        required: true
      - id: 27
        name: follow_up_required
        label: Follow-Up Required
        hint: Is follow-up needed
        type: select_one
        options:
          - "Yes"
          - "No"
        required: true
      - id: 28
        name: follow_up_date
        label: Follow-Up Date
        hint: When to re-inspect
        type: date
        options: []
        required: false
      - id: 29
        name: photos_attached
        label: Photos Attached
        hint: Were photos taken
        type: select_one
        options:
          - "Yes"
          - "No"
        required: true
      - id: 30
        name: additional_notes
        label: Additional Notes
        hint: Any other observations
        type: text
        options: []
        required: false
      - id: 31
        name: inspector_signature
        label: Inspector Signature
        hint: Type full name as signature
        type: text
        options: []
        required: true
