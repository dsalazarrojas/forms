inputSchema:
  type: object
  properties:
    title: Chilled Water System Inspection Checklist
    pages:
      - id: 1
        name: inspector_name
        label: Inspector Name
        hint: Person performing the inspection
        type: text
        options: []
        required: true
      - id: 2
        name: inspection_date
        label: Inspection Date
        hint: Date of inspection
        type: date
        options: []
        required: true
      - id: 3
        name: system_id
        label: System Identifier
        hint: Building or system tag
        type: text
        options: []
        required: true
      - id: 4
        name: visual_condition
        label: Visual Condition of Equipment
        hint: Note any visible damage or corrosion
        type: select_one
        options:
          - Good
          - Acceptable
          - Needs Attention
          - Critical
        required: true
      - id: 5
        name: pressure_readings
        label: Typical Pressure Readings
        hint: Input measured pressures if available
        type: text
        options: []
        required: false
      - id: 6
        name: temperature_readings
        label: Typical Temperature Readings
        hint: Inlet and outlet temperatures
        type: text
        options: []
        required: false
      - id: 7
        name: leaks_found
        label: Leaks Found
        hint: Indicate presence of leaks
        type: select_one
        options:
          - None
          - Minor
          - Major
        required: true
      - id: 8
        name: recommended_actions
        label: Recommended Actions
        hint: Suggested repairs or maintenance tasks
        type: text
        options: []
        required: true
      - id: 9
        name: follow_up_required
        label: Follow Up Required
        hint: Does this checklist require further action
        type: select_one
        options:
          - Yes
          - No
        required: true
