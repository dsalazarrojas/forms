    - id: 4
      name: safety_officer
      label: safety_officer
      hint: null
      type: select_one
      options:
      - Facility Safety Officer
      - Maintenance Manager
      - Supervisor
      - Operations Manager
      - Safety Inspector
      - Quality Manager
      - General Manager
      required: true
    - id: 5
      name: safety_officer_email
      label: safety_officer_email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: safety_officer_phone
      label: safety_officer_phone
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: safety_inspector_id
