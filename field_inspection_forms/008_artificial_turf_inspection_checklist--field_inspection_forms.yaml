inputSchema:
  type: object
  properties:
    title: Artificial Turf Inspection Checklist
    pages:
    - id: 1
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: field_name
      label: Field Name or Location
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: field_address
      label: Field Address
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: inspector_name
      label: Inspector Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: inspector_role
      label: Inspector Role or Title
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: turf_age
      label: Turf Installation Age - Years
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: overall_condition
      label: Overall Field Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Requires Replacement
      required: true
    - id: 8
      name: surface_wear
      label: Surface Wear or Damage Assessment
      hint: null
      type: select_multiple
      options:
      - Minimal Wear
      - Moderate Wear
      - Heavy Wear
      - Bare Spots
      - Seam Separation
      - Pile Loss
      required: true
    - id: 9
      name: drainage_condition
      label: Drainage System Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 10
      name: infill_assessment
      label: Infill Material Assessment
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: perimeter_condition
      label: Perimeter and Border Condition
      hint: null
      type: select_one
      options:
      - Good
      - Minor Issues
      - Major Issues
      required: true
    - id: 12
      name: lighting_condition
      label: Lighting and Safety Features
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: maintenance_due
      label: Maintenance or Repairs Required
      hint: null
      type: select_one
      options:
      - None
      - Routine Maintenance
      - Minor Repairs
      - Major Repairs
      - Full Replacement
      required: true
    - id: 14
      name: maintenance_details
      label: Maintenance Details and Priority
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: next_inspection_date
      label: Recommended Next Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 16
      name: photos_attached
      label: Photos Attached
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 17
      name: additional_notes
      label: Additional Notes or Observations
      hint: null
      type: text
      options: []
      required: false
