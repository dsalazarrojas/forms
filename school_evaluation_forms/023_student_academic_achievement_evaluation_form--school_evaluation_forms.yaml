inputSchema:
  type: object
  properties:
    title: Student Academic Achievement Evaluation Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: grade_level
      label: Grade Level
      hint: null
      type: select_one
      options:
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: false
    - id: 5
      name: student_attendance
      label: Student Attendance
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: student_progress
      label: Student Progress
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: parent_response
      label: Parent Response
      hint: null
      type: select_multiple
      options:
      - Strongly Disagree
      - Somewhat Disagree
      - Neutral
      - Somewhat Agree
      - Strongly Agree
      required: false
    - id: 8
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: student_academic_level
      label: Student Academic Level
      hint: null
      type: select_one
      options:
      - Below Grade Level
      - On Grade Level
      - Above Grade Level
      required: false
    - id: 15
      name: student_behavior
      label: Student Behavior
      hint: null
      type: select_multiple
      options:
      - Positive
      - Negative
      - Neutral
      required: false
    - id: 16
      name: teacher_comment
      label: Teacher Comment
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: teacher_suggestion
      label: Teacher Suggestion
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: student_signature
      label: Student Signature
      hint: null
      type: select_multiple
      options:
      - Not Applicable
      - Present
      - Signature Required
      required: false
