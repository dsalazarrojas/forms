inputSchema:
  type: object
  properties:
    title: Bachelor Program Evaluation Form
    pages:
      - id: 1
        name: student_name
        label: Full Name
        hint: Your first and last name
        type: text
        options: []
        required: true
      - id: 2
        name: student_id
        label: Student ID Number
        hint: Your university ID
        type: text
        options: []
        required: true
      - id: 3
        name: email
        label: Email Address
        hint: University email preferred
        type: email
        options: []
        required: true
      - id: 4
        name: program_name
        label: Bachelor Program Name
        hint: Select your major or program
        type: select_one
        options:
          - Business Administration
          - Computer Science
          - Engineering
          - Psychology
          - Biology
          - Education
          - Communications
          - Other
        required: true
      - id: 5
        name: year_in_program
        label: Year in Program
        hint: Current academic year
        type: select_one
        options:
          - First Year
          - Second Year
          - Third Year
          - Fourth Year
          - Fifth Year or More
          - Graduated
        required: true
      - id: 6
        name: overall_satisfaction
        label: Overall Program Satisfaction
        hint: Rate your overall experience
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 7
        name: curriculum_quality
        label: Curriculum Quality
        hint: Rate the course content and structure
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 8
        name: faculty_quality
        label: Faculty Quality
        hint: Rate the teaching and support from professors
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 9
        name: academic_support
        label: Academic Support Services
        hint: Rate tutoring, advising, and resources
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 10
        name: career_preparation
        label: Career Preparation
        hint: How well does program prepare you for career
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 11
        name: learning_environment
        label: Learning Environment
        hint: Rate the overall learning atmosphere
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 12
        name: student_support
        label: Student Support and Respect
        hint: Do you feel supported and respected
        type: select_one
        options:
          - Strongly Agree
          - Agree
          - Neutral
          - Disagree
          - Strongly Disagree
        required: true
      - id: 13
        name: empowerment_level
        label: Feel Empowered in Studies
        hint: Do you feel empowered to succeed
        type: select_one
        options:
          - Strongly Agree
          - Agree
          - Neutral
          - Disagree
          - Strongly Disagree
        required: true
      - id: 14
        name: resources_availability
        label: Availability of Resources
        hint: Rate access to labs, libraries, technology
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 15
        name: class_size
        label: Class Size Satisfaction
        hint: Are class sizes appropriate
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 16
        name: internship_opportunities
        label: Internship and Practical Experience
        hint: Rate availability of hands-on experience
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
          - Not Applicable
        required: true
      - id: 17
        name: program_strengths
        label: Program Strengths
        hint: What does your program do well
        type: text
        options: []
        required: false
      - id: 18
        name: program_weaknesses
        label: Areas for Improvement
        hint: What could be improved
        type: text
        options: []
        required: false
      - id: 19
        name: would_recommend
        label: Would Recommend Program
        hint: Would you recommend this program to others
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Maybe
          - Probably No
          - Definitely No
        required: true
      - id: 20
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback about your program
        type: text
        options: []
        required: false
