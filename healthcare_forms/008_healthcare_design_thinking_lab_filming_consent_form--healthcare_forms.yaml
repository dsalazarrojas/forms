    - id: 10
      name: recording_consent_signed_by
      label: Recording Consent Signed By
      hint: null
      type: select_one
      options:
      - Participant
      - Representative
      required: false
    - id: 11
      name: participant_signature
      label: Participant's Signature
      hint: null
      type: text
      options: []
      required: false
