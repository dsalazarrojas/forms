      - Email
      - Both
      required: false
    - id: 7
      name: participant_comments
      label: Participant Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: healthcare_organization
      label: Healthcare Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: filming_consent_date
      label: Filming Consent Date
      hint: null
      type: date
      options: []
