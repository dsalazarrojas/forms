inputSchema:
  type: object
  properties:
    title: Treatment Plan Consent Form
    pages:
    - id: 1
      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: treatment_plan
      label: Treatment Plan
      hint: null
      type: text
      options: []
      required: false
