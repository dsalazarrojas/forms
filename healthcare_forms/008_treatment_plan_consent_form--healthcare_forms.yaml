      name: medical_conditions
      label: Medical Conditions
      hint: List any existing medical conditions
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: allergies
      label: Allergies
      hint: List any allergies
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
