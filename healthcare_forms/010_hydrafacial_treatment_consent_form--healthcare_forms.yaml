inputSchema:
  type: object
  properties:
    title: Hydrafacial Treatment Consent Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date Of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: treatment_options
      label: Treatment Options
      hint: null
      type: select_multiple
      options:
      - AHA
      - BHA
      - OHA
      required: true
    - id: 6
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: true
    - id: 7
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
