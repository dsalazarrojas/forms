inputSchema:
  type: object
  properties:
    title: Nova Fitness ( Body Information Form )
    pages:
    - id: 1
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: height
      label: Height
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: weight
      label: Weight
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: medical_conditions
      label: Medical Conditions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: workout_goal
      label: Workout Goal
      hint: null
      type: select_one
      options:
      - Goal 1
      - Goal 2
      - Goal 3
      required: true
    - id: 8
      name: training_frequency
      label: Training Frequency
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 9
      name: emergency_contact_info
      label: Emergency Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: emergency_contact_relationship
      label: Relationship
      hint: null
      type: text
      options: []
      required: false
