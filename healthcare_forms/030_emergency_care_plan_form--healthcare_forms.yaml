inputSchema:
  type: object
  properties:
    title: Emergency Care Plan Form
    pages:
    - id: 1
      name: general_information
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: patient_medical_conditions
      label: Patient Medical Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: emergency_contacts
      label: Emergency Contacts
      hint: null
      type: select_multiple
      options:
      - Primary Contact
      - Secondary Contact
      - Doctor's Name
      - Doctor's Phone
      required: false
    - id: 4
      name: medications
      label: Medications
      hint: null
      type: select_one
      options:
      - None
      - Aspirin
      - Blood Pressure Medication
      - Insuline
      - Oxygen
      - Other
      required: false
