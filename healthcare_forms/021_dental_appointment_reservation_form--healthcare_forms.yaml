inputSchema:
  type: object
  properties:
    title: Dental Appointment Reservation Form
    pages:
    - id: 1
      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: appointment_details
      label: Appointment Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: available_doctor
      label: Available Doctor
      hint: null
      type: select_one
      options:
      - Doctor 1
      - Doctor 2
      - Doctor 3
      required: false
    - id: 4
      name: appointment_time
      label: Appointment Time
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: appointment_duration
      label: Appointment Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: patient_email
      label: Patient Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: patient_phone
      label: Patient Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: doctor_name
      label: Doctor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - Insurance
      required: false
    - id: 11
      name: payment_status
      label: Payment Status
      hint: null
      type: select_multiple
      options:
      - Paid
      - Unpaid
      - Partially Paid
      required: false
    - id: 12
      name: doctor_specialty
      label: Doctor Specialty
      hint: null
      type: select_multiple
      options:
      - General Dentistry
      - Orthodontics
      - Oral Surgery
      required: false
    - id: 13
      name: appointment_status
      label: Appointment Status
      hint: null
      type: select_one
      options:
      - Scheduled
      - Confirmed
      - Cancelled
      required: false
    - id: 14
      name: doctor_shift
      label: Doctor Shift
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      required: false
