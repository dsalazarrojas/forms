inputSchema:
  type: object
  properties:
    title: Workplace Safety And Concerns Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_method
      label: Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - In Person
      required: false
    - id: 3
      name: workplace_location
      label: Workplace Location
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: symptoms
      label: Symptoms
      hint: null
      type: select_multiple
      options:
      - Fever
      - Cough
      - Shortness Of Breath
      required: false
    - id: 6
      name: test_results
      label: Test Results
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Pending
      required: false
    - id: 7
      name: quarantine_status
      label: Quarantine Status
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: travel_history
      label: Travel History
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: exposure_status
      label: Exposure Status
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: workplace_safety_measures
      label: Workplace Safety Measures
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: follow_up_instructions
      label: Follow Up Instructions
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: employee_signature
      label: Employee Signature
      hint: null
      type: text
      options: []
      required: false
