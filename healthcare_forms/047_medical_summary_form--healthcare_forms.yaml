inputSchema:
  type: object
  properties:
    title: medical_summary_form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: birthdate
      label: Birthdate
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: medical_condition
      label: Medical Condition
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: medical_history
      label: Medical History
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: medication
      label: Medication
      hint: List any medications you are currently taking
      type: text
      options: []
      required: false
    - id: 6
      name: allergies
      label: Allergies
      hint: null
      type: text
      options: []
      required: false
