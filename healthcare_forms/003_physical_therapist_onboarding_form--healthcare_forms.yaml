inputSchema:
  type: object
  properties:
    title: Physical Therapist Onboarding Form
    pages:
    - id: 1
      name: clinic_name
      label: Clinic Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: therapist_name
      label: Therapist Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: schedule_type
      label: Schedule Type
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: false
    - id: 4
      name: schedule_time
      label: Schedule Time
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: credential_type
      label: Credential Type
      hint: null
      type: select_multiple
      options:
      - PT License
      - Physical Therapist
      - Doctor
      - Other
      required: false
    - id: 6
      name: credential_verification
      label: Credential Verification
      hint: null
      type: select_multiple
      options:
      - Verified
      - Not Verified
      - Pending
      required: false
    - id: 7
      name: schedule_frequency
      label: Schedule Frequency
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Biweekly
      required: false
    - id: 8
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
