inputSchema:
  type: object
  properties:
    title: social-worker-interview-form
    pages:
    - id: 1
      name: client_info
      label: Client Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_methods
      label: Contact Methods
      hint: null
      type: select_multiple
      options:
      - phone
      - email
      required: false
    - id: 3
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: medication_list
      label: Medication List
      hint: null
      type: select_one
      options:
      - Aspirin
      - Ibuprofen
      required: false
    - id: 5
      name: allergies
      label: Allergies
      hint: null
      type: select_multiple
      options:
      - Penicillin
      - Ibuprofen
      required: false
    - id: 6
      name: social_workers
      label: Social Workers
      hint: null
      type: select_multiple
      options:
      - Social Worker 1
      - Social Worker 2
      required: false
