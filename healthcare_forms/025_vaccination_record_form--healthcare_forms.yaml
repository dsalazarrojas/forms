      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: facility_address
      label: Facility Address
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: patient_phone
      label: Patient's Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: doctor_phone
      label: Doctor's Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
