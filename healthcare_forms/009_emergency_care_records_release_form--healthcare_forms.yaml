inputSchema:
  type: object
  properties:
    title: Emergency Care Records Release Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: provider_name
      label: Provider Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: record_access_date
      label: Record Access Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: record_type
      label: Record Type
      hint: null
      type: select_multiple
      options:
      - Medical Record
      - Surgical Record
      - Lab Results
      - Prescription Information
      required: false
    - id: 5
      name: authorization_type
      label: Authorization Type
      hint: null
      type: select_one
      options:
      - Authorization to View
      - Authorization to Share
      - Authorization to Copy
      required: false
    - id: 6
      name: authorized_party
      label: Authorized Party
      hint: null
      type: select_one
      options:
      - Patient
      - Parent or Guardian
      - Authorized Representative
      required: false
    - id: 7
      name: expiration_date
      label: Expiration Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: record_access_status
      label: Record Access Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      - Denied
      required: false
