inputSchema:
  type: object
  properties:
    title: Employee Pre-Return Work Health Questionnaire
    pages:
    - id: 1
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: symptoms
      label: Symptoms
      hint: null
      type: select_multiple
      options:
      - Fever
      - Fatigue
      - Cough
      - Sore Throat
      required: true
    - id: 6
      name: medical_condition
      label: Medical Condition
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: return_date
      label: Return Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: work_hours
      label: Work Hours
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: work_days
      label: Work Days
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
