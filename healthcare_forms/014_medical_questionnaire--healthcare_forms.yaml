inputSchema:
  type: object
  properties:
    title: medical_questionnaire
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: medical_questionnaire_1
      label: Have you taken any medication in the last 24 hours?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: medical_conditions
      label: Do you have any medical conditions?
      hint: null
      type: select_multiple
      options:
      - Yes (with diabetes)
      - Yes (with allergies)
      required: false
    - id: 5
      name: contact_information
      label: Contact Information
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: prescription_medications
      label: Do you take any prescription medications?
      hint: null
      type: select_multiple
      options:
      - Yes (with medication X)
      - Yes (with medication Y)
      required: false
    - id: 7
      name: supplements
      label: Do you take any supplements?
      hint: null
      type: select_multiple
      options:
      - Yes (with vitamin X)
      - Yes (with supplement Y)
      required: false
    - id: 8
      name: allergies
      label: Do you have any allergies?
      hint: null
      type: select_multiple
      options:
      - Yes (food allergy)
      - Yes (medication allergy)
      required: false
    - id: 9
      name: medical_procedures
      label: Do you have any medical procedures or surgeries planned?
      hint: null
      type: select_multiple
      options:
      - Option A
      - Option B
      required: false
    - id: 10
      name: medical_tests
      label: Do you take any medical tests or screenings regularly?
      hint: null
      type: select_multiple
      options:
      - Yes (with blood test)
      - Yes (with X-ray)
      required: false
    - id: 11
      name: mental_health
      label: Do you take any medications for mental health?
      hint: null
      type: select_multiple
      options:
      - Yes (with medication X)
      - Yes (with medication Y)
      required: false
    - id: 12
      name: medical_questionnaire_12
      label: Medical Questionnaire
      hint: null
      type: text
      options: []
      required: false
