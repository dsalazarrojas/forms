inputSchema:
  type: object
  properties:
    title: Cancer Treatment Discharge Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Full Name
      hint: Legal name
      type: text
      options: []
      required: true
    - id: 2
      name: patient_id
      label: Patient ID or MRN
      hint: Medical record number
      type: text
      options: []
      required: true
    - id: 3
      name: patient_dob
      label: Patient Date of Birth
      hint: Birth date
      type: date
      options: []
      required: true
    - id: 4
      name: patient_gender
      label: Gender
      hint: Gender identity
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      required: false
    - id: 5
      name: patient_address
      label: Home Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 6
      name: patient_phone
      label: Patient Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 7
      name: patient_email
      label: Patient Email Address
      hint: Email address
      type: email
      options: []
      required: false
    - id: 8
      name: primary_oncologist
      label: Primary Oncologist Name
      hint: Treating physician
      type: text
      options: []
      required: true
    - id: 9
      name: cancer_diagnosis
      label: Cancer Diagnosis
      hint: Type and stage
      type: text
      options: []
      required: true
    - id: 10
      name: treatment_type
      label: Treatment Type Received
      hint: Type of cancer treatment
      type: select_multiple
      options:
      - Chemotherapy
      - Radiation therapy
      - Immunotherapy
      - Hormone therapy
      - Targeted therapy
      - Surgery
      - Stem cell transplant
      - Clinical trial
      required: true
    - id: 11
      name: treatment_start_date
      label: Treatment Start Date
      hint: When treatment began
      type: date
      options: []
      required: true
    - id: 12
      name: treatment_end_date
      label: Treatment End Date
      hint: Date treatment completed
      type: date
      options: []
      required: true
    - id: 13
      name: treatment_cycles_completed
      label: Number of Treatment Cycles Completed
      hint: Total cycles
      type: number
      options: []
      required: false
    - id: 14
      name: treatment_response
      label: Response to Treatment
      hint: How did patient respond
      type: select_one
      options:
      - Complete response - no evidence of disease
      - Partial response - significant improvement
      - Stable disease - no change
      - Progressive disease - worsened
      - Unable to assess
      required: true
    - id: 15
      name: discharge_instructions
      label: Discharge Instructions
      hint: Care instructions for patient
      type: text
      options: []
      required: true
    - id: 16
      name: medication_list
      label: Current Medication List
      hint: All medications with dosages
      type: text
      options: []
      required: true
    - id: 17
      name: medication_instructions
      label: Medication Instructions
      hint: How to take medications
      type: text
      options: []
      required: true
    - id: 18
      name: side_effects_to_monitor
      label: Side Effects to Monitor
      hint: Warning signs to watch for
      type: select_multiple
      options:
      - Fever over 100.4 F
      - Severe pain
      - Unusual bleeding
      - Shortness of breath
      - Chest pain
      - Severe nausea or vomiting
      - Signs of infection
      - Severe fatigue
      - Confusion or dizziness
      - Other
      required: true
    - id: 19
      name: activity_restrictions
      label: Activity Restrictions
      hint: What activities to avoid
      type: text
      options: []
      required: false
    - id: 20
      name: dietary_recommendations
      label: Dietary Recommendations
      hint: Food and nutrition guidance
      type: text
      options: []
      required: false
    - id: 21
      name: follow_up_appointment_date
      label: Next Follow-up Appointment Date
      hint: Scheduled appointment
      type: date
      options: []
      required: true
    - id: 22
      name: follow_up_location
      label: Follow-up Appointment Location
      hint: Where is appointment
      type: text
      options: []
      required: true
    - id: 23
      name: follow_up_provider
      label: Follow-up Provider Name
      hint: Who is the appointment with
      type: text
      options: []
      required: true
    - id: 24
      name: lab_work_needed
      label: Is Lab Work Needed
      hint: Blood tests required
      type: select_one
      options:
      - Yes - before next appointment
      - Yes - at next appointment
      - No - not currently needed
      - As directed by physician
      required: true
    - id: 25
      name: imaging_needed
      label: Is Imaging Required
      hint: Scans or X-rays needed
      type: select_one
      options:
      - Yes - CT scan
      - Yes - MRI
      - Yes - PET scan
      - Yes - X-ray
      - Yes - Ultrasound
      - No - not currently needed
      required: false
    - id: 26
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Primary contact person
      type: text
      options: []
      required: true
    - id: 27
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 28
      name: when_to_call_doctor
      label: When to Call the Doctor
      hint: Specific situations requiring medical attention
      type: text
      options: []
      required: true
    - id: 29
      name: when_to_go_to_er
      label: When to Go to Emergency Room
      hint: Emergency warning signs
      type: text
      options: []
      required: true
    - id: 30
      name: support_services_available
      label: Available Support Services
      hint: Resources for patient
      type: select_multiple
      options:
      - Counseling services
      - Support groups
      - Nutrition counseling
      - Physical therapy
      - Social work services
      - Financial counseling
      - Palliative care
      - None selected
      required: false
    - id: 31
      name: patient_questions_addressed
      label: Were All Patient Questions Addressed
      hint: Patient understanding
      type: select_one
      options:
      - Yes - all questions answered
      - Mostly - few remaining questions
      - No - needs follow-up call
      required: true
    - id: 32
      name: discharge_plan_understood
      label: Does Patient Understand Discharge Plan
      hint: Comprehension check
      type: select_one
      options:
      - Yes - fully understands
      - Partially - some clarification needed
      - No - needs review
      required: true
    - id: 33
      name: physician_name
      label: Discharging Physician Name
      hint: Doctor name
      type: text
      options: []
      required: true
    - id: 34
      name: discharge_date
      label: Discharge Date
      hint: Date of discharge
      type: date
      options: []
      required: true
