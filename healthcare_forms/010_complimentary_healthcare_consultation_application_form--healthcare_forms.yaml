inputSchema:
  type: object
  properties:
    title: Complimentary Healthcare Consultation Application Form
    pages:
    - id: 1
      name: patient_full_name
      label: Patient Full Name
      hint: Enter your complete legal name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: Your birth date
      type: date
      options: []
      required: true
    - id: 3
      name: gender
      label: Gender
      hint: Select your gender
      type: select_one
      options:
      - Male
      - Female
      - Other
      - Prefer Not to Say
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Your email for appointment confirmation
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 6
      name: address
      label: Street Address
      hint: Your home address
      type: text
      options: []
      required: true
    - id: 7
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: true
    - id: 8
      name: state
      label: State
      hint: Your state or province
      type: text
      options: []
      required: true
    - id: 9
      name: zip_code
      label: ZIP Code
      hint: Your postal code
      type: text
      options: []
      required: true
    - id: 10
      name: insurance_status
      label: Insurance Status
      hint: Do you have health insurance
      type: select_one
      options:
      - Yes, Private Insurance
      - Yes, Government Insurance
      - No, Uninsured
      - Unsure
      required: true
    - id: 11
      name: consultation_type
      label: Consultation Type
      hint: What type of consultation are you seeking
      type: select_one
      options:
      - General Health Checkup
      - Nutrition Consultation
      - Mental Health Consultation
      - Chronic Disease Management
      - Preventive Care
      - Specialist Referral
      - Follow Up Consultation
      - Other
      required: true
    - id: 12
      name: primary_concern
      label: Primary Health Concern
      hint: Briefly describe your main health concern
      type: text
      options: []
      required: true
    - id: 13
      name: current_medications
      label: Current Medications
      hint: List any medications you are currently taking
      type: text
      options: []
      required: false
    - id: 14
      name: medical_history
      label: Relevant Medical History
      hint: List any significant medical conditions or surgeries
      type: text
      options: []
      required: false
    - id: 15
      name: family_medical_history
      label: Family Medical History
      hint: Any significant family health conditions
      type: text
      options: []
      required: false
    - id: 16
      name: preferred_appointment_date
      label: Preferred Appointment Date
      hint: When would you like your consultation
      type: date
      options: []
      required: true
    - id: 17
      name: preferred_appointment_time
      label: Preferred Appointment Time
      hint: Preferred time of day
      type: select_one
      options:
      - Morning (8 AM - 12 PM)
      - Afternoon (12 PM - 4 PM)
      - Evening (4 PM - 7 PM)
      required: false
    - id: 18
      name: appointment_location
      label: Appointment Location Preference
      hint: Where would you like to meet
      type: select_one
      options:
      - Main Clinic
      - Satellite Office
      - Telehealth Video Call
      - Phone Consultation
      required: true
    - id: 19
      name: language_preference
      label: Language Preference
      hint: Preferred language for consultation
      type: select_one
      options:
      - English
      - Spanish
      - Mandarin
      - French
      - Other
      required: true
    - id: 20
      name: how_did_you_hear
      label: How Did You Hear About Us
      hint: How did you learn about this service
      type: select_one
      options:
      - Website
      - Social Media
      - Doctor Referral
      - Friend or Family
      - Community Event
      - Advertisement
      - Other
      required: false
    - id: 21
      name: consent_to_treatment
      label: Consent to Treatment
      hint: I consent to receive healthcare services
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 22
      name: privacy_policy_acknowledgment
      label: Privacy Policy Acknowledgment
      hint: I acknowledge that I have read the privacy policy
      type: select_one
      options:
      - Yes, I acknowledge
      - No, I have not read it
      required: true
    - id: 23
      name: additional_information
      label: Additional Information
      hint: Any other information you would like to share
      type: text
      options: []
      required: false
