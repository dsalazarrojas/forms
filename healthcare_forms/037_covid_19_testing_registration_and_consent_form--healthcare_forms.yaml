inputSchema:
  type: object
  properties:
    title: COVID 19 Testing Registration And Consent Form
    pages:
    - id: 1
      name: registration_date
      label: Registration Date
      hint: Date of registration
      type: date
      options: []
      required: true
    - id: 2
      name: patient_first_name
      label: First Name
      hint: Legal first name
      type: text
      options: []
      required: true
    - id: 3
      name: patient_last_name
      label: Last Name
      hint: Legal last name
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 5
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      - Other
      required: true
    - id: 6
      name: race
      label: Race
      hint: For demographic reporting
      type: select_one
      options:
      - American Indian or Alaska Native
      - Asian
      - Black or African American
      - Native Hawaiian or Other Pacific Islander
      - White
      - Other
      - Prefer not to say
      required: false
    - id: 7
      name: ethnicity
      label: Ethnicity
      hint: For demographic reporting
      type: select_one
      options:
      - Hispanic or Latino
      - Not Hispanic or Latino
      - Prefer not to say
      required: false
    - id: 8
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 9
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 10
      name: address
      label: Home Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 11
      name: city
      label: City
      hint: City
      type: text
      options: []
      required: true
    - id: 12
      name: state
      label: State
      hint: State
      type: text
      options: []
      required: true
    - id: 13
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 14
      name: insurance_status
      label: Do you have health insurance
      hint: Insurance coverage
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 15
      name: insurance_provider
      label: Insurance Provider
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 16
      name: insurance_policy_number
      label: Insurance Policy Number
      hint: Member ID
      type: text
      options: []
      required: false
    - id: 17
      name: primary_care_physician
      label: Primary Care Physician Name
      hint: Your doctor
      type: text
      options: []
      required: false
    - id: 18
      name: physician_phone
      label: Physician Phone
      hint: Office number
      type: text
      options: []
      required: false
    - id: 19
      name: healthcare_worker
      label: Are you a healthcare worker
      hint: Healthcare employment
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 20
      name: essential_worker
      label: Are you an essential worker
      hint: Essential industry
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 21
      name: occupation
      label: Occupation
      hint: Job or profession
      type: text
      options: []
      required: false
    - id: 22
      name: underlying_conditions
      label: Do you have any underlying medical conditions
      hint: High-risk conditions
      type: select_multiple
      options:
      - None
      - Heart disease
      - Lung disease
      - Diabetes
      - Obesity
      - Cancer
      - Kidney disease
      - Immunocompromised
      - Pregnancy
      required: true
    - id: 23
      name: current_symptoms
      label: Are you currently experiencing any COVID-19 symptoms
      hint: Symptom status
      type: select_one
      options:
      - false
      - true
      required: true
    - id: 24
      name: symptom_list
      label: Which symptoms
      hint: Select all that apply
      type: select_multiple
      options:
      - Fever or chills
      - Cough
      - Shortness of breath
      - Fatigue
      - Muscle aches
      - Headache
      - Loss of taste or smell
      - Sore throat
      - Congestion
      - Nausea or vomiting
      - Diarrhea
      required: false
    - id: 25
      name: symptom_onset_date
      label: When did symptoms start
      hint: If applicable
      type: date
      options: []
      required: false
    - id: 26
      name: exposure_history
      label: Have you been exposed to someone with COVID-19
      hint: Exposure history
      type: select_one
      options:
      - false
      - true
      - Not sure
      required: true
    - id: 27
      name: previous_covid_test
      label: Have you been tested for COVID-19 before
      hint: Testing history
      type: select_one
      options:
      - No never tested
      - Yes tested negative
      - Yes tested positive
      required: true
    - id: 28
      name: vaccination_status
      label: What is your COVID-19 vaccination status
      hint: Vaccination status
      type: select_one
      options:
      - Fully vaccinated with booster
      - Fully vaccinated
      - Partially vaccinated
      - Not vaccinated
      required: true
    - id: 29
      name: preferred_test_date
      label: Preferred Test Date
      hint: When to test
      type: date
      options: []
      required: true
    - id: 30
      name: preferred_test_time
      label: Preferred Test Time
      hint: Time preference
      type: time
      options: []
      required: false
    - id: 31
      name: testing_location_preference
      label: Preferred Testing Location
      hint: Where to test
      type: select_one
      options:
      - Main testing site
      - Drive-through location
      - Mobile testing unit
      - Any available location
      required: true
    - id: 32
      name: result_delivery_method
      label: How would you like to receive results
      hint: Result delivery
      type: select_one
      options:
      - Email
      - Text message
      - Phone call
      - Patient portal
      - Mail
      required: true
    - id: 33
      name: testing_consent
      label: I consent to COVID-19 testing
      hint: Testing consent
      type: select_one
      options:
      - Yes I consent
      - No I do not consent
      required: true
    - id: 34
      name: data_sharing_consent
      label: I consent to my test results being shared with public health authorities
        as required by law
      hint: Data sharing consent
      type: select_one
      options:
      - Yes I consent
      - No I do not consent
      required: true
    - id: 35
      name: hipaa_acknowledgment
      label: I acknowledge receipt of the HIPAA Privacy Notice
      hint: HIPAA acknowledgment
      type: select_one
      options:
      - Yes acknowledged
      - No not received
      required: true
    - id: 36
      name: financial_responsibility
      label: I understand I am financially responsible for any charges not covered
        by insurance
      hint: Financial agreement
      type: select_one
      options:
      - Yes I understand
      - No I do not agree
      required: true
    - id: 37
      name: patient_signature_date
      label: Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
