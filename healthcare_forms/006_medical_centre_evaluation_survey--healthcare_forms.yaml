inputSchema:
  type: object
  properties:
    title: Medical Centre Evaluation Survey
    pages:
    - id: 1
      name: overall_satisfaction
      label: What's your overall satisfaction with our medical centre?
      hint: Rate on a scale of 1-5.
      type: number
      options: []
      required: true
    - id: 2
      name: visited_department
      label: Which department did you visit?
      hint: Select one of the following options.
      type: select_one
      options:
      - Emergency
      - General Practitioner
      - Specialist
      - Other (please specify)
      - None of the above
      required: true
    - id: 3
      name: visited_time
      label: What time of day did you visit the medical centre?
      hint: Select from the following times.
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      - Other (please specify)
      required: true
    - id: 4
      name: waited_time
      label: How long have you waited for services?
      hint: Please select the closest estimate.
      type: select_one
      options:
      - Less than 5 minutes
      - 5-15 minutes
      - 16-30 minutes
      - 31-60 minutes
      - More than 1 hour
      required: true
    - id: 5
      name: comments
      label: Comments about your visit?
      hint: Share any feedback or suggestions.
      type: note
      options: []
      required: true
    - id: 6
      name: contact_info
      label: Contact information?
      hint: Please provide your email or phone number.
      type: text
      options: []
      required: true
    - id: 7
      name: follow_up
      label: Will you be visiting us again?
      hint: null
      type: text
      options: []
      required: false
