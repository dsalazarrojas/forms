inputSchema:
  type: object
  properties:
    title: Brain Fitness Score Template
    pages:
    - id: 1
      name: patient_first_name
      label: First Name
      hint: Patient first name
      type: text
      options: []
      required: true
    - id: 2
      name: patient_last_name
      label: Last Name
      hint: Patient last name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 4
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      required: true
    - id: 5
      name: assessment_date
      label: Assessment Date
      hint: Date of evaluation
      type: date
      options: []
      required: true
    - id: 6
      name: evaluator_name
      label: Evaluator Name
      hint: Name of healthcare provider
      type: text
      options: []
      required: true
    - id: 7
      name: education_level
      label: Education Level
      hint: Highest level completed
      type: select_one
      options:
      - Less than high school
      - High school graduate
      - Some college
      - College graduate
      - Graduate degree
      required: true
    - id: 8
      name: primary_language
      label: Primary Language
      hint: Native or primary language
      type: text
      options: []
      required: true
    - id: 9
      name: handedness
      label: Handedness
      hint: Dominant hand
      type: select_one
      options:
      - Right-handed
      - Left-handed
      - Ambidextrous
      required: false
    - id: 10
      name: memory_score
      label: Memory Score
      hint: Score from memory assessment
      type: number
      options: []
      required: true
    - id: 11
      name: memory_max_score
      label: Memory Maximum Score
      hint: Maximum possible memory score
      type: number
      options: []
      required: true
    - id: 12
      name: attention_score
      label: Attention Score
      hint: Score from attention assessment
      type: number
      options: []
      required: true
    - id: 13
      name: attention_max_score
      label: Attention Maximum Score
      hint: Maximum possible attention score
      type: number
      options: []
      required: true
    - id: 14
      name: executive_function_score
      label: Executive Function Score
      hint: Score from executive function assessment
      type: number
      options: []
      required: true
    - id: 15
      name: executive_function_max_score
      label: Executive Function Maximum Score
      hint: Maximum possible executive function score
      type: number
      options: []
      required: true
    - id: 16
      name: processing_speed_score
      label: Processing Speed Score
      hint: Score from processing speed assessment
      type: number
      options: []
      required: true
    - id: 17
      name: processing_speed_max_score
      label: Processing Speed Maximum Score
      hint: Maximum possible processing speed score
      type: number
      options: []
      required: true
    - id: 18
      name: language_score
      label: Language Score
      hint: Score from language assessment
      type: number
      options: []
      required: true
    - id: 19
      name: language_max_score
      label: Language Maximum Score
      hint: Maximum possible language score
      type: number
      options: []
      required: true
    - id: 20
      name: visuospatial_score
      label: Visuospatial Score
      hint: Score from visuospatial assessment
      type: number
      options: []
      required: true
    - id: 21
      name: visuospatial_max_score
      label: Visuospatial Maximum Score
      hint: Maximum possible visuospatial score
      type: number
      options: []
      required: true
    - id: 22
      name: total_score
      label: Total Score
      hint: Sum of all domain scores
      type: number
      options: []
      required: true
    - id: 23
      name: total_max_score
      label: Total Maximum Score
      hint: Maximum possible total score
      type: number
      options: []
      required: true
    - id: 24
      name: brain_fitness_rating
      label: Brain Fitness Rating
      hint: Overall rating based on scores
      type: select_one
      options:
      - Excellent (90-100%)
      - Very Good (80-89%)
      - Good (70-79%)
      - Fair (60-69%)
      - Below Average (50-59%)
      - Impaired (below 50%)
      required: true
    - id: 25
      name: cognitive_concerns
      label: Cognitive Concerns
      hint: Any reported cognitive issues
      type: text
      options: []
      required: false
    - id: 26
      name: medical_history
      label: Relevant Medical History
      hint: Any neurological conditions
      type: text
      options: []
      required: false
    - id: 27
      name: medications
      label: Current Medications
      hint: List all medications
      type: text
      options: []
      required: false
    - id: 28
      name: sleep_quality
      label: Sleep Quality
      hint: Rate sleep quality
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 29
      name: exercise_frequency
      label: Exercise Frequency
      hint: How often do you exercise
      type: select_one
      options:
      - Daily
      - 3-5 times per week
      - 1-2 times per week
      - Rarely
      - Never
      required: true
    - id: 30
      name: recommendations
      label: Recommendations
      hint: Suggestions for improvement
      type: text
      options: []
      required: false
    - id: 31
      name: follow_up_needed
      label: Follow-up Needed
      hint: Is follow-up assessment recommended
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 32
      name: follow_up_date
      label: Follow-up Date
      hint: When to reassess
      type: date
      options: []
      required: false
    - id: 33
      name: evaluator_signature
      label: Evaluator Signature
      hint: Electronic signature
      type: text
      options: []
      required: true
