inputSchema:
  type: object
  properties:
    title: Patient Intake Form
    pages:
    - id: 1
      name: patient_information
      label: Patient Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_details
      label: Contact Details
      hint: Enter patient contact information
      type: text
      options: []
      required: false
    - id: 3
      name: med_history
      label: Medical History
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: health_problems
      label: Health Problems
      hint: Select all that apply
      type: select_multiple
      options:
      - Heart Issues
      - Diabetes
      - Hypertension
      required: false
    - id: 5
      name: med_conditions
      label: Medical Conditions
      hint: null
      type: select_multiple
      options:
      - Allergies
      - Medications
      - Previous Surgeries
      required: false
    - id: 6
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Decline
      required: false
    - id: 7
      name: terms_and_conditions
      label: Terms and Conditions
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: emergency_contact
      label: Emergency Contact
      hint: Enter emergency contact information
      type: text
      options: []
      required: false
    - id: 9
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: false
