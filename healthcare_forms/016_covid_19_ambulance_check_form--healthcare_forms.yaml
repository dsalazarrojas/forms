          - "No"
          - "Sufficient"
          - "Low Stock"
        required: false
      - id: 10
        name: gloves_available
        label: Gloves Available
        hint: null
        type: select_one
        options:
          - "Yes"
          - "No"
          - "Sufficient"
          - "Low Stock"
        required: false
      - id: 11
        name: face_shields_available
        label: Face Shields Available
        hint: null
        type: select_one
        options:
          - "Yes"
          - "No"
          - "Sufficient"
          - "Low Stock"
        required: false
      - id: 12
        name: disinfection_supplies
        label: Disinfection and Cleaning Supplies Available
        hint: null
        type: select_one
        options:
          - "Yes"
          - "No"
          - "Sufficient"
          - "Low Stock"
        required: true
