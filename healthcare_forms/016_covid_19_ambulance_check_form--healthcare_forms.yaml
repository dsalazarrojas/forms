          - "Good - Minor Issues"
          - "Fair - Maintenance Needed"
          - "Poor - Out of Service"
        required: true
      - id: 21
        name: recommendations
        label: Recommendations or Repairs Needed
        hint: List any actions required
        type: text
        options: []
        required: false
      - id: 22
        name: approval_status
        label: Inspection Approval Status
        hint: null
        type: select_one
        options:
          - "Approved - Operational"
          - "Approved with Conditions"
