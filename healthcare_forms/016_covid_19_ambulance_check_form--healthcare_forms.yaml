          - "Mostly Clean"
          - "Needs Cleaning"
          - "Not Acceptable"
        required: true
      - id: 14
        name: ventilation_system
        label: Ventilation System Operational
        hint: Is air circulation working properly?
        type: select_one
        options:
          - "Yes"
          - "No"
          - "Partially"
          - "Unknown"
        required: false
      - id: 15
        name: equipment_functional
        label: All Medical Equipment Functional
        hint: Monitors, defibrillator, suction, etc.
        type: select_one
        options:
          - "Yes"
          - "No"
          - "Mostly"
          - "Needs Repair"
