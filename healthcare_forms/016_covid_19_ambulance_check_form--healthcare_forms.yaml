inputSchema:
  type: object
  properties:
    title: COVID 19 Ambulance Check Form
    pages:
      - id: 1
        name: inspection_date
        label: Inspection Date
        hint: Date of ambulance inspection
        type: date
        options: []
        required: true
      - id: 2
        name: inspection_time
        label: Inspection Time
        hint: null
        type: time
        options: []
        required: true
      - id: 3
        name: ambulance_unit_number
        label: Ambulance Unit Number
        hint: Vehicle identification number
        type: text
        options: []
        required: true
      - id: 4
        name: vehicle_type
        label: Vehicle Type
        hint: null
        type: select_one
        options:
          - ALS Ambulance
          - BLS Ambulance
          - Rescue Unit
          - Air Ambulance
          - Other
        required: true
      - id: 5
        name: inspector_name
        label: Inspector Name
        hint: Name of person conducting inspection
        type: text
        options: []
        required: true
      - id: 6
        name: inspector_title
        label: Inspector Title
        hint: EMT, Paramedic, Supervisor, etc.
        type: text
        options: []
        required: false
      - id: 7
        name: ppe_inventory_sufficient
        label: PPE Inventory Sufficient
        hint: Are personal protective equipment supplies adequate?
        type: select_one
        options:
          - "Yes"
          - "No"
          - "Partially"
        required: true
      - id: 8
        name: n95_masks
        label: N95 Masks Available
        hint: null
        type: select_one
        options:
