inputSchema:
  type: object
  properties:
    title: COVID 19 Client Health Questionnaire
    pages:
    - id: 1
      name: section_header_1
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: client_id
      label: Client ID
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: visit_date
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: section_header_2
      label: -- COVID-19 Specific Questions --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: covid_diagnosis
      label: Have you been diagnosed with COVID-19?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unsure
      required: true
    - id: 10
      name: diagnosis_date
      label: If yes, when were you diagnosed?
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: current_symptoms
      label: Do you currently have COVID-19 symptoms?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: symptoms_list
      label: If yes, describe your symptoms
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: symptom_duration
      label: How long have you had symptoms?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: recent_exposure
      label: Have you been exposed to someone with COVID-19?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unsure
      required: true
    - id: 15
      name: exposure_timeframe
      label: When was the exposure?
      hint: null
      type: date
      options: []
      required: false
    - id: 16
      name: section_header_3
      label: -- Vaccination History --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Not vaccinated
      - Partially vaccinated
      - Fully vaccinated
      - Fully vaccinated with booster
      required: true
    - id: 18
      name: vaccine_type
      label: Vaccine Type Received
      hint: null
      type: select_one
      options:
      - Pfizer
      - Moderna
      - Johnson and Johnson
      - AstraZeneca
      - Other
      - Not applicable
      required: false
    - id: 19
      name: first_dose_date
      label: Date of First Dose
      hint: null
      type: date
      options: []
      required: false
    - id: 20
      name: second_dose_date
      label: Date of Second Dose
      hint: null
      type: date
      options: []
      required: false
    - id: 21
      name: booster_dose_date
      label: Date of Booster Dose
      hint: null
      type: date
      options: []
      required: false
    - id: 22
      name: vaccine_side_effects
      label: Any side effects from vaccination?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 23
      name: section_header_4
      label: -- Medical History --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: chronic_conditions
      label: Chronic Health Conditions
      hint: Select all that apply
      type: select_multiple
      options:
      - Diabetes
      - Hypertension
      - Heart disease
      - Lung disease
      - Kidney disease
      - Immunocompromised
      - None
      required: true
    - id: 25
      name: current_medications
      label: Current Medications
      hint: null
      type: text
      options: []
      required: false
