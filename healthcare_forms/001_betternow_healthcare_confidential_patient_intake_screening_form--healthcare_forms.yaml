inputSchema:
  type: object
  properties:
    title: BetterNOW Healthcare Confidential Patient Intake Screening Form
    pages:
    - id: 1
      name: patient_information_header
      label: -- Patient Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: First and Last Name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      required: true
    - id: 5
      name: contact_phone
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: medical_history_header
      label: -- Medical History --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: primary_reason_for_visit
      label: Primary Reason for Visit
      hint: Briefly describe your main health concern
      type: text
      options: []
      required: true
    - id: 9
      name: current_medications
      label: Are you currently taking any medications?
      hint: Include prescriptions, over-the-counter, and supplements
      type: text
      options: []
      required: false
    - id: 10
      name: allergies
      label: Do you have any known allergies?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: pain_level
      label: Current Pain Level
      hint: 0 being no pain, 10 being unbearable
      type: select_one
      options:
      - 0 - No Pain
      - 1-3 - Mild
      - 4-6 - Moderate
      - 7-9 - Severe
      - 10 - Unbearable
      required: true
    - id: 12
      name: chronic_conditions
      label: Have you been diagnosed with any of the following?
      hint: Select all that apply
      type: select_multiple
      options:
      - Diabetes
      - Hypertension
      - Heart Disease
      - Asthma
      - Arthritis
      - Depression/Anxiety
      required: false
    - id: 13
      name: screening_questions_header
      label: -- Screening Questions --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: recent_hospitalization
      label: Have you been hospitalized in the last 12 months?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: family_medical_history
      label: Significant Family Medical History
      hint: e.g., cancer, heart disease in immediate family
      type: text
      options: []
      required: false
    - id: 16
      name: lifestyle_factors
      label: Lifestyle Factors
      hint: Select all that apply
      type: select_multiple
      options:
      - Regular Exercise
      - Smoker
      - Alcohol Consumption
      - High Stress Environment
      required: false
    - id: 17
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
