inputSchema:
  type: object
  properties:
    title: Department Of Health Data Collection Form
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: medical_history
      label: Medical History
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: allergies
      label: Allergies
      hint: null
      type: select_multiple
      options:
      - Allergies
      - None
      required: false
    - id: 5
      name: medications
      label: Medications
      hint: null
      type: select_one
      options:
      - Prescription Medications
      - Over the counter (OTC) Medications
      - Supplements
      required: false
    - id: 6
      name: medical_conditions
      label: Medical Conditions
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: health_status
      label: Health Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 8
      name: family_history
      label: Family History
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: contact_details
      label: Contact Details
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: medical_care_info
      label: Medical Care Information
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: health_insurance
      label: Health Insurance
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
