inputSchema:
  type: object
  properties:
    title: mpox_vaccine_distribution_survey
    pages:
    - id: 1
      name: survey_recipient
      label: Survey Recipient
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date Of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: location
      label: Location
      hint: null
      type: select_multiple
      options:
      - City
      - State/Province
      - Country
      required: true
    - id: 8
      name: survey_date
      label: Survey Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: vaccine_dose
      label: Vaccine Dose
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      required: true
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: survey_recipient_vaccinated
      label: Has the survey recipient been vaccinated?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: survey_recipient_vaccinated_date
      label: If yes, date of vaccination
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: survey_recipient_vaccinated_location
      label: Vaccination Location
      hint: null
      type: select_multiple
      options:
      - Clinic
      - Hospital
      - Community Clinic
      - Pharmacy
      required: false
    - id: 14
      name: survey_recipient_vaccinated_dose
      label: Vaccination Dose
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      required: false
    - id: 15
      name: survey_recipient_vaccinated_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Completed
      - Partial
      - Not Completed
      - Unknown
      required: false
