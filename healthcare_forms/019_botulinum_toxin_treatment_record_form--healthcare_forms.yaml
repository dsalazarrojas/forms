inputSchema:
  type: object
  properties:
    title: Botulinum Toxin Treatment Record Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: Full name of patient
      type: text
      options: []
      required: true
    - id: 2
      name: patient_id
      label: Patient ID
      hint: Medical record number
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 4
      name: treatment_date
      label: Treatment Date
      hint: Date treatment was administered
      type: date
      options: []
      required: true
    - id: 5
      name: treatment_time
      label: Treatment Time
      hint: Time treatment began
      type: time
      options: []
      required: true
    - id: 6
      name: treating_provider
      label: Treating Provider
      hint: Name of physician or injector
      type: text
      options: []
      required: true
    - id: 7
      name: provider_license
      label: Provider License Number
      hint: Professional license number
      type: text
      options: []
      required: true
    - id: 8
      name: product_administered
      label: Product Administered
      hint: Brand of botulinum toxin
      type: select_one
      options:
      - Botox Cosmetic
      - Dysport
      - Xeomin
      - Jeuveau
      - Other
      required: true
    - id: 9
      name: product_lot_number
      label: Product Lot Number
      hint: Manufacturer lot number
      type: text
      options: []
      required: true
    - id: 10
      name: product_expiration
      label: Product Expiration Date
      hint: Expiration date of product used
      type: date
      options: []
      required: true
    - id: 11
      name: reconstitution_date
      label: Reconstitution Date
      hint: When product was mixed
      type: date
      options: []
      required: true
    - id: 12
      name: diluent_used
      label: Diluent Used
      hint: Type and amount of diluent
      type: text
      options: []
      required: true
    - id: 13
      name: total_units_prepared
      label: Total Units Prepared
      hint: Total units drawn up
      type: number
      options: []
      required: true
    - id: 14
      name: total_units_administered
      label: Total Units Administered
      hint: Total units actually injected
      type: number
      options: []
      required: true
    - id: 15
      name: units_discarded
      label: Units Discarded
      hint: Any unused units discarded
      type: number
      options: []
      required: false
    - id: 16
      name: injection_sites_detail
      label: Injection Sites Detail
      hint: List all injection sites and units per site
      type: text
      options: []
      required: true
    - id: 17
      name: needle_type
      label: Needle Type
      hint: Gauge and length of needle used
      type: select_one
      options:
      - 30G x 0.5 inch
      - 31G x 0.5 inch
      - 32G x 0.25 inch
      - 33G x 0.25 inch
      - Other
      required: true
    - id: 18
      name: anesthesia_method
      label: Anesthesia Method
      hint: Any anesthesia used
      type: select_one
      options:
      - None
      - Topical cream
      - Ice packs
      - Vibration device
      - Local injection
      required: true
    - id: 19
      name: patient_position
      label: Patient Position
      hint: Position during treatment
      type: select_one
      options:
      - Sitting upright
      - Semi-reclined
      - Lying down
      required: true
    - id: 20
      name: skin_preparation
      label: Skin Preparation
      hint: How was skin prepared
      type: select_one
      options:
      - Alcohol cleanse
      - Antiseptic wipe
      - No preparation
      required: true
    - id: 21
      name: complications_during
      label: Complications During Procedure
      hint: Any complications that occurred
      type: select_one
      options:
      - None
      - Minor bleeding
      - Significant bleeding
      - Vasovagal response
      - Allergic reaction
      - Other
      required: true
    - id: 22
      name: patient_tolerance
      label: Patient Tolerance
      hint: How well patient tolerated procedure
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 23
      name: immediate_results
      label: Immediate Results
      hint: Observations immediately after treatment
      type: text
      options: []
      required: false
    - id: 24
      name: post_treatment_care
      label: Post-Treatment Care Provided
      hint: Any care given after injections
      type: select_multiple
      options:
      - Ice application
      - Pressure applied
      - Bandage applied
      - Aftercare instructions given
      - None
      required: true
    - id: 25
      name: aftercare_instructions
      label: Aftercare Instructions Provided
      hint: Were instructions given to patient
      type: select_one
      options:
      - Yes, verbal and written
      - Yes, verbal only
      - Yes, written only
      - false
      required: true
    - id: 26
      name: follow_up_recommended
      label: Follow-up Recommended
      hint: Is follow-up recommended
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 27
      name: follow_up_timeframe
      label: Follow-up Timeframe
      hint: When should patient return
      type: select_one
      options:
      - 1 week
      - 2 weeks
      - 3 weeks
      - 4 weeks
      - As needed
      required: false
    - id: 28
      name: next_appointment
      label: Next Appointment Date
      hint: Scheduled date for next treatment
      type: date
      options: []
      required: false
    - id: 29
      name: provider_notes
      label: Provider Notes
      hint: Additional clinical notes
      type: text
      options: []
      required: false
    - id: 30
      name: provider_signature
      label: Provider Signature
      hint: Electronic signature of provider
      type: text
      options: []
      required: true
    - id: 31
      name: documentation_date
      label: Documentation Date
      hint: Date of record entry
      type: date
      options: []
      required: true
