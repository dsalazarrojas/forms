inputSchema:
  type: object
  properties:
    title: Negative Test Result Submission
    pages:
    - id: 1
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: test_result
      label: Test Result
      hint: Upload your test result document here.
      type: text
      options: []
      required: false
    - id: 3
      name: submit_form
      label: Submit Form
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date_tested
      label: Date Tested
      hint: mm/dd/yyyy
      type: date
      options: []
      required: false
    - id: 5
      name: time_tested
      label: Time Tested
      hint: 12 hour format (ex. 12 -00 PM)
      type: time
      options: []
      required: false
    - id: 6
      name: test_type
      label: Test Type
      hint: What type of test was done?
      type: select_one
      options:
      - PCR
      - Rapid Antigen
      - Rapid Antibody
      - Other
      required: false
    - id: 7
      name: upload_file
      label: Upload File
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: test_result_upload
      label: Test Result Upload
      hint: Upload your test result document here.
      type: text
      options: []
      required: false
    - id: 9
      name: test_result_upload_type
      label: Test Result Upload Type
      hint: What type of file did you upload?
      type: select_multiple
      options:
      - Lab Results
      - Positive Test Results
      - Negative Test Results
      required: false
    - id: 10
      name: test_result_file
      label: Test Result File
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: submit_form_2
      label: Submit Form 2
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: contact_details_2
      label: Contact Details 2
      hint: null
      type: text
      options: []
      required: false
