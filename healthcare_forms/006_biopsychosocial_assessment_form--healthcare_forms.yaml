inputSchema:
  type: object
  properties:
    title: Biopsychosocial Assessment Form
    pages:
    - id: 1
      name: section_patient_demographics
      label: -- Patient Demographics --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_first_name
      label: First Name
      hint: Patient's first name
      type: text
      options: []
      required: true
    - id: 3
      name: patient_last_name
      label: Last Name
      hint: Patient's last name
      type: text
      options: []
      required: true
    - id: 4
      name: patient_date_of_birth
      label: Date of Birth
      hint: Patient's date of birth
      type: date
      options: []
      required: true
    - id: 5
      name: patient_age
      label: Age
      hint: Current age in years
      type: number
      options: []
      required: true
    - id: 6
      name: assessment_date
      label: Assessment Date
      hint: Date of this assessment
      type: date
      options: []
      required: true
    - id: 7
      name: section_biological_factors
      label: -- Biological Factors --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: current_medical_conditions
      label: Current Medical Conditions
      hint: List any active medical diagnoses
      type: text
      options: []
      required: false
    - id: 9
      name: medications
      label: Current Medications
      hint: List all medications and dosages
      type: text
      options: []
      required: false
    - id: 10
      name: allergies
      label: Allergies or Adverse Reactions
      hint: Include drug allergies and reactions
      type: text
      options: []
      required: false
    - id: 11
      name: sleep_quality
      label: Sleep Quality
      hint: How would you rate your sleep
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 12
      name: sleep_hours
      label: Hours of Sleep per Night
      hint: Average hours of sleep
      type: number
      options: []
      required: false
    - id: 13
      name: exercise_frequency
      label: Exercise Frequency
      hint: How often do you exercise
      type: select_one
      options:
      - Daily
      - 3-5 Times per Week
      - 1-2 Times per Week
      - Rarely
      - Never
      required: true
    - id: 14
      name: section_psychological_factors
      label: -- Psychological Factors --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: mood_assessment
      label: Current Mood
      hint: How is your mood today
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 16
      name: stress_level
      label: Stress Level on Scale of 1-10
      hint: Rate your current stress level
      type: number
      options: []
      required: true
    - id: 17
      name: anxiety_symptoms
      label: Anxiety Symptoms
      hint: Do you experience anxiety symptoms
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      required: true
    - id: 18
      name: depression_symptoms
      label: Depression Symptoms
      hint: Do you experience depressive symptoms
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      required: true
    - id: 19
      name: coping_mechanisms
      label: Healthy Coping Strategies
      hint: Select coping strategies you use
      type: select_multiple
      options:
      - Exercise
      - Meditation or Mindfulness
      - Talking with Friends
      - Creative Activities
      - Professional Counseling
      - Other
      required: false
    - id: 20
      name: section_substance_use
      label: -- Substance Use --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: alcohol_frequency
      label: Alcohol Consumption
      hint: How often do you drink alcohol
      type: select_one
      options:
      - Never
      - Rarely
      - Occasionally
      - Regularly
      - Daily
      required: true
    - id: 22
      name: tobacco_use
      label: Tobacco Use
      hint: Do you use tobacco products
      type: select_one
      options:
      - Never
      - Former User
      - Current User
      required: true
    - id: 23
      name: drug_use
      label: Recreational Drug Use
      hint: Do you use recreational drugs
      type: select_one
      options:
      - Never
      - Former User
      - Current User
      required: true
    - id: 24
      name: section_social_factors
      label: -- Social and Environmental Factors --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: living_situation
      label: Living Situation
      hint: Who do you live with
      type: select_one
      options:
      - Alone
      - With Partner
      - With Family
      - With Friends
      - Other
      required: true
    - id: 26
      name: social_support
      label: Social Support Network
      hint: Do you have adequate social support
      type: select_one
      options:
      - Strong Support
      - Moderate Support
      - Limited Support
      - No Support
      required: true
    - id: 27
      name: stressful_life_events
      label: Recent Stressful Life Events
      hint: Describe any major life changes
      type: text
      options: []
      required: false
    - id: 28
      name: financial_concerns
      label: Financial Concerns
      hint: Do you have financial stress
      type: select_one
      options:
      - None
      - Minor
      - Moderate
      - Significant
      required: false
