inputSchema:
  type: object
  properties:
    title: COVID 19 Test Result Reporting Form
    pages:
    - id: 1
      name: person_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: person_id
      label: Employee or Student ID
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: test_section
      label: -- Test Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: test_date
      label: Test Date
      hint: When was the test performed
      type: date
      options: []
      required: true
    - id: 8
      name: test_type
      label: Type of Test
      hint: null
      type: select_one
      options:
      - PCR/Molecular
      - Rapid Antigen
      - Antibody/Serology
      - At-home test
      required: true
    - id: 9
      name: testing_location
      label: Testing Location or Facility
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: result_section
      label: -- Test Results --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: test_result
      label: Test Result
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Inconclusive
      - Invalid
      required: true
    - id: 12
      name: test_confirmation
      label: Has result been confirmed by a second test
      hint: null
      type: select_one
      options:
      - true
      - false
      - Not applicable
      required: false
    - id: 13
      name: symptoms_section
      label: -- Symptoms and Exposure --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: symptoms_present
      label: Were you experiencing symptoms at time of test
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 15
      name: symptoms_list
      label: Symptoms Experienced
      hint: Check all that apply
      type: select_multiple
      options:
      - Fever
      - Cough
      - Loss of taste or smell
      - Fatigue
      - Shortness of breath
      - Sore throat
      - Headache
      required: false
    - id: 16
      name: exposure_known
      label: Known exposure to COVID-19
      hint: In the last 14 days
      type: select_one
      options:
      - true
      - false
      - Unknown
      required: true
    - id: 17
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully vaccinated
      - Partially vaccinated
      - Not vaccinated
      - Unknown
      required: true
    - id: 18
      name: action_section
      label: -- Actions and Reporting --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: action_taken
      label: Action Taken Following Test
      hint: null
      type: select_one
      options:
      - Self-isolation
      - Quarantine
      - Continued normal activities
      - Awaiting guidance
      required: true
    - id: 20
      name: isolation_start_date
      label: Isolation or Quarantine Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 21
      name: isolation_end_date
      label: Isolation or Quarantine End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 22
      name: workplace_notification
      label: Workplace has been notified
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 23
      name: public_health_reported
      label: Result reported to public health
      hint: null
      type: select_one
      options:
      - true
      - false
      - Not required
      required: false
