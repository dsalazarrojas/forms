inputSchema:
  type: object
  properties:
    title: Specialist Referral Assessment
    pages:
    - id: 1
      name: specialist_name
      label: Specialists Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: medical_specialist_department
      label: Medical Specialist Department
      hint: null
      type: select_one
      options:
      - Cardiology
      - Gastroenterology
      - General Medicine
      - Paediatrics
      - Urology
      required: true
    - id: 3
      name: referral_reason
      label: Referral Reason
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: clinical_details
      label: Clinical Details
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: specialist_note
      label: Specialist Note
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: specialist_referral_date
      label: Specialist Referral Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: specialist_referral_time
      label: Specialist Referral Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: specialist_referral_time_zone
      label: Specialist Referral Time Zone
      hint: null
      type: select_one
      options:
      - AM
      - PM
      - Other
      required: true
    - id: 9
      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
