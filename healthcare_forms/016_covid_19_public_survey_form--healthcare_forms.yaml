inputSchema:
  type: object
  properties:
    title: COVID 19 Public Survey Form
    pages:
    - id: 1
      name: age_group
      label: What is your age group?
      hint: null
      type: select_one
      options:
      - Under 18
      - 18-34
      - 35-50
      - 51-64
      - 65 or older
      required: true
    - id: 2
      name: location_region
      label: Your Current Location (Region/City)
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: vaccine_received
      label: Have you received a COVID-19 vaccine?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: vaccine_type
      label: If yes, which vaccine did you receive?
      hint: null
      type: select_one
      options:
      - Pfizer-BioNTech
      - Moderna
      - Johnson and Johnson
      - AstraZeneca
      - Other
      - Not Applicable
      required: false
    - id: 5
      name: vaccination_plan
      label: If no, do you plan to get vaccinated in the future?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Undecided
      - Not Applicable
      required: false
    - id: 6
      name: vaccine_decision_reason
      label: What is the primary reason for your vaccination decision?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: safety_confidence
      label: On a scale of 1-5, how confident are you in the safety of available vaccines?
      hint: 1 being Not Confident, 5 being Very Confident
      type: number
      options: []
      required: true
    - id: 8
      name: info_sources
      label: Where do you primarily get your vaccine information?
      hint: select all that apply
      type: select_multiple
      options:
      - Government Agencies
      - News Media
      - Healthcare Provider
      - Social Media
      - Friends/Family
      required: true
    - id: 9
      name: vaccine_recommendation
      label: Would you recommend the COVID-19 vaccine to your friends and family?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 10
      name: survey_comments
      label: Additional comments or concerns regarding COVID-19 vaccination
      hint: null
      type: text
      options: []
      required: false
