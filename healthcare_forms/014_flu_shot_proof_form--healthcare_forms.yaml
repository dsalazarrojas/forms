inputSchema:
  type: object
  properties:
    title: Flu Shot Proof Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date_of_vaccination
      label: Date of Vaccination
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: vaccine_type
      label: Vaccine Type
      hint: null
      type: select_one
      options:
      - Influenza A
      - Influenza B
      - Influenza A+B
      required: true
    - id: 4
      name: dose_administered
      label: Dose Administered
      hint: null
      type: select_multiple
      options:
      - 0.25 mL
      - 0.5 mL
      - 0.75 mL
      - 1 mL
      required: true
    - id: 5
      name: vaccine_administered_by
      label: Vaccine Administered By
      hint: null
      type: select_one
      options:
      - Nurse
      - Physician
      - Other
      required: true
    - id: 6
      name: patient_signature
      label: Patient Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: healthcare_provider_signature
      label: Healthcare Provider Signature
      hint: null
      type: text
      options: []
      required: false
