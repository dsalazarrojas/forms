inputSchema:
  type: object
  properties:
    title: COVID 19 Vaccine Consent Form CPESN NY
    pages:
    - id: 1
      name: patient_name
      label: Patient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: patient_id
      label: Patient ID or Social Security Number
      hint: Last 4 digits
      type: text
      options: []
      required: false
    - id: 4
      name: pharmacy_name
      label: Pharmacy or Healthcare Facility Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: pharmacist_name
      label: Pharmacist or Healthcare Provider Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: education_section
      label: -- Patient Education --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: received_fact_sheet
      label: I received the COVID-19 Vaccine Information Fact Sheet
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: understood_information
      label: I have read and understood the vaccine information
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 9
      name: questions_allowed
      label: I was given opportunity to ask questions
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: medical_history_section
      label: -- Medical History Screening --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: allergies_vaccine_components
      label: I have allergies to vaccine components
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: true
    - id: 12
      name: allergies_describe
      label: If yes, describe allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: severe_reaction_prior
      label: History of severe allergic reaction or anaphylaxis
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: current_illness
      label: Currently ill with fever or acute illness
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: immunocompromised
      label: Immunocompromised or on immunosuppressive therapy
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: true
    - id: 16
      name: pregnancy_status
      label: Pregnant or planning to become pregnant
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: true
    - id: 17
      name: breastfeeding_status
      label: Currently breastfeeding
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 18
      name: prior_vaccine_section
      label: -- Prior Vaccination History --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: prior_covid_vaccine
      label: Previously received COVID-19 vaccine
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 20
      name: prior_vaccine_type
      label: If yes, vaccine type
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: prior_vaccine_date
      label: Date of prior dose
      hint: null
      type: date
      options: []
      required: false
    - id: 22
      name: prior_adverse_reaction
      label: Adverse reaction to prior COVID vaccine
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 23
      name: adverse_reaction_describe
      label: If yes, describe reaction
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: consent_agreement_section
      label: -- Consent Agreement --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: understand_benefits_risks
      label: I understand the benefits and risks of COVID-19 vaccination
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 26
      name: acknowledge_risks_known
      label: I acknowledge the risks are known and potential future risks unknown
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 27
      name: voluntary_consent
      label: I voluntarily consent to receive COVID-19 vaccine
      hint: null
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 28
      name: right_to_refuse
      label: I understand I can refuse vaccination without penalty
      hint: null
      type: select_one
      options:
      - I understand
      - I do not understand
      required: true
    - id: 29
      name: liability_release
      label: I release the pharmacist and pharmacy from liability
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 30
      name: signature_date
      label: Date of Consent
      hint: null
      type: date
      options: []
      required: true
