inputSchema:
  type: object
  properties:
    title: Client Consent For Clinic Services During COVID 19 Pandemic
    pages:
    - id: 1
      name: patient_name
      label: Patient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: section_screening
      label: -- Health Screening Questionnaire --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: fever_check
      label: Have you had a fever or chills in the last 14 days?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: shortness_of_breath
      label: Have you experienced any shortness of breath or difficulty breathing?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: cough_check
      label: Have you had a new or worsening cough in the last 14 days?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: contact_check
      label: Have you been in close contact with anyone with a confirmed COVID-19
        case?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: travel_check
      label: Have you travelled outside the country in the last 14 days?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: section_protocol
      label: -- Clinic Protocol Acknowledgment --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: toilet_facility_ack
      label: I understand that toilet facilities are currently not available
      hint: null
      type: select_one
      options:
      - 'True'
      - I understand
      required: true
    - id: 11
      name: refreshments_ack
      label: I will bring my own refreshments for during and post treatment
      hint: null
      type: select_one
      options:
      - 'True'
      - I understand
      required: true
    - id: 12
      name: wait_outside_ack
      label: I will wait to be let in to avoid unnecessary contact with surfaces
      hint: null
      type: select_one
      options:
      - 'True'
      - I understand
      required: true
    - id: 13
      name: consent_treatment
      label: I consent to receiving treatment during the pandemic period
      hint: null
      type: select_one
      options:
      - 'True'
      - I consent
      required: true
    - id: 14
      name: digital_signature
      label: Signature - Type Full Name
      hint: null
      type: text
      options: []
      required: true
