      name: notes_section
      label: Additional comments or questions?
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: email_input
      label: Patient email
      hint: null
      type: email
      options: []
      required: true
    - id: 18
      name: patient_info_section
      label: Patient information
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: healthcare_provider_info_section
      label: Healthcare provider information
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: follow_up_section
