inputSchema:
  type: object
  properties:
    title: Depression Screening Survey
    pages:
    - id: 1
      name: intro_page
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: symptoms_question_1
      label: How many days in the last 2 weeks did you feel sad, empty, or depressed?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: symptoms_question_2
      label: Have you experienced a significant change in appetite?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: symptoms_question_3
      label: How many hours of sleep do you usually get per night?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: symptoms_question_4
      label: Have you experienced a loss of pleasure in doing things?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: symptoms_question_5
      label: Have you experienced a loss of interest in activities?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: symptoms_question_6
      label: Have you experienced significant weight loss or gain?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: symptoms_question_7
      label: Have you experienced a loss of energy?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: symptoms_question_8
      label: Have you felt hopeless?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: symptoms_question_9
      label: Have you felt restless?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: symptoms_question_10
      label: Have you felt worth-less?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: symptoms_question_11
      label: Have you experienced difficulty concentrating?
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      required: true
    - id: 13
      name: symptoms_question_12
      label: Have you experienced difficulty making decisions?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 14
      name: symptoms_question_13
      label: Have you experienced feelings of worthlessness?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 15
      name: symptoms_question_14
      label: Have you experienced thoughts of death or suicidal thoughts?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
