    - id: 24
      name: time_survey_completed_section
      label: Time survey completed
      hint: null
      type: time
      options: []
      required: true
    - id: 25
      name: submit_button
      label: Submit
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
