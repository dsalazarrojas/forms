inputSchema:
  type: object
  properties:
    title: Calculate Body Mass Index And Body Fat Percentage
    pages:
    - id: 1
      name: personal_info_header
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: your_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: true
    - id: 5
      name: body_measurements_header
      label: -- Body Measurements --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: measurement_unit
      label: Measurement Unit
      hint: null
      type: select_one
      options:
      - Metric (kg, cm)
      - Imperial (lbs, inches)
      required: true
    - id: 7
      name: weight
      label: Weight
      hint: In kg or lbs depending on selected unit
      type: number
      options: []
      required: true
    - id: 8
      name: height
      label: Height
      hint: In cm or inches depending on selected unit
      type: number
      options: []
      required: true
    - id: 9
      name: waist_circumference
      label: Waist Circumference
      hint: Measure at belly button level
      type: number
      options: []
      required: false
    - id: 10
      name: neck_circumference
      label: Neck Circumference
      hint: Measure just below larynx
      type: number
      options: []
      required: false
    - id: 11
      name: hip_circumference
      label: Hip Circumference (for females)
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: skinfold_header
      label: -- Body Composition (Optional) --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: triceps_skinfold
      label: Triceps Skinfold (mm)
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: biceps_skinfold
      label: Biceps Skinfold (mm)
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: subscapular_skinfold
      label: Subscapular Skinfold (mm)
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: suprailiac_skinfold
      label: Suprailiac Skinfold (mm)
      hint: null
      type: number
      options: []
      required: false
    - id: 17
      name: activity_header
      label: -- Activity Level --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: activity_level
      label: Activity Level
      hint: null
      type: select_one
      options:
      - Sedentary (little or no exercise)
      - Lightly active (exercise 1-3 days/week)
      - Moderately active (exercise 3-5 days/week)
      - Very active (exercise 6-7 days/week)
      - Extremely active (physical job)
      required: true
    - id: 19
      name: goals_header
      label: -- Health Goals --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: health_goal
      label: Your Health Goal
      hint: null
      type: select_one
      options:
      - Weight loss
      - Weight gain
      - Maintain weight
      - Build muscle
      - General fitness
      required: false
    - id: 21
      name: medical_history
      label: Relevant Medical Conditions
      hint: Diabetes, heart disease, etc (optional)
      type: text
      options: []
      required: false
    - id: 22
      name: medications
      label: Current Medications
      hint: null
      type: text
      options: []
      required: false
