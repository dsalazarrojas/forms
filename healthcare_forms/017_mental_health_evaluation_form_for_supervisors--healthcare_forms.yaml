inputSchema:
  type: object
  properties:
    title: Mental Health Evaluation Form For Supervisors
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: evaluation_time
      label: Evaluation Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: employee_performance
      label: Employee Performance
      hint: null
      type: select_one
      options:
      - Satisfactory
      - Unsatisfactory
      - Not Applicable
      required: true
    - id: 6
      name: mental_health_issues
      label: Mental Health Issues
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: supervisor_comments
      label: Supervisor Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: supervisor_signature
      label: Supervisor Signature
      hint: null
      type: note
      options: []
      required: false
