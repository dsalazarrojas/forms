inputSchema:
  type: object
  properties:
    title: thrive_sport_and_fitness_solutions_client_assessment_form
    pages:
    - id: 1
      name: client_info
      label: Client Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: sport_info
      label: Sport Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time_of_day
      label: Time of Day
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: false
    - id: 5
      name: fitness_goals
      label: Fitness Goals
      hint: null
      type: select_multiple
      options:
      - Weight Loss
      - Weight Gain
      - Muscle Gain
      - Muscle Loss
      required: false
    - id: 6
      name: medical_conditions
      label: Medical Conditions
      hint: null
      type: select_multiple
      options:
      - None
      - High Blood Pressure
      - High Cholesterol
      - Diabetes
      required: false
    - id: 7
      name: medical_procedures
      label: Medical Procedures
      hint: null
      type: select_multiple
      options:
      - None
      - MRI
      - Blood Test
      - CT Scan
      required: false
    - id: 8
      name: client_feedback
      label: Client Feedback
      hint: null
      type: note
      options: []
      required: false
