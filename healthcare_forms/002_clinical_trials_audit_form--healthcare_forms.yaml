inputSchema:
  type: object
  properties:
    title: Clinical Trials Audit Form
    pages:
      - id: 1
        name: audit_header
        label: -- Audit Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: study_name
        label: Study name
        hint: Full protocol or study title
        type: text
        options: []
        required: true
      - id: 3
        name: protocol_number
        label: Protocol number
        hint: Sponsor protocol identifier
        type: text
        options: []
        required: false
      - id: 4
        name: audit_date
        label: Audit date
        hint: Date of the audit
        type: date
        options: []
        required: true
      - id: 5
        name: auditor_name
        label: Auditor name
        hint: Lead auditor full name
        type: text
        options: []
        required: true
      - id: 6
        name: site_location
        label: Site location
        hint: Clinic or facility name and address
        type: text
        options: []
        required: true
      - id: 7
        name: findings_summary
        label: Findings summary
        hint: Brief summary of key observations
        type: text
        options: []
        required: true
      - id: 8
        name: compliance_rating
        label: Compliance rating
        hint: Select overall compliance status
        type: select_one
        options:
          - Compliant
          - Minor non compliance
          - Major non compliance
          - Not applicable
        required: true
      - id: 9
        name: corrective_actions
        label: Recommended corrective actions
        hint: Describe corrective actions and deadlines
        type: text
        options: []
        required: false
      - id: 10
        name: attachments
        label: Attachments or evidence
        hint: Reference attached documents or photos
        type: text
        options: []
        required: false
