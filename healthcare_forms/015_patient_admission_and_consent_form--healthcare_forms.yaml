inputSchema:
  type: object
  properties:
    title: Patient Admission And Consent Form
    pages:
    - id: 1
      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: allergies
      label: Allergies
      hint: null
      type: select_multiple
      options:
      - Penicillin
      - Aspirin
      - EpiPen
      required: false
    - id: 4
      name: medical_conditions
      label: Medical Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: medications
      label: Medications
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: medical_devices
      label: Medical Devices
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: emergency_contact
      label: Emergency Contact
      hint: Name of a family member or caregiver
      type: text
      options: []
      required: false
    - id: 8
      name: patient_signature
      label: Patient Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: healthcare_provider_signature
      label: Healthcare Provider Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - I have read and understand the information above
      - I have not read and do not understand the information above
      required: true
    - id: 13
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
