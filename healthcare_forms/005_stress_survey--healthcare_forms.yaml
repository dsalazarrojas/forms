inputSchema:
  type: object
  properties:
    title: stress_survey
    pages:
    - id: 1
      name: main_page
      label: Stress Survey
      hint: null
      type: select_multiple
      options:
      - Very stressed
      - Somewhat stressed
      - Not stressed
      required: false
    - id: 2
      name: frequency
      label: How often do you feel stressed?
      hint: null
      type: select_one
      options:
      - Always
      - Mostly
      - Rarely
      required: false
    - id: 3
      name: duration
      label: How long do you feel stressed?
      hint: null
      type: select_one
      options:
      - Less than 1 hour
      - 1-2 hours
      - 2-4 hours
      - 4-8 hours
      - More than 8 hours
      required: false
    - id: 4
      name: severity
      label: On a scale of 1-10, how would you rate your stress level?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: trigger
      label: What triggers your stress?
      hint: null
      type: select_multiple
      options:
      - Work/School
      - Relationships
      - Health
      - Money
      - Hobbies/Leisure
      required: false
    - id: 6
      name: coping_mechanism
      label: What do you do to cope with stress?
      hint: null
      type: select_one
      options:
      - Exercise
      - Talk to a friend
      - Listen to music
      - Meditate
      - Watch a movie
      - Read a book
      - Play a game
      - Other (please specify)
      required: false
