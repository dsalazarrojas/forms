inputSchema:
  type: object
  properties:
    title: Health and Travel History Declaration Form
    pages:
    - id: 1
      name: health_and_travel_history_declaration_form_page
      label: 1. General Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: health_status
      label: 2. Current Health Status
      hint: Please answer all questions truthfully.
      type: text
      options: []
      required: true
    - id: 3
      name: countries_visited_recently
      label: 3. Countries Visited in Last 2 Weeks
      hint: List all countries you have visited in the last 2 weeks.
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: reasons_for_visit
      label: 4. Reasons for Visit
      hint: State the reasons for your visit.
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: symptoms
      label: 5. Symptoms
      hint: List all the symptoms you are experiencing.
      type: text
      options: []
      required: true
    - id: 6
      name: countries_planned_visit
      label: 6. Countries to Visit in Next 2 Weeks
      hint: List all countries you plan to visit in the next 2 weeks.
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: contacted_areas
      label: 7. Contacted Areas
      hint: List all areas you have contacted in the last 2 weeks.
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: covid_contact
      label: 8. Contact with COVID-19
      hint: Have you been in contact with anyone with COVID-19 in the last 2 weeks?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
