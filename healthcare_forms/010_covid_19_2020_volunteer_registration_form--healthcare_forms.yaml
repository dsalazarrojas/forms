inputSchema:
  type: object
  properties:
    title: COVID 19 2020 Volunteer Registration Form
    pages:
    - id: 1
      name: volunteer_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: volunteer_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: volunteer_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: volunteer_address
      label: Home Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: volunteer_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: volunteer_state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: volunteer_zip
      label: Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: employment_status
      label: Current Employment Status
      hint: null
      type: select_one
      options:
      - Employed Full-Time
      - Employed Part-Time
      - Self-Employed
      - Unemployed
      - Retired
      - Student
      required: true
    - id: 10
      name: healthcare_experience
      label: Do you have healthcare experience?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: healthcare_specialty
      label: If yes, what is your healthcare specialty?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: available_hours
      label: Hours available per week
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: availability_schedule
      label: Preferred Volunteer Schedule
      hint: null
      type: select_multiple
      options:
      - Weekday mornings
      - Weekday afternoons
      - Weekday evenings
      - Weekend days
      - Flexible
      required: true
    - id: 14
      name: volunteer_location
      label: Preferred Location to Volunteer
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: motivation
      label: What motivates you to volunteer during COVID-19?
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: volunteer_roles
      label: What volunteer roles interest you?
      hint: Select all that apply
      type: select_multiple
      options:
      - Patient support
      - Administrative tasks
      - Cleaning and sanitation
      - Food service
      - Supply management
      - Emotional support hotline
      - Other
      required: true
    - id: 17
      name: certifications
      label: Relevant Certifications or Licenses
      hint: CPR, First Aid, etc.
      type: text
      options: []
      required: false
    - id: 18
      name: language_proficiency
      label: Languages Spoken
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: health_screening
      label: Do you have any symptoms of illness?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 20
      name: covid_exposure
      label: Have you been exposed to COVID-19?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unsure
      required: true
    - id: 21
      name: agreement_understood
      label: I understand the risks involved in volunteering
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 22
      name: background_check_consent
      label: I consent to a background check
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 23
      name: submission_date
      label: Registration Date
      hint: null
      type: date
      options: []
      required: true
