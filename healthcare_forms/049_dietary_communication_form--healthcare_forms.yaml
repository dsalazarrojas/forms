inputSchema:
  type: object
  properties:
    title: Dietary Communication Form
    pages:
    - id: 1
      name: food_allergies
      label: Patient's Food Allergies
      hint: Select all the food allergies the patient has
      type: select_multiple
      options:
      - Eggs
      - Dairy
      - Shellfish
      - Soy
      - Gluten
      - Other
      required: false
    - id: 2
      name: medical_conditions
      label: Medical Conditions
      hint: Select all the medical conditions the patient has
      type: select_multiple
      options:
      - Diabetes
      - Hypertension
      - High Cholesterol
      - Other
      required: false
    - id: 3
      name: dietary_preferences
      label: Dietary Preferences
      hint: Select all the dietary preferences the patient has
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Kosher
      - Other
      required: false
    - id: 4
      name: emergency_contact
      label: Emergency Contact Information
      hint: Provide the contact information for the patient's emergency contact
      type: text
      options: []
      required: false
    - id: 5
      name: date_and_time
      label: Date and Time
      hint: Enter the date and time the patient needs to take their medication
      type: date
      options: []
      required: true
    - id: 6
      name: medical_notes
      label: Medical Notes
      hint: Add any additional medical notes about the patient's condition
      type: note
      options: []
      required: false
    - id: 7
      name: emergency_phone
      label: Emergency Phone Number
      hint: Enter the phone number of the emergency contact
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: Enter the email of the patient's emergency contact
      type: email
      options: []
      required: false
    - id: 9
      name: emergency_notes
      label: Additional Medical Notes
      hint: Add any additional medical notes about the patient
      type: note
      options: []
      required: false
    - id: 10
      name: date
      label: Date
      hint: Enter the date the patient needs to take their medication
      type: date
      options: []
      required: false
    - id: 11
      name: time
      label: Time
      hint: Enter the time the patient needs to take their medication
      type: time
      options: []
      required: false
    - id: 12
      name: emergency_contact_2
      label: Emergency Contact
      hint: Select all the emergency contacts
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
