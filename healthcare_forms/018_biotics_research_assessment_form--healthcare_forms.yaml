inputSchema:
  type: object
  properties:
    title: Biotics Research Assessment Form
    pages:
    - id: 1
      name: section_participant_info
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: participant_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: participant_dob
      label: Date of Birth
      hint: Your date of birth
      type: date
      options: []
      required: true
    - id: 5
      name: participant_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 6
      name: participant_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 7
      name: assessment_date
      label: Assessment Date
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 8
      name: section_nutrition
      label: -- Nutritional Intake --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: daily_servings_vegetables
      label: Daily Vegetable Servings
      hint: How many servings of vegetables daily
      type: number
      options: []
      required: true
    - id: 10
      name: daily_servings_fruits
      label: Daily Fruit Servings
      hint: How many servings of fruits daily
      type: number
      options: []
      required: true
    - id: 11
      name: protein_sources
      label: Primary Protein Sources
      hint: What proteins do you consume
      type: select_multiple
      options:
      - Meat
      - Fish
      - Poultry
      - Legumes
      - Nuts and Seeds
      - Dairy
      - Plant-Based
      required: true
    - id: 12
      name: daily_water_intake
      label: Daily Water Intake
      hint: Cups of water per day
      type: number
      options: []
      required: true
    - id: 13
      name: dietary_restrictions
      label: Dietary Restrictions or Allergies
      hint: Any allergies or restrictions
      type: text
      options: []
      required: false
    - id: 14
      name: supplement_use
      label: Supplement Use
      hint: Do you take any supplements
      type: select_one
      options:
      - Yes, Regularly
      - Yes, Occasionally
      - 'False'
      required: true
    - id: 15
      name: supplements_list
      label: List of Current Supplements
      hint: List any vitamins or supplements
      type: text
      options: []
      required: false
    - id: 16
      name: section_microbiome
      label: -- Microbiome Health --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: digestive_health
      label: Current Digestive Health
      hint: How is your digestion
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 18
      name: bowel_regularity
      label: Bowel Regularity
      hint: How often do you have bowel movements
      type: select_one
      options:
      - Multiple Times Daily
      - Once Daily
      - Several Times Weekly
      - Irregular
      required: true
    - id: 19
      name: digestive_issues
      label: Digestive Issues or Symptoms
      hint: Any bloating, gas, constipation, etc.
      type: select_multiple
      options:
      - Bloating
      - Gas
      - Constipation
      - Diarrhea
      - Heartburn
      - Abdominal Pain
      - None
      required: false
    - id: 20
      name: probiotic_awareness
      label: Knowledge of Probiotic Health
      hint: Rate your understanding
      type: select_one
      options:
      - Very Knowledgeable
      - Somewhat Knowledgeable
      - Minimal Knowledge
      - No Knowledge
      required: true
    - id: 21
      name: section_immune_function
      label: -- Immune Function --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: illness_frequency
      label: Frequency of Illness
      hint: How often do you get sick
      type: select_one
      options:
      - Rarely
      - Few Times per Year
      - Monthly
      - Frequently
      required: true
    - id: 23
      name: infection_history
      label: Recent Infections or Illnesses
      hint: Any infections in past 6 months
      type: text
      options: []
      required: false
    - id: 24
      name: immune_support_interest
      label: Interest in Immune Support
      hint: Would you like to improve immune health
      type: select_one
      options:
      - Very Interested
      - Interested
      - Somewhat Interested
      - Not Interested
      required: false
    - id: 25
      name: section_gut_health
      label: -- Gut Health Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: gut_health_rating
      label: Current Gut Health Rating
      hint: Rate on scale 1-10
      type: number
      options: []
      required: true
    - id: 27
      name: food_sensitivity
      label: Food Sensitivities or Intolerances
      hint: Any foods that bother you
      type: text
      options: []
      required: false
    - id: 28
      name: antibiotic_use
      label: Recent Antibiotic Use
      hint: When last took antibiotics
      type: select_one
      options:
      - Within 3 Months
      - Within 6 Months
      - Within 1 Year
      - Over 1 Year Ago
      - Never
      required: true
    - id: 29
      name: section_lifestyle
      label: -- Lifestyle Factors --
      hint: null
      type: note
      options: []
      required: false
    - id: 30
      name: exercise_frequency
      label: Exercise Frequency
      hint: How often do you exercise
      type: select_one
      options:
      - Daily
      - 3-5 Times per Week
      - 1-2 Times per Week
      - Rarely
      - Never
      required: true
    - id: 31
      name: sleep_quality
      label: Sleep Quality
      hint: Rate your sleep
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 32
      name: stress_level
      label: Current Stress Level
      hint: Rate on scale 1-10
      type: number
      options: []
      required: true
    - id: 33
      name: section_goals
      label: -- Health Goals --
      hint: null
      type: note
      options: []
      required: false
    - id: 34
      name: health_goals
      label: Primary Health Goals
      hint: What do you want to improve
      type: text
      options: []
      required: false
    - id: 35
      name: research_interest
      label: Interest in Biotics Research Participation
      hint: Would you participate in research
      type: select_one
      options:
      - Yes, Very Interested
      - Interested
      - Maybe
      - 'False'
      required: false
