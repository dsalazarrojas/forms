inputSchema:
  type: object
  properties:
    title: Sleep Deprivation Survey
    pages:
    - id: 1
      name: header_page
      label: Sleep Deprivation Survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: introduction
      label: A sleep deprivation survey helps doctors and patients understand sleep
        disorders and how they can improve quality of life.
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: sleep_duration
      label: How do you sleep?
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Late
      required: true
    - id: 4
      name: sleep_length
      label: How long do you sleep?
      hint: null
      type: select_one
      options:
      - 0-4 hours
      - 4-6 hours
      - 6-8 hours
      - More than 8 hours
      required: true
    - id: 5
      name: tiredness
      label: Do you have tiredness?
      hint: null
      type: select_multiple
      options:
      - Fatigue
      - Difficulty concentrating
      - Memory problems
      - Mood changes
      required: true
    - id: 6
      name: sleep_quantity
      label: How much do you sleep?
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: sleep_timing
      label: Do you usually sleep?
      hint: null
      type: select_one
      options:
      - Always
      - Sometimes
      - Rarely
      - Never
      required: true
    - id: 8
      name: wake_up_time
      label: What time do you wake up?
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: bedtime
      label: What time do you go to bed?
      hint: null
      type: time
      options: []
      required: true
