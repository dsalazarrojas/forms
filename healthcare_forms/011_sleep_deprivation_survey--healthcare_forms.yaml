inputSchema:
  type: object
  properties:
    title: Sleep Deprivation Survey
    pages:
    - id: 1
      name: survey_header
      label: Sleep Deprivation Survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: introduction
      label: A sleep deprivation survey helps doctors and patients understand sleep
        disorders and how they can improve quality of life.
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: survey_header
      label: Sleep Deprivation Survey
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: how_do_you_sleep
      label: How do you sleep?
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Late
      required: true
    - id: 5
      name: how_do_you_sleep
      label: How do you sleep?
      hint: null
      type: select_one
      options:
      - 8 hours or less
      - 9-11 hours
      - 11-13 hours
      - More than 13 hours
      required: true
    - id: 6
      name: how_long_do_you_sleep
      label: How long do you sleep?
      hint: null
      type: select_one
      options:
      - 0-4 hours
      - 4-6 hours
      - 6-8 hours
      - More than 8 hours
      required: true
    - id: 7
      name: do_you_have_tiredness
      label: Do you have tiredness?
      hint: null
      type: select_multiple
      options:
      - Fatigue
      - Difficulty concentrating
      - Memory problems
      - Mood changes
      required: true
    - id: 8
      name: do_you_have_tiredness
      label: Do you have tiredness?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: how_much_do_you_sleep
      label: How much do you sleep?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: do_you_sleep
      label: Do you sleep?
      hint: null
      type: select_one
      options:
      - Always
      - Sometimes
      - Rarely
      - Never
      required: true
    - id: 11
      name: do_you_sleep
      label: Do you sleep?
      hint: null
      type: select_multiple
      options:
      - Every day
      - 2-3 times a week
      - 1 time a week
      - Rarely
      required: true
    - id: 12
      name: wake_up_at
      label: What time do you wake up?
      hint: null
      type: time
      options: []
      required: true
    - id: 13
      name: wake_up_at
      label: What time do you wake up?
      hint: null
      type: select_one
      options:
      - 6:00 AM
      - 7:00 AM
      - 8:00 AM
      - 9:00 AM
      required: true
    - id: 14
      name: bed_time
      label: What time do you go to bed?
      hint: null
      type: time
      options: []
      required: true
    - id: 15
      name: bed_time
      label: What time do you go to bed?
      hint: null
      type: select_one
      options:
      - 11:00 PM
      - 10:00 PM
      - 9:00 PM
      - 8:00 PM
      required: true
