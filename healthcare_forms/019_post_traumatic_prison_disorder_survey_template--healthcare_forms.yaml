inputSchema:
  type: object
  properties:
    title: Post-Traumatic Prison Disorder Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: Please take a few minutes to answer the following questions about your
        experiences with post-traumatic stress disorder.
      type: text
      options: []
      required: true
    - id: 2
      name: name
      label: Name
      hint: Please provide your name for this survey.
      type: text
      options: []
      required: true
    - id: 3
      name: duration_of_symptoms
      label: Duration of Symptoms
      hint: How long have you been experiencing symptoms of post-traumatic stress
        disorder?
      type: number
      options: []
      required: true
    - id: 4
      name: trauma_history
      label: Trauma History
      hint: Do you have a history of trauma?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: type_of_trauma
      label: Type of Trauma
      hint: What type of trauma have you experienced?
      type: select_multiple
      options:
      - Physical Abuse
      - Emotional Abuse
      - Neglect
      - Sexual Assault
      - Other (please specify)
      required: true
    - id: 6
      name: severity_of_symptoms
      label: Severity of Symptoms
      hint: How severe are your symptoms of post-traumatic stress disorder?
      type: number
      options: []
      required: true
    - id: 7
      name: symptoms_1
      label: Symptoms
      hint: What are your symptoms of post-traumatic stress disorder?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 8
      name: symptoms_2
      label: Symptoms while Incarcerated
      hint: Have you experienced any of the following symptoms while incarcerated?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 9
      name: duration_incarceration
      label: Duration of Incarceration
      hint: How long have you been experiencing symptoms of post-traumatic stress
        disorder while incarcerated?
      type: number
      options: []
      required: true
    - id: 10
      name: symptoms_incarcerated_1
      label: Symptoms Incarcerated 1
      hint: What are your symptoms of post-traumatic stress disorder while incarcerated?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 11
      name: severity_incarcerated
      label: Severity of Symptoms while Incarcerated
      hint: How severe are your symptoms of post-traumatic stress disorder while incarcerated?
      type: number
      options: []
      required: true
    - id: 12
      name: stressors
      label: Stressors
      hint: What has made you feel more anxious or stressed while incarcerated?
      type: text
      options: []
      required: true
    - id: 13
      name: trauma_history_incarcerated
      label: Trauma History while Incarcerated
      hint: Have you experienced trauma while incarcerated?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: comfort_disclosure
      label: Comfort with Disclosure
      hint: Do you feel comfortable disclosing the following information?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: other
      label: Other
      hint: Is there anything else you would like to share or add to this survey?
      type: text
      options: []
      required: false
