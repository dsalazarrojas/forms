inputSchema:
  type: object
  properties:
    title: Special Visitor Request Form
    pages:
    - id: 1
      name: name
      label: Visitor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: organization
      label: Organization
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: type_of_visit
      label: Type of Visit
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: description_of_event
      label: Description of Event
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: number_of_people_attending
      label: Number of People Attending
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
