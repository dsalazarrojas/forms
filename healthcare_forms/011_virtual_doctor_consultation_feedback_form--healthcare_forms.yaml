inputSchema:
  type: object
  properties:
    title: Virtual Doctor Consultation Feedback Form
    pages:
    - id: 1
      name: feedback_rating
      label: Feedback Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: quality_of_care
      label: Quality of Care
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: communication
      label: Communication
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: understanding
      label: Understanding
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: doctor_availability
      label: Doctor Availability
      hint: null
      type: select_one
      options:
      - Availability - On time
      - Availability - Late
      - Availability - Never
      required: true
    - id: 6
      name: doctor_communication
      label: Doctor Communication
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: doctor_knowledge
      label: Doctor Knowledge
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: doctor_empathy
      label: Doctor Empathy
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: patient_satisfaction
      label: Patient Satisfaction
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 10
      name: appointment_length
      label: Appointment Length
      hint: null
      type: time
      options: []
      required: true
