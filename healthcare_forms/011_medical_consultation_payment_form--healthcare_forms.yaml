inputSchema:
  type: object
  properties:
    title: Medical Consultation Payment Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - Bank Transfer
      required: true
    - id: 3
      name: date_of_service
      label: Date of Service
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time_of_service
      label: Time of Service
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: payment_time
      label: Payment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Pending
      - Paid
      - Refunded
      required: true
