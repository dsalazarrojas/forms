inputSchema:
  type: object
  properties:
    title: Coronavirus 19 Health Declaration Form
    pages:
    - id: 1
      name: medical_organization
      label: Medical Organization
      hint: null
      type: select_one
      options:
      - Medical Center
      - Hospital
      - Clinic
      - Private Practice
      required: false
    - id: 2
      name: symptoms
      label: Symptoms
      hint: Select all the symptoms you have experienced
      type: select_multiple
      options:
      - Fever
      - Cough
      - Fatigue
      - Sore Throat
      - Runny Nose
      - Headache
      required: false
    - id: 3
      name: exposure_date
      label: Exposure Date
      hint: Date of exposure to COVID-19
      type: date
      options: []
      required: false
    - id: 4
      name: exposure_location
      label: Exposure Location
      hint: Location of exposure to COVID-19
      type: text
      options: []
      required: false
    - id: 5
      name: travel_history
      label: Travel History
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: travel_destination
      label: Travel Destination
      hint: null
