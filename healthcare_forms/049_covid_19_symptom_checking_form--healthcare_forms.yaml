inputSchema:
  type: object
  properties:
    title: Covid 19 Symptom Checking Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_age
      label: Patient Age
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: symptoms
      label: Symptoms
      hint: null
      type: select_multiple
      options:
      - Fever
      - Fatigue
      - Cough
      - Runny nose
      - Sore throat
      required: true
    - id: 4
      name: travel_history
      label: Travel History
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: exposure_to_covid
      label: Exposure to COVID-19
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: contact_with_infected
      label: Contact with Infected
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 7
      name: health_status
      label: Health Status
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: medical_conditions
      label: Medical Conditions
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: patient_address
      label: Patient Address
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: patient_gender
      label: Patient Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: true
    - id: 12
      name: patient_urgent_care
      label: Patient Urgent Care
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
    - id: 13
      name: patient_medication
      label: Patient Medication
      hint: null
      type: select_one
      options:
      - None
      - 'True'
      required: false
    - id: 14
      name: patient_allergies
      label: Patient Allergies
      hint: null
      type: select_one
      options:
      - None
      - 'True'
      required: false
    - id: 15
      name: patient_medical_device
      label: Patient Medical Device
      hint: null
      type: select_one
      options:
      - None
      - 'True'
      required: false
    - id: 16
      name: medical_provider
      label: Medical Provider
      hint: null
      type: select_one
      options:
      - Primary Care Physician
      - Specialist
      - Other
      required: true
    - id: 17
      name: medical_facility
      label: Medical Facility
      hint: null
      type: select_one
      options:
      - Hospital
      - Clinic
      - Private
      - Other
      required: true
    - id: 18
      name: medical_department
      label: Medical Department
      hint: null
      type: select_one
      options:
      - Primary Care
      - Specialist
      - Emergency
      required: true
    - id: 19
      name: medical_specialty
      label: Medical Specialty
      hint: null
      type: select_one
      options:
      - None
      - Cardiology
      - Dermatology
      - Gastroenterology
      - Nephrology
      - Pulmonology
      required: true
    - id: 20
      name: medical_condition
