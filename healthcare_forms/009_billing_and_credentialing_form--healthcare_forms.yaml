inputSchema:
  type: object
  properties:
    title: Billing And Credentialing Form
    pages:
    - id: 1
      name: provider_information
      label: Provider Information
      hint: Enter healthcare provider details
      type: note
      options: []
      required: false
    - id: 2
      name: provider_first_name
      label: First Name
      hint: Provider's first name
      type: text
      options: []
      required: true
    - id: 3
      name: provider_last_name
      label: Last Name
      hint: Provider's last name
      type: text
      options: []
      required: true
    - id: 4
      name: provider_middle_name
      label: Middle Name
      hint: Provider's middle name or initial
      type: text
      options: []
      required: false
    - id: 5
      name: provider_suffix
      label: Suffix
      hint: Jr, Sr, MD, PhD, etc
      type: text
      options: []
      required: false
    - id: 6
      name: provider_npi
      label: NPI Number
      hint: National Provider Identifier
      type: text
      options: []
      required: true
    - id: 7
      name: provider_tax_id
      label: Tax ID Number
      hint: Federal Tax Identification Number
      type: text
      options: []
      required: true
    - id: 8
      name: provider_license_number
      label: License Number
      hint: State medical license number
      type: text
      options: []
      required: true
    - id: 9
      name: license_state
      label: License State
      hint: State where license is issued
      type: text
      options: []
      required: true
    - id: 10
      name: provider_specialty
      label: Medical Specialty
      hint: Primary area of practice
      type: select_one
      options:
      - Family Medicine
      - Internal Medicine
      - Pediatrics
      - Cardiology
      - Orthopedics
      - Neurology
      - Psychiatry
      - Dermatology
      - Radiology
      - Anesthesiology
      - Surgery
      - Emergency Medicine
      - Other
      required: true
    - id: 11
      name: provider_email
      label: Email Address
      hint: Professional email address
      type: email
      options: []
      required: true
    - id: 12
      name: provider_phone
      label: Phone Number
      hint: Office contact number
      type: text
      options: []
      required: true
    - id: 13
      name: practice_information
      label: Practice Information
      hint: Enter practice or facility details
      type: note
      options: []
      required: false
    - id: 14
      name: practice_name
      label: Practice Name
      hint: Name of medical practice or facility
      type: text
      options: []
      required: true
    - id: 15
      name: practice_address
      label: Practice Address
      hint: Complete street address
      type: text
      options: []
      required: true
    - id: 16
      name: practice_city
      label: City
      hint: City where practice is located
      type: text
      options: []
      required: true
    - id: 17
      name: practice_state
      label: State
      hint: State where practice is located
      type: text
      options: []
      required: true
    - id: 18
      name: practice_zip
      label: ZIP Code
      hint: Postal code for practice location
      type: text
      options: []
      required: true
    - id: 19
      name: billing_information
      label: Billing Information
      hint: Enter billing and insurance details
      type: note
      options: []
      required: false
    - id: 20
      name: billing_contact_name
      label: Billing Contact Name
      hint: Person responsible for billing
      type: text
      options: []
      required: true
    - id: 21
      name: billing_email
      label: Billing Email
      hint: Email for billing correspondence
      type: email
      options: []
      required: true
    - id: 22
      name: billing_phone
      label: Billing Phone
      hint: Phone number for billing questions
      type: text
      options: []
      required: true
    - id: 23
      name: insurance_accepted
      label: Insurance Plans Accepted
      hint: Select insurance plans you accept
      type: select_multiple
      options:
      - Medicare
      - Medicaid
      - Blue Cross Blue Shield
      - Aetna
      - Cigna
      - UnitedHealthcare
      - Humana
      - Tricare
      - Self-Pay Only
      required: true
    - id: 24
      name: credentialing_status
      label: Current Credentialing Status
      hint: What is your current status
      type: select_one
      options:
      - Fully Credentialed
      - Pending Credentialing
      - Initial Application
      - Re-Credentialing Required
      - Not Yet Credentialed
      required: true
    - id: 25
      name: hospital_affiliations
      label: Hospital Affiliations
      hint: List hospitals where you have privileges
      type: text
      options: []
      required: false
    - id: 26
      name: board_certifications
      label: Board Certifications
      hint: List all board certifications held
      type: text
      options: []
      required: false
    - id: 27
      name: malpractice_insurance
      label: Malpractice Insurance
      hint: Do you have current malpractice coverage
      type: select_one
      options:
      - Yes - Fully Insured
      - No - Not Insured
      - Pending Coverage
      required: true
    - id: 28
      name: malpractice_carrier
      label: Malpractice Insurance Carrier
      hint: Name of insurance company
      type: text
      options: []
      required: false
    - id: 29
      name: malpractice_policy_number
      label: Policy Number
      hint: Malpractice policy number
      type: text
      options: []
      required: false
    - id: 30
      name: dea_number
      label: DEA Number
      hint: Drug Enforcement Administration number
      type: text
      options: []
      required: false
    - id: 31
      name: education_training
      label: Education and Training
      hint: Medical school and residency information
      type: text
      options: []
      required: false
    - id: 32
      name: years_in_practice
      label: Years in Practice
      hint: How long have you been practicing
      type: select_one
      options:
      - Less than 1 year
      - 1-5 years
      - 5-10 years
      - 10-20 years
      - 20+ years
      required: true
    - id: 33
      name: references_available
      label: Professional References
      hint: Are professional references available
      type: select_one
      options:
      - Yes - References Available
      - No - Not Available
      required: true
    - id: 34
      name: documentation_attached
      label: Documentation Attached
      hint: Have you attached all required documents
      type: select_one
      options:
      - Yes - All Documents Attached
      - No - Will Submit Separately
      required: true
    - id: 35
      name: authorization_signature
      label: Authorization
      hint: Certify information is accurate
      type: select_one
      options:
      - I certify all information is true and accurate
      - I authorize verification of credentials provided
      required: true
