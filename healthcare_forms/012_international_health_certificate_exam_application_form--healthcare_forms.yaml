inputSchema:
  type: object
  properties:
    title: International Health Certificate Exam Application Form
    pages:
    - id: 1
      name: first_page
      label: First Page
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: applicant_info
      label: Applicant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: medical_history
      label: Medical History
      hint: Please provide detailed medical history.
      type: text
      options: []
      required: false
    - id: 4
      name: medical_history_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: exam_requirements
      label: Exam Requirements
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: exam_location
      label: Exam Location
      hint: Where will the exam take place?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: medical_certificates
      label: Medical Certificates
      hint: Please upload required medical certificates.
      type: text
      options: []
      required: false
    - id: 8
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: submit
      label: Submit
      hint: null
      type: note
      options: []
      required: false
