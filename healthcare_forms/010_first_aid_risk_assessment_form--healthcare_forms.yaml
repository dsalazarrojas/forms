inputSchema:
  type: object
  properties:
    title: First Aid Risk Assessment Form
    pages:
    - id: 1
      name: facility_type
      label: Facility Type
      hint: null
      type: select_multiple
      options:
      - Facility
      - Company
      - School
      required: true
    - id: 2
      name: first_aid_equipment
      label: First Aid Equipment
      hint: null
      type: select_multiple
      options:
      - First Aid Kit
      - Bandages
      - Gloves
      - CPR Mask
      - CPR Bag
      required: true
    - id: 3
      name: first_aid_training
      label: First Aid Training
      hint: null
      type: select_multiple
      options:
      - First Aid and CPR
      - Basic Life Support
      - Emergency Response
      required: true
    - id: 4
      name: risk_rating
      label: Risk Rating
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 5
      name: first_aid_inspection
      label: First Aid Inspection
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: emergency_contact_phone
