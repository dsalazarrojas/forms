      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: screening_questions
      label: Screening Questions
      hint: null
      type: select_multiple
      options:
      - Cognitive decline in the last year?
      - Cognitive decline in the last five years?
      - Cognitive decline in the last 10 years?
      - Cognitive decline in the last 15 years?
      - Cognitive decline in the last 20 years?
      - Cognitive decline in the last 25 years?
      required: false
    - id: 3
      name: cognitive_impairment
      label: Cognitive Impairment
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: risk_factors
      label: Risk Factors
      hint: null
      type: select_multiple
      options:
      - Vascular disease
      - Traumatic brain injury
      - Neurodegenerative disease
      - Infection
      - Inflammation
      - Autoimmune disease
      - Tumors
      - Other
      required: false
    - id: 5
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: cognitive_function
      label: Cognitive Function
