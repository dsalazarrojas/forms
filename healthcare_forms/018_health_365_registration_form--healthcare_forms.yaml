      name: medication
      label: Medication
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: allergies
      label: Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: medical_insurance
      label: Medical Insurance
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: doctor_referral
      label: Doctor Referral
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
