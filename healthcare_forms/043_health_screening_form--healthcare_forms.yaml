inputSchema:
  type: object
  properties:
    title: Health Screening Form
    pages:
    - id: 1
      name: personal_info
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: medical_conditions
      label: Do you have any medical conditions?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: medical_symptoms
      label: Please describe any medical symptoms you are experiencing.
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: medical_history
      label: Do you have any medical history?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: travel_history
      label: Have you traveled recently?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: travel_places
      label: Where have you traveled recently?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: travel_duration
      label: How long was your recent trip?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: medical_precautions
      label: Do you have any medical precautions?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: medical_device
      label: Do you have a medical device that requires special care?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: medical_procedures
      label: Have you had any medical procedures recently?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: medical_allergies
      label: Do you have any known allergies?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: medical_insurance
      label: What is your medical insurance status?
      hint: null
      type: text
      options: []
      required: false
