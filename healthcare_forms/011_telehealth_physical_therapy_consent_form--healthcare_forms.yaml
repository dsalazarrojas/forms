inputSchema:
  type: object
  properties:
    title: Telehealth Physical Therapy Consent Form
    pages:
    - id: 1
      name: patient_name
      label: First Name
      hint: Enter first name
      type: text
      options: []
      required: true
    - id: 2
      name: patient_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Enter email address
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: Enter 10-digit phone number
      type: text
      options: []
      required: true
    - id: 5
      name: date
      label: Date of Appointment
      hint: Select date of appointment
      type: date
      options: []
      required: true
    - id: 6
      name: time
      label: Time of Appointment
      hint: Select time of appointment
      type: time
      options: []
      required: true
    - id: 7
      name: telehealth_provider
      label: Telehealth Provider
      hint: Select telehealth provider
      type: select_one
      options:
      - Physical Therapist
      - Doctor
      required: true
    - id: 8
      name: consent
      label: Consent
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: payment_method
      label: Payment Method
      hint: Select payment method
      type: select_one
      options:
      - Card
      - PayPal
      - Bank Transfer
      required: true
    - id: 10
      name: amount
      label: Amount
      hint: Enter amount
      type: number
      options: []
      required: true
    - id: 11
      name: payment_date
      label: Payment Date
      hint: Select payment date
      type: date
      options: []
      required: true
    - id: 12
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: true
