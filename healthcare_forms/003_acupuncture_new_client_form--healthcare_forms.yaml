inputSchema:
  type: object
  properties:
    title: Acupuncture New Client Form
    pages:
    - id: 1
      name: client_info_header
      label: -- New Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_full_name
      label: Full Name
      hint: Enter your legal name
      type: text
      options: []
      required: true
    - id: 3
      name: client_dob
      label: Date of Birth
      hint: Your birth date
      type: date
      options: []
      required: true
    - id: 4
      name: client_gender
      label: Gender
      hint: Select your gender identity
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Other
      - Prefer not to answer
      required: true
    - id: 5
      name: client_address
      label: Address
      hint: Current residential address
      type: text
      options: []
      required: true
    - id: 6
      name: client_phone
      label: Phone Number
      hint: Primary contact number
      type: text
      options: []
      required: true
    - id: 7
      name: client_email
      label: Email Address
      hint: Valid email for appointment confirmations
      type: email
      options: []
      required: true
    - id: 8
      name: health_insurance
      label: Health Insurance Provider
      hint: Name of your insurance company
      type: text
      options: []
      required: false
    - id: 9
      name: policy_number
      label: Policy Number
      hint: Your insurance policy number
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of person to contact in case of emergency
      type: text
      options: []
      required: true
    - id: 11
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number for emergency contact
      type: text
      options: []
      required: true
    - id: 12
      name: emergency_relationship
      label: Relationship to Emergency Contact
      hint: How are you related to this person?
      type: text
      options: []
      required: true
    - id: 13
      name: medical_history_header
      label: -- Medical History --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: current_medications
      label: Current Medications
      hint: List all medications you are currently taking
      type: text
      options: []
      required: false
    - id: 15
      name: known_allergies
      label: Known Allergies
      hint: List any known allergies to medications, foods, or substances
      type: text
      options: []
      required: false
    - id: 16
      name: chronic_conditions
      label: Chronic Medical Conditions
      hint: List any ongoing medical conditions
      type: text
      options: []
      required: false
    - id: 17
      name: previous_surgeries
      label: Previous Surgeries
      hint: List any past surgical procedures
      type: text
      options: []
      required: false
    - id: 18
      name: reason_for_visit
      label: Reason for Seeking Acupuncture
      hint: Describe why you are seeking acupuncture treatment
      type: text
      options: []
      required: true
    - id: 19
      name: treatment_preferences
      label: Preferred Treatment Areas
      hint: Which parts of the body do you want treated?
      type: text
      options: []
      required: false
    - id: 20
      name: consent_agreement
      label: Consent to Treatment
      hint: Do you agree to the terms of treatment?
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 21
      name: privacy_policy_acknowledged
      label: Privacy Policy Acknowledged
      hint: Have you read and understood our privacy policy?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 22
      name: signature_date
      label: Signature Date
      hint: Date of signing this form
      type: date
      options: []
      required: true
    - id: 23
      name: client_signature
      label: Client Signature
      hint: Your electronic signature
      type: text
      options: []
      required: true
