inputSchema:
  type: object
  properties:
    title: Consent To Take And Use Photograph
    pages:
    - id: 1
      name: section_personal_information
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Provide the full legal name of the participant
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of birth
      hint: Use YYYY-MM-DD format
      type: date
      options: []
      required: false
    - id: 4
      name: contact_email
      label: Contact email
      hint: Enter a valid email for follow up
      type: email
      options: []
      required: false
    - id: 5
      name: contact_phone
      label: Contact phone
      hint: Include country code if outside local area
      type: text
      options: []
      required: false
    - id: 6
      name: photo_usage_purpose
      label: Photo usage purpose
      hint: Briefly describe how photographs will be used
      type: text
      options: []
      required: true
    - id: 7
      name: usage_duration
      label: Usage duration
      hint: Select how long the photo may be used
      type: select_one
      options:
      - 1 year
      - 2 years
      - Indefinite
      required: true
    - id: 8
      name: consent_given
      label: Consent given
      hint: Confirm that participant consents to photograph use
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 9
      name: photographer_name
      label: Photographer name
      hint: Name of the authorized photographer or organization
      type: text
      options: []
      required: false
    - id: 10
      name: signature
      label: Participant signature name
      hint: Typed name serves as signature for consent
      type: text
      options: []
      required: true
    - id: 11
      name: consent_date
      label: Consent date
      hint: Date when consent was provided
      type: date
      options: []
      required: true
