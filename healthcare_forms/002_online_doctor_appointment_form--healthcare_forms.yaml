inputSchema:
  type: object
  properties:
    title: online_doctor_appointment_form
    pages:
    - id: 1
      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: appointment_details
      label: Appointment Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: available_doctors
      label: Available Doctors
      hint: null
      type: select_multiple
      options:
      - Dr Smith
      - Dr Johnson
      - Dr Brown
      required: true
    - id: 4
      name: selected_doctor
      label: Selected Doctor
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: appointment_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: appointment_time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: appointment_time_slot
      label: Time Slot
      hint: null
      type: select_multiple
      options:
      - 9:00-10:00 AM
      - 10:00-11:00 AM
      - 11:00-12:00 PM
      required: false
    - id: 8
      name: appointment_length
      label: Appointment Length
      hint: null
      type: select_multiple
      options:
      - 30 minutes
      - 60 minutes
      required: true
    - id: 9
      name: reason_for_visit
      label: Reason for Visit
      hint: null
      type: select_multiple
      options:
      - Checkup
      - Consultation
      - Other
      required: true
    - id: 10
      name: medical_history
      label: Medical History
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: special_instructions
      label: Special Instructions
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: medical_practice_address
      label: Medical Practice Address
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: medical_practice_email
      label: Medical Practice Email
      hint: null
      type: email
      options: []
      required: true
    - id: 14
      name: medical_practice_phone
      label: Medical Practice Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: patient_message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: terms_and_conditions
      label: Terms and Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: patient_signature
      label: Patient Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: doctor_signature
      label: Doctor Signature
      hint: null
      type: text
      options: []
      required: true
