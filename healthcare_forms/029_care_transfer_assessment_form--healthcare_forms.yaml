inputSchema:
  type: object
  properties:
    title: Care Transfer Assessment Form
    pages:
    - id: 1
      name: transfer_header
      label: -- Transfer Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient name
      hint: Name of the patient being transferred
      type: text
      options: []
      required: true
    - id: 3
      name: transferring_facility
      label: Transferring facility
      hint: Where patient is coming from
      type: text
      options: []
      required: true
    - id: 4
      name: receiving_facility
      label: Receiving facility
      hint: Destination facility for transfer
      type: text
      options: []
      required: true
    - id: 5
      name: transfer_date
      label: Transfer date
      hint: Scheduled date for transfer
      type: date
      options: []
      required: true
    - id: 6
      name: clinical_status
      label: Current clinical status
      hint: Summary of condition and stability
      type: text
      options: []
      required: true
    - id: 7
      name: essential_equipment
      label: Essential equipment to accompany patient
      hint: List equipment oxygen monitors etc
      type: text
      options: []
      required: false
    - id: 8
      name: medication_list
      label: Medication list at transfer
      hint: Current medications and dosages
      type: text
      options: []
      required: true
    - id: 9
      name: contact_for_queries
      label: Contact for queries during transfer
      hint: Phone or email for transfer coordinator
      type: text
      options: []
      required: true
    - id: 10
      name: family_notified
      label: Family notified of transfer
      hint: Confirm notification status
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
