      name: waitlist_vaccine_history_header
      label: -- Vaccine History --
      hint: Your COVID-19 vaccination status
      type: note
      options: []
      required: false
    - id: 18
      name: waitlist_previous_doses
      Label: Previous COVID-19 Vaccine Doses
      hint: How many doses have you had
      type: integer
      options: []
      required: true
    - id: 19
      name: waitlist_vaccine_type
      label: Vaccine Type if Previously Vaccinated
      hint: What vaccine did you receive
      type: select_one
      options:
        - Pfizer-BioNTech
        - Moderna
        - Johnson & Johnson
        - AstraZeneca
        - Novavax
        - Mixed types
        - Unsure
        - Have not been vaccinated
      required: false
    - id: 20
      name: waitlist_covid_status_header
      Label: -- COVID-19 Status --
      hint: Your COVID-19 history
      type: note
      options: []
      required: false
    - id: 21
      name: waitlist_had_covid
      label: Have You Had COVID-19 Previously
      hint: Any previous COVID-19 infection
      type: select_one
      options:
        - Yes
        - No
        - Unsure
      required: true
    - id: 22
      name: waitlist_covid_date
      Label: Date of COVID-19 Infection
      hint: When did you have COVID-19
      type: date
      options: []
      required: false
    - id: 23
      name: waitlist_preference_header
      label: -- Preferences and Consent --
      hint: How you prefer to be contacted
      type: note
      options: []
      required: false
    - id: 24
      name: waitlist_contact_preference
      Label: Preferred Contact Method
      hint: How should we notify you
      type: select_one
      options:
        - Email
        - Phone Call
        - Text Message
        - Mail
        - No preference
      required: true
    - id: 25
      name: waitlist_confirmation
      label: I Confirm All Information is Accurate
      hint: All provided information is correct and true
      type: select_one
      options:
        - Confirmed accurate
        - Needs correction
      required: true
