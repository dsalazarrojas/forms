      name: waitlist_insurance
      label: Insurance Status
      hint: Do you have health insurance
      type: select_one
      options:
        - Yes, insured
        - No, uninsured
        - Medicare
        - Medicaid
        - Other
      required: false
    - id: 16
      name: waitlist_primary_provider
      Label: Do You Have a Primary Care Provider
      hint: Regular doctor or clinic
      type: select_one
      options:
        - Yes
        - No
        - Unsure
      required: false
