    - id: 2
      name: waitlist_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: waitlist_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: waitlist_middle_initial
      Label: Middle Initial
      hint: Your middle initial if applicable
      type: text
      options: []
      required: false
    - id: 5
      name: waitlist_date_of_birth
      label: Date of Birth
      hint: MM-DD-YYYY
      type: date
      options: []
      required: true
    - id: 6
      name: waitlist_email
      Label: Email Address
      hint: Your primary email
      type: email
      options: []
      required: true
    - id: 7
      name: waitlist_phone
      label: Phone Number
      hint: Your contact phone number
      type: phone
      options: []
      required: true
    - id: 8
      name: waitlist_address
      Label: Street Address
      hint: Your current address
      type: text
      options: []
      required: true
    - id: 9
      name: waitlist_city_state_zip
      label: City, State, ZIP Code
      hint: Your location
      type: text
      options: []
      required: true
