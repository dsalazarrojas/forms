      name: waitlist_priority_group
      label: Priority Group Status
      hint: What group are you in
      type: select_one
      options:
        - Healthcare worker
        - Essential worker
        - Age 65 or older
        - Age 50-64
        - Underlying medical condition
        - General population
      required: true
    - id: 12
      name: waitlist_age_group
      Label: Age Group
      hint: Your age category
      type: select_one
      options:
        - Under 18
        - 18-49
        - 50-64
        - 65-74
        - 75+
      required: true
    - id: 13
      name: waitlist_medical_conditions
      label: Underlying Medical Conditions
      hint: If you have qualifying conditions
      type: text
      options: []
      required: false
