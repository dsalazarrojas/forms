inputSchema:
  type: object
  properties:
    title: Physiotherapy Session Feedback Form
    pages:
    - id: 1
      name: patient_rating
      label: Overall Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: feedback
      label: Feedback
      hint: Write your feedback here.
      type: text
      options: []
      required: false
    - id: 4
      name: therapist_name
      label: Therapist Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: session_length
      label: Session Length
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: rating_scale
      label: Rating Scale
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 7
      name: rating_comment
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: follow_up
      label: Follow Up
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
