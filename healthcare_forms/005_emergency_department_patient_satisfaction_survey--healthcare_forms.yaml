inputSchema:
  type: object
  properties:
    title: emergency_department_patient_satisfaction_survey
    pages:
    - id: 1
      name: visit_length
      label: Visit Length
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: prophets
      label: Providers And Staff
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: wait_time
      label: Wait Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: pain_management
      label: Pain Management
      hint: null
      type: select_one
      options:
      - No pain
      - Some pain
      - A lot of pain
      required: false
    - id: 6
      name: communication
      label: Communication
      hint: null
      type: select_multiple
      options:
      - Clear and easy to understand
      - Somewhat clear
      - Not clear
      required: false
    - id: 7
      name: hospital_staff
      label: Hospital Staff
      hint: null
      type: select_one
      options:
      - Very good
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: discharge_process
      label: Discharge Process
      hint: null
      type: select_one
      options:
      - Very smooth
      - Smooth
      - Somewhat smooth
      - Not smooth
      required: false
    - id: 9
      name: billing_clearness
      label: Billing Clarity
      hint: null
      type: select_one
      options:
      - Clear
      - Somewhat clear
      - Not clear
      required: false
    - id: 10
      name: recommendations
      label: Recommendations For Future Care
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
