inputSchema:
  type: object
  properties:
    title: Dermal Filler Aftercare Form
    pages:
    - id: 1
      name: follow_up_appointments
      label: Follow-up Appointments
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Other
      required: true
    - id: 2
      name: follow_up_contact
      label: Follow-up Contact
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - Other
      required: true
    - id: 3
      name: follow_up_instructions
      label: Follow-up Instructions
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: follow_up_advice
      label: Follow-up Advice
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: follow_up_symptoms
      label: Follow-up Symptoms
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: follow_up_schedule
      label: Follow-up Schedule
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: follow_up_phone
      label: Follow-up Phone
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      required: true
    - id: 8
      name: follow_up_email
      label: Follow-up Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: follow_up_notes
      label: Follow-up Notes
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: follow_up_other
      label: Follow-up Other
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: follow_up_other_comments
      label: Follow-up Other Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: follow_up_other_schedule
      label: Follow-up Other Schedule
      hint: null
      type: date
      options: []
      required: false
