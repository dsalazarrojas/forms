inputSchema:
  type: object
  properties:
    title: Passenger Self Reporting Form
    pages:
    - id: 1
      name: travel_agency
      label: What is your travel agency?
      hint: Please select your travel agency
      type: select_one
      options:
      - ABC Travels
      - DEF Travels
      required: true
    - id: 2
      name: airport
      label: What airports did you travel from?
      hint: Select all airports you visited
      type: select_multiple
      options:
      - Airport 1
      - Airport 2
      - Airport 3
      required: true
    - id: 3
      name: symptoms
      label: Describe your symptoms
      hint: Enter your symptoms, e.g. fever, cough, sore throat, etc.
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: Enter a valid email
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone number
      hint: Enter a valid phone number
      type: text
      options: []
      required: true
    - id: 6
      name: travel_date
      label: Travel date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: travel_time
      label: Travel time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: travel_location
      label: Travel location
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: airline
      label: Airline
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: flight_number
      label: Flight number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: travel_duration
      label: Travel duration
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: travel_agency_type
      label: Travel agency type
      hint: null
      type: select_one
      options:
      - DEF Travels
      - GHI Travels
      required: false
