inputSchema:
  type: object
  properties:
    title: Best Patient Care Team Nomination Form
    pages:
    - id: 1
      name: nominator_name
      label: Your Name
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 2
      name: nominator_relationship
      label: Your Relationship to Patient
      hint: How are you related to the patient
      type: select_one
      options:
      - Patient
      - Family Member
      - Friend
      - Healthcare Colleague
      - Other
      required: true
    - id: 3
      name: nominator_email
      label: Email Address
      hint: We will send confirmation to this email
      type: email
      options: []
      required: true
    - id: 4
      name: nominator_phone
      label: Phone Number
      hint: For follow-up questions if needed
      type: text
      options: []
      required: false
    - id: 5
      name: facility_name
      label: Healthcare Facility Name
      hint: Name of the hospital or clinic
      type: text
      options: []
      required: true
    - id: 6
      name: facility_location
      label: Facility Location
      hint: City and state of the facility
      type: text
      options: []
      required: true
    - id: 7
      name: department
      label: Department or Unit
      hint: Which department did the care team work in
      type: select_one
      options:
      - Emergency Department
      - Intensive Care Unit
      - Medical-Surgical Unit
      - Pediatrics
      - Oncology
      - Cardiology
      - Orthopedics
      - Maternity
      - Geriatrics
      - Mental Health
      - Outpatient Clinic
      - Other
      required: true
    - id: 8
      name: team_member_names
      label: Care Team Member Names
      hint: List the names of team members you want to nominate
      type: text
      options: []
      required: true
    - id: 9
      name: care_period
      label: Period of Care
      hint: When did you receive care from this team
      type: text
      options: []
      required: true
    - id: 10
      name: care_quality_rating
      label: Overall Care Quality Rating
      hint: How would you rate the overall quality of care
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: compassion_rating
      label: Compassion and Empathy Rating
      hint: How compassionate was the care team
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 12
      name: communication_rating
      label: Communication Rating
      hint: How well did the team communicate with you
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: responsiveness_rating
      label: Responsiveness Rating
      hint: How responsive was the team to your needs
      type: select_one
      options:
      - Very Responsive
      - Mostly Responsive
      - Somewhat Responsive
      - Slow to Respond
      - Unresponsive
      required: true
    - id: 14
      name: professionalism_rating
      label: Professionalism Rating
      hint: Rate the team professionalism
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: standout_qualities
      label: Standout Qualities
      hint: What made this care team exceptional
      type: select_multiple
      options:
      - Compassionate Care
      - Clear Communication
      - Quick Response Time
      - Medical Expertise
      - Emotional Support
      - Patient Advocacy
      - Teamwork
      - Attention to Detail
      - Cultural Sensitivity
      - Going Above and Beyond
      required: true
    - id: 16
      name: care_experience
      label: Describe Your Care Experience
      hint: Share details about your experience with this team
      type: text
      options: []
      required: true
    - id: 17
      name: impact_description
      label: How Did This Team Make a Difference
      hint: Describe the positive impact on patient outcomes or experience
      type: text
      options: []
      required: true
    - id: 18
      name: would_recommend
      label: Would You Recommend This Care Team
      hint: Would you recommend this team to others
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Not Sure
      - Probably No
      - Definitely No
      required: true
    - id: 19
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback or recognition you would like to share
      type: text
      options: []
      required: false
