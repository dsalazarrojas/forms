inputSchema:
  type: object
  properties:
    title: Eligibility Quiz
    pages:
    - id: 1
      name: eligibility_question_1
      label: Is this person 18 years or older?
      hint: null
      type: select_one
      options:
      - 18 years or older
      - less than 18 years
      required: false
    - id: 2
      name: eligibility_question_2
      label: Has this person been previously diagnosed with any of the following medical
        conditions?
      hint: null
      type: select_multiple
      options:
      - Hypertension
      - Diabetes
      - Chronic Kidney Disease
      - Heart Disease
      - Chronic Liver Disease
      - Respiratory Disease
      required: false
    - id: 3
      name: eligibility_question_3
      label: How many hours do you sleep each night?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: eligibility_question_4
      label: Do you have access to internet?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: eligibility_question_5
      label: Do you have a stable job or income?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: eligibility_question_6
      label: Do you have a stable residence address?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: eligibility_question_7
      label: Has this person ever used any of the following substances?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: eligibility_question_8
      label: What is this person's weight in kilograms?
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: eligibility_question_9
      label: What is this person's height in centimeters?
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: eligibility_question_10
      label: What is this person's BMI?
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: eligibility_question_11
      label: Do you have a history of smoking?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: eligibility_question_12
      label: Do you take any medications?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
