inputSchema:
  type: object
  properties:
    title: Medicines Fridge Check Form
    pages:
    - id: 1
      name: medicine_name
      label: Medicine Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: temperature_reading_1
      label: Morning Temperature
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: temperature_reading_2
      label: Afternoon Temperature
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: temperature_reading_3
      label: Evening Temperature
      hint: null
      type: number
      options: []
      required: false
