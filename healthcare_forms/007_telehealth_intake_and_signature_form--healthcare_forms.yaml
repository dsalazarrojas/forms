inputSchema:
  type: object
  properties:
    title: Telehealth Intake And Signature Form
    pages:
    - id: 1
      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: contact_method
      label: Contact Method
      hint: null
      type: select_multiple
      options:
      - call
      - email
      - text
      required: false
    - id: 5
      name: schedule_time
      label: Schedule Time
      hint: null
      type: time
      options: []
      required: false
