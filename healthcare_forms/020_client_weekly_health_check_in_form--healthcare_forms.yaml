inputSchema:
  type: object
  properties:
    title: Client Weekly Health Check In Form
    pages:
    - id: 1
      name: employee_section
      label: -- Employee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: Optional
      type: text
      options: []
      required: false
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: check_in_date
      label: Check-in Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: health_section
      label: -- Health Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: overall_health
      label: Overall health status this week
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 8
      name: covid_symptoms
      label: Any COVID-19 symptoms?
      hint: Fever, cough, shortness of breath, etc.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: covid_symptoms_detail
      label: If yes, describe symptoms
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: illness_section
      label: -- Illness or Concerns --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: current_illness
      label: Any acute illness or infections?
      hint: Cold, flu, other
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: chronic_conditions
      label: Any changes in chronic conditions?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not applicable
      required: false
    - id: 13
      name: medication_changes
      label: Any changes in medications?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: wellness_section
      label: -- Wellness Metrics --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: sleep_quality
      label: Sleep quality this week
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 16
      name: stress_level
      label: Stress level
      hint: Low, Moderate, or High
      type: select_one
      options:
      - Low
      - Moderate
      - High
      required: true
    - id: 17
      name: exercise_frequency
      label: Days exercised this week
      hint: null
      type: number
      options: []
      required: false
    - id: 18
      name: exposure_section
      label: -- Exposure and Contact --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: close_contact
      label: Close contact with anyone with symptoms?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 20
      name: work_status
      label: Status for coming to work
      hint: null
      type: select_one
      options:
      - Ready to work
      - Work from home preferred
      - Medical leave needed
      - Other
      required: true
    - id: 21
      name: additional_notes
      label: Additional health notes or concerns
      hint: Optional
      type: text
      options: []
      required: false
