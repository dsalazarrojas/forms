inputSchema:
  type: object
  properties:
    title: Childhood Development Screening Evaluation Form
    pages:
    - id: 1
      name: header_info
      label: -- Child Development Screening --
      hint: Standardized evaluation for developmental milestones
      type: note
      options: []
      required: false
    - id: 2
      name: child_name
      label: Child Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      - Prefer not to say
      required: true
    - id: 5
      name: age_at_screening
      label: Age at Screening - months
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: gross_motor_header
      label: -- Gross Motor Skills --
      hint: Check if the child can perform the following
      type: note
      options: []
      required: false
    - id: 7
      name: walks_independently
      label: Walks independently and steadily
      hint: null
      type: select_one
      options:
      - true
      - false
      - Sometimes
      required: true
    - id: 8
      name: climbs_stairs
      label: Climbs stairs with assistance
      hint: null
      type: select_one
      options:
      - true
      - false
      - Sometimes
      required: true
    - id: 9
      name: fine_motor_header
      label: -- Fine Motor Skills --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: uses_utensils
      label: Uses a spoon or fork with some success
      hint: null
      type: select_one
      options:
      - true
      - false
      - Sometimes
      required: true
    - id: 11
      name: stacks_blocks
      label: Stacks two or more blocks
      hint: null
      type: select_one
      options:
      - true
      - false
      - Sometimes
      required: true
    - id: 12
      name: language_header
      label: -- Communication and Language --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: word_count
      label: Approximately how many single words does the child use?
      hint: null
      type: select_one
      options:
      - 0 to 5
      - 6 to 20
      - 21 to 50
      - More than 50
      required: true
    - id: 14
      name: follows_simple_commands
      label: Follows simple one-step instructions
      hint: e.g. Give me the ball
      type: select_one
      options:
      - true
      - false
      - Sometimes
      required: true
    - id: 15
      name: social_emotional_header
      label: -- Social and Emotional Development --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: shows_affection
      label: Shows affection to familiar people
      hint: null
      type: select_one
      options:
      - true
      - false
      - Sometimes
      required: true
    - id: 17
      name: plays_near_others
      label: Plays near other children - parallel play
      hint: null
      type: select_one
      options:
      - true
      - false
      - Sometimes
      required: true
    - id: 18
      name: screeners_comments
      label: Screeners Observations and Recommendations
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: follow_up_needed
      label: Is a follow-up evaluation recommended?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 20
      name: examiner_name
      label: Examiner Name
      hint: null
      type: text
      options: []
      required: true
    - id: 21
      name: screening_date
      label: Screening Date
      hint: null
      type: date
      options: []
      required: true
