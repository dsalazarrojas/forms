inputSchema:
  type: object
  properties:
    title: Vividness Of Visual Imaginary Questionnaire (VVIQ)
    pages:
    - id: 1
      name: vividness_score_1
      label: How often do you experience vivid dreams about visual scenes?
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: question_2
      label: Can you recall a visual image that you had in childhood?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: question_3
      label: Do you experience visual imagery when falling asleep?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - rarely
      - never
      required: true
    - id: 4
      name: question_4
      label: How often do you see mental images when daydreaming?
      hint: null
      type: select_multiple
      options:
      - frequently
      - occasionally
      - rarely
      - never
      required: true
    - id: 5
      name: question_5
      label: Have you ever had a vivid visual hallucination during sleep?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - rarely
      - never
      required: true
    - id: 6
      name: question_6
      label: Do you experience visual imagery when listening to music?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - rarely
      - never
      required: true
    - id: 7
      name: question_7
      label: Can you recall a time when you had a vivid visual memory?
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: question_8
      label: How often do you see mental images when thinking about a specific task
        or problem?
      hint: null
      type: select_multiple
      options:
      - frequently
      - occasionally
      - rarely
      - never
      required: true
    - id: 9
      name: question_9
      label: Have you had a vivid mental image that interfered with your ability to
        fall asleep?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - rarely
      - never
      required: true
    - id: 10
      name: question_10
      label: Have you experienced a change in your visual imagination during periods
        of stress or anxiety?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - rarely
      - never
      required: true
    - id: 11
      name: question_11
      label: Do you experience mental images when your eyes are closed?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - rarely
      - never
      required: true
    - id: 12
      name: question_12
      label: Can you recall a vivid mental image that was very intense?
      hint: null
      type: text
      options: []
      required: true
