inputSchema:
  type: object
  properties:
    title: COVID 19 Vaccine Event Registration Form
    pages:
    - id: 1
      name: attendee_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: attendee_email
      label: Email Address
      hint: For event confirmation and updates
      type: email
      options: []
      required: true
    - id: 3
      name: attendee_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: event_section
      label: -- Event Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: event_time
      label: Event Time
      hint: Preferred time slot
      type: time
      options: []
      required: true
    - id: 8
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: attendees_section
      label: -- Number of Attendees --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: number_attending
      label: Number of People in Your Group
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: additional_attendees
      label: Additional Attendee Names
      hint: If more than one person
      type: text
      options: []
      required: false
    - id: 12
      name: vaccination_section
      label: -- Vaccination Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: vaccination_intent
      label: Reason for Attending
      hint: null
      type: select_one
      options:
      - First dose
      - Second dose
      - Booster dose
      - Information only
      - Accompanying family member
      required: true
    - id: 14
      name: vaccine_preference
      label: Vaccine Type Preference
      hint: null
      type: select_one
      options:
      - Pfizer
      - Moderna
      - Johnson and Johnson
      - No preference
      required: true
    - id: 15
      name: prior_vaccination
      label: Prior COVID-19 vaccinations received
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: last_dose_date
      label: Date of Last Vaccination
      hint: null
      type: date
      options: []
      required: false
    - id: 17
      name: demographics_section
      label: -- Demographics --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: age_group
      label: Age Group
      hint: null
      type: select_one
      options:
      - Under 12
      - 12-17
      - 18-24
      - 25-34
      - 35-44
      - 45-54
      - 55-64
      - 65-74
      - 75+
      required: true
    - id: 19
      name: race_ethnicity
      label: Race or Ethnicity
      hint: null
      type: select_one
      options:
      - White or Caucasian
      - Black or African American
      - Hispanic or Latino
      - Asian or Asian American
      - Native American or Alaska Native
      - Pacific Islander
      - Multiracial
      - Other
      - Prefer not to say
      required: false
    - id: 20
      name: language_preference
      label: Language Preference for Materials
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - Mandarin
      - Vietnamese
      - Somali
      - Other
      required: false
    - id: 21
      name: health_section
      label: -- Health Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: health_conditions
      label: Any chronic health conditions
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 23
      name: pregnancy
      label: Currently pregnant
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not applicable
      required: true
    - id: 24
      name: allergies
      label: Vaccine allergies or sensitivities
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: accessibility_section
      label: -- Accessibility --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: accessibility_needs
      label: Accessibility accommodations needed
      hint: Wheelchair access, interpreters, etc.
      type: text
      options: []
      required: false
    - id: 27
      name: transportation_needed
      label: Transportation assistance needed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 28
      name: dietary_restrictions
      label: Dietary restrictions or allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 29
      name: consent
      label: I consent to receive COVID-19 vaccine at this event
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
