inputSchema:
  type: object
  properties:
    title: COVID 19 Vaccine Registration Form
    pages:
    - id: 1
      name: personal_information_header
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: For vaccine registration confirmation
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: address_header
      label: -- Contact Address --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: street_address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: zip_code
      label: ZIP Code
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: medical_history_header
      label: -- Medical History --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: allergies
      label: Known Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: medical_conditions
      label: Chronic Medical Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: current_medications
      label: Current Medications
      hint: List if applicable
      type: text
      options: []
      required: false
    - id: 15
      name: vaccine_header
      label: -- Vaccination Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: vaccination_status
      label: Current Vaccination Status
      hint: null
      type: select_one
      options:
      - Unvaccinated
      - One dose received
      - Fully vaccinated
      - Boosted
      required: true
    - id: 17
      name: dose_seeking
      label: Which Dose Are You Seeking
      hint: null
      type: select_one
      options:
      - First dose
      - Second dose
      - Booster dose
      - Second booster
      required: true
    - id: 18
      name: vaccine_preference
      label: Vaccine Type Preference
      hint: null
      type: select_one
      options:
      - Pfizer-BioNTech
      - Moderna
      - Johnson & Johnson
      - No preference
      required: false
    - id: 19
      name: consent_header
      label: -- Consent & Acknowledgment --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: consent
      label: I consent to receive the COVID-19 vaccine
      hint: null
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
