inputSchema:
  type: object
  properties:
    title: Coarc Employer Survey 2017
    pages:
    - id: 1
      name: section_employer_info
      label: -- Employer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employer_name
      label: Employer Name
      hint: Name of your organization
      type: text
      options: []
      required: true
