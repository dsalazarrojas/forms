inputSchema:
  type: object
  properties:
    title: orthotic_device_consent_form
    pages:
    - id: 1
      name: general_information
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: patient_consent
      label: Patient Consent
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 3
      name: device_information
      label: Device Information
      hint: null
