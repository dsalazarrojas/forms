inputSchema:
  type: object
  properties:
    title: Pediatric Intubation Checklist Form
    pages:
    - id: 1
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: patient_info
      label: Patient Information
      hint: null
      type: select_multiple
      options:
      - Anesthesia
      - Asthma
      - Bronchitis
      - Cardiac Arrest
      - Coughing
      - Diabetic
      - Dyspnea
      - Eczema
      - Epilepsy
      - Hemiplegia
      - Hypertension
      - Laryngitis
      - Meningitis
      - Nausea
      - Neurological
      - Pneumonia
      - Respiratory
      - Sore Throat
      - Tachycardia
      - Wheezing
      required: false
    - id: 3
      name: medications
      label: Medications
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: anesthesia
      label: Anesthesia
      hint: null
      type: select_one
      options:
      - Etomidate
      - Fentanyl
      - Isoflurane
      - Ketamine
      - Midazolam
      - Propofol
      - Sevoflurane
      - Succinylcholine
      - Vecuronium
      required: false
    - id: 5
      name: vital_signs
      label: Vital Signs
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: patient_status
      label: Patient Status
      hint: null
      type: select_one
      options:
      - Stable
      - Other
      required: false
    - id: 7
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: medical_team
      label: Medical Team
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
