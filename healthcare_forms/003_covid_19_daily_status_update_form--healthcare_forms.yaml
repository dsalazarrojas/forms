inputSchema:
  type: object
  properties:
    title: Covid 19 Daily Status Update Form
    pages:
    - id: 1
      name: patient_name
      label: patient_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: patient_phone
      label: patient_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: vaccination_status
      label: vaccination_status
      hint: 'null'
      type: select_one
      options:
      - Not vaccinated
      - Partially vaccinated
      - Full vaccinated
      required: false
    - id: 4
      name: symptoms
      label: symptoms
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_vaccination
      label: date_of_vaccination
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time_of_vaccination
      label: time_of_vaccination
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: patient_address
      label: patient_address
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: medical_team
      label: medical_team
      hint: null
      type: select_multiple
      options:
      - Team Alpha
      - Team Beta
      - Team Gamma
      required: false
    - id: 9
      name: patient_email
      label: patient_email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: medical_history
      label: medical_history
      hint: null
      type: text
      options: []
      required: false
