inputSchema:
  type: object
  properties:
    title: Vaccine Distribution Efficiency Evaluation Form
    pages:
    - id: 1
      name: vaccine_distribution_process
      label: Vaccination Process
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: form_id
      label: Form ID
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: evaluation_period
      label: Evaluation Period
      hint: null
      type: select_one
      options:
      - Jan
      - Feb
      - Mar
      - Apr
      - May
      - Jun
      - Jul
      - Aug
      - Sep
      - Oct
      - Nov
      - Dec
      required: false
    - id: 4
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: vaccination_team_size
      label: Vaccination Team Size
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: vaccination_site
      label: Vaccination Site
      hint: null
      type: select_multiple
      options:
      - Hospital
      - Clinic
      - Community Center
      - Home
      - Other
      required: false
    - id: 7
      name: vaccine_type
      label: Vaccine Type
      hint: null
      type: select_one
      options:
      - COVID-19
      - Flu
      - MMR
      required: false
    - id: 8
      name: evaluation_score
      label: Evaluation Score
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: Enter your phone number
      type: text
      options: []
      required: false
    - id: 12
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
