inputSchema:
  type: object
  properties:
    title: CT Scan Referral Form
    pages:
      - id: 1
        name: referring_physician
        label: Referring physician name
        hint: Full name and contact
        type: text
        options: []
        required: true
      - id: 2
        name: patient_name
        label: Patient name
        hint: Full legal name
        type: text
        options: []
        required: true
      - id: 3
        name: patient_dob
        label: Patient date of birth
        hint: DOB for identification
        type: date
        options: []
        required: true
      - id: 4
        name: clinical_indication
        label: Clinical indication for CT
        hint: Reason for imaging and suspected diagnosis
        type: text
        options: []
        required: true
      - id: 5
        name: contrast_contraindication
        label: Known contrast allergies or contraindications
        hint: Include kidney function if relevant
        type: text
        options: []
        required: false
      - id: 6
        name: urgency
        label: Urgency level
        hint: Select scheduling priority
        type: select_one
        options:
          - Routine
          - Urgent
          - Stat
        required: true
      - id: 7
        name: preferred_appointment_date
        label: Preferred appointment date
        hint: Patient availability
        type: date
        options: []
        required: false
      - id: 8
        name: additional_instructions
        label: Additional instructions
        hint: Prep instructions or mobility needs
        type: text
        options: []
        required: false
