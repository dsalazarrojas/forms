inputSchema:
  type: object
  properties:
    title: Water Safety Survey
    pages:
    - id: 1
      name: intro_page
      label: What is your job
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: watercraft_page
      label: Watercraft experience
      hint: null
      type: select_one
      options:
      - Lifeguard
      - Scuba diver
      - Boat operator
      - Teacher
      required: true
    - id: 3
      name: lifesaving_page
      label: Lifesaving skills
      hint: null
      type: select_multiple
      options:
      - CPR
      - First aid
      - Lifesaving
      required: true
    - id: 4
      name: waterconditions_page
      label: Water conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: waterhazard_page
      label: Water hazards
      hint: null
      type: select_one
      options:
      - Strong current
      - Steep drop
      - Underwater hazard
      required: true
    - id: 6
      name: rescue_page
      label: Rescue techniques
      hint: null
      type: select_multiple
      options:
      - Floating
      - Swimming rescue
      - Boating rescue
      required: true
    - id: 7
      name: waterhealth_page
      label: Waterborne illness
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: surveycompletion_page
      label: Survey completion
      hint: null
      type: date
      options: []
      required: false
