    - id: 5
      name: user_input_vaccination_date
      label: vaccination_date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: user_input_vaccination_time
      label: vaccination_time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: user_input_verification_date
      label: verification_date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: user_input_verification_time
      label: verification_time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: user_input_comments
      label: comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: user_input_email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: user_input_phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: user_input_repeated_vaccination
      label: has_taken_additional_vaccination
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unknown
      required: false
