inputSchema:
  type: object
  properties:
    title: Clinical Supervision Form
    pages:
    - id: 1
      name: supervisor_name
      label: Supervisor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: supervisee_name
      label: Supervisee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: session_date
      label: Date of Supervision Session
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: section_overview
      label: -- Session Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: supervision_type
      label: Type of Supervision Session
      hint: null
      type: select_one
      options:
      - Individual
      - Group
      - Peer
      required: true
    - id: 6
      name: case_reference
      label: Case Reference or Patient ID
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: section_competencies
      label: -- Clinical Competencies --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: clinical_skills_assessment
      label: Assessment of Clinical Skills
      hint: 1 - Below Expectations to 5 - Exceeds Expectations
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 9
      name: professionalism_assessment
      label: Assessment of Professionalism
      hint: 1 - Below Expectations to 5 - Exceeds Expectations
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 10
      name: documentation_assessment
      label: Assessment of Documentation and Record Keeping
      hint: 1 - Below Expectations to 5 - Exceeds Expectations
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 11
      name: section_feedback
      label: -- Feedback and Goals --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: discussion_points
      label: Key points discussed during the session
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: next_action_items
      label: Action items identified for the next session
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: supervisee_reflections
      label: Supervisee reflections on learning and growth
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: supervisor_signature
      label: Supervisor Digital Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: supervisee_signature
      label: Supervisee Digital Signature
      hint: null
      type: text
      options: []
      required: true
