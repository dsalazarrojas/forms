    - id: 3
      name: reason_for_loan
      label: reason
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: borrower_details
      label: details
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: equipment_status
      label: equipment_status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
