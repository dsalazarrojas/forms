inputSchema:
  type: object
  properties:
    title: Medical Equipment Loan Request Form
    pages:
    - id: 1
      name: loan_request
      label: prophets
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: equipment_requested
      label: loan_dates
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''name'': ''today''}'
      - '{''id'': 2, ''name'': ''yesterday''}'
      - '{''id'': 3, ''name'': ''tomorrow''}'
