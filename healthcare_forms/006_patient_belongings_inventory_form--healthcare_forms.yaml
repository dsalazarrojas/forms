inputSchema:
  type: object
  properties:
    title: patient_belongings_inventory_form
    pages:
    - id: 1
      name: patient_identifier
      label: patient_identifier
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: belonging_type
      label: Belonging_type
      hint: null
      type: select_one
      options:
      - '{''value'': ''Phone''}'
      - '{''value'': ''Wallet''}'
      - '{''value'': ''Watch''}'
      - '{''value'': ''Glasses''}'
      required: false
    - id: 3
      name: belonging_description
      label: description
