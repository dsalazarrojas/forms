inputSchema:
  type: object
  properties:
    title: Genetic Data Sharing Research Consent Form
    pages:
    - id: 1
      name: participant_information
      label: Participant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: genetic_data_sharing
      label: Genetic Data Sharing
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: research_purposes
      label: Research Purposes
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: data_collection
      label: Data Collection
      hint: null
      type: select_multiple
      options:
      - blood
      - saliva
      - other
      required: false
    - id: 5
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - agree
      - disagree
      required: false
    - id: 6
      name: data_sharing_terms
      label: Data Sharing Terms
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_information
      label: Contact Information
      hint: null
      type: select_multiple
      options:
      - email
      - phone
      required: false
    - id: 8
      name: data_destruction
      label: Data Destruction
      hint: null
      type: select_one
      options:
      - destroy
      - retain
      required: false
    - id: 9
      name: data_access
      label: Data Access
      hint: null
      type: select_one
      options:
      - access
      - restricted
      required: false
    - id: 10
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: signature
      label: Signature
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
