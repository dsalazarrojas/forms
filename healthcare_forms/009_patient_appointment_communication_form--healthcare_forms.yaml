inputSchema:
  type: object
  properties:
    title: Patient Appointment Communication Form
    pages:
    - id: 1
      name: patient_name
      label: patient_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: time
      label: time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: provider_name
      label: provider_name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: appointment_type
      label: appointment_type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: appointment_status
      label: appointment_status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 7
      name: patient_preferences
      label: patient_preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: provider_message
      label: provider_message
      hint: null
      type: text
      options: []
      required: false
