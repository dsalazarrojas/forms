inputSchema:
  type: object
  properties:
    title: COVID 19 Self Assessment Questionnaire
    pages:
    - id: 1
      name: assessment_date
      label: Assessment Date
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 2
      name: full_name
      label: Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 4
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      - Other
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 7
      name: zipcode
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 8
      name: healthcare_worker
      label: Are you a healthcare worker
      hint: Essential worker status
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 9
      name: essential_worker
      label: Are you an essential worker
      hint: Essential industry employee
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 10
      name: underlying_conditions
      label: Do you have any underlying medical conditions
      hint: High-risk conditions
      type: select_multiple
      options:
      - None
      - Cancer
      - Chronic kidney disease
      - COPD
      - Heart conditions
      - Obesity
      - Diabetes type 2
      - Immunocompromised state
      - Sickle cell disease
      - Smoking history
      - Pregnancy
      required: true
    - id: 11
      name: age_category
      label: What is your age category
      hint: Age range
      type: select_one
      options:
      - Under 18
      - 18-24
      - 25-34
      - 35-44
      - 45-54
      - 55-64
      - 65-74
      - 75 or older
      required: true
    - id: 12
      name: current_symptoms
      label: Are you currently experiencing any COVID-19 symptoms
      hint: Current symptoms
      type: select_one
      options:
      - false
      - true
      required: true
    - id: 13
      name: symptom_list
      label: Which symptoms are you experiencing
      hint: Select all that apply
      type: select_multiple
      options:
      - Fever or chills
      - Cough
      - Shortness of breath
      - Fatigue
      - Muscle or body aches
      - Headache
      - Loss of taste or smell
      - Sore throat
      - Congestion or runny nose
      - Nausea or vomiting
      - Diarrhea
      required: false
    - id: 14
      name: symptom_severity
      label: How severe are your symptoms
      hint: Symptom impact
      type: select_one
      options:
      - Mild - can manage at home
      - Moderate - some discomfort
      - Severe - significant discomfort
      - Very severe - need medical attention
      required: false
    - id: 15
      name: recent_positive_test
      label: Have you tested positive for COVID-19 in the past 90 days
      hint: Recent test history
      type: select_one
      options:
      - true
      - false
      - I have not been tested
      required: true
    - id: 16
      name: recent_exposure
      label: Have you been in close contact with a COVID-19 positive person in the
        past 14 days
      hint: Recent exposure
      type: select_one
      options:
      - true
      - false
      - Not sure
      required: true
    - id: 17
      name: vaccination_status
      label: What is your COVID-19 vaccination status
      hint: Vaccination status
      type: select_one
      options:
      - Fully vaccinated with booster
      - Fully vaccinated
      - Partially vaccinated
      - Not vaccinated
      required: true
    - id: 18
      name: vaccine_eligibility_interest
      label: Are you interested in receiving a COVID-19 vaccine
      hint: Vaccine interest
      type: select_one
      options:
      - Yes I want to get vaccinated
      - Yes when I am eligible
      - Maybe I have questions
      - No I do not want the vaccine
      required: true
    - id: 19
      name: eligibility_assessment
      label: Based on your responses you may be eligible for vaccination
      hint: Eligibility notice
      type: note
      options: []
      required: false
    - id: 20
      name: preferred_vaccine_type
      label: Do you have a preference for vaccine type
      hint: Vaccine preference
      type: select_one
      options:
      - No preference - any vaccine
      - Pfizer-BioNTech
      - Moderna
      - Johnson & Johnson
      - Novavax
      required: false
    - id: 21
      name: transportation_barrier
      label: Do you have transportation to a vaccination site
      hint: Transportation access
      type: select_one
      options:
      - Yes I have reliable transportation
      - I can get a ride
      - I need transportation assistance
      - I prefer home vaccination
      required: false
    - id: 22
      name: childcare_barrier
      label: Do you need childcare assistance to get vaccinated
      hint: Childcare needs
      type: select_one
      options:
      - false
      - true
      required: false
    - id: 23
      name: language_preference
      label: Preferred Language
      hint: For communications
      type: select_one
      options:
      - English
      - Spanish
      - Chinese
      - Vietnamese
      - Korean
      - Tagalog
      - French
      - Other
      required: true
    - id: 24
      name: additional_questions
      label: Do you have any additional questions about COVID-19 or vaccination
      hint: Questions
      type: text
      options: []
      required: false
    - id: 25
      name: contact_preference
      label: How would you like to be contacted about next steps
      hint: Contact method
      type: select_one
      options:
      - Email
      - Phone call
      - Text message
      - No contact needed
      required: true
