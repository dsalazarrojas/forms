inputSchema:
  type: object
  properties:
    title: Weight Loss Intake Form
    pages:
    - id: 1
      name: new_patient
      label: New Patient
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: medical_history
      label: Medical History
      hint: null
      type: select_one
      options:
      - High Blood Pressure
      - Diabetes
      - Heart Disease
      - Obesity
      - All of the above
      - None of the above
      required: false
    - id: 3
      name: weight_loss_goals
      label: Weight Loss Goals
      hint: How much weight do you want to lose?
      type: number
      options: []
      required: false
    - id: 4
      name: weight_loss_start_date
      label: Start Date of Weight Loss
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: weight_loss_end_date
      label: End Date of Weight Loss
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: treatment_needs
      label: Treatment Needs
      hint: null
      type: select_multiple
      options:
      - Nutrition Counseling
      - Medication
      - Exercise
      - Surgery
      - Other
      required: false
    - id: 7
      name: health_goals
      label: Health Goals
      hint: What are your top health priorities?
      type: select_one
      options:
      - General Health
      - Weight Loss
      - Both
      - None
      required: false
    - id: 8
      name: medical_specialties
      label: Medical Specialties
      hint: null
      type: select_multiple
      options:
      - Cardiology
      - Gastroenterology
      - Nephrology
      - Pulmonology
      - Endocrinology
      - Gynecology
      - Urology
      - Other
      required: false
    - id: 9
      name: emergency_contact
      label: Emergency Contact
      hint: Who is your emergency contact?
      type: text
      options: []
      required: false
    - id: 10
      name: contact_phone
      label: Contact Phone
      hint: Contact phone number
      type: text
      options: []
      required: false
