inputSchema:
  type: object
  properties:
    title: radiology_requisition_form
    pages:
    - id: 1
      name: order_xray
      label: Order X-ray
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: order_mri
      label: Order MRI
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: order_ct
      label: Order CT
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: radiologist_name
      label: Radiologist
      hint: Please enter the radiologist's name.
      type: text
      options: []
      required: false
    - id: 5
      name: patient_name
      label: Patient
      hint: Please enter the patient's name.
      type: text
      options: []
      required: false
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: date_of_order
      label: Date of Order
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: order_details
      label: Order Details
      hint: Please provide more details about the order.
      type: note
      options: []
      required: false
    - id: 9
      name: test_location
      label: Test Location
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: test_date
      label: Test Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: test_time
      label: Test Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: order_status
      label: Order Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
