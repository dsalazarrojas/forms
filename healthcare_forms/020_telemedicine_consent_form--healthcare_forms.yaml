inputSchema:
  type: object
  properties:
    title: Telemedicine Consent Form
    pages:
    - id: 1
      name: patient_information
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: consent_to_telemedicine_services
      label: Consent to Telemedicine Services
      hint: null
      type: select_one
      options:
      - Consent
      - Decline
      required: false
    - id: 3
      name: telemedicine_terms
      label: Telemedicine Terms
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: patient_privacy
      label: Patient Privacy
      hint: null
      type: note
      options: []
      required: false
