inputSchema:
  type: object
  properties:
    title: Sugar Intake Survey
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: sugar_consumption
      label: How much sugar do you consume
      hint: null
      type: select_one
      options:
      - Less than 10 grams
      - 10 to 20 grams
      - 20 to 30 grams
      - More than 30 grams
      required: false
    - id: 3
      name: sugar_frequency
      label: How frequently do you consume sugar
      hint: null
      type: select_one
      options:
      - Never
      - Daily
      - Occasionally
      - Often
      required: false
    - id: 4
      name: sugar_type
      label: What type of sugar do you consume
      hint: null
      type: select_multiple
      options:
      - White sugar
      - Brown sugar
      - Honey
      - Artificial sweeteners
      - Fruit
      required: false
    - id: 5
      name: note
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
