inputSchema:
  type: object
  properties:
    title: Visitation Attestation Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: visit_date
      label: Visit Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: location_visit
      label: Location Visit
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: patient_id
      label: Patient ID
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: staff_member_name
      label: Staff Member Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: visit_time
      label: Visit Time
      hint: null
      type: time
      options: []
      required: false
