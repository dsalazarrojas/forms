inputSchema:
  type: object
  properties:
    title: Pre Exercise Health Questionnaire
    pages:
    - id: 1
      name: exercise_frequency
      label: How often do you exercise?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: true
    - id: 2
      name: exercise_type
      label: What type of exercise do you do?
      hint: null
      type: select_multiple
      options:
      - Running
      - Swimming
      - Cycling
      - Strength
      - Other
      required: true
    - id: 3
      name: exercise_intensity
      label: On a scale of 1-10, how intense is your exercise routine?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: exercise_duration
      label: How long do you exercise?
      hint: null
      type: select_one
      options:
      - Less than 1 hour
      - 1-2 hours
      - 3-5 hours
      - More than 5 hours
      required: true
    - id: 5
      name: past_injuries
      label: Have you ever had a past injury?
      hint: null
      type: select_multiple
      options:
      - Yes - Head or Neck
      - Yes - Back
      - Yes - Knee
      - Yes - Elbow
      - Yes - Other
      - 'False'
      required: true
    - id: 6
      name: past_surgeries
      label: Have you ever had a surgery?
      hint: null
      type: select_multiple
      options:
      - Yes - Major
      - Yes - Minor
      - 'False'
      required: true
    - id: 7
      name: medical_conditions
      label: Do you have any medical conditions?
      hint: null
      type: select_multiple
      options:
      - Yes - Heart
      - Yes - Lung
      - Yes - Kidney
      - Yes - Other
      - 'False'
      required: true
    - id: 8
      name: family_history
      label: Family medical history?
      hint: null
      type: select_multiple
      options:
      - Yes - Heart
      - Yes - Lung
      - Yes - Kidney
      - Yes - Other
      - 'False'
      required: true
    - id: 9
      name: medical_history
      label: Have you had medical history?
      hint: null
      type: select_multiple
      options:
      - Yes - Heart
      - Yes - Lung
      - Yes - Kidney
      - Yes - Other
      - 'False'
      required: true
    - id: 10
      name: doctor_visits
      label: How often do you visit the doctor?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Yearly
      - Never
      required: true
    - id: 11
      name: medical_tests
      label: Have you had medical tests?
      hint: null
      type: select_multiple
      options:
      - Yes - Heart
      - Yes - Lung
      - Yes - Kidney
      - Yes - Other
      - 'False'
      required: true
    - id: 12
      name: medical_test_results
      label: Have you ever had abnormal medical test results?
      hint: null
      type: select_multiple
      options:
      - Yes - Heart
      - Yes - Lung
      - Yes - Kidney
      - Yes - Other
      - 'False'
      required: true
    - id: 13
      name: medical_test_results_2
      label: Medical Test Results 2
      hint: null
      type: select_multiple
      options:
      - Yes - Heart
      - Yes - Lung
      - Yes - Kidney
      - Yes - Other
      - 'False'
      required: true
