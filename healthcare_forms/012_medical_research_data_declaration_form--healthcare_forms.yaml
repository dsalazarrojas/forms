inputSchema:
  type: object
  properties:
    title: Medical Research Data Declaration Form
    pages:
    - id: 1
      name: participant_information
      label: Participant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_information
      label: Contact Information
      hint: Enter your contact details for follow-up
      type: text
      options: []
      required: false
    - id: 3
      name: medical_history
      label: Medical History
      hint: Describe your medical history
      type: note
      options: []
      required: false
    - id: 4
      name: medical_conditions
      label: Medical Conditions
      hint: List all medical conditions you have experienced or have a history of
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: medication_usage
      label: Medication Usage
      hint: List all medications you are currently taking or have taken in the past
        5 years
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: medical_procedure
      label: Medical Procedure
      hint: Describe any past medical procedures you have had
      type: note
      options: []
      required: false
    - id: 7
      name: allergies
      label: Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: medical_research_history
      label: Medical Research History
      hint: List any medical research participation in which you have already participated
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: medical_research_history_detail
      label: Medical Research History Detail
      hint: Please provide details of your previous medical research participation
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: medical_research_history_previous_study
      label: Previous Study
      hint: Enter details of the previous study you have participated in
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 11
      name: medical_research_history_previous_study_date
      label: Previous Study Date
      hint: Enter the date of your previous study
      type: date
      options: []
      required: false
    - id: 12
