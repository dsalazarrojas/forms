inputSchema:
  type: object
  properties:
    title: daily_covid_19_pre_screening_questionnaire
    pages:
    - id: 1
      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: patient_email
      label: Patient Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: healthcare_provider
      label: Healthcare Provider
      hint: Name of healthcare provider
      type: text
      options: []
      required: true
    - id: 4
      name: medical_condition
      label: Medical Condition
      hint: null
      type: select_one
      options:
      - No Medical Condition
      - Medical Condition Present
      - Unknown Medical Condition
      required: false
    - id: 5
      name: patient_medical_history
      label: Patient Medical History
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: vaccine_interest
      label: Interested in Vaccine
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Undecided
      required: false
    - id: 7
      name: patient_symptoms
      label: Patient Symptoms
      hint: null
      type: select_multiple
      options:
      - Fever
      - Chills
      - Muscle
      - Fatigue
      - Headache
      required: false
    - id: 8
      name: medical_travel_history
      label: Medical Travel History
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
    - id: 9
      name: medical_conditions_present
      label: Medical Conditions Present
      hint: null
      type: select_multiple
      options:
      - High Blood Pressure
      - Diabetes
      - Other
      required: false
    - id: 10
      name: previous_vaccinations
      label: Previous Vaccinations
      hint: null
      type: select_multiple
      options:
      - None
      - Vaccinated
      required: false
    - id: 11
      name: medical_device_use
      label: Medical Device Use
      hint: null
      type: select_multiple
      options:
      - None
      - 'True'
      required: false
