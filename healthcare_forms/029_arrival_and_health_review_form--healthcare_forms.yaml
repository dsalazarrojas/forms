inputSchema:
  type: object
  properties:
    title: Arrival And Health Review Form
    pages:
    - id: 1
      name: section_personal_info
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: arrival_date
      label: Expected Arrival Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: section_health_status
      label: -- Current Health Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: current_health
      label: How are you feeling today
      hint: null
      type: select_one
      options:
      - Healthy
      - Mild symptoms
      - Moderate symptoms
      - Significant symptoms
      - Very ill
      required: true
    - id: 9
      name: fever_check
      label: Do you have a fever or elevated temperature
      hint: null
      type: select_one
      options:
      - false
      - true
      - Unsure
      required: true
    - id: 10
      name: temperature_reading
      label: Temperature Reading - if available
      hint: In Fahrenheit or Celsius
      type: number
      options: []
      required: false
    - id: 11
      name: section_symptoms
      label: -- COVID-19 Symptoms --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: covid_symptoms
      label: Do you have any COVID-19 related symptoms
      hint: null
      type: select_multiple
      options:
      - Cough
      - Difficulty breathing
      - Shortness of breath
      - Loss of taste or smell
      - Fatigue
      - Sore throat
      - Headache
      - Muscle or body aches
      - No symptoms
      required: true
    - id: 13
      name: symptoms_duration
      label: Duration of Symptoms
      hint: null
      type: select_one
      options:
      - No symptoms
      - Less than 24 hours
      - 1-3 days
      - 3-7 days
      - More than 7 days
      required: true
    - id: 14
      name: section_exposure
      label: -- Exposure and Travel History --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: covid_exposure
      label: Have you been exposed to someone with COVID-19
      hint: null
      type: select_one
      options:
      - false
      - true
      - Unsure
      required: true
    - id: 16
      name: exposure_timing
      label: When was the exposure
      hint: null
      type: date
      options: []
      required: false
    - id: 17
      name: recent_travel
      label: Have you traveled in the last 14 days
      hint: null
      type: select_one
      options:
      - false
      - Yes - domestic
      - Yes - international
      required: true
    - id: 18
      name: travel_locations
      label: Locations Visited
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: section_vaccination
      label: -- Vaccination Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: vaccination_status
      label: COVID-19 Vaccination Status
      hint: null
      type: select_one
      options:
      - Not vaccinated
      - Partially vaccinated
      - Fully vaccinated
      - Boosted
      - Prefer not to say
      required: true
    - id: 21
      name: last_vaccination_date
      label: Date of Last Vaccination
      hint: null
      type: date
      options: []
      required: false
    - id: 22
      name: section_medical_history
      label: -- Medical History --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: chronic_conditions
      label: Do you have any chronic health conditions
      hint: Diabetes, heart disease, asthma, etc.
      type: select_one
      options:
      - false
      - true
      - Prefer not to say
      required: true
    - id: 24
      name: condition_details
      label: Details of Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: immunocompromised
      label: Are you immunocompromised
      hint: null
      type: select_one
      options:
      - false
      - true
      - Unsure
      - Prefer not to say
      required: true
    - id: 26
      name: section_acknowledgment
      label: -- Health and Safety Acknowledgment --
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: health_agreement
      label: I confirm the above health information is accurate
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 28
      name: safety_compliance
      label: I agree to follow all health and safety protocols
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 29
      name: additional_notes
      label: Additional Health Information or Concerns
      hint: null
      type: text
      options: []
      required: false
