inputSchema:
  type: object
  properties:
    title: COVID 19 Intake Form For Massage Therapy
    pages:
    - id: 1
      name: client_header
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: massage_type
      label: Type of Massage Requested
      hint: null
      type: select_one
      options:
      - Swedish
      - Deep Tissue
      - Relaxation
      - Sports
      - Therapeutic
      - Other
      required: true
    - id: 8
      name: health_section
      label: -- Health Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: covid_symptoms
      label: Any COVID-19 symptoms in past 14 days
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 10
      name: current_symptoms
      label: Current COVID-19 symptoms
      hint: null
      type: select_multiple
      options:
      - Fever
      - Cough
      - Fatigue
      - Loss of Taste or Smell
      - Difficulty Breathing
      - No Symptoms
      required: false
    - id: 11
      name: temperature
      label: Current temperature
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: covid_exposure
      label: Exposed to confirmed COVID-19 case
      hint: null
      type: select_one
      options:
      - true
      - false
      - Unknown
      required: true
    - id: 13
      name: positive_test
      label: Tested positive for COVID-19 recently
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 14
      name: test_date
      label: Date of positive test if applicable
      hint: null
      type: date
      options: []
      required: false
    - id: 15
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully Vaccinated
      - Partially Vaccinated
      - Not Vaccinated
      required: true
    - id: 16
      name: medical_history
      label: -- Medical History --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: underlying_conditions
      label: Pre-existing medical conditions
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 18
      name: conditions_list
      label: List conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: medications
      label: Currently taking medications
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 20
      name: medications_list
      label: List medications
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: immunocompromised
      label: Immunocompromised or on immunosuppressant
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 22
      name: allergies_section
      label: -- Allergies and Sensitivities --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: allergies
      label: Any allergies
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 24
      name: allergy_details
      label: Describe allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: oil_sensitivities
      label: Sensitivities to oils or lotions
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 26
      name: agreement
      label: I am healthy enough for massage therapy
      hint: null
      type: select_one
      options:
      - Yes, I Am Healthy
      - No, I Am Not Healthy
      required: true
