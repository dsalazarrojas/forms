      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: current_conditions
      label: Current Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: symptoms
      label: Symptoms
      hint: null
      type: select_multiple
      options:
