      - Headache
      - Cough
      - Fatigue
      - Sore Throat
      - Muscle Ache
      - Diarrhea
      - Nausea
      required: true
    - id: 4
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: doctor_name
      label: Doctor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: medical_record_number
      label: Medical Record Number
      hint: null
      type: text
      options: []
      required: false
