inputSchema:
  type: object
  properties:
    title: Adult ADHD Self Report Scale ASRS V1 1 Symptom Checklist
    pages:
    - id: 1
      name: instructions
      label: -- Instructions --
      hint: Read each item and select how often it occurred in the past 6 months
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Full name
      hint: Optional for anonymous screening
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Contact email
      hint: Optional if follow up requested
      type: email
      options: []
      required: false
    - id: 4
      name: inattention_items
      label: Inattention symptoms frequency
      hint: Select frequency that best describes your experience
      type: select_one
      options:
      - Never
      - Rarely
      - Sometimes
      - Often
      - Very often
      required: true
    - id: 5
      name: hyperactivity_items
      label: Hyperactivity and impulsivity symptoms frequency
      hint: Select frequency that best describes your experience
      type: select_one
      options:
      - Never
      - Rarely
      - Sometimes
      - Often
      - Very often
      required: true
    - id: 6
      name: symptoms_impact
      label: Impact of symptoms on work and relationships
      hint: Describe any functional impairments
      type: text
      options: []
      required: false
    - id: 7
      name: prior_diagnosis
      label: Prior diagnosis of ADHD or related conditions
      hint: Provide diagnosis and year if known
      type: text
      options: []
      required: false
    - id: 8
      name: medications_currently
      label: Current medications
      hint: List any medications and dosages
      type: text
      options: []
      required: false
    - id: 9
      name: agree_follow_up
      label: Agree to provider follow up
      hint: Check yes to allow contact
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: submission_date
      label: Submission date
      hint: Date of completing this checklist
      type: date
      options: []
      required: true
