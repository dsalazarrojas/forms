inputSchema:
  type: object
  properties:
    title: COVID 19 Testing Hospital Discharge Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_mrn
      label: Medical Record Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: patient_dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: admission_date
      label: Date of Admission
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: discharge_date
      label: Date of Discharge
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: hospital_section
      label: -- Hospital Stay Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: length_of_stay
      label: Length of Hospital Stay
      hint: Number of days
      type: number
      options: []
      required: true
    - id: 8
      name: unit_admitted
      label: Hospital Unit/Department
      hint: ICU, COVID ward, general ward, etc.
      type: text
      options: []
      required: true
    - id: 9
      name: isolation_required
      label: Isolation Required at Discharge
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 10
      name: covid_test_section
      label: -- COVID-19 Test Results --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: admission_test_result
      label: Initial COVID-19 Test Result on Admission
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Inconclusive
      - Not tested
      required: true
    - id: 12
      name: discharge_test_result
      label: COVID-19 Test Result at Discharge
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Inconclusive
      - Not tested
      required: true
    - id: 13
      name: test_date_discharge
      label: Date of Discharge Test
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: clinical_section
      label: -- Clinical Summary --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: hospitalization_reason
      label: Primary Reason for Hospitalization
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: oxygen_required
      label: Oxygen therapy required during stay
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 17
      name: oxygen_level_discharge
      label: Oxygen saturation at discharge
      hint: percentage
      type: number
      options: []
      required: false
    - id: 18
      name: ventilator_support
      label: Ventilator support required
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 19
      name: discharge_section
      label: -- Discharge Instructions --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: isolation_period
      label: Recommended Isolation Period
      hint: Number of days from discharge
      type: number
      options: []
      required: true
    - id: 21
      name: follow_up_appointment
      label: Follow-up Appointment Required
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 22
      name: follow_up_date
      label: Follow-up Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 23
      name: medications_prescribed
      label: Medications Prescribed at Discharge
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: restrictions
      label: Activity Restrictions
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: discharge_disposition
      label: Discharge Disposition
      hint: null
      type: select_one
      options:
      - Home
      - Rehabilitation facility
      - Skilled nursing facility
      - Hospice
      - Transferred to another hospital
      required: true
    - id: 26
      name: physician_name
      label: Discharging Physician Name
      hint: null
      type: text
      options: []
      required: true
