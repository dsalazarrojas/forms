inputSchema:
  type: object
  properties:
    title: Alcoholism Testing Form
    pages:
    - id: 1
      name: section_clinical_admin
      label: -- Clinical Administration --
      hint: For healthcare professional use
      type: note
      options: []
      required: false
    - id: 2
      name: physician_name
      label: Physician/Evaluator Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: patient_id_testing
      label: Patient Record ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: testing_date
      label: Date of Testing
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: section_audit_screening
      label: -- AUDIT Screening Section --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: audit_q1
      label: How often do you have a drink containing alcohol?
      hint: null
      type: select_one
      options:
      - 0 - Never
      - 1 - Monthly or less
      - 2 - 2 to 4 times a month
      - 3 - 2 to 3 times a week
      - 4 - 4 or more times a week
      required: true
    - id: 7
      name: audit_q2
      label: How many drinks containing alcohol do you have on a typical day when
        you are drinking?
      hint: null
      type: select_one
      options:
      - 0 - 1 or 2
      - 1 - 3 or 4
      - 2 - 5 or 6
      - 3 - 7, 8, or 9
      - 4 - 10 or more
      required: true
    - id: 8
      name: audit_q3
      label: How often do you have six or more drinks on one occasion?
      hint: null
      type: select_one
      options:
      - 0 - Never
      - 1 - Less than monthly
      - 2 - Monthly
      - 3 - Weekly
      - 4 - Daily or almost daily
      required: true
    - id: 9
      name: section_cage_screening
      label: -- CAGE Screening Section --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: cage_cut_down
      label: Have you ever felt you ought to cut down on your drinking?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 11
      name: cage_annoyed
      label: Have people annoyed you by criticizing your drinking?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 12
      name: cage_guilty
      label: Have you ever felt bad or guilty about your drinking?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 13
      name: cage_eye_opener
      label: Have you ever had a drink first thing in the morning to steady your nerves
        or get rid of a hangover?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 14
      name: section_clinical_findings
      label: -- Clinical Findings and Recommendation --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: physical_signs_observed
      label: Physical Signs of Chronic Alcohol Use
      hint: e.g. Jaundice, tremors, hepatomegaly
      type: text
      options: []
      required: false
    - id: 16
      name: total_score_internal
      label: Total Screening Score
      hint: null
      type: number
      options: []
      required: true
    - id: 17
      name: clinical_recommendation
      label: Clinical Recommendation
      hint: null
      type: select_one
      options:
      - No intervention required
      - Brief intervention/education
      - Specialized treatment referral
      - Immediate detox required
      required: true
    - id: 18
      name: follow_up_plan_testing
      label: Follow-up Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 19
      name: physician_signature_testing
      label: Physician Signature Confirmation
      hint: null
      type: select_one
      options:
      - Electronically Signed
      - Other
      required: true
