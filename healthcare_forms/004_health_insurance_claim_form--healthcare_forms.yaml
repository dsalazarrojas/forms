inputSchema:
  type: object
  properties:
    title: Health Insurance Claim Form
    pages:
    - id: 1
      name: patient_id
      label: Patient ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: provider_name
      label: Provider Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: claim_date
      label: Claim Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: claim_amount
      label: Claim Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: claim_type
      label: Claim Type
      hint: null
      type: select_one
      options:
      - Health
      - Dental
      - Vision
      - Medical
      required: false
    - id: 6
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submit_button
      label: Submit
      hint: null
      type: text
      options: []
      required: false
