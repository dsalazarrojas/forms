inputSchema:
  type: object
  properties:
    title: osteopathic_treatment_consent_form
    pages:
    - id: 1
      name: patient_details
      label: Patient Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: treatment_consent
      label: Consent
      hint: null
      type: select_multiple
      options:
      - I am aware of this consent form
      - I am giving consent to treatment
      - I am aware of the risks and benefits
      - I am under 18
      - Other
      required: false
    - id: 3
      name: treatment_conditions
      label: Treatment Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: treatment_options
      label: Treatment Options
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 5
      name: patient_signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
