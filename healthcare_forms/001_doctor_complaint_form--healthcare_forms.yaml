inputSchema:
  type: object
  properties:
    title: Doctor Complaint Form
    pages:
    - id: 1
      name: patient_feedback
      label: Patient Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: complaint_description
      label: Complaint Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: medical_service
      label: Medical Service
      hint: null
      type: select_one
      options:
      - Cardiology
      - General Medicine
      - Neurology
      - Oncology
      required: false
    - id: 6
      name: healthcare_provider
      label: Healthcare Provider
      hint: null
      type: select_multiple
      options:
      - Dr. Smith
      - Dr. Johnson
      - Dr. Wilson
      required: false
    - id: 7
      name: visit_date
      label: Visit Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: visit_time
      label: Visit Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submit_feedback
      label: Submit Feedback
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Neutral
      required: false
