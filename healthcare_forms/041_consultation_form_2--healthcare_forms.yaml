inputSchema:
  type: object
  properties:
    title: Consultation Form 2
    pages:
    - id: 1
      name: section_patient_information
      label: -- Patient Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of birth
      hint: Patient date of birth
      type: date
      options: []
      required: true
    - id: 4
      name: presenting_complaint
      label: Presenting complaint
      hint: Primary reason for consultation
      type: text
      options: []
      required: true
    - id: 5
      name: medical_history_summary
      label: Medical history summary
      hint: Key past medical history items
      type: text
      options: []
      required: false
    - id: 6
      name: current_medications
      label: Current medications
      hint: List medications and dosages
      type: text
      options: []
      required: false
    - id: 7
      name: allergies
      label: Allergies
      hint: Known allergies including drug allergies
      type: text
      options: []
      required: false
    - id: 8
      name: consent_for_treatment
      label: Consent for treatment
      hint: Confirm consent for assessment and treatment
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: clinician_notes
      label: Clinician notes
      hint: Clinician to record findings and plan
      type: text
      options: []
      required: false
