inputSchema:
  type: object
  properties:
    title: social-medical-history-survey
    pages:
    - id: 1
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: allergies
      label: Allergies
      hint: null
      type: select_one
      options:
      - Allergies
      - Other
      required: false
    - id: 3
      name: medications
      label: Medications
      hint: null
      type: select_multiple
      options:
      - None
      - Aspirin
      - Ibuprofen
      - Acetaminophen
      required: false
    - id: 4
      name: medical_conditions
      label: Medical Conditions
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: family_history
      label: Family History
      hint: null
      type: text
      options: []
      required: false
