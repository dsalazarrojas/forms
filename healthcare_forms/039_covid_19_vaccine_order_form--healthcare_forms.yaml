inputSchema:
  type: object
  properties:
    title: COVID 19 Vaccine Order Form
    pages:
    - id: 1
      name: ordering_facility
      label: Facility or Organization Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: facility_type
      label: Type of Facility
      hint: null
      type: select_one
      options:
      - Hospital
      - Clinic
      - Pharmacy
      - Healthcare provider office
      - Nursing home
      - Other
      required: true
    - id: 3
      name: contact_name
      label: Contact Person Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_title
      label: Contact Person Title
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: contact_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: contact_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: facility_info_section
      label: -- Facility Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: facility_id
      label: Facility License or ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: facility_address
      label: Facility Address
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: facility_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: facility_state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: facility_zip
      label: Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: order_section
      label: -- Vaccine Order Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: vaccine_type
      label: Vaccine Type Needed
      hint: null
      type: select_one
      options:
      - Pfizer
      - Moderna
      - Johnson and Johnson
      - All types needed
      - Other
      required: true
    - id: 15
      name: order_quantity
      label: Number of Doses Needed
      hint: null
      type: number
      options: []
      required: true
    - id: 16
      name: additional_vaccine_types
      label: Additional Vaccine Types
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: delivery_section
      label: -- Delivery Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: delivery_address
      label: Delivery Address
      hint: If different from facility address
      type: text
      options: []
      required: false
    - id: 19
      name: delivery_date_needed
      label: Date Needed By
      hint: null
      type: date
      options: []
      required: true
    - id: 20
      name: delivery_urgency
      label: Delivery Urgency
      hint: null
      type: select_one
      options:
      - Routine
      - Expedited
      - Emergency
      required: true
    - id: 21
      name: special_handling
      label: Special Handling or Storage Requirements
      hint: Ultra-low freezer, standard freezer, etc.
      type: text
      options: []
      required: false
    - id: 22
      name: storage_section
      label: -- Storage Capacity --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: ultra_low_freezer
      label: Ultra-low freezer capacity
      hint: -80 degrees Celsius - number of doses
      type: number
      options: []
      required: false
    - id: 24
      name: standard_freezer
      label: Standard freezer capacity
      hint: -20 degrees Celsius - number of doses
      type: number
      options: []
      required: false
    - id: 25
      name: refrigerator
      label: Refrigerator capacity
      hint: 2-8 degrees Celsius - number of doses
      type: number
      options: []
      required: false
    - id: 26
      name: cold_chain_section
      label: -- Cold Chain Management --
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: cold_chain_trained
      label: Staff trained in cold chain management
      hint: null
      type: select_one
      options:
      - true
      - false
      - Some staff
      required: true
    - id: 28
      name: temperature_monitoring
      label: Temperature monitoring equipment available
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 29
      name: adverse_event_reporting
      label: System in place for adverse event reporting
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 30
      name: special_requests_section
      label: -- Special Requests --
      hint: null
      type: note
      options: []
      required: false
    - id: 31
      name: special_requests
      label: Special Requests or Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 32
      name: authorization_section
      label: -- Authorization --
      hint: null
      type: note
      options: []
      required: false
    - id: 33
      name: authorized_person
      label: Authorized Person Name
      hint: null
      type: text
      options: []
      required: true
    - id: 34
      name: authorization_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: true
