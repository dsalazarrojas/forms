inputSchema:
  type: object
  properties:
    title: Voiding Diary Form
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: Please provide your general information.
      type: text
      options: []
      required: true
    - id: 2
      name: voiding_date
      label: Date of Last Voiding Event
      hint: The date of the last voiding event.
      type: date
      options: []
      required: true
    - id: 3
      name: voiding_time
      label: Time of Last Voiding Event
      hint: The time of the last voiding event.
      type: time
      options: []
      required: true
    - id: 4
      name: voiding_frequency
      label: Frequency of Voiding
      hint: How often do you void.
      type: text
      options: []
      required: true
    - id: 5
      name: voiding_volume
      label: Volume of Voiding
      hint: The volume of the last voiding event.
      type: number
      options: []
      required: true
    - id: 6
      name: postop_info
      label: Post-operative Information
      hint: Any information about your post-operative experience.
      type: text
      options: []
      required: false
    - id: 7
      name: postop_volumes
      label: Post-operative Volumes
      hint: The volume of voiding after surgery.
      type: number
      options: []
      required: false
    - id: 8
      name: voiding_frequency_postop
      label: Post-operative Voiding Frequency
      hint: How often do you void after surgery.
      type: text
      options: []
      required: true
    - id: 9
      name: voiding_duration_postop
      label: Post-operative Voiding Duration
      hint: The duration of voiding after surgery.
      type: text
      options: []
      required: false
    - id: 10
      name: voiding_times_postop
      label: Post-operative Times
      hint: The times you void after surgery.
      type: text
      options: []
      required: false
    - id: 11
      name: surgeon_info
      label: Surgeon Information
      hint: Name of the surgeon.
      type: text
      options: []
      required: false
    - id: 12
      name: submit
      label: Submit
      hint: Submit form.
      type: text
      options: []
      required: true
