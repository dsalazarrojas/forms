inputSchema:
  type: object
  properties:
    title: Acne Questionnaire
    pages:
    - id: 1
      name: patient_information
      label: -- Patient information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient name
      hint: Full name for medical records
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of birth
      hint: Patient date of birth
      type: date
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Contact phone
      hint: Phone number for appointment reminders
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email address
      hint: Optional contact email
      type: email
      options: []
      required: false
    - id: 6
      name: acne_onset_age
      label: Age when acne began
      hint: Approximate age of onset
      type: number
      options: []
      required: false
    - id: 7
      name: acne_severity
      label: Acne severity
      hint: Select the most appropriate severity
      type: select_one
      options:
      - Mild
      - Moderate
      - Severe
      required: true
    - id: 8
      name: areas_affected
      label: Areas affected
      hint: Face, back, chest or other
      type: select_multiple
      options:
      - Face
      - Back
      - Chest
      - Shoulders
      required: true
    - id: 9
      name: current_treatments
      label: Current treatments
      hint: List topical or oral medications currently used
      type: text
      options: []
      required: false
    - id: 10
      name: past_treatments
      label: Past treatments tried
      hint: Treatments that were ineffective or discontinued
      type: text
      options: []
      required: false
    - id: 11
      name: allergies
      label: Allergies
      hint: Known drug or skin product allergies
      type: text
      options: []
      required: false
    - id: 12
      name: hormonal_symptoms
      label: Hormonal symptoms
      hint: Irregular periods, hirsutism or other concerns
      type: text
      options: []
      required: false
    - id: 13
      name: family_history_of_acne
      label: Family history of acne
      hint: Any family members with severe acne
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 14
      name: lifestyle_factors
      label: Lifestyle factors
      hint: Diet, sleep, stress or exercise notes
      type: text
      options: []
      required: false
    - id: 15
      name: treatment_goals
      label: Treatment goals
      hint: What outcomes do you expect from treatment
      type: text
      options: []
      required: false
    - id: 16
      name: consent_to_treatment
      label: Consent to treatment
      hint: Confirm consent for proposed treatments
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 17
      name: additional_comments
      label: Additional comments
      hint: Anything else you think is important
      type: text
      options: []
      required: false
