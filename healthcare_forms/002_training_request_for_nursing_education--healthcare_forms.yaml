inputSchema:
  type: object
  properties:
    title: Training Request For Nursing Education
    pages:
    - id: 1
      name: title
      label: What is the title of the training request?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      required: true
    - id: 3
      name: description
      label: Briefly describe the training session
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      required: true
    - id: 5
      name: date
      label: Date of the training session
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: attendees
      label: How many nurses are expected to attend this training session?
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: additional_info
      label: Is there any other information about this training session?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 8
      name: feedback
      label: Can we use your feedback for quality improvement?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 9
      name: other_session
      label: Is there any other training sessions scheduled during the same period?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
