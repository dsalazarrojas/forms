inputSchema:
  type: object
  properties:
    title: Advanced Course Referral Form
    pages:
    - id: 1
      name: referral_header
      label: -- Referral Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: referrer_name
      label: Referrer name
      hint: Who is referring the candidate
      type: text
      options: []
      required: true
    - id: 3
      name: candidate_name
      label: Candidate full name
      hint: Name of person being referred
      type: text
      options: []
      required: true
    - id: 4
      name: candidate_email
      label: Candidate email
      hint: For course contact
      type: email
      options: []
      required: true
    - id: 5
      name: program_of_interest
      label: Program of interest
      hint: Course or program referred to
      type: text
      options: []
      required: true
    - id: 6
      name: reason_for_referral
      label: Reason for referral
      hint: Explain candidate suitability
      type: text
      options: []
      required: false
    - id: 7
      name: referral_date
      label: Referral date
      hint: Date of referral submission
      type: date
      options: []
      required: true
    - id: 8
      name: consent_to_contact
      label: Candidate consent to be contacted
      hint: Confirm candidate permission
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
