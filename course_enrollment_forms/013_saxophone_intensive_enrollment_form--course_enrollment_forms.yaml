inputSchema:
  type: object
  properties:
    title: Saxophone Intensive Enrollment Form
    pages:
    - id: 1
      name: participant_details
      label: Participant Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_name
      label: participant_name
      hint: Enter participant name
      type: text
      options: []
      required: false
    - id: 3
      name: participant_email
      label: participant_email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: participant_phone
      label: participant_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: music_style
      label: music_style
      hint: Select a music style
      type: select_one
      options:
      - Jazz
      - Classical
      - Pop
      - Rock
      - Folk
      - Country
      required: false
    - id: 6
      name: preferred_session
      label: preferred_session
      hint: Select a preferred session
      type: select_one
      options:
      - 8:00am - 9:00am
      - 9:00am - 10:00am
      - 10:00am - 11:00am
      - 11:00am - 12:00pm
      - 12:00pm - 1:00pm
      - 1:00pm - 2:00pm
      - 2:00pm - 3:00pm
      required: false
    - id: 7
      name: preferred_date
      label: preferred_date
      hint: Select a preferred date
      type: date
      options: []
      required: false
    - id: 8
      name: preferred_time
      label: preferred_time
      hint: Select a preferred time
      type: time
      options: []
      required: false
    - id: 9
      name: participant_notes
      label: participant_notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: course_enrollment
      label: course_enrollment
      hint: null
      type: select_one
      options:
      - Saxophone Intensive
      - Music Theory
      - Music Performance
      - Ensemble
      - Music History
      - Other (Please specify)
      required: false
    - id: 11
      name: follow_up
      label: Follow-up
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: submission
      label: Submission
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: follow_up_email
      label: follow-up_email
      hint: null
      type: email
      options: []
      required: false
    - id: 14
      name: submission_status
      label: Submission Status
      hint: null
      type: select_one
      options:
      - Pending
      - Confirmed
      - Declined
      - Rescheduled
      required: false
