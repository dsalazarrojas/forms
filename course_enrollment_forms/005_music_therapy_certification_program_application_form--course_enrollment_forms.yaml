inputSchema:
  type: object
  properties:
    title: Music Therapy Certification Program Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: music_therapy_background
      label: Music Therapy Background
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: education
      label: Education
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: music_therapy_certification
      label: Music Therapy Certification
      hint: null
      type: select_one
      options:
      - Certified Music Therapist
      - Not Certified
      required: true
    - id: 9
      name: submit
      label: Submit
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: confirm_submission
      label: Confirm Submission
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
