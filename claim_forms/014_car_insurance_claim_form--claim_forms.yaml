inputSchema:
  type: object
  properties:
    title: Car Insurance Claim Form
    pages:
    - id: 1
      name: policyholder_info_header
      label: -- Policyholder Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name_policyholder
      label: Policyholder Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 3
      name: policy_number_claim
      label: Policy Number
      hint: Your insurance policy ID
      type: text
      options: []
      required: true
    - id: 4
      name: email_address_claim
      label: Email Address
      hint: For claim status updates
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number_claim
      label: Phone Number
      hint: Primary contact for the claim
      type: text
      options: []
      required: true
    - id: 6
      name: incident_details_header
      label: -- Incident Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: date_of_incident
      label: Date of Incident
      hint: Select the day it occurred
      type: date
      options: []
      required: true
    - id: 8
      name: time_of_incident
      label: Time of Incident
      hint: Select the time it occurred
      type: time
      options: []
      required: true
    - id: 9
      name: incident_type
      label: Type of Incident
      hint: Select the type of incident
      type: select_one
      options:
      - Collision with another vehicle
      - Collision with stationary object
      - Theft
      - Vandalism
      - Fire/Natural Disaster
      - Glass Damage
      required: true
    - id: 10
      name: location_of_incident
      label: Location of Incident
      hint: Address or description
      type: text
      options: []
      required: true
    - id: 11
      name: damage_description
      label: Description of Damage
      hint: Briefly describe the damage to your vehicle
      type: text
      options: []
      required: true
    - id: 12
      name: drivability_status
      label: Is the vehicle drivable?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: law_enforcement_header
      label: -- Law Enforcement --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: police_report_filed_claim
      label: Was a police report filed?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: police_precinct_name
      label: Police Precinct or Station
      hint: (If applicable)
      type: text
      options: []
      required: false
    - id: 16
      name: claim_verification_header
      label: -- Verification --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: claim_acknowledgement
      label: I acknowledge the claim terms
      hint: See terms of service
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 18
      name: signature_confirmation_claim
      label: Type your name for claim confirmation
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: additional_claim_comments
      label: Any additional comments or requests?
      hint: Provide more details for the claim
      type: text
      options: []
      required: false
