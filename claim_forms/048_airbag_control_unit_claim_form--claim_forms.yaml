inputSchema:
  type: object
  properties:
    title: Airbag Control Unit Claim Form
    pages:
    - id: 1
      name: claimant_info_header
      label: -- Claimant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: claimant_name
      label: Claimant Name
      hint: Vehicle Owner
      type: text
      options: []
      required: true
    - id: 3
      name: address
      label: Mailing Address
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: vehicle_info_header
      label: -- Vehicle Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: vin
      label: Vehicle Identification Number (VIN)
      hint: 17 characters
      type: text
      options: []
      required: true
    - id: 7
      name: make_model
      label: Make and Model
      hint: e.g. Honda Civic
      type: text
      options: []
      required: true
    - id: 8
      name: year
      label: Model Year
      hint: e.g. 2018
      type: number
      options: []
      required: true
    - id: 9
      name: incident_info_header
      label: -- Incident Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: incident_date
      label: Date of Incident
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: airbag_deployed
      label: Did Airbag Deploy?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: warning_light
      label: Was SRS Light On Prior?
      hint: Warning light on dash
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unknown
      required: true
    - id: 13
      name: issue_desc
      label: Description of Issue
      hint: Describe what happened
      type: text
      options: []
      required: true
    - id: 14
      name: repair_info_header
      label: -- Repair Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: repair_shop
      label: Repair Shop Name
      hint: Where is the car now?
      type: text
      options: []
      required: false
    - id: 16
      name: uploads_note
      label: Document Uploads
      hint: Please email repair estimates and photos to claims@auto.com
      type: note
      options: []
      required: false
    - id: 17
      name: signature
      label: Signature
      hint: Type full name
      type: text
      options: []
      required: true
