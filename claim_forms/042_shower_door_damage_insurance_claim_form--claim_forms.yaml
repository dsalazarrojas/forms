inputSchema:
  type: object
  properties:
    title: Shower Door Damage Insurance Claim Form
    pages:
    - id: 1
      name: form_title
      label: Shower Door Damage Insurance Claim Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: claimant_name
      label: Claimant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: claimant_email
      label: Claimant Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: claimant_phone
      label: Claimant Phone
      hint: XXX-XXX-XXXX
      type: text
      options: []
      required: false
    - id: 5
      name: property_address
      label: Property Address
      hint: 123 Main St
      type: text
      options: []
      required: false
    - id: 6
      name: description_of_damage
      label: Description of Damage
      hint: Please provide a detailed description of the damage to the shower door.
      type: text
      options: []
      required: false
    - id: 7
      name: date_of_incident
      label: Date of Incident
      hint: null
      type: date
      options: []
      required: false
