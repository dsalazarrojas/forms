      name: time_of_incident
      label: Time of Incident
      hint: "HH:MM AM/PM"
      type: time
      options: []
      required: false
    - id: 9
      name: damage_cause
      label: Damage Cause
      hint: null
      type: select_one
      options:
      - Accident
      - Wear and Tear
      - Natural Disaster
      - Vandalism
      - Other
      required: false
    - id: 10
      name: witness_statements
      label: Witness Statements
      hint: Is there a witness?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: witness_details
      label: Witness Details
      hint: Name of Witness
      type: text
      options: []
      required: false
    - id: 12
      name: claim_value
      label: Claim Value
      hint: Amount of Claim
      type: number
      options: []
      required: false
    - id: 13
      name: claim_images
      label: Claim Images
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: claim_notes
      label: Claim Notes
      hint: null
      type: note
      options: []
      required: false
