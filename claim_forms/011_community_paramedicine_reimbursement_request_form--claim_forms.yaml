inputSchema:
  type: object
  properties:
    title: Community Paramedicine Reimbursement Request Form
    pages:
    - id: 1
      name: claimant_info
      label: Claimant Information
      hint: Your personal and contact details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: employee_id
      label: Employee ID
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: department
      label: Department or Unit
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: claim_details
      label: Claim Details
      hint: Information about the reimbursement request
      type: note
      options: []
      required: false
    - id: 9
      name: claim_date
      label: Date of Claim Submission
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: service_date
      label: Date of Service
      hint: When the expense was incurred
      type: date
      options: []
      required: true
    - id: 11
      name: expense_type
      label: Type of Expense
      hint: null
      type: select_one
      options:
      - Mileage
      - Fuel
      - Parking
      - Tolls
      - Vehicle Maintenance
      - Medical Supplies
      - Equipment
      - Training
      - Other
      required: true
    - id: 12
      name: expense_description
      label: Expense Description
      hint: Describe the expense in detail
      type: text
      options: []
      required: true
    - id: 13
      name: patient_id
      label: Patient ID or Reference
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 14
      name: service_location
      label: Service Location
      hint: Address where service was provided
      type: text
      options: []
      required: true
    - id: 15
      name: mileage_details
      label: Mileage Information
      hint: For mileage claims
      type: note
      options: []
      required: false
    - id: 16
      name: starting_mileage
      label: Starting Mileage
      hint: Odometer reading at start
      type: number
      options: []
      required: false
    - id: 17
      name: ending_mileage
      label: Ending Mileage
      hint: Odometer reading at end
      type: number
      options: []
      required: false
    - id: 18
      name: total_miles
      label: Total Miles
      hint: null
      type: number
      options: []
      required: false
    - id: 19
      name: amount_section
      label: Amount Requested
      hint: Financial details
      type: note
      options: []
      required: false
    - id: 20
      name: amount_requested
      label: Total Amount Requested
      hint: In dollars
      type: number
      options: []
      required: true
    - id: 21
      name: receipt_attached
      label: Are Receipts Attached
      hint: null
      type: select_one
      options:
      - Yes - All Receipts Included
      - Yes - Partial Receipts
      - No - Receipts Not Available
      - Not Applicable
      required: true
    - id: 22
      name: receipt_count
      label: Number of Receipts
      hint: null
      type: number
      options: []
      required: false
    - id: 23
      name: justification
      label: Justification for Expense
      hint: Why this expense was necessary
      type: text
      options: []
      required: true
    - id: 24
      name: supervisor_name
      label: Supervisor Name
      hint: For approval
      type: text
      options: []
      required: true
    - id: 25
      name: additional_notes
      label: Additional Notes
      hint: Any other relevant information
      type: text
      options: []
      required: false
