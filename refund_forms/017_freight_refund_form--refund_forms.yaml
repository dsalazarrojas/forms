      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: shipping_info_address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: shipping_info_city
      label: City
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: shipping_info_state
      label: State
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: shipping_info_zip
      label: Zip
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: shipping_info_country
      label: Country
      hint: null
      type: text
      options: []
      required: false
