inputSchema:
  type: object
  properties:
    title: Freight Refund Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: reason_for_refund
      label: Reason For Refund
      hint: Choose a reason for the refund
      type: select_one
