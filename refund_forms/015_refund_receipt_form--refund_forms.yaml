inputSchema:
  type: object
  properties:
    title: Refund Receipt Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: refund_amount
      label: refund_amount
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: reason_for_refund
      label: Reason for Refund
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: refund_date
      label: Refund Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 9
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
