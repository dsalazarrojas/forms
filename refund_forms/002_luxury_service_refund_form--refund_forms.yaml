inputSchema:
  type: object
  properties:
    title: Luxury Service Refund Form
    pages:
    - id: 1
      name: customer_details
      label: Customer Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: refund_reason
      label: Reason for Refund
      hint: null
      type: select_multiple
      options:
      - Product issue
      - Order not delivered
      - Order not as described
      - Other (please describe)
      required: false
    - id: 3
      name: refund_amount
      label: Refund Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: refund_date
      label: Refund Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: customer_note
      label: Customer Note
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: service_provider
      label: Service Provider
      hint: null
      type: select_one
      options:
      - Provider 1
      - Provider 2
      - Provider 3
      required: false
    - id: 7
      name: refund_status
      label: Refund Status
      hint: null
      type: select_one
      options:
      - Pending
      - Approved
      - Declined
      required: false
    - id: 8
      name: additional_info
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: confirmation
      label: Confirm
      hint: null
      type: radio
      options:
      - I confirm that the information is accurate.
      - I do not confirm.
      required: false
    - id: 10
      name: review_and_sign
      label: Review and Sign
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
