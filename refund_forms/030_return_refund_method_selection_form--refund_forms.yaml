      name: return_request
      label: Return Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: preferred_refund_method
      label: Preferred Refund Method
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: select_preferred_refund_method
