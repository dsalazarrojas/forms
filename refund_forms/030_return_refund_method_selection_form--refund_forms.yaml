      label: Reason for Return
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: refund_option
      label: Refund Option
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: select_refund_option
      label: Select a Refund Option
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: return_date
      label: Return Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: return_method
      label: Return Method
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
