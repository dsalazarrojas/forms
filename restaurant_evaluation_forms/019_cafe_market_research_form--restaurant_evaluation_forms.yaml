inputSchema:
  type: object
  properties:
    title: Cafe Market Research Form
    pages:
      - id: 1
        name: respondent_name
        label: Your Name
        hint: Optional
        type: text
        options: []
        required: false
      - id: 2
        name: age_range
        label: Age Range
        hint: Select your age group
        type: select_one
        options:
          - Under 18
          - 18-24
          - 25-34
          - 35-44
          - 45-54
          - 55-64
          - 65 or older
        required: true
      - id: 3
        name: gender
        label: Gender
        hint: Optional demographic information
        type: select_one
        options:
          - Male
          - Female
          - Non-binary
          - Prefer not to say
          - Prefer to self-describe
        required: false
      - id: 4
        name: location
        label: Where Do You Live
        hint: Your general area
        type: select_one
        options:
          - Within 1 mile
          - 1-3 miles
          - 3-5 miles
          - 5-10 miles
          - Over 10 miles
        required: true
      - id: 5
        name: visit_frequency
        label: How Often Do You Visit Cafes
        hint: Your typical cafe visiting habit
        type: select_one
        options:
          - Daily
          - Several times a week
          - Once a week
          - 2-3 times a month
          - Once a month
          - Rarely
        required: true
      - id: 6
        name: our_cafe_frequency
        label: How Often Do You Visit Our Cafe
        hint: Your visits to our specific cafe
        type: select_one
        options:
          - First time
          - Occasionally
          - Once a month
          - Several times a month
          - Weekly
          - Several times a week
        required: true
      - id: 7
        name: primary_reason
        label: Primary Reason for Visiting
        hint: What brings you to our cafe
        type: select_one
        options:
          - Coffee or beverages
          - Food or meals
          - Work or study
          - Meeting friends
          - Quick break
          - Convenient location
          - Atmosphere
        required: true
      - id: 8
        name: typical_spending
        label: Typical Spending Per Visit
        hint: How much do you usually spend
        type: select_one
        options:
          - Under $5
          - $5-$10
          - $11-$15
          - $16-$20
          - Over $20
        required: true
      - id: 9
        name: favorite_menu_items
        label: Favorite Menu Items
        hint: What do you usually order
        type: select_multiple
        options:
          - Espresso drinks
          - Brewed coffee
          - Tea
          - Smoothies
          - Pastries
          - Sandwiches
          - Salads
          - Breakfast items
          - Desserts
          - None
        required: false
      - id: 10
        name: competitor_cafes
        label: Other Cafes You Visit
        hint: Which other cafes do you frequent
        type: text
        options: []
        required: false
      - id: 11
        name: what_makes_unique
        label: What Makes Our Cafe Unique
        hint: What sets us apart from others
        type: text
        options: []
        required: false
      - id: 12
        name: price_perception
        label: How Do You Perceive Our Prices
        hint: Compared to other cafes
        type: select_one
        options:
          - Much lower
          - Somewhat lower
          - About the same
          - Somewhat higher
          - Much higher
        required: true
      - id: 13
        name: atmosphere_rating
        label: Atmosphere Rating
        hint: How would you rate our ambiance
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 14
        name: wifi_importance
        label: How Important is WiFi to You
        hint: Rate the importance of free WiFi
        type: select_one
        options:
          - Very important
          - Important
          - Neutral
          - Not important
          - Do not use
        required: false
      - id: 15
        name: seating_comfort
        label: Seating Comfort
        hint: How comfortable are our seats
        type: select_one
        options:
          - Very comfortable
          - Comfortable
          - Average
          - Uncomfortable
          - Very uncomfortable
        required: false
      - id: 16
        name: new_products_interest
        label: New Products Interest
        hint: What new items would interest you
        type: select_multiple
        options:
          - Vegan options
          - Gluten-free options
          - More breakfast items
          - More lunch options
          - Evening menu
          - Catering services
          - Loyalty program
          - None
        required: false
      - id: 17
        name: marketing_channels
        label: How Do You Hear About Us
        hint: Where do you learn about our cafe
        type: select_multiple
        options:
          - Social media
          - Word of mouth
          - Walking by
          - Online search
          - Local advertising
          - Events
          - Other
        required: false
      - id: 18
        name: improvement_areas
        label: Areas Needing Improvement
        hint: What should we improve
        type: select_multiple
        options:
          - Food quality
          - Beverage quality
          - Service speed
          - Staff friendliness
          - Cleanliness
          - Menu variety
          - Pricing
          - Atmosphere
          - Parking
          - Nothing
        required: false
      - id: 19
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: How satisfied are you with our cafe
        type: select_one
        options:
          - Very satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very dissatisfied
        required: true
      - id: 20
        name: likelihood_to_recommend
        label: Likelihood to Recommend
        hint: How likely are you to recommend us
        type: select_one
        options:
          - Very likely
          - Likely
          - Neutral
          - Unlikely
          - Very unlikely
        required: true
      - id: 21
        name: additional_suggestions
        label: Additional Suggestions
        hint: Any other ideas or feedback
        type: text
        options: []
        required: false
