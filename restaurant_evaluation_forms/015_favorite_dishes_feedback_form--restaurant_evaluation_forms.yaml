inputSchema:
  type: object
  properties:
    title: Favorite Dishes Feedback Form
    pages:
    - id: 1
      name: feedback
      label: favorite dishes feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: rating
      label: your rating
      hint: null
      type: select_one
      options:
      - 1/5
      - 2/5
      - 3/5
      - 4/5
      - 5/5
      required: true
    - id: 3
      name: dish
      label: dish name
      hint: name of the dish you ordered
      type: text
      options: []
      required: false
    - id: 4
      name: dish_rating
      label: dish rating
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: menu_category
      label: menu category
      hint: e.g. appetizer, entree, dessert
      type: select_multiple
      options:
      - Appetizers
      - Entrees
      - Desserts
      required: false
