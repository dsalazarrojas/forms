inputSchema:
  type: object
  properties:
    title: volunteer_recruitment_checklist_form
    pages:
    - id: 1
      name: volunteer_checklist
      label: Volunteer Checklist
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: essential_tasks
      label: Essential Tasks
      hint: Please select all essential tasks for volunteers.
      type: select_one
      options:
      - task 1
      - task 2
      - task 3
      required: true
    - id: 3
      name: qualification_requirements
      label: Qualifications
      hint: null
      type: select_one
      options:
      - req 1
      - req 2
      required: true
    - id: 4
      name: volunteer_details
      label: Volunteer Details
      hint: null
      type: note
      options: []
      required: true
    - id: 5
      name: volunteer_requirements
      label: Volunteer Requirements
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
