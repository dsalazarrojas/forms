inputSchema:
  type: object
  properties:
    title: NGO Volunteer Photo Release Form
    pages:
    - id: 1
      name: volunteer_photo_release_form
      label: Volunter Photo Release
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: volunteer_name
      label: Volunteer Name
      hint: Please enter your name
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email Address
      hint: Please enter your email
      type: email
      options: []
      required: false
    - id: 4
      name: photo_consent
      label: Photo and Video Consent
      hint: Please tick to indicate that you agree to the terms
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: program_name
      label: Program Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: event_dates
      label: Event Dates
      hint: Please enter event dates
      type: date
      options: []
      required: false
