inputSchema:
  type: object
  properties:
    title: Community Service Intake Form
    pages:
    - id: 1
      name: applicant_name
      label: Applicant full name
      hint: Name used for volunteer records
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_email
      label: Applicant email
      hint: For communication about opportunities
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone number
      hint: Preferred contact number
      type: text
      options: []
      required: false
    - id: 4
      name: address
      label: Street address
      hint: City, state, and postal code
      type: text
      options: []
      required: false
    - id: 5
      name: availability
      label: Availability
      hint: Days and times you are available to volunteer
      type: text
      options: []
      required: true
    - id: 6
      name: skills_and_experience
      label: Relevant skills and experience
      hint: List any skills that may match volunteer roles
      type: text
      options: []
      required: false
    - id: 7
      name: emergency_contact
      label: Emergency contact name and phone
      hint: Provide a contact for emergencies
      type: text
      options: []
      required: true
    - id: 8
      name: interests
      label: Areas of interest
      hint: Choose preferred program areas
      type: select_multiple
      options:
      - Youth programs
      - Environmental
      - Events
      - Fundraising
      - Administration
      required: false
    - id: 9
      name: consenting_background_check
      label: Consent for background check
      hint: Required for certain roles
      type: select_one
      options:
      - true
      - false
      required: true
