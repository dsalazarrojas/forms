inputSchema:
  type: object
  properties:
    title: Volunteer Agreement Extension Form
    pages:
    - id: 1
      name: organization_name
      label: organization name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: volunteer_name
      label: volunteer name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: start_date
      label: start date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: end_date
      label: end date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: role
      label: role
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: role_options
      label: Volunteer Role
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: status
      label: status
      hint: null
      type: select_one
      options:
      - '{''value'': ''active'', ''label'': ''Active''}'
      - '{''value'': ''inactive'', ''label'': ''Inactive''}'
      required: false
    - id: 8
      name: contact_info
      label: contact info
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
