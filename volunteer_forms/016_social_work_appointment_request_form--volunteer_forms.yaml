      type: note
      options: []
      required: false
    - id: 11
      name: schedule
      label: Schedule
      hint: null
      type: select_multiple
      options:
      - 9:00 AM
      - 10:00 AM
      - 11:00 AM
      required: true
    - id: 12
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: service_location
      label: Service Location
      hint: null
      type: select_multiple
      options:
      - Zoom
      - Google Meet
      required: true
    - id: 15
      name: assigned_tool_id
      label: Tool ID
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: sync_calendar
      label: Sync Calendar
      hint: null
      type: select_multiple
      options:
      - Google
      - Microsoft Exchange
      required: true
