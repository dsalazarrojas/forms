inputSchema:
  type: object
  properties:
    title: Charity Event Volunteer Offboarding Form
    pages:
    - id: 1
      name: section_volunteer_info
      label: -- Volunteer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: volunteer_name
      label: Volunteer Full Name
      hint: Your complete name
      type: text
      options: []
      required: true
    - id: 3
      name: volunteer_id
      label: Volunteer ID Number
      hint: If available
      type: text
      options: []
      required: false
    - id: 4
      name: volunteer_email
      label: Email Address
      hint: Personal or work email
      type: email
      options: []
      required: true
    - id: 5
      name: volunteer_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 6
      name: section_event_details
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: event_name
      label: Event Name
      hint: Which charity event did you volunteer for
      type: text
      options: []
      required: true
    - id: 8
      name: event_date
      label: Event Date
      hint: When did the event take place
      type: date
      options: []
      required: true
    - id: 9
      name: volunteer_role
      label: Your Volunteer Role
      hint: What did you volunteer to do
      type: text
      options: []
      required: true
    - id: 10
      name: hours_volunteered
      label: Total Hours Volunteered
      hint: How many hours did you work
      type: number
      options: []
      required: true
    - id: 11
      name: section_feedback
      label: -- Volunteer Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: experience_satisfaction
      label: Satisfaction with Volunteer Experience
      hint: How satisfied were you
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 13
      name: role_clarity
      label: Clarity of Volunteer Role and Expectations
      hint: Did you understand your duties
      type: select_one
      options:
      - Very Clear
      - Clear
      - Somewhat Clear
      - Unclear
      required: true
    - id: 14
      name: event_organization
      label: How Well Was the Event Organized
      hint: Rate the organization
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      required: true
    - id: 15
      name: volunteer_support
      label: Support and Training Provided
      hint: Did you get proper support
      type: select_one
      options:
      - Excellent
      - Good
      - Adequate
      - Poor
      required: false
    - id: 16
      name: section_impact
      label: -- Impact and Engagement --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: mission_alignment
      label: Do You Feel Connected to the Organization Mission
      hint: Does this cause align with your values
      type: select_one
      options:
      - Very Connected
      - Connected
      - Somewhat Connected
      - Not Connected
      required: true
    - id: 18
      name: volunteer_again
      label: Would You Volunteer Again
      hint: Would you help with future events
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 19
      name: improvement_suggestions
      label: Suggestions for Future Volunteer Experiences
      hint: How can we improve
      type: text
      options: []
      required: false
    - id: 20
      name: offboarding_date
      label: Offboarding Date
      hint: Date of this form
      type: date
      options: []
      required: true
    - id: 21
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback or information
      type: text
      options: []
      required: false
