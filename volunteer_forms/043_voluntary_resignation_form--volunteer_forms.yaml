inputSchema:
  type: object
  properties:
    title: Voluntary Resignation Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: date_of_resignation
      label: Date Of Resignation
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: reason_for_resigning
      label: Reason For Resigning
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: last_day_of_work
      label: Last Day Of Work
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: manager_signature
      label: Manager Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: employee_signature
      label: Employee Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: date_of_resignation_confirmation
      label: Date Of Resignation Confirmation
      hint: null
      type: date
      options: []
      required: true
