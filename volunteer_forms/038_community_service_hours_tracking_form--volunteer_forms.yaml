inputSchema:
  type: object
  properties:
    title: Community Service Hours Tracking Form
    pages:
    - id: 1
      name: volunteer_info
      label: Volunteer Information
      hint: Your personal details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: student_id
      label: Student or Volunteer ID
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 7
      name: school_organization
      label: School or Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: grade_level
      label: Grade Level
      hint: If student
      type: select_one
      options:
      - Elementary
      - Middle School
      - High School Freshman
      - High School Sophomore
      - High School Junior
      - High School Senior
      - College
      - Not a Student
      required: false
    - id: 9
      name: organization_info
      label: Service Organization Information
      hint: Where you volunteered
      type: note
      options: []
      required: false
    - id: 10
      name: organization_name
      label: Organization Name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: organization_address
      label: Organization Address
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: supervisor_name
      label: Supervisor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: supervisor_email
      label: Supervisor Email
      hint: null
      type: email
      options: []
      required: true
    - id: 14
      name: supervisor_phone
      label: Supervisor Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: service_details
      label: Service Details
      hint: About your service
      type: note
      options: []
      required: false
    - id: 16
      name: service_type
      label: Type of Service
      hint: null
      type: select_one
      options:
      - Community Outreach
      - Environmental
      - Education
      - Healthcare
      - Senior Services
      - Youth Programs
      - Animal Welfare
      - Homeless Services
      - Food Services
      - Disaster Relief
      - Arts and Culture
      - Other
      required: true
    - id: 17
      name: service_description
      label: Service Description
      hint: What did you do
      type: text
      options: []
      required: true
    - id: 18
      name: hours_log
      label: Hours Log
      hint: Track your time
      type: note
      options: []
      required: false
    - id: 19
      name: service_date
      label: Date of Service
      hint: null
      type: date
      options: []
      required: true
    - id: 20
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 21
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 22
      name: break_duration
      label: Break Duration
      hint: In minutes
      type: number
      options: []
      required: false
    - id: 23
      name: total_hours
      label: Total Hours
      hint: Calculated automatically
      type: number
      options: []
      required: true
    - id: 24
      name: cumulative_hours
      label: Cumulative Total Hours
      hint: Running total
      type: number
      options: []
      required: true
    - id: 25
      name: reflection
      label: Service Reflection
      hint: What did you learn
      type: text
      options: []
      required: false
    - id: 26
      name: skills_used
      label: Skills Used
      hint: Select all that apply
      type: select_multiple
      options:
      - Communication
      - Leadership
      - Teamwork
      - Problem Solving
      - Organization
      - Teaching
      - Technical
      - Creative
      - Physical Labor
      - Other
      required: false
    - id: 27
      name: verification
      label: Verification
      hint: Supervisor confirmation
      type: note
      options: []
      required: false
    - id: 28
      name: verified_by_supervisor
      label: Verified by Supervisor
      hint: null
      type: select_one
      options:
      - Yes - Verified
      - No - Pending
      required: true
    - id: 29
      name: supervisor_signature
      label: Supervisor Signature
      hint: Type full name
      type: text
      options: []
      required: false
    - id: 30
      name: verification_date
      label: Verification Date
      hint: null
      type: date
      options: []
      required: false
    - id: 31
      name: additional_entries
      label: Do You Have Additional Entries
      hint: null
      type: select_one
      options:
      - Yes - Add More
      - No - Submit
      required: false
    - id: 32
      name: comments
      label: Additional Comments
      hint: Optional
      type: text
      options: []
      required: false
