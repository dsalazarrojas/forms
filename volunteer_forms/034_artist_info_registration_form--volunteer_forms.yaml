inputSchema:
  type: object
  properties:
    title: Artist Info Registration Form
    pages:
    - id: 1
      name: section_header_1
      label: -- Artist Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: artist_name
      label: Artist or Band Name
      hint: How you want to be credited
      type: text
      options: []
      required: true
    - id: 3
      name: artist_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: artist_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: artist_website
      label: Website or Social Media URL
      hint: Link to your online presence
      type: text
      options: []
      required: false
    - id: 6
      name: section_header_2
      label: -- Artist Profile --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: genre
      label: Primary Genre
      hint: Main music or art genre
      type: text
      options: []
      required: true
    - id: 8
      name: secondary_genres
      label: Secondary Genres
      hint: Other genres you work with
      type: text
      options: []
      required: false
    - id: 9
      name: artist_bio
      label: Artist Biography
      hint: 100-150 word description of your work
      type: text
      options: []
      required: true
    - id: 10
      name: years_performing
      label: Years of Performing Experience
      hint: How long have you been performing?
      type: number
      options: []
      required: false
    - id: 11
      name: section_header_3
      label: -- Performance Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: performance_type
      label: Type of Performance Offered
      hint: What will you perform?
      type: select_multiple
      options:
      - Live Music Performance
      - DJ Set
      - Spoken Word
      - Comedy
      - Interview
      - Podcast Guest
      - Other
      required: true
    - id: 13
      name: set_duration
      label: Typical Set Duration
      hint: How long does your performance usually run?
      type: select_one
      options:
      - 15-30 minutes
      - 30-60 minutes
      - 1-2 hours
      - 2+ hours
      - Flexible
      required: true
    - id: 14
      name: equipment_required
      label: Equipment or Technical Needs
      hint: Do you need special equipment?
      type: text
      options: []
      required: false
    - id: 15
      name: section_header_4
      label: -- Availability --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: availability
      label: Availability for Performances
      hint: When can you perform?
      type: select_multiple
      options:
      - Weekdays
      - Weekends
      - Mornings
      - Afternoons
      - Evenings
      - Flexible
      required: true
    - id: 17
      name: advance_notice
      label: Advance Notice Needed
      hint: How much notice do you need?
      type: select_one
      options:
      - Last minute (same day)
      - 1 week notice
      - 2 weeks notice
      - 1 month notice
      - More than 1 month
      required: false
    - id: 18
      name: section_header_5
      label: -- Experience and References --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: previous_performances
      label: Previous Performance Experience
      hint: Where have you performed before?
      type: text
      options: []
      required: false
    - id: 20
      name: references
      label: References or Testimonials
      hint: Contacts who can vouch for you
      type: text
      options: []
      required: false
    - id: 21
      name: section_header_6
      label: -- Interview and Media --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: interview_willing
      label: Willing to Be Interviewed?
      hint: Can you participate in interviews?
      type: select_one
      options:
      - Yes, definitely
      - Yes, with restrictions
      - No, not interested
      required: true
    - id: 23
      name: interview_topics
      label: Interview Topics You Can Discuss
      hint: What topics are you comfortable discussing?
      type: text
      options: []
      required: false
    - id: 24
      name: media_files
      label: Media Files or Samples Available
      hint: Audio, video, or promotional materials
      type: text
      options: []
      required: false
    - id: 25
      name: agree_registration
      label: I Agree to This Artist Registration
      hint: Confirm you accept the terms
      type: select_one
      options:
      - Yes, I Agree
      - No, I Do Not Agree
      required: true
