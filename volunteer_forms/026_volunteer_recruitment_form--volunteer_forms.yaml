inputSchema:
  type: object
  properties:
    title: Volunteer Recruitment Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: days_available
      label: Days Available
      hint: null
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 6
      name: available_time
      label: Available Time
      hint: null
      type: select_multiple
      options:
      - morning
      - afternoon
      - evening
      required: true
    - id: 7
      name: volunteer_role
      label: Volunteer Role
      hint: null
      type: select_one
      options:
      - Volunteer
      - Organizer
      - Both
      required: true
    - id: 8
      name: volunteer_experience
      label: Volunteer Experience
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: availability
      label: Availability
      hint: null
      type: date
      options: []
      required: false
