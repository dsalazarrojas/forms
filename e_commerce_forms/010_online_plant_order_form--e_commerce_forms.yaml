inputSchema:
  type: object
  properties:
    title: Online Plant Order Form
    pages:
    - id: 1
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_gateway
      label: Payment Gateway
      hint: null
      type: select_one
      options:
      - Stripe
      - PayPal
      - Authorize.net
      required: false
    - id: 4
      name: order_notes
      label: Order Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: payment_details
      label: Payment Details
      hint: null
      type: select_multiple
      options:
      - Card number
      - Card expiration
      - Card type
      - CVV/Security Code
      required: false
    - id: 6
      name: shipping_details
      label: Shipping Details
      hint: null
      type: select_multiple
      options:
      - First name
      - Last name
      - Email
      - Phone
      - Address
      - City
      - State
      - Zip
      - Country
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
