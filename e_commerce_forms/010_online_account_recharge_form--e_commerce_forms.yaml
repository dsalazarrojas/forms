inputSchema:
  type: object
  properties:
    title: Online Account Recharge Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: amount
      label: Recharge Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: payment_method
      label: Payment Method
      hint: Credit/Debit Card or PayPal
      type: select_one
      options:
      - Credit/Debit Card
      - PayPal
      required: false
    - id: 5
      name: payment_card_number
      label: Card Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: cvv
      label: CVV
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: expiration_date
      label: Expiration Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: expiration_time
      label: Expiration Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: cvc
      label: CVC Code
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: customer_notes
      label: Customer Notes
      hint: null
      type: note
      options: []
      required: false
