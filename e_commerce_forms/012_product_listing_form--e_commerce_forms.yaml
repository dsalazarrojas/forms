inputSchema:
  type: object
  properties:
    title: product_listing_form
    pages:
    - id: 1
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: price
      label: Price
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: image_url
      label: Image URL
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Apple
      - Banana
      - Orange
      - Grapes
      required: false
    - id: 5
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: shipping_cost
      label: Shipping Cost
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: product_tags
      label: Product Tags
      hint: null
      type: select_multiple
      options:
      - Tag 1
      - Tag 2
      - Tag 3
      required: false
    - id: 8
      name: product_status
      label: Product Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 9
      name: product_id
      label: Product ID
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
