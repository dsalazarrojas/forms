inputSchema:
  type: object
  properties:
    title: Returns Coordinator Feedback Form
    pages:
    - id: 1
      name: return_case_info
      label: Return Case Info
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_details
      label: customer_details
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: return_reason
      label: return_reason
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: order_id
      label: order_id
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: return_date
      label: return_date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: resolution_status
      label: resolution_status
      hint: null
      type: select_one
      options:
      - Pending
      - Resolved
      - Reopened
      - Cancelled
      required: true
    - id: 7
      name: feedback
      label: feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: additional_comments
      label: additional_comments
      hint: null
      type: text
      options: []
      required: false
