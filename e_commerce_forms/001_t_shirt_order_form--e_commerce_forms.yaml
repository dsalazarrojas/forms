inputSchema:
  type: object
  properties:
    title: T Shirt Order Form
    pages:
    - id: 1
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: shipping_country
      label: Shipping Country
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: shipping_state
      label: Shipping State
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: tshirt_size
      label: T-shirt Size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      - Extra Large
      required: false
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Pay Pal
      - Bank Transfer
      required: false
    - id: 6
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: customer_message
      label: Customer Message
      hint: null
      type: text
      options: []
      required: false
