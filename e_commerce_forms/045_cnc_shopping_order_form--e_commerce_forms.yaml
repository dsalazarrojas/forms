inputSchema:
  type: object
  properties:
    title: CnC Shopping Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: billing_address
      label: Billing Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 6
      name: billing_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: billing_state
      label: State or Province
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: billing_zip
      label: ZIP or Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: shipping_same
      label: Shipping Address Same as Billing
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: shipping_address
      label: Shipping Address
      hint: If different from billing
      type: text
      options: []
      required: false
    - id: 11
      name: item_category
      label: Product Category
      hint: Type of items ordering
      type: select_one
      options:
      - Electronics
      - Clothing
      - Home and Garden
      - Sports and Outdoors
      - Beauty and Personal Care
      - Other
      required: true
    - id: 12
      name: product_description
      label: Product Description
      hint: What items are you ordering
      type: text
      options: []
      required: true
    - id: 13
      name: quantity
      label: Quantity
      hint: Number of units
      type: number
      options: []
      required: true
    - id: 14
      name: unit_price
      label: Unit Price
      hint: Price per item
      type: number
      options: []
      required: true
    - id: 15
      name: order_total
      label: Order Total
      hint: Final amount due
      type: number
      options: []
      required: true
    - id: 16
      name: pickup_method
      label: Pickup or Delivery Method
      hint: Select preferred method
      type: select_one
      options:
      - Click and Collect
      - Home Delivery
      - Shipping
      - Store Pickup
      required: true
    - id: 17
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Digital Wallet
      - Bank Transfer
      - Cash
      required: true
