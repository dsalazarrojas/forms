inputSchema:
  type: object
  properties:
    title: E-Commerce Fake Review Report Form
    pages:
    - id: 1
      name: product_id
      label: Product Id
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: marketplace
      label: Marketplace
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: review_date
      label: Review Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 6
      name: reviewer_name
      label: Reviewer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: review_text
      label: Review Text
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: review_status
      label: Review Status
      hint: null
      type: select_one
      options:
      - Verified Reviewer
      - Suspicious Review
      - Spam Review
      - Other
      required: false
    - id: 9
      name: reason
      label: Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: reported_by
      label: Reported By
      hint: null
      type: select_one
      options:
      - Marketplace Admin
      - Reviewer
      - Other
      required: false
    - id: 11
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: reported_date
      label: Reported Date
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: product_category
      label: Product Category
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
