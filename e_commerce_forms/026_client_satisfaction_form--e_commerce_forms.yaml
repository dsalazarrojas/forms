inputSchema:
  type: object
  properties:
    title: Client Satisfaction Form
    pages:
    - id: 1
      name: customer_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: purchase_date
      label: Date of Purchase
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: product_purchased
      label: Product or Service Purchased
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: purchase_category
      label: Category
      hint: null
      type: select_one
      options:
      - Electronics
      - Clothing
      - Food
      - Home goods
      - Beauty
      - Services
      - Other
      required: false
    - id: 6
      name: product_quality
      label: Quality of Product or Service
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 7
      name: price_value
      label: Price Value
      hint: Was the price fair for what you received?
      type: select_one
      options:
      - Excellent value
      - Good value
      - Fair value
      - Poor value
      - Overpriced
      required: true
    - id: 8
      name: delivery_shipping
      label: Delivery or Shipping Experience
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: false
    - id: 9
      name: delivery_timeliness
      label: Delivery Timeliness
      hint: null
      type: select_one
      options:
      - Early
      - On time
      - Slightly late
      - Very late
      - Not applicable
      required: false
    - id: 10
      name: packaging_quality
      label: Packaging Quality
      hint: How well was the item packaged?
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Not applicable
      required: false
    - id: 11
      name: customer_service_rating
      label: Customer Service
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 12
      name: website_experience
      label: Website Experience
      hint: Was it easy to find and purchase?
      type: select_one
      options:
      - Very easy
      - Easy
      - Neutral
      - Difficult
      - Very difficult
      required: false
    - id: 13
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 14
      name: would_purchase_again
      label: Would You Purchase From Us Again?
      hint: null
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Uncertain
      - Probably not
      - Definitely not
      required: true
    - id: 15
      name: recommend_to_others
      label: Would You Recommend Us to Others?
      hint: null
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Uncertain
      - Probably not
      - Definitely not
      required: true
    - id: 16
      name: areas_improvement
      label: What Could We Improve?
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: additional_feedback
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
