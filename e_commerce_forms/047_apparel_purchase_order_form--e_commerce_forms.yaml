inputSchema:
  type: object
  properties:
    title: Apparel Purchase Order Form
    pages:
    - id: 1
      name: section_buyer_info
      label: -- Buyer Information --
      hint: Provide billing and shipping details for purchase orders
      type: note
      options: []
      required: false
    - id: 2
      name: buyer_name
      label: Buyer name
      hint: Full name or company name
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact email
      hint: For order confirmations and invoices
      type: email
      options: []
      required: true
    - id: 4
      name: purchase_order_number
      label: Purchase order number
      hint: Internal PO reference
      type: text
      options: []
      required: false
    - id: 5
      name: billing_address
      label: Billing address
      hint: Full billing address
      type: text
      options: []
      required: true
    - id: 6
      name: shipping_address
      label: Shipping address
      hint: Full delivery address if different
      type: text
      options: []
      required: true
    - id: 7
      name: items_ordered
      label: Items ordered and specifications
      hint: Include SKU sizes colors and quantities
      type: text
      options: []
      required: true
    - id: 8
      name: payment_terms
      label: Payment terms
      hint: Net 30 upfront or other agreed terms
      type: select_one
      options:
      - Net 30
      - Prepaid
      - Net 60
      - Other
      required: true
    - id: 9
      name: delivery_instructions
      label: Delivery instructions
      hint: Loading dock times special handling or access notes
      type: text
      options: []
      required: false
    - id: 10
      name: contact_phone
      label: Contact phone
      hint: Phone for delivery queries
      type: text
      options: []
      required: false
