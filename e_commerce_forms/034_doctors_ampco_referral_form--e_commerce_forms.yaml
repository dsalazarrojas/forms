inputSchema:
  type: object
  properties:
    title: Doctors&amp;Co Referral Form
    pages:
    - id: 1
      name: first_name
      label: Patient/Client First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Patient/Client Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: date
      label: Date of Visit/Appointment
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: time
      label: Time of Visit/Appointment
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: note
      label: Note for the Doctor
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: select_multiple
      label: Conditions or Symptoms
      hint: null
      type: select_multiple
      options:
      - Allergic to Penicillin
      - High Blood Pressure
      - Diabetic
      - Other (Please specify)
      required: true
    - id: 9
      name: select_one
      label: Referring Doctor
      hint: null
      type: select_one
      options:
      - Dr. Smith
      - Dr. Johnson
      - Dr. Thompson
      - Other (Please specify)
      required: true
    - id: 10
      name: decimal
      label: Age (in years)
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: integer
      label: Number of Visits
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: select_multiple_2
      label: Available Time Slots
      hint: null
      type: select_multiple
      options:
      - 9:00 AM - 10:00 AM
      - 10:00 AM - 11:00 AM
      - 11:00 AM - 12:00 PM
      - 1:00 PM - 2:00 PM
      - Other (Please specify)
      required: true
