inputSchema:
  type: object
  properties:
    title: T Shirt Order Form With 2Checkout
    pages:
    - id: 1
      name: tshirt_size
      label: What size of t-shirt would you like?
      hint: 'null'
      type: select_one
      options:
      - Small
      - Medium
      - Large
      - X-Large
      required: true
    - id: 2
      name: tshirt_color
      label: What color of t-shirt would you like?
      hint: null
      type: select_one
      options:
      - Red
      - Blue
      - Green
      - Yellow
      - Black
      - White
      required: true
    - id: 3
      name: tshirt_design
      label: What design do you want on your t-shirt?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Your email address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Your phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: first_name
