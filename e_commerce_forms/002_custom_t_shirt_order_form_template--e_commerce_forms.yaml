inputSchema:
  type: object
  properties:
    title: custom_t_shirt_order_form_template
    pages:
    - id: 1
      name: custom_t_shirt
      label: custom t shirt
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: shirt_color
      label: shirt color
      hint: Pick your favorite color
      type: select_one
      options:
      - red
      - blue
      - green
      - yellow
      required: false
    - id: 3
      name: shirt_size
      label: shirt size
      hint: null
      type: select_multiple
      options:
      - small
      - medium
      - large
      required: false
    - id: 4
      name: tshirt_color
      label: t-shirt color
      hint: null
      type: select_one
      options:
      - blue
      - red
      - green
      - black
      required: false
    - id: 5
      name: customer_name
      label: customer name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: customer_email
      label: customer email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: customer_phone
      label: customer phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: order_details
      label: order details
      hint: Add more order details here
      type: text
      options: []
      required: false
    - id: 9
      name: shipping_method
      label: shipping method
      hint: null
      type: select_one
      options:
      - shipping
      - local pickup
      required: false
    - id: 10
      name: total_price
      label: total price
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: customer_note
      label: customer note
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: order_confirmation
      label: order confirmation
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: form_submission
      label: form submission
      hint: null
      type: select_multiple
      options:
      - accepted
      - declined
      required: false
    - id: 14
      name: customer_signature
      label: customer signature
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: payment_method
      label: payment method
      hint: null
      type: select_one
      options:
      - credit card
      - cash
      required: false
    - id: 16
      name: order_status
      label: order status
      hint: null
      type: select_multiple
      options:
      - pending
      - shipped
      - delivered
      required: true
