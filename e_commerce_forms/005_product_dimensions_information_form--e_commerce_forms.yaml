inputSchema:
  type: object
  properties:
    title: Product Dimensions Information Form
    pages:
    - id: 1
      name: product_title
      label: Product Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_width
      label: Product Width
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: product_height
      label: Product Height
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: product_depth
      label: Product Depth
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: product_weight
      label: Product Weight
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: product_length
      label: Product Length
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: unit_of_measurement
      label: Unit of Measurement
      hint: null
      type: select_one
      options:
      - inches
      - cm
      - mm
      - kg
      - lb
      - oz
      - oz (fluid)
      - gal
      - qt
      required: true
    - id: 8
      name: product_description
      label: Product Description
      hint: null
      type: text
      options: []
      required: false
