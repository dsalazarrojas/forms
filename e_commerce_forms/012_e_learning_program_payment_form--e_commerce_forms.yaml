inputSchema:
  type: object
  properties:
    title: e_learning_program_payment_form
    pages:
    - id: 1
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: course_code
      label: Course Code
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Bank Transfer
      - Check
      required: true
    - id: 5
      name: transaction_date
      label: Transaction Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: student_phone
      label: Student Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Paid
      - Partially Paid
      - Unpaid
      required: true
