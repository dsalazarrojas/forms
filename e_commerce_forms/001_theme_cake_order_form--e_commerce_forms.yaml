inputSchema:
  type: object
  properties:
    title: Theme Cake Order Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: theme_info
      label: Theme Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: cake_design
      label: Cake Design
      hint: null
      type: select_one
      options:
      - plain
      - custom
      - red velvet
      - white fondant
      required: true
    - id: 4
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - pay pal
      - pay cash
      required: true
    - id: 7
      name: total_cost
      label: Total Cost
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: cancel
      label: Cancel
      hint: null
      type: text
      options: []
      required: false
