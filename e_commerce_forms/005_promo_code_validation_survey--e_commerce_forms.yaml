inputSchema:
  type: object
  properties:
    title: Promo Code Validation Survey
    pages:
    - id: 1
      name: user_experience
      label: User Experience
      hint: null
      type: select_one
      options:
      - Very Good
      - Somewhat Good
      - Neutral
      - Somewhat Bad
      - Very Bad
      required: true
    - id: 2
      name: redeem_time
      label: Redeem Time
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: redeem_time_2
      label: Redeem Time 2
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: product_category
      label: Product Category
      hint: null
      type: select_multiple
      options:
      - Electronics
      - Clothing
      - Furniture
      required: true
    - id: 5
      name: issue
      label: Issue
      hint: null
      type: select_one
      options:
      - Redemption Issue
      - Discount Code Not Working
      - Not Found
      required: true
