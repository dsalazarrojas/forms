inputSchema:
  type: object
  properties:
    title: Field Day T Shirt Order Form
    pages:
    - id: 1
      name: t_shirt_size
      label: Shirt Size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      - X-Large
      required: true
    - id: 2
      name: t_shirt_color
      label: T Shirt Color
      hint: null
      type: select_multiple
      options:
      - Red
      - Blue
      - Green
      - Yellow
      required: true
    - id: 3
      name: order_quantity
      label: Order Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: customer_email
      label: Customer Email
      hint: example@example.com
      type: email
      options: []
      required: true
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Visa
      - Mastercard
      - Amex
      - Discover
      required: true
    - id: 6
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: order_notes
      label: Order Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
