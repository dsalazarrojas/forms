inputSchema:
  type: object
  properties:
    title: Fashion Product Order Form
    pages:
    - id: 1
      name: product_form_1
      label: What type of fashion product are you interested in purchasing?
      hint: null
      type: select_one
      options:
      - Dress
      - Top
      - Bottom
      - Accessory
      required: true
    - id: 2
      name: product_form_2
      label: Select Multiple
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: product_form_3
      label: Product Note
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: product_form_4
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: product_form_5
      label: Phone Number
      hint: Format - XXX-XXX-XXXX
      type: text
      options: []
      required: true
    - id: 6
      name: product_form_6
      label: Delivery Preference
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: true
    - id: 7
      name: product_form_7
      label: Delivery Note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: product_form_8
      label: Latest Delivery Date
      hint: Format - YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 9
      name: product_form_9
      label: Delivery Time
      hint: Format - HH -MM
      type: time
      options: []
      required: false
