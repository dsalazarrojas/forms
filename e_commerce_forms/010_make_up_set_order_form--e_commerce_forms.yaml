inputSchema:
  type: object
  properties:
    title: Make Up Set Order Form
    pages:
    - id: 1
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 2
      name: product_choice
      label: Choose Product
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: product_price
      label: Product Price
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''visa'', ''label'': ''Visa''}'
      - '{''id'': 2, ''name'': ''mastercard'', ''label'': ''Mastercard''}'
      - '{''id'': 3, ''name'': ''amex'', ''label'': ''Amex''}'
      required: false
    - id: 5
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: shipping_city
      label: Shipping City
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: shipping_state
      label: Shipping State
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: shipping_zip
      label: Shipping Zip
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: billing_name
      label: Billing Name
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: billing_email
      label: Billing Email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: order_notes
      label: Order Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
