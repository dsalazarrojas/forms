inputSchema:
  type: object
  properties:
    title: Link Order Form
    pages:
    - id: 1
      name: user_info
      label: User Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: shipping_info
      label: Shipping Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Card Number
      - PayPal
      - Bank Transfer
      required: false
    - id: 4
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: submit
      label: Submit
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: order_status
      label: Order Status
      hint: null
      type: select_one
      options:
      - Pending
      - Shipped
      - Cancelled
      required: false
    - id: 8
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: order_phone
      label: Order Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
