inputSchema:
  type: object
  properties:
    title: Women's Summit Event Feedback Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: First name of the participant
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: Participant's email
      type: email
      options: []
      required: true
    - id: 3
      name: company
      label: Company
      hint: Company name
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: Department name
      type: text
      options: []
      required: true
    - id: 5
      name: job_title
      label: Job Title
      hint: Job title
      type: text
      options: []
      required: true
    - id: 6
      name: session_attended
      label: Session Attended
      hint: Which session did you attend?
      type: select_multiple
      options:
      - Session 1
      - Session 2
      - Session 3
      required: true
    - id: 7
      name: session_feedback
      label: Session Feedback
      hint: What did you think of the session?
      type: text
      options: []
      required: true
    - id: 8
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied are you with the event?
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 9
      name: feedback_comments
      label: Feedback Comments
      hint: Additional comments
      type: text
      options: []
      required: false
    - id: 10
      name: rating
      label: Rating
      hint: How would you rate the event?
      type: number
      options: []
      required: true
    - id: 11
      name: recommend
      label: Recommend
      hint: Would you recommend the event?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: attended_previous_summit
      label: Attended Previous Summit
      hint: Have you attended a previous summit?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: previous_summit_years
      label: Previous Summit Years
      hint: In which year did you attend a previous summit?
      type: number
      options: []
      required: false
    - id: 14
      name: comments
      label: Comments
      hint: Any comments?
      type: text
      options: []
      required: false
    - id: 15
      name: suggestions
      label: Suggestions
      hint: Suggestions for the next summit
      type: text
      options: []
      required: false
    - id: 16
      name: overall_satisfaction_scale
      label: Overall Satisfaction Scale
      hint: Scale of 1 to 5
      type: number
      options: []
      required: false
    - id: 17
      name: session_attendance_scale
      label: Session Attendance Scale
      hint: How many sessions did you attend?
      type: number
      options: []
      required: false
