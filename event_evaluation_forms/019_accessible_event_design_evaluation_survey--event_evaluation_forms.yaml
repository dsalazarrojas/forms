inputSchema:
  type: object
  properties:
    title: Accessible Event Design Evaluation Survey
    pages:
    - id: 1
      name: attendee_disability_status
      label: Attendee Disability Status
      hint: Do you have a disability that affects your participation in events?
      type: select_one
      options: ["Yes", "No", "Prefer not to say"]
      required: true
    - id: 2
      name: age_group
      label: Age Group
      hint: What is your age range?
      type: select_one
      options: ["Under 18", "18-24", "25-34", "35-44", "45-54", "55-64", "65-74", "75 or older"]
      required: true
    - id: 3
      name: event_type_attended
      label: Event Type Attended
      hint: What type of event did you attend?
      type: select_one
      options: ["Conference", "Workshop", "Seminar", "Networking Event", "Performance", "Exhibition", "Meeting", "Other"]
      required: true
    - id: 4
      name: event_name
      label: Event Name
      hint: Name of the event you attended
      type: text
      options: []
      required: true
    - id: 5
      name: event_date
      label: Event Date
      hint: Date of the event
      type: date
      options: []
      required: true
    - id: 6
      name: venue_name
      label: Venue Name
      hint: Name of the venue where the event took place
      type: text
      options: []
      required: true
    - id: 7
      name: mobility_accessibility_rating
      label: Mobility Accessibility Rating
      hint: How would you rate the mobility accessibility of the venue?
      type: select_one
      options: ["Excellent", "Good", "Fair", "Poor", "Very Poor"]
      required: true
    - id: 8
      name: visual_accessibility_rating
      label: Visual Accessibility Rating
      hint: How would you rate the visual accessibility (lighting, signage, etc.)?
      type: select_one
      options: ["Excellent", "Good", "Fair", "Poor", "Very Poor"]
      required: true
    - id: 9
      name: auditory_accessibility_rating
      label: Auditory Accessibility Rating
      hint: How would you rate the auditory accessibility (sound system, noise levels, etc.)?
      type: select_one
      options: ["Excellent", "Good", "Fair", "Poor", "Very Poor"]
      required: true
    - id: 10
      name: communication_accessibility_rating
      label: Communication Accessibility Rating
      hint: How would you rate the communication accessibility (materials, announcements, etc.)?
      type: select_one
      options: ["Excellent", "Good", "Fair", "Poor", "Very Poor"]
      required: true
    - id: 11
      name: seating_arrangement_satisfaction
      label: Seating Arrangement Satisfaction
      hint: How satisfied were you with the seating arrangements?
      type: select_one
      options: ["Very Satisfied", "Satisfied", "Neutral", "Dissatisfied", "Very Dissatisfied"]
      required: true
    - id: 12
      name: accessible_restroom_availability
      label: Accessible Restroom Availability
      hint: Were accessible restrooms readily available and clean?
      type: select_one
      options: ["Yes, plenty available", "Yes, but limited", "Yes, but hard to find", "No, not available", "Did not need to use"]
      required: true
    - id: 13
      name: parking_accessibility
      label: Parking Accessibility
      hint: How accessible was the parking situation?
      type: select_one
      options: ["Very Accessible", "Accessible", "Moderately Accessible", "Inaccessible", "Did not use parking"]
      required: true
    - id: 14
      name: staff_assistance_quality
      label: Staff Assistance Quality
      hint: How helpful was the event staff with accessibility needs?
      type: select_one
      options: ["Very Helpful", "Helpful", "Neutral", "Unhelpful", "Very Unhelpful"]
      required: true
    - id: 15
      name: assistive_technology_availability
      label: Assistive Technology Availability
      hint: Were assistive technologies (hearing loops, etc.) available and functional?
      type: select_one
      options: ["Yes, worked well", "Yes, but had issues", "Yes, but not informed about", "No, not available", "Did not need"]
      required: true
    - id: 16
      name: registration_accommodation_process
      label: Registration Accommodation Process
      hint: How easy was it to request accommodations during registration?
      type: select_one
      options: ["Very Easy", "Easy", "Moderate", "Difficult", "Very Difficult"]
      required: true
    - id: 17
      name: most_significant_barrier
      label: Most Significant Barrier
      hint: What was the most significant accessibility barrier you encountered?
      type: select_one
      options: ["Physical obstacles", "Communication barriers", "Lack of assistive technology", "Inadequate seating", "Poor lighting", "Noise issues", "Staff unawareness", "Other"]
      required: true
    - id: 18
      name: likelihood_to_attend_similar_event
      label: Likelihood to Attend Similar Event
      hint: How likely are you to attend a similar event at this venue?
      type: select_one
      options: ["Very Likely", "Likely", "Neutral", "Unlikely", "Very Unlikely"]
      required: true
    - id: 19
      name: accessibility_improvement_suggestions
      label: Accessibility Improvement Suggestions
      hint: What accessibility improvements would you recommend?
      type: text
      options: []
      required: false
    - id: 20
      name: additional_comments
      label: Additional Comments
      hint: Any other comments about the event's accessibility?
      type: text
      options: []
      required: false
