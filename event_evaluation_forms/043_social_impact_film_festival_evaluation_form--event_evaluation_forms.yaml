      - drama
      - romance
      - thriller
      required: true
    - id: 5
      name: film_director
      label: Film Director
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
