inputSchema:
  type: object
  properties:
    title: event_check_in_feedback_survey
    pages:
    - id: 1
      name: event_check_in_experience
      label: What was your experience like?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: event_check_in_satisfaction
      label: Satisfaction
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 3
      name: event_check_in_satisfaction_reason
      label: Reason for satisfaction
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: event_check_in_improvement
      label: What could we improve?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: event_check_in_contact
      label: Would you like to be contacted?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
