inputSchema:
  type: object
  properties:
    title: Business Event Evaluation Form
    pages:
    - id: 1
      name: event_section
      label: -- Event Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: event_date
      label: Event Date
      hint: Date of the event
      type: date
      options: []
      required: true
    - id: 4
      name: attendee_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: attendee_company
      label: Your Company
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: attendance_type
      label: Attendance Type
      hint: How did you attend?
      type: select_one
      options:
      - In-Person
      - Virtual
      - Hybrid
      required: true
    - id: 7
      name: overall_section
      label: -- Overall Event Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: overall_satisfaction
      label: Overall satisfaction with the event
      hint: Rate your overall experience
      type: select_one
      options:
      - Very Unsatisfied
      - Unsatisfied
      - Neutral
      - Satisfied
      - Very Satisfied
      required: true
    - id: 9
      name: would_recommend
      label: Would you recommend this event to others?
      hint: null
      type: select_one
      options:
      - Definitely Not
      - Probably Not
      - Neutral
      - Probably Yes
      - Definitely Yes
      required: true
    - id: 10
      name: likelihood_attend_again
      label: Likelihood of attending future events
      hint: null
      type: select_one
      options:
      - Very Unlikely
      - Unlikely
      - Neutral
      - Likely
      - Very Likely
      required: true
    - id: 11
      name: content_section
      label: -- Content and Sessions --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: sessions_attended
      label: Number of sessions attended
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: content_quality
      label: Quality of session content
      hint: Was the content valuable and relevant?
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 14
      name: speaker_quality
      label: Quality of speakers and presenters
      hint: Rate the speakers
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 15
      name: learning_outcomes
      label: I achieved my learning objectives
      hint: Did you learn what you came to learn?
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 16
      name: logistics_section
      label: -- Event Logistics --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: venue_quality
      label: Venue and facilities
      hint: Was the location appropriate?
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 18
      name: registration_process
      label: Registration and check-in process
      hint: How smooth was the process?
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 19
      name: timing
      label: Event timing and schedule
      hint: Was the schedule well-organized?
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 20
      name: catering
      label: Meals and refreshments
      hint: Rate food and beverage quality
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: false
    - id: 21
      name: networking_section
      label: -- Networking Opportunities --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: networking_opportunities
      label: Quality of networking opportunities
      hint: Did you have good networking chances?
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 23
      name: connections_made
      label: I made valuable professional connections
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: false
    - id: 24
      name: feedback_section
      label: -- Feedback and Suggestions --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: most_valuable
      label: Most valuable aspect of the event
      hint: What was most helpful or interesting?
      type: text
      options: []
      required: false
    - id: 26
      name: improvements
      label: Areas for improvement
      hint: What could be better?
      type: text
      options: []
      required: false
    - id: 27
      name: future_topics
      label: Topics for future events
      hint: What would you like to see next?
      type: text
      options: []
      required: false
