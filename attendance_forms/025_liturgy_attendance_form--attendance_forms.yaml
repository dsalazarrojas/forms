inputSchema:
  type: object
  properties:
    title: Liturgy Attendance Form
    pages:
    - id: 1
      name: service_date
      label: Service Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: meeting_time
      label: Meeting Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: preacher
      label: Preacher
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: attendees_count
      label: Attendees Count
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: total_attendees
      label: Total Attendees
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: attendees
      label: Attendees
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: remarks
      label: Remarks
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: service_officer
      label: Service Officer
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
