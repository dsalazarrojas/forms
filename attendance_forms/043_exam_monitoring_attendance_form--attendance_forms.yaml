      name: student_identifier
      label: Student Identifier
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: session_supervisors
      label: Session Supervisors
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: student_count
      label: Student Count
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: student_attendance
      label: Student Attendance
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: supervision_notes
      label: Supervision Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: proctor_comments
      label: Proctor Comments
      hint: null
      type: text
      options: []
      required: false
