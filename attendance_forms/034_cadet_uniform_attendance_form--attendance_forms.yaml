inputSchema:
  type: object
  properties:
    title: Cadet Uniform Attendance Form
    pages:
    - id: 1
      name: cadet_name
      label: Cadet name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: date
      label: Date
      hint: Attendance date
      type: date
      options: []
      required: true
    - id: 3
      name: uniform_issued
      label: Uniform issued
      hint: Items given to cadet
      type: text
      options: []
      required: true
    - id: 4
      name: size_confirmed
      label: Size confirmed
      hint: Confirm correct size
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: attendance_status
      label: Attendance status
      hint: Present or absent
      type: select_one
      options:
      - Present
      - Absent
      - Excused
      required: true
    - id: 6
      name: signature_reference
      label: Signature reference
      hint: Name of staff signing out uniform
      type: text
      options: []
      required: true
    - id: 7
      name: remarks
      label: Remarks
      hint: Notes on condition or exceptions
      type: text
      options: []
      required: false
    - id: 8
      name: follow_up_needed
      label: Follow up needed
      hint: Repair replacement or exchange
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
