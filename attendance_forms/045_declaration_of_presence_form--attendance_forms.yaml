inputSchema:
  type: object
  properties:
    title: Declaration Of Presence Form
    pages:
    - id: 1
      name: form_header
      label: Form Header
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: form_title
      label: Form Title
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: form_date
      label: Form Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: form_time
      label: Form Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: attendees
      label: Attendees
      hint: List all attendees
      type: select_multiple
      options:
