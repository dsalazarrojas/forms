      - Option B
      - Option C
      required: false
    - id: 6
      name: attendee_email
      label: Attendee's Email
      hint: Enter the attendee's email
      type: email
      options: []
      required: false
    - id: 7
      name: attendee_phone
      label: Attendee's Phone
      hint: Enter the attendee's phone number
      type: text
      options: []
      required: false
    - id: 8
      name: venue_address
      label: Venue Address
      hint: Enter the venue's address
      type: text
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: Add any notes about the form
      type: note
      options: []
      required: false
    - id: 10
      name: submit_button
      label: Submit
      hint: null
      type: select_one
      options:
      - Proceed
      - Cancel
      required: false
