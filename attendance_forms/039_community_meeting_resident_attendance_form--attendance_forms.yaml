inputSchema:
  type: object
  properties:
    title: Community Meeting Resident Attendance Form
    pages:
      - id: 1
        name: attendance_header
        label: -- Attendance Tracking --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: resident_name
        label: Resident name
        hint: For attendance records
        type: text
        options: []
        required: true
      - id: 3
        name: address
        label: Address
        hint: Street and city for verification
        type: text
        options: []
        required: false
      - id: 4
        name: email
        label: Email address
        hint: Optional contact for minutes
        type: email
        options: []
        required: false
      - id: 5
        name: meeting_date
        label: Meeting date
        hint: Date of the meeting
        type: date
        options: []
        required: true
      - id: 6
        name: arrival_time
        label: Arrival time
        hint: Optional time of arrival
        type: time
        options: []
        required: false
      - id: 7
        name: reason_for_absence
        label: Reason for absence if not attending
        hint: Optional explanation
        type: text
        options: []
        required: false
      - id: 8
        name: role_in_meeting
        label: Role in meeting
        hint: Attendee, speaker, or organizer
        type: select_one
        options:
          - Attendee
          - Speaker
          - Organizer
        required: false
      - id: 9
        name: signature_name
        label: Signature name
        hint: Type name to confirm attendance
        type: text
        options: []
        required: false
      - id: 10
        name: additional_notes
        label: Additional notes
        hint: Any other attendance related notes
        type: text
        options: []
        required: false
