inputSchema:
  type: object
  properties:
    title: High School Tutoring Attendance Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: attendance_date
      label: Attendance Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: attendance_time
      label: Attendance Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: session_start_time
      label: Session Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: session_end_time
      label: Session End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: tutor_name
      label: Tutor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: student_grade
      label: Student Grade
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: attended_sessions
      label: Sessions Attended
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: form_completion_status
      label: Form Completion Status
      hint: null
      type: select_one
      options:
      - Completed
      - Incomplete
      - Pending
      required: false
    - id: 11
      name: student_attendance_form_id
      label: Student Attendance Form ID
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: form_version_number
      label: Form Version Number
      hint: null
      type: text
      options: []
      required: false
