inputSchema:
  type: object
  properties:
    title: Attendance Register Manurewa
    pages:
    - id: 1
      name: institution_information
      label: -- Institution Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: institution_name
      label: Institution Name
      hint: School or organization name
      type: text
      options: []
      required: true
    - id: 3
      name: institution_code
      label: Institution Code
      hint: Official code or identifier
      type: text
      options: []
      required: false
    - id: 4
      name: register_period
      label: Register Period
      hint: Term or period covered
      type: select_one
      options:
      - Term 1
      - Term 2
      - Term 3
      - Term 4
      - Annual
      required: true
    - id: 5
      name: academic_year
      label: Academic Year
      hint: Year of the register
      type: text
      options: []
      required: true
    - id: 6
      name: class_information
      label: -- Class Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: class_name
      label: Class Name
      hint: Name of the class
      type: text
      options: []
      required: true
    - id: 8
      name: class_level
      label: Class Level
      hint: Year or grade level
      type: select_one
      options:
      - Year 1
      - Year 2
      - Year 3
      - Year 4
      - Year 5
      - Year 6
      - Year 7
      - Year 8
      - Year 9
      - Year 10
      - Year 11
      - Year 12
      - Year 13
      required: true
    - id: 9
      name: class_teacher
      label: Class Teacher
      hint: Name of the class teacher
      type: text
      options: []
      required: true
    - id: 10
      name: student_information
      label: -- Student Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: student_name
      label: Student Name
      hint: Full name of student
      type: text
      options: []
      required: true
    - id: 12
      name: student_id
      label: Student ID
      hint: Unique student identifier
      type: text
      options: []
      required: true
    - id: 13
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: false
    - id: 15
      name: attendance_information
      label: -- Attendance Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: date_of_record
      label: Date of Record
      hint: Date when recording attendance
      type: date
      options: []
      required: true
    - id: 17
      name: attendance_status
      label: Attendance Status
      hint: Mark present or absent
      type: select_one
      options:
      - Present
      - Absent
      - Late
      - Excused Absence
      - Medical Certificate
      required: true
    - id: 18
      name: period_attended
      label: Period Attended
      hint: Which class period(s)?
      type: select_multiple
      options:
      - Period 1
      - Period 2
      - Period 3
      - Period 4
      - Period 5
      - All Day
      required: false
    - id: 19
      name: reason_absent
      label: Reason for Absence
      hint: If absent, provide reason
      type: text
      options: []
      required: false
    - id: 20
      name: approval_status
      label: Absence Approval Status
      hint: Is absence justified?
      type: select_one
      options:
      - Approved
      - Pending
      - Not Approved
      - Not Applicable
      required: false
    - id: 21
      name: cumulative_information
      label: -- Cumulative Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: total_days_present
      label: Total Days Present
      hint: Cumulative days attended
      type: number
      options: []
      required: false
    - id: 23
      name: total_days_absent
      label: Total Days Absent
      hint: Cumulative days absent
      type: number
      options: []
      required: false
    - id: 24
      name: attendance_percentage
      label: Attendance Percentage
      hint: Overall attendance percentage
      type: number
      options: []
      required: false
    - id: 25
      name: notes_comments
      label: Notes and Comments
      hint: Any additional notes
      type: text
      options: []
      required: false
