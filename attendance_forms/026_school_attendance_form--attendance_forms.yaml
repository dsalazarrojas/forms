inputSchema:
  type: object
  properties:
    title: School Attendance Form
    pages:
    - id: 1
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: attendance_date
      label: Attendance Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: attendance_time
      label: Attendance Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: attendance_status
      label: Attendance Status
      hint: null
      type: select_one
      options:
      - Present
      - Absent
      - Tardy
      required: false
    - id: 6
      name: reason_absence
      label: Reason for Absence
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: student_notes
      label: Student Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: staff_id
      label: Staff ID
      hint: null
      type: text
      options: []
      required: false
