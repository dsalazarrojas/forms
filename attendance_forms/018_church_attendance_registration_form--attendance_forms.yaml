inputSchema:
  type: object
  properties:
    title: Church Attendance Registration Form
    pages:
    - id: 1
      name: registration_date
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: header_visitor_type
      label: -- Attendance Type --
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: visitor_status
      label: Is this your first time visiting us?
      hint: null
      type: select_one
      options:
      - Yes - First Time
      - No - I have visited before
      - No - I am a member
      required: true
    - id: 4
      name: header_personal_info
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: preferred_contact
      label: Best way to contact you?
      hint: null
      type: select_one
      options:
      - Email
      - Text
      - Phone Call
      - No contact please
      required: true
    - id: 9
      name: address
      label: Home Address
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: header_interests
      label: -- Interests and Requests --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: interests
      label: I am interested in
      hint: Select all that apply
      type: select_multiple
      options:
      - Learning about Jesus
      - Baptism
      - Membership
      - Small Groups
      - Children's Ministry
      - Volunteering
      required: false
    - id: 12
      name: prayer_request
      label: Do you have a prayer request?
      hint: Our team will pray for you this week
      type: text
      options: []
      required: false
    - id: 13
      name: referral_source
      label: How did you hear about us?
      hint: null
      type: select_one
      options:
      - Friend/Family
      - Social Media
      - Website
      - Drive By
      - Direct Mail
      required: false
    - id: 14
      name: comments_questions
      label: Any questions or comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: follow_up_permission
      label: Would you like someone to follow up with you this week?
      hint: null
      type: select_one
      options:
      - Yes - I'd like a call
      - Yes - I'd like an email
      - No thanks
      required: true
    - id: 16
      name: household_info
      label: Family Members attending with you
      hint: Names and ages
      type: text
      options: []
      required: false
