      type: time
      options: []
      required: false
    - id: 5
      name: attendance_status
      label: Attendance Status
      hint: null
      type: select_multiple
      options:
      - Present
      - Absent
      - Late
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
