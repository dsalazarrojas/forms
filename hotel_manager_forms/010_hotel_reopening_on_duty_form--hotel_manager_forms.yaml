inputSchema:
  type: object
  properties:
    title: Hotel Reopening On Duty Form
    pages:
    - id: 1
      name: hotel_reopening_status
      label: Current Reopening Status
      hint: Please describe the current status of the hotel's reopening plan.
      type: text
      options: []
      required: false
    - id: 2
      name: safety_training_completed
      label: Safety Training Completed
      hint: Has the hotel completed safety training for all employees?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: safety_measures
      label: Safety Measures
      hint: Describe the safety measures in place to prevent the spread of COVID-19.
      type: text
      options: []
      required: false
    - id: 4
      name: number_of_guests
      label: Number of Guests
      hint: Estimate the number of guests expected to arrive during the reopening
        period.
      type: text
      options: []
      required: false
    - id: 5
      name: number_of_employees
      label: Number of Employees
      hint: Estimate the number of employees expected to be on site during the reopening
        period.
      type: number
      options: []
      required: false
    - id: 6
      name: reopen_time_frame_duration
      label: Reopen Time Frame Duration
      hint: Estimate the duration of the reopening time frame.
      type: text
      options: []
      required: false
    - id: 7
      name: goals_of_safety_measures
      label: Goals of Safety Measures
      hint: Describe the goals of the safety measures in place.
      type: text
      options: []
      required: false
    - id: 8
      name: safety_equipment
      label: Safety Equipment
      hint: Are there any safety equipment or tools that need to be purchased or updated?
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 9
      name: safety_proocols
      label: Safety Protocols
      hint: Are there any specific safety protocols that need to be followed during
        the reopening period?
      type: text
      options: []
      required: false
    - id: 10
      name: number_of_guestrooms
      label: Number of Guestrooms
      hint: Estimate the number of guestrooms available during the reopening period.
      type: text
      options: []
      required: false
    - id: 11
      name: employee_testing_results
      label: Employee Testing Results
      hint: Describe the employee testing results.
      type: text
      options: []
      required: false
    - id: 12
      name: reopen_date
      label: Reopen Date
      hint: Provide the reopening date.
      type: date
      options: []
      required: false
