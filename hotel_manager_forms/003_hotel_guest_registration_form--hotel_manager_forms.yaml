inputSchema:
  type: object
  properties:
    title: Hotel Guest Registration Form
    pages:
    - id: 1
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: check_in_date
      label: Check In Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: check_out_date
      label: Check Out Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: room_type
      label: Room Type
      hint: null
      type: select_one
      options:
      - Single
      - Double
      - Triple
      - Suite
      required: false
    - id: 7
      name: guest_count
      label: Guest Count
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: reservation_note
      label: Reservation Note
      hint: null
      type: note
      options: []
      required: false
