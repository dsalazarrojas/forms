inputSchema:
  type: object
  properties:
    title: Canada Hostel Lease Agreement Form
    pages:
    - id: 1
      name: tenant_full_name
      label: Tenant Full Name
      hint: Legal name of the person leasing the accommodation
      type: text
      options: []
      required: true
    - id: 2
      name: tenant_email
      label: Tenant Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: tenant_phone
      label: Tenant Phone Number
      hint: Canadian phone number for contact
      type: text
      options: []
      required: true
    - id: 4
      name: tenant_date_of_birth
      label: Tenant Date of Birth
      hint: Must be 18 or older to sign lease
      type: date
      options: []
      required: true
    - id: 5
      name: tenant_id_type
      label: Government ID Type
      hint: Type of identification provided
      type: select_one
      options:
      - Canadian Passport
      - Provincial Driver License
      - Provincial ID Card
      - Permanent Resident Card
      - Study Permit
      - Work Permit
      - Other
      required: true
    - id: 6
      name: tenant_id_number
      label: ID Number
      hint: Identification document number
      type: text
      options: []
      required: true
    - id: 7
      name: hostel_location
      label: Hostel Location
      hint: Which hostel property
      type: select_one
      options:
      - Toronto Downtown
      - Vancouver Central
      - Montreal Old Port
      - Calgary Station
      - Ottawa ByWard
      - Quebec City
      - Victoria Harbour
      required: true
    - id: 8
      name: room_type
      label: Room Type
      hint: Type of accommodation
      type: select_one
      options:
      - Private room
      - Shared dormitory - 4 bed
      - Shared dormitory - 6 bed
      - Shared dormitory - 8 bed
      - Female-only dorm
      - Male-only dorm
      - Mixed dorm
      required: true
    - id: 9
      name: lease_start_date
      label: Lease Start Date
      hint: When does the lease begin
      type: date
      options: []
      required: true
    - id: 10
      name: lease_duration
      label: Lease Duration
      hint: Length of stay agreement
      type: select_one
      options:
      - 1 month
      - 2-3 months
      - 4-6 months
      - 7-11 months
      - 12 months or longer
      required: true
    - id: 11
      name: monthly_rent
      label: Monthly Rent Amount CAD
      hint: Rent amount in Canadian dollars
      type: number
      options: []
      required: true
    - id: 12
      name: security_deposit
      label: Security Deposit Amount CAD
      hint: Refundable security deposit
      type: number
      options: []
      required: true
    - id: 13
      name: payment_frequency
      label: Payment Frequency
      hint: How often rent will be paid
      type: select_one
      options:
      - Weekly
      - Bi-weekly
      - Monthly
      - Upfront for full term
      required: true
    - id: 14
      name: payment_method
      label: Payment Method
      hint: Preferred payment method
      type: select_one
      options:
      - Credit card
      - Debit card
      - Bank transfer
      - E-Transfer
      - Cash
      - Cheque
      required: true
    - id: 15
      name: utilities_included
      label: Utilities Included
      hint: Which utilities are covered
      type: select_multiple
      options:
      - Electricity
      - Water
      - Heating
      - Internet WiFi
      - Cable TV
      - Laundry access
      - None
      required: true
    - id: 16
      name: additional_services
      label: Additional Services Requested
      hint: Optional services available
      type: select_multiple
      options:
      - Daily housekeeping
      - Linen service
      - Meal plan
      - Airport shuttle
      - Bike rental
      - Storage locker
      - None
      required: false
    - id: 17
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name of emergency contact
      type: text
      options: []
      required: true
    - id: 18
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number for emergency contact
      type: text
      options: []
      required: true
    - id: 19
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: Relationship to tenant
      type: select_one
      options:
      - Parent
      - Spouse
      - Sibling
      - Friend
      - Other relative
      required: true
    - id: 20
      name: special_requirements
      label: Special Requirements or Accommodations
      hint: Any accessibility or special needs
      type: text
      options: []
      required: false
    - id: 21
      name: pet_owner
      label: Do You Have Pets
      hint: Pets may require additional fees
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 22
      name: smoking_preference
      label: Smoking Preference
      hint: Smoking policy acknowledgment
      type: select_one
      options:
      - Non-smoking room preferred
      - Smoking room if available
      - I agree to non-smoking policy
      required: true
    - id: 23
      name: lease_terms_accepted
      label: Lease Terms and Conditions Accepted
      hint: Do you agree to all lease terms
      type: select_one
      options:
      - Yes - I accept all terms
      - No - I need clarification
      required: true
    - id: 24
      name: signature_date
      label: Agreement Signature Date
      hint: Date of signing
      type: date
      options: []
      required: true
