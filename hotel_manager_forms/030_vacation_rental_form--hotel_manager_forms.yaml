inputSchema:
  type: object
  properties:
    title: Vacation Rental Form
    pages:
    - id: 1
      name: vacation_rental_form
      label: Rental Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: checkin_date
      label: Checkin Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: checkout_date
      label: Checkout Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: room_type
      label: Room Type
      hint: null
