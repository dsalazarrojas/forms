      - Double Room
      - Suite
      required: true
    - id: 6
      name: room_quantity
      label: Room Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: rental_location
      label: Rental Location
      hint: null
      type: select_one
      options:
      - New York
      - Los Angeles
      - Chicago
      required: true
