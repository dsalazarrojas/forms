inputSchema:
  type: object
  properties:
    title: Apartment Booking Confirmation Form
    pages:
    - id: 1
      name: booking_confirmation_header
      label: -- Booking Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: guest_full_name
      label: Guest Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: booking_id
      label: Booking Reference ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: apartment_assigned
      label: Apartment Name or Unit Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: check_in_date
      label: Check-In Date
      hint: Standard check-in after 3 - 00 PM
      type: date
      options: []
      required: true
    - id: 6
      name: check_out_date
      label: Check-Out Date
      hint: Standard check-out before 11 - 00 AM
      type: date
      options: []
      required: true
    - id: 7
      name: guest_count
      label: Total Number of Guests
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: total_stay_price
      label: Total Price of Stay
      hint: Inclusive of all taxes and fees
      type: number
      options: []
      required: true
    - id: 9
      name: amount_deposited
      label: Deposit Amount Paid
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: balance_due
      label: Remaining Balance Due
      hint: Payable upon arrival
      type: number
      options: []
      required: true
    - id: 11
      name: arrival_method
      label: Estimated Time of Arrival
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: identification_provided
      label: Type of Identification Provided
      hint: null
      type: select_one
      options:
      - Passport
      - Driver License
      - National ID
      required: true
    - id: 13
      name: special_requests
      label: Special Requests or Dietary Needs
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: contact_number
      label: Primary Contact Number
      hint: For urgent communication during stay
      type: text
      options: []
      required: true
