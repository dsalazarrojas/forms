inputSchema:
  type: object
  properties:
    title: Aftersales Service Feedback Form
    pages:
    - id: 1
      name: header
      label: -- Aftersales Service Feedback --
      hint: help us improve our post-purchase support
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: order_number
      label: Invoice or Order Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: service_date
      label: Date of Service
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: service_type
      label: Type of service received - Repair, Exchange, Inquiry
      hint: null
      type: select_one
      options:
      - Product Repair
      - Warranty Exchange
      - Technical Support Inquiry
      - Product Installation
      - General Maintenance
      required: true
    - id: 6
      name: service_speed
      label: Speed of service resolution
      hint: how fast was your issue addressed
      type: select_one
      options:
      - Very Fast
      - Fast
      - Average
      - Slow
      - Very Slow
      required: true
    - id: 7
      name: staff_expertise
      label: Technical expertise of the staff
      hint: was the staff knowledgeable
      type: select_one
      options:
      - Highly Knowledgeable
      - Competent
      - Needs Improvement
      - Poor Knowledge
      required: true
    - id: 8
      name: staff_attitude
      label: Professionalism and attitude of the representative
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: overall_satisfaction
      label: Overall satisfaction with the experience
      hint: null
      type: select_one
      options:
      - 5 - Extremely Satisfied
      - 4 - Satisfied
      - 3 - Neutral
      - 2 - Dissatisfied
      - 1 - Extremely Dissatisfied
      required: true
    - id: 10
      name: issue_resolution
      label: Was your issue fully resolved?
      hint: null
      type: select_one
      options:
      - Yes, completely
      - Partially resolved
      - No, still pending
      required: true
    - id: 11
      name: improvement_suggestions
      label: Suggestions for improvement
      hint: tell us how we can do better
      type: text
      options: []
      required: false
    - id: 12
      name: recommendation_likelihood
      label: Would you recommend our services to others?
      hint: null
      type: select_one
      options:
      - Definitely
      - Probably
      - Not sure
      - Probably not
      required: true
