inputSchema:
  type: object
  properties:
    title: customer_experience_enhancement_feedback_form
    pages:
    - id: 1
      name: customer_experience
      label: How do you feel about our customer service?
      hint: null
      type: select_multiple
      options:
      - Terrible
      - Bad
      - Good
      - Very Good
      - Excellent
      required: false
