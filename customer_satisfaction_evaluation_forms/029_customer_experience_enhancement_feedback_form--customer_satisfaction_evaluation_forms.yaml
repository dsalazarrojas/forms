      type: email
      options: []
      required: false
    - id: 6
      name: name
      label: Your name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: phone
      label: Your phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: message
