inputSchema:
  type: object
  properties:
    title: retail_product_delivery_satisfaction_survey
    pages:
    - id: 1
      name: delivery_experience
      label: How was your delivery experience
      hint: Tell us about your delivery experience
      type: note
      options: []
      required: false
    - id: 2
      name: product_quality
      label: What was the quality of the product
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: product_satisfaction
      label: How satisfied are you with the product
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 4
      name: delivery_speed
      label: How fast was the delivery speed
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: communication
      label: How clear were our communication
      hint: null
      type: select_multiple
      options:
      - Very Clear
      - Somewhat Clear
      - Neutral
      - Somewhat Unclear
      - Not Clear
      required: false
    - id: 6
      name: product_price
      label: How reasonable was the price
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: delivery_punctuality
      label: How fast was the delivery
      hint: null
      type: select_one
      options:
      - On Time
      - Late
      - Not on Time
      required: false
    - id: 8
      name: product_reliability
      label: How reliable is the product
      hint: null
      type: select_multiple
      options:
      - Very Reliable
      - Somewhat Reliable
      - Neutral
      - Somewhat Unreliable
      - Not Reliable
      required: false
    - id: 9
      name: communication_frequency
      label: How often did we contact you
      hint: null
      type: select_multiple
      options:
      - Very Often
      - Somewhat Often
      - Neutral
      - Somewhat Not Often
      - Not Often
      required: false
    - id: 10
      name: product_quality_complaints
      label: What was the quality of the product after using it
      hint: null
      type: select_multiple
      options:
      - No Complaints
      - Some Complaints
      - Many Complaints
      required: false
    - id: 11
      name: delivery_speed_complaints
      label: How fast was the delivery after using the product
      hint: null
      type: select_one
      options:
      - On Time
      - Late
      - Not on Time
      required: false
