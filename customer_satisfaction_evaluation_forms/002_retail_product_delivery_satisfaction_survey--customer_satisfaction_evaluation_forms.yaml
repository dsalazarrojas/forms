inputSchema:
  type: object
  properties:
    title: retail_product_delivery_satisfaction_survey
    pages:
    - id: 1
      name: delivery_experience
      label: How was your delivery experience
      hint: Tell us about your delivery experience
      type: note
      options: []
      required: false
    - id: 2
      name: product_quality
      label: What was the quality of the product
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: product_satisfaction
      label: How satisfied are you with the product
      hint: null
      type: select_one
      options:
      - '{''label'': ''Very Satisfied'', ''value'': 5}'
      - '{''label'': ''Somewhat Satisfied'', ''value'': 4}'
      - '{''label'': ''Neutral'', ''value'': 3}'
      - '{''label'': ''Somewhat Dissatisfied'', ''value'': 2}'
      - '{''label'': ''Very Dissatisfied'', ''value'': 1}'
      required: false
