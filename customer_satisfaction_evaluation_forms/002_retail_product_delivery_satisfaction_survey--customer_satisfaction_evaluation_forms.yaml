      name: delivery_speed
      label: How fast was the delivery speed
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: communication
      label: How clear were our communication
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''Very Clear'', ''value'': 5}'
      - '{''label'': ''Somewhat Clear'', ''value'': 4}'
      - '{''label'': ''Neutral'', ''value'': 3}'
      - '{''label'': ''Somewhat Unclear'', ''value'': 2}'
