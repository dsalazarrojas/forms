inputSchema:
  type: object
  properties:
    title: Net Promoter Score (NPS) Survey
    pages:
    - id: 1
      name: intro_question
      label: What is your overall satisfaction with our product or service?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: question_1
      label: How likely are you to recommend our product or service to a friend or
        colleague?
      hint: null
      type: select_one
      options:
      - Not at all likely
      - Not likely
      - Likely
      - Very likely
      - Certain
      required: true
    - id: 3
      name: question_2
      label: How likely are you to purchase from us again?
      hint: null
      type: select_multiple
      options:
      - Not at all likely
      - Not likely
      - Likely
      - Very likely
      required: true
    - id: 4
      name: question_3
      label: What is your main reason for not recommending our product or service?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: question_4
      label: Would you like to provide any additional comments or feedback?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: question_5
      label: How would you rate your overall satisfaction with our product or service?
      hint: null
      type: date
      options: []
      required: true
