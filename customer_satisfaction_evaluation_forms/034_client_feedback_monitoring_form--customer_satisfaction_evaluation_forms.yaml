inputSchema:
  type: object
  properties:
    title: Client Feedback Monitoring Form
    pages:
    - id: 1
      name: client_first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: client_last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: false
    - id: 5
      name: company_name
      label: Company Name
      hint: Your business name
      type: text
      options: []
      required: false
    - id: 6
      name: monitoring_period
      label: Monitoring Period
      hint: Time period for this feedback
      type: select_one
      options:
      - This Week
      - This Month
      - This Quarter
      - This Year
      - Specific Date Range
      required: true
    - id: 7
      name: period_start_date
      label: Period Start Date
      hint: Beginning of period
      type: date
      options: []
      required: false
    - id: 8
      name: period_end_date
      label: Period End Date
      hint: End of period
      type: date
      options: []
      required: false
    - id: 9
      name: service_frequency
      label: How Often Do You Use Our Services?
      hint: Usage frequency
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Annually
      - As Needed
      required: true
    - id: 10
      name: overall_satisfaction
      label: Overall Satisfaction This Period
      hint: Your overall experience
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 11
      name: satisfaction_trend
      label: How Has Your Satisfaction Changed?
      hint: Compared to previous period
      type: select_one
      options:
      - Much Better
      - Somewhat Better
      - About the Same
      - Somewhat Worse
      - Much Worse
      - First Time Responding
      required: true
    - id: 12
      name: service_quality
      label: Service Quality This Period
      hint: Quality rating
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: communication_rating
      label: Communication Rating
      hint: How well did we communicate?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: responsiveness_rating
      label: Responsiveness Rating
      hint: How quickly did we respond?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: reliability_rating
      label: Reliability Rating
      hint: How reliable were we?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 16
      name: value_rating
      label: Value for Money Rating
      hint: Worth the cost?
      type: select_one
      options:
      - Excellent Value
      - Good Value
      - Fair Value
      - Poor Value
      - Very Poor Value
      required: true
    - id: 17
      name: issues_encountered
      label: Did You Encounter Any Issues?
      hint: Problems during period
      type: select_one
      options:
      - No Issues
      - Minor Issues
      - Moderate Issues
      - Significant Issues
      - Major Issues
      required: true
    - id: 18
      name: issues_description
      label: Describe the Issues
      hint: If you experienced issues
      type: text
      options: []
      required: false
    - id: 19
      name: issue_resolution
      label: Were Issues Resolved Satisfactorily?
      hint: Resolution quality
      type: select_one
      options:
      - Yes, Completely
      - Yes, Mostly
      - Partially
      - false
      - Not Applicable
      required: false
    - id: 20
      name: positive_experiences
      label: Positive Experiences This Period
      hint: What went well?
      type: text
      options: []
      required: false
    - id: 21
      name: improvement_suggestions
      label: Suggestions for Improvement
      hint: How can we do better?
      type: text
      options: []
      required: false
    - id: 22
      name: additional_services_needed
      label: Additional Services You Might Need
      hint: Future needs
      type: text
      options: []
      required: false
    - id: 23
      name: continue_relationship
      label: Do You Plan to Continue Our Relationship?
      hint: Future business
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Undecided
      - Probably No
      - Definitely No
      required: true
    - id: 24
      name: recommend_to_others
      label: How Likely Are You to Recommend Us?
      hint: To others
      type: select_one
      options:
      - Very Likely
      - Likely
      - Neutral
      - Unlikely
      - Very Unlikely
      required: true
    - id: 25
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
    - id: 26
      name: monitoring_date
      label: Monitoring Form Date
      hint: null
      type: date
      options: []
      required: true
