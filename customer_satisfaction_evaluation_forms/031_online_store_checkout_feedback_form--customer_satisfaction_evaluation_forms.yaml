inputSchema:
  type: object
  properties:
    title: Online Store Checkout Feedback Form
    pages:
    - id: 1
      name: overall_satisfaction
      label: Overall satisfaction
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Neutral
      - Poor
      required: true
    - id: 2
      name: feedback
      label: What was your experience like at checkout?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: rating
      label: How would you rate your experience?
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 4
      name: checkout_process
      label: Which part of the checkout process did you have the most issues with?
      hint: null
      type: select_one
      options:
      - Navigation
      - Payment
      - Shipping
      - Other (please specify)
      required: true
    - id: 5
      name: additional_feedback
      label: Any additional feedback?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
