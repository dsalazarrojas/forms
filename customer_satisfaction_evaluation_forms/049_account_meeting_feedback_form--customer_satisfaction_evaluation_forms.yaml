inputSchema:
  type: object
  properties:
    title: Account Meeting Feedback Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: client_company
      label: Client Company
      hint: Name of your company
      type: text
      options: []
      required: true
    - id: 3
      name: meeting_date
      label: Meeting Date
      hint: Date when the meeting took place
      type: date
      options: []
      required: true
    - id: 4
      name: meeting_topic
      label: Meeting Topic
      hint: What was the main topic of the meeting?
      type: text
      options: []
      required: true
    - id: 5
      name: account_manager_name
      label: Account Manager Name
      hint: Name of the account manager who led the meeting
      type: text
      options: []
      required: true
    - id: 6
      name: meeting_format
      label: Meeting Format
      hint: How was the meeting conducted?
      type: select_one
      options: ["In-person", "Video conference", "Phone call", "Hybrid"]
      required: true
    - id: 7
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied were you with the meeting overall?
      type: select_one
      options: ["Very Satisfied", "Satisfied", "Neutral", "Dissatisfied", "Very Dissatisfied"]
      required: true
    - id: 8
      name: meeting_objectives_met
      label: Meeting Objectives Met
      hint: Were the meeting objectives clearly defined and met?
      type: select_one
      options: ["Completely Met", "Mostly Met", "Partially Met", "Not Met", "Unclear Objectives"]
      required: true
    - id: 9
      name: agenda_followed
      label: Agenda Followed
      hint: Did the account manager follow the meeting agenda?
      type: select_one
      options: ["Strictly Followed", "Mostly Followed", "Somewhat Followed", "Did Not Follow", "No Agenda Provided"]
      required: true
    - id: 10
      name: preparation_quality
      label: Preparation Quality
      hint: How well prepared was the account manager?
      type: select_one
      options: ["Exceptionally Well Prepared", "Well Prepared", "Adequately Prepared", "Poorly Prepared", "Not Prepared"]
      required: true
    - id: 11
      name: communication_effectiveness
      label: Communication Effectiveness
      hint: How effectively did the account manager communicate?
      type: select_one
      options: ["Very Effective", "Effective", "Moderately Effective", "Minimally Effective", "Ineffective"]
      required: true
    - id: 12
      name: responsiveness_to_questions
      label: Responsiveness to Questions
      hint: How responsive was the account manager to your questions and concerns?
      type: select_one
      options: ["Very Responsive", "Responsive", "Moderately Responsive", "Slightly Responsive", "Not Responsive"]
      required: true
    - id: 13
      name: meeting_materials_quality
      label: Meeting Materials Quality
      hint: How would you rate the quality of materials presented during the meeting?
      type: select_one
      options: ["Excellent", "Good", "Fair", "Poor", "No Materials Provided"]
      required: true
    - id: 14
      name: time_management
      label: Time Management
      hint: Did the account manager manage the meeting time effectively?
      type: select_one
      options: ["Excellent", "Good", "Fair", "Poor", "Very Poor"]
      required: true
    - id: 15
      name: follow_up_commitments
      label: Follow Up Commitments
      hint: Did the account manager follow up on commitments made during the meeting?
      type: select_one
      options: ["Yes, Completely", "Yes, Mostly", "Partially", "No, Not Yet", "No Follow Up Promised"]
      required: true
    - id: 16
      name: value_added_perception
      label: Value Added Perception
      hint: Did you feel the meeting added value to your business relationship?
      type: select_one
      options: ["Significant Value", "Moderate Value", "Little Value", "No Value", "Negative Value"]
      required: true
    - id: 17
      name: likelihood_to_recommend
      label: Likelihood to Recommend
      hint: How likely are you to recommend this account manager to others?
      type: select_one
      options: ["Very Likely", "Likely", "Neutral", "Unlikely", "Very Unlikely"]
      required: true
    - id: 18
      name: improvement_suggestions
      label: Improvement Suggestions
      hint: What suggestions do you have for improving future meetings?
      type: text
      options: []
      required: false
    - id: 19
      name: positive_aspects
      label: Positive Aspects
      hint: What aspects of the meeting did you find most valuable?
      type: text
      options: []
      required: false
    - id: 20
      name: additional_comments
      label: Additional Comments
      hint: Any other comments about the meeting or account manager?
      type: text
      options: []
      required: false
