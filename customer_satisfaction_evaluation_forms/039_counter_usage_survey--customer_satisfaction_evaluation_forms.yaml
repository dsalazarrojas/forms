inputSchema:
  type: object
  properties:
    title: Counter Usage Survey
    pages:
    - id: 1
      name: form_data
      label: Form data
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: counter_type
      label: Counter type
      hint: null
      type: select_one
      options:
      - Counters with self-service kiosks
      - Counters without self-service kiosks
      - Mobile counter
      required: false
    - id: 3
      name: frequency_of_use
      label: How often do you use the service counter?
      hint: null
      type: select_multiple
      options:
      - Frequently
      - Occasionally
      - Rarely
      required: false
    - id: 4
      name: overall_satisfaction
      label: How would you rate your overall satisfaction with your last visit?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 5
      name: staff_friendliness
      label: How friendly were the staff members?
      hint: null
      type: select_one
      options:
      - Very friendly
      - Somewhat friendly
      - Neutral
      - Somewhat un-friendly
      - Very un-friendly
      required: false
    - id: 6
      name: cleanliness
      label: How clean was the counter?
      hint: null
      type: select_one
      options:
      - Very clean
      - Somewhat clean
      - Neutral
      - Somewhat unclean
      - Very unclean
      required: false
    - id: 7
      name: availability_of_staff
      label: How long did you have to wait for service?
      hint: null
      type: select_one
      options:
      - Very quick
      - Somewhat quick
      - Neutral
      - Somewhat slow
      - Very slow
      required: false
    - id: 8
      name: overall_experience
      label: How would you rate your overall experience?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 9
      name: additional_comments
      label: Do you have any additional comments?
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: contact_info
      label: Would you like to be contacted back for further discussions?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
