inputSchema:
  type: object
  properties:
    title: Footwear Customer Satisfaction Survey
    pages:
    - id: 1
      name: first_page
      label: welcome_to_the_survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_name
      label: what_was_the_name_of_the_product
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: purchase_date
      label: purchase_date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: purchase_price
      label: purchase_price
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: overall_satisfaction
      label: overall_satisfaction
      hint: How satisfied are you with this product?
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 6
      name: recommendation
      label: recommendation
      hint: Would you recommend this product to a friend?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: feedback
      label: feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_email
      label: contact_email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: contact_phone
      label: contact_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: customer_feedback
      label: customer_feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: additional_comments
      label: additional_comments
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: customer_service
      label: customer_service
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
