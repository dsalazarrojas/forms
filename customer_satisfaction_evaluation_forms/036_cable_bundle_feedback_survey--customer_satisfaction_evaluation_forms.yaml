inputSchema:
  type: object
  properties:
    title: Cable Bundle Feedback Survey
    pages:
    - id: 1
      name: service_details_header
      label: -- Current Service Details --
      hint: Helping us improve your cable and internet experience
      type: note
      options: []
      required: false
    - id: 2
      name: customer_account_number
      label: Account Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: current_bundle_type
      label: Current Bundle Type
      hint: null
      type: select_one
      options:
      - Starter Triple Play
      - Preferred Double Play
      - Ultimate Quad Play
      - Internet Only
      - TV Only
      required: true
    - id: 4
      name: satisfaction_header
      label: -- Service Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: internet_reliability
      label: Internet Connection Reliability
      hint: 1 is Very Unreliable, 5 is Very Reliable
      type: number
      options: []
      required: true
    - id: 6
      name: internet_speed_rating
      label: Satisfaction with Internet Speeds
      hint: null
      type: select_one
      options:
      - Exceeds Expectations
      - Meets Expectations
      - Below Expectations
      required: true
    - id: 7
      name: tv_channel_selection
      label: Satisfaction with Channel Lineup
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      required: true
    - id: 8
      name: video_quality
      label: Picture and Audio Quality
      hint: HD and 4K performance
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: equipment_performance
      label: DVR and Set-Top Box Performance
      hint: responsiveness and ease of use
      type: select_one
      options:
      - Very Reliable
      - Somewhat Reliable
      - Frequent Issues
      required: true
    - id: 10
      name: pricing_feedback_header
      label: -- Value and Pricing --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: value_perception
      label: Perception of Overall Value for Money
      hint: null
      type: select_one
      options:
      - Great Value
      - Fair Price
      - Overpriced
      required: true
    - id: 12
      name: contract_clarity
      label: Clarity of Monthly Billing and Contracts
      hint: null
      type: select_one
      options:
      - Very Clear
      - Somewhat Clear
      - Confusing
      required: true
    - id: 13
      name: support_experience
      label: Last Interaction with Customer Support
      hint: if applicable
      type: select_one
      options:
      - Resolved Quickly
      - Resolved with Difficulty
      - Unresolved
      - Haven't contacted support
      required: false
    - id: 14
      name: improvement_areas
      label: What is the ONE thing we could improve
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: future_intent
      label: Likelihood to renew or stay with us
      hint: null
      type: select_one
      options:
      - Highly Likely
      - Likely
      - Neutral
      - Unlikely
      - Leaving Soon
      required: true
    - id: 16
      name: competitive_survey
      label: Which other providers have you considered
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: permission_to_follow_up
      label: May a representative contact you about your feedback
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
