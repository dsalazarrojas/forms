inputSchema:
  type: object
  properties:
    title: Mobile App Navigation Feedback Form
    pages:
    - id: 1
      name: app_experience
      label: How would you rate your overall experience on our mobile app?
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: app_usage
      label: Which features of our mobile app are you using most frequently?
      hint: null
      type: select_multiple
      options:
      - Home screen
      - Navigation menu
      - Search function
      - Settings
      required: true
    - id: 3
      name: feedback_missing_features
      label: What do you think is missing from our mobile app navigation?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: navigation_ease
      label: How would you rate the ease of navigation on our mobile app?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: app_issues
      label: Are there any issues or bugs that have caused you inconvenience while
        using our mobile app?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: false
    - id: 6
      name: app_speed
      label: How would you rate the speed of our mobile app navigation?
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: daily_usage
      label: How often do you use our mobile app on a daily basis?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: app_feature_additions
      label: Which of the following features would you like to see added to our mobile
        app?
      hint: null
      type: select_multiple
      options:
      - Home screen
      - Navigation menu
      - Search function
      - Settings
      - Other (please specify)
      required: false
    - id: 9
      name: search_satisfaction
      label: How would you rate your satisfaction with our mobile app's search function?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: search_usage
      label: How often do you use our mobile app's search function?
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: removed_features
      label: Are there any features that you would like to see removed from our mobile
        app?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: false
    - id: 12
      name: design_rating
      label: How would you rate the overall design of our mobile app's navigation?
      hint: null
      type: number
      options: []
      required: true
