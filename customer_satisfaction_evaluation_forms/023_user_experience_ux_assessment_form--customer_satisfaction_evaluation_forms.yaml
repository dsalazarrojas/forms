inputSchema:
  type: object
  properties:
    title: User Experience (UX) Assessment Form
    pages:
    - id: 1
      name: intro_page
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: navigation
      label: Navigation
      hint: null
      type: select_one
      options:
      - easy
      - moderate
      - difficult
      required: true
    - id: 3
      name: ui_satisfaction
      label: User Interface Satisfaction
      hint: null
      type: select_multiple
      options:
      - very satisfied
      - satisfied
      - neutral
      - dissatisfied
      - very dissatisfied
      required: true
    - id: 4
      name: favorite_features
      label: Favorite Features
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: frustrating_features
      label: Frustrating Features
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: searchability
      label: Searchability
      hint: null
      type: select_one
      options:
      - easy
      - moderate
      - difficult
      required: true
    - id: 7
      name: suggestion
      label: Suggestion
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: color_scheme
      label: Color Scheme
      hint: null
      type: select_multiple
      options:
      - beautiful
      - good
      - fair
      - ugly
      required: true
    - id: 9
      name: satisfaction
      label: Satisfaction
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: recommendation
      label: Recommendation
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: final_impression
      label: Final Impression
      hint: null
      type: text
      options: []
      required: false
