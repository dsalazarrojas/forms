inputSchema:
  type: object
  properties:
    title: Flagship Store Customer Feedback Survey
    pages:
    - id: 1
      name: customer_info
      label: Customer Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Information
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: feedback_details
      label: Feedback Details
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: satisfaction
      label: Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      required: true
    - id: 6
      name: comment
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: visit_date
      label: Visit Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: visit_time
      label: Visit Time
      hint: null
      type: time
      options: []
      required: true
