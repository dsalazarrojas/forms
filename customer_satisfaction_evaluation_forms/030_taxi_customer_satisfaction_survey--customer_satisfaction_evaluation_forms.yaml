inputSchema:
  type: object
  properties:
    title: Taxi Customer Satisfaction Survey
    pages:
    - id: 1
      name: overall_experience
      label: Overall experience
      hint: Overall experience with the taxi service
      type: text
      options: []
      required: true
    - id: 2
      name: fare
      label: Fare
      hint: Please enter the fare
      type: number
      options: []
      required: true
    - id: 3
      name: service_quality
      label: Service Quality
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: helpfulness_of_driver
      label: Helpfulness of driver
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: overall_satisfaction
      label: Overall satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 6
      name: improvement_areas
      label: Improvement areas
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: recommend_taxis
      label: Recommend taxis
      hint: Would you recommend this taxi service to others?
      type: text
      options: []
      required: true
    - id: 8
      name: contact_method
      label: Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Text Messaging
      required: true
    - id: 9
      name: contact_number
      label: Contact Number
      hint: Please enter your contact number
      type: text
      options: []
      required: false
    - id: 10
      name: contact_message
      label: Contact Message
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: comments
      label: Comments
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 12
      name: additional_comments
      label: Additional comments
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: rating_reason
      label: Rating reason
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
