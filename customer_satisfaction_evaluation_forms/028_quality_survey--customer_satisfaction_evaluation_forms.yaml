      name: service_quality
      label: service_quality
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: customer_service
      label: customer_service
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: product_price
      label: product_price
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: overall_satisfaction
      label: overall_satisfaction
      hint: null
      type: time
      options: []
      required: false
