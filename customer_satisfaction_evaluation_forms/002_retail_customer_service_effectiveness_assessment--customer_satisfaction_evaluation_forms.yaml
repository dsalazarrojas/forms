inputSchema:
  type: object
  properties:
    title: Retail Customer Service Effectiveness Assessment
    pages:
    - id: 1
      name: retail_customer_service_effectiveness_form_1
      label: In-Store Experience
      hint: Rate your in-store experience with our customer service representatives
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 2
      name: retail_customer_service_effectiveness_form_2
      label: Product Knowledge
      hint: null
      type: select_one
      options:
      - Always
      - Sometimes
      - Rarely
      required: true
    - id: 3
      name: retail_customer_service_effectiveness_form_3
      label: Communication Skill
      hint: How would you rate our customer service representatives communication
        skills
      type: number
      options: []
      required: true
    - id: 4
      name: retail_customer_service_effectiveness_form_4
      label: Helpfulness
      hint: Rate how helpful the customer service representative was
      type: select_one
      options:
      - Very Helpful
      - Somewhat Helpful
      - Not Helpful At All
      required: true
    - id: 5
      name: retail_customer_service_effectiveness_form_5
      label: Overall
      hint: Rate your overall experience
      type: number
      options: []
      required: true
    - id: 6
      name: retail_customer_service_effectiveness_form_6
      label: Store Appearance
      hint: Rate the cleanliness and appearance of our store
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: retail_customer_service_effectiveness_form_7
      label: Store Location
      hint: Rate the convenience of our store location
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: retail_customer_service_effectiveness_form_8
      label: Store Hours
      hint: null
      type: select_one
      options:
      - Always Open
      - Mostly Open
      - Sometimes Open
      - Rarely Open
      required: true
    - id: 9
      name: retail_customer_service_effectiveness_form_9
      label: Store Parking
      hint: Rate the parking options near our store
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 10
      name: retail_customer_service_effectiveness_form_10
      label: Additional Comments
      hint: Any additional comments about your experience
      type: note
      options: []
      required: false
    - id: 11
