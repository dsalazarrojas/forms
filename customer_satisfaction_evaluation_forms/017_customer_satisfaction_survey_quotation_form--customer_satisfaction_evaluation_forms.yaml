inputSchema:
  type: object
  properties:
    title: customer_satisfaction_survey_quotation_form
    pages:
    - id: 1
      name: how_likely_recommmend
      label: How likely are you to recommend our service?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: reason_last_interaction
      label: Reason for your last interaction with our service
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: satisfaction_level
      label: On a scale of 0-10, how satisfied are you with our service?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: favorite_aspects
      label: What aspects of our service do you enjoy the most?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: issue_example
      label: Example of where you experienced an issue with our service
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: likely_return
      label: How likely are you to return to our service in the future?
      hint: null
      type: select_one
      options:
      - Very likely
      - Somewhat likely
      - Not likely
      - Not at all likely
      required: true
    - id: 7
      name: improvement_points
      label: What do you think we could do to improve our service?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: comments
      label: Do you have any comments about your experience with our service?
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: reason_initial_contact
      label: Why did you contact us initially?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: overall_experience
      label: On a scale of 1-5, how would you rate your overall experience?
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: communication_quality
      label: How would you rate the quality of our communication?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 12
      name: quick_support
      label: How quickly were you able to get help when you needed it?
      hint: null
      type: select_one
      options:
      - Instantly
      - Within a few minutes
      - Within a few hours
      - Not quickly enough
      required: true
