inputSchema:
  type: object
  properties:
    title: Likert Scale Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: Survey Introduction
      hint: This is a short survey to gather your feedback
      type: text
      options: []
      required: false
    - id: 2
      name: question_1
      label: How would you rate our service overall?
      hint: Rate our service on a scale of 1-5
      type: number
      options: []
      required: false
    - id: 3
      name: question_2
      label: Do you have any suggestions or feedback for us?
      hint: Please share any thoughts or comments you have
      type: text
      options: []
      required: false
    - id: 4
      name: question_3
      label: How satisfied are you with the quality of our product/service?
      hint: null
      type: select_one
      options:
      - Very Dissatisfied
      - Somewhat Dissatisfied
      - Neutral
      - Somewhat Satisfied
      - Very Satisfied
      required: true
    - id: 5
      name: question_4
      label: How likely are you to recommend our product/service to a friend or colleague?
      hint: null
      type: select_one
      options:
      - Not Applicable
      - Very Dissatisfied
      - Somewhat Dissatisfied
      - Neutral
      - Somewhat Satisfied
      - Very Satisfied
      required: true
    - id: 6
      name: question_5
      label: How would you rate the overall value of our product/service?
      hint: null
      type: select_one
      options:
      - Very Dissatisfied
      - Somewhat Dissatisfied
      - Neutral
      - Somewhat Satisfied
      - Very Satisfied
      required: true
    - id: 7
      name: question_6
      label: How likely are you to use our product/service again?
      hint: null
      type: select_one
      options:
      - Not Applicable
      - Very Dissatisfied
      - Somewhat Dissatisfied
      - Neutral
      - Somewhat Satisfied
      - Very Satisfied
      required: true
    - id: 8
      name: question_7
      label: How would you rate the speed of our service?
      hint: null
      type: select_one
      options:
      - Very Dissatisfied
      - Somewhat Dissatisfied
      - Neutral
      - Somewhat Satisfied
      - Very Satisfied
      required: true
    - id: 9
      name: submit
      label: Submit
      hint: Please click submit to complete the survey
      type: select_one
      options:
      - Option A
      - Option B
      required: true
    - id: 10
      name: thank_you
      label: Thank you for taking the time to provide your feedback
      hint: null
      type: text
      options: []
      required: false
