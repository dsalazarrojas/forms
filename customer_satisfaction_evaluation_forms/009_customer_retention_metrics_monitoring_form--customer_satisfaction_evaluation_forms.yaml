inputSchema:
  type: object
  properties:
    title: Customer Retention Metrics Monitoring Form
    pages:
    - id: 1
      name: customer_retention_period_1
      label: How many months do you have been a customer with us?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 2
      name: customer_satisfaction_level_1
      label: What is your overall satisfaction level with our services?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: true
    - id: 3
      name: customer_retention_rates_1
      label: What are your customer retention rates?
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 4
      name: customer_satisfaction_1
      label: What is your customer satisfaction rating?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: feedback
      label: Can you please provide any additional feedback on customer satisfaction
        and retention?
      hint: null
      type: note
      options: []
      required: false
