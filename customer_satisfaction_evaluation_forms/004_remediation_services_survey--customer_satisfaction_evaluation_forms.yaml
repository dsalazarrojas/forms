inputSchema:
  type: object
  properties:
    title: Remediation Services Survey
    pages:
    - id: 1
      name: service_rating
      label: how_would_you_rate_our_services
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: rating_1
      label: one_star
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 3
      name: satisfaction_level
      label: how_satisfied_with_your_experience
      hint: null
      type: select_one
      options:
      - very satisfied
      - somewhat satisfied
      - neutral
      - somewhat dissatisfied
      - very dissatisfied
      required: false
    - id: 4
      name: service_provided
      label: what_services_were_provided
      hint: null
      type: select_multiple
      options:
      - remediation
      - consulting
      - support
      required: false
    - id: 5
      name: service_request
      label: what_services_did_you_request
      hint: null
      type: select_multiple
      options:
      - remediation
      - consulting
      - support
      required: false
    - id: 6
      name: date_of_service
      label: date_of_service
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time_of_service
      label: time_of_service
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: notes
      label: additional_comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
