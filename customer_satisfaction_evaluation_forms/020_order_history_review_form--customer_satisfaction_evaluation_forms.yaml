inputSchema:
  type: object
  properties:
    title: Order History Review Form
    pages:
    - id: 1
      name: customer_satisfaction
      label: How satisfied are you with your purchase
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 2
      name: order_details
      label: What was the order date?
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: order_total
      label: What was the total cost of the order?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: order_items
      label: What items were purchased?
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: rating
      label: Would you purchase from us again?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: category
      label: What category does this order belong to?
      hint: null
      type: select_multiple
      options:
      - Electronics
      - Apparel
      - Home and Kitchen
      - Books
      - Sports
      required: false
    - id: 8
      name: rating_value
      label: On a scale of 1 to 10
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: rating_comment
      label: Why did you rate it that way?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: contact_us
      label: How can we improve?
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: order_number
      label: What is your order number?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: review_date
      label: When did you review the order?
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: purchase_date
      label: When you purchased the order?
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: total_cost
      label: What was the total cost of the order?
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: purchase_method
      label: How did you purchase the order?
      hint: null
      type: select_one
      options:
      - Online
      - In Store
      - Other
      required: false
    - id: 16
      name: payment_method
      label: How did you pay for the order?
      hint: null
      type: select_multiple
      options:
      - Cash
      - Credit Card
      - PayPal
      - Other
      required: false
    - id: 17
      name: order_status
      label: What is the status of the order?
      hint: null
      type: select_multiple
      options:
      - Active
      - Completed
      - Cancelled
      - On Hold
      required: false
    - id: 18
      name: shipping_method
      label: What shipping method did you use?
      hint: null
      type: select_multiple
      options:
      - Standard Shipping
      - Express Shipping
      - Pickup
      required: false
    - id: 19
      name: return_policy
      label: Have you made any returns?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 20
      name: return_reason
      label: If yes, why did you return it?
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: return_method
      label: How did you return it?
      hint: null
      type: select_multiple
      options:
      - Mail
      - In Store
      - Other
      required: false
    - id: 22
      name: purchase_country
      label: In which country did you purchase the order?
      hint: null
      type: select_one
      options:
      - USA
      - Canada
      - Mexico
      required: false
    - id: 23
      name: shipping_country
      label: In which country was the order shipped?
      hint: null
      type: select_one
      options:
      - USA
      - Canada
      - Mexico
      required: false
    - id: 24
      name: purchase_date_country
      label: In which country did you purchase the item?
      hint: null
      type: select_one
      options:
      - USA
      - Canada
      - Mexico
      required: false
    - id: 25
      name: shipping_date_country
      label: In which country was the item shipped?
      hint: null
      type: select_one
      options:
      - USA
      - Canada
      - Mexico
      required: false
