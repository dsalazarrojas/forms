inputSchema:
  type: object
  properties:
    title: Client Satisfaction Communication Form
    pages:
    - id: 1
      name: form_intro
      label: -- Service Feedback and Communication Evaluation --
      hint: Your feedback helps us improve
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: communication_channels_used
      label: Primary Communication Channels Used
      hint: Which methods did we use to communicate?
      type: select_multiple
      options:
      - Email
      - Phone
      - Video call
      - In-person meeting
      - Text message
      - Portal or app
      - Other
      required: true
    - id: 5
      name: communication_frequency_adequacy
      label: Was Communication Frequency Adequate?
      hint: null
      type: select_one
      options:
      - Too frequent
      - Just right
      - Not frequent enough
      - Inconsistent
      required: true
    - id: 6
      name: communication_clarity
      label: Clarity of Communications
      hint: Were messages clear and understandable?
      type: select_one
      options:
      - Very clear
      - Clear
      - Somewhat clear
      - Unclear
      - Very unclear
      required: true
    - id: 7
      name: communication_responsiveness
      label: Our Responsiveness to Your Communications
      hint: How quickly did we respond?
      type: select_one
      options:
      - Immediate response
      - Prompt response
      - Reasonable delay
      - Significant delay
      - No response
      required: true
    - id: 8
      name: professional_tone
      label: Professionalism of Communications
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very poor
      required: true
    - id: 9
      name: personalization_level
      label: Personalization of Communications
      hint: Did communications feel personalized to your situation?
      type: select_one
      options:
      - Highly personalized
      - Well personalized
      - Generic but appropriate
      - Impersonal
      - Not personalized
      required: false
    - id: 10
      name: information_completeness
      label: Completeness of Information Provided
      hint: Were all necessary details included in communications?
      type: select_one
      options:
      - All information provided
      - Most information provided
      - Some information missing
      - Significant gaps
      - Insufficient information
      required: true
    - id: 11
      name: expectation_setting
      label: Clear Expectation Setting
      hint: Were expectations clearly communicated upfront?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not set
      required: true
    - id: 12
      name: proactive_updates
      label: Proactive Updates on Status or Changes
      hint: Did we keep you informed without being asked?
      type: select_one
      options:
      - Consistently proactive
      - Usually proactive
      - Sometimes proactive
      - Rarely proactive
      - No proactive updates
      required: false
    - id: 13
      name: communication_preferences
      label: Would You Like to Adjust Communication Preferences?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: areas_improvement
      label: Areas for Improvement in Communication
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: positive_feedback
      label: What Worked Well in Our Communications?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: additional_feedback
      label: Additional Feedback
      hint: null
      type: text
      options: []
      required: false
