inputSchema:
  type: object
  properties:
    title: CCTV Customer Satisfaction Survey
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: For follow-up if needed
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: false
    - id: 4
      name: installation_date
      label: Installation Date
      hint: When was your CCTV system installed
      type: date
      options: []
      required: true
    - id: 5
      name: service_technician
      label: Service Technician Name
      hint: If you remember their name
      type: text
      options: []
      required: false
    - id: 6
      name: overall_satisfaction
      label: Overall Satisfaction Rating
      hint: How satisfied are you with our service
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 7
      name: installation_quality
      label: Installation Quality
      hint: Rate the quality of installation work
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 8
      name: technician_professionalism
      label: Technician Professionalism
      hint: Rate the technician behavior and communication
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 9
      name: system_functionality
      label: System Functionality
      hint: Is your CCTV system working as expected
      type: select_one
      options:
      - Exceeds Expectations
      - Meets Expectations
      - Below Expectations
      - Not Working Properly
      required: true
    - id: 10
      name: response_time
      label: Response Time Satisfaction
      hint: How satisfied with our response time
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 11
      name: value_for_money
      label: Value for Money
      hint: Do you feel you received good value
      type: select_one
      options:
      - Excellent Value
      - Good Value
      - Fair Value
      - Poor Value
      - Very Poor Value
      required: true
    - id: 12
      name: issues_encountered
      label: Issues Encountered
      hint: Select any issues you experienced
      type: select_multiple
      options:
      - None
      - System Malfunction
      - Poor Video Quality
      - Connectivity Issues
      - Mobile App Problems
      - Recording Issues
      - Other
      required: true
    - id: 13
      name: recommend_to_others
      label: Would You Recommend Us
      hint: How likely to recommend to friends or colleagues
      type: select_one
      options:
      - Very Likely
      - Likely
      - Neutral
      - Unlikely
      - Very Unlikely
      required: true
    - id: 14
      name: additional_feedback
      label: Additional Feedback
      hint: Any other comments or suggestions
      type: text
      options: []
      required: false
    - id: 15
      name: follow_up_permission
      label: May We Contact You for Follow-up
      hint: We may call to address any concerns
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
