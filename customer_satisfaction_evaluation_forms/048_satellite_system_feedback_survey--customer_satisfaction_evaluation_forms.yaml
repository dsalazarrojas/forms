inputSchema:
  type: object
  properties:
    title: Satellite System Feedback Survey
    pages:
    - id: 1
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: satellite_system
      label: Satellite System
      hint: null
      type: select_one
      options:
      - Satellite System 1
      - Satellite System 2
      - Satellite System 3
      required: true
    - id: 3
      name: question_1
      label: How would you rate the overall quality of the satellite system?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: question_2
      label: On a scale of 1-10, how likely are you to recommend the satellite system?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: question_3
      label: How would you rate the customer service provided by the satellite system?
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: question_4
      label: How would you rate the overall value of the satellite system?
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: question_5
      label: How likely are you to use the satellite system again?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: question_6
      label: Additional comments?
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: user_rating
      label: Overall Rating
      hint: null
      type: number
      options: []
      required: true
