inputSchema:
  type: object
  properties:
    title: Painter And Decorator Feedback Form
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone number
      hint: Your contact number
      type: number
      options: []
      required: false
    - id: 4
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 5
      name: service_quality
      label: Service Quality
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Interior
      - Exterior
      - Both
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: Your comments
      type: text
      options: []
      required: false
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
