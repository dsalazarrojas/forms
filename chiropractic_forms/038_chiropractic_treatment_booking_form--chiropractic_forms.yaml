inputSchema:
  type: object
  properties:
    title: Chiropractic Treatment Booking Form
    pages:
    - id: 1
      name: patient_information
      label: -- Patient Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: patient_status
      label: Patient Status
      hint: null
      type: select_one
      options:
      - New Patient
      - Returning Patient
      - Follow-up Appointment
      required: true
    - id: 8
      name: chief_complaint
      label: -- Chief Complaint --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: area_of_pain
      label: Area of Pain or Concern
      hint: Where does it hurt
      type: select_one
      options:
      - Neck
      - Upper Back
      - Mid-Back
      - Lower Back
      - Shoulder
      - Arm
      - Leg
      - Other
      required: true
    - id: 10
      name: pain_severity
      label: Pain Severity
      hint: Rate 1 (mild) to 10 (severe)
      type: number
      options: []
      required: true
    - id: 11
      name: symptom_description
      label: Describe Your Symptoms
      hint: Details about your condition
      type: text
      options: []
      required: true
    - id: 12
      name: symptom_onset
      label: When Did Symptoms Start
      hint: null
      type: select_one
      options:
      - Less than 1 week ago
      - 1-4 weeks ago
      - 1-3 months ago
      - 3-6 months ago
      - More than 6 months ago
      required: true
    - id: 13
      name: appointment_preferences
      label: -- Appointment Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: preferred_date
      label: Preferred Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: preferred_time
      label: Preferred Time
      hint: null
      type: select_one
      options:
      - Morning (8am-12pm)
      - Afternoon (12pm-5pm)
      - Evening (5pm-8pm)
      - Any time
      required: true
    - id: 16
      name: appointment_type
      label: Type of Appointment
      hint: null
      type: select_one
      options:
      - Initial Consultation
      - Treatment Session
      - Follow-up Session
      - Evaluation Only
      required: true
    - id: 17
      name: appointment_duration
      label: Preferred Duration
      hint: null
      type: select_one
      options:
      - 30 minutes
      - 45 minutes
      - 1 hour
      - 1.5 hours
      required: true
    - id: 18
      name: insurance_details
      label: -- Insurance and Medical Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: has_insurance
      label: Do you have health insurance
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 20
      name: insurance_provider
      label: Insurance Provider
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: policy_number
      label: Policy Number
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: medical_conditions
      label: -- Medical Conditions --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: current_medications
      label: Current Medications
      hint: List any medications you take
      type: text
      options: []
      required: false
    - id: 24
      name: allergies
      label: Known Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: agreement
      label: I agree to the booking terms
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
