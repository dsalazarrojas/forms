inputSchema:
  type: object
  properties:
    title: Chiropractic Referral Marketing Software Evaluation Form
    pages:
    - id: 1
      name: respondent_information
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_role
      label: Your Role
      hint: null
      type: select_one
      options:
      - Chiropractor
      - Office Manager
      - Administrative Staff
      - Marketing Manager
      - Other
      required: true
    - id: 4
      name: practice_name
      label: Practice Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: software_assessment
      label: -- Software Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: software_name
      label: Software Name Being Evaluated
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: usage_duration
      label: How long have you used this software
      hint: null
      type: select_one
      options:
      - Less than 1 month
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - 1-2 years
      - 2+ years
      required: true
    - id: 9
      name: ease_of_use
      label: Ease of Use
      hint: Rate 1 (difficult) to 5 (very easy)
      type: number
      options: []
      required: true
    - id: 10
      name: feature_functionality
      label: Feature Functionality and Completeness
      hint: Rate 1 (poor) to 5 (excellent)
      type: number
      options: []
      required: true
    - id: 11
      name: user_interface
      label: User Interface and Design
      hint: Rate 1 (poor) to 5 (excellent)
      type: number
      options: []
      required: true
    - id: 12
      name: referral_tracking
      label: -- Referral Tracking Features --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: referral_tracking_effectiveness
      label: Effectiveness for tracking referrals
      hint: Rate 1 (ineffective) to 5 (very effective)
      type: number
      options: []
      required: true
    - id: 14
      name: patient_acquisition
      label: Impact on patient acquisition
      hint: Rate 1 (no impact) to 5 (significant impact)
      type: number
      options: []
      required: true
    - id: 15
      name: referral_reporting
      label: Quality of referral reports
      hint: Rate 1 (poor) to 5 (excellent)
      type: number
      options: []
      required: true
    - id: 16
      name: satisfaction_analysis
      label: -- Overall Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: satisfaction_score
      label: Overall Satisfaction with Software
      hint: Rate 1 (very dissatisfied) to 5 (very satisfied)
      type: number
      options: []
      required: true
    - id: 18
      name: value_for_money
      label: Value for Money
      hint: Rate 1 (poor value) to 5 (excellent value)
      type: number
      options: []
      required: true
    - id: 19
      name: implementation_support
      label: Implementation and Support Quality
      hint: Rate 1 (poor) to 5 (excellent)
      type: number
      options: []
      required: true
    - id: 20
      name: strengths
      label: -- Strengths and Weaknesses --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: main_strengths
      label: Main Strengths of the Software
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: main_weaknesses
      label: Main Weaknesses or Areas for Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: recommendation
      label: Would you recommend this software
      hint: null
      type: select_one
      options:
      - Yes, strongly
      - 'Yes'
      - Neutral
      - 'No'
      - No, definitely not
      required: true
    - id: 24
      name: additional_comments
      label: Additional Comments or Suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: form_completion
      label: I have completed this evaluation
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
