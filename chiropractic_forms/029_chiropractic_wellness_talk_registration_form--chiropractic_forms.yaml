inputSchema:
  type: object
  properties:
    title: Chiropractic Wellness Talk Registration Form
    pages:
    - id: 1
      name: attendee_information
      label: Attendee Information
      hint: Your contact details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: title
      label: Title
      hint: Mr, Ms, Dr, etc.
      type: text
      options: []
      required: false
    - id: 5
      name: organization
      label: Organization or Company
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: address
      label: Address
      hint: Street, city, state, zip
      type: text
      options: []
      required: false
    - id: 9
      name: event_selection
      label: Event Selection
      hint: Choose your session
      type: note
      options: []
      required: false
    - id: 10
      name: event_name
      label: Wellness Talk Session
      hint: null
      type: select_one
      options:
      - Spinal Health Fundamentals
      - Nutrition and Wellness
      - Stress Management
      - Ergonomics at Work
      - Exercise and Movement
      - Holistic Health Approach
      - Complete Wellness Series
      required: true
    - id: 11
      name: event_date
      label: Preferred Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: event_time
      label: Preferred Time
      hint: null
      type: time
      options: []
      required: false
    - id: 13
      name: event_location
      label: Event Location
      hint: null
      type: select_one
      options:
      - Main office
      - Community center
      - Online webinar
      - Corporate location
      - Other
      required: true
    - id: 14
      name: attendance_details
      label: Attendance Details
      hint: Additional attendees
      type: note
      options: []
      required: false
    - id: 15
      name: number_attending
      label: Number of Attendees
      hint: Including yourself
      type: number
      options: []
      required: true
    - id: 16
      name: additional_attendees
      label: Names of Additional Attendees
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 17
      name: guest_attendees
      label: Are you bringing guests
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 18
      name: interests_topics
      label: Topics of Interest
      hint: Select all that apply
      type: select_multiple
      options:
      - Spinal health
      - Posture correction
      - Pain management
      - Nutrition
      - Exercise
      - Stress reduction
      - Sleep improvement
      - Workplace ergonomics
      - Preventive care
      - Holistic wellness
      required: false
    - id: 19
      name: dietary_requirements
      label: Dietary Requirements
      hint: If refreshments provided
      type: note
      options: []
      required: false
    - id: 20
      name: dietary_restrictions
      label: Do you have any dietary restrictions
      hint: null
      type: select_one
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-free
      - Dairy-free
      - Nut allergy
      - Other
      required: false
    - id: 21
      name: dietary_details
      label: Please Specify Dietary Restrictions
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: accessibility_needs
      label: Accessibility Needs
      hint: Accommodations required
      type: note
      options: []
      required: false
    - id: 23
      name: accessibility_required
      label: Do you require any accessibility accommodations
      hint: null
      type: select_one
      options:
      - false
      - Wheelchair access
      - Sign language interpreter
      - Large print materials
      - Hearing assistance
      - Other
      required: false
    - id: 24
      name: accessibility_details
      label: Please Specify Accessibility Needs
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: registration_type
      label: Registration Type
      hint: How you are registering
      type: note
      options: []
      required: false
    - id: 26
      name: registration_category
      label: Registration Category
      hint: null
      type: select_one
      options:
      - Individual
      - Couple
      - Family
      - Corporate group
      - Community organization
      required: true
    - id: 27
      name: referral_source
      label: How did you hear about this event
      hint: null
      type: select_one
      options:
      - Email invitation
      - Social media
      - Website
      - Friend or family
      - Healthcare provider
      - Advertisement
      - Previous attendee
      - Other
      required: true
    - id: 28
      name: payment_information
      label: Payment Information
      hint: Registration fee
      type: note
      options: []
      required: false
    - id: 29
      name: registration_fee
      label: Registration Fee
      hint: null
      type: select_one
      options:
      - Free event
      - $25 per person
      - $50 per person
      - $100 per person
      - Corporate rate
      - Group rate
      required: true
    - id: 30
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit card
      - Debit card
      - Check
      - Cash at door
      - Invoice me
      - Already paid
      required: false
    - id: 31
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Paid in full
      - Pending
      - Will pay at event
      - Invoice requested
      required: false
    - id: 32
      name: additional_information
      label: Additional Information
      hint: Your questions or comments
      type: note
      options: []
      required: false
    - id: 33
      name: questions_for_speaker
      label: Do you have specific questions for the speaker
      hint: null
      type: text
      options: []
      required: false
    - id: 34
      name: special_requests
      label: Special Requests
      hint: null
      type: text
      options: []
      required: false
    - id: 35
      name: future_events
      label: Would you like to be notified about future events
      hint: null
      type: select_one
      options:
      - Yes, please
      - No, thank you
      required: true
    - id: 36
      name: newsletter_signup
      label: Would you like to join our wellness newsletter
      hint: null
      type: select_one
      options:
      - Yes, sign me up
      - No, thank you
      required: true
    - id: 37
      name: consent_contact
      label: I consent to being contacted about this event
      hint: null
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 38
      name: attendee_signature
      label: Attendee Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 39
      name: registration_date
      label: Date of Registration
      hint: null
      type: date
      options: []
      required: true
