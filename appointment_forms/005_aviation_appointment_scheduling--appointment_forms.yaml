inputSchema:
  type: object
  properties:
    title: Aviation Appointment Scheduling
    pages:
    - id: 1
      name: service_type
      label: Service Type
      hint: What aviation service do you need
      type: select_one
      options:
      - Flight training lesson
      - Aircraft rental
      - Maintenance inspection
      - Fuel service
      - Hangar rental
      - Charter flight booking
      - Aircraft purchase consultation
      - Pilot certification exam
      - Other
      required: true
    - id: 2
      name: customer_type
      label: Customer Type
      hint: What best describes you
      type: select_one
      options:
      - Student pilot
      - Licensed pilot
      - Aircraft owner
      - Business/corporate
      - First-time customer
      - FBO member
      required: true
    - id: 3
      name: full_name
      label: Full Name
      hint: Your complete name
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: For appointment confirmation
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Primary contact number
      type: text
      options: []
      required: true
    - id: 6
      name: pilot_certificate
      label: Pilot Certificate Level
      hint: Your current certification
      type: select_one
      options:
      - Student pilot
      - Sport pilot
      - Recreational pilot
      - Private pilot
      - Commercial pilot
      - ATP (Airline Transport Pilot)
      - CFI/CFII
      - Not applicable
      required: false
    - id: 7
      name: pilot_certificate_number
      label: Pilot Certificate Number
      hint: FAA certificate number if applicable
      type: text
      options: []
      required: false
    - id: 8
      name: aircraft_type_interest
      label: Aircraft Type of Interest
      hint: Which aircraft you want to fly or service
      type: select_one
      options:
      - Single-engine piston
      - Multi-engine piston
      - Turboprop
      - Light jet
      - Mid-size jet
      - Heavy jet
      - Helicopter
      - Not applicable
      required: false
    - id: 9
      name: tail_number
      label: Aircraft Tail Number
      hint: N-number if you own or are renting specific aircraft
      type: text
      options: []
      required: false
    - id: 10
      name: preferred_date
      label: Preferred Appointment Date
      hint: First choice date
      type: date
      options: []
      required: true
    - id: 11
      name: preferred_time
      label: Preferred Appointment Time
      hint: First choice time
      type: time
      options: []
      required: true
    - id: 12
      name: alternate_date
      label: Alternate Date
      hint: Second choice date
      type: date
      options: []
      required: false
    - id: 13
      name: alternate_time
      label: Alternate Time
      hint: Second choice time
      type: time
      options: []
      required: false
    - id: 14
      name: appointment_duration
      label: Expected Duration
      hint: How long do you need
      type: select_one
      options:
      - 30 minutes
      - 1 hour
      - 2 hours
      - Half day (4 hours)
      - Full day (8 hours)
      - Multi-day
      - Not sure
      required: true
    - id: 15
      name: instructor_preference
      label: Instructor Preference
      hint: Request specific instructor if applicable
      type: select_one
      options:
      - No preference
      - Senior instructor
      - Female instructor
      - Bilingual instructor
      - Specific instructor (name below)
      required: false
    - id: 16
      name: instructor_name_request
      label: Requested Instructor Name
      hint: If you have a preference, enter name here
      type: text
      options: []
      required: false
    - id: 17
      name: number_of_passengers
      label: Number of Passengers
      hint: Including yourself
      type: number
      options: []
      required: false
    - id: 18
      name: special_requirements
      label: Special Requirements
      hint: Any accessibility or equipment needs
      type: text
      options: []
      required: false
    - id: 19
      name: previous_customer
      label: Have You Used Our Services Before
      hint: Are you a returning customer
      type: select_one
      options:
      - Yes, regularly
      - Yes, once or twice
      - No, first time
      required: true
    - id: 20
      name: referral_source
      label: How Did You Hear About Us
      hint: Your referral source
      type: select_one
      options:
      - Website
      - Social media
      - Friend/family referral
      - Pilot recommendation
      - Flight school
      - Advertisement
      - Other
      required: false
    - id: 21
      name: payment_method
      label: Preferred Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit card
      - Debit card
      - Cash
      - Check
      - Account billing
      - Insurance
      required: true
    - id: 22
      name: additional_notes
      label: Additional Notes
      hint: Any other information for your appointment
      type: text
      options: []
      required: false
    - id: 23
      name: confirmation_preference
      label: Confirmation Preference
      hint: How should we confirm your appointment
      type: select_one
      options:
      - Email confirmation
      - Phone call
      - Text message
      - No confirmation needed
      required: true
    - id: 24
      name: cancellation_policy_acknowledged
      label: I Understand the Cancellation Policy
      hint: Check to acknowledge
      type: select_one
      options:
      - Yes, I acknowledge
      - Other
      required: true
