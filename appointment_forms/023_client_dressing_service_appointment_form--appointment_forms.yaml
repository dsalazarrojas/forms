inputSchema:
  type: object
  properties:
    title: Client Dressing Service Appointment Form
    pages:
    - id: 1
      name: client_first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: client_last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: client_address
      label: Street Address
      hint: Complete mailing address
      type: text
      options: []
      required: false
    - id: 6
      name: client_city
      label: City
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: client_state
      label: State
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: client_zip
      label: ZIP Code
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: service_type
      label: Dressing Service Type
      hint: What service do you need?
      type: select_one
      options:
      - Personal Styling
      - Wardrobe Consultation
      - Special Event Styling
      - Professional Image Consulting
      - Closet Organization
      - Personal Shopping
      - Bridal Styling
      - Other
      required: true
    - id: 10
      name: appointment_date
      label: Preferred Appointment Date
      hint: First choice date
      type: date
      options: []
      required: true
    - id: 11
      name: appointment_time
      label: Preferred Appointment Time
      hint: First choice time
      type: time
      options: []
      required: true
    - id: 12
      name: alternative_date
      label: Alternative Date
      hint: Second choice
      type: date
      options: []
      required: false
    - id: 13
      name: appointment_location
      label: Appointment Location
      hint: Where should we meet?
      type: select_one
      options:
      - At Our Studio
      - At Your Home
      - At Your Office
      - Virtual Consultation
      - Shopping Trip
      required: true
    - id: 14
      name: occasion
      label: Occasion for Styling
      hint: What is this for?
      type: select_one
      options:
      - Everyday Wear
      - Business Professional
      - Wedding
      - Special Event
      - Photoshoot
      - Job Interview
      - Wardrobe Refresh
      - Other
      required: true
    - id: 15
      name: style_preferences
      label: Style Preferences
      hint: Describe your style
      type: text
      options: []
      required: false
    - id: 16
      name: size_information
      label: Clothing Size Information
      hint: Your typical sizes
      type: text
      options: []
      required: false
    - id: 17
      name: color_preferences
      label: Color Preferences
      hint: Favorite colors or colors to avoid
      type: text
      options: []
      required: false
    - id: 18
      name: budget_range
      label: Budget Range for Purchases
      hint: If shopping is involved
      type: select_one
      options:
      - Under $500
      - $500 - $1,000
      - $1,000 - $2,500
      - $2,500 - $5,000
      - Over $5,000
      - No Budget Limit
      required: false
    - id: 19
      name: preferred_brands
      label: Preferred Brands or Stores
      hint: Where do you like to shop?
      type: text
      options: []
      required: false
    - id: 20
      name: brands_to_avoid
      label: Brands or Stores to Avoid
      hint: Any dislikes
      type: text
      options: []
      required: false
    - id: 21
      name: body_type_concerns
      label: Body Type or Fit Concerns
      hint: Any specific areas to address
      type: text
      options: []
      required: false
    - id: 22
      name: lifestyle_description
      label: Describe Your Lifestyle
      hint: Work, social, activities
      type: text
      options: []
      required: true
    - id: 23
      name: styling_goals
      label: What Are Your Styling Goals?
      hint: What do you want to achieve?
      type: text
      options: []
      required: true
    - id: 24
      name: previous_styling_experience
      label: Have You Worked with a Stylist Before?
      hint: Previous experience
      type: select_one
      options:
      - Yes, Frequently
      - Yes, Once or Twice
      - No, Never
      required: true
    - id: 25
      name: cancellation_policy
      label: I Understand the Cancellation Policy
      hint: 24-hour notice required
      type: select_one
      options:
      - I Understand
      - I Do Not Understand
      required: true
    - id: 26
      name: service_agreement
      label: I Agree to the Service Terms and Conditions
      hint: Full agreement
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
    - id: 27
      name: appointment_date_submitted
      label: Request Submission Date
      hint: null
      type: date
      options: []
      required: true
