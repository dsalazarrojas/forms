inputSchema:
  type: object
  properties:
    title: Car Seat Inspection Appointment Form
    pages:
    - id: 1
      name: parent_guardian_information
      label: Parent/Guardian Information
      hint: Your contact details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: For appointment confirmation
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: address
      label: Street Address
      hint: Your address
      type: text
      options: []
      required: true
    - id: 7
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: true
    - id: 8
      name: state
      label: State
      hint: Your state
      type: text
      options: []
      required: true
    - id: 9
      name: zip_code
      label: ZIP Code
      hint: Your ZIP code
      type: text
      options: []
      required: true
    - id: 10
      name: child_information
      label: Child Information
      hint: Details about the child
      type: note
      options: []
      required: false
    - id: 11
      name: child_name
      label: Child Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 12
      name: child_age
      label: Child Age
      hint: Age in years
      type: text
      options: []
      required: true
    - id: 13
      name: child_weight
      label: Child Weight
      hint: In pounds
      type: text
      options: []
      required: true
    - id: 14
      name: child_height
      label: Child Height
      hint: In inches
      type: text
      options: []
      required: false
    - id: 15
      name: number_of_children
      label: Number of Children Needing Inspection
      hint: How many seats?
      type: select_one
      options:
      - 1
      - 2
      - 3
      - 4 or more
      required: true
    - id: 16
      name: car_seat_information
      label: Car Seat Information
      hint: Details about the car seat
      type: note
      options: []
      required: false
    - id: 17
      name: seat_type
      label: Seat Type
      hint: Type of car seat
      type: select_one
      options:
      - Infant seat (rear-facing)
      - Convertible seat
      - Forward-facing seat
      - Booster seat
      - All-in-one seat
      - Not sure
      required: true
    - id: 18
      name: seat_brand
      label: Seat Brand
      hint: Manufacturer
      type: text
      options: []
      required: false
    - id: 19
      name: seat_model
      label: Seat Model
      hint: Model name
      type: text
      options: []
      required: false
    - id: 20
      name: seat_age
      label: Seat Age
      hint: How old is the seat?
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 4-6 years
      - Over 6 years
      - Unknown
      required: true
    - id: 21
      name: seat_condition
      label: Seat Condition
      hint: Overall condition
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 22
      name: installation_type
      label: Installation Type
      hint: How is it installed?
      type: select_one
      options:
      - LATCH system
      - Seat belt
      - Both
      - Not sure
      required: false
    - id: 23
      name: vehicle_information
      label: Vehicle Information
      hint: Details about your vehicle
      type: note
      options: []
      required: false
    - id: 24
      name: vehicle_year
      label: Vehicle Year
      hint: Year
      type: text
      options: []
      required: true
    - id: 25
      name: vehicle_make
      label: Vehicle Make
      hint: Manufacturer
      type: text
      options: []
      required: true
    - id: 26
      name: vehicle_model
      label: Vehicle Model
      hint: Model
      type: text
      options: []
      required: true
    - id: 27
      name: vehicle_type
      label: Vehicle Type
      hint: Type of vehicle
      type: select_one
      options:
      - Sedan
      - SUV
      - Minivan
      - Truck
      - Wagon
      - Other
      required: true
    - id: 28
      name: appointment_details
      label: Appointment Details
      hint: Scheduling preferences
      type: note
      options: []
      required: false
    - id: 29
      name: preferred_date
      label: Preferred Date
      hint: First choice
      type: date
      options: []
      required: true
    - id: 30
      name: preferred_time
      label: Preferred Time
      hint: What time?
      type: time
      options: []
      required: true
    - id: 31
      name: backup_date
      label: Backup Date
      hint: Alternative date
      type: date
      options: []
      required: false
    - id: 32
      name: appointment_type
      label: Appointment Type
      hint: Type of inspection
      type: select_one
      options:
      - New installation check
      - Existing installation check
      - Education only
      - Seat selection help
      - Other
      required: true
    - id: 33
      name: inspection_location
      label: Inspection Location
      hint: Where to meet?
      type: select_one
      options:
      - Fire station
      - Police station
      - Community center
      - Hospital
      - Home visit
      - Other
      required: true
    - id: 34
      name: specific_location
      label: Specific Location
      hint: Address if known
      type: text
      options: []
      required: false
    - id: 35
      name: concerns
      label: Concerns
      hint: What are you concerned about?
      type: select_multiple
      options:
      - Proper installation
      - Harness tightness
      - Seat angle
      - Seat belt routing
      - Expiration date
      - Recall status
      - Seat appropriateness
      - Multiple seat installation
      - Other
      required: false
    - id: 36
      name: additional_services
      label: Additional Services
      hint: Any other needs?
      type: select_multiple
      options:
      - None
      - Seat education
      - Seat recommendation
      - Registration assistance
      - Recall check
      - Proper use education
      required: false
    - id: 37
      name: previous_inspection
      label: Previous Inspection
      hint: Have you had an inspection before?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 38
      name: how_heard_about_us
      label: How Did You Hear About Us
      hint: Your referral source
      type: select_one
      options:
      - Healthcare provider
      - Fire department
      - Police department
      - Social media
      - Friend/Family
      - Website
      - Other
      required: false
    - id: 39
      name: special_needs
      label: Special Needs
      hint: Any accessibility needs?
      type: text
      options: []
      required: false
    - id: 40
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
    - id: 41
      name: reminder_preference
      label: Reminder Preference
      hint: How to remind you?
      type: select_one
      options:
      - Email
      - Text message
      - Phone call
      - No reminder needed
      required: true
    - id: 42
      name: appointment_date
      label: Appointment Request Date
      hint: Today's date
      type: date
      options: []
      required: true
