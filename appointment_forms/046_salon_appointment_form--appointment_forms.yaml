inputSchema:
  type: object
  properties:
    title: Salon Appointment Form
    pages:
    - id: 1
      name: salon_id
      label: Salon Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Customer Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: appointment_reason
      label: Appointment Reason
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: appointment_duration
      label: Appointment Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: services
      label: Services
      hint: null
      type: select_multiple
      options:
      - Haircut
      - Hair color
      - Massages
      - Other
      required: false
    - id: 10
      name: appointment_time_window
      label: Preferred Time Window
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Other
      required: false
