inputSchema:
  type: object
  properties:
    title: Appointment Booking And Resource Download
    pages:
    - id: 1
      name: contact_information
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 6
      name: appointment_details
      label: -- Appointment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: appointment_type
      label: Type of Appointment
      hint: null
      type: select_one
      options:
      - Consultation
      - Strategy session
      - Demo
      - Support call
      - Training session
      - Other
      required: true
    - id: 8
      name: preferred_date
      label: Preferred Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: preferred_time
      label: Preferred Time
      hint: null
      type: select_one
      options:
      - 9 AM - 10 AM
      - 10 AM - 11 AM
      - 11 AM - 12 PM
      - 1 PM - 2 PM
      - 2 PM - 3 PM
      - 3 PM - 4 PM
      - 4 PM - 5 PM
      required: true
    - id: 10
      name: timezone
      label: Your Timezone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: appointment_purpose
      label: Purpose of appointment
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: meeting_format
      label: Meeting Format
      hint: null
      type: select_one
      options:
      - Phone call
      - Video conference
      - In-person
      - No preference
      required: false
    - id: 13
      name: resource_section
      label: -- Resource Download --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: resources_interested
      label: Which resources would you like to download?
      hint: Select all that apply
      type: select_multiple
      options:
      - Pricing guide
      - Case studies
      - Product brochure
      - Checklist
      - Webinar recording
      - White paper
      required: false
    - id: 15
      name: industry
      label: Industry
      hint: null
      type: select_one
      options:
      - Technology
      - Finance
      - Healthcare
      - Retail
      - Manufacturing
      - Other
      required: false
    - id: 16
      name: company_size
      label: Company Size
      hint: null
      type: select_one
      options:
      - 1-10 employees
      - 11-50 employees
      - 51-200 employees
      - 201-1000 employees
      - 1000+ employees
      required: false
    - id: 17
      name: budget_range
      label: Budget Range
      hint: null
      type: select_one
      options:
      - Under $10000
      - $10000 - $25000
      - $25000 - $50000
      - $50000 - $100000
      - $100000+
      - Not specified
      required: false
    - id: 18
      name: additional_information
      label: Additional Information or Questions
      hint: null
      type: text
      options: []
      required: false
