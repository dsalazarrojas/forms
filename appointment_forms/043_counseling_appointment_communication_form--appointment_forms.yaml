inputSchema:
  type: object
  properties:
    title: Counseling Appointment Communication Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: preferred_language
      label: Preferred Language
      hint: null
      type: select_multiple
      options:
      - English
      - Spanish
      - French
      required: false
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: reason_for_visit
      label: Reason for Visit
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - SMS
      required: false
    - id: 10
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: insurance_status
      label: Insurance Status
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Pending
      required: false
    - id: 12
      name: appointment_status
      label: Appointment Status
      hint: null
      type: select_multiple
      options:
      - Confirmed
      - Pending
      - Cancelled
      required: false
