inputSchema:
  type: object
  properties:
    title: medical_appointment_form
    pages:
    - id: 1
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: doctor_name
      label: Doctor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: medical_record_number
      label: Medical Record Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: appointment_type
      label: Appointment Type
      hint: null
      type: select_one
      options:
      - new patient
      - follow-up
      - routine checkup
      required: false
    - id: 7
      name: appointment_reason
      label: Appointment Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: patient_phone
      label: Patient Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: doctor_phone
      label: Doctor Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: google_calendar_integration
      label: Google Calendar Integration
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: email_notification
      label: Email Notification
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - remind me
      required: false
    - id: 12
      name: save_button
      label: Save Button
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: cancel_button
      label: Cancel Button
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
