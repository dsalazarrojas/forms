inputSchema:
  type: object
  properties:
    title: Waxing Consent & Appointment Form
    pages:
    - id: 1
      name: consent
      label: Consent
      hint: null
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: true
    - id: 2
      name: appointment_details
      label: Appointment Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: contact
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: services
      label: Services
      hint: Select services from the list
      type: select_one
      options:
      - Waxing
      - Haircut
      - Shaving
      required: true
    - id: 7
      name: additional_services
      label: Additional Services
      hint: Select any additional services
      type: select_multiple
      options:
      - Waxing
      - Haircut
      - Shaving
      required: false
    - id: 8
      name: services_price
      label: Services Price
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: payment_method
      label: Payment Method
      hint: Select payment method
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: signature
      label: Signature
      hint: Provide your signature for the services provided
      type: text
      options: []
      required: true
    - id: 11
      name: signature_date
      label: Signature Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: signature_time
      label: Signature Time
      hint: null
      type: time
      options: []
      required: true
