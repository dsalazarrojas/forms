inputSchema:
  type: object
  properties:
    title: Annual Healthcare Check Up Booking
    pages:
    - id: 1
      name: patient_name
      label: Full Name
      hint: Enter your complete legal name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: patient_email
      label: Email Address
      hint: We will send appointment confirmation to this email
      type: email
      options: []
      required: true
    - id: 4
      name: patient_phone
      label: Phone Number
      hint: Include area code for contact purposes
      type: text
      options: []
      required: true
    - id: 5
      name: insurance_provider
      label: Insurance Provider
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: insurance_id
      label: Insurance Policy Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: preferred_appointment_date
      label: Preferred Appointment Date
      hint: Select your preferred date for the check-up
      type: date
      options: []
      required: true
    - id: 8
      name: preferred_time_slot
      label: Preferred Time Slot
      hint: null
      type: select_one
      options:
      - 08:00 AM - 09:00 AM
      - 09:00 AM - 10:00 AM
      - 10:00 AM - 11:00 AM
      - 02:00 PM - 03:00 PM
      - 03:00 PM - 04:00 PM
      - 04:00 PM - 05:00 PM
      required: true
    - id: 9
      name: primary_care_physician
      label: Primary Care Physician
      hint: If you have an existing physician at our clinic
      type: text
      options: []
      required: false
    - id: 10
      name: reason_for_visit
      label: Reason for Visit or Concerns
      hint: Describe any specific health concerns or reasons for this appointment
      type: text
      options: []
      required: false
    - id: 11
      name: medications
      label: Are you currently taking any medications
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: medication_list
      label: List of Current Medications
      hint: Include medication names and dosages if applicable
      type: text
      options: []
      required: false
    - id: 13
      name: allergies
      label: Do you have any known allergies
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 14
      name: allergy_details
      label: Allergy Details
      hint: Describe all known allergies including severity
      type: text
      options: []
      required: false
    - id: 15
      name: medical_history
      label: Any relevant medical history we should know about
      hint: Include surgeries, chronic conditions, or major illnesses
      type: text
      options: []
      required: false
    - id: 16
      name: previous_visit_date
      label: Date of Last Check-Up
      hint: If known, provide approximate date
      type: date
      options: []
      required: false
    - id: 17
      name: transportation_needs
      label: Special Transportation Needs
      hint: null
      type: select_one
      options:
      - No special needs
      - Wheelchair accessibility required
      - Mobility assistance needed
      - Interpreter services required
      required: false
    - id: 18
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name of your emergency contact person
      type: text
      options: []
      required: true
    - id: 19
      name: emergency_contact_phone
      label: Emergency Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: relationship_to_patient
      label: Relationship to Patient
      hint: null
      type: select_one
      options:
      - Spouse
      - Parent
      - Child
      - Sibling
      - Friend
      - Other
      required: true
    - id: 21
      name: consent_privacy
      label: I consent to the collection and use of my health information
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 22
      name: newsletter_opt_in
      label: Receive health updates and clinic news
      hint: null
      type: select_one
      options:
      - Yes, opt me in
      - No, do not send updates
      required: false
