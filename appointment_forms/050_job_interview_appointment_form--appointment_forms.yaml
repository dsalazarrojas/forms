inputSchema:
  type: object
  properties:
    title: Job Interview Appointment Form
    pages:
    - id: 1
      name: interview_details
      label: Interview Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: candidate_info
      label: Candidate Info
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: interviewers
      label: Interviewers
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: schedule
      label: Schedule
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: interview_time
      label: Interview Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: candidate_status
      label: Candidate Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 7
      name: interview_location
      label: Interview Location
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
