inputSchema:
  type: object
  properties:
    title: AI Assistant Zoom Meeting Scheduling
    pages:
    - id: 1
      name: scheduling_header
      label: -- Meeting Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Requester name
      hint: Full name for the meeting invite
      type: text
      options: []
      required: true
    - id: 3
      name: requester_email
      label: Requester email
      hint: Calendar invite will be sent here
      type: email
      options: []
      required: true
    - id: 4
      name: preferred_date
      label: Preferred meeting date
      hint: Provide a preferred date
      type: date
      options: []
      required: true
    - id: 5
      name: preferred_time
      label: Preferred meeting time
      hint: Provide a preferred time in local timezone
      type: time
      options: []
      required: true
    - id: 6
      name: duration_minutes
      label: Meeting duration minutes
      hint: Typical durations are 30 or 60
      type: number
      options: []
      required: true
    - id: 7
      name: agenda_summary
      label: Meeting agenda summary
      hint: Main topics or goals for the meeting
      type: text
      options: []
      required: false
    - id: 8
      name: attendees
      label: Other attendees
      hint: Names and emails of additional participants
      type: text
      options: []
      required: false
    - id: 9
      name: timezone
      label: Timezone
      hint: Specify timezone for scheduling
      type: select_one
      options:
      - UTC
      - Local
      - Specific timezone
      required: true
