inputSchema:
  type: object
  properties:
    title: Brand Development Appointment Form
    pages:
      - id: 1
        name: client_name
        label: Client name
        hint: Name of person attending appointment
        type: text
        options: []
        required: true
      - id: 2
        name: contact_email
        label: Contact email
        hint: Email for appointment confirmation
        type: email
        options: []
        required: true
      - id: 3
        name: preferred_date
        label: Preferred appointment date
        hint: Choose a convenient date
        type: date
        options: []
        required: true
      - id: 4
        name: preferred_time
        label: Preferred appointment time
        hint: Morning afternoon or evening preference
        type: time
        options: []
        required: false
      - id: 5
        name: project_goals
        label: Project goals
        hint: Key objectives for brand development
        type: text
        options: []
        required: false
      - id: 6
        name: budget_range
        label: Budget range
        hint: Estimated budget for services
        type: select_one
        options:
          - Under 5k
          - 5k to 20k
          - Over 20k
        required: false
      - id: 7
        name: meeting_format
        label: Meeting format
        hint: In person or virtual
        type: select_one
        options:
          - In person
          - Virtual
        required: true
      - id: 8
        name: additional_notes
        label: Additional notes
        hint: Any other details for the consultant
        type: text
        options: []
        required: false
