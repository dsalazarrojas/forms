inputSchema:
  type: object
  properties:
    title: lip_blush_consultation_form
    pages:
    - id: 1
      name: introduction
      label: What is a lip blush?
      hint: A brief introduction to the lip blush procedure.
      type: note
      options: []
      required: false
    - id: 2
      name: medical_history
      label: Medical History
      hint: A detailed medical history for the patient.
      type: text
      options: []
      required: false
    - id: 3
      name: patient_consent
      label: Patient Consent
      hint: A thorough review and discussion with your client about the lip blush
        procedure.
      type: select_one
      options:
      - I have read and understand the procedure.
      - I have not read and understand the procedure.
      - I do not understand the procedure.
      required: true
    - id: 4
      name: contact_details
      label: Contact Details
      hint: Patient contact information
      type: text
      options: []
      required: false
    - id: 5
      name: medications
      label: Medications
      hint: List of medications
      type: text
      options: []
      required: false
    - id: 6
      name: allergies
      label: Allergies
      hint: List of allergies
      type: text
      options: []
      required: false
    - id: 7
      name: medical_condition_notes
      label: Medical Condition Notes
      hint: Detailed notes about the patient's medical condition
      type: note
      options: []
      required: false
    - id: 8
      name: contact_number
      label: Contact Number
      hint: Patient contact number
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: Patient email
      type: email
      options: []
      required: false
    - id: 10
      name: medical_conditions
      label: Medical Conditions
      hint: Select all applicable medical conditions
      type: select_multiple
      options:
      - Hypersensitivity to certain medications
      - Allergies to certain substances
      - Previous surgeries
      - Other (please specify)
      required: true
    - id: 11
      name: other_medical_conditions
      label: Other Medical Conditions
      hint: List of other medical conditions
      type: text
      options: []
      required: false
    - id: 12
      name: other_medical_conditions_notes
      label: Other Conditions Notes
      hint: Detailed notes about other medical conditions
      type: note
      options: []
      required: false
    - id: 13
      name: other_medical_conditions_description
      label: Other Conditions Description
      hint: Detailed description of other medical conditions
      type: text
      options: []
      required: false
    - id: 14
      name: consent_2
      label: Patient Consent 2
      hint: A thorough review and discussion with your client about the lip blush
        procedure.
      type: select_one
      options:
      - I have read and understand the procedure.
      - I have not read and understand the procedure.
      - I do not understand the procedure.
      required: false
