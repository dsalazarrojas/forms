inputSchema:
  type: object
  properties:
    title: Appointment Schedule Template
    pages:
    - id: 1
      name: personal_info
      label: Personal Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: company
      label: Company Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: scheduling_info
      label: Scheduling Information
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: appointment_type
      label: Appointment Type
      hint: null
      type: select_one
      options:
      - Initial Consultation
      - Follow-up
      - Training
      - Review
      - Other
      required: true
    - id: 11
      name: location
      label: Meeting Location
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: purpose
      label: Purpose of Appointment
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: additional_attendees
      label: Number of Additional Attendees
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: special_requirements
      label: Special Requirements or Setup Needs
      hint: null
      type: text
      options: []
      required: false
