inputSchema:
  type: object
  properties:
    title: Animation Storyboarding Appointment Form
    pages:
    - id: 1
      name: client_info
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client full name
      hint: Full name for the appointment
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact email
      hint: For appointment confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Contact phone number
      hint: Optional phone for urgent changes
      type: text
      options: []
      required: false
    - id: 5
      name: project_title
      label: Project title
      hint: Short descriptive title for your storyboard project
      type: text
      options: []
      required: true
    - id: 6
      name: project_type
      label: Project type
      hint: Select the closest project type
      type: select_one
      options:
      - Short film
      - Series episode
      - Commercial
      - Music video
      - Other
      required: true
    - id: 7
      name: preferred_date
      label: Preferred appointment date
      hint: Select a date for the storyboarding session
      type: date
      options: []
      required: true
    - id: 8
      name: preferred_time
      label: Preferred appointment time
      hint: Provide a time range if flexible
      type: time
      options: []
      required: false
    - id: 9
      name: brief_description
      label: Brief project description
      hint: Summarize project goals and tone
      type: text
      options: []
      required: false
    - id: 10
      name: file_upload_instructions
      label: File upload instructions
      hint: Provide links to reference materials if any
      type: note
      options: []
      required: false
