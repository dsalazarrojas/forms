inputSchema:
  type: object
  properties:
    title: Calendar Reception Confirmation Form
    pages:
    - id: 1
      name: appointment_header
      label: -- Appointment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: appointment_id
      label: Appointment ID
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: client_info_header
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: appointment_type_header
      label: -- Appointment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: appointment_type
      label: Type of Appointment
      hint: null
      type: select_one
      options:
      - Initial Consultation
      - Follow-up Visit
      - Service Appointment
      - Meeting
      - Other
      required: true
    - id: 11
      name: service_type
      label: Service or Department
      hint: null
      type: select_one
      options:
      - Client Services
      - Sales
      - Support
      - Technical
      - Administrative
      - Other
      required: true
    - id: 12
      name: duration_minutes
      label: Estimated Duration (minutes)
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: confirmation_header
      label: -- Confirmation Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: confirm_attendance
      label: Can You Confirm Your Attendance?
      hint: null
      type: select_one
      options:
      - Yes, confirmed
      - Pending
      - Need to reschedule
      - Cannot attend
      required: true
    - id: 15
      name: reschedule_reason
      label: If Rescheduling - Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: preferred_reschedule_date
      label: Preferred Reschedule Date
      hint: null
      type: date
      options: []
      required: false
    - id: 17
      name: special_header
      label: -- Special Requests --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: special_requirements
      label: Special Requirements or Accessibility Needs
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: arrival_early
      label: Will You Arrive Early?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unsure
      required: false
    - id: 20
      name: additional_guests
      label: Number of Additional Guests
      hint: null
      type: number
      options: []
      required: false
    - id: 21
      name: confirmation_method
      label: Preferred Confirmation Method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Text
      - No preference
      required: true
    - id: 22
      name: confirmation_acceptance
      label: I confirm my attendance at this appointment
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
