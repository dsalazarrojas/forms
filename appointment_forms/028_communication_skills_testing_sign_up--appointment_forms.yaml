inputSchema:
  type: object
  properties:
    title: Communication Skills Testing Sign Up
    pages:
    - id: 1
      name: signup_information
      label: Signup Information
      hint: Register for communication skills testing
      type: note
      options: []
      required: false
    - id: 2
      name: signup_date
      label: Signup Date
      hint: Date of this sign-up
      type: date
      options: []
      required: true
    - id: 3
      name: applicant_information
      label: Applicant Information
      hint: Your personal details
      type: note
      options: []
      required: false
    - id: 4
      name: full_name
      label: Full Name
      hint: Your full legal name
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: Email
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone
      hint: Your phone number
      type: text
      options: []
      required: true
    - id: 7
      name: date_of_birth
      label: Date of Birth
      hint: Your date of birth
      type: date
      options: []
      required: false
    - id: 8
      name: organization_affiliation
      label: Organization Affiliation
      hint: Details about your organization
      type: note
      options: []
      required: false
    - id: 9
      name: organization_name
      label: Organization Name
      hint: Name of your school or organization
      type: text
      options: []
      required: true
    - id: 10
      name: organization_type
      label: Organization Type
      hint: What type of organization
      type: select_one
      options:
      - School
      - University
      - Corporate
      - Government
      - Non-Profit
      - Healthcare
      - Private Practice
      - Other
      required: true
    - id: 11
      name: student_employee_id
      label: Student Employee ID
      hint: Your student or employee ID number
      type: text
      options: []
      required: false
    - id: 12
      name: grade_level
      label: Grade Level
      hint: Current grade or education level
      type: select_one
      options:
      - Elementary
      - Middle School
      - High School
      - Undergraduate
      - Graduate
      - Professional
      - Not Applicable
      required: false
    - id: 13
      name: testing_information
      label: Testing Information
      hint: Details about the testing you need
      type: note
      options: []
      required: false
    - id: 14
      name: test_type
      label: Test Type
      hint: What type of communication testing do you need
      type: select_one
      options:
      - Speech Assessment
      - Language Assessment
      - Social Communication
      - Comprehensive Evaluation
      - Follow-Up Assessment
      - Screening Only
      required: true
    - id: 15
      name: testing_reason
      label: Testing Reason
      hint: Why are you seeking testing
      type: select_one
      options:
      - Academic Concerns
      - Workplace Requirements
      - Personal Development
      - Referral from Professional
      - Previous Diagnosis Update
      - Other
      required: true
    - id: 16
      name: previous_assessment
      label: Previous Assessment
      hint: Have you had communication testing before
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 17
      name: appointment_preferences
      label: Appointment Preferences
      hint: Your scheduling preferences
      type: note
      options: []
      required: false
    - id: 18
      name: preferred_date
      label: Preferred Date
      hint: Your preferred testing date
      type: date
      options: []
      required: true
    - id: 19
      name: preferred_time
      label: Preferred Time
      hint: Your preferred time of day
      type: select_one
      options:
      - Morning (8am-12pm)
      - Afternoon (12pm-5pm)
      - Evening (5pm-8pm)
      - Any Time
      required: true
    - id: 20
      name: alternative_dates
      label: Alternative Dates
      hint: Alternative dates you are available
      type: text
      options: []
      required: false
    - id: 21
      name: location_preference
      label: Location Preference
      hint: Where would you prefer testing
      type: select_one
      options:
      - In-Person at Office
      - In-Person at Organization
      - Remote/Virtual
      - No Preference
      required: true
    - id: 22
      name: special_needs
      label: Special Needs
      hint: Do you require any accommodations
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 23
      name: accommodations_needed
      label: Accommodations Needed
      hint: Describe any accommodations needed
      type: text
      options: []
      required: false
    - id: 24
      name: insurance_information
      label: Insurance Information
      hint: Will you use insurance for testing
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not Sure
      required: false
    - id: 25
      name: referral_source
      label: Referral Source
      hint: Who referred you for testing
      type: text
      options: []
      required: false
    - id: 26
      name: additional_comments
      label: Additional Comments
      hint: Any other information we should know
      type: text
      options: []
      required: false
    - id: 27
      name: consent_to_contact
      label: Consent to Contact
      hint: Do you consent to be contacted about your appointment
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
