inputSchema:
  type: object
  properties:
    title: Lash Extension Service Form
    pages:
    - id: 1
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Eyelashes
      - Lash Extensions
      - Eyeliner
      - Lash Lifting
      - Lash Tints
      - Lash Perms
      required: false
    - id: 2
      name: name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: technician
      label: Lash Technician
      hint: null
      type: select_one
      options:
      - Sarah
      - James
      - Emily
      - David
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: appointment_id
      label: Appointment ID
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: lash_type
      label: Lash Type
      hint: null
      type: select_multiple
      options:
      - Individual Lashes
      - Full Lashes
      - Lash Fills
      - Lash Touch-ups
      - Lash Removal
      - Lash Lift
      - Lash Curling
      - Other
      required: false
