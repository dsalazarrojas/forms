inputSchema:
  type: object
  properties:
    title: Auto Repair Services Lead Generation Form
    pages:
    - id: 1
      name: lead_info_header
      label: -- Customer Lead Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: lead_name
      label: Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: lead_email
      label: Email Address
      hint: For repair quotes and updates
      type: email
      options: []
      required: true
    - id: 4
      name: lead_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: preferred_zip
      label: Preferred Location or Zip Code
      hint: Helps us find the nearest service point
      type: text
      options: []
      required: true
    - id: 6
      name: service_interest_header
      label: -- Service Interest --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: service_category
      label: Service Category
      hint: Select the primary area of concern
      type: select_one
      options:
      - Brakes
      - Engine
      - Transmission
      - Suspension
      - Electrical
      - AC and Heating
      required: true
    - id: 8
      name: problem_description
      label: Briefly describe the problem
      hint: What symptoms is your car showing?
      type: text
      options: []
      required: true
    - id: 9
      name: callback_time
      label: Best Time for Callback
      hint: When should we reach out?
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: true
    - id: 10
      name: referral_source
      label: How did you find us?
      hint: Helps us improve our outreach
      type: select_one
      options:
      - Search Engine
      - Social Media
      - Referral
      - Drive-by
      required: false
    - id: 11
      name: interest_in_financing
      label: Interest in Service Financing
      hint: Would you like to hear about payment plans?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 12
      name: lead_comments
      label: Comments or Special Instructions
      hint: Any other details
      type: text
      options: []
      required: false
