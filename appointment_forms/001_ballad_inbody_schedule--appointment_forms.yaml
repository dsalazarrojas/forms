inputSchema:
  type: object
  properties:
    title: Ballad InBody Schedule
    pages:
    - id: 1
      name: personal_info_header
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Enter your legal first and last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: We will send your appointment confirmation here
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: For appointment reminders and updates
      type: text
      options: []
      required: true
    - id: 5
      name: appointment_details_header
      label: -- Appointment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: preferred_date
      label: Preferred Appointment Date
      hint: Select a date for your scan
      type: date
      options: []
      required: true
    - id: 7
      name: preferred_time
      label: Preferred Time Slot
      hint: Scans are typically scheduled in the morning for best results
      type: select_one
      options:
      - 7:00 AM - 8:00 AM
      - 8:00 AM - 9:00 AM
      - 9:00 AM - 10:00 AM
      - 10:00 AM - 11:00 AM
      - 11:00 AM - 12:00 PM
      required: true
    - id: 8
      name: location
      label: Preferred Clinic Location
      hint: Select the facility nearest to you
      type: select_one
      options:
      - Main Campus Health Center
      - Downtown Wellness Hub
      - Northside Medical Plaza
      required: true
    - id: 9
      name: prep_checklist_header
      label: -- Pre-Scan Preparation --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: fasting_confirmation
      label: Will you be able to fast for 3 hours prior to your scan?
      hint: Avoid food or drink (except water) for at least 3 hours
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 11
      name: caffeine_avoidance
      label: Will you avoid caffeine and alcohol for 24 hours prior?
      hint: These can affect hydration and scan accuracy
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 12
      name: pacemaker_check
      label: Do you have a pacemaker or other electronic medical implant?
      hint: People with these devices should not undergo InBody scans
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 13
      name: additional_notes
      label: Additional Comments or Special Requests
      hint: Any information you would like our staff to know
      type: text
      options: []
      required: false
