inputSchema:
  type: object
  properties:
    title: Recurring Meeting Scheduling Form
    pages:
    - id: 1
      name: schedule_meetings
      label: Schedule Meetings
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: meeting_date
      label: Meeting Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: repeat_frequency
      label: Repeat Frequency
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: meeting_duration
      label: Meeting Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: meeting_recurring_days
      label: Meeting Days
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 8
      name: recurring_until
      label: Recurring Until
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: recurring_time_frequency
      label: Recurring Time Frequency
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: meeting_location
      label: Meeting Location
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: meeting_agenda
      label: Meeting Agenda
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: meeting_note
      label: Meeting Note
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: meeting_organizer
      label: Meeting Organizer
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: meeting_attendees
      label: Meeting Attendees
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Other
      required: true
