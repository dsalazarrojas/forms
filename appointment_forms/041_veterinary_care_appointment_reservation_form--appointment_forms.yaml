inputSchema:
  type: object
  properties:
    title: Veterinary Care Appointment Reservation Form
    pages:
    - id: 1
      name: owner_name
      label: Owner Name
      hint: Enter your name
      type: text
      options: []
      required: false
    - id: 2
      name: owner_email
      label: Owner Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: pet_species
      label: Pet Species
      hint: null
      type: select_one
      options:
      - Dog
      - Cat
      - Bird
      required: false
    - id: 4
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: reason_for_visit
      label: Reason for Visit
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: veterinarian_id
      label: Veterinarian
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: pet_details
      label: Pet Details
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: appointment_duration
      label: Appointment Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
