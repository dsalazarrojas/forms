inputSchema:
  type: object
  properties:
    title: Personal Training Session Plan Form
    pages:
    - id: 1
      name: client_details
      label: Client Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: fitness_goals
      label: Fitness Goals
      hint: null
      type: select_multiple
      options:
      - Weight Loss
      - Fat Loss
      - Muscle Gain
      - Weight Gain
      - Other (please specify)
      required: false
    - id: 3
      name: schedule
      label: Schedule
      hint: Select a date and time
      type: date
      options: []
      required: true
    - id: 4
      name: start_time
      label: Start Time
      hint: Select a start time
      type: time
      options: []
      required: true
    - id: 5
      name: duration
      label: Session Duration
      hint: Session duration in minutes
      type: number
      options: []
      required: true
    - id: 6
      name: trainer_details
      label: Trainer Details
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: note
      label: Additional Info
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: confirmation
      label: Confirmation
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
