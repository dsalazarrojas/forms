inputSchema:
  type: object
  properties:
    title: Tailoring Appointment Form
    pages:
    - id: 1
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: tailor_name
      label: Tailor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: appointment_notes
      label: Appointment Notes
      hint: Notes about the appointment
      type: note
      options: []
      required: false
    - id: 8
      name: tailor_message
      label: Message to Customer
      hint: Message to be sent to the customer
      type: text
      options: []
      required: false
    - id: 9
      name: customer_message
      label: Message from Customer
      hint: Message from the customer
      type: text
      options: []
      required: false
    - id: 10
      name: appointment_type
      label: Appointment Type
      hint: Type of appointment
      type: select_one
      options:
      - Custom Fit
      - Alteration
      - Dry Cleaning
      - Tailoring
      - Alteration Services
      - Repair Services
      - Other
      required: false
    - id: 11
      name: customer_address
      label: Customer Address
      hint: Address of the customer
      type: text
      options: []
      required: false
