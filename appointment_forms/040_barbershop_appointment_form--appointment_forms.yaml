inputSchema:
  type: object
  properties:
    title: Barbershop Appointment Form
    pages:
    - id: 1
      name: client_info_header
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: For SMS appointment reminders
      type: text
      options: []
      required: true
    - id: 6
      name: service_selection_header
      label: -- Service Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: primary_service
      label: Choose Your Main Service
      hint: null
      type: select_one
      options:
      - Men's Cut and Style
      - Haircut and Shave Package
      - Beard Sculpting and Line-up
      - Kid's Haircut (Ages 2-12)
      - Senior Haircut (65+)
      required: true
    - id: 8
      name: additional_services
      label: Add-on Services
      hint: Optional
      type: select_multiple
      options:
      - Shampoo and Conditioning
      - Nose and Ear Waxing
      - Gray Coverage Treatment
      - Scalp Massage
      required: false
    - id: 9
      name: staff_preference
      label: Select a Professional Barber
      hint: null
      type: select_one
      options:
      - No Preference (First Available)
      - James - Master Barber
      - Elena - Fades Specialist
      - Ryan - Beard Expert
      required: true
    - id: 10
      name: schedule_header
      label: -- Appointment Schedule --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: appointment_date
      label: Preferred Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: appointment_time
      label: Preferred Time
      hint: null
      type: time
      options: []
      required: true
    - id: 13
      name: alternate_date
      label: Alternate Date (If preferred is unavailable)
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: policy_header
      label: -- Terms and Conditions --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: cancellation_policy
      label: I agree to the cancellation policy
      hint: Please cancel at least 24 hours in advance to avoid a no-show fee
      type: select_one
      options:
      - I Agree
      - Other
      required: true
    - id: 16
      name: data_privacy
      label: I consent to my data being stored for booking purposes
      hint: null
      type: select_one
      options:
      - I Consent
      - Other
      required: true
    - id: 17
      name: comments
      label: Any special notes for your barber?
      hint: e.g., "Coming from work, might be 5 mins late"
      type: text
      options: []
      required: false
    - id: 18
      name: submission_timestamp
      label: Booking Date
      hint: null
      type: date
      options: []
      required: true
