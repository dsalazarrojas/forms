inputSchema:
  type: object
  properties:
    title: Veterinarian Appointment Form
    pages:
    - id: 1
      name: pet_info
      label: pet info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: visit_date
      label: Visit Date
      hint: Select a date
      type: date
      options: []
      required: false
    - id: 3
      name: visit_time
      label: Visit Time
      hint: Select a time
      type: time
      options: []
      required: false
    - id: 4
      name: pet_name
      label: Pet Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: pet_age
      label: Pet Age
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: pet_breed
      label: Pet Breed
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: owner_name
      label: Owner Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: owner_contact
      label: Owner Contact
      hint: Phone number or email
      type: text
      options: []
      required: false
    - id: 9
      name: note
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: confirm_visit
      label: Confirm Visit
      hint: null
      type: select_multiple
      options:
      - Pet has been confirmed to visit the clinic.
      - We will send a reminder 24 hours before the visit.
      - The pet will be picked up within 30 minutes of the visit.
      - All of the above.
      required: false
