inputSchema:
  type: object
  properties:
    title: Video Consultation Appointment Form
    pages:
    - id: 1
      name: client_info
      label: Client Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: preferred_time
      label: Preferred Time
      hint: null
      type: select_multiple
      options:
      - 09:00-10:00
      - 10:00-11:00
      - 11:00-12:00
      - 14:00-15:00
      - 15:00-16:00
      required: false
    - id: 3
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: service_provider
      label: Service Provider
      hint: null
      type: select_one
      options:
      - 1 - Service Provider 1
      - 2 - Service Provider 2
      - 3 - Service Provider 3
      required: false
    - id: 5
      name: preferred_language
      label: Preferred Language
      hint: null
      type: select_one
      options:
      - English
      - French
      - Spanish
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
