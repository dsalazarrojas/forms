inputSchema:
  type: object
  properties:
    title: Focus Group Appointment Form
    pages:
    - id: 1
      name: schedule_page
      label: Schedule
      hint: Schedule your focus group sessions
      type: select_multiple
      options:
      - 08:00-12:00
      - 13:00-17:00
      - 17:00-20:00
      required: false
    - id: 2
      name: time_slot
      label: Time Slot
      hint: Select a time slot
      type: select_one
      options:
      - 08:00-12:00
      - 13:00-17:00
      - 17:00-20:00
      required: false
    - id: 3
      name: session_duration
      label: Session Duration
      hint: How long will the session last?
      type: select_one
      options:
      - 30 minutes
      - 60 minutes
      - 120 minutes
      required: false
