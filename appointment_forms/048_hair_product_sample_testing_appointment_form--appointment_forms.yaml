inputSchema:
  type: object
  properties:
    title: Hair Product Sample Testing Appointment Form
    pages:
    - id: 1
      name: form_1
      label: Sample Testing
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: form_2
      label: Hair Details
      hint: null
      type: select_one
      options:
      - Sample Type
      - Hair Type
      - Product Type
      required: true
    - id: 3
      name: form_3
      label: Tester Info
      hint: null
      type: select_one
      options:
      - Tester
      - Tester Name
      - Tester Phone
      required: true
    - id: 4
      name: form_4
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: form_5
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: form_6
      label: Salon Info
      hint: null
      type: select_multiple
      options:
      - Location
      - Staff
      required: true
    - id: 7
      name: form_7
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: form_8
      label: Confirmation
      hint: null
      type: select_one
      options:
      - Confirmed
      - Not Confirmed
      required: true
    - id: 9
      name: form_9
      label: Comments
      hint: null
      type: text
      options: []
      required: false
