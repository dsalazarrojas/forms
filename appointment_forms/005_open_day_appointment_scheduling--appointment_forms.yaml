inputSchema:
  type: object
  properties:
    title: Open Day Appointment Scheduling
    pages:
    - id: 1
      name: schedule_form
      label: Schedule A Visit
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: visitor_details
      label: Visitor Information
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      required: false
    - id: 3
      name: time_slot
      label: Select A Time Slot
      hint: null
      type: select_multiple
      options:
      - 9:00 am - 10:00 am
      - 10:00 am - 11:00 am
      - 11:00 am - 12:00 pm
      required: false
    - id: 4
      name: campus_visit
      label: Visit Campus
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: booking_status
      label: Booking Status
      hint: null
      type: select_one
      options:
      - Available
      - Not Available
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: submit_form
      label: Submit
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
