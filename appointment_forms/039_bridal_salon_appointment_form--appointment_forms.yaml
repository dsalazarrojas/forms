inputSchema:
  type: object
  properties:
    title: Bridal Salon Appointment Form
    pages:
    - id: 1
      name: customer_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: Your contact email
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Your contact phone
      type: text
      options: []
      required: true
    - id: 4
      name: appointment_type
      label: Type of Appointment
      hint: What are you looking for
      type: select_one
      options:
      - Bridal gown shopping
      - Bridesmaid dress shopping
      - Alterations consultation
      - Try-on appointment
      - Wedding day fitting
      - Mother of bride dress
      - Prom dress shopping
      - Other
      required: true
    - id: 5
      name: wedding_date
      label: Wedding Date
      hint: Date of your wedding
      type: date
      options: []
      required: true
    - id: 6
      name: event_date
      label: Event Date if Different
      hint: If not a wedding
      type: date
      options: []
      required: false
    - id: 7
      name: preferred_date
      label: Preferred Appointment Date
      hint: What date works best
      type: date
      options: []
      required: true
    - id: 8
      name: appointment_time
      label: Preferred Appointment Time
      hint: Time slot you prefer
      type: select_one
      options:
      - 9 AM - 10 AM
      - 10 AM - 11 AM
      - 11 AM - 12 PM
      - 12 PM - 1 PM
      - 1 PM - 2 PM
      - 2 PM - 3 PM
      - 3 PM - 4 PM
      - 4 PM - 5 PM
      required: true
    - id: 9
      name: appointment_duration
      label: Appointment Length Needed
      hint: How long do you need
      type: select_one
      options:
      - 30 minutes
      - 1 hour
      - 1.5 hours
      - 2 hours
      - 2.5 hours
      - 3+ hours
      required: true
    - id: 10
      name: dress_style_preference
      label: Dress Style Preference
      hint: What style appeals to you
      type: select_multiple
      options:
      - Ball gown
      - A-line
      - Mermaid
      - Empire waist
      - Sheath
      - Tea length
      - Illusion neckline
      - Sleeveless
      required: false
    - id: 11
      name: dress_color
      label: Preferred Dress Color
      hint: What color are you considering
      type: select_one
      options:
      - Pure white
      - Ivory
      - Champagne
      - Blush
      - Off-white
      - No preference yet
      - Other
      required: false
    - id: 12
      name: budget_range
      label: Budget Range
      hint: Your estimated budget
      type: select_one
      options:
      - Under 500
      - 500 - 1000
      - 1000 - 1500
      - 1500 - 2000
      - 2000 - 3000
      - 3000+
      - Flexible
      required: false
    - id: 13
      name: size_range
      label: Your Size Range
      hint: Approximate dress size
      type: select_one
      options:
      - XS (0-2)
      - S (4-6)
      - M (8-10)
      - L (12-14)
      - XL (16-18)
      - 1X
      - 2X
      - 3X+
      - Unsure
      required: false
    - id: 14
      name: attendants_count
      label: Number of Attendants Shopping
      hint: How many dress with you
      type: number
      options: []
      required: false
    - id: 15
      name: party_coming
      label: Who Is Coming With You
      hint: Mother, bridesmaids, friend
      type: select_multiple
      options:
      - Mother
      - Best friend
      - Sister
      - Bridesmaids
      - Spouse to be
      - Other family
      - Other friends
      - Coming alone
      required: false
    - id: 16
      name: previous_salon_visit
      label: Have You Visited Our Salon Before
      hint: First time or returning
      type: select_one
      options:
      - First time
      - Yes, once or twice
      - Regular customer
      - No, but referred
      required: false
    - id: 17
      name: body_type_preference
      label: Body Type Considerations
      hint: Any specific body concerns
      type: text
      options: []
      required: false
    - id: 18
      name: alterations_expected
      label: Do You Expect to Need Alterations
      hint: Plan for alterations
      type: select_one
      options:
      - Yes, definitely
      - Probably
      - Maybe
      - Probably not
      - No alterations needed
      required: false
    - id: 19
      name: designer_preferences
      label: Designer or Brand Preferences
      hint: Any specific designers
      type: text
      options: []
      required: false
    - id: 20
      name: special_requests
      label: Special Requests or Notes
      hint: Any additional information
      type: text
      options: []
      required: false
    - id: 21
      name: permission_contact
      label: May we contact you with updates
      hint: Appointment reminders and info
      type: select_one
      options:
      - Yes, via email
      - Yes, via phone
      - Yes, via text
      - No contact
      required: true
