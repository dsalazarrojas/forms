inputSchema:
  type: object
  properties:
    title: Construction Consultation Appointment Form
    pages:
    - id: 1
      name: section_client_contact
      label: -- Client Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: We'll send appointment confirmation here
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: Format - (555) 555-5555
      type: text
      options: []
      required: true
    - id: 5
      name: section_appointment_details
      label: -- Appointment Scheduling --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: preferred_date
      label: Preferred Consultation Date
      hint: Select a date that works best for you
      type: date
      options: []
      required: true
    - id: 7
      name: preferred_time
      label: Preferred Consultation Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: consultation_type
      label: Type of Consultation
      hint: What kind of project are we discussing?
      type: select_one
      options:
      - New Construction
      - Home Renovation
      - Commercial Fit-out
      - Structural Assessment
      - Land Development
      required: true
    - id: 9
      name: section_project_overview
      label: -- Project Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: project_location
      label: Project Site Address
      hint: Where will the work take place?
      type: text
      options: []
      required: true
    - id: 11
      name: estimated_budget
      label: Estimated Project Budget ($)
      hint: Provide a rough estimate of your total budget
      type: number
      options: []
      required: false
    - id: 12
      name: urgency_level
      label: How soon do you plan to start?
      hint: null
      type: select_one
      options:
      - Immediately
      - Within 1-3 Months
      - Within 3-6 Months
      - Planning Phase (6+ Months)
      required: true
    - id: 13
      name: project_description
      label: Brief Project Description
      hint: Tell us about what you have in mind
      type: text
      options: []
      required: true
    - id: 14
      name: referral_source
      label: How did you hear about us?
      hint: null
      type: select_one
      options:
      - Website
      - Social Media
      - Referral
      - Advertisement
      - Other
      required: false
    - id: 15
      name: additional_comments
      label: Additional Comments or Questions
      hint: null
      type: text
      options: []
      required: false
