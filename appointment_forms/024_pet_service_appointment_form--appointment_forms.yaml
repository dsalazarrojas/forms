      name: pet_information
      label: Client Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: pet_type
      label: Pet Type
      hint: null
      type: select_one
      options:
      - Cat
      - Dog
      - Bird
      - Fish
      required: false
    - id: 3
      name: pet_name
      label: Pet Name
      hint: null
      type: text
      options: []
