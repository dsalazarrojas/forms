inputSchema:
  type: object
  properties:
    title: Hair Specialist Review Appointment Form
    pages:
    - id: 1
      name: client_details
      label: Client Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: visit_reasons
      label: Visit Reasons
      hint: null
      type: select_one
      options:
      - Hair Loss
      - Scalp Condition
      - Hair Color
      - Other
      required: false
    - id: 3
      name: visit_date
      label: Visit Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: visit_time
      label: Visit Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: follow_up_details
      label: Follow Up Details
      hint: null
      type: text
      options: []
      required: false
