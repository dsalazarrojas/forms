inputSchema:
  type: object
  properties:
    title: Beauty Team Expansion Appointment Form
    pages:
    - id: 1
      name: section_candidate_info
      label: -- Candidate Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: section_recruitment_details
      label: -- Recruitment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: position_of_interest
      label: Position of Interest
      hint: null
      type: select_one
      options:
      - Senior Stylist
      - Junior Stylist
      - Salon Assistant
      - Esthetician
      - Nail Artist
      - Salon Coordinator
      required: true
    - id: 7
      name: years_of_experience
      label: Years of Experience in the Beauty Industry
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: current_employment_status
      label: Current Employment Status
      hint: null
      type: select_one
      options:
      - Currently Employed
      - Self-Employed / Booth Renter
      - Not Currently Working
      - Student / Recent Graduate
      required: true
    - id: 9
      name: section_scheduling
      label: -- Interview Scheduling --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: preferred_interview_date
      label: Preferred Interview Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: preferred_time_range
      label: Preferred Time Range
      hint: null
      type: select_multiple
      options:
      - Early Morning (8AM - 10AM)
      - Late Morning (10AM - 12PM)
      - Early Afternoon (12PM - 2PM)
      - Late Afternoon (2PM - 5PM)
      required: true
    - id: 12
      name: interview_format
      label: Preferred Interview Format
      hint: null
      type: select_one
      options:
      - In-Person (at Salon)
      - Video Call (Google Meet/Zoom)
      - Phone Interview
      required: true
    - id: 13
      name: portfolio_link
      label: Link to Portfolio or Work Samples
      hint: e.g. Instagram handle or Website
      type: text
      options: []
      required: false
    - id: 14
      name: section_consent
      label: -- Acknowledgment --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: data_processing_consent
      label: I consent to my data being processed for recruitment purposes
      hint: null
      type: select_one
      options:
      - I Consent
      - Other
      required: true
    - id: 16
      name: application_date
      label: Date of Submission
      hint: null
      type: date
      options: []
      required: true
