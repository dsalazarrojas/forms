inputSchema:
  type: object
  properties:
    title: Car Detailing Appointment Form
    pages:
    - id: 1
      name: service_header
      label: -- Service Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: service_type
      label: Type of Detailing Service
      hint: Select the service package you need
      type: select_one
      options:
      - Exterior Wash Only
      - Interior Detailing Only
      - Standard Full Detail
      - Premium Full Detail
      - Clay Bar & Wax Treatment
      - Ceramic Coating Application
      required: true
    - id: 3
      name: detailing_package_price
      label: Package Price Estimate
      hint: (Select your package to see the price estimate)
      type: number
      options: []
      required: false
    - id: 4
      name: vehicle_info_header
      label: -- Vehicle Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: vehicle_make_model
      label: Car Make and Model
      hint: Describe your car
      type: text
      options: []
      required: true
    - id: 6
      name: vehicle_year_detailing
      label: Vehicle Year
      hint: Year of manufacture
      type: number
      options: []
      required: true
    - id: 7
      name: vehicle_vin_detailing
      label: Vehicle Identification Number (VIN)
      hint: 17-character VIN code
      type: text
      options: []
      required: false
    - id: 8
      name: vehicle_condition
      label: Vehicle Condition
      hint: Rate your vehicle's current condition
      type: select_one
      options:
      - Clean
      - Normal Use
      - Dirty
      - Extremely Dirty
      required: true
    - id: 9
      name: vehicle_type_detailing
      label: Vehicle Type
      hint: Select the type of vehicle
      type: select_one
      options:
      - Sedan
      - SUV
      - Truck
      - Coupe
      - Motorcycle
      required: true
    - id: 10
      name: contact_info_header
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: customer_name_detailing
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 12
      name: customer_email_detailing
      label: Email Address
      hint: To confirm your appointment
      type: email
      options: []
      required: true
    - id: 13
      name: customer_phone_detailing
      label: Phone Number
      hint: For appointment reminders
      type: text
      options: []
      required: true
    - id: 14
      name: appointment_date_detailing
      label: Appointment Date
      hint: Select your preferred date
      type: date
      options: []
      required: true
    - id: 15
      name: appointment_time_detailing
      label: Appointment Time
      hint: Select your preferred time
      type: time
      options: []
      required: true
    - id: 16
      name: signature_confirmation_detailing
      label: Type your name for appointment confirmation
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: additional_detailing_requests
      label: Any additional requests or instructions?
      hint: Provide more details for the service
      type: text
      options: []
      required: false
