inputSchema:
  type: object
  properties:
    title: Nail Salon Appointment Form
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: First name is required
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last name
      hint: Last name is required
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: A valid email address is required
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: preferred_time_slot
      label: Preferred time slot
      hint: Please choose a time slot
      type: select_one
      options:
      - 8:00 AM - 9:00 AM
      - 9:00 AM - 10:00 AM
      - 10:00 AM - 11:00 AM
      - 11:00 AM - 12:00 PM
      - 12:00 PM - 1:00 PM
      - 1:00 PM - 2:00 PM
      - 2:00 PM - 3:00 PM
      - 3:00 PM - 4:00 PM
      - 4:00 PM - 5:00 PM
      - 5:00 PM - 6:00 PM
      required: true
    - id: 6
      name: desired_services
      label: Desired services
      hint: Select one or more services
      type: select_multiple
      options:
      - manicure
      - pedicure
      - massage
      - nail art
      - acrylic
      - gel
      - dipping
      required: true
    - id: 7
      name: appointment_date
      label: Appointment date
      hint: Select a date
      type: date
      options: []
      required: true
    - id: 8
      name: appointment_time
      label: Appointment time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: appointment_comments
      label: Additional comments
      hint: Any additional comments
      type: text
      options: []
      required: false
    - id: 10
      name: confirm_appointment
      label: Confirm appointment
      hint: null
      type: note
      options: []
      required: true
    - id: 11
      name: confirm_phone
      label: Confirm phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: confirm_email
      label: Confirm email
      hint: null
      type: email
      options: []
      required: false
