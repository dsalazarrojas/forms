inputSchema:
  type: object
  properties:
    title: virtual_fitness_consultation_appointment_form
    pages:
    - id: 1
      name: appointment_details
      label: Appointment Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: appointment_type
      label: Appointment Type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: appointment_location
      label: Appointment Location
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: fitness_professional
      label: Fitness Professional
      hint: null
      type: select_one
      options:
      - '{''name'': ''Personal Trainer''}'
      - Group Fitness Instructor
      - Physical Therapist
      required: true
    - id: 7
      name: appointment_notes
      label: Appointment Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: client_message
      label: Message
      hint: null
      type: text
      options: []
      required: false
