inputSchema:
  type: object
  properties:
    title: Car Showroom Visit Appointment Form
    pages:
    - id: 1
      name: visitor_name
      label: Your name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: visitor_email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: visitor_phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: preferred_date
      label: Preferred visit date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: preferred_time
      label: Preferred visit time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: time_flexibility
      label: How flexible is your time?
      hint: null
      type: select_one
      options:
      - Very Flexible
      - Flexible
      - Not Very Flexible
      required: false
    - id: 7
      name: vehicle_interest
      label: Which vehicles are you interested in?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: vehicle_type
      label: Preferred vehicle type
      hint: null
      type: select_one
      options:
      - Sedan
      - SUV
      - Truck
      - Coupe
      - Convertible
      - Wagon
      - Van
      - Hybrid
      - Electric
      required: true
    - id: 9
      name: budget_range
      label: Budget range
      hint: null
      type: select_one
      options:
      - Under 15000
      - 15000-30000
      - 30000-50000
      - 50000-75000
      - 75000+
      - Flexible
      required: false
    - id: 10
      name: trade_in_vehicle
      label: Do you have a vehicle to trade in?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Sure
      required: false
    - id: 11
      name: financing_interest
      label: Interested in financing options?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Need More Info
      required: false
    - id: 12
      name: salesperson_preference
      label: Salesperson preference
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: new_or_used
      label: New or used vehicle?
      hint: null
      type: select_one
      options:
      - New Only
      - Used Only
      - Both
      required: true
    - id: 14
      name: specific_models
      label: Specific models you want to see
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: features_important
      label: Most important features (select up to 3)
      hint: null
      type: select_multiple
      options:
      - Fuel Efficiency
      - Performance
      - Safety Features
      - Interior Comfort
      - Technology
      - Appearance
      - Reliability
      - Price
      required: false
    - id: 16
      name: test_drive_interest
      label: Interested in a test drive?
      hint: null
      type: select_one
      options:
      - 'True'
      - Maybe
      - 'False'
      required: false
    - id: 17
      name: test_drive_vehicles
      label: Which vehicles to test drive?
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: appointment_reason
      label: Reason for visit
      hint: null
      type: select_one
      options:
      - Just Looking
      - Ready to Buy
      - Upgrading Current Vehicle
      - First Time Buyer
      - Lease Consideration
      - Other
      required: true
    - id: 19
      name: contact_preference
      label: Preferred contact method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Text Message
      - Either
      required: false
    - id: 20
      name: group_size
      label: How many people will be visiting?
      hint: null
      type: number
      options: []
      required: false
    - id: 21
      name: special_requests
      label: Special requests or needs
      hint: Accessibility, family-friendly, etc.
      type: text
      options: []
      required: false
    - id: 22
      name: previous_customer
      label: Have you visited our showroom before?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - First Time
      required: false
    - id: 23
      name: vehicle_emergency
      label: Is this a vehicle emergency/urgent need?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 24
      name: referral_source
      label: How did you hear about us?
      hint: null
      type: select_one
      options:
      - Web Search
      - Social Media
      - Friend Recommendation
      - Advertisement
      - Review Site
      - Previous Purchase
      - Other
      required: false
    - id: 25
      name: additional_information
      label: Any additional information or questions?
      hint: null
      type: text
      options: []
      required: false
