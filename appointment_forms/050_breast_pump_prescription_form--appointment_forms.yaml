inputSchema:
  type: object
  properties:
    title: Breast Pump Prescription Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Full Name
      hint: Full legal name of patient
      type: text
      options: []
      required: true
    - id: 2
      name: patient_dob
      label: Patient Date of Birth
      hint: Patient date of birth
      type: date
      options: []
      required: true
    - id: 3
      name: patient_address
      label: Patient Address
      hint: Full home address
      type: text
      options: []
      required: true
    - id: 4
      name: patient_phone
      label: Patient Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: patient_email
      label: Patient Email
      hint: Email address
      type: email
      options: []
      required: true
    - id: 6
      name: insurance_provider
      label: Insurance Provider
      hint: Name of insurance company
      type: text
      options: []
      required: true
    - id: 7
      name: insurance_member_id
      label: Member ID
      hint: Insurance member ID number
      type: text
      options: []
      required: true
    - id: 8
      name: prescription_date
      label: Prescription Date
      hint: Date of prescription
      type: date
      options: []
      required: true
    - id: 9
      name: physician_name
      label: Physician Name
      hint: Prescribing physician
      type: text
      options: []
      required: true
    - id: 10
      name: physician_npi
      label: Physician NPI Number
      hint: National Provider Identifier
      type: text
      options: []
      required: true
    - id: 11
      name: physician_phone
      label: Physician Phone
      hint: Doctor contact number
      type: text
      options: []
      required: true
    - id: 12
      name: physician_fax
      label: Physician Fax
      hint: Doctor fax number
      type: text
      options: []
      required: false
    - id: 13
      name: physician_address
      label: Physician Address
      hint: Medical practice address
      type: text
      options: []
      required: true
    - id: 14
      name: medical_necessity
      label: Medical Necessity
      hint: Reason for breast pump prescription
      type: select_one
      options:
      - Postpartum Breastfeeding Support
      - Return to Work
      - Low Milk Supply
      - Infant Feeding Difficulty
      - Maternal Separation
      - Multiple Births
      - Premature Infant
      - Other Medical Reason
      required: true
    - id: 15
      name: medical_necessity_details
      label: Medical Necessity Details
      hint: Please elaborate on medical need
      type: text
      options: []
      required: true
    - id: 16
      name: pump_type_prescribed
      label: Breast Pump Type Prescribed
      hint: Type of pump being prescribed
      type: select_one
      options:
      - Electric Double Breast Pump
      - Manual Breast Pump
      - Battery Operated Pump
      - Hospital Grade Rental
      - Wearable Pump
      required: true
    - id: 17
      name: pump_frequency
      label: Expected Pumping Frequency
      hint: How often will patient pump
      type: select_one
      options:
      - 1-3 Times Daily
      - 4-6 Times Daily
      - 7-10 Times Daily
      - As Needed
      required: true
    - id: 18
      name: duration_of_need
      label: Duration of Need
      hint: How long is pump needed
      type: select_one
      options:
      - 1-3 Months
      - 3-6 Months
      - 6-12 Months
      - Ongoing
      required: true
    - id: 19
      name: accessories_prescribed
      label: Accessories Prescribed
      hint: Select prescribed accessories
      type: select_multiple
      options:
      - Pumping Flanges
      - Milk Storage Bottles
      - Milk Storage Bags
      - Tubing and Connectors
      - Carrying Case
      - Cleaning Supplies
      - Nursing Bras
      - None
      required: true
    - id: 20
      name: flange_size_mm
      label: Flange Size in Millimeters
      hint: If known
      type: text
      options: []
      required: false
    - id: 21
      name: contraindications
      label: Contraindications
      hint: Any contraindications to note
      type: text
      options: []
      required: false
    - id: 22
      name: special_instructions
      label: Special Instructions
      hint: Any special instructions
      type: text
      options: []
      required: false
    - id: 23
      name: physician_signature
      label: Physician Signature
      hint: Type physician full name
      type: text
      options: []
      required: true
    - id: 24
      name: signature_date
      label: Signature Date
      hint: Date of signature
      type: date
      options: []
      required: true
    - id: 25
      name: dea_number
      label: DEA Number
      hint: If applicable
      type: text
      options: []
      required: false
