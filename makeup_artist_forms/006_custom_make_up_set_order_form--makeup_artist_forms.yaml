inputSchema:
  type: object
  properties:
    title: Custom Make Up Set Order Form
    pages:
    - id: 1
      name: category
      label: Category
      hint: null
      type: select_multiple
      options:
      - eyeshadow
      - face
      required: true
    - id: 2
      name: foundation_color_family
      label: Foundation Color Family
      hint: null
      type: select_one
      options:
      - neutral
      - warm
      - cool
      required: false
    - id: 3
      name: eyeshadow_type
      label: Eyeshadow Type
      hint: null
      type: select_one
      options:
      - matte
      - metallic
      - duo
      required: false
    - id: 4
      name: lip_balm_flavor
      label: Lip Balm Flavor
      hint: null
      type: select_one
      options:
      - vanilla
      - strawberry
      - blueberry
      required: false
    - id: 5
      name: special_requests
      label: Special Requests
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: form_submission_time
      label: Submission Time
      hint: null
      type: select_one
      options:
      - morning
      - afternoon
      required: true
    - id: 7
      name: form_submission_day
      label: Submission Day
      hint: null
      type: select_one
      options:
      - monday
      - saturday
      required: false
    - id: 8
      name: form_submission_days
      label: Submission Days
      hint: null
      type: select_multiple
      options:
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
      - sunday
      required: false
    - id: 9
      name: free_samples
      label: Free Samples
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: form_submission_date
      label: Submission Date
      hint: null
      type: select_one
      options:
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
      - sunday
      - next
      required: true
    - id: 11
      name: form_submission
      label: Submission
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: form_submission_2
      label: Form Submission 2
      hint: null
      type: select_one
      options:
      - submit
      - cancel
      required: false
