      - Label 2
      - Label 3
      required: false
    - id: 5
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: desired_makeup_look
      label: Desired Makeup Look
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 7
      name: procedure_time
      label: Procedure Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: desired_services
      label: Desired Services
      hint: null
      type: select_one
      options:
      - Service 1
      - Service 2
      - Service 3
      required: false
