inputSchema:
  type: object
  properties:
    title: Makeup Pre Procedure Questionnaire
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: preferred_makeup_type
      label: Preferred Makeup Type
      hint: null
