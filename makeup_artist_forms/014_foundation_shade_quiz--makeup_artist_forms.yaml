inputSchema:
  type: object
  properties:
    title: Foundation Shade Quiz
    pages:
    - id: 1
      name: foundation_shade_quiz_form
      label: foundation_shade_quiz_form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: skin_tone
      label: skin_tone
      hint: null
      type: select_one
      options:
      - pale
      - fair
      - light
      - medium
      - tan
      - olive
      - dark
      - very dark
      required: false
    - id: 3
      name: skin_type
      label: skin_type
      hint: null
      type: select_one
      options:
      - normal
      - oily
      - dry
      - combination
      - sensitive
      required: false
    - id: 4
      name: undertone
      label: undertone
      hint: null
      type: select_one
      options:
      - pink
      - yellow
      - neutral
      - gold
      - blue
      required: false
    - id: 5
      name: foundation_shade
      label: foundation_shade
      hint: null
      type: select_multiple
      options:
      - light
      - medium
      - tan
      - dark
      required: false
    - id: 6
      name: skin_condition
      label: skin_condition
      hint: Please select the skin condition that best describes you
      type: select_one
      options:
      - normal
      - sensitive
      - eczema
      - acne
      - rosacea
      required: false
    - id: 7
      name: preferred_foundation_shade
      label: preferred_foundation_shade
      hint: null
      type: select_multiple
      options:
      - fair
      - light
      - medium
      - tan
      - dark
      required: false
    - id: 8
      name: preferred_foundation_tone
      label: preferred_foundation_tone
      hint: What do you like about your preferred foundation tone?
      type: select_multiple
      options:
      - cool
      - warm
      - neutral
      required: false
    - id: 9
      name: preferred_foundation_finish
      label: preferred_foundation_finish
      hint: How would you describe the finish of your preferred foundation?
      type: select_one
      options:
      - matte
      - satin
      - satin finish
      - creamy
      - gel
      required: false
