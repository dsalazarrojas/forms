inputSchema:
  type: object
  properties:
    title: Permanent Makeup Release Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: photo_release
      label: Photo Release
      hint: null
      type: select_one
      options:
      - I give my consent to take photos and/or videos.
      - I do not give my consent to take photos and/or videos.
      required: true
    - id: 8
      name: signature_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: true
    - id: 10
      name: photo_release_signature
      label: Photo Release Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: photo_release_signature_date
      label: Photo Release Signature Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: photo_release_signature_signature
      label: Photo Release Signature
      hint: null
      type: note
      options: []
      required: false
