inputSchema:
  type: object
  properties:
    title: Taproom Order Form
    pages:
    - id: 1
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: time
      label: time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: customer_name
      label: customer_name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone_number
      label: phone_number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: order_details
      label: order_details
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: payment_method
      label: payment_method
      hint: null
      type: select_one
      options:
      - cash
      - card
      - bank transfer
      - other
      required: true
    - id: 8
      name: order_total
      label: order_total
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: items
      label: items
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: total
      label: total
      hint: null
      type: number
      options: []
      required: false
