inputSchema:
  type: object
  properties:
    title: Curbside Pickup Order Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Card
      - Other
      required: false
    - id: 4
      name: order_date
      label: Order Date
      hint: mm/dd/yyyy
      type: date
      options: []
      required: false
    - id: 5
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
