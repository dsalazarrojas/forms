inputSchema:
  type: object
  properties:
    title: Bartender Opening Checklist
    pages:
    - id: 1
      name: section_header_1
      label: -- Shift Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: opening_date
      label: Opening date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: bartender_name
      label: Bartender name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: opening_time
      label: Opening time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: section_header_2
      label: -- Equipment Inspection --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: bar_setup
      label: Bar properly set up and organized
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Issues Found
      required: true
    - id: 7
      name: ice_stocked
      label: Ice machine stocked and functioning
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Issues Found
      required: true
    - id: 8
      name: glassware_ready
      label: Glassware clean and ready for service
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Partial
      required: true
    - id: 9
      name: section_header_3
      label: -- Inventory Verification --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: liquor_check
      label: All liquor bottles present and accounted for
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Discrepancy
      required: true
    - id: 11
      name: liquor_notes
      label: Any discrepancies or missing bottles?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: mixers_stocked
      label: Mixers and juices properly stocked
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Low Stock
      required: true
    - id: 13
      name: garnishes_ready
      label: Garnishes prepared and fresh
      hint: Limes, lemons, olives, etc
      type: select_one
      options:
      - 'True'
      - 'False'
      - Needs Refresh
      required: true
    - id: 14
      name: section_header_4
      label: -- Supplies and Tools --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: bar_tools
      label: All bar tools present and clean
      hint: Shakers, jiggers, strainers, etc
      type: select_one
      options:
      - 'True'
      - 'False'
      - Missing Items
      required: true
    - id: 16
      name: bar_towels
      label: Clean bar towels available
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Low Supply
      required: true
    - id: 17
      name: section_header_5
      label: -- Registration and Systems --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: pos_system
      label: POS system tested and functional
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Issues
      required: true
    - id: 19
      name: register_opened
      label: Cash register opened with starting amount
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 20
      name: starting_cash
      label: Starting cash amount documented
      hint: null
      type: number
      options: []
      required: false
    - id: 21
      name: section_header_6
      label: -- Manager Communication --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: manager_notes
      label: Any issues or notes from previous shift?
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: checklist_verified
      label: I confirm all opening items have been completed
      hint: null
      type: select_one
      options:
      - I Confirm
      - Needs Review
      required: true
