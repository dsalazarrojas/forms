inputSchema:
  type: object
  properties:
    title: Drive Thru Meal Order Form
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: order_beverages
      label: Order Beverages
      hint: null
      type: select_one
      options:
      - Water
      - Soda
      - Juice
      - Coffee
      - Tea
      required: true
    - id: 3
      name: order_side_sauce
      label: Order Side Sauce
      hint: Choose one or more
      type: select_multiple
      options:
      - Ketchup
      - Mustard
      - Hot Sauce
      - None
      required: true
    - id: 4
      name: order_entr_e
      label: Order Entrée
      hint: Choose one or more
      type: select_multiple
      options:
      - Burger
      - Fries
      - Salad
      - Chicken
      - Combo
      required: true
    - id: 5
      name: order_toppings
      label: Order Toppings
      hint: Choose one or more
      type: select_multiple
      options:
      - Cheese
      - Pickles
      - Onions
      - Tomatoes
      - Mayo
      - Ketchup
      - Mustard
      required: true
    - id: 6
      name: order_payment_method
      label: Order Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - Debit Card
      required: false
    - id: 7
      name: order_comment
      label: Order Comment
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: order_confirmation
      label: Order Confirmation
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: order_status
      label: Order Status
      hint: null
      type: select_one
      options:
      - Pending
      - In Progress
      - Complete
      - Cancelled
      required: true
    - id: 11
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: assigned_user
      label: Assigned User
      hint: null
      type: text
      options: []
      required: false
