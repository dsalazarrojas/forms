inputSchema:
  type: object
  properties:
    title: Cafe Reopening Survey
    pages:
      - id: 1
        name: respondent_name
        label: Respondent name
        hint: Optional
        type: text
        options: []
        required: false
      - id: 2
        name: visit_likelihood
        label: Likelihood to visit after reopening
        hint: Select preference
        type: select_one
        options:
          - Very likely
          - Likely
          - Neutral
          - Unlikely
        required: true
      - id: 3
        name: safety_concerns
        label: Main safety concerns
        hint: Select all that apply
        type: select_multiple
        options:
          - Social distancing
          - Cleanliness
          - Mask policy
          - Capacity limits
        required: true
      - id: 4
        name: preferred_services
        label: Preferred services after reopening
        hint: Dine in takeaway or delivery
        type: select_multiple
        options:
          - Dine in
          - Takeaway
          - Delivery
        required: true
      - id: 5
        name: operating_hours_preference
        label: Preferred operating hours
        hint: Morning afternoon evening
        type: text
        options: []
        required: false
      - id: 6
        name: menu_changes_interest
        label: Interest in menu changes
        hint: Would you like new items introduced
        type: select_one
        options:
          - Yes
          - No
        required: false
      - id: 7
        name: feedback_on_measures
        label: Feedback on safety measures
        hint: Suggestions for management
        type: text
        options: []
        required: false
      - id: 8
        name: contact_for_updates
        label: Would you like updates by email
        hint: Provide email if yes
        type: email
        options: []
        required: false
