inputSchema:
  type: object
  properties:
    title: Gaming Tournament Registration Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: team_info
      label: Team Information
      hint: Team Information
      type: text
      options: []
      required: false
    - id: 3
      name: team_members
      label: Team Members
      hint: null
      type: select_multiple
      options:
      - Player 1
      - Player 2
      - Player 3
      - Player 4
      - Player 5
      - Player 6
      - Player 7
      - Player 8
      required: false
    - id: 4
      name: discord
      label: Discord
      hint: null
      type: select_multiple
      options:
      - Discord Username
      - Discord Tag
      - Discord Channel
      - Discord Server
      required: false
    - id: 5
      name: team_name
      label: Team Name
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: game
      label: Game
      hint: null
      type: select_one
      options:
      - Game 1
      - Game 2
      - Game 3
      - Game 4
      - Game 5
      required: false
    - id: 7
      name: tournament_type
      label: Tournament Type
      hint: null
      type: select_one
      options:
      - Tournament Type 1
      - Tournament Type 2
      - Tournament Type 3
      required: false
    - id: 8
      name: division
      label: Division
      hint: null
      type: select_one
      options:
      - Division 1
      - Division 2
      - Division 3
      - Division 4
      required: false
    - id: 9
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
