inputSchema:
  type: object
  properties:
    title: Spelling Bee Contest Registration Form
    pages:
    - id: 1
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: participant_grade_level
      label: Participant Grade Level
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 4
      name: participant_tshirt_size
      label: Participant Shirt Size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      - X-Large
      - XX-Large
      required: false
    - id: 5
      name: participant_tshirt_color
      label: Participant Shirt Color
      hint: null
      type: select_multiple
      options:
      - Red
      - Blue
      - Green
      - Yellow
      - Black
      required: false
    - id: 6
      name: participant_parent_name
      label: Participant Parent Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: participant_parent_email
      label: Participant Parent Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: participant_parent_phone
      label: Participant Parent Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: participant_parent_relationship
      label: Participant Parent Relationship
      hint: null
      type: select_multiple
      options:
      - Parent
      - Guardian
      - Other
      required: false
    - id: 10
      name: participant_parent_school
      label: Participant Parent School
      hint: null
      type: text
      options: []
      required: false
