inputSchema:
  type: object
  properties:
    title: Agricultural Skills Tournament Entry Form
    pages:
    - id: 1
      name: contestant_name
      label: Contestant name
      hint: Full name as it should appear on materials
      type: text
      options: []
      required: true
    - id: 2
      name: age
      label: Age
      hint: Age of contestant
      type: number
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact email
      hint: Email for event communications
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone number
      hint: Mobile or daytime contact number
      type: text
      options: []
      required: false
    - id: 5
      name: team_name
      label: Team name
      hint: If entering as part of a team
      type: text
      options: []
      required: false
    - id: 6
      name: event_categories
      label: Event categories entered
      hint: Select categories the contestant will participate in
      type: select_multiple
      options:
      - Plowing
      - Harvesting
      - Machinery maintenance
      - Crop ID
      - Business planning
      required: true
    - id: 7
      name: emergency_contact
      label: Emergency contact name and phone
      hint: Provide contact for emergencies
      type: text
      options: []
      required: true
    - id: 8
      name: dietary_restrictions
      label: Dietary restrictions
      hint: For catering planning
      type: text
      options: []
      required: false
    - id: 9
      name: special_needs
      label: Accessibility or special needs
      hint: Indicate any accommodations required
      type: text
      options: []
      required: false
    - id: 10
      name: consent_media_release
      label: Consent for media release
      hint: Permission to use photos or video of the contestant
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
