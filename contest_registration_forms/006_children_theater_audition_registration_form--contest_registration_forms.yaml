inputSchema:
  type: object
  properties:
    title: Children Theater Audition Registration Form
    pages:
    - id: 1
      name: guardian_name
      label: Guardian Name
      hint: Name of parent or guardian registering the child
      type: text
      options: []
      required: true
    - id: 2
      name: guardian_email
      label: Guardian Email
      hint: Email used for audition communications
      type: email
      options: []
      required: true
    - id: 3
      name: child_name
      label: Child Name
      hint: Full legal name of participant
      type: text
      options: []
      required: true
    - id: 4
      name: child_dob
      label: Child Date of Birth
      hint: For age verification
      type: date
      options: []
      required: true
    - id: 5
      name: age_group
      label: Age Group
      hint: Select appropriate age bracket
      type: select_one
      options:
      - 4 to 6
      - 7 to 9
      - 10 to 12
      - 13 to 15
      required: true
    - id: 6
      name: audition_piece
      label: Audition Piece
      hint: Describe song, monologue or piece to perform
      type: text
      options: []
      required: true
    - id: 7
      name: experience_level
      label: Experience Level
      hint: Choose the level of prior performance experience
      type: select_one
      options:
      - None
      - Some experience
      - Regular classes or performances
      required: true
    - id: 8
      name: special_requirements
      label: Special Requirements
      hint: Note any accommodations needed for the audition
      type: text
      options: []
      required: false
    - id: 9
      name: parent_consent
      label: Parent Consent for Participation
      hint: Confirm consent to participate and follow rules
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 10
      name: emergency_contact
      label: Emergency Contact Phone
      hint: Phone number for emergencies during audition
      type: text
      options: []
      required: true
