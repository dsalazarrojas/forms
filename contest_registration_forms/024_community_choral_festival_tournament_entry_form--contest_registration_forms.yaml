inputSchema:
  type: object
  properties:
    title: Choral Festival Tournament Entry
    pages:
    - id: 1
      name: choir_name
      label: Choir or group name
      hint: Official ensemble name
      type: text
      options: []
      required: true
    - id: 2
      name: director_name
      label: Director or contact name
      hint: Primary contact for the entry
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact email
      hint: Email for event correspondence
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Contact phone number
      hint: Phone for event day coordination
      type: text
      options: []
      required: false
    - id: 5
      name: category_entering
      label: Category entering
      hint: Choose the competition category
      type: select_one
      options:
      - Adult choir
      - Youth choir
      - Community choir
      - School choir
      required: true
    - id: 6
      name: number_of_performers
      label: Number of performers
      hint: Total performers for the entry
      type: number
      options: []
      required: true
    - id: 7
      name: repertoire_list
      label: Repertoire list
      hint: Titles and composers for pieces
      type: text
      options: []
      required: true
    - id: 8
      name: technical_requirements
      label: Technical requirements
      hint: AV staging or accompanist needs
      type: text
      options: []
      required: false
    - id: 9
      name: emergency_contact
      label: Emergency contact name and phone
      hint: Person to reach on event day
      type: text
      options: []
      required: true
