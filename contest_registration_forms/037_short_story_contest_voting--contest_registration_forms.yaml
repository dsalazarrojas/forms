inputSchema:
  type: object
  properties:
    title: short_story_contest_voting
    pages:
    - id: 1
      name: user_details
      label: User Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: story_choice
      label: Choose A Story
      hint: null
      type: select_multiple
      options:
      - The Great Gatsby
      - The Catcher in the Rye
      - The Great Expectations
      - The Old Man and the Sea
      required: true
    - id: 3
      name: vote_type
      label: Vote Type
      hint: null
      type: select_one
      options:
      - For the win
      - Against the win
      required: true
    - id: 4
      name: rating
      label: Rate the Story
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: comment
      label: Comment
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: submit_button
      label: Submit
      hint: null
      type: text
      options: []
      required: true
