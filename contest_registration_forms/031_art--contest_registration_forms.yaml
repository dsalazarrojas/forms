inputSchema:
  type: object
  properties:
    title: Art Contest Registration
    pages:
    - id: 1
      name: section_artist_info
      label: -- Artist Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: artist_name
      label: Artist Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: artist_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: artist_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: artist_website
      label: Artist Website or Portfolio
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: section_experience
      label: -- Experience Level --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: experience_level
      label: Years of Art Experience
      hint: null
      type: select_one
      options:
      - Beginner - less than 1 year
      - Student - 1-3 years
      - Amateur - 3-5 years
      - Semi-professional
      - Professional
      required: true
    - id: 8
      name: prior_exhibitions
      label: Prior Exhibition Experience
      hint: null
      type: select_one
      options:
      - 'False'
      - Yes - local
      - Yes - regional
      - Yes - national
      - Yes - international
      required: true
    - id: 9
      name: section_artwork
      label: -- Artwork Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: artwork_title
      label: Artwork Title
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: artwork_medium
      label: Medium or Technique
      hint: Oil, acrylic, watercolor, digital, etc.
      type: text
      options: []
      required: true
    - id: 12
      name: artwork_dimensions
      label: Artwork Dimensions
      hint: Height x Width x Depth
      type: text
      options: []
      required: false
    - id: 13
      name: artwork_weight
      label: Artwork Weight - lbs or kg
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: artwork_year
      label: Year Created
      hint: null
      type: number
      options: []
      required: true
    - id: 15
      name: artwork_description
      label: Artwork Description
      hint: Inspiration, technique, meaning
      type: text
      options: []
      required: true
    - id: 16
      name: artwork_price
      label: Artwork Price or Value
      hint: null
      type: number
      options: []
      required: false
    - id: 17
      name: artwork_for_sale
      label: Is the artwork for sale
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Open to offers
      required: false
    - id: 18
      name: section_submission
      label: -- Submission Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 20
      name: contest_category
      label: Contest Category
      hint: null
      type: select_one
      options:
      - Painting
      - Sculpture
      - Digital art
      - Photography
      - Mixed media
      - Other
      required: true
    - id: 21
      name: permission_display
      label: Permission to Display Artwork
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 22
      name: permission_photograph
      label: Permission to Photograph for Promotion
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 23
      name: artwork_insurance
      label: Artwork Insurance Value
      hint: null
      type: number
      options: []
      required: false
    - id: 24
      name: special_handling
      label: Special Handling or Display Requirements
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: additional_info
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
