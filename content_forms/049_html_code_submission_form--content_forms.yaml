inputSchema:
  type: object
  properties:
    title: HTML Code Submission Form
    pages:
    - id: 1
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: code
      label: Code
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: code_language
      label: Language
      hint: null
      type: select_one
      options:
      - HTML
      - CSS
      - JavaScript
      required: false
    - id: 5
      name: submit_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: submit_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: review_date
      label: Review Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: submission_status
      label: Submission Status
      hint: null
      type: select_one
      options:
      - New
      - Pending
      - Reviewing
      - Approved
      - Rejected
      required: false
    - id: 9
      name: reviewer
      label: Reviewer
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: feedback
      label: Feedback
      hint: null
      type: note
      options: []
      required: false
