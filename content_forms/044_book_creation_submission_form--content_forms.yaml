inputSchema:
  type: object
  properties:
    title: Book Creation Submission Form
    pages:
    - id: 1
      name: submission_header
      label: -- Submission Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: author_name
      label: Author name
      hint: Full name of submitter
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: For editorial contact
      type: email
      options: []
      required: true
    - id: 4
      name: book_title
      label: Book title
      hint: Proposed title
      type: text
      options: []
      required: true
    - id: 5
      name: genre
      label: Genre
      hint: Select primary genre
      type: select_one
      options:
      - Fiction
      - Non fiction
      - Memoir
      - Children
      - Poetry
      required: true
    - id: 6
      name: word_count_estimate
      label: Word count estimate
      hint: Approximate total words
      type: number
      options: []
      required: false
    - id: 7
      name: synopsis
      label: Synopsis
      hint: Short summary of book
      type: text
      options: []
      required: true
    - id: 8
      name: target_audience
      label: Target audience
      hint: Who is the intended reader
      type: text
      options: []
      required: false
    - id: 9
      name: publication_status
      label: Publication status
      hint: Self published or unpublished
      type: select_one
      options:
      - Unpublished
      - Self published
      - Previously published
      required: true
