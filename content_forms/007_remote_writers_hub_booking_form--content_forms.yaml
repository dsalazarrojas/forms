inputSchema:
  type: object
  properties:
    title: remote_writers_hub_booking_form
    pages:
    - id: 1
      name: project_details
      label: Project Title
      hint: Enter the project title
      type: text
      options: []
      required: true
    - id: 2
      name: project_description
      label: Project Description
      hint: Enter a brief description of the project
      type: text
      options: []
      required: true
    - id: 3
      name: deadline_date
      label: Deadline
      hint: Select the deadline date
      type: date
      options: []
      required: true
    - id: 4
      name: remote_writer_details
      label: Remote Writer Details
      hint: Enter the remote writer's details
      type: text
      options: []
      required: true
    - id: 5
      name: remote_writer_rate
      label: Remote Writer Rate
      hint: Enter the remote writer's rate
      type: number
      options: []
      required: true
    - id: 6
      name: notes
      label: Notes
      hint: Enter any additional notes
      type: text
      options: []
      required: false
    - id: 7
      name: availability
      label: Availability
      hint: Select the remote writer's availability
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 8
      name: project_brief
      label: Project Brief
      hint: Enter a brief summary of the project
      type: text
      options: []
      required: true
