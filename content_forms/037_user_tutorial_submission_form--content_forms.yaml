inputSchema:
  type: object
  properties:
    title: User Tutorial Submission Form
    pages:
    - id: 1
      name: first_name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: category
      label: What is your favorite category?
      hint: null
      type: select_one
      options:
      - Category 1
      - Category 2
      - Category 3
      required: true
    - id: 4
      name: tags
      label: What are your favorite tags?
      hint: null
      type: select_multiple
      options:
      - Tag 1
      - Tag 2
      - Tag 3
      required: false
    - id: 5
      name: date
      label: What is your preferred date?
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time
      label: What time do you prefer?
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: note
      label: Do you have any additional notes?
      hint: null
      type: note
      options: []
      required: false
