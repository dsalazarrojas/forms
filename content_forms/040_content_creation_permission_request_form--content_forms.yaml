inputSchema:
  type: object
  properties:
    title: Content Creation Permission Request Form
    pages:
    - id: 1
      name: section_requester_info
      label: -- Requester Details --
      hint: Please provide your information below.
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Requester Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: requester_id
      label: Requester Identification Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: requester_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: section_permission_request
      label: -- Permission Request Details --
      hint: Please share details for the content creation permission.
      type: note
      options: []
      required: false
    - id: 6
      name: content_description
      label: Description of the Content to be Created
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: usage_justification
      label: Justification for Content Creation
      hint: Please explain the purpose and planned usage for this content.
      type: text
      options: []
      required: true
    - id: 8
      name: planned_distribution_channels
      label: Planned Content Distribution Channels
      hint: Select all that apply
      type: select_multiple
      options:
      - Social Media
      - Email
      - Website
      - SEO
      - Paid Search
      - Referral
      - Other
      required: true
    - id: 9
      name: copyright_verification
      label: I confirm that I have secured all necessary copyright permissions
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: section_security_verification
      label: -- Security and Verification --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: security_clearance_level
      label: Your Current Security Clearance Level
      hint: null
      type: select_one
      options:
      - Standard (Public)
      - Low (Staff)
      - Medium (Manager)
      - High (Director)
      - Top Secret (Admin)
      required: true
    - id: 12
      name: permission_granted
      label: Permission Granted?
      hint: For administrative use only
      type: select_one
      options:
      - 'True'
      - 'False'
      - Pending
      required: true
    - id: 13
      name: section_confirmation
      label: -- Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: permission_request_completed
      label: Permission Request Completed?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: signature_confirmation
      label: I confirm that the information provided is accurate
      hint: null
      type: select_one
      options:
      - I Agree
      - I Disagree
      required: true
    - id: 16
      name: date_of_request
      label: Date of Permission Request
      hint: null
      type: date
      options: []
      required: true
