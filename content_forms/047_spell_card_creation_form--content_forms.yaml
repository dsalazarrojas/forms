inputSchema:
  type: object
  properties:
    title: Spell Card Creation Form
    pages:
    - id: 1
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: effect
      label: effect
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: casting_requirements
      label: casting_requirements
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: rarity
      label: rarity
      hint: null
      type: select_one
      options:
      - Rare
      - Common
      - Uncommon
      - Legendary
      required: true
    - id: 5
      name: image
      label: image
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: casting_time
      label: casting_time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: casting_cost
      label: casting_cost
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: mana_cost
      label: mana_cost
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: casting_requirements_note
      label: casting_requirements_note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: player_notes
      label: player_notes
      hint: null
      type: note
      options: []
      required: false
