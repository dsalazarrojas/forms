inputSchema:
  type: object
  properties:
    title: Press Release Writing Checklist
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_person
      label: Contact Person
      hint: Full name including title and last name
      type: text
      options: []
      required: false
    - id: 3
      name: date_released
      label: Date Released
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: headline
      label: Headline
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: summary
      label: Summary
      hint: Summarize the press release in one paragraph
      type: text
      options: []
      required: false
    - id: 6
      name: main_body
      label: Main Body
      hint: Include essential details of the press release
      type: text
      options: []
      required: false
    - id: 7
      name: subheadings
      label: Subheadings
      hint: null
      type: select_multiple
      options:
      - News
      - Feature
      - Press Release
      required: false
    - id: 8
      name: image_description
      label: Image Description
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: image_credit
      label: Image Credit
      hint: Include credit or source of the image
      type: text
      options: []
      required: false
    - id: 10
      name: image_caption
      label: Image Caption
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: links
      label: Links
      hint: Link to company website or social media channel
      type: select_one
      options:
      - Website
      - Facebook
      - Twitter
      - Other
      required: false
    - id: 12
      name: attachments
      label: Attachments
      hint: Include any attachments
      type: select_multiple
      options:
      - Document
      - Image
      - Video
      required: false
    - id: 13
      name: language
      label: Language
      hint: Select the language of the press release
      type: select_one
      options:
      - English
      - Spanish
      - Other
      required: false
    - id: 14
      name: category_tags
      label: Category/Tags
      hint: Include relevant category/Tags for the press release
      type: text
      options: []
      required: false
    - id: 15
      name: press_release_id
      label: Press Release ID
      hint: Unique identifier for the press release
      type: text
      options: []
      required: false
    - id: 16
      name: publication_date
      label: Publication Date
      hint: null
      type: date
      options: []
      required: false
    - id: 17
      name: publication_time
      label: Publication Time
      hint: null
      type: time
      options: []
      required: false
    - id: 18
      name: publication_location
      label: Publication Location
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: keywords
      label: Keywords
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: author
      label: Author
      hint: Author name including title
      type: text
      options: []
      required: false
    - id: 22
      name: email
      label: Email
      hint: Contact email address
      type: email
      options: []
      required: false
    - id: 23
      name: phone
      label: Phone
      hint: Contact phone number
      type: text
      options: []
      required: false
    - id: 24
      name: company_name
      label: Company Name
      hint: Company name as it appears on the press release
      type: text
      options: []
      required: false
    - id: 25
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: false
