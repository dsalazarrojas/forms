inputSchema:
  type: object
  properties:
    title: BDSM Content Submission Form
    pages:
      - id: 1
        name: creator_name
        label: Creator Name or Pen Name
        hint: How should you be credited?
        type: text
        options: []
        required: true
      - id: 2
        name: creator_email
        label: Email Address
        hint: For submission confirmation and communication
        type: email
        options: []
        required: true
      - id: 3
        name: creator_bio
        label: Creator Bio or Background
        hint: Tell us about yourself
        type: text
        options: []
        required: false
      - id: 4
        name: content_title
        label: Content Title
        hint: What is the title of your submission?
        type: text
        options: []
        required: true
      - id: 5
        name: content_type
        label: Content Type
        hint: What type of content are you submitting?
        type: select_one
        options:
          - Written Story
          - Poetry
          - Educational Article
          - Guide or Tutorial
          - Artwork or Photography
          - Video
          - Podcast
          - Other
        required: true
      - id: 6
        name: content_description
        label: Content Description
        hint: Provide a brief description of your content
        type: text
        options: []
        required: true
      - id: 7
        name: content_length
        label: Content Length
        hint: For written content - word count or duration
        type: text
        options: []
        required: false
      - id: 8
        name: themes_covered
        label: Themes and Topics Covered
        hint: Describe the main topics or themes
        type: text
        options: []
        required: true
      - id: 9
        name: audience_level
        label: Content Audience Level
        hint: Who is this content intended for?
        type: select_one
        options:
          - Beginners
          - Intermediate
          - Advanced
          - All Levels
        required: false
      - id: 10
        name: content_rating
        label: Content Rating or Intensity Level
        hint: Describe the intensity or explicit content level
        type: select_one
        options:
          - Mild
          - Moderate
          - Explicit
          - Extreme
        required: true
      - id: 11
        name: consent_and_safety
        label: Does content emphasize consent and safety?
        hint: null
        type: select_one
        options:
          - Yes, extensively
          - Yes, somewhat
          - No
        required: true
      - id: 12
        name: previous_publication
