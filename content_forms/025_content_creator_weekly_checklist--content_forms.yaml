inputSchema:
  type: object
  properties:
    title: Content Creator Weekly Checklist
    pages:
    - id: 1
      name: creator_name
      label: Creator Name
      hint: Full name of content creator
      type: text
      options: []
      required: true
    - id: 2
      name: week_start_date
      label: Week Start Date
      hint: Monday of this week
      type: date
      options: []
      required: true
    - id: 3
      name: week_end_date
      label: Week End Date
      hint: Sunday of this week
      type: date
      options: []
      required: true
    - id: 4
      name: content_goal_for_week
      label: Content Goal for Week
      hint: What is your main goal this week?
      type: text
      options: []
      required: true
    - id: 5
      name: target_platforms
      label: Target Platforms
      hint: Which platforms will you post to?
      type: select_multiple
      options:
      - Instagram
      - Facebook
      - Twitter
      - LinkedIn
      - TikTok
      - YouTube
      - Blog
      - Pinterest
      required: true
    - id: 6
      name: monday_content_plan
      label: Monday Content Plan
      hint: What content will you create on Monday?
      type: text
      options: []
      required: true
    - id: 7
      name: monday_status
      label: Monday Status
      hint: Completion status for Monday
