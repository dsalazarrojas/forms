inputSchema:
  type: object
  properties:
    title: Content Model Application Form
    pages:
    - id: 1
      name: applicant_full_name
      label: Applicant Full Name
      hint: Legal first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: Best email to reach you
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY format
      type: date
      options: []
      required: true
    - id: 5
      name: mailing_address
      label: Mailing Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 6
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: zip_code
      label: ZIP Code
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: agency_name
      label: Agency Name
      hint: Name of the modeling agency
      type: text
      options: []
      required: true
    - id: 10
      name: modeling_experience
      label: Modeling Experience
      hint: Do you have prior modeling experience?
      type: select_one
      options:
      - No Experience
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5+ years
      required: true
    - id: 11
      name: content_type_interest
      label: Content Type Interest
      hint: What type of content work interests you?
      type: select_one
      options:
      - Print Advertising
      - Digital Advertising
      - Social Media Content
      - Video Commercials
      - Runway Shows
      - Catalog Work
      - Brand Ambassador
      required: true
    - id: 12
      name: portfolio_url
      label: Portfolio URL
      hint: Link to your portfolio or social media
      type: text
      options: []
      required: true
    - id: 13
      name: instagram_handle
      label: Instagram Handle
      hint: Your Instagram username
      type: text
      options: []
      required: false
    - id: 14
      name: instagram_followers
      label: Instagram Followers
      hint: Approximate follower count
      type: select_one
      options:
      - Under 1,000
      - 1,000-10,000
      - 10,000-50,000
      - 50,000-100,000
      - 100,000-500,000
      - Over 500,000
      required: false
    - id: 15
      name: height
      label: Height
      hint: In feet and inches or cm
      type: text
      options: []
      required: true
    - id: 16
      name: weight
      label: Weight
      hint: In pounds or kg
      type: text
      options: []
      required: false
    - id: 17
      name: eye_color
      label: Eye Color
      hint: null
      type: select_one
      options:
      - Blue
      - Green
      - Brown
      - Hazel
      - Gray
      - Other
      required: true
    - id: 18
      name: hair_color
      label: Hair Color
      hint: null
      type: select_one
      options:
      - Blonde
      - Brown
      - Black
      - Red
      - Auburn
      - Gray
      - Other
      required: true
    - id: 19
      name: clothing_size
      label: Clothing Size
      hint: Your typical clothing size
      type: text
      options: []
      required: false
    - id: 20
      name: shoe_size
      label: Shoe Size
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: special_skills
      label: Special Skills
      hint: Any special talents or skills
      type: text
      options: []
      required: false
    - id: 22
      name: availability
      label: Availability
      hint: When are you available for work?
      type: select_one
      options:
      - Full-Time
      - Part-Time
      - Weekends Only
      - Flexible Schedule
      - Specific Projects Only
      required: true
    - id: 23
      name: willing_to_travel
      label: Willing to Travel
      hint: Are you willing to travel for work?
      type: select_one
      options:
      - Yes, locally
      - Yes, nationally
      - Yes, internationally
      - 'False'
      required: true
    - id: 24
      name: previous_agencies
      label: Previous Agencies
      hint: Have you worked with other agencies?
      type: text
      options: []
      required: false
    - id: 25
      name: why_work_with_us
      label: Why Do You Want to Work With Us?
      hint: Tell us about your interest
      type: text
      options: []
      required: true
    - id: 26
      name: application_date
      label: Application Date
      hint: Date of application
      type: date
      options: []
      required: true
