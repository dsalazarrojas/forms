inputSchema:
  type: object
  properties:
    title: Course Listing Submission Form
    pages:
    - id: 1
      name: course_title
      label: Course Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: course_description
      label: Course Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: course_tags
      label: Course Tags
