      - Computer Science
      - Programming
      - Education
      - Art
      - Business
      required: false
    - id: 4
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: instructor_title
      label: Instructor Title
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: course_start_date
      label: Course Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: course_end_date
      label: Course End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: course_status
      label: Course Status
      hint: null
      type: select_one
      options:
      - Active
      - In Progress
      - Completed
      required: false
    - id: 9
      name: course_location
      label: Course Location
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: instructor_phone
      label: Instructor Phone
      hint: null
      type: text
      options: []
