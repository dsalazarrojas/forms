inputSchema:
  type: object
  properties:
    title: Environmental Documentary Project Application Form
    pages:
    - id: 1
      name: festival_form_data
      label: festival_info
      hint: null
      type: select_one
      options:
      - Festival name
      - Festival location
      - Project duration
      - Project budget
      required: false
    - id: 2
      name: school_form_data
      label: school_info
      hint: null
      type: select_multiple
      options:
      - Grade level
      - Student number
      - Teacher number
      required: true
    - id: 3
      name: ngo_form_data
      label: ngo_info
      hint: null
      type: select_one
      options:
      - Organization type
      - Location
      required: true
    - id: 4
      name: grant_form_data
      label: grant_info
      hint: null
      type: select_one
      options:
      - Grant type
      - Grant amount
      required: false
    - id: 5
      name: project_details
      label: project_details
      hint: Briefly describe your project
      type: text
      options: []
      required: false
    - id: 6
      name: project_budget
      label: project_budget
      hint: null
      type: number
      options: []
      required: false
