      - Exfoliants
      - Serums
      - Moisturizers
      - Masks
      required: false
    - id: 9
      name: product_recommendations
      label: Product Recommendations
      hint: null
      type: select_multiple
      options:
      - Cleanser
      - Exfoliant
      - Serum
      - Moisturizer
      - Mask
      - Sunscreen
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - ChatJim
      - ChatJane
      - ChatBob
      required: false
    - id: 12
      name: output_file
      label: Output File
      hint: null
      type: select_one
      options:
      - 019 customized skincare routine--content forms.yaml
