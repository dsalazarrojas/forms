      - Communications
      - Sales
      - Product
      - Executive
      - External Contributor
      - Other
      required: false
    - id: 12
      name: content_details
      label: Content Details
      hint: Upload and details
      type: note
      options: []
      required: false
    - id: 13
      name: word_count
      label: Word Count
      hint: Approximate count
      type: number
      options: []
      required: false
    - id: 14
      name: reading_time
      label: Estimated Reading Time
      hint: In minutes
      type: number
      options: []
      required: false
    - id: 15
      name: featured_image
      label: Featured Image
      hint: Main image for content
      type: text
      options: []
      required: false
    - id: 16
      name: seo_keywords
      label: SEO Keywords
      hint: Target keywords
      type: text
      options: []
      required: false
    - id: 17
      name: meta_description
      label: Meta Description
      hint: For search engines
      type: text
      options: []
      required: false
