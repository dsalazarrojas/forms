      name: scheduling_info
      label: Scheduling Information
      hint: When to publish
      type: note
      options: []
      required: false
    - id: 22
      name: publish_date
      label: Publication Date
      hint: When to publish
      type: date
      options: []
      required: true
    - id: 23
      name: publish_time
