      hint: Who should approve
      type: text
      options: []
      required: false
    - id: 31
      name: approver_email
      label: Approver Email
      hint: Approver contact
      type: email
      options: []
      required: false
    - id: 32
      name: approval_deadline
      label: Approval Deadline
      hint: When approval needed by
      type: date
      options: []
      required: false
    - id: 33
      name: promotion_plan
      label: Promotion Plan
      hint: How to promote
      type: note
      options: []
      required: false
    - id: 34
      name: social_promotion
      label: Social Media Promotion
      hint: Will you promote on social
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 35
      name: email_promotion
      label: Email Promotion
      hint: Include in newsletter
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 36
      name: paid_promotion
      label: Paid Promotion
      hint: Will you run ads
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 37
      name: promotion_budget
