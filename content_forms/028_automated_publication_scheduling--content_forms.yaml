inputSchema:
  type: object
  properties:
    title: Automated Publication Scheduling
    pages:
    - id: 1
      name: introduction
      label: Automated Publication Scheduling
      hint: Schedule your content publication
      type: note
      options: []
      required: false
    - id: 2
      name: content_info
      label: Content Information
      hint: Details about the content
      type: note
      options: []
      required: false
    - id: 3
      name: content_title
      label: Content Title
      hint: Title of the content
      type: text
      options: []
      required: true
    - id: 4
      name: content_type
      label: Content Type
      hint: What type of content
      type: select_one
      options:
      - Blog Post
      - Article
      - Press Release
      - Social Media Post
      - Newsletter
      - Video
      - Podcast
      - Whitepaper
      - Case Study
      - Other
      required: true
    - id: 5
      name: content_description
      label: Content Description
      hint: Brief summary
      type: text
      options: []
      required: true
    - id: 6
      name: content_category
      label: Content Category
      hint: Category or topic
      type: text
      options: []
      required: false
    - id: 7
      name: content_tags
      label: Content Tags
      hint: Keywords for tagging
      type: text
      options: []
      required: false
    - id: 8
      name: author_info
      label: Author Information
      hint: Who created this content
      type: note
      options: []
      required: false
    - id: 9
      name: author_name
