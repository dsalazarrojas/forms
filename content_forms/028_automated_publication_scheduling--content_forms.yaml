      name: publication_channels
      label: Publication Channels
      hint: Where to publish
      type: note
      options: []
      required: false
    - id: 19
      name: channels
      label: Selected Channels
      hint: Where will this appear
      type: select_multiple
      options:
      - Company Website
      - Blog
      - LinkedIn
      - Twitter
      - Facebook
      - Instagram
      - Email Newsletter
      - Medium
      - Press Distribution
      - Other
      required: true
    - id: 20
      name: primary_channel
      label: Primary Channel
      hint: Main publication channel
      type: select_one
      options:
      - Company Website
      - Blog
      - LinkedIn
      - Twitter
      - Facebook
      - Instagram
      - Email Newsletter
      - Other
      required: true
