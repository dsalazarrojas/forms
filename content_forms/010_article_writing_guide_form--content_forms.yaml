        hint: Primary keywords to target
        type: text
        options: []
        required: false
      - id: 22
        name: brand_guidelines
        label: Brand or Style Guide to Follow
        hint: Link to or describe brand guidelines
        type: text
        options: []
        required: false
      - id: 23
        name: reference_materials
        label: Reference Materials or Examples
        hint: Links to articles to emulate or avoid
        type: text
        options: []
        required: false
      - id: 24
        name: special_instructions
        label: Special Instructions or Notes
        hint: Any additional requirements or preferences
        type: text
        options: []
        required: false
      - id: 25
        name: editor_contact
        label: Editor Contact Name
        hint: Who should the writer contact with questions?
        type: text
        options: []
        required: false
