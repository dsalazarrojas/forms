      options: []
      required: false
    - id: 8
      name: reviewer_role
      label: Reviewer Role
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: reviewer_department
      label: Reviewer Department
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: review_comments
      label: Review Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: editorial_board_comments
      label: Editorial Board Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: review_date_received
      label: Date Received
      hint: null
      type: date
      options: []
      required: false
