      name: editorial_review_form_page_1
      label: Review Manuscript
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: manuscript_status
      label: Manuscript Status
      hint: null
      type: select_one
      options:
      - In Review
      - Ready to Publish
      - Rejected
      required: false
    - id: 3
      name: editorial_review_form_page_2
      label: Editorial Comments
