inputSchema:
  type: object
  properties:
    title: Business Communication Phrase Request Form
    pages:
      - id: 1
        name: request_information
        label: -- Request Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: requester_name
        label: Requester Name
        hint: Your name
        type: text
        options: []
        required: true
      - id: 3
        name: requester_email
        label: Email Address
        hint: Your business email
        type: email
        options: []
        required: true
      - id: 4
        name: requester_department
        label: Department
        hint: Your department or team
        type: text
        options: []
        required: true
      - id: 5
        name: request_date
        label: Request Date
        hint: When is this needed
        type: date
        options: []
        required: true
      - id: 6
        name: communication_context
        label: -- Communication Context --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: communication_type
        label: Type of Communication
        hint: What is this phrase for
        type: select_one
        options:
          - Email
          - Meeting
          - Presentation
          - Marketing Material
          - Social Media
          - Internal Memo
          - Client Communication
          - Other
        required: true
      - id: 8
        name: communication_purpose
        label: Purpose of Communication
        hint: What is the main objective
        type: select_one
        options:
