          - Clients/Customers
          - Partners/Vendors
          - Investors
          - Media
          - General Public
          - Mixed
        required: true
      - id: 10
        name: tone_preference
        label: Tone Preference
        hint: Desired tone of communication
        type: select_one
        options:
          - Professional Formal
          - Professional Casual
          - Friendly and Approachable
          - Authoritative
          - Empathetic
          - Informative
          - Persuasive
        required: true
      - id: 11
        name: current_phrase
        label: -- Phrase Details --
        hint: null
        type: note
        options: []
        required: false
