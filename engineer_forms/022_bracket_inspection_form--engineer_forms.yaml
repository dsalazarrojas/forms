inputSchema:
  type: object
  properties:
    title: Bracket Inspection Form
    pages:
      - id: 1
        name: section_header_inspection
        label: -- Inspection Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: inspection_date
        label: Inspection Date
        hint: Date of inspection
        type: date
        options: []
        required: true
      - id: 3
        name: inspection_time
        label: Inspection Time
        hint: Time inspection was conducted
        type: time
        options: []
        required: false
      - id: 4
        name: inspector_name
        label: Inspector Name
        hint: Person conducting inspection
        type: text
        options: []
        required: true
      - id: 5
        name: section_header_bracket
        label: -- Bracket Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 6
        name: bracket_id
        label: Bracket ID or Serial Number
        hint: Unique identification
        type: text
        options: []
        required: true
      - id: 7
        name: bracket_type
        label: Bracket Type
        hint: Type or classification
        type: select_one
        options:
          - Steel
          - Aluminum
          - Composite
          - Structural steel
          - Pipe bracket
          - Support bracket
          - Mounting bracket
          - Other
        required: true
      - id: 8
        name: bracket_location
        label: Installation Location
        hint: Where bracket is installed
        type: text
        options: []
        required: true
      - id: 9
        name: installation_date
        label: Original Installation Date
        hint: When was bracket installed
        type: date
        options: []
        required: false
      - id: 10
        name: section_header_visual
        label: -- Visual Inspection --
        hint: null
        type: note
        options: []
        required: false
      - id: 11
        name: visual_condition
        label: Overall Visual Condition
        hint: General appearance assessment
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Critical
        required: true
      - id: 12
        name: rust_corrosion
        label: Rust or Corrosion Present
        hint: Any visible rust or corrosion
        type: select_one
        options:
          - None
          - Minor (less than 10%)
          - Moderate (10-25%)
          - Significant (25-50%)
          - Severe (over 50%)
        required: true
      - id: 13
        name: cracks_damage
        label: Visible Cracks or Damage
        hint: Any structural cracks
        type: select_one
        options:
          - None
          - Minor hairline cracks
          - Small cracks
          - Large cracks
          - Breaks or failures
        required: true
      - id: 14
        name: section_header_fasteners
        label: -- Fasteners and Connections --
        hint: null
        type: note
        options: []
        required: false
      - id: 15
        name: fasteners_condition
        label: Fasteners Condition
        hint: Bolts, nuts, welds
        type: select_one
        options:
          - All tight and secure
          - Mostly secure, some loose
          - Many loose or corroded
          - Severely compromised
          - Failed
        required: true
      - id: 16
        name: weld_quality
        label: Weld Quality Assessment
        hint: If welds are present
        type: select_one
        options:
          - Excellent
          - Good
          - Acceptable
          - Poor
          - Not applicable
        required: false
      - id: 17
        name: section_header_load
        label: -- Load and Stress Assessment --
        hint: null
        type: note
        options: []
        required: false
      - id: 18
        name: load_rating
        label: Current Load Rating
        hint: Estimated safe load capacity
        type: text
        options: []
        required: false
      - id: 19
        name: section_header_recommendations
        label: -- Recommendations --
        hint: null
        type: note
        options: []
        required: false
      - id: 20
        name: action_required
        label: Action Required
        hint: What needs to be done
        type: select_one
        options:
          - No action needed
          - Monitor and retest
          - Minor repairs needed
          - Major repairs required
          - Replace immediately
        required: true
      - id: 21
        name: detailed_notes
        label: Detailed Inspection Notes
        hint: Additional findings and observations
        type: text
        options: []
        required: false
