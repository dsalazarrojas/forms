inputSchema:
  type: object
  properties:
    title: Time Constant Calculation Form
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: Please enter your information
      type: text
      options: []
      required: false
    - id: 2
      name: time_constant
      label: Time Constant
      hint: Choose a specific date
      type: text
      options: []
      required: false
    - id: 3
      name: calculation
      label: Calculation Method
      hint: Choose a calculation method
      type: text
      options: []
      required: false
    - id: 4
      name: result_info
      label: Result Information
      hint: Enter result information
      type: text
      options: []
      required: false
    - id: 5
      name: review
      label: Review
      hint: Confirm your result
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 6
      name: submit
      label: Submit
      hint: Submit your form
      type: text
      options: []
      required: true
