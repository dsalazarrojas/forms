inputSchema:
  type: object
  properties:
    title: Energy Simulation Input Form
    pages:
    - id: 1
      name: project_type
      label: Project Type
      hint: null
      type: select_one
      options:
      - Building
      - Residential
      - Commercial
      - Industrial
      required: false
    - id: 2
      name: building_size
      label: Building Size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 3
      name: climate_zone
      label: Climate Zone
      hint: null
      type: select_one
      options:
      - 4a
      - 5a
      - 5b
      required: false
    - id: 4
      name: building_type
      label: Building Type
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: building_height
      label: Building Height
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: roof_type
      label: Roof Type
      hint: null
      type: select_one
      options:
      - Flat
      - Sloped
      - Curved
      required: false
