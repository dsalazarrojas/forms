      name: longitude
      label: Longitude
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: elevation
      label: Elevation
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: wind_speed
      label: Wind Speed
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: wind_direction
      label: Wind Direction
      hint: null
      type: select_one
      options:
      - 0°-45°
      - 45°-90°
      - 90°-135°
      - 135°-180°
