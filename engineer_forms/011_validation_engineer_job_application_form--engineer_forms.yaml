      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: available_end_date
      label: Available End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: available_reason
      label: Reason for Leaving
      hint: null
      type: text
      options: []
      required: false
