inputSchema:
  type: object
  properties:
    title: Validation Engineer Job Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Please enter your first name
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: Please enter your last name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: resume
      label: Resume
      hint: Please attach your resume
      type: note
      options: []
      required: false
