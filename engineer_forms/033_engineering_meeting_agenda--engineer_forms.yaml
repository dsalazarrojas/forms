inputSchema:
  type: object
  properties:
    title: Engineering Meeting Agenda
    pages:
    - id: 1
      name: agenda_title
      label: Meeting Agenda
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participants
      label: Participants List
      hint: null
      type: select_multiple
      options:
      - John Doe
      - Jane Doe
      required: false
    - id: 3
      name: agenda_topics
      label: Agenda Topics
      hint: null
      type: select_one
      options:
      - Discuss New Project
      - Project Deadline
      - Team Goals
      required: false
    - id: 4
      name: action_items
      label: Action Items
      hint: List action items that need to be addressed.
      type: text
      options: []
      required: false
    - id: 5
      name: meeting_notes
      label: Meeting Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: meeting_date
      label: Meeting Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: meeting_time
      label: Meeting Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: location
      label: Meeting Location
      hint: null
      type: select_one
      options:
      - Online Meeting
      - Office Meeting
      required: false
    - id: 9
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: assigned_user
      label: Assigned User
      hint: null
      type: text
      options: []
      required: false
