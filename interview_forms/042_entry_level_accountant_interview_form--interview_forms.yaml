inputSchema:
  type: object
  properties:
    title: Entry Level Accountant Interview Form
    pages:
    - id: 1
      name: candidate_info
      label: Candidate Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: resume_upload
      label: Upload Resume
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: work_experience
      label: Work Experience
      hint: Please provide your work experience in detail. Please use bullet points
        or paragraphs for your answers.
      type: text
      options: []
      required: false
    - id: 8
      name: education
      label: Education
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: skills
      label: Skills
      hint: Skills should include technical skills and software proficiency.
      type: text
      options: []
      required: false
    - id: 10
      name: references
      label: References
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: availability
      label: Availability
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: salary_requirements
      label: Salary Requirements
      hint: Please specify your desired salary and any other benefits you are expecting.
        Please use commas to separate each benefit.
      type: text
      options: []
      required: false
    - id: 13
      name: why_us
      label: Why Us
      hint: Tell us about a time when you overcame a difficult situation or challenge.
      type: text
      options: []
      required: false
    - id: 14
      name: why_us_other
      label: Why Us Other
      hint: Please describe any other qualities or qualifications that you think would
        make you a good fit for this role.
      type: text
      options: []
      required: false
    - id: 15
      name: certification
      label: Certification
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: certification_other
      label: Other Certification
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: professional_license
      label: Professional License
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: language
      label: Language
      hint: null
      type: select_one
      options:
      - English
      - French
      - Spanish
      - German
      - Chinese
      - Japanese
      - Korean
      - Arabic
      - Portuguese
      required: true
    - id: 19
      name: availability_date_range
      label: Availability Date Range
      hint: Please specify the earliest and latest date you are available to start.
      type: date
      options: []
      required: false
    - id: 20
      name: availability_time_range
      label: Availability Time Range
      hint: null
      type: time
      options: []
      required: false
    - id: 21
      name: work_experience_other
      label: Other Work Experience
      hint: Please describe any other work experiences you have that is not in the
        previous question.
      type: text
      options: []
      required: false
    - id: 22
      name: work_experience_2
      label: Work Experience 2
      hint: Please describe your work experience 2.
      type: text
      options: []
      required: false
    - id: 23
      name: certification_2
      label: Certification 2
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: professional_license_2
      label: Professional License 2
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: work_experience_3
      label: Work Experience 3
      hint: null
      type: text
      options: []
      required: false
