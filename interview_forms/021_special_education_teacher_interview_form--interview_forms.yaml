inputSchema:
  type: object
  properties:
    title: Special Education Teacher Interview Form
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: education_background
      label: Education Background
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: teaching_certifications
      label: Teaching Certifications
      hint: null
      type: select_multiple
      options:
      - American Sign Language (ASL)
      - Board Certified Behavior Analyst (BCBA)
      - Certified Administrator
      - Certified School Administrator
      - Certified Special Education Teacher
      - Crisis Prevention Intervention (CPI)
      - Crisis Prevention Intervention - Basic
      - First Aid and CPR
      - First Aid and CPR - Basic
      - First Aid and CPR - Intermediate
      - First Aid and CPR - Advanced
      - Infant and Child CPR
      - Infant and Child CPR - Basic
      - Infant and Child CPR - Intermediate
      - Infant and Child CPR - Advanced
      - National Association of Social Workers (NASW)
      - School Administrator
      - Teaching English as a Second Language (ESL)
      - Trauma Informed Care
      - Trauma Informed Care - Basic
      - Trauma Informed Care - Intermediate
      - Trauma Informed Care - Advanced
      required: false
    - id: 4
      name: special_education_exp
      label: Special Education Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: work_history
      label: Work History
      hint: null
      type: select_multiple
      options:
      - 3 years
      - 5 years
      - 10 years
      - 15 years
      - More than 15 years
      required: false
    - id: 6
      name: job_references
      label: Job References
      hint: null
      type: select_multiple
      options:
      - Available
      - Unavailable
      - No preference
      required: false
    - id: 7
      name: other_exp
      label: Other Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: resume_upload
      label: Resume Upload
      hint: null
      type: text
      options: []
      required: false
