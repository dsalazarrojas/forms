inputSchema:
  type: object
  properties:
    title: Recruitment Agency Interview Form
    pages:
    - id: 1
      name: candidate_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: resume
      label: Resume
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: date_available
      label: Date Available
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: interview_time
      label: Interview Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: interview_duration
      label: Interview Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: interview_notes
      label: Interview Notes
      hint: null
      type: note
      options: []
      required: false
