inputSchema:
  type: object
  properties:
    title: C Suite Interview Form
    pages:
    - id: 1
      name: interview_date
      label: Interview Date
      hint: Date of interview
      type: date
      options: []
      required: true
    - id: 2
      name: candidate_name
      label: Candidate Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: candidate_email
      label: Candidate Email
      hint: Email address
      type: email
      options: []
      required: true
    - id: 4
      name: candidate_phone
      label: Candidate Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: position_applied
      label: Position Applied For
      hint: Executive role title
      type: text
      options: []
      required: true
    - id: 6
      name: position_type
      label: Position Type
      hint: Select the executive level
      type: select_one
      options:
      - CEO
      - COO
      - CFO
      - CTO
      - CMO
      - President
      - Vice President
      - Other C-Suite
      required: true
    - id: 7
      name: interview_panel
      label: Interviewing Panel Members
      hint: Names of interviewers
      type: text
      options: []
      required: true
    - id: 8
      name: current_employment
      label: Current Employment Status
      hint: Present job situation
      type: text
      options: []
      required: true
    - id: 9
      name: years_experience
      label: Years of Executive Experience
      hint: Total leadership experience
      type: number
      options: []
      required: true
    - id: 10
      name: previous_positions
      label: Previous Executive Positions
      hint: Summary of career
      type: text
      options: []
      required: true
    - id: 11
      name: industry_background
      label: Industry Background
      hint: Which industries have you led
      type: text
      options: []
      required: true
    - id: 12
      name: key_accomplishments
      label: Key Accomplishments
      hint: Major career achievements
      type: text
      options: []
      required: true
    - id: 13
      name: leadership_style
      label: Leadership Style
      hint: Describe your approach
      type: text
      options: []
      required: true
    - id: 14
      name: strategic_vision
      label: Strategic Vision for Role
      hint: Your vision for the position
      type: text
      options: []
      required: true
    - id: 15
      name: biggest_challenge
      label: Biggest Challenge You Foresee
      hint: Potential obstacles
      type: text
      options: []
      required: false
    - id: 16
      name: salary_expectations
      label: Salary Expectations
      hint: Compensation range
      type: text
      options: []
      required: false
    - id: 17
      name: benefits_interests
      label: Interested Benefits or Perks
      hint: What matters most
      type: text
      options: []
      required: false
    - id: 18
      name: start_date
      label: Earliest Start Date Available
      hint: When can you begin
      type: date
      options: []
      required: true
    - id: 19
      name: interview_notes
      label: Interview Notes and Observations
      hint: Interviewer comments
      type: text
      options: []
      required: false
