inputSchema:
  type: object
  properties:
    title: Interview Questionnaire Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: true
    - id: 2
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: availability
      label: Availability
      hint: null
      type: select_one
      options:
      - 6 months
      - 12 months
      - 2 years
      required: true
    - id: 4
      name: work_experience
      label: Work Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: job_preferences
      label: Job Preferences
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: personal_questions
      label: Personal Questions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: education
      label: Education
      hint: null
      type: select_one
      options:
      - High
      - Low
      required: false
    - id: 8
      name: work_experience_2
      label: Work Experience 2
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: skills_questions
      label: Skills Questions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: references
      label: References
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: other
      label: Other
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: skills_levels
      label: Skills Levels
      hint: null
      type: select_multiple
      options:
      - High
      - Low
      required: false
