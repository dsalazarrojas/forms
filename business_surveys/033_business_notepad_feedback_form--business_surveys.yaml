inputSchema:
  type: object
  properties:
    title: Business Notepad Feedback Form
    pages:
      - id: 1
        name: customer_name
        label: Customer Name
        hint: Your full name
        type: text
        options: []
        required: true
      - id: 2
        name: customer_email
        label: Email Address
        hint: Email for follow-up
        type: email
        options: []
        required: true
      - id: 3
        name: company_name
        label: Company Name
        hint: Your organization
        type: text
        options: []
        required: false
      - id: 4
        name: purchase_date
        label: Purchase Date
        hint: When did you purchase the notepad
        type: date
        options: []
        required: true
      - id: 5
        name: product_type
        label: Product Type
        hint: Which notepad did you purchase
        type: select_one
        options:
          - Standard business notepad
          - Premium leather notepad
          - Eco-friendly notepad
          - Custom branded notepad
          - Digital notepad
          - Notepad set
        required: true
      - id: 6
        name: purchase_channel
        label: Purchase Channel
        hint: Where did you purchase
        type: select_one
        options:
          - Company website
          - Amazon
          - Retail store
          - Trade show
          - Direct sales
          - Gift
        required: true
      - id: 7
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: Rate your overall satisfaction
        type: select_one
        options:
          - Very satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very dissatisfied
        required: true
      - id: 8
        name: quality_rating
        label: Quality Rating
        hint: Rate the product quality
        type: select_one
        options:
          - Excellent
          - Very good
          - Good
          - Fair
          - Poor
        required: true
      - id: 9
        name: value_for_money
        label: Value for Money
        hint: Rate the value for price paid
        type: select_one
        options:
          - Excellent value
          - Good value
          - Fair value
          - Poor value
          - Very poor value
        required: true
      - id: 10
        name: paper_quality
        label: Paper Quality Rating
        hint: Rate the paper quality
        type: select_one
        options:
          - Excellent
          - Very good
          - Good
          - Fair
          - Poor
          - Not applicable
        required: true
      - id: 11
        name: design_appeal
        label: Design Appeal
        hint: Rate the visual design
        type: select_one
        options:
          - Very appealing
          - Appealing
          - Neutral
          - Unappealing
          - Very unappealing
        required: true
      - id: 12
        name: durability
        label: Durability Rating
        hint: How durable is the product
        type: select_one
        options:
          - Very durable
          - Durable
          - Average
          - Fragile
          - Very fragile
        required: true
      - id: 13
        name: features_satisfaction
        label: Features Satisfaction
        hint: Rate the product features
        type: select_one
        options:
          - Exceeds expectations
          - Meets expectations
          - Below expectations
          - Missing important features
        required: true
      - id: 14
        name: issues_encountered
        label: Issues Encountered
        hint: Select any issues experienced
        type: select_multiple
        options:
          - Paper tearing
          - Ink bleeding
          - Binding issues
          - Cover damage
          - Size issues
          - No issues
        required: true
      - id: 15
        name: issue_description
        label: Issue Description
        hint: Describe any issues in detail
        type: text
        options: []
        required: false
      - id: 16
        name: would_recommend
        label: Would You Recommend
        hint: Would you recommend to others
        type: select_one
        options:
          - Definitely yes
          - Probably yes
          - Not sure
          - Probably no
          - Definitely no
        required: true
      - id: 17
        name: would_purchase_again
        label: Would Purchase Again
        hint: Would you buy this product again
        type: select_one
        options:
          - Definitely yes
          - Probably yes
          - Not sure
          - Probably no
          - Definitely no
        required: true
      - id: 18
        name: improvement_suggestions
        label: Suggestions for Improvement
        hint: How can we improve this product
        type: text
        options: []
        required: false
      - id: 19
        name: favorite_feature
        label: Favorite Feature
        hint: What do you like most about this product
        type: text
        options: []
        required: false
      - id: 20
        name: least_favorite_feature
        label: Least Favorite Feature
        hint: What do you like least
        type: text
        options: []
        required: false
      - id: 21
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback
        type: text
        options: []
        required: false
