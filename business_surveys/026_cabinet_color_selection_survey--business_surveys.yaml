inputSchema:
  type: object
  properties:
    title: Cabinet Color Selection Survey
    pages:
      - id: 1
        name: respondent_name
        label: Respondent name
        hint: Optional
        type: text
        options: []
        required: false
      - id: 2
        name: business_type
        label: Business type
        hint: Retail design or contractor
        type: select_one
        options:
          - Retail
          - Contractor
          - Designer
          - Homeowner
        required: true
      - id: 3
        name: preferred_style
        label: Preferred cabinet style
        hint: Modern classic or rustic
        type: select_one
        options:
          - Modern
          - Classic
          - Rustic
          - Industrial
        required: true
      - id: 4
        name: color_choices
        label: Top color choices
        hint: Rank or list top three
        type: text
        options: []
        required: true
      - id: 5
        name: finish_preference
        label: Finish preference
        hint: Matte glossy or textured
        type: select_one
        options:
          - Matte
          - Glossy
          - Semi gloss
        required: true
      - id: 6
        name: budget_range
        label: Budget range for cabinets
        hint: Provide approximate budget
        type: select_one
        options:
          - Under 2000
          - 2000 to 5000
          - Over 5000
        required: false
      - id: 7
        name: purchase_timeline
        label: Purchase timeline
        hint: When do you plan to buy
        type: select_one
        options:
          - Immediate
          - 1 to 3 months
          - 3 to 6 months
          - 6+ months
        required: false
      - id: 8
        name: additional_comments
        label: Additional comments
        hint: Any other preferences
        type: text
        options: []
        required: false
