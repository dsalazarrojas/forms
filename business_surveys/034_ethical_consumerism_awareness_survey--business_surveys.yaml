inputSchema:
  type: object
  properties:
    title: Ethical Consumerism Awareness Survey
    pages:
    - id: 1
      name: survey_form
      label: Survey Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: introduction
      label: introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: ethical_purchasing_behaviors
      label: ethical_purchasing_behaviors
      hint: null
      type: select_multiple
      options:
      - Always consider the environmental impact of my purchasing decisions
      - Often consider the environmental impact of my purchasing decisions
      - Sometimes consider the environmental impact of my purchasing decisions
      - Rarely consider the environmental impact of my purchasing decisions
      - Never consider the environmental impact of my purchasing decisions
      required: false
    - id: 4
      name: purchasing_patterns
      label: purchasing_patterns
      hint: null
      type: select_one
      options:
      - Buy only from brands I know are sustainable
      - Buy mostly from brands I know are sustainable
      - Buy some from brands I know are sustainable
      - Buy only from non-sustainable brands
      - Buy mostly from non-sustainable brands
      - Buy some from non-sustainable brands
      required: false
    - id: 5
      name: social_awareness
      label: social_awareness
      hint: null
      type: select_multiple
      options:
      - I have a very good understanding of where my money goes
      - I have a good understanding of where my money goes
      - I have some understanding of where my money goes
      - I have little understanding of where my money goes
      - I have no idea where my money goes
      required: false
