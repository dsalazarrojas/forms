inputSchema:
  type: object
  properties:
    title: Company Survey
    pages:
      - id: 1
        name: respondent_name
        label: Your Name
        hint: Optional
        type: text
        options: []
        required: false
      - id: 2
        name: respondent_email
        label: Email Address
        hint: Optional
        type: email
        options: []
        required: false
      - id: 3
        name: respondent_type
        label: I am a
        hint: Your relationship
        type: select_one
        options:
          - Current Employee
          - Former Employee
          - Customer
          - Former Customer
          - Partner
          - Vendor
          - Other
        required: true
      - id: 4
        name: department
        label: Department (if employee)
        hint: Your department
        type: text
        options: []
        required: false
      - id: 5
        name: tenure
        label: How long have you been associated with the company?
        hint: Length of relationship
        type: select_one
        options:
          - Less than 6 months
          - 6 months - 1 year
          - 1-2 years
          - 2-5 years
          - 5-10 years
          - Over 10 years
        required: true
      - id: 6
        name: section_satisfaction
        label: -- Overall Satisfaction --
        hint: Rate your satisfaction
        type: note
        options: []
        required: false
      - id: 7
        name: overall_satisfaction
        label: Overall, how satisfied are you with the company?
        hint: Overall rating
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 8
        name: would_recommend
        label: Would you recommend this company?
        hint: Recommendation
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Neutral
          - Probably Not
          - Definitely Not
        required: true
      - id: 9
        name: section_quality
        label: -- Quality Assessment --
        hint: Rate the quality
        type: note
        options: []
        required: false
      - id: 10
        name: product_quality
        label: How would you rate the quality of products/services?
        hint: Quality rating
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
          - Not applicable
        required: true
      - id: 11
        name: value_for_money
        label: How would you rate the value for money?
        hint: Value rating
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
          - Not applicable
        required: false
      - id: 12
        name: section_service
        label: -- Service Assessment --
        hint: Rate the service
        type: note
        options: []
        required: false
      - id: 13
        name: customer_service
        label: How would you rate customer service?
        hint: Service rating
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
          - Not applicable
        required: false
      - id: 14
        name: responsiveness
        label: How would you rate responsiveness?
        hint: Responsiveness rating
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
          - Not applicable
        required: false
      - id: 15
        name: section_communication
        label: -- Communication --
        hint: Rate communication
        type: note
        options: []
        required: false
      - id: 16
        name: communication_clarity
        label: How clear is company communication?
        hint: Clarity rating
        type: select_one
        options:
          - Very Clear
          - Clear
          - Neutral
          - Unclear
          - Very Unclear
          - Not applicable
        required: false
      - id: 17
        name: communication_frequency
        label: Is the frequency of communication appropriate?
        hint: Frequency assessment
        type: select_one
        options:
          - Too little
          - Just right
          - Too much
          - Not applicable
        required: false
      - id: 18
        name: section_improvement
        label: -- Areas for Improvement --
        hint: What needs improvement
        type: note
        options: []
        required: false
      - id: 19
        name: improvement_areas
        label: What areas need improvement?
        hint: Select all that apply
        type: select_multiple
        options:
          - Product/Service quality
          - Pricing
          - Customer service
          - Communication
          - Delivery times
          - Website/Online experience
          - Return/Refund process
          - Technical support
          - Billing
          - Other
        required: false
      - id: 20
        name: improvement_details
        label: Please specify improvement areas
        hint: Details
        type: text
        options: []
        required: false
      - id: 21
        name: section_strengths
        label: -- Company Strengths --
        hint: What we do well
        type: note
        options: []
        required: false
      - id: 22
        name: company_strengths
        label: What does the company do well?
        hint: Strengths
        type: select_multiple
        options:
          - Product innovation
          - Quality
          - Customer service
          - Pricing
          - Brand reputation
          - Employee treatment
          - Social responsibility
          - Technology
          - Other
        required: false
      - id: 23
        name: strengths_details
        label: Please elaborate on strengths
        hint: Details
        type: text
        options: []
        required: false
      - id: 24
        name: section_feedback
        label: -- Additional Feedback --
        hint: Your comments
        type: note
        options: []
        required: false
      - id: 25
        name: biggest_challenge
        label: What is the biggest challenge you face with the company?
        hint: Main challenge
        type: text
        options: []
        required: false
      - id: 26
        name: suggestions
        label: What suggestions do you have for improvement?
        hint: Your ideas
        type: text
        options: []
        required: false
      - id: 27
        name: unmet_needs
        label: Are there any unmet needs you have?
        hint: Missing offerings
        type: text
        options: []
        required: false
      - id: 28
        name: section_future
        label: -- Future Outlook --
        hint: Your future with company
        type: note
        options: []
        required: false
      - id: 29
        name: continue_relationship
        label: Do you plan to continue your relationship with the company?
        hint: Future plans
        type: select_one
        options:
          - Yes, definitely
          - Probably
          - Unsure
          - Probably not
          - No
        required: false
      - id: 30
        name: future_expectations
        label: What are your expectations for the future?
        hint: Expectations
        type: text
        options: []
        required: false
      - id: 31
        name: additional_comments
        label: Any additional comments?
        hint: Your thoughts
        type: text
        options: []
        required: false
      - id: 32
        name: survey_date
        label: Survey Completion Date
        hint: Today's date
        type: date
        options: []
        required: true
