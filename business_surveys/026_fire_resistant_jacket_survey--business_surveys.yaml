inputSchema:
  type: object
  properties:
    title: fire_resistant_jacket_survey
    pages:
    - id: 1
      name: jacket_performance
      label: How would you rate the overall performance of this fire resistant jacket?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 2
      name: comfort_level
      label: How comfortable is this fire resistant jacket?
      hint: null
      type: select_one
      options:
      - Very comfortable
      - Somewhat comfortable
      - Not very comfortable
      - Not at all comfortable
      required: true
    - id: 3
      name: weight_rating
      label: How would you rate the weight of this fire resistant jacket?
      hint: null
      type: select_one
      options:
      - Very heavy
      - Somewhat heavy
      - Just right
      - Very light
      required: true
    - id: 4
      name: size
      label: What size is this fire resistant jacket?
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      - X-Large
      required: true
    - id: 5
      name: safety_rating
      label: How safe do you feel when wearing this fire resistant jacket?
      hint: null
      type: select_one
      options:
      - Very safe
      - Somewhat safe
      - Not very safe
      - Not at all safe
      required: true
    - id: 6
      name: value_for_money
      label: How would you rate the value for money of this fire resistant jacket?
      hint: null
      type: select_one
      options:
      - Very valuable
      - Somewhat valuable
      - Not very valuable
      - Not at all valuable
      required: false
    - id: 7
      name: would_recommend
      label: Would you recommend this fire resistant jacket to a colleague?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: manufacturer
      label: What is your preferred manufacturer of fire resistant jacket?
      hint: null
      type: select_multiple
      options:
      - 3M
      - Ansell
      - DuPont
      - H2O
      required: true
    - id: 9
      name: model_number
      label: What is the model number of the fire resistant jacket?
      hint: Enter the model number
      type: text
      options: []
      required: true
    - id: 10
      name: comments
      label: Do you have any comments about the fire resistant jacket?
      hint: null
      type: note
      options: []
      required: false
