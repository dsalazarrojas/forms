inputSchema:
  type: object
  properties:
    title: survey_on_space_planning
    pages:
    - id: 1
      name: introduction
      label: Please introduce yourself
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: space_usage
      label: How do you use your workspace?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 3
      name: satisfaction_level
      label: What is your satisfaction level with the current space planning?
      hint: null
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 4
      name: challenges_list
      label: What are the main challenges you face when using the available space?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: feedback
      label: Do you have any additional feedback?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: space_availability
      label: Is the available space sufficient for your needs?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: time_spent_in_workplace
      label: How many hours do you spend at work in a typical day?
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: suggestions_for_improvement
      label: Do you have any suggestions for improving the space planning?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: assigned_tool
      label: Are you assigned a tool for your task?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: form_id
      label: What is your form ID?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: category
      label: Which category do you belong to?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: form_version
      label: What is the current form version?
      hint: null
      type: text
      options: []
      required: true
