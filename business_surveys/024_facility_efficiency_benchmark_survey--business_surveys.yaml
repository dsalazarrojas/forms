inputSchema:
  type: object
  properties:
    title: Facility Efficiency Benchmark Survey
    pages:
    - id: 1
      name: facility_efficiency_benchmark_survey_1
      label: What is the primary use of the facility?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: facility_efficiency_benchmark_survey_2
      label: How many square feet is the facility?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: facility_efficiency_benchmark_survey_3
      label: How many employees work at the facility?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: facility_efficiency_benchmark_survey_4
      label: What is your facility's current energy consumption per square foot?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: facility_efficiency_benchmark_survey_5
      label: What is your facility's current water consumption per square foot?
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: facility_efficiency_benchmark_survey_6
