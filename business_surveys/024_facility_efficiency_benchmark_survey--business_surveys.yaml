      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: facility_efficiency_benchmark_survey_9
      label: What are the major obstacles to achieving energy efficiency?
      hint: null
      type: select_multiple
      options:
      - Financial constraints
      - Technical challenges
      - Lack of data
      - Lack of personnel
      - Other
      - Not sure yet
      required: true
    - id: 10
      name: facility_efficiency_benchmark_survey_10
      label: What are your plans for improving energy efficiency?
      hint: null
      type: text
      options: []
      required: false
