inputSchema:
  type: object
  properties:
    title: Process Automation Insight Survey
    pages:
    - id: 1
      name: workflow_goal
      label: What is the primary goal of your workflow?
      hint: Please describe the main objective of your workflow.
      type: text
      options: []
      required: true
    - id: 2
      name: number_of_workflows
      label: How many workflows do you have?
      hint: Please provide the number of workflows.
      type: number
      options: []
      required: true
    - id: 3
      name: tools_used
      label: Which tools are you currently using for your workflows?
      hint: Please list the tools used.
      type: select_multiple
      options:
      - Zapier
      - Automata
      - Other
      required: true
    - id: 4
      name: benefit_of_automation
      label: What is the primary benefit of your automated workflows?
      hint: Please describe the main advantage.
      type: select_one
      options:
      - Increased efficiency
      - Improved accuracy
      - Other
      required: true
    - id: 5
      name: survey_schedule
      label: On what schedule is this survey expected to be completed?
      hint: Please provide the expected completion time.
      type: select_one
      options:
      - ASAP
      - Within a few days
      - Within a week
      required: true
    - id: 6
      name: survey_time
      label: What would be the best time to conduct this survey according to your
        perspective?
      hint: Please provide the best time.
      type: select_one
      options:
      - Now
      - Later today
      - Tomorrow
      required: true
    - id: 7
      name: similar_surveys
      label: Have you conducted similar surveys in the past?
      hint: Please answer yes or no.
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: recent_survey_url
      label: What is the URL of the survey you have conducted most recently?
      hint: Please provide the URL.
      type: text
      options: []
      required: true
    - id: 9
      name: participate_in_future
      label: Do you want to participate in future surveys?
      hint: Please answer yes or no.
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: comments
      label: Do you have any comments or suggestions?
      hint: Please provide any additional comments.
      type: text
      options: []
      required: false
    - id: 11
      name: contact
      label: What is your contact email address?
      hint: Please provide your email address.
      type: email
      options: []
      required: true
    - id: 12
      name: follow_up_question_1
      label: Follow-up question 1
      hint: Please answer according to your understanding.
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: contact_answer
      label: What is your contact information?
      hint: Please provide any additional contact information.
      type: text
      options: []
      required: false
