      - id: 5
        name: job_title
        label: Job Title
        hint: Your position
        type: text
        options: []
        required: true
      - id: 6
        name: years_experience
        label: Years in Construction
        hint: Total experience
        type: select_one
        options:
          - Less than 5 years
          - 5 to 10 years
          - 11 to 20 years
          - More than 20 years
        required: true
      - id: 7
        name: company_size
