inputSchema:
  type: object
  properties:
    title: Barber Staff Motivation Survey
    pages:
      - id: 1
        name: introductory_note
        label: We Value Your Feedback
        hint: This survey is designed to help us make this shop a better place for you to work. Your responses are confidential.
        type: note
        options: []
        required: false
      - id: 2
        name: tenure_in_shop
        label: How long have you been with this shop?
        hint: null
        type: select_one
        options:
          - Less than 6 months
          - 6-12 months
          - 1-3 years
          - 3+ years
        required: true
      - id: 3
        name: motivation_factors_header
        label: -- Motivation and Satisfaction --
        hint: Please rate your agreement with the following statements
        type: note
        options: []
        required: false
      - id: 4
        name: feel_valued
        label: I feel valued and appreciated by the management
        hint: null
        type: select_one
        options:
          - Strongly Disagree
          - Disagree
          - Neutral
          - Agree
          - Strongly Agree
        required: true
      - id: 5
        name: morale_rating
        label: How would you describe the current morale in the shop?
        hint: null
        type: select_one
        options:
          - Very Low
          - Low
          - Average
          - High
          - Very High
        required: true
      - id: 6
        name: work_environment_header
        label: -- Work Environment and Culture --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: team_support
        label: My fellow barbers are supportive and professional
        hint: null
        type: select_one
        options:
          - Strongly Disagree
          - Disagree
          - Neutral
          - Agree
          - Strongly Agree
        required: true
      - id: 8
        name: work_life_balance
        label: The shop schedule allows for a good work-life balance
        hint: null
        type: select_one
        options:
          - Strongly Disagree
          - Disagree
          - Neutral
          - Agree
          - Strongly Agree
        required: true
      - id: 9
        name: equipment_quality
        label: I am satisfied with the tools and equipment provided by the shop
        hint: Only if provided - skip if you use 100% own tools
        type: select_one
        options:
          - Strongly Disagree
          - Disagree
          - Neutral
          - Agree
          - Strongly Agree
          - N/A
        required: true
      - id: 10
        name: compensation_header
        label: -- Compensation and Benefits --
        hint: null
        type: note
        options: []
        required: false
      - id: 11
        name: pay_fairness
        label: I believe my current pay/commission structure is fair
        hint: null
        type: select_one
        options:
          - Strongly Disagree
          - Disagree
          - Neutral
          - Agree
          - Strongly Agree
        required: true
      - id: 12
        name: tip_policy_satisfaction
        label: Are you satisfied with the shop's tip handling policy?
        hint: null
        type: select_one
        options:
          - Yes
          - No
          - Neutral
        required: true
      - id: 13
        name: growth_opportunities
        label: I feel there are opportunities to increase my earnings here
        hint: null
        type: select_one
        options:
          - Strongly Disagree
          - Disagree
          - Neutral
          - Agree
          - Strongly Agree
        required: true
      - id: 14
        name: professional_development_header
        label: -- Professional Growth --
        hint: null
        type: note
        options: []
        required: false
      - id: 15
        name: training_interest
        label: What kind of training would motivate you most?
        hint: Select all that apply
        type: select_multiple
        options:
          - Advanced Cutting Techniques (Masterclass)
          - Business and Marketing Skills
          - Customer Service Excellence
          - Product Knowledge and Sales
          - Shop Management Training
        required: true
      - id: 16
        name: shop_improvement_idea
        label: If you could change one thing to improve the shop culture, what would it be?
        hint: null
        type: text
        options: []
        required: false
      - id: 17
        name: likelihood_to_stay
        label: How likely are you to be working here a year from now?
        hint: null
        type: select_one
        options:
          - Very Unlikely
          - Unlikely
          - Likely
          - Very Likely
        required: true
      - id: 18
        name: additional_comments
        label: Any other comments or concerns you'd like to share?
        hint: null
        type: text
        options: []
        required: false
      - id: 19
        name: survey_date
        label: Date of Submission
        hint: null
        type: date
        options: []
        required: true
