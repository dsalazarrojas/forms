inputSchema:
  type: object
  properties:
    title: Traveling Preferences Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: travel_frequency
      label: Traveling Frequency
      hint: null
      type: select_one
      options:
      - Often
      - Occasionally
      - Rarely
      required: true
    - id: 3
      name: destination_type
      label: Destination Type
      hint: null
      type: select_one
      options:
      - Beaches
      - Cities
      - Nature reserves
      required: true
    - id: 4
      name: transportation
      label: Mode of Transportation
      hint: null
      type: select_one
      options:
      - Air
      - Land
      - Sea
      required: true
    - id: 5
      name: budget
      label: Budget
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 6
      name: accommodation
      label: Type of Accommodation
      hint: null
      type: select_one
      options:
      - Hotel
      - Hostel
      - Airbnb
      required: true
    - id: 7
      name: travel_comfort
      label: Comfort Level
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 8
      name: conclusion
      label: Conclusion
      hint: null
      type: text
      options: []
      required: false
