inputSchema:
  type: object
  properties:
    title: Advisory Partnership Evaluation Survey
    pages:
    - id: 1
      name: partnership_info_header
      label: -- Partnership Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: partner_name
      label: Partner Organization Name
      hint: Who are you evaluating?
      type: text
      options: []
      required: true
    - id: 3
      name: evaluator_role
      label: Your Role
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: partnership_duration
      label: Duration of Partnership
      hint: null
      type: select_one
      options:
      - Less than 6 months
      - 6-12 months
      - 1-3 years
      - Over 3 years
      required: true
    - id: 5
      name: performance_header
      label: -- Performance Evaluation --
      hint: Rate the following aspects.
      type: note
      options: []
      required: false
    - id: 6
      name: communication_effectiveness
      label: Communication Effectiveness
      hint: Was communication timely and clear?
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 7
      name: goal_alignment
      label: Alignment with Goals
      hint: Did the partnership meet shared objectives?
      type: select_one
      options:
      - Completely Aligned
      - Mostly Aligned
      - Somewhat Aligned
      - Misaligned
      required: true
    - id: 8
      name: value_delivery
      label: Value Delivered
      hint: Did the partner provide the expected value?
      type: select_one
      options:
      - Exceeded Expectations
      - Met Expectations
      - Below Expectations
      required: true
    - id: 9
      name: responsiveness
      label: Responsiveness to Issues
      hint: How well were problems handled?
      type: select_one
      options:
      - Very Responsive
      - Responsive
      - Slow to Respond
      - Unresponsive
      required: true
    - id: 10
      name: future_intent_header
      label: -- Future Intent --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: renew_partnership
      label: Likelihood to Renew Partnership
      hint: Would you work with them again?
      type: select_one
      options:
      - Definitely
      - Probably
      - Unsure
      - Probably Not
      - Definitely Not
      required: true
    - id: 12
      name: open_feedback
      label: Additional Comments
      hint: Any specific strengths or areas for improvement?
      type: text
      options: []
      required: false
