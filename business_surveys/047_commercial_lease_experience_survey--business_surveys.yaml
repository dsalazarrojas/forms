inputSchema:
  type: object
  properties:
    title: Commercial Lease Experience Survey
    pages:
    - id: 1
      name: respondent_name
      label: Respondent Name
      hint: Your name - optional
      type: text
      options: []
      required: false
    - id: 2
      name: company_name
      label: Company Name
      hint: Your business name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: For survey follow-up
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 5
      name: section_header_lease_info
      label: -- Lease Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: property_address
      label: Leased Property Address
      hint: Address of leased space
      type: text
      options: []
      required: true
    - id: 7
      name: lease_start_date
      label: Lease Start Date
      hint: When did lease begin
      type: date
      options: []
      required: true
    - id: 8
      name: lease_duration
      label: Lease Duration
      hint: Length of lease
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - 10+ years
      required: true
    - id: 9
      name: space_type
      label: Type of Space
      hint: What type of commercial space
      type: select_one
      options:
      - Office
      - Retail
      - Warehouse
      - Industrial
      - Restaurant
      - Medical
      - Mixed Use
      required: true
    - id: 10
      name: square_footage
      label: Square Footage
      hint: Size of leased space
      type: number
      options: []
      required: true
    - id: 11
      name: section_header_landlord_rating
      label: -- Landlord Rating --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: overall_landlord_rating
      label: Overall Landlord Rating
      hint: Rate your landlord
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 13
      name: responsiveness
      label: Landlord Responsiveness
      hint: Rate response time
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 14
      name: maintenance_handling
      label: Maintenance Handling
      hint: Rate maintenance response
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 15
      name: communication
      label: Communication Quality
      hint: Rate communication
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 16
      name: section_header_property_condition
      label: -- Property Condition --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: initial_condition
      label: Initial Property Condition
      hint: Condition at move-in
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 18
      name: current_condition
      label: Current Property Condition
      hint: Current condition
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 19
      name: building_amenities
      label: Building Amenities
      hint: Rate amenities
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 20
      name: parking_facilities
      label: Parking Facilities
      hint: Rate parking
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 21
      name: section_header_lease_terms
      label: -- Lease Terms --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: rent_value
      label: Rent Value
      hint: Is rent fair for the space
      type: select_one
      options:
      - Excellent Value
      - Good Value
      - Fair Value
      - Poor Value
      - Very Poor Value
      required: true
    - id: 23
      name: lease_flexibility
      label: Lease Flexibility
      hint: Rate lease terms flexibility
      type: select_one
      options:
      - Very Flexible
      - Flexible
      - Neutral
      - Inflexible
      - Very Inflexible
      required: true
    - id: 24
      name: renewal_terms
      label: Renewal Terms
      hint: Are renewal terms fair
      type: select_one
      options:
      - Very Fair
      - Fair
      - Neutral
      - Unfair
      - Very Unfair
      required: true
    - id: 25
      name: section_header_overall_experience
      label: -- Overall Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Rate overall experience
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 27
      name: would_renew
      label: Would You Renew Lease
      hint: Will you renew
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Not Sure
      - Probably No
      - Definitely No
      required: true
    - id: 28
      name: would_recommend
      label: Would You Recommend
      hint: Recommend to others
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Not Sure
      - Probably No
      - Definitely No
      required: true
    - id: 29
      name: best_aspect
      label: Best Aspect of Lease
      hint: What was best
      type: text
      options: []
      required: false
    - id: 30
      name: worst_aspect
      label: Worst Aspect of Lease
      hint: What was worst
      type: text
      options: []
      required: false
    - id: 31
      name: improvements_suggested
      label: Suggested Improvements
      hint: What could be improved
      type: text
      options: []
      required: false
    - id: 32
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
