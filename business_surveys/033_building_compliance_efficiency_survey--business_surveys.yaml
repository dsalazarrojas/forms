inputSchema:
  type: object
  properties:
    title: Building Compliance Efficiency Survey
    pages:
      - id: 1
        name: respondent_name
        label: Your Name
        hint: Full name
        type: text
        options: []
        required: false
      - id: 2
        name: department
        label: Department
        hint: Your department
        type: text
        options: []
        required: true
      - id: 3
        name: role
        label: Your Role
        hint: Job title
        type: text
        options: []
        required: true
      - id: 4
        name: email
        label: Email Address
        hint: Contact email
        type: email
        options: []
        required: true
      - id: 5
        name: survey_date
        label: Survey Date
        hint: Date of survey
        type: date
        options: []
        required: true
      - id: 6
        name: years_in_role
        label: Years in Current Role
        hint: Experience level
        type: select_one
        options:
