inputSchema:
  type: object
  properties:
    title: Treasury Satisfaction Benchmark Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: questions
      label: questions
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: question_1
      label: What is your current role in the treasury operations?
      hint: null
      type: select_multiple
      options:
      - Cash Management
      - Accounting
      - Risk Management
      required: false
    - id: 4
      name: question_2
      label: How satisfied are you with the current treasury operations?
      hint: null
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      required: false
    - id: 5
      name: question_3
      label: What is the primary reason for your level of satisfaction?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: question_4
      label: What do you think is the biggest challenge facing the treasury operations
        today?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: question_5
      label: Do you have any suggestions for improvement?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_information
      label: Is this feedback anonymous?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
