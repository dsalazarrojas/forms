inputSchema:
  type: object
  properties:
    title: Kandi Product Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: product_satisfaction
      label: How was your experience with our product?
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Very satisfied''}'
      - '{''id'': 2, ''label'': ''Satisfied''}'
      - '{''id'': 3, ''label'': ''Neutral''}'
      - '{''id'': 4, ''label'': ''Dissatisfied''}'
      - '{''id'': 5, ''label'': ''Very dissatisfied''}'
      required: false
    - id: 3
      name: product_improvement_ideas
      label: What improvement ideas do you have?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: issue_reports
      label: Do you have any issue reports?
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''label'': True}'
      - '{''id'': 2, ''label'': False}'
      required: false
    - id: 5
      name: email
      label: E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
