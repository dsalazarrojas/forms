inputSchema:
  type: object
  properties:
    title: Pharmaceutical Technology Survey
    pages:
    - id: 1
      name: introduction
      label: What is your role within the company
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: company_details
      label: company_size
      hint: null
      type: select_multiple
      options:
      - Small
      - Medium
      - Large
      - Other
      required: true
    - id: 3
      name: company_details_2
      label: company_type
      hint: null
      type: select_one
      options:
      - Pharmaceutical Company
      - Medical Device Company
      - Research Organization
      - Other
      required: true
    - id: 4
      name: technology_interests
      label: What technology areas are you most interested in
      hint: null
      type: select_multiple
      options:
      - Automation and Robotics
      - Artificial Intelligence
      - Blockchain
      - Data Science
      - Cloud Computing
      - Other
      required: true
    - id: 5
      name: adoption_levels
      label: On a scale of 0-10, what level of adoption do you have for each technology?
      hint: Enter a score between 0-10
      type: number
      options: []
      required: true
    - id: 6
      name: implementation_challenges
      label: Which of the following implementation challenges do you face when adopting
        new technology?
      hint: null
      type: select_multiple
      options:
      - Cost and ROI
      - Change Management
      - Security and Compliance
      - Training and Support
      - Other
      required: true
    - id: 7
      name: implementation_challenges_2
      label: Other implementation challenges
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: implementation_timeframe
      label: How long did it take to implement the technology?
      hint: null
      type: select_one
      options:
      - Less than 1 month
      - 1-3 months
      - 4-6 months
      - 7-12 months
      - More than 1 year
      required: true
    - id: 9
      name: implementation_timeframe_2
      label: What is the status of your current project or implementation?
      hint: null
      type: select_one
      options:
      - Not started
      - In Progress
      - Completed
      - On hold
      - Postponed
      required: true
    - id: 10
      name: industry_insights
      label: Would you like to share any industry insights or observations
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: industry_insights_2
