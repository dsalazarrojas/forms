inputSchema:
  type: object
  properties:
    title: Asset Survey
    pages:
      - id: 1
        name: surveyor_name
        label: Surveyor Name
        hint: Name of person conducting survey
        type: text
        options: []
        required: true
      - id: 2
        name: survey_date
        label: Survey Date
        hint: Date of this survey
        type: date
        options: []
        required: true
      - id: 3
        name: survey_location
        label: Survey Location
        hint: Physical location being surveyed
        type: text
        options: []
        required: true
      - id: 4
        name: facility_name
        label: Facility or Site Name
        hint: Name of facility
        type: text
        options: []
        required: true
      - id: 5
        name: department_or_area
        label: Department or Area
        hint: Which department/area?
        type: text
        options: []
        required: true
      - id: 6
        name: asset_id
        label: Asset ID Number
        hint: Unique identifier
        type: text
        options: []
        required: true
      - id: 7
        name: asset_name
        label: Asset Name
        hint: Name of the asset
        type: text
        options: []
        required: true
      - id: 8
        name: asset_description
        label: Asset Description
        hint: Detailed description
        type: text
        options: []
        required: true
      - id: 9
        name: asset_location_specific
        label: Specific Location of Asset
        hint: Exact location in facility
        type: text
        options: []
        required: true
      - id: 10
        name: asset_visible
        label: Is Asset Visible and Accessible?
        hint: Can you see and access it?
        type: select_one
        options:
          - "Yes"
          - "No"
          - Partially
        required: true
      - id: 11
        name: asset_condition
        label: Overall Condition
        hint: How is the asset?
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Damaged
        required: true
      - id: 12
        name: functionality_status
        label: Functionality Status
        hint: Is it working properly?
        type: select_one
        options:
          - Fully Functional
          - Partially Functional
          - Non-functional
          - Unknown
        required: true
      - id: 13
        name: maintenance_needed
        label: Maintenance or Repair Needed?
        hint: Does it need service?
        type: select_one
        options:
          - "No"
          - Minor Maintenance
          - Major Repair
          - Urgent Service
        required: true
      - id: 14
        name: maintenance_details
        label: Details of Maintenance Needed
        hint: What work is needed?
        type: text
        options: []
        required: false
      - id: 15
        name: asset_cleanliness
        label: Cleanliness Level
        hint: How clean is the asset?
        type: select_one
        options:
          - Clean
          - Moderate Dust/Dirt
          - Significant Dirt
          - Very Dirty
        required: true
      - id: 16
        name: safety_concerns
        label: Any Safety Concerns?
        hint: Are there hazards or issues?
        type: select_one
        options:
          - "No"
          - Minor Concern
          - Moderate Concern
          - Serious Safety Risk
        required: true
      - id: 17
        name: safety_details
        label: Safety Concerns Details
        hint: Describe the safety issues
        type: text
        options: []
        required: false
      - id: 18
        name: asset_missing_parts
        label: Missing or Damaged Components?
        hint: Are any parts missing or broken?
        type: text
        options: []
        required: false
      - id: 19
        name: last_inspection_date
        label: Last Inspection Date
        hint: When was this asset last inspected?
        type: date
        options: []
        required: false
      - id: 20
        name: next_inspection_due
        label: Next Inspection Due Date
        hint: Schedule next inspection
        type: date
        options: []
        required: false
      - id: 21
        name: responsible_person
        label: Person Responsible for Asset
        hint: Who manages this asset?
        type: text
        options: []
        required: true
      - id: 22
        name: asset_documentation
        label: Documentation Present
        hint: Manuals, warranty, etc. available?
        type: select_one
        options:
          - Complete
          - Partial
          - Missing
          - Not Applicable
        required: true
      - id: 23
        name: additional_observations
        label: Additional Observations
        hint: Any other relevant notes
        type: text
        options: []
        required: false
      - id: 24
        name: survey_completion_time
        label: Completion Time
        hint: What time was survey completed?
        type: time
        options: []
        required: false
