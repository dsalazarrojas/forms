inputSchema:
  type: object
  properties:
    title: Technology Implementation Experience Survey
    pages:
    - id: 1
      name: new_systems
      label: Technology Implementation Process
      hint: null
      type: select_one
      options:
      - Positive Experience
      - Negative Experience
      - Neutral
      required: false
    - id: 2
      name: new_systems_description
      label: How would you describe the new system
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: benefits
      label: What benefits did you gain from the implementation
      hint: null
      type: select_multiple
      options:
      - Financial
      - Increased Efficiency
      - Reduced Costs
      - Other (please specify)
      - Improved Productivity
      - Enhanced User Experience
      required: false
    - id: 4
      name: challenges
      label: What challenges did you face during the implementation
      hint: null
      type: select_multiple
      options:
      - Technical issues
      - User acceptance
      - Communication challenges
      - Other (please specify)
      required: false
    - id: 5
      name: technology_used
      label: Which technology was implemented
      hint: null
      type: select_one
      options:
      - Cloud Computing
      - Artificial Intelligence
      - Internet of Things (IoT)
      - Blockchain
      - Database Management
      - Cyber Security
      - Data Analytics
      - Other (please specify)
      required: false
    - id: 6
      name: project_leader
      label: Project Leader
      hint: null
      type: select_multiple
      options:
      - IT Director
      - Project Manager
      - Team Lead
      - Other (please specify)
      - Other
      required: false
    - id: 7
      name: team_size
      label: Number of team members involved
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: duration
      label: How long did it take to implement
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: future_plans
      label: Do you plan to use the same technology again
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Undecided
      required: false
    - id: 10
      name: other_comments
      label: Any other comments
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: team_lead_comments
      label: Project Lead Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: system_name
      label: System Name
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: system_description
      label: System Description
      hint: null
      type: text
      options: []
      required: false
