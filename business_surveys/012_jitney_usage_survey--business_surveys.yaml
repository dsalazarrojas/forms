inputSchema:
  type: object
  properties:
    title: Jitney Usage Survey
    pages:
    - id: 1
      name: jitney_usage_survey_page_1
      label: Jitney Usage Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: usage_frequency
      label: How often do you use jitney services?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: satisfaction_rating
      label: How satisfied are you with your latest jitney trip?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 4
      name: service_level_of_service
      label: What service level of service did you experience?
      hint: null
      type: select_multiple
      options:
      - On Time
      - Late
      - Cancelled
      required: false
    - id: 5
      name: vehicle_condition
      label: What was the condition of the jitney vehicle?
      hint: null
      type: select_multiple
      options:
      - Clean
      - Dirty
      - Damaged
      required: false
    - id: 6
      name: communication_level
      label: What was the level of communication from the jitney provider?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 7
      name: vehicle_rating
      label: How would you rate your overall experience with jitney services?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: jitney_service_rating
      label: How would you rate your overall experience with jitney services?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 9
      name: jitney_service_improvement
      label: Is there anything that you would like to see improved?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: additional_comments
      label: Do you have any other comments about your jitney experience?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: email
      label: E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
