inputSchema:
  type: object
  properties:
    title: Client Clocking System Survey
    pages:
    - id: 1
      name: survey_intro
      label: -- Clocking System Feedback Survey --
      hint: We want to hear about your experience using our time-tracking system.
      type: note
      options: []
      required: false
    - id: 2
      name: client_company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: clocking_method
      label: Which clocking method do you primarily use?
      hint: null
      type: select_one
      options:
      - Biometric (Fingerprint/Face)
      - RFID / ID Badge
      - Mobile App (GPS)
      - Web Dashboard
      - Desktop App
      required: true
    - id: 4
      name: usability_header
      label: -- System Usability --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: ease_of_use_rating
      label: How easy is it to clock in and out?
      hint: 1 (Very Difficult) to 5 (Very Easy)
      type: number
      options: []
      required: true
    - id: 6
      name: system_reliability
      label: How often do you experience system downtime or errors?
      hint: null
      type: select_one
      options:
      - Never
      - Rarely
      - Monthly
      - Weekly
      - Frequently
      required: true
    - id: 7
      name: mobile_app_experience
      label: If using the mobile app, rate your experience
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - N/A
      required: false
    - id: 8
      name: tech_support_satisfaction
      label: Satisfaction with Technical Support (if used)
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      - N/A
      required: false
    - id: 9
      name: report_generation_ease
      label: How easy is it to review your logs or generate reports?
      hint: null
      type: select_one
      options:
      - Very Easy
      - Easy
      - Moderate
      - Difficult
      required: true
    - id: 10
      name: accuracy_perception
      label: Do you feel the system accurately records your hours?
      hint: null
      type: select_one
      options:
      - Yes, always
      - Mostly accurate
      - Occasional discrepancies
      - Inaccurate
      required: true
    - id: 11
      name: features_header
      label: -- Features and Improvements --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: missing_features
      label: What features are missing from our system?
      hint: e.g. Scheduling, Leave Management, Offline mode
      type: text
      options: []
      required: false
    - id: 13
      name: overall_value_rating
      label: Overall value of the system to your organization
      hint: 1 (Poor) to 10 (Excellent)
      type: number
      options: []
      required: true
    - id: 14
      name: additional_feedback
      label: Any other comments or suggestions for improvement?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: survey_respondent_role
      label: Your Role (e.g. Employee, Manager, Admin)
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: respondent_email
      label: Email Address (Optional)
      hint: For follow-up on your feedback
      type: email
      options: []
      required: false
    - id: 17
      name: survey_footer
      label: -- Thank you for your feedback --
      hint: We use this data to improve our system for everyone.
      type: note
      options: []
      required: false
    - id: 18
      name: survey_date
      label: Date of Response
      hint: null
      type: date
      options: []
      required: false
