inputSchema:
  type: object
  properties:
    title: Pros And Cons Evaluation Form
    pages:
    - id: 1
      name: pros
      label: What are the key pros of the product/service?
      hint: Please provide a brief description of the key benefits of the product/service.
      type: text
      options: []
      required: true
    - id: 2
      name: cons
      label: What are the key cons of the product/service?
      hint: Please provide a brief description of the product/service's drawbacks.
      type: text
      options: []
      required: true
    - id: 3
      name: frequency
      label: How often do you think you will use this product/service?
      hint: Please select a frequency of use.
      type: select_one
      options:
      - Once
      - Occasionally
      - Frequently
      - Almost always
      - Never
      required: true
    - id: 4
      name: value_for_money
      label: What is your opinion about the value for money of the product/service?
      hint: Please select your opinion.
      type: select_one
      options:
      - Very good value
      - Somewhat good value
      - Neutral
      - Somewhat bad value
      - Very bad value
      required: true
    - id: 5
      name: recommendation
      label: Would you recommend this product/service to others?
      hint: Please select yes or no.
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: will_use_again
      label: Would you choose this product/service again?
      hint: Please select yes or no.
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: comments
      label: Additional comments or feedback?
      hint: Please provide any additional comments or feedback.
      type: text
      options: []
      required: false
    - id: 8
      name: comments2
      label: Do you have any other comments or feedback?
      hint: Please provide any other comments or feedback.
      type: text
      options: []
      required: false
    - id: 9
      name: comments3
      label: Comments3
      hint: Please provide any other comments or feedback.
      type: text
      options: []
      required: false
    - id: 10
      name: comments4
      label: Comments4
      hint: Please provide any other comments or feedback.
      type: text
      options: []
      required: false
    - id: 11
      name: comments5
      label: Comments5
      hint: Please provide any other comments or feedback.
      type: text
      options: []
      required: false
