inputSchema:
  type: object
  properties:
    title: Business Process Improvement Program Registration Form
    pages:
    - id: 1
      name: participant_name
      label: Full Name
      hint: Your complete name
      type: text
      options: []
      required: true
    - id: 2
      name: participant_email
      label: Email Address
      hint: Your email for program communication
      type: email
      options: []
      required: true
    - id: 3
      name: participant_phone
      label: Phone Number
      hint: Your contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: organization_name
      label: Organization Name
      hint: Name of your company or organization
      type: text
      options: []
      required: true
    - id: 5
      name: department
      label: Department
      hint: Your department or division
      type: text
      options: []
      required: false
    - id: 6
      name: job_title
      label: Job Title
      hint: Your position in the organization
      type: text
      options: []
      required: true
    - id: 7
      name: years_experience
      label: Years of Experience
      hint: In your current field
      type: number
      options: []
      required: false
    - id: 8
      name: improvement_area
      label: Area of Process Improvement Focus
      hint: Select the primary area you want to improve
      type: select_one
      options:
      - Production Efficiency
      - Quality Management
      - Cost Reduction
      - Customer Service
      - Supply Chain
      - Workflow Automation
      - Inventory Management
      required: true
    - id: 9
      name: current_challenges
      label: Current Process Challenges
      hint: Describe the main challenges you face
      type: text
      options: []
      required: true
    - id: 10
      name: improvement_goals
      label: Improvement Goals
      hint: What do you hope to achieve
      type: text
      options: []
      required: true
    - id: 11
      name: team_size
      label: Team Size Involved
      hint: Number of people in your improvement team
      type: number
      options: []
      required: false
    - id: 12
      name: program_participation_level
      label: Participation Level Preference
      hint: Select your preferred involvement level
      type: select_one
      options:
      - Full-time Participant
      - Part-time Participant
      - Observer/Learner
      - Advisor
      required: true
    - id: 13
      name: program_format
      label: Preferred Program Format
      hint: How would you like to participate
      type: select_multiple
      options:
      - In-person Workshop
      - Online Sessions
      - One-on-one Consulting
      - Group Training
      - Self-paced Learning
      required: true
    - id: 14
      name: budget_allocation
      label: Budget Allocated for Improvement
      hint: Total budget available for this project
      type: number
      options: []
      required: false
    - id: 15
      name: timeline
      label: Desired Timeline for Improvements
      hint: When do you want to implement changes
      type: select_one
      options:
      - Immediate (1-3 months)
      - Short-term (3-6 months)
      - Medium-term (6-12 months)
      - Long-term (12+ months)
      required: true
    - id: 16
      name: expected_outcomes
      label: Expected Outcomes
      hint: What specific results do you expect
      type: text
      options: []
      required: false
    - id: 17
      name: registration_date
      label: Registration Date
      hint: Date of program registration
      type: date
      options: []
      required: true
