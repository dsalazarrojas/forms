inputSchema:
  type: object
  properties:
    title: HR Reputatioin Perception Survey
    pages:
    - id: 1
      name: employee_values
      label: What aspects of HRs performance do you value most?
      hint: null
      type: select_multiple
      options:
      - Communication
      - Responsiveness
      - Leadership
      - Teamwork
      - Problem-solving
      - Organization
      - Time management
      - Other
      required: false
    - id: 2
      name: interactions_with_hr
      label: How many of you have had interactions with HR?
      hint: null
      type: select_one
      options:
      - Always
      - Sometimes
      - Rarely
      - Never
      required: false
    - id: 3
      name: positive_interactions
      label: How many of you have had positive interactions with HR?
      hint: null
      type: select_one
      options:
      - Always
      - Sometimes
      - Rarely
      - Never
      required: false
    - id: 4
      name: hr_responsiveness
      label: How would you rate HRs responsiveness?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: feedback_frequency
      label: How often do you receive feedback from HR?
      hint: null
      type: select_one
      options:
      - Always
      - Sometimes
      - Rarely
      - Never
      required: false
    - id: 6
      name: feedback_willingness
      label: How would you rate HRs willingness to listen to and act upon feedback?
      hint: null
      type: select_one
      options:
      - Highly
      - Somewhat
      - Neutral
      - Somewhat unhelpful
      - Not at all
      required: false
    - id: 7
      name: recommendation
      label: How likely are you to recommend HRs services to a colleague or friend?
      hint: null
      type: select_one
      options:
      - Very likely
      - Somewhat likely
      - Not likely
      - Not at all likely
      required: false
    - id: 8
      name: overall_rating
      label: Overall, how would you rate HRs performance and service?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
