inputSchema:
  type: object
  properties:
    title: Habilitation Program Satisfaction Survey
    pages:
    - id: 1
      name: overall_experience
      label: Overall Experience
      hint: null
      type: select_one
      options:
      - Very Good
      - Average
      - Poor
      required: true
    - id: 2
      name: facility_rating
      label: Facility Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: instructor_attitude
      label: Instructor Attitude
      hint: null
      type: select_one
      options:
      - Very Positive
      - Positive
      - Negative
      required: true
    - id: 4
      name: support_services
      label: Support Services
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Somewhat Good
      - Very Poor
      required: true
    - id: 5
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Not Satisfied
      required: true
    - id: 6
      name: facilities_quality
      label: Facilities Quality
      hint: null
      type: select_one
      options:
      - Very Good
      - Average
      - Poor
      required: true
    - id: 7
      name: instructor_support
      label: Instructor Support
      hint: null
      type: select_multiple
      options:
      - Very Helpful
      - Somewhat Helpful
      - Not Very Helpful
      required: true
    - id: 8
      name: program_location
      label: Program Location
      hint: null
      type: select_one
      options:
      - Very Good
      - Average
      - Very Poor
      required: true
    - id: 9
      name: program_attitude
      label: Program Attitude
      hint: null
      type: select_one
      options:
      - Very Positive
      - Positive
      - Negative
      required: true
    - id: 10
      name: instructor_availability
      label: Instructor Availability
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Somewhat Good
      - Very Poor
      required: true
