inputSchema:
  type: object
  properties:
    title: Business Profile Attributes Survey
    pages:
    - id: 1
      name: section_client_info
      label: -- Client Information --
      type: note
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: Individual or company name
      type: text
      required: true
    - id: 3
      name: client_type
      label: Client Type
      hint: Are you an individual or organization
      type: select_one
      options:
      - Individual
      - Small Business
      - Medium Business
      - Large Corporation
      - Non-Profit
      - Government
      - Other
      required: true
    - id: 4
      name: client_email
      label: Email Address
      hint: Primary contact email
      type: email
      required: true
    - id: 5
      name: client_phone
      label: Phone Number
      hint: Contact number
      type: text
      required: false
    - id: 6
      name: section_business_profile
      label: -- Business Profile --
      type: note
      required: false
    - id: 7
      name: business_name
      label: Business Name
      hint: Company or organization name
      type: text
      required: false
    - id: 8
      name: business_industry
      label: Industry or Sector
      hint: Primary business category
      type: text
      required: false
    - id: 9
      name: business_size
      label: Business Size
      hint: Number of employees
      type: select_one
      options:
      - Solo
      - 2-5
      - 6-20
      - 21-50
      - 51-100
      - 100+
      required: false
    - id: 10
      name: years_in_business
      label: Years in Business
      hint: How long has the business been operating
      type: number
      required: false
    - id: 11
      name: section_service_interests
      label: -- Service Interests --
      type: note
      required: false
    - id: 12
      name: interested_services
      label: Services or Products of Interest
      hint: What are you interested in
      type: select_multiple
      options:
      - Consulting
      - Technology Solutions
      - Marketing Services
      - Financial Services
      - Training Programs
      - Supply and Materials
      required: true
    - id: 13
      name: budget_range
      label: Estimated Budget Range
      hint: What is your spending capacity
      type: select_one
      options:
      - Under $1,000
      - $1,000 - $5,000
      - $5,000 - $10,000
      - $10,000 - $25,000
      - $25,000+
      required: false
    - id: 14
      name: decision_timeline
      label: Purchase Decision Timeline
      hint: When do you plan to decide
      type: select_one
      options:
      - Immediate
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - 12+ months
      - Still exploring
      required: false
    - id: 15
      name: section_preferences
      label: -- Preferences and Attributes --
      type: note
      required: false
    - id: 16
      name: preferred_communication
      label: Preferred Communication Method
      hint: How do you like to be contacted
      type: select_one
      options:
      - Email
      - Phone Call
      - Text Message
      - Video Call
      - In-Person Meeting
      required: false
    - id: 17
      name: decision_maker
      label: Decision-Making Role
      hint: Your role in purchasing decisions
      type: select_one
      options:
      - Final Decision Maker
      - Key Influencer
      - Information Gatherer
      - End User
      - Other
      required: true
    - id: 18
      name: company_location
      label: Company Location
      hint: City and state or country
      type: text
      required: false
    - id: 19
      name: website
      label: Website or Social Media
      hint: Your web presence
      type: text
      required: false
    - id: 20
      name: additional_info
      label: Additional Information
      hint: Anything else we should know
      type: text
      required: false
