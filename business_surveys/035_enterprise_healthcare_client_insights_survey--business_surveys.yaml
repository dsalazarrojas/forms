inputSchema:
  type: object
  properties:
    title: Enterprise Healthcare Client Insights Survey
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: client_email
      label: Client Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: client_satisfaction
      label: Client Satisfaction
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 5
      name: improvement_ideas
      label: Improvement Ideas
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: referral_intent
      label: Referral Intent
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: date_of_last_contact
      label: Date of Last Contact
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time_of_last_contact
      label: Time of Last Contact
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: service_decisions
      label: Service Decisions
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
