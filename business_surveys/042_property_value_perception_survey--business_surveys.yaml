inputSchema:
  type: object
  properties:
    title: Property Value Perception Survey
    pages:
    - id: 1
      name: property_visit_frequency
      label: How often do you visit this area?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: true
    - id: 2
      name: property_type
      label: Property Type
      hint: null
      type: select_one
      options:
      - House
      - Condo
      - Townhouse
      - Duplex
      required: true
    - id: 3
      name: public_transportation
      label: How would you rate the quality of local public transportation?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: area_features
      label: What do you like least about this area?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: valued_features
      label: What features do you value most in a property?
      hint: null
      type: select_multiple
      options:
      - Parks
      - Public transportation
      - Schools
      - Shopping
      - Safety
      - Proximity to work
      required: true
    - id: 6
      name: desired_amenities
      label: What amenities would you like to see in this area?
      hint: null
      type: select_multiple
      options:
      - Parks
      - Public transportation
      - Schools
      - Shopping
      - Restaurants
      - Gyms
      required: true
    - id: 7
      name: area_safety
      label: How would you rate the overall safety of this area?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: amenities_quality
      label: How would you rate the overall quality of local amenities in this area?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: parking_importance
      label: How important is the availability of parking to you in this area?
      hint: null
      type: select_one
      options:
      - Very important
      - Somewhat important
      - Not very important
      - Not at all important
      required: true
    - id: 10
      name: business_quality
      label: How would you rate the overall quality of local businesses in this area?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: developments_frequency
      label: How often do you think new developments/changes should be made in this
        area?
      hint: null
      type: select_one
      options:
      - Frequently
      - Occasionally
      - Rarely
      - Never
      required: true
    - id: 12
      name: sense_of_community
      label: How would you rate the overall sense of community in this area?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
