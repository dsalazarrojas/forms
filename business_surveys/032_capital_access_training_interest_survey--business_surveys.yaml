inputSchema:
  type: object
  properties:
    title: Capital Access Training Interest Survey
    pages:
    - id: 1
      name: intro_header
      label: -- Capital Access Training Survey --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: intro_text
      label: Help us design training programs that meet your needs. This survey gathers
        your preferences for capital access training topics and formats.
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: participant_info_header
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 5
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 6
      name: email_address
      label: Email Address
      hint: Your email
      type: email
      options: []
      required: true
    - id: 7
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 8
      name: business_info_header
      label: -- Business Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: business_name
      label: Business Name
      hint: Your business name
      type: text
      options: []
      required: true
    - id: 10
      name: business_stage
      label: Business Stage
      hint: Select one
      type: select_one
      options:
      - Startup (less than 1 year)
      - Early stage (1-3 years)
      - Growth stage (3-5 years)
      - Established (5+ years)
      - Other
      required: true
    - id: 11
      name: industry
      label: Industry or Sector
      hint: Your industry
      type: text
      options: []
      required: true
    - id: 12
      name: employee_count
      label: Number of Employees
      hint: Select range
      type: select_one
      options:
      - Self-employed
      - 2-5
      - 6-10
      - 11-20
      - 21-50
      - 50 plus
      required: true
    - id: 13
      name: annual_revenue
      label: Annual Revenue Range
      hint: Select one
      type: select_one
      options:
      - Less than 50K
      - 50K-100K
      - 100K-500K
      - 500K-1M
      - 1M-5M
      - 5M plus
      - Prefer not to say
      required: false
    - id: 14
      name: capital_needs_header
      label: -- Capital Needs and Goals --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: capital_needed
      label: Do you currently need capital?
      hint: Select one
      type: select_one
      options:
      - Yes, urgently
      - Yes, within 6 months
      - Maybe within a year
      - Planning future growth
      - Unsure
      required: true
    - id: 16
      name: capital_amount
      label: Approximate Amount Needed
      hint: Select range
      type: select_one
      options:
      - Less than 10K
      - 10K-50K
      - 50K-100K
      - 100K-500K
      - 500K plus
      - Unsure
      required: false
    - id: 17
      name: capital_purpose
      label: Capital Use Purpose
      hint: Select all that apply
      type: select_multiple
      options:
      - Working capital
      - Equipment purchase
      - Inventory
      - Real estate
      - Expansion
      - Debt repayment
      - Marketing
      - Technology
      - Payroll
      - Other
      required: false
    - id: 18
      name: training_topics_header
      label: -- Training Topics Interest --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: topics_of_interest
      label: Which capital access topics interest you?
      hint: Select all that apply
      type: select_multiple
      options:
      - Bank financing
      - Small business loans
      - SBA loans
      - Venture capital
      - Angel investment
      - Grants and competitions
      - Crowdfunding
      - Microfinance
      - Equipment financing
      - Line of credit
      - Alternative lending
      - Financial planning
      - Business planning
      - Credit building
      required: true
    - id: 20
      name: skill_level_header
      label: -- Current Skill Level --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: financing_knowledge
      label: Current Knowledge of Financing Options
      hint: Rate level
      type: select_one
      options:
      - Beginner - No knowledge
      - Basic - Some awareness
      - Intermediate - Familiar with options
      - Advanced - Experienced
      required: true
    - id: 22
      name: business_plan_status
      label: Business Plan Status
      hint: Select one
      type: select_one
      options:
      - None
      - In progress
      - Preliminary
      - Complete
      - Professional version
      required: false
    - id: 23
      name: training_format_header
      label: -- Training Format Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: preferred_format
      label: Preferred Training Format
      hint: Select all that apply
      type: select_multiple
      options:
      - In-person workshop
      - Online webinar
      - Self-paced online course
      - One-on-one mentoring
      - Group coaching
      - Hybrid format
      - Virtual classroom
      required: true
    - id: 25
      name: time_commitment
      label: Available Time Commitment
      hint: Select one
      type: select_one
      options:
      - Half day workshop
      - Full day workshop
      - Multiple sessions (2-3 days)
      - Weekly sessions
      - Self-paced
      - Flexible
      required: true
    - id: 26
      name: preferred_day_time
      label: Preferred Day and Time
      hint: Select one
      type: select_one
      options:
      - Weekday mornings
      - Weekday afternoons
      - Weekday evenings
      - Weekend mornings
      - Weekend afternoons
      - Flexible
      required: false
    - id: 27
      name: language_preference
      label: Language Preference
      hint: Select one
      type: select_one
      options:
      - English
      - Spanish
      - Other language
      - Bilingual
      required: false
    - id: 28
      name: support_services_header
      label: -- Support Services Interest --
      hint: null
      type: note
      options: []
      required: false
    - id: 29
      name: additional_services
      label: Additional Services of Interest
      hint: Select all that apply
      type: select_multiple
      options:
      - Business plan assistance
      - Financial statement preparation
      - Application preparation
      - Credit coaching
      - Pitch preparation
      - Network/connections
      - Ongoing mentoring
      - No additional services
      required: false
    - id: 30
      name: feedback_header
      label: -- Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 31
      name: suggestions
      label: Suggestions for Training Topics
      hint: What else would help you
      type: text
      options: []
      required: false
    - id: 32
      name: follow_up
      label: May we contact you regarding this training program?
      hint: Select one
      type: select_one
      options:
      - Yes, contact me
      - No, thanks
      required: true
