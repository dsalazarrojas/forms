inputSchema:
  type: object
  properties:
    title: International Buyer Return Policy Survey
    pages:
    - id: 1
      name: return_clarity
      label: How clear is the return policy on your website?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: return_challenges
      label: What challenges do you face when returning items?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: return_satisfaction
      label: How satisfied are you with the return process?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: return_frequency
      label: How often do you return items?
      hint: Select all that apply
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      - Option 5
      required: false
    - id: 5
      name: return_satisfaction_frequency
      label: How satisfied are you with the return frequency?
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: return_satisfaction_process
      label: How satisfied are you with the return process?
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: global_return_satisfaction
      label: How satisfied are you with return experiences globally?
      hint: Select one of the options above
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: false
    - id: 8
      name: return_process_clarity
      label: How clear is the return process for global returns?
      hint: null
      type: text
      options: []
      required: false
