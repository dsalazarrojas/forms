inputSchema:
  type: object
  properties:
    title: Building Permit Process Feedback Survey
    pages:
    - id: 1
      name: survey_date
      label: Survey Date
      hint: When completing this survey
      type: date
      options: []
      required: true
    - id: 2
      name: applicant_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: applicant_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: applicant_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 5
      name: company_name
      label: Company or Organization
      hint: Your business or organization
      type: text
      options: []
      required: false
    - id: 6
      name: permit_type
      label: Type of Permit Applied For
      hint: What permit did you obtain
      type: select_one
      options:
      - Building Construction
      - Renovation or Remodeling
      - Electrical
      - Plumbing
      - HVAC
      - Sign
      - Demolition
      - Other
      required: true
    - id: 7
      name: municipality
      label: Municipality or Jurisdiction
      hint: Where the permit was issued
      type: text
      options: []
      required: true
    - id: 8
      name: application_date
      label: Permit Application Date
      hint: When you applied
      type: date
      options: []
      required: false
    - id: 9
      name: permit_issuance_date
      label: Permit Issuance Date
      hint: When you received the permit
      type: date
      options: []
      required: false
    - id: 10
      name: application_process_ease
      label: Ease of Submitting Application
      hint: How easy was the process
      type: select_one
      options:
      - Very Easy
      - Easy
      - Neutral
      - Difficult
      - Very Difficult
      required: true
    - id: 11
      name: application_instructions
      label: Clarity of Application Instructions
      hint: Were instructions clear
      type: select_one
      options:
      - Very Clear
      - Clear
      - Somewhat Clear
      - Unclear
      - Very Unclear
      required: true
    - id: 12
      name: documentation_requirements
      label: Documentation Requirements Were Clear
      hint: Did you know what documents to provide
      type: select_one
      options:
      - Completely Clear
      - Mostly Clear
      - Somewhat Clear
      - Unclear
      - Very Unclear
      required: true
    - id: 13
      name: online_submission
      label: Online Submission System Quality
      hint: If applicable, quality of online system
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not Available
      required: false
    - id: 14
      name: staff_helpfulness
      label: Helpfulness of Permit Staff
      hint: How helpful were the staff
      type: select_one
      options:
      - Very Helpful
      - Helpful
      - Neutral
      - Unhelpful
      - Very Unhelpful
      required: true
    - id: 15
      name: response_time
      label: Response Time to Permit Application
      hint: How quickly did they respond
      type: select_one
      options:
      - Same Day
      - 1-3 Days
      - 1 Week
      - 2 Weeks
      - 1 Month
      - Over 1 Month
      required: true
    - id: 16
      name: approval_speed
      label: Overall Speed of Permit Approval
      hint: Was the process timely
      type: select_one
      options:
      - Very Fast
      - Fast
      - Neutral
      - Slow
      - Very Slow
      required: true
    - id: 17
      name: revision_requests
      label: Were Revision Requests Clear and Reasonable
      hint: If you had revisions
      type: select_one
      options:
      - Yes, Very Clear
      - Mostly Clear
      - Somewhat Clear
      - Unclear
      - Not Applicable
      required: false
    - id: 18
      name: costs_transparent
      label: Fee Costs Were Transparent and Fair
      hint: Were permit costs clear
      type: select_one
      options:
      - Very Fair
      - Fair
      - Somewhat Fair
      - Unfair
      - Very Unfair
      required: true
    - id: 19
      name: hidden_requirements
      label: Were There Hidden or Unexpected Requirements
      hint: Surprise requirements
      type: select_one
      options:
      - Yes, Many
      - Some
      - Few
      - None
      required: true
    - id: 20
      name: improvement_suggestions
      label: Suggestions for Process Improvement
      hint: What could be better
      type: text
      options: []
      required: false
    - id: 21
      name: overall_satisfaction
      label: Overall Satisfaction With Permit Process
      hint: General satisfaction
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
