inputSchema:
  type: object
  properties:
    title: Tax Document Submission Experience Survey
    pages:
    - id: 1
      name: submission_process
      label: What is your tax document submission process like?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: submission_method
      label: What method do you use to submit tax documents?
      hint: null
      type: select_multiple
      options:
      - Upload
      - Manual entry
      - Automated processing
      required: true
    - id: 3
      name: document_format
      label: What format do you usually submit tax documents in?
      hint: null
      type: select_multiple
      options:
      - CSV
      - Excel
      - PDF
      - JSON
      required: true
    - id: 4
      name: submission_frequency
      label: How often do you submit tax documents?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Rarely
      required: true
    - id: 5
      name: submission_success
      label: How often do you experience successful submission?
      hint: null
      type: select_one
      options:
      - Never
      - Rarely
      - Occasionally
      - Frequently
      - Always
      required: true
