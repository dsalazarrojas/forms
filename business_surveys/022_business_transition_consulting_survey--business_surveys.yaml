inputSchema:
  type: object
  properties:
    title: Business Transition Consulting Survey
    pages:
    - id: 1
      name: respondent_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: respondent_email
      label: Email Address
      hint: Your contact email
      type: email
      options: []
      required: true
    - id: 3
      name: company_name
      label: Company or Organization Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: respondent_role
      label: Your Role
      hint: Current position in the organization
      type: text
      options: []
      required: true
    - id: 5
      name: years_with_company
      label: How Long Have You Been With This Company?
      hint: In years
      type: number
      options: []
      required: false
    - id: 6
      name: years_in_industry
      label: Years of Experience in This Industry
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: transition_type
      label: Type of Business Transition
      hint: What kind of transition is planned?
      type: select_one
      options:
      - Ownership succession or sale
      - Leadership transition or retirement
      - Merger or acquisition
      - Restructuring
      - Expansion
      - Market pivot
      - Other transition
      required: true
    - id: 8
      name: transition_timeline
      label: Transition Timeline
      hint: When is the transition expected?
      type: select_one
      options:
      - Immediate - within 3 months
      - Near-term - 3-6 months
      - Medium-term - 6-12 months
      - Long-term - 1-3 years
      - Undetermined
      required: true
    - id: 9
      name: transition_readiness
      label: Current Readiness for Transition
      hint: How prepared is the organization?
      type: select_one
      options:
      - Very prepared
      - Mostly prepared
      - Somewhat prepared
      - Not very prepared
      - Not prepared
      required: true
    - id: 10
      name: key_challenges
      label: Key Challenges You Anticipate
      hint: Select all that apply
      type: select_multiple
      options:
      - Finding qualified successor
      - Knowledge transfer
      - Team retention
      - Financial planning
      - Customer retention
      - Maintaining continuity
      - Change management
      - Regulatory requirements
      required: true
    - id: 11
      name: key_strengths
      label: Company Strengths That Will Aid Transition
      hint: Select all that apply
      type: select_multiple
      options:
      - Strong leadership team
      - Documented processes
      - Stable customer base
      - Financial stability
      - Positive culture
      - Modern technology
      - Experienced staff
      - Clear strategic vision
      required: true
    - id: 12
      name: financial_condition
      label: Current Financial Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Needs improvement
      required: true
    - id: 13
      name: documentation_status
      label: Documentation and Systems Status
      hint: null
      type: select_one
      options:
      - Well documented
      - Mostly documented
      - Partially documented
      - Poorly documented
      - Not documented
      required: true
    - id: 14
      name: knowledge_transfer_plan
      label: Do you have a knowledge transfer plan?
      hint: null
      type: select_one
      options:
      - Yes, comprehensive plan
      - Yes, basic plan
      - No plan yet
      - In development
      required: true
    - id: 15
      name: succession_plan_status
      label: Succession Plan Status
      hint: null
      type: select_one
      options:
      - Formal plan in place
      - Informal understanding
      - Under development
      - Not yet addressed
      required: true
    - id: 16
      name: stakeholder_readiness
      label: Stakeholder Readiness for Change
      hint: How ready are key stakeholders?
      type: select_one
      options:
      - Very ready
      - Ready
      - Somewhat ready
      - Not very ready
      - Resistant
      required: true
    - id: 17
      name: external_support_needed
      label: External Support and Consulting Needed
      hint: Select all that apply
      type: select_multiple
      options:
      - Strategic planning
      - Financial advisory
      - Legal consultation
      - Change management
      - Leadership coaching
      - Market analysis
      - Operations optimization
      - HR and talent management
      required: true
    - id: 18
      name: communication_plan
      label: Communication Strategy for Transition
      hint: How will you communicate the changes?
      type: text
      options: []
      required: false
    - id: 19
      name: success_factors
      label: What Will Define Success?
      hint: Your vision for a successful transition
      type: text
      options: []
      required: true
    - id: 20
      name: additional_concerns
      label: Additional Concerns or Questions
      hint: null
      type: text
      options: []
      required: false
