inputSchema:
  type: object
  properties:
    title: AI Knowledge Extraction Survey
    pages:
    - id: 1
      name: respondent_details_header
      label: '--- Respondent Information ---'
      hint: Help us understand your role and context.
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: job_role
      label: Job Role / Title
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Engineering / IT
      - Legal & Compliance
      - Human Resources
      - Sales & Marketing
      - Operations
      - Customer Support
      required: true
    - id: 5
      name: knowledge_sources_header
      label: '--- Current Knowledge Landscape ---'
      hint: Where is information currently stored in your team?
      type: note
      options: []
      required: false
    - id: 6
      name: primary_knowledge_sources
      label: Primary Knowledge Sources
      hint: Select all that apply.
      type: select_multiple
      options:
      - Internal Wiki (Notion, Confluence, SharePoint)
      - Unstructured Documents (PDFs, Word, PPT)
      - Email Communications
      - Chat History (Slack, Teams)
      - Databases (SQL, NoSQL)
      - Tacit Knowledge (Subject Matter Experts)
      required: true
    - id: 7
      name: info_retrieval_challenges
      label: What are your biggest challenges in finding information?
      hint: null
      type: select_multiple
      options:
      - Too many different platforms
      - Search results are irrelevant
      - Information is outdated
      - Information is siloed (no access)
      - Lack of a centralized index
      required: true
    - id: 8
      name: time_spent_searching
      label: Average hours per week spent searching for internal information
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: ai_interest_header
      label: '--- AI Extraction Potential ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: ai_tool_interest_rating
      label: Interest in an AI-powered 'Knowledge Extraction' tool
      hint: 1 = Not interested, 5 = Highly interested
      type: number
      options: []
      required: true
    - id: 11
      name: desired_ai_features
      label: Which AI features would be most valuable to you?
      hint: Select all that apply.
      type: select_multiple
      options:
      - Automatic Summarization of long documents
      - Natural Language Q&A (Chat with your data)
      - Automatic Citation of source documents
      - Anomaly/Conflict Detection in info
      - Sentiment Analysis across knowledge base
      required: true
    - id: 12
      name: data_sensitivity_level
      label: Typical sensitivity of the data you handle
      hint: null
      type: select_one
      options:
      - Public / Low Sensitivity
      - Internal / Proprietary
      - Confidential / PII Included
      - Highly Restricted / Regulated (e.g., HIPAA/GDPR)
      required: true
    - id: 13
      name: potential_risks_concerns
      label: What are your primary concerns regarding AI knowledge extraction?
      hint: null
      type: select_multiple
      options:
      - Accuracy / 'Hallucinations'
      - Data Security / Leaks
      - Loss of Context
      - Complexity of setup
      required: false
    - id: 14
      name: use_case_description
      label: Describe a specific scenario where AI extraction would help you.
      hint: e.g., "Summarizing all past legal rulings on topic X"
      type: text
      options: []
      required: false
    - id: 15
      name: pilot_participation_intent
      label: Are you interested in participating in a pilot program for this technology?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe (Send more info)
      required: true
    - id: 16
      name: contact_email
      label: Email for follow-up
      hint: null
      type: email
      options: []
      required: false
    - id: 17
      name: survey_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
