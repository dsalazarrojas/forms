inputSchema:
  type: object
  properties:
    title: Compensation Satisfaction Drivers Survey
    pages:
    - id: 1
      name: survey_welcome
      label: Compensation Satisfaction Drivers Survey
      hint: Help us understand what drives your satisfaction
      type: note
      options: []
      required: false
    - id: 2
      name: employee_id
      label: Employee ID
      hint: Optional anonymous identifier
      type: number
      options: []
      required: false
    - id: 3
      name: department
      label: Department
      hint: Your department
      type: select_one
      options:
      - Human Resources
      - Finance
      - Marketing
      - Sales
      - Operations
      - IT
      - Customer Service
      - Legal
      - Research and Development
      - Other
      required: true
    - id: 4
      name: tenure
      label: Years with Company
      hint: How long have you worked here
      type: select_one
      options:
      - Less than 1 year
      - 1 to 3 years
      - 4 to 6 years
      - 7 to 10 years
      - More than 10 years
      required: true
    - id: 5
      name: job_level
      label: Job Level
      hint: Your current level
      type: select_one
      options:
      - Entry Level
      - Junior
      - Mid-Level
      - Senior
      - Lead or Principal
      - Manager
      - Director
      - Executive
      required: true
    - id: 6
      name: overall_satisfaction
      label: Overall compensation satisfaction
      hint: Rate your overall satisfaction
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: true
    - id: 7
      name: base_pay_importance
      label: Importance of base salary
      hint: How important is base pay to you
      type: select_one
      options:
      - Extremely important
      - Very important
      - Moderately important
      - Slightly important
      - Not important
      required: true
    - id: 8
