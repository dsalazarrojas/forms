inputSchema:
  type: object
  properties:
    title: Digital Access Survey
    pages:
    - id: 1
      name: household_type
      label: Household type
      hint: Select your household composition
      type: select_one
      options:
      - Single adult
      - Family with children
      - Shared housing
      - Other
      required: true
    - id: 2
      name: internet_access
      label: Internet access at home
      hint: Type of internet connection
      type: select_one
      options:
      - No access
      - Dial up
      - DSL
      - Cable
      - Fiber
      - Cellular data
      required: true
    - id: 3
      name: device_ownership
      label: Devices owned in household
      hint: Select all that apply
      type: select_multiple
      options:
      - Smartphone
      - Tablet
      - Laptop
      - Desktop
      - None
      required: true
    - id: 4
      name: data_limit_issues
      label: Data limit or affordability issues
      hint: Does data cost limit use
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: digital_skills_needs
      label: Areas where support is needed
      hint: Select topics where training is helpful
      type: select_multiple
      options:
      - Basic computing
      - Online safety and privacy
      - Job search tools
      - Remote learning support
      required: false
    - id: 6
      name: suggestions
      label: Suggestions to improve digital access
      hint: Open ended suggestions
      type: text
      options: []
      required: false
