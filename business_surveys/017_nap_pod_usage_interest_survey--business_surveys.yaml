inputSchema:
  type: object
  properties:
    title: Nap Pod Usage Interest Survey
    pages:
    - id: 1
      name: nap_pod_frequency
      label: How Often Do You Use Nap Pods
      hint: null
      type: select_one
      options:
      - Never
      - Less than once a month
      - 1-2 times a month
      - 1-2 times a week
      - Daily
      required: false
    - id: 2
      name: preferred_time_nap_pod_usage
      label: What Time Of Day Do You Prefer To Use Nap Pods
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: nap_pod_location
      label: Nap Pod Location
      hint: null
      type: select_one
      options:
      - On campus
      - Near my office
      - At home
      - In my backyard
      - In a park
      required: false
    - id: 4
      name: nap_pod_feedback
      label: How Do You Like The Nap Pods
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: nap_pod_suggestions
      label: Do You Have Any Feedback or Suggestions
      hint: null
      type: text
      options: []
      required: false
