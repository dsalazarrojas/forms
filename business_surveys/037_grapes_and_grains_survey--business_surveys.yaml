inputSchema:
  type: object
  properties:
    title: Grapes And Grains Survey
    pages:
    - id: 1
      name: survey_start_page
      label: Welcome to the survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: grapes
      label: What is your favorite type of grape?
      hint: Select one or more
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: grapes_preferred
      label: How often do you consume grapes?
      hint: Select one
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: grains
      label: What is your favorite type of grain?
      hint: Select one or more
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: grains_preferred
      label: How often do you consume grains?
      hint: Select one
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: beer
      label: What is your favorite type of beer?
      hint: Select one
      type: select_one
      options:
      - Lager
      - Ale
      - IPA
      - Stout
      required: true
    - id: 7
      name: wine
      label: What is your favorite type of wine?
      hint: Select one
      type: select_one
      options:
      - Red
      - White
      - Rosé
      - Sparkling
      required: true
    - id: 8
      name: date_of_birth
      label: Date of Birth
      hint: mm/dd/yyyy
      type: date
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: survey_end_page
      label: Survey complete
      hint: null
      type: note
      options: []
      required: false
