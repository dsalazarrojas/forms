      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 19
      name: form_page_10
      label: How often do you find yourself scrolling mindlessly through social media?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 20
      name: digital_detox_behavior_survey_business_surveys_question_20
      label: What is the main reason you think you use a screen most frequently?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
