      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 17
      name: form_page_9
      label: Do you think you will reduce your screen time in the next 6 months?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
