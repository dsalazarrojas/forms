inputSchema:
  type: object
  properties:
    title: Digital Detox Behavior Survey
    pages:
    - id: 1
      name: form_page_1
      label: Screen Time Habits
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: digital_detox_behavior_survey_business_surveys_question_1
      label: What is the average number of hours you spend on screens per day?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: form_page_2
      label: Readiness to Unplug
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: digital_detox_behavior_survey_business_surveys_question_2
      label: How often do you find yourself checking your phone during social events?
      hint: null
      type: select_multiple
      options:
      - Never
      - Occasionally
      - Frequently
      - Almost Always
      required: false
    - id: 5
      name: form_page_3
      label: How many hours do you think you can last without screens?
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: digital_detox_behavior_survey_business_surveys_question_3
      label: What time do you usually wake up?
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: form_page_4
      label: Do you feel anxious when you don't have your phone with you?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: digital_detox_behavior_survey_business_surveys_question_4
      label: What is your favorite app that you use most frequently?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: form_page_5
      label: Do you have any apps that you cannot live without?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: digital_detox_behavior_survey_business_surveys_question_10
      label: What time do you usually go to sleep?
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: form_page_6
      label: Do you feel FOMO (Fear of Missing Out) when you don't have your phone?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
