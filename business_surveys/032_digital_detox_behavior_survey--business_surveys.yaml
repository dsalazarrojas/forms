      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
    - id: 24
      name: digital_detox_behavior_survey_business_surveys_question_24
      label: Do you use screens during work/school hours?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 25
      name: form_page_13
      label: Do you feel FOMO (Fear of Missing Out) when you don't have your phone
        during work/school hours?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
