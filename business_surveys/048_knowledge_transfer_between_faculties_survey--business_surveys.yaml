inputSchema:
  type: object
  properties:
    title: knowledge_transfer_between_faculties_survey
    pages:
    - id: 1
      name: barriers
      label: What are the barriers to knowledge transfer between faculties?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: methods
      label: What are the methods of knowledge transfer between faculties?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: effectiveness
      label: How effective are the methods of knowledge transfer between faculties?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: collaboration_improvement
      label: How can knowledge transfer between faculties be improved?
      hint: null
      type: select_one
      options:
      - Improving faculty communication
      - Increasing faculty incentives
      - Other
      required: false
    - id: 5
      name: faculty_participation
      label: What is the level of faculty participation in knowledge transfer between
        faculties?
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 6
      name: knowledge_transfer_between_faculties
      label: What methods or barriers have you personally experienced with knowledge
        transfer between faculties?
      hint: null
      type: select_multiple
      options:
      - Lack of resources
      - Difficulty in getting feedback
      - Difficulty in getting information
      required: false
    - id: 7
      name: cross_faculty_collaboration
      label: Do you believe that cross faculty collaboration is effective for knowledge
        transfer between faculties?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: false
    - id: 8
      name: other_methods
      label: Are there any other methods of knowledge transfer between faculties that
        you have experienced?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: other_improvement
      label: Are there any other ways to improve knowledge transfer between faculties?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: university_name
      label: University Name
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: department_name
      label: Department Name
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
