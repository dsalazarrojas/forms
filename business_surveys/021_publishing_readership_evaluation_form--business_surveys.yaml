inputSchema:
  type: object
  properties:
    title: Publishing Readership Evaluation Form
    pages:
    - id: 1
      name: reader_content_type
      label: What type of content did you read?
      hint: Select a type of content (e.g., article, blog post, book)
      type: select_one
      options:
      - Article
      - Blog Post
      - Book
      - Newsletter
      - Other
      - Whitepaper
      required: true
    - id: 2
      name: reader_frequency
      label: How often do you read this type of content?
      hint: Select a frequency of reading
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      - Never
      required: true
    - id: 3
      name: reader_satisfaction
      label: How would you rate your level of satisfaction?
      hint: Select a satisfaction level
      type: number
      options: []
      required: true
    - id: 4
      name: reader_format
      label: What is your preferred format for reading this type of content?
      hint: Select a preferred format
      type: select_multiple
      options:
      - Digital
      - Print
      - Audio
      - Video
      - Other
      required: true
    - id: 5
      name: reader_quality
      label: How would you rate the quality of the content?
      hint: Select a quality rating
      type: number
      options: []
      required: true
    - id: 6
      name: reader_feedback
      label: Do you have any feedback or comments about the content?
      hint: Please provide any feedback or comments
      type: note
      options: []
      required: false
