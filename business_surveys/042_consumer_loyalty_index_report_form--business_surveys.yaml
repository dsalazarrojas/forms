inputSchema:
  type: object
  properties:
    title: Consumer Loyalty Index Report Form
    pages:
    - id: 1
      name: respondent_name
      label: Your Name
      hint: Full name - optional
      type: text
      options: []
      required: false
    - id: 2
      name: respondent_email
      label: Email Address
      hint: For follow-up - optional
      type: email
      options: []
      required: false
    - id: 3
      name: customer_id
      label: Customer ID
      hint: Your customer number if known
      type: text
      options: []
      required: false
    - id: 4
      name: age_range
      label: Age Range
      hint: Select your age group
      type: select_one
      options:
      - Under 18
      - 18-24
      - 25-34
      - 35-44
      - 45-54
      - 55-64
      - 65+
      required: true
    - id: 5
      name: gender
      label: Gender
      hint: Select your gender
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      - Prefer Not to Say
      - Other
      required: false
    - id: 6
      name: customer_since
      label: Customer Since
      hint: When did you become a customer
      type: select_one
      options:
      - Less than 6 Months
      - 6 Months - 1 Year
      - 1-3 Years
      - 3-5 Years
      - 5-10 Years
      - 10+ Years
      required: true
    - id: 7
      name: purchase_frequency
      label: Purchase Frequency
      hint: How often do you purchase
      type: select_one
      options:
      - Weekly
      - Monthly
      - Quarterly
      - Twice a Year
      - Once a Year
      - Rarely
      required: true
    - id: 8
      name: last_purchase_date
      label: Last Purchase Date
      hint: When was your last purchase
      type: date
      options: []
      required: false
    - id: 9
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Rate your overall satisfaction
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 10
      name: net_promoter_score
      label: Likelihood to Recommend
      hint: How likely to recommend to others (0-10)
      type: number
      options: []
      required: true
    - id: 11
      name: brand_trust
      label: Trust in Brand
      hint: How much do you trust the brand
      type: select_one
      options:
      - Completely Trust
      - Mostly Trust
      - Somewhat Trust
      - Slightly Trust
      - Do Not Trust
      required: true
    - id: 12
      name: brand_commitment
      label: Brand Commitment
      hint: How committed are you to this brand
      type: select_one
      options:
      - Very Committed
      - Committed
      - Neutral
      - Not Very Committed
      - Not Committed
      required: true
    - id: 13
      name: repurchase_intention
      label: Intention to Repurchase
      hint: Will you buy again
      type: select_one
      options:
      - Definitely Will
      - Probably Will
      - Might or Might Not
      - Probably Will Not
      - Definitely Will Not
      required: true
    - id: 14
      name: price_satisfaction
      label: Price Satisfaction
      hint: Rate satisfaction with pricing
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 15
      name: quality_satisfaction
      label: Quality Satisfaction
      hint: Rate satisfaction with quality
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 16
      name: service_satisfaction
      label: Service Satisfaction
      hint: Rate satisfaction with service
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 17
      name: value_satisfaction
      label: Value Satisfaction
      hint: Rate satisfaction with value
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 18
      name: competitor_comparison
      label: Compared to Competitors
      hint: How does this brand compare
      type: select_one
      options:
      - Much Better
      - Somewhat Better
      - About the Same
      - Somewhat Worse
      - Much Worse
      required: true
    - id: 19
      name: emotional_connection
      label: Emotional Connection
      hint: Do you feel connected to the brand
      type: select_one
      options:
      - Very Strong
      - Strong
      - Moderate
      - Weak
      - None
      required: true
    - id: 20
      name: loyalty_program_member
      label: Loyalty Program Member
      hint: Are you in the loyalty program
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 21
      name: loyalty_program_satisfaction
      label: Loyalty Program Satisfaction
      hint: Rate the loyalty program
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      - Not a Member
      required: false
    - id: 22
      name: share_of_wallet
      label: Share of Wallet
      hint: What percentage do you spend with us
      type: select_one
      options:
      - 75% or More
      - 50-74%
      - 25-49%
      - 10-24%
      - Less than 10%
      required: true
    - id: 23
      name: reasons_for_loyalty
      label: Reasons for Loyalty
      hint: Select why you stay loyal
      type: select_multiple
      options:
      - Product Quality
      - Price
      - Customer Service
      - Convenience
      - Brand Values
      - Habit
      - Loyalty Rewards
      - Product Variety
      - Other
      required: false
    - id: 24
      name: improvement_suggestions
      label: Suggestions for Improvement
      hint: How can we serve you better
      type: text
      options: []
      required: false
    - id: 25
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
