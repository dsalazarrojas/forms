inputSchema:
  type: object
  properties:
    title: Building Maintenance Frequency Survey
    pages:
    - id: 1
      name: survey_date
      label: Survey Date
      hint: When is this survey being completed
      type: date
      options: []
      required: true
    - id: 2
      name: building_location
      label: Building Location
      hint: Which building or property
      type: text
      options: []
      required: true
