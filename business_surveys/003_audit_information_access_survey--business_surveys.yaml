inputSchema:
  type: object
  properties:
    title: Audit Information Access Survey
    pages:
    - id: 1
      name: intro_note
      label: -- Access and Permissions Survey --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: respondent name
      hint: Optional - full name of respondent
      type: text
      options: []
      required: false
    - id: 3
      name: respondent_email
      label: respondent email
      hint: Work email for follow up
      type: email
      options: []
      required: false
    - id: 4
      name: system_accessed
      label: system accessed
      hint: Which system or tool is being evaluated
      type: text
      options: []
      required: true
    - id: 5
      name: access_frequency
      label: access frequency
      hint: How often do you access this information
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: true
    - id: 6
      name: adequacy_of_access_controls
      label: adequacy of access controls
      hint: Select your assessment of current access controls
      type: select_one
      options:
      - Strong
      - Adequate
      - Weak
      - Unknown
      required: true
    - id: 7
      name: incidents_reported_last_year
      label: incidents reported last year
      hint: Number of access incidents you are aware of
      type: number
      options: []
      required: false
    - id: 8
      name: suggestions_for_improvement
      label: suggestions for improvement
      hint: Brief suggestions to improve information access controls
      type: text
      options: []
      required: false
