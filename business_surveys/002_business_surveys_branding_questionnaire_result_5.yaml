title: Branding questionnaire
description: Generate a Branding questionnaire survey for the "Business surveys" category. Use the template name: "Branding questionnaire template".
questions:
  - text: Overall, how satisfied are you with branding questionnaire?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Branding, Questionnaire, Business, Surveys]
  - text: How often do you interact with branding questionnaire?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
