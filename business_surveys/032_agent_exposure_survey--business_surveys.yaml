inputSchema:
  type: object
  properties:
    title: Agent Exposure Survey
    pages:
    - id: 1
      name: incident_header
      label: -- Exposure Incident --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: agent_name
      label: Agent name
      hint: Name of person reporting exposure
      type: text
      options: []
      required: true
    - id: 3
      name: incident_date
      label: Incident date
      hint: Date exposure occurred
      type: date
      options: []
      required: true
    - id: 4
      name: exposure_type
      label: Type of exposure
      hint: Select the exposure category
      type: select_one
      options:
      - Chemical
      - Biological
      - Physical
      - Other
      required: true
    - id: 5
      name: symptoms_present
      label: Symptoms present
      hint: List any symptoms observed
      type: text
      options: []
      required: false
    - id: 6
      name: immediate_actions_taken
      label: Immediate actions taken
      hint: Describe first aid or containment steps
      type: text
      options: []
      required: true
    - id: 7
      name: reported_to_supervisor
      label: Reported to supervisor
      hint: Confirm if supervisor was notified
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 8
      name: follow_up_required
      label: Follow up required
      hint: Does the incident need further investigation
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 9
      name: follow_up_notes
      label: Follow up notes
      hint: Describe follow up actions planned
      type: text
      options: []
      required: false
    - id: 10
      name: contact_phone
      label: Contact phone for follow up
      hint: Preferred contact number
      type: text
      options: []
      required: false
