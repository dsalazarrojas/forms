inputSchema:
  type: object
  properties:
    title: Urban Housing Policy Impact Survey
    pages:
    - id: 1
      name: survey_title
      label: Urban Housing Policy Impact Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: survey_start
      label: How long do you live in the city
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: policy_effect
      label: How much effect does the city policy have
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: housing_status
      label: What is your current housing status
      hint: null
      type: select_one
      options:
      - Renting
      - Home ownership
      - Other
      required: true
    - id: 7
      name: housing_conditions
      label: What are the most pressing housing conditions in your neighborhood
      hint: null
