      name: policy_effect
      label: How much do you feel that this policy will affect you
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: policy_impact
      label: What do you think this policy will impact
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: other_impact
      label: Other policy impacts
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: policy_awareness
      label: How aware of this policy are you
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: policy_support
      label: How much do you support this policy
      hint: null
      type: number
      options: []
      required: true
    - id: 15
      name: policy_opinion
      label: What is your opinion on this policy
      hint: null
      type: select_one
      options:
      - Strongly Opposed
      - Neutral
      - Strongly in favor
      - Other
      required: true
    - id: 16
      name: policy_recommend
      label: Would you recommend this policy
      hint: null
      type: select_one
      options:
      - Strongly oppose
      - Neutral
      - Strongly recommend
      - Other
      required: true
