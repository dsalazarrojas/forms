inputSchema:
  type: object
  properties:
    title: Beauty Tool Sanitization Awareness Survey
    pages:
      - id: 1
        name: section_habits
        label: -- Personal Sanitization Habits --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: cleaning_frequency
        label: How often do you clean your personal beauty tools?
        hint: e.g. brushes, sponges, tweezers
        type: select_one
        options:
          - After every use
          - Once a week
          - Once a month
          - Every few months
          - Never
        required: true
      - id: 3
        name: cleaning_method
        label: What is your primary method for cleaning tools?
        hint: null
        type: select_multiple
        options:
          - Soap and Water
          - Specialized Brush Cleanser
          - Isopropyl Alcohol (70%+)
          - UV Sanitizer Box
          - Disposable Applicators
        required: true
      - id: 4
        name: tool_replacement_frequency
        label: How often do you replace tools like makeup sponges or loofahs?
        hint: null
        type: select_one
        options:
          - Monthly
          - Every 3 months
          - Every 6 months
          - Once a year
          - Only when visibly damaged
        required: true
      - id: 5
        name: section_awareness
        label: -- Sanitization Awareness --
        hint: null
        type: note
        options: []
        required: false
      - id: 6
        name: knowledge_of_bacteria
        label: How aware are you of the risks of bacteria buildup on beauty tools?
        hint: null
        type: select_one
        options:
