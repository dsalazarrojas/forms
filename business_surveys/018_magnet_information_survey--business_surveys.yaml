inputSchema:
  type: object
  properties:
    title: Magnet Information Survey
    pages:
    - id: 1
      name: usage_habits
      label: Usage Habits
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: satisfaction
      label: Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 3
      name: purchase_behavior
      label: Purchase Behavior
      hint: null
      type: select_multiple
      options:
      - Regularly
      - Occasionally
      - Rarely
      - Never
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: usage_frequency
      label: Usage Frequency
      hint: null
      type: select_multiple
      options:
      - Several Times a Week
      - Daily
      - Several Times a Day
      required: false
    - id: 9
      name: how_often
      label: How Often
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: purchase_amount
      label: Purchase Amount
      hint: null
      type: number
      options: []
      required: false
