inputSchema:
  type: object
  properties:
    title: Web Application Features Survey
    pages:
    - id: 1
      name: feature_importance
      label: Feature Importance
      hint: null
      type: select_multiple
      options:
      - Very Important
      - Not Important
      required: false
    - id: 2
      name: satisfaction
      label: Satisfaction
      hint: null
      type: select_multiple
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 3
      name: new_features
      label: New Features
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: ideas
      label: New Ideas
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
