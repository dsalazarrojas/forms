inputSchema:
  type: object
  properties:
    title: Budgeting Process Evaluation Form
    pages:
      - id: 1
        name: respondent_name
        label: Respondent Name
        hint: Your full name
        type: text
        options: []
        required: false
      - id: 2
        name: department
        label: Department
        hint: Your department or division
        type: text
        options: []
        required: true
      - id: 3
        name: role
        label: Your Role
        hint: Job title or position
        type: text
        options: []
        required: true
      - id: 4
        name: email
        label: Email Address
        hint: Contact email
        type: email
        options: []
        required: true
      - id: 5
        name: involvement_level
        label: Involvement in Budgeting Process
        hint: How involved are you
        type: select_one
        options:
          - Lead the Budgeting Process
          - Actively Participate
          - Provide Input Occasionally
          - Review Only
          - Minimal Involvement
        required: true
      - id: 6
        name: years_experience
        label: Years of Budgeting Experience
        hint: How long have you been involved
        type: select_one
        options:
          - Less Than 1 Year
          - 1-3 Years
          - 4-6 Years
          - 7-10 Years
          - More Than 10 Years
        required: true
      - id: 7
        name: process_clarity
        label: Process Clarity Rating
        hint: How clear is the budgeting process
        type: select_one
        options:
          - Very Clear
          - Somewhat Clear
          - Neutral
          - Somewhat Unclear
          - Very Unclear
        required: true
      - id: 8
        name: timeline_adequacy
        label: Timeline Adequacy
        hint: Is the budgeting timeline reasonable
        type: select_one
        options:
          - More Than Adequate
          - Adequate
          - Neutral
          - Somewhat Rushed
          - Too Rushed
        required: true
      - id: 9
        name: communication_effectiveness
        label: Communication Effectiveness
        hint: How effective is communication during budgeting
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 10
        name: resource_availability
        label: Resource Availability
        hint: Do you have adequate resources for budgeting
        type: select_one
        options:
          - More Than Enough
          - Adequate
          - Somewhat Limited
          - Very Limited
          - Insufficient
        required: true
      - id: 11
        name: collaboration_quality
        label: Collaboration Quality
        hint: How would you rate cross-department collaboration
        type: select_one
        options:
          - Excellent Collaboration
          - Good Collaboration
          - Average Collaboration
          - Poor Collaboration
          - No Collaboration Occurs
        required: true
      - id: 12
        name: tools_effectiveness
        label: Budgeting Tools Effectiveness
        hint: How effective are current tools and systems
        type: select_one
        options:
          - Very Effective
          - Somewhat Effective
          - Neutral
          - Somewhat Ineffective
          - Very Ineffective
        required: true
      - id: 13
        name: challenges_faced
        label: Challenges Faced
        hint: Select all that apply
        type: select_multiple
        options:
          - Unclear Guidelines
          - Tight Deadlines
          - Lack of Data
          - Poor Communication
          - Inadequate Tools
          - Limited Training
          - Changing Requirements
          - Resource Constraints
          - Lack of Leadership Support
          - Other
        required: true
      - id: 14
        name: strengths_identified
        label: Process Strengths
        hint: What works well
        type: text
        options: []
        required: false
      - id: 15
        name: improvement_areas
        label: Areas for Improvement
        hint: What needs improvement
        type: text
        options: []
        required: true
      - id: 16
        name: training_needs
        label: Training Needs
        hint: What training would help you
        type: select_multiple
        options:
          - Budgeting Software Training
          - Financial Analysis Skills
          - Forecasting Techniques
          - Communication Skills
          - Strategic Planning
          - Data Analysis
          - No Additional Training Needed
        required: false
      - id: 17
        name: satisfaction_overall
        label: Overall Satisfaction
        hint: Overall satisfaction with budgeting process
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 18
        name: recommendations
        label: Recommendations for Improvement
        hint: Your suggestions for improvement
        type: text
        options: []
        required: false
      - id: 19
        name: willingness_participate_future
        label: Willingness to Participate in Future
        hint: Would you participate in process improvements
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Maybe
          - Probably No
          - Definitely No
        required: false
