inputSchema:
  type: object
  properties:
    title: Social Media Engagement Metrics Report Form
    pages:
    - id: 1
      name: platform_name
      label: Social Media Platform
      hint: null
      type: select_one
      options:
      - Facebook
      - Instagram
      - LinkedIn
      - Twitter
      required: false
    - id: 2
      name: time_range_start
      label: Time Range
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: time_range_end
      label: Time Range End
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: frequency
      label: Metric Frequency
      hint: null
      type: select_multiple
      options:
      - Hourly
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 5
      name: engagement_platform
      label: Engagement Platforms
      hint: null
      type: select_multiple
      options:
      - Posts
      - Stories
      - Live Streaming
      required: false
    - id: 6
      name: metrics
      label: Engagement Metrics
      hint: null
      type: select_multiple
      options:
      - Post Reach
      - Engagement Rate
      - Comment Count
      - Post Click-Through Rate
      - Sentiment Analysis
      - Audience Growth Rate
      - Top-Engagement Content
      - Hashtags Used
      - Engagement Index
      required: false
    - id: 7
      name: metric_interval
      label: Metric Interval
      hint: null
      type: select_multiple
      options:
      - Week
      - Month
      - Quarter
      - Year
      - Total
      required: false
    - id: 8
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: comments_section
      label: Comments Section
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: output_file
      label: Output File
      hint: null
      type: select_one
      options:
      - PDF
      - CSV
      - JSON
      required: false
    - id: 13
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: output_file_path
      label: Output File Path
      hint: null
      type: text
      options: []
      required: false
