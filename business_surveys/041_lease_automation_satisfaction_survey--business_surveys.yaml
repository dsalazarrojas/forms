inputSchema:
  type: object
  properties:
    title: Lease Automation Satisfaction Survey
    pages:
    - id: 1
      name: user_feedback
      label: User Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: lease_automation
      label: Lease Automation
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      required: false
    - id: 3
      name: issue_identification
      label: Issue Identification
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: enhancement_priority
      label: Enhancement Priority
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 5
      name: issue_description
      label: Issue Description
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: suggested_solution
      label: Suggested Solution
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: system_usability
      label: System Usability
      hint: null
      type: select_one
      options:
      - Very Easy
      - Somewhat Easy
      - Neutral
      - Somewhat Difficult
      - Very Difficult
      required: false
    - id: 8
      name: user_recommendation
      label: User Recommendation
      hint: null
      type: select_multiple
      options:
      - Improve
      - Keep
      - Discontinue
      required: false
    - id: 9
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: false
