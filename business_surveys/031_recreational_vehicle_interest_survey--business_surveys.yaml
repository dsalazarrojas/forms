inputSchema:
  type: object
  properties:
    title: Recreational Vehicle Interest Survey
    pages:
    - id: 1
      name: rv_dealer_or_rental_company
      label: Recreational Vehicle Dealer or Rental Company
      hint: null
      type: select_one
      options:
      - Dealer
      - Rental Company
      required: false
