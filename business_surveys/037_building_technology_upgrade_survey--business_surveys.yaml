inputSchema:
  type: object
  properties:
    title: Building Technology Upgrade Survey
    pages:
    - id: 1
      name: survey_date
      label: Survey Date
      hint: When completing this survey
      type: date
      options: []
      required: true
    - id: 2
      name: respondent_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: respondent_role
      label: Your Role
      hint: Job title or position
      type: select_one
      options:
        - IT Manager
        - Facility Manager
        - Building Manager
        - Department Head
        - Executive
        - Employee
        - Other
      required: true
    - id: 5
      name: building_location
      label: Building Location
      hint: Which building
      type: text
      options: []
      required: true
    - id: 6
      name: department
      label: Department
      hint: Your department or team
      type: text
      options: []
      required: false
    - id: 7
      name: current_infrastructure
      label: Current Technology Infrastructure
      hint: Systems and tools in use
      type: text
      options: []
      required: true
    - id: 8
      name: system_age
      label: Age of Current Systems
      hint: How old are the systems
      type: select_one
      options:
        - Less than 2 years
        - 2-5 years
        - 5-10 years
        - Over 10 years
        - Mix of Different Ages
      required: true
    - id: 9
      name: system_satisfaction
      label: Satisfaction With Current Systems
      hint: How well are they working
      type: select_one
      options:
        - Very Satisfied
        - Satisfied
        - Neutral
        - Dissatisfied
        - Very Dissatisfied
      required: true
    - id: 10
      name: system_issues
      label: Current System Problems
      hint: Any issues with systems
      type: text
      options: []
      required: false
    - id: 11
      name: upgrade_priorities
      label: Upgrade Priorities
      hint: What needs upgrading
      type: select_multiple
      options:
        - WiFi and Connectivity
        - Security Systems
        - Access Control
        - HVAC Controls
        - Lighting Systems
        - Smart Building Technology
        - Data Center
        - Communications Systems
        - Other
      required: true
    - id: 12
      name: top_priority
      label: Top Priority Upgrade
      hint: Most important upgrade
      type: text
      options: []
      required: false
    - id: 13
      name: smart_building
      label: Interest in Smart Building Technology
      hint: IoT and automation
      type: select_one
      options:
        - Very Interested
        - Interested
        - Somewhat Interested
        - Not Interested
      required: true
    - id: 14
      name: cybersecurity
      label: Cybersecurity Concerns
      hint: How important is security
      type: select_one
      options:
        - Critical Priority
        - Important
        - Somewhat Important
        - Not Important
      required: true
    - id: 15
      name: budget_available
      label: Budget Available for Upgrades
      hint: Approximate budget
      type: select_one
      options:
        - Under 50000
        - 50000 - 100000
        - 100000 - 250000
        - 250000 - 500000
        - Over 500000
        - Not Determined
      required: true
    - id: 16
      name: timeline
      label: Desired Timeline for Upgrades
      hint: When to implement
      type: select_one
      options:
        - Immediately
        - Within 6 Months
        - Within 1 Year
        - 1-2 Years
        - 2-5 Years
        - No Specific Timeline
      required: true
    - id: 17
      name: implementation_challenges
      label: Anticipated Implementation Challenges
      hint: What might be difficult
      type: text
      options: []
      required: false
    - id: 18
      name: training_needs
      label: Staff Training Required
      hint: Training needs assessment
      type: select_one
      options:
        - Extensive Training
        - Moderate Training
        - Minimal Training
        - No Training Needed
        - Unsure
      required: false
    - id: 19
      name: vendor_preference
      label: Vendor or Technology Preference
      hint: Preferred solutions
      type: text
      options: []
      required: false
    - id: 20
      name: integration_needs
      label: System Integration Requirements
      hint: Need systems to work together
      type: select_one
      options:
        - Critical
        - Important
        - Somewhat Important
        - Not Important
      required: false
