inputSchema:
  type: object
  properties:
    title: scale_assessment_survey
    pages:
    - id: 1
      name: customer_satisfaction
      label: Customer Satisfaction
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 2
      name: recommendation
      label: Recommendation
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: quality_rating
      label: Quality Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: false
