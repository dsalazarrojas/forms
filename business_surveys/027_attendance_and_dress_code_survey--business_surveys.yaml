inputSchema:
  type: object
  properties:
    title: Attendance And Dress Code Survey
    pages:
    - id: 1
      name: event_information
      label: -- Event Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_name
      label: Event Name
      hint: Name of the event
      type: text
      options: []
      required: true
    - id: 3
      name: event_date
      label: Event Date
      hint: Date the event will be held
      type: date
      options: []
      required: true
    - id: 4
      name: event_time
      label: Event Time
      hint: Start time of the event
      type: time
      options: []
      required: true
    - id: 5
      name: event_location
      label: Event Location
      hint: Where will the event be held?
      type: text
      options: []
      required: true
    - id: 6
      name: attendee_information
      label: -- Attendee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: company_organization
      label: Company/Organization
      hint: Your company or organization name
      type: text
      options: []
      required: false
    - id: 11
      name: title_position
      label: Title/Position
      hint: Your job title or role
      type: text
      options: []
      required: false
    - id: 12
      name: attendance_confirmation
      label: -- Attendance Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: will_attend
      label: Will You Be Attending?
      hint: Please confirm your attendance
      type: select_one
      options:
      - Yes - I will attend
      - No - Cannot attend
      - Maybe - Uncertain
      required: true
    - id: 14
      name: number_of_guests
      label: Number of Guests
      hint: Including yourself
      type: number
      options: []
      required: false
    - id: 15
      name: guest_names
      label: Guest Names (if applicable)
      hint: Names of any guests accompanying you
      type: text
      options: []
      required: false
    - id: 16
      name: dietary_restrictions
      label: -- Dietary Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: dietary_needs
      label: Dietary Restrictions or Preferences
      hint: Select all that apply
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Nut Allergy
      - Dairy-Free
      - Kosher
      - Halal
      - Other
      - None
      required: false
    - id: 18
      name: specific_dietary_details
      label: Specific Dietary Details
      hint: Any additional dietary information
      type: text
      options: []
      required: false
    - id: 19
      name: dress_code_section
      label: -- Dress Code Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: dress_code_understanding
      label: Dress Code (as communicated)
      hint: What dress code were you given?
      type: select_one
      options:
      - Black Tie
      - Formal
      - Business Formal
      - Business Casual
      - Casual
      - Cocktail Attire
      - Themed
      - Other
      required: true
    - id: 21
      name: dress_code_confirmation_acknowledgment
      label: Do you understand the dress code requirements?
      hint: null
      type: select_one
      options:
      - Yes, I understand
      - I have questions about the dress code
      - No, unclear to me
      required: true
    - id: 22
      name: special_considerations
      label: -- Special Considerations --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: accessibility_needs
      label: Accessibility or Mobility Needs
      hint: Any accommodations needed?
      type: text
      options: []
      required: false
    - id: 24
      name: special_requests
      label: Special Requests
      hint: Any other special requests or requirements?
      type: text
      options: []
      required: false
    - id: 25
      name: additional_comments
      label: Additional Comments
      hint: Any other information you would like to share?
      type: text
      options: []
      required: false
