inputSchema:
  type: object
  properties:
    title: Follower Management Survey
    pages:
    - id: 1
      name: intro
      label: What do you want to talk about
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: which_categories
      label: Which of the following categories are you interested in
      hint: null
      type: select_multiple
      options:
      - Category A
      - Category B
      - Category C
      required: true
    - id: 3
      name: follower_type
      label: What type of follower are you?
      hint: null
      type: select_one
      options:
      - Social Media
      - Influencer
      - Content Creator
      required: true
    - id: 4
      name: age_group
      label: What is your age group?
      hint: null
      type: select_one
      options:
      - 18-24
      - 25-34
      - 35-44
      - 45-54
      - 55+
      required: true
    - id: 5
      name: engagement_level
      label: How often do you engage with us?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Rarely
      required: true
    - id: 6
      name: contact_method
      label: How do you like to contact us?
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - In-person
      required: true
    - id: 7
      name: additional_comments
      label: Do you have any additional comments or concerns?
      hint: null
      type: note
      options: []
      required: false
