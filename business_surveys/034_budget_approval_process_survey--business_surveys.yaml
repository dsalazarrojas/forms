inputSchema:
  type: object
  properties:
    title: Budget Approval Process Survey
    pages:
    - id: 1
      name: respondent_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: respondent_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: respondent_role
      label: Your Role in Budget Process
      hint: null
      type: select_one
      options:
      - Department Manager
      - Finance Team Member
      - Executive Leadership
      - Budget Coordinator
      - Other
      required: true
    - id: 4
      name: process_clarity
      label: Clarity of Budget Approval Process
      hint: null
      type: select_one
      options:
      - Very Clear
      - Clear
      - Neutral
      - Unclear
      - Very Unclear
      required: true
    - id: 5
      name: timeline_adequacy
      label: Adequacy of Timeline for Approvals
      hint: Do you have enough time to prepare requests
      type: select_one
      options:
      - More than enough
      - Adequate
      - Tight but manageable
      - Too tight
      - Extremely rushed
      required: true
    - id: 6
      name: communication_effectiveness
      label: Communication Effectiveness
      hint: Are updates and decisions clearly communicated
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 7
      name: documentation_requirements
      label: Documentation Requirements
      hint: Are they clear and reasonable
      type: select_one
      options:
      - Very clear and reasonable
      - Clear and reasonable
      - Somewhat unclear
      - Unclear and excessive
      - Excessive and confusing
      required: true
    - id: 8
      name: approval_bottlenecks
      label: Major Bottlenecks in Process
      hint: Select all that apply
      type: select_multiple
      options:
      - Lengthy approval chain
      - Unclear decision criteria
      - Inadequate communication
      - Technical system issues
      - Document collection delays
      - No major bottlenecks
      required: false
    - id: 9
      name: system_usability
      label: Usability of Budget System or Tools
      hint: null
      type: select_one
      options:
      - Very Easy
      - Easy
      - Neutral
      - Difficult
      - Very Difficult
      required: true
    - id: 10
      name: training_adequacy
      label: Adequacy of Training on Process
      hint: null
      type: select_one
      options:
      - Excellent training
      - Adequate training
      - Limited training
      - No training provided
      required: true
    - id: 11
      name: approval_fairness
      label: Fairness of Approval Decisions
      hint: Are decisions made consistently
      type: select_one
      options:
      - Very fair
      - Fair
      - Sometimes fair
      - Unfair
      - Very unfair
      required: true
    - id: 12
      name: overall_satisfaction
      label: Overall Satisfaction with Process
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 13
      name: process_improvements
      label: What Changes Would Improve the Process
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: priority_improvements
      label: Priority Areas for Improvement
      hint: Select top 3
      type: select_multiple
      options:
      - Faster approval times
      - Clearer communication
      - Simpler documentation
      - Better training
      - More transparent criteria
      - System improvements
      required: false
    - id: 15
      name: additional_feedback
      label: Additional Comments or Suggestions
      hint: null
      type: text
      options: []
      required: false
