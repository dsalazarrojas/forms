inputSchema:
  type: object
  properties:
    title: Document Management Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: Please take a few minutes to complete this survey.
      type: text
      options: []
      required: false
    - id: 2
      name: question_1
      label: What type of documents do you mostly handle?
      hint: e.g. pdf, doc, xls
      type: select_one
      options:
      - pdf
      - doc
      - xls
      - other
      required: true
    - id: 3
      name: question_2
      label: How often do you use documents in your work?
      hint: e.g. daily, weekly, monthly
      type: select_one
      options:
      - daily
      - weekly
      - monthly
      - rarely
      required: true
    - id: 4
      name: question_3
      label: How much time do you spend on document management?
      hint: Enter time in hours
      type: number
      options: []
      required: true
    - id: 5
      name: question_4
      label: What is your biggest document management challenge?
      hint: e.g. finding a document, organizing documents, etc.
      type: text
      options: []
      required: true
    - id: 6
      name: question_5
      label: How many documents do you typically handle per day?
      hint: Enter number of documents
      type: number
      options: []
      required: false
    - id: 7
      name: question_6
      label: How do you usually access documents?
      hint: null
      type: select_multiple
      options:
      - file cabinet
      - cloud storage
      - email
      - network drive
      required: true
    - id: 8
      name: question_7
      label: Can you access documents from anywhere?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 9
      name: question_8
      label: Do you think document management could be improved?
      hint: null
      type: select_one
      options:
      - 'yes'
      - 'no'
      required: false
    - id: 10
      name: question_9
      label: Would you like to provide additional comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: question_10
      label: How likely are you to use the proposed document management system?
      hint: null
      type: select_one
      options:
      - very likely
      - likely
      - not very likely
      - not at all
      - no opinion
      required: true
    - id: 12
      name: question_11
      label: What do you think about the proposed document management system?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: question_11_2
      label: Any other feedback or suggestions?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: question_12
      label: How satisfied are you with the current document management system?
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: question_12_2
      label: Would you be willing to pay for the proposed document management system?
      hint: null
      type: select_one
      options:
      - 'yes'
      - 'no'
      - no opinion
      required: false
    - id: 16
      name: question_13
      label: Do you have any other feedback or suggestions?
      hint: null
      type: text
      options: []
      required: false
