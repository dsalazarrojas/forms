inputSchema:
  type: object
  properties:
    title: Aquatic Professionals Survey
    pages:
    - id: 1
      name: professional_info
      label: Professional Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: facility_name
      label: Facility Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: profession
      label: Primary Profession
      hint: null
      type: select_one
      options:
      - Lifeguard
      - Swim Coach
      - Facility Manager
      - Aquatic Director
      - Maintenance Staff
      - Other
      required: true
    - id: 7
      name: professional_feedback
      label: Professional Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: current_challenges
      label: Main Challenges You Face
      hint: null
      type: select_multiple
      options:
      - Staff Recruitment
      - Staff Training
      - Equipment Maintenance
      - Budget Constraints
      - Safety Compliance
      - Member Retention
      required: false
    - id: 9
      name: industry_trends
      label: Industry Trends Affecting Your Work
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: technology_adoption
      label: Technology Adoption Level
      hint: null
      type: select_one
      options:
      - Highly Advanced
      - Modern
      - Standard
      - Outdated
      - Very Outdated
      required: false
    - id: 11
      name: training_needs
      label: Training or Development Needs
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: improvement_suggestions
      label: Suggestions for Industry Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: years_experience
      label: Years of Experience in Field
      hint: null
      type: number
      options: []
      required: false
