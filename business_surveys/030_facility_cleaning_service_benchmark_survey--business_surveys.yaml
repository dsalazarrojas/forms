inputSchema:
  type: object
  properties:
    title: Facility Cleaning Service Benchmark Survey
    pages:
    - id: 1
      name: facility_name
      label: Facility Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: location_name
      label: Location Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: satisfaction_level
      label: Satisfaction Level
      hint: Scale from 1-5
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 4
      name: improvement_suggestions
      label: Improvement Suggestions
      hint: Please type any suggestions for improvement
      type: text
      options: []
      required: false
    - id: 5
      name: assigned_manager_name
      label: Assigned Manager Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: assigned_manager_title
      label: Assigned Manager Title
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: facility_type
      label: Facility Type
      hint: Please select the type of facility
      type: select_one
      options:
      - Office Building
      - School-Campus
      - Hospital-Clinic
      - Retail-Store
      - Hotel-Resort
      - Government-Building
      - Restaurant-Cafe
      - Other
      required: true
    - id: 8
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: facility_location
      label: Facility Location
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: facility_notes
      label: Facility Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: facility_address
      label: Facility Address
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: facility_city
      label: Facility City
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: facility_state
      label: Facility State
      hint: null
      type: text
      options: []
      required: false
