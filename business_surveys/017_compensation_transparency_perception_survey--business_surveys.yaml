inputSchema:
  type: object
  properties:
    title: Compensation Transparency Perception Survey
    pages:
    - id: 1
      name: survey_intro
      label: Compensation Transparency Perception Survey
      hint: Share your views on pay transparency at our organization
      type: note
      options: []
      required: false
    - id: 2
      name: employee_id
      label: Employee ID
      hint: Optional anonymous identifier
      type: number
      options: []
      required: false
    - id: 3
      name: department
      label: Department
      hint: Your department
      type: select_one
      options:
      - Human Resources
      - Finance
      - Marketing
      - Sales
      - Operations
      - IT
      - Customer Service
      - Legal
      - Research and Development
      - Other
      required: true
    - id: 4
      name: tenure
      label: Years with Company
      hint: How long have you worked here
      type: select_one
      options:
      - Less than 1 year
      - 1 to 3 years
      - 4 to 6 years
      - 7 to 10 years
      - More than 10 years
      required: true
    - id: 5
      name: job_level
      label: Job Level
      hint: Your current level
      type: select_one
      options:
      - Entry Level
      - Junior
      - Mid-Level
      - Senior
      - Lead or Principal
      - Manager
      - Director
      - Executive
      required: true
    - id: 6
      name: transparency_comfort
      label: I am comfortable discussing pay with colleagues
      hint: Comfort level with pay discussions
      type: select_one
      options:
      - Very comfortable
      - Somewhat comfortable
      - Neutral
      - Somewhat uncomfortable
      - Very uncomfortable
      required: true
    - id: 7
      name: pay_range_knowledge
      label: I know the pay range for my role
      hint: Awareness of your salary range
      type: select_one
      options:
      - Yes - very clear
      - Somewhat clear
      - Vaguely aware
      - No - not aware
      - No - but would like to know
      required: true
    - id: 8
      name: pay_range_knowledge_others
      label: I know pay ranges for similar roles
      hint: Awareness of other role ranges
      type: select_one
      options:
      - Yes - very clear
      - Somewhat clear
      - Vaguely aware
      - No - not aware
      required: true
    - id: 9
      name: criteria_understanding
      label: I understand how pay decisions are made
      hint: Clarity of decision criteria
      type: select_one
      options:
      - Strongly agree
      - Agree
      - Neutral
      - Disagree
      - Strongly disagree
      required: true
    - id: 10
      name: promotion_criteria_clear
      label: Promotion pay increase criteria are clear
      hint: Understanding promotion adjustments
      type: select_one
      options:
      - Strongly agree
      - Agree
      - Neutral
      - Disagree
      - Strongly disagree
      required: true
    - id: 11
      name: raise_criteria_clear
      label: Raise criteria are clearly communicated
      hint: Understanding raise decisions
      type: select_one
      options:
      - Strongly agree
      - Agree
      - Neutral
      - Disagree
      - Strongly disagree
      required: true
    - id: 12
      name: bonus_criteria_clear
      label: Bonus criteria are transparent
      hint: Understanding bonus calculations
      type: select_one
      options:
      - Strongly agree
      - Agree
      - Neutral
      - Disagree
      - Strongly disagree
      - Not applicable
      required: true
    - id: 13
      name: hr_communication_rating
      label: HR communicates compensation well
      hint: Quality of HR communication
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 14
      name: manager_communication_rating
      label: My manager discusses compensation openly
      hint: Manager communication quality
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 15
      name: documentation_access
      label: I can access compensation documentation
      hint: Availability of written information
      type: select_one
      options:
      - Yes - easily accessible
      - Yes - but hard to find
      - No - not available
      - Not sure
      required: true
    - id: 16
      name: pay_philosophy_known
      label: Company pay philosophy is known to me
      hint: Understanding of compensation philosophy
      type: select_one
      options:
      - Yes - very clear
      - Somewhat clear
      - Vaguely aware
      - No - not aware
      required: true
    - id: 17
      name: market_position_known
      label: I know where company pays vs market
      hint: Market position awareness
      type: select_one
      options:
      - Yes - we pay above market
      - Yes - we pay at market
      - Yes - we pay below market
      - No - not sure
      required: true
    - id: 18
      name: transparency_impact_trust
      label: Transparency increases my trust
      hint: Impact of transparency on trust
      type: select_one
      options:
      - Strongly agree
      - Agree
      - Neutral
      - Disagree
      - Strongly disagree
      required: true
    - id: 19
      name: transparency_impact_satisfaction
      label: Transparency increases job satisfaction
      hint: Impact on satisfaction
      type: select_one
      options:
      - Strongly agree
      - Agree
      - Neutral
      - Disagree
      - Strongly disagree
      required: true
    - id: 20
      name: transparency_impact_performance
      label: Transparency motivates better performance
      hint: Impact on performance
      type: select_one
      options:
      - Strongly agree
      - Agree
      - Neutral
      - Disagree
      - Strongly disagree
      required: true
    - id: 21
      name: current_transparency_level
      label: Current level of transparency
      hint: Rate current transparency
      type: select_one
      options:
      - Very transparent
      - Somewhat transparent
      - Neutral
      - Somewhat opaque
      - Very opaque
      required: true
    - id: 22
      name: desired_transparency_level
      label: Desired level of transparency
      hint: How transparent should it be
      type: select_one
      options:
      - Full transparency - all ranges public
      - High transparency - ranges on request
      - Moderate transparency - general info
      - Low transparency - limited info
      - No change from current
      required: true
    - id: 23
      name: concerns_about_transparency
      label: Do you have concerns about transparency
      hint: Any worries about more openness
      type: select_one
      options:
      - No concerns
      - Minor concerns
      - Some concerns
      - Significant concerns
      - Very concerned
      required: true
    - id: 24
      name: transparency_concerns
      label: What are your concerns
      hint: Select all that apply
      type: select_multiple
      options:
      - Workplace conflict
      - Jealousy among staff
      - Privacy issues
      - Turnover increases
      - Negotiation pressure
      - No concerns
      - Other
      required: false
    - id: 25
      name: transparency_recommendations
      label: What transparency improvements would help
      hint: Your suggestions
      type: text
      options: []
      required: false
    - id: 26
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
