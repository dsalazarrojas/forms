      type: select_multiple
      options:
      - Good
      - Fair
      required: false
    - id: 5
      name: company_strategy_question3
      label: What is the current state of your business strategy?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 6
      name: company_strategy_question4
      label: Company Strategy Question4
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      required: false
    - id: 7
      name: company_strategy_question5
      label: Which statement is true about your company's strategy?
      hint: null
      type: select_multiple
      options:
      - This company is growing rapidly
      - This company is struggling financially
      - This company has a high market share
      required: false
    - id: 8
      name: company_strategy_question6
      label: What is your company's global business strategy?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
