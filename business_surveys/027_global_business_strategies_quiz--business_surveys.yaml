inputSchema:
  type: object
  properties:
    title: Global Business Strategies Quiz
    pages:
    - id: 1
      name: role_in_company
      label: What is your role in the company?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: current_state_of_industry
      label: What is the current state of your industry?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: company_strategy_question1
      label: Which statement about your company is true?
      hint: null
