inputSchema:
  type: object
  properties:
    title: stock_management_survey
    pages:
    - id: 1
      name: page_1
      label: What is the current stock level of our inventory?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: page_2
      label: How often do we order stock from suppliers?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Never
      required: false
    - id: 3
      name: page_3
      label: What is your level of satisfaction with our current stock management
        practices?
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 4
      name: page_4
      label: How often do we rotate stock to ensure freshness?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: page_5
      label: What is your level of control over stock purchases?
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 6
      name: page_6
      label: How often do we need to return stock to suppliers?
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: page_7
      label: What methods do we use to purchase stock?
      hint: null
      type: select_one
      options:
      - Regular
      - Irregular
      required: false
    - id: 8
      name: page_8
      label: What is the current stock return policy?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: page_9
      label: How often do we purchase stock?
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: page_10
      label: How often do we need to purchase stock?
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: page_11
      label: What is your level of satisfaction with our current stock inventory management?
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 12
      name: page_12
      label: How do we currently purchase stock, through regular or irregular methods?
      hint: null
      type: select_one
      options:
      - Regular
      - Irregular
      required: false
