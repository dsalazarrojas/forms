inputSchema:
  type: object
  properties:
    title: Sustainable Gift Ideas Survey
    pages:
    - id: 1
      name: introduction
      label: Welcome to the Sustainable Gift Ideas Survey
      hint: This survey will help us understand your gifting preferences.
      type: note
      options: []
      required: false
    - id: 2
      name: motivation
      label: What motivates you to give gifts?
      hint: Select all that apply.
      type: select_multiple
      options:
      - To show love and appreciation
      - To celebrate special occasions
      - To support a cause or charity
      - To build relationships
      - Other (please specify)
      required: false
    - id: 3
      name: gift_type
      label: What type of gift do you like to give?
      hint: Choose one that best describes your preference.
      type: select_one
      options:
      - Experience gift
      - Personalized gift
      - Sustainable gift
      - Other (please specify)
      required: false
    - id: 4
      name: gift_frequency
      label: How often do you gift?
      hint: Select one that best describes your gifting frequency.
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Yearly
      - Rarely
      required: false
    - id: 5
      name: budget
      label: What is your budget for gifting?
      hint: Enter a number in dollars.
      type: number
      options: []
      required: false
    - id: 6
      name: gifting_frequency2
      label: How often do you give this type of gift?
      hint: Select one that best describes your gifting frequency for this type of
        gift.
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Yearly
      - Rarely
      required: false
    - id: 7
      name: open_ended
      label: Do you have any open-ended gift ideas?
      hint: Please describe your idea.
      type: text
      options: []
      required: false
    - id: 8
      name: gifting_frequency3
      label: Gifting Frequency3
      hint: Select one that best describes your gifting frequency for this type of
        gift.
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Yearly
      - Rarely
      required: false
