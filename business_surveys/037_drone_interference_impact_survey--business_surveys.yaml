inputSchema:
  type: object
  properties:
    title: Drone Interference Impact Survey
    pages:
    - id: 1
      name: drone_interference_survey
      label: What type of incident?
      hint: Please describe the incident
      type: text
      options: []
      required: false
    - id: 2
      name: drone_type
      label: Drone Type
      hint: null
      type: select_one
      options:
      - Quadcopter
      - Fixed Wing
      - Rotor
      - Other
      required: false
    - id: 3
      name: date_of_incident
      label: Date of Incident
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time_of_incident
      label: Time of Incident
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: impact_on_business
      label: Impact on Business
      hint: Please select the impact on your business
      type: select_multiple
      options:
      - No Impact
      - Minimal Impact
      - Moderate Impact
      - Significant Impact
      required: true
    - id: 6
      name: description_of_incident
      label: Description of Incident
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_person
      label: Contact Person
      hint: null
      type: select_one
      options:
      - John
      - Jane
      - Alice
      required: false
    - id: 8
      name: email
      label: Email
      hint: Please enter your company email
      type: email
      options: []
      required: true
    - id: 9
      name: phone_number
      label: Phone Number
      hint: Please enter your company phone number
      type: text
      options: []
      required: true
    - id: 10
      name: company_website
      label: Company Website
      hint: Please enter your company website
      type: text
      options: []
      required: false
    - id: 11
      name: notes
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: comments
      label: Comments
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: follow_up_info
      label: Follow-up Information
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: next_steps
      label: Next Steps
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: submitter_info
      label: Submitter Information
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: created_at
      label: Created At
      hint: null
      type: date
      options: []
      required: false
    - id: 17
      name: updated_at
      label: Updated At
      hint: null
      type: date
      options: []
      required: false
    - id: 18
      name: comments_comments
      label: Comment
      hint: Please add a comment to this form submission
      type: text
      options: []
      required: false
    - id: 19
      name: attachments
      label: Attachments
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
