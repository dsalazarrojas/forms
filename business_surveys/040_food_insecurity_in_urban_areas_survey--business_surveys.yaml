      name: household_location
      label: Household Location
      hint: null
      type: select_multiple
      options:
      - Urban
      - Rural
      - Both
      required: true
    - id: 9
      name: household_income_source
      label: Household Income Source
      hint: null
      type: select_multiple
      options:
      - Employment
      - Government aid
      - Other
      - Self employed
      required: true
    - id: 10
      name: household_income_frequency
      label: Household Income Frequency
      hint: null
      type: select_multiple
      options:
      - Monthly
      - Weekly
      - Bi weekly
      - Fortnightly
      - Other
      required: true
    - id: 11
      name: survey_response
      label: Survey Response
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: household_income_type
      label: Household Income Type
      hint: null
      type: select_one
      options:
      - Fixed income
      - Variable income
      - Other
      required: true
    - id: 13
      name: survey_date
      label: Survey Date
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: note
      label: Note
      hint: null
      type: text
      options: []
      required: false
