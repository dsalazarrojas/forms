inputSchema:
  type: object
  properties:
    title: Food Insecurity In Urban Areas Survey
    pages:
    - id: 1
      name: household_id
      label: Household Id
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: household_size
      label: household_size
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: household_income
      label: household_income
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: food_access
      label: Food Access
      hint: null
      type: select_multiple
      options:
      - Often
      - Sometimes
      - Rarely
      - Never
      required: true
    - id: 5
      name: food_challenge
      label: Food Challenge
      hint: null
      type: select_multiple
      options:
      - No challenge
      - Food insecurity
      - Lack of money
      - Limited access
      - Other
      required: true
    - id: 6
      name: food_coping
      label: Food Coping
      hint: null
      type: select_multiple
      options:
      - No coping
      - Food bank
      - Government help
      - Other help
      - Self help
      required: true
    - id: 7
      name: food_source
      label: Food Source
      hint: null
      type: select_multiple
      options:
      - Store
      - Supermarket
      - Farm
      - Other
      required: true
