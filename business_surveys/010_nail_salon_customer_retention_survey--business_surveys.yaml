inputSchema:
  type: object
  properties:
    title: Nail Salon Customer Retention Survey
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: visit_frequency
      label: Visit Frequency
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: last_visit_date
      label: Last Visit Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: satisfaction_level
      label: Satisfaction Level
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: true
    - id: 5
      name: services_purchased
      label: Services Purchased
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: loyalty_program_enrolled
      label: Loyalty Program Enrolled
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: true
    - id: 10
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: loyalty_program_comments
      label: Loyalty Program Comments
      hint: null
      type: note
      options: []
      required: true
