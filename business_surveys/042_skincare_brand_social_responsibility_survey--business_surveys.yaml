inputSchema:
  type: object
  properties:
    title: Skincare Brand Social Responsibility Survey
    pages:
    - id: 1
      name: social_responsibility_awareness
      label: What is your level of awareness about our company's social responsibility
        efforts?
      hint: null
      type: select_one
      options:
      - 1 - Very aware
      - 2 - Somewhat aware
      - 3 - Not very aware
      - 4 - Not at all aware
      required: false
    - id: 2
      name: social_responsibility_commitment
      label: How important is social responsibility to you when choosing a brand?
      hint: null
      type: select_one
      options:
      - 1 - Very important
      - 2 - Somewhat important
      - 3 - Not very important
      - 4 - Not at all important
      required: false
    - id: 3
      name: shopping_frequency
      label: How often do you shop at stores that prioritize social responsibility?
      hint: null
      type: select_one
      options:
      - 1 - Very often
      - 2 - Somewhat often
      - 3 - Rarely
      - 4 - Never
      required: false
    - id: 4
      name: social_responsibility_investment
      label: What aspects of our social responsibility efforts would you like to see
        more emphasis on?
      hint: null
      type: select_multiple
      options:
      - 1 - Environmental impact
      - 2 - Human rights
      - 3 - Employee well-being
      - 4 - Customer service
      required: false
    - id: 5
      name: social_responsibility_effectiveness
      label: How would you rate the effectiveness of our social responsibility efforts?
      hint: null
      type: select_one
      options:
      - 1 - Extremely effective
      - 2 - Very effective
      - 3 - Somewhat effective
      - 4 - Not very effective
      - 5 - Not at all effective
      required: false
    - id: 6
      name: customer_diversity_importance
      label: How important is diversity and inclusion in our customer base?
      hint: null
      type: select_one
      options:
      - 1 - Very important
      - 2 - Somewhat important
      - 3 - Not very important
      - 4 - Not at all important
      required: false
    - id: 7
      name: improvement_suggestions
      label: Have you ever considered switching to a different brand due to a lack
        of social responsibility?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: social_responsibility_commitment_score
      label: What is the score of our social responsibility commitment?
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: social_responsibility_investment_2
      label: What is the score of our social responsibility investment?
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: social_responsibility_effectiveness_score
      label: What is the score of our social responsibility effectiveness?
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: social_responsibility_performance
      label: What is the score of our social responsibility performance?
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: customer_commitment_score
      label: How important is our commitment to social responsibility to you?
      hint: null
      type: number
      options: []
      required: false
