inputSchema:
  type: object
  properties:
    title: Workforce Engagement Strategy Survey
    pages:
    - id: 1
      name: employee_feedback
      label: Employee Feedback
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: false
    - id: 2
      name: job_satisfaction
      label: Job Satisfaction
      hint: null
      type: select_multiple
      options:
      - Highly Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Highly Dissatisfied
      required: false
    - id: 3
      name: leadership_support
      label: Leadership Support
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: feedback_comments
      label: Feedback Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Finance
      - Human Resources
      - Operations
      - Marketing
      - Sales
      required: false
    - id: 10
      name: team_leader
      label: Team Leader
      hint: null
      type: select_multiple
      options:
      - John Doe
      - Jane Doe
      - Jim Doe
      - Janice Doe
      required: false
