inputSchema:
  type: object
  properties:
    title: Gaming Income Opportunities Survey
    pages:
    - id: 1
      name: intro
      label: Welcome to the survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: income_level
      label: What is your income level?
      hint: null
      type: select_one
      options:
      - Often
      - Sometimes
      - Rarely
      required: false
    - id: 3
      name: income_from_gaming
      label: How much do you earn from gaming?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: income_justification
      label: Why do you earn money through gaming?
      hint: null
      type: select_multiple
      options:
      - Motivation 1
      - Motivation 2
      - Motivation 3
      required: false
    - id: 5
      name: additional_income
      label: Do you receive additional income from gaming?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: time_spent_playing
      label: How much time do you spend playing games?
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: gaming_frequency
      label: How often do you play games?
      hint: null
      type: select_one
      options:
      - Often
      - Sometimes
      - Rarely
      required: false
    - id: 8
      name: gaming_communities
      label: What gaming communities do you belong to?
      hint: null
      type: select_multiple
      options:
      - Community 1
      - Community 2
      - Community 3
      required: false
    - id: 9
      name: gaming_partners
      label: Do you have gaming partners?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: survey_participation
      label: How did you hear about this survey?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 11
      name: gaming_streaming_frequency
      label: How often do you stream games?
      hint: null
      type: select_one
      options:
      - Often
      - Sometimes
      - Rarely
      required: false
    - id: 12
      name: gaming_streaming_platforms
      label: Which streaming platforms do you use?
      hint: null
      type: select_multiple
      options:
      - Platform 1
      - Platform 2
      - Platform 3
      required: false
    - id: 13
      name: gaming_tags
      label: Do you have a tag on your stream?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
