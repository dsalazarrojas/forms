inputSchema:
  type: object
  properties:
    title: Transformation Consulting Efficiency Survey
    pages:
    - id: 1
      name: introduction
      label: Transformation Consulting Efficiency Survey Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participate_in_decision_making
      label: Do you participate in the decision-making process for business surveys?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 3
      name: communication_methods
      label: How do you currently communicate with your team regarding business surveys?
      hint: null
      type: select_one
      options:
      - Email
      - Phone call
      - In-person meeting
      - Other
      required: true
    - id: 4
      name: communication_areas
      label: Which areas of communication do you participate in during business surveys?
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone call
      - In-person meeting
      - Other
      required: true
    - id: 5
      name: impact_on_business
      label: Do these surveys positively impact your business?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: areas_of_impact
      label: What areas of business do these surveys have a positive impact on?
      hint: null
      type: select_multiple
      options:
      - Finance
      - Operations
      - Marketing
      - Other
      required: true
    - id: 7
      name: efficiency_value
      label: How valuable is the information from business surveys for your business
        operations?
      hint: null
      type: select_one
      options:
      - Very valuable
      - Somewhat valuable
      - Not very valuable
      - Not at all valuable
      required: true
    - id: 8
      name: operations_efficiency
      label: In which business operations do you find the information from business
        surveys valuable?
      hint: null
      type: select_multiple
      options:
      - Finance
      - Operations
      - Marketing
      - Other
      required: true
    - id: 9
      name: transformation_projects_benefit
      label: Do you believe business surveys help transform your business?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: transformation_projects_benefiting
      label: Which business transformation projects benefit from business surveys?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: overall_efficiency
      label: What is your overall efficiency in business surveys?
      hint: null
      type: select_one
      options:
      - Very efficient
      - Somewhat efficient
      - Not very efficient
      - Not at all efficient
      required: true
    - id: 12
      name: areas_for_improvement
      label: In which areas do you see room for improvement in business surveys?
      hint: null
      type: select_multiple
      options:
      - Communication
      - Data analysis
      - Feedback mechanisms
      - Other
      required: true
