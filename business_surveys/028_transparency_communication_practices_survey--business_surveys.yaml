inputSchema:
  type: object
  properties:
    title: Transparency Communication Practices Survey
    pages:
    - id: 1
      name: intro_page
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: organization_size
      label: organization_size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 3
      name: communication_practices
      label: How often do you communicate with your organization?
      hint: null
      type: select_multiple
      options:
      - Frequently
      - Occasionally
      - Rarely
      required: false
    - id: 4
      name: communication_channels
      label: What communication channels do you use?
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Video calls
      - Text messages
      required: false
    - id: 5
      name: information_sharing
      label: With whom do you share information?
      hint: null
      type: select_multiple
      options:
      - Colleagues
      - Management
      - Clients
      - Suppliers
      required: false
    - id: 6
      name: information_sharing_frequency
      label: How often do you share information with others?
      hint: null
      type: select_multiple
      options:
      - Frequently
      - Occasionally
      - Rarely
      required: false
    - id: 7
      name: data_sharing
      label: What data do you share with others?
      hint: null
      type: select_multiple
      options:
      - Financial information
      - Performance information
      - Other data
      required: false
    - id: 8
      name: data_sharing_reason
      label: Why do you share data?
      hint: null
      type: select_multiple
      options:
      - To help others make decisions
      - For reporting or auditing
      - For research
      required: false
    - id: 9
      name: feedback
      label: Have you received any feedback?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: feedback_sources
      label: Who provided the feedback?
      hint: null
      type: select_multiple
      options:
      - Colleagues
      - Management
      - Clients
      - Suppliers
      required: false
    - id: 11
      name: communication_style
      label: How would you describe your communication style?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: communication_channels_quality
      label: What do you think about these communication channels?
      hint: null
      type: time
      options: []
      required: false
    - id: 13
      name: communication_channels_frequency
      label: How often do you use these communication channels?
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: information_sharing_quality
      label: What do you think about information sharing?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 15
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: comments
      label: Do you have any other comments?
      hint: null
      type: note
      options: []
      required: false
