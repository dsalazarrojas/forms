inputSchema:
  type: object
  properties:
    title: Product Testing Survey
    pages:
    - id: 1
      name: overall_impressions
      label: What are your overall impressions of the product?
      hint: Please share your honest feedback.
      type: text
      options: []
      required: true
    - id: 2
      name: product_quality
      label: How would you rate the quality of the product?
      hint: On a scale of 1-5, with 5 being excellent.
      type: number
      options: []
      required: true
    - id: 3
      name: recommendation
      label: How likely are you to recommend this product?
      hint: On a scale of 1-5, with 5 being very likely.
      type: number
      options: []
      required: true
    - id: 4
      name: favorite_feature
      label: What feature of the product do you like most?
      hint: Be as specific as possible.
      type: text
      options: []
      required: true
    - id: 5
      name: feedback
      label: What do you like least about the product?
      hint: Be as specific as possible.
      type: text
      options: []
      required: true
    - id: 6
      name: usage_frequency
      label: How often do you use the product?
      hint: Daily, weekly, monthly, or never.
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Never
      required: true
    - id: 7
      name: new_features
      label: Would you like to see any new features added to the product?
      hint: Check all that apply.
      type: select_multiple
      options:
      - Yes, add more features like this
      - Yes, add features that are similar to this
      - Yes, add features that are totally different from this
      - 'False'
      required: true
    - id: 8
      name: expectations_met
      label: How does the product meet your expectations?
      hint: Check all that apply.
      type: select_multiple
      options:
      - Yes, it exceeded my expectations
      - Yes, it met my expectations
      - No, it was below my expectations
      - No, I'm not sure
      required: true
    - id: 9
      name: price
      label: What do you think of the product's price?
      hint: Be as specific as possible.
      type: text
      options: []
      required: true
    - id: 10
      name: improvements
      label: What would you suggest we improve in the product?
      hint: Be as specific as possible.
      type: text
      options: []
      required: true
    - id: 11
      name: comments
      label: Do you have any other comments or suggestions for us?
      hint: Please share them with us.
      type: text
      options: []
      required: true
    - id: 12
      name: additional_comments
      label: Additional comments or suggestions?
      hint: Please share them with us.
      type: text
      options: []
      required: false
