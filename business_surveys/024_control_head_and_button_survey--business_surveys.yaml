          - Model B
          - Model C
          - Prototype
          - Other
        required: true
      - id: 5
        name: usage_duration
        label: How long have you used this product
        hint: null
        type: select_one
        options:
          - First time
          - Less than 1 week
          - 1-4 weeks
          - 1-6 months
          - Over 6 months
        required: true
      - id: 6
        name: usage_frequency
        label: How often do you use this product
        hint: null
        type: select_one
        options:
