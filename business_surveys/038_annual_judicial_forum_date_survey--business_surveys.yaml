inputSchema:
  type: object
  properties:
    title: Annual Judicial Forum Date Survey
    pages:
    - id: 1
      name: respondent_name
      label: Full Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: false
    - id: 4
      name: organization
      label: Organization
      hint: Court or organization
      type: text
      options: []
      required: false
    - id: 5
      name: position_title
      label: Position Title
      hint: Your role
      type: text
      options: []
      required: false
    - id: 6
      name: forum_year
      label: Forum Year
      hint: Which year is this for?
      type: select_one
      options:
      - 2026
      - 2025
      - 2024
      - 2023
      required: true
    - id: 7
      name: attendance_interest
      label: Attendance Interest
      hint: Will you attend?
      type: select_one
      options:
      - Yes, Definitely
      - Likely
      - Undecided
      - Unlikely
      - false
      required: true
    - id: 8
      name: preferred_month
      label: Preferred Month
      hint: Best month for the forum
      type: select_one
      options:
      - January
      - February
      - March
      - April
      - May
      - June
      - July
      - August
      - September
      - October
      - November
      - December
      required: true
    - id: 9
      name: preferred_quarter
      label: Preferred Quarter
      hint: Best quarter
      type: select_one
      options:
      - Q1 (Jan-Mar)
      - Q2 (Apr-Jun)
      - Q3 (Jul-Sep)
      - Q4 (Oct-Dec)
      - No Preference
      required: true
    - id: 10
      name: preferred_day_of_week
      label: Preferred Day of Week
      hint: Best day
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - No Preference
      required: true
    - id: 11
      name: date_option_1
      label: Date Option 1 Availability
      hint: First proposed date
      type: select_one
      options:
      - Available
      - Conflict
      - Maybe
      required: false
    - id: 12
      name: date_option_2
      label: Date Option 2 Availability
      hint: Second proposed date
      type: select_one
      options:
      - Available
      - Conflict
      - Maybe
      required: false
    - id: 13
      name: date_option_3
      label: Date Option 3 Availability
      hint: Third proposed date
      type: select_one
      options:
      - Available
      - Conflict
      - Maybe
      required: false
    - id: 14
      name: scheduling_conflicts
      label: Scheduling Conflicts
      hint: Any known conflicts?
      type: text
      options: []
      required: false
    - id: 15
      name: format_preference
      label: Format Preference
      hint: How should the forum be held?
      type: select_one
      options:
      - In Person
      - Virtual
      - Hybrid
      - No Preference
      required: true
    - id: 16
      name: location_preference
      label: Location Preference
      hint: Preferred city or venue
      type: text
      options: []
      required: false
    - id: 17
      name: session_topics
      label: Session Topics of Interest
      hint: Select all that apply
      type: select_multiple
      options:
      - Legal Updates
      - Judicial Ethics
      - Case Management
      - Technology in Courts
      - Diversity and Inclusion
      - Mental Health
      - Access to Justice
      - Sentencing Reform
      - Other
      required: false
    - id: 18
      name: topic_suggestions
      label: Topic Suggestions
      hint: What topics should be covered?
      type: text
      options: []
      required: false
    - id: 19
      name: speaker_interest
      label: Speaker Interest
      hint: Would you like to speak?
      type: select_one
      options:
      - Yes, Interested
      - Maybe
      - No, Thank You
      required: false
    - id: 20
      name: speaker_topic
      label: Speaker Topic
      hint: What would you present?
      type: text
      options: []
      required: false
    - id: 21
      name: panel_interest
      label: Panel Participation
      hint: Would you join a panel?
      type: select_one
      options:
      - Yes, Interested
      - Maybe
      - No, Thank You
      required: false
    - id: 22
      name: networking_events
      label: Networking Events
      hint: Which events interest you?
      type: select_multiple
      options:
      - Welcome Reception
      - Breakfast
      - Lunch
      - Dinner
      - Coffee Breaks
      - None
      required: false
    - id: 23
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Dairy-Free
      - Nut Allergies
      - Kosher
      - Halal
      - Other
      required: false
    - id: 24
      name: accessibility_needs
      label: Accessibility Needs
      hint: Any accommodations needed?
      type: text
      options: []
      required: false
    - id: 25
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
