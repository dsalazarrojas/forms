inputSchema:
  type: object
  properties:
    title: Social Media Audit Form
    pages:
    - id: 1
      name: social_media_platforms
      label: Social Media Platform(s) Used
      hint: null
      type: select_multiple
      options:
      - Instagram
      - Facebook
      - Twitter
      - LinkedIn
      required: false
    - id: 2
      name: current_posts
      label: Current Posts
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: engagement_rate
      label: Engagement Rate
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: audience_demographics
      label: Audience Demographics
      hint: null
      type: select_multiple
      options:
      - 18-24
      - 25-34
      - 35-44
      - 45-54
      - 55-64
      - 65 or older
      required: false
    - id: 5
      name: audience_language
      label: Audience Language
      hint: null
      type: select_multiple
      options:
      - English
      - Spanish
      - French
      - Other
      required: false
    - id: 6
      name: current_followers
      label: Current Followers
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: follower_growth_rate
      label: Follower Growth Rate
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: average_posts_per_month
      label: Average Posts per Month
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: engagement_boosting
      label: Engagement Boosting Strategy
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 10
      name: average_engagement_boosting_rate
      label: Average Engagement Boosting Rate
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: average_posts_growth_rate
      label: Average Posts Growth Rate
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: boosting_cost
      label: Boosting Cost
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: average_boosting_cost
      label: Average Boosting Cost
      hint: null
      type: number
      options: []
      required: false
