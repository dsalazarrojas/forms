      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Your email
      hint: A valid email address, please
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Your phone number
      hint: A valid phone number, please
      type: text
      options: []
      required: false
    - id: 7
      name: time_spent
      label: How much time do you spend on PDF merging per week?
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: satisfaction
      label: How satisfied are you with our PDF Merging Survey?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
