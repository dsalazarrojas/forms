inputSchema:
  type: object
  properties:
    title: pdf_document_merging_survey
    pages:
    - id: 1
      name: introduction
      label: Welcome to our PDF Merging Survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: pdf_merging_workflows
      label: How do you currently merge PDFs?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 3
      name: merging_method
