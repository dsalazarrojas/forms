description: Gather key insights and quantifiable results for crafting compelling
  customer success stories.
questions:
- options:
  - Highly satisfied
  - Satisfied
  - Neutral
  - Somewhat dissatisfied
  - Dissatisfied
  text: How satisfied are you with the results achieved using our solution?
  type: single
- text: What primary business challenge were you facing before using our solution?
  type: text
- options:
  - Increased efficiency
  - Cost savings
  - Improved customer satisfaction
  - Enhanced productivity
  - Better decision-making
  - Reduced risk
  text: Which of the following benefits have you realized since implementing our solution?
    (select all that apply)
  type: multiple
- options:
  - Core Feature X
  - Analytics Dashboard
  - Integration Module
  - Reporting Tools
  - Support & Training
  text: Which features of our solution have been most impactful for you? (select all
    that apply)
  type: multiple
- options:
  - Extremely likely
  - Very likely
  - Neutral
  - Unlikely
  - Very unlikely
  text: How likely are you to recommend our solution to a colleague or peer?
  type: single
- text: What specific achievement or quantifiable result stands out from your experience
    with our solution?
  type: text
title: Customer success story questionnaire
