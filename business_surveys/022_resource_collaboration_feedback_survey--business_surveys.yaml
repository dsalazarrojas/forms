    - id: 2
      name: shared_resources
      label: Shared Resources
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: collaboration_outcomes
      label: Collaboration Outcomes
      hint: null
      type: text
      options: []
