inputSchema:
  type: object
  properties:
    title: pitch_explanation_survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: A brief introduction to the pitch
      type: text
      options: []
      required: false
    - id: 2
      name: pitch_opinion
      label: What did you think of the pitch?
      hint: Select one
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: feedback
      label: feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: improvement_point
      label: What do you think is the main improvement point for the pitch?
      hint: Select one
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: suggestion
      label: Do you have any suggestions for the pitch?
      hint: Please provide your suggestions
      type: text
      options: []
      required: false
    - id: 6
      name: next_steps
      label: What are the next steps for the pitch?
      hint: Please provide your next steps
      type: text
      options: []
      required: false
    - id: 7
      name: additional_comments
      label: Do you have any other comments on the pitch?
      hint: Please provide any additional comments
      type: text
      options: []
      required: false
    - id: 8
      name: follow_up_info
      label: How can I follow up with you about the pitch?
      hint: Provide a preferred email address or phone number
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: Enter a valid email address
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone Number
      hint: Enter a valid phone number
      type: text
      options: []
      required: false
    - id: 11
      name: additional_info
      label: Additional Information
      hint: Please provide any additional information
      type: text
      options: []
      required: false
    - id: 12
      name: status
      label: What is the status of the pitch?
      hint: Please provide the current status
      type: text
      options: []
      required: false
    - id: 13
      name: follow_up
      label: Follow-up
      hint: How can I follow up with you about the pitch?
      type: text
      options: []
      required: false
    - id: 14
      name: suggestion_phone
      label: Your phone number
      hint: Enter a valid phone number
      type: text
      options: []
      required: false
    - id: 15
      name: email_address
      label: Your email address
      hint: Enter a valid email address
      type: email
      options: []
      required: false
