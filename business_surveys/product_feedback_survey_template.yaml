description: Gathering feedback on our product to enhance user experience and inform
  future development.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied are you with our product overall?
  type: single
- options:
  - Design
  - Price
  - Performance
  - Core Features
  - Ease of Use
  - Customer Support
  text: Which features or aspects most influenced your opinion of the product? (Select
    all that apply)
  type: multiple
- options:
  - true
  - false
  - Maybe
  text: Would you recommend this product to others?
  type: single
- text: What is the primary problem our product helps you solve?
  type: text
- text: What would you improve or change about the product?
  type: text
- text: Do you have any additional comments or feedback for us?
  type: text
title: Product feedback survey
