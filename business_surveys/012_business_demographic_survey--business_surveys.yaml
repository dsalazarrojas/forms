inputSchema:
  type: object
  properties:
    title: Business Demographic Survey
    pages:
    - id: 1
      name: business_overview
      label: -- Business Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: business_name
      label: Business Name
      hint: Name of your company
      type: text
      options: []
      required: true
    - id: 3
      name: years_in_operation
      label: Years in Operation
      hint: How long has the business existed?
      type: number
      options: []
      required: true
    - id: 4
      name: business_structure
      label: Business Structure
      hint: How is your business organized?
      type: select_one
      options:
      - Sole Proprietorship
      - Partnership
      - LLC
      - Corporation
      - Non-Profit
      - Cooperative
      required: true
    - id: 5
      name: primary_industry
      label: Primary Industry
      hint: Select your main industry
      type: select_one
      options:
      - Agriculture
      - Technology
      - Healthcare
      - Manufacturing
      - Retail
      - Services
      - Finance
      - Education
      - Other
      required: true
    - id: 6
      name: employee_demographics
      label: -- Employee Demographics --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: total_employees
      label: Total Number of Employees
      hint: Current full and part-time staff
      type: number
      options: []
      required: true
    - id: 8
      name: full_time_count
      label: Full-Time Employees
      hint: Number of full-time staff
      type: number
      options: []
      required: false
    - id: 9
      name: part_time_count
      label: Part-Time Employees
      hint: Number of part-time staff
      type: number
      options: []
      required: false
    - id: 10
      name: management_breakdown
      label: Management structure
      hint: Select applicable management levels
      type: select_multiple
      options:
      - Executive/Owner
      - Management
      - Supervisory
      - Entry Level
      required: false
    - id: 11
      name: employee_growth
      label: Employee growth in past year
      hint: How has your team size changed?
      type: select_one
      options:
      - Decreased
      - Stable
      - Slight Growth
      - Moderate Growth
      - Significant Growth
      required: false
    - id: 12
      name: financial_demographics
      label: -- Financial Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: annual_revenue
      label: Annual Revenue
      hint: Total annual revenue
      type: select_one
      options:
      - Less than $100K
      - $100K - $500K
      - $500K - $1M
      - $1M - $5M
      - $5M - $10M
      - $10M - $50M
      - More than $50M
      required: true
    - id: 14
      name: revenue_growth
      label: Revenue growth trajectory
      hint: How is your revenue trending?
      type: select_one
      options:
      - Declining
      - Flat
      - Modest Growth
      - Strong Growth
      - Rapid Growth
      required: false
    - id: 15
      name: profit_margin
      label: Estimated Profit Margin
      hint: Percentage of revenue that is profit
      type: number
      options: []
      required: false
    - id: 16
      name: market_demographics
      label: -- Market Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: primary_market
      label: Primary Market
      hint: Where do you primarily operate?
      type: select_one
      options:
      - Local
      - Regional
      - National
      - International
      required: true
    - id: 18
      name: target_demographics
      label: Target Customer Demographics
      hint: Who are your primary customers?
      type: text
      options: []
      required: false
    - id: 19
      name: customer_count
      label: Number of Active Customers
      hint: Approximate customer count
      type: number
      options: []
      required: false
    - id: 20
      name: market_concentration
      label: Customer Concentration
      hint: Are customers spread out or concentrated?
      type: select_one
      options:
      - Highly Concentrated
      - Moderately Concentrated
      - Fairly Distributed
      - Well Distributed
      required: false
    - id: 21
      name: ownership_demographics
      label: -- Ownership Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: number_of_owners
      label: Number of Owners
      hint: How many owners does the business have?
      type: number
      options: []
      required: false
    - id: 23
      name: owner_backgrounds
      label: Owner backgrounds and experience
      hint: Years of experience in industry
      type: text
      options: []
      required: false
