inputSchema:
  type: object
  properties:
    title: Censorship Awareness Survey
    pages:
      - id: 1
        name: demographics_header
        label: -- Demographic Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: age_group
        label: Age Group
        hint: null
        type: select_one
        options:
          - Under 18
          - 18-24
          - 25-34
          - 35-44
          - 45-54
          - 55+
        required: true
      - id: 3
        name: profession_category
        label: Profession
        hint: Select the category that best describes your work
        type: select_one
        options:
          - Education
          - Research
          - Media
          - Legal
          - Technology
          - Other
        required: true
      - id: 4
        name: awareness_header
        label: -- Awareness of Censorship --
        hint: null
        type: note
        options: []
        required: false
      - id: 5
        name: awareness_rating
        label: Awareness of Information Rights
        hint: How would you rate your overall awareness
        type: select_one
        options:
          - Very High
          - High
          - Moderate
          - Low
          - Very Low
        required: true
      - id: 6
        name: known_censorship_forms
        label: Forms of Censorship
        hint: Which forms are you most familiar with
        type: select_multiple
        options:
          - Internet filtering
          - Book banning
          - Media suppression
          - Academic restrictions
          - Self-censorship
        required: true
      - id: 7
        name: personal_experience_header
        label: -- Personal Experience --
        hint: null
        type: note
        options: []
        required: false
      - id: 8
        name: experienced_censorship
