        hint: null
        type: select_one
        options:
          - Yes
          - No
          - Unsure
        required: true
      - id: 9
        name: experience_description
        label: Describe the Incident
        hint: Optional - please share a brief description if you answered yes
        type: text
        options: []
        required: false
      - id: 10
        name: concern_levels_header
        label: -- Concern Levels --
        hint: null
        type: note
        options: []
        required: false
      - id: 11
        name: field_concern_level
        label: Concern in Your Field
        hint: How concerned are you about censorship in your profession
        type: select_one
        options:
          - Extremely Concerned
          - Concerned
          - Somewhat Concerned
          - Not Concerned
