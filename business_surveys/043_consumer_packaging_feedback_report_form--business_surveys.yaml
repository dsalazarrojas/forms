      - id: 18
        name: sustainability_rating
        label: Sustainability Rating
        hint: Rate environmental friendliness
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 19
        name: recyclability
        label: Recyclability
        hint: Is packaging easy to recycle
        type: select_one
        options:
          - Very Easy
          - Easy
          - Neutral
          - Difficult
          - Very Difficult
          - Not Sure
        required: true
      - id: 20
        name: storage_convenience
        label: Storage Convenience
        hint: Rate ease of storage
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
