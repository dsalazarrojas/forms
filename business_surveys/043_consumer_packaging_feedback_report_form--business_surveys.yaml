      - id: 23
        name: improvement_suggestions
        label: Suggestions for Improvement
        hint: What could be better
        type: text
        options: []
        required: true
      - id: 24
        name: purchase_influence
        label: Does Packaging Influence Purchase
        hint: Select if packaging affects your buying
        type: select_one
        options:
          - Yes, Significantly
          - Yes, Somewhat
          - Neutral
          - Not Really
          - No, Not at All
        required: true
      - id: 25
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback
        type: text
        options: []
        required: false
