        hint: Rate overall usability
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 14
        name: resealability
        label: Resealability
        hint: Rate the resealing feature if applicable
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
          - Not Applicable
        required: false
      - id: 15
        name: product_protection
        label: Product Protection
        hint: Rate how well it protects the product
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 16
        name: durability
        label: Durability
        hint: Rate the sturdiness
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
