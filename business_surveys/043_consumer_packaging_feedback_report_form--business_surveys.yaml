        name: first_impression
        label: First Impression
        hint: Rate your first impression
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 9
        name: visual_appeal
        label: Visual Appeal
        hint: Rate the appearance
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 10
        name: color_scheme
        label: Color Scheme
        hint: Rate the colors used
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 11
        name: label_clarity
        label: Label Clarity
        hint: Rate how clear the labeling is
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
