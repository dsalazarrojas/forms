inputSchema:
  type: object
  properties:
    title: Consumer Packaging Feedback Report Form
    pages:
      - id: 1
        name: respondent_name
        label: Your Name
        hint: Full name - optional
        type: text
        options: []
        required: false
      - id: 2
        name: respondent_email
        label: Email Address
        hint: For follow-up - optional
        type: email
        options: []
        required: false
      - id: 3
        name: respondent_type
        label: Respondent Type
        hint: Select your role
        type: select_one
        options:
          - Customer
          - Retail Partner
          - Distributor
          - Internal Staff
          - Other
        required: true
      - id: 4
        name: product_name
        label: Product Name
        hint: Name of the product
        type: text
        options: []
        required: true
      - id: 5
        name: product_category
        label: Product Category
        hint: Select category
        type: select_one
        options:
          - Food
          - Beverage
          - Personal Care
          - Household
          - Electronics
          - Clothing
          - Other
        required: true
      - id: 6
        name: packaging_type
        label: Packaging Type
        hint: Select packaging type
        type: select_one
        options:
          - Box
          - Bottle
          - Jar
          - Can
          - Pouch
          - Tube
          - Blister Pack
          - Other
        required: true
      - id: 7
        name: packaging_material
        label: Packaging Material
        hint: What material is used
        type: select_one
        options:
          - Plastic
          - Glass
          - Metal
          - Cardboard
          - Paper
          - Biodegradable
          - Mixed Materials
        required: true
