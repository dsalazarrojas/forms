      type: select_multiple
      options:
      - Tone
      - Content
      - Format
      - Other
      required: false
    - id: 10
      name: communication_channels_improve
      label: channels_improve
      hint: What would you want to see changed in HR's communication channels?
      type: text
      options: []
      required: false
    - id: 11
      name: tone_improve_channels
      label: tone_improve_channels
      hint: What tone would improve HR's communication channels?
      type: text
      options: []
      required: false
