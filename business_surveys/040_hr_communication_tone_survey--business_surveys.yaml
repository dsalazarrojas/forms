inputSchema:
  type: object
  properties:
    title: HR Communication Tone Survey
    pages:
    - id: 1
      name: intro_question
      label: introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: tone_perceived
      label: Tone Perceived
      hint: How often do you feel that HR's tone is helpful and supportive?
      type: select_one
      options:
      - Very Often
      - Often
      - Sometimes
      - Rarely
      - Never
      required: false
    - id: 3
      name: satisfaction_level
      label: Satisfaction Level
      hint: null
      type: select_multiple
      options:
      - Satisfied
      - Not Satisfied
      - Very Satisfied
      required: false
    - id: 4
      name: tone_improve
      label: Tone to Improve
      hint: What tone would improve HR's communication?
      type: text
      options: []
      required: false
    - id: 5
      name: suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: communication_channels
      label: How do you usually receive HR's communication?
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Text
      - Intranet
      - Other
      required: false
    - id: 7
      name: time_response
      label: How long did it take you to respond?
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: frequency_response
