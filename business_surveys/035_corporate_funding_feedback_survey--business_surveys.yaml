inputSchema:
  type: object
  properties:
    title: Corporate Funding Feedback Survey
    pages:
    - id: 1
      name: funder_type
      label: Funding Type
      hint: null
      type: select_one
      options:
      - Direct Grant
      - Indirect Grant
      - Loan
      - Other
      required: false
    - id: 2
      name: satisfaction
      label: Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: impact
      label: Impact
      hint: null
      type: select_multiple
      options:
      - Increased Revenue
      - Job Creation
      - Increased Efficiency
      required: false
    - id: 4
      name: improvement_ideas
      label: Improvement Ideas
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: contact_info
      label: Contact Info
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
