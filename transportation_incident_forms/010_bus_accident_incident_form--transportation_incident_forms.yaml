inputSchema:
  type: object
  properties:
    title: Bus Accident Incident Form
    pages:
    - id: 1
      name: incident_basics
      label: Incident Basics
      hint: Basic information about the incident
      type: note
      options: []
      required: false
    - id: 2
      name: incident_date
      label: Incident Date
      hint: Date when the accident occurred
      type: date
      options: []
      required: true
    - id: 3
      name: incident_time
      label: Incident Time
      hint: Time when the accident occurred
      type: time
      options: []
      required: true
    - id: 4
      name: incident_location
      label: Incident Location
      hint: Full address or location description
      type: text
      options: []
      required: true
    - id: 5
      name: weather_conditions
      label: Weather Conditions
      hint: Weather at time of incident
      type: select_one
      options:
      - Clear
      - Cloudy
      - Rain
      - Snow
      - Fog
      - Ice
      - Other
      required: true
    - id: 6
      name: road_conditions
      label: Road Conditions
      hint: Condition of the road surface
      type: select_one
      options:
      - Dry
      - Wet
      - Icy
      - Snowy
      - Under Construction
      - Damaged
      - Other
      required: true
    - id: 7
      name: vehicle_info
      label: Vehicle Information
      hint: Details about the bus involved
      type: note
      options: []
      required: false
    - id: 8
      name: bus_number
      label: Bus Number
      hint: Bus identification number
      type: text
      options: []
      required: true
    - id: 9
      name: bus_route
      label: Bus Route
      hint: Route number or name
      type: text
      options: []
      required: true
    - id: 10
      name: driver_name
      label: Driver Name
      hint: Full name of the driver
      type: text
      options: []
      required: true
    - id: 11
      name: driver_id
      label: Driver ID
      hint: Driver employee ID
      type: text
      options: []
      required: true
    - id: 12
      name: driver_license
      label: Driver License Number
      hint: Driver license number
      type: text
      options: []
      required: true
    - id: 13
      name: passengers_onboard
      label: Passengers Onboard
      hint: Number of passengers at time of incident
      type: number
      options: []
      required: true
    - id: 14
      name: incident_type
      label: Incident Type
      hint: Type of accident
      type: select_one
      options:
      - Collision with Vehicle
      - Collision with Pedestrian
      - Collision with Object
      - Rollover
      - Fire
      - Mechanical Failure
      - Medical Emergency
      - Other
      required: true
    - id: 15
      name: injuries
      label: Injuries
      hint: Information about injuries
      type: note
      options: []
      required: false
    - id: 16
      name: injuries_reported
      label: Were There Injuries
      hint: Did anyone sustain injuries
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 17
      name: number_injured
      label: Number of Injured
      hint: Total number of injured persons
      type: number
      options: []
      required: false
    - id: 18
      name: fatalities
      label: Fatalities
      hint: Number of fatalities
      type: number
      options: []
      required: false
    - id: 19
      name: injury_description
      label: Injury Description
      hint: Describe the injuries sustained
      type: text
      options: []
      required: false
    - id: 20
      name: emergency_response
      label: Emergency Response
      hint: Emergency services information
      type: note
      options: []
      required: false
    - id: 21
      name: emergency_services_called
      label: Were Emergency Services Called
      hint: Which services responded
      type: select_multiple
      options:
      - Police
      - Ambulance
      - Fire Department
      - None
      required: true
    - id: 22
      name: hospital_transport
      label: Hospital Transport Required
      hint: Were any persons transported to hospital
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 23
      name: witnesses
      label: Witnesses
      hint: Witness information
      type: note
      options: []
      required: false
    - id: 24
      name: witness_count
      label: Number of Witnesses
      hint: How many witnesses are there
      type: number
      options: []
      required: false
    - id: 25
      name: witness_contacts
      label: Witness Contact Information
      hint: Names and contact details of witnesses
      type: text
      options: []
      required: false
    - id: 26
      name: incident_description
      label: Detailed Incident Description
      hint: Provide a detailed account of what happened
      type: text
      options: []
      required: true
    - id: 27
      name: contributing_factors
      label: Contributing Factors
      hint: What factors may have contributed
      type: select_multiple
      options:
      - Driver Error
      - Mechanical Failure
      - Weather Conditions
      - Road Conditions
      - Other Vehicle
      - Pedestrian Error
      - Obstruction
      - Other
      required: true
    - id: 28
      name: photos_taken
      label: Were Photos Taken
      hint: Is there photographic evidence
      type: select_one
      options:
      - 'True'
      - 'False'
      - In Progress
      required: true
    - id: 29
      name: police_report_filed
      label: Police Report Filed
      hint: Has a police report been filed
      type: select_one
      options:
      - 'True'
      - 'False'
      - Pending
      required: true
    - id: 30
      name: police_report_number
      label: Police Report Number
      hint: Report reference number
      type: text
      options: []
      required: false
    - id: 31
      name: reporter_name
      label: Reporter Name
      hint: Name of person filing this report
      type: text
      options: []
      required: true
    - id: 32
      name: reporter_role
      label: Reporter Role
      hint: Your position or relationship to incident
      type: text
      options: []
      required: true
    - id: 33
      name: report_date
      label: Report Date
      hint: Date this report is filed
      type: date
      options: []
      required: true
