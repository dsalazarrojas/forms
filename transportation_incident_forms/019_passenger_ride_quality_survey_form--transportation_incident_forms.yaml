inputSchema:
  type: object
  properties:
    title: Passenger Ride Quality Survey Form
    pages:
    - id: 1
      name: ride_quality_form_section
      label: ride_quality_form_section
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: rating_1
      label: what_were_your_overall_feelings_about_your_trip
      hint: null
      type: select_one
      options:
      - Very Dissatisfied
      - Somewhat Dissatisfied
      - Somewhat Satisfied
      - Satisfied
      - Very Satisfied
      required: false
    - id: 3
      name: service_quality
      label: how_would_you_rate_the_service_quality
      hint: null
      type: select_one
      options:
      - Very Poor
      - Somewhat Poor
      - Neutral
      - Good
      - Excellent
      required: false
    - id: 4
      name: cleanliness
      label: how_would_you_rate_the_cleanliness
      hint: null
      type: select_one
      options:
      - Very Poor
      - Somewhat Poor
      - Neutral
      - Good
      - Excellent
      required: false
    - id: 5
      name: communication
      label: how_would_you_rate_the_communication
      hint: null
      type: select_one
      options:
      - Very Poor
      - Somewhat Poor
      - Neutral
      - Good
      - Excellent
      required: false
    - id: 6
      name: on_time
      label: how_would_you_rate_the_on_time_service
      hint: null
      type: select_one
      options:
      - Very Poor
      - Somewhat Poor
      - Neutral
      - Good
      - Excellent
      required: false
    - id: 7
      name: overall_experience
