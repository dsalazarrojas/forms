inputSchema:
  type: object
  properties:
    title: Airline In Flight Service Quality Audit Form
    pages:
    - id: 1
      name: auditor_name
      label: Auditor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: audit_date
      label: Date of Audit
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: flight_number
      label: Flight Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: aircraft_type
      label: Aircraft Type
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: sector_flown
      label: Sector Flown
      hint: e.g. LHR-JFK
      type: text
      options: []
      required: true
    - id: 6
      name: cabin_class_audited
      label: Cabin Class Audited
      hint: null
      type: select_one
      options:
      - Economy
      - Premium Economy
      - Business
      - First Class
      required: true
    - id: 7
      name: section_grooming
      label: -- Crew Grooming and Presentation --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: crew_uniform_standard
      label: Crew Uniform Standard Adherence
      hint: Rate 1-5
      type: number
      options: []
      required: true
    - id: 9
      name: crew_professionalism
      label: Professionalism and Attitude
      hint: Rate 1-5
      type: number
      options: []
      required: true
    - id: 10
      name: section_service_delivery
      label: -- Service Delivery --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: boarding_greeting
      label: Greeting at Boarding
      hint: null
      type: select_one
      options:
      - Excellent
      - Standard
      - Below Standard
      - Not Observed
      required: true
    - id: 12
      name: pre_departure_service
      label: Pre-departure Service Execution
      hint: null
      type: select_one
      options:
      - Completed Correctly
      - Completed with Errors
      - Not Completed
      required: true
    - id: 13
      name: meal_presentation
      label: Meal Presentation Quality
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: beverage_service_frequency
      label: Frequency of Beverage Service
      hint: null
      type: select_one
      options:
      - Proactive
      - On Request Only
      - Insufficient
      required: true
    - id: 15
      name: lavatory_cleanliness_check
      label: Lavatory Cleanliness throughout Flight
      hint: null
      type: number
      options: []
      required: true
    - id: 16
      name: safety_announcements
      label: Clarity and Professionalism of Safety Announcements
      hint: null
      type: number
      options: []
      required: true
    - id: 17
      name: audit_summary
      label: Auditor Summary and Remarks
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: corrective_action_required
      label: Is corrective action required?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
