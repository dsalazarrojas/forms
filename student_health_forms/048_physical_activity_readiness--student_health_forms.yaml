inputSchema:
  type: object
  properties:
    title: Physical Activity Readiness
    pages:
    - id: 1
      name: student_health_form_1
      label: Physical Activity Readiness
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_health_form_2
      label: Do you have any heart problems?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: student_health_form_3
      label: Have you had any of the following?
      hint: null
      type: select_multiple
      options:
      - High blood pressure
      - Heart disease
      - Asthma
      - Other
      required: false
    - id: 4
      name: student_health_form_4
      label: Please describe
      hint: Please provide more details
      type: text
      options: []
      required: false
    - id: 5
      name: student_health_form_5
      label: Please contact
      hint: null
      type: email
      options: []
      required: false
