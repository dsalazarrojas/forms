      label: Equipment Tracking
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: usage_history
      label: Usage History
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: issues_flagged
      label: Issues Flagged
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: next_user
      label: Next User
      hint: null
      type: select_one
      options:
      - User 1
      - User 2
      - User 3
      required: false
    - id: 5
      name: date_used
      label: date_used
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time_used
      label: time_used
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: usage_start_time
      label: usage_start_time
      hint: null
      type: date
      options: []
