    - id: 8
      name: usage_end_time
      label: usage_end_time
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: equipment_type
      label: equipment_type
      hint: null
      type: select_one
      options:
      - Equipment A
      - Equipment B
      required: false
    - id: 10
      name: usage_status
      label: usage_status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 11
      name: equipment_condition
      label: equipment_condition
