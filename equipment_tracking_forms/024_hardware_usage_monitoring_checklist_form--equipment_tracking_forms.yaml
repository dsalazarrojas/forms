      type: select_multiple
      options:
      - Damage
      - Wear and tear
      - None of the above
      required: false
    - id: 12
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: issue_description
      label: issue_description
      hint: null
      type: select_multiple
      options:
      - Broken
      - Not broken
      required: false
