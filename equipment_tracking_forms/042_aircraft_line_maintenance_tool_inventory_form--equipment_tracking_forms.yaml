inputSchema:
  type: object
  properties:
    title: Aircraft Line Maintenance Tool Inventory Form
    pages:
    - id: 1
      name: inventory_date
      label: Inventory Date
      hint: Date of inventory
      type: date
      options: []
      required: true
    - id: 2
      name: location
      label: Location
      hint: Hangar or station
      type: text
      options: []
      required: true
    - id: 3
      name: technician_name
      label: Technician Name
      hint: Person conducting inventory
      type: text
      options: []
      required: true
    - id: 4
      name: technician_id
      label: Technician ID
      hint: Employee number
      type: text
      options: []
      required: true
    - id: 5
      name: tool_category
      label: Tool Category
      hint: Type of tools
      type: select_one
      options:
      - Hand tools
      - Power tools
      - Precision tools
      - Specialized tools
      - Test equipment
      - Safety equipment
      - All categories
      required: true
    - id: 6
      name: tool_id
      label: Tool ID Number
      hint: Inventory identifier
      type: text
      options: []
      required: true
    - id: 7
      name: tool_name
      label: Tool Name
      hint: Description
      type: text
      options: []
      required: true
    - id: 8
      name: tool_type
      label: Tool Type
      hint: Specific type
      type: text
      options: []
      required: true
    - id: 9
      name: manufacturer
      label: Manufacturer
      hint: Brand
      type: text
      options: []
      required: false
    - id: 10
      name: model_number
      label: Model Number
      hint: Model designation
      type: text
      options: []
      required: false
    - id: 11
      name: serial_number
      label: Serial Number
      hint: Tool serial
      type: text
      options: []
      required: false
    - id: 12
      name: quantity
      label: Quantity
      hint: Number of items
      type: number
      options: []
      required: true
    - id: 13
      name: condition
      label: Condition
      hint: Current state
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Needs repair
      - Out of service
      required: true
    - id: 14
      name: calibration_status
      label: Calibration Status
      hint: Is calibration current
      type: select_one
      options:
      - Current
      - Due soon
      - Expired
      - Not required
      required: true
    - id: 15
      name: calibration_date
      label: Last Calibration Date
      hint: When calibrated
      type: date
      options: []
      required: false
    - id: 16
      name: next_calibration_due
      label: Next Calibration Due
      hint: Due date
      type: date
      options: []
      required: false
    - id: 17
      name: location_detail
      label: Storage Location
      hint: Where stored
      type: text
      options: []
      required: true
    - id: 18
      name: checkout_status
      label: Checkout Status
      hint: Is tool checked out
      type: select_one
      options:
      - In stock
      - Checked out
      - In maintenance
      - Lost
      required: true
    - id: 19
      name: checked_out_to
      label: Checked Out To
      hint: Technician name
      type: text
      options: []
      required: false
    - id: 20
      name: checkout_date
      label: Checkout Date
      hint: When checked out
      type: date
      options: []
      required: false
    - id: 21
      name: expected_return
      label: Expected Return Date
      hint: When due back
      type: date
      options: []
      required: false
    - id: 22
      name: aircraft_assigned
      label: Assigned Aircraft
      hint: If dedicated to specific aircraft
      type: text
      options: []
      required: false
    - id: 23
      name: purchase_date
      label: Purchase Date
      hint: When acquired
      type: date
      options: []
      required: false
    - id: 24
      name: purchase_cost
      label: Purchase Cost (USD)
      hint: Original cost
      type: number
      options: []
      required: false
    - id: 25
      name: replacement_value
      label: Replacement Value (USD)
      hint: Current value
      type: number
      options: []
      required: false
    - id: 26
      name: last_maintenance
      label: Last Maintenance Date
      hint: When serviced
      type: date
      options: []
      required: false
    - id: 27
      name: maintenance_notes
      label: Maintenance Notes
      hint: Service performed
      type: text
      options: []
      required: false
    - id: 28
      name: replacement_needed
      label: Replacement Needed
      hint: Does tool need replacing
      type: select_one
      options:
      - 'False'
      - Yes, scheduled
      - Yes, urgent
      - Under review
      required: true
    - id: 29
      name: shadow_board
      label: Shadow Board Location
      hint: Board identifier
      type: text
      options: []
      required: false
    - id: 30
      name: fod_control
      label: FOD Control Status
      hint: Is tool FOD controlled
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 31
      name: missing_tools
      label: Missing Tools Count
      hint: Number not accounted for
      type: number
      options: []
      required: true
    - id: 32
      name: discrepancy_notes
      label: Discrepancy Notes
      hint: Any issues found
      type: text
      options: []
      required: false
    - id: 33
      name: inventory_status
      label: Inventory Status
      hint: Overall status
      type: select_one
      options:
      - Complete, all accounted for
      - Complete, some discrepancies
      - Incomplete
      required: true
    - id: 34
      name: supervisor_review
      label: Supervisor Review
      hint: Supervisor name
      type: text
      options: []
      required: false
    - id: 35
      name: technician_signature
      label: Technician Signature
      hint: Digital signature
      type: text
      options: []
      required: true
