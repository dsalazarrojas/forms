inputSchema:
  type: object
  properties:
    title: Home Matching Request Form
    pages:
    - id: 1
      name: personal_details
      label: Personal Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: property_preferences
      label: Property Preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: budget
      label: Budget
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: property_features
      label: Property Features
      hint: null
      type: select_multiple
      options:
      - Pool
      - Parking
      - View
      - Security
      required: true
    - id: 5
      name: additional_features
      label: Additional Features
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: schedule
      label: Schedule
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Weekends
      required: true
    - id: 7
      name: follow_up
      label: Follow up
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: contact_method
      label: Contact Method
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Message
      required: true
    - id: 9
      name: confirm
      label: Confirm
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: submission
      label: Submission
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
