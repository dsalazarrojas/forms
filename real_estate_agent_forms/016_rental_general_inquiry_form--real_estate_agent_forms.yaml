inputSchema:
  type: object
  properties:
    title: Rental General Inquiry Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: property_type
      label: Property Type
      hint: null
      type: select_one
      options:
      - Single Family
      - Duplex
      - Townhouse
      - Apartment
      required: true
    - id: 6
      name: property_size
      label: Property Size
      hint: null
      type: select_multiple
      options:
      - Less than 1000 sq. ft.
      - 1000-2000 sq. ft.
      - 2000-3000 sq. ft.
      - More than 3000 sq. ft.
      required: true
    - id: 7
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: move_in_date
      label: Move In Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: move_out_date
      label: Move Out Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: property_status
      label: Property Status
      hint: null
      type: select_one
      options:
      - For Sale
      - For Lease
      - For Rent
      required: true
    - id: 11
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: attachments
      label: Attachments
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
