inputSchema:
  type: object
  properties:
    title: Real Estate Positive Reply Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: property_type
      label: Property Type
      hint: null
      type: select_one
      options:
      - House
      - Condo
      - Townhouse
      required: true
    - id: 5
      name: property_type_other
      label: Other Property Type
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: property_location
      label: Property Location
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: property_value
      label: Property Value
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: true
    - id: 10
      name: date_time
      label: Date and Time
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: date_time_time
      label: Date and Time
      hint: null
      type: time
      options: []
      required: false
