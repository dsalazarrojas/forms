inputSchema:
  type: object
  properties:
    title: Tenant Rental Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: employment_status
      label: Employment Status
      hint: null
      type: select_one
      options:
      - Employed
      - Unemployed
      - Self-Employed
      - Student
      required: false
    - id: 8
      name: income
      label: Income
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: rental_history
      label: Rental History
      hint: null
      type: select_multiple
      options:
      - Previous landlord
      - No rental history
      required: false
    - id: 10
      name: rental_preferences
      label: Rental Preferences
      hint: null
      type: time
      options: []
      required: false
