inputSchema:
  type: object
  properties:
    title: Property Information Form
    pages:
    - id: 1
      name: property_address
      label: Street Address
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: property_city
      label: City
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: property_state
      label: State
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: property_zip
      label: Zip
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: property_type
      label: Type
      hint: null
      type: select_one
