      - Residential
      - Commercial
      - Industrial
      required: false
    - id: 6
      name: property_status
      label: Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Sold
      - Leased
      required: false
    - id: 7
      name: property_date_of_sale
      label: Date of Sale
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: property_sale_price
      label: Sale Price
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: property_agent
      label: Agent
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: property_agent_phone
      label: Agent Phone
      hint: null
      type: text
      options: []
      required: false
