inputSchema:
  type: object
  properties:
    title: Transaction Coordinator Form
    pages:
    - id: 1
      name: contact_information
      label: Contact Information
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: client
      label: Client
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: transaction_details
      label: Transaction Details
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: real_estate_agents
      label: Real Estate Agents
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: property_status
      label: Property Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 6
      name: loan_amount
      label: Loan Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: down_payment
      label: Down Payment
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: closing_date
      label: Closing Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: closing_time
      label: Closing Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: true
    - id: 14
      name: assigned_agent
      label: Assigned Agent
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
