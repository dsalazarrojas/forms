inputSchema:
  type: object
  properties:
    title: Camp Admission Checklist
    pages:
    - id: 1
      name: camper_name
      label: Camper Full Name
      hint: Legal name as on registration
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: Camper date of birth
      type: date
      options: []
      required: true
    - id: 3
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Primary contact for the camper
      type: text
      options: []
      required: true
    - id: 4
      name: emergency_contact
      label: Emergency Contact Phone
      hint: Phone number for emergencies
      type: text
      options: []
      required: true
    - id: 5
      name: medical_conditions
      label: Medical Conditions
      hint: List any medical conditions or allergies
      type: text
      options: []
      required: false
    - id: 6
      name: medications
      label: Medications to be administered
      hint: Specify medications and dosage schedule
      type: text
      options: []
      required: false
    - id: 7
      name: consent_signed
      label: Parent Guardian Consent Signed
      hint: Confirmation that consents are signed
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 8
      name: pickup_authorized_persons
      label: Authorized Pickup Persons
      hint: Names and relationship for pickup authorization
      type: text
      options: []
      required: true
    - id: 9
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Any food restrictions or special diets
      type: text
      options: []
      required: false
    - id: 10
      name: special_needs
      label: Special Needs or Accommodations
      hint: Note any support required during camp
      type: text
      options: []
      required: false
