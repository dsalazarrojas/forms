inputSchema:
  type: object
  properties:
    title: Advertising Form
    pages:
    - id: 1
      name: advertiser_details_header
      label: -- Advertiser Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: website_url
      label: Website URL
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: campaign_details_header
      label: -- Campaign Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: campaign_name
      label: Campaign Name
      hint: What should we call this advertising campaign?
      type: text
      options: []
      required: true
    - id: 9
      name: advertising_goal
      label: Primary Advertising Goal
      hint: What is the main objective?
      type: select_one
      options:
      - Brand Awareness
      - Lead Generation
      - Sales Conversion
      - Website Traffic
      - App Installs
      required: true
    - id: 10
      name: target_audience
      label: Target Audience Description
      hint: Briefly describe who you want to reach.
      type: text
      options: []
      required: true
    - id: 11
      name: ad_platforms
      label: Preferred Platforms
      hint: Where do you want your ads to appear?
      type: select_multiple
      options:
      - Social Media (Facebook/Instagram)
      - Search Engine (Google/Bing)
      - Display Networks
      - Email Newsletters
      - Print Media
      required: false
    - id: 12
      name: budget_range
      label: Estimated Budget
      hint: Select your budget range for this campaign.
      type: select_one
      options:
      - Less than $500
      - $500 - $1,000
      - $1,000 - $5,000
      - $5,000 - $10,000
      - $10,000+
      required: true
    - id: 13
      name: start_date
      label: Desired Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: end_date
      label: Desired End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 15
      name: additional_comments
      label: Additional Instructions
      hint: Any specific requirements or creative direction?
      type: text
      options: []
      required: false
