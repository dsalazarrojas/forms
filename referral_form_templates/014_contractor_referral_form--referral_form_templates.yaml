inputSchema:
  type: object
  properties:
    title: Contractor Referral Form
    pages:
    - id: 1
      name: referrer_name
      label: Your Name
      hint: Name of person making the referral
      type: text
      options: []
      required: true
    - id: 2
      name: referrer_email
      label: Your Email
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 3
      name: referrer_phone
      label: Your Phone
      hint: Your contact number
      type: text
      options: []
      required: false
    - id: 4
      name: relationship
      label: Your Relationship
      hint: How do you know the contractor
      type: select_one
      options:
      - Previous Customer
      - Friend
      - Family Member
      - Colleague
      - Business Partner
      - Neighbor
      - Other
      required: true
    - id: 5
      name: section_contractor_info
      label: -- Contractor Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: contractor_name
      label: Contractor Name
      hint: Name of the contractor you are referring
      type: text
      options: []
      required: true
    - id: 7
      name: contractor_company
      label: Contractor Company
      hint: Name of contractor company if applicable
      type: text
      options: []
      required: false
    - id: 8
      name: contractor_phone
      label: Contractor Phone
      hint: Contractor contact number
      type: text
      options: []
      required: true
    - id: 9
      name: contractor_email
      label: Contractor Email
      hint: Contractor email address
      type: email
      options: []
      required: false
    - id: 10
      name: contractor_address
      label: Contractor Address
      hint: Business address if known
      type: text
      options: []
      required: false
    - id: 11
      name: section_service_details
      label: -- Service Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: service_type
      label: Type of Service
      hint: What service did the contractor provide
      type: select_one
      options:
      - General Contracting
      - Electrical Work
      - Plumbing
      - HVAC
      - Roofing
      - Landscaping
      - Painting
      - Flooring
      - Remodeling
      - New Construction
      - Maintenance
      - Other
      required: true
    - id: 13
      name: service_description
      label: Service Description
      hint: Describe the work performed
      type: text
      options: []
      required: true
    - id: 14
      name: service_location
      label: Service Location
      hint: Where was the work performed
      type: text
      options: []
      required: false
    - id: 15
      name: service_date
      label: When was service performed
      hint: Approximate date or time period
      type: text
      options: []
      required: false
    - id: 16
      name: section_experience
      label: -- Your Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied were you with the work
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 18
      name: quality_rating
      label: Quality of Work
      hint: Rate the quality of workmanship
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 19
      name: professionalism_rating
      label: Professionalism
      hint: Rate their professionalism
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 20
      name: timeliness_rating
      label: Timeliness
      hint: Did they complete work on time
      type: select_one
      options:
      - Completed Early
      - On Time
      - Slightly Delayed
      - Significantly Delayed
      required: true
    - id: 21
      name: value_rating
      label: Value for Money
      hint: Was the pricing fair
      type: select_one
      options:
      - Excellent Value
      - Good Value
      - Fair Value
      - Poor Value
      required: true
    - id: 22
      name: would_hire_again
      label: Would you hire this contractor again
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Not Sure
      - Probably No
      - Definitely No
      required: true
    - id: 23
      name: strengths
      label: What were their greatest strengths
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: areas_for_improvement
      label: Any areas for improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: section_referral_reason
      label: -- Referral Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: why_referring
      label: Why are you referring this contractor
      hint: Your reason for making this referral
      type: text
      options: []
      required: true
    - id: 27
      name: specific_skills
      label: Specific Skills or Expertise
      hint: What makes this contractor stand out
      type: text
      options: []
      required: false
    - id: 28
      name: best_suited_for
      label: Best Suited For What Type of Work
      hint: What type of projects would you recommend them for
      type: text
      options: []
      required: false
    - id: 29
      name: permission_to_share
      label: Do we have permission to share your referral
      hint: Can we contact you about this referral
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 30
      name: additional_comments
      label: Additional Comments
      hint: Anything else you would like to share
      type: text
      options: []
      required: false
