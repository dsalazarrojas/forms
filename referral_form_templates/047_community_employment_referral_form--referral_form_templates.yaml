inputSchema:
  type: object
  properties:
    title: Employment Referral Form
    pages:
      - id: 1
        name: referrer_name
        label: Referrer name
        hint: Person making the referral
        type: text
        options: []
        required: true
      - id: 2
        name: referrer_contact
        label: Referrer contact email or phone
        hint: For follow up regarding the referral
        type: text
        options: []
        required: true
      - id: 3
        name: candidate_name
        label: Candidate name
        hint: Person being referred
        type: text
        options: []
        required: true
      - id: 4
        name: candidate_contact
        label: Candidate contact email or phone
        hint: For employer follow up
        type: text
        options: []
        required: true
      - id: 5
        name: position_referred_for
        label: Position referred for
        hint: Job title or vacancy reference
        type: text
        options: []
        required: true
      - id: 6
        name: candidate_skills_summary
        label: Candidate skills summary
        hint: Brief summary of relevant experience
        type: text
        options: []
        required: false
      - id: 7
        name: referral_permission
        label: Permission to share contact details
        hint: Confirm candidate consent to be referred
        type: select_one
        options:
          - Candidate consents
          - Candidate does not consent
        required: true
