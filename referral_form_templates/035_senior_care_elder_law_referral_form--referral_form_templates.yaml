inputSchema:
  type: object
  properties:
    title: senior_care_elder_law_referral_form
    pages:
    - id: 1
      name: basic_info
      label: Basic Information
      hint: Please provide the following information
      type: text
      options: []
      required: false
    - id: 2
      name: care_team
      label: Care Team
      hint: Please select the care team
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 3
      name: client_info
      label: Client Information
      hint: Please enter the client's details
      type: text
      options: []
      required: true
    - id: 4
      name: referral_date
      label: Referral Date
      hint: Please enter the referral date
      type: date
      options: []
      required: true
    - id: 5
      name: follow_up_details
      label: Follow-up Details
      hint: Please enter the follow-up details
      type: text
      options: []
      required: true
    - id: 6
      name: follow_up_method
      label: Follow-up Method
      hint: Please select the follow-up method
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 7
      name: follow_up_frequency
      label: Follow-up Frequency
      hint: Please select the follow-up frequency
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 8
      name: follow_up_status
      label: Follow-up Status
      hint: Please select the follow-up status
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
