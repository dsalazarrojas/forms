inputSchema:
  type: object
  properties:
    title: Retail Repair Service Referral Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: repair_date
      label: Repair Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: service_requested
      label: Service Requested
      hint: null
      type: select_multiple
      options:
      - Repair
      - Maintenance
      - Adjustment
      required: true
    - id: 7
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Repair
      - Maintenance
      - Adjustment
      required: true
    - id: 8
      name: customer_reference
      label: Customer Reference
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
