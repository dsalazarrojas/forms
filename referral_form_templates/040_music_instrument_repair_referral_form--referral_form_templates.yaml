      label: Instrument Model
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: repair_cost
      label: Repair Cost
      hint: null
      type: number
      options: []
      required: false
    - id: 20
      name: referral_source_other
      label: Referral Source Other
      hint: null
      type: text
      options: []
      required: false
