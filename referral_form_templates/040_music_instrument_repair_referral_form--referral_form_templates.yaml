      name: customer_notes
      label: Customer Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: instrument_brand
      label: Instrument Brand
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: instrument_type
      label: Instrument Type
      hint: null
