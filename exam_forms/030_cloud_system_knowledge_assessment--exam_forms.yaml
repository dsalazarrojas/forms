inputSchema:
  type: object
  properties:
    title: Cloud System Knowledge Assessment
    pages:
    - id: 1
      name: section_candidate
      label: -- Candidate Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: candidate_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: assessment_type
      label: Assessment Type
      hint: null
      type: select_one
      options:
      - Pre-hire evaluation
      - Employee certification
      - Skills verification
      - Training assessment
      - Promotion evaluation
      required: true
    - id: 6
      name: section_knowledge
      label: -- Cloud System Knowledge --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: question_1
      label: Which of the following is NOT a cloud service model?
      hint: null
      type: select_one
      options:
      - SaaS - Software as a Service
      - PaaS - Platform as a Service
      - IaaS - Infrastructure as a Service
      - HaaS - Hardware as a Service
      required: true
    - id: 8
      name: question_2
      label: What does RTO stand for in disaster recovery?
      hint: null
      type: select_one
      options:
      - Resource Transfer Order
      - Recovery Time Objective
      - Remote Termination Option
      - Real-time Transaction Optimization
      required: true
    - id: 9
      name: question_3
      label: Which cloud model provides the most control to the customer?
      hint: null
      type: select_one
      options:
      - SaaS
      - PaaS
      - IaaS
      - All are equal
      required: true
    - id: 10
      name: question_4
      label: What is the primary benefit of horizontal scaling?
      hint: null
      type: select_one
      options:
      - Increases CPU power
      - Adds more servers to distribute load
      - Reduces latency
      - Eliminates security risks
      required: true
    - id: 11
      name: question_5
      label: Which of the following is a public cloud provider?
      hint: null
      type: select_one
      options:
      - Private data center
      - AWS - Amazon Web Services
      - Internal company servers
      - Local network
      required: true
    - id: 12
      name: question_6
      label: What does API stand for?
      hint: null
      type: select_one
      options:
      - Application Program Interface
      - Automated Process Instruction
      - Application Protocol Integration
      - Access Point Identifier
      required: true
    - id: 13
      name: question_7
      label: Microservices architecture breaks applications into
      hint: null
      type: select_one
      options:
      - Multiple monolithic components
      - Small, independent services
      - Centralized modules
      - Single deployable units
      required: true
    - id: 14
      name: question_8
      label: What is containerization primarily used for?
      hint: null
      type: select_one
      options:
      - Storing data
      - Isolating applications and dependencies
      - Improving network speed
      - Database management
      required: true
    - id: 15
      name: question_9
      label: Which concept describes automatic scaling based on demand?
      hint: null
      type: select_one
      options:
      - Load balancing
      - Auto-scaling
      - Failover
      - Virtualization
      required: true
    - id: 16
      name: question_10
      label: What does GDPR compliance in cloud systems require?
      hint: null
      type: select_one
      options:
      - Maximum performance
      - Protection of personal data
      - 24-7 monitoring
      - All requests in English
      required: true
    - id: 17
      name: section_practical
      label: -- Practical Application --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: question_11
      label: You need a solution that allows automatic database scaling. Which should
        you choose?
      hint: null
      type: select_one
      options:
      - Fixed server
      - Cloud database with auto-scaling
      - Manual scaling only
      - On-premises database
      required: true
    - id: 19
      name: question_12
      label: Your team needs secure file sharing. What cloud service model fits best?
      hint: null
      type: select_one
      options:
      - IaaS
      - PaaS
      - SaaS
      - DaaS
      required: true
    - id: 20
      name: section_results
      label: -- Assessment Results --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: score
      label: Score - Correct Answers
      hint: null
      type: number
      options: []
      required: false
    - id: 22
      name: percentage
      label: Percentage Score
      hint: null
      type: number
      options: []
      required: false
    - id: 23
      name: assessment_result
      label: Assessment Result
      hint: null
      type: select_one
      options:
      - Pass
      - Pass with high distinction
      - Needs improvement
      - Not yet competent
      - Pending review
      required: false
