inputSchema:
  type: object
  properties:
    title: Hiragana Recognition Quiz
    pages:
    - id: 1
      name: hiragana_image
      label: Hiragana Image
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: correct_answer
      label: Correct Answer
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      - '6'
      required: false
    - id: 3
      name: answer_choices
      label: Answer Choices
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
