        name: q11
        label: Question 11 - What is the pumping lemma used for
        hint: Select the best answer
        type: select_one
        options:
          - Proving languages are not regular
          - Proving languages are regular
          - Simplifying automata
          - Converting NFA to DFA
        required: true
