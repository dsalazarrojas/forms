      - id: 10
        name: q1
        label: Question 1 - What is a Finite Automaton
        hint: Select the best answer
        type: select_one
        options:
          - A mathematical model of computation
          - A type of programming language
          - A database system
          - A network protocol
        required: true
      - id: 11
        name: q2
        label: Question 2 - What does DFA stand for
        hint: Select the correct expansion
        type: select_one
        options:
          - Deterministic Finite Automaton
          - Dynamic Finite Automaton
          - Distributed Finite Automaton
          - Dual Finite Automaton
        required: true
      - id: 12
        name: q3
        label: Question 3 - What is the main difference between DFA and NFA
        hint: Select the best answer
        type: select_one
        options:
          - NFA can have multiple transitions for same input
          - DFA is more powerful than NFA
          - NFA cannot accept regular languages
          - There is no difference
        required: true
      - id: 13
        name: q4
        label: Question 4 - What is a regular language
        hint: Select the correct definition
        type: select_one
        options:
          - A language accepted by a finite automaton
          - A language with simple grammar
          - A language with finite words
          - A language used in regular expressions only
        required: true
      - id: 14
        name: q5
        label: Question 5 - What is the purpose of epsilon transitions
        hint: Select the best answer
        type: select_one
        options:
          - To allow state changes without input
          - To speed up computation
          - To reduce memory usage
          - To handle errors
        required: true
      - id: 15
        name: questions_section_2
        label: Section 2 - Formal Languages
        hint: Questions about formal languages
        type: note
        options: []
        required: false
      - id: 16
        name: q6
        label: Question 6 - What is a formal grammar
        hint: Select the correct definition
        type: select_one
        options:
          - A set of production rules for strings
          - A type of programming language
          - A documentation standard
          - A language specification
        required: true
      - id: 17
        name: q7
        label: Question 7 - Which Chomsky hierarchy level is most restrictive
        hint: Select the correct type
        type: select_one
        options:
          - Type 3 - Regular
          - Type 2 - Context-Free
          - Type 1 - Context-Sensitive
          - Type 0 - Recursively Enumerable
        required: true
      - id: 18
        name: q8
        label: Question 8 - What is a context-free grammar
        hint: Select the best answer
        type: select_one
        options:
          - Grammar where production rules have single non-terminal on left
          - Grammar without context rules
          - Grammar for programming languages only
          - Grammar with no restrictions
        required: true
      - id: 19
        name: q9
        label: Question 9 - What is a pushdown automaton
        hint: Select the correct description
        type: select_one
        options:
          - An automaton with a stack for memory
          - An automaton that pushes buttons
          - An automaton with infinite states
          - An automaton for regular languages
        required: true
      - id: 20
        name: q10
        label: Question 10 - What languages can a Turing machine recognize
        hint: Select the correct answer
        type: select_one
        options:
          - Recursively enumerable languages
          - Only regular languages
          - Only context-free languages
          - Finite languages only
        required: true
      - id: 21
        name: questions_section_3
        label: Section 3 - Advanced Concepts
        hint: More complex automata questions
        type: note
        options: []
        required: false
