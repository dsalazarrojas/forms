inputSchema:
  type: object
  properties:
    title: Parasympatholytics Knowledge Quiz
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: drug_name
      label: What is the name of the drug you are referring to?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: drug_dosage
      label: How much of the drug were you given?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: drug_unit
      label: In what unit are the drug measurements?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: drug_class
      label: What is the drug class?
      hint: null
      type: select_one
      options:
      - a1
      - a2
      - a3
      required: true
    - id: 6
      name: side_effects
      label: What are the side effects you experienced?
      hint: null
      type: select_multiple
      options:
      - a1
      - a2
      required: true
    - id: 7
      name: correct_answer
      label: What is your correct answer?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: event_date_time
      label: What is the date and time of the event?
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: event_time
      label: What is the time of the event?
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: note
      label: Do you have any additional note?
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: contact_email
      label: What is your contact email?
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: contact_phone
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: false
