        label: Question 1 - When Does Blastocyst Formation Begin
        hint: Select the correct day after fertilization
        type: select_one
        options:
          - Day 1-2
          - Day 3-4
          - Day 5-6
          - Day 7-8
        required: true
      - id: 6
