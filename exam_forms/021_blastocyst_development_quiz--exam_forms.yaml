        hint: The outer cell layer of the blastocyst
        type: select_one
        options:
          - Inner Cell Mass
          - Trophoblast
          - Blastocoel
          - Zona Pellucida
        required: true
      - id: 7
        name: question_3
        label: Question 3 - What Does the Inner Cell Mass Become
        hint: The inner cell mass develops into
        type: select_one
        options:
          - Placenta
          - Embryo
          - Amniotic Sac
          - Umbilical Cord
        required: true
      - id: 8
        name: question_4
