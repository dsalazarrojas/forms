inputSchema:
  type: object
  properties:
    title: Comprehensive Exam Registration Form
    pages:
    - id: 1
      name: section_candidate_details
      label: -- Candidate Details --
      hint: Enter candidate personal and ID information
      type: note
      options: []
      required: false
    - id: 2
      name: candidate_name
      label: Candidate name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: candidate_id
      label: Candidate id
      hint: Student or registration id
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email address
      hint: For exam confirmation and results
      type: email
      options: []
      required: true
    - id: 5
      name: exam_date
      label: Exam date
      hint: Select preferred exam date
      type: date
      options: []
      required: true
    - id: 6
      name: exam_location
      label: Exam location
      hint: Preferred test center or online
      type: select_one
      options:
      - Onsite center
      - Online proctored
      required: true
    - id: 7
      name: accommodation_needed
      label: Accommodation needed
      hint: Request testing accommodations if required
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: accommodation_details
      label: Accommodation details
      hint: Describe accommodation request if any
      type: text
      options: []
      required: false
    - id: 9
      name: payment_reference
      label: Payment reference
      hint: Enter transaction id or PO if applicable
      type: text
      options: []
      required: false
