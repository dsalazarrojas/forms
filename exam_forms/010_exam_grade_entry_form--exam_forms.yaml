inputSchema:
  type: object
  properties:
    title: Exam Grade Entry Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: assignment_id
      label: Assignment ID
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: score
      label: Score
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: grade
      label: Grade
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Math
      - English
      - Science
      - Social Studies
      required: true
    - id: 7
      name: exam_date
      label: Exam Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
