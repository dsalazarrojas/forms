inputSchema:
  type: object
  properties:
    title: Chemical Kinetics And Equilibrium Quiz
    pages:
      - id: 1
        name: student_name
        label: Full Name
        hint: Your full name
        type: text
        options: []
        required: true
      - id: 2
        name: student_id
        label: Student ID
        hint: Your student identification number
        type: text
        options: []
        required: true
      - id: 3
        name: course_name
        label: Course Name
        hint: Name of your chemistry course
        type: text
        options: []
        required: true
      - id: 4
        name: quiz_date
        label: Quiz Date
        hint: Date of this quiz
        type: date
        options: []
        required: true
      - id: 5
        name: question_1
        label: Question 1 - What does chemical kinetics study
        hint: Select the best answer
        type: select_one
        options:
          - The rates of chemical reactions
          - The colors of chemicals
          - The shapes of molecules
          - The weights of elements
        required: true
      - id: 6
        name: question_2
        label: Question 2 - What is the rate law
        hint: Select the best answer
        type: select_one
        options:
          - An equation relating reaction rate to concentration
          - A legal document for chemical companies
          - A rule for balancing equations
          - A safety regulation
        required: true
      - id: 7
        name: question_3
        label: Question 3 - What is activation energy
        hint: Select the best answer
        type: select_one
        options:
          - The minimum energy required for a reaction to occur
          - The energy released by a reaction
          - The energy of products
          - The energy of reactants
        required: true
      - id: 8
        name: question_4
        label: Question 4 - What does a catalyst do
        hint: Select the best answer
        type: select_one
        options:
          - Lowers activation energy and speeds up reaction
          - Slows down reactions
          - Changes the products
          - Increases activation energy
        required: true
      - id: 9
        name: question_5
        label: Question 5 - What is chemical equilibrium
        hint: Select the best answer
        type: select_one
        options:
          - When forward and reverse reaction rates are equal
          - When reactions stop completely
          - When all reactants are used up
          - When products are formed
        required: true
      - id: 10
        name: question_6
        label: Question 6 - What is Le Chatelier's Principle
        hint: Select the best answer
        type: select_one
        options:
          - A system at equilibrium will adjust to counteract changes
          - A law about chemical bonding
          - A rule for naming compounds
          - A safety guideline
        required: true
      - id: 11
        name: question_7
        label: Question 7 - What happens to equilibrium when temperature increases for an exothermic reaction
        hint: Select the best answer
        type: select_one
        options:
          - Equilibrium shifts to the left (reactants)
          - Equilibrium shifts to the right (products)
          - No change
          - Reaction stops
        required: true
      - id: 12
        name: question_8
        label: Question 8 - What is the equilibrium constant (Keq)
        hint: Select the best answer
        type: select_one
        options:
          - A ratio of product concentrations to reactant concentrations
          - A fixed reaction rate
          - A temperature measurement
          - A pressure value
        required: true
      - id: 13
        name: question_9
        label: Question 9 - What does a large Keq value indicate
        hint: Select the best answer
        type: select_one
        options:
          - Products are favored at equilibrium
          - Reactants are favored at equilibrium
          - Equal amounts of both
          - No reaction occurs
        required: true
      - id: 14
        name: question_10
        label: Question 10 - What is the order of a reaction
        hint: Select the best answer
        type: select_one
        options:
          - The sum of exponents in the rate law
          - The sequence of steps in a reaction
          - The number of products formed
          - The speed of the reaction
        required: true
      - id: 15
        name: question_11
        label: Question 11 - What is a zero-order reaction
        hint: Select the best answer
        type: select_one
        options:
          - A reaction where rate is independent of concentration
          - A reaction that does not occur
          - A reaction with no products
          - A reaction at equilibrium
        required: true
      - id: 16
        name: question_12
        label: Question 12 - What is the half-life of a reaction
        hint: Select the best answer
        type: select_one
        options:
          - Time required for half of the reactant to be consumed
          - Half the time of the full reaction
          - The midpoint of equilibrium
          - The activation energy divided by two
        required: true
      - id: 17
        name: question_13
        label: Question 13 - What effect does increasing pressure have on a gaseous equilibrium
        hint: Select the best answer
        type: select_one
        options:
          - Shifts equilibrium toward the side with fewer moles of gas
          - Shifts equilibrium toward the side with more moles of gas
          - No effect
          - Stops the reaction
        required: true
      - id: 18
        name: question_14
        label: Question 14 - What is the Arrhenius equation used for
        hint: Select the best answer
        type: select_one
        options:
          - Relating rate constant to temperature and activation energy
          - Calculating molecular weight
          - Balancing chemical equations
          - Determining pH
        required: true
      - id: 19
        name: question_15
        label: Question 15 - What is a reaction mechanism
        hint: Select the best answer
        type: select_one
        options:
          - The step-by-step sequence of elementary reactions
          - A machine for mixing chemicals
          - The final product of a reaction
          - The energy diagram
        required: true
      - id: 20
        name: question_16
        label: Question 16 - What is the rate-determining step
        hint: Select the best answer
        type: select_one
        options:
          - The slowest step in a reaction mechanism
          - The fastest step
          - The first step
          - The last step
        required: true
      - id: 21
        name: question_17
        label: Question 17 - What happens to the rate when concentration of reactants increases
        hint: Select the best answer
        type: select_one
        options:
          - Rate generally increases
          - Rate decreases
          - Rate stays the same
          - Reaction stops
        required: true
      - id: 22
        name: question_18
        label: Question 18 - What is dynamic equilibrium
        hint: Select the best answer
        type: select_one
        options:
          - Forward and reverse reactions continue at equal rates
          - All reactions have stopped
          - Only forward reaction occurs
          - Only reverse reaction occurs
        required: true
      - id: 23
        name: confidence_level
        label: Confidence Level
        hint: How confident are you in your answers
        type: select_one
        options:
          - Very confident
          - Confident
          - Somewhat confident
          - Not confident
        required: true
      - id: 24
        name: time_spent
        label: Time Spent
        hint: Approximately how long did you spend on this quiz
        type: select_one
        options:
          - Less than 15 minutes
          - 15-30 minutes
          - 30-45 minutes
          - More than 45 minutes
        required: false
