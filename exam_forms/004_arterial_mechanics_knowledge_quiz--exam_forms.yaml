inputSchema:
  type: object
  properties:
    title: Arterial Mechanics Knowledge Quiz
    pages:
      - id: 1
        name: section_header_1
        label: -- Student Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: student_name
        label: Full Name
        hint: Your full name as registered
        type: text
        options: []
        required: true
      - id: 3
        name: student_id
        label: Student ID
        hint: Your university or institution ID
        type: text
        options: []
        required: true
      - id: 4
        name: course_name
        label: Course Name
        hint: Name of the physiology or biomedical engineering course
        type: text
        options: []
        required: true
      - id: 5
        name: date_taken
        label: Date of Quiz
        hint: When are you taking this quiz?
        type: date
        options: []
        required: true
      - id: 6
        name: section_header_2
        label: -- Question 1 - 3 --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: q1_arterial_compliance
        label: What is arterial compliance primarily determined by?
        hint: Select the best answer
        type: select_one
        options:
          - The resistance of blood vessels
          - The elasticity of the arterial wall
          - The heart's pumping rate
          - The viscosity of blood
        required: true
      - id: 8
        name: q2_stiffness_relationship
        label: How does arterial stiffness change with age?
        hint: Select the best answer
        type: select_one
        options:
          - It decreases significantly
          - It remains constant
          - It increases due to collagen and elastin changes
          - It becomes more elastic
        required: true
      - id: 9
        name: q3_pulse_pressure
        label: Pulse pressure is defined as the difference between which pressures?
        hint: Select the best answer
        type: select_one
        options:
          - Diastolic and mean arterial pressure
          - Systolic and diastolic pressure
          - Pulse and mean pressure
          - Central and peripheral pressure
        required: true
      - id: 10
        name: section_header_3
        label: -- Question 4 - 6 --
        hint: null
        type: note
        options: []
        required: false
      - id: 11
        name: q4_wave_reflection
        label: What is wave reflection in arterial mechanics?
        hint: Select the best answer
        type: select_one
        options:
          - The forward movement of the pressure wave
          - The bouncing back of pressure waves at arterial junctions
          - The dampening of blood flow in arteries
          - The expansion of arterial walls
        required: true
      - id: 12
        name: q5_windkessel_effect
        label: The windkessel effect refers to which mechanism?
        hint: Select the best answer
        type: select_one
        options:
          - Rhythmic compression of arteries during exercise
          - The ability of elastic arteries to absorb and release energy
          - The constriction of arteries to increase pressure
          - The passive flow of blood through veins
        required: true
      - id: 13
        name: q6_hemodynamics_resistance
        label: In arterial hemodynamics, which factor has the greatest effect on resistance?
        hint: Select the best answer
        type: select_one
        options:
          - Arterial length
          - Blood viscosity
          - Vessel radius (to the fourth power)
          - Pressure gradient
        required: true
      - id: 14
        name: section_header_4
        label: -- Question 7 - 9 --
        hint: null
        type: note
        options: []
        required: false
      - id: 15
        name: q7_endothelial_dysfunction
        label: What role does endothelial dysfunction play in arterial mechanics?
        hint: Select the best answer
        type: select_one
        options:
          - It improves arterial elasticity
          - It increases vasodilation and compliance
          - It reduces nitric oxide production and increases stiffness
          - It has no effect on arterial properties
        required: true
      - id: 16
        name: q8_pressure_wave_velocity
        label: What indicates a stiffer artery?
        hint: Select the best answer
        type: select_one
        options:
          - Lower pulse wave velocity
          - Higher pulse wave velocity
          - No change in pulse wave velocity
          - Fluctuating pulse wave velocity
        required: true
      - id: 17
        name: q9_medial_hypertrophy
        label: Medial arterial hypertrophy primarily involves thickening of which layer?
        hint: Select the best answer
        type: select_one
        options:
          - The intima
          - The media (smooth muscle)
          - The adventitia
          - The endothelium
        required: true
      - id: 18
        name: section_header_5
        label: -- Question 10 - 12 --
        hint: null
        type: note
        options: []
        required: false
      - id: 19
        name: q10_atherosclerosis_mechanics
        label: How does atherosclerosis affect arterial mechanical properties?
        hint: Select the best answer
        type: select_one
        options:
          - It increases compliance and elasticity
          - It reduces lumen area and increases local stiffness
          - It improves hemodynamic flow
          - It has minimal mechanical impact
        required: true
      - id: 20
        name: q11_shear_stress
        label: Arterial shear stress is primarily dependent on which factor?
        hint: Select the best answer
        type: select_one
        options:
          - Arterial diameter only
          - Blood flow rate and vessel radius
          - Diastolic pressure
          - Heart rate variability
        required: true
      - id: 21
        name: q12_vascular_remodeling
        label: What is vascular remodeling in response to chronic hypertension?
        hint: Select the best answer
        type: select_one
        options:
          - Decreased arterial stiffness
          - Increased compliance
          - Inward eutrophic or hypertrophic remodeling that increases wall-to-lumen ratio
          - Complete loss of smooth muscle function
        required: true
      - id: 22
        name: section_header_6
        label: -- Review and Submission --
        hint: null
        type: note
        options: []
        required: false
      - id: 23
        name: confidence_level
        label: How confident are you in your answers?
        hint: Rate your overall confidence
        type: select_one
        options:
          - Very Confident
          - Somewhat Confident
          - Neutral
          - Not Very Confident
          - Not Confident at All
        required: false
      - id: 24
        name: quiz_notes
        label: Additional Comments
        hint: Any clarifications or concerns about the quiz
        type: text
        options: []
        required: false
      - id: 25
        name: honor_pledge
        label: I completed this quiz honestly without unauthorized assistance
        hint: Please confirm your academic integrity
        type: select_one
        options:
          - I confirm
          - I do not confirm
        required: true
