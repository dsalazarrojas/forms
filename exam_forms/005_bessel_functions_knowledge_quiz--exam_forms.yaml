inputSchema:
  type: object
  properties:
    title: Bessel Functions Knowledge Quiz
    pages:
    - id: 1
      name: student_name
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: student_email
      label: Email Address
      hint: Your quiz results will be sent here
      type: email
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID Number
      hint: Enter your university or course ID
      type: text
      options: []
      required: true
    - id: 4
      name: course_name
      label: Course Name
      hint: Which course are you taking this quiz for
      type: select_one
      options:
      - Advanced Engineering Mathematics
      - Mathematical Physics
      - Applied Mathematics
      - Differential Equations
      - Self-study
      - Other
      required: true
    - id: 5
      name: quiz_date
      label: Quiz Date
      hint: Today date
      type: date
      options: []
      required: true
    - id: 6
      name: question_1
      label: Question 1 - What is the standard form of Bessel differential equation
      hint: Select the correct answer
      type: select_one
      options:
      - x²y'' + xy' + (x² - n²)y = 0
      - x²y'' - xy' + (x² + n²)y = 0
      - y'' + xy' + y = 0
      - x²y'' + y' + xy = 0
      required: true
    - id: 7
      name: question_2
      label: Question 2 - Bessel functions of the first kind are denoted by
      hint: Choose the correct notation
      type: select_one
      options:
      - J n(x)
      - Y n(x)
      - H n(x)
      - I n(x)
      required: true
    - id: 8
      name: question_3
      label: Question 3 - Bessel functions of the second kind are also known as
      hint: Select the alternative name
      type: select_one
      options:
      - Neumann functions
      - Hankel functions
      - Modified Bessel functions
      - Spherical Bessel functions
      required: true
    - id: 9
      name: question_4
      label: Question 4 - The order n in Bessel functions can be
      hint: What values can the order take
      type: select_one
      options:
      - Only integers
      - Only positive integers
      - Any real or complex number
      - Only rational numbers
      required: true
    - id: 10
      name: question_5
      label: Question 5 - Hankel functions are linear combinations of
      hint: Select the correct components
      type: select_one
      options:
      - J n(x) and Y n(x)
      - J n(x) and I n(x)
      - Y n(x) and K n(x)
      - I n(x) and K n(x)
      required: true
    - id: 11
      name: question_6
      label: Question 6 - Modified Bessel functions satisfy which equation
      hint: Choose the modified Bessel equation
      type: select_one
      options:
      - x²y'' + xy' - (x² + n²)y = 0
      - x²y'' + xy' + (x² - n²)y = 0
      - y'' - x²y = 0
      - x²y'' - (x² + n²)y = 0
      required: true
    - id: 12
      name: question_7
      label: Question 7 - Bessel functions commonly appear in problems with what symmetry
      hint: Think about coordinate systems
      type: select_one
      options:
      - Cylindrical symmetry
      - Spherical symmetry
      - Planar symmetry
      - No specific symmetry
      required: true
    - id: 13
      name: question_8
      label: Question 8 - The zeros of Bessel functions are
      hint: What can we say about the zeros
      type: select_one
      options:
      - All real and infinite in number
      - All complex
      - Finite in number
      - Only positive
      required: true
    - id: 14
      name: question_9
      label: Question 9 - Spherical Bessel functions are related to
      hint: Where do spherical Bessel functions appear
      type: select_one
      options:
      - Wave equation in spherical coordinates
      - Heat equation in cylindrical coordinates
      - Laplace equation in Cartesian coordinates
      - Schrödinger equation in 1D
      required: true
    - id: 15
      name: question_10
      label: Question 10 - The generating function for Bessel functions involves
      hint: Select the correct mathematical expression
      type: select_one
      options:
      - exp((x/2)(t - 1/t))
      - exp(x²/2)
      - sin(xt)
      - cos(xt)
      required: true
    - id: 16
      name: confidence_level
      label: Confidence Level
      hint: How confident do you feel about Bessel functions after this quiz
      type: select_one
      options:
      - Very Confident
      - Somewhat Confident
      - Neutral
      - Not Very Confident
      - Not Confident at All
      required: true
    - id: 17
      name: study_time
      label: Hours Spent Studying
      hint: How many hours did you spend studying for this quiz
      type: number
      options: []
      required: false
    - id: 18
      name: additional_comments
      label: Additional Comments
      hint: Any feedback about the quiz or topics covered
      type: text
      options: []
      required: false
