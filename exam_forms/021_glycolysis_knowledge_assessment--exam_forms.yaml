inputSchema:
  type: object
  properties:
    title: Glycolysis Knowledge Assessment
    pages:
    - id: 1
      name: glycolysis_step_1
      label: What are the enzymes involved in glycolysis?
      hint: null
      type: select_multiple
      options:
      - pyruvate kinase
      - pyruvate dehydrogenase
      - phosphofructokinase
      required: false
    - id: 2
      name: glycolysis_step_2
      label: What is the purpose of the first enzyme in glycolysis?
      hint: null
      type: select_one
      options:
      - glucose is converted to glucose-6-phosphate
      - glucose is converted to pyruvate
      - glucose is converted to ATP and NADH
      required: false
    - id: 3
      name: atp_yield
      label: What is the ATP yield of glycolysis?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: glycolysis_pathway
      label: Describe the glycolysis pathway.
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: glycolysis_equipment
      label: What equipment is needed for glycolysis?
      hint: null
      type: select_one
      options:
      - glucose analyzer
      - spectrophotometer
      - chromatography
      required: false
    - id: 6
      name: glycolysis_step_3
      label: What is the energy source for glycolysis?
      hint: null
      type: select_one
      options:
      - glucose
      - oxygen
      - ATP
      required: false
    - id: 7
      name: glycolysis_step_4
      label: What is the overall reaction of glycolysis?
      hint: null
      type: select_multiple
      options:
      - catabolic
      - anabolic
      - metabolic
      required: false
    - id: 8
      name: glycolysis_equipment_2
      label: What is the role of the equipment in glycolysis?
      hint: null
      type: select_multiple
      options:
      - glucose analyzer
      - spectrophotometer
      - chromatography
      required: false
    - id: 9
      name: glycolysis_step_10
      label: What is the energy yield of glycolysis?
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: glycolysis_step_11
      label: What is the final product of glycolysis?
      hint: null
      type: select_one
      options:
      - ATP
      - NADH
      - ADP
      required: false
    - id: 11
      name: glycolysis_equipment_5
      label: What equipment is used during glycolysis?
      hint: null
      type: select_multiple
      options:
      - glucose analyzer
      - spectrophotometer
      - chromatography
      required: false
    - id: 12
      name: glycolysis_equipment_6
      label: What is the role of the enzyme in glycolysis?
      hint: null
      type: select_one
      options:
      - phosphorylates fructose-6-phosphate
      - phosphorylates fructose-1,6-diphosphate
      - catalyzes the reaction
      required: false
