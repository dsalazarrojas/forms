      - '6'
      - '7'
      required: false
    - id: 12
      name: note_position_2
      label: Note Position 2
      hint: null
      type: select_multiple
      options:
      - top
      - middle
      - bottom
      required: false
    - id: 13
      name: clef_sign_2
