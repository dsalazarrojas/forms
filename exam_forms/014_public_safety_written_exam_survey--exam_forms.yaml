inputSchema:
  type: object
  properties:
    title: Public Safety Written Exam Survey
    pages:
    - id: 1
      name: session_title
      label: What was the session title?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: session_instructions
      label: What were the session instructions?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: difficulty_level
      label: How difficult was the session?
      hint: null
      type: select_one
      options:
      - option a
      - option b
      - option c
      - option d
      required: true
    - id: 4
      name: feedback
      label: What feedback do you have?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: exam_comments
      label: Any comments about the exam?
      hint: null
      type: text
      options: []
      required: false
