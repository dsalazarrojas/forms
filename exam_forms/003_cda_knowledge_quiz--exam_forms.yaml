inputSchema:
  type: object
  properties:
    title: CDA Knowledge Quiz
    pages:
      - id: 1
        name: participant_name
        label: Participant Name
        hint: Your full name
        type: text
        options: []
        required: true
      - id: 2
        name: email_address
        label: Email Address
        hint: For quiz results delivery
        type: email
        options: []
        required: true
      - id: 3
        name: organization
        label: Organization
        hint: Your workplace or institution
        type: text
        options: []
        required: false
      - id: 4
        name: role
        label: Your Role
        hint: Select your primary role
        type: select_one
        options:
          - Healthcare Provider
          - IT Professional
          - Healthcare Administrator
          - Student
          - Other
        required: true
      - id: 5
        name: quiz_instructions
        label: Quiz Instructions
        hint: This quiz tests your knowledge of Clinical Document Architecture CDA. Select the best answer for each question.
        type: note
        options: []
        required: false
      - id: 6
        name: question_1
        label: Question 1 - What does CDA stand for
        hint: Select the correct expansion
        type: select_one
        options:
          - Clinical Document Architecture
          - Clinical Data Analytics
          - Certified Document Assessment
          - Central Data Archive
        required: true
      - id: 7
        name: question_2
        label: Question 2 - Which organization developed CDA
        hint: The standards organization behind CDA
        type: select_one
        options:
          - HL7 International
          - DICOM
          - IHE
          - ISO
        required: true
      - id: 8
        name: question_3
        label: Question 3 - What is the primary purpose of CDA
        hint: Main use case for CDA documents
        type: select_one
        options:
          - Exchange of clinical documents
          - Medical imaging storage
          - Billing and claims processing
          - Appointment scheduling
        required: true
      - id: 9
        name: question_4
        label: Question 4 - Which markup language is CDA based on
        hint: The underlying technology
        type: select_one
        options:
          - XML
          - JSON
          - HTML
          - YAML
        required: true
      - id: 10
        name: question_5
        label: Question 5 - What is a CDA document header used for
        hint: Purpose of the header section
        type: select_one
        options:
          - Patient and document metadata
          - Clinical observations only
          - Medication lists
          - Laboratory results
        required: true
      - id: 11
        name: question_6
        label: Question 6 - Which of these is a CDA document type
        hint: Common CDA implementation
        type: select_one
        options:
          - Continuity of Care Document CCD
          - Digital Imaging and Communications DICOM
          - Fast Healthcare Interoperability Resources FHIR
          - Health Level Seven HL7 v2
        required: true
      - id: 12
        name: question_7
        label: Question 7 - Can CDA documents be human readable
        hint: Regarding human readability
        type: select_one
        options:
          - Yes always human and machine readable
          - No machine readable only
          - Only with special software
          - Only in PDF format
        required: true
      - id: 13
        name: question_8
        label: Question 8 - What is the relationship between CDA and FHIR
        hint: How these standards relate
        type: select_one
        options:
          - Both are HL7 standards for different use cases
          - FHIR replaced CDA completely
          - CDA is a subset of FHIR
          - They are unrelated standards
        required: true
      - id: 14
        name: question_9
        label: Question 9 - Select all that apply - CDA document sections can contain
        hint: Multiple answers possible
        type: select_multiple
        options:
          - Clinical notes
          - Laboratory results
          - Medications
          - Allergies
          - Vital signs
        required: true
      - id: 15
        name: question_10
        label: Question 10 - Why is CDA important for interoperability
        hint: Main benefit for healthcare data exchange
        type: select_one
        options:
          - Enables consistent document exchange between systems
          - Reduces storage costs
          - Speeds up network connections
          - Eliminates need for databases
        required: true
      - id: 16
        name: confidence_level
        label: Confidence Level
        hint: How confident are you in your answers
        type: select_one
        options:
          - Very Confident
          - Somewhat Confident
          - Neutral
          - Not Very Confident
          - Not Confident At All
        required: true
      - id: 17
        name: additional_comments
        label: Additional Comments
        hint: Any feedback about the quiz content
        type: text
        options: []
        required: false
