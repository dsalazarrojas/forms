inputSchema:
  type: object
  properties:
    title: Business Licensing Exam Study Material Request Form
    pages:
    - id: 1
      name: applicant_name
      label: Applicant Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_email
      label: Applicant Email
      hint: Email address for material delivery
      type: email
      options: []
      required: true
    - id: 3
      name: applicant_phone
      label: Applicant Phone
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: mailing_address
      label: Mailing Address
      hint: Address for physical materials if needed
      type: text
      options: []
      required: true
    - id: 5
      name: exam_type
      label: Licensing Exam Type
      hint: Which exam are you preparing for
      type: select_one
      options:
      - Real estate license
      - Contractor license
      - Cosmetology license
      - Insurance license
      - Securities license
      - Professional certification
      - Business operation license
      - Other
      required: true
    - id: 6
      name: exam_date
      label: Scheduled Exam Date
      hint: When is your exam scheduled
      type: date
      options: []
      required: false
    - id: 7
      name: study_material_format
      label: Preferred Material Format
      hint: How do you want to receive materials
      type: select_one
      options:
      - Digital download
      - Online access
      - Physical books
      - Video courses
      - Combination
      required: true
    - id: 8
      name: material_types_needed
      label: Material Types Needed
      hint: Select all materials you need
      type: select_multiple
      options:
      - Study guide
      - Practice exams
      - Flashcards
      - Video tutorials
      - Audio lessons
      - Mobile app access
      - Live prep course
      - One-on-one tutoring
      required: true
    - id: 9
      name: prior_experience
      label: Prior Experience in Field
      hint: Do you have experience in this field
      type: select_one
      options:
      - No experience - beginner
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - Over 5 years
      required: true
    - id: 10
      name: education_level
      label: Education Level
      hint: Your highest completed education
      type: select_one
      options:
      - High school
      - Some college
      - Associate degree
      - Bachelor degree
      - Graduate degree
      required: true
    - id: 11
      name: previous_exam_attempts
      label: Previous Exam Attempts
      hint: Have you taken this exam before
      type: select_one
      options:
      - First time
      - Once before
      - Multiple times
      required: true
    - id: 12
      name: study_timeline
      label: Study Timeline
      hint: How long do you plan to study
      type: select_one
      options:
      - Less than 2 weeks
      - 2-4 weeks
      - 1-2 months
      - 2-3 months
      - Over 3 months
      required: true
    - id: 13
      name: learning_style
      label: Preferred Learning Style
      hint: How do you learn best
      type: select_one
      options:
      - Reading text
      - Watching videos
      - Hands-on practice
      - Listening to audio
      - Group study
      required: true
    - id: 14
      name: budget_range
      label: Budget for Study Materials
      hint: How much are you willing to spend
      type: select_one
      options:
      - Under $50
      - $50-$100
      - $100-$200
      - $200-$500
      - Over $500
      required: false
    - id: 15
      name: employer_sponsorship
      label: Employer Sponsorship
      hint: Is your employer paying for materials
      type: select_one
      options:
      - Yes - fully sponsored
      - Yes - partially sponsored
      - No - self-funded
      required: false
    - id: 16
      name: accessibility_needs
      label: Accessibility Needs
      hint: Do you require any accessibility accommodations
      type: select_one
      options:
      - No accommodations needed
      - Large print materials
      - Screen reader compatible
      - Audio format
      - Extended time
      - Other
      required: true
    - id: 17
      name: language_preference
      label: Language Preference
      hint: Preferred language for materials
      type: select_one
      options:
      - English
      - Spanish
      - Chinese
      - French
      - Other
      required: true
    - id: 18
      name: referral_source
      label: How Did You Hear About Us
      hint: Source of referral
      type: select_one
      options:
      - Online search
      - Social media
      - Friend or colleague
      - Employer recommendation
      - Advertisement
      - Other
      required: false
    - id: 19
      name: additional_requests
      label: Additional Requests
      hint: Any other materials or assistance needed
      type: text
      options: []
      required: false
