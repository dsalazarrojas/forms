inputSchema:
  type: object
  properties:
    title: Subscription Giveaway Entry
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: plan
      label: Plan
      hint: null
      type: select_one
      options:
      - Basic
      - Premium
      - Enterprise
      required: false
    - id: 5
      name: channel
      label: Channel
      hint: null
      type: select_one
      options:
      - Facebook
      - Twitter
      - Instagram
      required: false
    - id: 6
      name: agree_to_terms
      label: Agree to Terms and Conditions
      hint: null
      type: select_multiple
      options:
      - I Agree
      - Do Not Agree
      - I Am Not Sure
      required: false
