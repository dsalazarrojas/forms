inputSchema:
  type: object
  properties:
    title: Recurring Payment Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: payment_details
      label: Payment Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Stripe
      - PayPal
      - Bank Transfer
      required: false
    - id: 4
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: payment_frequency
      label: Payment Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Annually
      required: false
    - id: 7
      name: payment_status
      label: Payment Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      - Pending
      required: false
    - id: 8
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
