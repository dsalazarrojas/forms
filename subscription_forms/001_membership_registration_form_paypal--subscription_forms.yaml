inputSchema:
  type: object
  properties:
    title: Membership Registration Form PayPal
    pages:
    - id: 1
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone_number
      label: Contact Phone Number
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: occupational_affiliations
      label: Occupational Affiliations
      hint: null
      type: select_multiple
      options:
      - Accounting
      - Engineering
      - Law
      - Medicine
      required: false
    - id: 6
      name: special_skills
      label: Special Skills
      hint: null
      type: select_multiple
      options:
      - Programming
      - Data Analysis
      - Marketing
      - Graphic Design
      - Writing
      required: false
    - id: 7
      name: membership_options
      label: Membership Options
      hint: null
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Annual
      required: false
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - PayPal
      - Credit Card
      - Bank Transfer
      required: false
    - id: 9
      name: additional_info
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: confirmation
      label: Confirmation
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
