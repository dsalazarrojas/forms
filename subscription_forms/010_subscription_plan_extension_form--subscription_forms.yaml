inputSchema:
  type: object
  properties:
    title: Subscription Plan Extension Form
    pages:
    - id: 1
      name: customer_information
      label: Customer Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: current_subscription_plan
      label: Current Subscription Plan
      hint: null
      type: select_one
      options:
      - month-to-month
      - 3-month-to-3-month
      - 6-month-to-6-month
      required: true
    - id: 3
      name: desired_subscription_plan
      label: Desired Subscription Plan
      hint: null
      type: select_one
      options:
      - month-to-month
      - 3-month-to-3-month
      - 6-month-to-6-month
      required: true
    - id: 4
      name: extension_request_details
      label: Extension Request Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: customer_signature
      label: Customer Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: confirm_contact_information
      label: Confirm Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: confirm
      label: Confirm
      hint: null
      type: text
      options: []
      required: false
