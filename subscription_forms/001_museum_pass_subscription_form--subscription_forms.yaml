inputSchema:
  type: object
  properties:
    title: Museum Pass Subscription Form
    pages:
    - id: 1
      name: user_details
      label: User Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: pass_type
      label: Select Pass Type
      hint: null
      type: select_one
      options:
      - Standard
      - Premium
      - Basic
      required: false
    - id: 3
      name: subscription_period
      label: Subscription Period
      hint: Select how long youd like to subscribe for
      type: select_multiple
      options:
      - Month
      - Month-to-Month
      - Year
      required: false
    - id: 4
      name: subscription_start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: user_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: user_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: user_note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Pay Online
      - Pay By Mail
      - Pay In Person
      required: false
    - id: 9
      name: pay_online_details
      label: Online Payment Details
      hint: null
      type: text
      options: []
      required: false
