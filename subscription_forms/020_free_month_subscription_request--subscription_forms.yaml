inputSchema:
  type: object
  properties:
    title: Free Month Subscription Request
    pages:
    - id: 1
      name: request_details
      label: Request Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: services
      label: Services
      hint: null
      type: select_multiple
      options:
      - 'Yes, I am interested in the following services:'
      - 'Yes, I am not interested in any of the following services:'
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: confirm
      label: Confirm Subscription Request
      hint: null
      type: select_one
      options:
      - Yes, I am ready to confirm my subscription request
      - Yes, I am not ready to confirm my subscription request
      required: false
    - id: 4
      name: notes
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: company
      label: Company Name (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: company_type
      label: Business or Personal
      hint: null
      type: select_one
      options:
      - Business
      - Personal
      required: false
