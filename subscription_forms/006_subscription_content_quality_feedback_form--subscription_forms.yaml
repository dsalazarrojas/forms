inputSchema:
  type: object
  properties:
    title: Subscription Content Quality Feedback Form
    pages:
    - id: 1
      name: content_quality
      label: What was the quality of the content provided
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 2
      name: satisfaction
      label: How satisfied were you with the content
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 3
      name: recommendations
      label: Do you have any recommendations for improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: feedback
      label: Do you have any additional feedback about the content
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: email
      label: What is your email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: What is your phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date
      label: What is your date of birth
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: What is your time of day
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: content_type
      label: What type of content would you like to see more of
      hint: null
      type: select_multiple
      options:
      - Article
      - Video
      - Podcast
      - Social Media Post
      - Email Newsletter
      required: false
    - id: 10
      name: content_frequency
      label: How often would you like to see content
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      - Never
      required: false
