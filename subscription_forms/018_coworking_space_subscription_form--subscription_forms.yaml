      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: user_details
      label: User Details
      hint: Enter your details
      type: text
      options: []
      required: false
    - id: 3
      name: subscription_details
      label: Subscription Details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: payment_info
