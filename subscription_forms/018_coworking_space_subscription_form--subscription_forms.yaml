      hint: Enter payment details
      type: text
      options: []
      required: false
    - id: 5
      name: subscription_start
      label: Start Date
      hint: Select start date
      type: date
      options: []
      required: false
    - id: 6
      name: subscription_end
      label: End Date
      hint: Select end date
      type: date
      options: []
      required: false
    - id: 7
      name: frequency
      label: Frequency
      hint: Select subscription frequency
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: payment_terms
      label: Payment Terms
      hint: Select payment terms
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
