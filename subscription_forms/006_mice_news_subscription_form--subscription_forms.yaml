inputSchema:
  type: object
  properties:
    title: MICE News Subscription Form
    pages:
    - id: 1
      name: subscriber_information
      label: Subscriber Information
      hint: null
      type: select_multiple
      options:
      - News
      - Events
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: topic_preferences
      label: Topic Preferences
      hint: null
      type: select_multiple
      options:
      - News
      - Events
      required: true
    - id: 5
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: additional_information
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
