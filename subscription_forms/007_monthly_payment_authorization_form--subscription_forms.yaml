inputSchema:
  type: object
  properties:
    title: <string>
    pages:
    - id: 1
      name: form_name
      label: Form Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: payment_frequency
      label: Payment Frequency
      hint: null
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Bi-Monthly
      - Yearly
      - One-Time
      required: true
    - id: 3
      name: payment_start_date
      label: Payment Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: payment_end_date
      label: Payment End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: payment_cycle
      label: Payment Cycle
      hint: null
      type: select_one
      options:
      - Weekly
      - Bi-Weekly
      - Monthly
      - Quarterly
      - Bi-Monthly
      required: true
    - id: 6
      name: amount
      label: Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Bank Transfer
      - Card
      required: true
    - id: 8
      name: payment_status
      label: Payment Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      - Pending
      - Failed
      - Draft
      required: true
    - id: 9
      name: subscription_status
