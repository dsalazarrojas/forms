inputSchema:
  type: object
  properties:
    title: Subscription Amendment Form
    pages:
    - id: 1
      name: customer_id
      label: Customer ID
      hint: Enter customer ID if you want to edit or delete your subscription.
      type: number
      options: []
      required: true
    - id: 2
      name: customer_name
      label: New Name
      hint: Enter the customer's new name (if changing).
      type: text
      options: []
      required: true
    - id: 3
      name: customer_email
      label: New Email
      hint: Enter the customer's new email (if changing).
      type: email
      options: []
      required: true
    - id: 4
      name: reason
      label: Reason for Amendment
      hint: Please provide a brief reason for the amendment.
      type: text
      options: []
      required: true
    - id: 5
      name: confirm
      label: Confirm
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: submit
      label: submit
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: customer_email_2
      label: Customer's Current Email
      hint: Please enter the customer's current email.
      type: email
      options: []
      required: true
    - id: 8
      name: email_old
      label: Email Old
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: reason_old
      label: Reason Old
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: customer_name_2
      label: Customer's Old Name
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: submit_2
      label: Submit 2
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: customer_id_2
      label: Customer Id 2
      hint: null
      type: number
      options: []
      required: false
