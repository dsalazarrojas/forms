inputSchema:
  type: object
  properties:
    title: CCTV IP System Audit
    pages:
    - id: 1
      name: section_audit_header
      label: -- Audit Header --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: audit_date
      label: Audit Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: audit_time
      label: Audit Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: auditor_name
      label: Auditor Name
      hint: Person conducting audit
      type: text
      options: []
      required: true
    - id: 5
      name: facility_name
      label: Facility Name
      hint: Building or location being audited
      type: text
      options: []
      required: true
    - id: 6
      name: section_system_info
      label: -- System Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: vms_type
      label: VMS (Video Management System) Type
      hint: Software and version
      type: text
      options: []
      required: true
    - id: 8
      name: total_cameras
      label: Total Number of IP Cameras
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: active_cameras
      label: Number of Active Cameras
      hint: Currently operational
      type: number
      options: []
      required: true
    - id: 10
      name: inactive_cameras
      label: Number of Inactive Cameras
      hint: Not currently recording
      type: number
      options: []
      required: false
    - id: 11
      name: section_hardware_audit
      label: -- Hardware Audit --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: camera_condition
      label: Camera Condition Assessment
      hint: Overall state of hardware
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Needs Replacement
      required: true
    - id: 13
      name: lens_cleanliness
      label: Lens Cleanliness
      hint: Visible dirt, condensation, or scratches
      type: select_one
      options:
      - Clean
      - Minor Dust
      - Moderate Dust
      - Heavy Dirt or Condensation
      required: true
    - id: 14
      name: cable_integrity
      label: Cable Integrity
      hint: Visible damage or wear
      type: select_one
      options:
      - Good
      - Minor Wear
      - Moderate Damage
      - Severe Damage
      required: true
    - id: 15
      name: connector_condition
      label: Connector Condition
      hint: Corrosion or physical damage
      type: select_one
      options:
      - Good
      - Minor Corrosion
      - Moderate Corrosion
      - Severe Corrosion
      required: true
    - id: 16
      name: section_network_audit
      label: -- Network Audit --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: network_connectivity
      label: Network Connectivity Status
      hint: All cameras connected and responsive
      type: select_one
      options:
      - All Connected
      - Most Connected
      - Some Disconnected
      - Multiple Issues
      required: true
    - id: 18
      name: bandwidth_performance
      label: Bandwidth Performance
      hint: Sufficient for all cameras
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Inadequate
      required: true
    - id: 19
      name: ip_addressing
      label: IP Addressing Scheme
      hint: Properly configured without conflicts
      type: select_one
      options:
      - Properly Configured
      - Minor Issues
      - Moderate Issues
      - Significant Problems
      required: true
    - id: 20
      name: section_recording_storage
      label: -- Recording and Storage --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: storage_capacity
      label: Storage Capacity Status
      hint: Available disk space
      type: select_one
      options:
      - Adequate for Future Use
      - At Acceptable Levels
      - Getting Full
      - Critical - Upgrade Needed
      required: true
    - id: 22
      name: retention_period
      label: Recording Retention Period
      hint: Days or weeks of footage retained
      type: text
      options: []
      required: true
    - id: 23
      name: section_security_compliance
      label: -- Security and Compliance --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: security_compliance
      label: Security Compliance Status
      hint: Passwords, encryption, access controls
      type: select_one
      options:
      - Fully Compliant
      - Mostly Compliant
      - Partially Compliant
      - Non-Compliant
      required: true
    - id: 25
      name: audit_notes
      label: Audit Findings and Recommendations
      hint: Issues identified and required actions
      type: text
      options: []
      required: false
