inputSchema:
  type: object
  properties:
    title: New Particle Submission Form
    pages:
    - id: 1
      name: particle_description
      label: Particle Description
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: particle_image
      label: Particle Image
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: particle_type
      label: Particle Type
      hint: Select a type
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Aerodynamic'', ''text'': ''Aerodynamic''}'
      - '{''id'': 2, ''name'': ''Gravitational'', ''text'': ''Gravitational''}'
      required: true
    - id: 4
      name: researcher_name
      label: Researcher Name
      hint: Enter Researcher Name
      type: text
      options: []
      required: true
    - id: 5
      name: researcher_institution
      label: Researcher Institution
      hint: Enter Institution
      type: text
      options: []
      required: true
    - id: 6
      name: researcher_email
      label: Researcher Email
      hint: Enter Email
      type: email
      options: []
      required: true
    - id: 7
      name: researcher_phone
      label: Researcher Phone
      hint: Enter Phone
      type: text
      options: []
      required: true
    - id: 8
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: submission_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: researcher_comments
      label: Researcher Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: particle_coordinates
      label: Particle Coordinates
      hint: Select coordinates
      type: select_multiple
      options:
      - '{''id'': 1, ''name'': 1, ''value'': ''1''}'
      - '{''id'': 2, ''name'': 2, ''value'': ''2''}'
      - '{''id'': 3, ''name'': 3, ''value'': ''3''}'
      required: false
