inputSchema:
  type: object
  properties:
    title: Scuba Diving Medical Clearance Form
    pages:
    - id: 1
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: medical_clearance
      label: Medical Clearance
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: medical_condition
      label: Medical Conditions
      hint: null
      type: select_multiple
      options:
      - High Blood Pressure
      - Diabetes
      - Heart Condition
      - Asthma
      - Epilepsy
      - Seizure Disorder
      - Migraines
      - Sleep Apnea
      - Other (Specify)
      required: false
    - id: 4
      name: medications
      label: Medications
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: medical_certifications
      label: Medical Certifications
      hint: null
      type: select_multiple
      options:
      - Scuba Diving Medical Certificate
      - Basic Life Support Certification
      - Emergency Response Training
      - CPR Certification
      - EMT Certification
      required: false
    - id: 6
      name: diving_history
      label: Diving History
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: diving_environment
      label: Diving Environment
      hint: null
      type: select_one
      options:
      - Open Water
      - Cavediver
      - Wreck Diving
      - Cave Diving
      - Ice Cavern Diving
      required: true
    - id: 8
      name: scuba_gear
      label: Scuba Gear
      hint: null
      type: select_one
      options:
      - Full Face Mask
      - Regulator
      - BCD
      - Weight Belt
      - Depth Gauge
      required: true
    - id: 9
      name: diving_frequency
      label: Diving Frequency
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: last_dive_date
      label: Last Dive Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: dive_location
      label: Dive Location
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: emergency_contact
