inputSchema:
  type: object
  properties:
    title: COVID 19 Booster Shot Form
    pages:
    - id: 1
      name: section_personal_info
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 5
      name: patient_email
      label: Email Address
      hint: We will use this to send your vaccination records
      type: email
      options: []
      required: true
    - id: 6
      name: patient_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: section_medical_history
      label: -- Medical History --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: initial_vaccine_date
      label: Date of Initial COVID-19 Vaccination
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: vaccine_type_initial
      label: What type of vaccine did you receive initially?
      hint: null
      type: select_one
      options:
      - Pfizer
      - Moderna
      - Johnson & Johnson
      - Other
      required: true
    - id: 10
      name: booster_interest
      label: Are you interested in receiving a booster dose?
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - Maybe, need more information
      - No, not at this time
      - Unsure
      required: true
    - id: 11
      name: allergies
      label: Do you have any known allergies to vaccine components?
      hint: null
      type: select_one
      options:
      - No known allergies
      - Allergic to eggs
      - Allergic to gelatin
      - Other allergies
      required: true
    - id: 12
      name: current_health_conditions
      label: Do you have any current health conditions?
      hint: null
      type: select_multiple
      options:
      - Diabetes
      - Heart disease
      - Respiratory issues
      - Immunocompromised
      - Other conditions
      - None
      required: false
    - id: 13
      name: section_safety_concerns
      label: -- Safety and Concerns --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: previous_side_effects
      label: Did you experience any side effects from your initial vaccination?
      hint: null
      type: select_one
      options:
      - No side effects
      - Mild side effects
      - Moderate side effects
      - Severe side effects
      required: true
    - id: 15
      name: side_effect_description
      label: Please describe any side effects you experienced
      hint: Optional - leave blank if no side effects
      type: text
      options: []
      required: false
    - id: 16
      name: safety_concerns
      label: Do you have any safety concerns about the booster?
      hint: null
      type: select_one
      options:
      - No concerns
      - Minor concerns
      - Significant concerns
      - Need to discuss with doctor
      required: false
    - id: 17
      name: section_consent
      label: -- Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: consent_agree
      label: I consent to receive the COVID-19 booster vaccine
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 19
      name: physician_notes
      label: Physician Notes
      hint: For medical personnel use only
      type: text
      options: []
      required: false
