inputSchema:
  type: object
  properties:
    title: CDC COVID 19 Vaccination Program Provider Agreement
    pages:
    - id: 1
      name: provider_name
      label: Provider Name
      hint: Full legal name of provider or organization
      type: text
      options: []
      required: true
    - id: 2
      name: provider_type
      label: Provider Type
      hint: Select your provider classification
      type: select_one
      options:
      - Physician
      - Pharmacy
      - Hospital
      - Clinic
      - Health Department
      - Federally Qualified Health Center
      - Other Healthcare Facility
      required: true
    - id: 3
      name: npi_number
      label: NPI Number
      hint: National Provider Identifier
      type: text
      options: []
      required: true
    - id: 4
      name: dea_number
      label: DEA Registration Number
      hint: Drug Enforcement Administration number
      type: text
      options: []
      required: true
    - id: 5
      name: facility_name
      label: Facility Name
      hint: Name of vaccination site
      type: text
      options: []
      required: true
    - id: 6
      name: facility_address
      label: Facility Address
      hint: Complete street address
      type: text
      options: []
      required: true
    - id: 7
      name: facility_city
      label: City
      hint: City location
      type: text
      options: []
      required: true
    - id: 8
      name: facility_state
      label: State
      hint: State or territory
      type: select_one
      options:
      - Alabama
      - Alaska
      - Arizona
      - Arkansas
      - California
      - Colorado
      - Connecticut
      - Delaware
      - Florida
      - Georgia
      - Hawaii
      - Idaho
      - Illinois
      - Indiana
      - Iowa
      - Kansas
      - Kentucky
      - Louisiana
      - Maine
      - Maryland
      - Massachusetts
      - Michigan
      - Minnesota
      - Mississippi
      - Missouri
      - Montana
      - Nebraska
      - Nevada
      - New Hampshire
      - New Jersey
      - New Mexico
      - New York
      - North Carolina
      - North Dakota
      - Ohio
      - Oklahoma
      - Oregon
      - Pennsylvania
      - Rhode Island
      - South Carolina
      - South Dakota
      - Tennessee
      - Texas
      - Utah
      - Vermont
      - Virginia
      - Washington
      - West Virginia
      - Wisconsin
      - Wyoming
      - District of Columbia
      required: true
    - id: 9
      name: facility_zip
      label: ZIP Code
      hint: Five digit ZIP code
      type: text
      options: []
      required: true
    - id: 10
      name: contact_person
      label: Primary Contact Person
      hint: Name of program coordinator
      type: text
      options: []
      required: true
    - id: 11
      name: contact_email
      label: Contact Email
      hint: Email for program communications
      type: email
      options: []
      required: true
    - id: 12
      name: contact_phone
      label: Contact Phone
      hint: Direct phone number
      type: text
      options: []
      required: true
    - id: 13
      name: storage_capability
      label: Vaccine Storage Capability
      hint: Select all that apply
      type: select_multiple
      options:
      - Ultra-cold storage -90 to -60 C
      - Frozen storage -25 to -15 C
      - Refrigerated storage 2 to 8 C
      - Pfizer-BioNTech mRNA vaccine
      - Moderna mRNA vaccine
      - Johnson and Johnson Janssen vaccine
      required: true
    - id: 14
      name: staff_trained
      label: Staff Trained in Vaccine Handling
      hint: Number of trained staff members
      type: number
      options: []
      required: true
    - id: 15
      name: vaccination_capacity
      label: Weekly Vaccination Capacity
      hint: Estimated number of doses per week
      type: number
      options: []
      required: true
    - id: 16
      name: agreement_terms
      label: Agreement to Terms
      hint: I agree to comply with all CDC requirements
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
    - id: 17
      name: reporting_commitment
      label: Commitment to Data Reporting
      hint: Agree to report vaccination data to CDC
      type: select_one
      options:
      - Yes I Commit
      - false
      required: true
    - id: 18
      name: signature_date
      label: Signature Date
      hint: Date of agreement
      type: date
      options: []
      required: true
    - id: 19
      name: authorized_signature
      label: Authorized Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
