inputSchema:
  type: object
  properties:
    title: Influenza Questionnaire
    pages:
    - id: 1
      name: symptom_questions
      label: Symptom Questions
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: recent_travel
      label: Recent Travel
      hint: null
      type: select_one
      options:
      - Influenza
      - Flu-like illness
      - Common cold
      - Other
      - None
      required: false
    - id: 3
      name: exposure_risk
      label: Exposure Risk
      hint: null
      type: select_one
      options:
      - Low
      - Moderate
      - High
      - Very High
      required: false
    - id: 4
      name: flu_symptoms
      label: Flu Symptoms
      hint: null
      type: select_multiple
      options:
      - Fever
      - Cough
      - Sore Throat
      - Runny Nose
      - Fatigue
      - Chills
      - Muscle Aches
      - Headache
      - Nausea/Vomiting
      - Diarrhea
      - Confusion/Disorientation
      - Loss of Appetite
      - Loss of Taste
      - Loss of Smell
      - Loss of Hearing
      required: false
    - id: 5
      name: recent_exposure
      label: Recent Exposure
      hint: null
      type: select_one
      options:
      - Close contact with someone who has influenza
      - Close contact with someone who has a flu-like illness
      - Close contact with someone who has a different illness
      - None
      required: false
    - id: 6
      name: exposure_duration
      label: Exposure Duration
      hint: null
      type: select_one
      options:
      - Less than 1 day
      - 1-2 days
      - 2-5 days
      - More than 5 days
      required: false
    - id: 7
      name: recent_contact
