inputSchema:
  type: object
  properties:
    title: Medical Record Audit Form
    pages:
    - id: 1
      name: physician_name
      label: Physician Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: medical_record_id
      label: Medical Record ID
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: audit_date
      label: Audit Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: prophets_and_procedures
      label: Prophets and Procedures
      hint: null
      type: select_multiple
      options:
      - Prophet 1
      - Prophet 2
      required: true
    - id: 5
      name: procedure_start_time
      label: Procedure Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: procedure_end_time
      label: Procedure End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: provider_name
      label: Provider Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: audit_level
      label: Audit Level
      hint: null
      type: select_one
      options:
      - Level 1
      - Level 2
      - Level 3
      required: true
    - id: 9
      name: audit_status
      label: Audit Status
      hint: null
      type: select_one
      options:
      - Complete
      - Not Started
      - In Progress
      required: true
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: true
    - id: 11
      name: audit_comments
      label: Audit Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: audit_completion_date
      label: Audit Completion Date
      hint: null
      type: date
      options: []
      required: true
