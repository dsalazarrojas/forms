inputSchema:
  type: object
  properties:
    title: Referral Request Form
    pages:
    - id: 1
      name: referral_request_form_name
      label: Referral Request Form Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Name
      hint: Enter patient's name
      type: text
      options: []
      required: false
    - id: 3
      name: referring_physician
      label: Referring Physician
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: referral_reason
      label: Referral Reason
      hint: null
      type: text
      options: []
      required: false
