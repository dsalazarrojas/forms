inputSchema:
  type: object
  properties:
    title: Childrens Health Questionnaire
    pages:
    - id: 1
      name: header_child_info
      label: -- Child Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: child_name
      label: Child Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: Child birth date
      type: date
      options: []
      required: true
    - id: 4
      name: parent_contact
      label: Parent Contact Phone or Email
      hint: Best contact for medical questions
      type: text
      options: []
      required: true
    - id: 5
      name: primary_physician
      label: Primary Physician
      hint: Name of the child's doctor
      type: text
      options: []
      required: false
    - id: 6
      name: immunizations_up_to_date
      label: Immunizations Up to Date
      hint: Select current status
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: true
    - id: 7
      name: allergies
      label: Allergies
      hint: List any known allergies
      type: text
      options: []
      required: false
    - id: 8
      name: medications
      label: Current Medications
      hint: Include dosage and schedule if applicable
      type: text
      options: []
      required: false
    - id: 9
      name: chronic_conditions
      label: Chronic Conditions
      hint: Note any long term health conditions
      type: text
      options: []
      required: false
    - id: 10
      name: recent_symptoms
      label: Recent Symptoms
      hint: Describe any recent illness or symptoms
      type: text
      options: []
      required: false
    - id: 11
      name: permission_for_treatment
      label: Permission for Emergency Treatment
      hint: Authorize emergency care if needed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
