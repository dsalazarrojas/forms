inputSchema:
  type: object
  properties:
    title: Mpox Vaccine Assessment Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: medical_condition
      label: Medical Condition
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: vaccine_status
      label: Vaccine Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 9
      name: reason_for_assessment
      label: Reason for Assessment
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
