inputSchema:
  type: object
  properties:
    title: COVID 19 Booster Shot Registration Form
    pages:
    - id: 1
      name: patient_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: patient_id
      label: Patient ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: preferred_contact
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Text message
      required: true
    - id: 7
      name: registration_date
      label: Registration Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: preferred_appointment_date
      label: Preferred Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: preferred_time
      label: Preferred Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: vaccination_location
      label: Preferred Vaccination Location
      hint: null
      type: select_one
      options:
      - Main clinic
      - Community center location
      - Mobile clinic
      - Other
      required: true
    - id: 11
      name: initial_vaccine_type
      label: Type of Initial COVID-19 Vaccine
      hint: null
      type: select_one
      options:
      - Pfizer
      - Moderna
      - Johnson and Johnson
      - AstraZeneca
      - Unknown
      required: true
    - id: 12
      name: first_dose_date
      label: Date of First Dose
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: second_dose_date
      label: Date of Second Dose
      hint: If applicable
      type: date
      options: []
      required: false
    - id: 14
      name: booster_eligibility
      label: Do you meet booster eligibility criteria?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unsure
      required: true
    - id: 15
      name: health_conditions
      label: Medical conditions that may affect eligibility
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: allergies_documented
      label: Any documented vaccine allergies?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 17
      name: allergy_description
      label: Allergy Description
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: insurance_provider
      label: Insurance Provider
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: insurance_id
      label: Insurance ID Number
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: consent_understood
      label: I understand the purpose and benefits of the booster shot
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 21
      name: consent_to_vaccinate
      label: I consent to receive the COVID-19 booster vaccination
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
