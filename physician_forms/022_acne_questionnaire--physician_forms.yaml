inputSchema:
  type: object
  properties:
    title: Acne Questionnaire
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: Full name of the patient
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: Patient's birth date
      type: date
      options: []
      required: true
    - id: 3
      name: contact_number
      label: Contact Number
      hint: Patient's phone number
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Patient's email for communication
      type: email
      options: []
      required: false
    - id: 5
      name: acne_duration
      label: How long have you had acne
      hint: Duration of acne symptoms
      type: select_one
      options:
      - Less than 6 months
      - 6 months to 1 year
      - 1-3 years
      - 3-5 years
      - More than 5 years
      required: true
    - id: 6
      name: acne_severity
      label: How would you rate the severity of your acne
      hint: Self-assessment of acne severity
      type: select_one
      options:
      - Mild - occasional pimples
      - Moderate - frequent breakouts
      - Severe - cystic or nodular acne
      - Very severe - extensive coverage
      required: true
    - id: 7
      name: affected_areas
      label: Areas Affected by Acne
      hint: Select all body parts affected by acne
      type: select_multiple
      options:
      - Face
      - Chest
      - Back
      - Shoulders
      - Neck
      - Arms
      - Other
      required: true
    - id: 8
      name: acne_triggers
      label: Known Triggers for Breakouts
      hint: Factors that seem to worsen acne
      type: select_multiple
      options:
      - Stress
      - Hormonal changes
      - Certain foods
      - Weather changes
      - Cosmetics
      - Exercise
      - Medications
      - None of these
      required: false
    - id: 9
      name: current_treatments
      label: Current Treatments Being Used
      hint: List any treatments currently being used for acne
      type: text
      options: []
      required: false
    - id: 10
      name: previous_treatments
      label: Previous Treatments Tried
      hint: List any previous treatments that were tried
      type: text
      options: []
      required: false
    - id: 11
      name: family_history
      label: Family History of Acne
      hint: Does anyone in your family have a history of acne
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unknown
      required: true
    - id: 12
      name: menstrual_history
      label: Menstrual History (for female patients)
      hint: For female patients, describe any correlation with menstrual cycle
      type: text
      options: []
      required: false
    - id: 13
      name: stress_levels
      label: Stress Levels
      hint: Rate your average stress levels
      type: select_one
      options:
      - Low
      - Moderate
      - High
      - Very high
      required: true
    - id: 14
      name: additional_symptoms
      label: Additional Symptoms
      hint: Any other symptoms related to skin condition
      type: text
      options: []
      required: false
