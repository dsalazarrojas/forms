inputSchema:
  type: object
  properties:
    title: Toilet Training Checklist
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: child_info
      label: Child Info
      hint: Select gender of child
      type: select_one
      options:
      - male
      - female
      - other
      required: true
    - id: 3
      name: parent_info
      label: Parent Info
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: training_status
      label: Training Status
      hint: null
      type: select_multiple
      options:
      - not started
      - in progress
      - completed
      required: true
    - id: 5
      name: next_steps
      label: Next Steps
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: observations
      label: Observations
      hint: Select any abnormal observations
      type: select_one
      options:
      - normal
      - abnormal
      - other
      required: false
    - id: 8
      name: physician_recommendations
      label: Physician Recommendations
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: medical_history
      label: Medical History
      hint: null
      type: select_one
      options:
      - no history
      - history
      - not applicable
      required: false
