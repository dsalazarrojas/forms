inputSchema:
  type: object
  properties:
    title: Post Operative Questionnaire Form
    pages:
    - id: 1
      name: surgical_procedure
      label: Surgical Procedure
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_feedback
      label: Patient Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: medical_outcome
      label: Medical Outcome
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: pain_level
      label: Pain Level
      hint: Please rate your pain level from 1 to 10
      type: number
      options: []
      required: true
    - id: 5
      name: medication
      label: Medication
      hint: null
      type: select_multiple
      options:
      - Aspirin
      - Ibuprofen
      - Paracetamol
      - Oxycodone
      required: true
    - id: 6
      name: surgical_team
      label: Surgical Team
      hint: null
      type: select_one
      options:
      - Anesthesiologist
      - Surgeon
      - Nurse
      - Assistant
      required: true
    - id: 7
      name: surgical_site
      label: Surgical Site
      hint: null
      type: select_multiple
      options:
      - Abdomen
      - Chest
      - Leg
      - Back
      required: true
    - id: 8
      name: follow_up
      label: Follow Up
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: time_of_day
      label: Time of Day
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: patient_id
      label: Patient ID
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: doctor_name
      label: Doctor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: doctor_contact
      label: Doctor Contact
      hint: null
      type: select_one
      options:
      - Call
      - Email
      - Message
      - Visit
      required: false
    - id: 15
      name: patient_email
      label: Patient E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 16
      name: patient_phone
      label: Patient Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: follow_up_contact
      label: Follow Up Contact
      hint: null
      type: select_one
      options:
      - Call
      - Email
      - Message
      - Visit
      required: false
    - id: 18
      name: follow_up_time
      label: Follow Up Time
      hint: null
      type: time
      options: []
      required: false
    - id: 19
      name: follow_up_date
      label: Follow Up Date
      hint: null
      type: date
      options: []
      required: false
    - id: 20
      name: patient_address
      label: Patient Address
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: follow_up_location
      label: Follow Up Location
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: follow_up_note
      label: Follow Up Note
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: medication_allergy
      label: Medication Allergy
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: medical_notes
      label: Medical Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: follow_up_status
      label: Follow Up Status
      hint: null
