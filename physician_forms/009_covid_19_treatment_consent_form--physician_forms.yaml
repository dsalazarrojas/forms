inputSchema:
  type: object
  properties:
    title: COVID 19 Treatment Consent Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_mrn
      label: Medical Record Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: patient_dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: diagnosis_date
      label: COVID-19 Diagnosis Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: physician_name
      label: Treating Physician Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: information_section
      label: -- Patient Education and Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: understands_condition
      label: I understand my COVID-19 diagnosis and condition severity
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      - Need more information
      required: true
    - id: 8
      name: understands_treatment
      label: I have been informed about the proposed treatment options
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 9
      name: treatment_explained
      label: The benefits and risks of treatment have been explained
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 10
      name: treatment_section
      label: -- Treatment Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: treatment_type
      label: Proposed Treatment Type
      hint: null
      type: select_one
      options:
      - Antivirals
      - Monoclonal antibodies
      - Immunomodulators
      - Oxygen therapy
      - Mechanical ventilation
      - Experimental treatment
      - Other
      required: true
    - id: 12
      name: specific_medication
      label: Specific Medication or Treatment Name
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: treatment_duration
      label: Estimated Treatment Duration
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: medication_section
      label: -- Medication Allergies and History --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: known_allergies
      label: Known medication allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: current_medications
      label: Current medications being taken
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: medical_conditions
      label: Other chronic medical conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: risks_section
      label: -- Risks and Side Effects --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: risks_acknowledged
      label: I acknowledge potential risks and side effects
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 20
      name: alternative_treatments
      label: I understand alternative treatment options
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 21
      name: no_treatment_option
      label: I understand the risks of refusing treatment
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 22
      name: consent_section
      label: -- Consent Statement --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: consent_treatment
      label: I voluntarily consent to the proposed COVID-19 treatment
      hint: null
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 24
      name: questions_answered
      label: All my questions have been answered to my satisfaction
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 25
      name: understand_rights
      label: I understand I have the right to withdraw consent at any time
      hint: null
      type: select_one
      options:
      - I understand
      - I do not understand
      required: true
    - id: 26
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 27
      name: emergency_contact_phone
      label: Emergency Contact Phone Number
      hint: null
      type: text
      options: []
      required: false
