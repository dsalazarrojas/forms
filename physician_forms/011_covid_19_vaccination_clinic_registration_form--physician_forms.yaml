inputSchema:
  type: object
  properties:
    title: COVID 19 Vaccination Clinic Registration Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: patient_age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer to specify
      required: true
    - id: 5
      name: contact_section
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone_primary
      label: Primary Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: phone_secondary
      label: Secondary Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: address_street
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: address_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: address_state
      label: State or Province
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: address_zip
      label: Postal or Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: medical_section
      label: -- Medical History --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: insurance_status
      label: Insurance Status
      hint: null
      type: select_one
      options:
      - Insured
      - Uninsured
      - Medicaid
      - Medicare
      required: true
    - id: 15
      name: insurance_id
      label: Insurance ID Number
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: chronic_diseases
      label: Do you have chronic diseases
      hint: Diabetes, heart disease, immunosuppression, etc.
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 17
      name: disease_details
      label: If yes, please specify
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: allergies
      label: Known allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: current_medications
      label: Current medications
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: pregnancy
      label: Are you currently pregnant
      hint: null
      type: select_one
      options:
      - true
      - false
      - Not applicable
      required: true
    - id: 21
      name: breastfeeding
      label: Are you currently breastfeeding
      hint: null
      type: select_one
      options:
      - true
      - false
      - Not applicable
      required: true
    - id: 22
      name: vaccination_section
      label: -- Vaccination History --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: previous_covid
      label: Have you had COVID-19 before
      hint: null
      type: select_one
      options:
      - true
      - false
      - Unsure
      required: true
    - id: 24
      name: covid_date
      label: If yes, when were you diagnosed
      hint: null
      type: date
      options: []
      required: false
    - id: 25
      name: vaccine_preference
      label: Vaccine Preference
      hint: null
      type: select_one
      options:
      - Pfizer
      - Moderna
      - Johnson and Johnson
      - No preference
      required: true
    - id: 26
      name: appointment_section
      label: -- Appointment Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: preferred_date
      label: Preferred Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 28
      name: preferred_time
      label: Preferred Appointment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 29
      name: accessibility_needs
      label: Any accessibility needs or accommodations
      hint: null
      type: text
      options: []
      required: false
    - id: 30
      name: consent
      label: I consent to COVID-19 vaccination and provide accurate information
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
