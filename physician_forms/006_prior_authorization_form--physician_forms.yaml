inputSchema:
  type: object
  properties:
    title: Prior Authorization Form
    pages:
    - id: 1
      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: medical_procedure
      label: Medical Procedure
      hint: What is the procedure you would like to perform?
      type: text
      options: []
      required: false
    - id: 3
      name: medication
      label: Medications
      hint: null
      type: select_multiple
      options:
      - Azithromycin
      - Flecainide
      - Loperamide
      required: false
    - id: 4
      name: doctor_info
      label: Doctor Information
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: patient_coverage
      label: Patient Coverage
      hint: null
      type: select_one
      options:
      - Covered
      - Not Covered
      - Need More Info
      required: true
    - id: 6
      name: procedure_date
      label: Procedure Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: procedure_time
      label: Procedure Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: procedure_location
      label: Procedure Location
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: patient_signature
      label: Patient Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: doctor_signature
      label: Doctor Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 13
      name: medical_record_number
      label: Medical Record Number
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: patient_address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: patient_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: patient_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
