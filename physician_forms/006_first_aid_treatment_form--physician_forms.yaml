inputSchema:
  type: object
  properties:
    title: First Aid Treatment Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_phone
      label: Patient Phone
      hint: null
      type: text
      options: []
      required: true
