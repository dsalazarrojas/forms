      - Infarction
      - Influenza
      - Insomnia
      - Keratosis
      - Kleptomania
      - Knee pain
      - Migraine
      - Migraine Aura
      - Multiple Sclerosis
      - Muscle strain
      - Nephrotic
      - Neuritis
      - Pneumonitis
      - Pulmonary edema
      - Rash
      - Reflux
      - Scoliosis
      - Seizures
