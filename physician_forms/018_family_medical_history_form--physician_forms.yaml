inputSchema:
  type: object
  properties:
    title: Family Medical History Form
    pages:
    - id: 1
      name: patient_id
      label: Patient ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: family_history
      label: Family History
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: medical_conditions
      label: Medical Conditions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: allergies
      label: Allergies
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: medical_history_date
      label: Medical History Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: doctor_note
      label: Doctor Note
      hint: null
      type: note
      options: []
      required: false
