inputSchema:
  type: object
  properties:
    title: COVID 19 Customer Consent Form
    pages:
    - id: 1
      name: customer_header
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: customer_id
      label: Customer ID or Account Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: service_date
      label: Date of Service
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: service_type
      label: Type of Service
      hint: null
      type: select_one
      options:
      - Medical Consultation
      - Testing
      - Treatment
      - Preventive Care
      - Other
      required: true
    - id: 8
      name: risk_disclosure
      label: -- Risk Acknowledgment --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: understand_risks
      label: I understand risks associated with COVID-19
      hint: null
      type: select_one
      options:
      - Yes, I Understand
      - No, I Need More Information
      required: true
    - id: 10
      name: facility_precautions
      label: I acknowledge facility safety precautions
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 11
      name: precaution_details
      label: Facility protocols explained
      hint: null
      type: select_one
      options:
      - Fully Explained
      - Partially Explained
      - Not Explained
      required: true
    - id: 12
      name: safety_section
      label: -- Health and Safety --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: symptoms_present
      label: Any COVID-19 symptoms currently present
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 14
      name: symptom_list
      label: Symptoms present
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully Vaccinated
      - Partially Vaccinated
      - Not Vaccinated
      required: true
    - id: 16
      name: consent_agreement
      label: I consent and acknowledge risks
      hint: null
      type: select_one
      options:
      - I Consent
      - I Do Not Consent
      required: true
    - id: 17
      name: consent_date
      label: Consent Date
      hint: null
      type: date
      options: []
      required: true
