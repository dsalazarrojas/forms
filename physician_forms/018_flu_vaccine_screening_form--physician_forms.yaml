inputSchema:
  type: object
  properties:
    title: Flu Vaccine Screening Form
    pages:
    - id: 1
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: medical_condition
      label: Medical Condition
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: allergies
      label: Allergies
      hint: List any allergies
      type: select_multiple
      options:
      - option 1
      - option 2
      - option 3
      required: false
    - id: 4
      name: medical_device
      label: Medical Device Use
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: previous_vaccination
      label: Previous Vaccination
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: flu_vaccine_type
      label: Flu Vaccine Type
      hint: null
      type: select_one
      options:
      - flu vaccine type 1
      - flu vaccine type 2
      - flu vaccine type 3
      required: false
    - id: 7
      name: flu_vaccine_dose
      label: Flu Vaccine Dose
      hint: null
      type: select_multiple
      options:
      - flu vaccine dose 1
      - flu vaccine dose 2
      - flu vaccine dose 3
      required: false
    - id: 8
      name: flu_vaccine_reaction
      label: Flu Vaccine Reaction
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: next_step
      label: Next Steps
      hint: null
      type: text
      options: []
      required: false
