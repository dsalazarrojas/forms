inputSchema:
  type: object
  properties:
    title: Vaccination Plan Survey
    pages:
    - id: 1
      name: vaccination_date
      label: Vaccination Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: vaccination_time
      label: Vaccination Time
      hint: Format - HH -MM
      type: time
      options: []
      required: true
    - id: 3
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 4
      name: medical_condition
      label: Medical Condition
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: vaccination_plan
      label: Vaccination Plan
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: follow_up
      label: Follow Up
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: medical_condition_2
      label: Medical Condition 2
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: is_candidate_for_vaccination
      label: Candidate for Vaccination
      hint: null
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: additional_info
      label: Additional Info
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
