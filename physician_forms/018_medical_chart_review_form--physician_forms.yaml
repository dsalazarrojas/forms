inputSchema:
  type: object
  properties:
    title: Medical Chart Review Form
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: medical_record_number
      label: Medical Record Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: medical_department
      label: Medical Department
      hint: null
      type: select_one
      options:
      - cardiology
      - dermatology
      - emergency
      - neurology
      - obstetrics
      - orthopedics
      - pediatrics
      - urology
      required: false
