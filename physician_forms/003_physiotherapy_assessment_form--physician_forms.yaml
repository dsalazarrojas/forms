inputSchema:
  type: object
  properties:
    title: Physiotherapy Assessment Form
    pages:
    - id: 1
      name: patient_satisfaction
      label: patient_satisfaction
      hint: null
      type: select_multiple
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 2
      name: physical_therapy_services
      label: physical_therapy_services
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: services_satisfaction
      label: services_satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: overall_satisfaction
      label: overall_satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: additional_comments
      label: additional_comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date_of_last_visit
      label: date_of_last_visit
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: next_steps
      label: next_steps
      hint: null
      type: text
      options: []
      required: false
