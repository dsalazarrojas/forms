inputSchema:
  type: object
  properties:
    title: Patient Health History Form
    pages:
    - id: 1
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: allergies
      label: Allergies
      hint: null
      type: select_multiple
      options:
      - Peanut allergy
      - Milk allergy
      - Egg allergy
      - Fish allergy
      - Shellfish allergy
      - Tree nut allergy
      - Soy allergy
      - Wheat allergy
      - Sulfite allergy
      required: false
    - id: 3
      name: medical_conditions
      label: Medical Conditions
      hint: Please list any medical conditions you currently have or have had in the
        past.
      type: text
      options: []
      required: false
    - id: 4
      name: current_medications
      label: Current Medications
      hint: List the name of any medications or treatments you are currently taking.
      type: select_multiple
      options:
      - Aspirin
      - Vitamin C
      - Ibuprofen
      - Hydrocodone
      - Lisinopril
      required: false
    - id: 5
      name: past_treatments
      label: Past Treatments
      hint: List any past medical treatments you have received.
      type: text
      options: []
      required: false
    - id: 6
      name: medical_procedure
      label: Medical Procedure
      hint: null
      type: select_one
      options:
      - Surgery
      - Blood transfusion
      - Radiation therapy
      - Surgical procedure
      - Other (please describe)
      required: false
    - id: 7
      name: medical_specialty
      label: Medical Specialty
      hint: What type of medical specialty you have (e.g. Cardiology, Dermatology,
        etc.)
      type: select_one
      options:
      - Cardiology
      - Dermatology
      - Endocrinology
      - Gastroenterology
      - General Medicine
      - Hematology
      - Immunology
      - Neurology
      - Oncology
      - Ophthalmology
      - Pain Management
      - Psychology
      - Rheumatology
      - Surgery
      - Urology
      required: false
    - id: 8
      name: doctor_name
      label: Doctor's Name
      hint: "Please enter your doctor\u2019s name"
      type: text
      options: []
      required: false
    - id: 9
      name: doctor_phone
      label: Doctor's Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: doctor_title
      label: Doctor's Title
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: doctor_facility
      label: Doctor's Facility
      hint: "Enter the name of the doctor\u2019s facility"
      type: text
      options: []
      required: false
