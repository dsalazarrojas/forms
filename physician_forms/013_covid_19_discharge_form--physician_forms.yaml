inputSchema:
  type: object
  properties:
    title: COVID 19 Discharge Form
    pages:
    - id: 1
      name: patient_header
      label: -- Patient Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: medical_record_number
      label: Medical Record Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: discharge_date
      label: Discharge Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: admission_date
      label: Hospital Admission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: attending_physician
      label: Attending Physician Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: hospitalization_header
      label: -- Hospitalization Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: icu_admission
      label: ICU Admission Required
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 10
      name: ventilator_support
      label: Ventilator Support Provided
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 11
      name: length_of_stay
      label: Length of Stay (Days)
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: clinical_status
      label: -- Clinical Status at Discharge --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: discharge_status
      label: Patient Condition at Discharge
      hint: null
      type: select_one
      options:
      - Improved
      - Stable
      - Unchanged
      - Deteriorated
      required: true
    - id: 14
      name: oxygen_requirement
      label: Oxygen Requirement at Discharge
      hint: null
      type: select_one
      options:
      - No Oxygen
      - Supplemental Oxygen
      - Continuous Oxygen
      required: true
    - id: 15
      name: medications_section
      label: -- Discharge Medications --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: medications_provided
      label: Medications provided at discharge
      hint: List key medications
      type: text
      options: []
      required: true
    - id: 17
      name: follow_up_header
      label: -- Follow-up Care --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: follow_up_required
      label: Follow-up appointment scheduled
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 19
      name: follow_up_date
      label: Follow-up Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 20
      name: restrictions
      label: Activity Restrictions
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: isolation_period
      label: Isolation Period Recommended
      hint: null
      type: number
      options: []
      required: false
    - id: 22
      name: recovery_section
      label: -- Recovery Instructions --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: warning_signs
      label: Warning signs to watch for
      hint: null
      type: select_multiple
      options:
      - Fever
      - Difficulty Breathing
      - Chest Pain
      - Confusion
      - Severe Weakness
      - Other
      required: true
