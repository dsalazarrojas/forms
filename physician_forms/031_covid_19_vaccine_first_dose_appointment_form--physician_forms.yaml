inputSchema:
  type: object
  properties:
    title: COVID 19 Vaccine First Dose Appointment Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: patient_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: patient_dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: appointment_section
      label: -- First Dose Appointment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: appointment_date
      label: Preferred Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: appointment_time
      label: Preferred Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: appointment_location
      label: Preferred Location
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: vaccine_type
      label: Vaccine Type Preference
      hint: null
      type: select_one
      options:
      - Pfizer
      - Moderna
      - Johnson and Johnson
      - No preference
      required: true
    - id: 10
      name: healthcare_section
      label: -- Healthcare Provider Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: insurance_status
      label: Insurance Status
      hint: null
      type: select_one
      options:
      - Insured
      - Uninsured
      - Medicaid
      - Medicare
      - Other
      required: true
    - id: 12
      name: primary_care_provider
      label: Primary Care Provider Name
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: medical_section
      label: -- Medical History --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: allergies_vaccines
      label: Allergies to vaccine components
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: true
    - id: 15
      name: allergy_description
      label: If yes, describe allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: chronic_conditions
      label: Chronic medical conditions
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 17
      name: condition_list
      label: If yes, list conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: immunocompromised
      label: Immunocompromised or immunosuppressed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: true
    - id: 19
      name: current_medications
      label: Currently taking medications
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: pregnancy_status
      label: Pregnancy Status
      hint: null
      type: select_one
      options:
      - Pregnant
      - Breastfeeding
      - Planning pregnancy
      - None of the above
      - Prefer not to answer
      required: true
    - id: 21
      name: covid_history_section
      label: -- COVID-19 History --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: prior_covid
      label: Previously diagnosed with COVID-19
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: true
    - id: 23
      name: covid_diagnosis_date
      label: If yes, date of diagnosis
      hint: null
      type: date
      options: []
      required: false
    - id: 24
      name: covid_symptoms
      label: Experiencing COVID-19 symptoms now
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 25
      name: close_contact
      label: Close contact with COVID-19 case recently
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unknown
      required: true
    - id: 26
      name: screening_section
      label: -- Health Screening --
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: fever
      label: Current fever or elevated temperature
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 28
      name: recent_vaccine
      label: Recently received other vaccines
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 29
      name: other_vaccine_date
      label: If yes, date of other vaccine
      hint: null
      type: date
      options: []
      required: false
    - id: 30
      name: consent
      label: I consent to receive the COVID-19 vaccine
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
