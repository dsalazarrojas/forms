inputSchema:
  type: object
  properties:
    title: Clinical Trial Informed Consent Form
    pages:
    - id: 1
      name: consent_header
      label: Clinical Trial Informed Consent Form
      hint: Please read this form carefully before agreeing to participate in this
        clinical trial
      type: note
      options: []
      required: false
    - id: 2
      name: study_title
      label: Study Title
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: study_id
      label: Study ID or Protocol Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: principal_investigator
      label: Principal Investigator
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: institution
      label: Institution or Facility
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: participant_name
      label: Participant Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: participant_id
      label: Participant ID or MRN
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: study_purpose
      label: I Understand the Purpose of This Study
      hint: null
      type: select_one
      options:
      - Yes I Understand
      - No I Need More Information
      required: true
    - id: 10
      name: study_procedures
      label: I Understand the Procedures Involved
      hint: null
      type: select_one
      options:
      - Yes I Understand
      - No I Need More Information
      required: true
    - id: 11
      name: study_duration
      label: I Understand the Expected Duration of Participation
      hint: null
      type: select_one
      options:
      - Yes I Understand
      - No I Need More Information
      required: true
    - id: 12
      name: risks_understood
      label: I Understand the Potential Risks
      hint: null
      type: select_one
      options:
      - Yes I Understand
      - No I Need More Information
      required: true
    - id: 13
      name: benefits_understood
      label: I Understand the Potential Benefits
      hint: null
      type: select_one
      options:
      - Yes I Understand
      - No I Need More Information
      required: true
    - id: 14
      name: no_guarantee_of_benefit
      label: I Understand There Is No Guarantee of Personal Benefit
      hint: null
      type: select_one
      options:
      - Yes I Understand
      - No I Need More Information
      required: true
    - id: 15
      name: alternatives_explained
      label: Alternative Treatments Have Been Explained
      hint: null
      type: select_one
      options:
      - Yes I Understand
      - No I Need More Information
      required: true
    - id: 16
      name: confidentiality
      label: I Understand How My Information Will Be Protected
      hint: null
      type: select_one
      options:
      - Yes I Understand
      - No I Need More Information
      required: true
    - id: 17
      name: compensation_for_injury
      label: I Understand Compensation for Injury Policies
      hint: null
      type: select_one
      options:
      - Yes I Understand
      - No I Need More Information
      required: true
    - id: 18
      name: voluntary_participation
      label: I Understand Participation Is Voluntary
      hint: null
      type: select_one
      options:
      - Yes I Understand
      - No I Need More Information
      required: true
    - id: 19
      name: right_to_withdraw
      label: I Understand I Can Withdraw at Any Time
      hint: null
      type: select_one
      options:
      - Yes I Understand
      - No I Need More Information
      required: true
    - id: 20
      name: costs_and_payments
      label: I Understand Any Costs or Payments
      hint: null
      type: select_one
      options:
      - Yes I Understand
      - No I Need More Information
      required: true
    - id: 21
      name: contact_information
      label: I Have Contact Information for Questions
      hint: null
      type: select_one
      options:
      - Yes I Have It
      - No I Need It
      required: true
    - id: 22
      name: questions_answered
      label: Have All Your Questions Been Answered
      hint: null
      type: select_one
      options:
      - Yes All Questions Answered
      - Most Questions Answered
      - I Still Have Questions
      required: true
    - id: 23
      name: remaining_questions
      label: Please List Remaining Questions
      hint: If any
      type: text
      options: []
      required: false
    - id: 24
      name: copy_of_form
      label: Have You Received a Copy of This Form
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Will Receive Later
      required: true
    - id: 25
      name: language_understanding
      label: Is This Form in a Language You Understand
      hint: null
      type: select_one
      options:
      - 'True'
      - No - Interpreter Used
      - No - Need Translation
      required: true
    - id: 26
      name: interpreter_name
      label: Interpreter Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 27
      name: participant_decision
      label: Your Decision to Participate
      hint: null
      type: select_one
      options:
      - I Agree to Participate
      - I Do Not Agree to Participate
      - I Need More Time to Decide
      required: true
    - id: 28
      name: participant_signature
      label: Participant Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 29
      name: participant_signature_date
      label: Date of Signature
      hint: null
      type: date
      options: []
      required: true
    - id: 30
      name: legally_authorized_representative
      label: Legally Authorized Representative Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 31
      name: lar_signature
      label: LAR Signature
      hint: Type full name
      type: text
      options: []
      required: false
    - id: 32
      name: lar_signature_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 33
      name: investigator_name
      label: Investigator Name
      hint: null
      type: text
      options: []
      required: true
    - id: 34
      name: investigator_signature
      label: Investigator Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 35
      name: investigator_signature_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
