inputSchema:
  type: object
  properties:
    title: Hypnotherapy Informed Consent Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_number
      label: Contact Number
      hint: Enter your phone number
      type: text
      options: []
      required: false
    - id: 3
      name: email_address
      label: Email Address
      hint: Enter your email address
      type: email
      options: []
      required: false
    - id: 4
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_service
      label: Date of Service
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time_of_service
      label: Time of Service
      hint: Enter time in 24-hour format
      type: time
      options: []
      required: false
    - id: 7
      name: service_description
      label: Service Description
      hint: Describe the hypnotherapy service
      type: text
      options: []
      required: false
    - id: 8
      name: therapist_name
      label: Therapist Name
      hint: Enter your name as the therapist
      type: text
      options: []
      required: false
    - id: 9
      name: consent
      label: Consent
      hint: null
      type: select_multiple
      options:
      - I consent to receiving hypnotherapy services
      - I consent to receiving hypnotherapy services
      - I do not consent to receiving hypnotherapy services
      required: false
    - id: 10
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: date_signed
      label: Date Signed
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: therapist_signature
      label: Therapist Signature
      hint: null
      type: note
      options: []
      required: false
