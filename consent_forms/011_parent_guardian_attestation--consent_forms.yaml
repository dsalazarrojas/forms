inputSchema:
  type: object
  properties:
    title: Parent Guardian Attestation
    pages:
    - id: 1
      name: parent_guardian_name
      label: Parent Guardian Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: covid_symptoms
      label: Have any of the following signs of COVID-19
      hint: null
      type: select_one
      options:
      - Fever
      - Cough
      - Shortness of Breath
      - Loss of Smell
      - Sore Throat
      - Runny Nose
      - Headache
      - Fatigue
      - Muscle Aches
      - Nausea
      - Diarrhea
      - Vomiting
      - Confusion
      - Loss of Speech
      - Loss of Appetite
      - Loss of Taste
      - Other (please describe)
      - None of the above
      required: false
    - id: 3
      name: attester_name
      label: Attesters Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: attester_phone
      label: Attesters Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: attester_email
      label: Attesters Email
      hint: null
      type: email
      options: []
      required: false
