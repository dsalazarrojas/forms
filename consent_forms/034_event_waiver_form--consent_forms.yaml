inputSchema:
  type: object
  properties:
    title: Event Waiver Form
    pages:
    - id: 1
      name: event_waiver_form_part_1
      label: Brief Description of the Event
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_part_1
      label: Select the Participant
      hint: null
      type: select_one
      options:
      - Participant 1
      - Participant 2
      - Participant 3
      required: false
    - id: 3
      name: event_waiver_form_part_2
      label: Understanding and Agreement
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: participant_part_2
      label: Select All Participants
      hint: null
      type: select_multiple
      options:
      - Participant 1
      - Participant 2
      - Participant 3
      required: false
    - id: 5
      name: risk_description_part_1
      label: Describe the Potential Risks
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: risk_description_part_2
      label: Describe Additional Risks
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: signature_part_1
      label: Reviewed and Agreed
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: signature_part_2
      label: Signed and Agreed
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: signature_part_3
      label: Acknowledged and Agreed
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
