inputSchema:
  type: object
  properties:
    title: Academic Mentorship Session Recording Consent Form
    pages:
    - id: 1
      name: consent_header
      label: -- Mentorship Recording Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: mentee_name
      label: Mentee name
      hint: Full name of mentee
      type: text
      options: []
      required: true
    - id: 3
      name: mentor_name
      label: Mentor name
      hint: Full name of mentor
      type: text
      options: []
      required: true
    - id: 4
      name: session_date
      label: Session date
      hint: Date of mentorship session
      type: date
      options: []
      required: true
    - id: 5
      name: recording_purpose
      label: Purpose of recording
      hint: Training, notes, or archival purposes
      type: select_one
      options:
        - Training
        - Internal notes
        - Archival
        - Other
      required: true
    - id: 6
      name: consent_to_record
      label: Consent to record session
      hint: Permission to audio or video record
      type: select_one
      options:
        - Yes
        - No
      required: true
    - id: 7
      name: publish_permissions
      label: Permission to publish excerpts
      hint: Consent for public use of recordings
      type: select_one
      options:
        - Yes
        - No
      required: false
    - id: 8
      name: retention_period
      label: Retention period for recordings
      hint: Length of time recordings will be stored
      type: text
      options: []
      required: false
    - id: 9
      name: signature
      label: Digital signature
      hint: Type your full name to confirm consent
      type: text
      options: []
      required: true
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Any other instructions or restrictions
      type: text
      options: []
      required: false
