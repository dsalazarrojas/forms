inputSchema:
  type: object
  properties:
    title: Tooth Whitening Consent Form
    pages:
    - id: 1
      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: dental_health
      label: Dental Health
      hint: null
      type: select_one
      options:
      - Healthy
      - Unhealthy
      required: true
    - id: 3
      name: question1
      label: Have you had any previous dental work?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: question2
      label: Do you have a history of dental issues?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: question3
      label: Have you experienced any gum problems?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: waiver
      label: Waiver and Consent
      hint: null
      type: select_one
      options:
      - Sign
      - Decline
      required: true
    - id: 7
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: waiver_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: waiver_time
      label: Time
      hint: null
      type: time
      options: []
      required: false
