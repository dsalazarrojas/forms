inputSchema:
  type: object
  properties:
    title: Experience Waiver Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: event_start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: event_end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: waiver
      label: Waiver
      hint: null
      type: select_multiple
      options:
      - I waive any and all claims
      - I do not waive any claims
      required: false
    - id: 8
      name: waiver_agree
      label: Agree
      hint: null
      type: text
      options: []
      required: false
