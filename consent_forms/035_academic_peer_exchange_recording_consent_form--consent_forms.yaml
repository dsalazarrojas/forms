inputSchema:
  type: object
  properties:
    title: Academic Peer Exchange Recording Consent Form
    pages:
    - id: 1
      name: consent_header
      label: -- Recording Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant name
      hint: Full name of participant
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Participant email
      hint: Contact email for recording confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: session_title
      label: Session title
      hint: Title of peer exchange session
      type: text
      options: []
      required: false
    - id: 5
      name: recording_type
      label: Recording type
      hint: Audio or video recording
      type: select_one
      options:
      - Audio
      - Video
      - Both
      required: true
    - id: 6
      name: purpose_of_recording
      label: Purpose of recording
      hint: Describe how recording will be used
      type: text
      options: []
      required: true
    - id: 7
      name: consent_to_publish
      label: Consent to publish recording
      hint: Permission to use recording in public materials
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: duration_of_retention
      label: Data retention period
      hint: How long the recording will be stored
      type: text
      options: []
      required: false
    - id: 9
      name: signature
      label: Participant signature
      hint: Type name to serve as signature
      type: text
      options: []
      required: true
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Any other instructions or clarifications
      type: text
      options: []
      required: false
