inputSchema:
  type: object
  properties:
    title: AI Powered Therapy Platform Testing Consent Form
    pages:
    - id: 1
      name: participant_info_header
      label: --- Participant and Testing Information ---
      hint: Basic identification for the clinical testing program.
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Participant Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: researcher_clinician_name
      label: Overseeing Researcher / Clinician
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: platform_disclosure_note
      label: "--- Disclosure: Nature of the AI Therapy Platform ---"
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: crisis_disclaimer
      label: "MANDATORY: Crisis Intervention Disclaimer"
      hint: null
      type: select_one
      options:
      - label: I understand that this AI platform is for research/testing purposes only and is NOT a crisis intervention or emergency medical service. If I am in immediate danger, I will call emergency services (e.g., 911).
        value: acknowledged
      required: true
    - id: 8
      name: ai_limitations_note
      label: Understanding AI Limitations
      hint: I understand that the platform utilizes Large Language Models which may occasionally generate incorrect, biased, or inappropriate responses. This is an experimental tool and not a substitute for human professional judgment.
      type: note
      options: []
      required: false
    - id: 9
      name: data_collection_consent_header
      label: --- Data Collection and Privacy ---
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: recording_consent
      label: Consent to Session Recording
      hint: Do you consent to the recording and storage of your interactions (text/audio) with the AI platform for analysis?
      type: select_one
      options:
      - label: Yes, I consent to recording
        value: yes
      - label: No, I do not consent (Will exclude you from the study)
        value: no
      required: true
    - id: 11
      name: training_data_usage
      label: Usage of Data for Model Improvement
      hint: Do you consent to your anonymized data being used to train and improve future versions of the AI model?
      type: select_one
      options:
      - label: Yes, I consent to anonymized training usage
        value: yes
      - label: No, only use my data for this specific study
        value: no
      required: true
    - id: 12
      name: emergency_contact_info
      label: Emergency Contact Information
      hint: Name and phone number of a person to contact in case of distress.
      type: text
      options: []
      required: true
    - id: 13
      name: right_to_withdraw
      label: Right to Withdraw
      hint: I understand that I can stop using the platform and withdraw my consent at any time without penalty.
      type: select_one
      options:
      - label: I understand
        value: understood
      required: true
    - id: 14
      name: signature_acknowledgment
      label: Participant Signature Acknowledgment
      hint: null
      type: select_one
      options:
      - label: I have read this form and voluntarily agree to participate in the platform testing.
        value: signed
      required: true
    - id: 15
      name: date_of_consent
      label: Date of Signature
      hint: null
      type: date
      options: []
      required: true
    - id: 16
      name: testing_hardware
      label: Primary device used for testing
      hint: null
      type: select_one
      options:
      - label: Mobile Smartphone App
        value: mobile_app
      - label: Web Browser (Desktop/Laptop)
        value: web_browser
      - label: VR / AR Headset
        value: vr_headset
      required: true
    - id: 17
      name: researcher_notes_internal
      label: "Internal Use: Participant ID / Group"
      hint: null
      type: text
      options: []
      required: false
