inputSchema:
  type: object
  properties:
    title: Anesthesia Procedure Checklist
    pages:
    - id: 1
      name: section_checklist_header
      label: -- Pre-Anesthesia Procedure Checklist --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: medical_record_number
      label: Medical Record Number (MRN)
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: attending_anesthesiologist
      label: Attending Anesthesiologist
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: section_preop_confirmation
      label: -- Pre-Op Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: consent_form_signed
      label: Anesthesia Consent Form Signed?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: npo_status_verified
      label: Patient NPO Status Verified?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: airway_assessment_completed
      label: Airway Assessment Result (Mallampati Score)
      hint: null
      type: select_one
      options:
      - Mallampati I
      - Mallampati II
      - Mallampati III
      - Mallampati IV
      required: true
    - id: 9
      name: section_patient_safety
      label: -- Patient Safety --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: identity_verification_steps
      label: Identity Verification Steps Completed
      hint: Select all that apply
      type: select_multiple
      options:
      - Name Acknowledged
      - DOB Confirmed
      - Wristband Checked
      - Procedure Site Marked
      required: true
    - id: 11
      name: dental_status_checked
      label: Dental Status Checked
      hint: null
      type: select_one
      options:
      - Loose Teeth
      - Caps / Crowns
      - No Issues
      required: true
    - id: 12
      name: iv_access_established
      label: IV Access Successfully Established?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: special_anesthetic_concerns
      label: Special Anesthetic Concerns or Alerts
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: checklist_completion_date
      label: Checklist Completion Date and Time
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: verified_by_initials
      label: Verified By (Initials)
      hint: null
      type: text
      options: []
      required: true
