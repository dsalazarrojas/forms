inputSchema:
  type: object
  properties:
    title: Waxing Consent & Appointment Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_email
      label: Client Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: contact_phone
      label: Client Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: preferred_date
      label: Preferred Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: preferred_time
      label: Preferred Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: consent_given
      label: Consent Given
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: service_brow_waxing
      label: Service
      hint: null
      type: select_multiple
      options:
      - Eyebrow Waxing
      - Chin/Upper Lip
      - Chin/Upper Lip and Eyebrow
      - Eyebrow
      - Lip
      - Lip/Chin
      required: false
    - id: 8
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
