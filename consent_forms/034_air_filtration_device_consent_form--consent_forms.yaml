inputSchema:
  type: object
  properties:
    title: Air Filtration Device Consent Form
    pages:
    - id: 1
      name: participant_header
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: Full Name
      type: text
      options: []
      required: true
    - id: 3
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: location
      label: Location
      hint: Room or Office Number
      type: text
      options: []
      required: true
    - id: 5
      name: device_info_header
      label: -- Device Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: device_type
      label: Device Type
      hint: The equipment being installed/used
      type: select_one
      options:
      - HEPA Air Purifier
      - UV-C Sanitizer
      - Carbon Filter Unit
      - Industrial Air Scrubber
      required: true
    - id: 7
      name: purpose
      label: Purpose of Use
      hint: Reason for deployment
      type: select_one
      options:
      - Air Quality Study
      - Infection Control
      - Allergen Reduction
      - Odor Control
      required: true
    - id: 8
      name: consent_header
      label: -- Acknowledgement and Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: risks_explained
      label: Risks Explained
      hint: I understand potential noise or airflow changes
      type: select_one
      options:
      - Yes
      - No
      required: true
    - id: 10
      name: benefits_explained
      label: Benefits Explained
      hint: I understand why this is being used
      type: select_one
      options:
      - Yes
      - No
      required: true
    - id: 11
      name: consent_statement
      label: Consent Statement
      hint: I agree to the operation of this device in my space
      type: select_one
      options:
      - I Consent
      - I Do Not Consent
      required: true
    - id: 12
      name: signature
      label: Signature
      hint: Type full name to sign
      type: text
      options: []
      required: true
