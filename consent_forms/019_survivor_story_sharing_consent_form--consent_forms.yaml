inputSchema:
  type: object
  properties:
    title: Survivor Story Sharing Consent Form
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: sharing_preferences
      label: Sharing Preferences
      hint: Please choose how you would like to share your story
      type: select_one
      options:
      - Share with organization
      - Share with others
      - Do not share
      required: false
    - id: 3
      name: sharing_details
      label: Sharing Details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: story
      label: Your Story
      hint: null
      type: note
      options: []
      required: false
