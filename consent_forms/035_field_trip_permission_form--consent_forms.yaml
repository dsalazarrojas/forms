inputSchema:
  type: object
  properties:
    title: Field Trip Permission Form
    pages:
    - id: 1
      name: field_trip_name
      label: Field Trip Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: trip_type
      label: Trip Type
      hint: null
      type: select_one
      options:
      - School Trip
      - Field Trip
      required: false
    - id: 3
      name: student_count
      label: Student Count
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: parent_permission
      label: Parent Permission
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: teacher_permission
      label: Teacher Permission
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: school_permission
      label: School Permission
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: contact
      label: Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
