inputSchema:
  type: object
  properties:
    title: Child Care Authorization Form
    pages:
    - id: 1
      name: authorization_intro
      label: -- Child Care Authorization Form --
      hint: Authorize child care provider services
      type: note
      options: []
      required: false
    - id: 2
      name: parent_name
      label: Parent or guardian name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: relationship_to_child
      label: Relationship to child
      hint: null
      type: select_one
      options:
      - Parent
      - Legal guardian
      - Custodian
      - Other
      required: true
    - id: 4
      name: parent_address
      label: Parent address
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: parent_phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: parent_email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: child_name
      label: Child's name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: child_date_of_birth
      label: Child's date of birth
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: child_age
      label: Child's age
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: childcare_provider_name
      label: Child care provider name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: provider_facility_name
      label: Facility name (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: provider_address
      label: Provider address
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: provider_phone
      label: Provider phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: care_start_date
      label: Start date of care
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: care_end_date
      label: End date of care (if applicable)
      hint: null
      type: date
      options: []
      required: false
    - id: 16
      name: care_schedule
      label: Care schedule (days and hours)
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: care_type
      label: Type of care
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - After-school
      - Weekend
      - Emergency only
      - Other
      required: true
    - id: 18
      name: emergency_contacts
      label: Emergency contact information
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: medical_authorization
      label: Authorization for medical decisions
      hint: null
      type: select_one
      options:
      - Authorized
      - Not authorized
      - Limited authorization
      required: true
    - id: 20
      name: disciplinary_methods
      label: Approved disciplinary methods
      hint: null
      type: text
      options: []
      required: true
    - id: 21
      name: special_needs_or_restrictions
      label: Special needs, allergies, or restrictions
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: activity_permission
      label: Authorization for regular activities and outings
      hint: null
      type: select_one
      options:
      - Authorized
      - Requires advance permission
      - Not authorized
      required: true
    - id: 23
      name: photo_video_permission
      label: Permission for photos or videos
      hint: null
      type: select_one
      options:
      - Authorized
      - Not authorized
      required: true
    - id: 24
      name: payment_terms
      label: Payment terms and fees
      hint: null
      type: text
      options: []
      required: true
    - id: 25
      name: authorization_acknowledgment
      label: I authorize this provider to care for my child as described
      hint: null
      type: select_one
      options:
      - I authorize
      - I do not authorize
      required: true
