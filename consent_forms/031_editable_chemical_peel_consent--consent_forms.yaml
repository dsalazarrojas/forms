inputSchema:
  type: object
  properties:
    title: Editable Chemical Peel Consent
    pages:
    - id: 1
      name: user_information
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: chemical_peel
      label: Chemical Peel
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: consent_type
      label: Type of Treatment
      hint: null
      type: select_one
      options:
      - Chemical Peel
      - Microdermabrasion
      required: true
    - id: 4
      name: chemical_peel_type
      label: Type of Chemical Peel
      hint: null
      type: select_one
      options:
      - Light Peel
      - Medium Peel
      - Deep Peel
      required: true
    - id: 5
      name: chemical_peel_concentration
      label: Chemical Peel Concentration
      hint: null
      type: select_one
      options:
      - 5%
      - 10%
      - 15%
      - 20%
      required: true
    - id: 6
      name: num_passes
      label: Number of Passes
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      required: true
    - id: 7
      name: num_passes_duration
      label: Duration of Each Pass
      hint: null
      type: select_multiple
      options:
      - '5'
      - '10'
      - '15'
      required: true
    - id: 8
      name: num_passes_interval
      label: Interval Between Passes
      hint: null
      type: select_multiple
      options:
      - '7'
      - '14'
      - '21'
      required: true
    - id: 9
      name: chemical_peel_solution
      label: Chemical Peel Solution
      hint: null
      type: select_one
      options:
      - Glycolic Acid
      - Salicylic Acid
      - Lactic Acid
      required: true
    - id: 10
      name: num_passes_interval_unit
      label: Interval Between Passes (minutes)
      hint: null
      type: select_one
      options:
      - minutes
      - hours
      - days
      required: true
    - id: 11
      name: chemical_peel_product
      label: Chemical Peel Product
      hint: null
      type: select_one
      options:
      - Product A
      - Product B
      - Product C
      required: true
    - id: 12
      name: treatment_area
      label: Treatment Area
      hint: null
      type: select_one
      options:
      - Face
      - Neck
      - Back
      - Chest
      - Hands
      - Fingers
      - Toes
      - Feet
      - Ears
      - Eyelids
      required: true
    - id: 13
      name: num_passes_interval_unit
      label: Interval Between Passes (days)
      hint: null
      type: select_one
      options:
      - minutes
      - hours
      - days
      required: true
    - id: 14
      name: num_passes_interval_duration
      label: Duration Between Passes
      hint: null
      type: select_one
      options:
      - minutes
      - hours
      - days
      required: true
    - id: 15
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
