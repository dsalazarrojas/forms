inputSchema:
  type: object
  properties:
    title: project_documentation_consent_form
    pages:
    - id: 1
      name: participant_information
      label: Participant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: consent_type
      label: What type of consent will be obtained?
      hint: null
      type: select_one
      options:
      - Educational
      - Research
      - Promotional
      required: false
    - id: 3
      name: photo_consent
      label: Will you be photographed?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: video_consent
      label: Will you be recorded?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: project_materials_consent
      label: Will you grant permission for your project materials to be shared?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: educational_purpose
      label: For educational purposes, what will the materials be used for?
      hint: null
      type: select_multiple
      options:
      - Teaching
      - Research
      - Project presentation
      required: false
    - id: 7
      name: research_purpose
      label: For research purposes, what will the materials be used for?
      hint: null
      type: select_multiple
      options:
