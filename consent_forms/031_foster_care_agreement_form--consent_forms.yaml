inputSchema:
  type: object
  properties:
    title: Foster Care Agreement Form
    pages:
    - id: 1
      name: foster_care_agreement
      label: Is the child in your care a child of yours?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: name_of_child
      label: Name of Child
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: birth_details
      label: Birth Details (including birthdate)
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_details
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: agency_details
      label: Agency Name and Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: agreement_date
      label: Date of Agreement
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: care_duration
      label: Dates of Care (start and end)
      hint: null
      type: select_multiple
      options:
      - Start Date
      - End Date
      - Both
      required: true
    - id: 8
      name: caregiver_details
      label: Your Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
