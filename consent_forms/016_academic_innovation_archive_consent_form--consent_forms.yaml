inputSchema:
  type: object
  properties:
    title: Academic Innovation Archive Consent Form
    pages:
    - id: 1
      name: consent_header
      label: -- Archive Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: contributor_name
      label: Contributor name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Contact email
      hint: Email for archive notifications
      type: email
      options: []
      required: true
    - id: 4
      name: work_title
      label: Title of work to archive
      hint: Title of innovation output
      type: text
      options: []
      required: true
    - id: 5
      name: description
      label: Work description
      hint: Brief summary of the archived material
      type: text
      options: []
      required: false
    - id: 6
      name: consent_to_archive
      label: Consent to archive work
      hint: Permission to include work in institutional archive
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: access_restrictions
      label: Access restrictions
      hint: Any restrictions on who may view the archive
      type: text
      options: []
      required: false
    - id: 8
      name: retention_period
      label: Retention period
      hint: How long the item will be retained
      type: text
      options: []
      required: false
    - id: 9
      name: signature
      label: Signature confirmation
      hint: Type full name to confirm consent
      type: text
      options: []
      required: true
    - id: 10
      name: date
      label: Date of consent
      hint: Date consent was given
      type: date
      options: []
      required: true
