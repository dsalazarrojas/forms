inputSchema:
  type: object
  properties:
    title: Student Academic Records Release Form
    pages:
    - id: 1
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: release_to
      label: Release To
      hint: null
      type: select_one
      options:
      - academic department
      - academic program
      - academic institution
      required: false
    - id: 3
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: release_date
      label: Release Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: release_expires
      label: Release Expires
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: authorized_person
      label: Authorized Person
      hint: null
      type: select_multiple
      options:
      - Student
      - Academic Advisor
      - Academic Program Administrator
      required: false
    - id: 10
      name: authorized_reason
      label: Authorized Reason
      hint: null
      type: text
      options: []
      required: false
