      - Football
      - Baseball
      - Soccer
      - Hockey
      - Tennis
      - Golf
      - Volleyball
      - Track
      - Cross-Country
      - Swimming
      - Softball
      - Lacrosse
      - Rugby
      - Wrestling
      - Cycling
      - Other
      required: true
    - id: 6
      name: school
      label: school
      hint: null
      type: text
      options: []
