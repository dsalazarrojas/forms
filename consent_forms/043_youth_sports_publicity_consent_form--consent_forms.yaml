      name: consent
      label: consent
      hint: null
      type: select_one
      options:
      - I, the parent/guardian, agree that the youth athlete may be featured in media,
        photographs, and videos.
      - I, the parent/guardian, do not agree that the youth athlete may be featured
        in media, photographs, and videos.
      required: true
