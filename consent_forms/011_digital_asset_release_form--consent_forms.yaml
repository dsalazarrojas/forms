inputSchema:
  type: object
  properties:
    title: Digital Asset Release Form
    pages:
    - id: 1
      name: creator_name
      label: Creator Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: asset_type
      label: Asset Type
      hint: null
      type: select_one
      options:
      - Image
      - Video
      - Audio
      required: true
    - id: 3
      name: asset_date_of_release
      label: Asset Date Of Release
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: use_permission
      label: Use Permission
      hint: null
      type: select_one
      options:
      - Commercial Use
      - Non-Commercial Use
      - Both
      required: true
    - id: 5
      name: intended_use
      label: Intended Use
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: creator_signature
      label: Creator Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: date_of_signature
      label: Date Of Signature
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
