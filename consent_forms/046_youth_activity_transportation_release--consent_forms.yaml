inputSchema:
  type: object
  properties:
    title: Youth Activity Transportation Release
    pages:
    - id: 1
      name: youth_id
      label: Youth ID
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: youth_name
      label: Youth Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: emergency_contact_information
      label: Emergency Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: emergency_contacts
      label: Emergency Contacts
      hint: null
      type: select_multiple
      options:
      - Parent/Guardian
      - Other
      required: true
    - id: 5
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: true
    - id: 6
      name: signature_date
      label: Signature Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: signature_time
      label: Signature Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: parent_signature
      label: Parent Signature
      hint: null
      type: select_one
      options:
      - I agree and consent
      - I do not agree
      required: true
    - id: 9
      name: youth_signature
      label: Youth Signature
      hint: null
      type: select_one
      options:
      - I agree and consent
      - I do not agree
      required: true
