inputSchema:
  type: object
  properties:
    title: Tattoo Aftercare Guidelines Acknowledgment
    pages:
    - id: 1
      name: accept_tattoo_aftercare_guidelines
      label: Do you accept to follow tattoo aftercare guidelines?
      hint: Please check this box if you understand and agree to follow the aftercare
        guidelines.
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 2
      name: understand_aftercare_guidelines
      label: Do you understand tattoo aftercare guidelines?
      hint: Please read the aftercare guidelines provided to you before answering.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: follow_aftercare_guidelines
      label: Do you agree to follow tattoo aftercare guidelines?
      hint: Please check this box to confirm you agree to follow the aftercare guidelines.
      type: checkbox
      options:
      - I agree
      - I do not agree
      required: true
    - id: 4
      name: responsible_for_tattoo_care
      label: Do you agree to be responsible for tattoo care?
      hint: Please check this box to confirm you agree to be responsible for tattoo
        care.
      type: checkbox
      options:
      - I agree
      - I do not agree
      required: true
    - id: 5
      name: receive_tattoo_care_info
      label: How did you receive tattoo care information?
      hint: Select one of the options below.
      type: select_one
      options:
      - From an artist
      - Online
      - From a parent
      required: false
    - id: 6
      name: tattoo_type
      label: What type of tattoo is this?
      hint: null
      type: select_multiple
      options:
      - Hand-Drawn Tattoo
      - Machine-Artwork
      - Combination
      required: false
    - id: 7
      name: session_number
      label: Session Number
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: client_id
      label: Client ID
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: artist_id
      label: Artist ID
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: parent_id
      label: Parent ID
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: tattoo_location
      label: Tattoo Location
      hint: null
      type: select_multiple
      options:
      - Head
      - Neck
      - Arms
      - Legs
      - Back
      required: true
    - id: 14
      name: tattoo_size
      label: Tattoo Size
      hint: null
      type: select_multiple
      options:
      - Small
      - Medium
      - Large
      required: true
    - id: 15
      name: tattoo_orientation
      label: Tattoo Orientation
      hint: null
      type: select_multiple
      options:
      - Horizontal
      - Vertical
      - Rotating
      required: false
    - id: 16
      name: tattoo_color
      label: Tattoo Color
      hint: null
