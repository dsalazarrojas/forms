inputSchema:
  type: object
  properties:
    title: Treasury Analysis Publication Consent Form
    pages:
    - id: 1
      name: user_name
      label: User Name
      hint: User Name
      type: text
      options: []
      required: true
    - id: 2
      name: user_email
      label: User Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: project_title
      label: Project Title
      hint: Project Title
      type: text
      options: []
      required: false
    - id: 4
      name: department
      label: Department
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: role
      label: Role
      hint: Role
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Manager''}'
      - '{''id'': 2, ''name'': ''Analyst''}'
      - '{''id'': 3, ''name'': ''Other''}'
      required: true
    - id: 6
      name: date_of_consent
      label: Date of Consent
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': True}'
      - '{''id'': 2, ''name'': False}'
      required: true
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: date_signed
      label: Date Signed
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: signature_image
      label: Signature Image
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: date_signed_image
      label: Date Signed Image
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: file_attachment
      label: File Attachment
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: file_attachment_type
      label: File Type
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''pdf''}'
      - '{''id'': 2, ''name'': ''docx''}'
      required: false
    - id: 15
      name: department_agreed
      label: Department Agreed
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': True}'
      - '{''id'': 2, ''name'': False}'
      required: false
