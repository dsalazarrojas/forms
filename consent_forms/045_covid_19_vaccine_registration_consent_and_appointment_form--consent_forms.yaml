inputSchema:
  type: object
  properties:
    title: COVID 19 Vaccine Registration, Consent And Appointment Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: patient_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: patient_dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: registration_section
      label: -- Patient Registration --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: street_address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: zip_code
      label: Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: insurance_status
      label: Insurance Status
      hint: null
      type: select_one
      options:
      - Insured
      - Uninsured
      - Medicaid
      - Medicare
      - Other
      required: true
    - id: 11
      name: appointment_section
      label: -- Appointment Scheduling --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: preferred_date
      label: Preferred Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: preferred_time
      label: Preferred Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 14
      name: dose_number
      label: Dose Number
      hint: null
      type: select_one
      options:
      - First dose
      - Second dose
      - Booster dose
      - Single dose
      required: true
    - id: 15
      name: vaccine_preference
      label: Vaccine Type Preference
      hint: null
      type: select_one
      options:
      - Pfizer
      - Moderna
      - Johnson and Johnson
      - No preference
      required: true
    - id: 16
      name: consent_section
      label: -- Informed Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: received_information
      label: I received and understood vaccine information
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 18
      name: understand_benefits
      label: I understand the benefits of vaccination
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 19
      name: understand_risks
      label: I understand the risks and side effects
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 20
      name: medical_history_disclosed
      label: I have disclosed my complete medical history
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 21
      name: medication_disclosed
      label: I have disclosed all current medications
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 22
      name: allergies_disclosed
      label: I have disclosed all allergies
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 23
      name: pregnancy_disclosed
      label: I have accurately reported pregnancy status
      hint: null
      type: select_one
      options:
      - I agree
      - Not applicable
      required: true
    - id: 24
      name: questions_answered
      label: All my questions have been answered
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 25
      name: voluntary_participation
      label: I voluntarily consent to vaccination
      hint: null
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 26
      name: right_to_refuse
      label: I understand I can refuse without penalty
      hint: null
      type: select_one
      options:
      - I understand
      - I do not understand
      required: true
    - id: 27
      name: liability_release
      label: I release the facility and providers from liability
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 28
      name: screening_section
      label: -- Health Screening --
      hint: null
      type: note
      options: []
      required: false
    - id: 29
      name: fever_present
      label: Do you currently have a fever
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 30
      name: acute_illness
      label: Do you have acute illness or symptoms
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 31
      name: severe_allergies
      label: History of severe allergic reactions
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 32
      name: authorization_section
      label: -- Authorization --
      hint: null
      type: note
      options: []
      required: false
    - id: 33
      name: authorize_vaccination
      label: I authorize this facility to administer the vaccine
      hint: null
      type: select_one
      options:
      - I authorize
      - I do not authorize
      required: true
    - id: 34
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 35
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 36
      name: consent_date
      label: Consent Date
      hint: null
      type: date
      options: []
      required: true
