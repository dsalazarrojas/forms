inputSchema:
  type: object
  properties:
    title: Academic Peer Review Publication Consent Form
    pages:
    - id: 1
      name: consent_header
      label: -- Publication Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: reviewer_name
      label: Reviewer name
      hint: Full name of reviewer
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Contact email
      hint: Email for publication permissions
      type: email
      options: []
      required: true
    - id: 4
      name: manuscript_title
      label: Manuscript title
      hint: Title related to review content
      type: text
      options: []
      required: false
    - id: 5
      name: consent_to_publish_review
      label: Consent to publish review
      hint: Permission to include review or excerpts in publication
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: anonymize_review
      label: Request to anonymize review
      hint: Indicate preference for anonymity
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: restrictions
      label: Restrictions on use
      hint: Any limitations on publication of review content
      type: text
      options: []
      required: false
    - id: 8
      name: signature
      label: Signature confirmation
      hint: Type full name to confirm agreement
      type: text
      options: []
      required: true
    - id: 9
      name: date
      label: Date of consent
      hint: Date when consent was given
      type: date
      options: []
      required: true
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Any other clarifying details
      type: text
      options: []
      required: false
