inputSchema:
  type: object
  properties:
    title: Parent Permission Form For Field Trip
    pages:
    - id: 1
      name: field_trip_details
      label: Field Trip Details
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: parent_name
      label: prophets_parent_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: contact_number
      label: contact_number
      hint: 'Format: 123-456-7890 or 123-456-7890 ext. 123'
      type: text
      options: []
      required: false
    - id: 5
      name: school_permission
      label: school_permission
      hint: null
      type: select_multiple
      options:
      - School A
      - School B
      - School C
      required: false
    - id: 6
      name: parent_signature
      label: Parent Signature
      hint: null
      type: number
      options: []
      required: false
