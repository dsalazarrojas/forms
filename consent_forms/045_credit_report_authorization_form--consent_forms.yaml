inputSchema:
  type: object
  properties:
    title: creditReportAuthorizationForm
    pages:
    - id: 1
      name: individualdetails
      label: Individual Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employmenthistory
      label: employment history
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: employmenthistoryemployer
      label: currentEmployer
      hint: null
      type: select_one
      options:
      - Landlord
      - Lender
      - Employer
      required: false
    - id: 4
      name: employmenthistoryemployeraddress
      label: employerAddress
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: employmenthistoryemployercontact
      label: employerContact
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: creditreporttype
      label: creditReportType
      hint: null
      type: select_multiple
      options:
      - Landlord Report
      - Employment Verification Report
      - Credit Inquiry Report
      required: false
    - id: 7
      name: consent
      label: consent
      hint: null
      type: select_one
      options:
      - Allow Access
      - Deny Access
      required: false
