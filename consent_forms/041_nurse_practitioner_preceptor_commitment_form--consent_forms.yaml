inputSchema:
  type: object
  properties:
    title: Nurse Practitioner Preceptor Commitment Form
    pages:
    - id: 1
      name: form_1
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: form_2
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: form_3
      label: What is your role as a preceptor?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: form_4
      label: Rotation Information
      hint: null
      type: select_one
      options:
      - What is the rotation duration?
      - What are the rotation dates?
      - What is the rotation time?
      required: true
    - id: 5
      name: form_5
      label: Clinical Site Information
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: form_6
      label: What is the clinical site address?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: form_7
      label: Clinical Site Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: form_8
      label: Rotation Dates and Time
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: form_9
      label: What is the rotation start date?
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: form_10
      label: What is the rotation end date?
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: form_11
      label: What is the rotation start time?
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: form_12
      label: What is the rotation end time?
      hint: null
      type: time
      options: []
      required: true
    - id: 13
      name: form_13
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: form_14
      label: Is there any additional information you would like to provide about your
        clinical site or rotation?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: form_15
      label: I confirm that the information provided is accurate and complete
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 16
      name: form_16
      label: Signature of the preceptor
      hint: null
      type: text
      options: []
      required: true
