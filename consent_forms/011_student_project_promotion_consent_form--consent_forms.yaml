inputSchema:
  type: object
  properties:
    title: Student Project Promotion Consent Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: parent_or_guardian_name
      label: Parent Or Guardian Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: parent_or_guardian_email
      label: Parent Or Guardian Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: student_phone
      label: Student Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: parent_or_guardian_phone
      label: Parent Or Guardian Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: agreement
      label: I agree to
      hint: null
      type: select_one
      options:
      - 'yes'
      - 'no'
      required: true
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: educational_institution
      label: Educational Institution
      hint: null
      type: select_one
      options:
      - University of XYZ
      - ABC University
      - Other
      required: true
    - id: 10
      name: promotion_materials
      label: Promotion Materials
      hint: null
      type: select_multiple
      options:
      - Social media
      - Website
      - Print Materials
      required: true
    - id: 11
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 13
      name: agreement_details
      label: I agree to use the above information for the following
      hint: null
      type: select_multiple
      options:
      - social media
      - website
      - print materials
      required: true
    - id: 14
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: student_declaration
      label: Declaration
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: institution_declaration
      label: Declaration
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: student_signature
      label: Signature of Student
      hint: null
      type: note
      options: []
      required: true
    - id: 18
      name: parent_or_guardian_signature
      label: Signature of Parent or Guardian
      hint: null
      type: note
      options: []
      required: true
