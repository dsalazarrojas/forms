      options:
      - consent
      - no_consent
      required: false
    - id: 5
      name: consent_note
      label: consent note
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: workshop_date
      label: workshop date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: workshop_time
      label: workshop time
      hint: null
      type: time
      options: []
      required: false
