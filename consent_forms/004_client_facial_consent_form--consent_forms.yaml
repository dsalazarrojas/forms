inputSchema:
  type: object
  properties:
    title: Client Facial Consent Form
    pages:
    - id: 1
      name: consent_header
      label: -- Facial Treatment Consent --
      hint: Please read carefully before signing
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: client name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: date of birth
      hint: For identification and treatment planning
      type: date
      options: []
      required: true
    - id: 4
      name: procedure
      label: procedure to be performed
      hint: Select the treatment being provided
      type: select_one
      options:
      - Facial cleansing
      - Chemical peel
      - Microdermabrasion
      - Laser treatment
      - Other
      required: true
    - id: 5
      name: allergies_or_sensitivities
      label: allergies or skin sensitivities
      hint: List any known allergies or reactions
      type: text
      options: []
      required: false
    - id: 6
      name: prior_skin_treatments
      label: prior skin treatments in last 12 months
      hint: Include injections, laser, or peel history
      type: text
      options: []
      required: false
    - id: 7
      name: photo_consent
      label: consent for clinical photography
      hint: Photographs may be used for treatment records
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: emergency_contact_name
      label: emergency contact name
      hint: Name of someone to contact in case of emergency
      type: text
      options: []
      required: false
    - id: 9
      name: emergency_contact_phone
      label: emergency contact phone
      hint: Phone number for emergency contact
      type: text
      options: []
      required: false
    - id: 10
      name: practitioner_name
      label: practitioner name
      hint: Name of clinician performing the procedure
      type: text
      options: []
      required: true
    - id: 11
      name: date_signed
      label: date signed
      hint: Date the client provided consent
      type: date
      options: []
      required: true
