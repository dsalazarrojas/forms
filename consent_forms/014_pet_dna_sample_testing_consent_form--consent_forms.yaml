inputSchema:
  type: object
  properties:
    title: pet_dna_sample_testing_consent_form
    pages:
    - id: 1
      name: pet_owner_details
      label: Pet Owner Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: owner_contact_info
      label: Owner Contact Info
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Address
      required: true
    - id: 3
      name: pet_details
      label: Pet Details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: testing_preferences
      label: Testing Preferences
      hint: null
      type: select_multiple
      options:
      - Genetic Test
      - Non-Genetic Test
      - Both Tests
      required: true
    - id: 5
      name: testing_instructions
      label: Testing Instructions
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: owner_notes
      label: Owner Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: testing_results
      label: Testing Results
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: pet_dna_sample_testing_consent
      label: Pet Dna Sample Testing Consent
      hint: null
      type: select_one
      options:
      - Consent
      - No Consent
      - Pending Consent
      required: true
