inputSchema:
  type: object
  properties:
    title: Faith Based Counseling Session Consent Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_number
      label: Contact Number
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: session_details
      label: Session Details
      hint: Provide details about your session
      type: text
      options: []
      required: false
    - id: 6
      name: parent_name
      label: Parent Name (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: emergency_contact_number
      label: Emergency Contact Number
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: emergency_contact_relationship
      label: Relationship
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: consent_to_share
      label: Consent to Share
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: consent_to_track
      label: Consent to Track
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: session_type
      label: Session Type
      hint: null
      type: select_one
      options:
      - Individual
      - Couple
      - Family
      - Group
      required: true
    - id: 13
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
