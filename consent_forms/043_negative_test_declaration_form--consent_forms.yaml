inputSchema:
  type: object
  properties:
    title: Negative Test Declaration Form
    pages:
    - id: 1
      name: passenger_info
      label: Passenger Information
      hint: Enter the passenger's name, age, and contact information.
      type: text
      options: []
      required: false
    - id: 2
      name: travel_info
      label: Travel Information
      hint: Enter the travel date and flight number.
      type: text
      options: []
      required: false
    - id: 3
      name: test_result
      label: Test Result
      hint: Select the test result.
      type: text
      options: []
      required: false
    - id: 4
      name: contact_info2
      label: Contact Information 2
      hint: Enter the contact information for the person submitting the form.
      type: text
      options: []
      required: false
    - id: 5
      name: medical_info
      label: Medical Information
      hint: Enter any medical information related to the test.
      type: text
      options: []
      required: false
    - id: 6
      name: additional_info
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: ship_info
      label: Ship Information
      hint: Enter the ship's name and count.
      type: text
      options: []
      required: false
    - id: 8
      name: travel_count
      label: Travel Count
      hint: Enter the number of times the passenger has traveled.
      type: number
      options: []
      required: false
    - id: 9
      name: test_info
      label: Test Information
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: test_date
      label: Test Date
      hint: Enter the test date.
      type: date
      options: []
      required: false
