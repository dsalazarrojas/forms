inputSchema:
  type: object
  properties:
    title: Blood Component Administration Consent Form
    pages:
    - id: 1
      name: consent_header
      label: Blood Component Administration Consent Form
      hint: Please read carefully before providing consent
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: Patient birth date
      type: date
      options: []
      required: true
    - id: 4
      name: medical_record_number
      label: Medical Record Number
      hint: Hospital ID number
      type: text
      options: []
      required: true
    - id: 5
      name: consent_date
      label: Date of Consent
      hint: Today date
      type: date
      options: []
      required: true
    - id: 6
      name: blood_component_type
      label: Blood Component Type
      hint: What will be administered
      type: select_one
      options:
      - Red Blood Cells
      - Platelets
      - Plasma
      - Cryoprecipitate
      - Whole Blood
      - Multiple Components
      required: true
    - id: 7
      name: reason_for_transfusion
      label: Reason for Transfusion
      hint: Medical indication
      type: text
      options: []
      required: true
    - id: 8
      name: procedure_explanation
      label: Procedure Understanding
      hint: I understand the procedure
      type: select_one
      options:
      - Yes I Understand
      - I Have Questions
      required: true
    - id: 9
      name: benefits_understanding
      label: Benefits Understanding
      hint: I understand the potential benefits
      type: select_one
      options:
      - Yes I Understand
      - 'False'
      required: true
    - id: 10
      name: risks_acknowledged
      label: Risks Acknowledged
      hint: I understand potential risks
      type: select_one
      options:
      - Yes I Understand
      - I Have Questions
      required: true
    - id: 11
      name: risk_details
      label: Risk Details
      hint: Allergic reactions fever transfusion reactions etc
      type: note
      options: []
      required: false
    - id: 12
      name: alternatives_discussed
      label: Alternatives Discussed
      hint: Have alternatives been discussed
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Applicable
      required: true
    - id: 13
      name: questions_answered
      label: Questions Answered
      hint: Have all your questions been answered
      type: select_one
      options:
      - Yes All Answered
      - I Have No Questions
      - I Still Have Questions
      required: true
    - id: 14
      name: voluntary_consent
      label: Voluntary Consent
      hint: I give consent voluntarily
      type: select_one
      options:
      - Yes Voluntary
      - 'False'
      required: true
    - id: 15
      name: right_to_refuse
      label: Right to Refuse
      hint: I understand I can refuse
      type: select_one
      options:
      - Yes I Understand
      - 'False'
      required: true
    - id: 16
      name: religious_objections
      label: Religious Considerations
      hint: Any religious concerns
      type: select_one
      options:
      - None
      - Jehovah Witness
      - Other Religious Concerns
      required: true
    - id: 17
      name: previous_reactions
      label: Previous Transfusion Reactions
      hint: Have you had reactions before
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unknown
      required: true
    - id: 18
      name: reaction_details
      label: Reaction Details
      hint: Describe if yes
      type: text
      options: []
      required: false
    - id: 19
      name: patient_signature
      label: Patient Signature
      hint: Type name as signature
      type: text
      options: []
      required: true
    - id: 20
      name: witness_name
      label: Witness Name
      hint: Healthcare provider name
      type: text
      options: []
      required: true
    - id: 21
      name: witness_signature
      label: Witness Signature
      hint: Provider signature
      type: text
      options: []
      required: true
    - id: 22
      name: additional_notes
      label: Additional Notes
      hint: Any other comments
      type: text
      options: []
      required: false
