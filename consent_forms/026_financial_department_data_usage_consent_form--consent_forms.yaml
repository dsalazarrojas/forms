inputSchema:
  type: object
  properties:
    title: Financial Department Data Usage Consent Form
    pages:
    - id: 1
      name: name
      label: What is your name?
      hint: Please enter your name.
      type: text
      options: []
      required: true
    - id: 2
      name: contact_number
      label: Contact Number
      hint: Please enter your contact number.
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email Address
      hint: Please enter your email address.
      type: email
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: Please enter your date of birth in DD/MM/YYYY format.
      type: date
      options: []
      required: false
    - id: 5
      name: reason
      label: Reason for Request
      hint: Please specify your reason for requesting your financial data.
      type: text
      options: []
      required: false
    - id: 6
      name: purpose
      label: Purpose
      hint: Please specify the purpose of accessing your financial data.
      type: text
      options: []
      required: false
    - id: 7
      name: affiliation_1
      label: Are you affiliated with any financial institution?
      hint: Please answer yes or no.
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: affiliation_2
      label: Do you have any other financial institution affiliations?
      hint: Please list all affiliations.
      type: select_multiple
      options:
      - Yes, I have multiple affiliations
      - No, I have no affiliations
      required: true
    - id: 9
      name: signature
      label: Signature
      hint: Please sign below to consent to the usage of your financial department
        data.
      type: note
      options: []
      required: true
