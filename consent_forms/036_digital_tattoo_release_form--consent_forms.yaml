      options: []
      required: false
    - id: 2
      name: consent_type
      label: Type of Digital Content
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 3
      name: likeness_description
      label: Description of Likeness Used
      hint: Briefly describe the image, likeness, or voice being used.
      type: text
      options: []
