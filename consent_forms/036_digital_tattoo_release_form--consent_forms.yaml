    - id: 4
      name: likeness_used
      label: Likeness Used
      hint: null
      type: select_one
      options:
      - Image1
      - Image2
      - Image3
      required: false
    - id: 5
      name: story_description
      label: Description of Story
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: story_used
      label: Story Used
      hint: null
      type: select_one
      options:
      - Story1
      - Story2
      - Story3
      required: false
    - id: 7
      name: voice_description
      label: Description of Voice
      hint: Briefly describe the voice being used.
      type: text
      options: []
      required: false
    - id: 8
      name: voice_used
      label: Voice Used
      hint: null
      type: select_one
      options:
      - Voice1
      - Voice2
      - Voice3
