inputSchema:
  type: object
  properties:
    title: VISAGE COVID 19 Liability Release Waiver
    pages:
    - id: 1
      name: general_informations
      label: General Informations
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: consent_1
      label: I have been exposed to COVID-19
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: consent_2
      label: I am currently positive for COVID-19
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: symptoms
      label: Do you have any of these symptoms?
      hint: null
      type: select_multiple
      options:
      - Fever
      - Cough
      - Fatigue
      - Headache
      required: false
    - id: 5
      name: exposure_date
      label: Exposure Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: contact_trace
      label: Contact Tracing
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: medical_condition
      label: Medical Condition
      hint: null
      type: select_one
      options:
      - None
      - Asthma
      - Heart Disease
      required: false
    - id: 8
      name: medical_condition_detail
      label: Detail
      hint: Please specify
      type: text
      options: []
      required: false
    - id: 9
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: consent_3
      label: I am consenting to participate in this study
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: consent_4
      label: I am consenting to share information with VISAGE
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
