inputSchema:
  type: object
  properties:
    title: Real Estate Flood Disclosure Form
    pages:
    - id: 1
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: buyer_or_tenant
      label: Is this a sale or rental?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 3
      name: property_identification
      label: Property Identification
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: flood_hazards
      label: Is the property in a flood hazard area?
      hint: null
      type: select_multiple
      options:
      - Option 5
      - Option 6
      required: false
    - id: 5
      name: property_features
      label: Please list the property features
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: additional_flood_hazards
      label: Are there any additional flood hazards?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: certification
      label: Certification
      hint: null
      type: select_one
      options:
      - Option 7
      - Option 8
      required: false
    - id: 8
      name: certification_acknowledgement
      label: Acknowledgement of Certification
      hint: null
      type: select_one
      options:
      - Option 9
      - Option 10
      required: false
    - id: 9
      name: flood_risk
      label: Flood Risk
      hint: null
      type: select_one
      options:
      - Option 11
      - Option 12
      required: false
