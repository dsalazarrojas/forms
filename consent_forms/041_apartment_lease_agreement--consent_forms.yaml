inputSchema:
  type: object
  properties:
    title: Apartment Lease Agreement
    pages:
    - id: 1
      name: agreement_date
      label: Agreement Date
      hint: Date of lease agreement
      type: date
      options: []
      required: true
    - id: 2
      name: landlord_name
      label: Landlord Full Name
      hint: Property owner name
      type: text
      options: []
      required: true
    - id: 3
      name: landlord_email
      label: Landlord Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: landlord_phone
      label: Landlord Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: landlord_address
      label: Landlord Address
      hint: Mailing address
      type: text
      options: []
      required: true
    - id: 6
      name: tenant_name
      label: Tenant Full Name
      hint: Primary tenant name
      type: text
      options: []
      required: true
    - id: 7
      name: tenant_email
      label: Tenant Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 8
      name: tenant_phone
      label: Tenant Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 9
      name: additional_tenants
      label: Additional Tenants
      hint: Other occupants
      type: text
      options: []
      required: false
    - id: 10
      name: property_address
      label: Rental Property Address
      hint: Full address of apartment
      type: text
      options: []
      required: true
    - id: 11
      name: unit_number
      label: Unit Number
      hint: Apartment number
      type: text
      options: []
      required: true
    - id: 12
      name: property_description
      label: Property Description
      hint: Details about the unit
      type: text
      options: []
      required: true
    - id: 13
      name: lease_term_section
      label: -- Lease Terms --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: lease_start_date
      label: Lease Start Date
      hint: When does lease begin
      type: date
      options: []
      required: true
    - id: 15
      name: lease_end_date
      label: Lease End Date
      hint: When does lease end
      type: date
      options: []
      required: true
    - id: 16
      name: lease_type
      label: Lease Type
      hint: Type of lease agreement
      type: select_one
      options:
      - Fixed term
      - Month-to-month
      - Year-to-year
      - Other
      required: true
    - id: 17
      name: renewal_terms
      label: Renewal Terms
      hint: How can lease be renewed
      type: text
      options: []
      required: true
    - id: 18
      name: payment_section
      label: -- Payment Terms --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: monthly_rent
      label: Monthly Rent Amount
      hint: Base rent per month
      type: number
      options: []
      required: true
    - id: 20
      name: rent_due_date
      label: Rent Due Date
      hint: Day of month rent is due
      type: number
      options: []
      required: true
    - id: 21
      name: security_deposit
      label: Security Deposit Amount
      hint: Refundable deposit
      type: number
      options: []
      required: true
    - id: 22
      name: pet_deposit
      label: Pet Deposit Amount
      hint: If applicable
      type: number
      options: []
      required: false
    - id: 23
      name: payment_method
      label: Accepted Payment Methods
      hint: How can rent be paid
      type: select_multiple
      options:
      - Check
      - Bank transfer
      - Credit card
      - Debit card
      - Online payment portal
      - Cash
      - Other
      required: true
    - id: 24
      name: late_fee
      label: Late Fee Amount
      hint: Fee for late payment
      type: number
      options: []
      required: true
    - id: 25
      name: grace_period
      label: Grace Period
      hint: Days before late fee applies
      type: number
      options: []
      required: true
