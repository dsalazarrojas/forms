      name: utilities_section
      label: -- Utilities --
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: utilities_included
      label: Utilities Included
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - Water
      - Sewer
      - Trash
      - Electricity
      - Gas
      - Internet
      - Cable
      required: true
    - id: 28
      name: tenant_responsible_utilities
      label: Tenant Responsible For
      hint: Utilities tenant pays
      type: text
      options: []
      required: true
    - id: 29
      name: occupancy_section
      label: -- Occupancy --
      hint: null
      type: note
      options: []
      required: false
    - id: 30
      name: maximum_occupants
      label: Maximum Occupants
      hint: Maximum number allowed
      type: number
      options: []
      required: true
    - id: 31
      name: pets_allowed
      label: Are pets allowed
      hint: Pet policy
      type: select_one
      options:
      - Yes, all pets
      - Yes, with restrictions
      - Cats only
      - Dogs only
      - No pets
      required: true
    - id: 32
      name: pet_policy_details
      label: Pet Policy Details
      hint: Restrictions and rules
      type: text
      options: []
      required: false
    - id: 33
      name: smoking_allowed
      label: Is smoking allowed
      hint: Smoking policy
      type: select_one
      options:
      - true
      - false
      - Outside only
      required: true
    - id: 34
      name: subletting_allowed
      label: Is subletting allowed
      hint: Sublease policy
      type: select_one
      options:
      - Yes, with permission
      - Yes, without permission
      - false
      required: true
    - id: 35
      name: maintenance_section
      label: -- Maintenance --
      hint: null
      type: note
      options: []
      required: false
    - id: 36
      name: maintenance_request_procedure
      label: Maintenance Request Procedure
      hint: How to request repairs
      type: text
      options: []
      required: true
    - id: 37
      name: emergency_contact
      label: Emergency Contact Number
      hint: For urgent repairs
      type: text
      options: []
      required: true
    - id: 38
      name: tenant_responsibilities
      label: Tenant Maintenance Responsibilities
      hint: What tenant maintains
      type: text
      options: []
      required: true
    - id: 39
      name: landlord_responsibilities
      label: Landlord Maintenance Responsibilities
      hint: What landlord maintains
      type: text
      options: []
      required: true
    - id: 40
      name: entry_section
      label: -- Landlord Entry --
      hint: null
      type: note
      options: []
      required: false
    - id: 41
      name: entry_notice_required
      label: Notice Required for Entry
      hint: Hours of notice
      type: number
      options: []
      required: true
    - id: 42
      name: entry_conditions
      label: Conditions for Entry
      hint: When landlord can enter
      type: text
      options: []
      required: true
    - id: 43
      name: termination_section
      label: -- Termination --
      hint: null
      type: note
      options: []
      required: false
    - id: 44
      name: early_termination_allowed
      label: Is early termination allowed
      hint: Breaking lease
      type: select_one
      options:
      - Yes, with penalty
      - Yes, without penalty
      - false
      - Case by case
      required: true
    - id: 45
      name: early_termination_fee
      label: Early Termination Fee
      hint: If applicable
      type: number
      options: []
      required: false
    - id: 46
      name: notice_to_vacate
      label: Notice to Vacate Required
      hint: Days of notice
      type: number
      options: []
      required: true
    - id: 47
      name: additional_terms
      label: Additional Terms and Conditions
      hint: Any other agreements
      type: text
      options: []
      required: false
    - id: 48
      name: landlord_signature
      label: Landlord Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 49
      name: landlord_signature_date
      label: Landlord Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
    - id: 50
      name: tenant_signature
      label: Tenant Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 51
      name: tenant_signature_date
      label: Tenant Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
    - id: 52
      name: witness_name
      label: Witness Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 53
      name: witness_signature
      label: Witness Signature
      hint: If applicable
      type: text
      options: []
      required: false
