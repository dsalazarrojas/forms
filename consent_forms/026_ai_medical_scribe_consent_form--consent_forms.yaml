inputSchema:
  type: object
  properties:
    title: AI Medical Scribe Consent Form
    pages:
    - id: 1
      name: patient_identifiers_header
      label: '--- Patient and Provider Details ---'
      hint: Please identify yourself and your healthcare provider.
      type: note
      options: []
      required: false
    - id: 2
      name: patient_full_name
      label: Patient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: patient_dob
      label: Patient Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: clinic_name
      label: Clinic / Hospital Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: attending_provider
      label: Attending Physician / Provider Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: scribe_disclosure_note
      label: '--- Disclosure: AI Medical Scribe Usage ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: how_it_works_desc
      label: What is an AI Medical Scribe?
      hint: Our clinic utilizes an Artificial Intelligence (AI) medical scribe to
        assist your doctor with clinical documentation. This technology records the
        audio of your visit and converts it into a structured medical note for your
        physician to review, edit, and finalize.
      type: note
      options: []
      required: false
    - id: 8
      name: recording_consent
      label: Consent to Audio Recording
      hint: I authorize the use of a secure recording device during my consultation
        for the purpose of generating clinical documentation via AI.
      type: select_one
      options:
      - I Consent to Audio Recording
      - I Do Not Consent (Opt-Out)
      required: true
    - id: 9
      name: human_review_ack
      label: Human Review Acknowledgment
      hint: I understand that all AI-generated notes are reviewed and verified by
        a human healthcare provider for accuracy.
      type: select_one
      options:
      - I understand
      - Other
      required: true
    - id: 10
      name: data_privacy_hipaa_ack
      label: Data Privacy & HIPAA Acknowledgment
      hint: All recordings are encrypted, processed in a HIPAA-compliant manner, and
        are typically deleted once the final medical note is verified.
      type: select_one
      options:
      - I understand the privacy terms
      - Other
      required: true
    - id: 11
      name: right_to_withdraw_consent
      label: Right to Withdraw Consent
      hint: I understand that I can ask to stop the recording at any time during my
        visit without affecting the quality of my care.
      type: select_one
      options:
      - I understand
      - Other
      required: true
    - id: 12
      name: summary_request
      label: Would you like a patient-friendly summary of today's visit notes (generated
        by AI)?
      hint: null
      type: select_one
      options:
      - Yes, please email it to me
      - No, thank you
      required: true
    - id: 13
      name: patient_email
      label: Patient Email Address
      hint: Required for a digital copy of this consent or a visit summary.
      type: email
      options: []
      required: false
    - id: 14
      name: signature_selection
      label: Digital Signature
      hint: By selecting 'I agree', you are electronically signing this consent form.
      type: select_one
      options:
      - I agree and provide my digital signature
      - Other
      required: true
    - id: 15
      name: signature_date
      label: Date of Signature
      hint: null
      type: date
      options: []
      required: true
    - id: 16
      name: legal_guardian_name
      label: Parent / Legal Guardian Name (if applicable)
      hint: Required if the patient is a minor or unable to provide consent.
      type: text
      options: []
      required: false
    - id: 17
      name: witness_name_internal
      label: 'Internal Use: Staff/Witness Name'
      hint: null
      type: text
      options: []
      required: false
