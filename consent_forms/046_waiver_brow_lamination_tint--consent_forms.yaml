inputSchema:
  type: object
  properties:
    title: waiver_brow_lamination_tint
    pages:
    - id: 1
      name: waiver_info
      label: Waiver Information
      hint: Please provide a clear and concise description of the procedure and its
        risks.
      type: text
      options: []
      required: true
    - id: 2
      name: procedure_description
      label: Procedure Description
      hint: Describe the purpose and scope of the Brow Lamination Tint procedure.
      type: text
      options: []
      required: true
    - id: 3
      name: risk_acknowledgement
      label: Risk Acknowledgement
      hint: I have read and understand the risks associated with the procedure.
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: assigned_tool
      label: Assigned Tool
      hint: Select the tool to be used for the procedure.
      type: select_one
      options:
      - Jimmy
      - Other
      required: true
    - id: 5
      name: output_file
      label: Output File
      hint: Specify the output file for the procedure.
      type: text
      options: []
      required: true
    - id: 6
      name: form_id
      label: Form ID
      hint: Enter a unique ID for the form.
      type: number
      options: []
      required: true
    - id: 7
      name: procedure_category
      label: Category
      hint: Select the category for the procedure.
      type: select_one
      options:
      - Consent Forms
      - Other
      required: true
    - id: 8
      name: description
      label: Description
      hint: Provide a brief description of the procedure.
      type: text
      options: []
      required: true
