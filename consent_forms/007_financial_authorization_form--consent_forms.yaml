inputSchema:
  type: object
  properties:
    title: Financial Authorization Form
    pages:
    - id: 1
      name: user_input
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: transaction_type
      label: What is the type of transaction?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 3
      name: transaction_amount
      label: What is the transaction amount?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: financial_institution
      label: What is the financial institution involved?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 5
      name: user_consent
      label: Do you consent to this transaction?
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 6
      name: date
      label: Date of transaction
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time
      label: Time of transaction
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: note
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email address
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: financial_institution_2
      label: Second Financial Institution
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 12
      name: user_consent_2
      label: Second User Consent
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: false
    - id: 13
      name: date_2
      label: Second Date
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: time_2
      label: Second Time
      hint: null
      type: time
      options: []
      required: false
    - id: 15
      name: note_2
      label: Additional Comments 2
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: email_2
      label: Second Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 17
      name: phone_2
      label: Second Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: user_input_2
      label: Second User Input
      hint: null
      type: text
      options: []
      required: false
