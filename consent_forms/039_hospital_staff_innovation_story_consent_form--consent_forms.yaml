inputSchema:
  type: object
  properties:
    title: Hospital Staff Innovation Story Consent Form
    pages:
    - id: 1
      name: staff_innovation_story_consent_form_1
      label: Staff Title
      hint: null
      type: select_one
      options:
      - Manager/Director
      - Clinical Specialist
      - Nurse
      - Doctor
      - Other (please specify)
      required: true
    - id: 2
      name: innovation_story_title
      label: Innovation Story Title
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: consent_to_share
      label: Consent to Share
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: innovation_story_description
      label: Innovation Story
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: more_about_story
      label: More about the Story
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: staff_contact_info
      label: Staff Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: email_address
      label: Email Address
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: phone_number
      label: Phone Number
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: innovation_story_consent_notes
      label: Consented Notes
      hint: null
      type: checkbox
      options:
      - I consent to share my story with the hospital management
      - I do not consent to share my story
      required: true
    - id: 10
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
