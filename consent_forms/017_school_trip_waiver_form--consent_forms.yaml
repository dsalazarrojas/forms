inputSchema:
  type: object
  properties:
    title: School Trip Waiver Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: parent_name
      label: Parent Name
      hint: Name of parent/guardian
      type: text
      options: []
      required: true
    - id: 3
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: emergency_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: emergency_address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: trip_details
      label: Trip Details
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: date_trip
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: time_trip
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: destination_trip
      label: Destination
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: student_grade
      label: Student Grade
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: student_attendance
      label: Student Attendance
      hint: null
      type: select_one
      options:
      - '6'
      - '9'
      - '10'
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      - '7'
      - '8'
      required: true
    - id: 14
      name: student_attendance_comment
      label: Student Attendance Comment
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: waiver_agreement
      label: Waiver Agreement
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: sign_officer
      label: Sign Officer
      hint: null
      type: select_multiple
      options:
      - Principal
      - Assistant Principal
      - Counselor
      - Teacher
      required: true
