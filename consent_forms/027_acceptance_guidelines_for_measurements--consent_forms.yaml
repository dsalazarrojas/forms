inputSchema:
  type: object
  properties:
    title: Acceptance Guidelines For Measurements
    pages:
    - id: 1
      name: section_employee_id
      label: -- Employee Identification --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Full Name of Employee
      hint: As it appears on your ID badge
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee Identification Number
      hint: unique corporate ID
      type: text
      options: []
      required: true
    - id: 4
      name: department_name
      label: Department Name
      hint: e.g. Quality Control, Engineering
      type: text
      options: []
      required: true
    - id: 5
      name: section_review
      label: -- Guideline Review --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: procedure_manual_read
      label: I have read the Measurement Procedure Manual v2.0
      hint: Required for compliance
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: procedures_understood
      label: Select procedures you have been trained on
      hint: Check all that apply
      type: select_multiple
      options:
      - Calibrating Instruments
      - Data Entry Accuracy
      - Safety Protocols
      - Reporting Anomalies
      required: true
    - id: 8
      name: section_consistency
      label: -- Measurement Consistency --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: equipment_check_frequency
      label: How often do you perform equipment calibration?
      hint: select most frequent
      type: select_one
      options:
      - Before every use
      - Daily
      - Weekly
      - Monthly
      required: true
    - id: 10
      name: data_verification_acknowledgement
      label: I acknowledge that all measurement data must be verified by a supervisor
      hint: part of the QA process
      type: select_one
      options:
      - I Acknowledge
      - Other
      required: true
    - id: 11
      name: section_safety
      label: -- Safety and Compliance --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: ppe_compliance
      label: I agree to wear all required PPE during measurement tasks
      hint: Personal Protective Equipment
      type: select_one
      options:
      - I Agree
      - Other
      required: true
    - id: 13
      name: reporting_responsibility
      label: I understand my responsibility to report defective instruments immediately
      hint: instrumental safety
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 14
      name: section_final
      label: -- Final Attestation --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: full_compliance_pledge
      label: I pledge to adhere to all measurement guidelines for consistent data
        collection
      hint: Final commitment
      type: select_one
      options:
      - I Pledge
      - Other
      required: true
    - id: 16
      name: employee_signature
      label: Electronic Signature
      hint: Type full legal name
      type: text
      options: []
      required: true
    - id: 17
      name: acknowledgment_date
      label: Date of Acknowledgment
      hint: Today's date
      type: date
      options: []
      required: true
