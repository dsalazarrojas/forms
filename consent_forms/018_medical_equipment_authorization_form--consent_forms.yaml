inputSchema:
  type: object
  properties:
    title: medical_equipment_authorization_form
    pages:
    - id: 1
      name: medical_equipment_type
      label: Medical Equipment Type
      hint: null
      type: select_one
      options:
      - Cardiac
      - Respiratory
      - General
      - Monitoring
      - Other
      required: true
    - id: 2
      name: name_of_medical_equipment
      label: Name of Medical Equipment
      hint: Equipment name
      type: text
      options: []
      required: true
    - id: 3
      name: equipment_description
      label: Description
      hint: Briefly describe the equipment
      type: text
      options: []
      required: true
    - id: 4
      name: usage_location
      label: Location of Equipment
      hint: Location where equipment will be used
      type: text
      options: []
      required: true
    - id: 5
      name: usage_frequency
      label: Usage Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Less than 1 time a week
      - Less than 1 time a month
      required: true
    - id: 6
      name: medical_staff_involvement
      label: Medical Staff Involvement
      hint: null
      type: select_multiple
      options:
      - Doctor
      - Nurse
      - Both
      required: true
    - id: 7
      name: usage_start_date
      label: Usage Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: usage_end_date
      label: Usage End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: signature
      label: Signature
      hint: Authorized person's signature
      type: text
      options: []
      required: true
    - id: 10
      name: authorized_person
      label: Authorized Person
      hint: null
      type: select_one
      options:
      - Authorized Person 1
      - Authorized Person 2
      - Authorized Person 3
      required: true
    - id: 11
      name: comments
      label: Comments
      hint: Additional comments
      type: text
      options: []
      required: false
