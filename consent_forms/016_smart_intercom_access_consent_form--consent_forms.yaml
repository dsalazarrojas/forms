inputSchema:
  type: object
  properties:
    title: Smart Intercom Access Consent Form
    pages:
    - id: 1
      name: resident_permission
      label: Resident Permission
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: contact_details
      label: Contact Details
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: contact_name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: contact_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: contact_notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
