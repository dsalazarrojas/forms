inputSchema:
  type: object
  properties:
    title: Brow Wax Correction Consent Form
    pages:
    - id: 1
      name: client_full_name
      label: Client Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: client_date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: appointment_date
      label: Appointment Date for Correction
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: previous_wax_date
      label: Date of Previous Waxing
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: correction_reason
      label: Reason for Correction
      hint: What is not working with current shape
      type: text
      options: []
      required: true
    - id: 8
      name: skin_type
      label: Skin Type
      hint: null
      type: select_one
      options:
      - Oily
      - Dry
      - Combination
      - Sensitive
      - Normal
      required: true
    - id: 9
      name: skin_conditions
      label: Current skin conditions
      hint: Rash, acne, sunburn, wounds, etc
      type: text
      options: []
      required: false
    - id: 10
      name: product_allergies
      label: Known product or wax allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: wax_sensitivity
      label: Sensitivity to waxing products
      hint: Prior reactions to wax
      type: text
      options: []
      required: false
    - id: 12
      name: medications
      label: Any medications affecting skin
      hint: Blood thinners, antibiotics, retinoids, etc
      type: text
      options: []
      required: false
    - id: 13
      name: recent_procedures
      label: Recent facial treatments or procedures
      hint: Last 2 weeks
      type: text
      options: []
      required: false
    - id: 14
      name: pregnancy
      label: Are you currently pregnant or nursing
      hint: null
      type: select_one
      options:
      - Yes, pregnant
      - Yes, nursing
      - 'False'
      required: true
    - id: 15
      name: desired_shape
      label: Your desired brow shape
      hint: Describe the shape you want
      type: text
      options: []
      required: false
    - id: 16
      name: pain_sensitivity
      label: Pain Sensitivity Level
      hint: How do you typically respond to discomfort
      type: select_one
      options:
      - Low
      - Normal
      - High
      required: true
    - id: 17
      name: risks_explained
      label: Risks and benefits have been explained
      hint: null
      type: select_one
      options:
      - Yes, I understand
      - I have questions
      required: true
    - id: 18
      name: consent_given
      label: I consent to the brow wax correction
      hint: null
      type: select_one
      options:
      - Yes, I consent
      - 'False'
      required: true
    - id: 19
      name: signature_date
      label: Date of Consent
      hint: null
      type: date
      options: []
      required: true
