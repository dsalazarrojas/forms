inputSchema:
  type: object
  properties:
    title: Zipline Activity Liability Waiver Form
    pages:
    - id: 1
      name: participant_details
      label: Participant Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: waiver_acceptance
      label: Waiver Acceptance
      hint: Check if participant has read and accepted the waiver
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: activity_type
      label: Activity Type
      hint: null
      type: select_one
      options:
      - Activity
      - Tour
      required: false
    - id: 7
      name: waiver_version
      label: Waiver Version
      hint: null
      type: select_one
      options:
      - V1
      - V2
      required: false
