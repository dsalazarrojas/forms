inputSchema:
  type: object
  properties:
    title: Career Counseling Consent Form
    pages:
      - id: 1
        name: consent_header
        label: -- Consent Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: client_name
        label: Client name
        hint: Full name of client
        type: text
        options: []
        required: true
      - id: 3
        name: counselor_name
        label: Counselor name
        hint: Name of assigned counselor
        type: text
        options: []
        required: false
      - id: 4
        name: services_description
        label: Services description
        hint: Overview of counseling services
        type: text
        options: []
        required: true
      - id: 5
        name: confidentiality_explanation
        label: Confidentiality explanation
        hint: Summary of confidentiality limits
        type: note
        options: []
        required: false
      - id: 6
        name: consent_for_service
        label: Consent for service
        hint: Client agreement to counseling
        type: select_one
        options:
          - I consent
          - I do not consent
        required: true
      - id: 7
        name: consent_for_recording
        label: Consent for session recording
        hint: Permission to record sessions
        type: select_one
        options:
          - Yes
          - No
        required: false
      - id: 8
        name: emergency_contact
        label: Emergency contact
        hint: Name and phone
        type: text
        options: []
        required: false
      - id: 9
        name: signature
        label: Signature printed name
        hint: Typed name serves as signature
        type: text
        options: []
        required: true
      - id: 10
        name: date_signed
        label: Date signed
        hint: Consent date
        type: date
        options: []
        required: true
