inputSchema:
  type: object
  properties:
    title: Travel Permission For Minors Form
    pages:
    - id: 1
      name: parent_info
      label: Parent Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: travel_info
      label: Travel Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: trip_details
      label: Trip Details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: travel_date
      label: Travel Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: travel_time
      label: Travel Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: return_date
      label: Return Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: travel_agency
      label: Travel Agency
      hint: null
      type: select_one
      options:
      - American Airlines
      - Delta Air
      - United
      - Frontier Airlines
      - Southwest
      required: true
    - id: 8
      name: parent_contact
      label: Parent Contact
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Address
      required: true
    - id: 9
      name: other_travel_agency
      label: Other Travel Agency
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: trip_duration
      label: Trip Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: trip_cost
      label: Trip Cost
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: parent_signature
      label: Parent Signature
      hint: null
      type: note
      options: []
      required: true
