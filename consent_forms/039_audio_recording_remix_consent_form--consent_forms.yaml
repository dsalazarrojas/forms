        label: Original Artist Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: remixer_name
        label: Remixer Full Name or Alias
        hint: null
        type: text
        options: []
        required: true
      - id: 4
        name: contact_email
        label: Contact Email
        hint: null
        type: email
        options: []
        required: true
      - id: 5
        name: section_work
        label: -- Original Work Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 6
        name: original_track_title
        label: Title of the Original Work
        hint: null
        type: text
        options: []
        required: true
      - id: 7
        name: original_release_date
        label: Original Release Date
        hint: null
        type: date
        options: []
        required: false
