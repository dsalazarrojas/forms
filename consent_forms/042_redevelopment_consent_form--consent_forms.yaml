inputSchema:
  type: object
  properties:
    title: Redevelopment Consent Form
    pages:
    - id: 1
      name: owner_contact_info
      label: Owner Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: project_details
      label: Project Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: owner_approval
      label: Owner Approval
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: project_manager
      label: Project Manager
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: property_address
      label: Property Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: project_start_date
      label: Project Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: project_end_date
      label: Project End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: project_status
      label: Project Status
      hint: null
      type: select_multiple
      options:
      - Active
      - On-Hold
      - Completed
      - Cancelled
      required: true
    - id: 9
      name: project_notes
      label: Project Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: owner_signature
      label: Owner Signature
      hint: null
      type: text
      options: []
      required: true
