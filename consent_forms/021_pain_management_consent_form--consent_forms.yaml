inputSchema:
  type: object
  properties:
    title: pain_management_consent_form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: patient_address
      label: Patient Address
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: doctor_name
      label: Doctor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: treatment_options
      label: Pain Management Treatment Options
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: risks_benefits
      label: Risks and Benefits
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: informed_consent
      label: Informed Consent
      hint: null
      type: select_one
      options:
      - I have read and understand the form
      - I have not read and do not understand the form
      required: true
    - id: 8
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
