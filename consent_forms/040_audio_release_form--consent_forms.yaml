inputSchema:
  type: object
  properties:
    title: Audio Release Form
    pages:
    - id: 1
      name: section_creator
      label: -- Creator and Assignee Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: creator_name
      label: Creator Full Name
      hint: Composer, Songwriter, or Performer
      type: text
      options: []
      required: true
    - id: 3
      name: assignee_name
      label: Assignee Name (The Recipient)
      hint: Production Company or Label
      type: text
      options: []
      required: true
    - id: 4
      name: section_work_details
      label: -- Audio Work Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: audio_title
      label: Title of the Audio Work
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: audio_duration
      label: Duration/Length
      hint: e.g., 3m 45s
      type: text
      options: []
      required: true
    - id: 7
      name: work_type
      label: Type of Audio Work
      hint: null
      type: select_one
      options:
      - Musical Composition
      - Sound Effect (SFX)
      - Ambient/Background Loop
      - Spoken Word/Narration
      - Full Produced Song
      required: true
    - id: 8
      name: section_transfer_rights
      label: -- Transfer of Rights --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: rights_transfer_type
      label: Type of Rights Transfer
      hint: null
      type: select_one
      options:
      - Full Assignment (Ownership Transfer)
      - Exclusive License (Limited Term)
      - Non-Exclusive License (Royalty Free)
      - Public Domain Dedication
      required: true
    - id: 10
      name: territory_scope
      label: Usage Territory Scope
      hint: null
      type: select_one
      options:
      - Worldwide/Universe
      - Single Country
      - Digital/Internet only
      required: true
    - id: 11
      name: consideration_amount
      label: Consideration Paid (Amount)
      hint: Total fee for this release
      type: number
      options: []
      required: true
    - id: 12
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Paid in Full
      - Pending (Pay on receipt)
      - No fee (Gratis)
      required: true
    - id: 13
      name: section_warranties
      label: -- Warranties --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: original_work_warranty
      label: I warrant that this is an original work and I have full rights
      hint: null
      type: select_one
      options:
      - I Warrant
      - Other
      required: true
    - id: 15
      name: creator_signature
      label: Creator Digital Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: release_date
      label: Date of Release
      hint: null
      type: date
      options: []
      required: true
    - id: 17
      name: contact_email
      label: Creator Email Address
      hint: null
      type: email
      options: []
      required: true
