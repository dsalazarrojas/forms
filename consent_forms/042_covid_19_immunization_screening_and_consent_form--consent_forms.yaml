      name: consent_to_vaccinate
      label: I consent to receive the COVID-19 vaccine
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 25
      name: consent_signature_date
      label: Date of Consent
      hint: null
      type: date
      options: []
      required: true
