      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 13
      name: medication_list
      label: List of Medications
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: immunocompromised
      label: Immunocompromised or Weakened Immune System
      hint: null
      type: select_one
      options:
      - 'Yes'
