inputSchema:
  type: object
  properties:
    title: Activity Trip Permission Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: Full name of the participant going on the trip
      type: text
      options: []
      required: true
    - id: 2
      name: participant_date_of_birth
      label: Participant Date of Birth
      hint: Date of birth of the participant
      type: date
      options: []
      required: true
    - id: 3
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Full name of the parent or guardian providing consent
      type: text
      options: []
      required: true
    - id: 4
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Phone number of the parent or guardian
      type: text
      options: []
      required: true
    - id: 5
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: Email address of the parent or guardian
      type: email
      options: []
      required: true
    - id: 6
      name: trip_destination
      label: Trip Destination
      hint: Where is the trip going
      type: text
      options: []
      required: true
    - id: 7
      name: trip_dates
      label: Trip Dates
      hint: Start and end dates of the trip
      type: text
      options: []
      required: true
    - id: 8
      name: trip_purpose
      label: Purpose of Trip
      hint: What is the purpose of this trip
      type: text
      options: []
      required: true
    - id: 9
      name: medical_conditions
      label: Medical Conditions
      hint: Does the participant have any medical conditions
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: medical_conditions_details
      label: Details of Medical Conditions
      hint: If yes, please provide details of any medical conditions
      type: text
      options: []
      required: false
    - id: 11
      name: medication_list
      label: Current Medications
      hint: List any medications the participant is currently taking
      type: text
      options: []
      required: false
    - id: 12
      name: permission_granted
      label: Permission Granted
      hint: Do you grant permission for the participant to attend this trip
      type: select_one
      options:
      - Yes, I grant permission
      - No, I do not grant permission
      required: true
    - id: 13
      name: signature_date
      label: Signature Date
      hint: Date of consent and signature
      type: date
      options: []
      required: true
