inputSchema:
  type: object
  properties:
    title: Pet Vaccination Consent Form
    pages:
    - id: 1
      name: pet_vaccination_benefits
      label: Pet Vaccination Benefits
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: pet_vaccination_risks
      label: Pet Vaccination Risks
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: consent_to_vaccination
      label: Consent to Vaccination
