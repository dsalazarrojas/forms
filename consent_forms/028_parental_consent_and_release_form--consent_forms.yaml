inputSchema:
  type: object
  properties:
    title: Parental Consent And Release Form
    pages:
    - id: 1
      name: child_participation
      label: Child Participation
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: program_participation
      label: Program Participation
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_info
      label: Contact Info
      hint: null
      type: select_multiple
      options:
      - Mom or Dad
      - Child
      - Other
      required: false
    - id: 4
      name: guardian_permission
      label: Guardian Permission
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: signature
      label: Parent/Guardian Signature
      hint: null
      type: text
      options: []
      required: false
