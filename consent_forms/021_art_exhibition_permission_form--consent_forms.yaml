inputSchema:
  type: object
  properties:
    title: Art Exhibition Permission Form
    pages:
    - id: 1
      name: artist_details_header
      label: -- Artist Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: artist_full_name
      label: Artist Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: artist_professional_name
      label: Professional Name (If different)
      hint: e.g., Pen name or artistic alias
      type: text
      options: []
      required: false
    - id: 4
      name: artist_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: artist_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: artwork_info_header
      label: -- Artwork Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: title_of_work
      label: Title of the Artwork
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: medium_of_artwork
      label: Medium (Materials used)
      hint: e.g., Oil on canvas, Digital print, Bronze sculpture
      type: text
      options: []
      required: true
    - id: 9
      name: dimensions_of_work
      label: Dimensions (H x W x D)
      hint: Include units (cm or inches)
      type: text
      options: []
      required: true
    - id: 10
      name: weight_of_work
      label: Approximate Weight (for sculptures/installations)
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: year_of_creation
      label: Year of Creation
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: permissions_and_rights_header
      label: -- Permissions and Rights --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: display_permission
      label: I grant permission for the gallery to display my artwork for the duration
        of the exhibition
      hint: null
      type: select_one
      options:
      - Yes - I Grant Permission
      - No - I Decline
      required: true
    - id: 14
      name: photography_permission
      label: Permission for visitors to photograph the artwork
      hint: null
      type: select_one
      options:
      - Allowed for personal use only
      - Allowed for any use
      - Strictly prohibited
      required: true
    - id: 15
      name: marketing_reproduction_rights
      label: Permission for the gallery to use images of the artwork for marketing
        and promotion
      hint: Includes social media, catalogs, and website
      type: select_one
      options:
      - true
      - Yes - with attribution only
      - false
      required: true
    - id: 16
      name: sales_permission
      label: Is this artwork available for sale during the exhibition?
      hint: null
      type: select_one
      options:
      - true
      - No - NFS (Not For Sale)
      required: true
    - id: 17
      name: asking_price
      label: Asking Price (Including gallery commission)
      hint: If for sale, specify currency
      type: text
      options: []
      required: false
    - id: 18
      name: insurance_value
      label: Insurance Valuation
      hint: Mandatory for all displayed works
      type: number
      options: []
      required: true
    - id: 19
      name: declaration_and_signature_header
      label: -- Declaration --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: artist_declaration
      label: I certify that I am the sole creator and copyright owner of the artwork
        submitted
      hint: null
      type: select_one
      options:
      - I Confirm
      - Other
      required: true
    - id: 21
      name: signature_date
      label: Date of Signature
      hint: null
      type: date
      options: []
      required: true
    - id: 22
      name: digital_signature_name
      label: Artist Digital Signature (Full Name)
      hint: null
      type: text
      options: []
      required: true
