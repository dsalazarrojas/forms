inputSchema:
  type: object
  properties:
    title: Climbing Gym Wall Use Permission Form
    pages:
    - id: 1
      name: participant_section
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: emergency_section
      label: -- Emergency Contact --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: emergency_contact
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: emergency_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: emergency_relationship
      label: Relationship to Participant
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: health_section
      label: -- Health Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: medical_conditions
      label: Any medical conditions or allergies?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: medications
      label: Currently taking medications?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 14
      name: medication_details
      label: If yes, please describe
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: physical_activity
      label: Any restrictions on physical activity?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: injuries_section
      label: -- Recent Injuries --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: recent_injuries
      label: Any recent injuries or ongoing treatment?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 18
      name: injury_details
      label: If yes, describe the injury
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: acknowledgement_section
      label: -- Acknowledgement and Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: risk_acknowledgement
      label: I understand the risks involved in climbing activities
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 21
      name: safety_rules
      label: I will follow all facility safety rules and instructions
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 22
      name: equipment_inspection
      label: I will inspect and properly use all safety equipment
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 23
      name: liability_waiver
      label: I release the facility from liability for injuries sustained
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 24
      name: parent_consent
      label: Parent/Guardian consent (for minors)
      hint: Parent must provide written consent
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not applicable
      required: true
