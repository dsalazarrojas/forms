inputSchema:
  type: object
  properties:
    title: Academic Records Authorization Form
    pages:
    - id: 1
      name: form_header
      label: -- Academic Records Authorization Form --
      hint: Authorize the release of your academic records by completing this form.
        All fields marked as required must be filled.
      type: note
      options: []
      required: false
    - id: 2
      name: student_full_name
      label: Student full legal name
      hint: As it appears on official records
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: student_id
      label: Student ID number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: student_email
      label: Student email address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: student_phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: mailing_address
      label: Current mailing address
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: records_section
      label: -- Records to Be Released --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: records_to_release
      label: Which academic records do you authorize for release (select all that
        apply)
      hint: null
      type: select_multiple
      options:
      - Official transcripts
      - Enrollment verification
      - Degree verification
      - Grade reports
      - Disciplinary records
      - Financial aid records
      required: true
    - id: 10
      name: release_recipient_name
      label: Name of person or organization receiving the records
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: release_recipient_address
      label: Address or email of the recipient
      hint: Where should the records be sent
      type: text
      options: []
      required: true
    - id: 12
      name: purpose_of_release
      label: Purpose of the records release
      hint: null
      type: select_one
      options:
      - Employment verification
      - Graduate school application
      - Transfer to another institution
      - Scholarship application
      - Personal records
      - Other
      required: true
    - id: 13
      name: authorization_duration
      label: How long should this authorization remain valid
      hint: null
      type: select_one
      options:
      - One-time release only
      - 30 days
      - 6 months
      - 1 year
      - Until revoked in writing
      required: true
    - id: 14
      name: ferpa_acknowledgment
      label: I understand my rights under FERPA and voluntarily authorize the release
        of the records indicated above
      hint: Family Educational Rights and Privacy Act
      type: select_one
      options:
      - Yes - I understand and authorize
      - No - I do not authorize
      required: true
    - id: 15
      name: signature_date
      label: Date of authorization
      hint: null
      type: date
      options: []
      required: true
    - id: 16
      name: additional_instructions
      label: Any additional instructions for the records office
      hint: null
      type: text
      options: []
      required: false
