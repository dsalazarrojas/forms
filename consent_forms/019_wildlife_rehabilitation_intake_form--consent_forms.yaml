inputSchema:
  type: object
  properties:
    title: wildlife_rehabilitation_intake_form
    pages:
    - id: 1
      name: patient_information
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: species
      label: Species
      hint: null
      type: select_one
      options:
      - Mammal
      - Bird
      - Reptile
      required: false
    - id: 3
      name: injury_description
      label: Injury Description
      hint: Briefly describe the injury or condition of the patient
      type: text
      options: []
      required: false
    - id: 4
      name: treatment_goal
      label: Treatment Goal
      hint: null
      type: select_one
      options:
      - Rehabilitation
      - Release
      - Other
      required: false
    - id: 5
      name: release_plan
      label: Release Plan
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: veterinary_services
      label: Veterinary Services
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: medical_history
      label: Medical History
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Unknown
      required: false
    - id: 8
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: contact_email
      label: Contact EMail
      hint: null
      type: email
      options: []
      required: false
