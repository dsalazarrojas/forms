inputSchema:
  type: object
  properties:
    title: Immunization Records Release Form
    pages:
    - id: 1
      name: patient_info
      label: Patient Info
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_relationship
      label: Contact Relationship
      hint: null
      type: select_one
      options:
      - parent
      - guardian
      - other
      required: false
    - id: 4
      name: immunization_records
      label: Immunization Records
      hint: null
      type: select_multiple
      options:
      - DTaP
      - MMR
      - PCV
      - Rota
      - Hib
      required: false
    - id: 5
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - pending
      required: false
    - id: 6
      name: school_info
      label: School Info
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: healthcare_provider
      label: Healthcare Provider
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: school_release_form
      label: School Release Form
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - pending
      required: false
