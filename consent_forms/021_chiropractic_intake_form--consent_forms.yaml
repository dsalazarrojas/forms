inputSchema:
  type: object
  properties:
    title: Chiropractic Intake Form
    pages:
    - id: 1
      name: patient_information
      label: Patient Information
      hint: Basic patient details
      type: note
      options: []
      required: false
    - id: 2
      name: patient_first_name
      label: Patient First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: patient_last_name
      label: Patient Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      - Other
      required: true
    - id: 7
      name: marital_status
      label: Marital Status
      hint: null
      type: select_one
      options:
      - Single
      - Married
      - Divorced
      - Widowed
      - Separated
      - Domestic partnership
      required: false
    - id: 8
      name: occupation
      label: Current Occupation
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: employer
      label: Employer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: phone_home
      label: Home Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: phone_mobile
      label: Mobile Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 13
      name: address
      label: Home Address
      hint: Street, city, state, zip code
      type: text
      options: []
      required: true
    - id: 14
      name: emergency_contact
      label: Emergency Contact Information
      hint: Name and phone number
      type: text
      options: []
      required: true
    - id: 15
      name: how_did_you_hear
      label: How Did You Hear About Us
      hint: null
      type: select_one
      options:
      - Referral from patient
      - Physician referral
      - Internet search
      - Social media
      - Advertisement
      - Insurance directory
      - Walk by
      - Other
      required: false
    - id: 16
      name: referred_by
      label: Referred By
      hint: Name of person or doctor
      type: text
      options: []
      required: false
    - id: 17
      name: reason_for_visit
      label: Reason for Visit
      hint: Primary complaint
      type: note
      options: []
      required: false
    - id: 18
      name: primary_complaint
      label: What is your primary reason for seeking care
      hint: Describe your main concern
      type: text
      options: []
      required: true
    - id: 19
      name: pain_areas
      label: Areas of Pain or Discomfort
      hint: Select all that apply
      type: select_multiple
      options:
      - Neck
      - Upper back
      - Mid back
      - Lower back
      - Shoulder
      - Arm or hand
      - Hip
      - Leg or foot
      - Head
      - Multiple areas
      required: true
    - id: 20
      name: pain_intensity
      label: Pain Intensity
      hint: Scale 1-10
      type: number
      options: []
      required: true
    - id: 21
      name: pain_duration
      label: How long have you had this problem
      hint: null
      type: select_one
      options:
      - Less than 1 week
      - 1-4 weeks
      - 1-3 months
      - 3-6 months
      - 6 months to 1 year
      - More than 1 year
      required: true
    - id: 22
      name: pain_frequency
      label: How often do you experience symptoms
      hint: null
      type: select_one
      options:
      - Constant
      - Several times daily
      - Daily
      - Several times weekly
      - Weekly
      - Occasionally
      required: true
    - id: 23
      name: what_makes_worse
      label: What makes your condition worse
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: what_makes_better
      label: What makes your condition better
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: medical_history
      label: Medical History
      hint: Your health background
      type: note
      options: []
      required: false
    - id: 26
      name: current_medications
      label: Current Medications
      hint: List all medications and dosages
      type: text
      options: []
      required: false
    - id: 27
      name: allergies
      label: Allergies
      hint: Medications, foods, environmental
      type: text
      options: []
      required: false
    - id: 28
      name: medical_conditions
      label: Medical Conditions
      hint: Select all that apply
      type: select_multiple
      options:
      - High blood pressure
      - Heart disease
      - Diabetes
      - Arthritis
      - Osteoporosis
      - Cancer
      - Stroke or TIA
      - Blood clotting disorder
      - Autoimmune disease
      - Anxiety or depression
      - Chronic pain
      - Fibromyalgia
      - None
      required: true
    - id: 29
      name: previous_surgeries
      label: Previous Surgeries or Hospitalizations
      hint: List with dates
      type: text
      options: []
      required: false
    - id: 30
      name: family_medical_history
      label: Relevant Family Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 31
      name: lifestyle_health
      label: Lifestyle and Health Habits
      hint: Daily routines
      type: note
      options: []
      required: false
    - id: 32
      name: exercise_routine
      label: Exercise Routine
      hint: null
      type: select_one
      options:
      - Daily vigorous exercise
      - Daily moderate exercise
      - 3-5 times per week
      - 1-2 times per week
      - Rarely
      - Never
      required: true
    - id: 33
      name: diet_quality
      label: How would you describe your diet
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 34
      name: water_intake
      label: Daily Water Intake
      hint: Glasses per day
      type: number
      options: []
      required: false
    - id: 35
      name: sleep_quality
      label: Sleep Quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 36
      name: sleep_hours
      label: Average Hours of Sleep Per Night
      hint: null
      type: number
      options: []
      required: false
    - id: 37
      name: tobacco_use
      label: Do you use tobacco products
      hint: null
      type: select_one
      options:
      - Never
      - Former user
      - Current user
      required: true
    - id: 38
      name: alcohol_use
      label: Alcohol Consumption
      hint: null
      type: select_one
      options:
      - None
      - Occasional
      - Moderate
      - Regular
      required: true
    - id: 39
      name: caffeine_intake
      label: Caffeine Intake
      hint: Cups per day
      type: number
      options: []
      required: false
    - id: 40
      name: stress_level
      label: Current Stress Level
      hint: null
      type: select_one
      options:
      - Very low
      - Low
      - Moderate
      - High
      - Very high
      required: true
    - id: 41
      name: previous_chiropractic_care
      label: Previous Chiropractic Care
      hint: Past experience
      type: note
      options: []
      required: false
    - id: 42
      name: had_chiro_before
      label: Have you seen a chiropractor before
      hint: null
      type: select_one
      options:
      - Yes, regularly
      - Yes, a few times
      - Yes, once
      - No, never
      required: true
    - id: 43
      name: previous_chiro_experience
      label: How was your previous chiropractic experience
      hint: null
      type: select_one
      options:
      - Very positive
      - Positive
      - Neutral
      - Negative
      - Very negative
      - Not applicable
      required: false
    - id: 44
      name: other_healthcare_providers
      label: Other Healthcare Providers
      hint: Current or past treatment
      type: note
      options: []
      required: false
    - id: 45
      name: currently_seeing_doctor
      label: Are you currently seeing another healthcare provider
      hint: null
      type: select_one
      options:
      - Yes, medical doctor
      - Yes, specialist
      - Yes, physical therapist
      - Yes, other
      - false
      required: true
    - id: 46
      name: other_provider_name
      label: Provider Name and Specialty
      hint: If yes
      type: text
      options: []
      required: false
    - id: 47
      name: current_treatment
      label: Are you receiving treatment for this condition elsewhere
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 48
      name: consent_agreement
      label: Consent and Agreement
      hint: Your acknowledgment
      type: note
      options: []
      required: false
    - id: 49
      name: information_accurate
      label: I certify that the information provided is accurate
      hint: null
      type: select_one
      options:
      - Yes, I certify
      - false
      required: true
    - id: 50
      name: consent_treatment
      label: I consent to chiropractic examination and treatment
      hint: null
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 51
      name: patient_signature
      label: Patient Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 52
      name: signature_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
