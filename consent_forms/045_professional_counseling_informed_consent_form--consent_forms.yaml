inputSchema:
  type: object
  properties:
    title: Professional Counseling Informed Consent Form
    pages:
    - id: 1
      name: client_info
      label: Client Information
      hint: Please enter your personal details
      type: text
      options: []
      required: false
    - id: 2
      name: consent
      label: Consent
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: risks
      label: Risks Involved
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: limitations
      label: Limitations
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: services
      label: Services
      hint: Please select services
      type: select_multiple
      options:
      - Individual Counseling
      - Group Counseling
      - Other
      required: false
    - id: 6
      name: payment_terms
      label: Payment Terms
      hint: Please select payment terms
      type: select_multiple
      options:
      - Pre-Session Payment
      - Session-by-Session
      - Package Plan
      required: false
    - id: 7
      name: client_concerns
      label: Client Concerns
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: therapist_concerns
      label: Therapist Concerns
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: client_signature
      label: Client Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: therapist_signature
      label: Therapist Signature
      hint: null
      type: note
      options: []
      required: false
