inputSchema:
  type: object
  properties:
    title: Covid 19 Liability Acknowledgment Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: covid_risk_protocol
      label: Covid-19 Risk Protocols
      hint: Please select all applicable
      type: select_multiple
      options:
      - Wearing masks/face shields
      - Practicing social distancing
      - Regularly cleaning/disinfecting
      - Providing hand sanitizer
      - Temperature checks
      - Limiting capacity
      - Staggered shifts
      - Other (please specify)
      required: true
    - id: 6
      name: safety_protocol
      label: Safety Protocols
      hint: Please select all applicable
      type: select_multiple
      options:
      - Regularly disinfecting
      - Providing hand sanitizer
      - Temperature checks
      - Limiting capacity
      - Wearing masks/face shields
      - Providing PPE
      - Staggered shifts
      - Other (please specify)
      required: true
    - id: 7
      name: participant_declaration
      label: Participant Declaration
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: participant_signature
      label: Participant Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: date_signed
      label: Date Signed
      hint: null
      type: date
      options: []
      required: false
