inputSchema:
  type: object
  properties:
    title: Junior Team Tennis Medical Release And Consent Form
    pages:
    - id: 1
      name: personal_information
      label: Personal Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: medical_information
      label: Medical Information
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: medical_history_conditions
      label: Medical History - Conditions
      hint: null
      type: select_multiple
      options:
      - Acute injuries
      - Allergies
      - Arthritis
      - Asthma
      - Birth defects
      - Broken bones
      - Chronic illness
      - Concussion
      - Epilepsy
      - Head or face injury
      - Heart condition
      - High blood pressure
      - Infection
      - Migraines
      - Other (please specify)
      - Physical disability
      - Sleep disorders
      - Spinal cord injury
      - Spinal surgery
      - Vision problems
      required: false
    - id: 7
      name: medical_history_medications
      label: Medical History - Medications
      hint: null
      type: select_multiple
      options:
      - Antibiotics
      - Anti-inflammatory
      - Blood thinners
      - Cholesterol
      - Corticosteroid
      - Epilepsy medication
      - Insulin
      - Other (please specify)
      - Prescription
      - Steroid
      - Thyroid medication
      required: false
    - id: 8
      name: medical_history_surgery
      label: Medical History - Surgery
      hint: null
      type: select_multiple
      options:
      - Allergies
      - Anesthesia
      - Artificial joints
      - Back surgery
      - Brain surgery
      - Heart surgery
      - Knee replacement
      - Neurosurgery
      - Other (please specify)
      - Shoulder surgery
      - Tumor surgery
      required: false
    - id: 9
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: emergency_contact_relationship
      label: Relationship
      hint: null
      type: select_one
      options:
      - Parent
      - Guardian
      - Friend
      - Other (please specify)
      required: false
    - id: 13
      name: emergency_contact_phone_number
      label: Emergency Contact Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: emergency_contact_address
      label: Emergency Contact Address
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: emergency_contact_email
      label: Emergency Contact Email
      hint: null
      type: text
      options: []
      required: false
