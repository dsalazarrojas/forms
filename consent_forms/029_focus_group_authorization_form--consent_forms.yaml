inputSchema:
  type: object
  properties:
    title: Focus Group Authorization Form
    pages:
    - id: 1
      name: consent
      label: Participant Consent
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: participant_info
      label: Participant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: study_info
      label: Study Information
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: consent_details
      label: Consent Details
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: study_lead
      label: Study Lead
      hint: null
      type: select_one
      options:
      - Participant Lead
      - Researcher Lead
      - Project Lead
      - Other
      required: true
    - id: 6
      name: participant_comments
      label: Participant Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: study_lead_other
      label: Other Study Lead
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: participant_consent
      label: Participant Consent
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: participant_agreement
      label: Participant Agreement
      hint: null
      type: select_multiple
      options:
      - I understand and agree
      - I do not understand
      - Unsure
      required: true
    - id: 10
      name: participant_notes
      label: Participant Notes
      hint: null
      type: text
      options: []
      required: false
