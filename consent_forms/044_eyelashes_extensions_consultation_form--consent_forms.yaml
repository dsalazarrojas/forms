inputSchema:
  type: object
  properties:
    title: Eyelashes Extensions Consultation Form
    pages:
    - id: 1
      name: consent_form
      label: consent_form
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: client_info
      label: client_info
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: eyelashes_type
      label: lashes_type
      hint: null
      type: select_one
      options:
      - classic lash
      - cluster lash
      - hybrid lash
      - nano lash
      required: true
    - id: 4
      name: num_rows
      label: num_rows
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: num_lashes
      label: num_lashes
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: lash_technique
      label: lash_technique
      hint: null
      type: select_one
      options:
      - lash technique 1
      - lash technique 2
      - lash technique 3
      required: true
    - id: 7
      name: lash_technique_other
      label: lash_technique_other
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: consent_status
      label: consent_status
      hint: null
      type: select_one
      options:
      - consent pending
      - consent received
      required: true
    - id: 10
      name: follow_up_visit
      label: follow_up_visit
      hint: null
      type: date
      options: []
      required: true
