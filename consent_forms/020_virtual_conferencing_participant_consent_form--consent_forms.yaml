inputSchema:
  type: object
  properties:
    title: Virtual Conferencing Participant Consent Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: First name of the participant
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: Participant Email Address
      type: email
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Participant company name
      type: text
      options: []
      required: false
    - id: 5
      name: event_type
      label: Event Type
      hint: Type of the event
      type: select_one
      options:
      - Virtual Event
      - In-person Event
      - Other
      required: false
    - id: 6
      name: date_of_event
      label: Date of Event
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: time_of_event
      label: Time of Event
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: location_of_event
      label: Location of Event
      hint: Location of the event
      type: text
      options: []
      required: false
    - id: 9
      name: purpose_of_conference
      label: Purpose of Conference
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: participant_role
      label: Participant Role
      hint: null
      type: select_multiple
      options:
      - Host
      - Participant
      required: true
    - id: 11
      name: privacy_policy_url
      label: Privacy Policy URL
      hint: URL of the privacy policy
      type: text
      options: []
      required: true
    - id: 12
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 14
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: contact_organization
      label: Contact Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: consent_date
      label: Consent Date
      hint: null
      type: date
      options: []
      required: true
    - id: 17
      name: consent_time
      label: Consent Time
      hint: null
      type: time
      options: []
      required: true
    - id: 18
      name: consent_note
      label: Consent Note
      hint: Note on consent of participant
      type: text
      options: []
      required: false
    - id: 19
      name: participant_consent
      label: Participant Consent
      hint: null
      type: select_multiple
      options:
      - I understand
      - I do not understand
      required: true
    - id: 20
      name: participant_consent_signed
      label: Participant Consent Signed
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 21
      name: participant_consent_signed_date
      label: Participant Consent Signed Date
      hint: null
      type: date
      options: []
      required: true
    - id: 22
      name: participant_consent_signed_time
      label: Participant Consent Signed Time
      hint: null
      type: time
      options: []
      required: true
    - id: 23
      name: participant_consent_signed_by
      label: Participant Consent Signed By
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: participant_consent_signed_by_phone
      label: Participant Consent Signed By Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: participant_consent_signed_by_email
      label: Participant Consent Signed By Email
      hint: null
      type: email
      options: []
      required: false
