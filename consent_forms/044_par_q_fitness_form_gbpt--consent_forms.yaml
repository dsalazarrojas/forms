inputSchema:
  type: object
  properties:
    title: PAR Q Fitness Form GBPT
    pages:
    - id: 1
      name: medical_conditions
      label: Do you have any medical conditions that may impact your physical activity?
      hint: null
      type: select_multiple
      options:
      - Option A
      - Option B
      required: false
    - id: 2
      name: age
      label: What is your current age?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: height
      label: What is your height (in meters)?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: weight
      label: What is your weight (in kg)?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: bmi
      label: What is your body mass index (BMI)?
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: blood_pressure
      label: What is your blood pressure?
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: resting_heart_rate
      label: What is your resting heart rate?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: previous_injuries
      label: Have you ever had any previous injuries or illnesses that may impact
        your exercise routine?
      hint: null
      type: select_multiple
      options:
      - Option A
      - Option B
      required: false
    - id: 9
      name: exercise_frequency
      label: What is your exercise frequency (days per week)?
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: exercise_type
      label: How often do you exercise?
      hint: null
      type: select_one
      options:
      - Option A
      - Option B
      required: false
    - id: 11
      name: exercise_session_duration
      label: How long do you exercise each session?
      hint: null
      type: select_one
      options:
      - Option A
      - Option B
      required: false
    - id: 12
      name: exercise_location
      label: Do you exercise at home or in a gym?
      hint: null
      type: select_one
      options:
      - Option A
      - Option B
      required: false
    - id: 13
      name: exercise_buddy
      label: Who is your exercise buddy?
      hint: null
      type: select_one
      options:
      - Option A
      - Option B
      required: false
    - id: 14
      name: medical_equipment
      label: Do you have any medical equipment for exercise?
      hint: null
      type: select_one
      options:
      - Option A
      - Option B
      required: false
    - id: 15
      name: future_exercise_plans
      label: Do you have any plans for future exercise plans?
      hint: null
      type: select_one
      options:
      - Option A
      - Option B
      required: false
    - id: 16
      name: exercise_type_2
      label: How do you usually exercise?
      hint: null
      type: select_one
      options:
      - Option A
      - Option B
      required: false
