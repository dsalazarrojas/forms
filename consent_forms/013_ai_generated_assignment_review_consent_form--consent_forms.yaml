inputSchema:
  type: object
  properties:
    title: AI Generated Assignment Review Consent Form
    pages:
    - id: 1
      name: consent_header
      label: -- Consent Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student name
      hint: Full name of the student
      type: text
      options: []
      required: true
    - id: 3
      name: guardian_name
      label: Guardian or parent name
      hint: If student is a minor
      type: text
      options: []
      required: false
    - id: 4
      name: course
      label: Course name or code
      hint: Course related to the assignment
      type: text
      options: []
      required: true
    - id: 5
      name: consent_to_review
      label: Consent to AI assignment review
      hint: Do you agree to have AI review the submission
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: data_usage
      label: Data usage and retention
      hint: How assignment data will be used and stored
      type: text
      options: []
      required: true
    - id: 7
      name: opt_out_instructions
      label: Opt out instructions
      hint: How to opt out if you do not consent
      type: note
      options: []
      required: false
    - id: 8
      name: contact_for_questions
      label: Contact for questions
      hint: Who to contact with concerns about AI review
      type: text
      options: []
      required: true
    - id: 9
      name: signature_date
      label: Date of consent
      hint: Use YYYY-MM-DD
      type: date
      options: []
      required: true
