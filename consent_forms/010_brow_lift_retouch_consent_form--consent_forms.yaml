inputSchema:
  type: object
  properties:
    title: Brow Lift Retouch Consent Form
    pages:
    - id: 1
      name: client_full_name
      label: Client Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: client_date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: client_address
      label: Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: appointment_date
      label: Appointment Date for Retouch
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: original_procedure_date
      label: Date of Original Brow Lift Procedure
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: procedure_location
      label: Where was the original procedure performed
      hint: Clinic or facility name
      type: text
      options: []
      required: false
    - id: 10
      name: healing_status
      label: Have your brows healed properly since last procedure
      hint: null
      type: select_one
      options:
      - Yes, completely
      - Mostly yes
      - Some concerns
      - No, has not healed well
      required: true
    - id: 11
      name: current_concerns
      label: Current concerns or issues with brows
      hint: Itching, redness, pigment loss, etc
      type: text
      options: []
      required: false
    - id: 12
      name: allergies
      label: Known allergies to pigments or numbing agents
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: medications
      label: Current medications affecting healing
      hint: Blood thinners, antibiotics, etc
      type: text
      options: []
      required: false
    - id: 14
      name: skin_conditions
      label: Do you have any active skin conditions
      hint: Rash, infection, dermatitis, etc
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 15
      name: pregnancy
      label: Are you currently pregnant or nursing
      hint: null
      type: select_one
      options:
      - Yes, pregnant
      - Yes, nursing
      - false
      required: true
    - id: 16
      name: risks_explained
      label: Risks and benefits have been explained
      hint: null
      type: select_one
      options:
      - Yes, I understand
      - I have questions
      required: true
    - id: 17
      name: consent
      label: I consent to the brow lift retouch procedure
      hint: null
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 18
      name: liability_waiver
      label: I assume all risks and waive liability
      hint: null
      type: select_one
      options:
      - Yes, I acknowledge
      - false
      required: true
    - id: 19
      name: signature_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
