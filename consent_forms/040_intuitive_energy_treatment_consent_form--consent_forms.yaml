inputSchema:
  type: object
  properties:
    title: Intuitive Energy Treatment Consent Form
    pages:
    - id: 1
      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: treatment_details
      label: Treatment Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: treatment_plan
      label: Treatment Plan
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: medical_condition
      label: Medical Condition
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: treatment_provider
      label: Treatment Provider
      hint: null
      type: select_one
      options:
      - '{''label'': ''Dr. Smith''}'
      - '{''label'': ''Dr. Jones''}'
      - '{''label'': ''Dr. Doe''}'
      required: true
    - id: 6
      name: treatment_duration
      label: Treatment Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: treatment_frequency
      label: Treatment Frequency
      hint: null
      type: select_one
      options:
      - '{''label'': ''Daily''}'
      - '{''label'': ''Weekly''}'
      - '{''label'': ''Monthly''}'
      required: true
    - id: 8
      name: treatment_start_date
      label: Treatment Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: treatment_end_date
      label: Treatment End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: treatment_notes
      label: Treatment Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: patient_signature
      label: Patient Signature
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: treatment_provider_signature
      label: Treatment Provider Signature
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
