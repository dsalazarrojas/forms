inputSchema:
  type: object
  properties:
    title: Student Digital Portfolio Showcase Consent Form
    pages:
    - id: 1
      name: parent_permission
      label: Parent Permission
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: student_permission
      label: Student Permission
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: student_work
      label: Display Student Work
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: school_programs
      label: School Programs
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: showcase
      label: Showcase
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: consent_date
      label: Consent Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: program_name
      label: Program Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: grade_level
      label: Grade Level
      hint: null
      type: select_one
      options:
      - High
      - Low
      required: true
    - id: 12
      name: student_age
      label: Student Age
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
