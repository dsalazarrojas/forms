inputSchema:
  type: object
  properties:
    title: Academic Data Sharing Consent Form
    pages:
    - id: 1
      name: consent_header
      label: -- Data Sharing Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Contact email
      hint: Email used for data sharing consent
      type: email
      options: []
      required: true
    - id: 4
      name: data_types_shared
      label: Types of data to be shared
      hint: Select all that apply
      type: select_multiple
      options:
      - Academic records
      - Research data
      - Demographic information
      - Assessment outcomes
      required: true
    - id: 5
      name: sharing_purpose
      label: Purpose of data sharing
      hint: Intended uses and recipients
      type: text
      options: []
      required: true
    - id: 6
      name: retention_period
      label: Data retention period
      hint: How long data will be stored
      type: text
      options: []
      required: false
    - id: 7
      name: consent_for_analysis
      label: Consent for analysis and reporting
      hint: Permission for anonymized analysis
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: withdrawal_process
      label: Process to withdraw consent
      hint: Instructions to withdraw participation
      type: note
      options: []
      required: false
    - id: 9
      name: signature
      label: Signature confirmation
      hint: Type full name to confirm consent
      type: text
      options: []
      required: true
    - id: 10
      name: date
      label: Date of consent
      hint: Date when consent was provided
      type: date
      options: []
      required: true
