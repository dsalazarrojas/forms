inputSchema:
  type: object
  properties:
    title: Body Composition Scan Consent Form
    pages:
    - id: 1
      name: client_first_name
      label: Client First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: client_last_name
      label: Client Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Client Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Client Phone
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: gender
      label: Gender
      hint: Required for analysis
      type: select_one
      options:
      - Female
      - Male
      required: true
    - id: 7
      name: height
      label: Height
      hint: In feet and inches
      type: text
      options: []
      required: true
    - id: 8
      name: current_weight
      label: Current Weight
      hint: In pounds
      type: number
      options: []
      required: true
    - id: 9
      name: scan_type
      label: Type of Scan
      hint: Select the scan type
      type: select_one
      options:
      - DEXA Scan
      - BIA Scan
      - Bod Pod
      - Hydrostatic Weighing
      - 3D Body Scan
      - Other
      required: true
    - id: 10
      name: scan_purpose
      label: Purpose of Scan
      hint: Why are you getting scanned?
      type: select_one
      options:
      - Weight Loss Tracking
      - Fitness Assessment
      - Health Monitoring
      - Athletic Performance
      - Medical Reasons
      - Curiosity
      required: true
    - id: 11
      name: medical_conditions
      label: Medical Conditions
      hint: List any relevant conditions
      type: text
      options: []
      required: false
    - id: 12
      name: pacemaker_implant
      label: Pacemaker or Metal Implants
      hint: Do you have any?
      type: select_one
      options:
      - 'False'
      - Yes - Pacemaker
      - Yes - Metal Implants
      - Yes - Both
      required: true
    - id: 13
      name: pregnancy_status
      label: Pregnancy Status
      hint: Are you pregnant or nursing?
      type: select_one
      options:
      - 'False'
      - Yes, Pregnant
      - Yes, Nursing
      - Not Applicable
      required: true
    - id: 14
      name: recent_meal
      label: Recent Meal
      hint: Have you eaten in last 4 hours?
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 15
      name: recent_exercise
      label: Recent Exercise
      hint: Have you exercised in last 12 hours?
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 16
      name: hydration_status
      label: Hydration Status
      hint: Are you properly hydrated?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 17
      name: scan_procedure_explained
      label: Scan Procedure Explained
      hint: Has the procedure been explained?
      type: select_one
      options:
      - Yes, Completely
      - Mostly
      - Somewhat
      - 'False'
      required: true
    - id: 18
      name: risks_understood
      label: Risks Understood
      hint: Do you understand any risks?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: data_usage_consent
      label: Data Usage Consent
      hint: May we use your data for analysis?
      type: select_one
      options:
      - Yes, I Consent
      - No, I Do Not Consent
      required: true
    - id: 20
      name: data_sharing_consent
      label: Data Sharing Consent
      hint: May we share with your healthcare provider?
      type: select_one
      options:
      - Yes, I Consent
      - No, I Do Not Consent
      required: false
    - id: 21
      name: results_delivery
      label: How to Receive Results
      hint: Select preference
      type: select_one
      options:
      - Email
      - In Person
      - Phone Call
      - Patient Portal
      required: true
    - id: 22
      name: follow_up_consultation
      label: Follow-Up Consultation
      hint: Would you like a consultation?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 23
      name: voluntary_participation
      label: Voluntary Participation
      hint: I understand this is voluntary
      type: select_one
      options:
      - Yes, I Understand
      - 'False'
      required: true
    - id: 24
      name: right_to_withdraw
      label: Right to Withdraw
      hint: I understand I can withdraw anytime
      type: select_one
      options:
      - Yes, I Understand
      - 'False'
      required: true
    - id: 25
      name: client_signature
      label: Client Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 26
      name: signature_date
      label: Signature Date
      hint: Date of consent
      type: date
      options: []
      required: true
    - id: 27
      name: witness_name
      label: Witness Name
      hint: If applicable
      type: text
      options: []
      required: false
