inputSchema:
  type: object
  properties:
    title: Personal Information Sharing Consent Form
    pages:
    - id: 1
      name: personal_information_sharing_consent_form
      label: Personal Information Sharing Consent
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: contact_info
      label: Contact Information
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Email''}'
      - '{''id'': 2, ''name'': ''Phone''}'
      - '{''id'': 3, ''name'': ''Address''}'
      required: true
    - id: 3
      name: data_collection
      label: Data Collection
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Data Sharing'', ''hint'': ''Please select the type
        of data you want to share''}'
      - '{''id'': 2, ''name'': ''No Sharing''}'
      required: true
    - id: 4
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: time_of_birth
      label: Time of Birth
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: confirm_consent
      label: Confirm Consent
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': True}'
      - '{''id'': 2, ''name'': False}'
      required: true
    - id: 9
      name: confirm_signature
      label: Confirm Signature
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': True}'
      - '{''id'': 2, ''name'': False}'
      required: true
    - id: 10
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: confirm_submit
      label: Confirm Submit
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: cancel
      label: Cancel
      hint: null
      type: text
      options: []
      required: false
