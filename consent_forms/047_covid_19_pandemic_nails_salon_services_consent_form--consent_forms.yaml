inputSchema:
  type: object
  properties:
    title: COVID 19 Pandemic Nails Salon Services Consent Form
    pages:
    - id: 1
      name: client_header
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: service_requested
      label: Service Requested
      hint: null
      type: select_multiple
      options:
      - Manicure
      - Pedicure
      - Gel Manicure
      - Gel Pedicure
      - Acrylic Nails
      - Nail Art
      - Nail Removal
      - Other
      required: true
    - id: 8
      name: health_section
      label: -- Health Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: covid_symptoms
      label: COVID-19 symptoms in past 14 days
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: symptom_list
      label: Symptoms if present
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: fever_screening
      label: Temperature above 100.4F today
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: covid_exposure
      label: Exposed to COVID-19 in past 14 days
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unknown
      required: true
    - id: 13
      name: recent_positive_test
      label: Tested positive for COVID-19 in past 10 days
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully Vaccinated
      - Partially Vaccinated
      - Not Vaccinated
      required: true
    - id: 15
      name: underlying_conditions
      label: Pre-existing health conditions
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: condition_details
      label: Describe conditions if applicable
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: nail_health_header
      label: -- Nail and Skin Health --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: nail_conditions
      label: Current nail or skin conditions
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: condition_description
      label: Describe nail or skin conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: product_allergies
      label: Allergies to nail products
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 21
      name: allergy_description
      label: Describe allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: consent_section
      label: -- Consent Agreement --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: understand_pandemic_risks
      label: I understand COVID-19 transmission risks
      hint: null
      type: select_one
      options:
      - Yes, I Understand
      - No, I Do Not Understand
      required: true
    - id: 24
      name: acknowledge_precautions
      label: I acknowledge salon safety measures
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 25
      name: final_consent
      label: I consent to receive nail salon services
      hint: null
      type: select_one
      options:
      - Yes, I Consent
      - No, I Do Not Consent
      required: true
