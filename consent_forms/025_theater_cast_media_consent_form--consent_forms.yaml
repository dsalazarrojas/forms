      name: location_of_media_capture
      label: location_of_media_capture
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: description
      label: description
      hint: Describe the media captured
      type: text
      options: []
      required: false
    - id: 12
      name: permission_to_share
      label: permission_to_share
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 14
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
