inputSchema:
  type: object
  properties:
    title: AI Ethics Licensing Form
    pages:
    - id: 1
      name: licensing_entities_header
      label: '--- Licensee Information ---'
      hint: Details of the entity requesting the license.
      type: note
      options: []
      required: false
    - id: 2
      name: licensee_full_name
      label: Licensee / Authorized Representative
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: organization_name
      label: Organization / Entity Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: organization_type
      label: Organization Type
      hint: null
      type: select_one
      options:
      - For-Profit Corporation
      - Non-Profit / NGO
      - Academic / Research Institution
      - Individual Developer
      - Government Agency
      required: true
    - id: 5
      name: ai_project_details_header
      label: '--- AI Project and Model Details ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: ai_model_name
      label: AI Product / Model Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: intended_use_case
      label: Detailed Description of Intended Use
      hint: How and where will this AI technology be deployed?
      type: text
      options: []
      required: true
    - id: 8
      name: license_type_requested
      label: License Type Requested
      hint: null
      type: select_one
      options:
      - Commercial Enterprise License
      - Research and Development License
      - Educational / Non-Commercial License
      - Evaluation / Trial License
      required: true
    - id: 9
      name: ethical_constraints_header
      label: '--- Ethical Compliance and Constraints ---'
      hint: Mandatory adherence to ethical use policies.
      type: note
      options: []
      required: false
    - id: 10
      name: restricted_use_acknowledgment
      label: Restricted Use Acknowledgment
      hint: Check all categories you agree NOT to use the AI for.
      type: select_multiple
      options:
      - Lethal Autonomous Weapons Systems
      - Mass Surveillance or Social Scoring
      - Generating Misinformation / Deepfakes without Disclosure
      - Discrimination in Hiring, Credit, or Healthcare
      - Exploitation of Vulnerable Groups
      required: true
    - id: 11
      name: data_privacy_compliance
      label: Data Privacy Standards Compliance
      hint: Which standards does your implementation adhere to?
      type: select_multiple
      options:
      - GDPR (EU)
      - CCPA/CPRA (California)
      - HIPAA (Healthcare US)
      - SOC 2 Type II
      - Local Privacy Laws Only
      required: true
    - id: 12
      name: model_transparency_level
      label: Model Transparency Level
      hint: null
      type: select_one
      options:
      - Fully Transparent (Open Weights/Source)
      - Partially Transparent (API access + Documentation)
      - Proprietary / Black Box
      required: true
    - id: 13
      name: legal_logistics_header
      label: '--- Legal and Administrative ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: license_effective_date
      label: Requested License Effective Date
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: monitoring_frequency
      label: Preferred Audit / Monitoring Frequency
      hint: null
      type: select_one
      options:
      - Quarterly Self-Assessment
      - Annual External Audit
      - Continuous Monitoring (API logs)
      required: true
    - id: 16
      name: compliance_contact_email
      label: Compliance Officer Email
      hint: For ethics and licensing follow-up.
      type: email
      options: []
      required: true
    - id: 17
      name: jurisdiction_governing_law
      label: Governing Law Jurisdiction
      hint: e.g., State of Delaware, UK, Germany
      type: text
      options: []
      required: true
    - id: 18
      name: liability_waiver_agreement
      label: I accept the liability and indemnification terms of this license.
      hint: null
      type: select_one
      options:
      - Yes, I accept
      - No, I do not accept
      required: true
