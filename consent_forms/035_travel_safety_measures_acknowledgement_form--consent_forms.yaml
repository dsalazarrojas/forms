inputSchema:
  type: object
  properties:
    title: Travel_Safety_Measures_Acknowledgement_Form
    pages:
    - id: 1
      name: i_acknowledge_that_i_have_completed_a_pre_trip_travel_risk_assessment
      label: I Acknowledge That I Have Completed A Pre Trip Travel Risk Assessment
      hint: Please confirm that you have completed a pre-trip travel risk assessment.
      type: text
      options: []
      required: true
    - id: 2
      name: have_i_familiarized_myself_with_all_emergency_procedure_documents
      label: Have I Familiarized Myself With All Emergency Procedure Documents?
      hint: Please confirm that you have read and understood all emergency procedure
        documents.
      type: text
      options: []
      required: true
    - id: 3
      name: will_i_conduct_a_risk_assessment_on_return
      label: Will I Conduct A Risk Assessment On Return?
      hint: Please confirm that you will conduct a risk assessment on return.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 4
      name: will_i_adhere_to_all_emergency_response_and_emergency_evacuation_procedures
      label: Will I Adhere To All Emergency Response And Emergency Evacuation Procedures?
      hint: Please confirm that you will adhere to all emergency response and emergency
        evacuation procedures.
