inputSchema:
  type: object
  properties:
    title: Pediatric Consent Form
    pages:
    - id: 1
      name: consent_date
      label: Consent Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: consent_time
      label: Consent Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: signature
      label: Signature
      hint: null
      type: select_one
      options:
      - '{''id'': 10, ''label'': True}'
      - '{''id'': 11, ''label'': False}'
      required: false
    - id: 6
      name: consent_reason
      label: Consent Reason
      hint: Please describe the medical treatment that will be provided
      type: text
      options: []
      required: false
    - id: 7
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: false
