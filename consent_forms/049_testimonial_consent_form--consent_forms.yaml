inputSchema:
  type: object
  properties:
    title: <string>
    pages:
    - id: 1
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 3
      name: test_prophet_name
      label: Testimonial Prophet Name
      hint: null
      type: select_one
      options:
      - John Smith
      - Jane Doe
      - Other
      required: false
    - id: 4
      name: testimonial_text
      label: Testimonial Text
      hint: Please write a testimonial about your experience with us.
      type: note
      options: []
      required: true
    - id: 5
      name: consent
      label: Consent
      hint: Please indicate which areas you agree to
      type: select_multiple
      options:
      - Marketing Materials
      - Social Media
      - Press Releases
      - Other
      required: true
    - id: 6
      name: other_consent_area
      label: Other (if applicable)
      hint: Please enter other (if applicable)
      type: text
      options: []
      required: false
    - id: 7
      name: agreement_date
      label: Agreement Date
      hint: Please select a date
      type: date
      options: []
      required: true
