inputSchema:
  type: object
  properties:
    title: Content Access Permission Request Form
    pages:
    - id: 1
      name: section_user_info
      label: -- User Details --
      hint: Please provide your information below.
      type: note
      options: []
      required: false
    - id: 2
      name: user_name
      label: User Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: user_id
      label: User Identification Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: user_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: user_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_access_request
      label: -- Access Request Details --
      hint: Please share your reason for requesting access to specific materials.
      type: note
      options: []
      required: false
    - id: 7
      name: content_requested
      label: Content Requested for Access
      hint: Please list the titles or links of the specific materials you need access
        to.
      type: text
      options: []
      required: true
    - id: 8
      name: access_duration
      label: Requested Access Duration
      hint: null
      type: select_one
      options:
      - One-time (24 hours)
      - Short-term (1 week)
      - Medium-term (1 month)
      - Long-term (1 year)
      - Perpetual
      required: true
    - id: 9
      name: reason_for_access
      label: Justification for Access Request
      hint: Please explain why you need access to this content.
      type: text
      options: []
      required: true
    - id: 10
      name: section_security_verification
      label: -- Security and Verification --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: security_clearance_level
      label: Your Current Security Clearance Level
      hint: null
      type: select_one
      options:
      - Standard (Public)
      - Low (Staff)
      - Medium (Manager)
      - High (Director)
      - Top Secret (Admin)
      required: true
    - id: 12
      name: access_permission_granted
      label: Access Permission Granted?
      hint: For administrative use only
      type: select_one
      options:
      - true
      - false
      - Pending
      required: true
    - id: 13
      name: section_confirmation
      label: -- Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: request_completed
      label: Request Completed?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 15
      name: signature_confirmation
      label: I confirm that the information provided is accurate
      hint: null
      type: select_one
      options:
      - I Agree
      - I Disagree
      required: true
