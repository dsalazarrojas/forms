inputSchema:
  type: object
  properties:
    title: Health Program Release Interest Form
    pages:
    - id: 1
      name: participant_name
      label: participant_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: program_type
      label: program_type
      hint: null
      type: select_one
      options:
      - Wellness
      - Fitness
      - Health
      required: false
    - id: 4
      name: participant_consent
      label: participant_consent
      hint: This participant consents to be contacted for follow-up questions or surveys.
      type: select_multiple
      options:
      - 'False'
      - 'True'
      required: false
    - id: 5
      name: follow_up
      label: follow_up
      hint: How would you like to be contacted for follow-up questions or surveys?
      type: select_one
      options:
      - Phone
      - Email
      - Mail
      required: false
