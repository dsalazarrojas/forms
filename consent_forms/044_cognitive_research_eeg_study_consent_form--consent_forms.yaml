inputSchema:
  type: object
  properties:
    title: Cognitive Research EEG Study Consent Form
    pages:
    - id: 1
      name: section_study
      label: -- Study Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: study_title
      label: Study Title
      hint: EEG research study name
      type: text
      options: []
      required: true
    - id: 3
      name: researcher_name
      label: Principal Researcher Name
      hint: Lead investigator
      type: text
      options: []
      required: true
    - id: 4
      name: institution
      label: Institution
      hint: University or research center
      type: text
      options: []
      required: true
    - id: 5
      name: irb_approval
      label: IRB Approval Number
      hint: Institutional Review Board approval
      type: text
      options: []
      required: true
    - id: 6
      name: section_participant
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: participant_name
      label: Participant Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: section_procedure
      label: -- Study Procedure --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: understand_procedure
      label: I understand the study procedure
      hint: What will happen during the study
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 13
      name: understand_eeg
      label: I understand the EEG equipment and process
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 14
      name: eeg_duration
      label: Estimated Study Duration
      hint: How long will the session last
      type: select_one
      options:
      - Less than 30 minutes
      - 30-60 minutes
      - 1-2 hours
      - 2-4 hours
      - More than 4 hours
      required: true
    - id: 15
      name: section_risks
      label: -- Risks and Safety --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: understand_risks
      label: I understand the potential risks
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 17
      name: eeg_safety
      label: EEG is safe and non-invasive
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 18
      name: electrode_concerns
      label: I have concerns about electrode placement
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 19
      name: seizure_history
      label: I have a history of seizures
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 20
      name: section_benefits
      label: -- Benefits and Compensation --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: understand_benefits
      label: I understand potential benefits
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 22
      name: compensation_offered
      label: I understand compensation details
      hint: Payment or other compensation
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not applicable
      required: true
    - id: 23
      name: section_confidentiality
      label: -- Confidentiality and Data --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: understand_confidentiality
      label: I understand how my identity will be protected
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 25
      name: eeg_data_use
      label: I understand how my EEG data will be used
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 26
      name: data_retention
      label: I understand data retention policy
      hint: How long will data be kept
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 27
      name: section_voluntary
      label: -- Voluntary Participation --
      hint: null
      type: note
      options: []
      required: false
    - id: 28
      name: voluntary
      label: I understand participation is voluntary
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 29
      name: can_withdraw
      label: I can withdraw without penalty
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 30
      name: section_consent
      label: -- Consent Agreement --
      hint: null
      type: note
      options: []
      required: false
    - id: 31
      name: consent_statement
      label: I consent to participate in this EEG study
      hint: null
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 32
      name: consent_date
      label: Date of Consent
      hint: null
      type: date
      options: []
      required: true
