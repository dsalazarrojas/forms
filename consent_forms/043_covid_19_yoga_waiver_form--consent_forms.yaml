inputSchema:
  type: object
  properties:
    title: Covid 19 Yoga Waiver Form
    pages:
    - id: 1
      name: participant_name
      label: Participant name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_information
      label: Contact information
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: emergency_contact
      label: Emergency contact name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: emergency_phone
      label: Emergency contact phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: emergency_address
      label: Emergency contact address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: health_conditions
      label: Health conditions
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: waiver_signature
      label: Waiver signature
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: instructor_signature
      label: Instructor signature
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
