inputSchema:
  type: object
  properties:
    title: Pledge Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: amount
      label: Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: amount_currency
      label: Amount Currency
      hint: null
      type: select_one
      options:
      - USD
      - EUR
      - GBP
      - JPY
      - CNY
      required: false
    - id: 6
      name: frequency
      label: Frequency
      hint: null
      type: select_one
      options:
