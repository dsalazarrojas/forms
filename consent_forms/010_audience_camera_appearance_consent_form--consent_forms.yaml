inputSchema:
  type: object
  properties:
    title: Audience Camera Appearance Consent Form
    pages:
      - id: 1
        name: attendee_full_name
        label: Attendee Full Name
        hint: null
        type: text
        options: []
        required: true
      - id: 2
        name: event_details_section
        label: -- Event Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 3
        name: event_name
        label: Event Name
        hint: Name of the production or gathering
        type: text
        options: []
        required: true
      - id: 4
        name: event_date
        label: Date of Attendance
        hint: null
        type: date
        options: []
        required: true
      - id: 5
        name: production_company
        label: Production Company / Organizer
        hint: null
        type: text
        options: []
        required: false
      - id: 6
        name: consent_section
        label: -- Recording Consent --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: appearance_consent
        label: I consent to being filmed and recorded during the event
        hint: null
        type: select_one
        options:
          - I Consent
          - I Do Not Consent
        required: true
      - id: 8
        name: likeness_release
        label: I authorize the use of my image, likeness, and voice
        hint: Includes worldwide distribution in all media
        type: select_one
        options:
          - I Authorize
          - I Do Not Authorize
        required: true
      - id: 9
        name: minor_participant_status
        label: Is the participant a minor (under 18)?
        hint: null
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 10
        name: guardian_name
        label: Parent or Guardian Name
        hint: Required if participant is a minor
        type: text
        options: []
        required: false
      - id: 11
        name: contact_email
        label: Email Address
        hint: For a copy of this release
        type: email
        options: []
        required: true
      - id: 12
        name: agreement_date
        label: Date of Agreement
        hint: null
        type: date
        options: []
        required: true
      - id: 13
        name: signature_acknowledgment
        label: Electronic Signature (Full Name)
        hint: null
        type: text
        options: []
        required: true
