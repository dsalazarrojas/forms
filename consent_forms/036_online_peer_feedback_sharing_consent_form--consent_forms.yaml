inputSchema:
  type: object
  properties:
    title: online_peer_feedback_sharing_consent_form
    pages:
    - id: 1
      name: participant_info
      label: Participant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: share_feedback
      label: Share Feedback
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: feedback_details
      label: Feedback Details
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: feedback_sharing_consent
      label: Feedback Sharing Consent
      hint: null
      type: select_one
      options:
      - Consent
      - Refuse
      required: true
