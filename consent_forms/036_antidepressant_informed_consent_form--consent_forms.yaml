inputSchema:
  type: object
  properties:
    title: Antidepressant Informed Consent Form
    pages:
    - id: 1
      name: section_overview
      label: -- Treatment Overview --
      hint: Information about antidepressant therapy risks benefits and alternatives
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of birth
      hint: For accurate medical records
      type: date
      options: []
      required: false
    - id: 4
      name: medication_name
      label: Proposed medication name
      hint: Name of the antidepressant medication
      type: text
      options: []
      required: true
    - id: 5
      name: understand_risks
      label: I understand the risks and potential side effects
      hint: Including but not limited to nausea insomnia and mood changes
      type: select_one
      options:
        - Acknowledged
        - Not acknowledged
      required: true
    - id: 6
      name: alternatives_discussed
      label: Alternatives to medication discussed
      hint: Psychotherapy lifestyle changes or watchful waiting
      type: select_multiple
      options:
        - Psychotherapy
        - Lifestyle modifications
        - Other medications
        - No alternatives discussed
      required: false
    - id: 7
      name: consent_to_treatment
      label: Consent to begin treatment
      hint: Consent is required to prescribe medication
      type: select_one
      options:
        - Yes I consent
        - No I do not consent
      required: true
    - id: 8
      name: emergency_contact
      label: Emergency contact name and phone
      hint: Optional emergency contact details
      type: text
      options: []
      required: false
    - id: 9
      name: prescriber_name
      label: Prescriber name
      hint: Clinician recommending treatment
      type: text
      options: []
      required: true
