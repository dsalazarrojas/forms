inputSchema:
  type: object
  properties:
    title: Chiropractic Treatment Intake Form
    pages:
    - id: 1
      name: patient_information
      label: Patient Information
      hint: Basic details
      type: note
      options: []
      required: false
    - id: 2
      name: patient_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: patient_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      - Other
      required: true
    - id: 7
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: address
      label: Address
      hint: Street, city, state, zip
      type: text
      options: []
      required: true
    - id: 10
      name: emergency_contact
      label: Emergency Contact Name and Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: treatment_reason
      label: Reason for Treatment
      hint: Why you are seeking care
      type: note
      options: []
      required: false
    - id: 12
      name: primary_reason
      label: What is your primary reason for seeking treatment
      hint: Describe your main concern
      type: text
      options: []
      required: true
    - id: 13
      name: symptoms
      label: Current Symptoms
      hint: Select all that apply
      type: select_multiple
      options:
      - Back pain
      - Neck pain
      - Headaches
      - Joint pain
      - Muscle pain
      - Numbness or tingling
      - Stiffness
      - Weakness
      - Limited mobility
      - Sciatica
      - Other
      required: true
    - id: 14
      name: symptom_duration
      label: How long have you had these symptoms
      hint: null
      type: select_one
      options:
      - Less than 1 week
      - 1-4 weeks
      - 1-3 months
      - 3-6 months
      - 6 months to 1 year
      - More than 1 year
      required: true
    - id: 15
      name: pain_severity
      label: Current Pain Severity
      hint: Scale 1-10
      type: number
      options: []
      required: true
    - id: 16
      name: what_makes_worse
      label: What makes your symptoms worse
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: what_makes_better
      label: What makes your symptoms better
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: previous_treatments
      label: Previous Treatments for This Condition
      hint: What have you tried
      type: text
      options: []
      required: false
    - id: 19
      name: health_history
      label: Health History
      hint: Your medical background
      type: note
      options: []
      required: false
    - id: 20
      name: current_medications
      label: Current Medications
      hint: List all medications
      type: text
      options: []
      required: false
    - id: 21
      name: allergies
      label: Allergies
      hint: Medications, foods, other
      type: text
      options: []
      required: false
    - id: 22
      name: medical_conditions
      label: Medical Conditions
      hint: Select all that apply
      type: select_multiple
      options:
      - High blood pressure
      - Heart disease
      - Diabetes
      - Arthritis
      - Osteoporosis
      - Cancer
      - Stroke
      - Blood clotting disorder
      - Autoimmune disease
      - Anxiety or depression
      - Chronic pain
      - None
      required: true
    - id: 23
      name: previous_surgeries
      label: Previous Surgeries
      hint: List with dates
      type: text
      options: []
      required: false
    - id: 24
      name: hospitalizations
      label: Recent Hospitalizations
      hint: In the past 5 years
      type: text
      options: []
      required: false
    - id: 25
      name: lifestyle_factors
      label: Lifestyle Factors
      hint: Daily habits
      type: note
      options: []
      required: false
    - id: 26
      name: occupation
      label: Occupation
      hint: Current job
      type: text
      options: []
      required: true
    - id: 27
      name: physical_demands
      label: Is your job physically demanding
      hint: null
      type: select_one
      options:
      - Very demanding
      - Moderately demanding
      - Light activity
      - Sedentary
      - Not working
      required: true
    - id: 28
      name: exercise_frequency
      label: How often do you exercise
      hint: null
      type: select_one
      options:
      - Daily
      - 3-5 times per week
      - 1-2 times per week
      - Rarely
      - Never
      required: true
    - id: 29
      name: sleep_quality
      label: Sleep Quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 30
      name: stress_level
      label: Current Stress Level
      hint: null
      type: select_one
      options:
      - Very low
      - Low
      - Moderate
      - High
      - Very high
      required: true
    - id: 31
      name: tobacco_use
      label: Do you use tobacco
      hint: null
      type: select_one
      options:
      - Never
      - Former user
      - Current user
      required: true
    - id: 32
      name: alcohol_use
      label: Alcohol Consumption
      hint: null
      type: select_one
      options:
      - None
      - Occasional
      - Moderate
      - Regular
      required: true
    - id: 33
      name: chiropractic_history
      label: Chiropractic History
      hint: Past experience
      type: note
      options: []
      required: false
    - id: 34
      name: seen_chiro_before
      label: Have you seen a chiropractor before
      hint: null
      type: select_one
      options:
      - Yes, regularly
      - Yes, a few times
      - Yes, once
      - No, never
      required: true
    - id: 35
      name: previous_experience
      label: How was your previous chiropractic experience
      hint: If applicable
      type: select_one
      options:
      - Very positive
      - Positive
      - Neutral
      - Negative
      - Very negative
      - Not applicable
      required: false
    - id: 36
      name: other_care
      label: Other Healthcare
      hint: Current treatment
      type: note
      options: []
      required: false
    - id: 37
      name: seeing_other_provider
      label: Are you seeing another healthcare provider for this
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 38
      name: provider_details
      label: Provider Details
      hint: Name and type
      type: text
      options: []
      required: false
    - id: 39
      name: treatment_goals
      label: Treatment Goals
      hint: What you hope to achieve
      type: note
      options: []
      required: false
    - id: 40
      name: primary_goal
      label: What is your primary treatment goal
      hint: null
      type: text
      options: []
      required: true
    - id: 41
      name: consent_agreement
      label: Consent and Agreement
      hint: Your acknowledgment
      type: note
      options: []
      required: false
    - id: 42
      name: information_accurate
      label: I certify that the information provided is accurate
      hint: null
      type: select_one
      options:
      - Yes, I certify
      - 'False'
      required: true
    - id: 43
      name: consent_examination
      label: I consent to chiropractic examination and treatment
      hint: null
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 44
      name: patient_signature
      label: Patient Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 45
      name: signature_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
