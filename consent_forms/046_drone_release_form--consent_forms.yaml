inputSchema:
  type: object
  properties:
    title: Drone Release Form
    pages:
    - id: 1
      name: form_start
      label: Start
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: drone_name
      label: Drone Name
      hint: Enter the name of the drone you are releasing.
      type: text
      options: []
      required: false
    - id: 3
      name: operator
      label: Operator
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: agent
      label: Agent
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: owner
      label: Owner
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: release
      label: Release
      hint: null
      type: select_one
      options:
      - Released
      - Not Released
      required: false
    - id: 11
      name: reason
      label: Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
