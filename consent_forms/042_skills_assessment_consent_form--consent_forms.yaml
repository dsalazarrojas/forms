inputSchema:
  type: object
  properties:
    title: Skills Assessment Consent Form
    pages:
    - id: 1
      name: participant_information
      label: Participant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: evaluation_details
      label: Evaluation Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: consent
      label: Consent
      hint: Please provide your consent for the skill assessments.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: evaluation_time
      label: Evaluation Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: evaluation_location
      label: Evaluation Location
      hint: null
      type: text
      options: []
      required: false
