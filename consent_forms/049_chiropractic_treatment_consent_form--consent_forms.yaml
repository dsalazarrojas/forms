inputSchema:
  type: object
  properties:
    title: Chiropractic Treatment Consent Form
    pages:
      - id: 1
        name: patient_name
        label: Patient Name
        hint: Full legal name
        type: text
        options: []
        required: true
      - id: 2
        name: dob
        label: Date of Birth
        hint: For medical records
        type: date
        options: []
        required: false
      - id: 3
        name: treatment_description
        label: Treatment Description
        hint: Summary of proposed chiropractic treatment
        type: note
        options: []
        required: false
      - id: 4
        name: risks_explained
        label: Risks Explained
        hint: Confirm that risks were explained
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 5
        name: consent_signature
        label: Consent Signature Name
        hint: Typed name as signature
        type: text
        options: []
        required: true
      - id: 6
        name: consent_date
        label: Date of Consent
        hint: Date signature provided
        type: date
        options: []
        required: true
      - id: 7
        name: additional_notes
        label: Additional Notes
        hint: Any further clarifications or patient requests
        type: text
        options: []
        required: false
