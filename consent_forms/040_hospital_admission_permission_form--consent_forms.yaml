inputSchema:
  type: object
  properties:
    title: Hospital Admission Permission Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: relationship_status
      label: Relationship Status
      hint: null
      type: select_one
      options:
      - Married
      - Single
      - Partnered
      - Other
      required: false
    - id: 3
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: address
      label: Address
      hint: null
      type: select_multiple
      options:
      - Address 1
      - Address 2
      - Address 3
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: medical_history
      label: Medical History
      hint: Medical history, allergies, and current medications
      type: text
      options: []
      required: false
    - id: 8
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: emergency_contact_email
      label: Emergency Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: patient_signature
      label: Patient Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: healthcare_provider_signature
      label: Healthcare Provider Signature
      hint: null
      type: select_multiple
      options:
      - Dr. John Smith
      - Dr. Jane Doe
      required: false
    - id: 12
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 14
      name: patient_consent
      label: Patient Consent
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 15
      name: healthcare_provider_consent
      label: Healthcare Provider Consent
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
