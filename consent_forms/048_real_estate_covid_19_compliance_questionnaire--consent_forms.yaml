inputSchema:
  type: object
  properties:
    title: Real Estate COVID 19 Compliance Questionnaire
    pages:
    - id: 1
      name: property_access
      label: Property Access
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: health_info
      label: Health Information
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: travel_history
      label: Travel History
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: symptoms
      label: Symptoms
      hint: null
      type: select_one
      options:
      - No Symptoms
      - Fever
      - Cough
      - Shortness Of Breath
      required: false
    - id: 7
      name: contact_info
      label: Contact Information
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: travel_status
      label: Travel Status
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: exposure_status
      label: Exposure Status
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
