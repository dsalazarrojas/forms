inputSchema:
  type: object
  properties:
    title: Community Impact Study Permission Form
    pages:
      - id: 1
        name: consent_header
        label: -- Study Permission --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: participant_name
        label: Participant name
        hint: Full legal name
        type: text
        options: []
        required: true
      - id: 3
        name: email
        label: Email address
        hint: For study correspondence
        type: email
        options: []
        required: false
      - id: 4
        name: description_of_study
        label: Description of study
        hint: Brief summary of purpose and methods
        type: text
        options: []
        required: true
      - id: 5
        name: consent_to_participate
        label: Consent to participate
        hint: Agree to participate under stated terms
        type: select_one
        options:
          - I consent
          - I do not consent
        required: true
      - id: 6
        name: data_usage
        label: Data usage permissions
        hint: How collected data will be used
        type: select_multiple
        options:
          - Research only
          - Anonymized public reporting
          - Linked follow up contact
        required: true
      - id: 7
        name: duration_of_participation
        label: Duration of participation
        hint: Expected time commitment
        type: text
        options: []
        required: false
      - id: 8
        name: withdrawal_process
        label: Withdrawal process
        hint: Explain how to withdraw from study
        type: text
        options: []
        required: false
      - id: 9
        name: signature_name
        label: Signature name
        hint: Print name to confirm consent
        type: text
        options: []
        required: true
      - id: 10
        name: signature_date
        label: Signature date
        hint: Date consent was provided
        type: date
        options: []
        required: true
