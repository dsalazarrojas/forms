inputSchema:
  type: object
  properties:
    title: Field Trip Consent Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: parent_email
      label: Parent Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: student_phone
      label: Student Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: student_address
      label: Student Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: trip_description
      label: Trip Description
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: trip_date
      label: Trip Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: trip_time
      label: Trip Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: student_agree
      label: Student Agreement
      hint: null
      type: select_multiple
      options:
      - I agree to take the trip
      - I do not agree to take the trip
      required: false
    - id: 10
      name: parent_agree
      label: Parent Agreement
      hint: null
      type: select_multiple
      options:
      - I agree to the terms and agreement
      - I do not agree to the terms and agreement
      required: false
    - id: 11
      name: trip_details
      label: Trip Details
      hint: null
      type: text
      options: []
      required: false
