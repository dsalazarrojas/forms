inputSchema:
  type: object
  properties:
    title: Change Of Doctor Form
    pages:
    - id: 1
      name: form_date
      label: Form Date
      hint: Date of submission
      type: date
      options: []
      required: true
    - id: 2
      name: patient_name
      label: Patient Name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: Patient's birth date
      type: date
      options: []
      required: true
    - id: 4
      name: patient_id
      label: Patient ID Number
      hint: Medical record number
      type: text
      options: []
      required: false
    - id: 5
      name: insurance_provider
      label: Insurance Provider Name
      hint: Name of insurance company
      type: text
      options: []
      required: true
    - id: 6
      name: policy_number
      label: Policy Number
      hint: Insurance policy number
      type: text
      options: []
      required: true
    - id: 7
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 8
      name: phone_number
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 9
      name: mailing_address
      label: Mailing Address
      hint: Current address
      type: text
      options: []
      required: false
    - id: 10
      name: previous_doctor_name
      label: Previous Doctor Name
      hint: Doctor you are leaving
      type: text
      options: []
      required: true
    - id: 11
      name: previous_doctor_specialty
      label: Previous Doctor Specialty
      hint: Medical specialty
      type: text
      options: []
      required: false
    - id: 12
      name: previous_doctor_office
      label: Previous Doctor's Office
      hint: Practice or clinic name
      type: text
      options: []
      required: false
    - id: 13
      name: years_with_previous_doctor
      label: Years Seeing Previous Doctor
      hint: How long patient relationship
      type: number
      options: []
      required: false
    - id: 14
      name: new_doctor_name
      label: New Doctor Name
      hint: Doctor you are switching to
      type: text
      options: []
      required: true
    - id: 15
      name: new_doctor_specialty
      label: New Doctor Specialty
      hint: Medical specialty
      type: text
      options: []
      required: false
    - id: 16
      name: new_doctor_office
      label: New Doctor's Office
      hint: Practice or clinic name
      type: text
      options: []
      required: false
    - id: 17
      name: new_doctor_phone
      label: New Doctor's Phone Number
      hint: Contact number for new doctor
      type: text
      options: []
      required: false
    - id: 18
      name: reason_for_change
      label: Reason for Changing Doctors
      hint: Why are you switching
      type: text
      options: []
      required: false
    - id: 19
      name: medical_records_request
      label: Request Medical Records Transfer
      hint: Request transfer of medical records
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 20
      name: authorization
      label: I Authorize This Doctor Change
      hint: Confirm authorization
      type: select_one
      options:
      - Yes, I Authorize
      - 'No'
      required: true
