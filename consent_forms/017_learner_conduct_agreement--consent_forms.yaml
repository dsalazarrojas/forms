inputSchema:
  type: object
  properties:
    title: Learner Conduct Agreement
    pages:
    - id: 1
      name: learner_conduct_agreement_1
      label: What is the definition of Learner Conduct?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: acknowledgement_1
      label: Have you read and understood the Learner Conduct Guidelines?
      hint: null
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: true
    - id: 3
      name: committed_to_guidelines_1
      label: Are you committed to following the Learner Conduct Guidelines?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: consequences_1
      label: What are the consequences of failing to follow the Learner Conduct Guidelines?
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: monitored_participation_1
      label: Do you understand that you will be monitored while participating in the
        program?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: questions_guidelines_1
      label: Do you have any questions about the Learner Conduct Guidelines?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: reviewed_conduct_1
      label: Do you understand that your conduct will be reviewed and evaluated periodically?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: meeting_expectations_1
      label: Are you aware of the consequences of not meeting expectations?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: positive_role_model_1
      label: What are your plans to promote a safe and respectful learning environment?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: treat_others_with_respect_1
      label: Are you committed to treating others with respect and kindness?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: no_bullying_1
      label: Do you understand that bullying or harassing behavior will not be tolerated?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: positive_role_model_2
      label: Do you understand the importance of being a positive role model?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: signature_1
      label: Signature
      hint: null
      type: text
      options: []
      required: true
