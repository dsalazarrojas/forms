inputSchema:
  type: object
  properties:
    title: Craft Workshop Waiver Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: emergency_contact_relationship
      label: Relationship
      hint: null
      type: select_multiple
      options:
      - Emergency Contact Person
      - Family Member
      - Parent
      - Other
      required: false
    - id: 7
      name: participant_age
      label: Participant Age
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: participant_dob
      label: Participant Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: workshop_name
      label: Workshop Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: participant_signature
      label: Participant Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: emergency_contact_signature
      label: Emergency Contact Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: workshop_date
      label: Workshop Date
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: workshop_time
      label: Workshop Time
      hint: null
      type: time
      options: []
      required: false
    - id: 14
      name: waiver
      label: Waiver
      hint: null
      type: select_one
      options:
      - I have read and understood all of the information above, and I am willing
        to participate in this craft workshop.
      - 'False'
      required: false
    - id: 15
      name: waiver_signature
      label: Waiver Signature
      hint: null
      type: text
      options: []
      required: false
