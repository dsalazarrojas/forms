inputSchema:
  type: object
  properties:
    title: Academic Expert Interview Form
    pages:
    - id: 1
      name: section_interview_overview
      label: -- Interview Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: expert_name
      label: Expert name
      hint: Full name of interviewee
      type: text
      options: []
      required: true
    - id: 3
      name: affiliation
      label: Affiliation
      hint: Institution or organization
      type: text
      options: []
      required: false
    - id: 4
      name: contact_email
      label: Contact email
      hint: For scheduling and follow up
      type: email
      options: []
      required: true
    - id: 5
      name: interview_date
      label: Proposed interview date
      hint: Preferred or scheduled date
      type: date
      options: []
      required: false
    - id: 6
      name: consent_to_record
      label: Consent to record interview
      hint: Permission to record audio or video
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: consent_to_publish
      label: Consent to publish interview materials
      hint: Permission to use quotes or media in publications
      type: select_one
      options:
      - 'True'
      - 'False'
      - With approval on quotes
      required: true
    - id: 8
      name: topics_to_discuss
      label: Topics to discuss
      hint: Key themes or questions for the interview
      type: text
      options: []
      required: false
    - id: 9
      name: interviewer_name
      label: Interviewer name
      hint: Person conducting the interview
      type: text
      options: []
      required: true
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Any special instructions or considerations
      type: text
      options: []
      required: false
