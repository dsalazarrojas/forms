      type: text
      options: []
      required: false
    - id: 4
      name: note
      label: note
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: team_consent
      label: team_consent
      hint: null
      type: select_one
      options:
      - Team consent
      - Other
      required: false
    - id: 6
      name: both_consent
      label: both_consent
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: submit
      label: submit
      hint: null
      type: text
      options: []
      required: false
