inputSchema:
  type: object
  properties:
    title: Church Transportation Consent Form
    pages:
    - id: 1
      name: child_name
      label: Child's Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: child_date_of_birth
      label: Child's Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: parent_name
      label: Parent/Guardian Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: parent_email
      label: Parent/Guardian Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: parent_phone
      label: Parent/Guardian Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 6
      name: home_address
      label: Home Address
      hint: Street, city, state, zip
      type: text
      options: []
      required: true
    - id: 7
      name: emergency_contact
      label: Emergency Contact Name and Phone
      hint: If parent unavailable
      type: text
      options: []
      required: true
    - id: 8
      name: event_name
      label: Event or Activity Name
      hint: What event requires transportation
      type: text
      options: []
      required: true
    - id: 9
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: departure_location
      label: Departure Location
      hint: Where will transportation depart from
      type: text
      options: []
      required: true
    - id: 11
      name: departure_time
      label: Departure Time
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: return_location
      label: Return Location
      hint: Where will transportation return to
      type: text
      options: []
      required: true
    - id: 13
      name: return_time
      label: Expected Return Time
      hint: null
      type: time
      options: []
      required: true
    - id: 14
      name: transportation_type
      label: Type of Transportation
      hint: null
      type: select_one
      options:
      - Church Van
      - Church Bus
      - Chartered Bus
      - Volunteer Vehicles
      - Other
      required: true
    - id: 15
      name: medical_conditions
      label: Does Your Child Have Any Medical Conditions
      hint: We should be aware of
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: medical_conditions_detail
      label: Please Describe Medical Conditions
      hint: Include medications, allergies, etc.
      type: text
      options: []
      required: false
    - id: 17
      name: special_needs
      label: Does Your Child Have Any Special Needs
      hint: For transportation
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 18
      name: special_needs_detail
      label: Please Describe Special Needs
      hint: Mobility, behavioral, etc.
      type: text
      options: []
      required: false
    - id: 19
      name: car_sickness
      label: Is Your Child Prone to Car Sickness
      hint: null
      type: select_one
      options:
      - Yes, often
      - Yes, occasionally
      - 'False'
      - Not sure
      required: true
    - id: 20
      name: behavior_expectations
      label: Behavior Expectations Acknowledgment
      hint: Child must follow safety rules
      type: select_one
      options:
      - I understand and agree
      - I have questions
      required: true
    - id: 21
      name: pickup_authorization
      label: Who Is Authorized to Pick Up Your Child
      hint: List all individuals
      type: text
      options: []
      required: true
    - id: 22
      name: consent_grant
      label: Transportation Consent
      hint: I grant permission for my child to use church transportation
      type: select_one
      options:
      - Yes, I grant permission
      - No, I do not grant permission
      required: true
    - id: 23
      name: liability_understanding
      label: Liability Understanding
      hint: Transportation is provided as a service
      type: select_one
      options:
      - I understand the terms
      - I have questions
      required: true
    - id: 24
      name: parent_signature
      label: Parent/Guardian Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 25
      name: signature_date
      label: Date of Signature
      hint: null
      type: date
      options: []
      required: true
