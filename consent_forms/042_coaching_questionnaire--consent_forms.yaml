inputSchema:
  type: object
  properties:
    title: Coaching Questionnaire
    pages:
    - id: 1
      name: client_name
      label: Full Name
      hint: Your legal full name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: For identification purposes
      type: date
      options: []
      required: true
    - id: 5
      name: mailing_address
      label: Mailing Address
      hint: Your full address
      type: text
      options: []
      required: true
    - id: 6
      name: occupation
      label: Current Occupation
      hint: Your job or profession
      type: text
      options: []
      required: true
    - id: 7
      name: employer
      label: Employer Name
      hint: Name of your organization
      type: text
      options: []
      required: false
    - id: 8
      name: marital_status
      label: Marital Status
      hint: Your relationship status
      type: select_one
      options:
      - Single
      - Married
      - Divorced
      - Widowed
      - In a Relationship
      - Separated
      required: false
    - id: 9
      name: dependents_count
      label: Number of Dependents
      hint: How many people depend on you
      type: number
      options: []
      required: false
    - id: 10
      name: coaching_type
      label: Type of Coaching Seeking
      hint: What coaching do you want
      type: select_one
      options:
      - Life Coaching
      - Career Coaching
      - Executive Coaching
      - Health Coaching
      - Business Coaching
      - Relationship Coaching
      required: true
    - id: 11
      name: primary_reason
      label: Primary Reason for Seeking Coaching
      hint: What brings you to coaching
      type: text
      options: []
      required: true
    - id: 12
      name: coaching_goals
      label: Coaching Goals
      hint: What do you want to achieve
      type: text
      options: []
      required: true
    - id: 13
      name: medical_conditions
      label: Current Medical Conditions
      hint: List any health conditions
      type: text
      options: []
      required: false
    - id: 14
      name: chronic_illnesses
      label: Chronic Illnesses or Diseases
      hint: Any chronic conditions
      type: text
      options: []
      required: false
    - id: 15
      name: current_medications
      label: Current Medications
      hint: List all medications
      type: text
      options: []
      required: false
    - id: 16
      name: allergies
      label: Allergies
      hint: Any known allergies
      type: text
      options: []
      required: false
    - id: 17
      name: mental_health_history
      label: Mental Health History
      hint: Any mental health conditions
      type: text
      options: []
      required: false
    - id: 18
      name: currently_in_therapy
      label: Currently Seeing Therapist
      hint: Are you in therapy now
      type: select_one
      options:
      - true
      - false
      - Previously
      required: false
    - id: 19
      name: therapist_name
      label: Therapist Name
      hint: Name of your therapist
      type: text
      options: []
      required: false
    - id: 20
      name: sleep_patterns
      label: Sleep Patterns
      hint: Describe your sleep habits
      type: text
      options: []
      required: false
    - id: 21
      name: exercise_habits
      label: Exercise Habits
      hint: Describe your activity level
      type: select_one
      options:
      - Sedentary
      - Light Activity
      - Moderate Activity
      - Very Active
      - Athlete
      required: false
    - id: 22
      name: diet_nutrition
      label: Diet and Nutrition
      hint: Describe your eating habits
      type: text
      options: []
      required: false
    - id: 23
      name: substance_use
      label: Alcohol or Substance Use
      hint: Describe your consumption
      type: text
      options: []
      required: false
    - id: 24
      name: smoking_status
      label: Smoking Status
      hint: Do you smoke
      type: select_one
      options:
      - Never Smoked
      - Former Smoker
      - Current Smoker
      required: false
    - id: 25
      name: stress_level
      label: Current Stress Level
      hint: Rate your stress 1 to 10
      type: select_one
      options:
      - 1-2 Low
      - 3-4 Mild
      - 5-6 Moderate
      - 7-8 High
      - 9-10 Very High
      required: true
    - id: 26
      name: stress_sources
      label: Sources of Stress
      hint: What causes you stress
      type: text
      options: []
      required: false
    - id: 27
      name: support_system
      label: Support System
      hint: Describe your support network
      type: select_one
      options:
      - Strong Support
      - Some Support
      - Limited Support
      - No Support
      required: false
    - id: 28
      name: life_satisfaction
      label: Overall Life Satisfaction
      hint: Rate your satisfaction
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 29
      name: previous_coaching
      label: Previous Coaching Experience
      hint: Have you had coaching before
      type: text
      options: []
      required: false
    - id: 30
      name: expectations
      label: Expectations from Coaching
      hint: What do you expect
      type: text
      options: []
      required: true
    - id: 31
      name: consent_to_coaching
      label: I Consent to Coaching Services
      hint: You agree to receive coaching
      type: select_one
      options:
      - Yes I Consent
      - false
      required: true
    - id: 32
      name: information_accuracy
      label: I Confirm Information Is Accurate
      hint: You confirm all info is true
      type: select_one
      options:
      - Yes I Confirm
      - false
      required: true
    - id: 33
      name: questionnaire_date
      label: Questionnaire Date
      hint: Today date
      type: date
      options: []
      required: true
