inputSchema:
  type: object
  properties:
    title: Doula Contract Form
    pages:
    - id: 1
      name: contract_details
      label: Contract Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: client_info
      label: Client Info
      hint: null
      type: select_multiple
      options:
      - Name
      - Address
      - Phone Number
      required: true
    - id: 3
      name: doula_info
      label: Doula Info
      hint: null
      type: select_one
      options:
      - Doula A
      - Doula B
      - Doula C
      required: true
    - id: 4
      name: contract_start_date
      label: Contract Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: contract_end_date
      label: Contract End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: contract_notes
      label: Contract Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: client_agreement
      label: Client Agreement
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: doulas_agreement
      label: Doulas Agreement
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: contract_type
      label: Contract Type
      hint: null
      type: select_one
      options:
      - Contract Type A
      - Contract Type B
      - Contract Type C
      required: true
    - id: 10
      name: contract_status
      label: Contract Status
      hint: null
      type: select_one
      options:
      - Draft
      - Active
      - Inactive
      required: true
    - id: 11
      name: agreement_terms
      label: Agreement Terms
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: contract_terms
      label: Contract Terms
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: contract_review
      label: Contract Review
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: doula_signature
      label: Doula Signature
      hint: null
      type: text
      options: []
      required: false
