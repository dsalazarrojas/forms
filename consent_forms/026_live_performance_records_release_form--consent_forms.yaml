inputSchema:
  type: object
  properties:
    title: Live Performance Records Release Form
    pages:
    - id: 1
      name: artist_info
      label: Artist Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: permission
      label: Permission
      hint: null
      type: select_one
      options:
      - Recording
      - Distribution
      - Both
      - Neither
      required: false
    - id: 3
      name: recording
      label: Recording
      hint: null
      type: select_multiple
      options:
      - Video
      - Audio
      - Photographs
      required: false
    - id: 4
      name: distribution
      label: Distribution
      hint: null
      type: select_multiple
      options:
      - Online
      - Offline
      - Live Stream
      required: false
    - id: 5
      name: agreement
      label: Agreement
      hint: Please sign below to indicate your consent.
      type: note
      options: []
      required: false
    - id: 6
      name: signature
      label: Signature
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: date_of_performance
      label: Date of Performance
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: artist
      label: Artist
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: manager
      label: Manager
      hint: null
      type: text
      options: []
      required: false
