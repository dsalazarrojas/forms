inputSchema:
  type: object
  properties:
    title: Pet Vaccination Declaration Form
    pages:
    - id: 1
      name: pet_vaccination_declaration_form_pet_owner
      label: pet_owner
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: pet_vaccination_declaration_form_vaccination_status
      label: vaccination_status
      hint: null
      type: select_one
      options:
      - Vaccinated
      - Not vaccinated
      - Unknown
      required: false
    - id: 3
      name: pet_vaccination_declaration_form_vaccination_date
      label: vaccination_date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: pet_vaccination_declaration_form_vaccination_type
      label: vaccination_type
      hint: null
      type: select_multiple
      options:
      - Rabies
      - Parvovirus
      - Distemper
      - Other
      - None
      required: false
    - id: 5
      name: pet_vaccination_declaration_form_additional_comments
      label: additional_comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: pet_vaccination_declaration_form_vaccination_history
      label: vaccination_history
      hint: null
      type: select_multiple
      options:
      - Up-to-date
      - Out-of-date
      - Never vaccinated
      required: false
    - id: 7
      name: pet_vaccination_declaration_form_email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: pet_vaccination_declaration_form_phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
