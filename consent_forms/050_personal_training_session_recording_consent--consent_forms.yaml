inputSchema:
  type: object
  properties:
    title: Personal Training Session Recording Consent
    pages:
    - id: 1
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: session_duration
      label: Session Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: session_recording
      label: Session Recording
      hint: null
      type: select_one
      options:
      - '{''value'': ''video''}'
      - '{''value'': ''audio''}'
      - '{''value'': ''both''}'
      - '{''value'': ''neither''}'
      required: false
    - id: 5
      name: session_recording_method
      label: Recording Method
      hint: null
      type: select_one
      options:
      - '{''value'': ''video''}'
      - '{''value'': ''audio''}'
      - '{''value'': ''both''}'
      - '{''value'': ''live''}'
      - '{''value'': ''none''}'
      required: false
    - id: 6
      name: client_confirmation
      label: Client Confirmation
      hint: Please confirm client consent
      type: select_one
      options:
      - '{''value'': True}'
      - '{''value'': False}'
      required: false
    - id: 7
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
