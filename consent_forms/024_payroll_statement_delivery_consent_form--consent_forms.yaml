inputSchema:
  type: object
  properties:
    title: Payroll Statement Delivery Consent Form
    pages:
    - id: 1
      name: employee_consent
      label: Is this correct
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: consent_to_send
      label: Consent to receive electronic delivery
      hint: null
      type: select_multiple
      options:
      - Payroll statements to home
      - Payroll statements to email
      - Both
      required: false
    - id: 3
      name: consent_date
      label: Delivery start date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: consent_to_statement_type
      label: type of statements to be delivered
      hint: Select all that apply
      type: select_multiple
      options:
      - Pay stubs
      - Payroll summary
      - Benefits details
      required: false
    - id: 5
      name: email_address
      label: Email address
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone_number
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
