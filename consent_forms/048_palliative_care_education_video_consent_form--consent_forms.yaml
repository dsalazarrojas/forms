inputSchema:
  type: object
  properties:
    title: Palliative Care Education Video Consent Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: Enter participant's email
      type: email
      options: []
      required: false
    - id: 3
      name: consent_date
      label: Consent Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: video_release
      label: Video Release
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: education_program
      label: Education Program
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: hospice_hospital
      label: Hospice or Hospital
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: other_education
      label: Other Education
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: participant_signature
      label: Participant Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: education_program_other
      label: Other Education Programs
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: participant_email
      label: Confirm Email
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
