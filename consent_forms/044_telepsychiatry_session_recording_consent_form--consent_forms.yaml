inputSchema:
  type: object
  properties:
    title: Telepsychiatry Session Recording Consent Form
    pages:
    - id: 1
      name: consent_form
      label: Consent Form
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: client_email
      label: Client Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: recording_agreement
      label: Recording Agreement
      hint: null
      type: note
      options: []
      required: true
    - id: 8
      name: consent_to_record
      label: Consent to Record
      hint: null
      type: select_one
      options:
      - Client agrees to be recorded
      - Client does not agree to be recorded
      required: true
    - id: 9
      name: consent_to_share
      label: Consent to Share
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: recording_location
      label: Recording Location
      hint: null
      type: select_one
      options:
      - Remote
      - In-person
      required: true
    - id: 11
      name: session_length
      label: Session Length
      hint: null
      type: select_one
      options:
      - 15 minutes
      - 30 minutes
      - 60 minutes
      required: true
    - id: 12
      name: recording_device
      label: Recording Device
      hint: null
      type: select_one
      options:
      - Webcam
      - Phone
      required: true
    - id: 13
      name: recording_quality
      label: Recording Quality
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 14
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: client_signature
      label: Client Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 16
