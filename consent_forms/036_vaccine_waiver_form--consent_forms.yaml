inputSchema:
  type: object
  properties:
    title: Vaccine Waiver Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Info
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: reason_not_vaccinated
      label: Reason Not Vaccinated
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: physician_signature
      label: Physician Signature
      hint: null
      type: select_one
      options:
      - Dr. John Doe
      - Dr. Jane Smith
      required: false
    - id: 7
      name: patient_signature
      label: Patient Signature
      hint: null
      type: select_one
      options:
      - Signature
      - Other
      required: false
