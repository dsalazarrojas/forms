inputSchema:
  type: object
  properties:
    title: Genetic Testing Consent Form
    pages:
    - id: 1
      name: patient_information
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: testing_details
      label: Testing Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - I agree to proceed with genetic testing.
      - I do not agree to proceed with genetic testing.
      required: true
    - id: 4
      name: genetic_testing_procedure
      label: Genetic Testing Procedure
      hint: null
      type: text
      options: []
      required: false
