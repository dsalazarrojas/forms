inputSchema:
  type: object
  properties:
    title: Clinical Ethics Research Participation Consent Form
    pages:
    - id: 1
      name: study_section
      label: -- Study Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: study_title
      label: Study Title
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: principal_investigator
      label: Principal Investigator
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: study_description
      label: Study Description
      hint: What is the study about?
      type: text
      options: []
      required: true
    - id: 5
      name: participant_section
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: risks_section
      label: -- Risks and Discomforts --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: risks_description
      label: Description of potential risks
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: severity_level
      label: Severity of potential risks
      hint: null
      type: select_one
      options:
      - Minimal
      - Low
      - Moderate
      - High
      required: true
    - id: 13
      name: benefits_section
      label: -- Benefits --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: direct_benefits
      label: Direct benefits to participant
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: general_benefits
      label: General benefits to society
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: participation_section
      label: -- Participation Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: time_commitment
      label: Time commitment required
      hint: Hours or visits per week/month
      type: text
      options: []
      required: true
    - id: 18
      name: procedures
      label: Study procedures
      hint: What will participant be asked to do?
      type: text
      options: []
      required: true
    - id: 19
      name: confidentiality_section
      label: -- Confidentiality and Privacy --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: data_protection
      label: How data will be protected and stored
      hint: null
      type: text
      options: []
      required: true
    - id: 21
      name: data_usage
      label: How data will be used
      hint: null
      type: text
      options: []
      required: true
    - id: 22
      name: rights_section
      label: -- Participant Rights --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: voluntary_participation
      label: Participation is voluntary
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 24
      name: withdrawal_rights
      label: I understand I can withdraw at any time
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 25
      name: informed_consent
      label: I have read and understand this consent form
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 26
      name: participation_agreement
      label: I agree to participate in this research study
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
