inputSchema:
  type: object
  properties:
    title: Personal Data Processing Consent Form
    pages:
    - id: 1
      name: personal_data_processing_consent
      label: Data Processing
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: data_protection_regulations
      label: Data Protection Regulations
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: data_processing_purposes
      label: Data Processing Purposes
      hint: null
      type: select_one
      options:
      - For direct marketing
      - For direct sales
      - For customer service
      - Other
      required: true
    - id: 4
      name: data_processing_duration
      label: Data Processing Duration
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: data_storage_location
      label: Data Storage Location
      hint: null
      type: select_multiple
      options:
      - On-premises
      - Cloud
      - Other
      required: false
    - id: 6
      name: data_security_measurements
      label: Data Security Measures
      hint: null
      type: select_multiple
      options:
      - Encryption
      - Access controls
      - Pseudonymization
      - Anonymization
      - Other
      required: false
    - id: 7
      name: data_breach_notification
      label: Data Breach Notification
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Other
      required: false
    - id: 8
      name: data_subjects_rights
      label: Data Subjects Rights
      hint: null
      type: select_multiple
      options:
      - Right to access
      - Right to rectification
      - Right to objection
      - Right to erasure
      - Other
      required: true
    - id: 9
      name: data_processing_gdpr_compliance
      label: GDPR Compliance
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: data_subjects_age
      label: Age of Data Subjects
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: data_processing_termination
      label: Data Processing Termination
      hint: null
      type: select_one
      options:
      - On demand
      - On data protection regulation expiration
      required: false
    - id: 12
      name: data_storage_capacity
      label: Data Storage Capacity
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: data_subjects_residence
      label: Data Subjects Residence
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: data_subjects_country
      label: Data Subjects Country
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: data_subjects_state
      label: Data Subjects State
      hint: null
      type: select_multiple
      options:
      - State A
      - State B
      required: false
    - id: 16
      name: data_breach_notification_channel
      label: Data Breach Notification Channel
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Other
      required: false
    - id: 17
      name: data_processing_start_date
      label: Data Processing Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 18
      name: data_processing_end_date
      label: Data Processing End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 19
      name: data_storage_device
      label: Data Storage Device
      hint: null
      type: select_multiple
      options:
      - Laptop
      - Smartphone
      - Other
      required: false
    - id: 20
      name: data_subjects_gender
      label: Data Subjects Gender
      hint: null
      type: select_multiple
      options:
      - Male
      - Female
      - Other
      required: false
    - id: 21
      name: data_subjects_marital_status
      label: Data Subjects Marital Status
      hint: null
      type: select_multiple
      options:
      - Married
      - Single
      - Other
      required: false
    - id: 22
      name: data_subjects_income
      label: Data Subjects Income
      hint: null
      type: select_multiple
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 23
      name: data_subjects_job_title
      label: Data Subjects Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: data_subjects_company
      label: Data Subjects Company
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: data_subjects_email
      label: Data Subjects Email
      hint: null
      type: email
      options: []
      required: false
