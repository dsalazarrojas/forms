inputSchema:
  type: object
  properties:
    title: TV Series Release Form
    pages:
    - id: 1
      name: participant_info
      label: participant_info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: release_consent_participant
      label: release_consent_participant
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Undetermined
      required: false
    - id: 3
      name: release_questions
      label: release_questions
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: on_location_participation
      label: on_location_participation
      hint: null
      type: select_multiple
      options:
      - Cast
      - Contributor
      - On-Location
      required: false
    - id: 5
      name: media_usage
      label: media_usage
      hint: null
      type: select_one
      options:
      - Film
      - TV
      - Online
      - Print
      required: false
    - id: 6
      name: date_of_consent
      label: date_of_consent
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: signature_date
      label: signature_date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: on_location_contact_info
      label: on_location_contact_info
      hint: null
      type: text
      options: []
      required: false
