inputSchema:
  type: object
  properties:
    title: Dental Records Release Form
    pages:
    - id: 1
      name: patient_name
      label: Name
      hint: Patient's name
      type: text
      options: []
      required: true
    - id: 2
      name: healthcare_provider_name
      label: Healthcare Provider
      hint: Name of the healthcare provider
      type: text
      options: []
      required: false
    - id: 3
      name: reason_for_requesting_records
      label: Reason for Requesting Records
      hint: Reason for requesting the patient's dental records
      type: text
      options: []
      required: true
    - id: 4
      name: patient_signature
      label: Patient Signature
      hint: Sign here to confirm
      type: note
      options: []
      required: true
    - id: 5
      name: date_of_request
      label: Date of Request
      hint: Date when requesting the patient's dental records
      type: date
      options: []
      required: false
    - id: 6
      name: address
      label: Address
      hint: Address to send the records to
      type: text
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 8
      name: medical_group
      label: Medical Group
      hint: Are you a part of a medical group?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: doctor_name
      label: Doctor's Name
      hint: Name of the doctor providing care
      type: text
      options: []
      required: false
    - id: 10
      name: doctor_specialty
      label: Doctor's Specialty
      hint: Specialty of the doctor providing care
      type: text
      options: []
      required: false
    - id: 11
      name: patient_age
      label: Patient Age
      hint: Age of the patient
      type: number
      options: []
      required: false
    - id: 12
      name: patient_sex
      label: Patient Sex
      hint: Sex of the patient
      type: select_one
      options:
      - Male
      - Female
      required: true
    - id: 13
      name: medical_record_id
      label: Medical Record ID
      hint: ID of the patient's medical record
      type: text
      options: []
      required: true
    - id: 14
      name: patient_medical_record
      label: Patient Medical Record
      hint: Medical record number
      type: text
      options: []
      required: false
    - id: 15
      name: patient_race
      label: Patient Race
      hint: Race of the patient
      type: select_one
      options:
      - White
      - Black
      - Asian
      required: true
    - id: 16
      name: doctor_medical_record
      label: Doctor Medical Record
      hint: Medical record number
      type: text
      options: []
      required: false
    - id: 17
      name: patient_medical_record_2
      label: Patient Medical Record 2
      hint: Medical record number
      type: text
      options: []
      required: false
    - id: 18
      name: doctor_specialty_2
      label: Doctor Specialty 2
      hint: Specialty of the doctor providing care
      type: text
      options: []
      required: false
