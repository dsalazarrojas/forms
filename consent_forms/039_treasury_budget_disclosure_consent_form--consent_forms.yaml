      name: financial_institutions_aware
      label: Financial Institutions Aware
      hint: null
      type: select_one
      options:
      - '{''value'': 1, ''label'': True}'
      - '{''value'': 2, ''label'': False}'
      required: false
    - id: 3
      name: financial_institutions_aware_how_many
      label: How Many
      hint: Number of financial institutions (1-20)
      type: number
      options: []
      required: false
    - id: 4
      name: financial_institutions_aware_type
      label: Type of Institution
      hint: null
      type: select_multiple
      options:
