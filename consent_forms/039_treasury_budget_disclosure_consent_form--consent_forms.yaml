      - '{''value'': ''credit_union'', ''label'': ''Credit Union''}'
      - '{''value'': ''investment_institution'', ''label'': ''Investment Institution''}'
      - '{''value'': ''government_agency'', ''label'': ''Government Agency''}'
      required: false
    - id: 5
      name: financial_institutions_aware_what_type
      label: What Type
      hint: null
      type: select_one
      options:
