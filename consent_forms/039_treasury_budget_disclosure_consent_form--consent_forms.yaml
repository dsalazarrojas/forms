      - '{''value'': ''consumer'', ''label'': ''Consumer''}'
      - '{''value'': ''industrial'', ''label'': ''Industrial''}'
      - '{''value'': ''investment'', ''label'': ''Investment''}'
      - '{''value'': ''non_commercial'', ''label'': ''Non-Commercial''}'
