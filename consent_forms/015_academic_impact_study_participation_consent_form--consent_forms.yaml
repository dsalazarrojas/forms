inputSchema:
  type: object
  properties:
    title: Academic Impact Study Participation Consent Form
    pages:
    - id: 1
      name: consent_header
      label: -- Study Participation Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Contact email
      hint: Email for study communications
      type: email
      options: []
      required: true
    - id: 4
      name: study_description
      label: Study description
      hint: Brief summary of the study purpose
      type: text
      options: []
      required: true
    - id: 5
      name: risks_and_benefits
      label: Risks and benefits
      hint: Summary of potential risks and benefits
      type: text
      options: []
      required: true
    - id: 6
      name: data_usage
      label: How data will be used
      hint: Analysis, reporting, and sharing details
      type: text
      options: []
      required: true
    - id: 7
      name: consent_to_participate
      label: Consent to participate
      hint: Confirm consent to participate in study
      type: select_one
      options:
        - I consent
        - I do not consent
      required: true
    - id: 8
      name: withdrawal_rights
      label: Withdrawal rights
      hint: Information on how to withdraw from study
      type: note
      options: []
      required: false
    - id: 9
      name: signature
      label: Signature confirmation
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 10
      name: date
      label: Date of consent
      hint: Date when consent was given
      type: date
      options: []
      required: true
