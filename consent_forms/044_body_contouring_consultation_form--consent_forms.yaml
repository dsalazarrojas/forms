inputSchema:
  type: object
  properties:
    title: Body Contouring Consultation Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: gender
      label: Gender
      hint: Select
      type: select_one
      options:
      - Female
      - Male
      - Non-Binary
      - Prefer Not to Say
      required: true
    - id: 7
      name: height
      label: Height
      hint: In feet and inches
      type: text
      options: []
      required: true
    - id: 8
      name: current_weight
      label: Current Weight
      hint: In pounds
      type: number
      options: []
      required: true
    - id: 9
      name: goal_weight
      label: Goal Weight
      hint: Target weight
      type: number
      options: []
      required: false
    - id: 10
      name: bmi
      label: Current BMI
      hint: If known
      type: number
      options: []
      required: false
    - id: 11
      name: primary_concern
      label: Primary Concern
      hint: What bothers you most?
      type: text
      options: []
      required: true
    - id: 12
      name: treatment_goals
      label: Treatment Goals
      hint: What do you hope to achieve?
      type: text
      options: []
      required: true
    - id: 13
      name: areas_of_interest
      label: Areas of Interest
      hint: Select all that apply
      type: select_multiple
      options:
      - Abdomen
      - Flanks/Love Handles
      - Thighs
      - Buttocks
      - Arms
      - Back
      - Chin/Neck
      - Bra Fat
      - Male Chest
      - Knees
      - Calves
      required: true
    - id: 14
      name: preferred_procedure
      label: Preferred Procedure
      hint: If you have a preference
      type: select_one
      options:
      - Not Sure
      - CoolSculpting
      - SculpSure
      - Vanquish
      - truSculpt
      - Emsculpt
      - Radiofrequency
      - Ultrasound
      - Laser Lipolysis
      required: false
    - id: 15
      name: previous_consultations
      label: Previous Consultations
      hint: Have you consulted elsewhere?
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
    - id: 16
      name: medical_conditions
      label: Medical Conditions
      hint: List any relevant conditions
      type: text
      options: []
      required: false
    - id: 17
      name: current_medications
      label: Current Medications
      hint: List all medications
      type: text
      options: []
      required: false
    - id: 18
      name: allergies
      label: Allergies
      hint: List any allergies
      type: text
      options: []
      required: false
    - id: 19
      name: surgical_history
      label: Surgical History
      hint: List relevant surgeries
      type: text
      options: []
      required: false
    - id: 20
      name: lifestyle_factors
      label: Lifestyle Factors
      hint: Diet and exercise routine
      type: text
      options: []
      required: false
    - id: 21
      name: smoking_status
      label: Smoking Status
      hint: Do you smoke?
      type: select_one
      options:
      - Non-Smoker
      - Former Smoker
      - Current Smoker
      required: false
    - id: 22
      name: timeline
      label: Treatment Timeline
      hint: When do you want to start?
      type: select_one
      options:
      - Immediately
      - Within 1 Month
      - Within 3 Months
      - Within 6 Months
      - Just Researching
      required: true
    - id: 23
      name: budget_range
      label: Budget Range
      hint: Estimated budget
      type: select_one
      options:
      - Under $1,000
      - $1,000 - $3,000
      - $3,001 - $5,000
      - $5,001 - $10,000
      - Over $10,000
      - Flexible
      required: false
    - id: 24
      name: special_events
      label: Special Events
      hint: Working toward a specific event?
      type: text
      options: []
      required: false
    - id: 25
      name: questions_for_provider
      label: Questions for Provider
      hint: What would you like to know?
      type: text
      options: []
      required: false
    - id: 26
      name: consultation_type
      label: Consultation Type
      hint: How do you want to consult?
      type: select_one
      options:
      - In-Person
      - Virtual/Video
      - Phone
      required: true
    - id: 27
      name: preferred_date
      label: Preferred Consultation Date
      hint: When do you want to meet?
      type: date
      options: []
      required: false
    - id: 28
      name: referral_name
      label: Referred By
      hint: Who referred you?
      type: text
      options: []
      required: false
    - id: 29
      name: additional_notes
      label: Additional Notes
      hint: Any other information
      type: text
      options: []
      required: false
