        label: -- Authorization Statement --
        hint: null
        type: note
        options: []
        required: false
      - id: 12
        name: grandparent_travel_auth
        label: I authorize my child to travel with their grandparents
        hint: Direct legal authorization
        type: select_one
        options:
          - label: Yes - Authorization Granted
            value: yes
          - label: No - Stay Home
            value: no
        required: true
      - id: 13
        name: signature_type
        label: Electronic Signature - Type Full Name
        hint: Parent or legal guardian signature
        type: text
        options: []
        required: true
      - id: 14
        name: signature_date
        label: Date of Signing
        hint: Today date
        type: date
        options: []
        required: true
