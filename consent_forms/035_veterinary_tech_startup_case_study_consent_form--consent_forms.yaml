inputSchema:
  type: object
  properties:
    title: Veterinary Tech Startup Case Study Consent Form
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: role
      label: Role
      hint: null
      type: select_one
      options:
      - Vets
      - Vet Techs
      - Clinic Staff
      required: false
    - id: 6
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: consent
      label: Consent
      hint: null
      type: select_multiple
      options:
      - I consent to participate in this study
      - I do not consent to participate in this study
      required: false
    - id: 8
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
