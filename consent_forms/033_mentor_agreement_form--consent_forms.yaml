inputSchema:
  type: object
  properties:
    title: Mentor Agreement Form
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: mentor_info
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: terms_agreement
      label: Terms of Agreement
      hint: null
      type: select_one
      options:
      - Agreement 1
      - Agreement 2
      - Agreement 3
      - Agreement 4
      - Agreement 5
      - Agreement 6
      - Agreement 7
      - Agreement 8
      required: true
    - id: 5
      name: is_first_mentor
      label: Are you a first-time mentor for this program?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 6
      name: review_date_time
      label: Review Date and Time
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: signature
      label: Digital Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: contact_info_2
      label: Contact Info
      hint: null
      type: select_one
      options:
      - Contact Info 1
      - Contact Info 2
      - Contact Info 3
      required: true
    - id: 9
      name: payment_term
      label: Payment Term
      hint: null
      type: select_one
      options:
      - Term 1
      - Term 2
      - Term 3
      required: true
    - id: 10
      name: payment_terms
      label: Payment Terms
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: payment_terms2
      label: Payment Terms 2
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
