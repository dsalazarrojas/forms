inputSchema:
  type: object
  properties:
    title: Automotive Model Release Test Drive Form
    pages:
    - id: 1
      name: section_header_participant
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: participant_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: participant_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: section_header_address
      label: -- Current Address --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: street_address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: zip_code
      label: Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: section_header_license
      label: -- Driver License Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: drivers_license_number
      label: Driver License Number
      hint: Last 4 digits for security
      type: text
      options: []
      required: true
    - id: 13
      name: drivers_license_state
      label: Driver License State
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: license_expiration
      label: Driver License Expiration Date
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: section_header_vehicle
      label: -- Test Drive Vehicle Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: model_interested
      label: Model Interested in Driving
      hint: null
      type: select_one
      options:
      - Sedan
      - SUV
      - Truck
      - Crossover
      - Sports Car
      - Other
      required: true
    - id: 17
      name: specific_model
      label: Specific Model Year
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: test_drive_date
      label: Preferred Test Drive Date
      hint: null
      type: date
      options: []
      required: true
    - id: 19
      name: test_drive_time
      label: Preferred Time
      hint: null
      type: select_one
      options:
      - Morning (9 AM - 12 PM)
      - Afternoon (12 PM - 3 PM)
      - Late Afternoon (3 PM - 6 PM)
      - Flexible
      required: true
    - id: 20
      name: section_header_consent
      label: -- Consent and Release --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: verify_insurance
      label: I have valid auto insurance
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 22
      name: agree_rules
      label: I agree to follow all dealership and vehicle rules
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 23
      name: liability_waiver
      label: I release the dealership from liability during test drive
      hint: null
      type: select_one
      options:
      - I accept
      - I do not accept
      required: true
    - id: 24
      name: media_release
      label: I consent to photos or video during test drive for promotional use
      hint: null
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 25
      name: signature_date
      label: Date of Consent
      hint: null
      type: date
      options: []
      required: true
