inputSchema:
  type: object
  properties:
    title: Child Assent Form
    pages:
    - id: 1
      name: assent_intro
      label: -- Child Assent Form --
      hint: Agreement to participate in research or procedure
      type: note
      options: []
      required: false
    - id: 2
      name: child_name
      label: Your name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: study_title
      label: Study or procedure title
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: investigator_name
      label: Investigator or researcher name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: study_purpose
      label: Do you understand the purpose of this study?
      hint: null
      type: select_one
      options:
      - Yes, fully understand
      - Partially understand
      - Do not understand
      required: true
    - id: 8
      name: procedure_understanding
      label: Do you understand what you will be asked to do?
      hint: null
      type: select_one
      options:
      - Yes, fully understand
      - Partially understand
      - Do not understand
      required: true
    - id: 9
      name: time_commitment
      label: Do you understand how much time is involved?
      hint: null
      type: select_one
      options:
      - 'True'
      - Somewhat
      - 'False'
      required: true
    - id: 10
      name: benefit_understanding
      label: Do you understand the possible benefits?
      hint: null
      type: select_one
      options:
      - Yes, fully understand
      - Partially understand
      - Do not understand
      required: true
    - id: 11
      name: risk_understanding
      label: Do you understand the possible risks or discomforts?
      hint: null
      type: select_one
      options:
      - Yes, fully understand
      - Partially understand
      - Do not understand
      required: true
    - id: 12
      name: confidentiality_understanding
      label: Do you understand that your information will be confidential?
      hint: null
      type: select_one
      options:
      - 'True'
      - Somewhat
      - 'False'
      required: true
    - id: 13
      name: withdrawal_right
      label: Do you understand you can stop at any time?
      hint: null
      type: select_one
      options:
      - 'True'
      - Somewhat
      - 'False'
      required: true
    - id: 14
      name: questions_answered
      label: Have all your questions been answered?
      hint: null
      type: select_one
      options:
      - 'True'
      - Somewhat
      - 'False'
      - I had no questions
      required: true
    - id: 15
      name: remaining_questions
      label: Do you have any remaining questions?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: voluntary_participation
      label: I understand my participation is completely voluntary
      hint: null
      type: select_one
      options:
      - Yes, I understand
      - No, I do not understand
      required: true
    - id: 17
      name: willing_to_participate
      label: Are you willing to participate in this study?
      hint: null
      type: select_one
      options:
      - Yes, I want to participate
      - No, I do not want to participate
      - I need more time to decide
      required: true
    - id: 18
      name: parent_permission
      label: Does your parent or guardian also agree?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not yet discussed
      required: true
    - id: 19
      name: investigator_signature_authority
      label: Investigator confirms child understands the study
      hint: null
      type: select_one
      options:
      - Yes, child demonstrates understanding
      - No, further explanation needed
      required: true
    - id: 20
      name: assent_agreement
      label: I agree to participate in this study
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
