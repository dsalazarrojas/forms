inputSchema:
  type: object
  properties:
    title: Emergency Response Simulation Recording Consent Form
    pages:
    - id: 1
      name: emergency_response_simulation_role
      label: What is your role in the simulation?
      hint: null
      type: select_one
      options:
      - Simulation Participant
      - Simulation Observer
      - Simulation Instructor
      required: true
    - id: 2
      name: emergency_response_simulation_role_team
      label: What is your role in the emergency response team?
      hint: null
      type: select_one
      options:
      - Team Member
      - Team Leader
      - Supervisor
      required: true
    - id: 3
      name: date_of_birth
      label: What is your date of birth?
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: simulation_location
      label: What is the location of your role in the simulation?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: simulation_date
      label: What is the date of the simulation?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: simulation_time
      label: What is the time of the simulation?
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: simulation_recording
      label: Are you aware that the simulation will be recorded?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 8
      name: agree_to_recording
      label: Do you agree to the recording?
      hint: null
      type: checkbox
      options:
      - I agree
      - I do not agree
      required: true
    - id: 9
      name: simulation_duration
      label: What is the expected duration of the simulation?
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: emergency_contact
      label: What is the contact number of your emergency contact?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: medical_conditions
      label: Do you have any medical conditions or concerns that may affect your participation?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: supervisor_contact
      label: What is the contact number of your supervisor/parent/primary caregiver?
      hint: null
      type: text
      options: []
      required: false
