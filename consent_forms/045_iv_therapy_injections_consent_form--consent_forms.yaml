inputSchema:
  type: object
  properties:
    title: IV Therapy Injections Consent Form
    pages:
    - id: 1
      name: medical_condition
      label: Medical Condition
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: allergies
      label: Allergies
      hint: null
      type: select_multiple
      options:
      - Penicillin
      - Other
      - None
      required: false
    - id: 3
      name: medications
      label: Medications
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: medical_history
      label: Medical History
      hint: Describe your medical history
      type: note
      options: []
      required: true
    - id: 5
      name: emergency_contacts
      label: Emergency Contacts
      hint: null
      type: select_multiple
      options:
      - Name
      - Phone
      - Email
      - Address
      - Relationship
      - Contact
      required: false
    - id: 6
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      - Not Now
      - Other
      required: false
    - id: 7
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: date_signed
      label: Date Signed
      hint: null
      type: date
      options: []
      required: true
