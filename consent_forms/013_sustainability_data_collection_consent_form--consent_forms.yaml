inputSchema:
  type: object
  properties:
    title: Sustainability Data Collection Consent Form
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: sustainability_initiatives
      label: Sustainability Initiatives
      hint: null
      type: select_one
      options:
      - Climate change
      - Biodiversity
      - Water conservation
      - Energy efficiency
      - Waste reduction
      - Other (please specify)
      required: true
    - id: 3
      name: data_collection_methods
      label: Data Collection Methods
      hint: null
      type: select_one
      options:
      - Online form
      - Mail-in form
      - Phone call
      - In-person survey
      - Other (please specify)
      required: true
    - id: 4
      name: contact_info
      label: Contact Info
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Mail
      - Other (please specify)
      required: true
    - id: 5
      name: feedback_form_fields
      label: Feedback Form Fields
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: review_and_submit
      label: Review and Submit
      hint: null
      type: note
      options: []
      required: false
