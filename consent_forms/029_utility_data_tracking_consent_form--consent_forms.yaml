inputSchema:
  type: object
  properties:
    title: Utility Data Tracking Consent Form
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: utility_name
      label: Utility Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: service_address
      label: Service Address
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: consent
      label: Do you consent to
      hint: Please provide a reason for not consenting.
      type: select_one
      options:
      - '{''id'': 10, ''name'': ''consent_yes'', ''label'': True}'
      - '{''id'': 11, ''name'': ''consent_no'', ''label'': False, ''selected'': True}'
      required: true
