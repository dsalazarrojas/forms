inputSchema:
  type: object
  properties:
    title: Power Of Attorney Consent Form
    pages:
    - id: 1
      name: general_information
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: grantor
      label: Grantor
      hint: null
      type: select_one
      options:
      - Self
      - Spouse
      - Family Member
      - Friend
      - Other
      required: false
    - id: 3
      name: grantee
      label: Grantee
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: relationship
      label: Relationship
      hint: null
      type: select_multiple
      options:
      - Parent/Child
      - Spouse
      - Sibling
      - Family Friend
      - Other
      required: false
    - id: 5
      name: purpose
      label: Purpose
      hint: null
      type: select_multiple
      options:
      - Financial
      - Real Estate
      - Health Care
      - Business
      required: false
    - id: 6
      name: date_effective
      label: Date Effective
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: signed
      label: Signed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: signature_drawing
      label: Draw Signature
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: notary_public
      label: Notary Public
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
