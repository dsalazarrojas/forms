inputSchema:
  type: object
  properties:
    title: Student Success Story Release Form
    pages:
    - id: 1
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: story
      label: Story
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: publication_permissions
      label: Publication Permissions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: publication_medium
      label: Publication Medium
      hint: null
      type: select_one
      options:
      - Radio
      - Newspaper
      - Social Media
      - Magazine
      - Book
      - Other
      required: true
    - id: 7
      name: publication_date
      label: Publication Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: true
