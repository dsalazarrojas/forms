inputSchema:
  type: object
  properties:
    title: Blinks And Visions Microshading Consent Form
    pages:
    - id: 1
      name: consent_header
      label: -- Consent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of birth
      hint: For record keeping
      type: date
      options: []
      required: false
    - id: 4
      name: procedure_description
      label: Procedure description
      hint: Brief overview of microshading procedure
      type: text
      options: []
      required: true
    - id: 5
      name: risks_and_complications_acknowledged
      label: Risks and complications acknowledged
      hint: Confirm client understands potential risks
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: photos_permission
      label: Permission to take before and after photos
      hint: For medical records and portfolio use
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: allergies
      label: Known allergies
      hint: List any allergies to topical agents
      type: text
      options: []
      required: false
    - id: 8
      name: emergency_contact
      label: Emergency contact
      hint: Name and phone number
      type: text
      options: []
      required: false
    - id: 9
      name: consent_signature_name
      label: Consent signature name
      hint: Type full name to provide consent
      type: text
      options: []
      required: true
