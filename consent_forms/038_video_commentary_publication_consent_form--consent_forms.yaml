inputSchema:
  type: object
  properties:
    title: Video Commentary Publication Consent Form
    pages:
    - id: 1
      name: video_commentary_publication_consent
      label: Video Commentary Publication Consent
      hint: Please provide your consent for video commentary publication.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: participant_name
      label: Participant Name
      hint: Please enter your name.
      type: text
      options: []
      required: true
    - id: 3
      name: participant_email
      label: Participant Email
      hint: Please enter your email.
      type: email
      options: []
      required: true
    - id: 4
      name: participant_phone
      label: Participant Phone Number
      hint: Please enter your phone number.
      type: text
      options: []
      required: false
    - id: 5
      name: participant_address
      label: Participant Address
      hint: Please enter your address.
      type: text
      options: []
      required: false
    - id: 6
      name: participant_country
      label: Participant Country of Residence
      hint: Please select your country of residence.
      type: select_one
      options:
      - United States
      - Canada
      - Mexico
      - Other
      required: true
    - id: 7
      name: participant_video_commentary
      label: Participant Video Commentary
      hint: Please enter your video commentary.
      type: text
      options: []
      required: false
    - id: 8
      name: participant_video_commentary_options
      label: Participant Video Commentary Options
      hint: Select one option.
      type: select_one
      options:
      - Yes, with photos
      - No, with no photos
      - Yes, with limited photos
      required: false
    - id: 9
      name: participant_agreement
      label: Participant Agreement
      hint: Select one option.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: participant_agreement_options
      label: Participant Agreement Options
      hint: Select multiple options.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: participant_agreement_select_option
      label: Participant Agreement Select Option
      hint: Select one option.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: participant_agreement_select_option_2
      label: Participant Agreement Select Option 2
      hint: Select one option.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
