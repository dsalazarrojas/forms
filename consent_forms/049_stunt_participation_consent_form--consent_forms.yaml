inputSchema:
  type: object
  properties:
    title: Stunt Participation Consent Form
    pages:
    - id: 1
      name: participant_info
      label: Participant Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: stunt_info
      label: Stunt Information
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: stunt_participant_info
      label: Stunt Participant Information
      hint: null
      type: select_multiple
      options:
      - Participant Experience
      - Stunt Level
      - Interests
      required: true
    - id: 4
      name: submission
      label: Submission
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: agreement
      label: Agreement
      hint: Please read and agree to the terms and conditions.
      type: text
      options: []
      required: true
    - id: 6
      name: additional_info
      label: Additional Information
      hint: Any additional comments or questions about the participant.
      type: text
      options: []
      required: false
