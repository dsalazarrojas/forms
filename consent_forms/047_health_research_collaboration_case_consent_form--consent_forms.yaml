inputSchema:
  type: object
  properties:
    title: Health Research Collaboration Case Consent Form
    pages:
    - id: 1
      name: participant_information
      label: Participant Information
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: contact_details
      label: Contact Details
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: contact_number
      label: Contact Number
      hint: Enter 10 digit mobile number
      type: text
      options: []
      required: false
    - id: 4
      name: research_institution
      label: Research Institution
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: research_project
      label: Research Project
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: consent_status
      label: Consent Status
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Refused
      required: false
