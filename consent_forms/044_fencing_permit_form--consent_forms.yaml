inputSchema:
  type: object
  properties:
    title: Fencing Permit Form
    pages:
    - id: 1
      name: applicant_details
      label: Applicant Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_information
      label: contact_information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: property_details
      label: property_details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: property_owner
      label: property_owner
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: property_use
      label: property_use
      hint: null
      type: select_one
      options:
      - 'Single Family: Residential'
      - 'Single Family: Commercial'
      - Condo
      - Commercial
      - Industrial
      required: true
    - id: 6
      name: permit_type
      label: permit_type
      hint: null
      type: select_multiple
      options:
      - Fence Permit
      - Accessory Building Permit
      - 'Other: Specify'
      required: true
    - id: 7
      name: permit_location
      label: permit_location
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: permit_size
      label: permit_size
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: submitter_details
      label: submitter_details
      hint: null
      type: text
      options: []
      required: false
