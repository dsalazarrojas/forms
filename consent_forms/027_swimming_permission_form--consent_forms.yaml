inputSchema:
  type: object
  properties:
    title: swimming_permission_form
    pages:
    - id: 1
      name: parent_name
      label: parent name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: child_name
      label: child name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: swimmer_level
      label: swimmer level
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: swimmer_ability
      label: swimmer ability
      hint: null
      type: select_one
      options:
      - beginner
      - intermediate
      - advanced
      required: true
    - id: 5
      name: swimmer_frequency
      label: swimmer frequency
      hint: Enter how many times per week
      type: select_multiple
      options:
      - daily
      - 2-3 times a week
      - 1 time a week
      - less than once a week
      required: true
    - id: 6
      name: swimmer_experience
      label: swimmer experience
      hint: null
      type: select_one
      options:
      - 'yes'
      - 'no'
      required: true
    - id: 7
      name: instructor
      label: instructor
      hint: null
      type: select_one
      options:
      - Jimmy
      - Jane
      - Jack
      required: true
    - id: 8
      name: contact_method
      label: contact method
      hint: How would you like to be contacted about your child?
      type: select_one
      options:
      - email
      - phone
      - text
      required: true
    - id: 9
      name: emergency_contact
      label: emergency contact
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_phone
      label: emergency phone
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: notes
      label: notes
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 13
      name: parent_permission
      label: Parent permission for lessons
      hint: null
      type: select_one
      options:
      - 'yes'
      - 'no'
      required: true
    - id: 14
      name: medical_conditions
      label: Medical conditions
      hint: null
      type: text
      options: []
      required: true
