      name: reason_for_suspension
      label: Reason for suspension
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: service_provided
      label: Service provider
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: customer_consent
      label: Customer consent
      hint: null
      type: select_one
      options:
      - I have read, understand, and agree to the temporary service suspension.
      - I do not have the authority to agree to the temporary service suspension.
      - I have not reviewed the terms and conditions.
      required: true
