inputSchema:
  type: object
  properties:
    title: Event Data Recorder Consent Form
    pages:
    - id: 1
      name: form_title
      label: Event Data Recorder Consent Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: form_description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: category
      label: Category
      hint: Select one option
      type: select_one
      options:
      - Consent Forms
      - Event Planner Forms
      required: false
    - id: 4
      name: form_categories
      label: Categories
      hint: Enter multiple categories separated by commas
      type: select_multiple
      options:
      - Event
      - Consent Forms
      required: false
    - id: 5
      name: driver_name
      label: Driver Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: driver_email
      label: Driver Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: owner_name
      label: Owner Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: owner_phone
      label: Owner Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: data_usage
      label: Data Usage
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: terms_and_conditions
      label: Terms and Conditions
      hint: Check the box to indicate that you have read and understand the terms
        and conditions
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: date_signed
      label: Date Signed
      hint: Date (mm/dd/yyyy)
      type: date
      options: []
      required: false
