inputSchema:
  type: object
  properties:
    title: Consumer Behavior Survey
    pages:
      - id: 1
        name: respondent_first_name
        label: First Name
        hint: Your first name - optional
        type: text
        options: []
        required: false
      - id: 2
        name: respondent_email
        label: Email Address
        hint: For follow-up - optional
        type: email
        options: []
        required: false
      - id: 3
        name: age_group
        label: Age Group
        hint: Select your age range
        type: select_one
        options:
          - Under 18
          - 18-24
          - 25-34
          - 35-44
          - 45-54
          - 55-64
          - 65+
        required: true
      - id: 4
        name: gender
        label: Gender
        hint: Select your gender
        type: select_one
        options:
          - Male
          - Female
          - Non-Binary
          - Prefer Not to Say
          - Other
        required: false
      - id: 5
        name: location
        label: Location
        hint: City and state
        type: text
        options: []
        required: false
      - id: 6
        name: product_category
        label: Product Category
        hint: Which category are we asking about
        type: select_one
        options:
          - Electronics
          - Clothing
          - Food and Beverage
          - Home Goods
          - Beauty Products
          - Health Products
          - Automotive
          - Other
        required: true
      - id: 7
        name: purchase_frequency
        label: Purchase Frequency
        hint: How often do you buy this product
        type: select_one
        options:
          - Daily
          - Weekly
          - Monthly
          - Quarterly
          - Once a Year
          - Rarely
        required: true
      - id: 8
        name: last_purchase_date
        label: Last Purchase Date
        hint: When did you last purchase
        type: date
        options: []
        required: false
      - id: 9
        name: amount_spent
        label: Amount Typically Spent
        hint: Average amount per purchase
        type: select_one
        options:
          - Under $25
          - $25 - $50
          - $51 - $100
          - $101 - $200
          - $201 - $500
          - Over $500
        required: true
      - id: 10
        name: purchase_location
        label: Where Do You Purchase
        hint: Select all that apply
        type: select_multiple
        options:
          - Online Retailers
          - Brand Website
          - Department Stores
          - Specialty Stores
          - Discount Stores
          - Grocery Stores
          - Direct Sales
          - Other
        required: true
      - id: 11
        name: brand_awareness
        label: Brand Awareness
        hint: How did you hear about this product
        type: select_multiple
        options:
          - Television
          - Radio
          - Social Media
          - Online Ads
          - Print Media
          - Word of Mouth
          - In-Store Display
          - Influencer
          - Other
        required: true
      - id: 12
        name: satisfaction_level
        label: Satisfaction Level
        hint: How satisfied are you
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 13
        name: product_quality_rating
        label: Product Quality Rating
        hint: Rate the quality
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 14
        name: value_for_money
        label: Value for Money
        hint: Rate the value
        type: select_one
        options:
          - Excellent Value
          - Good Value
          - Fair Value
          - Poor Value
          - Very Poor Value
        required: true
      - id: 15
        name: likelihood_recommend
        label: Likelihood to Recommend
        hint: How likely to recommend to others
        type: select_one
        options:
          - Very Likely
          - Likely
          - Neutral
          - Unlikely
          - Very Unlikely
        required: true
      - id: 16
        name: repurchase_intention
        label: Intention to Repurchase
        hint: Will you buy again
        type: select_one
        options:
          - Definitely Will
          - Probably Will
          - Might or Might Not
          - Probably Will Not
          - Definitely Will Not
        required: true
      - id: 17
        name: product_features_liked
        label: Features You Like
        hint: What do you like about the product
        type: text
        options: []
        required: false
      - id: 18
        name: product_features_disliked
        label: Features You Dislike
        hint: What could be improved
        type: text
        options: []
        required: false
      - id: 19
        name: competitor_products
        label: Have You Tried Competitor Products
        hint: Select if you have tried alternatives
        type: select_one
        options:
          - Yes
          - No
        required: false
      - id: 20
        name: comparison_rating
        label: How Does This Compare
        hint: Rate compared to competitors
        type: select_one
        options:
          - Much Better
          - Somewhat Better
          - About the Same
          - Somewhat Worse
          - Much Worse
        required: false
      - id: 21
        name: packaging_feedback
        label: Packaging Feedback
        hint: Comments on packaging
        type: text
        options: []
        required: false
      - id: 22
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback
        type: text
        options: []
        required: false
