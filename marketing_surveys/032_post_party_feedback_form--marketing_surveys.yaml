inputSchema:
  type: object
  properties:
    title: Post Party Feedback Form
    pages:
    - id: 1
      name: event_title
      label: Event Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_date
      label: event_date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: event_time
      label: event_time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: event_location
      label: event_location
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: party_type
      label: party_type
      hint: null
      type: select_one
      options:
      - Birthday Party
      - Wedding Party
      - Anniversary Party
      required: true
    - id: 6
      name: guest_feedback
      label: guest_feedback
      hint: null
      type: select_multiple
      options:
      - Positive
      - Negative
      - Neutral
      required: true
    - id: 7
      name: rating
      label: rating
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: event_attendants
      label: event_attendants
      hint: null
      type: text
      options: []
      required: false
