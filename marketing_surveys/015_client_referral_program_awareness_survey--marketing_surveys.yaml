          - 1-2 years
          - 2-5 years
          - Over 5 years
        required: true
      - id: 4
        name: aware_of_program
        label: Are You Aware We Have a Referral Program
        hint: null
        type: select_one
        options:
          - Yes
          - No
          - I Think So but Not Sure
        required: true
      - id: 5
        name: how_learned_about_program
        label: How Did You Learn About the Referral Program
        hint: Select all that apply
        type: select_multiple
        options:
          - Email Communication
          - Website
          - Social Media
          - Direct Conversation
          - Printed Materials
          - Another Client
          - I Did Not Know
          - Other
        required: false
      - id: 6
        name: understand_rewards
        label: Do You Understand the Rewards Offered
        hint: null
        type: select_one
        options:
