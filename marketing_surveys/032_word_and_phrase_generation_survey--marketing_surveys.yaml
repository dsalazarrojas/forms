inputSchema:
  type: object
  properties:
    title: Word And Phrase Generation Survey
    pages:
    - id: 1
      name: intro
      label: Welcome to the survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: word_generation
      label: What type of word generation would you like to learn?
      hint: null
      type: select_one
      options:
      - None
      - Basic
      - Intermediate
      - Advanced
      required: false
    - id: 3
      name: preference_scale
      label: How do you prefer words to be generated?
      hint: null
      type: select_multiple
      options:
      - None
      - Basic
      - Intermediate
      - Advanced
      required: false
    - id: 4
      name: phrase_length
      label: How many words would you like to generate?
      hint: null
      type: select_one
      options:
      - 1-10
      - 11-20
      - 21-50
      - 51-100
      required: false
    - id: 5
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: language
      label: What is your preferred language to use in the word generation?
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - Mandarin
      required: false
    - id: 7
      name: gender
      label: What is your gender?
      hint: null
      type: select_one
      options:
      - Female
      - Male
      - Other
      required: false
    - id: 8
      name: age
      label: What is your age?
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: job_role
      label: What is your job role?
      hint: null
      type: select_multiple
      options:
      - Manager
      - Developer
      - Customer Service Representative
      required: false
    - id: 10
      name: company_size
      label: What is the company size?
      hint: null
      type: select_one
      options:
      - Less than 10
      - 10-50
      - 50-200
      - 200 or more
      required: false
    - id: 11
      name: job_type
      label: What kind of work do you do?
      hint: null
      type: select_multiple
      options:
      - Management
      - Development
      - Customer Service
      - Marketing
      required: false
    - id: 12
      name: work_location
      label: Where do you work?
      hint: null
      type: select_one
      options:
      - Office
      - Home
      - Both
      required: false
    - id: 13
      name: industry
      label: What is your industry?
      hint: null
      type: select_multiple
      options:
      - Healthcare
      - Finance
      - Marketing
      required: false
    - id: 14
      name: years_in_industry
      label: How many years do you have in your industry?
      hint: null
      type: number
      options: []
      required: false
