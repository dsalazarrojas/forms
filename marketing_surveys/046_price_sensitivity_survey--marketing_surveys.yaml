inputSchema:
  type: object
  properties:
    title: Price Sensitivity Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: product_description
      label: Product Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: pricing_strategy
      label: Pricing Strategy
      hint: null
      type: select_multiple
      options:
      - Cost-plus
      - Other
      required: false
    - id: 4
      name: price_sensitivity
      label: Price Sensitivity
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: target_price
      label: Target Price
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: discount
      label: Discount
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: price_increase
      label: Price Increase
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: price_decrease
      label: Price Decrease
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: sensitivity_level
      label: Sensitivity Level
      hint: null
      type: select_one
      options:
      - Very Sensitive
      - Somewhat Sensitive
      - Not Very Sensitive
      required: false
    - id: 10
      name: price_range
      label: Price Range
      hint: null
      type: select_multiple
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 11
      name: target_customer
      label: Target Customer
      hint: null
      type: select_multiple
      options:
      - Young Adults
      - Middle-Aged
      - Old-Aged
      required: false
    - id: 12
      name: customer_satisfaction
      label: Customer Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      required: false
