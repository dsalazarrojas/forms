inputSchema:
  type: object
  properties:
    title: Veterinary Marketing Outreach Survey
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: marketing_channels
      label: What are your marketing channels?
      hint: null
      type: select_one
      options:
      - Animal Health Industry Trade Association
      - Association of Animal Health
      - Online Advertising
      - Social Media
      - Trade Show
      - Veterinary Association
      required: true
    - id: 3
      name: email_frequency
      label: How often do you check your emails?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: social_media
      label: Do you use social media for marketing?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: age_range
      label: What is your age range?
      hint: null
      type: select_one
      options:
      - 20-29
      - 30-39
      - 40-49
      - 50-59
      - 60 or older
      required: true
    - id: 6
      name: online_advertising
      label: Do you prefer online advertising?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: experience
      label: How many years of experience do you have in the veterinary field?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: media_preference
      label: Do you prefer to receive information through email or print media?
      hint: null
      type: select_one
      options:
      - Email
      - Print Media
      required: true
    - id: 9
      name: trade_shows
      label: How often do you visit trade shows?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: role
      label: What is your current role in the veterinary industry?
      hint: null
      type: select_one
      options:
      - Veterinarian
      - Veterinarian Assistant
      - Pet Owner
      - Industry Representative
      - Other
      required: true
    - id: 11
      name: social_media_ads
      label: Do you prefer to receive information through social media or online advertising?
      hint: null
      type: select_one
      options:
      - Social Media
      - Online Advertising
      required: true
    - id: 12
      name: comments
      label: Do you have any other comments or suggestions?
      hint: null
      type: note
      options: []
      required: false
