inputSchema:
  type: object
  properties:
    title: Fitness Membership Upgrade Interest Survey
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: select_one
      label: What motivates you to upgrade your membership?
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''To take advantage of additional features''}'
      - '{''id'': 2, ''label'': ''To save money on a monthly basis''}'
      - '{''id'': 3, ''label'': ''To have access to a wider range of classes''}'
      - '{''id'': 4, ''label'': ''Other (please specify)''}'
      required: true
    - id: 5
      name: note
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: date
      label: Potential Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time
      label: Potential Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: select_multiple
      label: Which classes interest you the most?
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''label'': ''Cardio''}'
      - '{''id'': 2, ''label'': ''Strength Training''}'
      - '{''id'': 3, ''label'': ''Yoga''}'
      - '{''id'': 4, ''label'': ''Other (please specify)''}'
      required: true
    - id: 9
      name: assigned_tool
      label: Tool Used
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: category
      label: Category
      hint: null
      type: text
      options: []
      required: true
