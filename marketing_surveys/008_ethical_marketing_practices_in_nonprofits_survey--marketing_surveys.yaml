inputSchema:
  type: object
  properties:
    title: Ethical Marketing Practices In Nonprofits Survey
    pages:
    - id: 1
      name: form_intro
      label: Intro
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: marketing_goals_awareness
      label: What are the nonprofit's marketing goals
      hint: Describe the main goals of the nonprofit's marketing
      type: text
      options: []
      required: false
    - id: 3
      name: marketing_objectives
      label: What are the nonprofit's marketing objectives
      hint: Describe what you want to achieve through marketing
      type: text
      options: []
      required: false
    - id: 4
      name: target_audience
      label: Who is the target audience for the nonprofit's marketing
      hint: Describe the people or groups you are trying to reach
      type: text
      options: []
      required: false
    - id: 5
      name: marketing_challenges
      label: What are the biggest marketing challenges the nonprofit faces
      hint: List specific challenges and opportunities
      type: text
      options: []
      required: false
    - id: 6
      name: marketing_ethics
      label: What are the nonprofit's ethical marketing practices
      hint: Describe the nonprofit's approach to ethics
      type: text
      options: []
      required: false
    - id: 7
      name: marketing_regulations
      label: What regulations do nonprofit organizations need to follow
      hint: Federal and state regulations
      type: text
      options: []
      required: false
    - id: 8
      name: survey_conducted
      label: How often are surveys conducted
      hint: How often do you conduct surveys
      type: select_one
      options:
      - Once a year
      - Multiple times a year
      - Never
      required: false
    - id: 9
      name: survey_questions_important
      label: What questions are asked when conducting a survey
      hint: How important do you think are certain questions to the respondent
      type: select_multiple
      options:
      - Demographic information
      - Marketing practices
      - Marketing goals and objectives
      - Other
      required: true
    - id: 10
      name: training_required
      label: Is training required for nonprofit marketing staff
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: policy_development
      label: Is there a policy for nonprofit marketing staff
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: policy_guidelines
      label: What guidelines do you follow when developing a policy
      hint: Describe how you follow guidelines for policy development
      type: text
      options: []
      required: false
    - id: 13
      name: policy_review
      label: Who reviews nonprofit marketing policy
      hint: null
      type: select_one
      options:
      - Management
      - Marketing Manager
      - Policy Director
      - Other
      required: false
    - id: 14
      name: policy_updates
      label: How often do you update nonprofit policy
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: strategy_development
      label: How do you develop nonprofit marketing strategy
      hint: Describe how you develop marketing strategy
      type: text
      options: []
      required: false
    - id: 16
      name: strategy_measurable
      label: What makes a strategy measurable
      hint: List metrics used for evaluation
      type: text
      options: []
      required: false
    - id: 17
      name: strategy_evaluation
      label: How do you evaluate nonprofit strategy
      hint: Describe evaluation metrics
      type: text
      options: []
      required: false
    - id: 18
      name: strategy_reporting
      label: What is reported in nonprofit strategy
      hint: What is reported for strategy evaluation
      type: text
      options: []
      required: false
    - id: 19
      name: strategy_adaptability
      label: How adaptable is the nonprofit marketing strategy
      hint: Describe how adaptable is the strategy
      type: text
      options: []
      required: false
    - id: 20
      name: survey_results
      label: What do you do with survey results
      hint: Describe what you do with survey results
      type: text
      options: []
      required: false
    - id: 21
      name: marketing_budget
      label: What is the nonprofit's marketing budget
      hint: How much is allocated for marketing
      type: number
      options: []
      required: false
    - id: 22
      name: data_analytics
      label: What data analytics tools do you use
      hint: Describe the tools used for data analysis
      type: select_multiple
      options:
      - Google Analytics
      - Social media analytics
      - Other
      required: false
    - id: 23
      name: marketing_collaboration
      label: Do you collaborate with other nonprofits
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 24
      name: survey_partners
      label: Who are your survey partners
      hint: null
      type: select_multiple
      options:
      - Other non-profits
      - For-profit organizations
      - Both
      required: false
    - id: 25
      name: other
      label: Other (please specify)
      hint: null
      type: text
      options: []
      required: false
