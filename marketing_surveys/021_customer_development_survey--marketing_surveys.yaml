inputSchema:
  type: object
  properties:
    title: Customer Development Survey
    pages:
    - id: 1
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_method
      label: How did you discover our company
      hint: null
      type: select_multiple
      options:
      - social media
      - referral
      - online search
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: note
      label: Additional information
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: purchase_frequency
      label: How many times have you purchased from us in the past 6 months?
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: recent_contact_time
      label: When was your most recent contact with us?
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: recent_contact_time_2
      label: What time of day did your most recent contact with us occur?
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: product_purchase_count
      label: How many products/services have you purchased from us in the past 2 years?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: experience_with_product
      label: Can you tell us about your experience with our service/product?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: satisfaction_level
      label: What is your current level of satisfaction with our service/product?
      hint: null
      type: select_one
      options:
      - very satisfied
      - somewhat satisfied
      - neutral
      - somewhat dissatisfied
      - very dissatisfied
      required: true
    - id: 12
      name: follow_up
      label: Can we follow up with you about your experience?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
