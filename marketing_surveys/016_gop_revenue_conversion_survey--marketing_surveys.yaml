inputSchema:
  type: object
  properties:
    title: GOP Revenue Conversion Survey
    pages:
    - id: 1
      name: revenue_conversion_survey
      label: What is the primary goal of the GOP Revenue Conversion process?
      hint: null
      type: select_one
      options:
      - Maximize revenue
      - Improve customer satisfaction
      - Increase sales volume
      - Other
      required: false
    - id: 2
      name: process_effectiveness_rating
      label: What is your rating of the current GOP Revenue Conversion process?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: process_effectiveness_rating_hint
      label: Please provide more details about your rating
      hint: How does the process impact your role and the organization as a whole?
      type: text
      options: []
      required: false
    - id: 4
      name: process_effectiveness_rating_scale
      label: What is the scale used to measure process effectiveness?
      hint: null
      type: select_one
      options:
      - 1 - very poor
      - 2 - poor
      - 3 - fair
      - 4 - good
      - 5 - very good
      - 6 - excellent
      required: false
    - id: 5
      name: process_barriers
      label: What are some key barriers to the process?
      hint: Provide a few examples of obstacles you encounter while executing the
        process.
      type: select_multiple
      options:
      - Communication and information sharing
      - Training and support
      - Process and system limitations
      - Resources and funding
      - Other (please specify)
      required: false
    - id: 6
      name: process_improvement_areas
      label: What areas of the process do you think need improvement?
      hint: Provide specific examples of areas for improvement.
      type: select_multiple
      options:
      - Data and analytics
      - Process and system
      - Communication and information sharing
      - Resources and funding
      - Other (please specify)
      required: false
    - id: 7
      name: process_improvement_actions
      label: What actions would you take to improve the process?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: process_improvement_priority
      label: What is the priority level of the improvement areas you mentioned?
      hint: On a scale of 1-5, with 1 being the lowest priority and 5 being the highest
        priority.
      type: number
      options: []
      required: false
    - id: 9
      name: process_improvement_suggestions
      label: Do you have any additional suggestions for improvement?
      hint: Is there anything else you think would improve the process or address
        any other challenges you face?
      type: text
      options: []
      required: false
