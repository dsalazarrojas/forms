inputSchema:
  type: object
  properties:
    title: Powdered Juice Consumption Survey
    pages:
    - id: 1
      name: powdered_juice_consumption_survey
      label: Powdered Juice Consumption
      hint: Tell us about your powdered juice consumption habits
      type: text
      options: []
      required: false
    - id: 2
      name: age_group
      label: Age Group
      hint: null
      type: select_one
      options:
      - 18-24
      - 25-34
      - 35-44
      - 45-54
      - 55-64
      - 65+
      required: false
    - id: 3
      name: purchase_frequency
      label: How often do you purchase powdered juice?
      hint: null
      type: select_multiple
      options:
      - Never
      - Monthly
      - Quarterly
      - Semiannually
      - Yearly
      required: false
    - id: 4
      name: preferred_flavor
      label: Preferred Flavor
      hint: null
      type: select_multiple
      options:
      - Original
      - Mixed
      - Fruit Punch
      - Berry
      - Other (please specify)
      required: false
    - id: 5
      name: purchase_reason
      label: Why do you purchase powdered juice?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: satisfaction_level
      label: Satisfaction Level
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 7
      name: recommendation_intent
      label: Will you recommend powdered juice to a friend?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: other_flavor_specify
      label: Other Flavor
      hint: Please describe
      type: text
      options: []
      required: false
    - id: 9
      name: other_purpose_specify
      label: Other Purpose
      hint: Please describe
      type: text
      options: []
      required: false
    - id: 10
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
