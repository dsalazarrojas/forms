inputSchema:
  type: object
  properties:
    title: Beta Product Feedback Form
    pages:
    - id: 1
      name: customer_info_header
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_full_name
      label: Your Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: customer_email_addr
      label: Your Email Address
      hint: For follow-up and updates
      type: email
      options: []
      required: true
    - id: 4
      name: product_feedback_header
      label: -- Product Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: overall_product_rating
      label: Overall Product Rating
      hint: 1 being poor, 5 being excellent
      type: select_one
      options:
      - 1
      - 2
      - 3
      - 4
      - 5
      required: true
    - id: 6
      name: favorite_feature_desc
      label: What is your favorite feature
      hint: Why do you like it
      type: text
      options: []
      required: true
    - id: 7
      name: least_favorite_feature_desc
      label: What is your least favorite feature
      hint: What could be improved
      type: text
      options: []
      required: true
    - id: 8
      name: usage_frequency_select
      label: How often do you use the product
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: true
    - id: 9
      name: usability_header
      label: -- Usability and Setup --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: ease_of_use_rating
      label: How easy is it to use the product
      hint: 1 being very difficult, 5 being very easy
      type: select_one
      options:
      - 1
      - 2
      - 3
      - 4
      - 5
      required: true
    - id: 11
      name: setup_ease_status
      label: Was the product easy to set up
      hint: Consider installation or initial login
      type: select_one
      options:
      - Yes - very easy
      - No - difficult
      - Needs improvement
      required: true
    - id: 12
      name: bug_encounter_status
      label: Did you encounter any bugs
      hint: Technical glitches or errors
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 13
      name: bug_description_text
      label: Describe any bugs you found
      hint: What happened and when
      type: text
      options: []
      required: false
    - id: 14
      name: market_fit_header
      label: -- Value and Recommendations --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: price_willingness_val
      label: Maximum Price You Would Pay
      hint: Suggested price in USD
      type: number
      options: []
      required: false
    - id: 16
      name: product_recommendation_status
      label: Would you recommend this product to others
      hint: null
      type: select_one
      options:
      - Yes - absolutely
      - false
      required: true
    - id: 17
      name: product_improvement_suggestion
      label: What should we change to make the product better
      hint: Top priority for our team
      type: text
      options: []
      required: true
    - id: 18
      name: final_additional_feedback
      label: Any other feedback
      hint: Final comments or thoughts
      type: text
      options: []
      required: false
    - id: 19
      name: feedback_final_date
      label: Today's Date
      hint: null
      type: date
      options: []
      required: true
