inputSchema:
  type: object
  properties:
    title: Digital Marketing Campaign Success Evaluation Form
    pages:
    - id: 1
      name: campaign_name
      label: Campaign Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: objective
      label: Objective
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: marketing_channels
      label: Marketing Channels
      hint: null
      type: select_multiple
      options:
      - Facebook
      - Instagram
      - Twitter
      - Email
      - Print
      required: false
    - id: 4
      name: budget_allocation
      label: Budget Allocation
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: target_audience
      label: Target Audience
      hint: null
      type: select_multiple
      options:
      - Women
      - Men
      - Youth
      - Adults
      - Senior Citizens
      required: false
    - id: 6
      name: marketing_mix
      label: Marketing Mix
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: results
      label: Results
      hint: null
      type: select_one
      options:
      - Successful
      - Unsuccessful
      - Partially Successful
      required: false
    - id: 8
      name: evaluation
      label: Evaluation
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: false
    - id: 9
      name: recommendations
      label: Recommendations
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Extremely Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Extremely Dissatisfied
      required: false
    - id: 11
      name: time_spent
      label: Time Spent
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: evaluation_form
      label: Evaluation Form
      hint: null
      type: select_multiple
      options:
      - Facebook
      - Instagram
      - Twitter
      - Email
      - Print
      required: false
