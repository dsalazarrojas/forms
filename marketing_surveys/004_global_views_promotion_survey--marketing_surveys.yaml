inputSchema:
  type: object
  properties:
    title: global_views_promotion_survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: true
    - id: 2
      name: global_campaigns
      label: Which global campaigns have you seen or heard about?
      hint: null
      type: select_multiple
      options:
      - Global Campaign 1
      - Global Campaign 2
      - Global Campaign 3
      required: false
    - id: 3
      name: regional_interest
      label: Which region(s) is/are you from?
      hint: null
      type: select_multiple
      options:
      - Region 1
      - Region 2
      - Region 3
      required: false
    - id: 4
      name: feedback
      label: What was your impression of the global campaign?
      hint: Please be honest
      type: text
      options: []
      required: true
    - id: 5
      name: improvement_ideas
      label: Have any ideas to improve future global campaigns?
      hint: Be as specific as possible
      type: text
      options: []
      required: true
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: review
      label: Review
      hint: null
      type: select_one
      options:
      - Strongly Agree
      - Neutral
      - Disagree
      required: false
    - id: 10
      name: date
      label: Date
      hint: mm/dd/yyyy
      type: date
      options: []
      required: true
