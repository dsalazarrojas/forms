inputSchema:
  type: object
  properties:
    title: Beauty Subscription Retention Motivation Survey
    pages:
      - id: 1
        name: respondent_name
        label: Full Name
        hint: Optional - you may remain anonymous
        type: text
        options: []
        required: false
      - id: 2
        name: respondent_email
        label: Email Address
        hint: For follow-up if needed
        type: email
        options: []
        required: false
      - id: 3
        name: subscription_status
        label: Current Subscription Status
        hint: What is your current subscription status
        type: select_one
        options:
          - Active Subscriber
          - Former Subscriber
          - Considering Subscribing
          - Never Subscribed
        required: true
      - id: 4
        name: subscription_length
        label: Length of Subscription
        hint: How long have you been or were you subscribed
        type: select_one
        options:
          - Less than 1 month
          - 1-3 months
          - 4-6 months
          - 7-12 months
          - More than 1 year
          - Never subscribed
        required: true
      - id: 5
        name: subscription_type
        label: Subscription Type
        hint: Which subscription did you have or are considering
        type: select_one
        options:
          - Monthly Beauty Box
          - Quarterly Beauty Box
          - Premium Monthly Box
          - Custom Subscription
          - Not Sure
          - Never subscribed
        required: true
      - id: 6
        name: primary_motivation
        label: Primary Motivation for Subscribing
        hint: What motivated you to subscribe
        type: select_one
        options:
          - Discover New Products
          - Cost Savings
          - Convenience
          - Gift from Someone
          - Influencer Recommendation
          - Curated Selection
          - Exclusive Products
          - Other
        required: true
      - id: 7
        name: satisfaction_level
        label: Overall Satisfaction Level
        hint: How satisfied were you with the subscription
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
          - Never subscribed
        required: true
      - id: 8
        name: product_quality
        label: Product Quality Rating
        hint: How would you rate the product quality
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
          - Never subscribed
        required: true
      - id: 9
        name: product_variety
        label: Product Variety Rating
        hint: How satisfied were you with product variety
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
          - Never subscribed
        required: true
      - id: 10
        name: value_for_money
        label: Value for Money
        hint: Did you feel the subscription was worth the cost
        type: select_one
        options:
          - Excellent Value
          - Good Value
          - Fair Value
          - Poor Value
          - Very Poor Value
          - Never subscribed
        required: true
      - id: 11
        name: cancellation_reason
        label: Reason for Canceling
        hint: If you canceled why did you cancel
        type: select_multiple
        options:
          - Too Expensive
          - Products Did Not Match Preferences
          - Too Many Products
          - Not Enough Products
          - Quality Issues
          - Shipping Problems
          - Found Better Alternative
          - No Longer Need
          - Financial Reasons
          - Other
          - Not Applicable
        required: false
      - id: 12
        name: retention_factors
        label: Factors That Would Keep You Subscribed
        hint: Select all that would motivate you to stay
        type: select_multiple
        options:
          - Lower Price
          - More Personalization
          - Higher Quality Products
          - More Full-Size Products
          - Exclusive or Limited Edition Items
          - Better Product Variety
          - Flexible Subscription Terms
          - Loyalty Rewards
          - Free Shipping
          - Early Access to New Products
          - Better Customer Service
          - Other
        required: true
      - id: 13
        name: preferred_frequency
        label: Preferred Delivery Frequency
        hint: How often would you prefer to receive boxes
        type: select_one
        options:
          - Monthly
          - Every 2 Months
          - Quarterly
          - Twice a Year
          - Once a Year
          - On Demand Only
        required: true
      - id: 14
        name: preferred_price_range
        label: Preferred Monthly Price Range
        hint: What price range is acceptable
        type: select_one
        options:
          - Under $15
          - $15-$25
          - $26-$35
          - $36-$50
          - Over $50
          - Price Not a Factor
        required: true
      - id: 15
        name: product_categories
        label: Preferred Product Categories
        hint: Select categories you are most interested in
        type: select_multiple
        options:
          - Skincare
          - Makeup
          - Haircare
          - Nail Care
          - Fragrance
          - Beauty Tools
          - Bath and Body
          - Organic or Natural Products
          - Luxury Brands
          - Drugstore Brands
        required: true
      - id: 16
        name: likelihood_recommend
        label: Likelihood to Recommend
        hint: How likely are you to recommend to friends
        type: select_one
        options:
          - Very Likely
          - Likely
          - Neutral
          - Unlikely
          - Very Unlikely
          - Never subscribed
        required: true
      - id: 17
        name: resubscribe_likelihood
        label: Likelihood to Resubscribe
        hint: Would you consider subscribing again
        type: select_one
        options:
          - Very Likely
          - Likely
          - Neutral
          - Unlikely
          - Very Unlikely
          - Currently Subscribed
        required: true
      - id: 18
        name: favorite_product
        label: Favorite Product Received
        hint: What was your favorite product if any
        type: text
        options: []
        required: false
      - id: 19
        name: improvement_suggestions
        label: Suggestions for Improvement
        hint: How could we improve the subscription
        type: text
        options: []
        required: false
      - id: 20
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback you would like to share
        type: text
        options: []
        required: false
