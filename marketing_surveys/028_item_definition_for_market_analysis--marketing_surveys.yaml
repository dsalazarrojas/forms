inputSchema:
  type: object
  properties:
    title: Item Definition For Market Analysis
    pages:
    - id: 1
      name: new_item
      label: New Item
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: item_type
      label: Item Type
      hint: null
      type: select_one
      options:
      - Product
      - Service
      - Other
      required: true
    - id: 3
      name: item_description
      label: Item Description
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: item_status
      label: Item Status
      hint: null
      type: select_one
      options:
      - In Development
      - In Production
      - Retired
      required: true
    - id: 5
      name: competitor
      label: Competitor
      hint: List competitors
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
