inputSchema:
  type: object
  properties:
    title: Final Assessment For Drawing Course
    pages:
    - id: 1
      name: student_reflections
      label: Student Reflections
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: instructor_evaluation
      label: Instructor Evaluation
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Poor
      required: false
    - id: 3
      name: uploaded_artwork
      label: Uploaded Artwork
      hint: Upload your final artwork here
      type: text
      options: []
      required: false
    - id: 4
      name: final_assessment
      label: Final Assessment
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: student_comments
      label: Student Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: instructor_comments
      label: Instructor Comments
      hint: null
      type: text
      options: []
      required: false
