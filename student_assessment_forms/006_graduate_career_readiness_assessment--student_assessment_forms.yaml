inputSchema:
  type: object
  properties:
    title: Graduate Career Readiness Assessment
    pages:
    - id: 1
      name: graduate_career_readiness_form_1
      label: What is your current employment status
      hint: null
      type: select_one
      options:
      - Employed
      - Not employed
      - Graduated and employed
      - Graduating and actively job searching
      - Graduating and passively job searching
      - Other
      required: true
    - id: 2
      name: graduate_career_readiness_form_2
      label: What is your expected graduation date or completion date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: graduate_career_readiness_form_3
      label: What type of job or career are you preparing for
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: graduate_career_readiness_form_4
      label: What are you doing to prepare for your career
      hint: null
      type: select_multiple
      options:
      - Seeking out job opportunities
      - Taking relevant coursework
      - Participating in career-related projects
      - Building a professional network
      - Creating a personal brand online
      - Other
      required: true
    - id: 5
      name: graduate_career_readiness_form_5
      label: What are you most interested in about your career
      hint: null
      type: select_multiple
      options:
      - Work-life balance
      - Salary and benefits
      - Job security
      - Professional development
      - Personal fulfillment
      - Other
      required: true
    - id: 6
      name: graduate_career_readiness_form_6
      label: What kind of work environment are you interested in
      hint: null
      type: select_multiple
      options:
      - Office work
      - Remote work
      - Freelance or consulting
      - Entrepreneurship
      - Other
      required: false
    - id: 7
      name: graduate_career_readiness_form_7
      label: What kind of industry are you interested in
      hint: null
      type: select_multiple
      options:
      - Tech
      - Arts and humanities
      - Business
      - Education and research
      - Health and wellness
      - Other
      required: false
    - id: 8
      name: graduate_career_readiness_form_8
      label: What is your ideal career role or job title
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: graduate_career_readiness_form_9
      label: What are you most looking forward to about your future career
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: graduate_career_readiness_form_10
      label: What are you most concerned about your future career
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: graduate_career_readiness_form_11
      label: What support or resources do you need to be successful in your career
      hint: null
      type: select_multiple
      options:
      - Career counseling
      - Professional networking
      - Mentorship
      - Financial assistance
      - Other
      required: false
    - id: 12
      name: graduate_career_readiness_form_12
      label: What are you expecting from your future career
      hint: null
      type: select_multiple
      options:
      - Job satisfaction
      - Financial stability
      - Personal fulfillment
      - Career growth
      - Other
      required: false
    - id: 13
      name: graduate_career_readiness_form_13
      label: How would you describe your career goals
      hint: null
      type: select_multiple
      options:
      - Short-term career goals
      - Long-term career goals
      - Career goals for personal fulfillment
      - Other
      required: false
    - id: 14
      name: graduate_career_readiness_form_14
      label: What are you currently studying or working towards
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: graduate_career_readiness_form_15
      label: Are you considering starting a side-hustle or business
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 16
      name: graduate_career_readiness_form_16
      label: What industry do you think you will be working in
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: graduate_career_readiness_form_17
      label: What are you expecting from your employer
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: graduate_career_readiness_form_18
      label: How do you plan to use this assessment results
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: graduate_career_readiness_form_19
      label: How do you see yourself using this assessment results in your future
        career decisions
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: graduate_career_readiness_form_20
      label: How long do you expect your first job to last
      hint: null
      type: number
      options: []
      required: false
    - id: 21
      name: graduate_career_readiness_form_21
      label: How long do you expect to work in your first job
      hint: null
      type: number
      options: []
      required: false
    - id: 22
      name: graduate_career_readiness_form_22
      label: How long do you expect to spend on education after graduation
      hint: null
      type: number
      options: []
      required: false
    - id: 23
      name: graduate_career_readiness_form_23
      label: What is your expected starting salary range
      hint: null
      type: number
      options: []
      required: false
    - id: 24
      name: graduate_career_readiness_form_24
      label: Are you expecting any student loan debt
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 25
      name: graduate_career_readiness_form_25
      label: What do you plan to do to manage your student loan debt
      hint: null
      type: text
      options: []
      required: false
