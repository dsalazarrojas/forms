inputSchema:
  type: object
  properties:
    title: Textile Knowledge Assessment
    pages:
    - id: 1
      name: general_knowledge
      label: General Knowledge
      hint: null
      type: select_multiple
      options:
      - Fabric
      - Fiber
      - Textile
      - Fiber Blend
      - Fabric Structure
      - Thread
      - Color
      - Yarn
      - Weave
      - Dye
      - Finishing
      - Knitting
      - Crochet
      - Embroidery
      - Plying
      - Warp
      - Weave Structure
      - Thread Count
      - Fiber Length
      - Yarn Count
      - Weight
      - Width
      - Length
      required: false
    - id: 2
      name: assessment_1
      label: Assessment 1
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      required: false
    - id: 3
      name: assessment_2
      label: Assessment 2
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      required: false
    - id: 4
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
