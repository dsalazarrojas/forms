inputSchema:
  type: object
  properties:
    title: Cone Volume Math Quiz
    pages:
    - id: 1
      name: quiz_header
      label: Cone Volume Math Quiz
      hint: Test your knowledge of cone volume calculations
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID
      hint: ID number
      type: text
      options: []
      required: false
    - id: 4
      name: class_period
      label: Class Period
      hint: Which class period
      type: select_one
      options:
      - Period 1
      - Period 2
      - Period 3
      - Period 4
      - Period 5
      - Period 6
      required: true
    - id: 5
      name: quiz_date
      label: Quiz Date
      hint: Date of quiz
      type: date
      options: []
      required: true
    - id: 6
      name: formula_knowledge
      label: Formula Knowledge
      hint: Basic formula questions
      type: note
      options: []
      required: false
    - id: 7
      name: q1_formula
      label: Question 1 - Cone Volume Formula
      hint: What is the formula for volume of a cone
      type: select_one
      options:
      - V = pi times r squared times h
      - V = one third pi times r squared times h
      - V = two thirds pi times r cubed
      - V = pi times d times h
      required: true
    - id: 8
      name: q2_radius_definition
      label: Question 2 - Radius Definition
      hint: What is the radius of a cone
      type: select_one
      options:
      - Distance from center to edge of base
      - Distance from base to apex
      - Distance around the base
      - Half the height
      required: true
    - id: 9
      name: calculation_problems
      label: Calculation Problems
      hint: Solve the following problems
      type: note
      options: []
      required: false
    - id: 10
      name: q3_basic_calculation
      label: Question 3 - Basic Calculation
      hint: Find volume when r equals 3 and h equals 5
      type: number
      options: []
      required: true
    - id: 11
      name: q3_work_shown
      label: Question 3 - Work Shown
      hint: Show your calculations
      type: text
      options: []
      required: false
    - id: 12
      name: q4_intermediate
      label: Question 4 - Intermediate Problem
      hint: Find volume when diameter equals 8 and h equals 12
      type: number
      options: []
      required: true
    - id: 13
      name: q4_work_shown
      label: Question 4 - Work Shown
      hint: Show your calculations
      type: text
      options: []
      required: false
    - id: 14
      name: q5_advanced
      label: Question 5 - Advanced Problem
      hint: A cone has volume 100 cubic units and radius 5. Find the height.
      type: number
      options: []
      required: true
    - id: 15
      name: q5_work_shown
      label: Question 5 - Work Shown
      hint: Show your calculations
      type: text
      options: []
      required: false
    - id: 16
      name: application_questions
      label: Application Questions
      hint: Real world applications
      type: note
      options: []
      required: false
    - id: 17
      name: q6_real_world
      label: Question 6 - Real World Application
      hint: Name a real world object shaped like a cone
      type: text
      options: []
      required: true
    - id: 18
      name: q7_comparison
      label: Question 7 - Comparison
      hint: How does cone volume compare to cylinder with same base and height
      type: select_one
      options:
      - Cone is one third of cylinder
      - Cone is half of cylinder
      - Cone is two thirds of cylinder
      - Cone equals cylinder
      required: true
    - id: 19
      name: q8_problem_solving
      label: Question 8 - Problem Solving
      hint: If you double the radius what happens to volume
      type: select_one
      options:
      - Volume doubles
      - Volume quadruples
      - Volume triples
      - Volume stays same
      required: true
    - id: 20
      name: self_assessment
      label: Self Assessment
      hint: Rate your understanding
      type: note
      options: []
      required: false
    - id: 21
      name: confidence_level
      label: Confidence Level
      hint: How confident are you with cone volume
      type: select_one
      options:
      - Very Confident
      - Confident
      - Somewhat Confident
      - Not Confident
      required: true
    - id: 22
      name: difficulty_rating
      label: Difficulty Rating
      hint: How difficult was this quiz
      type: select_one
      options:
      - Very Easy
      - Easy
      - Moderate
      - Difficult
      - Very Difficult
      required: true
    - id: 23
      name: topics_needing_help
      label: Topics Needing Help
      hint: What do you need more practice with
      type: select_multiple
      options:
      - Understanding the Formula
      - Calculating with Radius
      - Calculating with Diameter
      - Finding Height
      - Real World Applications
      - None I Understand
      required: false
    - id: 24
      name: additional_comments
      label: Additional Comments
      hint: Any questions or concerns
      type: text
      options: []
      required: false
    - id: 25
      name: quiz_submission
      label: Quiz Submission
      hint: Submit your answers
      type: select_one
      options:
      - Submit Quiz
      - Review Answers
      required: true
