inputSchema:
  type: object
  properties:
    title: Gifted Student Assessment Questionnaire
    pages:
    - id: 1
      name: student_input_1
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_input_2
      label: What is your title?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: student_input_3
      label: Student's grade level?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: student_input_4
      label: What is your ethnicity?
      hint: null
      type: select_multiple
      options:
      - Asian
      - African American
      - Hispanic or Latino
      - Native American
      - White
      required: true
    - id: 5
      name: student_input_5
      label: What language do you use at home?
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - French
      - Chinese
      - Other
      required: true
    - id: 6
      name: student_input_6
      label: Do you have any disability status?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: student_input_7
      label: What are your accommodation needs?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: student_input_8
      label: Who is your primary caregiver?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: student_input_9
      label: Who is your teacher?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: student_input_10
      label: What language do you speak?
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - French
      - Chinese
      - Other
      required: true
