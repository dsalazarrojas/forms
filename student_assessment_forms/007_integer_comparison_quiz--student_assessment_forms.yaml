inputSchema:
  type: object
  properties:
    title: Integer Comparison Quiz
    pages:
    - id: 1
      name: compare_first_int
      label: Compare the two integers on the first pair of numbers.
      hint: null
      type: select_one
      options:
      - Very Similar
      - Somewhat Similar
      - Not Similar
      required: true
    - id: 2
