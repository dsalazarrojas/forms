inputSchema:
  type: object
  properties:
    title: Quiz On Eigenvalues And Eigenvectors
    pages:
    - id: 1
      name: practice_question
      label: Practice Question
      hint: This is the first question of the quiz.
      type: select_multiple
      options:
      - What is the definition of an eigenvalue?
      - What is the significance of eigenvalues in linear algebra?
      - How are eigenvalues used in applications?
      required: true
    - id: 2
      name: eigenvalues_count
      label: Eigenvalues Count
      hint: How many eigenvalues can a matrix have?
      type: select_one
      options:
      - '1'
      - '2'
      - Multiple
      required: true
    - id: 3
      name: eigenvalues_example
      label: Eigenvalues Example
      hint: Provide an example of an eigenvalue.
      type: text
      options: []
      required: true
    - id: 4
      name: eigenvalues_note
      label: Eigenvalues Note
      hint: Additional notes on eigenvalues.
      type: note
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: Please enter your email address.
      type: email
      options: []
      required: true
    - id: 6
      name: date
      label: Date
      hint: When will you complete this quiz?
      type: date
      options: []
      required: true
    - id: 7
      name: time
      label: Time
      hint: What time do you usually study for exams?
      type: time
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: Please provide your phone number.
      type: text
      options: []
      required: false
    - id: 9
      name: email_2
      label: Email 2
      hint: Email for feedback.
      type: email
      options: []
      required: false
    - id: 10
      name: submit
      label: Submit
      hint: Submit your answers.
      type: text
      options: []
      required: true
