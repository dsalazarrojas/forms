inputSchema:
  type: object
  properties:
    title: Human Development Assessment
    pages:
    - id: 1
      name: overall_wellbeing
      label: Overall well-being
      hint: How do you rate your overall well-being?
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 2
      name: growth_areas
      label: Growth areas
      hint: What are your growth areas?
      type: select_multiple
      options:
      - Emotional Stability
      - Self-awareness
      - Social Skills
      - Physical Health
      - Mental Health
      required: true
    - id: 3
      name: well_being_goals
      label: Well-being goals
      hint: What are your well-being goals?
      type: text
      options: []
      required: false
    - id: 4
      name: personal_goals
      label: Personal goals
      hint: What are your personal goals?
      type: text
      options: []
      required: true
    - id: 5
      name: overall_rating
      label: Overall rating
      hint: How would you rate your overall well-being?
      type: select_one
      options:
      - Very satisfied
      - Neutral
      - Dissatisfied
      required: true
    - id: 6
      name: comments
      label: Comments
      hint: Any comments?
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: Phone
      hint: Your phone number
      type: text
      options: []
      required: true
    - id: 9
      name: date
      label: Date
      hint: Date
      type: date
      options: []
      required: true
    - id: 10
      name: time
      label: Time
      hint: Time
      type: time
      options: []
      required: true
    - id: 11
      name: notes
      label: Notes
      hint: Any additional comments?
      type: note
      options: []
      required: false
    - id: 12
      name: submitted_by
      label: Submitted by
      hint: Your name
      type: text
      options: []
      required: false
    - id: 13
      name: submitted_at
      label: Submitted at
      hint: Date and time of submission
      type: date
      options: []
      required: false
    - id: 14
      name: submitted_time
      label: Submitted time
      hint: Time of submission
      type: time
      options: []
      required: false
    - id: 15
      name: submitted_at_2
      label: Submitted At 2
      hint: Date of submission
      type: date
      options: []
      required: false
    - id: 16
      name: submitted_at_3
      label: Submitted At 3
      hint: Date of submission
      type: date
      options: []
      required: false
    - id: 17
      name: submitted_time_2
      label: Submitted Time 2
      hint: Time of submission
      type: time
      options: []
      required: false
