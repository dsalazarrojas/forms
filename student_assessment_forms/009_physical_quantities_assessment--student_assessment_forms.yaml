inputSchema:
  type: object
  properties:
    title: Physical Quantities Assessment
    pages:
    - id: 1
      name: general_knowledge
      label: General Knowledge
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: si_units
      label: Si Units
      hint: null
      type: select_multiple
      options:
      - meter
      - gram
      - liter
      required: false
    - id: 3
      name: unit_conversion
      label: Unit Conversion
      hint: null
      type: select_one
      options:
      - Kilogram to Gram
      - Gram to Kilogram
      - Meter to Liter
      - Liter to Meter
      required: false
    - id: 4
      name: mass_conversion
      label: Mass Conversion
      hint: null
      type: select_multiple
      options:
      - kilogram
      - gram
      required: true
    - id: 5
      name: length_conversion
      label: Length Conversion
      hint: null
      type: select_multiple
      options:
      - Meter to Kilometer
      - Kilometer to Meter
      - Meter to Gram
      - Gram to Meter
      required: true
    - id: 6
      name: density_conversions
      label: Density Conversions
      hint: null
      type: select_multiple
      options:
      - kg/m3 to g/L
      - g/L to kg/m3
      required: false
    - id: 7
      name: volume_conversions
      label: Volume Conversions
      hint: null
      type: select_multiple
      options:
      - L to m3
      - m3 to L
      required: false
