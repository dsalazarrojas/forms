inputSchema:
  type: object
  properties:
    title: Investment Performance Disclosure Consent Form
    pages:
    - id: 1
      name: consent
      label: Is the investment performance disclosure consent form necessary for you,
        as an investor?
      hint: null
      type: radio
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: investment_date
      label: When was your investment made?
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: investment_type
      label: What type of investment is this for?
      hint: null
      type: select_one
      options:
      - Equity
      - Fixed Income
      - Other
      required: true
    - id: 6
      name: phone
      label: What is your phone number?
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: investment_time
      label: What time did you make this investment?
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: experience
      label: Which of the following options best describes your investment experience?
      hint: null
      type: select_multiple
      options:
      - Investment Beginner
      - Experienced Investor
      - Investment Professional
      required: true
    - id: 9
      name: consent_terms
      label: Have you read and understood the terms and conditions?
      hint: null
      type: radio
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: comment
      label: Do you consent to the use of your contact information for follow-up and
        communication?
      hint: null
      type: radio
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: comment_2
      label: Do you have any further comments or questions?
      hint: null
      type: note
      options: []
      required: false
