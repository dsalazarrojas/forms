inputSchema:
  type: object
  properties:
    title: Banking Investment Approval Form
    pages:
    - id: 1
      name: applicant_name
      label: Applicant Name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_email
      label: Email Address
      hint: Professional email address
      type: email
      options: []
      required: true
    - id: 3
      name: applicant_phone
      label: Phone Number
      hint: Business contact number
      type: text
      options: []
      required: true
    - id: 4
      name: investor_type
      label: Investor Type
      hint: Individual or entity classification
      type: select_one
      options:
      - Individual Investor
      - Institutional Investor
      - Corporate Entity
      - Partnership
      - Trust
      required: true
    - id: 5
      name: investment_amount
      label: Proposed Investment Amount
      hint: Total investment amount in USD
      type: number
      options: []
      required: true
    - id: 6
      name: investment_term
      label: Investment Time Horizon
      hint: Planned holding period
      type: select_one
      options:
      - Less than 1 Year
      - 1-3 Years
      - 3-5 Years
      - 5-10 Years
      - 10+ Years
      required: true
    - id: 7
      name: investment_purpose
      label: Purpose of Investment
      hint: What is the intended use of these funds?
      type: text
      options: []
      required: true
    - id: 8
      name: risk_tolerance
      label: Risk Tolerance Level
      hint: Your comfort level with investment risk
      type: select_one
      options:
      - Conservative
      - Moderate
      - Aggressive
      - Very Aggressive
      required: true
    - id: 9
      name: investment_objectives
      label: Primary Investment Objectives
      hint: Select your main goals
      type: select_multiple
      options:
      - Capital Appreciation
      - Income Generation
      - Preservation of Capital
      - Tax Efficiency
      - Diversification
      required: true
    - id: 10
      name: annual_income
      label: Annual Income
      hint: Gross annual income range
      type: select_one
      options:
      - Less than 50000
      - 50000 - 100000
      - 100000 - 250000
      - 250000 - 500000
      - 500000+
      required: true
    - id: 11
      name: net_worth
      label: Estimated Net Worth
      hint: Total assets minus liabilities
      type: select_one
      options:
      - Less than 100000
      - 100000 - 500000
      - 500000 - 1000000
      - 1000000 - 5000000
      - 5000000+
      required: true
    - id: 12
      name: investment_experience
      label: Investment Experience Level
      hint: Years of investment experience
      type: select_one
      options:
      - Novice - Less than 1 year
      - Beginner - 1-3 years
      - Intermediate - 3-5 years
      - Experienced - 5-10 years
      - Expert - 10+ years
      required: true
    - id: 13
      name: portfolio_composition
      label: Current Portfolio Composition
      hint: Where are your current investments located?
      type: text
      options: []
      required: false
    - id: 14
      name: investment_vehicle
      label: Preferred Investment Vehicle
      hint: Type of security or asset
      type: select_one
      options:
      - Stocks
      - Bonds
      - Mutual Funds
      - ETFs
      - Real Estate
      - Derivatives
      - Mixed Portfolio
      required: true
    - id: 15
      name: sector_preference
      label: Sector Preference
      hint: Preferred investment sectors
      type: select_multiple
      options:
      - Technology
      - Healthcare
      - Finance
      - Energy
      - Consumer
      - Utilities
      - Manufacturing
      required: false
    - id: 16
      name: source_of_funds
      label: Source of Investment Funds
      hint: Origin of the capital
      type: select_one
      options:
      - Employment Income
      - Business Ownership
      - Inheritance
      - Sale of Assets
      - Borrowing
      - Other
      required: true
    - id: 17
      name: banking_relationship
      label: Current Banking Relationship
      hint: Do you have an account with us?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Prospective Customer
      required: true
    - id: 18
      name: additional_documents
      label: Supporting Documents Provided
      hint: Select attached documentation
      type: select_multiple
      options:
      - Financial Statements
      - Tax Returns
      - ID Verification
      - Proof of Funds
      - Investment Plan
      required: false
    - id: 19
      name: investment_advisor_consultation
      label: Have You Consulted with a Financial Advisor?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 20
      name: approval_confirmation
      label: I understand the terms and conditions of this investment proposal
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
