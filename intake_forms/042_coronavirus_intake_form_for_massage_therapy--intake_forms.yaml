inputSchema:
  type: object
  properties:
    title: coronavirus_intake_form_for_massage_therapy
    pages:
    - id: 1
      name: client_information
      label: Client Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: health_status
      label: Health Status
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: medical_conditions
      label: Medical Conditions
      hint: List all medical conditions, if any.
      type: select_multiple
      options:
      - Fever
      - Cough
      - Sore Throat
      - Shortness of Breath
      - Chest Pain
      - Fatigue
      - Nausea
      - Vomiting
      - Headache
      - Dizziness
      - Rash
      - Abdominal Pain
      - Abnormal Bleeding
      - Diarrhea
      - Muscle or Joint Pain
      required: true
    - id: 4
      name: travel_history
      label: Travel History
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: recent_exposure
      label: Recent Exposure
      hint: Has there been recent exposure to COVID-19 or someone who has it?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: temperature
      label: Temperature
      hint: What is the client's current temperature?
      type: select_one
      options:
      - Normal
      - Elevated
      - No Temperature Taken
      required: true
    - id: 7
      name: symptoms
      label: Symptoms
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: medical_record
      label: Medical Record
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: medication
      label: Medications
      hint: List any prescription, non-prescription, or herbal medications.
      type: select_multiple
      options:
      - No Medications
      - Prescription Medication
      - Non-Prescription Medication
      - Supplements
      required: true
    - id: 10
      name: allergies
      label: Allergies
      hint: List any known allergies.
      type: select_multiple
      options:
      - No Allergies
      - Allergies
      required: true
    - id: 11
      name: insurance
      label: Insurance
      hint: Is the client using insurance?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: emergency_contact_other
      label: Emergency Contact Other
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: emergency_contact_other_name
      label: Emergency Contact Other Name
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: signature
      label: Client Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 19
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 20
      name: note
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
