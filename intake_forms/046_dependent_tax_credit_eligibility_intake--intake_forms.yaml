inputSchema:
  type: object
  properties:
    title: Dependent Tax Credit Eligibility Intake
    pages:
    - id: 1
      name: client_details
      label: Client Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: tax_year
      label: Tax Year
      hint: null
      type: select_one
      options:
      - '2020'
      - '2021'
      - '2022'
      - '2023'
      required: false
    - id: 3
      name: tax_credit_eligibility
      label: Tax Credit Eligibility
      hint: null
      type: select_multiple
      options:
      - Eligible
      - Ineligible
      - Pending Review
      required: false
    - id: 4
      name: dependents
      label: Dependents
      hint: null
      type: select_multiple
      options:
      - Child
      - Spouse
      - Parent
      - Other
      required: false
    - id: 5
      name: dependent_details
      label: Dependent Details
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: tax_credit_amount
      label: Tax Credit Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
