inputSchema:
  type: object
  properties:
    title: Audit Team Member Intake Form
    pages:
    - id: 1
      name: applicant_full_name
      label: Applicant Full Name
      hint: Legal name of applicant
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_email
      label: Email Address
      hint: Contact email address
      type: email
      options: []
      required: true
    - id: 3
      name: applicant_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: current_department
      label: Current Department
      hint: Your current department
      type: text
      options: []
      required: true
    - id: 5
      name: current_position
      label: Current Position
      hint: Your current job title
      type: text
      options: []
      required: true
    - id: 6
      name: application_date
      label: Application Date
      hint: Date of this application
      type: date
      options: []
      required: true
    - id: 7
      name: desired_role
      label: Desired Role
      hint: What role are you applying for?
      type: select_one
      options:
      - Staff Auditor
      - Senior Auditor
      - Audit Manager
      - IT Auditor
      - Compliance Auditor
      - Forensic Auditor
      - Other
      required: true
    - id: 8
      name: availability_start
      label: Availability Start
      hint: When can you start?
      type: date
      options: []
      required: true
    - id: 9
      name: employment_type
      label: Employment Type
      hint: Preferred employment type
      type: select_one
      options:
      - Full-Time
      - Part-Time
      - Contract
      - Temporary
      - Internship
      required: true
    - id: 10
      name: education_level
      label: Education Level
      hint: Highest level of education
      type: select_one
      options:
      - High School
      - Associate Degree
      - Bachelor Degree
      - Master Degree
      - Doctorate
      - Professional Certification
      required: true
    - id: 11
      name: field_of_study
      label: Field of Study
      hint: Your field of study
      type: text
      options: []
      required: true
    - id: 12
      name: years_experience
      label: Years of Experience
      hint: Total years of relevant experience
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 4-6 years
      - 7-10 years
      - Over 10 years
      required: true
    - id: 13
      name: audit_experience
      label: Audit Experience
      hint: Describe your audit experience
      type: text
      options: []
      required: true
    - id: 14
      name: certifications_held
      label: Certifications Held
      hint: Select all certifications you hold
      type: select_multiple
      options:
      - CPA
      - CIA
      - CISA
      - CFE
      - ACCA
      - Other
      - None
      required: true
    - id: 15
      name: technical_skills
      label: Technical Skills
      hint: Select your technical skills
      type: select_multiple
      options:
      - Data analysis
      - Audit software
      - Excel advanced
      - SQL
      - Python
      - ACL
      - IDEA
      required: true
    - id: 16
      name: industry_knowledge
      label: Industry Knowledge
      hint: Select industries you have experience in
      type: select_multiple
      options:
      - Financial services
      - Healthcare
      - Manufacturing
      - Technology
      - Retail
      - Government
      - Non-profit
      - Other
      required: true
    - id: 17
      name: travel_availability
      label: Travel Availability
      hint: Are you available for travel?
      type: select_one
      options:
      - Yes, frequent travel
      - Yes, occasional travel
      - Yes, limited travel
      - No, local only
      required: true
    - id: 18
      name: why_audit_team
      label: Why Audit Team
      hint: Why do you want to join the audit team?
      type: text
      options: []
      required: true
    - id: 19
      name: strengths
      label: Strengths
      hint: What are your key strengths?
      type: text
      options: []
      required: true
    - id: 20
      name: development_goals
      label: Development Goals
      hint: What are your development goals?
      type: text
      options: []
      required: false
    - id: 21
      name: references_available
      label: References Available
      hint: Do you have professional references?
      type: select_one
      options:
      - Yes, will provide
      - Yes, attached
      - 'False'
      required: true
    - id: 22
      name: applicant_signature
      label: Applicant Signature
      hint: Type your full name as electronic signature
      type: text
      options: []
      required: true
