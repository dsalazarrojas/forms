      name: research_type
      label: Research Type
      hint: null
      type: select_one
      options:
      - Clinical
      - Non-Clinical
      required: false
    - id: 2
      name: study_status
      label: Study Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Pending
      required: false
    - id: 3
      name: study_name
      label: Study Name
      hint: null
      type: text
      options: []
