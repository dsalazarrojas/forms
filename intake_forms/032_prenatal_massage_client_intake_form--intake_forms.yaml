inputSchema:
  type: object
  properties:
    title: Prenatal Massage Client Intake Form
    pages:
    - id: 1
      name: first_name
      label: FirstName
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: medical_conditions
      label: MedicalConditions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: allergies
      label: Allergies
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: medications
      label: Medications
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: massage_frequency
      label: MassageFrequency
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: massage_area
      label: MassageArea
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: consent_date
      label: ConsentDate
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: consent_time
      label: ConsentTime
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: consent_signature
      label: ConsentSignature
      hint: null
      type: select_one
      options:
      - Client
      - Client's Spouse
      - Guardian
      - Someone Else
      required: false
