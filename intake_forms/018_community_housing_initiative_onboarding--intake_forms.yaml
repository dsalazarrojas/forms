          - Low or Unstable Income
          - Previous Eviction Record
          - Physical Accessibility Needs
          - Lack of Legal Documentation
          - Criminal Record
        required: true
      - id: 7
        name: support_services
        label: Support Services Required
        hint: Select all that apply
        type: select_multiple
        options:
          - Legal Aid and Advocacy
          - Financial Literacy Coaching
          - Job Placement Assistance
          - Mental Health Support
          - Substance Use Recovery
          - Childcare Services
        required: false
      - id: 8
        name: documentation_provided
        label: Documentation Provided at Intake
        hint: null
        type: select_multiple
        options:
          - State Issued ID
          - Birth Certificate
          - Social Security Card
          - Proof of Income
          - Recent Utility Bill
        required: true
      - id: 9
        name: contact_frequency
        label: Preferred Frequency of Case Management Contact
        hint: null
        type: select_one
        options:
          - Daily Check-ins
          - Weekly Check-ins
          - Bi-weekly Check-ins
          - Monthly Check-ins
        required: true
      - id: 10
        name: next_steps
        label: Agreed Upon Next Steps and Action Items
        hint: null
        type: text
        options: []
        required: true
      - id: 11
        name: counselor_signature
