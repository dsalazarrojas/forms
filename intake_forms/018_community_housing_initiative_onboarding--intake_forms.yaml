inputSchema:
  type: object
  properties:
    title: Community Housing Initiative Onboarding
    pages:
      - id: 1
        name: section_intake
        label: -- Intake Administration --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: coordinator_name
        label: Intake Coordinator Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: applicant_name
        label: Applicant Full Name
        hint: null
        type: text
        options: []
        required: true
      - id: 4
        name: intake_date
        label: Date of Intake
        hint: null
        type: date
        options: []
        required: true
      - id: 5
        name: urgency_level
        label: Urgency Level for Housing
        hint: null
        type: select_one
        options:
          - Immediate Crisis - Homeless tonight
          - High - Within 30 days
          - Medium - Stable but seeking
          - Low - Long-term planning
        required: true
      - id: 6
        name: housing_barriers
        label: Identified Housing Barriers
        hint: Select all that apply
        type: select_multiple
        options:
