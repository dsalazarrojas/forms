inputSchema:
  type: object
  properties:
    title: Sports Massages Consultation Form
    pages:
    - id: 1
      name: new_client_form
      label: New Client Form
      hint: null
      type: select_one
      options:
      - 'Client Type: Active, Inactive, Returning'
      - 'Client Type: New, Existing'
      required: true
    - id: 2
      name: contact_information_form
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: medical_history_form
      label: Medical History Form
      hint: null
      type: select_multiple
      options:
      - Pregnant, Non Pregnant
      - Has Allergies, No Allergies
      required: true
    - id: 4
      name: health_status_form
      label: Health Status
      hint: null
      type: select_one
      options:
      - Excellent, Good, Fair
      - Poor
      required: true
    - id: 5
      name: medical_condition_form
      label: Medical Condition
      hint: null
      type: select_one
      options:
      - Chronic Pain, Acute Injury
      - Other
      required: true
    - id: 6
      name: massage_goals_form
      label: Massage Goals
      hint: null
      type: select_multiple
      options:
      - Muscle Relaxation, Muscle Relief
      - Improve Circulation
      required: true
    - id: 7
      name: medical_conditions_form
      label: Medical Conditions
      hint: null
      type: select_multiple
      options:
      - High Blood Pressure, Low Blood Pressure
      - Diabetes
      required: true
    - id: 8
      name: massage_frequencies_form
      label: Massage Frequencies
      hint: null
      type: select_multiple
      options:
      - Once A Week, 2-3 Times A Week
      - Once A Month
      required: true
    - id: 9
      name: medical_history_form
      label: Medical History
      hint: null
      type: select_one
      options:
      - Active, Inactive
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: contact_form
      label: Contact Form
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: time_form
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: note_form
      label: Note
      hint: null
      type: note
      options: []
      required: true
    - id: 13
      name: email_form
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 14
      name: phone_number_form
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
