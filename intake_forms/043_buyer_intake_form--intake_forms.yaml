inputSchema:
  type: object
  properties:
    title: Buyer Intake Form
    pages:
    - id: 1
      name: buyer_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: buyer_email
      label: Email Address
      hint: Your contact email
      type: email
      options: []
      required: true
    - id: 3
      name: buyer_phone
      label: Phone Number
      hint: Your contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: agent_assigned
      label: Real Estate Agent Name
      hint: Your assigned agent's name
      type: text
      options: []
      required: false
    - id: 5
      name: marital_status
      label: Marital Status
      hint: null
      type: select_one
      options:
      - Single
      - Married or partnered
      - Divorced or separated
      - Widowed
      - Prefer not to say
      required: false
    - id: 6
      name: co_buyer_name
      label: Co-Buyer or Co-Borrower Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 7
      name: household_size
      label: Household Size
      hint: Number of people in household
      type: number
      options: []
      required: false
    - id: 8
      name: employment_status
      label: Employment Status
      hint: null
      type: select_one
      options:
      - Employed full-time
      - Employed part-time
      - Self-employed
      - Retired
      - Unemployed or seeking
      - Other
      required: true
    - id: 9
      name: annual_income
      label: Approximate Annual Income
      hint: In USD or local currency
      type: select_one
      options:
      - Under $50000
      - $50000 - $75000
      - $75000 - $100000
      - $100000 - $150000
      - $150000 - $250000
      - $250000 - $500000
      - Over $500000
      - Prefer not to say
      required: false
    - id: 10
      name: credit_score_estimate
      label: Estimated Credit Score Range
      hint: null
      type: select_one
      options:
      - Below 580
      - 580 - 669
      - 670 - 739
      - 740 - 799
      - 800 and above
      - Unsure
      required: false
    - id: 11
      name: home_buying_timeline
      label: Home Buying Timeline
      hint: When do you want to buy?
      type: select_one
      options:
      - Urgent - next 30 days
      - Soon - 1-3 months
      - Short-term - 3-6 months
      - Medium-term - 6-12 months
      - Long-term - 12+ months
      required: true
    - id: 12
      name: property_type_preference
      label: Property Type Preference
      hint: null
      type: select_multiple
      options:
      - Single-family home
      - Condo
      - Townhouse
      - Multi-family
      - Land
      - New construction
      - Historic home
      - Undecided
      required: true
    - id: 13
      name: location_preference
      label: Location Preference
      hint: Cities, neighborhoods, areas
      type: text
      options: []
      required: true
    - id: 14
      name: price_range
      label: Price Range for Purchase
      hint: In USD or local currency
      type: select_one
      options:
      - Under $200000
      - $200000 - $400000
      - $400000 - $600000
      - $600000 - $800000
      - $800000 - $1 million
      - Over $1 million
      - Not determined
      required: true
    - id: 15
      name: down_payment_amount
      label: Down Payment Amount Available
      hint: Dollar amount or percentage
      type: text
      options: []
      required: false
    - id: 16
      name: mortgage_preapproval
      label: Pre-Approved for Mortgage
      hint: null
      type: select_one
      options:
      - Yes, pre-approved
      - Not yet pre-approved
      - All cash purchase
      - Still determining
      required: true
    - id: 17
      name: preferred_loan_type
      label: Preferred Loan Type
      hint: null
      type: select_one
      options:
      - Conventional
      - FHA
      - VA
      - USDA
      - Jumbo
      - Other
      - Unsure
      required: false
    - id: 18
      name: must_have_features
      label: Must-Have Features or Priorities
      hint: Garage, yard, updates, etc.
      type: text
      options: []
      required: false
    - id: 19
      name: deal_breakers
      label: Deal-Breakers or Things to Avoid
      hint: Features or situations to avoid
      type: text
      options: []
      required: false
    - id: 20
      name: additional_notes
      label: Additional Information or Notes
      hint: Anything else we should know?
      type: text
      options: []
      required: false
