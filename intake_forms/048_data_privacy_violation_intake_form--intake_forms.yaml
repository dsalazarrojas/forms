inputSchema:
  type: object
  properties:
    title: Data Privacy Violation Intake Form
    pages:
    - id: 1
      name: report_type
      label: Report Type
      hint: null
      type: select_one
      options:
      - Report of data breach
      - Report of data misuse
      - Report of data misuse or breach
      required: false
    - id: 2
      name: description
      label: Description of Incident
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_incident
      label: Date of Incident
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time_of_incident
      label: Time of Incident
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: affected_individual
      label: Affected Individual
      hint: null
      type: select_multiple
      options:
      - Jane
      - John
      - John and Jane
      required: false
    - id: 6
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: incident_details
      label: Incident Details
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: incident_image
      label: Incident Image
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: reported_by
      label: Reported By
      hint: null
      type: select_multiple
      options:
      - User 1
      - User 2
      - User 1 and User 2
      required: false
