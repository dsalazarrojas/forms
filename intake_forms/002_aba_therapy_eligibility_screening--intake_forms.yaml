inputSchema:
  type: object
  properties:
    title: ABA Therapy Eligibility Screening
    pages:
    - id: 1
      name: patient_information_header
      label: -- Patient Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient full name
      hint: Legal name of the child or client
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of birth
      hint: Enter date of birth for age verification
      type: date
      options: []
      required: true
    - id: 4
      name: guardian_name
      label: Guardian or parent name
      hint: Primary caregiver for the patient if under 18
      type: text
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact phone number
      hint: Best phone to reach guardian or patient
      type: text
      options: []
      required: true
    - id: 6
      name: referral_reason
      label: Reason for referral
      hint: Brief description of presenting concerns
      type: text
      options: []
      required: true
    - id: 7
      name: developmental_concerns
      label: Developmental concerns
      hint: Select any areas of concern
      type: select_multiple
      options:
      - Communication
      - Social skills
      - Repetitive behaviors
      - Adaptive skills
      - Attention and focus
      required: true
    - id: 8
      name: previous_diagnoses
      label: Previous diagnoses or evaluations
      hint: List any prior diagnoses or professional evaluations
      type: text
      options: []
      required: false
    - id: 9
      name: insurance_provider
      label: Insurance provider
      hint: Primary insurance for billing
      type: text
      options: []
      required: false
    - id: 10
      name: preferred_service_model
      label: Preferred service model
      hint: Choose the preferred mode of therapy delivery
      type: select_one
      options:
      - In clinic
      - In home
      - Telehealth
      required: true
    - id: 11
      name: availability_notes
      label: Availability notes
      hint: Days and times available for initial sessions
      type: text
      options: []
      required: false
    - id: 12
      name: initial_screening_conclusion
      label: Screening conclusion
      hint: Determination of eligibility after screening
      type: select_one
      options:
      - Eligible for ABA assessment
      - Not eligible at this time
      - Requires further evaluation
      required: true
    - id: 13
      name: screening_notes
      label: Screening notes and recommendations
      hint: Clinician observations and next steps
      type: text
      options: []
      required: false
