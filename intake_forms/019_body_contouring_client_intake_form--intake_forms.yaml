inputSchema:
  type: object
  properties:
    title: Body Contouring Client Intake Form
    pages:
    - id: 1
      name: client_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: client_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: client_date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: client_address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: client_city_state_zip
      label: City - State - Zip
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: body_contouring_goals
      label: What are your body contouring goals
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: treatment_areas
      label: Which areas are you interested in
      hint: Select all that apply
      type: select_multiple
      options:
      - Face
      - Neck
      - Chin
      - Arms
      - Abdomen
      - Waist
      - Hips
      - Thighs
      - Buttocks
      - Legs
      - Calves
      - Multiple Areas
      required: true
    - id: 10
      name: body_type
      label: Current Body Type
      hint: null
      type: select_one
      options:
      - Apple
      - Pear
      - Hourglass
      - Rectangle
      - Inverted Triangle
      - Other
      required: false
    - id: 11
      name: previous_procedures
      label: Previous Body Contouring Procedures
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: procedure_satisfaction
      label: Satisfaction with Previous Procedures
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Not Applicable
      required: false
    - id: 13
      name: current_medications
      label: Current Medications
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: medical_conditions
      label: Relevant Medical Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: allergies
      label: Known Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: skin_conditions
      label: Skin Conditions or Sensitivities
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: pregnancy_status
      label: Are you currently pregnant or nursing
      hint: null
      type: select_one
      options:
      - Yes - Pregnant
      - Yes - Nursing
      - 'False'
      - Unsure
      - Not Applicable
      required: true
    - id: 18
      name: smoking_status
      label: Smoking Status
      hint: null
      type: select_one
      options:
      - Non-smoker
      - Former Smoker
      - Current Smoker
      - Occasional Smoker
      required: true
    - id: 19
      name: exercise_routine
      label: Current Exercise Routine
      hint: Frequency and type of activity
      type: text
      options: []
      required: false
    - id: 20
      name: diet_habits
      label: Dietary Habits
      hint: Any specific diet or restrictions
      type: text
      options: []
      required: false
    - id: 21
      name: realistic_expectations
      label: Do you have realistic expectations about results
      hint: null
      type: select_one
      options:
      - 'True'
      - Mostly
      - Somewhat
      - 'False'
      required: true
    - id: 22
      name: timeline_expectations
      label: Expected Timeline for Results
      hint: null
      type: select_one
      options:
      - Immediate Results
      - 1-2 Weeks
      - 2-4 Weeks
      - 1-3 Months
      - More than 3 Months
      - Unsure
      required: true
    - id: 23
      name: desired_appointment_date
      label: Desired Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 24
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Text Message
      - In Person
      required: true
