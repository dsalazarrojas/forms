inputSchema:
  type: object
  properties:
    title: Financial Services Intake Form
    pages:
    - id: 1
      name: client_info
      label: Client Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: financial_status
      label: Financial Status
      hint: null
      type: select_one
      options:
      - '{''label'': ''Active''}'
      - '{''label'': ''Passive''}'
      - '{''label'': ''Unknown''}'
      required: false
    - id: 4
      name: assets
      label: Assets
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: income
      label: Income
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''0-10k''}'
      - '{''label'': ''10-20k''}'
      - '{''label'': ''20-30k''}'
      - '{''label'': ''30-40k''}'
      - '{''label'': ''40-50k''}'
      - '{''label'': ''50-60k''}'
      - '{''label'': ''60-70k''}'
      - '{''label'': ''70-80k''}'
      - '{''label'': ''80-90k''}'
      - '{''label'': ''90-100k''}'
      required: false
    - id: 6
      name: expenses
      label: Expenses
      hint: null
      type: number
      options: []
      required: false
