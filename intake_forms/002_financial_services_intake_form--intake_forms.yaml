      - 'No'
      required: false
    - id: 12
      name: employment_income
      label: Employment Income
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''Primary''}'
      - '{''label'': ''Secondary''}'
      - '{''label'': ''Other''}'
      required: false
    - id: 13
      name: investment_incomes
      label: Investment Income
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''Investments''}'
      - '{''label'': ''Real Estate''}'
      - '{''label'': ''Other''}'
      required: false
    - id: 14
      name: income_from_other
      label: Income from Other
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: assets_2
