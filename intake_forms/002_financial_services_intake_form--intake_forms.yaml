      name: employment_status
      label: Employment Status
      hint: null
      type: select_one
      options:
      - '{''label'': ''Employed''}'
      - '{''label'': ''Unemployed''}'
      - '{''label'': ''Self-Employed''}'
      - '{''label'': ''Retired''}'
      - '{''label'': ''Disabled''}'
      required: false
    - id: 8
      name: income_source
      label: Income Source
      hint: null
      type: select_one
      options:
      - '{''label'': ''Salary''}'
      - '{''label'': ''Investments''}'
      - '{''label'': ''Rental Income''}'
      - '{''label'': ''Other''}'
      required: false
    - id: 9
      name: financial_institutions
      label: Financial Institutions
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''Bank of America''}'
      - '{''label'': ''Wells Fargo''}'
      - '{''label'': ''Chase''}'
      - '{''label'': ''Credit Union''}'
      - '{''label'': ''Other''}'
      required: false
    - id: 10
      name: assets_type
