inputSchema:
  type: object
  properties:
    title: Medical Intake Form
    pages:
    - id: 1
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_identification
      label: Patient Identification
      hint: null
      type: select_one
      options:
      - Patient 1
      - Patient 2
      - Patient 3
      required: true
    - id: 3
      name: past_surgeries
      label: Past Surgeries
      hint: null
      type: select_multiple
      options:
      - Surgery 1
      - Surgery 2
      - Surgery 3
      required: true
    - id: 4
      name: medical_symptoms
      label: Medical Symptoms
      hint: null
      type: select_multiple
      options:
      - Symptom 1
      - Symptom 2
      - Symptom 3
      required: false
    - id: 5
      name: genetic_information
      label: Genetic Information
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: allergies
      label: Allergies
      hint: null
      type: select_multiple
      options:
      - Allergy 1
      - Allergy 2
      - Allergy 3
      required: true
    - id: 7
      name: medications
      label: Medications
      hint: null
      type: select_multiple
      options:
      - Medication 1
      - Medication 2
      - Medication 3
      required: false
    - id: 8
      name: medical_notes
      label: Medical Notes
      hint: null
      type: text
      options: []
      required: false
