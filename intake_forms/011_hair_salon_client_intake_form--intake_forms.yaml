inputSchema:
  type: object
  properties:
    title: Hair Salon Client Intake Form
    pages:
    - id: 1
      name: new_client
      label: New Client
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: phone
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: hair_services
      label: What services do you need?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Visa
      - Mastercard
      - Amex
      required: false
    - id: 9
      name: special_instructions
      label: Special Instructions
      hint: null
      type: note
      options: []
      required: false
