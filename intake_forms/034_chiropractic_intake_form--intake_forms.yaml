inputSchema:
  type: object
  properties:
    title: Chiropractic Intake Form
    pages:
    - id: 1
      name: personal_information
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      - Prefer not to say
      required: false
    - id: 6
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: zip_code
      label: Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: medical_history
      label: -- Medical History --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: current_complaints
      label: Current Complaints or Symptoms
      hint: What brings you in today
      type: text
      options: []
      required: true
    - id: 14
      name: pain_location
      label: Location of Pain or Discomfort
      hint: null
      type: select_multiple
      options:
      - Neck
      - Upper back
      - Mid-back
      - Lower back
      - Shoulder
      - Arm or hand
      - Leg or foot
      - Other
      required: true
    - id: 15
      name: symptom_duration
      label: How Long Have You Had These Symptoms
      hint: null
      type: select_one
      options:
      - Less than 1 week
      - 1-4 weeks
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - 1-5 years
      - More than 5 years
      required: true
    - id: 16
      name: previous_chiropractic
      label: Previous Chiropractic Care
      hint: null
      type: select_one
      options:
      - Yes, recently
      - Yes, long ago
      - 'No'
      required: true
    - id: 17
      name: previous_injuries
      label: Previous Injuries or Accidents
      hint: Car accidents, falls, sports injuries
      type: text
      options: []
      required: false
    - id: 18
      name: surgical_history
      label: Surgical History
      hint: Any previous surgeries
      type: text
      options: []
      required: false
    - id: 19
      name: medication_allergies
      label: -- Medications and Allergies --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: current_medications
      label: Current Medications
      hint: List all medications
      type: text
      options: []
      required: false
    - id: 21
      name: medication_allergies_list
      label: Medication Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: other_allergies
      label: Other Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: lifestyle_factors
      label: -- Lifestyle Factors --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: occupation
      label: Current Occupation
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: physical_activity
      label: Exercise or Physical Activity Level
      hint: How often and what type
      type: text
      options: []
      required: false
