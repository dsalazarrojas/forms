inputSchema:
  type: object
  properties:
    title: Client Session Preference Information Form
    pages:
    - id: 1
      name: personal_section
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: scheduling_section
      label: -- Session Scheduling Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: session_frequency
      label: Preferred session frequency
      hint: null
      type: select_one
      options:
      - Weekly
      - Bi-weekly
      - Monthly
      - As needed
      required: true
    - id: 7
      name: preferred_days
      label: Preferred days for sessions
      hint: Select all that apply
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 8
      name: preferred_time
      label: Preferred time of day
      hint: null
      type: select_one
      options:
      - Early morning (6am-9am)
      - Morning (9am-12pm)
      - Afternoon (12pm-3pm)
      - Late afternoon (3pm-6pm)
      - Evening (6pm-9pm)
      required: true
    - id: 9
      name: session_duration
      label: Preferred session duration
      hint: null
      type: select_one
      options:
      - 30 minutes
      - 45 minutes
      - 1 hour
      - 90 minutes
      required: true
    - id: 10
      name: location_preferences
      label: -- Location Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: session_format
      label: Preferred session format
      hint: null
      type: select_one
      options:
      - In-person
      - Virtual/Online
      - Phone
      - No preference
      required: true
    - id: 12
      name: location
      label: If in-person, preferred location
      hint: Optional
      type: text
      options: []
      required: false
    - id: 13
      name: communication_section
      label: -- Communication Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: contact_preference
      label: Preferred contact method for reminders
      hint: null
      type: select_one
      options:
      - Email
      - Phone call
      - SMS text
      - No reminders
      required: true
    - id: 15
      name: language_preference
      label: Language preference
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - French
      - Other
      required: false
    - id: 16
      name: expectations_section
      label: -- Session Expectations --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: session_goals
      label: What are your main goals for these sessions?
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: accessibility_needs
      label: Do you have any accessibility needs?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      required: false
    - id: 19
      name: accessibility_details
      label: Please describe your accessibility needs
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 20
      name: additional_notes
      label: Additional preferences or notes
      hint: Optional
      type: text
      options: []
      required: false
