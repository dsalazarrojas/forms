inputSchema:
  type: object
  properties:
    title: Mothers And Children Acceptance Form
    pages:
    - id: 1
      name: parent_consent
      label: Parent Consent
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: contact_details
      label: Contact Information
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: child_info
      label: Child Information
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
