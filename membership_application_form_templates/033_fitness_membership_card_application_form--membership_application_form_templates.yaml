inputSchema:
  type: object
  properties:
    title: Fitness Membership Card Application Form
    pages:
    - id: 1
      name: membership_period
      label: Membership Period
      hint: null
      type: select_one
      options:
      - Monthly
      - 3-Month
      - 6-Month
      - 12-Month
      required: true
    - id: 2
      name: membership_card_type
      label: Membership Card Type
      hint: null
      type: select_one
      options:
      - Type 1
      - Type 2
      - Type 3
      required: true
    - id: 3
      name: membership_card_number
      label: Membership Card Number
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: membership_start_date
      label: Membership Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: membership_end_date
      label: Membership End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: membership_status
      label: Membership Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Expired
      required: true
