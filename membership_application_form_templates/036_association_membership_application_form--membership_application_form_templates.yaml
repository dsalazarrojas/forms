inputSchema:
  type: object
  properties:
    title: Association Membership Application Form
    pages:
    - id: 1
      name: application_date
      label: Application Date
      hint: Date of submission
      type: date
      options: []
      required: true
    - id: 2
      name: membership_type
      label: Membership Type
      hint: Which membership level?
      type: select_one
      options:
      - Individual
      - Student
      - Family
      - Corporate
      - Sustaining
      - Lifetime
      required: true
    - id: 3
      name: applicant_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 4
      name: applicant_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: Your birth date
      type: date
      options: []
      required: true
    - id: 6
      name: email_address
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 7
      name: phone_number
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 8
      name: mailing_address
      label: Mailing Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 9
      name: city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 10
      name: state_province
      label: State/Province
      hint: State or province
      type: text
      options: []
      required: true
    - id: 11
      name: zip_code
      label: ZIP/Postal Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 12
      name: country
      label: Country
      hint: Country of residence
      type: text
      options: []
      required: true
    - id: 13
      name: professional_title
      label: Professional Title or Occupation
      hint: Current job or role
      type: text
      options: []
      required: true
    - id: 14
      name: organization_affiliation
      label: Organization or Company
      hint: Current employer or affiliation
      type: text
      options: []
      required: true
    - id: 15
      name: years_experience
      label: Years of Experience in Field
      hint: Professional experience
      type: number
      options: []
      required: true
    - id: 16
      name: educational_background
      label: Educational Background
      hint: Degrees and qualifications
      type: text
      options: []
      required: true
    - id: 17
      name: professional_interests
      label: Professional Interests
      hint: What interests you in this field?
      type: text
      options: []
      required: true
    - id: 18
      name: membership_goals
      label: Goals for Membership
      hint: Why do you want to join?
      type: text
      options: []
      required: true
    - id: 19
      name: how_heard_about_association
      label: How Did You Hear About Us
      hint: Source of information
      type: select_one
      options:
      - Website
      - Social Media
      - Friend or Colleague
      - Professional Conference
      - Email Newsletter
      - Search Engine
      - Print Advertisement
      - Other
      required: true
    - id: 20
      name: prior_membership
      label: Prior Membership with Organization
      hint: Were you a member before?
      type: select_one
      options:
      - 'No'
      - 'Yes'
      required: true
    - id: 21
      name: referred_by
      label: Referred By (Optional)
      hint: Name of member who referred you
      type: text
      options: []
      required: false
    - id: 22
      name: membership_benefits_interest
      label: Interested In
      hint: Check all that apply
      type: select_multiple
      options:
      - Newsletters and Publications
      - Professional Development
      - Networking Events
      - Conference Access
      - Job Board Access
      - Mentorship Program
      - Committee Participation
      required: true
    - id: 23
      name: payment_method
      label: Payment Method
      hint: How will you pay dues?
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Bank Transfer
      - Check
      - PayPal
      required: true
    - id: 24
      name: terms_agreement
      label: I agree to the membership terms and conditions
      hint: Confirm agreement
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
    - id: 25
      name: submission_date
      label: Form Submission Date
      hint: Date form was completed
      type: date
      options: []
      required: true
