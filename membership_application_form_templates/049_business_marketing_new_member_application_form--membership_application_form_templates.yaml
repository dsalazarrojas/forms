inputSchema:
  type: object
  properties:
    title: Business Marketing New Member Application Form
    pages:
    - id: 1
      name: header
      label: -- Membership Application --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_name
      label: Applicant name
      hint: Full name of applicant
      type: text
      options: []
      required: true
    - id: 3
      name: company_name
      label: Company name
      hint: Applicant organization
      type: text
      options: []
      required: false
    - id: 4
      name: contact_email
      label: Contact email
      hint: For membership communications
      type: email
      options: []
      required: true
    - id: 5
      name: membership_type
      label: Membership type
      hint: Select membership level
      type: select_one
      options:
      - Individual
      - Small business
      - Corporate
      required: true
    - id: 6
      name: industry
      label: Industry
      hint: Primary industry sector
      type: text
      options: []
      required: false
    - id: 7
      name: marketing_focus_areas
      label: Marketing focus areas
      hint: Areas where you want support
      type: select_multiple
      options:
      - Digital marketing
      - Content creation
      - Lead generation
      - Branding
      required: false
    - id: 8
      name: agree_terms
      label: Agree to membership terms
      hint: Confirm acceptance of membership terms
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: referral_source
      label: Referral source
      hint: How did you hear about the membership
      type: text
      options: []
      required: false
    - id: 10
      name: additional_information
      label: Additional information
      hint: Any other details for the membership team
      type: text
      options: []
      required: false
