      name: pickup_permissions
      label: Pickup Permissions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: special_instructions
      label: Special Instructions
      hint: null
      type: text
      options: []
      required: false
