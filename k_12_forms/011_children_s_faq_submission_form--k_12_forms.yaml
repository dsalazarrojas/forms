inputSchema:
  type: object
  properties:
    title: Children FAQ Submission Form
    pages:
    - id: 1
      name: submitter_name
      label: Submitter Name
      hint: Name of student or parent submitting question
      type: text
      options: []
      required: false
    - id: 2
      name: submitter_role
      label: Submitter Role
      hint: Select the role of the person submitting
      type: select_one
      options:
      - Student
      - Parent
      - Teacher
      - Staff
      required: true
    - id: 3
      name: school_name
      label: School Name
      hint: Name of school or program
      type: text
      options: []
      required: false
    - id: 4
      name: question_topic
      label: Question Topic
      hint: Topic or category for the FAQ submission
      type: text
      options: []
      required: true
    - id: 5
      name: question_text
      label: Question
      hint: Clear description of the question being asked
      type: text
      options: []
      required: true
    - id: 6
      name: suggested_answer
      label: Suggested Answer
      hint: Optional proposed answer or resources
      type: text
      options: []
      required: false
    - id: 7
      name: consent_publish
      label: Consent to Publish Question
      hint: Allow question to be published in FAQ
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: contact_email
      label: Contact Email
      hint: For follow up if needed
      type: email
      options: []
      required: false
