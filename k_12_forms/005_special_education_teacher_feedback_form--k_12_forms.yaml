inputSchema:
  type: object
  properties:
    title: Special Education Teacher Feedback Form
    pages:
    - id: 1
      name: overall_performance
      label: How would you rate the overall performance of your special education
        teacher?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 2
      name: teacher_support
      label: How often does your teacher provide support and guidance when you need
        it?
      hint: null
      type: select_one
      options:
      - Always
      - Often
      - Rarely
      required: false
    - id: 3
      name: student_performance
      label: How would you rate your own performance and progress in the class?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: teacher_attendance
      label: How often does your teacher attend classes regularly?
      hint: null
      type: select_one
      options:
      - Always
      - Often
      - Rarely
      required: false
    - id: 5
      name: communication
      label: How would you rate the communication between you and your teacher?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: overall_rating
      label: What is your overall rating of your special education teacher?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      required: false
    - id: 7
      name: teacher_support_1
      label: How often does your teacher ask for your feedback and opinions?
      hint: null
      type: select_one
      options:
      - Always
      - Often
      - Rarely
      required: false
    - id: 8
      name: teacher_support_2
      label: How often does your teacher provide opportunities for you to ask questions?
      hint: null
      type: select_one
      options:
      - Always
      - Often
      - Rarely
      required: false
