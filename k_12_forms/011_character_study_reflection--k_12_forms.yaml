inputSchema:
  type: object
  properties:
    title: Character Study Reflection
    pages:
      - id: 1
        name: student_name
        label: Student Name
        hint: Your full name
        type: text
        options: []
        required: true
      - id: 2
        name: grade_level
        label: Grade Level
        hint: Your current grade
        type: select_one
        options:
          - 6th grade
          - 7th grade
          - 8th grade
          - 9th grade
          - 10th grade
          - 11th grade
          - 12th grade
        required: true
      - id: 3
        name: book_title
        label: Book Title
        hint: Name of the book or story
        type: text
        options: []
        required: true
      - id: 4
        name: author_name
        label: Author Name
        hint: Who wrote the book
        type: text
        options: []
        required: true
      - id: 5
        name: character_name
        label: Character You Studied
        hint: Main character you analyzed
        type: text
        options: []
        required: true
      - id: 6
        name: character_role
        label: What role does this character play
        hint: Their importance in the story
        type: select_one
        options:
          - Protagonist
          - Antagonist
          - Supporting character
          - Minor character
          - Narrator
        required: true
      - id: 7
        name: character_traits
        label: Describe three character traits
        hint: List personality characteristics
        type: text
        options: []
        required: true
      - id: 8
        name: character_motivation
        label: What motivates this character
        hint: What drives their actions
        type: text
        options: []
        required: true
      - id: 9
        name: character_challenge
        label: What challenge does the character face
        hint: Main conflict or problem
        type: text
        options: []
        required: true
      - id: 10
        name: character_response
        label: How does the character respond to challenges
        hint: Their reaction and choices
        type: text
        options: []
        required: true
      - id: 11
        name: character_change
        label: Does the character change throughout the story
        hint: Describe their growth or decline
        type: select_one
        options:
          - Yes they grow positively
          - Yes they change negatively
          - No they stay the same
          - It is unclear
        required: true
      - id: 12
        name: favorite_quote
        label: Share a quote about or from this character
        hint: Write the quote and page number
        type: text
        options: []
        required: false
      - id: 13
        name: character_connection
        label: Can you relate to this character
        hint: Explain your connection
        type: select_one
        options:
          - Yes very much
          - Somewhat
          - Not really
          - Not at all
        required: true
      - id: 14
        name: lesson_learned
        label: What lesson did you learn from this character
        hint: Life lesson or takeaway
        type: text
        options: []
        required: true
      - id: 15
        name: character_rating
        label: How would you rate this character
        hint: Your overall opinion
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below average
          - Poor
        required: true
      - id: 16
        name: recommend_character
        label: Would you recommend this character to others
        hint: Should others read about them
        type: select_one
        options:
          - Definitely yes
          - Probably yes
          - Not sure
          - Probably no
          - Definitely no
        required: true
      - id: 17
        name: additional_thoughts
        label: Any additional thoughts or reflections
        hint: Share more insights
        type: text
        options: []
        required: false
