inputSchema:
  type: object
  properties:
    title: Classroom Student Altercation Incident Report
    pages:
      - id: 1
        name: incident_date
        label: Incident Date
        hint: Date when the altercation occurred
        type: date
        options: []
        required: true
      - id: 2
        name: incident_time
        label: Incident Time
        hint: Time when the altercation occurred
        type: time
        options: []
        required: true
      - id: 3
        name: incident_location
        label: Incident Location
        hint: Where did the altercation take place
        type: select_one
        options:
          - Classroom
          - Hallway
          - Cafeteria
          - Playground
          - Gymnasium
          - Bathroom
          - School Bus
          - Other School Property
          - Off-Campus School Event
        required: true
      - id: 4
        name: specific_location
        label: Specific Location Details
        hint: More specific location description
        type: text
        options: []
        required: true
      - id: 5
        name: reporting_teacher_name
        label: Reporting Teacher Name
        hint: Name of the staff member reporting the incident
        type: text
        options: []
        required: true
      - id: 6
        name: reporting_teacher_id
        label: Reporting Teacher ID
        hint: Employee ID number
        type: text
        options: []
        required: true
      - id: 7
        name: grade_level
        label: Grade Level
        hint: Grade level of students involved
        type: select_one
        options:
          - Kindergarten
          - Grade 1-2
          - Grade 3-5
          - Grade 6-8
          - Grade 9-12
        required: true
      - id: 8
        name: student_1_name
        label: Student 1 Name
        hint: Full name of first student involved
        type: text
        options: []
        required: true
      - id: 9
        name: student_1_id
        label: Student 1 ID Number
        hint: Student identification number
        type: text
        options: []
        required: true
      - id: 10
        name: student_2_name
        label: Student 2 Name
        hint: Full name of second student involved
        type: text
        options: []
        required: true
      - id: 11
        name: student_2_id
        label: Student 2 ID Number
        hint: Student identification number
        type: text
        options: []
        required: true
      - id: 12
        name: other_students_involved
        label: Other Students Involved
        hint: Names of any other students involved
        type: text
        options: []
        required: false
      - id: 13
        name: witnesses_present
        label: Witnesses Present
        hint: Names of students or staff who witnessed the incident
        type: text
        options: []
        required: false
      - id: 14
        name: incident_type
        label: Type of Altercation
        hint: Select the primary type of incident
        type: select_one
        options:
          - Verbal Argument
          - Physical Fight
          - Threatening Behavior
          - Bullying or Harassment
          - Property Damage
          - Other
        required: true
      - id: 15
        name: incident_description
        label: Detailed Description of Incident
        hint: Provide a detailed account of what happened
        type: text
        options: []
        required: true
      - id: 16
        name: precipitating_factors
        label: Precipitating Factors
        hint: What led up to the altercation
        type: text
        options: []
        required: true
      - id: 17
        name: injuries_sustained
        label: Injuries Sustained
        hint: Describe any injuries
        type: select_one
        options:
          - No Injuries
          - Minor Injuries - First aid administered
          - Moderate Injuries - Nurse visited
          - Serious Injuries - Medical attention required
        required: true
      - id: 18
        name: injury_details
        label: Injury Details
        hint: Describe injuries and treatment provided
        type: text
        options: []
        required: false
      - id: 19
        name: immediate_actions_taken
        label: Immediate Actions Taken
        hint: What actions were taken immediately after the incident
        type: text
        options: []
        required: true
      - id: 20
        name: staff_intervention
        label: Staff Intervention
        hint: Which staff members intervened
        type: text
        options: []
        required: true
      - id: 21
        name: parents_notified
        label: Parents or Guardians Notified
        hint: Were parents contacted about the incident
        type: select_one
        options:
          - Yes - Both sets of parents notified
          - Yes - Only one set of parents notified
          - No - Will notify later
          - No - Awaiting administrator guidance
        required: true
      - id: 22
        name: disciplinary_actions
        label: Disciplinary Actions Taken
        hint: What disciplinary measures were implemented
        type: select_multiple
        options:
          - Verbal Warning
          - Written Warning
          - Detention
          - Suspension
          - Parent Conference
          - Behavior Contract
          - Referral to Counselor
          - Other
        required: true
      - id: 23
        name: follow_up_required
        label: Follow-Up Required
        hint: Is follow-up action needed
        type: select_one
        options:
          - Yes - Administrator meeting scheduled
          - Yes - Counselor involvement needed
          - Yes - Parent conference needed
          - No - Matter resolved
        required: true
      - id: 24
        name: follow_up_date
        label: Follow-Up Date
        hint: Scheduled date for follow-up
        type: date
        options: []
        required: false
      - id: 25
        name: additional_comments
        label: Additional Comments
        hint: Any other relevant information
        type: text
        options: []
        required: false
      - id: 26
        name: report_submitted_by
        label: Report Submitted By
        hint: Name of person submitting this report
        type: text
        options: []
        required: true
      - id: 27
        name: report_date
        label: Report Date
        hint: Date this report is being submitted
        type: date
        options: []
        required: true
