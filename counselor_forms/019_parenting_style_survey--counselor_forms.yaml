inputSchema:
  type: object
  properties:
    title: Parenting Style Survey
    pages:
    - id: 1
      name: question_1
      label: How often do you give in to your child's demands?
      hint: Be careful of over-indulgence
      type: select_one
      options:
      - Never
      - Rarely
      - Sometimes
      - Often
      required: true
    - id: 2
      name: question_2
      label: How responsive are you to your child's needs?
      hint: null
      type: select_one
      options:
      - Very
      - Somewhat
      - Not very
      required: true
    - id: 3
      name: question_3
      label: How much time do you spend with your child?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: question_4
      label: How often do you show positive emotions to your child?
      hint: null
      type: select_multiple
      options:
      - Always
      - Often
      - Sometimes
      - Rarely
      required: true
    - id: 5
      name: question_5
      label: How often do you use positive reinforcement?
      hint: null
      type: select_one
      options:
      - Always
      - Often
      - Sometimes
      - Rarely
      - Never
      required: true
    - id: 6
      name: question_6
      label: How much attention do you give to your child's requests?
      hint: null
      type: select_multiple
      options:
      - Always
      - Often
      - Sometimes
      - Rarely
      required: true
