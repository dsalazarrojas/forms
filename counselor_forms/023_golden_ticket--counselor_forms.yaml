inputSchema:
  type: object
  properties:
    title: Golden Ticket
    pages:
    - id: 1
      name: venue
      label: Event Venue
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: start_time
      label: Event Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: end_time
      label: Event End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Movie
      - Musical
      - Theater
      required: true
    - id: 7
      name: number_of_tickets
      label: Number of Tickets
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: ticket_type
      label: Ticket Type
      hint: null
      type: select_one
      options:
      - Single
      - Double
      - Triple
      required: true
    - id: 9
      name: event_description
      label: Event Description
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - chatjane
      required: true
    - id: 13
      name: event_status
      label: Event Status
      hint: null
      type: select_one
      options:
      - Approved
      - Pending
      - Rejected
      required: false
