inputSchema:
  type: object
  properties:
    title: Placement Feedback Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: feedback_date
      label: Date of Placement
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: placement_counselor
      label: Placement Counselor
      hint: null
      type: select_one
      options:
      - Counselor 1
      - Counselor 2
      - Counselor 3
      required: false
    - id: 4
      name: feedback
      label: Feedback
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: suggestions
      label: Suggestions
      hint: Please add your suggestions
      type: text
      options: []
      required: false
    - id: 6
      name: participant_rating
      label: Participant Rating
      hint: null
      type: select_one
      options:
      - Highly Satisfied
      - Satisfied
      - Dissatisfied
      - Highly Dissatisfied
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Highly Satisfied
      - Satisfied
      - Dissatisfied
      - Highly Dissatisfied
      required: false
    - id: 9
      name: assigned_tool
      label: Assessor Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: assessor_rating
      label: Assessor Rating
      hint: null
      type: select_one
      options:
      - Highly Satisfied
      - Satisfied
      - Dissatisfied
      - Highly Dissatisfied
      required: false
    - id: 11
      name: assessor_comments
      label: Assessor Comments
      hint: null
      type: text
      options: []
      required: false
