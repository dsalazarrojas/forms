inputSchema:
  type: object
  properties:
    title: Career Counselor Information Form
    pages:
    - id: 1
      name: counselor_header
      label: -- Counselor Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: counselor_name
      label: Counselor name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: qualifications
      label: Qualifications
      hint: Degrees certifications and licenses
      type: text
      options: []
      required: true
    - id: 4
      name: years_experience
      label: Years of experience
      hint: Total years in counseling or career services
      type: number
      options: []
      required: false
    - id: 5
      name: areas_of_specialty
      label: Areas of specialty
      hint: Select areas of counseling focus
      type: select_multiple
      options:
      - Resume and job search
      - Interview coaching
      - Career transition
      - Skills assessment
      required: false
    - id: 6
      name: contact_email
      label: Contact email
      hint: Email for referrals and scheduling
      type: email
      options: []
      required: true
    - id: 7
      name: office_location
      label: Office location
      hint: Campus or office address
      type: text
      options: []
      required: false
    - id: 8
      name: availability
      label: Availability
      hint: Typical days and hours available
      type: text
      options: []
      required: false
    - id: 9
      name: services_offered
      label: Services offered
      hint: Summary of services provided
      type: text
      options: []
      required: true
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Anything else the team should know
      type: text
      options: []
      required: false
