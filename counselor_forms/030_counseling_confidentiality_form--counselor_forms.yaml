inputSchema:
  type: object
  properties:
    title: Counseling Confidentiality Form
    pages:
    - id: 1
      name: client_information
      label: Client Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: confidentiality_agreement
      label: Confidentiality Agreement
      hint: null
      type: select_multiple
      options:
      - I understand that all communications made in this therapeutic relationship
        shall be confidential.
      - I understand that this agreement can be terminated at any time.
      - I understand that I am expected to maintain confidentiality with respect to
        all information disclosed during our meetings.
      - I understand that the counselor is not responsible for any information disclosed.
      required: false
