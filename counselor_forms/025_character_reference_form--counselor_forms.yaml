inputSchema:
  type: object
  properties:
    title: Character Reference Form
    pages:
      - id: 1
        name: header
        label: -- Character Reference --
        hint: Collect consistent character references for evaluation
        type: note
        options: []
        required: false
      - id: 2
        name: referee_name
        label: referee name
        hint: name of person providing the reference
        type: text
        options: []
        required: true
      - id: 3
        name: referee_email
        label: referee email
        hint: contact information for verification
        type: email
        options: []
        required: false
      - id: 4
        name: subject_name
        label: subject name
        hint: name of the person being referenced
        type: text
        options: []
        required: true
      - id: 5
        name: relationship_to_subject
        label: relationship to subject
        hint: how the referee knows the subject
        type: select_one
        options:
          - Employer
          - Colleague
          - Friend
          - Teacher
          - Other
        required: true
      - id: 6
        name: duration_of_relationship
        label: duration of relationship
        hint: approximate length of acquaintance
        type: text
        options: []
        required: false
      - id: 7
        name: strengths
        label: strengths
        hint: notable positive characteristics
        type: text
        options: []
        required: true
      - id: 8
        name: areas_of_concern
        label: areas of concern
        hint: any observed weaknesses or issues
        type: text
        options: []
        required: false
      - id: 9
        name: overall_recommendation
        label: overall recommendation
        hint: would you recommend this person
        type: select_one
        options:
          - Strongly recommend
          - Recommend
          - Recommend with reservations
          - Do not recommend
        required: true
      - id: 10
        name: reference_date
        label: reference date
        hint: date submitted
        type: date
        options: []
        required: true
