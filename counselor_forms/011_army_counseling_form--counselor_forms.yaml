inputSchema:
  type: object
  properties:
    title: Army Counseling Form
    pages:
    - id: 1
      name: section_personal
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: soldier_name
      label: Soldier Name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: rank
      label: Military Rank
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: service_number
      label: Service Number or ID
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: unit
      label: Unit or Company
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: counseling_date
      label: Date of Counseling Session
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: counselor_name
      label: Counselor or Mental Health Professional Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: section_presenting
      label: -- Presenting Issues --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: reason_for_counseling
      label: Primary Reason for Counseling
      hint: null
      type: select_multiple
      options:
      - Anxiety or worry
      - Depression or low mood
      - Stress management
      - Combat-related trauma
      - Relationship issues
      - Substance use concerns
      - Sleep problems
      - Other
      required: true
    - id: 10
      name: symptom_severity
      label: Overall Severity of Symptoms
      hint: null
      type: select_one
      options:
      - Mild
      - Moderate
      - Severe
      - Very severe
      required: true
    - id: 11
      name: duration_of_issues
      label: How long have these issues been present
      hint: null
      type: select_one
      options:
      - Less than 1 month
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - Over 1 year
      required: true
    - id: 12
      name: functional_impact
      label: Impact on daily functioning
      hint: null
      type: select_one
      options:
      - Minimal impact
      - Mild impact
      - Moderate impact
      - Severe impact
      required: true
    - id: 13
      name: section_history
      label: -- Medical and Personal History --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: previous_counseling
      label: Previous counseling or therapy experience
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not sure
      required: true
    - id: 15
      name: current_medications
      label: Current medications
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: substance_use
      label: Substance use or concerns
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: section_assessment
      label: -- Assessment and Observations --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: mental_status
      label: Mental Status Observation
      hint: Appearance, mood, affect, etc.
      type: text
      options: []
      required: false
    - id: 19
      name: coping_strategies
      label: Current coping strategies
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: support_systems
      label: Available support systems or social connections
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: section_plan
      label: -- Counseling Plan --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: goals
      label: Counseling Goals
      hint: What does the soldier hope to achieve
      type: text
      options: []
      required: true
    - id: 23
      name: recommended_actions
      label: Recommended Actions or Treatment Plan
      hint: null
      type: text
      options: []
      required: true
    - id: 24
      name: follow_up_needed
      label: Follow-up counseling needed
      hint: null
      type: select_one
      options:
      - Yes - urgent
      - Yes - routine
      - No - not at this time
      required: true
