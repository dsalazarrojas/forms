inputSchema:
  type: object
  properties:
    title: Alcohol And Drug Evaluation Form
    pages:
    - id: 1
      name: patient_full_name
      label: Patient Full Name
      hint: Legal name of the patient
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: Patient date of birth
      type: date
      options: []
      required: true
    - id: 3
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      required: true
    - id: 4
      name: contact_phone
      label: Contact Phone
      hint: Primary contact number
      type: text
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: Email for communication
      type: email
      options: []
      required: false
    - id: 6
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of emergency contact
      type: text
      options: []
      required: true
    - id: 7
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Emergency contact number
      type: text
      options: []
      required: true
    - id: 8
      name: evaluation_date
      label: Evaluation Date
      hint: Date of this evaluation
      type: date
      options: []
      required: true
    - id: 9
      name: evaluator_name
      label: Evaluator Name
      hint: Name of counselor/evaluator
      type: text
      options: []
      required: true
    - id: 10
      name: reason_for_evaluation
      label: Reason for Evaluation
      hint: Why is this evaluation being conducted?
      type: select_one
      options:
      - Self-referral
      - Court-ordered
      - Employer referral
      - Family referral
      - Medical referral
      - Probation requirement
      required: true
    - id: 11
      name: substance_use_history
      label: Substance Use History
      hint: Duration of substance use
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 4-7 years
      - 8-15 years
      - Over 15 years
      required: true
    - id: 12
      name: primary_substance
      label: Primary Substance of Concern
      hint: Main substance being evaluated
      type: select_one
      options:
      - Alcohol
      - Marijuana
      - Opioids
      - Benzodiazepines
      - Stimulants
      - Multiple substances
      - Other
      required: true
    - id: 13
      name: frequency_of_use
      label: Frequency of Use
      hint: How often is the substance used?
      type: select_one
      options:
      - Daily
      - Several times per week
      - Weekly
      - Monthly
      - Rarely
      required: true
    - id: 14
      name: previous_treatment
      label: Previous Treatment History
      hint: Have you had treatment before?
      type: select_one
      options:
      - Never
      - Outpatient only
      - Inpatient/residential
      - Both outpatient and inpatient
      - Detox only
      required: true
    - id: 15
      name: withdrawal_symptoms
      label: Withdrawal Symptoms Experienced
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - Anxiety
      - Depression
      - Insomnia
      - Nausea
      - Tremors
      - Sweating
      - Seizures
      - Hallucinations
      required: true
    - id: 16
      name: mental_health_diagnosis
      label: Current Mental Health Diagnosis
      hint: Any diagnosed conditions
      type: select_multiple
      options:
      - None
      - Depression
      - Anxiety disorder
      - PTSD
      - Bipolar disorder
      - ADHD
      - Schizophrenia
      - Other
      required: false
    - id: 17
      name: current_medications
      label: Current Medications
      hint: List all current medications
      type: text
      options: []
      required: true
    - id: 18
      name: family_history
      label: Family History of Addiction
      hint: Any family history of substance abuse?
      type: select_one
      options:
      - Yes, immediate family
      - Yes, extended family
      - No known history
      - Unknown
      required: true
    - id: 19
      name: employment_status
      label: Employment Status
      hint: Current employment situation
      type: select_one
      options:
      - Employed full-time
      - Employed part-time
      - Self-employed
      - Unemployed
      - Student
      - Retired
      - Disabled
      required: true
    - id: 20
      name: living_situation
      label: Living Situation
      hint: Current housing situation
      type: select_one
      options:
      - Living alone
      - Living with family
      - Living with partner
      - Living with friends
      - Homeless
      - In transitional housing
      required: true
    - id: 21
      name: motivation_for_change
      label: Motivation for Change
      hint: Rate your readiness to change
      type: select_one
      options:
      - Not ready to change
      - Thinking about change
      - Ready to change
      - Already making changes
      - Maintaining change
      required: true
    - id: 22
      name: treatment_recommendation
      label: Treatment Recommendation
      hint: Evaluator recommendation
      type: select_one
      options:
      - Outpatient treatment
      - Intensive outpatient
      - Partial hospitalization
      - Inpatient/residential
      - Detoxification first
      - No treatment needed
      - Further assessment needed
      required: true
    - id: 23
      name: follow_up_date
      label: Follow-up Appointment Date
      hint: Scheduled follow-up date
      type: date
      options: []
      required: false
    - id: 24
      name: patient_signature
      label: Patient Acknowledgment
      hint: Patient confirms information is accurate
      type: select_one
      options:
      - I confirm this information is accurate
      - I need to review before confirming
      required: true
