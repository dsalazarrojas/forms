inputSchema:
  type: object
  properties:
    title: NDIS Service Agreement
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: Enter participant name
      type: text
      options: []
      required: true
    - id: 2
      name: provider_name
      label: Provider Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: session_duration
      label: Session Duration
      hint: Enter duration in minutes
      type: number
      options: []
      required: false
    - id: 8
      name: participant_notes
      label: Participant Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: provider_notes
      label: Provider Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: service_agreement
      label: Service Agreement
      hint: null
      type: select_one
      options:
      - I accept the terms and conditions
      - I do not accept the terms and conditions
      required: true
    - id: 11
      name: terms_and_conditions
      label: Terms and Conditions
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: true
    - id: 13
      name: provider_signature
      label: Provider Signature
      hint: null
      type: note
      options: []
      required: true
