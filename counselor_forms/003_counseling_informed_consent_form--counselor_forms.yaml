inputSchema:
  type: object
  properties:
    title: Counseling Informed Consent Form
    pages:
    - id: 1
      name: client_details
      label: Client Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: counseling_details
      label: Counseling Details
      hint: Please provide details about your current situation and concerns.
      type: text
      options: []
      required: false
    - id: 5
      name: goal
      label: Goal
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: counselor_info
      label: Counselor Information
      hint: Is there something we should know about your counselor?
      type: text
      options: []
      required: false
    - id: 7
      name: agreement
      label: Agreement
      hint: null
      type: select_multiple
      options:
      - I understand the importance of confidentiality in the counseling relationship.
      - I understand that all notes, recordings, and other records will be kept confidential
        and will not be shared with anyone outside of the counselor.
      - I understand that I can leave the counseling at any time.
      required: false
    - id: 8
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
