      name: frequency
      label: Frequency
      hint: null
      type: select_one
      options:
      - Weekly
      - Bi-Weekly
      - Monthly
      required: true
    - id: 19
      name: payment_terms
      label: Payment Terms
      hint: How do you prefer to pay for sessions?
      type: text
      options: []
      required: false
    - id: 20
      name: insurance
      label: Insurance
