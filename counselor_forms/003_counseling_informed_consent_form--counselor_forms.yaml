    - id: 23
      name: session_duration
      label: Session Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 24
      name: termination_reason
      label: Termination Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: termination_reason
      label: Termination Reason
      hint: null
      type: text
      options: []
      required: false
