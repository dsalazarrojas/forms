      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: ip_address
      label: IP Address
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: client_agreement
      label: Client Agreement
      hint: Please sign below to confirm you have read and understood the terms of
        this agreement.
      type: text
      options: []
      required: false
    - id: 14
      name: counselor_agreement
      label: Counselor Agreement
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: date_of_last_session
      label: Date of Last Session
      hint: null
      type: date
      options: []
      required: true
    - id: 16
      name: number_of_sessions
      label: Number of Sessions
      hint: null
      type: number
      options: []
      required: false
