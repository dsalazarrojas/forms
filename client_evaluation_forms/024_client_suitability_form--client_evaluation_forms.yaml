inputSchema:
  type: object
  properties:
    title: Client Suitability Form
    pages:
    - id: 1
      name: intro_section
      label: Client Suitability Assessment
      hint: This form helps us determine the most suitable solutions for your needs
      type: note
      options: []
      required: false
    - id: 2
      name: client_info_section
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: financial_section
      label: -- Financial Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: employment_status
      label: Employment Status
      hint: null
      type: select_one
      options:
      - Employed
      - Self-Employed
      - Retired
      - Unemployed
      - Student
      - Other
      required: true
    - id: 9
      name: annual_income
      label: Annual Income Range
      hint: null
      type: select_one
      options:
      - Under $25,000
      - $25,000 - $50,000
      - $50,000 - $100,000
      - $100,000 - $250,000
      - $250,000 - $500,000
      - Over $500,000
      required: true
    - id: 10
      name: liquid_assets
      label: Estimated Liquid Assets
      hint: Cash, savings, accessible investments
      type: select_one
      options:
      - Under $10,000
      - $10,000 - $50,000
      - $50,000 - $100,000
      - $100,000 - $250,000
      - $250,000 - $500,000
      - Over $500,000
      required: false
    - id: 11
      name: net_worth
      label: Estimated Net Worth
      hint: Total assets minus liabilities
      type: select_one
      options:
      - Under $100,000
      - $100,000 - $500,000
      - $500,000 - $1,000,000
      - $1,000,000 - $5,000,000
      - Over $5,000,000
      required: false
    - id: 12
      name: investment_experience
      label: Investment Experience
      hint: null
      type: select_one
      options:
      - No Experience
      - Limited Experience
      - Moderate Experience
      - Extensive Experience
      required: true
    - id: 13
      name: goals_section
      label: -- Financial Goals and Objectives --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: primary_goal
      label: Primary Financial Goal
      hint: null
      type: select_one
      options:
      - Capital Preservation
      - Income Generation
      - Growth
      - Retirement Planning
      - Education Planning
      - Estate Planning
      - Other
      required: true
    - id: 15
      name: investment_timeline
      label: Investment Timeline
      hint: How long do you plan to invest?
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - 10+ years
      required: true
    - id: 16
      name: risk_tolerance
      label: -- Risk Tolerance --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: risk_appetite
      label: How would you describe your risk appetite?
      hint: null
      type: select_one
      options:
      - Very Conservative
      - Conservative
      - Moderate
      - Aggressive
      - Very Aggressive
      required: true
    - id: 18
      name: risk_comfort
      label: How would you react to a 20% decrease in your investment value?
      hint: null
      type: select_one
      options:
      - Would not tolerate this
      - Would be uncomfortable
      - Neutral
      - Could accept this
      - Could tolerate this
      required: true
    - id: 19
      name: portfolio_section
      label: -- Current Portfolio and Investments --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: current_investments
      label: Do you currently have any investments?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 21
      name: investment_types
      label: Types of investments currently held
      hint: Select all that apply
      type: select_multiple
      options:
      - Stocks
      - Bonds
      - Mutual Funds
      - ETFs
      - Real Estate
      - Retirement Accounts
      - Insurance Products
      - Commodities
      - Other
      required: false
    - id: 22
      name: portfolio_value
      label: Approximate current investment portfolio value
      hint: null
      type: select_one
      options:
      - Under $50,000
      - $50,000 - $100,000
      - $100,000 - $250,000
      - $250,000 - $500,000
      - Over $500,000
      required: false
    - id: 23
      name: liabilities_section
      label: -- Liabilities and Obligations --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: mortgage
      label: Do you have a mortgage?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 25
      name: other_debts
      label: Other outstanding debts
      hint: Credit cards, loans, etc.
      type: select_one
      options:
      - 'No'
      - Under $50,000
      - $50,000 - $100,000
      - Over $100,000
      required: false
    - id: 26
      name: dependencies
      label: Number of financial dependents
      hint: null
      type: number
      options: []
      required: false
    - id: 27
      name: suitability_questions
      label: -- Product Suitability Questions --
      hint: null
      type: note
      options: []
      required: false
    - id: 28
      name: understand_products
      label: Do you understand the products or services being proposed?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Partially
      required: true
    - id: 29
      name: questions_answered
      label: Have all your questions been answered to your satisfaction?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 30
      name: acknowledgment
      label: I acknowledge that this assessment was conducted and I received appropriate
        suitability advice
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
