inputSchema:
  type: object
  properties:
    title: Client Relationship Management Assessment Form
    pages:
    - id: 1
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: client_account_name
      label: Client Account Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: assigned_account_manager
      label: Assigned Account Manager
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: relationship_health
      label: Overall Relationship Health
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - At risk
      required: true
    - id: 5
      name: engagement_level
      label: Client Engagement Level
      hint: How actively involved is the client?
      type: select_one
      options:
      - Very high
      - High
      - Moderate
      - Low
      - Very low
      required: true
    - id: 6
      name: communication_frequency
      label: Communication Frequency
      hint: How often do you interact with this client?
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - As needed
      required: true
    - id: 7
      name: contract_status
      label: Contract Status
      hint: null
      type: select_one
      options:
      - Active and current
      - Expiring soon
      - Renewal pending
      - Discontinued
      - On hold
      required: true
    - id: 8
      name: satisfaction_level
      label: Client Satisfaction Level
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 9
      name: upsell_potential
      label: Upsell or Cross-sell Potential
      hint: null
      type: select_one
      options:
      - High potential
      - Good potential
      - Some potential
      - Low potential
      - No potential
      required: false
    - id: 10
      name: risk_of_churn
      label: Risk of Client Churn
      hint: Likelihood of losing this client
      type: select_one
      options:
      - Very low
      - Low
      - Moderate
      - High
      - Very high
      required: true
    - id: 11
      name: top_concerns
      label: Top Client Concerns
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: key_contact_person
      label: Key Contact Person at Client
      hint: Primary point of contact
      type: text
      options: []
      required: true
    - id: 13
      name: account_revenue
      label: Annual Account Revenue
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: strategic_importance
      label: Strategic Importance
      hint: How important is this client to our business strategy?
      type: select_one
      options:
      - Critical
      - High
      - Medium
      - Low
      - Minimal
      required: false
    - id: 15
      name: relationship_action_plan
      label: Action Plan for Relationship Improvement
      hint: Specific steps to strengthen the relationship
      type: text
      options: []
      required: false
    - id: 16
      name: next_review_date
      label: Next Review Date
      hint: When should this assessment be revisited?
      type: date
      options: []
      required: false
