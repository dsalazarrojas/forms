inputSchema:
  type: object
  properties:
    title: Store Features Evaluation Form
    pages:
    - id: 1
      name: overall_appearance
      label: Overall Appearance
      hint: Rate the store's overall appearance
      type: number
      options: []
      required: true
    - id: 2
      name: cleanliness
      label: Cleanliness
      hint: Rate the store's cleanliness
      type: number
      options: []
      required: true
    - id: 3
      name: products_quality
      label: Products Quality
      hint: Rate the store's products quality
      type: number
      options: []
      required: true
    - id: 4
      name: staff_helpfulness
      label: Staff Helpfulness
      hint: Rate the store's staff helpfulness
      type: number
      options: []
      required: true
    - id: 5
      name: location_convenience
      label: Location Convenience
      hint: Rate the store's location convenience
      type: number
      options: []
      required: true
    - id: 6
      name: general_comments
      label: General Comments
      hint: Enter any general comments about the store
      type: text
      options: []
      required: false
    - id: 7
      name: satisfaction_with_prices
      label: Satisfaction with Prices
      hint: Are you satisfied with the store's prices?
      type: checkbox
      options:
      - Very satisfied
      - Neutral
      - Dissatisfied
      required: true
    - id: 8
      name: service_quality
      label: Service Quality
      hint: Rate the store's service quality
      type: number
      options: []
      required: true
    - id: 9
      name: product_variety
      label: Product Variety
      hint: Rate the store's product variety
      type: number
      options: []
      required: true
    - id: 10
      name: overall_rating
      label: Overall Rating
      hint: Rate your overall rating of the store
      type: number
      options: []
      required: true
