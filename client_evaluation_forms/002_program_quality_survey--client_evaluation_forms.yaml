inputSchema:
  type: object
  properties:
    title: Program Quality Survey
    pages:
    - id: 1
      name: program_quality_survey
      label: Program Quality Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: service_area
      label: Service Area
      hint: null
      type: select_one
      options:
      - Health and Human Services
      - Economic Development
      - Social and Environmental
      - Education
      - Community and Culture
      - Transportation
      required: false
    - id: 3
      name: service_quality
      label: Service Quality
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: survey_date
      label: Survey Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: survey_time
      label: Survey Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: contact_name
      label: Contact Name
      hint: Full legal name of person in contact
      type: text
      options: []
      required: false
    - id: 7
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
