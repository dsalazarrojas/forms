inputSchema:
  type: object
  properties:
    title: Client Relationship Evaluation Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: relationship_duration
      label: How Long Have You Been a Client?
      hint: null
      type: select_one
      options:
      - Less than 6 months
      - 6-12 months
      - 1-2 years
      - 2-5 years
      - 5+ years
      required: true
    - id: 3
      name: overall_satisfaction
      label: Overall Satisfaction with Services
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 4
      name: communication_quality
      label: Quality of Communication
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 5
      name: responsiveness
      label: Our Responsiveness to Your Needs
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very poor
      required: true
    - id: 6
      name: professionalism
      label: Our Team's Professionalism
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 7
      name: value_for_money
