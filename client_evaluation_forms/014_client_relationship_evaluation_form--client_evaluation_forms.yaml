      hint: null
      type: select_one
      options:
      - Always consistent
      - Mostly consistent
      - Sometimes inconsistent
      - Often inconsistent
      - Very inconsistent
      required: true
    - id: 9
      name: expectations_met
      label: Were Expectations Met?
      hint: null
      type: select_one
      options:
      - Exceeded expectations
      - Met expectations
      - Mostly met
      - Below expectations
      - Far below expectations
      required: true
    - id: 10
      name: relationship_strength
