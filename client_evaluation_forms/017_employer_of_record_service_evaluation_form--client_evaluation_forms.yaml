inputSchema:
  type: object
  properties:
    title: Employer Of Record Service Evaluation Form
    pages:
    - id: 1
      name: client_feedback
      label: Client Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 3
      name: service_quality
      label: Service Quality
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: communication
      label: Communication
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: timeliness
      label: Timeliness
      hint: null
      type: select_one
      options:
      - Very Quick
      - Somewhat Quick
      - Average
      - Somewhat Slow
      - Very Slow
      required: true
    - id: 6
      name: support
      label: Support
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: frequency_of_support
      label: Frequency of Support
      hint: null
      type: select_multiple
      options:
      - Always
      - Most of the Time
      - Some of the Time
      - Rarely
      required: true
    - id: 8
      name: employer_of_record
      label: Employer of Record
      hint: null
      type: select_one
      options:
      - Our Services
      - Another Service
      required: true
    - id: 9
      name: employer_of_record_service
      label: Employer of Record Service
      hint: null
      type: select_one
      options:
      - Our Services
      - Another Service
      required: true
    - id: 10
      name: overall
      label: Overall
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: overall_2
      label: Overall (Repeated)
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
