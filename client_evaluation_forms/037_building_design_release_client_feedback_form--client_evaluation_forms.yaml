inputSchema:
  type: object
  properties:
    title: Building Design Release Client Feedback Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: company
      label: Company Name
      hint: Organization
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: feedback_date
      label: Feedback Date
      hint: Date of feedback
      type: date
      options: []
      required: true
    - id: 6
      name: project_name
      label: Project Name
      hint: Name of project
      type: text
      options: []
      required: true
    - id: 7
      name: project_type
      label: Project Type
      hint: Classification
      type: select_one
      options:
      - New Construction
      - Renovation
      - Addition
      - Interior Design
      - Landscape Design
      - Master Planning
      - Other
      required: true
    - id: 8
      name: design_phase
      label: Design Phase Released
      hint: Which phase was reviewed
      type: select_one
      options:
      - Conceptual Design
      - Schematic Design
      - Design Development
      - Construction Documents
      - Final Release
      required: true
    - id: 9
      name: release_date
      label: Release Date
      hint: When designs were delivered
      type: date
      options: []
      required: true
    - id: 10
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Rate your satisfaction
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 11
      name: design_quality
      label: Design Quality
      hint: Rate the design quality
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 12
      name: functionality_rating
      label: Functionality Rating
      hint: Does design meet needs
      type: select_one
      options:
      - Exceeds Expectations
      - Meets Expectations
      - Somewhat Meets Expectations
      - Does Not Meet Expectations
      - Far Below Expectations
      required: true
    - id: 13
      name: aesthetics_rating
      label: Aesthetics Rating
      hint: Visual appeal
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 14
      name: sustainability_features
      label: Sustainability Features
      hint: Rate green design elements
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      - Not Applicable
      required: true
    - id: 15
      name: code_compliance
      label: Code Compliance Confidence
      hint: Confidence in compliance
      type: select_one
      options:
      - Very Confident
      - Confident
      - Somewhat Confident
      - Not Very Confident
      - Not Confident
      required: true
    - id: 16
      name: budget_alignment
      label: Budget Alignment
      hint: Does design fit budget
      type: select_one
      options:
      - Well Within Budget
      - Within Budget
      - At Budget Limit
      - Slightly Over Budget
      - Significantly Over Budget
      required: true
    - id: 17
      name: timeline_feasibility
      label: Timeline Feasibility
      hint: Can project meet schedule
      type: select_one
      options:
      - Very Feasible
      - Feasible
      - Somewhat Feasible
      - Challenging
      - Not Feasible
      required: true
    - id: 18
      name: communication_rating
      label: Communication Rating
      hint: Rate team communication
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 19
      name: deliverable_quality
      label: Deliverable Quality
      hint: Quality of drawings and documents
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 20
      name: changes_requested
      label: Changes Requested
      hint: Are changes needed
      type: select_one
      options:
      - No Changes - Approved
      - Minor Changes Needed
      - Moderate Changes Needed
      - Major Changes Needed
      - Significant Redesign Needed
      required: true
    - id: 21
      name: change_description
      label: Change Description
      hint: Describe requested changes
      type: text
      options: []
      required: false
    - id: 22
      name: concerns
      label: Concerns or Issues
      hint: Any concerns
      type: text
      options: []
      required: false
    - id: 23
      name: approval_status
      label: Approval Status
      hint: Current status
      type: select_one
      options:
      - Approved as Is
      - Approved with Minor Revisions
      - Pending Revisions
      - Not Approved
      - Under Review
      required: true
    - id: 24
      name: next_steps
      label: Next Steps
      hint: What happens next
      type: text
      options: []
      required: false
    - id: 25
      name: would_recommend
      label: Would Recommend Services
      hint: To others
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 26
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
