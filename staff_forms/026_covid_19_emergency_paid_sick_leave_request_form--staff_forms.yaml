inputSchema:
  type: object
  properties:
    title: COVID 19 Emergency Paid Sick Leave Request Form
    pages:
    - id: 1
      name: section_header_1
      label: -- Employee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: position
      label: Position or Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: supervisor_name
      label: Supervisor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: employee_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: employee_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: section_header_2
      label: -- Leave Request Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: request_date
      label: Date of Request
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: leave_start_date
      label: Leave Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: leave_end_date
      label: Leave End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: total_hours
      label: Total Hours Requested
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: leave_type
      label: Type of Leave
      hint: null
      type: select_one
      options:
      - COVID-19 related illness
      - COVID-19 exposure quarantine
      - Care for family member with COVID-19
      - Childcare due to school closure
      - Other COVID-19 related reason
      required: true
    - id: 15
      name: section_header_3
      label: -- Reason for Leave --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: reason_description
      label: Reason for Leave Request
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: covid_diagnosis
      label: Have you been diagnosed with COVID-19?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 18
      name: diagnosis_date
      label: Date of Diagnosis
      hint: null
      type: date
      options: []
      required: false
    - id: 19
      name: family_illness
      label: Are you caring for a family member with COVID-19?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 20
      name: section_header_4
      label: -- Documentation --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: supporting_documentation
      label: Supporting Documentation
      hint: Select all that apply
      type: select_multiple
      options:
      - Doctor note
      - Test results
      - Quarantine order
      - School closure notification
      - No documentation available
      required: true
    - id: 22
      name: section_header_5
      label: -- Approval --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: supervisor_approval
      label: Supervisor Approval Status
      hint: null
      type: select_one
      options:
      - Approved
      - Pending
      - Denied
      required: false
    - id: 24
      name: approval_date
      label: Approval Date
      hint: null
      type: date
      options: []
      required: false
    - id: 25
      name: comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
