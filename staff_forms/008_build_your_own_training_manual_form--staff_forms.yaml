        hint: null
        type: select_multiple
        options:
          - New employees
          - Existing staff
          - Managers
          - Contractors
          - Customers
          - All staff
        required: true
      - id: 9
        name: required_reading
        label: Is this manual required reading?
        hint: null
        type: select_one
        options:
          - Yes, mandatory
          - Yes, recommended
          - No, optional
        required: false
      - id: 10
        name: training_topics
