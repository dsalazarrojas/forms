        hint: null
        type: note
        options: []
        required: false
      - id: 11
        name: selected_topics
        label: Select topics to include
        hint: null
        type: select_multiple
        options:
          - Company policies
          - Safety procedures
          - Equipment operation
          - Customer service
          - IT systems
          - Emergency protocols
          - Compliance requirements
          - Role-specific tasks
          - Communication standards
          - Time tracking
        required: true
      - id: 12
        name: additional_topics
        label: Additional custom topics
        hint: List any other topics to cover
        type: text
        options: []
        required: false
      - id: 13
        name: manual_structure
        label: -- Manual Structure --
        hint: null
        type: note
        options: []
        required: false
      - id: 14
        name: table_of_contents
        label: Include table of contents?
        hint: null
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 15
        name: index_included
        label: Include index?
        hint: null
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 16
        name: glossary_included
        label: Include glossary of terms?
        hint: null
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 17
        name: formatting_preferences
        label: -- Formatting and Design --
        hint: null
        type: note
        options: []
        required: false
      - id: 18
        name: manual_format
        label: Manual format
        hint: null
        type: select_one
        options:
          - PDF
          - HTML
          - Digital interactive
          - Printed booklet
        required: true
      - id: 19
        name: color_scheme
        label: Preferred color scheme
        hint: null
        type: select_one
        options:
          - Black and white
          - Brand colors
          - Professional blue
          - Custom
        required: false
      - id: 20
        name: include_images
        label: Include images and diagrams?
        hint: null
        type: select_one
        options:
          - Yes, many
          - Yes, some
          - Minimal
          - No
        required: false
      - id: 21
        name: deadline
        label: -- Delivery Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 22
        name: completion_date
        label: Needed by date
        hint: null
        type: date
        options: []
        required: false
      - id: 23
        name: review_needed
        label: Will this manual require review and approval?
        hint: null
        type: select_one
        options:
          - Yes, by manager
          - Yes, by compliance
          - Yes, by legal
          - No
        required: false
      - id: 24
        name: distribution_method
        label: How should this manual be distributed?
        hint: null
        type: select_multiple
        options:
          - Email to staff
          - Online portal
          - Printed copies
          - Intranet
          - Training sessions
        required: false
