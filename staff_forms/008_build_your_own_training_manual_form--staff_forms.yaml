inputSchema:
  type: object
  properties:
    title: Build Your Own Training Manual Form
    pages:
      - id: 1
        name: manual_info
        label: -- Training Manual Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: manual_title
        label: Training manual title
        hint: Name for your custom manual
        type: text
        options: []
        required: true
      - id: 3
        name: manual_description
        label: Manual description
        hint: Brief overview of the manual purpose
        type: text
        options: []
        required: true
      - id: 4
        name: department
        label: Department or team
        hint: null
        type: text
        options: []
        required: true
      - id: 5
        name: created_by
        label: Created by
        hint: Your name or training team
        type: text
        options: []
        required: true
      - id: 6
        name: version_number
        label: Version number
        hint: Example - 1.0, 2.1
        type: text
        options: []
        required: false
      - id: 7
        name: target_audience
        label: -- Target Audience --
        hint: null
        type: note
        options: []
        required: false
      - id: 8
        name: audience_type
