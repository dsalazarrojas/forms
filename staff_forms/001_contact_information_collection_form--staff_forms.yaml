inputSchema:
  type: object
  properties:
    title: Contact Information Collection Form
    pages:
    - id: 1
      name: full_name
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: We will use this to contact you
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Include area code
      type: text
      options: []
      required: false
    - id: 4
      name: organization
      label: Organization or Company
      hint: Name of your organization
      type: text
      options: []
      required: false
    - id: 5
      name: job_title
      label: Job Title
      hint: Your current position
      type: text
      options: []
      required: false
    - id: 6
      name: address_line_1
      label: Address Line 1
      hint: Street address or P.O. Box
      type: text
      options: []
      required: false
    - id: 7
      name: address_line_2
      label: Address Line 2
      hint: Apartment, suite, or unit number
      type: text
      options: []
      required: false
    - id: 8
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: state_province
      label: State or Province
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: postal_code
      label: Postal Code
      hint: ZIP or postal code
      type: text
      options: []
      required: false
    - id: 11
      name: country
      label: Country
      hint: null
      type: select_one
      options:
      - United States
      - Canada
      - United Kingdom
      - Australia
      - Other
      required: false
    - id: 12
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we reach you?
      type: select_one
      options:
      - Email
      - Phone
      - Mail
      required: true
    - id: 13
      name: contact_purpose
      label: Purpose of Contact
      hint: Why are you providing your information?
      type: select_one
      options:
      - Website Registration
      - Event Sign-up
      - Newsletter Subscription
      - General Inquiry
      - Other
      required: true
    - id: 14
      name: additional_comments
      label: Additional Comments
      hint: Any other information you would like to share
      type: text
      options: []
      required: false
    - id: 15
      name: consent_to_contact
      label: Consent to Contact
      hint: I agree to be contacted regarding my inquiry
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
