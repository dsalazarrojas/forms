inputSchema:
  type: object
  properties:
    title: Daily Shift Report Template
    pages:
    - id: 1
      name: shift_date
      label: Shift Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: shift_start_time
      label: Shift Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: shift_end_time
      label: Shift End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: work_hours
      label: Work Hours
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: break_time
      label: Break Time
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: employee_status
      label: Employee Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: shift_notes
      label: Shift Notes
      hint: null
      type: note
      options: []
      required: false
