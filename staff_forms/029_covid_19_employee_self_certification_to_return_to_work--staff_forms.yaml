inputSchema:
  type: object
  properties:
    title: COVID 19 Employee Self Certification To Return To Work
    pages:
    - id: 1
      name: section_header_1
      label: -- Employee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: supervisor_name
      label: Supervisor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: section_header_2
      label: -- COVID-19 Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: diagnosed_with_covid
      label: Were you diagnosed with COVID-19?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: diagnosis_date
      label: Date of Diagnosis
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: recovery_status
      label: Current Recovery Status
      hint: null
      type: select_one
      options:
      - Fully recovered
      - Significantly improved
      - Still symptomatic
      - Under physician care
      required: false
    - id: 11
      name: time_away
      label: How long were you away from work?
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: days_unit
      label: Unit of time
      hint: null
      type: select_one
      options:
      - Days
      - Weeks
      - Months
      required: false
    - id: 13
      name: section_header_3
      label: -- Health Certification --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: current_symptoms
      label: Do you currently have COVID-19 symptoms?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 15
      name: symptom_list
      label: If yes, describe current symptoms
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: fever_free
      label: Fever-free for at least 24 hours without medication
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not applicable
      required: true
    - id: 17
      name: symptoms_improving
      label: Symptoms are improving
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not applicable
      required: true
    - id: 18
      name: isolation_complete
      label: Have completed isolation period as recommended
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not applicable
      required: true
    - id: 19
      name: physician_cleared
      label: Physician has cleared you to return to work
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not applicable
      required: false
    - id: 20
      name: section_header_4
      label: -- Certification and Agreement --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: statement_truthful
      label: All information in this certification is truthful and accurate
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 22
      name: understand_obligations
      label: I understand my obligation to protect coworkers and workplace
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 23
      name: commitment_safety
      label: I commit to following all workplace safety protocols
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 24
      name: certification_date
      label: Date of Certification
      hint: null
      type: date
      options: []
      required: true
    - id: 25
      name: employee_confirmation
      label: Employee Signature
      hint: I certify that I am fit to return to work
      type: text
      options: []
      required: true
