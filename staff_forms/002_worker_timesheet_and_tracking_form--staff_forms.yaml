inputSchema:
  type: object
  properties:
    title: Worker Timesheet And Tracking Form
    pages:
    - id: 1
      name: worker_timesheet_and_tracking_form
      label: worker_timesheet_and_tracking_form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: clock_in_page
      label: clock_in_page
      hint: Pick a time
      type: select_one
      options:
      - 8:00am
      - 9:00am
      - 10:00am
      - 11:00am
      - 12:00pm
      required: false
    - id: 3
      name: clock_out_page
      label: clock_out_page
      hint: Pick a time
      type: select_one
      options:
      - 8:00pm
      - 9:00pm
      - 10:00pm
      - 11:00pm
      - 12:00am
      required: false
    - id: 4
      name: lunch_break_start
      label: lunch_break_start
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: lunch_break_end
      label: lunch_break_end
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: total_hours_worked
      label: total_hours_worked
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: notes
      label: notes
      hint: Any additional notes
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: email
      hint: Enter your work email address
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: phone
      hint: Enter your work phone number
      type: text
      options: []
      required: false
