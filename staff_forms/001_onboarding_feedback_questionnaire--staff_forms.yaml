inputSchema:
  type: object
  properties:
    title: Onboarding Feedback Questionnaire
    pages:
    - id: 1
      name: onboarding_feedback_questionnaire_1
      label: What can we improve on our onboarding process?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: onboarding_feedback_questionnaire_2
      label: How would you rate the clarity of our onboarding process?
      hint: null
      type: select_one
      options:
      - Very clear
      - Somewhat clear
      - Not very clear
      - Not at all clear
      required: false
    - id: 3
      name: onboarding_feedback_questionnaire_3
      label: What were some challenges you faced during onboarding?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: onboarding_feedback_questionnaire_4
      label: How engaging was your onboarding experience?
      hint: null
      type: select_one
      options:
      - Engaging
      - Somewhat engaging
      - Not engaging
      - Not at all engaging
      required: false
    - id: 5
      name: onboarding_feedback_questionnaire_5
      label: What did we do well that was different from others?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: onboarding_feedback_questionnaire_6
      label: How can we improve onboarding process communication?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: onboarding_feedback_questionnaire_7
      label: Was your onboarding experience unique?
      hint: null
      type: select_one
      options:
      - Very unique
      - Somewhat unique
      - Not very unique
      - Not at all unique
      required: false
    - id: 8
      name: onboarding_feedback_questionnaire_8
      label: What areas of the onboarding process did you find difficult to adjust
        to?
      hint: null
      type: select_multiple
      options:
      - Adjusting to new technology
      - Adjusting to new processes
      - Building relationships
      - Other
      required: false
    - id: 9
      name: onboarding_feedback_questionnaire_9
      label: What did we do well that was not typically part of our onboarding process?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: onboarding_feedback_questionnaire_10
      label: How well did the onboarding process align with company values?
      hint: null
      type: select_one
      options:
      - Aligns closely
      - Somewhat aligns
      - Not very well
      - Not at all
      required: false
    - id: 11
      name: onboarding_feedback_questionnaire_11
      label: How can we make onboarding duration more effective?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: onboarding_feedback_questionnaire_12
      label: What suggestions do you have for us to improve the onboarding process
        for future new employees?
      hint: null
      type: text
      options: []
      required: false
