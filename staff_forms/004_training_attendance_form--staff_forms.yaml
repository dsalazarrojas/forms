inputSchema:
  type: object
  properties:
    title: training attendance form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: training_session_name
      label: training session name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: attended
      label: Attended
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: started
      label: started
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: finished
      label: finished
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: completed
      label: completed
      hint: null
      type: select_multiple
      options:
      - In progress
      - Completed
      required: false
    - id: 7
      name: training_location
      label: Training location
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
