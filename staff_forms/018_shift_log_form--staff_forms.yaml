inputSchema:
  type: object
  properties:
    title: Shift Log Form
    pages:
    - id: 1
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: shift_start_time
      label: Shift Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: shift_end_time
      label: Shift End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: shift_status
      label: Shift Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 5
      name: team
      label: Team
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: supervisor
      label: Supervisor
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: shift
      label: Shift
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
