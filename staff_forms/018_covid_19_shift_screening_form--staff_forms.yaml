inputSchema:
  type: object
  properties:
    title: COVID 19 Shift Screening Form
    pages:
    - id: 1
      name: screening_date
      label: Screening Date
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 2
      name: screening_time
      label: Screening Time
      hint: Current time
      type: time
      options: []
      required: true
    - id: 3
      name: shift_type
      label: Shift Type
      hint: Work shift
      type: select_one
      options:
      - Morning shift
      - Afternoon shift
      - Evening shift
      - Night shift
      - Rotating shift
      required: true
    - id: 4
      name: employee_full_name
      label: Employee Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 5
      name: employee_id
      label: Employee ID
      hint: Employee number
      type: text
      options: []
      required: true
    - id: 6
      name: department
      label: Department
      hint: Work department
      type: text
      options: []
      required: true
    - id: 7
      name: position
      label: Position
      hint: Job title
      type: text
      options: []
      required: true
    - id: 8
      name: supervisor_name
      label: Supervisor Name
      hint: Direct manager
      type: text
      options: []
      required: true
    - id: 9
      name: temperature
      label: Current Temperature
      hint: In Fahrenheit
      type: number
      options: []
      required: true
    - id: 10
      name: fever_check
      label: Do you have a fever of 100.4 F or higher
      hint: Fever screening
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 11
      name: current_symptoms
      label: Are you currently experiencing any symptoms
      hint: Symptom screening
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 12
      name: symptom_list
      label: Which symptoms are you experiencing
      hint: Select all that apply
      type: select_multiple
      options:
      - New cough
      - Shortness of breath or difficulty breathing
      - Chills
      - Muscle pain or body aches
      - Sore throat
      - New loss of taste or smell
      - Diarrhea
      - Headache
      - Fatigue
      - Nausea or vomiting
      - Congestion or runny nose
      required: false
    - id: 13
      name: household_symptoms
      label: Does anyone in your household have COVID-19 symptoms
      hint: Household screening
      type: select_one
      options:
      - 'False'
      - 'True'
      - I live alone
      required: true
    - id: 14
      name: household_positive
      label: Has anyone in your household tested positive for COVID-19 in the past
        14 days
      hint: Household positive cases
      type: select_one
      options:
      - 'False'
      - 'True'
      - I live alone
      required: true
    - id: 15
      name: close_contact_exposure
      label: Have you had close contact with a confirmed COVID-19 case in the past
        14 days
      hint: Exposure screening
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 16
      name: travel_history
      label: Have you traveled outside the area in the past 14 days
      hint: Travel screening
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 17
      name: travel_locations
      label: List travel locations
      hint: Cities and states visited
      type: text
      options: []
      required: false
    - id: 18
      name: previous_positive_test
      label: Have you tested positive for COVID-19 in the past 90 days
      hint: Previous infection
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 19
      name: vaccination_status
      label: What is your vaccination status
      hint: COVID-19 vaccines
      type: select_one
      options:
      - Fully vaccinated with booster
      - Fully vaccinated
      - Partially vaccinated
      - Not vaccinated
      required: true
    - id: 20
      name: ppe_required
      label: Will you be required to wear PPE during your shift
      hint: Personal protective equipment
      type: select_one
      options:
      - Yes full PPE required
      - Yes mask only required
      - No PPE not required
      required: true
    - id: 21
      name: ppe_available
      label: Do you have access to the required PPE
      hint: PPE availability
      type: select_one
      options:
      - Yes I have all required PPE
      - I need PPE supplied
      - Not sure
      required: true
    - id: 22
      name: screening_result
      label: Screening Result
      hint: Clearance status
      type: select_one
      options:
      - Cleared for work
      - Not cleared - needs evaluation
      - Not cleared - positive test
      - Not cleared - exposure risk
      required: true
    - id: 23
      name: screener_name
      label: Screener Name
      hint: Person conducting screening
      type: text
      options: []
      required: true
    - id: 24
      name: screener_title
      label: Screener Title
      hint: Job title
      type: text
      options: []
      required: true
    - id: 25
      name: screener_signature_date
      label: Screener Signature Date
      hint: Date of screening
      type: date
      options: []
      required: true
    - id: 26
      name: employee_acknowledgment
      label: I certify that the information provided is accurate and I understand
        I must report any symptoms that develop during my shift
      hint: Employee agreement
      type: select_one
      options:
      - Yes I acknowledge and agree
      - No I do not agree
      required: true
