inputSchema:
  type: object
  properties:
    title: Truck Driver Job Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: driver_experience
      label: Driver Experience
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1-5 years
      - More than 5 years
      required: false
    - id: 7
      name: available_to_load
      label: Available to Load
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
    - id: 8
      name: available_to_commute
      label: Available to Commute
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
    - id: 9
      name: available_to_haul
      label: Available to Haul
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
