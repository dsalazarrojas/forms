inputSchema:
  type: object
  properties:
    title: virtual_assistant_end_of_day_report_form
    pages:
    - id: 1
      name: client_details
      label: Client Details
      hint: null
      type: select_multiple
      options:
      - Client
      - Client 1
      - Client 2
      required: true
    - id: 2
      name: work_completed
      label: Work Completed
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: task_details
      label: Task Details
      hint: 'Example: Call, Meeting, etc.'
      type: select_one
      options:
      - Call
      - Meeting
      - Email
      - Task
      - Other
      required: true
    - id: 4
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: time_spent
      label: Time Spent
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: time_spent_hours
      label: Time Spent (hours)
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: time_spent_minutes
      label: Time Spent (minutes)
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - chatjimmy2
      required: true
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - User 1
      - User 2
      - User 3
      required: false
    - id: 11
      name: submitted_date
      label: Submitted Date
      hint: null
      type: date
      options: []
      required: true
