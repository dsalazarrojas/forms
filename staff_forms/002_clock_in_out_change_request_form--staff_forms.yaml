inputSchema:
  type: object
  properties:
    title: Clock In Out Change Request Form
    pages:
    - id: 1
      name: section_employee_info
      label: -- Employee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: Full name as shown on payroll records
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: Your department or area of work
      type: text
      options: []
      required: true
    - id: 5
      name: manager_name
      label: Direct Manager Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_change_request
      label: -- Clock In/Out Change Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: change_date
      label: Date of the Clock In/Out to be Corrected
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: current_clock_in_time
      label: Current Clock In Time
      hint: Time shown in system
      type: time
      options: []
      required: true
    - id: 9
      name: requested_clock_in_time
      label: Requested Correct Clock In Time
      hint: The time you actually clocked in
      type: time
      options: []
      required: true
    - id: 10
      name: current_clock_out_time
      label: Current Clock Out Time
      hint: Time shown in system
      type: time
      options: []
      required: false
    - id: 11
      name: requested_clock_out_time
      label: Requested Correct Clock Out Time
      hint: The time you actually clocked out
      type: time
      options: []
      required: false
    - id: 12
      name: time_difference_minutes
      label: Total Time Discrepancy - Minutes
      hint: Calculate from clock in and out difference
      type: number
      options: []
      required: false
    - id: 13
      name: reason_for_change
      label: Reason for Clock In/Out Correction
      hint: null
      type: select_one
      options:
      - System error
      - Forgot to clock in/out
      - Technical issue
      - Manual entry error
      - Other
      required: true
    - id: 14
      name: detailed_explanation
      label: Detailed Explanation
      hint: Provide context for the time correction request
      type: text
      options: []
      required: true
    - id: 15
      name: supporting_evidence
      label: Do you have supporting evidence - receipt, text, etc?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 16
      name: section_approval
      label: -- Manager Approval --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: manager_approval
      label: I authorize this time correction
      hint: By submitting this, you confirm understanding of company policy
      type: select_one
      options:
      - Yes, I request this change
      - No, cancel request
      required: true
    - id: 18
      name: request_date
      label: Date of Request
      hint: Today is date submission
      type: date
      options: []
      required: true
    - id: 19
      name: contact_email
      label: Your Email Address
      hint: For status updates on this request
      type: email
      options: []
      required: true
    - id: 20
      name: contact_phone
      label: Phone Number
      hint: Optional - for urgent communication
      type: text
      options: []
      required: false
