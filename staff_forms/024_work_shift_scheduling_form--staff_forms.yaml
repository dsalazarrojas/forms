inputSchema:
  type: object
  properties:
    title: Work Shift Scheduling Form
    pages:
    - id: 1
      name: week_start
      label: Week Starts
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: day
      label: Day
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: false
    - id: 5
      name: employee_id
      label: Employee ID
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: team_members
      label: Team Members
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: work_hours
      label: Work Hours
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: availability
      label: Availability
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      - Overnight
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
