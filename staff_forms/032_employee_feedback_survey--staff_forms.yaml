inputSchema:
  type: object
  properties:
    title: Employee Feedback Survey
    pages:
    - id: 1
      name: intro
      label: introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: manager_name
      label: Manager Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: feedback_question
      label: What feedback do you have for your manager?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: feedback_question_2
      label: Is there anything else you wanted to share with your manager?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: manager_support
      label: How supportive is your manager?
      hint: null
      type: select_one
      options:
      - Very Supportive
      - Moderately Supportive
      - Not Supportive
      required: false
    - id: 7
      name: communication_style
      label: What is the communication style of your manager?
      hint: null
      type: select_multiple
      options:
      - Regular
      - Rarely
      - Never
      required: false
    - id: 8
      name: work_environment
      label: What is the work environment like at your workplace?
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      required: false
    - id: 9
      name: submit_form
      label: Submit form
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: date_submitted
      label: date_submitted
      hint: null
      type: date
      options: []
      required: false
