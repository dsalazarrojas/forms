    - id: 4
      name: candidate_info
      label: Candidate Info
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: nominator_info
      label: Nominator Info
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: nominator_name
      label: Nominator
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: nominator_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: nominator_website
      label: Website
      hint: null
      type: text
      options: []
      required: false
