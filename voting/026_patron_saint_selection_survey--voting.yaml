      type: text
      options: []
      required: false
    - id: 4
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: other_info
      label: Other Information
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: submitter
      label: Submitter
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: church_info
      label: Church Information
      hint: null
      type: text
      options: []
      required: false
