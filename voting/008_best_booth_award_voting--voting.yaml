      hint: Please rate from 1 (Poor) to 5 (Excellent)
      type: note
      options: []
      required: false
    - id: 9
      name: visual_appeal_rating
      label: Visual Appeal and Design
      hint: null
      type: select_one
      options:
      - 1
      - 2
      - 3
      - 4
      - 5
      required: true
    - id: 10
      name: staff_friendliness_rating
      label: Staff Friendliness and Engagement
      hint: null
      type: select_one
      options:
      - 1
      - 2
      - 3
      - 4
      - 5
      required: true
    - id: 11
      name: info_quality_rating
      label: Information and Content Quality
      hint: null
      type: select_one
      options:
      - 1
      - 2
      - 3
      - 4
      - 5
      required: true
    - id: 12
      name: interactivity_rating
      label: Interactivity and Engagement Tools
      hint: null
      type: select_one
      options:
      - 1
      - 2
      - 3
      - 4
      - 5
      required: true
    - id: 13
      name: originality_rating
      label: Originality and Innovation
      hint: null
      type: select_one
      options:
      - 1
      - 2
      - 3
      - 4
      - 5
      required: true
    - id: 14
      name: comments_header
      label: -- Attendee Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: favorite_aspect
      label: What did you like most about this booth
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: improvement_suggestion
      label: One thing the exhibitor could improve
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: confirmation_header
      label: -- Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: marketing_consent
      label: Consent for Future Event Marketing
      hint: Would you like to receive updates about next year's event
      type: select_one
      options:
      - Yes - I would like to stay informed
      - No - Thank you
      required: true
    - id: 19
      name: submission_date
      label: Date of Submission
      hint: null
      type: date
      options: []
      required: true
