inputSchema:
  type: object
  properties:
    title: Best Booth Award Voting
    pages:
    - id: 1
      name: voter_registration_header
      label: -- Voter Registration --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: voter_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: voter_email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: ticket_confirmation_number
      label: Ticket Number
      hint: Located on your event badge or confirmation email
      type: text
      options: []
      required: true
    - id: 5
      name: booth_vote_header
      label: -- Vote for Best Booth --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: booth_number_vote
      label: Booth Number
      hint: The identification number of the booth
      type: number
      options: []
      required: true
    - id: 7
      name: booth_name_text
      label: Company or Booth Name
      hint: Name of the exhibitor
      type: text
      options: []
      required: true
