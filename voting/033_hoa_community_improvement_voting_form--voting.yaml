inputSchema:
  type: object
  properties:
    title: hoa_community_improvement_voting_form
    pages:
    - id: 1
      name: project_selection
      label: Select a project
      hint: null
      type: select_multiple
      options:
      - Project 1
      - Project 2
      - Project 3
      - Project 4
      - Project 5
      required: true
    - id: 2
      name: priority_selection
      label: Choose the priority level
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 3
      name: project_description
      label: Describe your selected project
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: vote_confirmation
      label: Do you support the selected project?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Abstain
      required: true
    - id: 5
      name: email_confirmation
      label: Confirm your email address
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: name_selection
      label: Provide your name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: contact_number
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: confirm_submission
      label: Confirm Submission
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: confirm_email_address
      label: Confirm Email Address
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: confirm_email
      label: Confirm Email
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
