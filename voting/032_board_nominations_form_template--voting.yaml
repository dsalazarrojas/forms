inputSchema:
  type: object
  properties:
    title: Board Nominations Form Template
    pages:
    - id: 1
      name: nomination_header
      label: -- Nomination Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: nominee_name
      label: Nominee name
      hint: Full name of nominated person
      type: text
      options: []
      required: true
    - id: 3
      name: nominee_contact
      label: Nominee contact email
      hint: For confirmation
      type: email
      options: []
      required: false
    - id: 4
      name: nominator_name
      label: Nominator name
      hint: Person submitting nomination
      type: text
      options: []
      required: true
    - id: 5
      name: role_nominated_for
      label: Role nominated for
      hint: Position on board
      type: text
      options: []
      required: true
    - id: 6
      name: qualifications_summary
      label: Qualifications summary
      hint: Brief explaination of nominee qualifications
      type: text
      options: []
      required: true
    - id: 7
      name: consent_obtained
      label: Consent obtained from nominee
      hint: Confirm nominee agrees to nomination
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: supporting_documents
      label: Supporting documents description
      hint: List any attached documents
      type: text
      options: []
      required: false
