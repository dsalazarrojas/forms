inputSchema:
  type: object
  properties:
    title: Professional Award Recipients Voting Form
    pages:
    - id: 1
      name: first_page
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: agree_to_participate
      label: Agree to participate in this voting process?
      hint: null
      type: checkbox
      options:
      - I agree
      - I do not agree
      required: true
    - id: 3
      name: occupation
      label: Occupation
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: role_in_nominated_field
      label: Role in the award-nominated field
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: known_nominee
      label: How long have you known the nominee?
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: rating
      label: Rate the nominee's performance
      hint: null
      type: select_one
      options:
      - Outstanding
      - Excellent
      - Good
      - Fair
      - Not Impressive
      required: false
    - id: 7
      name: recommendation_statement
      label: Why would you recommend this nominee for the award?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: affiliation_with_nominee
      label: Are you affiliated with the nominee's work or organization?
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: relation_with_nominee
      label: What is your relation to the nominee?
      hint: null
      type: select_one
      options:
      - Friend
      - Colleague
      - Family Member
      - Professional Association
      - Mentor
      - No Relation
      required: false
    - id: 10
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: notify_winner
      label: Would you like to be notified about the award winner(s)?
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: supporting_statement
      label: Would you like to provide a supporting statement for this nominee?
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: false
