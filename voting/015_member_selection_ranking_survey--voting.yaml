      options:
      - A
      - B
      - C
      - D
      - E
      required: true
    - id: 3
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: comment
      label: Comment
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: submission_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: submission_status
      label: Submission Status
      hint: null
      type: select_one
      options:
      - New
      - In Progress
      - Completed
      required: true
    - id: 10
      name: submission_id
      label: Submission ID
      hint: null
      type: text
      options: []
      required: false
