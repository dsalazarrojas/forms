inputSchema:
  type: object
  properties:
    title: Member Selection Ranking Survey
    pages:
    - id: 1
      name: member_selection_ranking_survey
      label: Select Members
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: rank
      label: Rank
