inputSchema:
  type: object
  properties:
    title: Senior Superlatives Form
    pages:
    - id: 1
      name: introduction
      label: What is your name?
      hint: Please provide your full name.
      type: text
      options: []
      required: true
    - id: 2
      name: senior_name
      label: What is the Senior Superlatives' name?
      hint: Please provide the name of a senior you know.
      type: text
      options: []
      required: true
    - id: 3
      name: relationship
      label: What is your relationship to the Senior Superlatives?
      hint: null
      type: select_multiple
      options:
      - Friend
      - Mentor
      - Colleague
      - Classmate
      - Other
      required: true
    - id: 4
      name: feelings
      label: How do you feel about the Senior Superlatives?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: feedback
      label: Additional feedback or comments about the Senior Superlatives?
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: preferences
      label: What are your preferences for the Senior Superlatives?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: demographics
      label: What is your demographic information?
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: experiences
      label: Can you describe your senior experiences?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: recommendations
      label: Who do you recommend for Senior Superlatives?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 10
      name: confirm
      label: Are you ready to submit?
      hint: null
      type: radio
      options:
      - 'Yes'
      - 'No'
      required: true
