inputSchema:
  type: object
  properties:
    title: T Shirt Design Voting Form
    pages:
    - id: 1
      name: vote_page
      label: Vote Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: t_shirt_design_choice
      label: t_shirt_design_choice
      hint: null
      type: select_multiple
      options:
      - Design 1
      - Design 2
      - Design 3
      required: true
    - id: 3
      name: vote
      label: Vote
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
