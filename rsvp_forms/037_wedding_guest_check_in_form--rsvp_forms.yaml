inputSchema:
  type: object
  properties:
    title: Wedding Guest Check In Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: Enter a valid email address
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: message
      label: Message
      hint: Write any message for the wedding party
      type: note
      options: []
      required: false
    - id: 8
      name: rsvp
      label: RSVP
      hint: null
      type: select_one
      options:
      - option1
      - option2
      - option3
      - option4
      required: false
    - id: 9
      name: number_of_guests
      label: Number of Guests
      hint: null
      type: select_multiple
      options:
      - 10 or less
      - 11-20
      - 21 or more
      required: false
