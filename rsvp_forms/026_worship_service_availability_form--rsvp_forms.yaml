inputSchema:
  type: object
  properties:
    title: Worship Service Availability Form
    pages:
    - id: 1
      name: service_date
      label: Service Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: service_time
      label: Service Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: volunteer_name
      label: Volunteer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: availability
      label: Availability
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: false
    - id: 7
      name: available_start_time
      label: Available Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: available_end_time
      label: Available End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: rsvp
      label: RSVP
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
