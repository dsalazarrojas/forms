inputSchema:
  type: object
  properties:
    title: Annual Awards Afterparty RSVP Form
    pages:
    - id: 1
      name: guest_info_header
      label: -- Guest Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Your name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: For event updates
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 5
      name: guest_table_name
      label: Awarded Person or Table Name
      hint: Which award winner are you with
      type: text
      options: []
      required: false
    - id: 6
      name: rsvp_header
      label: -- RSVP Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: rsvp_status
      label: Will you be attending the afterparty
      hint: Your attendance confirmation
      type: select_one
      options:
      - Yes, I will attend
      - No, I cannot attend
      - Maybe - Unsure at this time
      required: true
    - id: 8
      name: number_of_guests
      label: Number of Guests Including Yourself
      hint: How many people in your party
      type: number
      options: []
      required: true
    - id: 9
      name: plus_one_details
      label: Plus One Details
      hint: Name of your guest or companion
      type: text
      options: []
      required: false
    - id: 10
      name: event_details_header
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: event_date
      label: Afterparty Date
      hint: When is the event
      type: date
      options: []
      required: false
    - id: 12
      name: event_time
      label: Afterparty Time
      hint: What time is it starting
      type: time
      options: []
      required: false
    - id: 13
      name: event_location
      label: Event Location
      hint: Where the afterparty is held
      type: text
      options: []
      required: false
    - id: 14
      name: dietary_header
      label: -- Dietary and Special Needs --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: dietary_restrictions
      label: Dietary Restrictions or Allergies
      hint: Any food allergies or preferences
      type: text
      options: []
      required: false
    - id: 16
      name: accessibility_needs
      label: Any Accessibility Needs
      hint: Special accommodations needed
      type: text
      options: []
      required: false
    - id: 17
      name: preferences_header
      label: -- Preferences and Requests --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: seating_preference
      label: Seating or Location Preference
      hint: Any seating preferences
      type: select_one
      options:
      - Near bar or lounge
      - Near dance floor
      - Quieter area
      - Near entrance
      - No preference
      required: false
    - id: 19
      name: entertainment_interest
      label: Entertainment of Interest
      hint: What activities interest you
      type: select_multiple
      options:
      - Dancing
      - Live Music
      - Karaoke
      - Games or Activities
      - Networking
      - Quiet conversation areas
      required: false
    - id: 20
      name: drink_preference
      label: Drink Preference
      hint: What type of beverages
      type: select_one
      options:
      - Alcoholic beverages
      - Non-alcoholic only
      - No preference
      required: false
    - id: 21
      name: contact_header
      label: -- Communication Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: contact_method
      label: Preferred Contact Method
      hint: How should we contact you
      type: select_one
      options:
      - Email
      - Phone
      - Text message
      - Either email or phone
      required: true
    - id: 23
      name: receive_reminders
      label: Send me reminders about the event
      hint: Want event reminders
      type: select_one
      options:
      - Yes, send reminders
      - No, do not send
      required: true
    - id: 24
      name: additional_guests_header
      label: -- Additional Guests Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: additional_guests_names
      label: Names of Additional Guests
      hint: If bringing guests, list names
      type: text
      options: []
      required: false
