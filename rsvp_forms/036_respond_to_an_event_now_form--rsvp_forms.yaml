inputSchema:
  type: object
  properties:
    title: Respond To An Event Now Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: attendee_name
      label: Attendee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: attendee_email
      label: Attendee Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: rsvp
      label: RSVP
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 5
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: attendee_number
      label: Attendee Number
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: comment
      label: Comment
      hint: null
      type: text
      options: []
      required: false
