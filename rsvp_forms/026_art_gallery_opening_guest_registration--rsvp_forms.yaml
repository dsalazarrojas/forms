inputSchema:
  type: object
  properties:
    title: Art Gallery Opening Guest Registration
    pages:
    - id: 1
      name: registration_date
      label: Registration Date
      hint: Date of registration
      type: date
      options: []
      required: true
    - id: 2
      name: guest_name
      label: Guest Name
      hint: Full name of primary guest
      type: text
      options: []
      required: true
    - id: 3
      name: guest_email
      label: Guest Email
      hint: Email address for confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: guest_phone
      label: Guest Phone
      hint: Contact phone number
      type: text
      options: []
      required: false
    - id: 5
      name: organization
      label: Organization
      hint: Company or organization
      type: text
      options: []
      required: false
    - id: 6
      name: title
      label: Title
      hint: Professional title
      type: text
      options: []
      required: false
    - id: 7
      name: rsvp_status
      label: RSVP Status
      hint: Will you attend
      type: select_one
      options:
      - Yes - Attending
      - No - Regretfully Decline
      - Waitlist
      required: true
    - id: 8
      name: plus_one_name
      label: Plus One Name
      hint: Name of guest accompanying you
      type: text
      options: []
      required: false
    - id: 9
      name: plus_one_email
      label: Plus One Email
      hint: Email of accompanying guest
      type: email
      options: []
      required: false
    - id: 10
      name: total_guests
      label: Total Guests
      hint: Total number in your party
      type: number
      options: []
      required: true
    - id: 11
      name: opening_event
      label: Opening Event
      hint: Which opening event
      type: select_one
      options:
      - VIP Preview Night
      - Public Opening Reception
      - Artist Talk and Reception
      - Curator Tour
      required: true
    - id: 12
      name: exhibition_name
      label: Exhibition Name
      hint: Name of exhibition opening
      type: text
      options: []
      required: true
    - id: 13
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Dairy-Free
      - Shellfish Allergy
      - Nut Allergy
      - Kosher
      - Halal
      required: true
    - id: 14
      name: dietary_other
      label: Dietary Other
      hint: Specify other dietary needs
      type: text
      options: []
      required: false
    - id: 15
      name: beverage_preference
      label: Beverage Preference
      hint: Preferred beverage
      type: select_one
      options:
      - Wine
      - Beer
      - Non-Alcoholic
      - No Preference
      required: false
    - id: 16
      name: accessibility_requirements
      label: Accessibility Requirements
      hint: Do you need accessibility accommodations
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 17
      name: accessibility_details
      label: Accessibility Details
      hint: Describe your needs
      type: text
      options: []
      required: false
    - id: 18
      name: parking_required
      label: Parking Required
      hint: Will you need parking
      type: select_one
      options:
      - true
      - false
      - Maybe
      required: false
    - id: 19
      name: valet_preference
      label: Valet Preference
      hint: Valet or self-park
      type: select_one
      options:
      - Valet
      - Self-Park
      - No Preference
      required: false
    - id: 20
      name: coat_check_needed
      label: Coat Check Needed
      hint: Will you use coat check
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 21
      name: interested_in_purchasing
      label: Interested in Purchasing
      hint: Are you interested in purchasing artwork
      type: select_one
      options:
      - true
      - false
      - Maybe
      required: false
    - id: 22
      name: press_attendance
      label: Press Attendance
      hint: Are you attending as press
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 23
      name: media_outlet
      label: Media Outlet
      hint: Name of publication or outlet
      type: text
      options: []
      required: false
    - id: 24
      name: how_heard
      label: How Heard
      hint: How did you hear about this opening
      type: select_one
      options:
      - Email Invitation
      - Social Media
      - Gallery Website
      - Friend
      - Press
      - Other
      required: false
    - id: 25
      name: additional_comments
      label: Additional Comments
      hint: Any questions or special requests
      type: text
      options: []
      required: false
