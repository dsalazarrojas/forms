inputSchema:
  type: object
  properties:
    title: Spa Guest Event RSVP Registration Form
    pages:
    - id: 1
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: rsvp_date
      label: RSVP Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: rsvp_time
      label: RSVP Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: guest_count
      label: Guest Count
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: special_request
      label: Special Request
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - '{''name'': ''chatjimmy''}'
      - '{''name'': ''other''}'
      required: true
    - id: 10
      name: confirm
      label: Confirm
      hint: null
      type: select_multiple
      options:
      - '{''name'': True}'
      - '{''name'': False}'
      required: true
