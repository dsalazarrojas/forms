inputSchema:
  type: object
  properties:
    title: Parent Volunteering Session RSVP Form
    pages:
    - id: 1
      name: event
      label: Event
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: volunteer_name
      label: Volunteer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: session
      label: Session
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: volunteer_type
      label: Volunteer Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: rsvp_date
      label: RSVP Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: cancel
      label: Cancel
      hint: null
      type: text
      options: []
      required: true
