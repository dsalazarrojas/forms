inputSchema:
  type: object
  properties:
    title: Neighborhood Open House RSVP Form
    pages:
    - id: 1
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: guest_phone
      label: Guest Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: number_of_guests
      label: Number of Guests
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: will_attend
      label: Will Attend
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: rsvp_time
      label: RSVP Time
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: rsvp_date
      label: RSVP Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: rsvp_by
      label: RSVP By
      hint: null
      type: date
      options: []
      required: false
