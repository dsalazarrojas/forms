inputSchema:
  type: object
  properties:
    title: Back To School Night RSVP Form
    pages:
    - id: 1
      name: parent_guardian_name
      label: Parent or Guardian Full Name
      hint: Your name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: For confirmation
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 4
      name: student_name
      label: Student Name
      hint: Name of your child
      type: text
      options: []
      required: true
    - id: 5
      name: student_grade
      label: Student Grade
      hint: Current grade level
      type: select_one
      options:
      - Kindergarten
      - Grade 1
      - Grade 2
      - Grade 3
      - Grade 4
      - Grade 5
      - Grade 6
      - Grade 7
      - Grade 8
      - Grade 9
      - Grade 10
      - Grade 11
      - Grade 12
      required: true
    - id: 6
      name: teacher_name
      label: Teacher Name
      hint: Your child teacher name
      type: text
      options: []
      required: false
    - id: 7
      name: attendance_status
      label: Will You Attend
      hint: Select your response
      type: select_one
      options:
      - Yes, I will attend
      - No, I cannot attend
      - Maybe, will confirm later
      required: true
    - id: 8
      name: event_date
      label: Event Date
      hint: Select date you will attend
      type: date
      options: []
      required: true
    - id: 9
      name: event_time
      label: Preferred Time Slot
      hint: Select session time
      type: select_one
      options:
      - Morning, 9 AM to 11 AM
      - Afternoon, 1 PM to 3 PM
      - Evening, 6 PM to 8 PM
      - Any time works
      required: true
    - id: 10
      name: number_attending
      label: Number of Adults Attending
      hint: How many adults will come
      type: number
      options: []
      required: true
    - id: 11
      name: both_parents_attending
      label: Will Both Parents Attend
      hint: Will both parents or guardians come
      type: select_one
      options:
      - 'True'
      - 'False'
      - Single parent household
      required: true
    - id: 12
      name: childcare_needed
      label: Need Childcare During Event
      hint: Do you need childcare provided
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: children_ages
      label: Ages of Children Needing Care
      hint: List ages if childcare needed
      type: text
      options: []
      required: false
    - id: 14
      name: interpreter_needed
      label: Need Language Interpreter
      hint: Do you need translation services
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 15
      name: interpreter_language
      label: Interpreter Language Needed
      hint: Select language
      type: select_one
      options:
      - Spanish
      - Mandarin
      - French
      - Arabic
      - Vietnamese
      - Korean
      - Other
      required: false
    - id: 16
      name: topics_of_interest
      label: Topics You Want to Discuss
      hint: Select areas of interest
      type: select_multiple
      options:
      - Academic progress
      - Social development
      - Extracurricular activities
      - Support services
      - Classroom expectations
      - Parent involvement
      required: false
    - id: 17
      name: questions_for_teacher
      label: Questions for Teacher
      hint: List any questions you have
      type: text
      options: []
      required: false
    - id: 18
      name: volunteer_interest
      label: Interested in Volunteering
      hint: Would you like to volunteer this year
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
    - id: 19
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should school contact you
      type: select_one
      options:
      - Email
      - Phone call
      - Text message
      - Mail
      required: true
    - id: 20
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
    - id: 21
      name: rsvp_date
      label: Date of RSVP
      hint: Today date
      type: date
      options: []
      required: true
