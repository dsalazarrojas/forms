inputSchema:
  type: object
  properties:
    title: Election Night Watch Party Registration
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: guests
      label: Number of Guests
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: rsvp
      label: Will you be attending?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: watch_party
      label: Do you plan on watching the election results at home or at a public location?
      hint: null
      type: select_one
      options:
      - At home
      - Public location
      - Neither
      required: false
    - id: 8
      name: comment
      label: Comment
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
