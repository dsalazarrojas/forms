inputSchema:
  type: object
  properties:
    title: RSVP Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: host
      label: Host Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: attending
      label: Will Attend
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: guest_count
      label: Guest Count
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: comment
      label: Comment
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
