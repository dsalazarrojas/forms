inputSchema:
  type: object
  properties:
    title: Fullscreen Event RSVP Responsive Form
    pages:
    - id: 1
      name: rsvp_details
      label: Guest Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rsvp_choice
      label: Will You Attend
      hint: Choose one
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: date_and_time
      label: Event Date
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: email
      label: Email
      hint: Enter a valid email address
      type: text
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: message2
      label: Message 2
      hint: null
      type: text
      options: []
      required: false
