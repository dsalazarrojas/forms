inputSchema:
  type: object
  properties:
    title: Sensory Event Registration
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: event_duration
      label: Session Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: accessibility_request
      label: Accessibility Request
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: accessibility_request_description
      label: Accessibility Request Description
      hint: null
      type: text
      options: []
      required: false
    - id: 10
