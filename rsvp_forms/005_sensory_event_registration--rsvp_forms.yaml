      - No, I will not be attending
      - Maybe, I'm still checking
      required: false
    - id: 11
      name: rsvp_description
      label: RSVP Description
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: rsvp_comments
      label: RSVP Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: session_preferences
      label: Session Preferences
      hint: null
      type: select_one
      options:
      - Indoor
      - Outdoor
      - Online
      required: false
    - id: 14
      name: session_preferences_description
      label: Session Preferences Description
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Workshop
      - Conference
      - Meeting
      - Lecture
      required: false
