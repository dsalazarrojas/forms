inputSchema:
  type: object
  properties:
    title: Admissions VIP SERIES
    pages:
    - id: 1
      name: rsvp_header
      label: -- Admissions VIP Series RSVP --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: attendee_full_name
      label: Full Name
      hint: Enter your legal name
      type: text
      options: []
      required: true
    - id: 3
      name: attendee_email
      label: Email Address
      hint: Valid email for communication
      type: email
      options: []
      required: true
    - id: 4
      name: attendee_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 5
      name: organization_affiliation
      label: Organization Affiliation
      hint: Name of your organization or institution
      type: text
      options: []
      required: false
    - id: 6
      name: professional_title
      label: Professional Title
      hint: Your professional title or position
      type: text
      options: []
      required: false
    - id: 7
      name: event_date
      label: Event Date
      hint: Which date would you like to attend?
      type: select_one
      options:
      - March 15, 2021
      - March 22, 2021
      - March 29, 2021
      - April 5, 2021
      - April 12, 2021
      required: true
    - id: 8
      name: event_session
      label: Event Session
      hint: Which session would you like to attend?
      type: select_one
      options:
      - Morning Session (10:00 AM - 12:00 PM)
      - Afternoon Session (1:00 PM - 3:00 PM)
      - Evening Session (4:00 PM - 6:00 PM)
      required: true
    - id: 9
      name: attendance_type
      label: Attendance Type
      hint: How will you attend the event?
      type: select_one
      options:
      - In-Person
      - Virtual Attendance
      - Hybrid Option
      required: true
    - id: 10
      name: guest_count
      label: Number of Guests
      hint: How many people will be attending with you?
      type: number
      options: []
      required: true
    - id: 11
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Do you have any dietary restrictions we should know about?
      type: text
      options: []
      required: false
    - id: 12
      name: special_accommodations
      label: Special Accommodations
      hint: Do you require any special accommodations?
      type: text
      options: []
      required: false
    - id: 13
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of your emergency contact
      type: text
      options: []
      required: true
    - id: 14
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number of your emergency contact
      type: text
      options: []
      required: true
    - id: 15
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: Relationship to your emergency contact
      type: text
      options: []
      required: true
    - id: 16
      name: covid_health_declaration
      label: COVID Health Declaration
      hint: Do you attest that you are currently free of COVID-19 symptoms?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 17
      name: vaccination_status
      label: Vaccination Status
      hint: Are you fully vaccinated against COVID-19?
      type: select_one
      options:
      - Yes, fully vaccinated
      - No, not vaccinated
      - Prefer not to answer
      required: false
    - id: 18
      name: previous_vip_events
      label: Previous VIP Events
      hint: Have you attended our VIP series events before?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 19
      name: topics_interest
      label: Topics of Interest
      hint: Which topics are you most interested in learning about?
      type: text
      options: []
      required: false
    - id: 20
      name: networking_interest
      label: Networking Interest
      hint: Are you interested in networking opportunities during the event?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 21
      name: rsvp_date
      label: RSVP Date
      hint: Date of submitting this RSVP
      type: date
      options: []
      required: true
    - id: 22
      name: attendee_signature
      label: Attendee Signature
      hint: Electronic signature to confirm RSVP
      type: text
      options: []
      required: true
