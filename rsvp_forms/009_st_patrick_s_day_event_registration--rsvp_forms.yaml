inputSchema:
  type: object
  properties:
    title: St. Patrick's Day Event Registration
    pages:
    - id: 1
      name: main_page
      label: Main
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: attendee_count
      label: Number of Attendees
      hint: Please enter total number of people attending
      type: number
      options: []
      required: false
    - id: 3
      name: name
      label: Attendee Name
      hint: Please enter attendee name
      type: text
      options: []
      required: true
    - id: 4
      name: rsvp_choice
      label: RSVP Choices
      hint: Select number of attendees you're bringing
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 5
      name: event_type
      label: Event Type
      hint: Please choose event type
      type: select_one
      options:
      - Event Type 1
      - Event Type 2
      - Event Type 3
      - Event Type 4
      - Event Type 5
      required: true
    - id: 6
      name: event_date
      label: Event Date
      hint: Select event date
      type: date
      options: []
      required: false
    - id: 7
      name: event_time
      label: Event Time
      hint: Select event time
      type: time
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 9
      name: rsvp_type
      label: Type of Attendee
      hint: Please choose attendee type
      type: select_one
      options:
      - Student
      - Staff
      - Parent
      - Faculty/Staff
      required: true
    - id: 10
      name: contact_number
      label: Phone Number
      hint: Enter your contact number
      type: text
      options: []
      required: true
    - id: 11
      name: payment
      label: Payment Type
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
