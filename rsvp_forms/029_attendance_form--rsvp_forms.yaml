inputSchema:
  type: object
  properties:
    title: Attendance Form
    pages:
    - id: 1
      name: event_information
      label: -- Event Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_name
      label: Event Name
      hint: Name of the event
      type: text
      options: []
      required: true
    - id: 3
      name: event_date
      label: Event Date
      hint: Date of the event
      type: date
      options: []
      required: true
    - id: 4
      name: event_time
      label: Event Time
      hint: Start time of the event
      type: time
      options: []
      required: true
    - id: 5
      name: event_location
      label: Event Location
      hint: Where the event is being held
      type: text
      options: []
      required: true
    - id: 6
      name: attendee_information
      label: -- Attendee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: full_name
      label: Full Name
      hint: Attendee name
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: phone_number
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: false
    - id: 10
      name: organization
      label: Organization/Department
      hint: Your organization or group
      type: text
      options: []
      required: false
    - id: 11
      name: attendance_information
      label: -- Attendance Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: attendance_status
      label: Attendance Status
      hint: Are you attending?
      type: select_one
      options:
      - Present
      - Absent
      - Late
      - Left Early
      - Excused Absence
      required: true
    - id: 13
      name: arrival_time
      label: Arrival Time
      hint: What time did you arrive?
      type: time
      options: []
      required: false
    - id: 14
      name: departure_time
      label: Departure Time
      hint: What time did you leave?
      type: time
      options: []
      required: false
    - id: 15
      name: duration_hours
      label: Duration in Hours
      hint: How many hours did you attend?
      type: number
      options: []
      required: false
    - id: 16
      name: participation_level
      label: Participation Level
      hint: Rate your level of participation
      type: select_one
      options:
      - Full Participation
      - Active Participation
      - Some Participation
      - Observer
      - Minimal
      required: false
    - id: 17
      name: purpose_of_visit
      label: Purpose of Visit/Attendance
      hint: Why are you attending?
      type: select_one
      options:
      - Mandatory
      - Professional Development
      - Volunteering
      - Support
      - Interest
      - Other
      required: false
    - id: 18
      name: session_track
      label: Session or Track Attended
      hint: Which session or workshop?
      type: text
      options: []
      required: false
    - id: 19
      name: feedback_section
      label: -- Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: event_rating
      label: Event Rating
      hint: How would you rate this event?
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      required: false
    - id: 21
      name: event_comments
      label: Comments about the Event
      hint: Any feedback or suggestions?
      type: text
      options: []
      required: false
    - id: 22
      name: additional_information
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: dietary_needs
      label: Dietary Restrictions
      hint: Any dietary requirements?
      type: text
      options: []
      required: false
    - id: 24
      name: special_accommodations
      label: Special Accommodations Needed
      hint: Any accommodations required?
      type: text
      options: []
      required: false
    - id: 25
      name: additional_notes
      label: Additional Notes
      hint: Any other information?
      type: text
      options: []
      required: false
