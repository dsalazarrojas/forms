inputSchema:
  type: object
  properties:
    title: Debate Watch Party RSVP Form
    pages:
    - id: 1
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: attending_guests_count
      label: Attending
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: attending_guests
      label: Who else is attending?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
