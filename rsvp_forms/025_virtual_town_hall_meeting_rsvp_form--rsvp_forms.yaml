inputSchema:
  type: object
  properties:
    title: Virtual Town Hall Meeting RSVP Form
    pages:
    - id: 1
      name: rsvp_form
      label: Will you attend the Virtual Town Hall Meeting?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 2
      name: email_form
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone_form
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: reason_for_not_attending_form
      label: Reason for not attending
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: comments_form
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: additional_comments_form
      label: Additional comments
      hint: null
      type: text
      options: []
      required: false
