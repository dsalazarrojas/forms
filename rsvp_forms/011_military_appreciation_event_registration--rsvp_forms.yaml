inputSchema:
  type: object
  properties:
    title: Military Appreciation Event Registration
    pages:
    - id: 1
      name: registration_form
      label: Military Appreciation Event Registration
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Guest Name
      hint: Enter the full name of the guest
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: military_id
      label: Military ID
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: branch
      label: Branch
      hint: null
      type: select_one
      options:
      - Army
      - Navy
      - Air Force
      - Marine Corps
      - Coast Guard
      - Other
      required: false
    - id: 7
      name: attending
      label: Will you be attending?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Not Sure
      required: false
    - id: 8
      name: planning_preferences
      label: Planning Preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: date_of_event
      label: Date of Event
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: time_of_event
      label: Time of Event
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: rsvp_deadline
      label: RSVP Deadline
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: venue
      label: Venue
      hint: null
      type: select_one
      options:
      - Online
      - Location 1
      - Location 2
      - Location 3
      - Location 4
      - Location 5
      required: false
    - id: 14
      name: guest_details
      label: Guest Details
      hint: null
      type: text
      options: []
      required: false
