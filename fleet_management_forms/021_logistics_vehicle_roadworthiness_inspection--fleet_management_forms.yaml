inputSchema:
  type: object
  properties:
    title: Logistics Vehicle Roadworthiness Inspection
    pages:
    - id: 1
      name: vehicle_number
      label: Vehicle Number
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: driver_details
      label: Driver Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: vehicle_type
      label: Vehicle Type
      hint: null
      type: select_one
      options:
      - Car
      - Bus
      - Lorry
      - Van
      required: false
    - id: 4
      name: vehicle_mileage
      label: Vehicle Mileage
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: last_service_date
      label: Last Service Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: next_service_date
      label: Next Service Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: safety_check
      label: Safety Check
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Partially
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: vehicle_image
      label: Vehicle Image
      hint: Upload a photo of the vehicle
      type: note
      options: []
      required: false
    - id: 10
      name: driver_signature
      label: Driver Signature
      hint: Upload a copy of the driver's signature
      type: note
      options: []
      required: false
    - id: 11
      name: manager_signature
      label: Manager Signature
      hint: Upload a copy of the manager's signature
      type: note
      options: []
      required: false
