inputSchema:
  type: object
  properties:
    title: Mobile Health App Usability Survey
    pages:
    - id: 1
      name: navigation
      label: How often do you navigate the app?
      hint: null
      type: select_multiple
      options:
      - Frequently
      - Occasionally
      - Rarely
      - Never
      required: false
    - id: 2
      name: satisfaction
      label: What do you think of the app overall?
      hint: null
      type: select_one
      options:
      - Love it
      - Like it
      - Neutral
      - Dislike it
      - Hate it
      required: false
    - id: 3
      name: issues
      label: What issues do you experience while using the app?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: feature_requests
      label: What feature would you like to see in our app?
      hint: null
      type: select_multiple
      options:
      - Feature 1
      - Feature 2
      - Feature 3
      - Feature 4
      - Feature 5
      required: false
    - id: 5
      name: satisfaction2
