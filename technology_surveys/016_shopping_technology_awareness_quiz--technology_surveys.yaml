      name: email
      label: E-mail
      hint: Enter your work or personal email
      type: email
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Retail
      - Technology
      - Sales
      required: true
    - id: 5
      name: role
