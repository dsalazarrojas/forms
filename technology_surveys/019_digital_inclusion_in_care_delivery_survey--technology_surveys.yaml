inputSchema:
  type: object
  properties:
    title: Digital Inclusion In Care Delivery Survey
    pages:
    - id: 1
      name: survey_title
      label: Digital Inclusion In Care Delivery Survey
      hint: null
      type: note
      options: []
      required: true
    - id: 2
      name: clinician_device_access_hospital
      label: Device Access in the Hospital
      hint: Please select how often you access devices while providing care in the
        hospital
      type: select_one
      options:
      - Very often
      - Somewhat often
      - Rarely
      - Never
      required: true
    - id: 3
      name: clinician_device_access_home
      label: Device Access in the Home
      hint: Please select how often you access devices while providing care in the
        home
      type: select_one
      options:
      - Very often
      - Somewhat often
      - Rarely
      - Never
      required: true
    - id: 4
      name: clinician_comfort_with_technology
      label: Comfort with Technology
      hint: Please select how comfortable you feel when using technology
      type: select_one
      options:
      - Very comfortable
      - Somewhat comfortable
      - Not very comfortable
      - Not at all comfortable
      required: true
    - id: 5
      name: clinician_barriers_1
      label: Barriers to Technology Use
      hint: Please select the main barrier you face when using technology
      type: select_one
      options:
      - Technical difficulties
      - Lack of training
      - Fear of data security risks
      - Other
      required: true
    - id: 6
      name: clinician_other_barriers_1
      label: Other Barriers
      hint: Please provide any other barriers you face when using technology
      type: text
      options: []
      required: false
    - id: 7
      name: clinician_comments
      label: Comments
      hint: Please provide any comments or additional information
      type: text
      options: []
      required: false
