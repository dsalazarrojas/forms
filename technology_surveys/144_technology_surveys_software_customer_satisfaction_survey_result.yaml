title: Software customer satisfaction survey
description: Generate a Software customer satisfaction survey survey for the "Technology surveys" category. Use the template name: "Software customer satisfaction survey template".
questions:
  - text: Overall, how satisfied are you with software customer satisfaction survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Software, Customer, Satisfaction, Survey]
  - text: How often do you interact with software customer satisfaction survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
