inputSchema:
  type: object
  properties:
    title: Network And Camera Deployment Survey
    pages:
    - id: 1
      name: site_details
      label: Site Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: site_type
      label: Site Type
      hint: null
      type: select_one
      options:
      - Single Story
      - Multi Story
      - Multi Story - Two Towers
      required: false
    - id: 3
      name: site_size
      label: Site Size
      hint: null
      type: select_multiple
      options:
      - 5,000 sqft
      - 10,000 sqft
      - 20,000 sqft
      - 50,000 sqft
      required: false
    - id: 4
      name: network_requirements
      label: Network Requirements
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: camera_placement
      label: Camera Placement
      hint: null
      type: select_multiple
      options:
      - Near Entrances/Exits
      - Near Security Desks
      - Near Cameras
      required: false
    - id: 6
      name: camera_type
      label: Camera Type
      hint: null
      type: select_one
      options:
      - PTZ
      - Fixed
      required: false
    - id: 7
      name: site_description
      label: Site Description
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: network_status
      label: Network Status
      hint: null
      type: select_one
      options:
      - Active
      - Not Active
      required: false
    - id: 9
      name: network_type
      label: Network Type
      hint: null
      type: select_one
      options:
      - Wireless
      - Wired
      required: false
    - id: 10
      name: camera_status
      label: Camera Status
      hint: null
      type: select_one
      options:
      - Active
      - Not Active
      required: false
    - id: 11
      name: network_speed
      label: Network Speed
      hint: null
      type: select_one
      options:
      - 100M
      - 500M
      - 1G
      - 5G
      required: false
    - id: 12
      name: camera_speed
      label: Camera Speed
      hint: null
      type: select_one
      options:
      - 100M
      - 500M
      - 1G
      - 5G
      required: false
