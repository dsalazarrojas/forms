inputSchema:
  type: object
  properties:
    title: Analytical Chemistry Techniques Survey
    pages:
    - id: 1
      name: section_respondent_information
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Respondent name
      hint: Optional for anonymous responses
      type: text
      options: []
      required: false
    - id: 3
      name: organization
      label: Organization
      hint: Laboratory or institution
      type: text
      options: []
      required: false
    - id: 4
      name: primary_techniques
      label: Primary techniques used
      hint: Select all that apply
      type: select_multiple
      options:
      - HPLC
      - Mass spectrometry
      - Spectroscopy
      - Chromatography
      required: true
    - id: 5
      name: frequency_of_use
      label: Frequency of use
      hint: How often do you use these techniques
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: false
    - id: 6
      name: training_needs
      label: Training needs
      hint: Areas where additional training is desired
      type: text
      options: []
      required: false
    - id: 7
      name: equipment_satisfaction
      label: Equipment satisfaction rating
      hint: Rate from 1 to 5
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 8
      name: comments
      label: Additional comments
      hint: Optional feedback
      type: text
      options: []
      required: false
