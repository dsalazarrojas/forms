inputSchema:
  type: object
  properties:
    title: edtech_app_feature_feedback_survey
    pages:
    - id: 1
      name: user_id
      label: User ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: user_feedback
      label: What feature do you want to provide feedback about?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: rating
      label: How would you rate this feature?
      hint: null
      type: select_one
      options:
      - '{''value'': 1, ''label'': ''Very Poor''}'
      - '{''value'': 2, ''label'': ''Poor''}'
      - '{''value'': 3, ''label'': ''Neutral''}'
      - '{''value'': 4, ''label'': ''Good''}'
      - '{''value'': 5, ''label'': ''Excellent''}'
      required: false
    - id: 4
      name: suggestions
      label: What are your suggestions for improvements?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
