title: Technology survey
description: Generate a Technology survey survey for the "Technology surveys" category. Use the template name: "Technology survey template".
questions:
  - text: Overall, how satisfied are you with technology survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Technology, Survey, Surveys, Feature A]
  - text: How often do you interact with technology survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
