inputSchema:
  type: object
  properties:
    title: ESim Profile Management Survey
    pages:
    - id: 1
      name: esim_survey_title
      label: ESim Profile Management Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: how_long_do_you_plan_to_keep_your_esim
      label: How long do you plan to keep your eSIM
      hint: null
      type: select_multiple
      options:
      - Less than 1 month
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - More than 1 year
      required: false
    - id: 3
      name: esim_usage_frequency
      label: eSIM Usage Frequency
      hint: How often do you use your eSIM
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: false
    - id: 4
      name: esim_satisfaction_score
      label: ESIM Profile Management Survey
      hint: How would you rate your overall satisfaction with your eSIM profile
      type: select_one
      options:
      - Very Dissatisfied
      - Somewhat Dissatisfied
      - Neutral
      - Somewhat Satisfied
      - Very Satisfied
      required: false
    - id: 5
