inputSchema:
  type: object
  properties:
    title: software_freedom_principles_survey
    pages:
    - id: 1
      name: introduction
      label: Software Freedom Principles Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: background_info
      label: background
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: open_source_definition
      label: open_source_definition
      hint: null
      type: select_one
      options:
      - Free and open-source software is distributed without any copyright
      - Free and open-source software has no cost, or can be distributed at no cost
      - Free and open-source software is distributed under open-source licenses that
        give users the freedom to study, modify and redistribute it
      - Free and open-source software is used for social good, such as in education,
        science, or healthcare
      required: true
    - id: 4
      name: software_freedom_principles
      label: software_freedom_principles
      hint: null
      type: select_multiple
      options:
      - Users have the freedom to use the software for any purpose
      - Users have the freedom to study the software and understand how it works
      - Users have the freedom to modify and distribute copies of the software
      - Users have the freedom to modify the software and distribute derivative works
        based on it
      - Users have the freedom to make and sell a modified version of the software
      - Users have the freedom to distribute copies of the software and charge for
        it
      required: true
    - id: 5
      name: open_source_engagement
      label: open_source_engagement
      hint: null
      type: select_multiple
      options:
      - Contributing patches
      - Contributing code
      - Contributing documentation
      - Contributing to community projects
      - Participating in community decision-making
      - Advocating for free and open-source software
      required: true
    - id: 6
      name: community_involvement
      label: community_involvement
      hint: null
      type: select_one
      options:
      - Participating in online forums
      - Participating in local meetups
      - Participating in social media groups
      - Participating in community events
      - Participating in hackathons
      required: false
    - id: 7
      name: awareness_and_values
      label: awareness_and_values
      hint: null
      type: select_multiple
      options:
      - Free and open-source software development is important for the future of technology
      - The freedom to use, modify and distribute software is essential for innovation
      - Free and open-source software is more secure than proprietary software
      - Free and open-source software development is essential for social good
      - Free and open-source software development is more efficient than proprietary
        software development
      - Free and open-source software development is more reliable than proprietary
        software development
      required: false
    - id: 8
      name: open_source_benefits
      label: open_source_benefits
      hint: null
      type: select_one
      options:
      - More cost-effective
      - More reliable
      - More efficient
      - More secure
      - More flexible
      - More innovative
      required: true
    - id: 9
      name: additional_comments
      label: additional_comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submit
      label: submit
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: contact_information
      label: contact_information
      hint: null
      type: text
      options: []
      required: false
