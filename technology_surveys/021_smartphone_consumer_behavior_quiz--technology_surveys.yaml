inputSchema:
  type: object
  properties:
    title: Smartphone Consumer Behavior Quiz
    pages:
    - id: 1
      name: form_data
      label: Collect smartphone preference insights
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: age
      label: What is your age?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - male
      - female
      - other
      required: false
    - id: 4
      name: phone_usage
      label: How often do you use your phone?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Several times a week
      - Rarely
      - Never
      required: false
    - id: 5
      name: screen_size
      label: What size screen do you prefer?
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      - Extra Large
      required: false
    - id: 6
      name: phone_os
      label: What operating system do you use on your phone?
      hint: null
      type: select_one
      options:
      - iOS
      - Android
      - other
      required: false
    - id: 7
      name: social_media
      label: How do you prefer to use social media?
      hint: null
      type: select_multiple
      options:
      - Facebook
      - Twitter
      - Instagram
      - Other
      required: false
    - id: 8
      name: email_address
      label: Email address
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone_number
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: location
      label: Location
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: device_usage
      label: How often do you use a smartphone?
      hint: null
      type: select_multiple
      options:
      - Always
      - Often
      - Sometimes
      - Rarely
      required: false
    - id: 12
      name: battery_life
      label: What percentage of battery do you use daily?
      hint: null
      type: select_multiple
      options:
      - 0-10
      - 10-20
      - 20-50
      - More than 50
      required: false
    - id: 13
      name: additional_comments
      label: Additional comments
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: confirm_phone_number
      label: Confirm your phone number
      hint: null
      type: text
      options: []
      required: false
