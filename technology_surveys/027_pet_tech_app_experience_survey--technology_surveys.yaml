inputSchema:
  type: object
  properties:
    title: Pet Tech App Experience Survey
    pages:
    - id: 1
      name: app_usage
      label: How often do you use the app?
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: satisfaction_level
      label: How satisfied are you with the app's performance?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: issues_encountered
      label: Have you encountered any issues while using the app?
      hint: null
      type: select_multiple
      options:
      - None
      - Bug in the app
      - Feature not working as expected
      - Slow performance
      - Other
      required: false
    - id: 4
      name: feature_requests
      label: What features would you like to see in the future?
      hint: null
      type: select_one
      options:
      - None
      - Integration with calendar apps
      - Integration with other pet-related apps
      - Personalized experience
      - Other
      required: false
    - id: 5
      name: satisfaction_why
      label: Why do you feel about the app?
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: contact_method
      label: What is your preferred contact method?
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Chat
      - None
      required: false
