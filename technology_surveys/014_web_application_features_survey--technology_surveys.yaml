inputSchema:
  type: object
  properties:
    title: Web Application Features Survey
    pages:
    - id: 1
      name: feature_importance
      label: Feature importance
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: satisfaction_level
      label: Satisfaction level
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: new_features_ideas
      label: New features ideas
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: feature_requests
      label: Feature requests
      hint: null
      type: select_multiple
      options:
      - Features that are not available
      - Features not yet available
      - Features already available
      required: false
    - id: 5
      name: feedback
      label: Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: feature_improvements
      label: Feature improvements
      hint: null
      type: select_one
      options:
      - Improve the user interface
      - Improve the user experience
      - Improve the overall speed
      - Improve the overall quality
      required: false
