        type: select_one
        options:
          - Very Concerned
          - Concerned
          - Neutral
          - Not Concerned
        required: true
      - id: 18
        name: training_needs
        label: Training Requirements
        hint: Will staff need training
        type: select_one
        options:
          - Extensive Training
          - Some Training
          - Minimal Training
          - No Training
        required: true
      - id: 19
        name: success_metrics
        label: Success Metrics
        hint: How will you measure success
        type: text
        options: []
        required: false
      - id: 20
        name: additional_comments
        label: Additional Comments
        hint: Any other thoughts
        type: text
        options: []
        required: false
