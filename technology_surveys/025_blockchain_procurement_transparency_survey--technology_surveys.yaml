          - Reduced Fraud
          - Faster Transactions
          - Lower Costs
          - Improved Compliance
          - Better Supplier Relations
        required: true
      - id: 12
        name: implementation_barriers
        label: Implementation Barriers
        hint: What prevents adoption
        type: select_multiple
        options:
