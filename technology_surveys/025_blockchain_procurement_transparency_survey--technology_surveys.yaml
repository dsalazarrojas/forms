        hint: Optional
        type: text
        options: []
        required: false
      - id: 3
        name: organization
        label: Organization
        hint: Company or agency name
        type: text
        options: []
        required: true
      - id: 4
        name: industry
        label: Industry Sector
        hint: Your industry
        type: select_one
        options:
          - Government
          - Manufacturing
          - Retail
          - Healthcare
          - Finance
          - Technology
          - Logistics
          - Other
        required: true
      - id: 5
        name: job_role
        label: Job Role
        hint: Your position
        type: select_one
        options:
          - Procurement Manager
          - Supply Chain Director
          - IT Manager
          - Executive
          - Analyst
          - Consultant
          - Other
        required: true
      - id: 6
        name: organization_size
        label: Organization Size
        hint: Number of employees
        type: select_one
        options:
          - 1-50
          - 51-200
          - 201-500
          - 501-1000
          - 1001-5000
          - Over 5000
        required: true
      - id: 7
        name: blockchain_awareness
        label: Blockchain Awareness Level
        hint: How familiar are you with blockchain
        type: select_one
        options:
