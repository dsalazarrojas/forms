          - Technical Complexity
          - Lack of Expertise
          - Regulatory Uncertainty
          - Integration Issues
          - Resistance to Change
          - Not a Priority
        required: true
      - id: 13
        name: budget_allocation
        label: Budget for Blockchain
        hint: Is budget allocated
        type: select_one
        options:
          - Yes Allocated
          - Under Review
          - Not Allocated
          - Not Sure
        required: true
      - id: 14
        name: timeline_expectation
