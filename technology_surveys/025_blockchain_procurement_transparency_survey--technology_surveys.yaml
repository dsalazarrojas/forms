inputSchema:
  type: object
  properties:
    title: Blockchain Procurement Transparency Survey
    pages:
      - id: 1
        name: survey_intro
        label: Blockchain Procurement Transparency Survey
        hint: Help us understand blockchain adoption in procurement
        type: note
        options: []
