description: A survey to gather feedback on your experience with our mobile application.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied are you with your overall experience using the mobile app?
  type: single
- options:
  - Daily
  - Several times a week
  - Weekly
  - Monthly
  - Rarely
  - Never
  text: How often do you typically use the mobile app?
  type: single
- options:
  - Easy to use
  - Fast and responsive
  - Reliable
  - Intuitive
  - Lacking features
  - Confusing interface
  text: Which of the following best describe your experience with the app? (Select
    all that apply)
  type: multiple
- options:
  - Browsing content
  - Making purchases
  - Checking status
  - Communicating
  - Information retrieval
  - Other
  text: What is the primary reason you use the mobile app?
