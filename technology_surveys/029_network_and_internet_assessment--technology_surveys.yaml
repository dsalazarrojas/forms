      options:
      - Laptop
      - Smartphone
      - Desktop
      required: false
    - id: 4
      name: network_and_internet_assessment_issues
      label: issues
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: network_and_internet_assessment_email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: network_and_internet_assessment_phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: network_and_internet_assessment_additional_info
      label: additional_info
      hint: Any other comments you would like to share
      type: text
      options: []
      required: false
    - id: 8
      name: network_and_internet_assessment_comments
      label: comments
      hint: null
      type: text
      options: []
