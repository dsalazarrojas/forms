inputSchema:
  type: object
  properties:
    title: FinOps Tool Evaluation Survey
    pages:
    - id: 1
      name: form_start
      label: Survey
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: finops_tool_name
      label: Tool Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: tool_url
      label: Tool URL
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: tool_category
      label: Category
      hint: null
      type: select_one
      options:
      - Cloud Cost Management
      - Cloud Performance Monitoring
      - Cloud Security and Compliance
      - Cloud Service Management
      - Cloud Scalability
      - Cloud Migration
      - FinOps Tool
      - Other
      required: true
    - id: 5
      name: tool_rating
      label: Rate this tool
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      - Option 4
      required: true
    - id: 6
      name: tool_ease_of_use
      label: Ease of Use
      hint: null
      type: select_multiple
      options:
      - Very Easy
      - Somewhat Easy
      - Somewhat Difficult
      - Very Difficult
      - Option 5
      required: true
    - id: 7
      name: tool_value_for_money
      label: Value For Money
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Somewhat Good
      - Somewhat Bad
      - Very Bad
      - Option 5
      required: true
    - id: 8
      name: tool_support
      label: Support
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Somewhat Good
      - Somewhat Bad
      - Very Bad
      - Option 5
      required: true
    - id: 9
      name: tool_roadmap
      label: Roadmap
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Somewhat Good
      - Somewhat Bad
      - Very Bad
      - Option 5
      required: true
    - id: 10
      name: user_feedback
      label: User Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: user_recommendation
      label: Would you recommend this tool?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Option 3
      required: false
    - id: 12
      name: form_end
      label: Form End
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: tool_type
      label: Tool Type
      hint: null
      type: select_multiple
      options:
      - Cost Management
      - Performance Management
      - Security Management
      - Migration Management
      - FinOps Tool
      - Option 6
      required: true
    - id: 14
      name: tool_provider
      label: Tool Provider
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: tool_version
      label: Tool Version
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: tool_purchase_year
      label: Purchase Year
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: tool_cost
      label: Cost
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: user_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: user_title
      label: Your Title
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: company
      label: Company
      hint: null
      type: text
      options: []
      required: false
