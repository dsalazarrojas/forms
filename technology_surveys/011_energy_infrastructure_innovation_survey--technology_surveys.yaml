inputSchema:
  type: object
  properties:
    title: energy_infrastructure_innovation_survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: company
      label: company
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: company_list
      label: company_list
      hint: null
      type: select_one
      options:
      - Utility Company
      - Energy Company
      - Other Company
      - Research Institute
      - Government Agency
      - University/College
      required: false
    - id: 4
      name: innovation_priorities
      label: innovation_priorities
      hint: null
