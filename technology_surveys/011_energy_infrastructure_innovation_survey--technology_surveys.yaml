      type: select_multiple
      options:
      - Cost
      - Regulations
      - Lack of investment
      - Lack of data and analytics
      - Other
      required: false
    - id: 6
      name: successful_projects
      label: successful_projects
      hint: null
      type: select_multiple
      options:
      - Grid-scale solar
      - Energy efficiency in buildings
      - Community-based energy systems
      - Energy storage systems
      - Other
      required: false
    - id: 7
      name: contact_details
      label: contact_details
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
