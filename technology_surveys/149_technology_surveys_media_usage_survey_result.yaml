title: Media usage survey
description: Generate a Media usage survey survey for the "Technology surveys" category. Use the template name: "Media usage survey template".
questions:
  - text: Overall, how satisfied are you with media usage survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Media, Usage, Survey, Technology]
  - text: How often do you interact with media usage survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
