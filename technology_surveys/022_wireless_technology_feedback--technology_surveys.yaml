inputSchema:
  type: object
  properties:
    title: Wireless Technology Feedback
    pages:
    - id: 1
      name: wireless_technology_survey
      label: What is your overall satisfaction with wireless technology services?
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: wireless_issues
      label: Have you experienced any issues with your wireless connection or devices?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: signal_reception
      label: Have you had any problems with signal reception or dropped calls?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 4
      name: suggestions
      label: Do you have any suggestions for improving wireless technology services?
      hint: null
      type: note
      options: []
      required: true
    - id: 5
      name: phone_number
      label: What is your phone number (for follow-up contact)?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: preferred_contact
      label: Do you prefer to contact us via email or phone?
      hint: null
      type: radio
      options:
      - Email
      - Phone
      required: true
    - id: 7
      name: issue_description
      label: Can you please describe any issues you have encountered with wireless
        technology?
      hint: null
      type: note
      options: []
      required: true
    - id: 8
      name: further_feedback
      label: Do you have any further feedback or suggestions for us?
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: added_features
      label: Are there any features you would like to see added to wireless technology
        services?
      hint: null
      type: select_multiple
      options:
      - Data speed
      - Battery life
      - Security
      required: true
    - id: 10
      name: data_speed_issues
      label: Have you experienced any issues with data speeds or network congestion?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 11
      name: further_comments
      label: Are there any other issues or comments you would like to report?
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: additional_issues
      label: Are there any other issues you would like to report?
      hint: null
      type: text
      options: []
      required: true
