inputSchema:
  type: object
  properties:
    title: Device Keyboard Haptic Feedback Settings Request Form
    pages:
    - id: 1
      name: device_type
      label: Haptic Feedback Settings Form
      hint: null
      type: select_multiple
      options:
      - phone
      - laptop
      - tablet
      - watch
      - other
      required: true
    - id: 2
      name: haptic_feedback_type
      label: Haptic Feedback Type
      hint: null
      type: select_one
      options:
      - vibration
      - resistance
      - click
      - haptic
      required: true
    - id: 3
      name: haptic_feedback_settings
      label: Haptic Feedback Settings
      hint: null
      type: select_multiple
      options:
      - light
      - medium
      - strong
      - none
      required: true
    - id: 4
      name: device_model
      label: Device Model
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: haptic_feedback_description
      label: Haptic Feedback Description
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: submission_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - default
      - custom
      required: true
    - id: 12
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
