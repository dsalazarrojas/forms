inputSchema:
  type: object
  properties:
    title: Online Teaching Tools Survey
    pages:
    - id: 1
      name: online_teaching_tools_survey_form
      label: Online Teaching Tools Survey Form
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: platform_usage
      label: platform_usage
      hint: null
      type: select_one
      options:
      - JotForm
      - Kahoot
      - Google Classroom
      - Canvas
      - Other
      required: false
    - id: 3
      name: satisfaction_with_platform
      label: satisfaction_with_platform
      hint: On a scale of 1-10
      type: number
      options: []
      required: false
    - id: 4
      name: challenges_faced
      label: challenges_faced
      hint: null
      type: select_multiple
      options:
      - Difficulty with technology
      - Difficulty with learning management system
      - Difficulty with content creation
      - Difficulty with engagement
      - Difficulty with other
      required: false
    - id: 5
      name: platform_satisfaction
      label: platform_satisfaction
      hint: On a scale of 1-10
      type: number
      options: []
      required: false
    - id: 6
      name: platform_liking
      label: platform_liking
      hint: On a scale of 1-10
      type: number
      options: []
      required: false
    - id: 7
      name: platform_improvement
      label: platform_improvement
      hint: What would you like to see improved in this platform?
      type: select_one
      options:
      - User interface
      - Features
      - Support
      - Other
      required: false
    - id: 8
      name: comments
      label: comments
      hint: Any other comments about the platform
      type: select_multiple
      options:
      - Very good
      - Good
      - Fair
      - Poor
      - Very poor
      required: false
