inputSchema:
  type: object
  properties:
    title: Tech Gadget Usability Survey
    pages:
    - id: 1
      name: usage_frequency
      label: How long do you use the tech gadget daily?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: user_experience
      label: Rate the user experience of the tech gadget
      hint: null
      type: radio
      options:
      - Very positive
      - Positive
      - Neutral
      - Negative
      - Very negative
      required: true
    - id: 3
      name: favorite_features
      label: Which features do you enjoy most about the tech gadget?
      hint: null
      type: select_multiple
      options:
      - Performance
      - Design
      - User Interface
      - Other (please specify)
      required: false
    - id: 4
      name: likelihood_to_recommend
      label: How likely are you to recommend the tech gadget to a friend?
      hint: null
      type: select_one
      options:
      - Very likely
      - Somewhat likely
      - Not very likely
      - Not at all
      required: true
    - id: 5
      name: work_use
      label: How often do you use the tech gadget for work?
      hint: null
      type: radio
      options:
      - Daily
      - Weekly
      - Occasionally
      - Rarely
      required: false
    - id: 6
      name: performance
      label: How satisfied are you with the tech gadget's performance?
      hint: null
      type: radio
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: true
    - id: 7
      name: suggestions
      label: Do you have any suggestions for improving the tech gadget's usability?
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: battery_importance
      label: How important is the battery life of the tech gadget to you?
      hint: null
      type: radio
      options:
      - Very important
      - Somewhat important
      - Not very important
      - Not at all important
      required: false
    - id: 9
      name: design_aesthetic
      label: How would you rate the tech gadget's design aesthetic?
      hint: null
      type: radio
      options:
      - Very attractive
      - Somewhat attractive
      - Neutral
      - Somewhat unattractive
      - Very unattractive
      required: true
    - id: 10
      name: navigation
      label: How easy is it to navigate the tech gadget's interface?
      hint: null
      type: radio
      options:
      - Very easy
      - Somewhat easy
      - Neutral
      - Somewhat difficult
      - Very difficult
      required: true
    - id: 11
      name: software_issues
      label: Have you ever experienced any issues with the tech gadget's software
        or hardware?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: price
      label: Would you pay more for a tech gadget with better performance?
      hint: null
      type: radio
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 14
      name: note
      label: Additional comments or feedback
      hint: null
      type: note
      options: []
      required: false
