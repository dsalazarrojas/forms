inputSchema:
  type: object
  properties:
    title: Loop Selection Survey
    pages:
    - id: 1
      name: intro
      label: Introduction
      hint: Please answer the following questions to help us understand your experience
        with loops.
      type: note
      options: []
      required: false
    - id: 2
      name: projects
      label: What kind of projects do you have experience with?
      hint: null
      type: select_multiple
      options:
      - Open-ended text input
      - Projects with loops
      - None of the above
      required: false
    - id: 3
      name: frequency
      label: How often do you use loops in your work?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Never
      required: false
    - id: 4
      name: loop_type
      label: Which type of loops do you prefer?
      hint: null
      type: select_one
      options:
      - Open
      - Closed
      - S-Closed
      - None of the above
      required: false
    - id: 5
      name: ease_of_use
      label: How easy is it to use loops in your work?
      hint: null
      type: select_one
      options:
      - Easy
      - Medium
      - Hard
      - None of the above
      required: false
    - id: 6
      name: resources
      label: What kind of resources do you usually use to find help with loops?
      hint: null
      type: select_multiple
      options:
      - Documentation
      - Team members
      - Internet
      - None of the above
      required: false
    - id: 7
      name: team_involvement
      label: How often do you involve your team in loop-related tasks?
      hint: null
      type: select_multiple
      options:
      - Involving my team
      - Involving my team members directly
      - None of the above
      - Other
      required: false
    - id: 8
      name: projects_class
      label: Which type of projects do you usually work on that involve loops?
      hint: null
      type: select_multiple
      options:
      - Projects I'm currently working on
      - Projects with loops
      - Projects without loops
      - None of the above
      required: false
    - id: 9
      name: loop_involvement
      label: How involved do you get with your team members when working with loops?
      hint: null
      type: select_multiple
      options:
      - Involving my team members
      - Involving my team members prophets
      - None of the above
      - Involving my team manager
      - Other
      required: false
    - id: 10
      name: difficulties
      label: What kind of difficulties do you face when using loops?
      hint: null
      type: select_multiple
      options:
      - Difficulty understanding the loop
      - Difficulty using the loop in my work
      - None of the above
      - Difficulty finding resources to help me with the loop
      required: false
    - id: 11
      name: help
      label: Which resources do you usually get help from when working with loops?
      hint: null
      type: select_multiple
      options:
      - Documentation
      - Team members
      - Internet
      - None of the above
      required: false
    - id: 12
      name: preferences
      label: Which kind of loops do you usually prefer?
      hint: null
      type: select_multiple
      options:
      - Open
      - Closed
      - None of the above
      - Other
      required: false
    - id: 13
      name: loop_selection
      label: Which kind of loops do you usually select?
      hint: null
      type: select_multiple
      options:
      - Involving my team
      - Involving my team members
      - Involving my team members prophets
      - None of the above
      required: false
    - id: 14
      name: projects_2
      label: Which kind of projects do you usually work on?
      hint: null
      type: select_multiple
      options:
      - Projects I'm currently working on
      - None of the above
      - Other
      required: false
    - id: 15
      name: frequency_loop
      label: How often do you use loops in your daily tasks?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Never
      required: false
    - id: 16
      name: team
      label: How involved do you get with your team when working with loops?
      hint: null
      type: select_multiple
      options:
      - Involving my team
      - Involving my team members
      - None of the above
      - Other
      required: false
    - id: 17
      name: help_from_team
      label: Which kind of help do you usually get from your team when working with
        loops?
      hint: null
      type: select_multiple
      options:
      - Involving my team
      - Involving my team members
      - Involving my team members prophets
      - None of the above
      - Other
      required: false
    - id: 18
      name: projects_in_progress
      label: Which kind of projects do you usually work on that involve loops?
      hint: null
      type: select_multiple
      options:
      - Projects with loops
      - Projects in progress
      - Projects without loops
      - None of the above
      required: false
