inputSchema:
  type: object
  properties:
    title: Digital Health Adoption Strategy Evaluation Form
    pages:
    - id: 1
      name: digital_health_adoption_strategy_evaluation_form_1
      label: What is your role in the organization?
      hint: null
      type: select_one
      options:
      - CEO/Owner
      - Project Manager
      - IT Director
      required: false
    - id: 2
      name: digital_health_adoption_strategy_evaluation_form_2
      label: What is the size of your organization?
      hint: null
      type: select_multiple
      options:
      - Less than 10
      - 10-50
      - 51-100
      - More than 100
      required: false
    - id: 3
      name: digital_health_adoption_strategy_evaluation_form_3
      label: What digital health initiatives has your organization implemented?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: digital_health_adoption_strategy_evaluation_form_4
      label: What is your current stage of digital health adoption?
      hint: null
      type: select_one
      options:
      - Not started
      - In progress
      - Completed
      required: false
    - id: 5
      name: digital_health_adoption_strategy_evaluation_form_5
      label: How do you see digital health initiatives affecting your organization
        in 2 years?
      hint: null
      type: select_multiple
      options:
      - Increasing efficiency
      - Cost savings
      - Improved customer satisfaction
      - Improved patient satisfaction
      required: false
    - id: 6
      name: digital_health_adoption_strategy_evaluation_form_6
      label: Have you experienced challenges with digital health adoption in your
        organization?
      hint: null
      type: select_multiple
      options:
      - Lack of resources
      - Change management
      - Data security and privacy concerns
      - Other (please specify)
      required: false
    - id: 7
      name: digital_health_adoption_strategy_evaluation_form_7
      label: What are some potential solutions to address these challenges?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: digital_health_adoption_strategy_evaluation_form_8
      label: What are some potential solutions to address these challenges?
      hint: null
      type: text
      options: []
      required: false
