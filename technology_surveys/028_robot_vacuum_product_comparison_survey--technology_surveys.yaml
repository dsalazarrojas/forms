inputSchema:
  type: object
  properties:
    title: Robot Vacuum Product Comparison Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: robot_vacuum_brand
      label: Which robot vacuum brand do you own or have used?
      hint: null
      type: select_one
      options:
      - iRobot
      - Neato
      - Samsung
      required: true
    - id: 3
      name: feature_importance
      label: What feature is most important to you when choosing a robot vacuum?
      hint: null
      type: select_one
      options:
      - Suction Power
      - Navigation
      - Charging Time
      - Price
      required: true
    - id: 4
      name: feature_importance_2
      label: What feature is second most important to you?
      hint: null
      type: select_multiple
      options:
      - Suction Power
      - Navigation
      - Charging Time
      - Price
      required: true
    - id: 5
      name: purchase_satisfaction
      label: How satisfied are you with your purchase?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      required: true
    - id: 6
      name: purchase_driver
      label: Why did you purchase your robot vacuum?
      hint: null
      type: select_one
      options:
      - Price
      - Recommendation
      - Product Reviews
      - Brand
      required: true
    - id: 7
      name: price_range
      label: What is your preferred price range for a robot vacuum?
      hint: null
      type: select_multiple
      options:
      - 0-500
      - 500-1000
      - 1000-2000
      - 2000-3000
      - Other
      required: true
    - id: 8
      name: feature_preference
      label: What feature would you prefer?
      hint: null
      type: select_one
      options:
      - Suction Power
      - Navigation
      - Charging Time
      - Price
      - Navigation System
      required: true
    - id: 9
      name: preferred_navigation
      label: What is your preferred navigation system for a robot vacuum?
      hint: null
      type: select_one
      options:
      - Laser Navigation
      - Camera Navigation
      - Sensor Navigation
      - Other
      required: true
    - id: 10
      name: preferred_model
      label: What is your preferred model of robot vacuum?
      hint: null
      type: select_one
      options:
      - iRobot
      - Neato
      - Samsung
      - Other
      required: true
    - id: 11
      name: usage_time
      label: How long have you been using your robot vacuum?
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: satisfaction
      label: What is your level of satisfaction with your robot vacuum?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      required: true
    - id: 13
      name: purchase_driver_2
      label: What drives your purchasing decision for a robot vacuum?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: additional_purchasing_driver
      label: Additional reasons that drive your purchasing decision for a robot vacuum?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: robot_vacuum_issues
      label: Are you experiencing any issues with your current robot vacuum?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 16
      name: issues_description
      label: Please describe the issues you are experiencing with your current robot
        vacuum.
      hint: null
      type: text
      options: []
      required: false
