inputSchema:
  type: object
  properties:
    title: tech_gadget_consumer_preference_poll
    pages:
    - id: 1
      name: device_ownership
      label: Do you own a smartphone?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 2
      name: priority_1
      label: What is your priority for a new phone?
      hint: null
      type: select_multiple
      options:
      - Price
      - Camera
      - Battery
      - Storage
      - Performance
      required: false
    - id: 3
      name: buying_intents
      label: What do you plan to buy next?
      hint: null
      type: select_multiple
      options:
      - Online
      - Retail
      - Other
      required: false
    - id: 4
      name: features
      label: Which of the following features does your current phone have?
      hint: null
      type: select_multiple
      options:
      - GPS
      - Touch Screen
      - Camera
      - Headphone Jack
      - Microphone
      required: true
    - id: 5
      name: notes
      label: Additional notes
      hint: null
      type: note
      options: []
      required: false
