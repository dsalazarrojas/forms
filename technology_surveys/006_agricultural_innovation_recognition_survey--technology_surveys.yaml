inputSchema:
  type: object
  properties:
    title: Agricultural Innovation Recognition Survey
    pages:
    - id: 1
      name: respondent_name
      label: Respondent name
      hint: Optional for anonymous submissions
      type: text
      options: []
      required: false
    - id: 2
      name: organization
      label: Organization
      hint: Name of organization nominating the innovation
      type: text
      options: []
      required: false
    - id: 3
      name: innovation_title
      label: Innovation title
      hint: Short name for the innovation
      type: text
      options: []
      required: true
    - id: 4
      name: innovation_summary
      label: Innovation summary
      hint: Brief description of the technology and purpose
      type: text
      options: []
      required: true
    - id: 5
      name: innovation_benefits
      label: Innovation benefits
      hint: Describe expected benefits for productivity or sustainability
      type: text
      options: []
      required: true
    - id: 6
      name: readiness_level
      label: Readiness level
      hint: Development stage of the innovation
      type: select_one
      options: [Research, Prototype, Pilot, Commercial]
      required: true
    - id: 7
      name: impact_scale
      label: Impact scale
      hint: Estimated scale of impact such as local or regional
      type: select_one
      options: [Local, Regional, National, International]
      required: false
    - id: 8
      name: supporting_evidence
      label: Supporting evidence available
      hint: Describe trials, data, or case studies
      type: text
      options: []
      required: false
    - id: 9
      name: contact_email
      label: Contact email
      hint: Best email to reach for follow-up
      type: email
      options: []
      required: false
    - id: 10
      name: consent_publish
      label: Consent to publish summary of innovation
      hint: Permission to share details in reports or awards
      type: select_one
      options: [Yes, No]
      required: true
