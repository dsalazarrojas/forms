inputSchema:
  type: object
  properties:
    title: Teacher Technology Survey
    pages:
    - id: 1
      name: teacher_experience_with_technology
      label: What is your experience level with technology in the classroom?
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: technology_used_for_communication
      label: What technology platforms do you use for communication with students
        and parents?
      hint: null
      type: select_multiple
      options:
      - Email
      - Online forum
      - Social media
      required: false
    - id: 3
      name: hours_spent_on_professional_development
      label: How many hours do you spend per week on professional development using
        technology?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: technical_skills_needed
      label: What type of technical skills do you think are essential for teachers
        to have?
      hint: null
      type: select_multiple
      options:
      - Programming
      - Data analysis
      - Multimedia design
      required: false
    - id: 5
      name: technical_training
      label: Have you received any technical training or certifications in the past
        2 years?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: top_technologies_used
      label: What are the top 3 technologies that you use in your classroom?
      hint: null
      type: select_multiple
      options:
      - Computer
      - Tablet
      - Laptop
      required: false
    - id: 7
      name: technical_support
      label: How many hours of technical support do you receive from your school's
        IT department per week?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: lacking_skills
      label: What are the top 3 technical skills that teachers in your school lack?
      hint: null
      type: select_multiple
      options:
      - Programming
      - Data analysis
      - Multimedia design
      required: false
    - id: 9
      name: technical_issues
      label: Have you had any issues with technology in the past year?
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: technical_support_hours
      label: How many hours do you spend on technical issues per week?
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: future_technology_usage
      label: What would you like to see in the future regarding technology usage in
        school?
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: additional_comments
      label: Any additional comments?
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: technical_skills
      label: What technical skills do you need to improve your teaching practice?
      hint: null
      type: select_multiple
      options:
      - Presentation design
      - Data analysis
      - Online resources
      required: false
    - id: 14
      name: technical_skills_and_knowledge
      label: What technical skills and knowledge would you like to acquire?
      hint: null
      type: select_multiple
      options:
      - Programming
      - Data analysis
      - Multimedia design
      required: false
