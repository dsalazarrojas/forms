title: Software evaluation form
description: Generate a Software evaluation form survey for the "Technology surveys" category. Use the template name: "Software evaluation form template".
questions:
  - text: Overall, how satisfied are you with software evaluation form?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Software, Evaluation, Form, Technology]
  - text: How often do you interact with software evaluation form?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
