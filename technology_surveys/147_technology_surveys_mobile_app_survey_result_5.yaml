title: Mobile app survey
description: Generate a Mobile app survey survey for the "Technology surveys" category. Use the template name: "Mobile app survey template".
questions:
  - text: Overall, how satisfied are you with mobile app survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Mobile, App, Survey, Technology]
  - text: How often do you interact with mobile app survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
