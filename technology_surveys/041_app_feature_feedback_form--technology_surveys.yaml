inputSchema:
  type: object
  properties:
    title: App Feature Feedback Form
    pages:
      - id: 1
        name: feedback_date
        label: Feedback date
        hint: null
        type: date
        options: []
        required: true
      - id: 2
        name: user_name
        label: Your name or username
        hint: Optional
        type: text
        options: []
        required: false
      - id: 3
        name: email_address
        label: Email address
        hint: null
        type: email
        options: []
        required: false
      - id: 4
        name: app_name
        label: App name
        hint: Which app are you providing feedback for
        type: text
        options: []
        required: true
      - id: 5
        name: feature_being_reviewed
        label: Which feature are you reviewing
        hint: Feature name
        type: text
        options: []
        required: true
      - id: 6
        name: feature_description
        label: Brief description of the feature
        hint: null
        type: text
        options: []
        required: true
      - id: 7
        name: time_using_feature
        label: How long have you used this feature?
        hint: null
        type: select_one
        options:
          - Less than 1 day
          - 1-7 days
          - 1-4 weeks
          - 1-3 months
          - 3-6 months
          - 6+ months
        required: true
      - id: 8
        name: frequency_of_use
        label: How often do you use this feature?
        hint: null
        type: select_one
        options:
          - Daily
          - Several times per week
          - Weekly
          - Monthly
          - Rarely
          - Never use this feature
        required: true
      - id: 9
        name: usefulness_rating
        label: How useful is this feature?
        hint: null
        type: select_one
        options:
          - Very useful
          - Useful
          - Somewhat useful
          - Not very useful
          - Not useful at all
        required: true
      - id: 10
        name: ease_of_use_rating
        label: How easy is this feature to use?
        hint: null
        type: select_one
        options:
          - Very easy
          - Easy
          - Moderate
          - Difficult
          - Very difficult
        required: true
      - id: 11
        name: performance_rating
        label: Feature performance and speed
        hint: null
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Very poor
        required: true
      - id: 12
        name: reliability_rating
        label: Feature reliability and stability
        hint: Does it work as expected
        type: select_one
        options:
          - Always works
          - Mostly works
          - Sometimes has issues
          - Frequently has issues
          - Does not work
        required: true
      - id: 13
        name: comparison_other_apps
        label: How does it compare to similar features in other apps?
        hint: null
        type: select_one
        options:
          - Better than alternatives
          - As good as alternatives
          - Worse than alternatives
          - Not sure
        required: true
      - id: 14
        name: feature_meets_needs
        label: Does this feature meet your needs?
        hint: null
        type: select_one
        options:
          - Completely meets needs
          - Mostly meets needs
          - Partially meets needs
          - Does not meet needs
        required: true
      - id: 15
        name: problems_encountered
        label: Problems or issues with this feature
        hint: null
        type: text
        options: []
        required: false
      - id: 16
        name: missing_functionality
        label: What functionality is missing or needed?
        hint: null
        type: text
        options: []
        required: false
      - id: 17
        name: improvement_suggestions
        label: Specific improvement suggestions
        hint: null
        type: text
        options: []
        required: false
      - id: 18
        name: overall_satisfaction
        label: Overall satisfaction with this feature
        hint: null
        type: select_one
        options:
          - Very satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very dissatisfied
        required: true
      - id: 19
        name: likelihood_recommend
        label: Likelihood to recommend this app based on this feature
        hint: null
        type: select_one
        options:
          - Very likely
          - Likely
          - Neutral
          - Unlikely
          - Very unlikely
        required: true
      - id: 20
        name: additional_feedback
        label: Any additional feedback
        hint: null
        type: text
        options: []
        required: false
