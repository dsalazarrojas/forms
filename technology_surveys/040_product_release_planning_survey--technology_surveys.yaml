inputSchema:
  type: object
  properties:
    title: product release planning survey
    pages:
    - id: 1
      name: product_release_planning_survey
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: release_planning_survey
      label: What are your primary goals for this release?
      hint: null
      type: select_multiple
      options:
      - Feature prioritization
      - Release readiness
      - Communication
      required: true
    - id: 3
      name: release_planning_survey_readiness
      label: On a scale of 0-5, how ready are you for this release?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: release_planning_survey_communication
      label: How confident are you in your team's ability to communicate effectively
        for this release?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: release_planning_survey_feedback
      label: What do you think is the biggest risk for this release?
      hint: Please provide details
      type: text
      options: []
      required: true
    - id: 6
      name: release_planning_survey_feature_prioritization
      label: Prioritize features for this release
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 7
      name: release_planning_survey_communication_plan
      label: Do you have a communication plan in place for this release?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: release_planning_survey_additional_feedback
      label: Additional feedback
      hint: null
      type: note
      options: []
      required: false
