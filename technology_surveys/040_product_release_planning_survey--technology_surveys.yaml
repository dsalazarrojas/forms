      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: release_planning_survey_comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: release_planning_survey_confirmation
      label: Is this your first time participating in a product launch?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 13
      name: release_planning_survey_survey_confirmation
      label: Have you taken the survey in this category before?
      hint: null
