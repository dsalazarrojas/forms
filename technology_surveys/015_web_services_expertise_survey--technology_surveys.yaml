inputSchema:
  type: object
  properties:
    title: Web Services Expertise Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: experience_with_apis
      label: Experience with APIs
      hint: null
      type: select_multiple
      options:
      - REST
      - GraphQL
      - SOAP
      - Other (please specify)
      required: false
    - id: 3
      name: expertise_in_web_services
      label: Expertise in Web Services
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Expert
      required: false
    - id: 4
      name: current_usage_of_web_services
      label: Current usage of Web Services
      hint: null
      type: select_multiple
      options:
      - Internal
      - External
      - Cloud
      - On-premises
      required: false
    - id: 5
      name: proficiency_in_apis
      label: Proficiency in APIs
      hint: null
      type: select_multiple
      options:
      - REST
      - GraphQL
      - SOAP
      - Other (please specify)
      required: false
    - id: 6
      name: tools_used_for_web_services
      label: Tools used for Web Services
      hint: null
      type: select_multiple
      options:
      - Postman
      - cURL
      - SoapUI
      - Postman/SoapUI
      - Other (please specify)
      required: false
    - id: 7
      name: common_usage_patterns
      label: Common usage patterns
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: web_services_experience
      label: Web Services Experience
      hint: null
      type: select_multiple
      options:
      - Less than 1 year
      - 1-2 years
      - 2-5 years
      - 5-10 years
      - More than 10 years
      required: false
    - id: 9
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
