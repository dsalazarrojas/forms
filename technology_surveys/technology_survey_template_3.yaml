description: A survey to gather feedback on technology usage and preferences.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied are you with the technology you currently use?
  type: single
- options:
  - Very frequently
  - Frequently
  - Sometimes
  - Rarely
  - Never
  text: How often do you actively seek out and adopt new technology?
  type: single
- options:
  - Easy to use
  - Fast
  - Reliable
  - Innovative
  - Secure
  - Confusing
  text: Which of the following best describes your general experience with technology?
    (select all that apply)
  type: multiple
- text: What would you most like to improve or change about technology in general?
  type: text
- text: Do you have any additional comments or feedback on technology?
  type: text
title: Technology survey
