inputSchema:
  type: object
  properties:
    title: Hand Tracking Feature Feedback
    pages:
    - id: 1
      name: feature_rating
      label: Feature Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - '{''value'': 1, ''label'': ''1 - Not Satisfied''}'
      - '{''value'': 2, ''label'': ''2 - Neutral''}'
      - '{''value'': 3, ''label'': ''3 - Satisfied''}'
      - '{''value'': 4, ''label'': ''4 - Very Satisfied''}'
      - '{''value'': 5, ''label'': ''5 - Extremely Satisfied''}'
      required: false
    - id: 3
      name: comment
      label: Comment
      hint: null
      type: note
      options: []
      required: false
