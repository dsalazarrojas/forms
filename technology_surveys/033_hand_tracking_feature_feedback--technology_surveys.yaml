inputSchema:
  type: object
  properties:
    title: Hand Tracking Feature Feedback
    pages:
    - id: 1
      name: feature_rating
      label: Feature Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - 1 - Not Satisfied
      - 2 - Neutral
      - 3 - Satisfied
      - 4 - Very Satisfied
      - 5 - Extremely Satisfied
      required: false
    - id: 3
      name: comment
      label: Comment
      hint: null
      type: note
      options: []
      required: false
