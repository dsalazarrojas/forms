inputSchema:
  type: object
  properties:
    title: AI Mentor Customization Survey
    pages:
    - id: 1
      name: user_profile_header
      label: '--- Personalize Your AI Mentor ---'
      hint: Help us tailor your AI mentoring experience to your unique needs.
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: primary_domain
      label: Primary Field of Study / Interest
      hint: What do you want to be mentored in?
      type: select_one
      options:
      - Software Development / Coding
      - Business Strategy & Entrepreneurship
      - Creative Writing & Content
      - Data Science & Analytics
      - Personal Growth & Wellness
      - Academic Research
      required: true
    - id: 4
      name: skill_level_baseline
      label: Current Skill Level in this Domain
      hint: null
      type: select_one
      options:
      - Novice (Just starting)
      - Intermediate (Have foundational knowledge)
      - Advanced (Proficient / Professional)
      - Expert (Specialized / Lead role)
      required: true
    - id: 5
      name: mentorship_style_header
      label: '--- Mentorship Style & Tone ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: preferred_style
      label: Preferred Mentorship Style
      hint: How should the AI interact with you?
      type: select_one
      options:
      - Encouraging & Supportive (Positive reinforcement)
      - Direct & Critical (No-nonsense feedback)
      - Socratic (Guides you with questions)
      - Analytical (Data and evidence focused)
      required: true
    - id: 7
      name: mentor_tone
      label: Desired Mentor Tone
      hint: null
      type: select_one
      options:
      - Professional / Formal
      - Casual / Friendly
      - Academic / Serious
      - Quirky / Humorous
      required: true
    - id: 8
      name: interaction_frequency
      label: How often do you want 'Proactive' check-ins from your mentor?
      hint: null
      type: select_one
      options:
      - Daily (Morning/Evening Sync)
      - Twice Weekly
      - Weekly Summary
      - Never (I will initiate all contact)
      required: true
    - id: 9
      name: customization_details_header
      label: '--- Content and Logistics ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: specific_goals
      label: What are your top 3 specific goals for this mentorship?
      hint: e.g., "Complete my first React app", "Improve leadership communication"
      type: text
      options: []
      required: true
    - id: 11
      name: depth_of_response
      label: Preferred Depth of Technical Explanations
      hint: null
      type: select_one
      options:
      - High-level / Conceptual
      - Standard / Balanced
      - Deep-dive / Technical details
      required: true
    - id: 12
      name: preferred_input_method
      label: Preferred Interaction Method
      hint: null
      type: select_multiple
      options:
      - Text Chat
      - Voice / Audio Messages
      - Code Review / Code Snippets
      - Visual / Diagrams
      required: true
    - id: 13
      name: tool_integrations
      label: Which tools should the AI Mentor integrate with?
      hint: null
      type: select_multiple
      options:
      - Google Calendar
      - GitHub / GitLab
      - Notion / Obsidian
      - Slack / Discord
      required: false
    - id: 14
      name: data_memory_preference
      label: Conversation Memory & Privacy
      hint: null
      type: select_one
      options:
      - Full Memory (Retain all context indefinitely)
      - Session-only Memory (Forget after each topic)
      - Personalized (Keep goals, forget small talk)
      required: true
    - id: 15
      name: primary_language
      label: Preferred Interaction Language
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: contact_email
      label: Email (to sync your preferences across devices)
      hint: null
      type: email
      options: []
      required: true
    - id: 17
      name: survey_completion_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
