inputSchema:
  type: object
  properties:
    title: Facility Technology Adoption Survey
    pages:
    - id: 1
      name: introduction_page
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: tech_adoption
      label: Current Technology Adoption
      hint: null
      type: select_multiple
      options:
      - Mobile devices
      - Computers
      - Software
      - Other (please specify)
      - No technology adoption
      required: false
    - id: 3
      name: used_technology
      label: Technologies Used
      hint: null
      type: select_multiple
      options:
      - Mobile devices
      - Computers
      - Software
      - Other (please specify)
      - None
      required: false
    - id: 4
      name: facility_count
      label: Facility Count
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: facility_purpose
      label: Facility Purpose
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: maintenance_state
      label: Current Maintenance State
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not applicable
      required: false
    - id: 7
      name: tech_types
      label: Technology Types Used
      hint: null
      type: text
      options: []
      required: false
