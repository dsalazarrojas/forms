title: Phone survey
description: Generate a Phone survey survey for the "Technology surveys" category. Use the template name: "Phone survey template".
questions:
  - text: Overall, how satisfied are you with phone survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Phone, Survey, Technology, Surveys]
  - text: How often do you interact with phone survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
