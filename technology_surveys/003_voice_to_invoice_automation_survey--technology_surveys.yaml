      - 'False'
      - Undecided
      required: false
    - id: 10
      name: customer_discovery
      label: Customer Discovery
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Undecided
      required: false
    - id: 11
      name: planning
      label: Planning
      hint: null
      type: time
      options: []
      required: false
