inputSchema:
  type: object
  properties:
    title: programming_languages_proficiency_survey
    pages:
    - id: 1
      name: survey_language
      label: Which language do you know?
      hint: null
      type: select_one
      options:
      - Python
      - Java
      - C++
      - C
      - JavaScript
      - C#
      - Swift
      - Ruby
      required: false
    - id: 2
      name: language_proficiency
      label: How proficient are you in this language?
      hint: null
      type: select_multiple
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
    - id: 3
      name: years_of_experience
      label: How many years of experience do you have with the language?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: frequency_of_use
      label: How frequently do you use the language in your daily work?
      hint: null
      type: select_one
      options:
      - Never
      - Rarely
      - Occasionally
      - Frequently
      - Always
      required: false
    - id: 5
      name: last_used
      label: When did you last use the language?
      hint: null
      type: date
      options: []
      required: false
    - id: 6
