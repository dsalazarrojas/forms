inputSchema:
  type: object
  properties:
    title: AI Supply Chain Survey
    pages:
    - id: 1
      name: --supply_chain_context--
      label: -- Supply Chain Context --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Respondent name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: organization
      label: Organization
      hint: Company or unit
      type: text
      options: []
      required: true
    - id: 4
      name: role
      label: Role in supply chain
      hint: Example Procurement, Logistics
      type: text
      options: []
      required: true
    - id: 5
      name: ai_use_cases
      label: AI use cases in supply chain
      hint: Select all that apply
      type: select_multiple
      options:
      - Demand forecasting
      - Inventory optimization
      - Route planning
      - Supplier risk scoring
      - Quality inspection
      required: true
    - id: 6
      name: adoption_stage
      label: Adoption stage of AI in supply chain
      hint: Select one
      type: select_one
      options:
      - Experimentation
      - Early adoption
      - Operational
      - Scaling
      required: true
    - id: 7
      name: key_challenges
      label: Key challenges to adoption
      hint: Select all that apply
      type: select_multiple
      options:
      - Data quality
      - Integration complexity
      - Change management
      - Vendor maturity
      required: false
    - id: 8
      name: expected_benefits
      label: Expected benefits from AI
      hint: Select all that apply
      type: select_multiple
      options:
      - Cost reduction
      - Improved service levels
      - Faster decision making
      - Reduced stockouts
      required: true
    - id: 9
      name: estimated_roi
      label: Estimated ROI timeframe
      hint: Select one
      type: select_one
      options:
      - Under 6 months
      - 6 to 12 months
      - 12 to 24 months
      - Over 24 months
      required: false
    - id: 10
      name: additional_comments
      label: Additional comments
      hint: Optional
      type: text
      options: []
      required: false
