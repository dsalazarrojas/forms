inputSchema:
  type: object
  properties:
    title: Disaster Preparedness Knowledge Survey
    pages:
    - id: 1
      name: page_1
      label: What is your role in the household?
      hint: null
      type: select_one
      options:
      - Parent
      - Spouse
      - Adult Child
      - Other
      required: true
    - id: 2
      name: page_2
      label: Do you have an Emergency Plan?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: page_3
      label: Have you had to evacuate due to a disaster?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: page_4
      label: Have you experienced a disaster in the past?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: emergency_contact_info
      label: Emergency Contact Info
      hint: null
      type: select_one
      options:
      - On a list in a visible location (e.g., fridge, near phone)
      - In a separate notebook or binder
      - On a phone app (e.g., phone contacts)
      required: true
    - id: 6
      name: page_6
      label: Have you taken any training on disaster preparedness?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: safe_room
      label: Safe Room or Area
      hint: null
      type: select_one
      options:
      - Yes, I have a safe room/area
      - No, but I know what to do in case of a disaster
      required: false
