inputSchema:
  type: object
  properties:
    title: Mobile Network Connectivity Survey
    pages:
    - id: 1
      name: general_info
      label: General Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: area
      label: area
      hint: null
      type: select_one
      options:
      - 3G
      - 4G
      - 5G
      required: false
    - id: 3
      name: network_speed
      label: network_speed
      hint: null
      type: select_one
      options:
      - slow
      - average
      - fast
      required: false
    - id: 4
      name: coverage
      label: coverage
      hint: null
      type: select_multiple
      options:
      - strong
      - weak
      - 'no'
      required: false
    - id: 5
      name: reliability
      label: reliability
      hint: null
      type: select_one
      options:
      - often
      - sometimes
      - rarely
      required: false
    - id: 6
      name: satisfaction
      label: satisfaction
      hint: null
      type: select_one
      options:
      - very satisfied
      - satisfied
      - neutral
      - dissatisfied
      - very dissatisfied
      required: false
    - id: 7
      name: issue_description
      label: issue_description
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: additional_info
      label: additional_info
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: submit
      label: submit
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: false
