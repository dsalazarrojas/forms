inputSchema:
  type: object
  properties:
    title: Click Speed Configuration Survey
    pages:
    - id: 1
      name: intro_header
      label: -- Click Speed Configuration Survey --
      hint: Help us optimize device responsiveness and accessibility.
      type: note
      options: []
      required: false
    - id: 2
      name: device_category
      label: Primary device you are configuring
      hint: null
      type: select_one
      options:
      - Desktop Mouse
      - Laptop Trackpad
      - Gaming Mouse
      - Touchscreen Device
      - Accessibility Switch
      required: true
    - id: 3
      name: operating_system
      label: Operating System
      hint: null
      type: select_one
      options:
      - Windows
      - macOS
      - Linux
      - Android
      - iOS
      required: true
    - id: 4
      name: current_click_speed
      label: Your current double-click speed setting
      hint: 1 (Slowest) to 10 (Fastest)
      type: number
      options: []
      required: true
    - id: 5
      name: satisfaction_with_speed
      label: How satisfied are you with the current responsiveness?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 6
      name: issue_frequency
      label: How often do you experience accidental double-clicks or missed clicks?
      hint: null
      type: select_one
      options:
      - Frequently
      - Occasionally
      - Rarely
      - Never
      required: true
    - id: 7
      name: accessibility_needs
      label: Do you require specific click speed adjustments for accessibility reasons?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 8
      name: usage_context
      label: Primary use case for this device
      hint: null
      type: select_one
      options:
      - General Productivity
      - Competitive Gaming
      - Creative Work (Design/Editing)
      - Software Development
      - Casual Browsing
      required: true
    - id: 9
      name: preference_adjustment
      label: If you could change the setting, would you prefer it to be...
      hint: null
      type: select_one
      options:
      - Much Slower
      - Slightly Slower
      - No Change
      - Slightly Faster
      - Much Faster
      required: true
    - id: 10
      name: feature_requests
      label: Are there any specific click-related features you'd like to see?
      hint: e.g. Triple-click support, variable speed profiles
      type: text
      options: []
      required: false
    - id: 11
      name: technical_feedback
      label: Any additional technical observations or feedback?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: user_expertise
      label: How would you rate your technical expertise with device configuration?
      hint: null
      type: select_one
      options:
      - Expert
      - Proficient
      - Intermediate
      - Beginner
      required: false
    - id: 13
      name: survey_date
      label: Date of Evaluation
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: footer_note
      label: -- Thank you for helping us improve device usability --
      hint: null
      type: note
      options: []
      required: false
