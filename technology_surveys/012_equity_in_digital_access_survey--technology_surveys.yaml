inputSchema:
  type: object
  properties:
    title: Equity in Digital Access Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: question_1
      label: What is the primary reason you use the Bible?
      hint: null
      type: select_one
      options:
      - Personal Devotion
      - Study and Research
      - Spiritual Guidance
      - Other
      required: false
    - id: 3
      name: question_2
      label: What are the goals of your organization?
      hint: null
      type: select_multiple
      options:
      - Financial Support
      - Resource Sharing
      - Community Building
      - Other
      required: false
    - id: 4
      name: question_3
      label: What type of equipment would you like to see your organization support?
      hint: null
      type: select_one
      options:
      - Computer
      - Internet Connection
      - Mobile Device
      - Other
      required: false
    - id: 5
      name: question_4
      label: Question 4
      hint: null
      type: select_multiple
      options:
      - Computer
      - Internet Connection
      - Mobile Device
      - Other
      required: false
    - id: 6
      name: question_5
      label: What barriers do you face when accessing the internet?
      hint: null
      type: select_multiple
      options:
      - Affordability
      - Accessibility
      - Technical Issues
      - Other
      required: false
    - id: 7
      name: question_6
      label: What type of internet access do you have?
      hint: null
      type: select_one
      options:
      - Broadband
      - Mobile Data
      - Other
      required: false
    - id: 8
      name: question_7
      label: What type of device do you use to access the internet?
      hint: null
      type: select_one
      options:
      - Computer
      - Mobile Phone
      - Tablet
      - Other
      required: false
    - id: 9
      name: question_8
      label: What is the current quality of your internet connection?
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: question_10
      label: What is the current speed of your internet connection?
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: question_11
      label: Do you have any further comments or suggestions?
      hint: null
      type: note
      options: []
      required: false
