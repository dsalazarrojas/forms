inputSchema:
  type: object
  properties:
    title: Theater Group Participant Discharge Feedback Form
    pages:
    - id: 1
      name: form_start
      label: Welcome to the form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_details
      label: Participant Details
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: feedback_questions
      label: How was your experience?
      hint: null
      type: select_multiple
      options:
      - Very good
      - Good
      - Fair
      - Bad
      - Very bad
      required: true
    - id: 4
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: form_end
      label: Thank you for your feedback
      hint: null
      type: text
      options: []
      required: false
