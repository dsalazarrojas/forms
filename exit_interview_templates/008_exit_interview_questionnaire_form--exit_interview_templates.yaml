inputSchema:
  type: object
  properties:
    title: Exit Interview Questionnaire Form
    pages:
    - id: 1
      name: main_reason_for_departure
      label: What was the main reason for your departure?
      hint: null
      type: select_one
      options:
      - Career Development Opportunities
      - Compensation and Benefits
      - Company Culture
      - Job Security
      - Other (please specify)
      required: true
    - id: 2
      name: overall_job_satisfaction
      label: How would you rate your overall job satisfaction?
      hint: null
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 3
      name: career_goals_aspirations
      label: How well did your role meet your career goals and aspirations?
      hint: null
      type: select_one
      options:
      - Met or Exceeded Expectations
      - Partially Met Expectations
      - Not Met Expectations
      required: true
    - id: 4
      name: role_challenges
      label: What were the most significant challenges you faced in your role?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: supervisor_relationship
      label: How would you rate your relationship with your supervisor/manager?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: role_satisfaction_scale
      label: How would you rate your satisfaction with your role on a scale of 1-5?
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: company_culture
      label: What suggestions do you have for improving the company culture?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: overall_company_experience
      label: Would you recommend this company to a friend or colleague?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: final_comments
      label: Is there anything else you'd like to share with us?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: final_comments_2
      label: Final Comments 2
      hint: null
      type: text
      options: []
      required: false
