inputSchema:
  type: object
  properties:
    title: Network Exit Feedback Survey
    pages:
    - id: 1
      name: offboarding_reason
      label: Why did you leave the network?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: feedback
      label: What could we improve on your experience?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: communication_with_manager
      label: How would you rate communication with your manager?
      hint: null
      type: select_one
      options:
      - 1 - Very Dissatisfied
      - 2 - Somewhat Dissatisfied
      - 3 - Neutral
      - 4 - Somewhat Satisfied
      - 5 - Very Satisfied
      required: false
    - id: 4
      name: frequency_of_contact
      label: How often did you contact network team members?
      hint: null
      type: select_multiple
      options:
      - Never
      - Rarely
      - Occasionally
      - Frequently
      - Almost Daily
      required: false
    - id: 5
      name: retention_driver
      label: What factors led to your decision to leave?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: exit_date
      label: Date of your last day of work?
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time_spent
      label: How many years did you spend at the network?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: manager_name
      label: What was your manager's name?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: feedback_to_manager
      label: What feedback would you give to your manager?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: network_impact
      label: How would you rate the impact of our network on your work?
      hint: null
      type: select_one
      options:
      - 1 - Very Low
      - 2 - Low
      - 3 - Neutral
      - 4 - High
      - 5 - Very High
      required: false
    - id: 11
      name: communication_with_members
      label: How would you rate communication with network members?
      hint: null
      type: select_one
      options:
      - 1 - Very Poor
      - 2 - Poor
      - 3 - Neutral
      - 4 - Good
      - 5 - Excellent
      required: false
    - id: 12
      name: training_opportunities
      label: What training or development opportunities would you like to see the
        network offer?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: last_concept
      label: What is your last contact with the network team?
      hint: null
      type: select_multiple
      options:
      - Never
      - Less than 1 hour
      - 1-2 hours
      - 2-3 hours
      - More than 3 hours
      required: false
    - id: 14
      name: feedback_to_network
      label: What feedback would you give to the network?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: manager_suggestions
      label: What suggestions do you have for the network manager(s)?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: overall_experience
      label: Overall, how would you rate your experience in the network?
      hint: null
      type: select_one
      options:
      - Very Bad
      - Bad
      - Neutral
      - Good
      - Excellent
      required: false
    - id: 17
      name: final_comments
      label: Do you have any final comments about your experience?
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: job_title
      label: What was your job title during your last year at the network?
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: last_role
      label: What was your last role at the network?
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: last_manager
      label: What was your last manager's name?
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: last_department
      label: What was your last department name?
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: last_manager_manager
      label: What was your last manager's manager name?
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: last_position
      label: What was your last position title?
      hint: null
      type: text
      options: []
      required: false
