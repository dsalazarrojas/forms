inputSchema:
  type: object
  properties:
    title: Volunteer Service Discharge Feedback Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: overall_experience
      label: Overall Experience
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 6
      name: reason_for_leaving
      label: Reason For Leaving
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: recommendation
      label: Would you recommend this volunteer opportunity?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
