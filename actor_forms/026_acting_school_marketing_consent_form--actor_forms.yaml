inputSchema:
  type: object
  properties:
    title: Acting School Marketing Consent Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: Full name of the acting school student
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID
      hint: Unique identification number for the student
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact Email
      hint: Email address for communication
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Contact Phone
      hint: Phone number for communication
      type: text
      options: []
      required: true
    - id: 5
      name: program_enrolled
      label: Program Enrolled In
      hint: Which acting program is the student enrolled in
      type: text
      options: []
      required: true
    - id: 6
      name: consent_to_photo_video
      label: Consent to Use of Photographs and Videos
      hint: Do you consent to the use of your photographs and videos for marketing
        purposes
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 7
      name: consent_to_social_media
      label: Consent to Social Media Promotion
      hint: Do you consent to your image/work being featured on social media platforms
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 8
      name: consent_to_website_display
      label: Consent to Website Display
      hint: Do you consent to your image/work being displayed on the school website
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 9
      name: consent_to_print_materials
      label: Consent to Print Materials
      hint: Do you consent to your image/work being used in brochures, catalogs, and
        other print materials
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 10
      name: permitted_uses
      label: Permitted Uses
      hint: Select all permitted uses for your image/work
      type: select_multiple
      options:
      - Promotional materials
      - Website
      - Social media
      - Newsletters
      - Student showcases
      - Alumni publications
      - Advertising
      required: false
    - id: 11
      name: restriction_specifications
      label: Any Restrictions or Specifications
      hint: Specify any restrictions or specifications for the use of your image/work
      type: text
      options: []
      required: false
    - id: 12
      name: consent_duration
      label: Duration of Consent
      hint: How long do you consent to allow use of your image/work for marketing
      type: select_one
      options:
      - Duration of studies
      - 1 year
      - 2 years
      - 5 years
      - Perpetual
      - Until withdrawn
      required: true
    - id: 13
      name: withdrawal_rights
      label: Rights to Withdraw Consent
      hint: Do you understand you have the right to withdraw consent at any time
      type: select_one
      options:
      - Yes, I understand
      - No, I do not understand
      required: true
