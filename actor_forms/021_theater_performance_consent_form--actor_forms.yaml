inputSchema:
  type: object
  properties:
    title: Theater Performance Consent Form
    pages:
    - id: 1
      name: participant_name
      label: participant_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: guardian_name
      label: guardian_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: guardian_relationship
      label: guardian_relationship
      hint: null
      type: select_multiple
      options:
      - Parent
      - Guardian
      - Other
      required: true
    - id: 4
      name: participant_age
      label: participant_age
      hint: Enter participant age
      type: number
      options: []
      required: true
    - id: 5
      name: guardian_consent
      label: guardian_consent
      hint: Guardian Consent
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: participant_consent
      label: participant_consent
      hint: Participant Consent
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: performance_details
      label: performance_details
      hint: Provide details about the performance
      type: text
      options: []
      required: true
    - id: 8
      name: contact_information
      label: contact_information
      hint: Enter any additional contact information
      type: text
      options: []
      required: false
