inputSchema:
  type: object
  properties:
    title: Casting Inquiry Form
    pages:
      - id: 1
        name: inquiry_intro
        label: -- Casting Inquiry Submission --
        hint: Please fill out this form for general inquiries regarding our current productions
        type: note
        options: []
        required: false
      - id: 2
        name: full_name
        label: Full Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: contact_email
        label: Email Address
        hint: null
        type: email
        options: []
        required: true
      - id: 4
        name: acting_age_range
        label: Acting Age Range
        hint: The age range you can realistically portray
        type: select_one
        options:
          - "Child (Under 12)"
          - "Teenager (13-19)"
          - "Young Adult (20-30)"
          - "Adult (31-50)"
          - "Mature Adult (51-70)"
          - "Senior (71+)"
        required: true
      - id: 5
        name: interest_type
        label: Type of Production Interest
        hint: null
        type: select_multiple
        options:
          - "Feature Film"
          - "Short Film"
          - "Television Series"
          - "Commercial"
          - "Voice Over"
          - "Theater"
        required: true
      - id: 6
        name: specific_role_query
        label: Are you inquiring about a specific role
        hint: If yes, please specify below
        type: select_one
        options:
          - "Yes"
          - "No"
        required: true
      - id: 7
        name: role_name
        label: Specific Role Name
        hint: null
        type: text
        options: []
        required: false
      - id: 8
        name: portfolio_link
        label: Portfolio or Website Link
        hint: Link to your professional work
        type: text
        options: []
        required: false
      - id: 9
        name: social_media_handle
        label: Instagram or Professional Social Handle
        hint: null
        type: text
        options: []
        required: false
      - id: 10
        name: work_availability
        label: General Availability
        hint: Describe your schedule for the next 3 months
        type: text
        options: []
        required: true
      - id: 11
        name: travel_willingness
        label: Willingness to Travel
        hint: null
        type: select_one
        options:
          - "Locally only"
          - "Nationally"
          - "Internationally"
        required: true
      - id: 12
        name: additional_comments
        label: Any additional questions or information
        hint: null
        type: text
        options: []
        required: false
      - id: 13
        name: reference_source
        label: How did you find out about our agency
        hint: null
        type: select_one
        options:
          - "Casting Site"
          - "Social Media"
          - "Referral"
          - "Industry Event"
        required: false
