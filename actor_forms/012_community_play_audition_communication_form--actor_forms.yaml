inputSchema:
  type: object
  properties:
    title: Community Play Audition Communication Form
    pages:
    - id: 1
      name: audition_intro_note
      label: -- Community Theater Audition Registration --
      hint: Break a leg! Please fill out the form below.
      type: note
      options: []
      required: false
    - id: 2
      name: actor_full_name
      label: Actor Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: actor_age_group
      label: Age Group
      hint: null
      type: select_one
      options:
      - Child - under 13
      - Teen - 13-17
      - Adult - 18-64
      - Senior - 65+
      required: true
    - id: 4
      name: actor_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: actor_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: audition_roles_list
      label: Specific Role(s) You are Auditioning For
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: accept_any_role_check
      label: Would you accept any role in the production?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 8
      name: acting_experience_summary
      label: Brief Summary of Previous Acting Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: actor_special_skills
      label: Special Skills
      hint: Select all that apply.
      type: select_multiple
      options:
      - Singing - Vocal
      - Dancing
      - Musical Instruments
      - Accents
      - Stage Combat
      - Other
      required: false
    - id: 10
      name: other_skills_specify
      label: Other Special Skills - please specify
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: audition_time_slot_selection
      label: Preferred Audition Time Slot
      hint: All times on Saturday - Oct 12th.
      type: select_one
      options:
      - 10:00 AM
      - 11:00 AM
      - 12:00 PM
      - 01:00 PM
      - 02:00 PM
      - 03:00 PM
      required: true
    - id: 12
      name: rehearsal_conflicts_list
      label: Rehearsal Conflicts
      hint: Please list any known dates you cannot attend rehearsals.
      type: text
      options: []
      required: false
    - id: 13
      name: actor_height_info
      label: Height
      hint: For costuming purposes.
      type: text
      options: []
      required: false
    - id: 14
      name: headshot_resume_check
      label: Do you have a physical headshot and resume to bring?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 15
      name: audition_requirements_note
      label: -- Audition Requirements --
      hint: Please prepare a 1-minute contemporary monologue. Singers - prepare 16
        bars of a showtune.
      type: note
      options: []
      required: false
    - id: 16
      name: registration_date
      label: Today - s Date
      hint: null
      type: date
      options: []
      required: true
