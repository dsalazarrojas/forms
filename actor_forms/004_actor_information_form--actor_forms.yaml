inputSchema:
  type: object
  properties:
    title: Actor Information Form
    pages:
    - id: 1
      name: --personal_information
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: Full legal or stage name
      type: text
      options: []
      required: true
    - id: 3
      name: birth_date
      label: Birth date
      hint: Day month and year
      type: date
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact email
      hint: For casting and notifications
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone number
      hint: Mobile preferred
      type: text
      options: []
      required: false
    - id: 6
      name: union_status
      label: Union status
      hint: Select applicable status
      type: select_one
      options:
      - Not union
      - SAG AFTRA
      - Equity
      - Other
      required: true
    - id: 7
      name: height_cm
      label: Height cm
      hint: Use centimeters
      type: number
      options: []
      required: false
    - id: 8
      name: weight_kg
      label: Weight kg
      hint: Use kilograms
      type: number
      options: []
      required: false
    - id: 9
      name: skills_and_specialties
      label: Skills and specialties
      hint: Dance voice accents stage combat etc
      type: text
      options: []
      required: false
    - id: 10
      name: agent_contact
      label: Agent contact details
      hint: Agency name and phone or email
      type: text
      options: []
      required: false
