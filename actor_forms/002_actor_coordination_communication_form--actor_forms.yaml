inputSchema:
  type: object
  properties:
    title: Actor Coordination Communication Form
    pages:
    - id: 1
      name: --project_details
      label: -- Project Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: production_name
      label: Production name
      hint: Name of project or production
      type: text
      options: []
      required: true
    - id: 3
      name: role_name
      label: Role name
      hint: Character or role assigned
      type: text
      options: []
      required: true
    - id: 4
      name: actor_name
      label: Actor name
      hint: Full professional name
      type: text
      options: []
      required: true
    - id: 5
      name: availability_windows
      label: Availability windows
      hint: List your available days and times
      type: text
      options: []
      required: true
    - id: 6
      name: communication_preference
      label: Communication preference
      hint: How do you prefer to be contacted
      type: select_one
      options: [Email, Phone, Text message]
      required: true
    - id: 7
      name: emergency_contact
      label: Emergency contact name and phone
      hint: Provide name and phone for production records
      type: text
      options: []
      required: false
    - id: 8
      name: wardrobe_requirements
      label: Wardrobe requirements
      hint: Note sizes or costume needs
      type: text
      options: []
      required: false
    - id: 9
      name: travel_needs
      label: Travel and accommodation needs
      hint: Specify if travel or lodging is required
      type: select_one
      options: [None, Local commute, Overnight stay required]
      required: false
    - id: 10
      name: notes_for_production
      label: Notes for production
      hint: Anything production should be aware of
      type: text
      options: []
      required: false
