inputSchema:
  type: object
  properties:
    title: Actor Status Survey
    pages:
    - id: 1
      name: --basic_information
      label: -- Basic Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: Full name for records
      type: text
      options: []
      required: true
    - id: 3
