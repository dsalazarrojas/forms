      name: recent_roles
      label: Recent roles and credits
      hint: Brief summary of past year work
      type: text
      options: []
      required: false
    - id: 6
      name: training_and_education
      label: Training and education
      hint: Workshops degrees or certifications
      type: text
      options: []
      required: false
    - id: 7
      name: representation_status
      label: Representation status
      hint: Agent or manager contact info
      type: text
      options: []
      required: false
    - id: 8
      name: interest_in_opportunities
      label: Interest in audition calls and projects
      hint: Select all that apply
      type: select_multiple
      options: [Commercials, Film, Television, Theater, Voiceover]
      required: false
    - id: 9
      name: training_needs
