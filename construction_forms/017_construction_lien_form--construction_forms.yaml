inputSchema:
  type: object
  properties:
    title: Construction Lien Form
    pages:
    - id: 1
      name: lien_date
      label: Lien Filing Date
      hint: Date of lien filing
      type: date
      options: []
      required: true
    - id: 2
      name: claimant_name
      label: Claimant Name
      hint: Name of party filing lien
      type: text
      options: []
      required: true
    - id: 3
      name: claimant_company
      label: Claimant Company
      hint: Company name if applicable
      type: text
      options: []
      required: false
    - id: 4
      name: claimant_address
      label: Claimant Address
      hint: Full mailing address
      type: text
      options: []
      required: true
    - id: 5
      name: claimant_phone
      label: Claimant Phone
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 6
      name: claimant_email
      label: Claimant Email
      hint: Email address
      type: email
      options: []
      required: true
    - id: 7
      name: claimant_role
      label: Claimant Role
      hint: Your role on the project
      type: select_one
      options:
      - General Contractor
      - Subcontractor
      - Material Supplier
      - Equipment Rental Company
      - Laborer
      - Professional (Architect/Engineer)
      - Other
      required: true
    - id: 8
      name: property_owner
      label: Property Owner Name
      hint: Legal owner of the property
      type: text
      options: []
      required: true
    - id: 9
      name: property_address
      label: Property Address
      hint: Address of property being liened
      type: text
      options: []
      required: true
    - id: 10
      name: property_legal_description
      label: Legal Description of Property
      hint: From deed or title document
      type: text
      options: []
      required: true
    - id: 11
      name: parcel_number
      label: Parcel or Tax ID Number
      hint: County assessor parcel number
      type: text
      options: []
      required: true
    - id: 12
      name: contracting_party
      label: Party You Contracted With
      hint: Name of entity you had contract with
      type: text
      options: []
      required: true
    - id: 13
      name: contract_date
      label: Contract Date
      hint: Date of original agreement
      type: date
      options: []
      required: false
    - id: 14
      name: work_start_date
      label: Work Start Date
      hint: When did work begin
      type: date
      options: []
      required: true
    - id: 15
      name: work_end_date
      label: Work End Date
      hint: When was work completed
      type: date
      options: []
      required: false
    - id: 16
      name: work_description
      label: Description of Work or Materials
      hint: Detailed description of labor or materials provided
      type: text
      options: []
      required: true
    - id: 17
      name: contract_amount
      label: Original Contract Amount
      hint: Total agreed contract price
      type: number
      options: []
      required: false
    - id: 18
      name: amount_paid
      label: Amount Already Paid
      hint: Total payments received
      type: number
      options: []
      required: true
    - id: 19
      name: lien_amount
      label: Lien Amount Claimed
      hint: Total amount being liened
      type: number
      options: []
      required: true
    - id: 20
      name: amount_breakdown
      label: Amount Breakdown
      hint: Itemize labor, materials, other costs
      type: text
      options: []
      required: true
    - id: 21
      name: interest_claimed
      label: Interest Claimed
      hint: Is interest included in lien
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 22
      name: previous_notices
      label: Previous Notices Sent
      hint: List any preliminary notices filed
      type: text
      options: []
      required: false
    - id: 23
      name: supporting_documents
      label: Supporting Documents
      hint: List attached documentation
      type: text
      options: []
      required: false
    - id: 24
      name: verification_statement
      label: Verification Statement
      hint: Statement that information is true
      type: select_one
      options:
      - I Verify This Information Is True and Correct
      - Other
      required: true
    - id: 25
      name: claimant_signature
      label: Claimant Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 26
      name: signature_date
      label: Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
