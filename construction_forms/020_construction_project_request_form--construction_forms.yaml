inputSchema:
  type: object
  properties:
    title: Construction Project Request Form
    pages:
    - id: 1
      name: request_date
      label: Request Date
      hint: Date of this request
      type: date
      options: []
      required: true
    - id: 2
      name: request_type
      label: Request Type
      hint: Type of construction request
      type: select_one
      options:
      - New Construction
      - Renovation
      - Remodeling
      - Addition
      - Repair
      - Maintenance
      - Demolition
      - Site Work
      - Other
      required: true
    - id: 3
      name: requester_name
      label: Requester Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 4
      name: requester_company
      label: Company Name
      hint: Your company or organization
      type: text
      options: []
      required: false
    - id: 5
      name: requester_email
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 6
      name: requester_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 7
      name: property_owner
      label: Property Owner Name
      hint: Legal owner of property
      type: text
      options: []
      required: true
    - id: 8
      name: property_address
      label: Property Address
      hint: Where work will be performed
      type: text
      options: []
      required: true
    - id: 9
      name: property_type
      label: Property Type
      hint: Type of property
      type: select_one
      options:
      - Residential Single Family
      - Residential Multi-Family
      - Commercial
      - Industrial
      - Institutional
      - Government
      - Other
      required: true
    - id: 10
      name: project_description
      label: Project Description
      hint: Detailed description of requested work
      type: text
      options: []
      required: true
    - id: 11
      name: project_scope
      label: Scope of Work
      hint: Specific tasks and deliverables
      type: text
      options: []
      required: true
    - id: 12
      name: desired_start_date
      label: Desired Start Date
      hint: When would you like work to begin
      type: date
      options: []
      required: false
    - id: 13
      name: desired_completion_date
      label: Desired Completion Date
      hint: When should project be finished
      type: date
      options: []
      required: false
    - id: 14
      name: budget_range
      label: Budget Range
      hint: Estimated budget for project
      type: select_one
      options:
      - Under $10,000
      - $10,000 to $25,000
      - $25,000 to $50,000
      - $50,000 to $100,000
      - $100,000 to $500,000
      - Over $500,000
      - To Be Determined
      required: true
    - id: 15
      name: financing_secured
      label: Financing Status
      hint: Is funding secured for this project
      type: select_one
      options:
      - Yes, Fully Secured
      - Partially Secured
      - Not Yet Secured
      - Not Applicable
      required: false
    - id: 16
      name: plans_available
      label: Are Plans Available
      hint: Do you have architectural plans or drawings
      type: select_one
      options:
      - Yes, Complete Set
      - Yes, Preliminary
      - In Progress
      - No, Need Assistance
      required: true
    - id: 17
      name: permits_required
      label: Permit Requirements
      hint: Do you know what permits are needed
      type: select_one
      options:
      - Yes, Will Handle Myself
      - Yes, Want Contractor to Handle
      - No, Need Guidance
      - Not Sure
      required: false
    - id: 18
      name: site_access
      label: Site Access
      hint: Describe any access limitations
      type: text
      options: []
      required: false
    - id: 19
      name: utility_status
      label: Utility Status
      hint: Current utility situation
      type: select_one
      options:
      - All Utilities Available
      - Some Utilities Available
      - No Utilities On Site
      - Not Sure
      required: false
    - id: 20
      name: special_requirements
      label: Special Requirements
      hint: Any unique needs or constraints
      type: text
      options: []
      required: false
    - id: 21
      name: timeline_flexibility
      label: Timeline Flexibility
      hint: How flexible is your schedule
      type: select_one
      options:
      - Very Flexible
      - Somewhat Flexible
      - Fixed Deadline
      - Urgent
      required: false
    - id: 22
      name: decision_authority
      label: Decision Authority
      hint: Are you the final decision maker
      type: select_one
      options:
      - Yes, I Decide
      - I Recommend, Others Decide
      - Part of Committee
      - Other
      required: false
    - id: 23
      name: other_bids
      label: Other Bids Being Sought
      hint: Are you getting other estimates
      type: select_one
      options:
      - Yes, Multiple
      - Yes, A Few
      - 'False'
      - Not Sure
      required: false
    - id: 24
      name: how_soon_decide
      label: When Will You Decide
      hint: Timeline for selecting contractor
      type: select_one
      options:
      - Within 1 Week
      - Within 2 Weeks
      - Within 1 Month
      - 1 to 3 Months
      - Just Gathering Information
      required: false
    - id: 25
      name: additional_comments
      label: Additional Comments
      hint: Any other relevant information
      type: text
      options: []
      required: false
