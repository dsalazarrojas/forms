inputSchema:
  type: object
  properties:
    title: Construction Phase Planning Form
    pages:
      - id: 1
        name: section_project_overview
        label: -- Project Overview --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: project_name
        label: Project name
        hint: Official project title
        type: text
        options: []
        required: true
      - id: 3
        name: phase_name
        label: Phase name
        hint: e.g., Foundation, Framing, Finishes
        type: text
        options: []
        required: true
      - id: 4
        name: phase_start_date
        label: Phase start date
        hint: Planned start date for this phase
        type: date
        options: []
        required: true
      - id: 5
        name: phase_end_date
        label: Phase end date
        hint: Planned completion date
        type: date
        options: []
        required: false
      - id: 6
        name: key_milestones
        label: Key milestones
        hint: List milestones and expected dates
        type: text
        options: []
        required: false
      - id: 7
        name: required_permits
        label: Required permits
        hint: Permits needed before work begins
        type: select_multiple
        options:
          - Building permit
          - Electrical permit
          - Plumbing permit
          - Environmental approvals
        required: false
      - id: 8
        name: primary_contractors
        label: Primary contractors
        hint: Main contractors assigned to this phase
        type: text
        options: []
        required: false
      - id: 9
        name: special_equipment_needed
        label: Special equipment needed
        hint: List heavy equipment or specialized tools
        type: text
        options: []
        required: false
