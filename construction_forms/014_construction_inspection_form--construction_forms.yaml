inputSchema:
  type: object
  properties:
    title: Construction Inspection Form
    pages:
    - id: 1
      name: inspection_date
      label: Inspection Date
      hint: Date of inspection
      type: date
      options: []
      required: true
    - id: 2
      name: inspection_time
      label: Inspection Time
      hint: Time inspection started
      type: time
      options: []
      required: true
    - id: 3
      name: inspector_name
      label: Inspector Name
      hint: Name of person conducting inspection
      type: text
      options: []
      required: true
    - id: 4
      name: inspector_credentials
      label: Inspector Credentials
      hint: License or certification number
      type: text
      options: []
      required: true
    - id: 5
      name: project_name
      label: Project Name
      hint: Name of construction project
      type: text
      options: []
      required: true
    - id: 6
      name: project_address
      label: Project Address
      hint: Full site address
      type: text
      options: []
      required: true
    - id: 7
      name: permit_number
      label: Permit Number
      hint: Building permit reference
      type: text
      options: []
      required: true
    - id: 8
      name: inspection_type
      label: Inspection Type
      hint: Type of inspection being conducted
      type: select_one
      options:
      - Foundation
      - Framing
      - Rough-In Electrical
      - Rough-In Plumbing
      - Rough-In HVAC
      - Insulation
      - Drywall
      - Final Inspection
      - Special Inspection
      required: true
    - id: 9
      name: construction_stage
      label: Construction Stage
      hint: Current stage of construction
      type: select_one
      options:
      - Site Preparation
      - Foundation
      - Framing
      - Exterior
      - Interior Rough-In
      - Interior Finishing
      - Final Completion
      required: true
    - id: 10
      name: work_quality_rating
      label: Work Quality Rating
      hint: Overall quality assessment
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: plans_followed
      label: Plans and Specifications Followed
      hint: Is work according to approved plans
      type: select_one
      options:
      - Yes, Completely
      - Yes, With Minor Deviations
      - No, Major Deviations
      - Unable to Determine
      required: true
    - id: 12
      name: code_compliance
      label: Code Compliance
      hint: Does work meet building codes
      type: select_one
      options:
      - Fully Compliant
      - Compliant with Minor Issues
      - Non-Compliant
      - Not Assessed
      required: true
    - id: 13
      name: structural_check
      label: Structural Elements Check
      hint: Assessment of structural components
      type: select_one
      options:
      - Approved
      - Approved with Notes
      - Needs Correction
      - Not Applicable
      required: true
    - id: 14
      name: safety_compliance
      label: Safety Compliance
      hint: Are safety standards being followed
      type: select_one
      options:
      - Fully Compliant
      - Minor Issues Found
      - Major Issues Found
      - Not Assessed
      required: true
    - id: 15
      name: materials_quality
      label: Materials Quality
      hint: Quality of materials used
      type: select_one
      options:
      - As Specified
      - Acceptable Substitutions
      - Unapproved Substitutions
      - Poor Quality
      required: true
    - id: 16
      name: workmanship_quality
      label: Workmanship Quality
      hint: Quality of installation and construction
      type: select_one
      options:
      - Excellent
      - Good
      - Acceptable
      - Needs Improvement
      - Poor
      required: true
    - id: 17
      name: deficiencies_found
      label: Number of Deficiencies
      hint: Count of issues identified
      type: number
      options: []
      required: true
    - id: 18
      name: deficiency_details
      label: Deficiency Details
      hint: Describe each deficiency found
      type: text
      options: []
      required: false
    - id: 19
      name: corrective_actions
      label: Corrective Actions Required
      hint: What must be done to correct issues
      type: text
      options: []
      required: false
    - id: 20
      name: reinspection_required
      label: Reinspection Required
      hint: Is follow-up inspection needed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 21
      name: reinspection_date
      label: Reinspection Date
      hint: Scheduled date if applicable
      type: date
      options: []
      required: false
    - id: 22
      name: inspection_result
      label: Inspection Result
      hint: Final determination
      type: select_one
      options:
      - Approved
      - Approved with Conditions
      - Conditional Approval
      - Failed
      - Incomplete
      required: true
    - id: 23
      name: photos_taken
      label: Photos Taken
      hint: Were photos documented
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 24
      name: inspector_comments
      label: Inspector Comments
      hint: Additional notes or observations
      type: text
      options: []
      required: false
    - id: 25
      name: inspector_signature
      label: Inspector Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
