      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: pharmacist_availability
      label: Pharmacist Availability
      hint: How available was the pharmacist during your visit?
      type: number
      options: []
      required: false
    - id: 7
      name: pharmacist_knowledge
      label: Pharmacist Knowledge
      hint: null
      type: number
      options: []
      required: false
