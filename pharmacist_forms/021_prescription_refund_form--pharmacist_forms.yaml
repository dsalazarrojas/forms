inputSchema:
  type: object
  properties:
    title: Prescription Refund Form
    pages:
    - id: 1
      name: prescription_error
      label: Prescription Error
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: unsatisfactory_outcome
      label: Unsatisfactory Outcome
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: other_concerns
      label: Other Concerns
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: refund_reason
      label: Reason for Refund
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: patient_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: patient_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: patient_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: patient_message
      label: Message
      hint: null
      type: text
      options: []
      required: false
