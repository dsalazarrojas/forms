inputSchema:
  type: object
  properties:
    title: Theater Accessibility Donation Form
    pages:
    - id: 1
      name: donation_amount
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: donor_email
      label: Donor Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: donor_phone
      label: Donor Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: donor_name
      label: Donor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: donation_note
      label: Donation Note
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: payment_gateway
      label: Payment Gateway
      hint: null
      type: select_one
      options:
      - Stripe
      - PayPal
      - Authorize.net
      required: false
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Credit card
      - Bank transfer
      - Check
      required: false
    - id: 8
      name: is_recurring
      label: Is Recurring
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
