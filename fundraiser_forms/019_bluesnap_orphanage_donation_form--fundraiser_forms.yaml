inputSchema:
  type: object
  properties:
    title: BlueSnap Orphanage Donation Form
    pages:
    - id: 1
      name: donor_header
      label: -- Donor Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: donor_name
      label: Donor name
      hint: Full name for records
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: For tax receipt
      type: email
      options: []
      required: true
    - id: 4
      name: donation_amount
      label: Donation amount
      hint: Enter numeric amount
      type: number
      options: []
      required: true
    - id: 5
      name: preferred_program
      label: Preferred program to support
      hint: Choose where funds should be applied
      type: select_one
      options:
      - Education
      - Healthcare
      - Food security
      - General fund
      required: false
    - id: 6
      name: recurring
      label: Make this donation recurring
      hint: Monthly recurring donation option
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 7
      name: tribute_name
      label: Tribute name
      hint: If donating in memory or honor of someone
      type: text
      options: []
      required: false
    - id: 8
      name: acknowledgement_method
      label: Acknowledgement method
      hint: How should we acknowledge your gift
      type: select_one
      options:
      - Email
      - Postal mail
      - No acknowledgement
      required: true
    - id: 9
      name: message
      label: Message
      hint: Message for recipients or staff
      type: text
      options: []
      required: false
