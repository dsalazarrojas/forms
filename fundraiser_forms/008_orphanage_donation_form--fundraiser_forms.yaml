inputSchema:
  type: object
  properties:
    title: Orphanage Donation Form
    pages:
    - id: 1
      name: donor_name
      label: Donor Name
      hint: Please enter your name
      type: text
      options: []
      required: true
    - id: 2
      name: donor_email
      label: Donor Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 3
      name: donor_amount
      label: Donation Amount
      hint: Enter the amount you wish to donate
      type: number
      options: []
      required: true
    - id: 4
      name: donor_frequency
      label: Donation Frequency
      hint: Select your preferred frequency
      type: select_multiple
      options:
      - One-time
      - Monthly
      - Quarterly
      required: true
    - id: 5
      name: donor_method
      label: Donation Method
      hint: Select your preferred donation method
      type: select_one
      options:
      - Cash
      - Check
      required: true
    - id: 6
      name: donor_address
      label: Donor Address
      hint: Please provide your home address
      type: text
      options: []
      required: true
    - id: 7
      name: payment_method
      label: Payment Method
      hint: Select your preferred payment method
      type: select_one
      options:
      - Cash
      - Check
      required: true
    - id: 8
      name: donor_message
      label: Donor Message
      hint: Share a message with us
      type: text
      options: []
      required: false
    - id: 9
      name: donor_other_frequency
      label: Other Frequency
      hint: Select your preferred frequency
      type: select_multiple
      options:
      - Cash
      - Check
      required: false
    - id: 10
      name: donor_other_method
      label: Other Method
      hint: Select your preferred donation method
      type: select_one
      options:
      - Cash
      - Check
      required: false
    - id: 11
      name: orphanage_name
      label: Orphanage Name
      hint: Enter the name of the orphanage
      type: text
      options: []
      required: false
    - id: 12
      name: orphanage_address
      label: Orphanage Address
      hint: Please provide the address of the orphanage
      type: text
      options: []
      required: false
    - id: 13
      name: orphanage_email
      label: Orphanage Email
      hint: Enter the email address of the orphanage
      type: email
      options: []
      required: false
    - id: 14
      name: orphanage_phone
      label: Orphanage Phone
      hint: Enter the phone number of the orphanage
      type: text
      options: []
      required: false
    - id: 15
      name: orphanage_notes
      label: Orphanage Notes
      hint: Add any notes about the orphanage
      type: note
      options: []
      required: false
    - id: 16
      name: other_notes
      label: Other Notes
      hint: Add any additional notes
      type: text
      options: []
      required: false
    - id: 17
      name: other_amount
      label: Other Amount
      hint: Enter the amount of your donation
      type: number
      options: []
      required: false
    - id: 18
      name: other_frequency
      label: Other Frequency (2)
      hint: Select your preferred frequency
      type: select_multiple
      options:
      - Cash
      - Check
      required: false
