inputSchema:
  type: object
  properties:
    title: Donor Information Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Please enter a valid email address
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Please enter a valid phone number
      type: text
      options: []
      required: false
    - id: 5
      name: donor_type
      label: Donor Type
      hint: null
      type: select_multiple
      options:
      - Individual
      - Organization
      - Foundation
      required: true
    - id: 6
      name: donation_amount
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: donation_frequency
      label: Donation Frequency
      hint: null
      type: select_one
      options:
      - One Time
      - Regular
      - Ongoing
      required: true
    - id: 8
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: zip_code
      label: Zip Code
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
