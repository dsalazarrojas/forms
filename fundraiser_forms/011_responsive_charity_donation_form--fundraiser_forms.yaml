inputSchema:
  type: object
  properties:
    title: Responsive Charity Donation Form
    pages:
    - id: 1
      name: donor_name
      label: Donor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: amount
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: currency
      label: Currency
      hint: null
      type: select_one
      options:
      - USD
      - EUR
      - GBP
      required: false
    - id: 7
      name: frequency
      label: How often would you like to give?
      hint: null
      type: select_multiple
      options:
      - One time
      - Monthly
      - Quarterly
      - Semi-Annually
      - Annually
      required: false
    - id: 8
      name: notes
      label: Notes (optional)
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
