inputSchema:
  type: object
  properties:
    title: Fundraising Event Filming Consent Form
    pages:
    - id: 1
      name: participant_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: participant_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: filming_informal
      label: Filming
      hint: null
      type: select_one
      options:
      - With permission
      - Without permission
      required: true
    - id: 4
      name: filming_formal
      label: Filming
      hint: null
      type: select_multiple
      options:
      - Photos
      - Video
      required: false
    - id: 5
      name: additional_comments
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
