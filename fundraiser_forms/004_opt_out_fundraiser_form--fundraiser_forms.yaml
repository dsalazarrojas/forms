inputSchema:
  type: object
  properties:
    title: Opt Out Fundraiser Form
    pages:
    - id: 1
      name: fundraiser_name
      label: Fundraiser Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: donor
      label: Donor
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: donation_amount
      label: Donation Amount
      hint: null
      type: select_one
      options:
      - $100
      - $250
      - $500
      - $1000
      - $5000
      required: true
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: donor_type
      label: Type of Donor
      hint: null
      type: select_multiple
      options:
      - Individual
      - Parent
      - School
      - Organization
      required: true
    - id: 6
      name: fundraiser_type
      label: Type of Fundraiser
      hint: null
      type: select_multiple
      options:
      - Fundraiser 1
      - Fundraiser 2
      - Fundraiser 3
      - Fundraiser 4
      required: true
    - id: 7
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: donor_email
      label: Donor Email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: donor_phone
      label: Donor Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: donor_address
      label: Donor Address
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: donor_city
      label: Donor City
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: donor_state
      label: Donor State
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: donor_zip
      label: Donor Zip
      hint: null
      type: text
      options: []
      required: false
