inputSchema:
  type: object
  properties:
    title: Hospital Cancer Research Donation Form
    pages:
    - id: 1
      name: donor_details
      label: Donor Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: payment_details
      label: Payment Details
      hint: null
      type: select_one
      options:
      - Credit Card
      - Bank Transfer
      required: false
    - id: 3
      name: donation_details
      label: Donation Details
      hint: null
      type: select_multiple
      options:
      - Public
      - Private
      - Both
      required: false
    - id: 4
      name: team
      label: Team
      hint: null
      type: select_multiple
      options:
      - Team1
      - Team2
      - Team3
      required: false
    - id: 5
      name: submission_details
      label: Submission Details
      hint: null
      type: text
      options: []
      required: false
