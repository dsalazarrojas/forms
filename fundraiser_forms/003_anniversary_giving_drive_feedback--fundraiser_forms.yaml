inputSchema:
  type: object
  properties:
    title: Anniversary Giving Drive Feedback
    pages:
    - id: 1
      name: respondent_name
      label: Full Name
      hint: Optional - you may remain anonymous
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email Address
      hint: For follow-up if needed
      type: email
      options: []
      required: false
    - id: 3
      name: participation_type
      label: How Did You Participate?
      hint: Select all that apply
      type: select_multiple
      options:
        - Made a Donation
        - Volunteered Time
        - Shared on Social Media
        - Attended Events
        - Recruited Other Donors
        - Corporate Sponsor
        - Other
      required: true
    - id: 4
      name: donation_amount_range
      label: Donation Amount Range
      hint: Approximate range of your contribution
      type: select_one
      options:
        - Did Not Donate
        - Under $50
        - $50 - $100
        - $101 - $500
        - $501 - $1000
        - Over $1000
      required: false
    - id: 5
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied were you with the giving drive?
      type: select_one
      options:
        - Very Satisfied
        - Satisfied
        - Neutral
        - Dissatisfied
        - Very Dissatisfied
      required: true
    - id: 6
      name: communication_rating
      label: Communication Rating
      hint: Rate the clarity and frequency of communications
      type: select_one
      options:
        - Excellent
        - Good
        - Average
        - Below Average
        - Poor
      required: true
    - id: 7
      name: ease_of_donation
      label: Ease of Donation Process
      hint: How easy was it to make your donation?
      type: select_one
      options:
        - Very Easy
        - Easy
        - Neutral
        - Difficult
        - Very Difficult
        - Did Not Donate
      required: true
    - id: 8
      name: event_organization
      label: Event Organization Rating
      hint: Rate the organization of events and activities
      type: select_one
      options:
        - Excellent
        - Good
        - Average
        - Below Average
        - Poor
        - Did Not Attend Events
      required: false
    - id: 9
      name: motivation_factor
      label: Primary Motivation
      hint: What motivated you to participate?
      type: select_one
      options:
        - Personal Connection to Cause
        - Anniversary Significance
        - Community Impact
        - Tax Benefits
        - Social Pressure
        - Matching Gifts
        - Other
      required: true
    - id: 10
      name: awareness_source
      label: How Did You Hear About Us?
      hint: Select all that apply
      type: select_multiple
      options:
        - Email Newsletter
        - Social Media
        - Word of Mouth
        - Website
        - Print Materials
        - News Article
        - Previous Donor
        - Other
      required: true
    - id: 11
      name: impact_understanding
      label: Understanding of Impact
      hint: How well do you understand how your contribution helps?
      type: select_one
      options:
        - Very Well
        - Well
        - Somewhat
        - Not Very Well
        - Not At All
      required: true
    - id: 12
      name: transparency_rating
      label: Transparency Rating
      hint: Rate our transparency about fund usage
      type: select_one
      options:
        - Excellent
        - Good
        - Average
        - Below Average
        - Poor
      required: true
    - id: 13
      name: likelihood_to_donate_again
      label: Likelihood to Donate Again
      hint: Will you participate in future giving drives?
      type: select_one
      options:
        - Very Likely
        - Likely
        - Neutral
        - Unlikely
        - Very Unlikely
      required: true
    - id: 14
      name: likelihood_to_recommend
      label: Likelihood to Recommend
      hint: Would you recommend this giving drive to others?
      type: select_one
      options:
        - Very Likely
        - Likely
        - Neutral
        - Unlikely
        - Very Unlikely
      required: true
    - id: 15
      name: improvement_suggestions
      label: Suggestions for Improvement
      hint: What could we do better next time?
      type: text
      options: []
      required: false
    - id: 16
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback you would like to share
      type: text
      options: []
      required: false
    - id: 17
      name: volunteer_interest
      label: Volunteer Interest
      hint: Would you like to volunteer for future events?
      type: select_one
      options:
        - Yes, Definitely
        - Maybe
        - No, Thank You
      required: false
    - id: 18
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we contact you about future drives?
      type: select_one
      options:
        - Email
        - Phone
        - Text Message
        - Mail
        - Do Not Contact
      required: false
