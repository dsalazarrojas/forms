inputSchema:
  type: object
  properties:
    title: Blood Draw Appointment Scheduling
    pages:
    - id: 1
      name: appointment_intro
      label: -- Schedule Blood Draw Appointment --
      hint: Book your lab appointment conveniently online
      type: note
      options: []
      required: false
    - id: 2
      name: patient_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: patient_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: patient_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: patient_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: patient_id
      label: Patient ID Number
      hint: If known
      type: text
      options: []
      required: false
    - id: 8
      name: insurance_provider
      label: Insurance Provider
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: lab_location
      label: Preferred Lab Location
      hint: null
      type: select_one
      options:
      - Downtown Lab
      - Riverside Testing Center
      - Community Health Lab
      - Mobile Lab Unit
      - Home Collection
      required: true
    - id: 10
      name: preferred_date
      label: Preferred Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: preferred_time
      label: Preferred Time
      hint: null
      type: select_one
      options:
      - 8:00 AM - 9:00 AM
      - 9:00 AM - 10:00 AM
      - 10:00 AM - 11:00 AM
      - 11:00 AM - 12:00 PM
      - 2:00 PM - 3:00 PM
      - 3:00 PM - 4:00 PM
      - 4:00 PM - 5:00 PM
      required: true
    - id: 12
      name: test_type
      label: Type of Blood Test
      hint: null
      type: select_one
      options:
      - Routine checkup
      - Fasting glucose
      - Lipid panel
      - Comprehensive metabolic panel
      - CBC
      - Thyroid panel
      - Other
      required: true
    - id: 13
      name: fasting_required
      label: Is fasting required for this test?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: physician_referral
      label: Physician Referral Name
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: reminder_preference
      label: Reminder Preference
      hint: null
      type: select_one
      options:
      - Email
      - SMS
      - Phone call
      - No reminder
      required: true
    - id: 16
      name: special_instructions
      label: Special Instructions or Accommodations
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: scheduling_date
      label: Appointment Booking Date
      hint: null
      type: date
      options: []
      required: true
