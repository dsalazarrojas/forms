inputSchema:
  type: object
  properties:
    title: Flame Photometry Equipment Survey
    pages:
    - id: 1
      name: equipment_name
      label: Equipment Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: comment
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: issue_list
      label: List any issues
      hint: null
      type: select_multiple
      options:
      - Equipment damage
      - Calibration issue
      - Instruction manual not clear
      - Other
      - None
      required: false
    - id: 10
      name: issue_description
      label: Issue description
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: priority_improvement
      label: Priority of Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: suggestion
      label: Suggestion
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - Submit
      - Save and continue editing
      - Cancel
      required: false
