inputSchema:
  type: object
  properties:
    title: Fire Extinguisher Checklist
    pages:
    - id: 1
      name: fire_extinguisher_location
      label: Fire Extinguisher Location
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: fire_type
      label: Fire Type
      hint: null
      type: select_one
      options:
      - Water
      - Foam
      - Dry
      required: false
    - id: 3
      name: fire_extinguisher_condition
      label: Fire Extinguisher Condition
      hint: null
      type: select_multiple
      options:
      - Good
      - Partially Extinguished
      - Needs Recharge
      required: false
    - id: 4
      name: fire_extinguisher_tag
      label: Fire Extinguisher Tag
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: tag_number
      label: Tag Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: fire_extinguisher_model_year
      label: Fire Extinguisher Model Year
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: fire_extinguisher_model_name
      label: Fire Extinguisher Model
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: fire_extinguisher_service_life
      label: Fire Extinguisher Service Life
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: assigned_fire_extinguisher_location
      label: Assigned Fire Extinguisher Location
      hint: null
      type: select_one
      options:
      - Kitchen
      - Bathroom
      - Office
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
