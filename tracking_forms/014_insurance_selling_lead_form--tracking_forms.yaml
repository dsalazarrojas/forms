      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: policy_number
      label: Policy Number
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: customer_state
      label: Customer State
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: customer_zip
      label: Customer Zip
      hint: null
      type: text
      options: []
      required: true
