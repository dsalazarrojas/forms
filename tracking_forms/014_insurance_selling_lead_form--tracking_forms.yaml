inputSchema:
  type: object
  properties:
    title: Insurance Selling Lead Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: customer_address
      label: Customer Address
      hint: null
      type: text
      options: []
