      name: next_steps
      label: Next Steps
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: customer_response
      label: Customer Response
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: resolution_status
      label: Resolution Status
      hint: null
      type: select_one
      options:
      - Open
