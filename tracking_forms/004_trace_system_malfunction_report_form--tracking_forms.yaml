      type: select_multiple
      options:
      - 'True'
      - 'False'
      - unsure
      required: false
    - id: 7
      name: user_remediation
      label: did_user_remediate
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - unsure
      required: false
    - id: 8
      name: system_malfunction_time
      label: system_malfunction_time
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: system_malfunction_date
      label: system_malfunction_date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: system_malfunction_user
      label: system_malfunction_user
      hint: null
      type: text
      options: []
      required: false
