inputSchema:
  type: object
  properties:
    title: Trace System Malfunction Report Form
    pages:
    - id: 1
      name: system_malfunction_report_form
      label: system_malfunction_report
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: system_malfunction_details
      label: enter_details_about_problem
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: troubleshooting
      label: troubleshooting_step
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: problem_description
      label: describe_problem
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: cause
      label: cause
      hint: null
      type: select_one
      options:
      - hardware issue
      - software issue
      - user issue
      - other
      required: false
    - id: 6
      name: user_informed
      label: was_user_informed
