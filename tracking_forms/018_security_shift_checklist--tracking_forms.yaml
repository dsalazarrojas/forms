inputSchema:
  type: object
  properties:
    title: Security Shift Checklist
    pages:
    - id: 1
      name: shift_details
      label: Shift Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: security_personnel
      label: Security Personnel
      hint: List all personnel on shift, including their names and job titles
      type: select_multiple
      options:
      - John Doe, Security Officer
      - Jane Doe, Security Officer
      - Jim Smith, Security Officer
      required: false
    - id: 3
      name: shift_changeovers
      label: Shift Changeovers
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: security_incident
      label: Security Incident
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: security_shift_notes
      label: Security Shift Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: shift_status
      label: Shift Status
      hint: Open, In Progress, Completed
      type: select_one
      options:
      - Open
      - In Progress
      - Completed
      required: false
