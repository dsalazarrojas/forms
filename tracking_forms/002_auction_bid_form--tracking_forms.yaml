inputSchema:
  type: object
  properties:
    title: Auction Bid Form
    pages:
    - id: 1
      name: bidder_information
      label: -- Bidder Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: bidder_name
      label: Bidder name
      hint: Full name of the bidder
      type: text
      options: []
      required: true
    - id: 3
      name: bidder_email
      label: Bidder email
      hint: For bid confirmation and receipts
      type: email
      options: []
      required: true
    - id: 4
      name: bidder_phone
      label: Bidder phone
      hint: Optional contact phone
      type: text
      options: []
      required: false
    - id: 5
      name: item_number
      label: Item number
      hint: Auction item identifier
      type: text
      options: []
      required: true
    - id: 6
      name: item_description
      label: Item description
      hint: Brief description of the auction item
      type: text
      options: []
      required: false
    - id: 7
      name: bid_amount
      label: Bid amount
      hint: Enter whole number amount in your currency
      type: number
      options: []
      required: true
    - id: 8
      name: bid_time
      label: Time of bid
      hint: Local time of the bid submission
      type: time
      options: []
      required: true
    - id: 9
      name: payment_method
      label: Preferred payment method
      hint: Select the method used for payment if winning
      type: select_one
      options:
      - Credit card
      - Bank transfer
      - Cash on pickup
      - Other
      required: false
    - id: 10
      name: special_instructions
      label: Special delivery or handling instructions
      hint: Provide any delivery notes for the item
      type: text
      options: []
      required: false
