inputSchema:
  type: object
  properties:
    title: Firearm Dry Fire Training Log
    pages:
    - id: 1
      name: practice_date
      label: Practice Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: rounds_fired
      label: Rounds Fired
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: type_of_practice
      label: Type of Practice
      hint: null
      type: select_one
      options:
      - Fire at White Target
      - Dry Fire with No Target
      - Fire at Black Target
      - Fire at Color Target
      - Fire at Steel Target
      - Fire at Paper Target
      required: false
    - id: 4
      name: type_of_gun
      label: Type of Gun
      hint: null
      type: select_multiple
      options:
      - Rifle
      - Shotgun
      - Pistol
      - Revolver
      - Bow
      required: true
    - id: 5
      name: ammunition_type
      label: Ammunition Type
      hint: null
      type: select_multiple
      options:
      - Rifle
      - Pistol
      - Rim Fire
      - Blank
      - Airsoft
      required: false
    - id: 6
      name: conditions
      label: Conditions
      hint: null
      type: text
      options: []
      required: false
