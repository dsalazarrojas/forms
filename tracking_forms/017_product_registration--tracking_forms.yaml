inputSchema:
  type: object
  properties:
    title: Product Registration
    pages:
    - id: 1
      name: customer_info
      label: Customer Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: product_details
      label: Product Details
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_number
      label: Contact Number
      hint: null
      type: select_one
      options:
      - '{1: ''Mobile''}'
      - '{2: ''Landline''}'
      - '{3: ''Fax''}'
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: purchase_date
      label: Purchase Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: product_serial_number
      label: Product Serial Number
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
