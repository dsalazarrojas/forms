inputSchema:
  type: object
  properties:
    title: Blood Pressure Monitoring Form
    pages:
    - id: 1
      name: monitoring_intro
      label: -- Blood Pressure Monitoring Form --
      hint: Track blood pressure for health management
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: patient_id
      label: Patient ID/Medical Record Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: physician_name
      label: Physician Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: monitoring_start_date
      label: Monitoring Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: monitoring_end_date
      label: Monitoring End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: reading_date
      label: Reading Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: reading_time
      label: Reading Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: systolic_pressure
      label: Systolic Pressure (mmHg)
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: diastolic_pressure
      label: Diastolic Pressure (mmHg)
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: heart_rate
      label: Heart Rate (bpm)
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: blood_pressure_category
      label: BP Category
      hint: null
      type: select_one
      options:
      - Normal
      - Elevated
      - Stage 1 Hypertension
      - Stage 2 Hypertension
      - Hypertensive Crisis
      required: false
    - id: 13
      name: measurement_device
      label: Measurement Device Used
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: measurement_location
      label: Measurement Location
      hint: null
      type: select_one
      options:
      - Home
      - Clinic
      - Hospital
      - Pharmacy
      - Mobile unit
      required: true
    - id: 15
      name: body_position
      label: Body Position
      hint: null
      type: select_one
      options:
      - Seated
      - Lying down
      - Standing
      required: true
    - id: 16
      name: arm_used
      label: Arm Used
      hint: null
      type: select_one
      options:
      - Left
      - Right
      required: true
    - id: 17
      name: medications_current
      label: Current Medications
      hint: List blood pressure medications
      type: text
      options: []
      required: false
    - id: 18
      name: patient_compliance
      label: Patient Compliance with Treatment
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 19
      name: clinical_notes
      label: Clinical Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: form_submission_date
      label: Form Submission Date
      hint: null
      type: date
      options: []
      required: true
