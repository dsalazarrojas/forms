inputSchema:
  type: object
  properties:
    title: Monthly Activity Tracker
    pages:
    - id: 1
      name: month
      label: Month
      hint: null
      type: select_one
      options:
      - January
      - February
      - March
      - April
      - May
      - June
      - July
      - August
      - September
      - October
      - November
      - December
      required: false
    - id: 2
      name: activity_type
      label: Activity Type
      hint: null
      type: select_multiple
      options:
      - Task
      - Meeting
      - Event
      - Phone call
      - Note
      - Other
      - Call
      - Project
      required: false
    - id: 3
      name: goal
      label: Goal
      hint: Describe your main goal for the month
      type: text
      options: []
      required: false
    - id: 4
      name: reflection
      label: Reflection
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: review
      label: Review
      hint: Review of progress towards your goal
      type: text
      options: []
      required: false
    - id: 6
      name: outcome
      label: Outcome
      hint: null
      type: select_one
      options:
      - On track
      - At risk
      - Behind
      - Complete
      required: false
    - id: 7
      name: review_comments
      label: Review Comments
      hint: Additional comments for review
      type: text
      options: []
      required: false
    - id: 8
      name: outcome_comments
      label: Outcome Comments
      hint: Additional comments for outcome
      type: text
      options: []
      required: false
    - id: 9
      name: team_reviewed
      label: Team Reviewed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: reviewed_by
      label: Reviewed by
      hint: Enter name of team member who reviewed you
      type: text
      options: []
      required: false
