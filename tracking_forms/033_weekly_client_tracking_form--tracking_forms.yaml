inputSchema:
  type: object
  properties:
    title: weekly_client_tracking_form
    pages:
    - id: 1
      name: week_report
      label: Weekly Report
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: progress_update
      label: Progress Update
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: goals_target
      label: Goals
      hint: What are your current goals for the week?
      type: select_one
      options:
      - Goals 1
      - Goals 2
      - Goals 3
      required: false
    - id: 4
      name: goals_progress
      label: Goal Progress
      hint: How am I doing on my goals?
      type: select_multiple
      options:
      - Goal 1
      - Goal 2
      - Goal 3
      required: false
    - id: 5
      name: next_report
      label: Next Report
      hint: When is your next report due?
      type: date
      options: []
      required: false
    - id: 6
      name: next_contact
      label: Next Contact
      hint: When is your next contact?
      type: time
      options: []
      required: false
    - id: 7
      name: current_status
      label: Current Status
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: issues_update
      label: Issues Update
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: action_plan
      label: Action Plan
      hint: What actions do we need to take this week?
      type: text
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: next_followup
      label: Next Follow-up
      hint: When is your next follow-up?
      type: time
      options: []
      required: false
