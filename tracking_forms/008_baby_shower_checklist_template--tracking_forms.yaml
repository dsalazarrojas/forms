inputSchema:
  type: object
  properties:
    title: Baby Shower Checklist Template
    pages:
    - id: 1
      name: checklist_header
      label: -- Baby Shower Planning Tracker --
      hint: Keep track of every detail for the big event
      type: note
      options: []
      required: false
    - id: 2
      name: task_name
      label: Planning Task
      hint: What needs to be done?
      type: text
      options: []
      required: true
    - id: 3
      name: task_category
      label: Category
      hint: null
      type: select_one
      options:
      - Venue and Date
      - Invitations and RSVP
      - Food and Drink
      - Decorations
      - Games and Prizes
      - Registry and Gifts
      - Thank You Notes
      required: true
    - id: 4
      name: assigned_organizer
      label: Person Responsible
      hint: Who is handling this task?
      type: text
      options: []
      required: false
    - id: 5
      name: task_due_date
      label: Target Completion Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: estimated_cost
      label: Estimated Budget
      hint: Currency amount
      type: number
      options: []
      required: false
    - id: 7
      name: task_status
      label: Current Status
      hint: null
      type: select_one
      options:
      - Not Started
      - In Progress
      - On Hold
      - Completed
      required: true
    - id: 8
      name: priority_level
      label: Priority
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 9
      name: task_notes
      label: Additional Details or Vendor Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: items_to_purchase
      label: Shopping List Items for this Task
      hint: null
      type: text
      options: []
      required: false
