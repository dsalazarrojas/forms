inputSchema:
  type: object
  properties:
    title: Service Advisor Follow Up Form
    pages:
    - id: 1
      name: service_advisor_follow_up_form_1
      label: Contact Information
      hint: null
      type: select_one
      options:
      - first name
      - last name
      - email
      - phone
      - address line 1
      - address line 2
      - city
      - state
      - zip
      required: true
    - id: 2
      name: service_advisor_follow_up_form_2
      label: Service Details
      hint: null
      type: select_multiple
      options:
      - service type
      - service date
      - service time
      - service advisor
      - vehicle make
      - vehicle model
      - vehicle year
      required: true
    - id: 3
      name: service_advisor_follow_up_form_3
      label: Additional Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: service_advisor_follow_up_form_4
      label: How likely are you to recommend our service?
      hint: null
      type: select_one
      options:
      - very likely
      - somewhat likely
      - not likely
      required: true
    - id: 5
      name: service_advisor_follow_up_form_5
      label: Comments
      hint: null
      type: text
      options: []
      required: false
