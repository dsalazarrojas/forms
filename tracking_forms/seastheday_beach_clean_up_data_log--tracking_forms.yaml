      - Possible interaction (evidence only)
      - Animal freed and documented
      - Deceased animal found
      - Nesting site disturbance
      required: true
    - id: 25
      name: unusual_hazardous_items
      label: Unusual or hazardous items found
      hint: Select all that apply
      type: select_multiple
      options:
      - Medical waste (syringes)
