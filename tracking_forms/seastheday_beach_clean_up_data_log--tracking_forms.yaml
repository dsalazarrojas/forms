      label: Organization or school name
      hint: Company, school, or volunteer group (if applicable)
      type: text
      options: []
      required: false
    - id: 4
      name: email_contact
      label: Email address
      hint: For follow-up questions about data
      type: email
      options: []
      required: true
    - id: 5
      name: cleanup_date
      label: Date of cleanup
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: beach_location
      label: Beach name
      hint: Official name or commonly known name
      type: text
      options: []
      required: true
    - id: 7
      name: survey_zone
      label: Zone or sector code
      hint: e.g., Sector A, North Zone, near Pier 3
      type: text
      options: []
      required: false
    - id: 8
      name: gps_latitude
      label: GPS latitude
      hint: Decimal degrees (e.g., 1.3521)
      type: decimal
      options: []
      required: false
    - id: 9
      name: gps_longitude
      label: GPS longitude
      hint: Decimal degrees (e.g., 103.8198)
