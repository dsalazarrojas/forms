      label: Cleanup start time
      hint: Time counting began
      type: time
      options: []
      required: true
    - id: 12
      name: cleanup_end_time
      label: Cleanup end time
      hint: Time counting stopped
      type: time
      options: []
      required: true
    - id: 13
      name: volunteer_count
      label: Number of volunteers
      hint: Including team leader
      type: integer
      options: []
      required: true
    - id: 14
      name: weather_conditions
      label: Weather conditions
      hint: null
