      hint: All sizes, include bottle caps
      type: integer
      options: []
      required: false
    - id: 18
      name: plastic_bags_wrappers
      label: Plastic bags & food wrappers
      hint: Shopping bags, chip bags, candy wrappers
      type: integer
      options: []
      required: false
    - id: 19
      name: food_containers
      label: Food containers & cups
      hint: Takeaway containers, foam cups, lids
      type: integer
      options: []
      required: false
    - id: 20
      name: straws_utensils
      label: Straws, stirrers & cutlery
      hint: Plastic forks, spoons, knives, straws
      type: integer
      options: []
      required: false
    - id: 21
      name: glass_metal
