inputSchema:
  type: object
  properties:
    title: Equipment Release Form
    pages:
    - id: 1
      name: employee
      label: employee
      hint: null
      type: select_one
      options:
      - John Doe
      - Jane Doe
      required: false
    - id: 2
      name: equipment
      label: equipment
      hint: null
      type: select_multiple
      options:
      - Laptop
      - Mobile Phone
      required: false
    - id: 3
      name: reason
      label: reason
      hint: Why would you like to borrow this equipment?
      type: text
      options: []
      required: false
    - id: 4
      name: start_date
      label: start_date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: return_date
      label: return_date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: comment
      label: comment
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: manager
      label: manager
      hint: null
      type: select_one
      options:
      - John Smith
      - Jane Smith
      required: false
    - id: 8
      name: department
      label: department
      hint: null
      type: select_one
      options:
      - Sales and Marketing
      - Customer Support
      required: false
