inputSchema:
  type: object
  properties:
    title: Chair Usage Log
    pages:
      - id: 1
        name: log_date
        label: Log Date
        hint: Date of chair usage
        type: date
        options: []
        required: true
      - id: 2
        name: user_name
        label: User Name
        hint: Full name of person using chair
        type: text
        options: []
        required: true
      - id: 3
        name: user_email
        label: Email Address
        hint: Email for notifications
        type: email
        options: []
        required: true
      - id: 4
        name: department
        label: Department
        hint: User department
        type: text
        options: []
        required: true
      - id: 5
        name: chair_id
        label: Chair ID Number
        hint: Identification number of chair
        type: text
        options: []
        required: true
      - id: 6
        name: chair_location
        label: Chair Location
        hint: Where is the chair located
        type: select_one
        options:
          - Office floor 1
          - Office floor 2
          - Office floor 3
          - Conference room A
          - Conference room B
          - Break room
          - Reception area
          - Other
        required: true
      - id: 7
        name: checkout_time
        label: Checkout Time
        hint: Time chair was taken into use
        type: time
        options: []
        required: true
      - id: 8
        name: return_time
        label: Return Time
        hint: Time chair was returned
        type: time
        options: []
        required: false
      - id: 9
        name: usage_purpose
        label: Usage Purpose
        hint: Why was the chair needed
        type: select_one
        options:
          - Temporary workstation
          - Meeting seating
          - Event setup
          - Replacement chair
          - Guest seating
          - Other
        required: true
      - id: 10
        name: condition_at_checkout
        label: Condition at Checkout
        hint: What was the chair condition when taken
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Damaged
        required: true
      - id: 11
        name: condition_at_return
        label: Condition at Return
        hint: What was the chair condition when returned
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Damaged
        required: false
      - id: 12
        name: damage_noted
        label: Damage Noted
        hint: Was any damage noted during use
        type: select_one
        options:
          - No damage
          - Minor damage
          - Moderate damage
          - Severe damage
        required: true
      - id: 13
        name: damage_description
        label: Damage Description
        hint: Describe any damage
        type: text
        options: []
        required: false
      - id: 14
        name: cleaning_required
        label: Cleaning Required
        hint: Does the chair need cleaning
        type: select_one
        options:
          - No cleaning needed
          - Light cleaning
          - Deep cleaning required
        required: true
      - id: 15
        name: maintenance_needed
        label: Maintenance Needed
        hint: Does the chair need maintenance
        type: select_one
        options:
          - No maintenance needed
          - Minor adjustments
          - Repair required
          - Replace chair
        required: true
      - id: 16
        name: maintenance_details
        label: Maintenance Details
        hint: Describe maintenance needs
        type: text
        options: []
        required: false
      - id: 17
        name: returned_to_original_location
        label: Returned to Original Location
        hint: Was the chair returned to where it was taken from
        type: select_one
        options:
          - Yes - Same location
          - No - Different location
        required: true
      - id: 18
        name: new_location
        label: New Location
        hint: Where was the chair moved to
        type: text
        options: []
        required: false
      - id: 19
        name: usage_duration
        label: Usage Duration
        hint: How long was the chair in use
        type: select_one
        options:
          - Less than 1 hour
          - 1-2 hours
          - 2-4 hours
          - 4-8 hours
          - More than 8 hours
          - Multiple days
        required: true
      - id: 20
        name: logged_by
        label: Logged By
        hint: Name of person completing this log
        type: text
        options: []
        required: true
      - id: 21
        name: log_signature
        label: Log Signature
        hint: Type your full name as signature
        type: text
        options: []
        required: true
