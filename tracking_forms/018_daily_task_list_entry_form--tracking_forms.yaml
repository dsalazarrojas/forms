inputSchema:
  type: object
  properties:
    title: Daily Task List Entry Form
    pages:
    - id: 1
      name: entry_date
      label: Entry Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: task_description
      label: Task Description
