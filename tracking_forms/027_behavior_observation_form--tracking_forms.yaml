inputSchema:
  type: object
  properties:
    title: Behavior Observation Form
    pages:
      - id: 1
        name: student_name
        label: Student Name
        hint: Full name
        type: text
        options: []
        required: true
      - id: 2
        name: student_id
        label: Student ID
        hint: If applicable
        type: text
        options: []
        required: false
      - id: 3
        name: grade_level
        label: Grade Level
        hint: Current grade
        type: select_one
        options:
          - Kindergarten
          - 1st Grade
          - 2nd Grade
          - 3rd Grade
          - 4th Grade
          - 5th Grade
          - 6th Grade
          - 7th Grade
          - 8th Grade
          - 9th Grade
          - 10th Grade
          - 11th Grade
          - 12th Grade
        required: true
      - id: 4
        name: teacher_name
        label: Teacher Name
        hint: Observing teacher
        type: text
        options: []
        required: true
      - id: 5
        name: observation_date
        label: Observation Date
        hint: Date of observation
        type: date
        options: []
        required: true
      - id: 6
        name: observation_time
        label: Observation Time
        hint: Time of day
        type: time
        options: []
        required: true
      - id: 7
        name: observation_setting
        label: Observation Setting
        hint: Where did observation take place
        type: select_one
        options:
          - Classroom
          - Playground
          - Cafeteria
          - Library
          - Gymnasium
          - Hallway
          - Bus
          - Other
        required: true
      - id: 8
        name: observation_duration
        label: Observation Duration
        hint: How long was the observation
        type: select_one
        options:
          - 15 minutes
          - 30 minutes
          - 45 minutes
          - 1 hour
          - More than 1 hour
        required: true
      - id: 9
        name: behavior_type
        label: Behavior Type Observed
        hint: Select all that apply
        type: select_multiple
        options:
          - On-task behavior
          - Off-task behavior
          - Disruptive behavior
          - Aggressive behavior
          - Withdrawn behavior
          - Social interaction
          - Compliance with rules
          - Participation
          - Attention-seeking
          - Other
        required: true
      - id: 10
        name: behavior_description
        label: Behavior Description
        hint: Describe the specific behavior observed
        type: text
        options: []
        required: true
      - id: 11
        name: antecedent
        label: Antecedent
        hint: What happened before the behavior
        type: text
        options: []
        required: true
      - id: 12
        name: consequence
        label: Consequence
        hint: What happened after the behavior
        type: text
        options: []
        required: true
      - id: 13
        name: behavior_frequency
        label: Behavior Frequency
        hint: How often did this behavior occur
        type: select_one
        options:
          - Once
          - 2-3 times
          - 4-5 times
          - 6-10 times
          - More than 10 times
          - Continuous
        required: true
      - id: 14
        name: behavior_intensity
        label: Behavior Intensity
        hint: How intense was the behavior
        type: select_one
        options:
          - Very mild
          - Mild
          - Moderate
          - High
          - Very high
        required: true
      - id: 15
        name: triggers_identified
        label: Triggers Identified
        hint: What seemed to trigger the behavior
        type: text
        options: []
        required: false
      - id: 16
        name: intervention_used
        label: Intervention Used
        hint: What intervention was attempted
        type: text
        options: []
        required: false
      - id: 17
        name: intervention_effectiveness
        label: Intervention Effectiveness
        hint: How well did the intervention work
        type: select_one
        options:
          - Very effective
          - Somewhat effective
          - Neutral
          - Somewhat ineffective
          - Very ineffective
          - No intervention used
        required: true
      - id: 18
        name: peers_involved
        label: Peers Involved
        hint: Were other students involved
        type: select_one
        options:
          - No
          - Yes 1-2 peers
          - Yes 3-5 peers
          - Yes more than 5 peers
          - Whole class
        required: true
      - id: 19
        name: adult_support
        label: Adult Support Present
        hint: Was additional adult support present
        type: select_one
        options:
          - No
          - Yes teacher assistant
          - Yes specialist
          - Yes administrator
          - Yes multiple adults
        required: true
      - id: 20
        name: student_mood
        label: Student Mood
        hint: Overall mood during observation
        type: select_one
        options:
          - Happy
          - Calm
          - Neutral
          - Anxious
          - Agitated
          - Sad
          - Angry
        required: true
      - id: 21
        name: academic_engagement
        label: Academic Engagement
        hint: Level of engagement in academic tasks
        type: select_one
        options:
          - Highly engaged
          - Somewhat engaged
          - Neutral
          - Somewhat disengaged
          - Highly disengaged
        required: true
      - id: 22
        name: strengths_observed
        label: Strengths Observed
        hint: What positive behaviors or strengths did you notice
        type: text
        options: []
        required: false
      - id: 23
        name: concerns
        label: Concerns
        hint: What concerns do you have
        type: text
        options: []
        required: false
      - id: 24
        name: recommendations
        label: Recommendations
        hint: What recommendations do you have
        type: text
        options: []
        required: false
      - id: 25
        name: follow_up_needed
        label: Follow-Up Needed
        hint: Is follow-up required
        type: select_one
        options:
          - Yes urgent
          - Yes within one week
          - Yes within one month
          - No follow-up needed
        required: true
      - id: 26
        name: parent_contacted
        label: Parent Contacted
        hint: Have parents been contacted about this
        type: select_one
        options:
          - Yes already
          - Plan to contact
          - No not needed
        required: true
      - id: 27
        name: observer_signature
        label: Observer Signature
        hint: By selecting yes I confirm this observation is accurate
        type: select_one
        options:
          - I confirm this is accurate
          - I do not confirm
        required: true
