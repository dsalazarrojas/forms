inputSchema:
  type: object
  properties:
    title: Comet Discovery Report
    pages:
    - id: 1
      name: observer_name
      label: Observer Name
      hint: Name of the person who discovered the comet
      type: text
      options: []
      required: true
    - id: 2
      name: observer_email
      label: Email Address
      hint: Contact email for follow-up
      type: email
      options: []
      required: true
    - id: 3
      name: observer_affiliation
      label: Affiliation
      hint: Observatory, institution, or independent
      type: select_one
      options:
      - Professional Observatory
      - University Research
      - Amateur Astronomer
      - Independent Researcher
      - Student
      - Other
      required: true
    - id: 4
      name: discovery_date
      label: Discovery Date
      hint: Date when comet was first observed
      type: date
      options: []
      required: true
    - id: 5
      name: discovery_time
      label: Discovery Time
      hint: Time of initial observation
      type: time
      options: []
      required: true
    - id: 6
      name: section_header_observation_location
      label: -- Observation Location --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: observatory_name
      label: Observatory Name
      hint: Name of observatory or location
      type: text
      options: []
      required: true
    - id: 8
      name: latitude
      label: Latitude
      hint: Observation site latitude
      type: number
      options: []
      required: true
    - id: 9
      name: longitude
      label: Longitude
      hint: Observation site longitude
      type: number
      options: []
      required: true
    - id: 10
      name: elevation
      label: Elevation
      hint: Site elevation in meters
      type: number
      options: []
      required: false
    - id: 11
      name: section_header_comet_data
      label: -- Comet Data --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: provisional_designation
      label: Provisional Designation
      hint: Initial comet designation if assigned
      type: text
      options: []
      required: false
    - id: 13
      name: apparent_magnitude
      label: Apparent Magnitude
      hint: Observed brightness
      type: number
      options: []
      required: true
    - id: 14
      name: coma_size
      label: Coma Size
      hint: Size of coma in arcminutes
      type: number
      options: []
      required: false
    - id: 15
      name: tail_length
      label: Tail Length
      hint: Length of tail in degrees
      type: number
      options: []
      required: false
    - id: 16
      name: tail_type
      label: Tail Type
      hint: Type of comet tail observed
      type: select_one
      options:
      - Ion Tail
      - Dust Tail
      - Both
      - None Visible
      required: true
    - id: 17
      name: section_header_equipment
      label: -- Observation Equipment --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: telescope_type
      label: Telescope Type
      hint: Type of telescope used
      type: select_one
      options:
      - Refractor
      - Reflector
      - Catadioptric
      - Radio Telescope
      - Naked Eye
      - Binoculars
      required: true
    - id: 19
      name: telescope_aperture
      label: Telescope Aperture
      hint: Aperture size in millimeters
      type: number
      options: []
      required: false
    - id: 20
      name: magnification
      label: Magnification Used
      hint: Magnification power
      type: number
      options: []
      required: false
    - id: 21
      name: camera_equipment
      label: Camera Equipment
      hint: Camera or imaging device used
      type: text
      options: []
      required: false
    - id: 22
      name: filter_used
      label: Filter Used
      hint: Any filters applied
      type: text
      options: []
      required: false
    - id: 23
      name: section_header_images
      label: -- Images and Documentation --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: images_captured
      label: Were Images Captured
      hint: Did you photograph the comet
      type: select_one
      options:
      - Yes Multiple Images
      - Yes Single Image
      - No Images
      required: true
    - id: 25
      name: image_upload
      label: Upload Images
      hint: Path or link to image files
      type: text
      options: []
      required: false
    - id: 26
      name: section_header_additional_observations
      label: -- Additional Observations --
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: weather_conditions
      label: Weather Conditions
      hint: Sky and weather during observation
      type: select_one
      options:
      - Clear
      - Partly Cloudy
      - Hazy
      - Poor Seeing
      - Excellent Seeing
      required: true
    - id: 28
      name: moon_phase
      label: Moon Phase
      hint: Moon phase during observation
      type: select_one
      options:
      - New Moon
      - Waxing Crescent
      - First Quarter
      - Waxing Gibbous
      - Full Moon
      - Waning Gibbous
      - Last Quarter
      - Waning Crescent
      required: true
    - id: 29
      name: additional_notes
      label: Additional Notes
      hint: Any other observations or comments
      type: text
      options: []
      required: false
    - id: 30
      name: follow_up_required
      label: Follow-Up Required
      hint: Does this discovery need verification
      type: select_one
      options:
      - Yes Please Verify
      - No Confirmation Needed
      - Unsure
      required: true
