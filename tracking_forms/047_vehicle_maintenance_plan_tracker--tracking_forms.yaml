      name: next_service
      label: next_service
      hint: Enter the date of the next service.
      type: date
      options: []
      required: false
    - id: 6
      name: service_cost
      label: service_cost
      hint: Enter the cost of the most recent service.
      type: number
      options: []
      required: false
    - id: 7
      name: service_type
      label: service_type
      hint: Select the type of service performed.
      type: select_one
      options:
      - oil change
      - tire change
      - other
      required: true
