      hint: Enter vehicle make.
      type: text
      options: []
      required: false
    - id: 14
      name: vehicle_model
      label: vehicle_model
      hint: Enter vehicle model.
      type: text
      options: []
      required: false
    - id: 15
      name: vehicle_year
