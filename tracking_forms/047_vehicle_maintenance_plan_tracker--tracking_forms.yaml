inputSchema:
  type: object
  properties:
    title: Vehicle Maintenance Plan Tracker
    pages:
    - id: 1
      name: vehicle_details
      label: vehicle_details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: maintenance_history
      label: maintenance_history
      hint: Record all maintenance events, no matter when they occurred.
      type: text
      options: []
      required: false
    - id: 3
      name: upcoming_maintenance
      label: upcoming_maintenance
      hint: List any upcoming scheduled maintenance.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: notes
      label: notes
      hint: null
      type: text
      options: []
      required: false
