inputSchema:
  type: object
  properties:
    title: Resident Amenity Access Tracking Consent Form
    pages:
    - id: 1
      name: resident_amenity_access_tracking_consent_form_page1
      label: What is your name?
      hint: Please enter your name
      type: text
      options: []
      required: false
    - id: 2
      name: resident_amenity_access_tracking_consent_form_page2
      label: What is your contact number?
      hint: Please enter your contact number
      type: text
      options: []
      required: true
    - id: 3
      name: resident_amenity_access_tracking_consent_form_page3
      label: What is your email address?
      hint: Please enter your email address
      type: text
      options: []
      required: true
    - id: 4
      name: resident_amenity_access_tracking_consent_form_page4
      label: Emergency Contact?
      hint: Please choose your emergency contact
      type: select_one
      options:
      - Spouse
      - Other
      required: true
    - id: 5
      name: resident_amenity_access_tracking_consent_form_page5
      label: Relationship with Emergency Contact
      hint: Please enter your relationship with emergency contact
      type: text
      options: []
      required: true
    - id: 6
      name: resident_amenity_access_tracking_consent_form_page6
      label: Emergency Contact Information?
      hint: Please choose if you want to receive emergency contact information
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: resident_amenity_access_tracking_consent_form_page7
      label: What do you consent to?
      hint: Please choose what you consent to
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: resident_amenity_access_tracking_consent_form_page8
      label: Do you want to be contacted?
      hint: Please choose if you want to be contacted
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: resident_amenity_access_tracking_consent_form_page9
      label: What do you want to share with management?
      hint: Please choose what you want to share
      type: select_multiple
      options:
      - Information
      - Nothing
      required: true
    - id: 10
      name: resident_amenity_access_tracking_consent_form_page10
      label: Do you want to be contacted for other reason?
      hint: Please choose if you want to be contacted
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: resident_amenity_access_tracking_consent_form_page11
      label: Emergency Contact's Name
      hint: Please enter emergency contact's name
      type: text
      options: []
      required: true
    - id: 12
      name: resident_amenity_access_tracking_consent_form_page12
      label: Emergency Contact's Number
      hint: Please enter emergency contact's number
      type: text
      options: []
      required: true
    - id: 13
      name: resident_amenity_access_tracking_consent_form_page13
      label: Emergency Contact's Email
      hint: Please enter emergency contact's email
      type: text
      options: []
      required: true
    - id: 14
      name: resident_amenity_access_tracking_consent_form_page14
      label: Emergency Contact's Relationship
      hint: Please enter emergency contact's relationship
      type: text
      options: []
      required: true
    - id: 15
      name: resident_amenity_access_tracking_consent_form_page15
      label: Consent Notes
      hint: Please enter your consent notes
      type: note
      options: []
      required: false
