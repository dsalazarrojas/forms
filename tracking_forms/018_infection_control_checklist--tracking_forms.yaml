inputSchema:
  type: object
  properties:
    title: Infection Control Checklist
    pages:
    - id: 1
      name: patient_id
      label: Patient Id
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
