      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: completed
      label: Completed
      hint: Select one of the following options
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 16
      name: reviewer
      label: Reviewer
      hint: Select one of the following options
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
