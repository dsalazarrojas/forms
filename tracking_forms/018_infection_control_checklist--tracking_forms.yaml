      type: date
      options: []
      required: true
    - id: 7
      name: contact_time
      label: Contact Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: contact_reason
      label: Contact Reason
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: control_measures
      label: Control Measures
      hint: Select multiple control measures
      type: select_multiple
      options:
      - 'False'
      - 'True'
