inputSchema:
  type: object
  properties:
    title: Behavior Tracking Checklist
    pages:
      - id: 1
        name: student_name
        label: Student Name
        hint: Full name
        type: text
        options: []
        required: true
      - id: 2
        name: student_id
        label: Student ID
        hint: If applicable
        type: text
        options: []
        required: false
      - id: 3
        name: grade_level
        label: Grade Level
        hint: Current grade
        type: select_one
        options:
          - Kindergarten
          - 1st Grade
          - 2nd Grade
          - 3rd Grade
          - 4th Grade
          - 5th Grade
          - 6th Grade
          - 7th Grade
          - 8th Grade
        required: true
      - id: 4
        name: observer_name
        label: Observer Name
        hint: Name of person completing checklist
        type: text
        options: []
        required: true
      - id: 5
        name: observation_date
        label: Observation Date
        hint: Date of observation
        type: date
        options: []
        required: true
      - id: 6
        name: session_time
        label: Session Time
        hint: Time of observation
        type: time
        options: []
        required: true
      - id: 7
        name: setting
        label: Setting
        hint: Where observation took place
        type: select_one
        options:
          - General Education Classroom
          - Special Education Classroom
          - Resource Room
          - Cafeteria
          - Playground
          - Bus
          - Library
          - Gym
          - Other
        required: true
      - id: 8
        name: activity_type
        label: Activity Type
        hint: What activity was happening
        type: select_one
        options:
          - Whole group instruction
          - Small group work
          - Independent work
          - Transition time
          - Free time or recess
          - Meal time
          - Test or assessment
          - Other
        required: true
      - id: 9
        name: on_task
        label: On-Task Behavior
        hint: Was student on task
        type: select_one
        options:
          - Always (90-100 percent)
          - Most of the time (70-89 percent)
          - Sometimes (50-69 percent)
          - Rarely (25-49 percent)
          - Never (0-24 percent)
        required: true
      - id: 10
        name: following_directions
        label: Following Directions
        hint: Did student follow directions
        type: select_one
        options:
          - Always
          - Most of the time
          - Sometimes
          - Rarely
          - Never
        required: true
      - id: 11
        name: raising_hand
        label: Raising Hand Before Speaking
        hint: Did student raise hand appropriately
        type: select_one
        options:
          - Always
          - Most of the time
          - Sometimes
          - Rarely
          - Never
          - Not applicable
        required: true
      - id: 12
        name: staying_seated
        label: Staying in Assigned Seat
        hint: Did student remain in seat
        type: select_one
        options:
          - Always
          - Most of the time
          - Sometimes
          - Rarely
          - Never
          - Not applicable
        required: true
      - id: 13
        name: respectful_behavior
        label: Respectful to Others
        hint: Was student respectful
        type: select_one
        options:
          - Always
          - Most of the time
          - Sometimes
          - Rarely
          - Never
        required: true
      - id: 14
        name: completing_work
        label: Completing Assigned Work
        hint: Did student complete work
        type: select_one
        options:
          - Always
          - Most of the time
          - Sometimes
          - Rarely
          - Never
          - Not applicable
        required: true
      - id: 15
        name: disruptive_behavior
        label: Disruptive Behavior Observed
        hint: Select all that apply
        type: select_multiple
        options:
          - None observed
          - Calling out
          - Making noises
          - Out of seat
          - Touching others belongings
          - Physical aggression
          - Verbal aggression
          - Refusing work
          - Elopement attempts
          - Other
        required: true
      - id: 16
        name: positive_behavior
        label: Positive Behavior Observed
        hint: Select all that apply
        type: select_multiple
        options:
          - None observed
          - Helping others
          - Sharing materials
          - Encouraging peers
          - Following rules without prompts
          - Completing extra work
          - Cleaning up
          - Using appropriate language
          - Showing good sportsmanship
          - Other
        required: true
      - id: 17
        name: prompts_needed
        label: Prompts or Redirections Needed
        hint: How many adult prompts were needed
        type: select_one
        options:
          - 0 prompts
          - 1-2 prompts
          - 3-5 prompts
          - 6-10 prompts
          - More than 10 prompts
          - Continuous prompting
        required: true
      - id: 18
        name: prompt_type
        label: Type of Prompts Used
        hint: Select all that apply
        type: select_multiple
        options:
          - Verbal reminder
          - Visual cue
          - Gesture
          - Physical prompt
          - Written reminder
          - Token or reward system
          - Peer model
          - Other
        required: false
      - id: 19
        name: peer_interactions
        label: Peer Interactions
        hint: How did student interact with peers
        type: select_one
        options:
          - Positive and appropriate
          - Mostly positive
          - Neutral or minimal
          - Some negative interactions
          - Mostly negative interactions
        required: true
      - id: 20
        name: adult_support
        label: Adult Support Provided
        hint: What level of adult support was provided
        type: select_one
        options:
          - None needed
          - Occasional check-ins
          - Frequent support
          - Constant 1-on-1 support
          - Multiple adults involved
        required: true
      - id: 21
        name: antecedent_events
        label: Antecedent Events
        hint: What happened before notable behaviors
        type: text
        options: []
        required: false
      - id: 22
        name: consequence_events
        label: Consequence Events
        hint: What happened after notable behaviors
        type: text
        options: []
        required: false
      - id: 23
        name: additional_notes
        label: Additional Notes
        hint: Any other observations or comments
        type: text
        options: []
        required: false
      - id: 24
        name: follow_up_actions
        label: Follow-Up Actions Needed
        hint: What actions need to be taken
        type: text
        options: []
        required: false
