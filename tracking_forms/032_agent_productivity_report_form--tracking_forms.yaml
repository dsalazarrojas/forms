inputSchema:
  type: object
  properties:
    title: Agent Productivity Report Form
    pages:
    - id: 1
      name: agent_name
      label: Agent Name
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 2
      name: agent_id
      label: Agent ID
      hint: Enter your unique agent identifier
      type: text
      options: []
      required: true
    - id: 3
      name: reporting_period
      label: Reporting Period
      hint: Enter the date range for this report
      type: text
      options: []
      required: true
    - id: 4
      name: report_date
      label: Report Date
      hint: Enter the date when this report is submitted
      type: date
      options: []
      required: true
    - id: 5
      name: supervisor_name
      label: Supervisor Name
      hint: Enter the name of your supervisor
      type: text
      options: []
      required: true
