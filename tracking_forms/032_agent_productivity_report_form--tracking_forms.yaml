      name: training_development_time
      label: Training and Development Time
      hint: Enter the time spent on training and development
      type: number
      options: []
      required: false
    - id: 19
      name: performance_analysis_header
      label: -- Performance Analysis --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: goals_achieved
      label: Goals Achieved
      hint: Which goals were achieved during this period?
      type: text
      options: []
      required: false
    - id: 21
      name: goals_not_achieved
      label: Goals Not Achieved
      hint: Which goals were not achieved and why?
      type: text
      options: []
      required: false
    - id: 22
      name: challenges_faced
      label: Challenges Faced
      hint: What challenges did you face during this period?
      type: text
      options: []
      required: false
    - id: 23
      name: achievements_recognitions
      label: Achievements and Recognitions
      hint: What achievements or recognitions did you earn?
      type: text
      options: []
      required: false
    - id: 24
      name: improvement_plan
      label: Improvement Plan
      hint: What is your plan for improvement in the next period?
      type: text
      options: []
      required: false
    - id: 25
      name: additional_comments
      label: Additional Comments
      hint: Any additional comments about your productivity
      type: text
      options: []
      required: false
