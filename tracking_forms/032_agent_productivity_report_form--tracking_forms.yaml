      name: productivity_metrics_header
      label: -- Productivity Metrics --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: total_calls_made
      label: Total Calls Made
      hint: Enter the total number of calls made during the reporting period
      type: number
      options: []
      required: true
    - id: 8
      name: successful_interactions
      label: Successful Interactions
      hint: Enter the number of successful interactions/calls
      type: number
      options: []
      required: true
    - id: 9
      name: meetings_scheduled
      label: Meetings Scheduled
      hint: Enter the number of meetings scheduled
      type: number
      options: []
      required: true
    - id: 10
      name: deals_closed
      label: Deals Closed
      hint: Enter the number of deals closed during the period
      type: number
      options: []
      required: true
    - id: 11
      name: revenue_generated
      label: Revenue Generated
      hint: Enter the total revenue generated during the period
      type: number
      options: []
      required: true
    - id: 12
      name: new_leads_acquired
      label: New Leads Acquired
      hint: Enter the number of new leads acquired
      type: number
      options: []
      required: true
    - id: 13
      name: follow_ups_completed
      label: Follow-ups Completed
      hint: Enter the number of follow-ups completed
      type: number
      options: []
      required: true
    - id: 14
      name: time_management_header
      label: -- Time Management --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: hours_worked
      label: Hours Worked
      hint: Enter the total number of hours worked during the period
      type: number
      options: []
      required: true
    - id: 16
      name: productive_hours
      label: Productive Hours
      hint: Enter the number of hours spent on productive activities
      type: number
      options: []
      required: true
    - id: 17
      name: administrative_tasks_time
      label: Administrative Tasks Time
      hint: Enter the time spent on administrative tasks
      type: number
      options: []
      required: true
