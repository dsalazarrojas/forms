inputSchema:
  type: object
  properties:
    title: Group Meeting Log
    pages:
    - id: 1
      name: meeting_log
      label: Meeting Log
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: ongoing_item
      label: Ongoing
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: finished_item
      label: Finished
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: absent_member
      label: Absent
      hint: null
      type: select_multiple
      options:
      - Joe
      - Jane
      - John
      required: false
    - id: 7
      name: add_member
      label: Add Member
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: remove_member
      label: Remove Member
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
