inputSchema:
  type: object
  properties:
    title: Wrist Stretching Exercise Log
    pages:
    - id: 1
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: duration
      label: duration
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: sets_completed
      label: Sets Completed
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      required: true
    - id: 4
      name: reps_completed
      label: Repeats Completed
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      required: false
    - id: 5
      name: muscle_stretched
      label: Muscle Stretched
      hint: null
      type: select_multiple
      options:
      - Flexor Carpi Ulnaris
      - Extensor Pollicis
      - Extensor Carpi Radialis
      - Pronator Teres
      - Flexor Carpi Radialis
      required: true
    - id: 6
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: assigned
      label: Assigned
      hint: null
      type: select_one
      options:
      - Trainer
      - User
      required: true
    - id: 10
      name: session_id
      label: Session ID
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
