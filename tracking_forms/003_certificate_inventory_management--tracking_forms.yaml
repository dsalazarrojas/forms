inputSchema:
  type: object
  properties:
    title: Certificate Inventory Management
    pages:
      - id: 1
        name: section_overview
        label: -- Inventory Overview --
        hint: Track issued certificates and expiration details
        type: note
        options: []
        required: false
      - id: 2
        name: certificate_id
        label: certificate id
        hint: unique identifier for the certificate
        type: text
        options: []
        required: true
      - id: 3
        name: recipient_name
        label: recipient name
        hint: full name of certificate holder
        type: text
        options: []
        required: true
      - id: 4
        name: issue_date
        label: issue date
        hint: date certificate was issued
        type: date
        options: []
        required: true
      - id: 5
        name: expiration_date
        label: expiration date
        hint: date certificate expires if applicable
        type: date
        options: []
        required: false
      - id: 6
        name: certificate_type
        label: certificate type
        hint: classification or program name
        type: select_one
        options:
          - Completion
          - Competency
          - Attendance
          - Other
        required: true
      - id: 7
        name: issuing_authority
        label: issuing authority
        hint: department or organization issuing the certificate
        type: text
        options: []
        required: false
      - id: 8
        name: status
        label: status
        hint: current status of the certificate
        type: select_one
        options:
          - Active
          - Expired
          - Revoked
          - Pending
        required: true
      - id: 9
        name: notes
        label: notes
        hint: additional remarks about the record
        type: text
        options: []
        required: false
      - id: 10
        name: record_owner
        label: record owner
        hint: staff member responsible for this certificate
        type: text
        options: []
        required: false
