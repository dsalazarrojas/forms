inputSchema:
  type: object
  properties:
    title: Tattoo Procedure Log
    pages:
    - id: 1
      name: procedure_date
      label: Procedure Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: tattoo_location
      label: Tattoo Location
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: artist_name
      label: Artist Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: procedure_description
      label: Procedure Description
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: procedure_status
      label: Procedure Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 8
      name: procedure_outcome
      label: Procedure Outcome
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: procedure_id
      label: Procedure ID
      hint: null
      type: number
      options: []
      required: false
