inputSchema:
  type: object
  properties:
    title: Training Schedule Tracker
    pages:
    - id: 1
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: trainer_name
      label: Trainer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: training_location
      label: Training Location
      hint: null
      type: select_one
      options:
      - Training Room A
      - Training Room B
      - Training Room C
      required: false
    - id: 5
      name: training_topics
      label: Training Topics
      hint: List separated by commas
      type: select_multiple
      options:
      - Topic A
      - Topic B
      - Topic C
      - Topic D
      - Topic E
      - Topic F
      - Topic G
      - Topic H
      required: false
    - id: 6
      name: attendees
      label: Attendees
      hint: List separated by commas
      type: select_multiple
      options:
      - Attendee A
      - Attendee B
      - Attendee C
      - Attendee D
      - Attendee E
      required: false
    - id: 7
      name: session_notes
      label: Session Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: session_feedback
      label: Session Feedback
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 9
      name: attendees_email
      label: Attendees Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: attendees_phone
      label: Attendees Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: trainer_attendance
      label: Trainer Attendance
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: session_status
      label: Session Status
      hint: null
      type: select_one
      options:
      - Scheduled
      - Held
      - Cancelled
      required: false
