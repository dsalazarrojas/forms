inputSchema:
  type: object
  properties:
    title: Daily Call Log Form
    pages:
    - id: 1
      name: first_page
      label: First Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: call_duration
      label: Call Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: call_outcomes
      label: Call Outcomes
      hint: null
      type: select_multiple
      options:
      - Success
      - Failed
      - Missed
      required: false
    - id: 8
      name: next_steps
