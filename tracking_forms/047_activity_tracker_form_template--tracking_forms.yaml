inputSchema:
  type: object
  properties:
    title: Activity Tracker Form Template
    pages:
    - id: 1
      name: tracker_owner
      label: Tracker Owner
      hint: Name of the person responsible for this activity tracker
      type: text
      options: []
      required: true
    - id: 2
      name: activity_name
      label: Activity Name
      hint: Name of the activity being tracked
      type: text
      options: []
      required: true
    - id: 3
      name: activity_category
      label: Activity Category
      hint: Type of activity being tracked
      type: select_one
      options:
      - Exercise
      - Work Task
      - Study Session
      - Project
      - Meeting
      - Personal Goal
      - Other
      required: true
    - id: 4
      name: start_date
      label: Start Date
      hint: When did this activity begin
      type: date
      options: []
      required: true
    - id: 5
      name: end_date
      label: End Date
      hint: When did or will this activity end
      type: date
      options: []
      required: true
    - id: 6
      name: duration
      label: Duration (Minutes)
      hint: How long did the activity last
      type: number
      options: []
      required: true
    - id: 7
      name: frequency
      label: Frequency
      hint: How often does this activity occur
      type: select_one
      options:
      - Daily
      - Weekly
      - Twice Weekly
      - Three Times Weekly
      - Monthly
      - As Needed
      required: true
    - id: 8
      name: activity_intensity
      label: Activity Intensity
      hint: How intense was the activity
      type: select_one
      options:
      - Low
      - Moderate
      - High
      - Very High
      required: true
    - id: 9
      name: progress_made
      label: Progress Made
      hint: What progress was achieved during this activity
      type: text
      options: []
      required: true
    - id: 10
      name: challenges_faced
      label: Challenges Faced
      hint: What challenges were encountered during the activity
      type: text
      options: []
      required: false
    - id: 11
      name: goals_achieved
      label: Goals Achieved
      hint: Which goals were met during this activity
      type: text
      options: []
      required: false
    - id: 12
      name: next_session_plans
      label: Plans for Next Session
      hint: What will be focused on in the next session
      type: text
      options: []
      required: false
    - id: 13
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied are you with this activity session
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
