inputSchema:
  type: object
  properties:
    title: Plant Root Training Log Form
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: root_training
      label: Root Training
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: training_session
      label: Training Session
      hint: null
      type: select_one
      options:
      - Session 1
      - Session 2
      - Session 3
      required: true
    - id: 4
      name: training_duration
      label: Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: training_notes
      label: Training Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: training_date
      label: Training Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: training_time
      label: Training Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: training_location
      label: Training Location
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: trainer
      label: Trainer
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: trainee
      label: Trainee
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: equipment_used
      label: Equipment Used
      hint: null
      type: select_multiple
      options:
      - Camera
      - Microscope
      - Other
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
