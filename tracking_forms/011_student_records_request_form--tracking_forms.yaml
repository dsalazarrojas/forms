inputSchema:
  type: object
  properties:
    title: student_records_request_form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: grade
      label: Grade
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: exam_date
      label: Exam Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: homework_date
      label: Homework Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: exam_results
      label: Exam Results
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: homework_results
      label: Homework Results
      hint: null
      type: select_one
      options:
      - '{''label'': ''Good''}'
      - '{''label'': ''Average''}'
      - '{''label'': ''Below average''}'
      required: false
    - id: 7
      name: student_id
      label: Student ID
      hint: null
      type: text
      options: []
      required: false
