inputSchema:
  type: object
  properties:
    title: Utility Cost And Vendor Information Form
    pages:
    - id: 1
      name: page_1
      label: What kind of utility do you use?
      hint: Please describe the type of utility you are using.
      type: select_one
      options:
      - Electricity
      - Gas
      - Water
      - Internet
      - Other (please specify)
      required: true
    - id: 2
      name: page_2
      label: Do you currently have a contract with your utility supplier?
      hint: Check one of the options below.
      type: select_one
      options:
      - 'True'
      - No, I cancelled my contract
      - No, never had one
      required: true
    - id: 3
      name: page_3
      label: How do you typically make payments for your utility bills?
      hint: You can select one or more of the options below.
      type: select_multiple
      options:
      - Online (e.g. bank transfer, digital wallet)
      - In-person (e.g. bank branch, convenience store)
      - Mail (e.g. check, money order)
      - Other (please specify)
      required: true
    - id: 4
      name: page_4
      label: How much does your utility bill typically cost?
      hint: Enter a number.
      type: number
      options: []
      required: true
    - id: 5
      name: page_5
      label: Do you agree with the prices of your current utility supplier?
      hint: Choose one of the options below.
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 6
      name: page_6
      label: Who do you contact for utility-related issues?
      hint: Choose one of the options below.
      type: select_one
      options:
      - Customer Service
      - Billing Department
      - Technical Support
      - Other (please specify)
      required: true
    - id: 7
      name: page_7
      label: What time of day do you typically pay your utility bills?
      hint: Select a time of day.
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Other (please specify)
      required: true
    - id: 8
      name: page_8
      label: Do you have any concerns about your utility supplier?
      hint: Choose one of the options below.
      type: select_multiple
      options:
      - Quality of service
      - Pricing
      - Communication
      - Other (please specify)
      required: true
    - id: 9
      name: page_9
      label: What is your current supplier?
      hint: Enter the name of your current supplier.
      type: text
      options: []
      required: true
    - id: 10
      name: page_10
      label: How long have you been with your current supplier?
      hint: Enter a number.
      type: number
      options: []
      required: true
    - id: 11
      name: page_11
      label: Do you have any other questions or concerns about your utility supplier?
      hint: You can type as much or as little as you'd like.
      type: text
      options: []
      required: false
    - id: 12
      name: page_12
      label: Do you agree with the terms and conditions of your contract with your
        utility supplier?
      hint: Choose one of the options below.
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 13
      name: page_13
      label: Do you have any other comments or feedback about your utility supplier?
      hint: You can type as much or as little as you'd like.
      type: text
      options: []
      required: false
    - id: 14
      name: page_14
      label: Do you have any other questions or concerns about this form?
      hint: You can type as much or as little as you'd like.
      type: text
      options: []
      required: false
    - id: 15
      name: page_15
      label: Do you have a preferred method of communication for utility-related issues?
      hint: Choose one of the options below.
      type: select_one
      options:
      - Phone
      - Email
      - Chat
      - Other (please specify)
      required: false
    - id: 16
      name: page_16
      label: Do you have a preferred time of day for utility-related communication?
      hint: Select a time of day.
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Other (please specify)
      required: false
    - id: 17
      name: page_17
      label: Do you have any other comments or feedback about this form?
      hint: You can type as much or as little as you'd like.
      type: text
      options: []
      required: false
    - id: 18
      name: page_18
      label: Page 18
      hint: You can type as much or as little as you'd like.
      type: text
      options: []
      required: false
