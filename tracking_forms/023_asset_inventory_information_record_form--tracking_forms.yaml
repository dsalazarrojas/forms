inputSchema:
  type: object
  properties:
    title: Asset Inventory Information Record Form
    pages:
    - id: 1
      name: record_date
      label: Record Date
      hint: Date of recording
      type: date
      options: []
      required: true
    - id: 2
      name: recorded_by
      label: Recorded By
      hint: Person recording
      type: text
      options: []
      required: true
    - id: 3
      name: location
      label: Location
      hint: Where asset is located
      type: text
      options: []
      required: true
    - id: 4
      name: asset_id
      label: Asset ID
      hint: Unique identifier
      type: text
      options: []
      required: true
    - id: 5
      name: asset_name
      label: Asset Name
      hint: Descriptive name
      type: text
      options: []
      required: true
    - id: 6
      name: asset_category
      label: Asset Category
      hint: Type of asset
      type: select_one
      options:
      - Electronics
      - Furniture
      - Vehicles
      - Machinery
      - Office Equipment
      - IT Equipment
      - Tools
      - Building and Infrastructure
      - Other
      required: true
    - id: 7
      name: asset_subcategory
      label: Asset Subcategory
      hint: More specific type
      type: text
      options: []
      required: false
    - id: 8
      name: manufacturer
      label: Manufacturer
      hint: Brand or maker
      type: text
      options: []
      required: false
    - id: 9
      name: model_number
      label: Model Number
      hint: Model identifier
      type: text
      options: []
      required: false
    - id: 10
      name: serial_number
      label: Serial Number
      hint: Unique serial
      type: text
      options: []
      required: false
    - id: 11
      name: purchase_date
      label: Purchase Date
      hint: When acquired
      type: date
      options: []
      required: true
    - id: 12
      name: purchase_price
      label: Purchase Price
      hint: Original cost
      type: number
      options: []
      required: true
    - id: 13
      name: current_value
      label: Current Estimated Value
      hint: Present worth
      type: number
      options: []
      required: true
    - id: 14
      name: depreciation_method
      label: Depreciation Method
      hint: How depreciated
      type: select_one
      options:
      - Straight Line
      - Declining Balance
      - Units of Production
      - Sum of Years Digits
      - Not Applicable
      required: false
    - id: 15
      name: useful_life_years
      label: Useful Life in Years
      hint: Expected lifespan
      type: number
      options: []
      required: false
    - id: 16
      name: asset_condition
      label: Current Condition
      hint: State of asset
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Beyond Repair
      required: true
    - id: 17
      name: quantity
      label: Quantity
      hint: Number of items
      type: number
      options: []
      required: true
    - id: 18
      name: unit_of_measure
      label: Unit of Measure
      hint: How counted
      type: select_one
      options:
      - Each
      - Set
      - Pair
      - Dozen
      - Box
      - Pallet
      required: true
    - id: 19
      name: assigned_to
      label: Assigned To
      hint: Who uses it
      type: text
      options: []
      required: false
    - id: 20
      name: department
      label: Department
      hint: Which department
      type: text
      options: []
      required: true
    - id: 21
      name: custodian
      label: Custodian Name
      hint: Person responsible
      type: text
      options: []
      required: false
    - id: 22
      name: maintenance_schedule
      label: Maintenance Schedule
      hint: When maintained
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Semi-Annual
      - Annual
      - As Needed
      - None
      required: true
    - id: 23
      name: last_maintenance_date
      label: Last Maintenance Date
      hint: When last serviced
      type: date
      options: []
      required: false
    - id: 24
      name: next_maintenance_due
      label: Next Maintenance Due
      hint: When next service
      type: date
      options: []
      required: false
    - id: 25
      name: warranty_status
      label: Warranty Status
      hint: Coverage status
      type: select_one
      options:
      - Under Warranty
      - Extended Warranty
      - Expired
      - No Warranty
      required: true
    - id: 26
      name: warranty_expiry
      label: Warranty Expiry Date
      hint: When warranty ends
      type: date
      options: []
      required: false
    - id: 27
      name: insurance_coverage
      label: Is Asset Insured
      hint: Insurance status
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 28
      name: insurance_policy_number
      label: Insurance Policy Number
      hint: Policy identifier
      type: text
      options: []
      required: false
    - id: 29
      name: notes
      label: Additional Notes
      hint: Other information
      type: text
      options: []
      required: false
    - id: 30
      name: photo_attached
      label: Photo Attached
      hint: If photo included
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
