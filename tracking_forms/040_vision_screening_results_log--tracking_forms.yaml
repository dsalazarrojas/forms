inputSchema:
  type: object
  properties:
    title: Vision Screening Results Log
    pages:
    - id: 1
      name: screening_outcome
      label: Screening Outcome
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: screening_date
      label: Screening Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: patient_age
      label: Patient Age
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: screening_location
      label: Screening Location
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: screening_result
      label: Screening Result
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Contact E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
