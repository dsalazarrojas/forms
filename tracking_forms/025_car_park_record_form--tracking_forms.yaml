inputSchema:
  type: object
  properties:
    title: Car Park Record Form
    pages:
    - id: 1
      name: parking_info_header
      label: -- Parking Record --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: vehicle_make_model_park
      label: Car Make and Model
      hint: Identify the vehicle being parked
      type: text
      options: []
      required: true
    - id: 3
      name: vehicle_license_plate
      label: Vehicle License Plate Number
      hint: To identify the vehicle
      type: text
      options: []
      required: true
    - id: 4
      name: vehicle_color_park
      label: Vehicle Color
      hint: Primary color of the vehicle
      type: text
      options: []
      required: true
    - id: 5
      name: vehicle_owner_full_name
      label: Vehicle Owner Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 6
      name: vehicle_owner_phone
      label: Vehicle Owner Phone Number
      hint: Primary contact for the parking record
      type: text
      options: []
      required: true
    - id: 7
      name: vehicle_owner_email
      label: Vehicle Owner Email Address
      hint: For parking record confirmation
      type: email
      options: []
      required: false
    - id: 8
      name: parking_details_header
      label: -- Parking Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: parking_location_name
      label: Parking Location Name
      hint: e.g., North Lot, Level 2, Spot 45
      type: text
      options: []
      required: true
    - id: 10
      name: parking_entry_date
      label: Parking Entry Date
      hint: When did the vehicle enter the lot?
      type: date
      options: []
      required: true
    - id: 11
      name: parking_entry_time
      label: Parking Entry Time
      hint: When did the vehicle enter the lot?
      type: time
      options: []
      required: true
    - id: 12
      name: parking_exit_date
      label: Parking Exit Date
      hint: When did the vehicle exit the lot?
      type: date
      options: []
      required: false
    - id: 13
      name: parking_exit_time
      label: Parking Exit Time
      hint: When did the vehicle exit the lot?
      type: time
      options: []
      required: false
    - id: 14
      name: parking_duration_estimate
      label: Estimated Parking Duration (Hours)
      hint: (If known)
      type: number
      options: []
      required: false
    - id: 15
      name: parking_fee_status
      label: Parking Fee Status
      hint: Select the payment status
      type: select_one
      options:
      - Paid
      - Unpaid
      - Waived
      - Monthly Pass
      required: true
    - id: 16
      name: parking_verification_header
      label: -- Verification --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: parking_record_acknowledgement
      label: I acknowledge the car park record entry
      hint: null
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 18
      name: signature_confirmation_park
      label: Type your name for parking record confirmation
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: additional_parking_comments
      label: Any additional comments or requests?
      hint: Provide more details for the parking record
      type: text
      options: []
      required: false
