inputSchema:
  type: object
  properties:
    title: Temperature Record Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: temperature_reading1
      label: Temperature Reading 1
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: temperature_reading2
      label: Temperature Reading 2
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_recorded
      label: Date Recorded
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: time_recorded
      label: Time Recorded
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: user_temperature
      label: User Temperature
      hint: null
      type: select_one
      options:
      - Low
      - Normal
      - High
      required: true
    - id: 7
      name: user_note
      label: User Note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: temperature_unit
      label: Temperature Unit
      hint: null
      type: select_multiple
      options:
      - Celsius
      - Fahrenheit
      required: true
    - id: 9
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - User 1
      - User 2
      required: true
