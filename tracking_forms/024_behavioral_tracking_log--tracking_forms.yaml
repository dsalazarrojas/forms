inputSchema:
  type: object
  properties:
    title: Behavioral Tracking Log
    pages:
    - id: 1
      name: section_student
      label: -- Student/Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student/Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student/Client ID
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: grade_or_age
      label: Grade Level or Age
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: staff_member
      label: Staff Member Recording
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_incident
      label: -- Behavioral Incident Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: incident_date
      label: Date of Incident
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: incident_time
      label: Time of Incident
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: location
      label: Location of Incident
      hint: Classroom, hallway, cafeteria, etc.
      type: select_one
      options:
      - Classroom
      - Hallway
      - Cafeteria
      - Playground
      - Restroom
      - Library
      - Office
      - Parking Lot
      - Other
      required: true
    - id: 10
      name: behavior_description
      label: Description of Behavior
      hint: What specific behavior occurred
      type: text
      options: []
      required: true
    - id: 11
      name: behavior_type
      label: Type of Behavior
      hint: null
      type: select_one
      options:
      - Verbal Aggression
      - Physical Aggression
      - Defiance
      - Disruption
      - Disrespect
      - Property Damage
      - Safety Concern
      - Other
      required: true
    - id: 12
      name: behavior_severity
      label: Severity Level
      hint: null
      type: select_one
      options:
      - Minor
      - Moderate
      - Serious
      - Severe
      required: true
    - id: 13
      name: trigger_event
      label: Triggering Event or Antecedent
      hint: What preceded the behavior
      type: text
      options: []
      required: false
    - id: 14
      name: people_involved
      label: Other People Involved
      hint: Names or roles of witnesses
      type: text
      options: []
      required: false
    - id: 15
      name: section_intervention
      label: -- Intervention Response --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: immediate_action
      label: Immediate Action Taken
      hint: How was the incident addressed
      type: text
      options: []
      required: true
    - id: 17
      name: intervention_type
      label: Type of Intervention
      hint: null
      type: select_one
      options:
      - Verbal Redirect
      - Loss of Privilege
      - Time Out
      - Parent Contact
      - Office Referral
      - Suspension
      - Other
      required: true
    - id: 18
      name: student_response
      label: Student Response to Intervention
      hint: How did student respond
      type: select_one
      options:
      - Positive
      - Neutral
      - Negative
      - Escalated
      required: true
    - id: 19
      name: section_followup
      label: -- Follow-up Plan --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: followup_needed
      label: Follow-up Actions Needed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 21
      name: followup_description
      label: Description of Follow-up
      hint: Parent contact, counselor referral, etc.
      type: text
      options: []
      required: false
    - id: 22
      name: followup_date
      label: Scheduled Follow-up Date
      hint: null
      type: date
      options: []
      required: false
    - id: 23
      name: contacted_parents
      label: Parents Contacted
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Scheduled
      required: false
    - id: 24
      name: contact_date
      label: Date of Parent Contact
      hint: null
      type: date
      options: []
      required: false
    - id: 25
      name: additional_notes
      label: Additional Notes or Observations
      hint: null
      type: text
      options: []
      required: false
