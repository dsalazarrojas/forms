inputSchema:
  type: object
  properties:
    title: Facility Access Log
    pages:
    - id: 1
      name: first_page
      label: First Page
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: facility_details
      label: facility_details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: entry_exit_type
      label: Entry or Exit
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: access_level
      label: access_level
      hint: null
      type: select_multiple
      options:
      - High
      - Low
      required: false
    - id: 5
      name: personnel_name
      label: Personnel Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: time_in
      label: Time in
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: time_out
      label: Time out
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: facility_access_log_id
      label: Facility Access Log ID
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: facility_id
      label: Facility ID
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: user_id
      label: User ID
      hint: null
      type: text
      options: []
      required: false
