inputSchema:
  type: object
  properties:
    title: Medical Center Online Screening Form
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: medical_history
      label: Medical History
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: patient_assessments
      label: Patient Assessments
      hint: null
      type: select_one
      options:
      - Hypertension
      - Diabetes
      - Asthma
      - Cancer
      - Hypothyroidism
      - Allergies
      required: false
    - id: 4
      name: contact_info
      label: Contact Information
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: medical_contact
      label: Medical Contact
      hint: null
      type: select_one
      options:
      - Primary Care Physician
      - Pediatrician
      - Obstetrician and Gynecologist
      - Cardiologist
      required: false
    - id: 6
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: emergency_info
      label: Emergency Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: insurance_info
      label: Insurance Information
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: patient_notes
      label: Patient Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: medical_notes
      label: Medical Notes
      hint: null
      type: note
      options: []
      required: false
