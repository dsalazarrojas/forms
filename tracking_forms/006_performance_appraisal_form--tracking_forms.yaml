      - 'No'
      required: true
    - id: 6
      name: improvement_areas
      label: Improvement Areas
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: action_plans
      label: Action Plans
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: follow_up
      label: Follow Up
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: employee_signature
      label: Employee Signature
      hint: null
      type: text
      options: []
