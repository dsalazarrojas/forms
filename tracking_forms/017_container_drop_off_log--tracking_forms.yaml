inputSchema:
  type: object
  properties:
    title: Container Drop Off Log
    pages:
    - id: 1
      name: section_delivery_info
      label: -- Delivery Details --
      hint: Please complete this log for each container drop-off.
      type: note
      options: []
      required: false
    - id: 2
      name: container_id
      label: Container Identification Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: container_type
      label: Container Type
      hint: null
      type: select_one
      options:
      - Standard (20ft)
      - Standard (40ft)
      - High Cube (40ft)
      - Refrigerator (40ft)
      - Open Top
      - Other
      required: true
    - id: 4
      name: drop_off_date
      label: Drop-off Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: drop_off_time
      label: Drop-off Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: vehicle_license_plate
      label: Vehicle License Plate Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: driver_name
      label: Driver Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: driver_phone
      label: Driver Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: section_shipment_details
      label: -- Shipment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: shipment_contents
      label: Description of Contents
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: shipment_origin
      label: Shipment Origin
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: recipient_name
      label: Recipient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: recipient_phone
      label: Recipient Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: section_confirmation
      label: -- Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: delivery_confirmed
      label: Delivery Confirmed?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
