inputSchema:
  type: object
  properties:
    title: Issue Tracking Form
    pages:
    - id: 1
      name: prophets
      label: report
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: prophets
      label: issue_type
      hint: null
      type: select_multiple
      options:
      - bug
      - feature request
      - other
      required: false
    - id: 3
      name: prophets
      label: description
      hint: Describe the issue
      type: text
      options: []
      required: false
    - id: 4
      name: prophets
      label: assignee
      hint: Choose an assignee
      type: select_one
      options:
      - open
      - resolved
      - closed
      required: false
