inputSchema:
  type: object
  properties:
    title: Golf Practice Session Log
    pages:
    - id: 1
      name: date
      label: Golf Practice Session
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: session_type
      label: Session Type
      hint: null
      type: select_one
      options:
      - Full Swing
      - Short Game
      - Par 3
      - Putting
      - Other
      required: false
    - id: 3
      name: focus_area
      label: Focus Area
      hint: null
      type: select_multiple
      options:
      - Grip
      - Stance
      - Flexibility
      - Strength
      - Power
      - Accuracy
      required: false
    - id: 4
      name: self_assessment
      label: Self-Assessment
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 5
      name: notes
      label: Notes
      hint: Add notes about this session
      type: note
      options: []
      required: false
