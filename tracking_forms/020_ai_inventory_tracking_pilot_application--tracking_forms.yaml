inputSchema:
  type: object
  properties:
    title: AI Inventory Tracking Pilot Application
    pages:
    - id: 1
      name: organization_profile_header
      label: '--- Organization Profile ---'
      hint: Basic details about the applying entity.
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_name
      label: Primary Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: company_name
      label: Company / Organization Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: business_sector
      label: Business Sector
      hint: null
      type: select_one
      options:
      - Manufacturing
      - Warehousing & Distribution
      - Retail / Consumer Goods
      - Healthcare / Medical Supplies
      - E-commerce
      - Other
      required: true
    - id: 5
      name: inventory_size
      label: Current Inventory Size (Total SKUs)
      hint: Approximate number of unique items tracked.
      type: select_one
      options:
      - Under 1,000
      - 1,000 - 10,000
      - 10,001 - 50,000
      - Over 50,000
      required: true
    - id: 6
      name: current_tracking_methods_header
      label: '--- Current Operations ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: current_system
      label: Current Inventory Management System
      hint: null
      type: select_one
      options:
      - Manual (Paper/Whiteboard)
      - Spreadsheets (Excel / Google Sheets)
      - Dedicated Inventory Software
      - Enterprise Resource Planning (ERP)
      required: true
    - id: 8
      name: number_of_locations
      label: Number of Storage/Warehouse Locations
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: primary_challenges
      label: Primary Inventory Challenges
      hint: Select the top 3 challenges you hope to solve.
      type: select_multiple
      options:
      - Low Inventory Accuracy
      - Frequent Stockouts / Overstocks
      - Inaccurate Demand Forecasting
      - Time-consuming Manual Audits
      - Poor Visibility Across Multiple Sites
      required: true
    - id: 10
      name: pilot_interest_header
      label: '--- Pilot Program Details ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: desired_ai_features
      label: Desired AI Features for Evaluation
      hint: Which AI capabilities are most important to you?
      type: select_multiple
      options:
      - Predictive Demand Forecasting
      - Computer Vision for Visual Counting
      - Anomaly Detection (Theft/Damage/Loss)
      - Automated Reorder Optimization
      - Warehouse Slotting Optimization
      required: true
    - id: 12
      name: technical_readiness
      label: Technical Infrastructure Readiness
      hint: Does your facility have reliable internet and hardware?
      type: select_one
      options:
      - High Readiness (Reliable Fiber/Cloud Integrated)
      - Moderate Readiness (Standard Internet/Willing to upgrade)
      - Low Readiness (Spotty connection/Legacy hardware)
      required: true
    - id: 13
      name: historical_data_availability
      label: Do you have at least 12 months of historical inventory data available?
      hint: Needed for training AI models.
      type: select_one
      options:
      - Yes, structured and digital
      - Yes, but needs cleaning
      - 'False'
      required: true
    - id: 14
      name: proposed_pilot_start_date
      label: Preferred Pilot Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: staff_involvement_count
      label: Estimated number of staff participating in the pilot
      hint: null
      type: number
      options: []
      required: true
    - id: 16
      name: expected_outcomes
      label: Expected Success Metrics
      hint: What does a "successful" pilot look like for your organization?
      type: text
      options: []
      required: true
    - id: 17
      name: budget_status
      label: Budget Authorization Status
      hint: null
      type: select_one
      options:
      - Budget Approved for Pilot
      - Seeking Approval / Research phase
      - Requesting Fully Funded Pilot (Grant)
      required: true
    - id: 18
      name: nda_acceptance
      label: Are you willing to sign a Non-Disclosure Agreement (NDA)?
      hint: null
      type: select_one
      options:
      - 'True'
      - No / Need Legal Review
      required: true
