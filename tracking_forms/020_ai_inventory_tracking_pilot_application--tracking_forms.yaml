inputSchema:
  type: object
  properties:
    title: AI Inventory Tracking Pilot Application
    pages:
    - id: 1
      name: organization_profile_header
      label: '--- Organization Profile ---'
      hint: Basic details about the applying entity.
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_name
      label: Primary Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: company_name
      label: Company / Organization Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: business_sector
      label: Business Sector
      hint: null
      type: select_one
      options:
      - label: Manufacturing
        value: manufacturing
      - label: Warehousing & Distribution
        value: warehousing
      - label: Retail / Consumer Goods
        value: retail
      - label: Healthcare / Medical Supplies
        value: healthcare
      - label: E-commerce
        value: ecommerce
      - label: Other
        value: other
      required: true
    - id: 5
      name: inventory_size
      label: Current Inventory Size (Total SKUs)
      hint: Approximate number of unique items tracked.
      type: select_one
      options:
      - label: Under 1,000
        value: under_1k
      - label: 1,000 - 10,000
        value: 1k_10k
      - label: 10,001 - 50,000
        value: 10k_50k
      - label: Over 50,000
        value: over_50k
      required: true
    - id: 6
      name: current_tracking_methods_header
      label: '--- Current Operations ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: current_system
      label: Current Inventory Management System
      hint: null
      type: select_one
      options:
      - label: Manual (Paper/Whiteboard)
        value: manual
      - label: Spreadsheets (Excel / Google Sheets)
        value: spreadsheets
      - label: Dedicated Inventory Software
        value: dedicated_sw
      - label: Enterprise Resource Planning (ERP)
        value: erp
      required: true
    - id: 8
      name: number_of_locations
      label: Number of Storage/Warehouse Locations
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: primary_challenges
      label: Primary Inventory Challenges
      hint: Select the top 3 challenges you hope to solve.
      type: select_multiple
      options:
      - label: Low Inventory Accuracy
        value: accuracy
      - label: Frequent Stockouts / Overstocks
        value: stock_balance
      - label: Inaccurate Demand Forecasting
        value: forecasting
      - label: Time-consuming Manual Audits
        value: manual_audits
      - label: Poor Visibility Across Multiple Sites
        value: visibility
      required: true
    - id: 10
      name: pilot_interest_header
      label: '--- Pilot Program Details ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: desired_ai_features
      label: Desired AI Features for Evaluation
      hint: Which AI capabilities are most important to you?
      type: select_multiple
      options:
      - label: Predictive Demand Forecasting
        value: predictive_demand
      - label: Computer Vision for Visual Counting
        value: computer_vision
      - label: Anomaly Detection (Theft/Damage/Loss)
        value: anomaly_detection
      - label: Automated Reorder Optimization
        value: reorder_opt
      - label: Warehouse Slotting Optimization
        value: slotting
      required: true
    - id: 12
      name: technical_readiness
      label: Technical Infrastructure Readiness
      hint: Does your facility have reliable internet and hardware?
      type: select_one
      options:
      - label: High Readiness (Reliable Fiber/Cloud Integrated)
        value: high
      - label: Moderate Readiness (Standard Internet/Willing to upgrade)
        value: moderate
      - label: Low Readiness (Spotty connection/Legacy hardware)
        value: low
      required: true
    - id: 13
      name: historical_data_availability
      label: Do you have at least 12 months of historical inventory data available?
      hint: Needed for training AI models.
      type: select_one
      options:
      - label: Yes, structured and digital
        value: yes_structured
      - label: Yes, but needs cleaning
        value: yes_unstructured
      - label: false
        value: false
      required: true
    - id: 14
      name: proposed_pilot_start_date
      label: Preferred Pilot Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: staff_involvement_count
      label: Estimated number of staff participating in the pilot
      hint: null
      type: number
      options: []
      required: true
    - id: 16
      name: expected_outcomes
      label: Expected Success Metrics
      hint: What does a "successful" pilot look like for your organization?
      type: text
      options: []
      required: true
    - id: 17
      name: budget_status
      label: Budget Authorization Status
      hint: null
      type: select_one
      options:
      - label: Budget Approved for Pilot
        value: approved
      - label: Seeking Approval / Research phase
        value: seeking
      - label: Requesting Fully Funded Pilot (Grant)
        value: grant
      required: true
    - id: 18
      name: nda_acceptance
      label: Are you willing to sign a Non-Disclosure Agreement (NDA)?
      hint: null
      type: select_one
      options:
      - label: true
        value: true
      - label: No / Need Legal Review
        value: legal_review
      required: true
