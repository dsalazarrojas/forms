inputSchema:
  type: object
  properties:
    title: Rotary Club Membership Application Form
    pages:
    - id: 1
      name: application_reason
      label: Application Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: previous_affiliations
      label: Previous Affiliations
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: reason_for_joining
      label: Reason for Joining
      hint: null
      type: select_one
      options:
      - Membership benefits
      - Volunteer opportunities
      - Networking
      required: false
    - id: 4
      name: privileges
      label: Privileges
      hint: You will have the opportunity to participate in community service projects,
        leadership development, and networking events.
      type: text
      options: []
      required: false
    - id: 5
      name: responsibilities
      label: Responsibilities
      hint: You are expected to pay dues, attend regular meetings, and participate
        in club events.
      type: text
      options: []
      required: false
    - id: 6
      name: contact_details
      label: Contact Details
      hint: null
      type: select_multiple
      options:
      - Name
      - Email
      - Phone
      required: false
    - id: 7
      name: confirm
      label: Confirm
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
