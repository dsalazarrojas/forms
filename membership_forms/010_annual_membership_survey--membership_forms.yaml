inputSchema:
  type: object
  properties:
    title: Annual Membership Survey
    pages:
    - id: 1
      name: member_name
      label: Your Name
      hint: First and last name
      type: text
      options: []
      required: false
    - id: 2
      name: member_email
      label: Email Address
      hint: For follow-up communication if needed
      type: email
      options: []
      required: true
    - id: 3
      name: member_id
      label: Member ID Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: membership_type
      label: Membership Type
      hint: null
      type: select_one
      options:
      - Standard
      - Premium
      - VIP
      - Corporate
      - Family
      - Trial
      required: true
    - id: 5
      name: membership_duration
      label: How long have you been a member
      hint: null
      type: select_one
      options:
      - Less than 6 months
      - 6 months - 1 year
      - 1-2 years
      - 2-5 years
      - More than 5 years
      required: true
    - id: 6
      name: primary_use
      label: Primary use of membership
      hint: Main reason you joined
      type: text
      options: []
      required: false
    - id: 7
      name: usage_frequency
      label: How often do you use the membership
      hint: null
      type: select_one
      options:
      - Daily
      - Several times per week
      - Weekly
      - Monthly
      - Rarely
      required: true
    - id: 8
      name: features_used
      label: Features you use most
      hint: null
      type: select_multiple
      options:
      - Access to content
      - Community forum
      - Training materials
      - Exclusive events
      - Premium support
      - Tools and resources
      - Downloads
      required: false
    - id: 9
      name: feature_satisfaction
      label: Satisfaction with available features
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 10
      name: value_received
      label: Membership provides good value
      hint: null
      type: select_one
      options:
      - Strongly agree
      - Agree
      - Neutral
      - Disagree
      - Strongly disagree
      required: true
    - id: 11
      name: price_fairness
      label: Price is fair for the benefits
      hint: null
      type: select_one
      options:
      - Strongly agree
      - Agree
      - Neutral
      - Disagree
      - Strongly disagree
      required: true
    - id: 12
      name: cost_would_pay
      label: Highest price you would pay
      hint: For your membership level
      type: number
      options: []
      required: false
    - id: 13
      name: customer_support_rating
      label: Quality of customer support
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very poor
      required: true
    - id: 14
      name: technical_experience
      label: Technical experience with platform
      hint: null
      type: select_one
      options:
      - Very easy to use
      - Easy to use
      - Neutral
      - Difficult to use
      - Very difficult to use
      required: true
    - id: 15
      name: missing_features
      label: Features you wish were included
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: improvements_suggested
      label: Suggestions for improvement
      hint: How could we serve you better
      type: text
      options: []
      required: false
    - id: 17
      name: upgrade_interest
      label: Interest in upgrading membership level
      hint: null
      type: select_one
      options:
      - Very interested
      - Interested
      - Possibly
      - Not interested
      - Not applicable
      required: true
    - id: 18
      name: renewal_intention
      label: Will you renew your membership
      hint: null
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Unsure
      - Probably no
      - Definitely no
      required: true
    - id: 19
      name: cancellation_reason
      label: If considering cancellation - reason why
      hint: Only if applicable
      type: text
      options: []
      required: false
    - id: 20
      name: recommend_friends
      label: Would you recommend to friends or colleagues
      hint: null
      type: select_one
      options:
      - Definitely
      - Probably
      - Unsure
      - Probably not
      - Definitely not
      required: true
