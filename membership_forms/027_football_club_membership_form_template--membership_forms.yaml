inputSchema:
  type: object
  properties:
    title: Football Club Membership Form Template
    pages:
    - id: 1
      name: general_info
      label: general_info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: player_details
      label: player_details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: emergency_contact
      label: emergency_contact
      hint: Who is your emergency contact?
      type: text
      options: []
      required: false
    - id: 4
      name: contact_info
      label: contact_info
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: payment_info
      label: payment_info
      hint: How would you like to pay?
      type: select_one
      options:
      - Membership Fee
      - Subscription Fee
      - Both
      required: false
    - id: 6
      name: payment_details
      label: payment_details
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: membership_status
      label: membership_status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 8
      name: membership_type
      label: membership_type
      hint: null
      type: select_one
      options:
      - Individual
      - Family
      - Group
      required: false
    - id: 9
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
