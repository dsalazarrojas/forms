inputSchema:
  type: object
  properties:
    title: Community Contact Form
    pages:
    - id: 1
      name: contact_name
      label: Contact name
      hint: Person reaching out
      type: text
      options: []
      required: true
    - id: 2
      name: contact_email
      label: Contact email
      hint: Where replies will be sent
      type: email
      options: []
      required: true
    - id: 3
      name: contact_phone
      label: Contact phone
      hint: Optional phone for follow up
      type: text
      options: []
      required: false
    - id: 4
      name: organization
      label: Organization name
      hint: Optional affiliation
      type: text
      options: []
      required: false
    - id: 5
      name: reason_for_contact
      label: Reason for contact
      hint: Brief description of inquiry
      type: text
      options: []
      required: true
    - id: 6
      name: preferred_response_method
      label: Preferred response method
      hint: Choose how you prefer to be contacted
      type: select_one
      options:
      - Email
      - Phone
      - In person
      required: false
    - id: 7
      name: urgency
      label: Urgency level
      hint: How quickly do you need a response
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
