inputSchema:
  type: object
  properties:
    title: Fitness Membership Payment Form
    pages:
    - id: 1
      name: membership_enrollment
      label: membership_enrollment
      hint: null
      type: note
      options: []
      required: true
    - id: 2
      name: member_name
      label: member_name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: phone_number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: payment_method
      label: payment_method
      hint: null
      type: select_multiple
      options:
      - Bank Transfer
      - Check
      - Online Banking
      - Credit Card
      - PayPal
      required: true
    - id: 6
      name: payment_amount
      label: payment_amount
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: time
      label: time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: membership_plan
      label: membership_plan
      hint: null
      type: select_one
      options:
      - 1 Month
      - 3 Months
      - 6 Months
      - 12 Months
      required: true
    - id: 10
      name: total_cost
      label: total_cost
      hint: null
      type: text
      options: []
      required: true
