      name: membership_tier
      label: Membership tier
      hint: Choose a membership level
      type: select_one
      options:
      - Free
      - Supporter
      - Premium
      required: true
    - id: 6
      name: interests
      label: Interests
      hint: Select all that apply
      type: select_multiple
      options:
      - Events
      - Watch parties
      - Fan art
      - Cosplay
      - Discussion forums
      required: false
    - id: 7
      name: agree_terms
