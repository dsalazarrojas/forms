      name: member_info
      label: -- Membership Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Name for membership record
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: For membership communications
      type: email
      options: []
      required: true
    - id: 4
      name: favorite_anime
      label: Favorite anime title
      hint: Optional but helpful
      type: text
      options: []
      required: false
