inputSchema:
  type: object
  properties:
    title: Alumni Association Membership Registration Form
    pages:
    - id: 1
      name: section_personal_information
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: graduation_year
      label: Graduation year
      hint: Enter the year you graduated
      type: number
      options: []
      required: true
    - id: 4
      name: email
      label: Email address
      hint: Preferred contact email
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone number
      hint: Optional phone number
      type: text
      options: []
      required: false
    - id: 6
      name: degree_program
      label: Degree or program
      hint: e.g. BA Biology
      type: text
      options: []
      required: false
    - id: 7
      name: current_affiliation
      label: Current affiliation
      hint: Employer or city
      type: text
      options: []
      required: false
    - id: 8
      name: membership_type
      label: Membership type
      hint: Choose the option that applies
      type: select_one
      options:
      - Standard
      - Lifetime
      - Student
      required: true
    - id: 9
      name: areas_of_interest
      label: Areas of interest
      hint: Select all that apply
      type: select_multiple
      options:
      - Networking
      - Events
      - Mentoring
      - Fundraising
      required: false
    - id: 10
      name: comments
      label: Additional comments
      hint: Optional notes
      type: text
      options: []
      required: false
