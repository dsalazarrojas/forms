inputSchema:
  type: object
  properties:
    title: Club Registration
    pages:
    - id: 1
      name: registrant_name
      label: Full Name
      hint: Your complete legal name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Primary email for communications
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: age
      label: Age
      hint: Your current age
      type: number
      options: []
      required: true
    - id: 5
      name: gender
      label: Gender
      hint: Select your gender identity
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      - Prefer Not to Say
      - Other
      required: false
    - id: 6
      name: occupation
      label: Occupation
      hint: Your current profession or student status
      type: text
      options: []
      required: false
    - id: 7
      name: club_chapter
      label: Club Chapter
      hint: Which chapter would you like to join
      type: select_one
      options:
      - Downtown Chapter
      - Westside Chapter
      - Northside Chapter
      - Eastside Chapter
      - Suburban Chapter
      - Online Chapter
      required: true
    - id: 8
      name: membership_tier
      label: Membership Tier
      hint: Select your preferred membership level
      type: select_one
      options:
      - Standard
      - Gold
      - Platinum
      - Executive
      required: true
    - id: 9
      name: referral_member
      label: Referred By
      hint: Name of member who referred you if applicable
      type: text
      options: []
      required: false
    - id: 10
      name: previous_member
      label: Were You a Member Before
      hint: Have you been a member of this club previously
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 11
      name: participation_goals
      label: What Do You Hope to Gain
      hint: Your goals for joining this club
      type: text
      options: []
      required: false
    - id: 12
      name: availability
      label: Preferred Meeting Times
      hint: When are you typically available
      type: select_multiple
      options:
      - Weekday Mornings
      - Weekday Afternoons
      - Weekday Evenings
      - Weekend Mornings
      - Weekend Afternoons
      - Weekend Evenings
      required: false
    - id: 13
      name: volunteer_interest
      label: Interested in Volunteering
      hint: Would you like to help organize events
      type: select_one
      options:
      - Yes Definitely
      - Maybe
      - No Thanks
      required: false
    - id: 14
      name: skills_to_contribute
      label: Skills You Can Contribute
      hint: What skills can you bring to the club
      type: text
      options: []
      required: false
    - id: 15
      name: payment_option
      label: Payment Option
      hint: How will you pay membership fees
      type: select_one
      options:
      - Monthly Auto-Pay
      - Quarterly Payment
      - Annual Payment
      - Pay Per Event
      required: true
    - id: 16
      name: special_accommodations
      label: Special Accommodations Needed
      hint: Any accessibility needs we should know
      type: text
      options: []
      required: false
    - id: 17
      name: code_of_conduct
      label: I Agree to Follow Club Code of Conduct
      hint: You agree to respect all members and rules
      type: select_one
      options:
      - Yes I Agree
      - false
      required: true
    - id: 18
      name: liability_waiver
      label: I Sign the Liability Waiver
      hint: You understand and accept liability terms
      type: select_one
      options:
      - Yes I Sign
      - false
      required: true
    - id: 19
      name: photo_release
      label: Photo Release Authorization
      hint: Allow club to use your photo in materials
      type: select_one
      options:
      - Yes I Authorize
      - No I Do Not
      required: false
    - id: 20
      name: additional_comments
      label: Additional Comments
      hint: Anything else you want to share
      type: text
      options: []
      required: false
