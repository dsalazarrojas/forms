inputSchema:
  type: object
  properties:
    title: Fitness Flyer Form
    pages:
    - id: 1
      name: enrollment_date
      label: Enrollment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: program_selection
      label: Program Selection
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: fitness_goals
      label: Fitness Goals
      hint: null
      type: select_one
      options:
      - Enroll in a fitness program
      - Get a workout plan
      - Get a gym membership
      - Get a free trial class
      required: false
    - id: 8
      name: membership_type
      label: Membership Type
      hint: null
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Yearly
      required: true
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: program_start_date
      label: Program Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: program_end_date
      label: Program End Date
      hint: null
      type: date
      options: []
      required: false
