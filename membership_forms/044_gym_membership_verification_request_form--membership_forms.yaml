inputSchema:
  type: object
  properties:
    title: Gym Membership Verification Request Form
    pages:
    - id: 1
      name: member_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: member_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: member_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: document_type
      label: Document Type
      hint: null
      type: select_one
      options:
      - '{''label'': ''Member ID Card''}'
      - '{''label'': ''Proof of Residence''}'
      - '{''label'': ''Proof of Income''}'
      - '{''label'': ''Other''}'
      required: true
    - id: 5
      name: document_upload
      label: Document Upload
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: consent_to_share
      label: Consent to Share
      hint: null
      type: select_one
      options:
      - '{''label'': True}'
      - '{''label'': False}'
      required: true
    - id: 7
      name: consent_to_use
      label: Consent to Use
      hint: null
      type: select_one
      options:
      - '{''label'': True}'
      - '{''label'': False}'
      required: true
    - id: 8
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: true
