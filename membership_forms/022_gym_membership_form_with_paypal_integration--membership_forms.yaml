inputSchema:
  type: object
  properties:
    title: Gym Membership Form With PayPal Integration
    pages:
    - id: 1
      name: new_membership
      label: New Membership
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: member_details
      label: Member Details
      hint: Enter member details
      type: text
      options: []
      required: false
    - id: 3
      name: payment_details
      label: Payment Details
      hint: Enter payment details
      type: text
      options: []
      required: false
    - id: 4
      name: confirm_payment
      label: Confirm Payment
      hint: Confirm payment details
      type: text
      options: []
      required: false
    - id: 5
      name: review_and_submit
      label: Review and Submit
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: membership_plan
      label: Membership Plan
      hint: Select membership plan
      type: select_one
      options:
      - '{''value'': ''Monthly Membership'', ''label'': ''Monthly Membership''}'
      - '{''value'': ''Yearly Membership'', ''label'': ''Yearly Membership''}'
      - '{''value'': ''Monthly Plus'', ''label'': ''Monthly Plus''}'
      required: false
    - id: 7
      name: membership_terms_and_conditions
      label: Membership Terms and Conditions
      hint: Accept our membership terms and conditions
      type: note
      options: []
      required: false
    - id: 8
      name: submit_button
      label: Submit
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: payment_amount
      label: Payment Amount
      hint: Enter payment amount
      type: number
      options: []
      required: false
    - id: 10
      name: payment_method
      label: Payment Method
      hint: Select a payment method
      type: select_one
      options:
      - '{''value'': ''PayPal'', ''label'': ''PayPal''}'
      - '{''value'': ''Bank Transfer'', ''label'': ''Bank Transfer''}'
      - '{''value'': ''Cash'', ''label'': ''Cash''}'
      required: false
    - id: 11
      name: confirm_payment_method
      label: Confirm Payment Method
      hint: Confirm payment method
      type: select_one
      options:
      - '{''value'': ''PayPal'', ''label'': ''PayPal''}'
      - '{''value'': ''Bank Transfer'', ''label'': ''Bank Transfer''}'
      - '{''value'': ''Cash'', ''label'': ''Cash''}'
      required: false
    - id: 12
      name: payment_date
      label: Payment Date
      hint: Enter payment date
      type: date
      options: []
      required: false
