inputSchema:
  type: object
  properties:
    title: Fishing Club Membership Form
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: Date of birth
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: membership_type
      label: Membership type
      hint: null
      type: select_one
      options:
      - Fishing
      - Social
      - Family
      - Other
      required: false
    - id: 5
      name: payment_method
      label: Payment method
      hint: null
      type: select_multiple
      options:
      - Bank transfer
      - PayPal
      - Credit card
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
