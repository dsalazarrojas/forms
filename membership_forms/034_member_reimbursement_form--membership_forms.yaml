inputSchema:
  type: object
  properties:
    title: Member Reimbursement Form
    pages:
    - id: 1
      name: member_info
      label: Member Information
      hint: Enter member information here
      type: text
      options: []
      required: true
    - id: 2
      name: expense_date
      label: Expense Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: prophets_type
      label: Expense Type
      hint: null
      type: select_one
      options:
      - ประกExpense for Membership Membership Fee Other Reimbursement for Meeting
        Expenses
      - Other
      required: true
    - id: 4
      name: expense_amount
      label: Expense Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cheque Wire Transfer Online Payment
      - Other
      required: true
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: true
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
