inputSchema:
  type: object
  properties:
    title: Sample Scholarship Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: scholarship_type
      label: Scholarship Type
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Merit''}'
      - '{''id'': 2, ''name'': ''Need-Based''}'
      - '{''id'': 3, ''name'': ''Combination''}'
      required: true
    - id: 7
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: zip
      label: Zip
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: country
      label: Country
      hint: null
      type: text
      options: []
      required: false
