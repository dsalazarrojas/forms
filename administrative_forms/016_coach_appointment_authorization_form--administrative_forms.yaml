inputSchema:
  type: object
  properties:
    title: Coach Appointment Authorization Form
    pages:
    - id: 1
      name: client_name
      label: Client Full Name
      hint: Your legal full name
      type: text
      options: []
      required: true
    - id: 2
      name: client_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: For identification purposes
      type: date
      options: []
      required: false
    - id: 5
      name: coach_name
      label: Coach Name
      hint: Name of coach you want to see
      type: text
      options: []
      required: true
    - id: 6
      name: coaching_service
      label: Coaching Service Type
      hint: What type of coaching do you need
      type: select_one
      options:
      - Health Coaching
      - Wellness Coaching
      - Nutrition Coaching
      - Fitness Coaching
      - Life Coaching
      - Career Coaching
      - Executive Coaching
      - Relationship Coaching
      required: true
    - id: 7
      name: preferred_date
      label: Preferred Appointment Date
      hint: First choice for appointment
      type: date
      options: []
      required: true
    - id: 8
      name: preferred_time
      label: Preferred Time
      hint: What time works best
      type: select_one
      options:
      - Morning 8AM-12PM
      - Afternoon 12PM-5PM
      - Evening 5PM-8PM
      - Weekend Available
      required: true
    - id: 9
      name: session_format
      label: Session Format
      hint: How do you want to meet
      type: select_one
      options:
      - In Person
      - Video Conference
      - Phone Call
      - No Preference
      required: true
    - id: 10
      name: session_duration
      label: Session Duration
      hint: How long should the session be
      type: select_one
      options:
      - 30 Minutes
      - 45 Minutes
      - 60 Minutes
      - 90 Minutes
      required: true
    - id: 11
      name: first_time_client
      label: Is This Your First Session
      hint: Have you had coaching before
      type: select_one
      options:
      - Yes First Time
      - No Returning Client
      required: true
    - id: 12
      name: previous_coach
      label: Previous Coach Name
      hint: If you had a coach before who was it
      type: text
      options: []
      required: false
    - id: 13
      name: reason_for_coaching
      label: Reason for Seeking Coaching
      hint: What brings you to coaching
      type: text
      options: []
      required: true
    - id: 14
      name: goals
      label: Primary Goals
      hint: What do you want to achieve
      type: text
      options: []
      required: true
    - id: 15
      name: medical_conditions
      label: Relevant Medical Conditions
      hint: Any conditions your coach should know
      type: text
      options: []
      required: false
    - id: 16
      name: medications
      label: Current Medications
      hint: List any relevant medications
      type: text
      options: []
      required: false
    - id: 17
      name: authorization_consent
      label: I Authorize Coaching Services
      hint: You consent to receive coaching
      type: select_one
      options:
      - Yes I Authorize
      - false
      required: true
    - id: 18
      name: privacy_policy
      label: Privacy Policy Accepted
      hint: You agree to privacy terms
      type: select_one
      options:
      - Yes I Accept
      - false
      required: true
    - id: 19
      name: cancellation_policy
      label: Cancellation Policy Understood
      hint: You understand cancellation terms
      type: select_one
      options:
      - Yes I Understand
      - No I Need Review
      required: true
    - id: 20
      name: payment_authorization
      label: Payment Method Authorization
      hint: You authorize payment for services
      type: select_one
      options:
      - Yes I Authorize
      - false
      required: true
    - id: 21
      name: reminder_preference
      label: Appointment Reminder Preference
      hint: How should we remind you
      type: select_one
      options:
      - Email Only
      - Text Only
      - Email and Text
      - Phone Call
      - No Reminders
      required: false
    - id: 22
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Who should we contact in emergency
      type: text
      options: []
      required: false
    - id: 23
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Emergency contact number
      type: text
      options: []
      required: false
    - id: 24
      name: referral_source
      label: How Did You Hear About Us
      hint: How did you find our services
      type: select_one
      options:
      - Online Search
      - Social Media
      - Referral
      - Advertisement
      - Previous Client
      - Other
      required: false
    - id: 25
      name: signature_date
      label: Date of Authorization
      hint: Today date
      type: date
      options: []
      required: true
