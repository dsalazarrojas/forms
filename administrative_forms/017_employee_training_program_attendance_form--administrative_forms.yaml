inputSchema:
  type: object
  properties:
    title: Employee Training Program Attendance Form
    pages:
    - id: 1
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: training_session_id
      label: Training Session ID
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: training_session_date
      label: Training Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: attendance_status
      label: Attendance Status
      hint: null
      type: select_one
      options:
      - '{''label'': ''Absent''}'
      - '{''label'': ''Present''}'
      - '{''label'': ''Late''}'
      required: true
    - id: 6
      name: session_start_time
      label: Session Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: session_end_time
      label: Session End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: total_attendance
      label: Total Attendance
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
