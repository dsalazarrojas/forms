inputSchema:
  type: object
  properties:
    title: Fabrication Inspection Process Form
    pages:
    - id: 1
      name: manufacturing_site
      label: Manufacturing Site
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: equipment_type
      label: Equipment Type
      hint: Select equipment type.
      type: select_one
      options:
      - CNC Machine
      - Manual
      - Other
      required: true
    - id: 3
      name: fabrication_process
      label: Fabrication Process
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: inspection_date
      label: Inspection Date
      hint: Date of inspection.
      type: date
      options: []
      required: true
    - id: 5
      name: inspector_name
      label: Inspector Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: fabrication_inspection_process_notes
      label: Fabrication Inspection Process Notes
      hint: null
      type: text
      options: []
      required: false
