inputSchema:
  type: object
  properties:
    title: Public Utility Incident Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: incident_date
      label: Incident Date
      hint: Date of incident
      type: date
      options: []
      required: false
    - id: 3
      name: incident_time
      label: Incident Time
      hint: Time of incident
      type: time
      options: []
      required: false
    - id: 4
      name: service_affected
      label: Service Affected
      hint: null
      type: select_one
      options:
      - Service 1
      - Service 2
      - Service 3
      required: false
    - id: 5
      name: incident_description
      label: Incident Description
      hint: Briefly describe the incident
      type: text
      options: []
      required: false
    - id: 6
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: utility_company
      label: Utility Company
      hint: null
      type: select_one
      options:
      - Company A
      - Company B
      - Company C
      required: false
    - id: 10
      name: incident_location
      label: Incident Location
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: customer_message
      label: Customer Message
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
