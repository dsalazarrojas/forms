inputSchema:
  type: object
  properties:
    title: Board Meeting Minutes Access Form
    pages:
      - id: 1
        name: request_header
        label: -- Minutes Access Request --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: requester_name
        label: Requester name
        hint: Board member or staff name
        type: text
        options: []
        required: true
      - id: 3
        name: requester_email
        label: Requester email
        hint: For delivery of minutes
        type: email
        options: []
        required: true
      - id: 4
        name: meeting_date
        label: Meeting date
        hint: Date of minutes requested
        type: date
        options: []
        required: true
      - id: 5
        name: access_type
        label: Access type
        hint: Level of access requested
        type: select_one
        options:
          - View only
          - Download
          - Annotate
        required: true
      - id: 6
        name: purpose
        label: Purpose for access
        hint: Reason for requesting minutes
        type: text
        options: []
        required: false
      - id: 7
        name: approver_name
        label: Approver name
        hint: Name of person approving access
        type: text
        options: []
        required: false
      - id: 8
        name: required_by_date
        label: Required by date
        hint: When the minutes are needed
        type: date
        options: []
        required: false
