inputSchema:
  type: object
  properties:
    title: Athletic Field Inspection Form
    pages:
      - id: 1
        name: inspection_date
        label: Inspection Date
        hint: Date the field inspection was conducted
        type: date
        options: []
        required: true
      - id: 2
        name: inspector_name
        label: Inspector Name
        hint: Full name of person conducting inspection
        type: text
        options: []
        required: true
      - id: 3
        name: field_name
        label: Field Name
        hint: Identifier or location of the field
        type: text
        options: []
        required: true
      - id: 4
        name: field_type
        label: Field Type
        hint: What sport is played on this field?
        type: select_one
        options: ['Baseball', 'Football', 'Soccer', 'Softball', 'Track', 'Tennis', 'Multi-Sport', 'Other']
        required: true
      - id: 5
        name: surface_condition
        label: Playing Surface Condition
        hint: Rate the overall condition of the field surface
        type: select_one
        options: ['Excellent', 'Good', 'Fair', 'Poor', 'Unplayable']
        required: true
      - id: 6
        name: drainage_assessment
        label: Drainage Assessment
        hint: How well does water drain from the field?
        type: select_one
        options: ['Excellent', 'Good', 'Fair', 'Poor']
        required: true
      - id: 7
        name: grass_condition
        label: Grass/Turf Condition
        hint: Assess vegetation coverage and health
        type: select_one
        options: ['Excellent', 'Good', 'Fair', 'Poor', 'Not Applicable']
        required: true
      - id: 8
        name: surface_hazards
        label: Surface Hazards Identified
        hint: Check all hazards observed
        type: select_multiple
        options: ['Divots/Holes', 'Debris', 'Bare Patches', 'Ruts', 'Uneven Areas', 'None']
        required: false
      - id: 9
        name: hazard_severity
        label: Hazard Severity Level
        hint: How severe are identified hazards?
        type: select_one
        options: ['None', 'Minor', 'Moderate', 'Severe', 'Critical']
        required: true
      - id: 10
        name: equipment_condition
        label: Equipment Condition
        hint: Condition of goals, nets, bleachers, etc.
        type: select_one
        options: ['Excellent', 'Good', 'Fair', 'Poor', 'Needs Replacement']
        required: true
      - id: 11
        name: safety_violations
        label: Safety Violations Found
        hint: Check any safety issues observed
        type: select_multiple
        options: ['Missing/Broken Fencing', 'Poor Lighting', 'Inadequate Seating', 'Maintenance Issues', 'Pest Activity', 'None']
        required: false
      - id: 12
        name: field_clearance
        label: Field Clearance Status
        hint: Is the field clear of obstructions?
        type: select_one
        options: ['Clear', 'Minor Obstructions', 'Moderate Obstructions', 'Heavily Obstructed']
        required: true
      - id: 13
        name: weather_conditions
        label: Weather Conditions During Inspection
        hint: Current weather at time of inspection
        type: select_one
        options: ['Sunny', 'Cloudy', 'Rainy', 'Wet', 'Muddy', 'Frozen']
        required: false
      - id: 14
        name: markings_condition
        label: Field Markings Condition
        hint: Assess paint, lines, and field markings
        type: select_one
        options: ['Clear and Visible', 'Faded', 'Partially Visible', 'Not Visible']
        required: true
      - id: 15
        name: lighting_inspection
        label: Lighting Adequacy
        hint: Rate field lighting for evening games
        type: select_one
        options: ['Excellent', 'Good', 'Fair', 'Poor', 'Not Available']
        required: false
      - id: 16
        name: maintenance_recommendations
        label: Maintenance Recommendations
        hint: Describe recommended repairs or maintenance
        type: text
        options: []
        required: false
      - id: 17
        name: urgent_repairs
        label: Urgent Repairs Needed
        hint: List any critical repairs required
        type: text
        options: []
        required: false
      - id: 18
        name: field_closure_recommendation
        label: Field Closure Recommendation
        hint: Should the field be closed to use?
        type: select_one
        options: ['Full Use', 'Limited Use', 'Restricted Use', 'Closure Recommended']
        required: true
      - id: 19
        name: photos_attached
        label: Photos Attached
        hint: Were photographic documents included?
        type: select_one
        options: ['Yes', 'No']
        required: false
      - id: 20
        name: follow_up_date
        label: Recommended Follow-up Inspection Date
        hint: When should the next inspection occur?
        type: date
        options: []
        required: false
      - id: 21
        name: inspector_signature_date
        label: Inspector Signature Date
        hint: Date of inspector signature
        type: date
        options: []
        required: false
