      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: hours_worked
      label: Hours Worked
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: submitted_by
      label: Submitted By
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
