inputSchema:
  type: object
  properties:
    title: Equipment Readiness Checklist
    pages:
    - id: 1
      name: checklist_form
      label: Checklist Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: checklist_section_one
      label: Checklist Section One
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: checklist_section_two
      label: Checklist Section Two
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 4
      name: checklist_section_three
      label: Checklist Section Three
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: checklist_section_four
      label: Checklist Section Four
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: equipment_status
      label: equipment status
      hint: null
      type: select_one
      options:
      - Available
      - Not Available
      required: false
    - id: 7
      name: maintenance_status
      label: maintenance status
      hint: null
      type: select_multiple
      options:
      - In Progress
      - Completed
      - Not Needed
      required: false
    - id: 8
      name: last_maintenance_date
      label: last maintenance date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: last_maintenance_frequency
      label: last maintenance frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
