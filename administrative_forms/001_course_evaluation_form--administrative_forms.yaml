inputSchema:
  type: object
  properties:
    title: Course Evaluation Form
    pages:
    - id: 1
      name: intro
      label: Course Overview
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: course_rating
      label: How would you rate this course?
      hint: Rate on a scale from 1 to 10
      type: number
      options: []
      required: false
    - id: 3
      name: instructor_rating
      label: How would you rate this instructor?
      hint: Rate on a scale from 1 to 10
      type: number
      options: []
      required: false
    - id: 4
      name: course_content
      label: Content of the course
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 5
      name: course_materials
      label: Materials provided for the course
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: learning_experience
      label: Learning experience
      hint: null
      type: select_one
      options:
      - Very Positive
      - Positive
      - Neutral
      - Negative
      - Very Negative
      required: false
    - id: 7
      name: evaluation_comments
      label: Evaluation Comments
      hint: Please provide your feedback about the course
      type: note
      options: []
      required: false
    - id: 8
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: course_recommendation
      label: Would you recommend this course?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: rating_scale
      label: What scale do you prefer?
      hint: null
      type: select_one
      options:
      - 1-10
      - 1-5
      - 1-4
      required: false
    - id: 12
      name: course_feedback
      label: What would you like to see improved in this course?
      hint: null
      type: select_multiple
      options:
      - More frequent exams
      - More challenging problems
      - More resources
      - Less homework
      required: false
    - id: 13
      name: overall_experience
      label: Overall Experience
      hint: null
      type: select_one
      options:
      - Very Positive
      - Positive
      - Neutral
      - Negative
      - Very Negative
      required: false
    - id: 14
      name: time_commitment
      label: Time Commitment
      hint: null
      type: select_one
      options:
      - Just right
      - A bit too long
      - A bit too short
      required: false
    - id: 15
      name: communication
      label: Communication
      hint: null
      type: select_one
      options:
      - Very good
      - Good
      - Fair
      - Poor
      required: false
    - id: 16
      name: feedback
      label: What else would you like to add?
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: course_evaluation
      label: Course Evaluation
      hint: null
      type: select_one
      options:
      - Very good
      - Good
      - Fair
      - Poor
      required: false
    - id: 18
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 19
      name: course_satisfaction
      label: Satisfaction with the course
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: false
    - id: 20
      name: instructor_satisfaction
      label: Satisfaction with the instructor
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: false
    - id: 21
      name: course_value
      label: Overall value of the course
      hint: null
      type: select_one
      options:
      - Very valuable
      - Valuable
      - Neutral
      - Not valuable
      - Not valuable at all
      required: false
    - id: 22
      name: course_achievement
      label: Overall achievement of the course
      hint: null
      type: select_one
      options:
      - Very good
      - Good
      - Fair
      - Poor
      required: false
    - id: 23
      name: course_recommendation
      label: Overall recommendation of the course
      hint: null
      type: select_one
      options:
      - Very good
      - Good
      - Fair
      - Poor
      required: false
    - id: 24
      name: course_rating_2
      label: Would you rate this course?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 25
      name: course_recommendation_2
      label: Would you recommend this course to others?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
