inputSchema:
  type: object
  properties:
    title: Audit Document Download Request Form
    pages:
      - id: 1
        name: section_header
        label: -- Document Access Request --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: requester_name
        label: requester name
        hint: Full legal name of the person requesting the document
        type: text
        options: []
        required: true
      - id: 3
        name: requester_email
        label: requester email
        hint: Work or personal email for correspondence
        type: email
        options: []
        required: true
      - id: 4
        name: department
        label: department
        hint: Department requesting access
        type: select_one
        options:
          - Compliance
          - Finance
          - Operations
          - Legal
          - Other
        required: true
      - id: 5
        name: document_reference
        label: document reference or id
        hint: Enter audit document ID or filename
        type: text
        options: []
        required: true
      - id: 6
        name: purpose_of_request
        label: purpose of request
        hint: Brief reason for downloading this document
        type: text
        options: []
        required: true
      - id: 7
        name: access_level_needed
        label: access level needed
        hint: Select the access level required for the task
        type: select_one
        options:
          - View only
          - Download
          - Edit
        required: true
      - id: 8
        name: requested_date
        label: requested date
        hint: Desired date for document delivery
        type: date
        options: []
        required: true
