inputSchema:
  type: object
  properties:
    title: Suggestion Program Entry Form
    pages:
    - id: 1
      name: program_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: suggestion_type
      label: Suggestion Type
      hint: Select one or more
      type: select_multiple
      options:
      - Suggestion
      - Comment
      required: true
    - id: 3
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: consent_1
      label: I agree
      hint: null
      type: radio
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: consent_2
      label: I do not agree
      hint: null
      type: radio
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: email
      label: Email
      hint: Format - example@example.com
      type: email
      options: []
      required: true
    - id: 7
      name: contact_number
      label: Contact Number
      hint: Format - 1234567890
      type: number
      options: []
      required: true
    - id: 8
      name: suggestion_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: suggestion_time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: suggestion_status
      label: Status
      hint: Select one
      type: select_one
      options:
      - Open
      - Open - pending response
      - Closed
      - Suspended
      required: true
