inputSchema:
  type: object
  properties:
    title: Academic Transcript Request Form
    pages:
    - id: 1
      name: section_personal_details
      label: -- Personal Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name while Enrolled
      hint: Include maiden name if applicable
      type: text
      options: []
      required: true
    - id: 3
      name: student_id_number
      label: Student ID Number
      hint: Your unique university identifier
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: Required for identity verification
      type: date
      options: []
      required: true
    - id: 5
      name: section_contact
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email_address
      label: Email Address
      hint: Where we can send updates
      type: email
      options: []
      required: true
    - id: 7
      name: phone_number
      label: Phone Number
      hint: Contact number for questions
      type: text
      options: []
      required: true
    - id: 8
      name: section_transcript_details
      label: -- Transcript Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: type_of_transcript
      label: Type of Transcript
      hint: Select one
      type: select_one
      options:
      - Official (Sealed)
      - Unofficial (Student Copy)
      required: true
    - id: 10
      name: quantity
      label: Number of Copies
      hint: Enter a whole number
      type: number
      options: []
      required: true
    - id: 11
      name: enrollment_status
      label: Enrollment Status
      hint: Your current status with the institution
      type: select_one
      options:
      - Currently Enrolled
      - Graduated
      - Withdrawn
      required: true
    - id: 12
      name: year_of_graduation
      label: Year of Graduation or Last Attendance
      hint: e.g. 2023
      type: text
      options: []
      required: true
    - id: 13
      name: section_delivery
      label: -- Delivery Options --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: delivery_method
      label: Delivery Method
      hint: How do you want to receive the transcript?
      type: select_one
      options:
      - Pick-up in Person
      - Standard Mail
      - Express Mail
      - Electronic (Secure PDF)
      required: true
    - id: 15
      name: recipient_address
      label: Recipient Address - if mailing
      hint: Provide full address including postal code
      type: text
      options: []
      required: false
    - id: 16
      name: section_auth
      label: -- Authorization --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: authorization_to_release
      label: I authorize the release of my academic transcript to the specified recipient
      hint: Required for processing
      type: select_one
      options:
      - I Authorize
      - Other
      required: true
    - id: 18
      name: digital_signature
      label: Electronic Signature
      hint: Type your full legal name
      type: text
      options: []
      required: true
