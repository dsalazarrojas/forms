inputSchema:
  type: object
  properties:
    title: Employee Relocation Package Accommodation Form
    pages:
    - id: 1
      name: company_location
      label: Company Location
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: job_location
      label: Job Location
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: travel_method
      label: Travel Method
      hint: Please select all that apply
      type: select_multiple
      options:
      - car
      - bus
      - plane
      required: true
    - id: 4
      name: accommodation_method
      label: Accommodation Method
      hint: Please select only one option
      type: select_one
      options:
      - airbnb
      - hotel
      - house
      - flat
      - apartment
      required: true
    - id: 5
      name: travel_date
      label: Travel Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: accommodation_date
      label: Accommodation Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: accommodation_details
      label: Accommodation Details
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: company_phone
      label: Company Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: employee_phone
      label: Employee Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: accommodation_cost
      label: Accommodation Cost
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: accommodation_address
      label: Accommodation Address
      hint: null
      type: text
      options: []
      required: true
