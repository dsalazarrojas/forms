inputSchema:
  type: object
  properties:
    title: Cargo Loss Incident Form
    pages:
    - id: 1
      name: incident_header
      label: Cargo Loss Incident Report
      hint: Document all details of the cargo loss or damage incident
      type: note
      options: []
      required: false
    - id: 2
      name: incident_report_number
      label: Incident Report Number
      hint: Unique identifier for this incident
      type: text
      options: []
      required: false
    - id: 3
      name: incident_date
      label: Date of Incident
      hint: When did the incident occur
      type: date
      options: []
      required: true
    - id: 4
      name: incident_time
      label: Time of Incident
      hint: Approximate time of occurrence
      type: time
      options: []
      required: true
    - id: 5
      name: incident_location
      label: Location of Incident
      hint: Where did the incident occur
      type: text
      options: []
      required: true
    - id: 6
      name: reported_by
      label: Reported By
      hint: Person reporting the incident
      type: text
      options: []
      required: true
    - id: 7
      name: reporter_email
      label: Reporter Email
      hint: Contact email address
      type: email
      options: []
      required: true
    - id: 8
      name: reporter_phone
      label: Reporter Phone
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 9
      name: cargo_info
      label: Cargo Information
      hint: Details about the affected cargo
      type: note
      options: []
      required: false
    - id: 10
      name: shipment_reference
      label: Shipment Reference Number
      hint: Tracking or reference number
      type: text
      options: []
      required: true
    - id: 11
      name: cargo_description
      label: Description of Cargo
      hint: Detailed description of goods
      type: text
      options: []
      required: true
    - id: 12
      name: cargo_value
      label: Declared Value of Cargo
      hint: Total value in currency
      type: number
      options: []
      required: true
    - id: 13
      name: incident_type
      label: Type of Incident
      hint: Select the incident category
      type: select_one
      options:
      - Total loss
      - Partial loss
      - Damage
      - Theft
      - Misplacement
      - Delay causing loss
      - Other
      required: true
    - id: 14
      name: quantity_affected
      label: Quantity Affected
      hint: Number of items or packages
      type: number
      options: []
      required: true
    - id: 15
      name: incident_details
      label: Detailed Description of Incident
      hint: Explain what happened in detail
      type: text
      options: []
      required: true
    - id: 16
      name: cause_of_loss
      label: Suspected Cause of Loss
      hint: What caused the incident
      type: select_one
      options:
      - Accidental damage
      - Improper handling
      - Vehicle accident
      - Theft or burglary
      - Weather conditions
      - Packaging failure
      - Documentation error
      - Unknown
      required: true
    - id: 17
      name: witnesses
      label: Were there any witnesses
      hint: People who saw the incident
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 18
      name: witness_names
      label: Witness Names and Contact Information
      hint: List all witnesses
      type: text
      options: []
      required: false
    - id: 19
      name: evidence
      label: Evidence and Documentation
      hint: Supporting materials
      type: note
      options: []
      required: false
    - id: 20
      name: photos_available
      label: Are Photos Available
      hint: Photographic evidence
      type: select_one
      options:
      - Yes - attached
      - Yes - will provide later
      - false
      required: true
    - id: 21
      name: police_report
      label: Was a Police Report Filed
      hint: For theft or major incidents
      type: select_one
      options:
      - Yes - report filed
      - Pending
      - No - not required
      - No - declined
      required: true
    - id: 22
      name: police_report_number
      label: Police Report Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 23
      name: immediate_actions
      label: Immediate Actions Taken
      hint: Steps taken after discovery
      type: text
      options: []
      required: true
    - id: 24
      name: claim_info
      label: Claims Information
      hint: Insurance and claims details
      type: note
      options: []
      required: false
    - id: 25
      name: insurance_claim
      label: Will an Insurance Claim be Filed
      hint: Claims intention
      type: select_one
      options:
      - Yes - claim will be filed
      - Undecided
      - No - claim not needed
      required: true
    - id: 26
      name: estimated_loss_amount
      label: Estimated Loss Amount
      hint: Total financial impact
      type: number
      options: []
      required: true
    - id: 27
      name: corrective_actions
      label: Recommended Corrective Actions
      hint: Prevent future incidents
      type: text
      options: []
      required: false
    - id: 28
      name: supervisor_review
      label: Supervisor Name
      hint: Reviewing manager
      type: text
      options: []
      required: true
    - id: 29
      name: review_date
      label: Review Date
      hint: Date of supervisor review
      type: date
      options: []
      required: true
