inputSchema:
  type: object
  properties:
    title: Lab Equipment Requisition Form
    pages:
    - id: 1
      name: requisition_date
      label: Requisition Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: requested_by
      label: Requested By
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Biochemistry
      - Microbiology
      - Histology
      - Immunology
      required: false
    - id: 4
      name: equipment_type
      label: Equipment Type
      hint: null
      type: select_multiple
      options:
      - General Lab Equipment
      - Specialized Lab Equipment
      - Consumable
      required: false
    - id: 5
      name: equipment_name
      label: Equipment Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: supplier
      label: Supplier
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: cost
      label: Cost
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
