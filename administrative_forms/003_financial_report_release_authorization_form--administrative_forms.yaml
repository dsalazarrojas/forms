inputSchema:
  type: object
  properties:
    title: Financial Report Release Authorization Form
    pages:
    - id: 1
      name: user
      label: User Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: report_details
      label: Report Details
      hint: Please select the report details
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: release_date
      label: Release Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: financial_institution
      label: Financial Institution
      hint: null
      type: select_one
      options:
      - '{''option1'': ''option1''}'
      - '{''option2'': ''option2''}'
      - '{''option3'': ''option3''}'
      required: false
    - id: 5
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: confirm
      label: Confirm
      hint: null
      type: select_multiple
      options:
      - '{''option1'': ''option1''}'
      - '{''option2'': ''option2''}'
      - '{''option3'': ''option3''}'
      - '{''option4'': ''option4''}'
      - '{''option5'': ''option5''}'
      required: false
