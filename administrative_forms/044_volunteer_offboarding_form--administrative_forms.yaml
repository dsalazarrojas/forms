inputSchema:
  type: object
  properties:
    title: Volunteer Offboarding Form
    pages:
    - id: 1
      name: volunteer_offboarding_form_page_1
      label: Volunteer Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: volunteer_offboarding_info
      label: What is your volunteer role?
      hint: null
      type: select_one
      options:
      - Program Volunteer
      - Program Leader
      - Program Assistant
      required: false
    - id: 3
      name: volunteer_offboarding_info_2
      label: What is your volunteer status?
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 4
      name: volunteer_offboarding_note
      label: What would you like to say about your experience as a volunteer?
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: volunteer_offboarding_date
      label: What is your last volunteer date?
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: volunteer_offboarding_form_page_2
      label: Form 2
      hint: null
      type: text
      options: []
      required: false
