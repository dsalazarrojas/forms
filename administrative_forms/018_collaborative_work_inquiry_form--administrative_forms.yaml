inputSchema:
  type: object
  properties:
    title: Collaborative Work Inquiry Form
    pages:
    - id: 1
      name: inquirer_name
      label: Your Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: inquirer_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: inquirer_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: false
    - id: 4
      name: organization
      label: Organization Name
      hint: Your company or institution
      type: text
      options: []
      required: true
    - id: 5
      name: department
      label: Department
      hint: Your department
      type: text
      options: []
      required: false
    - id: 6
      name: job_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: true
    - id: 7
      name: inquiry_date
      label: Inquiry Date
      hint: Date of submission
      type: date
      options: []
      required: true
    - id: 8
      name: collaboration_type
      label: Type of Collaboration
      hint: What kind of collaboration
      type: select_one
      options:
      - Joint Project
      - Research Partnership
      - Co-Development
      - Knowledge Sharing
      - Resource Sharing
      - Cross-Training
      - Consulting
      - Other
      required: true
    - id: 9
      name: project_name
      label: Project Name
      hint: Name of proposed project
      type: text
      options: []
      required: true
    - id: 10
      name: project_description
      label: Project Description
      hint: Describe the project
      type: text
      options: []
      required: true
    - id: 11
      name: project_goals
      label: Project Goals
      hint: What do you hope to achieve
      type: text
      options: []
      required: true
    - id: 12
      name: expected_outcomes
      label: Expected Outcomes
      hint: What results do you expect
      type: text
      options: []
      required: true
    - id: 13
      name: timeline
      label: Proposed Timeline
      hint: Start and end dates
      type: text
      options: []
      required: true
    - id: 14
      name: duration
      label: Expected Duration
      hint: How long will it take
      type: select_one
      options:
      - Less than 1 month
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - 1-2 years
      - Over 2 years
      required: true
    - id: 15
      name: resources_needed
      label: Resources Needed
      hint: What resources are required
      type: select_multiple
      options:
      - Personnel
      - Funding
      - Equipment
      - Software
      - Data
      - Facilities
      - Expertise
      - Other
      required: true
    - id: 16
      name: resources_you_contribute
      label: Resources You Will Contribute
      hint: What you bring to the collaboration
      type: text
      options: []
      required: true
    - id: 17
      name: team_size_needed
      label: Team Size Needed
      hint: How many people from partner
      type: select_one
      options:
      - 1-2 people
      - 3-5 people
      - 6-10 people
      - 11-20 people
      - Over 20 people
      required: true
    - id: 17b
      name: skills_needed
      label: Skills or Expertise Needed
      hint: What expertise required
      type: text
      options: []
      required: true
    - id: 18
      name: budget_estimate
      label: Budget Estimate
      hint: Estimated cost
      type: text
      options: []
      required: false
    - id: 19
      name: funding_source
      label: Funding Source
      hint: Where will funding come from
      type: select_one
      options:
      - Internal Budget
      - External Grant
      - Shared Cost
      - Partner Funded
      - To Be Determined
      required: true
    - id: 20
      name: previous_collaboration
      label: Have You Collaborated Before
      hint: With this organization
      type: select_one
      options:
      - Yes Successfully
      - Yes With Issues
      - No First Time
      required: true
    - id: 21
      name: potential_challenges
      label: Potential Challenges
      hint: What obstacles do you foresee
      type: text
      options: []
      required: false
    - id: 22
      name: success_metrics
      label: Success Metrics
      hint: How will you measure success
      type: text
      options: []
      required: true
    - id: 23
      name: communication_preference
      label: Communication Preference
      hint: How to communicate
      type: select_one
      options:
      - Email
      - Video Calls
      - In-Person Meetings
      - Phone Calls
      - Project Management Tool
      - Mixed Approach
      required: true
    - id: 24
      name: meeting_frequency
      label: Meeting Frequency
      hint: How often to meet
      type: select_one
      options:
      - Daily
      - Weekly
      - Bi-Weekly
      - Monthly
      - Quarterly
      - As Needed
      required: true
    - id: 25
      name: intellectual_property
      label: Intellectual Property Considerations
      hint: Any IP concerns
      type: text
      options: []
      required: false
    - id: 26
      name: confidentiality_needed
      label: Confidentiality Agreement Needed
      hint: Is NDA required
      type: select_one
      options:
      - 'True'
      - 'False'
      - To Be Determined
      required: true
    - id: 27
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
