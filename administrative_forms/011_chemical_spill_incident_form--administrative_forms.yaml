inputSchema:
  type: object
  properties:
    title: Chemical Spill Incident Form
    pages:
    - id: 1
      name: incident_intro
      label: -- Chemical Spill Incident Report --
      hint: Document the spill incident details immediately
      type: note
      options: []
      required: false
    - id: 2
      name: incident_date
      label: Date of incident
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: incident_time
      label: Time of incident
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: location_area
      label: Location or area of spill
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: building_room
      label: Building and room number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: reporter_name
      label: Person reporting the incident
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: reporter_department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: reporter_email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: reporter_phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: chemical_name
      label: Chemical name involved
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: cas_number
      label: CAS number
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: chemical_form
      label: Form of chemical
      hint: null
      type: select_one
      options:
      - Liquid
      - Solid
      - Powder
      - Vapor
      - Gas
      - Other
      required: true
    - id: 13
      name: estimated_quantity
      label: Estimated quantity spilled
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: quantity_unit
      label: Unit of measurement
      hint: null
      type: select_one
      options:
      - Milliliters
      - Liters
      - Grams
      - Kilograms
      - Ounces
      - Pounds
      - Other
      required: true
    - id: 15
      name: spill_cause
      label: Cause of spill
      hint: null
      type: select_one
      options:
      - Container drop
      - Container leak
      - Improper handling
      - Equipment failure
      - Overfilling
      - Unknown
      - Other
      required: true
    - id: 16
      name: spill_cause_details
      label: Detailed description of what happened
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: injuries_reported
      label: Any injuries reported?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 18
      name: injury_details
      label: Describe injuries
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: environmental_impact
      label: Environmental impact
      hint: null
      type: select_one
      options:
      - None
      - Minor
      - Moderate
      - Severe
      required: true
    - id: 20
      name: response_actions
      label: Actions taken to contain spill
      hint: Select all that apply
      type: select_multiple
      options:
      - Evacuated area
      - Contained spill
      - Neutralized chemical
      - Called hazmat
      - Ventilation increased
      - Personal protective equipment used
      - Other
      required: true
    - id: 21
      name: hazmat_called
      label: Was hazmat team called?
      hint: null
      type: select_one
      options:
      - true
      - false
      - Not needed
      required: true
    - id: 22
      name: cleanup_completed
      label: Was cleanup completed?
      hint: null
      type: select_one
      options:
      - true
      - In progress
      - Not yet started
      required: true
    - id: 23
      name: witnesses
      label: Any witnesses to the incident?
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: prevention_measures
      label: Recommended prevention measures
      hint: null
      type: text
      options: []
      required: false
