      - Excellent
      - Fair
      - Poor
      required: false
    - id: 7
      name: date_last_inspection
      label: date_last_inspection
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time_last_inspection
      label: time_last_inspection
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: assigned_inspector
      label: assigned_inspector
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: inspector_signature
      label: inspector_signature
      hint: null
      type: select_one
      options:
      - Signed
      - Unsigned
      required: false
