      name: food_truck_inspection_form_1
      label: food_truck_inspection_form_1
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: license_number
      label: license_number
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: vehicle_type
      label: vehicle_type
      hint: null
      type: select_one
      options:
      - Car
      - Truck
      - Bus
      required: false
    - id: 4
      name: food_handling_certification
      label: food_handling_certification
