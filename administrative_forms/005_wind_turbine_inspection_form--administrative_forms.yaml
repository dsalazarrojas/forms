inputSchema:
  type: object
  properties:
    title: Wind Turbine Inspection Form
    pages:
    - id: 1
      name: inspection_details
      label: Inspection Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: issues_reported
      label: Issues Reported
      hint: null
      type: select_multiple
      options:
      - Issue 1
      - Issue 2
      - Issue 3
      required: false
    - id: 3
      name: maintenance_schedules
      label: Maintenance Schedules
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: safety_risk_level
      label: Safety Risk Level
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 5
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: next_inspection_date
      label: Next Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: energy_production
      label: Energy Production
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: wind_turbine_status
      label: Wind Turbine Status
      hint: null
      type: select_one
      options:
      - Online
      - Offline
      - Maintenance
      required: false
    - id: 9
      name: maintenance_status
      label: Maintenance Status
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: issue_status
      label: Issue Status
      hint: null
      type: select_one
      options:
      - Open
      - Closed
      - In Progress
      required: false
