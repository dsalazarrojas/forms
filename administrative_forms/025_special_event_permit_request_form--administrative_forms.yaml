inputSchema:
  type: object
  properties:
    title: Special Event Permit Request Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Concert
      - Festival
      - Exhibition
      required: true
    - id: 3
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: event_capacity
      label: Event Capacity
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: event_organizer
      label: Event Organizer
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: event_organizer_email
      label: Event Organizer Email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: event_contact
      label: Event Contact
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: event_contact_number
      label: Event Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: event_description
      label: Event Description
      hint: null
      type: note
      options: []
      required: true
    - id: 13
      name: permit_type
      label: Permit Type
      hint: null
      type: select_one
      options:
      - Parking Permit
      - Noise Permit
      - Other
      required: true
    - id: 14
      name: permit_requirements
      label: Permit Requirements
      hint: null
      type: text
      options: []
      required: false
