      - Not checked in yet
      - Checked in
      - Checked out
      - No show
      - Other
      - Cancelled
      - Rescheduled
      required: true
    - id: 5
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: contact_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: contact_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: emergency_phone
      label: Emergency Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_email
      label: Emergency Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
