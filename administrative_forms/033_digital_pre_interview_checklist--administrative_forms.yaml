inputSchema:
  type: object
  properties:
    title: Digital Pre Interview Checklist
    pages:
    - id: 1
      name: candidate_info
      label: Candidate Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: salary_range
      label: Salary Range
      hint: null
      type: select_one
      options:
      - $30,000-$50,000
      - $50,001-$75,000
      - $75,001-$100,000
      - Other
      required: false
    - id: 4
      name: experience
      label: Experience
      hint: null
      type: select_multiple
      options:
      - 1-5 years
      - 6-10 years
      - More than 10 years
      required: false
    - id: 5
      name: education
      label: Education
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: available_start_date
      label: Available Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: work_status
      label: Work Status
      hint: null
      type: select_one
      options:
      - Active
      - Retired
      - Other
      required: false
    - id: 8
      name: notice_period
      label: Notice Period
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: job_type
      label: Job Type
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      - Other
      required: false
    - id: 10
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
