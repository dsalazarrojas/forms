inputSchema:
  type: object
  properties:
    title: Branded Merchandise Requisition Form
    pages:
    - id: 1
      name: requester_name
      label: Requester name
      hint: Name of person requesting items
      type: text
      options: []
      required: true
    - id: 2
      name: department
      label: Department
      hint: Department requesting merchandise
      type: text
      options: []
      required: true
    - id: 3
      name: item_description
      label: Item description
      hint: Product details size and color
      type: text
      options: []
      required: true
    - id: 4
      name: quantity
      label: Quantity requested
      hint: Number of units required
      type: number
      options: []
      required: true
    - id: 5
      name: event_or_campaign
      label: Event or campaign
      hint: Purpose for the merchandise
      type: text
      options: []
      required: false
    - id: 6
      name: delivery_deadline
      label: Delivery deadline
      hint: Required delivery date
      type: date
      options: []
      required: false
    - id: 7
      name: budget_approval
      label: Budget approval status
      hint: Has budget been approved
      type: select_one
      options:
      - Approved
      - Pending
      - Denied
      required: true
    - id: 8
      name: shipping_address
      label: Shipping address
      hint: Where items should be delivered
      type: text
      options: []
      required: true
