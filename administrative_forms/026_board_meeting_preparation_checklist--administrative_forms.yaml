inputSchema:
  type: object
  properties:
    title: Board Meeting Preparation Checklist
    pages:
    - id: 1
      name: prep_header
      label: -- Preparation Checklist --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: coordinator_name
      label: Coordinator name
      hint: Person completing checklist
      type: text
      options: []
      required: true
    - id: 3
      name: meeting_date
      label: Meeting date
      hint: Date of the meeting
      type: date
      options: []
      required: true
    - id: 4
      name: agenda_distributed
      label: Agenda distributed
      hint: Has agenda been sent to members
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: materials_prepared
      label: Materials prepared
      hint: All supporting materials ready
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: room_booked
      label: Room booked
      hint: Confirm venue booking
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: av_checked
      label: AV equipment checked
      hint: Audio visual readiness
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: refreshments_arranged
      label: Refreshments arranged
      hint: Catering or refreshments arranged
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: additional_notes
      label: Additional notes
      hint: Any outstanding tasks
      type: text
      options: []
      required: false
