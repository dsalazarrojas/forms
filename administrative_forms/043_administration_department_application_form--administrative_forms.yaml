inputSchema:
  type: object
  properties:
    title: Administration Department Application Form
    pages:
    - id: 1
      name: applicant_details
      label: Applicant details
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Applicant full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: For communication regarding application
      type: email
      options: []
      required: true
    - id: 4
      name: position_applied_for
      label: Position applied for
      hint: Job title in administration department
      type: text
      options: []
      required: true
    - id: 5
      name: qualifications
      label: Qualifications
      hint: Education and relevant experience
      type: text
      options: []
      required: true
    - id: 6
      name: availability
      label: Availability to start
      hint: Earliest start date
      type: date
      options: []
      required: false
    - id: 7
      name: references
      label: References
      hint: Two professional references preferred
      type: text
      options: []
      required: true
    - id: 8
      name: cover_letter
      label: Cover letter summary
      hint: Brief statement of interest
      type: text
      options: []
      required: false
    - id: 9
      name: resume_attached
      label: Resume attached
      hint: Confirm resume included
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: additional_information
      label: Additional information
      hint: Any other relevant details
      type: text
      options: []
      required: false
