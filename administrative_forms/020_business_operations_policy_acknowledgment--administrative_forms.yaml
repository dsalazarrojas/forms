inputSchema:
  type: object
  properties:
    title: Business Operations Policy Acknowledgment
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
