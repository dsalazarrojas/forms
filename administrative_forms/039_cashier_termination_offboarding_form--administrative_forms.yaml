      name: termination_reason
      label: Reason for Termination
      hint: null
      type: select_one
      options:
      - Resignation
      - Voluntary Departure
      - Layoff or Reduction
      - Termination for Cause
      - Retirement
      - Other
      required: true
    - id: 12
      name: detailed_reason
