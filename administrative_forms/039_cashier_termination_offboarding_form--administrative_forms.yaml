      name: register_keys_returned
      label: Register Keys Returned?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not Applicable
      required: true
    - id: 20
      name: store_card_returned
      label: Store ID Card or Badge Returned?
      hint: null
      type: select_one
      options:
