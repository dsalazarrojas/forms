      label: -- Termination Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: termination_date
      label: Termination Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 3
      name: notice_given_date
      label: Date Notice Given
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 4
      name: employee_information_section
      label: -- Employee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: employee_name
      label: Employee Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: employee_id
      label: Employee ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: position_title
      label: Position Title
      hint: null
      type: text
      options: []
      required: true
