      hint: null
      type: number
      options: []
      required: false
    - id: 17
      name: accrued_sick_time
      label: Accrued Sick Time or PTO
      hint: null
      type: number
      options: []
      required: false
    - id: 18
      name: equipment_return_section
      label: -- Equipment Return --
      hint: null
      type: note
      options: []
      required: false
