inputSchema:
  type: object
  properties:
    title: Mileage Reimbursement Claim Form
    pages:
    - id: 1
      name: travel_date
      label: Travel Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: start_location
      label: start_location
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: end_location
      label: end_location
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: distance
      label: Distance
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: odometer_reading
      label: Odometer Reading
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: total_distance
      label: Total Distance
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: purpose_of_trip
      label: Purpose of the Trip
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: claim_amount
      label: Claim Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: claim_status
      label: Claim Status
      hint: null
      type: select_one
      options:
      - Active
      - Denied
      - In Progress
      - Paid
      - Pending
      - Resolved
      required: false
    - id: 10
      name: assigned_tool
      label: Assisted by
