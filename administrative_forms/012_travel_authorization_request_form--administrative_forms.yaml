      options: []
      required: false
    - id: 2
      name: travel_start_time
      label: Travel Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: travel_end_time
      label: Travel End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: travel_duration
