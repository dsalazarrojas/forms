inputSchema:
  type: object
  properties:
    title: Construction Project Discharge Form
    pages:
    - id: 1
      name: section_project_closure
      label: -- Project Closure --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: project_name
      label: Project name
      hint: Full project title
      type: text
      options: []
      required: true
    - id: 3
      name: completion_date
      label: Completion date
      hint: Date of practical completion
      type: date
      options: []
      required: true
    - id: 4
      name: final_inspection_passed
      label: Final inspection passed
      hint: Has final inspection been completed and passed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: outstanding_items
      label: Outstanding items
      hint: List any defects or punch list items remaining
      type: text
      options: []
      required: false
    - id: 6
      name: client_sign_off
      label: Client sign off name
      hint: Name of client representative approving discharge
      type: text
      options: []
      required: true
    - id: 7
      name: final_documents_submitted
      label: Final documents submitted
      hint: Confirm that handover documents were provided
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
