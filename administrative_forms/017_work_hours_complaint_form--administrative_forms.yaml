inputSchema:
  type: object
  properties:
    title: Work Hours Complaint Form
    pages:
    - id: 1
      name: complaint_details
      label: Complaint Details
      hint: Provide as much information as possible
      type: text
      options: []
      required: false
    - id: 2
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_email
      label: Contact Email
      hint: Required if you are not using your work email
      type: text
      options: []
      required: false
    - id: 5
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - Work Hours Complaint
      - Other
      required: false
    - id: 7
      name: assigned_tool_other
      label: Other
      hint: Please specify the tool you would like your issue escalated to
      type: text
      options: []
      required: false
    - id: 8
      name: category
      label: Category
      hint: null
      type: select_multiple
      options:
      - Work-Life Balance
      - Compensation
      - Work Environment
      required: false
    - id: 9
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 10
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Open
      - Pending
      - Resolved
      required: false
    - id: 11
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - Employee
      - Manager
      - HR
      required: false
    - id: 12
      name: submitted_to
      label: Submitted To
      hint: null
      type: select_one
      options:
      - HR Department
      - Manager
      required: false
    - id: 13
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: false
