inputSchema:
  type: object
  properties:
    title: Commercial Vehicle Registration Renewal Form
    pages:
      - id: 1
        name: registrant_name
        label: Registrant name
        hint: Owner or company name on the registration
        type: text
        options: []
        required: true
      - id: 2
        name: business_name
        label: Business name if applicable
        hint: Leave blank if not applicable
        type: text
        options: []
        required: false
      - id: 3
        name: current_registration_number
        label: Current registration number
        hint: Enter exact registration identifier
        type: text
        options: []
        required: true
      - id: 4
        name: vehicle_make_model
        label: Vehicle make and model
        hint: Include year where possible
        type: text
        options: []
        required: true
      - id: 5
        name: vehicle_vin
        label: Vehicle identification number VIN
        hint: Full VIN without spaces
        type: text
        options: []
        required: true
      - id: 6
        name: renewal_term
        label: Renewal term in months
        hint: Select the renewal duration
        type: select_one
        options:
          - 6 months
          - 12 months
          - 24 months
        required: true
      - id: 7
        name: payment_method
        label: Preferred payment method
        hint: Choose a payment option
        type: select_one
        options:
          - Credit card
          - Bank transfer
          - Check
          - Online payment portal
        required: true
      - id: 8
        name: insurance_confirmed
        label: Insurance on file confirmed
        hint: Confirm active commercial insurance
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 9
        name: contact_email
        label: Contact email for renewal
        hint: Where renewal confirmation will be sent
        type: email
        options: []
        required: true
      - id: 10
        name: notes
        label: Additional notes
        hint: Optional comments or special instructions
        type: text
        options: []
        required: false
