inputSchema:
  type: object
  properties:
    title: Boarding School Incident Form
    pages:
    - id: 1
      name: incident_date
      label: Incident Date
      hint: When did the incident occur?
      type: date
      options: []
      required: true
    - id: 2
      name: incident_time
      label: Incident Time
      hint: What time did it occur?
      type: time
      options: []
      required: true
    - id: 3
      name: incident_location
      label: Incident Location
      hint: Where did it happen?
      type: text
      options: []
      required: true
    - id: 4
      name: location_type
      label: Location Type
      hint: Select the type of location
      type: select_one
      options:
      - Dormitory
      - Classroom
      - Dining Hall
      - Athletic Facility
      - Common Area
      - Off-Campus
      - Other
      required: true
    - id: 5
      name: reporter_name
      label: Reporter Name
      hint: Person reporting the incident
      type: text
      options: []
      required: true
    - id: 6
      name: reporter_role
      label: Reporter Role
      hint: Your position
      type: select_one
      options:
      - Faculty Member
      - Residential Advisor
      - Administrator
      - Security Staff
      - Student
      - Other Staff
      - Other
      required: true
    - id: 7
      name: student_name
      label: Student Name
      hint: Student(s) involved
      type: text
      options: []
      required: true
    - id: 8
      name: student_grade
      label: Student Grade Level
      hint: Grade or year
      type: select_one
      options:
      - Grade 6
      - Grade 7
      - Grade 8
      - Grade 9
      - Grade 10
      - Grade 11
      - Grade 12
      - Post-Graduate
      required: true
    - id: 9
      name: incident_type
      label: Incident Type
      hint: Select the type of incident
      type: select_one
      options:
      - Medical Emergency
      - Behavioral Issue
      - Property Damage
      - Theft
      - Bullying/Harassment
      - Substance Violation
      - Safety Violation
      - Altercation
      - Other
      required: true
    - id: 10
      name: incident_severity
      label: Incident Severity
      hint: How serious was the incident?
      type: select_one
      options:
      - Minor - No injury
      - Moderate - Minor injury
      - Serious - Medical attention required
      - Severe - Emergency response required
      - Critical - Life-threatening
      required: true
    - id: 11
      name: incident_description
      label: Incident Description
      hint: Describe what happened in detail
      type: text
      options: []
      required: true
    - id: 12
      name: witnesses_present
      label: Witnesses Present
      hint: Were there witnesses?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: witness_names
      label: Witness Names
      hint: List any witnesses
      type: text
      options: []
      required: false
    - id: 14
      name: injuries_sustained
      label: Injuries Sustained
      hint: Describe any injuries
      type: text
      options: []
      required: false
    - id: 15
      name: medical_response
      label: Medical Response
      hint: What medical action was taken?
      type: select_one
      options:
      - No medical attention needed
      - First aid administered
      - School nurse consulted
      - External medical care
      - Emergency services called
      required: true
    - id: 16
      name: parents_notified
      label: Parents/Guardians Notified
      hint: Have parents been contacted?
      type: select_one
      options:
      - Yes, already notified
      - Will notify shortly
      - Not yet notified
      - Not applicable
      required: true
    - id: 17
      name: parent_contact_time
      label: Parent Contact Time
      hint: When were parents contacted?
      type: time
      options: []
      required: false
    - id: 18
      name: immediate_actions_taken
      label: Immediate Actions Taken
      hint: What was done immediately?
      type: text
      options: []
      required: true
    - id: 19
      name: follow_up_required
      label: Follow-Up Required
      hint: Is follow-up needed?
      type: select_one
      options:
      - Yes, disciplinary action
      - Yes, counseling support
      - Yes, parent meeting
      - Yes, investigation
      - No follow-up needed
      required: true
    - id: 20
      name: follow_up_details
      label: Follow-Up Details
      hint: Describe planned follow-up
      type: text
      options: []
      required: false
    - id: 21
      name: administrator_notified
      label: Administrator Notified
      hint: Which administrator was informed?
      type: text
      options: []
      required: true
    - id: 22
      name: incident_report_number
      label: Incident Report Number
      hint: Official report number if assigned
      type: text
      options: []
      required: false
