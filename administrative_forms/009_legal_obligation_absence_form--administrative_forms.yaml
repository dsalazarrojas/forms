inputSchema:
  type: object
  properties:
    title: Legal Obligation Absence Form
    pages:
    - id: 1
      name: employee_request
      label: Employee Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: reason_for_absence
      label: reason_for_absence
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: employee_documents
      label: Employee Documents
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: supporting_documents
      label: Supporting Documents
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: employee_signature
      label: Employee Signature
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: manager_approval
      label: Manager Approval
      hint: null
      type: select_one
      options:
      - Approve
      - Reject
      - Request for clarification
      - Decline
      required: false
    - id: 7
      name: date_absence
      label: Date Absence
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time_absence
      label: Time Absence
      hint: null
      type: time
      options: []
      required: false
