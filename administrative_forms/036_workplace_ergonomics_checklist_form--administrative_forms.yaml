inputSchema:
  type: object
  properties:
    title: workplace_ergonomics_checklist_form
    pages:
    - id: 1
      name: work_station
      label: workspace
      hint: null
      type: select_one
      options:
      - office
      - home
      - outdoor
      required: false
    - id: 2
      name: ergonomic_condition
      label: Ergonomic Condition
      hint: Enter your text answer
      type: text
      options: []
      required: false
    - id: 3
      name: employee_confort
      label: Employee Confort
      hint: null
      type: select_multiple
      options:
      - comfortable
      - uncomfortable
      required: false
    - id: 4
      name: safety_measures
      label: Safety Measures
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: employee_awareness
      label: Employee Awareness
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: ergo_checklist
      label: Ergo Checklist
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: work_hours
      label: Work Hours
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: ergonomic_issues
      label: Ergonomic Issues
      hint: Enter your text answer
      type: text
      options: []
      required: false
    - id: 9
      name: employee_feedback
      label: Employee Feedback
      hint: Enter your text answer
      type: text
      options: []
      required: false
