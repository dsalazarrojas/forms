inputSchema:
  type: object
  properties:
    title: weekly_schedule_availability_form
    pages:
    - id: 1
      name: meeting_availability
      label: Meeting Availability
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 3
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: meeting_duration
      label: Meeting Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: meeting_frequency
      label: Meeting Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Bi-Weekly
      - Monthly
      required: true
    - id: 6
      name: meeting_frequency_other
      label: Other (Specify)
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: meeting_type
      label: Type of Meeting
      hint: null
      type: select_multiple
      options:
      - Meetings
      - Calls
      - Interviews
      required: true
    - id: 8
      name: meeting_availability_comments
      label: Meeting Availability Comments
      hint: null
      type: text
      options: []
      required: false
