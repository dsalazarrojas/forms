inputSchema:
  type: object
  properties:
    title: Facility Maintenance Status Report Form
    pages:
    - id: 1
      name: facility_maintenance_status_report_form_page_1
      label: Maintenance Requests
      hint: Provide a detailed description of the maintenance request
      type: text
      options: []
      required: true
    - id: 2
      name: facility_maintenance_status_report_form_page_2
      label: Facility Status
      hint: Select the current status of the facility
      type: select_multiple
      options:
      - Fully Functional
      - Partially Functional
      - Non-Functional
      required: true
    - id: 3
      name: facility_maintenance_status_report_form_page_3
      label: Facility Type
      hint: Select the type of facility
      type: select_one
      options:
      - Office Building
      - Classroom Building
      - Laboratory Building
      required: true
    - id: 4
      name: facility_maintenance_status_report_form_page_4
      label: Equipment Status
      hint: Select the status of facility equipment
      type: select_multiple
      options:
      - Operational
      - Non-Operational
      required: false
    - id: 5
      name: facility_maintenance_status_report_form_page_5
      label: Repair History
      hint: null
      type: note
      options: []
      required: true
    - id: 6
      name: facility_maintenance_status_report_form_page_6
      label: Facility Manager
      hint: Enter the name of the facility manager
      type: text
      options: []
      required: true
    - id: 7
      name: facility_maintenance_status_report_form_page_7
      label: Facility Location
      hint: Select the location of the facility
      type: select_one
      options:
      - New York
      - Los Angeles
      - Chicago
      required: true
    - id: 8
      name: facility_maintenance_status_report_form_page_8
      label: Facility Address
      hint: Enter the address of the facility
      type: text
      options: []
      required: true
