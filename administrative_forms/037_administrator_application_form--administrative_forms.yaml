inputSchema:
  type: object
  properties:
    title: Administrator Application Form
    pages:
    - id: 1
      name: application_header
      label: -- Administrator Application --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_full_name
      label: Full Name
      hint: Enter your legal name
      type: text
      options: []
      required: true
    - id: 3
      name: applicant_email
      label: Email Address
      hint: Valid email for communication
      type: email
      options: []
      required: true
    - id: 4
      name: applicant_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 5
      name: applicant_address
      label: Address
      hint: Current residential address
      type: text
      options: []
      required: true
    - id: 6
      name: applicant_city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 7
      name: applicant_state
      label: State/Province
      hint: State or province of residence
      type: text
      options: []
      required: true
    - id: 8
      name: applicant_zip
      label: ZIP/Postal Code
      hint: Postal code of residence
      type: text
      options: []
      required: true
    - id: 9
      name: applicant_country
      label: Country
      hint: Country of residence
      type: text
      options: []
      required: true
    - id: 10
      name: date_of_birth
      label: Date of Birth
      hint: Your birth date
      type: date
      options: []
      required: true
    - id: 11
      name: position_applied_for
      label: Position Applied For
      hint: What administrator position are you applying for?
      type: text
      options: []
      required: true
    - id: 12
      name: department_applied_for
      label: Department Applied For
      hint: Which department would you like to work in?
      type: select_one
      options:
      - Administration
      - Human Resources
      - Finance
      - Marketing
      - Operations
      - IT
      - Sales
      - Customer Service
      - Executive
      - Other
      required: true
    - id: 13
      name: employment_type
      label: Employment Type Desired
      hint: What type of employment are you seeking?
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      - Temporary
      - Seasonal
      required: true
    - id: 14
      name: earliest_start_date
      label: Earliest Start Date
      hint: When can you start if selected?
      type: date
      options: []
      required: true
    - id: 15
      name: salary_expectations
      label: Salary Expectations
      hint: What are your salary expectations?
      type: text
      options: []
      required: false
    - id: 16
      name: education_level
      label: Highest Education Level
      hint: What is your highest level of education?
      type: select_one
      options:
      - High School
      - Associate Degree
      - Bachelor's Degree
      - Master's Degree
      - Doctorate
      - Other
      required: true
    - id: 17
      name: education_details
      label: Education Details
      hint: Name of school, degree earned, graduation year
      type: text
      options: []
      required: false
    - id: 18
      name: administrative_experience
      label: Administrative Experience
      hint: Describe your administrative experience
      type: text
      options: []
      required: true
    - id: 19
      name: management_experience
      label: Management Experience
      hint: Describe your management experience
      type: text
      options: []
      required: false
    - id: 20
      name: computer_proficiency
      label: Computer Proficiency
      hint: List your computer software skills
      type: text
      options: []
      required: true
    - id: 21
      name: languages_spoken
      label: Languages Spoken
      hint: List all languages you speak fluently
      type: text
      options: []
      required: false
    - id: 22
      name: availability
      label: Availability
      hint: What are your availability requirements?
      type: text
      options: []
      required: true
    - id: 23
      name: references_available
      label: References Available
      hint: Are references available upon request?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 24
      name: background_check_consent
      label: Background Check Consent
      hint: Do you consent to a background check if selected?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 25
      name: application_date
      label: Application Date
      hint: Date of submitting this application
      type: date
      options: []
      required: true
    - id: 26
      name: applicant_signature
      label: Applicant Signature
      hint: Electronic signature to confirm application
      type: text
      options: []
      required: true
