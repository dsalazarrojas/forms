inputSchema:
  type: object
  properties:
    title: experience_letter_request_form
    pages:
    - id: 1
      name: employee_id
      label: Employee ID
      hint: Enter your employee ID
      type: number
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: Enter your name
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_joining
      label: Date of Joining
      hint: MM/DD/YYYY
      type: date
      options: []
      required: false
    - id: 4
      name: department
      label: Department
      hint: Select department
      type: select_one
      options:
      - Accounting
      - Finance
      - HR
      - Marketing
      required: false
    - id: 5
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: reason_for_request
      label: Reason for Request
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: manager_name
      label: Manager Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: reporting_manager
      label: Reporting Manager
      hint: null
      type: text
      options: []
      required: false
