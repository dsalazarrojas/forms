inputSchema:
  type: object
  properties:
    title: Succession Planning Needs Assessment Form
    pages:
    - id: 1
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: skills
      label: Skills
      hint: Enter relevant skills for this role
      type: text
      options: []
      required: false
    - id: 4
      name: job_description
      label: Job Description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: career_aspirations
      label: Career Aspirations
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: future_job_roles
      label: Future Job Roles
      hint: List any future job roles this employee may take on
      type: select_multiple
      options:
      - CEO
      - Manager
      - Director
      - Other
      required: false
    - id: 7
      name: skills_assess
      label: Skills Assess
      hint: How does this employee rate in skills?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: job_performance
      label: Job Performance
      hint: null
