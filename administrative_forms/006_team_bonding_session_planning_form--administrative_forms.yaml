inputSchema:
  type: object
  properties:
    title: Team Bonding Session Planning Form
    pages:
    - id: 1
      name: session_name
      label: Session Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: team_lead
      label: Team Lead
      hint: null
      type: select_one
      options:
      - John
      - Jane
      - Jim
      required: true
    - id: 3
      name: session_date
