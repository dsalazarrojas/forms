      type: note
      options: []
      required: false
    - id: 12
      name: team_comments
      label: Team Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: event_notes
      label: Event Notes
      hint: null
      type: text
      options: []
      required: false
