inputSchema:
  type: object
  properties:
    title: Performance Evaluation Strategy Contact Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: evaluation_strategy
      label: Evaluation Strategy
      hint: Choose an evaluation strategy
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      - Option 5
      - Option 6
      required: false
    - id: 4
      name: contact_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: contact_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: contact_notes
      label: Notes
      hint: Additional Comments
      type: note
      options: []
      required: false
