inputSchema:
  type: object
  properties:
    title: Confluence Intake Form
    pages:
      - id: 1
        name: request_date
        label: Request Date
        hint: Date of this intake request
        type: date
        options: []
        required: true
      - id: 2
        name: requester_name
        label: Requester Name
        hint: Full name of person submitting request
        type: text
        options: []
        required: true
      - id: 3
        name: requester_email
        label: Email Address
        hint: Contact email address
        type: email
        options: []
        required: true
      - id: 4
        name: department
        label: Department
        hint: Your department or team
        type: text
        options: []
        required: true
      - id: 5
        name: project_name
        label: Project Name
        hint: Name of the project or initiative
        type: text
        options: []
        required: true
      - id: 6
        name: project_type
        label: Project Type
        hint: Category of project
        type: select_one
        options:
          - New Product Development
          - Process Improvement
          - Technology Implementation
          - Marketing Campaign
          - Research and Development
          - Organizational Change
          - Compliance Initiative
          - Other
        required: true
      - id: 7
        name: project_description
        label: Project Description
        hint: Detailed description of the project
        type: text
        options: []
        required: true
      - id: 8
        name: business_objectives
        label: Business Objectives
        hint: What are the main goals of this project
        type: text
        options: []
        required: true
      - id: 9
        name: expected_outcomes
        label: Expected Outcomes
        hint: What results do you expect
        type: text
        options: []
        required: true
      - id: 10
        name: priority_level
        label: Priority Level
        hint: How critical is this project
        type: select_one
        options:
          - Critical - Immediate Attention
          - High - This Quarter
          - Medium - This Half
          - Low - This Year
          - Backlog - Future Consideration
        required: true
      - id: 11
        name: target_start_date
        label: Target Start Date
        hint: When should work begin
        type: date
        options: []
        required: true
      - id: 12
        name: target_completion_date
        label: Target Completion Date
        hint: Expected completion date
        type: date
        options: []
        required: true
      - id: 13
        name: budget_range
        label: Budget Range
        hint: Estimated budget for this project
        type: select_one
        options:
          - Less than $10,000
          - $10,000 to $50,000
          - $50,000 to $100,000
          - $100,000 to $500,000
          - More than $500,000
          - To Be Determined
        required: true
      - id: 14
        name: stakeholders
        label: Key Stakeholders
        hint: List all stakeholders involved
        type: text
        options: []
        required: true
      - id: 15
        name: project_sponsor
        label: Project Sponsor
        hint: Executive sponsor or champion
        type: text
        options: []
        required: true
      - id: 16
        name: team_members
        label: Proposed Team Members
        hint: Who should be on the project team
        type: text
        options: []
        required: false
      - id: 17
        name: dependencies
        label: Known Dependencies
        hint: Other projects or teams this depends on
        type: text
        options: []
        required: false
      - id: 18
        name: risks
        label: Known Risks
        hint: Potential risks or challenges
        type: text
        options: []
        required: false
      - id: 19
        name: resources_required
        label: Resources Required
        hint: What resources are needed
        type: select_multiple
        options:
          - Development Team
          - Design Resources
          - Data Analysis
          - External Consultants
          - Software Tools
          - Hardware Equipment
          - Training
          - Marketing Support
        required: true
      - id: 20
        name: success_metrics
        label: Success Metrics
        hint: How will success be measured
        type: text
        options: []
        required: true
      - id: 21
        name: communication_preferences
        label: Communication Preferences
        hint: How should updates be shared
        type: select_one
        options:
          - Weekly Status Meetings
          - Bi-Weekly Reports
          - Monthly Updates
          - As Needed
          - Project Management Tool
        required: true
      - id: 22
        name: additional_information
        label: Additional Information
        hint: Any other relevant details
        type: text
        options: []
        required: false
      - id: 23
        name: requester_signature
        label: Requester Signature
        hint: Type your full name
        type: text
        options: []
        required: true
      - id: 24
        name: intake_status
        label: Intake Status
        hint: For administrative use
        type: select_one
        options:
          - Submitted
          - Under Review
          - Approved
          - Rejected
          - More Information Needed
        required: true
