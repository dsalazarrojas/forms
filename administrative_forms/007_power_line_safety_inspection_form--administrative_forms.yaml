inputSchema:
  type: object
  properties:
    title: Power Line Safety Inspection Form
    pages:
    - id: 1
      name: inspection_date
      label: Inspection Date
      hint: Date of the inspection
      type: date
      options: []
      required: true
    - id: 2
      name: employee_name
      label: Employee Name
      hint: Name of the employee conducting the inspection
      type: text
      options: []
      required: true
    - id: 3
      name: inspection_location
      label: Inspection Location
      hint: Location of the inspection
      type: select_one
      options:
      - Line Crew
      - Transmission Station
      - Other
      required: true
    - id: 4
      name: hazard_report
      label: Hazard Report
      hint: Description of the hazards found during the inspection
      type: note
      options: []
      required: true
    - id: 5
      name: action_plan
      label: Action Plan
      hint: Description of the action plan for each hazard
      type: text
      options: []
      required: true
    - id: 6
      name: additional_comments
      label: Additional Comments
      hint: Additional comments or notes from the inspector
      type: note
      options: []
      required: true
    - id: 7
      name: hazards_found
      label: Hazards Found
      hint: Select the type of hazards found during the inspection
      type: select_one
      options:
      - No Hazards
      - Minor Hazards
      - Major Hazards
      required: true
    - id: 8
      name: hazards_mitigated
      label: Hazards Mitigated
      hint: Select the hazards that have been mitigated
      type: select_multiple
      options:
      - Line Crew
      - Transmission Station
      required: true
    - id: 9
      name: status
      label: Status
      hint: Indicate the status of the form
      type: select_one
      options:
      - Completed
      - In Progress
      - Not Started
      required: true
