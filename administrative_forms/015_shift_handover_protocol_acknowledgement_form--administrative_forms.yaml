inputSchema:
  type: object
  properties:
    title: Shift Handover Protocol Acknowledgement Form
    pages:
    - id: 1
      name: acknowledgement_1
      label: Acknowledgement of Previous Shift
      hint: null
      type: select_one
      options:
      - I acknowledge that I finished my shift on time
      - I was running late for my shift
      - I did not finish my shift
      required: true
    - id: 2
      name: notes_1
      label: Notes from Previous Shift
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: next_shift_details
      label: Next Shift Details
      hint: null
      type: select_one
      options:
      - 08:00
      - 08:30
      - 09:00
      required: true
    - id: 4
      name: next_shift_start_time
      label: Next Shift Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: next_shift_start_date
      label: Next Shift Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: notes_for_next_shift
      label: Notes for Next Shift
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: next_shift_acknowledgement_1
      label: Acknowledgement of Next Shift
      hint: null
      type: select_one
      options:
      - I will be on time for next shift
      - I will be late for next shift
      - I will not be available for next shift
      required: true
    - id: 8
      name: additional_notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: confirmation_of_handover_1
      label: Confirmation of Handover
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: review_and_sign_1
      label: Review and Sign
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 11
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
