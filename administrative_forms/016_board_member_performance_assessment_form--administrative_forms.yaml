        hint: Rate fundraising efforts
        type: select_one
        options:
          - Excellent - Exceeds expectations
          - Good - Meets expectations
          - Average - Partially meets expectations
          - Below Average - Below expectations
          - Not Applicable
        required: false
      - id: 12
        name: community_representation
        label: Community Representation
        hint: Rate representation of stakeholders
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 13
        name: ethical_conduct
        label: Ethical Conduct
        hint: Rate adherence to ethics
        type: select_one
        options:
          - Excellent - Always demonstrates integrity
          - Good - Usually demonstrates integrity
          - Average - Sometimes demonstrates integrity
          - Below Average - Rarely demonstrates integrity
          - Poor - Does not demonstrate integrity
        required: true
      - id: 14
        name: collaboration_with_staff
        label: Collaboration with Staff
        hint: Rate working relationship with staff
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 15
        name: overall_effectiveness
        label: Overall Effectiveness
        hint: Rate overall performance
        type: select_one
        options:
          - 5 - Outstanding
          - 4 - Exceeds Expectations
          - 3 - Meets Expectations
          - 2 - Below Expectations
          - 1 - Unsatisfactory
        required: true
      - id: 16
        name: key_contributions
        label: Key Contributions
        hint: List major contributions this period
        type: text
        options: []
        required: false
      - id: 17
        name: areas_for_development
