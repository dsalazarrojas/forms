inputSchema:
  type: object
  properties:
    title: Board Member Performance Assessment Form
    pages:
      - id: 1
        name: board_member_name
        label: Board Member Name
        hint: Name of member being assessed
        type: text
        options: []
        required: true
      - id: 2
        name: assessment_period
        label: Assessment Period
        hint: Time period being evaluated
        type: select_one
        options:
          - Q1 2026
          - Q2 2026
          - Q3 2026
          - Q4 2026
          - Annual 2025
          - Custom Period
        required: true
      - id: 3
        name: reviewer_name
        label: Reviewer Name
        hint: Name of person completing assessment
        type: text
        options: []
        required: true
      - id: 4
        name: reviewer_relationship
        label: Reviewer Relationship
        hint: Your relationship to the member
        type: select_one
        options:
          - Board Chair
          - Fellow Board Member
          - Executive Director
          - Committee Chair
          - Self-Assessment
        required: true
      - id: 5
        name: meeting_attendance
        label: Meeting Attendance
        hint: Rate attendance at board meetings
        type: select_one
        options:
          - Excellent - Attended all meetings
          - Good - Attended most meetings
          - Average - Attended some meetings
          - Below Average - Missed many meetings
          - Poor - Rarely attended
        required: true
      - id: 6
        name: meeting_preparation
        label: Meeting Preparation
        hint: Rate level of preparation
        type: select_one
        options:
          - Excellent - Always well prepared
          - Good - Usually prepared
          - Average - Sometimes prepared
          - Below Average - Rarely prepared
          - Poor - Never prepared
        required: true
      - id: 7
        name: participation_in_discussions
        label: Participation in Discussions
        hint: Rate quality of participation
        type: select_one
        options:
          - Excellent - Actively contributes
          - Good - Regularly contributes
          - Average - Occasionally contributes
          - Below Average - Rarely contributes
          - Poor - Does not participate
        required: true
      - id: 8
        name: committee_participation
        label: Committee Participation
        hint: Rate committee involvement
        type: select_one
        options:
          - Excellent - Highly active
          - Good - Regularly participates
          - Average - Somewhat active
          - Below Average - Minimal participation
          - Not Applicable
        required: false
      - id: 9
        name: strategic_thinking
        label: Strategic Thinking
        hint: Rate strategic contribution
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 10
        name: financial_oversight
        label: Financial Oversight
        hint: Rate financial stewardship
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
          - Not Applicable
        required: false
      - id: 11
        name: fundraising_contribution
