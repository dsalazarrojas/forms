        hint: Identify areas needing improvement
        type: text
        options: []
        required: false
      - id: 18
        name: recommendation
        label: Recommendation for Next Term
        hint: Would you recommend continued service?
        type: select_one
        options:
          - Strongly recommend reappointment
          - Recommend reappointment
          - Recommend with conditions
          - Do not recommend reappointment
        required: true
      - id: 19
        name: additional_comments
        label: Additional Comments
        hint: Any other observations
        type: text
        options: []
        required: false
