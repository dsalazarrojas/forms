inputSchema:
  type: object
  properties:
    title: Website Content Access Authorization Form
    pages:
    - id: 1
      name: organization
      label: Organization Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: access_level
      label: Access Level
      hint: null
      type: select_one
      options:
      - Level 1
      - Level 2
      - Level 3
      required: true
    - id: 3
      name: access_type
      label: Access Type
      hint: null
      type: select_multiple
      options:
      - Read
      - Edit
      - Delete
      required: false
    - id: 4
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - John
      - Jane
      - Doe
      required: true
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
