inputSchema:
  type: object
  properties:
    title: Community Service Hours Form
    pages:
    - id: 1
      name: section_volunteer
      label: -- Volunteer Profile --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: volunteer_name
      label: Volunteer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: volunteer_email
      label: Volunteer Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: volunteer_phone
      label: Volunteer Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: program_type
      label: Program Type
      hint: Why are you completing these hours?
      type: select_one
      options:
      - School Requirement
      - Court Mandated
      - Personal Interest
      - Corporate Social Responsibility
      - Other
      required: true
    - id: 6
      name: organization_name
      label: Name of Organization Served
      hint: The non-profit where you volunteered.
      type: text
      options: []
      required: true
    - id: 7
      name: section_service
      label: -- Service Record --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: service_date
      label: Date of Service
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 11
      name: hours_completed
      label: Number of Hours Completed
      hint: e.g. 4.5
      type: number
      options: []
      required: true
    - id: 12
      name: description_of_service
      label: Brief Description of Duties
      hint: What did you do during this session?
      type: text
      options: []
      required: true
    - id: 13
      name: section_supervisor
      label: -- Supervisor Verification --
      hint: To be completed by the supervisor.
      type: note
      options: []
      required: false
    - id: 14
      name: supervisor_name
      label: Supervisor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: supervisor_title
      label: Supervisor Title
      hint: e.g. Project Manager, Director.
      type: text
      options: []
      required: true
    - id: 16
      name: supervisor_phone
      label: Supervisor Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: verification_statement
      label: Supervisor - I verify these hours are correct
      hint: null
      type: select_one
      options:
      - I Verify
      - I Do Not Verify
      required: true
    - id: 18
      name: verification_date
      label: Verification Date
      hint: null
      type: date
      options: []
      required: true
