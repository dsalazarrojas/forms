inputSchema:
  type: object
  properties:
    title: Gym Cleaning Checklist
    pages:
    - id: 1
      name: fitness_center_info
      label: Fitness Center Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: facilities
      label: Facilities
      hint: null
      type: select_one
      options:
      - Locker Rooms
      - Showering Areas
      - Sauna
      - Restrooms
      - Exercise Rooms
      required: false
    - id: 3
      name: equipment
      label: Equipment
      hint: null
      type: select_multiple
      options:
      - Treadmill
      - Exercise Bike
      - Weights
      - Resistance Machines
      required: false
    - id: 4
      name: cleaning_frequency
      label: Cleaning Frequency
      hint: How frequently should the gym be cleaned?
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Yearly
      required: false
    - id: 5
      name: cleaning_standards
      label: Cleaning Standards
      hint: What cleaning standards are to be followed?
      type: select_multiple
      options:
      - Sanitation
      - Hygiene
      - Organization
      required: false
