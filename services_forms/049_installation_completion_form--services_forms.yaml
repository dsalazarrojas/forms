inputSchema:
  type: object
  properties:
    title: Installation Completion Form
    pages:
    - id: 1
      name: project_details
      label: Project Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: installation_details
      label: Installation Details
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: satisfaction
      label: Satisfaction
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: date_installed
      label: Date Installed
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: installation_comments
      label: Installation Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: project_status
      label: Project Status
      hint: null
      type: select_multiple
      options:
      - Complete
      - Incomplete
      - Not Started
      required: true
    - id: 10
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
