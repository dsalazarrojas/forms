inputSchema:
  type: object
  properties:
    title: CREATE Contact Form With Image Upload
    pages:
    - id: 1
      name: contact_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: contact_email
      label: Your Email Address
      hint: We will reply to this address
      type: email
      options: []
      required: true
    - id: 3
      name: contact_phone
      label: Your Phone Number
      hint: Optional but helpful
      type: text
      options: []
      required: false
    - id: 4
      name: company_name
      label: Company or Organization Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 5
      name: subject
      label: Subject of Inquiry
      hint: Brief topic of your message
      type: text
      options: []
      required: true
    - id: 6
      name: inquiry_type
      label: Type of Inquiry
      hint: Choose the best category
      type: select_one
      options:
      - General inquiry
      - Service request
      - Technical support
      - Sales inquiry
      - Complaint
      - Feedback
      - Partnership
      - Other
      required: true
    - id: 7
      name: message
      label: Your Message
      hint: Tell us more about your inquiry
      type: text
      options: []
      required: true
    - id: 8
      name: priority
      label: Priority Level
      hint: How urgent is this
      type: select_one
      options:
      - Low
      - Medium
      - High
      - Urgent
      required: false
    - id: 9
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How would you like us to respond
      type: select_one
      options:
      - Email
      - Phone
      - Text message
      - Either email or phone
      required: false
    - id: 10
      name: best_contact_time
      label: Best Time to Contact
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Anytime
      required: false
    - id: 11
      name: service_interested
      label: Service or Product Interested In
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: budget
      label: Approximate Budget
      hint: If applicable
      type: select_one
      options:
      - Under 500
      - 500-1000
      - 1000-5000
      - 5000-10000
      - Over 10000
      - No budget set
      required: false
    - id: 13
      name: timeline
      label: Project Timeline
      hint: When do you need this
      type: select_one
      options:
      - ASAP
      - Within 1 week
      - Within 1 month
      - 1-3 months
      - 3-6 months
      - No specific timeline
      required: false
    - id: 14
      name: image_upload_primary
      label: Primary Image or Photo
      hint: Upload a relevant image
      type: text
      options: []
      required: false
    - id: 15
      name: image_upload_secondary
      label: Secondary Image or Document
      hint: Optional additional image
      type: text
      options: []
      required: false
    - id: 16
      name: image_upload_tertiary
      label: Additional Attachment or Photo
      hint: If needed
      type: text
      options: []
      required: false
    - id: 17
      name: reference_number
      label: Reference Number or Ticket ID
      hint: If you have an existing ticket
      type: text
      options: []
      required: false
    - id: 18
      name: subscribed
      label: Subscribe to Updates and Newsletters
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 19
      name: consent
      label: I Consent to Being Contacted
      hint: null
      type: select_one
      options:
      - Yes, contact me
      - No, do not contact
      required: true
    - id: 20
      name: additional_notes
      label: Additional Comments or Notes
      hint: Anything else we should know
      type: text
      options: []
      required: false
