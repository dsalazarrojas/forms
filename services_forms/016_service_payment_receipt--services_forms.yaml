inputSchema:
  type: object
  properties:
    title: Service Payment Receipt
    pages:
    - id: 1
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: client_email
      label: Client Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: client_phone
      label: Client Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Cash
      - Online Transfer
      required: false
    - id: 7
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Paid
      - Pending
      - Partially Paid
      required: false
    - id: 8
      name: payment_terms
      label: Payment Terms
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: service_details
      label: Service Details
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: payment_notes
      label: Payment Notes
      hint: null
      type: text
      options: []
      required: false
