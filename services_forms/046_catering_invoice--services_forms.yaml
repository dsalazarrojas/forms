      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: preferred_payment_channel
      label: Preferred Payment Channel
      hint: null
      type: select_one
      options:
      - Bank Transfer (wire)
      - Online Portal (Credit Card)
      - Company Check by Mail
      - Cash upon service
      required: true
    - id: 20
      name: billing_manager_signature
      label: Authorized Billing Manager
      hint: null
      type: text
      options: []
      required: true
