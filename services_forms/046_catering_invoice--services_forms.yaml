      type: text
      options: []
      required: true
    - id: 3
      name: invoice_date
      label: Date of Invoice
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: payment_due_date
      label: Payment Due Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: section_client_info
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: client_name
      label: Client or Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: billing_address
      label: Billing Address
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: client_email_billing
      label: Billing Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: section_event_summary
      label: -- Event Summary --
      hint: null
      type: note
      options: []
      required: false
