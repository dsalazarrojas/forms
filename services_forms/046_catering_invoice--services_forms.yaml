      name: event_name_ref
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: event_date_service
      label: Date of Service
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: section_line_items
      label: -- Billed Items --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: items_description_summary
      label: Description of Services and Products
      hint: List items and quantities
      type: text
      options: []
      required: true
    - id: 14
      name: subtotal_amount
      label: Subtotal Amount
      hint: Before tax and fees
      type: number
      options: []
      required: true
    - id: 15
      name: sales_tax_amount
      label: Sales Tax
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: service_charge_gratuity
      label: Service Charge or Gratuity
      hint: null
      type: number
      options: []
      required: false
