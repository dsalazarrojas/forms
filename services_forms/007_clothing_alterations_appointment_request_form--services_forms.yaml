inputSchema:
  type: object
  properties:
    title: Clothing Alterations Appointment Request Form
    pages:
    - id: 1
      name: section_customer
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Primary contact number
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: section_appointment
      label: -- Appointment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: preferred_date
      label: Preferred Appointment Date
      hint: When would you like to come in?
      type: date
      options: []
      required: true
    - id: 7
      name: preferred_time
      label: Preferred Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: appointment_type
      label: Type of Alteration Needed
      hint: null
      type: select_one
      options:
      - Hemming
      - Taking in
      - Letting out
      - Sleeve adjustment
      - Zipper replacement
      - Button replacement
      - General repair
      - Other
      required: true
    - id: 9
      name: garment_type
      label: Type of Garment
      hint: null
      type: select_one
      options:
      - Pants
      - Dress
      - Shirt
      - Jacket
      - Skirt
      - Coat
      - Other
      required: true
    - id: 10
      name: garment_color
      label: Garment Color
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: garment_condition
      label: Current Condition of Garment
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Has stains or damage
      required: true
    - id: 12
      name: section_alterations
      label: -- Alteration Specifics --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: alteration_description
      label: Describe the Alterations Needed
      hint: Be as specific as possible
      type: text
      options: []
      required: true
    - id: 14
      name: current_measurement
      label: Current Measurement - Inches
      hint: If applicable for hemming or length
      type: number
      options: []
      required: false
    - id: 15
      name: desired_measurement
      label: Desired Measurement - Inches
      hint: Target measurement after alteration
      type: number
      options: []
      required: false
    - id: 16
      name: reference_photo
      label: Do you have a reference photo?
      hint: Showing desired style or fit
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 17
      name: section_logistics
      label: -- Logistics --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: turnaround_time
      label: Preferred Turnaround Time
      hint: How quickly do you need this done?
      type: select_one
      options:
      - ASAP - Rush service
      - 1-2 weeks
      - 2-3 weeks
      - 3-4 weeks
      - No rush
      required: true
    - id: 19
      name: rush_fee_acceptance
      label: Accept rush fees if applicable?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 20
      name: additional_notes
      label: Additional Notes or Special Requests
      hint: null
      type: text
      options: []
      required: false
