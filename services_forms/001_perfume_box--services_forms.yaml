inputSchema:
  type: object
  properties:
    title: Perfume Box
    pages:
    - id: 1
      name: life_aspects
      label: Each aspect of life
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: suscripcion_mensual
      label: Monthly subscription
      hint: null
      type: select_one
      options:
      - Monthly subscription
      - One time payment
      required: true
    - id: 3
      name: payment_plan
      label: Payment plan
      hint: null
      type: select_multiple
      options:
      - Monthly subscription
      - Weekly subscription
      - One time payment
      - Custom payment plan
      required: false
    - id: 4
      name: perfume_combination
      label: Perfume combination
      hint: null
      type: select_multiple
      options:
      - Classic
      - Eau de Toilette
      - Parfum
      - Cologne
      required: false
    - id: 5
      name: shipping_method
      label: Shipping method
      hint: null
      type: select_one
      options:
      - Express delivery
      - Standard delivery
      - Pick-up
      required: true
    - id: 6
      name: shipping_address
      label: Shipping address
      hint: null
      type: select_one
      options:
      - Address
      - Zip code
      - City
      - State
      - Country
      required: true
    - id: 7
      name: payment_method
      label: Payment method
      hint: null
      type: select_one
      options:
      - Credit card
      - PayPal
      - Bank transfer
      required: true
    - id: 8
      name: payment_info
      label: Payment info
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: shipping_cost
      label: Shipping cost
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: total_cost
      label: Total cost
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: shipping_time
      label: Shipping time
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: shipping_status
      label: Shipping status
      hint: null
      type: select_one
      options:
      - Delivered
      - Pending
      - Failed
      required: false
    - id: 13
      name: shipping_tracking_number
      label: Shipping tracking number
      hint: null
      type: text
      options: []
      required: false
