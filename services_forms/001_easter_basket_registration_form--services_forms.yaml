inputSchema:
  type: object
  properties:
    title: easter_basket_registration_form
    pages:
    - id: 1
      name: introduction_and_personal_details
      label: Introduction and Personal Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: basket_preferences
      label: Basket Preferences
      hint: null
      type: select_one
      options:
      - What is your favorite color for the Easter basket?
      - What shape of basket would you prefer?
      - How big would you like your basket to be?
      required: true
    - id: 3
      name: additional_questions
      label: Additional Questions
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_information
      label: Contact Information
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: payment_information
      label: Payment Information
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: special_requests
      label: Special Requests
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: confirm
      label: Confirm
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Bank Transfer
      - Credit Card
      - PayPal
      required: true
    - id: 10
      name: confirm2
      label: Confirm 2
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: false
