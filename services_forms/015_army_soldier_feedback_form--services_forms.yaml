inputSchema:
  type: object
  properties:
    title: Army Soldier Feedback Form
    pages:
    - id: 1
      name: section_participant
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: soldier_name
      label: Soldier Name
      hint: Optional - responses can be anonymous
      type: text
      options: []
      required: false
    - id: 3
      name: rank
      label: Rank
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: unit
      label: Unit or Department
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: service_branch
      label: Service Branch
      hint: null
      type: select_one
      options:
      - Army
      - Army National Guard
      - Army Reserve
      required: false
    - id: 6
      name: years_of_service
      label: Years of Service
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: feedback_date
      label: Date of Feedback
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: section_satisfaction
      label: -- Service Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: overall_satisfaction
      label: Overall Satisfaction with Military Service
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 10
      name: leadership_quality
      label: Quality of Leadership in Your Unit
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: training_quality
      label: Quality of Training Received
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 12
      name: support_services
      label: Availability of Support Services
      hint: Medical, mental health, family support
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: work_environment
      label: Work Environment and Conditions
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: compensation_satisfaction
      label: Satisfaction with Pay and Benefits
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 15
      name: career_development
      label: Career Development Opportunities
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 16
      name: section_challenges
      label: -- Challenges and Concerns --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: main_challenges
      label: Main Challenges You Face
      hint: null
      type: select_multiple
      options:
      - Work-life balance
      - Lack of resources
      - Leadership issues
      - Physical demands
      - Mental health concerns
      - Family separation
      - Lack of advancement
      required: false
    - id: 18
      name: challenges_details
      label: Additional Details About Challenges
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: improvement_suggestions
      label: Suggestions for Improvement
      hint: What would enhance your military experience
      type: text
      options: []
      required: false
    - id: 20
      name: section_intention
      label: -- Future Plans --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: retention_intent
      label: Intent to Continue Service
      hint: null
      type: select_one
      options:
      - Plan to stay
      - Uncertain
      - Plan to leave
      required: true
    - id: 22
      name: additional_comments
      label: Additional Comments or Feedback
      hint: null
      type: text
      options: []
      required: false
