inputSchema:
  type: object
  properties:
    title: Income Reduction Form
    pages:
    - id: 1
      name: page_1
      label: Application Details
      hint: Enter details about your application
      type: note
      options: []
      required: false
    - id: 2
      name: page_2
      label: Mortgage Details
      hint: Enter mortgage details
      type: text
      options: []
      required: false
    - id: 3
      name: page_3
      label: Credit Information
      hint: Enter credit information
      type: select_one
      options:
      - Credit 1
      - Credit 2
      required: false
    - id: 4
      name: page_4
      label: Income Information
      hint: Enter income information
      type: date
      options: []
      required: false
    - id: 5
      name: page_5
      label: Signature
      hint: Enter your signature
      type: text
      options: []
      required: false
    - id: 6
      name: page_6
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: page_7
      label: Additional Information
      hint: Enter additional information
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 8
      name: page_8
      label: submission
      hint: Submit your application
      type: select_one
      options:
      - Submit
      - Cancel
      required: false
    - id: 9
      name: page_9
      label: back_to_start
      hint: Go back to the start
      type: select_one
      options:
      - Back
      - Continue
      required: false
    - id: 10
      name: page_10
      label: page_10
      hint: No hint
      type: text
      options: []
      required: false
