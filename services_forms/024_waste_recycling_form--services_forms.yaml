inputSchema:
  type: object
  properties:
    title: Waste Recycling Form
    pages:
    - id: 1
      name: waste_type
      label: Waste Type
      hint: null
      type: select_one
      options:
      - Landfill
      - Hazardous
      - Organics
      - Glass
      - Plastic
      - Metal
      - Paper
      - Electronics
      - Other
      required: true
    - id: 2
      name: amount
      label: Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact E-Mail
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: date_of_service
      label: Date of Service
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: time_of_service
      label: Time of Service
      hint: null
      type: time
      options: []
      required: true
