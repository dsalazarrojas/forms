inputSchema:
  type: object
  properties:
    title: new-project-brief
    pages:
    - id: 1
      name: client_interest
      label: Client Interest
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: project_name
      label: Project Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: project_type
      label: Project Type
      hint: null
      type: select_one
      options:
      - Services
      - product
      - Web Development
      required: false
    - id: 4
      name: project_start_date
      label: Project Start
      hint: Please enter date.report format (yyyy-mm-dd)
      type: date
      options: []
      required: false
    - id: 5
      name: project_end_date
      label: Project End
      hint: Please enter date.report format (yyyy-mm-dd)
      type: date
      options: []
      required: false
    - id: 6
      name: client_info
      label: Client Info
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: project_brief
      label: Project Brief
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: project_manager
      label: Project Manager
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: project_status
      label: Project Status
      hint: null
      type: select_one
      options:
      - Not Started
      - in progress
      - finished
      - canceled
      - completed
      required: false
    - id: 10
      name: project_budget
      label: Project Budget
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: project_lead_time
      label: Project Lead Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: project_location
      label: Project Location
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: project_description
      label: Project Description
      hint: null
      type: text
      options: []
      required: false
