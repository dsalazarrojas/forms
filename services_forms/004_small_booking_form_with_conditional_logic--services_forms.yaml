inputSchema:
  type: object
  properties:
    title: Small Booking Form With Conditional Logic
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: trip_type
      label: Trip Type
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Full Day
      required: false
    - id: 7
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: service_provider
      label: Service Provider
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: service_provider_2
      label: Service Provider 2
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: service_provider_3
      label: Service Provider 3
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: service_provider_4
      label: Service Provider 4
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
