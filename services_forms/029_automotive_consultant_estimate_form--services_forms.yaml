      name: additional_costs
      label: Additional Costs or Fees
      hint: Diagnostic fees, disposal, etc.
      type: number
      options: []
      required: false
    - id: 21
      name: total_estimate
      label: Total Estimate
      hint: null
      type: number
      options: []
      required: true
