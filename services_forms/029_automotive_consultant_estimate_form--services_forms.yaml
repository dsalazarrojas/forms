      - 1-2 Days
      - 3-5 Days
      - 1-2 Weeks
      - 2-4 Weeks
      - Custom Timeline
      required: true
    - id: 24
      name: warranty_offered
      label: Warranty on Work
      hint: null
      type: text
      options: []
      required: false
