inputSchema:
  type: object
  properties:
    title: Therapist Service Invoice
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: duration
      label: Session Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: session_details
      label: Session Details
      hint: Provide a detailed description of the session
      type: text
      options: []
      required: false
    - id: 5
      name: total_session_fees
      label: Total Session Fees
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: payment_received
      label: Payment Received
      hint: null
      type: select_one
      options:
      - '{''value'': False}'
      - '{''value'': True}'
      required: false
    - id: 7
      name: payment_method
      label: Payment Method
      hint: Check or bank transfer
      type: select_multiple
      options:
      - '{''value'': ''Check''}'
      - '{''value'': ''Bank Transfer''}'
      required: false
    - id: 8
      name: session_notes
      label: Session Notes
      hint: Notes about the session
      type: note
      options: []
      required: false
