inputSchema:
  type: object
  properties:
    title: Book In A Service Form
    pages:
    - id: 1
      name: customer_name
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: We will send confirmation here
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: For appointment coordination
      type: text
      options: []
      required: true
    - id: 4
      name: service_type
      label: Type of Service
      hint: Select the service you need
      type: select_one
      options:
      - Book Binding Repair
      - Book Restoration
      - Book Cleaning
      - Book Appraisal
      - Book Digitization
      - Book Conservation
      - Custom Book Box
      - Book Shelving Installation
      required: true
    - id: 5
      name: book_title
      label: Book Title
      hint: Title of the book needing service
      type: text
      options: []
      required: true
    - id: 6
      name: book_author
      label: Book Author
      hint: Author of the book
      type: text
      options: []
      required: false
    - id: 7
      name: book_description
      label: Book Description
      hint: Describe the book and its condition
      type: text
      options: []
      required: true
    - id: 8
      name: book_age
      label: Approximate Age of Book
      hint: How old is the book
      type: select_one
      options:
      - Less than 10 years
      - 10-25 years
      - 25-50 years
      - 50-100 years
      - Over 100 years
      - Unknown
      required: true
    - id: 9
      name: book_value
      label: Estimated Book Value
      hint: Approximate value if known
      type: select_one
      options:
      - Under $50
      - $50-$100
      - $100-$500
      - $500-$1000
      - Over $1000
      - Unknown
      required: false
    - id: 10
      name: damage_description
      label: Description of Damage or Issue
      hint: Describe what needs to be fixed
      type: text
      options: []
      required: true
    - id: 11
      name: damage_photos
      label: Photos of Damage
      hint: Upload photos if possible
      type: text
      options: []
      required: false
    - id: 12
      name: urgency
      label: How Urgent Is This Service
      hint: Select urgency level
      type: select_one
      options:
      - Not Urgent
      - Somewhat Urgent
      - Urgent
      - Very Urgent
      required: true
    - id: 13
      name: preferred_date
      label: Preferred Service Date
      hint: When would you like service
      type: date
      options: []
      required: false
    - id: 14
      name: preferred_time
      label: Preferred Time
      hint: What time works best
      type: time
      options: []
      required: false
    - id: 15
      name: service_location
      label: Service Location Preference
      hint: Where should service be performed
      type: select_one
      options:
      - Bring to Shop
      - Home Visit
      - Mail In Service
      - No Preference
      required: true
    - id: 16
      name: address
      label: Service Address
      hint: Full address for service
      type: text
      options: []
      required: false
    - id: 17
      name: budget_range
      label: Estimated Budget Range
      hint: Your expected budget
      type: select_one
      options:
      - Under $50
      - $50-$100
      - $100-$250
      - $250-$500
      - Over $500
      required: false
    - id: 18
      name: previous_service
      label: Have You Used Our Services Before
      hint: Your previous experience with us
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 19
      name: how_did_you_hear
      label: How Did You Hear About Us
      hint: How did you find our services
      type: select_one
      options:
      - Search Engine
      - Social Media
      - Referral
      - Website
      - Advertisement
      - Other
      required: false
    - id: 20
      name: additional_comments
      label: Additional Comments
      hint: Any other information to share
      type: text
      options: []
      required: false
    - id: 21
      name: terms_agreement
      label: I Agree to Service Terms
      hint: By selecting yes you agree to terms
      type: select_one
      options:
      - Yes I agree
      - No I do not agree
      required: true
