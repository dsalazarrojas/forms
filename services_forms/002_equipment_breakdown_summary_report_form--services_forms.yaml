inputSchema:
  type: object
  properties:
    title: equipment_breakdown_summary_report_form
    pages:
    - id: 1
      name: summary
      label: Summary
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: equipment_details
      label: equipment_details
      hint: Equipment details, including model number and location
      type: text
      options: []
      required: false
    - id: 3
      name: failure_description
      label: failure_description
      hint: Describe the failure
      type: text
      options: []
      required: false
    - id: 4
      name: repair_details
      label: repair_details
      hint: Repair details and cost
      type: text
      options: []
      required: false
    - id: 5
      name: incident_history
      label: incident_history
      hint: Incident history
      type: text
      options: []
      required: false
    - id: 6
      name: equipment_status
      label: status
      hint: null
      type: select_one
      options:
      - Functional
      - Non-functional
      - Offline
      required: true
    - id: 7
      name: maintenance_frequency
      label: maintenance_frequency
      hint: How often maintenance is performed
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 8
      name: last_maintenance
      label: last_maintenance
      hint: Date of last maintenance
      type: date
      options: []
      required: false
    - id: 9
      name: last_inspection
      label: last_inspection
      hint: Last inspection date
      type: date
      options: []
      required: false
