inputSchema:
  type: object
  properties:
    title: Crowd Funding Forms
    pages:
    - id: 1
      name: main_project_form
      label: Project Information
      hint: Please provide your project details below.
      type: text
      options: []
      required: false
    - id: 2
      name: main_project_form_contact_info
      label: Main Project Contact Information
      hint: Your contact information is private.
      type: text
      options: []
      required: true
    - id: 3
      name: main_project_form_contact_name
      label: Main Project Contact Name
      hint: Your contact name should match your name on this form.
      type: text
      options: []
      required: true
    - id: 4
      name: main_project_form_contact_email
      label: Main Project Contact Email
      hint: We will use this for communication.
      type: text
      options: []
      required: true
    - id: 5
      name: main_project_form_contact_phone
      label: Main Project Contact Phone Number
      hint: We will use this for communication.
      type: text
      options: []
      required: true
    - id: 6
      name: main_project_form_deadline
      label: Main Project Deadline
      hint: When is the deadline for the project?
      type: date
      options: []
      required: true
    - id: 7
      name: main_project_form_timeframe
      label: Main Project Timeframe
      hint: What is the timeframe for the project?
      type: time
      options: []
      required: true
    - id: 8
      name: backer_info_form
      label: Backer's Information
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: backer_info_form_contact_email
      label: Backer's Contact Email
      hint: We will use this for communication.
      type: text
      options: []
      required: false
    - id: 10
      name: backer_info_form_contact_phone
      label: Backer's Contact Phone Number
      hint: We will use this for communication.
      type: text
      options: []
      required: false
    - id: 11
      name: backer_info_form_notes
      label: Backer's Notes
      hint: Any additional notes.
      type: note
      options: []
      required: false
    - id: 12
      name: backer_info_form_confirmation
      label: Backer's Confirmation
      hint: Please confirm your contact information.
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 13
      name: backer_info_form_agreement
      label: Backer's Agreement
      hint: Please agree to our terms and conditions.
      type: checkbox
      options:
      - I agree
      - I do not agree
      required: true
    - id: 14
      name: backer_info_form_notes2
      label: Backer's Notes 2
      hint: Any additional notes.
      type: note
      options: []
      required: false
