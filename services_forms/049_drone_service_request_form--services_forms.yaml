inputSchema:
  type: object
  properties:
    title: Drone Service Request Form
    pages:
    - id: 1
      name: service_type
      label: Drone Service Type
      hint: null
      type: select_one
      options:
      - Aerial Photography
      - Drone Surveying
      - Event Coverage
      required: false
    - id: 2
      name: service_location
      label: Service Location
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: service_date
      label: Service Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: service_time
      label: Service Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: service_details
      label: Service Details
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: service_request
      label: Service Request
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: service_description
      label: Service Description
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: drone_type
      label: Drone Type
      hint: null
      type: select_one
      options:
      - Camera Drone
      - Thermal Drone
      - Obstacle Avoidance Drone
      required: false
