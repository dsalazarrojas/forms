inputSchema:
  type: object
  properties:
    title: Client Consent - Waxing
    pages:
    - id: 1
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: date
      label: Today's Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: section_health
      label: -- Waxing Health History --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: accutane_use
      label: Have you used Accutane in the last year?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 6
      name: topical_exfoliants
      label: Are you using Retin-A, Differin, or other topical exfoliants?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 7
      name: allergies
      label: List any known allergies - e.g. latex, wax, fragrance
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: pregnant_nursing
      label: Are you currently pregnant or nursing?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 9
      name: area_to_wax
      label: Areas to be waxed
      hint: null
      type: select_multiple
      options:
      - Eyebrows
      - Upper Lip
      - Chin
      - Underarms
      - Legs
      - Bikini
      - Back
      - Chest
      required: true
    - id: 10
      name: section_consent
      label: -- Consent and Aftercare --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: risk_acknowledgment
      label: I understand the risks of waxing including redness and irritation
      hint: null
      type: select_one
      options:
      - true
      - I understand
      required: true
    - id: 12
      name: aftercare_commitment
      label: I will follow the provided aftercare instructions
      hint: null
      type: select_one
      options:
      - true
      - I agree
      required: true
