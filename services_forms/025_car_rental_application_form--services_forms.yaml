inputSchema:
  type: object
  properties:
    title: Car Rental Application Form
    pages:
    - id: 1
      name: renter_information
      label: Renter Information
      hint: Your personal details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: Must be 21 or older
      type: date
      options: []
      required: true
    - id: 5
      name: email
      label: Email Address
      hint: For reservation communications
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 7
      name: address
      label: Street Address
      hint: Your address
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: true
    - id: 9
      name: state
      label: State
      hint: Your state
      type: text
      options: []
      required: true
    - id: 10
      name: zip_code
      label: ZIP Code
      hint: Your ZIP code
      type: text
      options: []
      required: true
    - id: 11
      name: license_information
      label: License Information
      hint: Driver's license details
      type: note
      options: []
      required: false
    - id: 12
      name: license_number
      label: Driver's License Number
      hint: Your license number
      type: text
      options: []
      required: true
    - id: 13
      name: license_state
      label: License State
      hint: State that issued license
      type: text
      options: []
      required: true
    - id: 14
      name: license_country
      label: License Country
      hint: Country of issuance
      type: text
      options: []
      required: true
    - id: 15
      name: license_expiry
      label: License Expiration
      hint: Expiration date
      type: date
      options: []
      required: true
    - id: 16
      name: rental_details
      label: Rental Details
      hint: Your rental preferences
      type: note
      options: []
      required: false
    - id: 17
      name: pickup_location
      label: Pickup Location
      hint: Where to pick up?
      type: select_one
      options:
      - Airport Location
      - Downtown Location
      - Suburban Location
      - Hotel Delivery
      - Other
      required: true
    - id: 18
      name: pickup_location_address
      label: Pickup Address
      hint: Specific address
      type: text
      options: []
      required: false
    - id: 19
      name: pickup_date
      label: Pickup Date
      hint: When to pick up?
      type: date
      options: []
      required: true
    - id: 20
      name: pickup_time
      label: Pickup Time
      hint: What time?
      type: time
      options: []
      required: true
    - id: 21
      name: return_location
      label: Return Location
      hint: Where to return?
      type: select_one
      options:
      - Same as pickup
      - Different location
      required: true
    - id: 22
      name: return_location_address
      label: Return Address
      hint: If different
      type: text
      options: []
      required: false
    - id: 23
      name: return_date
      label: Return Date
      hint: When to return?
      type: date
      options: []
      required: true
    - id: 24
      name: return_time
      label: Return Time
      hint: What time?
      type: time
      options: []
      required: true
    - id: 25
      name: rental_duration
      label: Rental Duration
      hint: How long?
      type: select_one
      options:
      - 1 day
      - 2-3 days
      - 4-7 days
      - 1-2 weeks
      - Over 2 weeks
      required: true
    - id: 26
      name: vehicle_preference
      label: Vehicle Preference
      hint: What type of vehicle?
      type: select_one
      options:
      - Economy
      - Compact
      - Mid-size
      - Full-size
      - SUV
      - Minivan
      - Luxury
      - Sports car
      - Truck
      - No preference
      required: true
    - id: 27
      name: specific_vehicle
      label: Specific Vehicle Request
      hint: If you have a preference
      type: text
      options: []
      required: false
    - id: 28
      name: transmission_type
      label: Transmission Type
      hint: Preference
      type: select_one
      options:
      - Automatic
      - Manual
      - No preference
      required: true
    - id: 29
      name: fuel_preference
      label: Fuel Preference
      hint: Fuel type
      type: select_one
      options:
      - Gasoline
      - Diesel
      - Hybrid
      - Electric
      - No preference
      required: true
    - id: 30
      name: passenger_capacity
      label: Passenger Capacity
      hint: How many passengers?
      type: select_one
      options:
      - 1-2
      - 3-4
      - 5-6
      - 7-8
      - 9+
      required: true
    - id: 31
      name: luggage_capacity
      label: Luggage Capacity
      hint: How many bags?
      type: select_one
      options:
      - 1-2 bags
      - 3-4 bags
      - 5-6 bags
      - 7+ bags
      required: true
    - id: 32
      name: additional_services
      label: Additional Services
      hint: Add-ons
      type: select_multiple
      options:
      - GPS Navigation
      - Child Safety Seat
      - Booster Seat
      - Additional Driver
      - Ski Rack
      - Bike Rack
      - Toll Pass
      - Mobile WiFi
      - None
      required: false
    - id: 33
      name: insurance_coverage
      label: Insurance Coverage
      hint: Coverage options
      type: select_multiple
      options:
      - Collision Damage Waiver
      - Liability Insurance
      - Personal Accident Insurance
      - Personal Effects Coverage
      - Roadside Assistance
      - Decline all coverage
      required: true
    - id: 34
      name: personal_insurance
      label: Personal Insurance
      hint: Do you have personal coverage?
      type: select_one
      options:
      - Yes - through auto insurance
      - Yes - through credit card
      - 'False'
      - Unsure
      required: false
    - id: 35
      name: payment_information
      label: Payment Information
      hint: Payment details
      type: note
      options: []
      required: false
    - id: 36
      name: payment_method
      label: Payment Method
      hint: How will you pay?
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Cash Deposit
      - Corporate Account
      required: true
    - id: 37
      name: card_type
      label: Card Type
      hint: Type of card
      type: select_one
      options:
      - Visa
      - MasterCard
      - American Express
      - Discover
      required: false
    - id: 38
      name: cardholder_name
      label: Cardholder Name
      hint: Name on card
      type: text
      options: []
      required: false
    - id: 39
      name: billing_address
      label: Billing Address
      hint: Address on card
      type: text
      options: []
      required: false
    - id: 40
      name: purpose_of_rental
      label: Purpose of Rental
      hint: Why are you renting?
      type: select_one
      options:
      - Business
      - Leisure/Vacation
      - Personal vehicle repair
      - Special event
      - Test drive
      - Other
      required: true
    - id: 41
      name: estimated_mileage
      label: Estimated Mileage
      hint: How many miles expected?
      type: select_one
      options:
      - Under 100 miles
      - 100-300 miles
      - 300-500 miles
      - Over 500 miles
      required: false
    - id: 42
      name: special_requests
      label: Special Requests
      hint: Any special requirements?
      type: text
      options: []
      required: false
    - id: 43
      name: how_heard_about_us
      label: How Did You Hear About Us
      hint: Your referral source
      type: select_one
      options:
      - Website
      - Mobile app
      - Travel agent
      - Airline partner
      - Previous rental
      - Advertisement
      - Other
      required: false
    - id: 44
      name: loyalty_program
      label: Loyalty Program
      hint: Are you a member?
      type: select_one
      options:
      - Yes - member
      - No - want to join
      - 'False'
      required: false
    - id: 45
      name: loyalty_number
      label: Loyalty Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 46
      name: terms_agreement
      label: Terms Agreement
      hint: Do you agree to terms?
      type: select_one
      options:
      - I agree to the rental terms and conditions
      - I do not agree
      required: true
    - id: 47
      name: application_date
      label: Application Date
      hint: Today's date
      type: date
      options: []
      required: true
