inputSchema:
  type: object
  properties:
    title: Brand Identity Questionnaire
    pages:
      - id: 1
        name: business_name
        label: Business Name
        hint: Official name of your business
        type: text
        options: []
        required: true
      - id: 2
        name: contact_name
        label: Contact Person Name
        hint: Primary contact for this project
        type: text
        options: []
        required: true
      - id: 3
        name: contact_email
        label: Contact Email
        hint: Email address for communications
        type: email
        options: []
        required: true
      - id: 4
        name: business_description
        label: Business Description
        hint: Describe what your business does
        type: text
        options: []
        required: true
      - id: 5
        name: years_in_business
        label: Years in Business
        hint: How long has your business operated
        type: select_one
        options:
          - Startup (Less than 1 year)
          - 1-3 years
          - 4-10 years
          - 10+ years
        required: true
      - id: 6
        name: mission_statement
        label: Mission Statement
        hint: What is your business mission
        type: text
        options: []
        required: true
      - id: 7
        name: unique_value_proposition
        label: Unique Value Proposition
        hint: What makes you different from competitors
        type: text
        options: []
        required: true
      - id: 8
        name: target_market
        label: Target Market
        hint: Describe your ideal customer
        type: text
        options: []
        required: true
      - id: 9
        name: customer_demographics
        label: Customer Demographics
        hint: Age, gender, location, income level
        type: text
        options: []
        required: true
      - id: 10
        name: brand_personality
        label: Brand Personality
        hint: If your brand was a person, describe them
        type: text
        options: []
        required: true
      - id: 11
        name: brand_attributes
        label: Brand Attributes
        hint: Select words that describe your brand
        type: select_multiple
        options:
          - Innovative
          - Trustworthy
          - Friendly
          - Professional
          - Luxurious
          - Affordable
          - Sustainable
          - Bold
          - Creative
          - Reliable
        required: true
      - id: 12
        name: primary_competitors
        label: Primary Competitors
        hint: Who are your main competitors
        type: text
        options: []
        required: true
      - id: 13
        name: competitor_differentiation
        label: How You Differ from Competitors
        hint: What sets you apart
        type: text
        options: []
        required: true
      - id: 14
        name: existing_brand_elements
        label: Existing Brand Elements
        hint: Do you have existing logos or colors
        type: select_one
        options:
          - None
          - Logo Only
          - Colors Only
          - Full Brand Guidelines
        required: true
      - id: 15
        name: preferred_colors
        label: Preferred Colors
        hint: Colors you like for your brand
        type: text
        options: []
        required: false
      - id: 16
        name: colors_to_avoid
        label: Colors to Avoid
        hint: Any colors you do not want
        type: text
        options: []
        required: false
      - id: 17
        name: brand_applications
        label: Where Will Brand Be Used
        hint: Select all that apply
        type: select_multiple
        options:
          - Website
          - Social Media
          - Business Cards
          - Signage
          - Packaging
          - Advertising
          - Merchandise
          - Presentations
        required: true
      - id: 18
        name: design_inspiration
        label: Design Inspiration
        hint: Brands or designs you admire
        type: text
        options: []
        required: false
      - id: 19
        name: project_goals
        label: Project Goals
        hint: What do you want to achieve
        type: text
        options: []
        required: true
      - id: 20
        name: timeline_expectations
        label: Timeline Expectations
        hint: When do you need this completed
        type: text
        options: []
        required: true
