inputSchema:
  type: object
  properties:
    title: Tenant Reference Verification
    pages:
    - id: 1
      name: tenant_reference_verification_question_1
      label: How did you meet this tenant?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: tenant_reference_verification_question_2
      label: How long have you known the tenant?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: tenant_reference_verification_question_3
      label: How would you describe your relationship with the tenant?
      hint: null
      type: select_one
      options:
      - Friend
      - Family
      - Coworker
      required: false
    - id: 4
      name: tenant_reference_verification_question_4
      label: How would you describe the tenant's personality?
      hint: null
      type: select_multiple
      options:
      - Outgoing
      - Reserved
      - Assertive
      - Calm
      - Adventurous
      - Diplomatic
      required: false
    - id: 5
      name: tenant_reference_verification_question_5
      label: How would you describe the tenant's behavior?
      hint: null
      type: select_one
      options:
      - Timely
      - Unpredictable
      - Unreliable
      - Punctual
      required: false
    - id: 6
      name: tenant_reference_verification_question_6
      label: What is your experience with the tenant like?
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: tenant_reference_verification_question_7
      label: How would you rate your experience with the tenant?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: tenant_reference_verification_question_8
      label: How would you rate the quality of service provided by the tenant?
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: tenant_reference_verification_question_9
      label: What would you recommend the tenant for future business?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: tenant_reference_verification_question_10
      label: Would you like to contact the tenant again?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
