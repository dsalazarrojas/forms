inputSchema:
  type: object
  properties:
    title: Homeless Verification Form
    pages:
    - id: 1
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Undisclosed
      required: true
    - id: 7
      name: housing_benefit_type
      label: Housing Benefit Type
      hint: null
      type: select_multiple
      options:
      - Type 1
      - Type 2
      - Type 3
      - Other
      required: true
    - id: 8
      name: additional_info
      label: Additional Info
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: income
      label: Income
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: housing_status
      label: Housing Status
      hint: null
      type: select_one
      options:
      - Owner Occupier
      - Tenant
      - Other
      required: true
    - id: 11
      name: verification_date
      label: Verification Date
      hint: null
      type: date
      options: []
      required: false
