inputSchema:
  type: object
  properties:
    title: Bookstore Event Agreement
    pages:
    - id: 1
      name: event_organizer_name
      label: Event Organizer Name
      hint: Full name of the organizer
      type: text
      options: []
      required: true
    - id: 2
      name: organizer_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: organizer_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company or Business Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 5
      name: event_title
      label: Event Title
      hint: Name of the event
      type: text
      options: []
      required: true
    - id: 6
      name: event_date
      label: Event Date
      hint: When is the event scheduled
      type: date
      options: []
      required: true
    - id: 7
      name: event_time
      label: Event Time
      hint: Start time of event
      type: time
      options: []
      required: true
    - id: 8
      name: event_duration
      label: Expected Duration
      hint: How long will the event last
      type: select_one
      options:
      - 1 hour
      - 2 hours
      - 3 hours
      - 4 hours
      - 5 hours
      - All day
      - Other
      required: true
    - id: 9
      name: expected_attendees
      label: Expected Number of Attendees
      hint: Approximate guest count
      type: number
      options: []
      required: true
    - id: 10
      name: event_format
      label: Event Format
      hint: Type of event
      type: select_one
      options:
      - Author reading
      - Book signing
      - Workshop
      - Book launch
      - Discussion panel
      - Educational seminar
      - Community event
      - Other
      required: true
    - id: 11
      name: space_requirements
      label: Space Requirements
      hint: What space will be needed
      type: text
      options: []
      required: true
    - id: 12
      name: equipment_responsibility
      label: Who provides equipment
      hint: Audio, visual, seating, etc.
      type: select_one
      options:
      - Bookstore provides
      - Organizer provides
      - Split responsibility
      - To be determined
      required: true
    - id: 13
      name: liability_acknowledgement
      label: Liability Acknowledgement
      hint: Acknowledge liability terms
      type: select_one
      options:
      - I agree
      - I disagree
      - Need clarification
      required: true
    - id: 14
      name: cancellation_policy
      label: Cancellation Policy Agreement
      hint: Agree to cancellation terms
      type: select_one
      options:
      - I accept
      - I need to review
      - I do not accept
      required: true
    - id: 15
      name: signature_date
      label: Agreement Date
      hint: Date of this agreement
      type: date
      options: []
      required: true
