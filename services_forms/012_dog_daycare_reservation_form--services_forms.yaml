inputSchema:
  type: object
  properties:
    title: Dog Daycare Reservation Form
    pages:
    - id: 1
      name: reservation_details
      label: Reservation Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: reservation_date
      label: Reservation Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: reservation_notes
      label: Reservation Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: services
      label: Services
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Bank Transfer
      - Cash
      required: true
    - id: 8
      name: payment_terms
      label: Payment Terms
      hint: null
      type: text
      options: []
      required: false
