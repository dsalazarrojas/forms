inputSchema:
  type: object
  properties:
    title: Request A Service Recommendation
    pages:
    - id: 1
      name: service_request
      label: Service Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 3
      name: service_type
      label: Service Type
      hint: null
      type: select_multiple
      options:
      - home_service
      - medical_service
      - transportation_service
      required: false
    - id: 4
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: follow_up_required
      label: Follow up required
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: follow_up_date
      label: Follow up date
      hint: null
      type: date
      options: []
      required: false
