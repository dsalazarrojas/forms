      name: consent_to_services
      label: I Consent to Behavioral Consulting Services
      hint: Service authorization
      type: select_one
      options:
      - I Consent
      - I Do Not Consent
      required: true
    - id: 39
      name: information_accuracy
      label: I Confirm All Information Is Accurate
      hint: Truthfulness confirmation
      type: select_one
      options:
      - I Confirm
      - I Do Not Confirm
      required: true
    - id: 40
      name: intake_date
      label: Intake Date
      hint: null
      type: date
      options: []
      required: true
    - id: 41
      name: parent_guardian_signature
      label: Parent or Guardian Electronic Signature
      hint: Type your full name
      type: text
      options: []
      required: true
