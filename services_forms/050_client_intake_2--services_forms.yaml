      name: intervention_effectiveness
      label: Were Previous Interventions Effective?
      hint: If applicable
      type: select_one
      options:
      - Very Effective
      - Somewhat Effective
      - Not Effective
      - Not Applicable
      required: false
    - id: 31
      name: child_strengths
      label: Child Strengths and Interests
      hint: What does the child enjoy?
      type: text
      options: []
      required: true
    - id: 32
      name: parent_concerns
      label: Primary Parent Concerns
      hint: What worries you most?
      type: text
      options: []
      required: true
    - id: 33
      name: family_goals
      label: What Are Your Goals for Behavioral Consulting?
      hint: Desired outcomes
      type: text
      options: []
      required: true
    - id: 34
      name: support_system
      label: Family Support System
      hint: Available support
      type: text
      options: []
      required: false
    - id: 35
      name: insurance_provider
      label: Insurance Provider
      hint: Company name
      type: text
      options: []
      required: false
    - id: 36
      name: insurance_policy_number
      label: Insurance Policy Number
      hint: Policy ID
      type: text
      options: []
      required: false
    - id: 37
      name: referral_source
      label: How Did You Hear About Us?
      hint: Referral source
      type: select_one
      options:
      - Physician Referral
      - School Referral
      - Friend or Family
      - Website
      - Social Media
      - Other
      required: true
