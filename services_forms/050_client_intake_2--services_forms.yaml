inputSchema:
  type: object
  properties:
    title: Client Intake 2
    pages:
    - id: 1
      name: child_first_name
      label: Child First Name
      hint: Child legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: child_last_name
      label: Child Last Name
      hint: Child legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: child_date_of_birth
      label: Child Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 4
      name: child_gender
      label: Child Gender
      hint: For records
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      - Prefer Not to Say
      - Other
      required: true
    - id: 5
      name: parent_guardian_first_name
      label: Parent or Guardian First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 6
      name: parent_guardian_last_name
      label: Parent or Guardian Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 7
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 8
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 9
      name: home_address
      label: Home Address
      hint: Complete mailing address
      type: text
      options: []
      required: true
    - id: 10
      name: home_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: home_state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: home_zip
      label: ZIP Code
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: household_members
      label: Who Lives in the Household?
      hint: List all members and relationships
      type: text
      options: []
      required: true
    - id: 14
      name: family_structure
      label: Family Structure
      hint: Household composition
      type: select_one
      options:
      - Two Parent Home
      - Single Parent Home
      - Blended Family
      - Extended Family
      - Foster Care
      - Other
      required: true
    - id: 15
      name: school_name
      label: School Name
      hint: Current school
      type: text
      options: []
      required: true
