inputSchema:
  type: object
  properties:
    title: Proof Of Service Form
    pages:
    - id: 1
      name: proof_of_service_form
      label: proof_of_service_form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: served_party
      label: served_party
      hint: null
      type: select_one
      options:
      - party a
      - party b
      - party c
      - party d
      required: false
    - id: 3
      name: date_served
      label: date_served
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time_served
      label: time_served
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: method_of_service
      label: method_of_service
      hint: null
      type: select_multiple
      options:
      - Personal Service
      - Certified Mail
      - Email
      - Fax
      - Mail Box
      required: false
    - id: 6
      name: service_completed
      label: service_completed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: proof_of_service_form_comments
      label: proof_of_service_form_comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: proof_of_service_form_additional_documents
      label: proof_of_service_form_additional_documents
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: proof_of_service_form_attachment
      label: proof_of_service_form_attachment
      hint: null
      type: text
      options: []
      required: false
