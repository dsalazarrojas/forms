      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: labor_cost
      label: Labor Cost
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: part_cost
      label: Part Cost
      hint: null
      type: number
      options: []
      required: false
