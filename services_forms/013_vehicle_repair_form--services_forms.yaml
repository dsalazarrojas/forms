      name: vehicle_problem_description
      label: Vehicle Problem Description
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: vehicle_year
      label: Vehicle Year
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: vehicle_make
      label: Vehicle Make
      hint: null
      type: select_one
      options:
      - Ford
      - Toyota
      - Honda
      - BMW
      - Volkswagen
      - Nissan
      - Mazda
      - Subaru
      required: true
    - id: 4
      name: vehicle_model
