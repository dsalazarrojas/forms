inputSchema:
  type: object
  properties:
    title: Online Taxi Booking Form
    pages:
    - id: 1
      name: address_input
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: taxi_fare_input
      label: Taxi Fare
      hint: null
      type: select_one
      options:
      - Taxi 1
      - Taxi 2
      - Taxi 3
      required: false
    - id: 3
      name: trip_type_input
      label: Trip Type
      hint: null
      type: select_multiple
      options:
      - Airport
      - City
      - Station
      required: false
    - id: 4
      name: customer_phone_input
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: customer_email_input
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: address_input2
      label: Address 2
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: message_input
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: form_submit
      label: Submit
      hint: null
      type: select_one
      options:
      - Submit
      - Cancel
      required: false
