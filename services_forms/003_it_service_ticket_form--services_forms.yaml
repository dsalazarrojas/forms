inputSchema:
  type: object
  properties:
    title: it_service_ticket_form
    pages:
    - id: 1
      name: submit_ticket
      label: Submit Ticket
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 3
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - New
      - In Progress
      - Closed
      required: false
    - id: 4
      name: ticket_type
      label: Ticket Type
      hint: null
      type: select_one
      options:
      - Hardware
      - Software
      - General
      required: false
    - id: 5
      name: issue_description
      label: Issue Description
      hint: A detailed description of the issue
      type: note
      options: []
      required: false
    - id: 6
      name: reporter
      label: Reporter
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: assignee
      label: Assignee
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: description
      label: Description
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: attachments
      label: Attachments
      hint: null
      type: text
      options: []
      required: false
