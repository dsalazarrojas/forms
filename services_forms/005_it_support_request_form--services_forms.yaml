inputSchema:
  type: object
  properties:
    title: it_support_request_form
    pages:
    - id: 1
      name: internet_connection
      label: internet_connection
      hint: null
      type: select_one
      options:
      - DSL
      - None
      required: true
    - id: 2
      name: operating_system
      label: operating_system
      hint: null
      type: select_multiple
      options:
      - Windows
      - Linux
      - Mac
      - Chrome OS
      - Unknown
      required: true
    - id: 3
      name: problem_details
      label: problem_details
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_info
      label: contact_information
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: issue_description
      label: issue_description
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: support_request
      label: support_request
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: support_status
      label: support_status
      hint: null
      type: select_one
      options:
      - Open
      - In Progress
      - Resolved
      required: true
