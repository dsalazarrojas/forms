inputSchema:
  type: object
  properties:
    title: Bartender Closing Checklist
    pages:
    - id: 1
      name: bartender_name
      label: Bartender Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: shift_date
      label: Shift Date
      hint: Date of this closing shift
      type: date
      options: []
      required: true
    - id: 3
      name: shift_time
      label: Shift End Time
      hint: Time you finished
      type: time
      options: []
      required: true
    - id: 4
      name: bar_section
      label: Bar Section
      hint: Which area did you work
      type: select_one
      options:
      - Main bar
      - Side bar
      - Patio bar
      - Full bar
      - All sections
      required: true
    - id: 5
      name: cash_drawer_count
      label: Cash Drawer Counted
      hint: Did you count and reconcile the drawer
      type: select_one
      options:
      - Yes, balanced
      - Yes, over by amount
      - Yes, short by amount
      - Not applicable
      required: true
    - id: 6
      name: drawer_amount
      label: Final Drawer Amount
      hint: Total cash amount
      type: number
      options: []
      required: false
    - id: 7
      name: credit_card_batch
      label: Credit Card Batch Closed
      hint: Were all cards batched out
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not applicable
      required: true
    - id: 8
      name: tips_reported
      label: Tips Reported
      hint: Did you report all tips
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: liquor_bottles_restocked
      label: Liquor Bottles Restocked
      hint: Are bottles organized and filled
      type: select_one
      options:
      - Yes, fully restocked
      - Partially restocked
      - No, manager will handle
      required: true
    - id: 10
      name: beer_inventory_checked
      label: Beer Inventory Checked
      hint: Count and record beer levels
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not applicable
      required: true
    - id: 11
      name: wine_inventory_checked
      label: Wine Inventory Checked
      hint: Count and record wine bottles
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not applicable
      required: true
    - id: 12
      name: garnishes_stored
      label: Garnishes Properly Stored
      hint: All garnishes refrigerated
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not applicable
      required: true
    - id: 13
      name: ice_bins_cleaned
      label: Ice Bins Cleaned
      hint: Ice area sanitized
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: bar_tools_washed
      label: Bar Tools Washed
      hint: Shakers, strainers, jiggers cleaned
      type: select_one
      options:
      - Yes, all washed
      - Some remaining
      - 'False'
      required: true
    - id: 15
      name: glassware_washed
      label: Glassware Washed
      hint: All glasses cleaned and stored
      type: select_one
      options:
      - 'True'
      - Partially
      - 'False'
      required: true
    - id: 16
      name: bar_counters_wiped
      label: Bar Counters Wiped Down
      hint: All surfaces cleaned
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 17
      name: sinks_cleaned
      label: Sinks Cleaned
      hint: Bar sinks sanitized
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 18
      name: floors_cleaned
      label: Floors Cleaned
      hint: Bar area swept and mopped
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: trash_removed
      label: Trash Removed
      hint: All garbage taken out
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 20
      name: refrigerators_secured
      label: Refrigerators Closed and Secured
      hint: All coolers properly closed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 21
      name: taps_turned_off
      label: Beer Taps Turned Off
      hint: CO2 and lines secured
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not applicable
      required: true
    - id: 22
      name: lights_turned_off
      label: Lights Turned Off
      hint: All bar lights off
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 23
      name: equipment_secured
      label: Equipment Secured
      hint: POS, safes locked
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 24
      name: manager_notification
      label: Manager Notified
      hint: Did you notify manager of completion
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 25
      name: issues_encountered
      label: Any Issues to Report
      hint: Spills, breakage, customer issues
      type: text
      options: []
      required: false
    - id: 26
      name: notes_for_opening
      label: Notes for Opening Bartender
      hint: Important information for next shift
      type: text
      options: []
      required: false
    - id: 27
      name: bartender_signature
      label: Bartender Signature
      hint: Type your full name
      type: text
      options: []
      required: true
    - id: 28
      name: manager_initials
      label: Manager Initials
      hint: For verification
      type: text
      options: []
      required: false
