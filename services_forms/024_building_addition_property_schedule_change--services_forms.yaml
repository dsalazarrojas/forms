inputSchema:
  type: object
  properties:
    title: Building Addition Property Schedule Change
    pages:
    - id: 1
      name: requestor_name
      label: Requestor Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization
      hint: Company or organization
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: request_date
      label: Request Date
      hint: Date of request
      type: date
      options: []
      required: true
    - id: 7
      name: property_name
      label: Property Name
      hint: Name of property
      type: text
      options: []
      required: true
    - id: 8
      name: property_address
      label: Property Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 9
      name: property_type
      label: Property Type
      hint: Type of property
      type: select_one
      options:
      - Residential
      - Commercial
      - Industrial
      - Mixed Use
      - Agricultural
      - Vacant Land
      required: true
    - id: 10
      name: current_use
      label: Current Use
      hint: How is property currently used
      type: text
      options: []
      required: true
    - id: 11
      name: change_type
      label: Change Type
      hint: Type of schedule change
      type: select_one
      options:
      - Addition to Property
      - Deletion from Property
      - Boundary Change
      - Use Change
      - Ownership Change
      - Zoning Change
      - Assessment Change
      required: true
    - id: 12
      name: change_description
      label: Change Description
      hint: Describe the change
      type: text
      options: []
      required: true
    - id: 13
      name: addition_details
      label: Addition Details
      hint: If adding to property
      type: text
      options: []
      required: false
    - id: 14
      name: deletion_details
      label: Deletion Details
      hint: If removing from property
      type: text
      options: []
      required: false
    - id: 15
      name: affected_area_size
      label: Affected Area Size
      hint: Square footage or acres
      type: text
      options: []
      required: true
    - id: 16
      name: current_assessed_value
      label: Current Assessed Value
      hint: If known
      type: number
      options: []
      required: false
    - id: 17
      name: estimated_new_value
      label: Estimated New Value
      hint: After change
      type: number
      options: []
      required: false
    - id: 18
      name: reason_for_change
      label: Reason for Change
      hint: Why is this change needed
      type: text
      options: []
      required: true
    - id: 19
      name: effective_date
      label: Requested Effective Date
      hint: When should change take effect
      type: date
      options: []
      required: true
    - id: 20
      name: supporting_documents
      label: Supporting Documents
      hint: What documents are attached
      type: select_multiple
      options:
      - Survey Map
      - Property Deed
      - Site Plan
      - Building Permit
      - Zoning Approval
      - Appraisal Report
      - Photos
      - Other
      required: true
    - id: 21
      name: legal_description
      label: Legal Description
      hint: Property legal description
      type: text
      options: []
      required: false
    - id: 22
      name: parcel_number
      label: Parcel Number
      hint: Tax parcel ID
      type: text
      options: []
      required: false
    - id: 23
      name: adjacent_owners_notified
      label: Adjacent Owners Notified
      hint: Have neighbors been notified
      type: select_one
      options:
      - true
      - false
      - Not Applicable
      required: false
    - id: 24
      name: objections_known
      label: Known Objections
      hint: Are there any objections
      type: select_one
      options:
      - true
      - false
      - Unknown
      required: false
    - id: 25
      name: additional_information
      label: Additional Information
      hint: Any other relevant details
      type: text
      options: []
      required: false
    - id: 26
      name: certification
      label: Information Certification
      hint: I certify this information is true
      type: select_one
      options:
      - Yes - I Certify
      - false
      required: true
