inputSchema:
  type: object
  properties:
    title: House Painting Estimate Form
    pages:
    - id: 1
      name: intro_page
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: house_type
      label: House Type
      hint: Select your house type
      type: select_one
      options:
      - Single-family home
      - Condo
      - Townhouse
      - Other (please specify)
      required: true
    - id: 3
      name: painting_area
      label: Painting Area
      hint: List the areas to be painted
      type: select_multiple
      options:
      - Living room
      - Kitchen
      - Dining room
      - Bedroom 1
      - Bedroom 2
      - Other (please specify)
      required: true
    - id: 4
      name: color_scheme
      label: Color Scheme
      hint: Select your color scheme
      type: select_one
      options:
      - Primary color 1
      - Secondary color 1
      - Accent color 1
      - Other (please specify)
      required: true
    - id: 5
      name: stories
      label: Number of Stories
      hint: Select the number of stories
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 6
      name: rooms
      label: Number of Rooms
      hint: Count the number of rooms
      type: number
      options: []
      required: true
    - id: 7
      name: special_requests
      label: Special Requests
      hint: Add any special notes
      type: text
      options: []
      required: false
    - id: 8
      name: painting_service
      label: Painting Service
      hint: Do you need painting service?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: paint_color
      label: Paint Color
      hint: Select your paint color
      type: select_one
      options:
      - White
      - Red
      - Blue
      - Other (please specify)
      required: true
    - id: 10
      name: payment_method
      label: Payment Method
      hint: Select your payment method
      type: select_one
      options:
      - Check
      - Credit card
      - Other (please specify)
      required: true
    - id: 11
      name: confirm
      label: Confirm
      hint: Confirm the details
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: total_cost
      label: Total Cost
      hint: Enter the total cost
      type: number
      options: []
      required: true
