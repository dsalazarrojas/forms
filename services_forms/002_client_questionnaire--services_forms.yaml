inputSchema:
  type: object
  properties:
    title: Client Questionnaire
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: business_type
      label: What type of business does your organization operate?
      hint: null
      type: select_one
      options:
      - Retail
      - Technology
      - Healthcare
      - Finance
      - Manufacturing
      - Services
      - Other
      required: true
    - id: 3
      name: contact_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: business_info_section
      label: -- Business Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: company_name
      label: Company Name
      hint: Legal name of organization
      type: text
      options: []
      required: true
    - id: 7
      name: employee_count
      label: Number of Employees
      hint: Approximate count
      type: select_one
      options:
      - 1-10
      - 11-50
      - 51-100
      - 101-500
      - 501-1000
      - Over 1000
      required: true
    - id: 8
      name: annual_revenue
      label: Approximate Annual Revenue
      hint: null
      type: select_one
      options:
      - Under $100K
      - $100K - $500K
      - $500K - $1M
      - $1M - $5M
      - $5M - $10M
      - Over $10M
      required: false
    - id: 9
      name: goals_section
      label: -- Client Goals and Expectations --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: primary_goals
      label: What are your primary business goals?
      hint: null
      type: select_multiple
      options:
      - Increase Revenue
      - Improve Efficiency
      - Expand Market Share
      - Reduce Costs
      - Improve Quality
      - Strengthen Customer Relationships
      - Other
      required: true
    - id: 11
      name: main_challenges
      label: What are your biggest challenges currently?
      hint: Please describe
      type: text
      options: []
      required: true
    - id: 12
      name: success_metrics
      label: How would you measure success with our services?
      hint: Be specific about key metrics
      type: text
      options: []
      required: true
    - id: 13
      name: timeline_section
      label: -- Timeline and Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: implementation_timeline
      label: What is your preferred implementation timeline?
      hint: null
      type: select_one
      options:
      - Immediate
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - 12+ months
      required: true
    - id: 15
      name: budget_range
      label: What is your budget range for this project?
      hint: null
      type: select_one
      options:
      - Under $5000
      - $5000 - $25000
      - $25000 - $100000
      - $100000 - $500000
      - Over $500000
      required: false
    - id: 16
      name: special_requirements
      label: Do you have any special requirements or constraints we should know about?
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: decision_section
      label: -- Decision Process --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: decision_makers
      label: Who are the key decision makers in your organization?
      hint: Names and titles
      type: text
      options: []
      required: false
    - id: 19
      name: previous_experience
      label: Have you worked with service providers similar to us before?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Sure
      required: false
    - id: 20
      name: heard_about_us
      label: How did you hear about us?
      hint: null
      type: select_one
      options:
      - Referral
      - Search Engine
      - Social Media
      - Advertisement
      - Industry Event
      - Other
      required: false
