inputSchema:
  type: object
  properties:
    title: Price Comparison
    pages:
    - id: 1
      name: price_range_aud
      label: What is your price range for AUD?
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: price_range_eur
      label: What is your price range for EUR?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: price_range_usd
      label: What is your price range for USD?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: compare_aud
      label: Do you want to compare prices in AUD?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 5
      name: compare_eur
      label: Do you want to compare prices in EUR?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 6
      name: compare_usd
      label: Do you want to compare prices in USD?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 7
      name: price_point_aud
      label: What is your price point for AUD?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: price_point_eur
      label: What is your price point for EUR?
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: price_point_usd
      label: What is your price point for USD?
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: compare_aud_eur
      label: Do you want to compare prices in AUD and EUR?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 11
      name: compare_aud_usd
      label: Do you want to compare prices in AUD and USD?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 12
      name: compare_eur_usd
      label: Do you want to compare prices in EUR and USD?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
