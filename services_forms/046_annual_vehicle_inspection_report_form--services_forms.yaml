inputSchema:
  type: object
  properties:
    title: Annual Vehicle Inspection Report Form
    pages:
    - id: 1
      name: inspector_name
      label: Inspector Full Name
      hint: Person conducting inspection
      type: text
      options: []
      required: true
    - id: 2
      name: inspector_id
      label: Inspector ID
      hint: Certification number
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: false
    - id: 5
      name: shop_name
      label: Shop Name
      hint: Inspection facility
      type: text
      options: []
      required: true
    - id: 6
      name: shop_address
      label: Shop Address
      hint: Facility address
      type: text
      options: []
      required: true
