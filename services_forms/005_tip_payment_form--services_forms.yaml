      hint: null
      type: select_multiple
      options:
      - '{''value'': ''base price'', ''label'': ''Base Price''}'
      - '{''value'': ''tip percentage'', ''label'': ''Tip Percentage''}'
      - '{''value'': ''tip amount'', ''label'': ''Tip Amount''}'
