inputSchema:
  type: object
  properties:
    title: security_incident_report_form
    pages:
    - id: 1
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: incident_time
      label: Incident Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: incident_location
      label: Incident Location
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: incident_type
      label: Incident Type
      hint: null
      type: select_one
      options:
      - Malicious Activity
      - Data Breach
      - Other
      required: false
    - id: 5
      name: affected_areas
      label: Affected Areas
      hint: null
      type: select_multiple
      options:
      - Data Center
      - Network
      - Server
      - Other
      required: false
    - id: 6
      name: incident_reported
      label: Incident Reported To
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: incident_reported_by
      label: Incident Reported By
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: incident_reported_time
      label: Incident Reported Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: incident_description
      label: Incident Description
      hint: null
      type: text
      options: []
      required: false
