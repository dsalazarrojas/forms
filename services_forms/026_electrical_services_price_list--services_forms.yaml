inputSchema:
  type: object
  properties:
    title: Electrical Services Price List
    pages:
    - id: 1
      name: service_request
      label: Service Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: preferred_install_date
      label: Preferred Install Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Electrical Service 1
      - Electrical Service 2
      - Electrical Service 3
      required: false
    - id: 4
      name: schedule_preference
      label: Schedule Preference
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: price_inquiry
      label: Price Inquiry
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: contact_method
      label: Contact Method
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - Chat
      required: true
    - id: 7
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
