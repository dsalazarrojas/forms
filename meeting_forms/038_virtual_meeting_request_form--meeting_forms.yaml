inputSchema:
  type: object
  properties:
    title: Virtual Meeting Request Form
    pages:
    - id: 1
      name: meeting_date
      label: Meeting Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: meeting_time
      label: Meeting Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: meeting_duration
      label: Meeting Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: meeting_location
      label: Meeting Location
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: attendees
      label: Attendees
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: meeting_type
      label: Meeting Type
      hint: null
      type: select_one
      options:
      - Client Consultation
      - Team Collaboration
      - Interview
      - Training Session
      required: false
    - id: 7
      name: meeting_purpose
      label: Meeting Purpose
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_user
      label: Assigned User
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
