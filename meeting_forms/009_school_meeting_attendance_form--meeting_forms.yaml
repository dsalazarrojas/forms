inputSchema:
  type: object
  properties:
    title: School Meeting Attendance Form
    pages:
    - id: 1
      name: submitter_name
      label: Submitter Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: submitter_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: submitter_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: submitter_notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: attendance_status
      label: Attendance Status
      hint: null
      type: select_one
      options:
      - Present
      - Absent
      - Late
      required: true
    - id: 6
      name: attendance_date
      label: Date of Attendance
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
