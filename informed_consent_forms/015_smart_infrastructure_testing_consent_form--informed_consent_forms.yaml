inputSchema:
  type: object
  properties:
    title: Smart Infrastructure Testing Consent Form
    pages:
    - id: 1
      name: project_name
      label: Project Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: participant_info
      label: Participant Information
      hint: null
      type: select_multiple
      options:
      - Participant
      - Contractor
      - Observer
      required: true
    - id: 3
      name: test_location
      label: Test Location
      hint: null
      type: text
      options: []
