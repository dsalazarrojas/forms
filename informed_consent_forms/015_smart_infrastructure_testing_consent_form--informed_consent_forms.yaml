      options: []
      required: true
    - id: 5
      name: testing_times
      label: Testing Times
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: participant_consent
      label: Participant Consent
      hint: Please check all that apply.
      type: select_multiple
      options:
      - I am a participant in this testing project.
      - I am a participant in this testing project.
      - I am not a participant in this testing project.
      required: true
    - id: 7
      name: observer_consent
      label: Observer Consent
      hint: null
      type: select_multiple
      options:
