inputSchema:
  type: object
  properties:
    title: Canoe Rental Waiver
    pages:
    - id: 1
      name: intro_header
      label: -- Canoe Rental Waiver and Release Agreement --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: intro_text
      label: This waiver acknowledges the inherent risks of paddle sports. By signing,
        you assume full responsibility for any injury or damage. Please read carefully.
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: renter_info_header
      label: -- Renter Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 5
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: Must be 18 or older
      type: date
      options: []
      required: true
    - id: 7
      name: email_address
      label: Email Address
      hint: Your email
      type: email
      options: []
      required: true
    - id: 8
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 9
      name: address
      label: Street Address
      hint: Your address
      type: text
      options: []
      required: true
    - id: 10
      name: city
      label: City
      hint: City
      type: text
      options: []
      required: true
    - id: 11
      name: state
      label: State/Province
      hint: State or province
      type: text
      options: []
      required: true
    - id: 12
      name: zip_code
      label: ZIP or Postal Code
      hint: ZIP code
      type: text
      options: []
      required: true
    - id: 13
      name: rental_info_header
      label: -- Rental Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: rental_date
      label: Rental Date
      hint: Date of rental
      type: date
      options: []
      required: true
    - id: 15
      name: watercraft_type
      label: Type of Watercraft Renting
      hint: Select one
      type: select_one
      options:
      - Canoe
      - Kayak
      - Stand-up Paddleboard
      - Tandem Canoe
      - Other
      required: true
    - id: 16
      name: rental_duration
      label: Rental Duration
      hint: Select one
      type: select_one
      options:
      - Less than 1 hour
      - 1-2 hours
      - Half day
      - Full day
      - Overnight
      - Multi-day
      required: true
    - id: 17
      name: water_body
      label: Water Body for Rental
      hint: Where you plan to paddle
      type: text
      options: []
      required: false
    - id: 18
      name: experience_header
      label: -- Experience and Ability --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: paddling_experience
      label: Paddling Experience Level
      hint: Select one
      type: select_one
      options:
      - No experience - Never paddled
      - Beginner - Few times only
      - Intermediate - Regular paddler
      - Advanced - Experienced paddler
      - Expert - Competitive or professional
      required: true
    - id: 20
      name: swim_ability
      label: Swimming Ability
      hint: Select one
      type: select_one
      options:
      - Strong swimmer
      - Adequate swimmer
      - Weak swimmer
      - Cannot swim
      required: true
    - id: 21
      name: fitness_level
      label: Physical Fitness Level
      hint: Select one
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 22
      name: health_header
      label: -- Health and Medical Conditions --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: health_conditions
      label: Do you have any medical conditions affecting water activities?
      hint: Select one
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unsure
      required: true
    - id: 24
      name: condition_details
      label: If yes, please describe conditions
      hint: Optional - if applicable
      type: text
      options: []
      required: false
    - id: 25
      name: medications
      label: Are you taking any medications that affect balance or judgment?
      hint: Select one
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unsure
      required: true
    - id: 26
      name: pregnant
      label: Are you pregnant or possibly pregnant?
      hint: Select one
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Prefer not to say
      required: true
    - id: 27
      name: safety_header
      label: -- Safety Equipment and Acknowledgment --
      hint: null
      type: note
      options: []
      required: false
    - id: 28
      name: life_jacket
      label: I will wear a Coast Guard approved life jacket
      hint: Required
      type: select_one
      options:
      - Yes, I agree
      - 'No'
      required: true
    - id: 29
      name: safety_instruction
      label: I have received and understand the safety instructions
      hint: Required
      type: select_one
      options:
      - Yes, I confirm
      - 'No'
      required: true
    - id: 30
      name: risk_acknowledgment
      label: I acknowledge the inherent risks of paddle sports
      hint: Required
      type: select_one
      options:
      - Yes, I acknowledge
      - 'No'
      required: true
    - id: 31
      name: waiver_agreement
      label: I voluntarily assume all risks and release the rental company from liability
      hint: Required
      type: select_one
      options:
      - Yes, I agree
      - 'No'
      required: true
    - id: 32
      name: parental_consent
      label: If under 18, parent/guardian name and signature
      hint: Optional - for minors
      type: text
      options: []
      required: false
