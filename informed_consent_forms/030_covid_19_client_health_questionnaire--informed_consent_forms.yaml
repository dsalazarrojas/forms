inputSchema:
  type: object
  properties:
    title: COVID 19 Client Health Questionnaire
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: Your full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: questionnaire_date
      label: Questionnaire Date
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 7
      name: note_health_status
      label: -- Health Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: general_health
      label: Overall Health Status
      hint: How would you describe your health?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: chronic_conditions
      label: Chronic Health Conditions
      hint: Select all that apply
      type: select_multiple
      options:
      - Heart disease
      - High blood pressure
      - Diabetes
      - Kidney disease
      - Liver disease
      - COPD
      - Asthma
      - Cancer
      - Immunocompromised
      - Other
      - None
      required: false
    - id: 10
      name: note_covid_history
      label: -- COVID-19 History --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: previous_covid_infection
      label: Have you had COVID-19 previously?
      hint: null
      type: select_one
      options:
      - 'No'
      - Yes - confirmed diagnosis
      - Yes - probable
      - Not sure
      required: true
    - id: 12
      name: covid_diagnosis_date
      label: Date of COVID-19 Diagnosis
      hint: If applicable
      type: date
      options: []
      required: false
    - id: 13
      name: covid_severity
      label: Severity of Previous COVID-19
      hint: If you had it
      type: select_one
      options:
      - Asymptomatic
      - Mild
      - Moderate
      - Severe
      - Critical
      - Not applicable
      required: false
    - id: 14
      name: long_covid_symptoms
      label: Long COVID Symptoms
      hint: Ongoing symptoms after COVID infection
      type: text
      options: []
      required: false
    - id: 15
      name: note_vaccination
      label: -- Vaccination History --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: vaccination_status
      label: COVID-19 Vaccination Status
      hint: null
      type: select_one
      options:
      - Not vaccinated
      - Partially vaccinated - 1 dose
      - Fully vaccinated - primary series
      - Vaccinated with booster
      - Multiple boosters
      - Unknown
      required: true
    - id: 17
      name: first_vaccine_date
      label: Date of First Vaccine Dose
      hint: If applicable
      type: date
      options: []
      required: false
    - id: 18
      name: vaccine_type
      label: Vaccine Type Received
      hint: Pfizer, Moderna, J&J, etc.
      type: text
      options: []
      required: false
    - id: 19
      name: vaccine_reactions
      label: Vaccine Reactions or Side Effects
      hint: Any reactions you experienced
      type: text
      options: []
      required: false
    - id: 20
      name: note_current_health
      label: -- Current Health Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: fever
      label: Do you have a fever?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: true
    - id: 22
      name: cough
      label: Do you have a cough?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: true
    - id: 23
      name: shortness_of_breath
      label: Do you have shortness of breath?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: true
    - id: 24
      name: loss_taste_smell
      label: Loss of taste or smell?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 25
      name: fatigue
      label: Unusual fatigue or weakness?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 26
      name: note_recent_exposure
      label: -- Recent Exposure --
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: covid_exposure
      label: Recent COVID-19 Exposure
      hint: In the past 14 days
      type: select_one
      options:
      - No exposure
      - Possible exposure
      - Confirmed exposure
      - Not sure
      - Prefer not to say
      required: true
    - id: 28
      name: exposure_details
      label: Details of Exposure
      hint: Who did you come into contact with?
      type: text
      options: []
      required: false
    - id: 29
      name: recent_travel
      label: Recent Travel
      hint: In past 14 days
      type: select_one
      options:
      - No travel
      - Domestic travel
      - International travel
      required: false
    - id: 30
      name: medications
      label: Current Medications
      hint: List all medications you take
      type: text
      options: []
      required: false
