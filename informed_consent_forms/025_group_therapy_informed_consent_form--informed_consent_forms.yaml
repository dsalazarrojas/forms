inputSchema:
  type: object
  properties:
    title: Group Therapy Informed Consent Form
    pages:
    - id: 1
      name: group_therapy_informed_consent_form
      label: What is group therapy?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: group_therapy_goals
      label: What are the goals and objectives of this group therapy?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: informed_consent
      label: I understand that this group therapy form is a legally binding document
      hint: Please read this carefully before signing it
      type: select_one
      options:
      - I have read and understood this document.
      - I have not read this document.
      required: false
    - id: 4
      name: confidentiality
      label: Do you agree that all sessions will be kept confidential
      hint: null
      type: select_multiple
      options:
      - Yes, I agree that all sessions will be kept confidential.
      - No, I do not agree that all sessions will be kept confidential.
      required: false
    - id: 5
      name: group_therapy_start_date
      label: What date will group therapy start
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: group_therapy_end_date
      label: When will group therapy end
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: therapist_name
      label: What is the name of the therapist?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: therapist_contact_information
      label: What is the therapist contact information?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: number_of_participants
      label: How many participants are expected to join the therapy group
      hint: null
      type: text
      options: []
      required: false
