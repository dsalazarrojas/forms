inputSchema:
  type: object
  properties:
    title: Housekeeping Frequency Adjustment Consent Form
    pages:
    - id: 1
      name: resident_details
      label: Resident Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: housekeeping_frequency
      label: Housekeeping Frequency
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: requested_changes
      label: Requested Changes
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - I agree to the housekeeping frequency adjustment.
      - I do not agree to the housekeeping frequency adjustment.
      required: true
    - id: 5
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - SMS
      - Email and Phone
      - Do not contact
      required: true
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: other_contact_methods
      label: Other Contact Methods
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: other_contact_details
      label: Other Contact Details
      hint: null
      type: text
      options: []
      required: false
