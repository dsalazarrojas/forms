inputSchema:
  type: object
  properties:
    title: Contactless Elevator Operation Consent Form
    pages:
    - id: 1
      name: section_occupant_info
      label: -- Occupant Details --
      hint: Please provide your information below.
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Occupant Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: building_unit
      label: Building and Unit Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_consent
      label: -- Consent and Understanding --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: technology_understanding
      label: I understand how the contactless elevator operation works
      hint: See the attached user guide for details
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: data_collection_consent
      label: I consent to the collection of my usage data for performance monitoring
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: privacy_policy_agreement
      label: I have read and agree to the privacy policy regarding my data
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: signature_confirmation
      label: I confirm that the information provided is accurate
      hint: null
      type: select_one
      options:
      - I Agree
      - I Disagree
      required: true
    - id: 11
      name: date_of_consent
      label: Date of Consent
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: additional_comments
      label: Any questions or comments?
      hint: null
      type: text
      options: []
      required: false
