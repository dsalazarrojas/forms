inputSchema:
  type: object
  properties:
    title: Virtual Reality Therapy Evaluation Consent Form
    pages:
    - id: 1
      name: client_info
      label: Client Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: vr_treatment
      label: VR Treatment
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - Client Information
      - Treatment Information
      - Other
      required: true
    - id: 4
      name: client_consent
      label: Client Consent
      hint: null
      type: select_multiple
      options:
      - I understand and agree
      - I do not understand or do not wish to provide this information
      - Other (please specify)
      required: true
    - id: 5
      name: data_collection
      label: Data Collection
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: therapist_info
      label: Therapist Info
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: additional_info
      label: Additional Info
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: false
