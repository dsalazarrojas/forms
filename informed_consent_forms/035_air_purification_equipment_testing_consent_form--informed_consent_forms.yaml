inputSchema:
  type: object
  properties:
    title: Air Purification Equipment Testing Consent Form
    pages:
    - id: 1
      name: participant_name
      label: Participant name
      hint: Full name for consent records
      type: text
      options: []
      required: true
    - id: 2
      name: contact_email
      label: Contact email
      hint: For test results and communications
      type: email
      options: []
      required: false
    - id: 3
      name: test_description
      label: Test description
      hint: Brief explanation of the testing procedures
      type: note
      options: []
      required: true
    - id: 4
      name: expected_duration
      label: Expected duration of testing
      hint: Time estimate for equipment testing
      type: time
      options: []
      required: false
    - id: 5
      name: benefits_and_risks
      label: Benefits and risks
      hint: Summary of benefits and potential risks
      type: note
      options: []
      required: true
    - id: 6
      name: consent
      label: Consent for testing
      hint: Participant agreement to testing terms
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: data_use
      label: Data use and privacy
      hint: How test data will be stored and used
      type: note
      options: []
      required: false
    - id: 8
      name: signature_date
      label: Date of consent
      hint: Date consent was provided
      type: date
      options: []
      required: true
    - id: 9
      name: questions
      label: Questions or concerns
      hint: Any questions participant wants addressed
      type: text
      options: []
      required: false
