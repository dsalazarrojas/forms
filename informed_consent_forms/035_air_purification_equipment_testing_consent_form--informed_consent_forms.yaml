      hint: Brief explanation of the testing procedures
      type: note
      options: []
      required: true
    - id: 4
      name: expected_duration
      label: Expected duration of testing
      hint: Time estimate for equipment testing
      type: time
      options: []
      required: false
    - id: 5
      name: benefits_and_risks
      label: Benefits and risks
      hint: Summary of benefits and potential risks
      type: note
      options: []
      required: true
    - id: 6
      name: consent
      label: Consent for testing
      hint: Participant agreement to testing terms
      type: select_one
      options: [Yes, No]
      required: true
    - id: 7
      name: data_use
      label: Data use and privacy
      hint: How test data will be stored and used
      type: note
      options: []
      required: false
