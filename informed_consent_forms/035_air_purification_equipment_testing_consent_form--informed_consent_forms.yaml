inputSchema:
  type: object
  properties:
    title: Air Purification Equipment Testing Consent Form
    pages:
    - id: 1
      name: participant_name
      label: Participant name
      hint: Full name for consent records
      type: text
      options: []
      required: true
    - id: 2
      name: contact_email
      label: Contact email
      hint: For test results and communications
      type: email
      options: []
      required: false
    - id: 3
