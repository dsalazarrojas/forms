inputSchema:
  type: object
  properties:
    title: Babysitting Release Form
    pages:
    - id: 1
      name: parent_name
      label: Parent or guardian name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: child_name
      label: Child name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: release_details
      label: Release details
      hint: Permission details for babysitting
      type: note
      options: []
      required: true
    - id: 4
      name: emergency_contact
      label: Emergency contact name and phone
      hint: If parent not reachable
      type: text
      options: []
      required: true
    - id: 5
      name: medical_consent
      label: Medical consent
      hint: Authorization for emergency care
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: pickup_authorization
      label: Pickup authorization
      hint: Names authorized to pick up child
      type: text
      options: []
      required: true
    - id: 7
      name: signature_name
      label: Name of person signing
      hint: Typed full name accepted
      type: text
      options: []
      required: true
    - id: 8
      name: signature_date
      label: Date signed
      hint: Date of consent
      type: date
      options: []
      required: true
    - id: 9
      name: additional_notes
      label: Additional notes
      hint: Any special instructions
      type: text
      options: []
      required: false
    - id: 10
      name: record_copy
      label: Copy of release provided to sitter
      hint: Yes or no
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
