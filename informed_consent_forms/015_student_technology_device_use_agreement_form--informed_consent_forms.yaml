      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: device_return_policy
      label: Device Return Policy
      hint: Select device return policy
      type: select_one
      options:
      - Policy 1
      - Policy 2
      required: false
    - id: 18
      name: device_return_status
      label: Device Return Status
      hint: Select device return status
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 19
      name: device_return_notes
      label: Device Return Notes
      hint: null
