inputSchema:
  type: object
  properties:
    title: Consent To Opt Out Of Face Mask Requirement Form
    pages:
    - id: 1
      name: form_date
      label: Form Date
      hint: Date of form submission
      type: date
      options: []
      required: true
    - id: 2
      name: student_name
      label: Student Name
      hint: Full name of student
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID Number
      hint: Student identification number
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: Student date of birth
      type: date
      options: []
      required: true
    - id: 5
      name: grade_level
      label: Grade Level
      hint: Current grade or year level
      type: text
      options: []
      required: true
    - id: 6
      name: school_name
      label: School Name
      hint: Name of school
      type: text
      options: []
      required: true
    - id: 7
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Full name of parent or guardian
      type: text
      options: []
      required: true
    - id: 8
      name: parent_guardian_email
      label: Email Address
      hint: Contact email address
      type: email
      options: []
      required: true
    - id: 9
      name: parent_guardian_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 10
      name: parent_guardian_address
      label: Address
      hint: Mailing address
      type: text
      options: []
      required: true
    - id: 11
      name: relationship_to_student
      label: Relationship to Student
      hint: Your relationship to the student
      type: select_one
      options:
      - Mother
      - Father
      - Legal Guardian
      - Foster Parent
      - Other
      required: true
    - id: 12
      name: opt_out_decision
      label: Opt Out Decision
      hint: Are you opting out of mask requirement
      type: select_one
      options:
      - Yes - Opting Out
      - No - Will Continue Wearing Mask
      required: true
    - id: 13
      name: reason_for_opt_out
      label: Reason for Opting Out
      hint: Select primary reason
      type: select_one
      options:
      - Medical Condition
      - Mental Health Considerations
      - Personal Belief
      - Religious Belief
      - Other
      required: true
    - id: 14
      name: reason_details
      label: Reason Details
      hint: Provide additional explanation
      type: text
      options: []
      required: true
    - id: 15
      name: medical_documentation
      label: Is Medical Documentation Attached
      hint: If medical reason do you have documentation
      type: select_one
      options:
      - Yes - Attached
      - Yes - Will Provide
      - false
      - Not Applicable
      required: false
    - id: 16
      name: healthcare_provider_name
      label: Healthcare Provider Name
      hint: Name of doctor or provider if applicable
      type: text
      options: []
      required: false
    - id: 17
      name: healthcare_provider_contact
      label: Healthcare Provider Contact
      hint: Phone or email for provider
      type: text
      options: []
      required: false
    - id: 18
      name: alternative_precautions
      label: Alternative Precautions You Will Take
      hint: What safety measures will you implement
      type: select_multiple
      options:
      - Social Distancing
      - Regular Hand Washing
      - Stay Home When Sick
      - Regular Testing
      - Improved Ventilation at Home
      - Limit Exposure Outside School
      - Other
      required: true
    - id: 19
      name: alternative_precautions_other
      label: Other Precautions
      hint: Describe if other selected
      type: text
      options: []
      required: false
    - id: 20
      name: understand_risks
      label: Do You Understand the Risks
      hint: Do you understand potential increased risk
      type: select_one
      options:
      - Yes - Fully Understood
      - Yes - Generally Understood
      - false
      required: true
    - id: 21
      name: risks_acknowledged
      label: Risks Acknowledged
      hint: Acknowledgement of health risks
      type: select_one
      options:
      - Yes - I Acknowledge Risks
      - false
      required: true
    - id: 22
      name: school_policy_understood
      label: School Policy Understood
      hint: Do you understand school policies
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 23
      name: comply_with_other_measures
      label: Will You Comply with Other Safety Measures
      hint: Will you follow other school safety rules
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 24
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of emergency contact
      type: text
      options: []
      required: true
    - id: 25
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number for emergency contact
      type: text
      options: []
      required: true
    - id: 26
      name: parent_guardian_signature
      label: Parent or Guardian Signature
      hint: Type your full name as signature
      type: text
      options: []
      required: true
    - id: 27
      name: signature_date
      label: Date of Signature
      hint: Date when signing
      type: date
      options: []
      required: true
    - id: 28
      name: student_signature
      label: Student Signature
      hint: Student signature if age appropriate
      type: text
      options: []
      required: false
    - id: 29
      name: school_administrator
      label: School Administrator Name
      hint: Name of administrator reviewing form
      type: text
      options: []
      required: false
    - id: 30
      name: approval_status
      label: Approval Status
      hint: For school use
      type: select_one
      options:
      - Pending Review
      - Approved
      - Denied
      - More Information Required
      required: true
