      label: Permit Issue Date/Time
      hint: null
      type: time
      options: []
      required: false
    - id: 13
      name: hot_work_permit_number
      label: Hot Work Permit Number
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: job_status_remarks
      label: Job Status Remarks
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: job_status_last_reviewed_by
      label: Job Status Last Reviewed By
      hint: null
      type: text
      options: []
      required: false
