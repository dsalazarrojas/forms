inputSchema:
  type: object
  properties:
    title: Hot Work Permit Form Template
    pages:
    - id: 1
      name: user_entered_data
      label: User Entered Data
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: worker_identification
      label: Worker Identification
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      required: false
    - id: 3
      name: work_activity_start_date
      label: Work Activity Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: work_activity_end_date
      label: Work Activity End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: permit_issue_date
      label: Permit Issue Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: safety_inspection_date
      label: Safety Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: job_status
      label: Job Status
      hint: null
      type: select_multiple
      options:
      - Open
      - In Progress
      - Closed
      required: false
    - id: 8
      name: hot_work_permit
      label: Hot Work Permit
      hint: null
