      - Property manager 1
      - Property manager 2
      required: false
    - id: 3
      name: smart_leak_sensors_details
      label: smart_leak_sensors_details
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: installation_date
      label: Installation Date
      hint: null
      type: date
      options: []
      required: false
