inputSchema:
  type: object
  properties:
    title: Minors COVID 19 Liability Release Waiver
    pages:
    - id: 1
      name: minor_name
      label: Minor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: relationship_to_minor
      label: Relationship To Minor
      hint: null
      type: select_one
      options:
      - Guardian
      - Parent
      - Authorized Representative
      required: false
    - id: 3
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: medical_condition
      label: Medical Condition
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: insurance_payer
      label: Insurance Payer
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
