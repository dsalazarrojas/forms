inputSchema:
  type: object
  properties:
    title: Dental HIPAA Form
    pages:
    - id: 1
      name: patient_information
      label: Patient Information
      hint: Please provide the following information.
      type: select_one
      options:
      - Patient Information
      - Name
      - Phone Number
      - Address
      required: true
    - id: 2
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: treatment_plans
      label: Treatment Plans
      hint: null
      type: select_multiple
      options:
      - Anesthesia
      - Biopsy
      - Cast
      - Cleaning
      - Consultation
      - Diagnostic Imaging
      - Extraction
      - Fluoride
      - General Anesthesia
      - Oral Surgery
      - Restorative
      required: false
    - id: 4
      name: medical_history_details
      label: Medical History Details
      hint: Please provide any relevant medical history.
      type: text
      options: []
      required: false
    - id: 5
      name: medical_condition
      label: Medical Condition
      hint: Please select all that apply.
      type: select_one
      options:
      - None
      - Allergies
      - Chronic Disease
      - Medical Condition 1
      - Medical Condition 2
      - Other
      required: true
    - id: 6
      name: emergency_contact
      label: Emergency Contact
      hint: Please provide an emergency contact number.
      type: text
      options: []
      required: true
    - id: 7
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Please provide the name of the emergency contact.
      type: text
      options: []
      required: true
    - id: 8
      name: emergency_contact_relationship
      label: Relationship
      hint: Please select the relationship of the emergency contact.
      type: select_one
      options:
      - Parent
      - Spouse
      - Other
      required: true
