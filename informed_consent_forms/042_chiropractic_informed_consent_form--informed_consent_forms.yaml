inputSchema:
  type: object
  properties:
    title: Chiropractic Informed Consent Form
    pages:
      - id: 1
        name: patient_name
        label: Patient Name
        hint: Full legal name
        type: text
        options: []
        required: true
      - id: 2
        name: date_of_birth
        label: Date of Birth
        hint: For identification
        type: date
        options: []
        required: false
      - id: 3
        name: procedure_explanation
        label: Explanation of Procedure
        hint: Summary of what the treatment involves
        type: note
        options: []
        required: false
      - id: 4
        name: risks_and_benefits
        label: Risks and Benefits
        hint: Summary of common risks and expected benefits
        type: note
        options: []
        required: false
      - id: 5
        name: consent_given
        label: Consent Given
        hint: Patient agreement to proceed with treatment
        type: select_one
        options:
          - I consent
          - I do not consent
        required: true
      - id: 6
        name: signature_name
        label: Name for Signature
        hint: Typed name as signature authorization
        type: text
        options: []
        required: true
      - id: 7
        name: signature_date
        label: Signature Date
        hint: Date of consent
        type: date
        options: []
        required: true
      - id: 8
        name: additional_questions
        label: Additional Questions
        hint: Any questions or clarifications requested
        type: text
        options: []
        required: false
