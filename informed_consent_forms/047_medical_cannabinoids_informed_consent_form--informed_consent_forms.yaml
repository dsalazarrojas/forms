      required: true
    - id: 6
      name: patient_id_number
      label: Patient ID Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: patient_age
      label: Age of Patient
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: patient_weight
      label: Weight of Patient
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: doctor_signature
      label: Doctor Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: date_of_signature
      label: Date of Signature
      hint: null
      type: date
      options: []
      required: true
