inputSchema:
  type: object
  properties:
    title: Hormone Therapy Informed Consent Form
    pages:
    - id: 1
      name: main_page
      label: main-page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: patient_info
      label: patient-info
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: medical_team
      label: medical-team
      hint: null
      type: select_multiple
      options:
      - Endocrinologist
      - Nurse
      required: false
    - id: 4
      name: procedure_info
      label: procedure-info
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: medical_team_note
      label: medical-team-note
      hint: null
      type: note
      options: []
      required: false
