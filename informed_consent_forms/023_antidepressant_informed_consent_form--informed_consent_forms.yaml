inputSchema:
  type: object
  properties:
    title: Antidepressant Informed Consent Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: patient_dob
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 3
      name: patient_id
      label: Patient ID or MRN
      hint: Medical record number
      type: text
      options: []
      required: true
    - id: 4
      name: consent_date
      label: Consent Date
      hint: Date of consent
      type: date
      options: []
      required: true
    - id: 5
      name: prescribing_provider
      label: Prescribing Provider
      hint: Name of doctor or psychiatrist
      type: text
      options: []
      required: true
    - id: 6
      name: diagnosis
      label: Diagnosis
      hint: Primary diagnosis for treatment
      type: select_one
      options:
        - Major depressive disorder
        - Persistent depressive disorder
        - Generalized anxiety disorder
        - Panic disorder
        - Obsessive-compulsive disorder
        - Post-traumatic stress disorder
        - Other anxiety disorder
        - Other
      required: true
    - id: 7
      name: medication_name
      label: Prescribed Medication
      hint: Name of antidepressant
      type: select_one
      options:
        - Sertraline
        - Fluoxetine
        - Escitalopram
        - Citalopram
        - Paroxetine
        - Venlafaxine
        - Duloxetine
        - Bupropion
        - Mirtazapine
        - Trazodone
        - Other
      required: true
    - id: 8
      name: medication_class
      label: Medication Class
      hint: Type of antidepressant
      type: select_one
      options:
        - SSRI
        - SNRI
        - Atypical antidepressant
        - TCA
        - MAOI
        - Other
      required: true
    - id: 9
      name: purpose_section
      label: -- Purpose of Treatment --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: treatment_purpose
      label: Purpose of Medication
      hint: Why this medication is prescribed
      type: text
      options: []
      required: true
    - id: 11
      name: expected_benefits
      label: Expected Benefits
      hint: What improvements are expected
      type: text
      options: []
      required: true
    - id: 12
      name: timeline_for_effect
      label: Timeline for Effect
      hint: When to expect improvement
      type: text
      options: []
      required: true
    - id: 13
      name: risks_section
      label: -- Risks and Side Effects --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: common_side_effects
      label: Common Side Effects Discussed
      hint: Select all that were discussed
      type: select_multiple
      options:
        - Nausea
        - Headache
        - Insomnia
        - Drowsiness
        - Dry mouth
        - Weight changes
        - Sexual dysfunction
        - Dizziness
        - Sweating
        - Constipation
        - None discussed
      required: true
    - id: 15
      name: serious_risks
      label: Serious Risks Discussed
      hint: Select all that were discussed
      type: select_multiple
      options:
        - Suicidal thoughts
        - Serotonin syndrome
        - Increased bleeding risk
        - Hyponatremia
        - Manic episodes
        - Withdrawal symptoms
        - Allergic reactions
        - None discussed
      required: true
    - id: 16
      name: black_box_warning
      label: Black Box Warning Discussed
      hint: Suicidal thoughts warning
      type: select_one
      options:
        - Yes, discussed
        - No, not discussed
      required: true
    - id: 17
      name: interactions_section
      label: -- Drug Interactions --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: current_medications
      label: Current Medications Reviewed
      hint: Were all medications reviewed
      type: select_one
      options:
        - Yes, all reviewed
        - Partially reviewed
        - No, not reviewed
      required: true
    - id: 19
      name: substance_use_discussed
      label: Alcohol and Substance Use Discussed
      hint: Were interactions discussed
      type: select_one
      options:
        - Yes
        - No
      required: true
    - id: 20
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Any food restrictions
      type: select_one
      options:
        - Yes, discussed
        - No restrictions
        - Not discussed
      required: true
    - id: 21
      name: monitoring_section
      label: -- Monitoring and Follow-up --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: monitoring_plan
      label: Monitoring Plan
      hint: How will you be monitored
      type: text
      options: []
      required: true
    - id: 23
      name: follow_up_schedule
      label: Follow-up Schedule
      hint: When are follow-up appointments
      type: text
      options: []
      required: true
    - id: 24
      name: discontinuation_plan
      label: Discontinuation Plan Discussed
      hint: How to stop medication safely
      type: select_one
      options:
        - Yes, discussed
        - No, not discussed
      required: true
    - id: 25
      name: alternatives_section
      label: -- Alternative Treatments --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: alternatives_discussed
      label: Alternative Treatments Discussed
      hint: What other options were reviewed
      type: select_multiple
      options:
        - Psychotherapy
        - Cognitive behavioral therapy
        - Exercise
        - Light therapy
        - Other medications
        - Lifestyle changes
        - No alternatives discussed
      required: true
    - id: 27
      name: patient_questions
      label: Patient Questions
      hint: Were all questions answered
      type: select_one
      options:
        - Yes, all answered
        - Most answered
        - Some unanswered
        - No questions asked
      required: true
    - id: 28
      name: patient_understanding
      label: Patient Understanding
      hint: Does patient understand
      type: select_one
      options:
        - Yes, completely
        - Yes, mostly
        - Somewhat
        - Not really
        - Not at all
      required: true
    - id: 29
      name: voluntary_consent
      label: Voluntary Consent
      hint: Is consent given voluntarily
      type: select_one
      options:
        - Yes, voluntary
        - No, under pressure
      required: true
    - id: 30
      name: patient_consent
      label: Patient Consent
      hint: Do you consent to treatment
      type: select_one
      options:
        - Yes, I consent
        - No, I do not consent
        - I need more time to decide
      required: true
    - id: 31
      name: patient_signature
      label: Patient Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 32
      name: signature_date
      label: Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
    - id: 33
      name: guardian_signature
      label: Parent or Guardian Signature
      hint: If patient is minor
      type: text
      options: []
      required: false
    - id: 34
      name: provider_signature
      label: Provider Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 35
      name: witness_signature
      label: Witness Signature
      hint: If required
      type: text
      options: []
      required: false
