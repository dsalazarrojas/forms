inputSchema:
  type: object
  properties:
    title: digital_library_resource_case_consent_form
    pages:
    - id: 1
      name: intro
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: resource
      label: What resource do you wish to access
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: permissions
      label: Permissions
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: case_materials
      label: Do you wish to access these case materials
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - '{''label'': ''I understand and agree'', ''value'': ''agree''}'
      - '{''label'': ''I do not understand and do not agree'', ''value'': ''disagree''}'
      required: true
    - id: 6
      name: notes
      label: Do you have any further notes
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_name
      label: Contact name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: contact_email
      label: Contact email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: contact_phone
      label: Contact phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: contact_note
      label: Further note
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: true
