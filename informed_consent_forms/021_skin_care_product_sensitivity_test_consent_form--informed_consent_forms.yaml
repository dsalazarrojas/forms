inputSchema:
  type: object
  properties:
    title: Skin Care Product Sensitivity Test Consent Form
    pages:
    - id: 1
      name: client_consent
      label: Client Consent
      hint: null
      type: select_one
      options:
      - I understand that I will be asked to use a variety of products for 7 days.
      - I understand that I will need to come back in 7-10 days.
      - I am aware that the products tested may cause irritation or allergic reactions.
      - I consent to be tested with these products and understand that this test does
        not replace other medical treatment or diagnosis.
      required: true
    - id: 2
      name: skin_history
      label: What is your skin history?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: skin_type
      label: What is your skin type?
      hint: null
      type: select_one
      options:
      - Dry
      - Normal
      - Oily
      - Sensitive
      required: true
    - id: 4
      name: skin_sensitivity
      label: Are you sensitive to any specific products?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: skin_ingredients
      label: What are the ingredients of the products you have used?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: skin_issues
      label: Are you aware of any skin reactions or allergies you have?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: skin_concerns
      label: Are you experiencing any skin issues or concerns?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: other_products
      label: Have you used any other products recently?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: test_conclusion
      label: Have you experienced any skin sensitivity issues?
      hint: null
      type: text
      options: []
      required: true
