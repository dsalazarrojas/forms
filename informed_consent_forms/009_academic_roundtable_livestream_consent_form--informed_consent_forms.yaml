inputSchema:
  type: object
  properties:
    title: Academic Roundtable Livestream Consent Form
    pages:
    - id: 1
      name: section_participant_details
      label: -- Participant Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: speaker_name
      label: Full Name of Speaker or Participant
      hint: As you wish to be credited
      type: text
      options: []
      required: true
    - id: 3
      name: professional_affiliation
      label: Professional Affiliation or Title
      hint: e.g. Professor of History, University of London
      type: text
      options: []
      required: true
    - id: 4
      name: speaker_email
      label: Speaker Email Address
      hint: Primary contact for event coordination
      type: email
      options: []
      required: true
    - id: 5
      name: section_event_info
      label: -- Event Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: event_name
      label: Name of the Roundtable Event
      hint: Official event title
      type: text
      options: []
      required: true
    - id: 7
      name: event_date
      label: Date of the Livestream
      hint: Scheduled date
      type: date
      options: []
      required: true
    - id: 8
      name: start_time
      label: Scheduled Start Time
      hint: Use local time zone
      type: time
      options: []
      required: true
    - id: 9
      name: section_consent
      label: -- Livestream and Recording Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: livestream_permission
      label: I consent to being recorded and livestreamed during this event
      hint: Core permission for participation
      type: select_one
      options:
      - I Consent
      - I Do Not Consent
      required: true
    - id: 11
      name: platforms_approved
      label: Approved streaming platforms
      hint: Select all that apply
      type: select_multiple
      options:
      - University Portal
      - YouTube Live
      - LinkedIn Live
      - Zoom Webinar
      required: true
    - id: 12
      name: archived_video_permission
      label: May the recording be archived for future viewing?
      hint: Permission for asynchronous access
      type: select_one
      options:
      - Yes - Indefinitely
      - Yes - For 1 Year
      - false
      required: true
    - id: 13
      name: q_and_a_recording
      label: Do you consent to having your responses in the Q and A session recorded?
      hint: Engagement recording permission
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 14
      name: section_rights
      label: -- Rights and Permissions --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: copyright_release
      label: I release any copyright claims to the recording for institutional use
      hint: Legal release
      type: select_one
      options:
      - Yes - Released
      - Other
      required: true
    - id: 16
      name: signature_confirmation
      label: Type name to confirm agreement
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 17
      name: confirmation_date
      label: Date
      hint: Today's date
      type: date
      options: []
      required: true
