inputSchema:
  type: object
  properties:
    title: Blood Draw Consent Form
    pages:
    - id: 1
      name: consent_intro
      label: -- Blood Draw Informed Consent --
      hint: Please review and provide your informed consent
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: medical_record_number
      label: Medical Record Number
      hint: If available
      type: text
      options: []
      required: false
    - id: 5
      name: phone_number
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: procedure_explanation
      label: I understand the purpose and procedure of blood draw
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      - I have questions
      required: true
    - id: 7
      name: risks_acknowledged
      label: I acknowledge potential risks of blood draw
      hint: Minor bruising, infection, dizziness
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 8
      name: benefits_understood
      label: I understand the benefits of blood testing
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 9
      name: alternatives_discussed
      label: Alternative procedures have been discussed
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not applicable
      required: false
    - id: 10
      name: phlebotomist_qualified
      label: I confirm the phlebotomist is qualified
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 11
      name: vein_access_consent
      label: I consent to multiple needle sticks if needed
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 12
      name: infection_control_confirmed
      label: Infection control procedures will be followed
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 13
      name: sample_handling_consent
      label: I consent to proper sample handling and testing
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 14
      name: results_discussion
      label: I wish to discuss results with physician
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 15
      name: questions_asked
      label: Have you had the opportunity to ask questions?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 16
      name: final_consent
      label: I voluntarily consent to this blood draw
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 17
      name: consent_date_time
      label: Date and Time of Consent
      hint: null
      type: date
      options: []
      required: true
