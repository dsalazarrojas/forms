inputSchema:
  type: object
  properties:
    title: Beard Hot Towel Service Consent Form
    pages:
    - id: 1
      name: client_first_name
      label: First Name
      hint: Client first name
      type: text
      options: []
      required: true
    - id: 2
      name: client_last_name
      label: Last Name
      hint: Client last name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: Client DOB
      type: date
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 6
      name: service_date
      label: Service Date
      hint: Appointment date
      type: date
      options: []
      required: true
    - id: 7
      name: barber_name
      label: Barber Name
      hint: Service provider
      type: text
      options: []
      required: true
    - id: 8
      name: skin_conditions
      label: Current Skin Conditions
      hint: Any conditions
      type: select_multiple
      options:
      - Acne
      - Rosacea
      - Eczema
      - Psoriasis
      - Sunburn
      - Open Wounds
      - None
      required: true
    - id: 9
      name: heat_sensitivity
      label: Heat Sensitivity
      hint: Are you sensitive to heat
      type: select_one
      options:
      - Not Sensitive
      - Mildly Sensitive
      - Moderately Sensitive
      - Very Sensitive
      required: true
    - id: 10
      name: medical_conditions
      label: Relevant Medical Conditions
      hint: Especially circulatory
      type: text
      options: []
      required: false
    - id: 11
      name: medications
      label: Current Medications
      hint: Especially blood thinners
      type: text
      options: []
      required: false
    - id: 12
      name: recent_procedures
      label: Recent Facial Procedures
      hint: Surgery or treatments
      type: text
      options: []
      required: false
    - id: 13
      name: service_description
      label: Service Description Understood
      hint: Do you understand the service
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: temperature_comfort
      label: I Will Communicate Temperature Comfort
      hint: Will you speak up
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: risks_understood
      label: Risks Have Been Explained
      hint: Do you understand risks
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: consent_to_service
      label: I Consent to Hot Towel Service
      hint: Do you consent
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 17
      name: additional_services
      label: Additional Services Today
      hint: Any other services
      type: text
      options: []
      required: false
    - id: 18
      name: client_signature
      label: Client Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 19
      name: signature_date
      label: Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
