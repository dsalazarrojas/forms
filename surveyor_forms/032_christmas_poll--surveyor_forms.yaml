inputSchema:
  type: object
  properties:
    title: Christmas Poll
    pages:
      - id: 1
        name: respondent_info
        label: -- Respondent Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: first_name
        label: First Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: last_name
        label: Last Name
        hint: null
        type: text
        options: []
        required: true
      - id: 4
        name: email
        label: Email Address
        hint: null
        type: email
        options: []
        required: true
      - id: 5
        name: holiday_season
        label: -- Holiday Season Plans --
        hint: null
        type: note
        options: []
        required: false
      - id: 6
        name: holiday_spending
        label: How much do you plan to spend on Christmas?
        hint: null
        type: select_one
        options:
          - Under $200
          - $200-$500
          - $500-$1,000
          - $1,000-$2,000
          - Over $2,000
        required: true
      - id: 7
        name: shopping_timeline
        label: When do you plan to do your Christmas shopping?
        hint: null
        type: select_one
        options:
          - Before November
          - November
          - Early December
          - Mid-December
          - Last minute (Dec 20-24)
          - After Christmas
        required: true
      - id: 8
        name: shopping_preference
        label: Do you prefer to shop in-store or online?
        hint: null
        type: select_one
        options:
          - In-store
          - Online
          - Both equally
          - Don't shop
        required: true
      - id: 9
        name: gift_preferences
        label: -- Gift Preferences --
        hint: null
        type: note
        options: []
        required: false
      - id: 10
        name: preferred_gift_type
        label: What type of gifts do you prefer to receive?
        hint: null
        type: select_one
        options:
          - Experiences
          - Gift cards
          - Clothing
          - Electronics
          - Home goods
          - Subscription services
          - Other
        required: true
      - id: 11
        name: gift_budget_preference
        label: Preferred Gift Price Range
        hint: null
        type: select_one
        options:
          - Under $25
          - $25-$50
          - $50-$100
          - $100-$200
          - Over $200
        required: true
      - id: 12
        name: celebrations
        label: -- Holiday Celebrations --
        hint: null
        type: note
        options: []
        required: false
      - id: 13
        name: celebration_style
        label: How do you prefer to celebrate Christmas?
        hint: Select all that apply
        type: select_multiple
        options:
