          - With friends
          - At church or religious gathering
          - Charitable activities
          - Vacationing
          - Quiet and relaxing
          - Party and socializing
        required: true
      - id: 14
        name: entertaining
        label: Will you host or attend holiday parties?
        hint: null
        type: select_one
        options:
          - Yes, host
          - Yes, attend
          - Both
          - None
        required: false
