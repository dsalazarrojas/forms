        name: entertainment_section
        label: -- Entertainment & Activities --
        hint: null
        type: note
        options: []
        required: false
      - id: 16
        name: holiday_activities
        label: Which holiday activities interest you?
        hint: Select all that apply
        type: select_multiple
        options:
          - Holiday movies
          - Holiday music
          - Outdoor decorations
          - Holiday baking
          - Gift wrapping
          - Caroling
          - Games and puzzles
          - Holiday shows
        required: false
      - id: 17
        name: technology_usage
        label: Do you use technology for holiday shopping?
        hint: null
        type: select_one
        options:
          - Always
          - Often
          - Sometimes
          - Rarely
          - Never
        required: false
      - id: 18
        name: sustainability
        label: Are you concerned about sustainable Christmas practices?
        hint: null
        type: select_one
        options:
          - Very concerned
          - Somewhat concerned
          - Not concerned
          - Undecided
        required: false
      - id: 19
        name: additional_comments
        label: Additional Comments or Suggestions
        hint: null
        type: text
        options: []
        required: false
