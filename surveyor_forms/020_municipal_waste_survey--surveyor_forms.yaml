inputSchema:
  type: object
  properties:
    title: municipal_waste_survey
    pages:
    - id: 1
      name: resident_info
      label: Municipal Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: household_type
      label: household_type
      hint: null
      type: select_one
      options:
      - Home
      - Commercial
      - Other
      required: false
    - id: 3
      name: household_size
      label: household_size
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: waste_disposal
      label: waste_disposal
      hint: null
      type: select_multiple
      options:
      - Recycling
      - Composting
      - Landfill
      required: false
    - id: 5
      name: recycling_frequency
      label: recycling_frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Never
      required: false
    - id: 6
      name: collection_type
      label: collection_type
      hint: null
      type: select_multiple
      options:
      - Weekly
      - Bi-Weekly
      - Monthly
      - Quarterly
      - Other
      required: false
    - id: 7
      name: waste_type
      label: waste_type
      hint: null
      type: select_one
      options:
      - Organic
      - Inorganic
      - Glass
      - Other
      required: false
    - id: 8
      name: disposal_location
      label: disposal_location
      hint: null
      type: select_multiple
      options:
      - Home
      - Curbside
      - Landfill
      - Other
      required: false
    - id: 9
      name: waste_description
      label: waste_description
      hint: Please describe the type of waste you dispose
      type: text
      options: []
      required: false
    - id: 10
      name: waste_frequency
      label: waste_frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 11
      name: survey_completed
      label: survey_completed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: contact_info
      label: contact_info
      hint: null
      type: text
      options: []
      required: false
