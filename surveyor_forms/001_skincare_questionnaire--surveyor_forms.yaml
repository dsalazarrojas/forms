inputSchema:
  type: object
  properties:
    title: Skincare Questionnaire
    pages:
    - id: 1
      name: user_input1
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: user_input2
      label: How often do you use skincare products?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Rarely
      required: true
    - id: 3
      name: user_input3
      label: What is your age?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: email_input1
      label: How would you like to be contacted for follow-up questions?
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: select_input1
      label: Which skincare routine is most important to you?
      hint: null
      type: select_multiple
      options:
      - Cleansing
      - Moisturizing
      - Exfoliating
      - Masking
      required: true
    - id: 6
      name: date_input1
      label: On what date did you last use a skincare product?
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: time_input1
      label: At what time of day do you prefer to use skincare products?
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: note_input1
      label: What is your current skincare note?
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: phone_input1
      label: What is your primary phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: phone_input2
      label: What is your secondary phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: user_input4
      label: How do you rate your current skin condition?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Bad
      required: true
    - id: 12
      name: user_input5
      label: Additional comments or notes
      hint: null
      type: note
      options: []
      required: false
