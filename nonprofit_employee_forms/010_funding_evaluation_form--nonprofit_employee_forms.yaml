inputSchema:
  type: object
  properties:
    title: Funding Evaluation Form
    pages:
    - id: 1
      name: funding_request
      label: Funding Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: organization_name
      label: Organization Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: grant_amount
      label: Grant Amount
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: evaluation_criteria
      label: Evaluation Criteria
      hint: null
      type: select_one
      options:
      - Impact
      - Efficiency
      - Effectiveness
      - Feasibility
      required: false
    - id: 5
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: evaluation_time
      label: Evaluation Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: evaluation_note
      label: Evaluation Note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
