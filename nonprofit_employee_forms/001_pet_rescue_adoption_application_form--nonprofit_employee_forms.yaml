inputSchema:
  type: object
  properties:
    title: Pet Rescue Adoption Application Form
    pages:
    - id: 1
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: pet_info
      label: Pet Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: adoption_request
      label: Adoption Request
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: pet_type
      label: Pet Type
      hint: null
      type: select_one
      options:
      - Cat
      - Dog
      - Other
      required: false
    - id: 5
      name: owner_info
      label: Owner Info
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: owner_phone
      label: Owner Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: owner_email
      label: Owner Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_contact_info
      label: Emergency Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: adoption_date
      label: Adoption Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: adoption_agreement
      label: Adoption Agreement
      hint: null
      type: select_multiple
      options:
      - I have read and agree to the terms of the adoption agreement
      - I have not read and do not agree to the terms of the adoption agreement
      required: false
    - id: 14
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
