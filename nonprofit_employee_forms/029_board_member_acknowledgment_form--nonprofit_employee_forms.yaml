inputSchema:
  type: object
  properties:
    title: Board Member Acknowledgment Form
    pages:
    - id: 1
      name: acknowledgment_header
      label: -- Acknowledgment of Duties --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: board_member_name
      label: Board member name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: For organization records
      type: email
      options: []
      required: true
    - id: 4
      name: responsibilities_reviewed
      label: Responsibilities reviewed
      hint: Confirm you have reviewed role responsibilities
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: conflict_of_interest_disclosed
      label: Conflict of interest disclosed
      hint: Disclose any conflicts if applicable
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: signature_name
      label: Signature name
      hint: Type full name to acknowledge
      type: text
      options: []
      required: true
    - id: 7
      name: date
      label: Date
      hint: Date of acknowledgment
      type: date
      options: []
      required: true
