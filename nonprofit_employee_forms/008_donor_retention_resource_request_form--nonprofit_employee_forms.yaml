inputSchema:
  type: object
  properties:
    title: Donor Retention Resource Request Form
    pages:
    - id: 1
      name: donor_retention_request_form
      label: Donor Retention Resource Request Form
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Enter a valid email address
      type: email
      options: []
      required: true
    - id: 4
      name: resource_requested
      label: Resource Requested
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: comment
      label: Comment
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: resource_type
      label: Type of Resource
      hint: null
      type: select_one
      options:
      - Financial Support
      - Volunteer Support
      - Expert Advice
      required: true
    - id: 7
      name: contact_preferred
      label: Contact Preference
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - Mail
      required: true
    - id: 8
      name: resource_request
      label: Resource Request
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 11
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - Submit Request
      - Cancel Request
      required: true
