inputSchema:
  type: object
  properties:
    title: Animal Rescue Tech Usage Survey
    pages:
    - id: 1
      name: organization_name
      label: Organization Name
      hint: Name of your rescue organization
      type: text
      options: []
      required: true
    - id: 2
      name: respondent_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_role
      label: Your Role
      hint: Position in organization
      type: select_one
      options:
      - Executive Director
      - Operations Manager
      - Volunteer Coordinator
      - Foster Coordinator
      - Adoption Coordinator
      - Volunteer
      - Board Member
      - Other
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 5
      name: organization_size
      label: Organization Size
      hint: Number of animals served annually
      type: select_one
      options:
      - Under 50 animals
      - 50-200 animals
      - 201-500 animals
      - 501-1000 animals
      - Over 1000 animals
      required: true
    - id: 6
      name: current_software
      label: What Software Tools Do You Currently Use
      hint: Select all that apply
      type: select_multiple
      options:
      - Shelter Management Software
      - Adoption Platform
      - Volunteer Management System
      - Donor Database
      - Email Marketing Tool
      - Social Media Management
      - Accounting Software
      - Google Workspace or Microsoft 365
      - None
      - Other
      required: true
    - id: 7
      name: software_satisfaction
      label: Satisfaction with Current Technology
      hint: Overall satisfaction level
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 8
      name: tech_challenges
      label: What Technology Challenges Do You Face
      hint: Select all that apply
      type: select_multiple
      options:
      - Limited Budget
      - Lack of Training
      - Outdated Systems
      - Too Many Different Tools
      - Poor Integration Between Systems
      - Limited Technical Support
      - Time Constraints
      - Resistance to Change
      - Other
      required: true
    - id: 9
      name: data_management
      label: How Do You Currently Manage Animal Data
      hint: Primary method
      type: select_one
      options:
      - Dedicated Shelter Management Software
      - Spreadsheets
      - Paper Records
      - Database System
      - Combination of Methods
      required: true
    - id: 10
      name: adoption_tracking
      label: How Do You Track Adoptions
      hint: null
      type: select_one
      options:
      - Automated System
      - Manual Spreadsheets
      - Paper Forms
      - Email and Phone Records
      - Other
      required: true
    - id: 11
      name: volunteer_coordination
      label: How Do You Coordinate Volunteers
      hint: null
      type: select_one
      options:
      - Volunteer Management Software
      - Spreadsheets
      - Email and Phone
      - Paper Schedules
      - Social Media Groups
      - Other
      required: true
    - id: 12
      name: donor_management
      label: How Do You Manage Donor Information
      hint: null
      type: select_one
      options:
      - CRM System
      - Spreadsheets
      - Donor Platform
      - Paper Records
      - No Systematic Approach
      required: true
    - id: 13
      name: tech_budget
      label: Annual Technology Budget
      hint: Approximate amount spent on technology
      type: select_one
      options:
      - Under $500
      - $500-$2000
      - $2001-$5000
      - $5001-$10000
      - Over $10000
      - No Dedicated Budget
      required: false
    - id: 14
      name: desired_features
      label: What Features Would Most Benefit Your Organization
      hint: Select top priorities
      type: select_multiple
      options:
      - Integrated Management System
      - Mobile App Access
      - Automated Reporting
      - Online Adoption Applications
      - Volunteer Scheduling
      - Donor Portal
      - Foster Care Tracking
      - Medical Records Management
      - Communication Tools
      - Analytics Dashboard
      required: true
    - id: 15
      name: training_needs
      label: What Technology Training Would Be Helpful
      hint: Select all that apply
      type: select_multiple
      options:
      - Basic Computer Skills
      - Software Specific Training
      - Data Entry Best Practices
      - Social Media Management
      - Online Fundraising
      - Cybersecurity Awareness
      - No Training Needed
      - Other
      required: false
    - id: 16
      name: implementation_timeline
      label: If Adopting New Technology What Is Your Timeline
      hint: null
      type: select_one
      options:
      - Immediate - Within 1 Month
      - Short Term - 1-3 Months
      - Medium Term - 3-6 Months
      - Long Term - 6-12 Months
      - No Plans Currently
      required: true
    - id: 17
      name: decision_makers
      label: Who Makes Technology Decisions
      hint: null
      type: select_one
      options:
      - Executive Director
      - Board of Directors
      - Operations Manager
      - Committee Vote
      - IT Consultant
      - Other
      required: true
    - id: 18
      name: additional_comments
      label: Additional Comments or Suggestions
      hint: Share your thoughts
      type: text
      options: []
      required: false
