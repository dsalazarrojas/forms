inputSchema:
  type: object
  properties:
    title: Nonprofit Advocacy Strategy Feedback Evaluation Form
    pages:
    - id: 1
      name: nonprofit_advocacy_strategy_feedback_evaluation_form_1
      label: What is your role in the organization?
      hint: null
      type: select_one
      options:
      - Executive Director
      - Program Director
      - Development Director
      - Communications Director
      - Other
      required: true
    - id: 2
      name: nonprofit_advocacy_strategy_feedback_evaluation_form_2
      label: How do you rate the current advocacy strategy?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 3
      name: nonprofit_advocacy_strategy_feedback_evaluation_form_3
      label: What are the biggest challenges you're facing with the current advocacy
        strategy?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: nonprofit_advocacy_strategy_feedback_evaluation_form_4
      label: What suggestions do you have for improving the current advocacy strategy?
      hint: null
      type: text
      options: []
      required: true
