inputSchema:
  type: object
  properties:
    title: PayPal Donation Form
    pages:
    - id: 1
      name: donation_amount
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: donation_currency
      label: Currency
      hint: null
      type: select_one
      options:
      - USD
      - EUR
      - GBP
      - JPY
      required: false
    - id: 3
      name: donation_description
      label: Donation Description
      hint: null
      type: note
      options: []
      required: false
