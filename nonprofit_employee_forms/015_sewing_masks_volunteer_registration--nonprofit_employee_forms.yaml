inputSchema:
  type: object
  properties:
    title: sewing_masks_volunteer_registration
    pages:
    - id: 1
      name: contact_information
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: Please enter a valid email address
      type: email
      options: []
      required: false
    - id: 3
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: zip_code
      label: Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: phone_number
      label: Phone Number
      hint: Please enter a valid phone number
      type: text
      options: []
      required: false
    - id: 8
      name: skills
      label: What skills you have?
      hint: e.g. sewing
      type: text
      options: []
      required: false
    - id: 9
      name: volunteer_frequency
      label: How often can you volunteer?
      hint: Please select the frequency you can volunteer
      type: select_one
      options:
      - Every Day
      - 2-3 times a week
      - 1 time a week
      - Rarely
      required: false
    - id: 10
      name: availability
      label: What time of day are you available?
      hint: Please select all the times you are available
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      - Other (please specify)
      required: false
    - id: 11
      name: availability_other
      label: Other (please specify)
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: volunteer_type
      label: What type of volunteer are you?
      hint: Please select all the types you are
      type: select_multiple
      options:
      - Sewing
      - Non-sewing
      required: false
    - id: 13
      name: volunteer_location
      label: Where you can volunteer?
      hint: Please select all the locations you can volunteer
      type: select_multiple
      options:
      - Home
      - Office
      - Local park
      required: false
    - id: 14
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: emergency_contact_relationship
      label: Relationship
      hint: Please select the relationship
      type: select_one
      options:
      - Parent
      - Spouse
      - Child
      - Sibling
      - Other (please specify)
      required: false
    - id: 18
      name: emergency_contact_relationship_other
      label: Other (please specify)
      hint: null
      type: text
      options: []
      required: false
