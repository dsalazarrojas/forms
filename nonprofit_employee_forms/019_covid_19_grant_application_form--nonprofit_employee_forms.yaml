inputSchema:
  type: object
  properties:
    title: COVID 19 Grant Application Form
    pages:
    - id: 1
      name: organization_header
      label: -- Organization Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: business_name
      label: Business or Organization Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: legal_entity_type
      label: Legal Entity Type
      hint: null
      type: select_one
      options:
      - Sole Proprietor
      - LLC
      - Corporation
      - Non-Profit
      - Partnership
      - Other
      required: true
    - id: 4
      name: registration_number
      label: Business Registration Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: tax_id
      label: Tax ID or EIN
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: business_address
      label: Business Address
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: contact_person
      label: Contact Person Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: business_details_header
      label: -- Business Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: industry_type
      label: Industry Type
      hint: null
      type: select_one
      options:
      - Retail
      - Food Service
      - Manufacturing
      - Healthcare
      - Professional Services
      - Other
      required: true
    - id: 12
      name: employees_number
      label: Number of Employees
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: annual_revenue
      label: Annual Revenue Before Pandemic
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: business_established
      label: Date Business Established
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: impact_header
      label: -- Pandemic Impact --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: revenue_loss
      label: Estimated Revenue Loss
      hint: null
      type: number
      options: []
      required: true
    - id: 17
      name: revenue_loss_percentage
      label: Percentage of Revenue Lost
      hint: null
      type: number
      options: []
      required: true
    - id: 18
      name: operational_challenges
      label: Operational Challenges
      hint: Select all that apply
      type: select_multiple
      options:
      - Closure or Reduced Operations
      - Supply Chain Disruption
      - Staff Shortage
      - Increased Expenses
      - Customer Decline
      - Other
      required: true
    - id: 19
      name: funds_usage
      label: Intended Use of Grant Funds
      hint: null
      type: select_multiple
      options:
      - Payroll and Wages
      - Rent and Utilities
      - Equipment and Supplies
      - Debt Repayment
      - Working Capital
      - Other
      required: true
    - id: 20
      name: grant_amount
      label: Amount Requested
      hint: null
      type: number
      options: []
      required: true
    - id: 21
      name: supporting_documents
      label: Supporting Documents Attached
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 22
      name: agreement
      label: I certify all information is accurate and true
      hint: null
      type: select_one
      options:
      - Yes, I Certify
      - No, I Do Not Certify
      required: true
