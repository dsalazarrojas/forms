        hint: Are the financial records consistent with actual spending
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 11
        name: documentation_status
        label: Documentation Completeness
        hint: Status of required legal and project documents
        type: select_one
        options:
          - Complete
          - Incomplete - Minor Missing
          - Incomplete - Major Missing
        required: true
      - id: 12
        name: discrepancies_found
        label: Discrepancies or Irregularities Found
        hint: Describe any issues identified during the audit
        type: text
        options: []
