inputSchema:
  type: object
  properties:
    title: Charitable Project Integrity Audit Form
    pages:
      - id: 1
        name: section_auditor_info
        label: -- Auditor Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: auditor_full_name
        label: Auditor Full Name
        hint: Enter the name of the person conducting the audit
        type: text
        options: []
        required: true
      - id: 3
        name: audit_date
        label: Date of Audit
        hint: null
        type: date
        options: []
        required: true
      - id: 4
        name: section_project_details
        label: -- Project Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 5
        name: project_name
        label: Project Name
        hint: Name of the charitable project being audited
        type: text
        options: []
        required: true
      - id: 6
        name: project_manager
        label: Project Manager
        hint: null
        type: text
        options: []
        required: true
      - id: 7
        name: project_status
        label: Current Project Status
        hint: Select the current phase of the project
        type: select_one
        options:
          - Planning
          - Active
          - On Hold
          - Completed
          - Cancelled
        required: true
      - id: 8
        name: section_compliance_review
        label: -- Compliance and Integrity Review --
        hint: null
        type: note
        options: []
        required: false
      - id: 9
        name: compliance_level
        label: Overall Compliance Level
        hint: Assessment of adherence to nonprofit regulations
        type: select_one
        options:
          - Fully Compliant
          - Mostly Compliant
          - Partially Compliant
          - Non-Compliant
        required: true
      - id: 10
        name: financial_accuracy
