inputSchema:
  type: object
  properties:
    title: Lgbtq_allyship_in_nonprofits_survey
    pages:
    - id: 1
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Nonprofit Employee Forms
      - Other
      required: false
    - id: 2
      name: description
      label: description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: question_1
      label: Have you completed any LGBTQ+ Allyship Trainings or Workshops?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Partially
      required: false
    - id: 4
      name: question_2
      label: Have you attended any meetings or events focused on LGBTQ+ Allyship in
        Nonprofits?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: question_3
      label: How do you feel about your organization's current allyship culture?
      hint: null
      type: select_one
      options:
      - Strongly Supportive
      - Somewhat Supportive
      - Neutral
      - Somewhat Hostile
      - Strongly Hostile
      required: false
    - id: 6
      name: question_4
      label: What types of barriers or challenges do you experience when trying to
        promote LGBTQ+ allyship in your organization?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: question_5
      label: Have you ever experienced or witnessed any negative consequences as a
        result of promoting LGBTQ+ allyship?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: question_6
      label: How often do you discuss LGBTQ+ topics with your coworkers?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: false
    - id: 9
      name: question_7
      label: What types of resources would you like to have more access to or training
        on?
      hint: null
      type: select_multiple
      options:
      - LGBTQ+ 101
      - Allyship 101
      - Pronouns and Names
      - Safe Space Trainings
      - Other (please specify)
      required: false
    - id: 10
      name: question_8
      label: How can we improve LGBTQ+ allyship in our organization?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: question_9
      label: How many years have you been working with this nonprofit?
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: question_10
      label: Do you identify as LGBTQ+?
      hint: null
      type: select_multiple
      options:
      - Transgender
      - Gay
      - Lesbian
      - Bisexual
      - Queer
      - Other (please specify)
      required: false
    - id: 13
      name: question_11
      label: Do you identify as a member of any of the following groups?
      hint: null
      type: select_multiple
      options:
      - Non-Binary
      - Questioning
      - Intersex
      - Asexual
      - Other (please specify)
      required: false
    - id: 14
      name: question_12
      label: Do you have any other comments or concerns you'd like to share?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: question_13
      label: How often do you think your organization should be promoting LGBTQ+ Allyship?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: false
    - id: 16
      name: question_14
      label: Is there anything else you'd like to add about how your organization
        can improve LGBTQ+ allyship?
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: question_15
      label: How would you rate the current state of LGBTQ+ Allyship in this nonprofit?
      hint: null
      type: number
      options: []
      required: false
    - id: 18
      name: question_16
      label: Would you be willing to share some of your thoughts about how we can
        improve our work?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 19
      name: question_17
      label: What is your role in the organization?
      hint: null
      type: select_multiple
      options:
      - Executive Director
      - Program Director
      - Team Member
      - Other (please specify)
      required: false
    - id: 20
      name: question_18
      label: Have you ever seen any positive changes as a result of our efforts?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 21
      name: question_19
      label: What do you think is the most important factor for improving our Allyship
        efforts?
      hint: null
      type: select_multiple
      options:
      - Training and Education
      - Inclusion and Diversity
      - Community Engagement
      - Leadership Support
      - Other (please specify)
      required: false
    - id: 22
      name: question_20
      label: How important is it for you to see positive changes in our Allyship efforts?
      hint: null
      type: select_one
      options:
      - Very Important
      - Somewhat Important
      - Not Very Important
      - Not at All Important
      required: false
    - id: 23
      name: question_21
      label: Do you have any other thoughts or comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: question_22
      label: How long have you been a member of our nonprofit?
      hint: null
      type: number
      options: []
      required: false
    - id: 25
      name: question_23
      label: Do you wish to receive updates on our Allyship efforts?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
