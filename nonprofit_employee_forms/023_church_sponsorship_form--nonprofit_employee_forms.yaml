inputSchema:
  type: object
  properties:
    title: Church Sponsorship Form
    pages:
    - id: 1
      name: sponsor_name
      label: Sponsor Name
      hint: Individual or organization name
      type: text
      options: []
      required: true
    - id: 2
      name: sponsor_type
      label: Sponsor Type
      hint: null
      type: select_one
      options:
      - Individual
      - Family
      - Business
      - Organization
      - Foundation
      required: true
    - id: 3
      name: contact_person
      label: Primary Contact Person
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: address
      label: Mailing Address
      hint: Street, city, state, zip
      type: text
      options: []
      required: true
    - id: 7
      name: sponsorship_level
      label: Sponsorship Level
      hint: Select desired level
      type: select_one
      options:
      - Platinum ($10,000+)
      - Gold ($5,000-$9,999)
      - Silver ($2,500-$4,999)
      - Bronze ($1,000-$2,499)
      - Friend ($500-$999)
      - Custom Amount
      required: true
    - id: 8
      name: sponsorship_amount
      label: Sponsorship Amount
      hint: If custom amount
      type: number
      options: []
      required: false
    - id: 9
      name: sponsored_program
      label: Which Program Would You Like to Sponsor
      hint: Select all that apply
      type: select_multiple
      options:
      - Youth Ministry
      - Children's Programs
      - Music Ministry
      - Outreach Programs
      - Building Fund
      - Mission Trips
      - Community Service
      - General Fund
      - Special Events
      required: true
    - id: 10
      name: sponsorship_duration
      label: Sponsorship Duration
      hint: null
      type: select_one
      options:
      - One-time
      - Monthly
      - Quarterly
      - Annually
      - Multi-year
      required: true
    - id: 11
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Check
      - Credit Card
      - Bank Transfer
      - Stock Transfer
      - In-Kind Donation
      - Other
      required: true
    - id: 12
      name: payment_schedule
      label: Payment Schedule
      hint: When would you like to pay
      type: select_one
      options:
      - Full payment now
      - Monthly installments
      - Quarterly installments
      - Split payment
      required: true
    - id: 13
      name: recognition_preference
      label: Recognition Preference
      hint: How would you like to be recognized
      type: select_one
      options:
      - Public recognition desired
      - Anonymous sponsorship
      - Recognition in program only
      - No recognition needed
      required: true
    - id: 14
      name: recognition_options
      label: Recognition Options
      hint: Select all that apply
      type: select_multiple
      options:
      - Name on website
      - Name in bulletin
      - Name on plaque
      - Social media mention
      - Event acknowledgment
      - Logo display
      - None
      required: false
    - id: 15
      name: tax_receipt
      label: Tax Receipt Information
      hint: null
      type: select_one
      options:
      - Send receipt by email
      - Send receipt by mail
      - No receipt needed
      required: true
    - id: 16
      name: business_info
      label: Business Information
      hint: If business sponsor
      type: text
      options: []
      required: false
    - id: 17
      name: marketing_materials
      label: Would You Like to Provide Marketing Materials
      hint: Brochures, business cards, etc.
      type: select_one
      options:
      - Yes, will provide
      - 'False'
      required: false
    - id: 18
      name: volunteer_interest
      label: Would You Also Like to Volunteer
      hint: null
      type: select_one
      options:
      - Yes, interested
      - Maybe
      - No, sponsorship only
      required: false
    - id: 19
      name: church_connection
      label: What Is Your Connection to Our Church
      hint: null
      type: select_one
      options:
      - Active member
      - Former member
      - Friend of church
      - Business partner
      - Community supporter
      - Other
      required: true
    - id: 20
      name: additional_comments
      label: Additional Comments or Questions
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: signature
      label: Authorized Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 22
      name: signature_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
