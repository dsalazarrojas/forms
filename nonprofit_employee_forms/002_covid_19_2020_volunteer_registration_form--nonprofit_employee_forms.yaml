inputSchema:
  type: object
  properties:
    title: COVID 19 2020 Volunteer Registration Form
    pages:
    - id: 1
      name: personal_information
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: We will use this to contact you
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Your primary contact number
      type: text
      options: []
      required: true
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: zip_code
      label: Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: volunteer_section
      label: -- Volunteer Interest --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: volunteer_role
      label: Volunteer Role Interest
      hint: Select the role you are interested in
      type: select_one
      options:
      - Medical Support
      - Administrative Support
      - Community Outreach
      - Data Management
      - Other
      required: true
    - id: 13
      name: availability
      label: Days Available to Volunteer
      hint: Select all applicable
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 14
      name: prior_experience
      label: Do you have prior volunteer experience
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: medical_background
      label: Do you have medical or healthcare background
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 16
      name: vaccination_status
      label: Vaccination Status
      hint: Required for volunteer placement
      type: select_one
      options:
      - Fully Vaccinated
      - Partially Vaccinated
      - Not Vaccinated
      required: true
    - id: 17
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: agreement
      label: I agree to follow all COVID-19 safety protocols
      hint: null
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
