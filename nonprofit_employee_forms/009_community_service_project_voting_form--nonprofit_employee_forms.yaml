inputSchema:
  type: object
  properties:
    title: Community Service Project Voting Form
    pages:
      - id: 1
        name: voter_name
        label: Voter full name
        hint: Organization staff or community member
        type: text
        options: []
        required: true
      - id: 2
        name: voter_email
        label: Voter email
        hint: For verification of submission
        type: email
        options: []
        required: true
      - id: 3
        name: project_list
        label: Projects to vote on
        hint: Select your preferred project or projects
        type: select_multiple
        options: [Neighborhood cleanup, Community garden, Youth mentoring, Senior outreach, Public art installation]
        required: true
      - id: 4
        name: top_choice
        label: Top choice project
        hint: Select your single top preference
        type: select_one
        options: [Neighborhood cleanup, Community garden, Youth mentoring, Senior outreach, Public art installation]
        required: true
      - id: 5
        name: rationale
        label: Rationale for selection
        hint: Optional explanation for your vote
        type: text
        options: []
        required: false
      - id: 6
        name: affiliation
        label: Affiliation or role
        hint: Volunteer, staff, resident, or other
        type: text
        options: []
        required: false
      - id: 7
        name: anonymous_vote
        label: Submit vote anonymously
        hint: Choose Yes to hide your identity
        type: select_one
        options: [Yes, No]
        required: false
