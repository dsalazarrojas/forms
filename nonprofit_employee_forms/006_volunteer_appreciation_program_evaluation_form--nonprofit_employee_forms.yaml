inputSchema:
  type: object
  properties:
    title: Volunteer Appreciation Program Evaluation Form
    pages:
    - id: 1
      name: volunteer_name
      label: Volunteer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: role
      label: Volunteer Role
      hint: null
      type: select_one
      options:
      - Volunteer
      - Non-Board Member
      - Staff Member
      - Other
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: appreciation_frequency
      label: Appreciation Frequency
      hint: null
      type: select_multiple
      options:
      - Always
      - Occasionally
      - Rarely
      - Never
      required: true
    - id: 7
      name: recognition_methods
      label: Recognition Methods
      hint: null
      type: select_multiple
      options:
      - Publicly
      - Privately
      - Both
      required: true
    - id: 8
      name: suggestion
      label: Suggestion
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: assigned_user
      label: Assigned User
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: date_time
      label: Date and Time
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - Submit
      - Save and Continue
      - Save and Edit
      required: true
