inputSchema:
  type: object
  properties:
    title: Blackjack Animal Rescue Online Application Form
    pages:
    - id: 1
      name: application_intro
      label: Animal Adoption Application
      hint: Thank you for your interest in adopting from Blackjack Animal Rescue
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_name
      label: Full Name
      hint: Your complete legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: address
      label: Street Address
      hint: Your full address
      type: text
      options: []
      required: true
    - id: 6
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: true
    - id: 7
      name: state
      label: State
      hint: Your state
      type: text
      options: []
      required: true
    - id: 8
      name: zip_code
      label: ZIP Code
      hint: Your postal code
      type: text
      options: []
      required: true
    - id: 9
      name: housing_type
      label: Housing Type
      hint: What type of home do you have
      type: select_one
      options:
      - House - Owned
      - House - Rented
      - Apartment
      - Condo
      - Townhouse
      - Farm
      required: true
    - id: 10
      name: yard_info
      label: Yard Information
      hint: Do you have a yard
      type: select_one
      options:
      - Large Fenced Yard
      - Small Fenced Yard
      - Unfenced Yard
      - No Yard
      - Not Applicable
      required: true
    - id: 11
      name: landlord_approval
      label: Landlord Approval
      hint: If renting does landlord allow pets
      type: select_one
      options:
      - Yes Approved
      - 'False'
      - Not Applicable - I Own
      required: true
    - id: 12
      name: current_pets
      label: Current Pets
      hint: Do you currently have pets
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: pet_details
      label: Pet Details
      hint: List your current pets with breed and age
      type: text
      options: []
      required: false
    - id: 14
      name: pet_experience
      label: Pet Experience
      hint: Describe your experience with animals
      type: text
      options: []
      required: true
    - id: 15
      name: animal_preference
      label: Animal Preference
      hint: What animal are you interested in
      type: select_one
      options:
      - Dog
      - Cat
      - Either
      required: true
    - id: 16
      name: age_preference
      label: Age Preference
      hint: Preferred age of animal
      type: select_one
      options:
      - Puppy or Kitten
      - Young 1-3 years
      - Adult 4-7 years
      - Senior 8 plus years
      - No Preference
      required: true
    - id: 17
      name: size_preference
      label: Size Preference
      hint: Preferred size for dog
      type: select_one
      options:
      - Small under 20 lbs
      - Medium 20-50 lbs
      - Large 50-80 lbs
      - Extra Large over 80 lbs
      - No Preference
      required: false
    - id: 18
      name: activity_level
      label: Activity Level
      hint: How active is your lifestyle
      type: select_one
      options:
      - Very Active
      - Moderately Active
      - Mostly Sedentary
      required: true
    - id: 19
      name: work_schedule
      label: Work Schedule
      hint: How many hours away from home daily
      type: select_one
      options:
      - Home Most of Day
      - Away 4-6 Hours
      - Away 7-9 Hours
      - Away 10 plus Hours
      required: true
    - id: 20
      name: children_in_home
      label: Children in Home
      hint: Do you have children
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 21
      name: children_ages
      label: Children Ages
      hint: Ages of children
      type: text
      options: []
      required: false
    - id: 22
      name: vet_reference
      label: Veterinarian Reference
      hint: Name and contact of your vet if applicable
      type: text
      options: []
      required: false
    - id: 23
      name: personal_reference
      label: Personal Reference
      hint: Name and contact of a personal reference
      type: text
      options: []
      required: true
    - id: 24
      name: adoption_motivation
      label: Why Do You Want to Adopt
      hint: Tell us about your decision to adopt
      type: text
      options: []
      required: true
    - id: 25
      name: additional_comments
      label: Additional Comments
      hint: Anything else you want to share
      type: text
      options: []
      required: false
