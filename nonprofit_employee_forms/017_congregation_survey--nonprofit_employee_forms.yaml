inputSchema:
  type: object
  properties:
    title: Congregation Survey
    pages:
    - id: 1
      name: survey_date
      label: Survey Date
      hint: Date of survey completion
      type: date
      options: []
      required: true
    - id: 2
      name: respondent_type
      label: Are You a Member
      hint: Your membership status
      type: select_one
      options:
      - Yes - Full Member
      - Yes - Regular Attender
      - Occasional Visitor
      - First Time Visitor
      required: true
    - id: 3
      name: attendance_duration
      label: How Long Have You Attended
      hint: Length of attendance
      type: select_one
      options:
      - Less than 6 months
      - 6 months to 1 year
      - 1 to 3 years
      - 3 to 5 years
      - 5 to 10 years
      - More than 10 years
      required: true
    - id: 4
      name: age_group
      label: Age Group
      hint: Your age range
      type: select_one
      options:
      - Under 18
      - 18 to 24
      - 25 to 34
      - 35 to 44
      - 45 to 54
      - 55 to 64
      - 65 or older
      required: false
    - id: 5
      name: family_status
      label: Family Status
      hint: Your household situation
      type: select_one
      options:
      - Single
      - Married
      - Divorced
      - Widowed
      - Prefer Not to Say
      required: false
    - id: 6
      name: children_in_program
      label: Do You Have Children in Programs
      hint: Are your children involved
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Applicable
      required: true
    - id: 7
      name: service_satisfaction
      label: Satisfaction with Worship Services
      hint: How satisfied are you with services
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 8
      name: sermon_quality
      label: Quality of Sermons
      hint: Rating of sermon content
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: music_worship
      label: Music and Worship Quality
      hint: Rating of music ministry
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 10
      name: service_times
      label: Are Service Times Convenient
      hint: Do service times work for you
      type: select_one
      options:
      - Yes - Very Convenient
      - Yes - Mostly Convenient
      - Neutral
      - No - Inconvenient
      required: true
    - id: 11
      name: children_youth_programs
      label: Quality of Children and Youth Programs
      hint: Rating of programs for young people
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not Applicable
      required: true
    - id: 12
      name: community_fellowship
      label: Sense of Community and Fellowship
      hint: How strong is the sense of community
      type: select_one
      options:
      - Very Strong
      - Strong
      - Moderate
      - Weak
      - Very Weak
      required: true
    - id: 13
      name: pastoral_care
      label: Quality of Pastoral Care
      hint: Rating of pastoral support
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Have Not Used
      required: true
    - id: 14
      name: small_group_participation
      label: Do You Participate in Small Groups
      hint: Are you in a Bible study or small group
      type: select_one
      options:
      - Yes - Currently Active
      - Yes - Occasionally
      - No - Interested
      - No - Not Interested
      required: true
    - id: 15
      name: volunteer_participation
      label: Do You Volunteer
      hint: Are you involved in ministry service
      type: select_one
      options:
      - Yes - Regularly
      - Yes - Occasionally
      - No - Willing to Serve
      - No - Unable to Serve
      required: true
    - id: 16
      name: volunteer_areas
      label: Areas of Volunteer Service
      hint: Select all that apply
      type: select_multiple
      options:
      - Ushering or Greeting
      - Children Ministry
      - Youth Ministry
      - Music Ministry
      - Hospitality
      - Outreach
      - Facilities
      - Administration
      - Prayer Ministry
      - None
      required: false
    - id: 17
      name: communication_effectiveness
      label: Effectiveness of Church Communication
      hint: How well does the church communicate
      type: select_one
      options:
      - Very Effective
      - Effective
      - Neutral
      - Ineffective
      - Very Ineffective
      required: true
    - id: 18
      name: preferred_communication
      label: Preferred Communication Method
      hint: How do you prefer to receive information
      type: select_multiple
      options:
      - Email
      - Text Messages
      - Phone Calls
      - Church Website
      - Social Media
      - Printed Bulletins
      - Announcements During Service
      required: false
    - id: 19
      name: facility_condition
      label: Condition of Church Facilities
      hint: Rating of building and grounds
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 20
      name: overall_experience
      label: Overall Church Experience
      hint: Your overall satisfaction
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 21
      name: recommend_to_others
      label: Would You Recommend This Church
      hint: Likelihood of recommending to others
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Neutral
      - Probably No
      - Definitely No
      required: true
    - id: 22
      name: areas_for_improvement
      label: Areas Needing Improvement
      hint: What could be improved
      type: text
      options: []
      required: false
    - id: 23
      name: prayer_requests
      label: Do You Have Prayer Requests
      hint: Would you like to share prayer needs
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 24
      name: prayer_request_details
      label: Prayer Request Details
      hint: Share your prayer requests
      type: text
      options: []
      required: false
    - id: 25
      name: additional_comments
      label: Additional Comments or Suggestions
      hint: Any other feedback
      type: text
      options: []
      required: false
