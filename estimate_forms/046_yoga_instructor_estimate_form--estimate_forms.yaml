inputSchema:
  type: object
  properties:
    title: Yoga Instructor Estimate Form
    pages:
    - id: 1
      name: form_info
      label: Form Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: instructor
      label: Instructor
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: student_count
      label: Student Count
      hint: Enter the number of students in your class
      type: number
      options: []
      required: false
    - id: 4
      name: session_length
      label: Session Length
      hint: null
      type: select_one
      options:
      - 30 minutes
      - 45 minutes
      - 60 minutes
      - 90 minutes
      required: false
    - id: 5
      name: pricing
      label: Pricing
      hint: null
      type: select_multiple
      options:
      - Private Session
      - Package (multiple sessions)
      - Group Class
      required: false
    - id: 6
      name: location
      label: Location
      hint: null
      type: select_one
      options:
      - Studio
      - Home
      - Online
      required: false
    - id: 7
      name: services
      label: Services
      hint: Select additional services (check all that apply)
      type: select_multiple
      options:
      - Meditation
      - Yoga
      - Breathwork
      required: false
    - id: 8
      name: estimated_price
      label: Estimated Price
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: package_length
      label: Package Length
      hint: null
      type: select_one
      options:
      - 4 sessions
      - 8 sessions
      - 12 sessions
      required: false
    - id: 10
      name: package_price
      label: Package Price
      hint: null
      type: select_one
      options:
      - $120
      - $180
      - $240
      required: false
    - id: 11
      name: group_count
      label: Group Count
      hint: null
      type: select_one
      options:
      - 1-2 students
      - 3-4 students
      - 5-10 students
      - More than 10 students
      required: false
    - id: 12
      name: estimated_price_group
      label: Estimated Price Group
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: form_submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
