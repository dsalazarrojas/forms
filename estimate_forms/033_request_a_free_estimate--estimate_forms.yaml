inputSchema:
  type: object
  properties:
    title: Request A Free Estimate
    pages:
    - id: 1
      name: estimate_request_form
      label: Request A Free Estimate Form
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: category_input
      label: select_category
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''label'': ''General Construction''}'
      - '{''id'': 2, ''label'': ''Home Improvement''}'
      - '{''id'': 3, ''label'': ''Other''}'
      required: true
    - id: 3
      name: service_type_input
      label: select_service_type
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''General Labor''}'
      - '{''id'': 2, ''label'': ''Labor + Materials''}'
      - '{''id'': 3, ''label'': ''Service Only''}'
      required: true
    - id: 4
      name: project_location_input
      label: project_location
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: job_duration_input
      label: job_duration
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: project_description_input
      label: project_description
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_email_input
      label: contact_email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: contact_phone_input
      label: contact_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_message_input
      label: contact_message
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: form_attachments_input
      label: form_attachments
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''label'': ''Upload Documents''}'
      - '{''id'': 2, ''label'': ''Share Location''}'
      - '{''id'': 3, ''label'': ''Other (optional)''}'
      required: false
    - id: 11
      name: submit_button
      label: Submit
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: confirm_input
      label: confirm
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''I confirm I have read the estimate request form.''}'
      - '{''id'': 2, ''label'': ''I do not confirm I have read the estimate request
        form.''}'
      required: true
