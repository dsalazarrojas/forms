inputSchema:
  type: object
  properties:
    title: Artist Estimate Form
    pages:
    - id: 1
      name: section_header_1
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: Full name of the client
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company or Organization
      hint: Client's company name if applicable
      type: text
      options: []
      required: false
    - id: 6
      name: section_header_2
      label: -- Project Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: project_title
      label: Project Title
      hint: Name or description of the project
      type: text
      options: []
      required: true
    - id: 8
      name: project_description
      label: Detailed Project Description
      hint: What does the client want created?
      type: text
      options: []
      required: true
    - id: 9
      name: project_type
      label: Type of Artistic Work
      hint: What type of project is this?
      type: select_one
      options:
      - Custom Painting
      - Portrait or Sculpture
      - Graphic Design
      - Illustration
      - Mural or Street Art
      - Installation Art
      - Digital Art
      - Photography
      - Animation
      - Fine Art Commission
      - Other
      required: true
    - id: 10
      name: section_header_3
      label: -- Scope and Size --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: project_size
      label: Project Size or Scale
      hint: Dimensions or scope of the work
      type: text
      options: []
      required: true
    - id: 12
      name: complexity_level
      label: Complexity Level
      hint: How complex is this project?
      type: select_one
      options:
      - Simple/Basic
      - Moderate
      - Complex
      - Highly Complex
      - Custom/Experimental
      required: true
    - id: 13
      name: materials_specified
      label: Are Specific Materials Required?
      hint: Does the client want specific materials?
      type: select_one
      options:
      - Client specified materials
      - Artist's choice
      - TBD after consultation
      required: true
    - id: 14
      name: section_header_4
      label: -- Timeline --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: start_date
      label: Desired Start Date
      hint: When should work begin?
      type: date
      options: []
      required: true
    - id: 16
      name: completion_date
      label: Desired Completion Date
      hint: When does the client need it done?
      type: date
      options: []
      required: true
    - id: 17
      name: timeline_flexibility
      label: Timeline Flexibility
      hint: Is the deadline flexible?
      type: select_one
      options:
      - Fixed deadline
      - Somewhat flexible
      - Very flexible
      required: false
    - id: 18
      name: section_header_5
      label: -- Budget and Payment --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: budget_range
      label: Client Budget Range (GBP)
      hint: What is the client's budget?
      type: text
      options: []
      required: false
    - id: 20
      name: payment_terms
      label: Preferred Payment Terms
      hint: How would the client like to pay?
      type: select_one
      options:
      - Full payment upfront
      - 50% deposit, 50% on completion
      - Installment payments
      - Payment on completion
      - Other arrangement
      required: true
    - id: 21
      name: revision_allowance
      label: Number of Revisions Included
      hint: How many revision rounds?
      type: select_one
      options:
      - Unlimited
      - 3-5 revisions
      - 1-2 revisions
      - No revisions
      required: false
    - id: 22
      name: section_header_6
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: reference_materials
      label: Reference Materials or Inspiration
      hint: Any images, samples, or inspiration provided?
      type: text
      options: []
      required: false
    - id: 24
      name: special_requirements
      label: Special Requirements or Constraints
      hint: Any specific needs or limitations?
      type: text
      options: []
      required: false
    - id: 25
      name: additional_notes
      label: Additional Information or Questions
      hint: Any other relevant details?
      type: text
      options: []
      required: false
