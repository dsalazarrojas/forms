inputSchema:
  type: object
  properties:
    title: Chinese New Year Student Survey
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 2
      name: class_level
      label: Class or Grade Level
      hint: Student grade
      type: text
      options: []
      required: false
    - id: 3
      name: prior_knowledge
      label: Prior Knowledge of Chinese New Year
      hint: Rate students familiarity
      type: select_one
      options:
      - Very familiar
      - Somewhat familiar
      - Slightly familiar
      - Not familiar
      required: true
    - id: 4
      name: favorite_activity
      label: Favorite Activity from Lessons
      hint: Which activity did you like most
      type: text
      options: []
      required: false
    - id: 5
      name: cultural_understanding
      label: Did the lessons improve cultural understanding
      hint: Yes or no response
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: suggestions
      label: Suggestions for Future Lessons
      hint: Student ideas for improvement
      type: text
      options: []
      required: false
