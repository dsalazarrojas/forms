inputSchema:
  type: object
  properties:
    title: Academic Curriculum Assessment Questionnaire
    pages:
    - id: 1
      name: questionnaire_header
      label: -- Academic Curriculum Assessment Questionnaire --
      hint: Provide feedback on the curriculum for the current academic term
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Full name (optional)
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: institution
      label: Institution name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
