      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: course_evaluation
      label: How would you evaluate the course?
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: assessment_comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: student_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
