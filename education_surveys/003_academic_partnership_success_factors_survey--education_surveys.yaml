inputSchema:
  type: object
  properties:
    title: Academic Partnership Success Factors Survey
    pages:
    - id: 1
      name: survey_header
      label: -- Academic Partnership Success Factors Survey --
      hint: This survey evaluates the effectiveness of academic-industry partnerships and identifies areas for improvement.
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_organization
      label: Which type of organization do you represent
      hint: null
      type: select_one
      options:
        - University or College
        - Industry Partner
        - Government Agency
        - Non-Profit Organization
        - Research Institute
      required: true
    - id: 3
      name: respondent_name
      label: Your full name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: respondent_email
      label: Your email address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: partnership_duration
      label: How long has the partnership been active
      hint: null
      type: select_one
      options:
        - Less than 1 year
        - 1-2 years
        - 3-5 years
        - More than 5 years
      required: true
    - id: 6
      name: partnership_type
      label: What type of partnership activities are involved (select all that apply)
      hint: null
      type: select_multiple
      options:
        - Joint research projects
        - Student internships or placements
        - Curriculum development
        - Technology transfer
        - Faculty exchange
        - Sponsored programs or grants
      required: true
    - id: 7
      name: communication_effectiveness
      label: How effective is the communication between partner organizations
      hint: null
      type: select_one
      options:
        - Very ineffective
        - Somewhat ineffective
        - Neutral
        - Somewhat effective
        - Very effective
      required: true
    - id: 8
      name: goal_alignment
      label: How well are the goals and objectives of both partners aligned
      hint: null
      type: select_one
      options:
        - Poorly aligned
        - Somewhat aligned
        - Moderately aligned
        - Well aligned
        - Perfectly aligned
      required: true
    - id: 9
      name: resource_sharing_satisfaction
      label: How satisfied are you with the sharing of resources (funding, facilities, personnel) in this partnership
      hint: null
      type: select_one
      options:
        - Very dissatisfied
        - Dissatisfied
        - Neutral
        - Satisfied
        - Very satisfied
      required: true
    - id: 10
      name: outcomes_achieved
      label: To what extent have the desired outcomes of the partnership been achieved
      hint: null
      type: select_one
      options:
        - Not at all
        - Minimally
        - Partially
        - Mostly
        - Fully
      required: true
    - id: 11
      name: key_success_factors
      label: What do you consider the most important success factors for this partnership (select up to 3)
      hint: null
      type: select_multiple
      options:
        - Strong leadership commitment
        - Clear governance structure
        - Regular communication
        - Mutual trust and respect
        - Adequate funding
        - Shared vision and goals
        - Flexibility and adaptability
      required: true
    - id: 12
      name: challenges_faced
      label: What challenges have you encountered in this partnership (select all that apply)
      hint: null
      type: select_multiple
      options:
        - Misaligned expectations
        - Insufficient funding
        - Communication gaps
        - Bureaucratic delays
        - Cultural differences
        - Staff turnover
        - Intellectual property disputes
      required: false
    - id: 13
      name: overall_satisfaction
      label: Overall, how satisfied are you with this academic partnership
      hint: null
      type: select_one
      options:
        - Very dissatisfied
        - Dissatisfied
        - Neutral
        - Satisfied
        - Very satisfied
      required: true
    - id: 14
      name: likelihood_to_continue
      label: How likely is your organization to continue this partnership
      hint: null
      type: select_one
      options:
        - Very unlikely
        - Unlikely
        - Neutral
        - Likely
        - Very likely
      required: true
    - id: 15
      name: improvement_suggestions
      label: What suggestions do you have for improving this partnership
      hint: Please be as specific as possible
      type: text
      options: []
      required: false
