inputSchema:
  type: object
  properties:
    title: Digital Teaching Story Submission Registration Form
    pages:
    - id: 1
      name: submission_story
      label: Please share your teaching story
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: submission_category
      label: Category
      hint: null
      type: select_one
      options:
      - Academic
      - Non-Academic
      - Other
      required: true
    - id: 3
      name: submission_title
      label: Title
      hint: Please enter a title
      type: text
      options: []
      required: true
    - id: 4
      name: submission_description
      label: Description
