      type: note
      options: []
      required: true
    - id: 5
      name: submission_file
      label: Attachment
      hint: Please upload a file
      type: text
      options: []
      required: true
    - id: 6
      name: submission_audio
      label: Audio
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: submission_video
      label: Video
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: submission_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: submission_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: submission_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: submission_time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: submission_location
      label: Location
      hint: null
      type: text
      options: []
      required: false
