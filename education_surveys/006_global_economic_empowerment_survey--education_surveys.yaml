inputSchema:
  type: object
  properties:
    title: Global Economic Empowerment Survey
    pages:
    - id: 1
      name: household_income
      label: Household Income
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: employment_status
      label: Employment Status
      hint: null
      type: select_one
      options:
      - employed
      - unemployed
      - other
      required: false
    - id: 3
      name: employment_sector
      label: Employment Sector
      hint: null
      type: select_multiple
      options:
      - Government
      - Private Sector
      - Self Employment
      - Other
      required: false
    - id: 4
      name: financial_institutions
      label: Financial Institutions
      hint: null
      type: select_multiple
      options:
      - Bank
      - Credit Union
      - Microfinance Institution
      - Other
      required: false
    - id: 5
      name: financial_inclusion
      label: Financial Inclusion
      hint: null
      type: select_one
      options:
      - Included
      - Not Included
      - Prefer not to say
      required: false
    - id: 6
      name: perceived_control_over_financial
      label: Perceived Control Over Financial
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 7
      name: region
      label: Region
      hint: null
      type: select_one
      options:
      - Region 1
      - Region 2
      - Region 3
      required: false
    - id: 8
      name: education_level
      label: Education Level
      hint: null
      type: select_one
      options:
      - High School
      - College/University
      - Other
      required: false
    - id: 9
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: false
    - id: 10
      name: marital_status
      label: Marital Status
      hint: null
      type: select_multiple
      options:
      - Single
      - Married
      - Other
      required: false
    - id: 11
      name: household_size
      label: Household Size
      hint: null
      type: select_one
      options:
      - Less than 5
      - 5 or more
      required: false
    - id: 12
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: employment_type
      label: Employment Type
      hint: null
      type: select_multiple
      options:
      - Formal
      - Informal
      - Other
      required: false
    - id: 14
      name: financial_support
      label: Financial Support
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 15
      name: income
      label: Income
      hint: null
      type: number
      options: []
      required: false
