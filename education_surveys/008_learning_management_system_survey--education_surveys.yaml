inputSchema:
  type: object
  properties:
    title: Learning Management System Survey
    pages:
    - id: 1
      name: current_platform_relationship
      label: What is your current relationship with our platform?
      hint: Select one that applies to you
      type: select_one
      options:
      - Current User
      - Previous User
      - New User
      required: false
    - id: 2
      name: platform_rating
      label: How do you rate our platform's user interface?
      hint: Rate the user interface
      type: number
      options: []
      required: true
    - id: 3
      name: user_experience
      label: How would you rate the overall user experience of our platform?
      hint: Rate from 1-10
      type: number
      options: []
      required: true
    - id: 4
      name: improvement_suggestions
      label: What would you like to see improved in our platform?
      hint: Provide your suggestions
      type: text
      options: []
      required: true
    - id: 5
      name: recommendation
      label: How likely are you to recommend our platform to a friend or colleague?
      hint: Rate from 1-10
      type: number
      options: []
      required: true
    - id: 6
      name: issues
      label: Are you experiencing any issues with our platform?
      hint: Yes or no
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: improvement_suggestions_2
      label: How can we improve our platform for you?
      hint: Provide your suggestions
      type: text
      options: []
      required: true
    - id: 8
      name: satisfaction_level
      label: On a scale of 1-10, how satisfied are you with our platform's performance?
      hint: Rate from 1-10
      type: number
      options: []
      required: true
    - id: 9
      name: add_features
      label: What features would you like to see added to our platform?
      hint: Provide your suggestions
      type: text
      options: []
      required: true
    - id: 10
      name: free_trial
      label: Are you aware that our platform provides a free trial?
      hint: Yes or no
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: user_status
      label: Are you a current or previous user of our platform?
      hint: Yes or no
      type: select_one
      options:
      - Current User
      - Previous User
      - Never Used
      required: false
    - id: 12
      name: contact_us
      label: Would you like to be contacted by our team?
      hint: Yes or no
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: feedback
      label: Are there any other comments or feedback about our platform?
      hint: Provide your comments
      type: text
      options: []
      required: true
