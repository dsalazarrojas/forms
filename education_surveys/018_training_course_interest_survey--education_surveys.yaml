inputSchema:
  type: object
  properties:
    title: Training Course Interest Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: categories
      label: What category are you interested in?
      hint: null
      type: select_one
      options:
      - Category 1
      - Category 2
      required: false
    - id: 3
      name: topics
      label: What topics are you interested in?
      hint: null
      type: select_multiple
      options:
      - Topic 1
      - Topic 2
      required: false
    - id: 4
      name: frequency
      label: How often would you like to attend a training course?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      required: false
    - id: 5
      name: preference
      label: What is your preference for the duration of the course?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: What is your preferred email address?
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: comments
      label: Do you have any comments about the training?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: schedule
      label: What is your schedule like?
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: start_date
      label: When would you like to start the course?
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: end_date
      label: When would you like to end the course?
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: start_time
      label: What time of day do you prefer to start the course?
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: end_time
      label: What time of day do you prefer to end the course?
      hint: null
      type: time
      options: []
      required: false
    - id: 13
      name: duration
      label: How long do you expect the course to last?
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: max_participants
      label: How many participants are you expecting in the course?
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: comments_2
      label: Do you have any comments about the course?
      hint: null
      type: text
      options: []
      required: false
