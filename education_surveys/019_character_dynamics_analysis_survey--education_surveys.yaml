inputSchema:
  type: object
  properties:
    title: Character Dynamics Analysis Survey
    pages:
      - id: 1
        name: header
        label: -- Character Dynamics Analysis --
        hint: Capture relationship details and dynamics between two characters
        type: note
        options: []
        required: false
      - id: 2
        name: analyst_name
        label: analyst name
        hint: person completing the analysis
        type: text
        options: []
        required: false
      - id: 3
        name: character_a_name
        label: character a name
        hint: first character name
        type: text
        options: []
        required: true
      - id: 4
        name: character_b_name
        label: character b name
        hint: second character name
        type: text
        options: []
        required: true
      - id: 5
        name: relationship_type
        label: relationship type
        hint: select the primary relationship
        type: select_one
        options:
          - Friends
          - Family
          - Colleagues
          - Rivals
          - Romantic
        required: true
      - id: 6
        name: power_balance
        label: power balance
        hint: describe balance of power between characters
        type: select_one
        options:
          - Symmetric
          - Asymmetric
          - Shifting
        required: false
      - id: 7
        name: conflict_level
        label: conflict level
        hint: level of conflict between characters
        type: select_one
        options:
          - Low
          - Moderate
          - High
        required: true
      - id: 8
        name: key_interactions
        label: key interactions
        hint: describe pivotal scenes or moments
        type: text
        options: []
        required: false
      - id: 9
        name: emotional_tone
        label: emotional tone
        hint: primary emotional tone of the relationship
        type: select_one
        options:
          - Positive
          - Neutral
          - Negative
        required: false
      - id: 10
        name: analyst_notes
        label: analyst notes
        hint: additional interpretation or recommendations
        type: text
        options: []
        required: false
