inputSchema:
  type: object
  properties:
    title: Educational Technology Usability Survey
    pages:
    - id: 1
      name: introduction
      label: Educational Technology Usability Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: user_information
      label: user_information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: question_1
      label: How often do you use digital tools?
      hint: null
      type: select_one
      options:
      - Never
      - Less than once a month
      - Several times a month
      - Often
      - Almost Always
      required: false
    - id: 4
      name: question_2
      label: Which digital tools do you most frequently use in your work or studies?
      hint: null
      type: select_multiple
      options:
      - Learning Management System (LMS)
      - Content Management System (CMS)
      - Online discussion forums
      - Educational Resource Sharing Platform (ERSP)
      - Other
      required: false
    - id: 5
      name: question_3
      label: What is your preferred channel for communication with peers or teachers?
      hint: null
      type: select_one
      options:
      - Email
      - Online Chat
      - Phone
      - In-person
      required: false
    - id: 6
      name: note
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
