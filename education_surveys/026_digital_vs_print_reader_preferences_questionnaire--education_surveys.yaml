inputSchema:
  type: object
  properties:
    title: Digital Vs. Print Reader Preferences Questionnaire
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: demographic_info
      label: Demographic Information
      hint: null
      type: select_multiple
      options:
      - Male
      - Female
      - Other
      required: false
    - id: 3
      name: preferred_format
      label: Preferred Format
      hint: Which format do you prefer?
      type: select_one
      options:
      - Digital Only
      - Print Only
      - Both
      required: false
    - id: 4
      name: reading_frequency
      label: How Often Do You Read
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: false
    - id: 5
      name: device_usage
      label: Device Usage
      hint: Which devices do you use to read?
      type: select_multiple
      options:
      - E-Reader
      - Tablet
      - Smartphone
      - Other
      required: false
    - id: 6
      name: reading_location
      label: Where Do You Read?
      hint: Where do you usually read?
      type: select_multiple
      options:
      - Home
      - Office
      - Public Transportation
      - Other
      required: false
    - id: 7
      name: reading_length
      label: How Long Do You Spend Reading?
      hint: null
      type: select_one
      options:
      - Less than 15 minutes
      - 15-30 minutes
      - 30-60 minutes
      - More than 1 hour
      required: false
    - id: 8
      name: preferred_format_for_reading_materials
      label: Preferred Format for Reading Materials
      hint: Which format do you prefer for reading materials?
      type: select_multiple
      options:
      - Digital
      - Print
      required: false
    - id: 9
      name: format_purchasing
      label: Format of Materials Purchased
      hint: null
      type: select_multiple
      options:
      - Digital Only
      - Print Only
      - Both
      required: false
    - id: 10
      name: format_shared
      label: Format of Materials Shared
      hint: null
      type: select_multiple
      options:
      - Digital Only
      - Print Only
      - Both
      required: false
    - id: 11
      name: format_retained
      label: Format of Materials Retained
      hint: null
      type: select_multiple
      options:
      - Digital Only
      - Print Only
      - Both
      required: false
    - id: 12
      name: format_discarded
      label: Format of Materials Discarded
      hint: null
      type: select_multiple
      options:
      - Digital Only
      - Print Only
      - Both
      required: false
    - id: 13
      name: reading_habits
      label: Reading Habits
      hint: How do you usually read?
      type: note
      options: []
      required: false
    - id: 14
      name: additional_comments
      label: Additional Comments
      hint: Any additional information?
      type: note
      options: []
      required: false
