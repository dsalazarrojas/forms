inputSchema:
  type: object
  properties:
    title: Student Post Exam Feedback Check In Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student Id
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: subject
      label: Subject
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date_completed
      label: Date Completed
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: time_completed
      label: Time Completed
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: follow_up_action
      label: Follow Up Action
      hint: null
      type: select_multiple
      options:
      - Follow up with student
      - Follow up with instructor
      - Follow up with department
      - None
      required: false
    - id: 10
      name: follow_up_date
      label: Follow Up Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: follow_up_time
      label: Follow Up Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: follow_up_details
      label: Follow Up Details
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 14
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
