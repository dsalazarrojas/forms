inputSchema:
  type: object
  properties:
    title: Sociology Student Feedback Survey
    pages:
    - id: 1
      name: overall_impression
      label: What is your overall impression of the course?
      hint: Please provide a short description of your experience in the course.
      type: text
      options: []
      required: true
    - id: 2
      name: course_satisfaction
      label: How satisfied are you with the course?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: materials_provision
      label: Were you provided with enough resources and materials?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Partially
      - Not applicable
      required: true
    - id: 4
      name: course_structure
      label: How well was the course structured?
      hint: null
      type: select_multiple
      options:
      - Very good
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: course_rating
      label: How would you rate the course?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 6
      name: instructor_impression
      label: How would you rate the instructor?
      hint: null
      type: select_one
      options:
      - Very effective
      - Fairly effective
      - Not very effective
      - Not at all effective
      required: true
    - id: 7
      name: instructor_effectiveness
      label: How would you rate the instructor's teaching effectiveness?
      hint: null
      type: select_one
      options:
      - Very effective
      - Fairly effective
      - Not very effective
      - Not at all effective
      required: true
    - id: 8
      name: comments
      label: Do you have any comments or suggestions?
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: instructor_rating
      label: Instructor Rating
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Neutral
      - Dissatisfied
      required: true
    - id: 12
      name: course_rating_2
      label: Course Rating 2
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Neutral
      - Dissatisfied
      required: true
    - id: 13
      name: instructor_rating_2
      label: Instructor Rating 2
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Neutral
      - Dissatisfied
      required: true
