inputSchema:
  type: object
  properties:
    title: Sociology Student Feedback Survey
    pages:
    - id: 1
      name: course_title
      label: Course Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: false
