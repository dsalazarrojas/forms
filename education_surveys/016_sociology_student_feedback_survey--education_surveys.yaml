      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: course_satisfaction_why
      label: Why do you feel that way about the course?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: teaching_effectiveness
      label: The course helped me in developing my critical thinking and problem-solving
        skills.
      hint: null
      type: select_one
      options:
      - The course was excellent in meeting my expectations.
      - The course was good, but not excellent in meeting my expectations.
      - The course was neither excellent nor poor in meeting my expectations.
      - The course was poor in meeting my expectations.
      - The course was below my expectations.
      - The course was very poor in meeting my expectations.
      - The course was the worst experience I had.
      required: false
