inputSchema:
  type: object
  properties:
    title: Child Flexible Thinking Survey
    pages:
    - id: 1
      name: section_intro
      label: -- Survey Introduction --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: child_name
      label: Child Name
      hint: Participant for assessment
      type: text
      options: []
      required: true
    - id: 3
      name: survey_date
      label: Date of Survey
      hint: Today date
      type: date
      options: []
      required: true
    - id: 4
      name: section_adaptability
      label: -- Adaptability Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: routine_change_reaction
      label: Reaction to Change in Routine
      hint: How does the child handle unexpected changes?
      type: select_one
      options:
      - Adapts easily and stays calm
      - Somewhat struggles but recovers
      - Struggles significantly or melts down
      required: true
    - id: 6
      name: new_food_willingness
      label: Ability to Try New Foods
      hint: Level of food neophobia
      type: select_one
      options:
      - Willing to try new things
      - Needs significant encouragement
      - Refuses to try new foods
      required: true
    - id: 7
      name: section_problem_solving
      label: -- Problem Solving Flexibility --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: game_loss_response
      label: Response to Losing a Game
      hint: Level of sportsmanship
      type: select_one
      options:
      - Accepts loss calmly
      - Gets frustrated or angry
      - Refuses to continue playing
      required: true
    - id: 9
      name: persistence_behavior
      label: Persistence when Stuck
      hint: When a task becomes difficult
      type: select_one
      options:
      - Tries a new way or strategy
      - Asks for immediate help
      - Gives up quickly
      required: true
    - id: 10
      name: section_social_flex
      label: -- Social Flexibility --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: sharing_willingness
      label: Willingness to Share Toys
      hint: Cooperation with peers
      type: select_one
      options:
      - Always shares willingly
      - Usually shares with prompting
      - Rarely shares
      required: true
    - id: 12
      name: turn_taking
      label: Can child take turns without distress?
      hint: Patience in group settings
      type: select_one
      options:
      - Yes - Shows patience
      - No - Struggles with waiting
      required: true
    - id: 13
      name: additional_observations
      label: Additional observations on child flexibility
      hint: Specific examples are helpful
      type: text
      options: []
      required: false
    - id: 14
      name: result_email
      label: Parent or Teacher Email for Results
      hint: For delivery of survey analysis
      type: email
      options: []
      required: true
