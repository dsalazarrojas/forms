inputSchema:
  type: object
  properties:
    title: Student Quiz Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: Welcome to the Quiz Feedback Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: technical_issues
      label: Technical Issues
      hint: null
      type: select_one
      options:
      - No issues
      - Issues with loading times
      - Issues with question display
      - Other (please specify)
      required: true
    - id: 3
      name: learning_objectives
      label: Learning Objectives
      hint: null
      type: select_multiple
      options:
      - Clear and achievable
      - Clear and somewhat achievable
      - Not clear or too broad
      - Not clear or too narrow
      required: true
    - id: 4
      name: question_difficulty
      label: Question Difficulty
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: time_management
      label: Time Management
      hint: null
      type: select_one
      options:
      - Less than 5 minutes
      - 5-10 minutes
      - 10-15 minutes
      - More than 15 minutes
      required: true
    - id: 6
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: overall_experience
      label: Overall Experience
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: improvement_areas
      label: Areas for Improvement
      hint: null
      type: select_multiple
      options:
      - Clearer instructions
      - More feedback
      - Less questions
      - Other (please specify)
      required: true
    - id: 9
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: date
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
