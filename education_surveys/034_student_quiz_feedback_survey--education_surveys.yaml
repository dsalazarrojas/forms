inputSchema:
  type: object
  properties:
    title: Student Quiz Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: quiz_experience
      label: Quiz Experience
      hint: How would you rate your experience taking the quiz?
      type: number
      options: []
      required: false
    - id: 3
      name: technical_issues
      label: Technical Issues
      hint: Were there any technical issues that affected your ability to complete
        the quiz?
      type: select_one
      options:
      - '{''label'': True}'
      - '{''label'': False}'
      required: true
    - id: 4
      name: learning_objectives
      label: Learning Objectives
      hint: Were the learning objectives clear and achievable?
      type: select_multiple
      options:
      - '{''label'': ''Too broad''}'
      - '{''label'': ''Adequate''}'
      - '{''label'': ''Too narrow''}'
      - '{''label'': ''Not clear''}'
      required: true
    - id: 5
      name: question_difficulty
      label: Question Difficulty
      hint: Were the questions clear and concise?
      type: number
      options: []
      required: false
    - id: 6
      name: time_management
      label: Time Management
      hint: How long did it take you to complete the quiz?
      type: select_one
      options:
      - '{''label'': ''Less than 5 minutes''}'
      - '{''label'': ''5-10 minutes''}'
      - '{''label'': ''10-15 minutes''}'
      - '{''label'': ''More than 15 minutes''}'
      required: true
    - id: 7
      name: feedback
      label: Feedback
      hint: Any additional feedback or comments?
      type: text
      options: []
      required: false
