inputSchema:
  type: object
  properties:
    title: Peer Tutoring Program Impact Assessment
    pages:
    - id: 1
      name: program_name
      label: Program Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: program_description
      label: program_description
      hint: Describe your peer tutoring program in 100-200 characters.
      type: text
      options: []
      required: false
    - id: 3
      name: number_students_participating
      label: number_students_participating
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: number_tutors_available
      label: number_tutors_available
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: student_satisfaction
      label: student_satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: program_satisfaction
      label: program_satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: program_improvement_areas
      label: program_improvement_areas
      hint: Select all that apply
      type: select_multiple
      options:
      - Improved student academic performance
      - Improved student engagement
      - Improved student retention
      - Improved tutor availability
      - Improved program satisfaction
      - Improved student satisfaction
      - Other
      required: false
    - id: 8
      name: program_improvement_goals
      label: program_improvement_goals
      hint: null
      type: select_one
      options:
      - Increased student satisfaction
      - Improved student engagement
      - Improved tutor availability
      - Improved academic achievement
      required: false
    - id: 9
      name: feedback
      label: feedback
      hint: Is there anything you'd like to tell us about your program?
      type: note
      options: []
      required: false
    - id: 10
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: program_email
      label: program_email
      hint: null
      type: email
      options: []
      required: false
