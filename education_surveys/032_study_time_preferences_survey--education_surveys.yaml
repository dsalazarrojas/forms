inputSchema:
  type: object
  properties:
    title: Study Time Preferences Survey
    pages:
    - id: 1
      name: study_frequency
      label: What is your preferred study frequency?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: false
    - id: 2
      name: morning_session_length
      label: How long do you prefer your morning study sessions to be?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: study_session_type
      label: What type of study sessions do you prefer?
      hint: null
      type: select_one
      options:
      - Self-Study
      - Group Study
      - Online Course
      required: false
    - id: 4
      name: study_session_duration
      label: How many hours do you usually study in one sitting?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: study_time_of_day
      label: Do you usually study during the day or night?
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: false
    - id: 6
      name: study_schedule
      label: Do you have a preferred study schedule?
      hint: null
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: morning_study_frequency
      label: How often do you usually study in the morning?
      hint: null
      type: select_one
      options:
      - Every day
      - 2-3 times a week
      - 1-2 times a week
      - Rarely
      required: false
    - id: 8
      name: study_time
      label: What time of day do you usually study?
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: study_session_length
      label: How long do you prefer to study in one session?
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: preferred_study_location
      label: What is your preferred study location?
      hint: null
      type: text
      options: []
      required: false
