inputSchema:
  type: object
  properties:
    title: Concept Of Human And Education Survey
    pages:
      - id: 1
        name: section_survey_intro
        label: -- Survey Introduction --
        hint: Share your views on the role of education in human development
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_affiliation
        label: Respondent affiliation
        hint: Student, Educator, Researcher, Other
        type: select_one
        options: [Student, Educator, Researcher, Practitioner, Other]
        required: true
      - id: 3
        name: importance_of_education
        label: Importance of education
        hint: Rate how essential education is for human development
        type: select_one
        options: [Critical, Important, Somewhat important, Not important]
        required: true
      - id: 4
        name: primary_purpose_of_education
        label: Primary purpose of education
        hint: Select main perceived purpose
        type: select_one
        options: [Knowledge transfer, Skill development, Socialization, Civic preparation]
        required: true
      - id: 5
        name: challenges_in_education
        label: Challenges in education
        hint: Key barriers or challenges you observe
        type: text
        options: []
        required: false
      - id: 6
        name: role_of_technology
        label: Role of technology
        hint: How technology should support education
        type: text
        options: []
        required: false
      - id: 7
        name: suggestions_for_improvement
        label: Suggestions for improvement
        hint: Policy or practice suggestions
        type: text
        options: []
        required: false
