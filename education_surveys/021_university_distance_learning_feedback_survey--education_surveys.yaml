inputSchema:
  type: object
  properties:
    title: University Distance Learning Feedback Survey
    pages:
    - id: 1
      name: online_learning_quality
      label: online learning quality
      hint: null
      type: select_multiple
      options:
      - Quality of online content
      - Accessibility of online resources
      - Effectiveness of online communication
      - Other (please specify)
      required: true
    - id: 2
      name: communication
      label: communication
      hint: null
      type: select_one
      options:
      - Regular emails and updates
      - Live online support
      - No support at all
      - Other (please specify)
      required: true
    - id: 3
      name: support_services
      label: support services
      hint: null
      type: select_multiple
      options:
      - Support for course material understanding
      - Support for technical issues
      - Support for personal issues
      - Other (please specify)
      required: true
    - id: 4
      name: overall_experience
      label: overall experience
      hint: null
      type: select_one
      options:
      - Very positive
      - Neutral
      - Somewhat negative
      - Very negative
      required: true
    - id: 5
      name: suggestions
      label: suggestions
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: additional_comments
      label: additional comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email_address
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: university
      label: university
      hint: null
      type: select_one
      options:
      - University of Distance Learning
      - Other
      required: true
    - id: 9
      name: program
      label: program
      hint: null
      type: select_one
      options:
      - Program 1
      - Program 2
      - Program 3
      required: true
    - id: 10
      name: course
      label: course
      hint: null
      type: select_one
      options:
      - Course 1
      - Course 2
      - Course 3
      required: true
    - id: 11
      name: course_section
      label: course section
      hint: null
      type: select_one
      options:
      - Section 1
      - Section 2
      - Section 3
      required: true
    - id: 12
      name: instructor
      label: instructor
      hint: null
      type: select_one
      options:
      - Instructor 1
      - Instructor 2
      - Instructor 3
      required: true
    - id: 13
      name: other_instructor
