inputSchema:
  type: object
  properties:
    title: ict_in_education_awareness_quiz
    pages:
    - id: 1
      name: introduction
      label: What is your role in the educational setting?
      hint: null
      type: select_one
      options:
      - Teacher
      - Student
      - Parent
      - Staff
      required: true
    - id: 2
      name: question1
      label: How would you rate your level of awareness about the potential benefits
        of technology in education?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: question2
      label: What is the primary benefit of technology in education?
      hint: null
      type: select_one
      options:
      - Improved student engagement
      - Improved student assessment
      - Improved teacher feedback
      - Better student outcomes
      required: true
    - id: 4
      name: question3
      label: What is the primary way technology can increase opportunities for students
        to work in groups?
      hint: null
      type: select_multiple
      options:
      - Better collaboration
      - More opportunities for students to work together
      - Improved teacher feedback
      - Better student outcomes
      required: true
    - id: 5
      name: question4
      label: How often do you use technology in your daily work or study routine?
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: question5
      label: Question5
      hint: null
      type: select_one
      options:
      - Better teaching and learning methods
      - Improved teacher feedback
      - More opportunities for teacher and student feedback
      - Improved assessment
      required: true
    - id: 7
      name: question6
      label: What is your current level of satisfaction with technology in education?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: question7
      label: Do you think technology can help reduce costs in education?
      hint: null
      type: select_one
      options:
      - Reduced costs
      - No effect
      - Positive effect
      - Unknown
      required: true
    - id: 9
      name: question8
      label: Have you ever received feedback from teachers on how to use technology
        effectively?
      hint: null
      type: select_one
      options:
      - Yes, always
      - Yes, sometimes
      - Yes, never
      - 'No'
      required: true
    - id: 10
      name: question10
      label: Do you think technology should be used in more areas of education, such
        as in teaching?
      hint: null
      type: select_one
      options:
      - Yes, always
      - Yes, sometimes
      - Yes, never
      - 'No'
      required: true
    - id: 11
      name: question11
      label: How would you rate your level of agreement with the following statement
        - Technology has improved the way I teach?
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: question12
      label: Do you think technology can help increase opportunities for students
        to work in groups?
      hint: null
      type: select_one
      options:
      - Yes, always
      - Yes, sometimes
      - Yes, never
      - 'No'
      required: true
