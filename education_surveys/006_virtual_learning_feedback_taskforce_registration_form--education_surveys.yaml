inputSchema:
  type: object
  properties:
    title: Virtual Learning Feedback Taskforce Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: role
      label: Role
      hint: null
      type: select_one
      options:
      - Admin
      - User
      - Teacher
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: category
      label: Category
      hint: null
      type: select_multiple
      options:
      - Virtual Learning
      - Virtual Event
      required: false
