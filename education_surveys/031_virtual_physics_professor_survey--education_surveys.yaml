      - Online Discussions
      - Video Lectures
      - In-Person Lectures
      required: false
    - id: 4
      name: course_evaluation
      label: Course Evaluation
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: course_comments
      label: Course Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
