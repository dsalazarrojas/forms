inputSchema:
  type: object
  properties:
    title: Campus Sustainability Feedback Survey
    pages:
      - id: 1
        name: intro
        label: -- Survey Overview --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_role
        label: Respondent Role
        hint: Choose the option that best describes you
        type: select_one
        options:
          - Student
          - Faculty
          - Staff
          - Visitor
        required: true
      - id: 3
        name: campus_affiliation
        label: Campus Affiliation
        hint: College, school, or office name
        type: text
        options: []
        required: false
      - id: 4
        name: sustainability_awareness
        label: Sustainability Awareness Level
        hint: How familiar are you with campus sustainability initiatives
        type: select_one
        options:
          - Not aware
          - Somewhat aware
          - Moderately aware
          - Very aware
        required: true
      - id: 5
        name: participation_past_year
        label: Participation in Sustainability Activities Past Year
        hint: Indicate participation in programs or events
        type: select_one
        options:
          - None
          - 1-2 events
          - 3-5 events
          - More than 5
        required: false
      - id: 6
        name: satisfaction_overall
        label: Overall Satisfaction with Campus Sustainability Efforts
        hint: Rate overall satisfaction from 1 to 5
        type: select_one
        options:
          - 1 - Very dissatisfied
          - 2 - Somewhat dissatisfied
          - 3 - Neutral
          - 4 - Somewhat satisfied
          - 5 - Very satisfied
        required: true
      - id: 7
        name: barriers_to_participation
        label: Barriers to Participating in Sustainability Programs
        hint: Select all that apply
        type: select_multiple
        options:
          - Lack of awareness
          - Scheduling conflicts
          - No incentives
          - Accessibility issues
          - Other
        required: false
      - id: 8
        name: suggestions_improvement
        label: Suggestions for Improvement
        hint: Provide specific ideas or feedback
        type: text
        options: []
        required: false
      - id: 9
        name: waste_management_feedback
        label: Feedback on Waste Management and Recycling
        hint: Comments on current systems and suggestions
        type: text
        options: []
        required: false
      - id: 10
        name: energy_conservation_priorities
        label: Energy Conservation Priorities
        hint: Which areas should campus focus on first
        type: select_multiple
        options:
          - Lighting upgrades
          - Heating and cooling efficiency
          - Renewable energy adoption
          - Behavior change campaigns
        required: false
      - id: 11
        name: contact_opt_in
        label: Contact for Follow Up
        hint: May we contact you about sustainability initiatives
        type: select_one
        options:
          - No
          - Yes
        required: true
      - id: 12
        name: contact_email
        label: Contact Email
        hint: Provide email if you selected yes for follow up
        type: email
        options: []
        required: false
