inputSchema:
  type: object
  properties:
    title: Design Thesis Review Survey
    pages:
    - id: 1
      name: design_thesis_review_survey_page_1
      label: Overall Impression
      hint: Provide your overall thoughts on the thesis
      type: text
      options: []
      required: false
    - id: 2
      name: design_thesis_review_survey_page_2
      label: What were the strengths of the thesis?
      hint: Provide specific strengths of the thesis
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: design_thesis_review_survey_page_3
      label: What were the areas for improvement in the thesis?
      hint: Provide specific areas of improvement
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: design_thesis_review_survey_page_4
      label: Would you recommend this student to be awarded a degree?
      hint: Provide a final assessment and recommendation
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: design_thesis_review_survey_page_5
      label: What are your thoughts on the project's overall structure and organization?
      hint: Provide feedback on structure and organization
      type: text
      options: []
      required: false
    - id: 6
      name: design_thesis_review_survey_page_6
      label: What were your thoughts on the thesis's overall quality and impact?
      hint: Provide an overall assessment of the thesis
      type: text
      options: []
      required: false
