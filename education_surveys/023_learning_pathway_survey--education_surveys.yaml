inputSchema:
  type: object
  properties:
    title: Learning Pathway Survey
    pages:
    - id: 1
      name: form_title
      label: What is your current educational level?
      hint: null
      type: select_one
      options:
      - Elementary
      - High School
      - College
      - University
      - Post-Graduate
      - Other
      required: false
    - id: 2
      name: subject
      label: What subject(s) are you interested in learning more about?
      hint: null
      type: select_multiple
      options:
      - Math
      - Science
      - Language
      - History
      - Literature
      - Art
      - Music
      - Technology
      - Other (please specify)
      required: false
    - id: 3
      name: goals
      label: What are your goals for learning this subject(s)?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: level_of_knowledge
      label: What is your current level of knowledge in this subject(s)?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: motivation
      label: What motivates you to learn more about this subject(s)?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: challenging_part
      label: What do you think is the most challenging part of the learning process?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: free_time
      label: How do you typically spend your free time?
      hint: null
      type: select_multiple
      options:
      - Reading
      - Watching videos
      - Exercising
      - Socializing
      - Playing games
      - Other (please specify)
      required: false
    - id: 8
      name: prior_experience
      label: Do you have any prior experience with [subject]?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 9
      name: learning_style
      label: What is your learning style (e.g., reading, hands-on, lectures)?
      hint: null
      type: select_multiple
      options:
      - Reading
      - Hands-on
      - Lectures
      - Online courses
      - Workshops
      - Other (please specify)
      required: false
    - id: 10
      name: important_aspect
      label: What do you think is the most important aspect of the learning process?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: learning_method
      label: How do you prefer to learn new information (e.g., through books, videos,
        online courses, workshops)?
      hint: null
      type: select_multiple
      options:
      - Books
      - Videos
      - Online courses
      - Workshops
      - Seminars
      - Other (please specify)
      required: false
    - id: 12
      name: hinderances
      label: Is there anything that might hinder your learning (e.g., time constraints,
        motivation, resources)?
      hint: null
      type: select_multiple
      options:
      - Time constraints
      - Motivation
      - Resources
      - Other (please specify)
      required: false
