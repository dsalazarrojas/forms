inputSchema:
  type: object
  properties:
    title: Academic Exchange Program Impact Assessment
    pages:
    - id: 1
      name: respondent_info
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: role
      label: Role during exchange
      hint: Student participant staff organizer or faculty
      type: select_one
      options:
        - Student
        - Faculty
        - Staff
      required: true
    - id: 3
      name: exchange_institution
      label: Exchange institution
      hint: Host institution name
      type: text
      options: []
      required: false
    - id: 4
      name: duration
      label: Duration of exchange
      hint: Number of weeks or months
      type: text
      options: []
      required: true
    - id: 5
      name: academic_benefits
      label: Academic benefits experienced
      hint: Describe learning and research outcomes
      type: text
      options: []
      required: false
    - id: 6
      name: cultural_benefits
      label: Cultural and personal benefits
      hint: Brief reflection on cultural learning
      type: text
      options: []
      required: false
    - id: 7
      name: challenges_faced
      label: Main challenges faced during exchange
      hint: Logistical language or academic issues
      type: text
      options: []
      required: false
    - id: 8
      name: support_recommendations
      label: Recommendations to support future participants
      hint: Practical suggestions for program improvement
      type: text
      options: []
      required: true
    - id: 9
      name: overall_satisfaction
      label: Overall satisfaction with program
      hint: Rate your overall experience
      type: select_one
      options:
        - Very satisfied
        - Satisfied
        - Neutral
        - Dissatisfied
      required: true
    - id: 10
      name: contact_email
      label: Contact email for follow up
      hint: Optional email for additional questions
      type: email
      options: []
      required: false
