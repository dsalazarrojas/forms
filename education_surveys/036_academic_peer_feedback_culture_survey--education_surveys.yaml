inputSchema:
  type: object
  properties:
    title: Academic Peer Feedback Culture Survey
    pages:
    - id: 1
      name: respondent_info
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: role
      label: Role
      hint: Choose your role within the institution
      type: select_one
      options:
        - Student
        - Faculty
        - Staff
        - Administrator
      required: true
    - id: 3
      name: department
      label: Department or unit
      hint: Optional department name
      type: text
      options: []
      required: false
    - id: 4
      name: frequency_of_feedback
      label: Frequency of peer feedback in your unit
      hint: How often does peer feedback occur
      type: select_one
      options:
        - Weekly
        - Monthly
        - Semesterly
        - Rarely
      required: true
    - id: 5
      name: perceived_value
      label: Perceived value of peer feedback
      hint: Rate how valuable peer feedback is
      type: select_one
      options:
        - Very valuable
        - Valuable
        - Neutral
        - Not valuable
      required: true
    - id: 6
      name: barriers
      label: Main barriers to effective peer feedback
      hint: Select barriers that apply
      type: select_multiple
      options:
        - Time constraints
        - Lack of training
        - Fear of conflict
        - Insufficient recognition
      required: false
    - id: 7
      name: suggestions
      label: Suggestions to improve peer feedback
      hint: Practical ideas to enhance culture
      type: text
      options: []
      required: false
    - id: 8
      name: willingness_to_participate
      label: Willingness to participate in pilot programs
      hint: Indicate interest in joining improvement activities
      type: select_one
      options:
        - Yes
        - Maybe
        - No
      required: true
    - id: 9
      name: contact_email
      label: Contact email for follow up
      hint: Leave email if you agree to be contacted
      type: email
      options: []
      required: false
