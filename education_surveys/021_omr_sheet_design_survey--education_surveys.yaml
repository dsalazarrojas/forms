inputSchema:
  type: object
  properties:
    title: OMR Sheet Design Survey
    pages:
    - id: 1
      name: page1
      label: OMR Sheet Options
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: question1
      label: How many questions do you have on your OMR sheet?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: question2
      label: What is the average size of your OMR sheet?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: question3
      label: What is the preferred font size for OMR question text?
      hint: null
      type: select_one
      options:
      - Aa
      - B
      - C
      - D
      required: false
    - id: 5
      name: question4
      label: What is the preferred font type for OMR question text?
      hint: null
      type: select_one
      options:
      - Arial
      - Comic Sans
      - Impact
      - Times New Roman
      required: false
