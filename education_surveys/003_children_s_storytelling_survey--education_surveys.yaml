inputSchema:
  type: object
  properties:
    title: Children's Storytelling Survey
    pages:
      - id: 1
        name: respondent_information
        label: Respondent Information
        hint: Tell us about yourself
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_name
        label: Your Name
        hint: Optional - you may remain anonymous
        type: text
        options: []
        required: false
      - id: 3
        name: respondent_age_group
        label: Age Group
        hint: null
        type: select_one
        options:
          - Under 5 years
          - 5-7 years
          - 8-10 years
          - 11-13 years
          - 14-17 years
          - Parent responding for child
        required: true
      - id: 4
        name: school_or_organization
        label: School or Organization
        hint: If applicable
        type: text
        options: []
        required: false
      - id: 5
        name: reading_habits
        label: Reading Habits
        hint: Let us know about your reading preferences
        type: note
        options: []
        required: false
      - id: 6
        name: reading_frequency
        label: How often do you read or are read to
        hint: null
        type: select_one
        options:
          - Every day
          - Several times a week
          - Once a week
          - A few times a month
          - Rarely
          - Never
        required: true
      - id: 7
        name: favorite_genres
        label: Favorite Story Genres
        hint: Select all that you enjoy
        type: select_multiple
        options:
          - Fairy Tales
          - Adventure Stories
          - Mystery
          - Science Fiction
          - Fantasy
          - Animal Stories
          - Historical Fiction
          - Funny Stories
          - Poetry
          - Non-fiction
        required: true
      - id: 8
        name: favorite_book
        label: What is your favorite book or story
        hint: null
        type: text
        options: []
        required: false
