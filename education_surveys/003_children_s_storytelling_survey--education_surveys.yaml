          - Monthly
          - A few times a year
          - Rarely
          - Never
        required: true
      - id: 19
        name: books_at_home
        label: Approximately how many books are in your home
        hint: null
        type: select_one
        options:
          - Less than 10
          - 10-25 books
          - 26-50 books
          - 51-100 books
          - More than 100 books
        required: false
      - id: 20
        name: recommendations
        label: Would you like book recommendations
        hint: null
        type: select_one
        options:
          - Yes, please
          - No, thank you
        required: false
      - id: 21
        name: email_for_recommendations
        label: Email for Book Recommendations
        hint: Only if you want to receive recommendations
        type: email
        options: []
        required: false
      - id: 22
        name: additional_feedback
        label: Any Other Comments or Suggestions
        hint: We value your feedback
        type: text
        options: []
        required: false
