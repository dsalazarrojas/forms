        name: storytelling_preferences
        label: Storytelling Preferences
        hint: How do you prefer to experience stories
        type: note
        options: []
        required: false
      - id: 10
        name: preferred_format
        label: Preferred Story Format
        hint: Select your favorite
        type: select_one
        options:
          - Being read to by an adult
          - Reading independently
          - Listening to audiobooks
          - Watching story videos
          - Interactive digital stories
          - Live storytelling events
        required: true
      - id: 11
        name: story_length_preference
        label: Preferred Story Length
        hint: null
        type: select_one
        options:
          - Very short (5 minutes or less)
          - Short (5-15 minutes)
          - Medium (15-30 minutes)
          - Long (30-60 minutes)
          - Very long (over 1 hour)
        required: false
      - id: 12
        name: favorite_characters
        label: What types of characters do you enjoy most
        hint: Select all that apply
        type: select_multiple
        options:
