inputSchema:
  type: object
  properties:
    title: Erasmus+ Consortium Interest Survey
    pages:
    - id: 1
      name: form_1
      label: What is your name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: form_2
      label: What is your role in the Erasmus+ Consortium?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: form_3
      label: Which country do you represent?
      hint: null
      type: select_one
      options:
      - Greece
      - Turkey
      - Portugal
      - Spain
      - Italy
      - Austria
      required: true
    - id: 4
      name: form_4
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: form_5
      label: Do you have previous experience with the Erasmus+ programme?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: form_6
      label: How long have you been working with the Erasmus+ Consortium?
      hint: null
      type: select_multiple
      options:
      - Less than 1 year
      - 1-2 years
      - 2-5 years
      - More than 5 years
      required: true
    - id: 7
      name: form_7
      label: What is your current position within the Erasmus+ Consortium?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: form_8
      label: What is your main area of work within the Erasmus+ Consortium?
      hint: null
      type: select_multiple
      options:
      - Project Management
      - Financial Management
      - Technical Assistance
      - Communication
      - Other
      required: true
    - id: 9
      name: form_9
      label: How many years have you been working in your current position within
        the Erasmus+ Consortium?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: form_10
      label: What is your main interest in the Erasmus+ Consortium?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: form_11
      label: What are the top 3 benefits you gained from your involvement with the
        Consortium?
      hint: null
      type: select_multiple
      options:
      - Improved collaboration with partners
      - Increased project visibility
      - Better communication
      required: true
    - id: 12
      name: form_12
      label: Do you have any feedback or suggestions for the Erasmus+ Consortium?
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: form_13
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
