inputSchema:
  type: object
  properties:
    title: Student Stress Survey
    pages:
    - id: 1
      name: main_questions
      label: Main Questions
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: question1
      label: How often do you feel stressed?
      hint: null
      type: select_multiple
      options:
      - Never
      - Sometimes
      - Often
      - Almost Always
      required: true
    - id: 3
      name: question2
      label: What activities cause you most stress?
      hint: null
      type: select_multiple
      options:
      - Watching TV
      - Playing sports
      - Hanging out with friends
      - Homework
      required: true
    - id: 4
      name: question3
      label: Do you exercise regularly?
      hint: null
      type: select_multiple
      options:
      - Every day
      - Several times a week
      - Rarely
      required: true
    - id: 5
      name: question4
      label: How would you describe your current level of stress?
      hint: null
      type: select_multiple
      options:
      - Not at all stressed
      - A little stressed
      - Somewhat stressed
      - Very stressed
      required: true
    - id: 6
      name: main_summary
      label: Summarize your feelings
      hint: null
      type: note
      options: []
      required: true
    - id: 7
      name: stress_score
      label: Stress Score
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: main_comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
