inputSchema:
  type: object
  properties:
    title: Pedagogical Research Awareness Survey
    pages:
    - id: 1
      name: first_page
      label: Welcome
      hint: This survey aims to understand your level of awareness about pedagogical
        research.
      type: text
      options: []
      required: false
    - id: 2
      name: page_2
      label: Awareness Level
      hint: What is your current level of awareness about pedagogical research?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 3
      name: page_3
      label: Research Project
      hint: Please provide a brief description of a recent pedagogical research project
        you've participated in.
      type: note
      options: []
      required: false
    - id: 4
      name: page_4
      label: Theories Understanding
      hint: What is your current level of understanding of pedagogical theories?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 5
      name: page_5
      label: Collaboration Level
      hint: What is your level of collaboration with other researchers in pedagogical
        research?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 6
      name: page_6
      label: Resource Access
      hint: How do you usually access pedagogical research resources?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 7
      name: page_7
      label: Favorite Resource
      hint: What is your favorite pedagogical research resource?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 8
      name: page_8
      label: Resource Evaluation
      hint: How do you usually evaluate the quality of pedagogical research?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 9
      name: page_9
      label: Teaching Practice
      hint: Can you provide an example of how you've applied pedagogical research
        in your teaching practice?
      type: note
      options: []
      required: true
    - id: 10
      name: page_10
      label: Support Level
      hint: What is your current level of support from your institution for pedagogical
        research?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 11
      name: page_11
      label: Challenges
      hint: What do you think are the main challenges in pedagogical research?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 12
      name: page_12
      label: Outcome
      hint: What is the expected outcome of this survey?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 13
      name: page_13
      label: Teaching Initiative
      hint: Can you provide a brief description of a pedagogical research initiative
        you'd like to propose or support?
      type: note
      options: []
      required: false
    - id: 14
      name: page_14
      label: Research Frequency
      hint: How frequently do you conduct pedagogical research?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 15
      name: page_15
      label: Conclusion
      hint: Thank you for participating in this survey!
      type: text
      options: []
      required: false
