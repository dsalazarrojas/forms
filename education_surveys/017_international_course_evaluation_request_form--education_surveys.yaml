inputSchema:
  type: object
  properties:
    title: International Course Evaluation Request Form
    pages:
    - id: 1
      name: session_rating
      label: Session rating
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      required: false
    - id: 2
      name: overall_satisfaction
      label: Overall satisfaction
      hint: null
      type: select_one
      options:
      - Very dissatisfied
      - Somewhat dissatisfied
      - Neutral
      - Somewhat satisfied
      - Very satisfied
      required: false
    - id: 3
      name: session_topics
      label: What topic(s) did you find most valuable?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: course_materials
      label: Were the course materials helpful?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: course_presentation
      label: Was the course presentation clear and engaging?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: instructor
