inputSchema:
  type: object
  properties:
    title: Gardening Program Interest Survey
    pages:
    - id: 1
      name: gardening_program_interest
      label: What type of gardening program are you interested in?
      hint: null
      type: select_one
      options:
      - Gardening
      - Horticulture
      - Landscaping
      - Conservation
      - Environmental science
      - Other
      required: true
    - id: 2
      name: time_of_year_available
      label: What time of year are you available?
      hint: null
      type: select_one
      options:
      - Spring
      - Summer
      - Fall
      - Winter
      - Year-round
      required: true
    - id: 3
      name: time_of_day_available
      label: What time of day are you available?
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: true
    - id: 4
      name: contact_information
      label: What contact information do you want to provide?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: type_of_learning
      label: What type of learning are you interested in?
      hint: null
      type: select_multiple
      options:
      - Classroom instruction
      - Online courses
      - Workshops
      - Video tutorials
      - Other
      required: true
    - id: 6
      name: program_notes
      label: Any additional notes?
      hint: null
      type: note
      options: []
      required: false
