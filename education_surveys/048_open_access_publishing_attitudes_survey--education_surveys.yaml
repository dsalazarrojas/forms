inputSchema:
  type: object
  properties:
    title: Open Access Publishing Attitudes Survey
    pages:
    - id: 1
      name: page_1
      label: What are your research goals
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: researcher_goals_3
      label: What do you perceive as your top research priority
      hint: null
      type: select_one
      options:
      - Open Access Publishing
      - Other
      required: false
    - id: 3
      name: open_access_2
      label: How important is open access publishing in your research
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: research_field_1
      label: What is your primary research field
      hint: null
      type: select_multiple
      options:
      - Agriculture
      - Art and Humanities
      - Biology
      - Business and Management
      - Chemistry
      - Computer Science
      - Earth and Environmental Science
      - Engineering
      - Health and Medicine
      - Law
      - Math and Statistics
      - Physics and Astronomy
      required: false
    - id: 5
      name: email_address_1
      label: Email address
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: time_1
      label: How much time do you spend each month on OA publishing activities?
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: open_access_publishing_3
      label: How do you currently use OA publishing?
      hint: null
      type: select_one
      options:
      - I have never used OA publishing
      - I have used it once
      - I have used it multiple times
      required: false
    - id: 8
      name: open_access_publishing_2
      label: How do you perceive the benefits of OA publishing
      hint: null
      type: select_one
      options:
      - I have never thought about it
      - I think it has some benefits
      - I think it has many benefits
      required: false
    - id: 9
      name: open_access_publishing_4
      label: Have you published OA?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      required: false
    - id: 10
      name: open_access_publishing_5
      label: How satisfied are you with the OA publishing process
      hint: null
      type: select_one
      options:
      - Very Dissatisfied
      - Somewhat Dissatisfied
      - Neutral
      - Somewhat Satisfied
      - Very Satisfied
      required: false
    - id: 11
      name: open_access_publishing_6
      label: What are the main barriers to OA publishing?
      hint: null
      type: select_multiple
      options:
      - Cost
      - Technical
      - Lack of support
      - Other
      required: false
    - id: 12
      name: open_access_publishing_7
      label: What do you think is the main advantage of OA publishing?
      hint: null
      type: select_multiple
      options:
      - Increased citations
      - Greater visibility
      - Faster dissemination
      - Lack of barriers
      - Other
      required: false
    - id: 13
      name: open_access_publishing_8
      label: Have you ever submitted a manuscript through a preprint server?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      required: false
    - id: 14
      name: time_2
      label: How much time do you usually spend on manuscript preparation?
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: open_access_publishing_9
      label: What do you prefer?
      hint: null
      type: select_multiple
      options:
      - Preprint
      - Peer-review
      - Other
      required: false
    - id: 16
      name: open_access_publishing_10
      label: How satisfied are you with OA publishing?
      hint: null
      type: select_one
      options:
      - Very Dissatisfied
      - Somewhat Dissatisfied
      - Neutral
      - Somewhat Satisfied
      - Very Satisfied
      required: false
    - id: 17
      name: note_1
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: page_2
      label: page 2
      hint: null
      type: text
      options: []
      required: false
