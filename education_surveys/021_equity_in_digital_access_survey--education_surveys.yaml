inputSchema:
  type: object
  properties:
    title: equity_in_digital_access_survey
    pages:
    - id: 1
      name: school_location
      label: School Location
      hint: null
      type: select_one
      options:
      - Primary/Elementary School
      - Middle School
      - High School
      - Non-Profit Organization
      - Community Organization
      - Home Schooled
      - Public Library
      - Other
      required: false
    - id: 2
      name: device_access
      label: Device Access
      hint: null
      type: select_multiple
      options:
      - Desktop/Laptop/Computer
      - Tablet
      - Smartphone
      - Other (please specify)
      required: false
    - id: 3
      name: connectivity_speed
      label: Internet Connectivity Speed
      hint: Mbps
      type: number
      options: []
      required: false
    - id: 4
      name: time_spent_online
      label: Time Spent Online
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: barriers_to_connectivity
      label: Barriers to Connectivity
      hint: null
      type: select_one
      options:
      - No issues
      - Slow internet speed
      - Cost
      - Limited internet access
      - Other
      required: false
    - id: 6
      name: device_quality
      label: Device Quality
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: false
    - id: 7
      name: school_funding
      label: School Funding
      hint: null
      type: select_multiple
      options:
