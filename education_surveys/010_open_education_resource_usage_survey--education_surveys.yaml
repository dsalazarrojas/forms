inputSchema:
  type: object
  properties:
    title: Open Education Resource Usage Survey
    pages:
    - id: 1
      name: oer_awareness
      label: What is OER?
      hint: null
      type: select_one
      options:
      - Open educational resources are resources that are freely available
      - Open educational resources are resources that are free to use
      - Open educational resources are resources that are open to all
      - Open educational resources are resources that are open to everyone
      - Open educational resources are resources that are open to the public
      - Other
      required: false
    - id: 2
      name: oer_usage
      label: How do you use OER?
      hint: null
      type: select_multiple
      options:
      - Frequently
      - Occasionally
      - Rarely
      - Never
      required: false
    - id: 3
      name: oer_satisfaction
      label: How satisfied are you with OER?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: oer_benefits
      label: What benefits do you get from using OER?
      hint: null
      type: select_multiple
      options:
      - Improved student engagement
      - Enhanced learning experiences
      - Increased access to resources
      - Reduced costs
      - Other
      required: false
    - id: 5
      name: oer_challenges
      label: What challenges do you face when using OER?
      hint: null
      type: select_multiple
      options:
      - Difficulty finding relevant resources
      - Technical issues
      - Lack of awareness or understanding
      - Other
      required: false
    - id: 6
      name: oer_guidelines
      label: What guidelines do you follow when using OER?
      hint: null
      type: select_multiple
      options:
      - CC0 or CC-BY license
      - Other licensing options
      - None of the above
      required: false
    - id: 7
      name: oer_training
      label: Have you received training on OER use?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: oer_support
      label: Do you have a support system for OER use?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: oer_awareness
      label: How often do you hear or see about OER?
      hint: null
      type: select_one
      options:
      - Frequently
      - Occasionally
      - Rarely
      - Never
      required: false
    - id: 10
      name: oer_influencer
      label: Who influences your OER use?
      hint: null
      type: select_multiple
      options:
      - My institution
      - My peers
      - Online communities
      - Other
      required: false
    - id: 11
      name: oer_recommend
      label: Will you recommend OER to others?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: oer_comments
      label: Do you have any other comments about OER use?
      hint: null
      type: note
      options: []
      required: false
    - id: 13
