inputSchema:
  type: object
  properties:
    title: Academic Freedom Perception Survey
    pages:
    - id: 1
      name: respondent_info
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: role
      label: Role in institution
      hint: Select the option that best describes you
      type: select_one
      options:
      - Student
      - Faculty
      - Staff
      - Administrator
      required: true
    - id: 3
      name: perception_of_freedom
      label: Perception of academic freedom
      hint: Rate your overall perception
      type: select_one
      options:
      - Very high
      - High
      - Moderate
      - Low
      - Very low
      required: true
    - id: 4
      name: policies_clarity
      label: Clarity of institutional policies on academic freedom
      hint: How clear are current policies
      type: select_one
      options:
      - Very clear
      - Clear
      - Somewhat clear
      - Unclear
      required: true
    - id: 5
      name: incidents_experienced
      label: Have you experienced restrictions
      hint: Describe any incidents if applicable
      type: text
      options: []
      required: false
    - id: 6
      name: areas_of_concern
      label: Main areas of concern
      hint: Select all that apply
      type: select_multiple
      options:
      - Curriculum restrictions
      - Research restrictions
      - Speaking engagements
      - Hiring and promotion
      required: false
    - id: 7
      name: suggestions
      label: Suggestions to strengthen academic freedom
      hint: Practical policies or actions suggested
      type: text
      options: []
      required: false
    - id: 8
      name: willingness_to_participate
      label: Willingness to join follow up discussions
      hint: Indicate interest in further engagement
      type: select_one
      options:
      - 'True'
      - Maybe
      - 'False'
      required: true
    - id: 9
      name: contact_email
      label: Contact email for follow up
      hint: Leave email if you agree to be contacted
      type: email
      options: []
      required: false
