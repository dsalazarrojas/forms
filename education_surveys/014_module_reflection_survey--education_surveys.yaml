inputSchema:
  type: object
  properties:
    title: Module Reflection Survey
    pages:
    - id: 1
      name: module_reflection_survey
      label: What did you learn from this module?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: module_outcomes
      label: What skills or outcomes did you gain from this module?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: trainer_performance
      label: How would you rate the trainer's performance?
      hint: 1-5
      type: number
      options: []
      required: false
    - id: 4
      name: trainer_support
      label: How would you rate the trainer's support?
      hint: 1-5
      type: number
      options: []
      required: false
    - id: 5
