      label: What could be improved about this module?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: module_satisfaction
      label: How satisfied are you with the module?
      hint: null
      type: select_one
      options:
      - Very dissatisfied
      - Somewhat dissatisfied
      - Slightly dissatisfied
      - Neutral
      - Slightly satisfied
      - Somewhat satisfied
      - Very satisfied
      required: false
