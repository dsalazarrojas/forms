inputSchema:
  type: object
  properties:
    title: AI Education Research Partnership Request Form
    pages:
    - id: 1
      name: project_summary
      label: -- Project Summary --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: principal_investigator
      label: Principal investigator name
      hint: Lead contact for the project
      type: text
      options: []
      required: true
    - id: 3
      name: institution
      label: Institution or organization
      hint: Affiliated university or organization
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Contact email
      hint: For partnership coordination
      type: email
      options: []
      required: true
    - id: 5
      name: project_objectives
      label: Project objectives
      hint: Short description of aims and expected outcomes
      type: text
      options: []
      required: true
    - id: 6
      name: required_resources
      label: Resources requested
      hint: Data, participants, technical support, funding
      type: select_multiple
      options:
      - Data access
      - Participant recruitment
      - Technical support
      - Funding
      required: false
    - id: 7
      name: timeline
      label: Proposed timeline
      hint: Major milestones and estimated completion
      type: text
      options: []
      required: false
    - id: 8
      name: ethics_approval_status
      label: Ethics approval status
      hint: Has IRB or ethics approval been obtained
      type: select_one
      options:
      - 'True'
      - 'False'
      - Pending
      required: true
    - id: 9
      name: additional_comments
      label: Additional comments
      hint: Any other information useful to reviewers
      type: text
      options: []
      required: false
