inputSchema:
  type: object
  properties:
    title: Advanced Degree Program Evaluation Form
    pages:
    - id: 1
      name: program_header
      label: -- Program Evaluation --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Respondent name
      hint: Optional for anonymity
      type: text
      options: []
      required: false
    - id: 3
      name: program_name
      label: Program name
      hint: Degree program title
      type: text
      options: []
      required: true
    - id: 4
      name: curriculum_relevance
      label: Curriculum relevance to career goals
      hint: Rate relevance
      type: select_one
      options:
      - Not relevant
      - Somewhat relevant
      - Relevant
      - Highly relevant
      required: true
    - id: 5
      name: faculty_quality
      label: Faculty quality and engagement
      hint: Rate teaching and support
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Excellent
      required: true
    - id: 6
      name: research_opportunities
      label: Research opportunities availability
      hint: Rate availability and support
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Excellent
      required: false
    - id: 7
      name: career_services_support
      label: Career services support quality
      hint: Rate from poor to excellent
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Excellent
      required: false
    - id: 8
      name: overall_satisfaction
      label: Overall satisfaction
      hint: Rate program overall
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 9
      name: improvement_suggestions
      label: Suggestions for improvement
      hint: Free text feedback
      type: text
      options: []
      required: false
