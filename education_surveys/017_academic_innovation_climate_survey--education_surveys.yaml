inputSchema:
  type: object
  properties:
    title: Academic Innovation Climate Survey
    pages:
    - id: 1
      name: respondent_info
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: role
      label: Role in institution
      hint: Select the option that best describes you
      type: select_one
      options:
      - Student
      - Faculty
      - Staff
      - Administrator
      required: true
    - id: 3
      name: perception_of_innovation
      label: Perception of institutional support for innovation
      hint: Rate how supportive your institution is
      type: select_one
      options:
      - Very supportive
      - Supportive
      - Neutral
      - Unsupportive
      required: true
    - id: 4
      name: resources_availability
      label: Availability of resources for innovation
      hint: Rate how accessible resources are
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: barriers
      label: Main barriers to innovation
      hint: Select all that apply
      type: select_multiple
      options:
      - Funding
      - Time
      - Institutional inertia
      - Lack of training
      required: false
    - id: 6
      name: successful_examples
      label: Examples of successful innovation
      hint: Describe up to two examples
      type: text
      options: []
      required: false
    - id: 7
      name: suggestions
      label: Suggestions to improve innovation climate
      hint: Specific policy or operational recommendations
      type: text
      options: []
      required: false
    - id: 8
      name: willingness_to_participate
      label: Willingness to join innovation initiatives
      hint: Indicate interest in participating
      type: select_one
      options:
      - 'True'
      - Maybe
      - 'False'
      required: true
    - id: 9
      name: contact_email
      label: Contact email for follow up
      hint: Optional email for further discussion
      type: email
      options: []
      required: false
