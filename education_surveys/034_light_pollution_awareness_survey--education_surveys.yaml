inputSchema:
  type: object
  properties:
    title: Light Pollution Awareness Survey
    pages:
    - id: 1
      name: main
      label: Main
      hint: null
      type: select_one
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neither
      - Somewhat Disagree
      - Strongly Disagree
      required: false
    - id: 2
      name: community_feedback
      label: Community Feedback
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      - Very High
      required: false
    - id: 3
      name: energy_use
      label: Energy Use
      hint: null
      type: select_multiple
      options:
      - Less
      - More
      - Much More
      - Much Much More
      required: false
    - id: 4
      name: skyglow
      label: Skyglow
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      - Very High
      required: false
    - id: 5
      name: additional_feedback
      label: Additional Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: submission
      label: Submit
      hint: null
      type: text
      options: []
      required: false
