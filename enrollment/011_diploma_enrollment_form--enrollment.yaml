inputSchema:
  type: object
  properties:
    title: Diploma Enrollment Form
    pages:
    - id: 1
      name: student_name
      label: student_name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: program_selection
      label: program_selection
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time
      label: time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: note
      label: note
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: payment_method
      label: payment_method
      hint: null
      type: select_one
      options:
      - option 1
      - option 2
      - option 3
      required: true
    - id: 9
      name: payment_amount
      label: payment_amount
      hint: Enter payment amount
      type: number
      options: []
      required: false
    - id: 10
      name: payment_status
      label: payment_status
      hint: null
      type: select_one
      options:
      - option 1
      - option 2
      - option 3
      required: true
