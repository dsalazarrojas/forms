      name: institution
      label: Educational Institution
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student
      label: Student
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: program
      label: Academic Program
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: benefit_type
