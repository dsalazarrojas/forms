inputSchema:
  type: object
  properties:
    title: Win Free Days Of Enrollment Contest Entry
    pages:
    - id: 1
      name: school_name
      label: What is your school name?
      hint: School name is required
      type: text
      options: []
      required: true
    - id: 2
      name: school_type
      label: What type of school do you attend?
      hint: Please select your school type
      type: select_one
      options:
      - High School
      - Middle School
      - Other
      required: true
    - id: 3
      name: age_range
      label: What is your age range?
      hint: Age range is required
      type: select_multiple
      options:
      - 10-13
      - 14-17
      - 18-24
      - 25 or older
      required: true
    - id: 4
      name: gender
      label: What is your gender?
      hint: Please select your gender
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: true
    - id: 5
      name: phone
      label: What is your phone number?
      hint: Phone number is required
      type: text
      options: []
      required: true
    - id: 6
      name: email
      label: What is your email address?
      hint: Email address is required
      type: email
      options: []
      required: true
    - id: 7
      name: address
      label: What is your address?
      hint: Address is required
      type: text
      options: []
      required: true
    - id: 8
      name: additional_info
      label: Do you want to provide additional information?
      hint: Yes/No
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: school_name_2
      label: What is the name of your school (again)?
      hint: School name is required
      type: text
      options: []
      required: true
    - id: 10
      name: school_type_2
      label: What type of school do you attend (again)?
      hint: Please select your school type
      type: select_one
      options:
      - High School
      - Middle School
      - Other
      required: true
    - id: 11
      name: age_range_2
      label: What is your age range (again)?
      hint: Age range is required
      type: select_multiple
      options:
      - 10-13
      - 14-17
      - 18-24
      - 25 or older
      required: true
    - id: 12
      name: gender_2
      label: What is your gender (again)?
      hint: Please select your gender
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: true
    - id: 13
      name: phone_2
      label: What is your phone number (again)?
      hint: Phone number is required
      type: text
      options: []
      required: true
    - id: 14
      name: email_2
      label: What is your email address (again)?
      hint: Email address is required
      type: email
      options: []
      required: true
    - id: 15
      name: address_2
      label: What is your address (again)?
      hint: Address is required
      type: text
      options: []
      required: true
