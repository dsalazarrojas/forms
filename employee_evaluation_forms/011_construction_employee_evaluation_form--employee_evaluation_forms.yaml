inputSchema:
  type: object
  properties:
    title: Construction Employee Evaluation Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: Full name of employee being evaluated
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID
      hint: Employee identification number
      type: text
      options: []
      required: false
    - id: 3
      name: job_title
      label: Job Title
      hint: Current position or role
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: Work department or crew
      type: select_one
      options:
      - General Labor
      - Carpentry
      - Electrical
      - Plumbing
      - Equipment Operations
      - Supervision
      - Safety
      - Administration
      required: true
    - id: 5
      name: supervisor_name
      label: Supervisor Name
      hint: Name of evaluating supervisor
      type: text
      options: []
      required: true
    - id: 6
      name: evaluation_date
      label: Evaluation Date
      hint: Date of this evaluation
      type: date
      options: []
      required: true
    - id: 7
      name: hire_date
      label: Hire Date
      hint: Employee start date
      type: date
      options: []
      required: true
    - id: 8
      name: evaluation_period
      label: Evaluation Period
      hint: Time period covered by this review
      type: select_one
      options:
      - Probationary Review
      - 90-Day Review
      - 6-Month Review
      - Annual Review
      - Mid-Year Review
      - Special Review
      required: true
    - id: 9
      name: work_quality
      label: Work Quality
      hint: Rate quality of work produced
      type: select_one
      options:
      - Excellent
      - Above Average
      - Average
      - Below Average
      - Poor
      required: true
    - id: 10
      name: productivity
      label: Productivity
      hint: Rate work output and efficiency
      type: select_one
      options:
      - Excellent
      - Above Average
      - Average
      - Below Average
      - Poor
      required: true
    - id: 11
      name: reliability
      label: Reliability
      hint: Rate dependability and punctuality
      type: select_one
      options:
      - Excellent
      - Above Average
      - Average
      - Below Average
      - Poor
      required: true
    - id: 12
      name: safety_compliance
      label: Safety Compliance
      hint: Rate adherence to safety protocols
      type: select_one
      options:
      - Excellent
      - Above Average
      - Average
      - Below Average
      - Poor
      required: true
    - id: 13
      name: teamwork
      label: Teamwork
      hint: Rate ability to work with others
      type: select_one
      options:
      - Excellent
      - Above Average
      - Average
      - Below Average
      - Poor
      required: true
    - id: 14
      name: communication
      label: Communication Skills
      hint: Rate verbal and written communication
      type: select_one
      options:
      - Excellent
      - Above Average
      - Average
      - Below Average
      - Poor
      required: true
    - id: 15
      name: problem_solving
      label: Problem Solving
      hint: Rate ability to resolve issues
      type: select_one
      options:
      - Excellent
      - Above Average
      - Average
      - Below Average
      - Poor
      required: true
    - id: 16
      name: initiative
      label: Initiative
      hint: Rate self-motivation and proactiveness
      type: select_one
      options:
      - Excellent
      - Above Average
      - Average
      - Below Average
      - Poor
      required: true
    - id: 17
      name: attendance_record
      label: Attendance Record
      hint: Rate attendance and timekeeping
      type: select_one
      options:
      - Excellent
      - Above Average
      - Average
      - Below Average
      - Poor
      required: true
    - id: 18
      name: days_absent
      label: Days Absent This Period
      hint: Number of unexcused absences
      type: number
      options: []
      required: false
    - id: 19
      name: skills_assessment
      label: Technical Skills Assessment
      hint: Evaluate job-specific technical abilities
      type: text
      options: []
      required: true
    - id: 20
      name: strengths
      label: Employee Strengths
      hint: List key strengths and positive attributes
      type: text
      options: []
      required: true
    - id: 21
      name: areas_for_improvement
      label: Areas for Improvement
      hint: Identify areas needing development
      type: text
      options: []
      required: true
    - id: 22
      name: training_needed
      label: Training or Development Needed
      hint: Recommend training or certifications
      type: text
      options: []
      required: false
    - id: 23
      name: goals_next_period
      label: Goals for Next Period
      hint: Set objectives for upcoming period
      type: text
      options: []
      required: true
    - id: 24
      name: overall_rating
      label: Overall Performance Rating
      hint: Final performance assessment
      type: select_one
      options:
      - Outstanding
      - Exceeds Expectations
      - Meets Expectations
      - Needs Improvement
      - Unsatisfactory
      required: true
    - id: 25
      name: employee_comments
      label: Employee Comments
      hint: Space for employee response
      type: text
      options: []
      required: false
    - id: 26
      name: supervisor_signature
      label: Supervisor Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 27
      name: employee_signature
      label: Employee Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
