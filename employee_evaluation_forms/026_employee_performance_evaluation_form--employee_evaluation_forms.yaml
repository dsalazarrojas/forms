inputSchema:
  type: object
  properties:
    title: Employee Performance Evaluation Form
    pages:
    - id: 1
      name: employee_performance_form
      label: Employee Performance Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Marketing
      - Sales
      - Support
      required: false
    - id: 4
      name: job_title
      label: Job Title
      hint: null
      type: select_multiple
      options:
      - Team Lead
      - Senior Team Lead
      - Manager
      required: false
    - id: 5
      name: performance_metrics
      label: Performance Metrics
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: evaluation_frequency
      label: Evaluation Frequency
      hint: null
      type: select_one
      options:
      - Annual
      - Semi-Annual
      - Quarterly
      required: false
    - id: 8
      name: evaluation_comments
      label: Evaluation Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: feedback_given
      label: Feedback Given
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Fair
      - Needs Improvement
      required: false
    - id: 11
      name: recommended_action_items
      label: Recommended Action Items
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: overall_performance
      label: Overall Performance
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Fair
      - Needs Improvement
      required: false
