inputSchema:
  type: object
  properties:
    title: Parent Feedback Form
    pages:
    - id: 1
      name: feedback_form
      label: Feedback Form
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: student_grade_level
      label: Student Grade Level
      hint: null
      type: number
      options: []
      required: true
