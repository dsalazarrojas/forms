      name: student_class
      label: Student Class
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: feedback_type
      label: Feedback Type
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Neutral
      required: true
    - id: 7
      name: feedback_details
      label: Feedback Details
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: feedback_urgency
      label: Feedback Urgency
      hint: null
      type: select_multiple
      options:
      - Immediate
      - Short Term
      - Long Term
      required: false
    - id: 9
      name: parent_signature
      label: Parent Signature
      hint: null
      type: text
      options: []
      required: true
