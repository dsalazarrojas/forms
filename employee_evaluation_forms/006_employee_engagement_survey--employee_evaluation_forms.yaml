inputSchema:
  type: object
  properties:
    title: Employee Engagement Survey
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: department
      label: department
      hint: null
      type: select_multiple
      options:
      - Human Resources
      - Accounting
      - Engineering
      required: false
    - id: 3
      name: job_title
      label: job title
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: satisfaction
      label: Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: communication
      label: Communication
      hint: null
      type: select_one
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neither
      - Somewhat Disagree
      - Strongly Disagree
      required: false
    - id: 6
      name: feedback
      label: any additional feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: manager_name
      label: Manager name
      hint: null
      type: text
      options: []
      required: false
