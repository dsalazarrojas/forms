inputSchema:
  type: object
  properties:
    title: Peer Tutoring Program Impact Assessment
    pages:
    - id: 1
      name: program_purpose
      label: What is the purpose of the peer tutoring program?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: meeting_frequency
      label: How often do you meet with students for peer tutoring?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: session_duration
      label: What is the average number of students per session?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: primary_goal
      label: Select the primary goal of the peer tutoring program
      hint: null
      type: select_one
      options:
      - Improve academic performance
      - Enhance social skills
      - Increase student engagement
      required: false
    - id: 5
      name: secondary_goals
      label: Select the secondary goals of the peer tutoring program
      hint: null
      type: select_multiple
      options:
      - Improve academic performance
      - Enhance social skills
      - Increase student engagement
      required: false
    - id: 6
      name: session_time
      label: What is the average time per session?
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: communication_methods
      label: What is the primary method of communication with students?
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - In-person
      required: false
    - id: 8
      name: data_collection
      label: What is the method of data collection for the peer tutoring program?
      hint: null
      type: select_multiple
      options:
      - Surveys
      - Observations
      - Interviews
      required: false
    - id: 9
      name: meeting_frequency_staff
      label: How often do staff members meet with students?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 10
      name: student_group_size
      label: What is the average number of students in each group?
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: staff_meeting_frequency
      label: How often do staff members meet with each other?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 12
      name: staff_meeting_time
      label: What is the average time of day for staff meetings?
      hint: null
      type: time
      options: []
      required: true
    - id: 13
      name: student_meeting_frequency
      label: How often do students meet with each other?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 14
      name: communication_staff
      label: What is the primary method of communication with staff members?
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - In-person
      required: false
    - id: 15
      name: session_time_2
      label: What is the average time of day for sessions?
      hint: null
      type: time
      options: []
      required: true
    - id: 16
      name: data_collection_staff
      label: What is the method of data collection for staff members?
      hint: null
      type: select_multiple
      options:
      - Surveys
      - Observations
      - Interviews
      required: false
    - id: 17
      name: staff_meeting_frequency_2
      label: Staff Meeting Frequency 2
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 18
      name: student_meeting_frequency_staff
      label: How often do students meet with staff members?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 19
      name: group_size
      label: Group Size
      hint: null
      type: number
      options: []
      required: true
    - id: 20
      name: meeting_time
      label: What is the average time of day for staff-student meetings?
      hint: null
      type: time
      options: []
      required: true
