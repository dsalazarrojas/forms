inputSchema:
  type: object
  properties:
    title: Tutoring Contract
    pages:
    - id: 1
      name: client_info
      label: Client Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: tutoring_schedule
      label: Tutoring Schedule
      hint: Enter a regular schedule
      type: time
      options: []
      required: false
    - id: 3
      name: contract_terms
      label: Contract Terms
      hint: null
      type: select_one
      options:
      - Term 1
      - Term 2
      - Term 3
      required: false
    - id: 4
      name: tutoring_frequency
      label: Tutoring Frequency
      hint: null
      type: select_multiple
      options:
      - Term 1
      - Term 2
      - Term 3
      required: false
    - id: 5
      name: rate
      label: Rate
      hint: $
      type: number
      options: []
      required: false
    - id: 6
      name: currency
      label: Currency
      hint: Choose a currency
      type: select_one
      options:
      - USD
      - EUR
      - Other
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: contract_start_date
      label: Contract Start Date
      hint: Choose the start date of the contract
      type: date
      options: []
      required: false
