inputSchema:
  type: object
  properties:
    title: Weekly Tutor Report
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: Enter the student's name
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID
      hint: Enter the student's ID number
      type: number
      options: []
      required: true
    - id: 3
      name: lesson_date
      label: Lesson Date
      hint: Enter the date of the lesson
      type: date
      options: []
      required: true
    - id: 4
      name: lesson_time
      label: Lesson Time
      hint: Enter the time of the lesson
      type: time
      options: []
      required: true
    - id: 5
      name: lesson_topic
      label: Lesson Topic
      hint: Enter the topic of the lesson
      type: text
      options: []
      required: true
    - id: 6
      name: lesson_outcome
      label: Lesson Outcome
      hint: How did the student react to the lesson?
      type: text
      options: []
      required: true
    - id: 7
      name: next_steps
      label: Next Steps
      hint: Enter any next steps planned for the student
      type: text
      options: []
      required: false
    - id: 8
      name: submission_date
      label: Submission Date
      hint: Enter the date you submitted the report
      type: date
      options: []
      required: true
    - id: 9
      name: submission_time
      label: Submission Time
      hint: Enter the time you submitted the report
      type: time
      options: []
      required: true
    - id: 10
      name: submitted_by
      label: Submitted By
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 11
      name: submitted_by_email
      label: Submitted By Email
      hint: Enter your email address
      type: email
      options: []
      required: false
    - id: 12
      name: comments
      label: Comments
      hint: Enter any additional comments
      type: text
      options: []
      required: false
