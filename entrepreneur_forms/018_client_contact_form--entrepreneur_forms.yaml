inputSchema:
  type: object
  properties:
    title: Client Contact Form
    pages:
    - id: 1
      name: contact_first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: contact_last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: contact_address
      label: Street Address
      hint: Complete mailing address
      type: text
      options: []
      required: false
    - id: 6
      name: contact_city
      label: City
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_state
      label: State
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_zip
      label: ZIP Code
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: company_name
      label: Company Name
      hint: Your business name
      type: text
      options: []
      required: false
    - id: 10
      name: company_website
      label: Company Website
      hint: Business website URL
      type: text
      options: []
      required: false
    - id: 11
      name: job_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: false
    - id: 12
      name: industry
      label: Industry
      hint: Your business sector
      type: select_one
      options:
      - Technology
      - Healthcare
      - Finance
      - Retail
      - Manufacturing
      - Education
      - Hospitality
      - Real Estate
      - Professional Services
      - Other
      required: false
    - id: 13
      name: contact_type
      label: Type of Contact
      hint: Your relationship with us
      type: select_one
      options:
      - Prospective Client
      - Current Client
      - Former Client
      - Partner
      - Vendor
      - Media
      - Other
      required: true
    - id: 14
      name: inquiry_type
      label: Inquiry Type
      hint: Purpose of contact
      type: select_one
      options:
      - General Inquiry
      - Sales Question
      - Support Request
      - Partnership Opportunity
      - Feedback
      - Complaint
      - Other
      required: true
    - id: 15
      name: subject
      label: Subject
      hint: Brief topic summary
      type: text
      options: []
      required: true
    - id: 16
      name: message
      label: Message
      hint: Your detailed message
      type: text
      options: []
      required: true
    - id: 17
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we respond?
      type: select_one
      options:
      - Email
      - Phone Call
      - Text Message
      - Mail
      required: true
    - id: 18
      name: best_time_to_contact
      label: Best Time to Contact
      hint: When are you available?
      type: select_one
      options:
      - Morning (8am-12pm)
      - Afternoon (12pm-5pm)
      - Evening (5pm-9pm)
      - Any Time
      required: false
    - id: 19
      name: urgency_level
      label: Urgency Level
      hint: How urgent is this?
      type: select_one
      options:
      - Low - No Rush
      - Medium - Within Week
      - High - Within 48 Hours
      - Urgent - Immediate
      required: true
    - id: 20
      name: newsletter_signup
      label: Would You Like to Receive Our Newsletter?
      hint: Monthly updates
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 21
      name: referral_source
      label: How Did You Hear About Us?
      hint: Referral source
      type: select_one
      options:
      - Search Engine
      - Social Media
      - Website
      - Referral
      - Advertisement
      - Event
      - Other
      required: false
    - id: 22
      name: additional_information
      label: Additional Information
      hint: Anything else to share
      type: text
      options: []
      required: false
    - id: 23
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
