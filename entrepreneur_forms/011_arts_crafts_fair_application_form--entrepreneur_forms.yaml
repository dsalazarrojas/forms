inputSchema:
  type: object
  properties:
    title: Arts and Crafts Fair Application Form
    pages:
    - id: 1
      name: vendor_info_header
      label: -- Vendor Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: business_name
      label: Business Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: craft_category
      label: Craft Category
      hint: Select the category that best represents your work
      type: select_one
      options:
      - Jewelry
      - Pottery/Ceramics
      - Textiles/Fiber Arts
      - Woodworking
      - Painting/Illustration
      - Glassware
      - Other
      required: true
    - id: 5
      name: product_description
      label: Description of Products
      hint: Describe what you will be selling
      type: text
      options: []
      required: true
    - id: 6
      name: social_media_links
      label: Social Media or Website
      hint: Instagram, Facebook, or Etsy shop link
      type: text
      options: []
      required: false
    - id: 7
      name: booth_preference
      label: Booth Type Preference
      hint: null
      type: select_one
      options:
      - Standard 10x10
      - Corner 10x10
      - Double 10x20
      required: true
    - id: 8
      name: electricity_required
      label: Do you require electricity for your booth
      hint: Additional fees may apply
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: photo_upload_notice
      label: Please ensure you have photos of your work and booth setup ready
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: agreement_terms
      label: I agree to the fair rules and regulations
      hint: null
      type: select_one
      options:
      - I Agree
      - I Disagree
      required: true
