      - Part-time
      - Freelance
      required: true
    - id: 20
      name: work_hours
      label: work_hours
      hint: null
      type: select_one
      options:
      - 40 hours
      - 30-40 hours
      - 20-30 hours
      - 20 hours
      - 15-20 hours
      - Less than 15 hours
      required: true
    - id: 21
      name: job_level
      label: job_level
      hint: null
      type: select_one
      options:
      - Intern
      - Trainee
      - Apprentice
      required: true
    - id: 22
      name: benefits
      label: benefits
      hint: null
      type: select_one
      options:
