      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: work_location
      label: work_location
      hint: null
      type: select_one
      options:
      - Remote
      - Local
      - Hybrid
      required: true
    - id: 13
      name: language
      label: language
      hint: null
