inputSchema:
  type: object
  properties:
    title: stripe_product_order_form
    pages:
    - id: 1
      name: order_product
      label: Order A Product
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: product_quantity
      label: Product Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: product_price
      label: Product Price
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: total_cost
      label: Total Cost
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: customer_notes
      label: Customer Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: order_status
      label: Order Status
      hint: null
      type: select_one
      options:
      - Pending
      - Shipped
      - Cancelled
      required: false
    - id: 10
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
