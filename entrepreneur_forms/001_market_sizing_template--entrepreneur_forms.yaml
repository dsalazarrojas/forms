inputSchema:
  type: object
  properties:
    title: Market Sizing Template
    pages:
    - id: 1
      name: company_info
      label: Company Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: market_size
      label: What is the current market size?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: revenue_potential
      label: What is the revenue potential for this market?
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 4
      name: market_entry_date
      label: When will you enter the market?
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: market_exit_date
      label: When will you exit the market?
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: market_exit_strategy
      label: What is your exit strategy?
      hint: null
      type: select_one
      options:
      - Exit 1
      - Exit 2
      - Exit 3
      required: true
    - id: 7
      name: entry_barriers
      label: What are the entry barriers for this market?
      hint: null
      type: select_multiple
      options:
      - Barrier 1
      - Barrier 2
      - Barrier 3
      required: true
    - id: 8
      name: growth_rate
      label: What is the growth rate for this market?
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: total_potential
      label: What is the total potential for this market?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: market_segment
      label: What market segment does this belong to?
      hint: null
      type: select_one
      options:
      - Segment 1
      - Segment 2
      required: true
    - id: 11
      name: geographic_location
      label: Where is this market located?
      hint: null
      type: select_multiple
      options:
      - Location 1
      - Location 2
      required: true
    - id: 12
      name: customer_segment
      label: Which customer segment does this belong to?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: total_revenue
      label: What is the total revenue for this market?
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: market_presence
      label: Is the market present in this location?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: geographic_location_2
      label: Is this location within the market location?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
