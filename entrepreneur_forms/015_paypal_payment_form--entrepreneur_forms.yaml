inputSchema:
  type: object
  properties:
    title: paypal_payment_form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Enter your name
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 4
      name: date
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
