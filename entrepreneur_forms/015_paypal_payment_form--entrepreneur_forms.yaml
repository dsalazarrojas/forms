      options: []
      required: false
    - id: 10
      name: confirm_payment_details
      label: Confirm Payment Details
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: confirm_payment_date
      label: Confirm Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: confirm_payment_time
      label: Confirm Payment Time
      hint: null
      type: time
      options: []
      required: false
