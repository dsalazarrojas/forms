inputSchema:
  type: object
  properties:
    title: Square Product Order Form
    pages:
    - id: 1
      name: product_line
      label: Product Line
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: product_description
      label: Product Description
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: order_amount
      label: Order Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - PayPal
      required: false
