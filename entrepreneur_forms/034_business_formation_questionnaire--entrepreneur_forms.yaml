inputSchema:
  type: object
  properties:
    title: Business Formation Questionnaire
    pages:
    - id: 1
      name: founder_info_section
      label: -- Founder Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: founder_name
      label: Founder Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: founder_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: founder_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: experience_level
      label: Business Experience Level
      hint: How much business experience do you have?
      type: select_one
      options:
      - No experience
      - Some experience
      - Moderate experience
      - Extensive experience
      required: true
    - id: 6
      name: co_founders
      label: Co-founders Involved
      hint: Are there other founders?
      type: select_one
      options:
      - No, I am starting alone
      - Yes, 1 co-founder
      - Yes, 2 co-founders
      - Yes, 3 or more co-founders
      required: true
    - id: 7
      name: business_idea_section
      label: -- Business Idea --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: business_concept
      label: Business Concept
      hint: Describe your business idea
      type: text
      options: []
      required: true
    - id: 9
      name: target_market
      label: Target Market
      hint: Who are your customers?
      type: text
      options: []
      required: true
    - id: 10
      name: market_size
      label: Estimated Market Size
      hint: How large is your market?
      type: text
      options: []
      required: false
    - id: 11
      name: competitive_advantage
      label: Competitive Advantage
      hint: What makes you different?
      type: text
      options: []
      required: true
    - id: 12
      name: structure_section
      label: -- Business Structure --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: preferred_structure
      label: Preferred Business Structure
      hint: How will you organize the business?
      type: select_one
      options:
      - Sole Proprietorship
      - Partnership
      - LLC
      - C-Corporation
      - S-Corporation
      - Non-Profit
      - Unsure
      required: true
    - id: 14
      name: structure_reasoning
      label: Why this structure?
      hint: Explain your choice
      type: text
      options: []
      required: false
    - id: 15
      name: location_section
      label: -- Location and Operations --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: business_location
      label: Where will the business operate?
      hint: City or area
      type: text
      options: []
      required: true
    - id: 17
      name: operation_type
      label: Type of Operation
      hint: How will you operate?
      type: select_one
      options:
      - Home-based
      - Physical storefront
      - Online only
      - Mixed (online and physical)
      - Mobile/Service-based
      required: true
    - id: 18
      name: startup_capital_section
      label: -- Startup Capital --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: startup_capital_amount
      label: Estimated Startup Capital Needed
      hint: How much investment is required?
      type: number
      options: []
      required: true
    - id: 20
      name: funding_plan
      label: Funding Plan
      hint: How will you fund the startup?
      type: text
      options: []
      required: true
    - id: 21
      name: financial_projections
      label: Do you have financial projections?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - In progress
      required: false
    - id: 22
      name: timeline_section
      label: -- Timeline and Goals --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: launch_timeline
      label: Planned Launch Timeline
      hint: When do you want to launch?
      type: select_one
      options:
      - Within 3 months
      - 3-6 months
      - 6-12 months
      - Over 1 year
      required: true
    - id: 24
      name: first_year_goals
      label: First Year Goals
      hint: What do you want to achieve?
      type: text
      options: []
      required: false
    - id: 25
      name: support_needed
      label: Support or Resources Needed
      hint: What help do you need?
      type: text
      options: []
      required: false
