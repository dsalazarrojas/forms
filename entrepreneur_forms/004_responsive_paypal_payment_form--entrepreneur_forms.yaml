inputSchema:
  type: object
  properties:
    title: Responsive Paypal Payment Form
    pages:
    - id: 1
      name: payment_method
      label: Select Payment Method
      hint: null
      type: select_one
      options:
      - paypal
      - credit_card
      - bank_transfer
      required: false
    - id: 2
      name: product_select
      label: Select Product
      hint: null
      type: select_multiple
      options:
      - product1
      - product2
      - product3
      required: false
    - id: 3
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone_number
