inputSchema:
  type: object
  properties:
    title: Company Accreditation Form Template
    pages:
      - id: 1
        name: company_name
        label: Company name
        hint: Legal registered name
        type: text
        options: []
        required: true
      - id: 2
        name: registration_number
        label: Registration number
        hint: Government or business registration ID
        type: text
        options: []
        required: true
      - id: 3
        name: contact_person
        label: Contact person name
        hint: Primary contact for accreditation
        type: text
        options: []
        required: true
      - id: 4
        name: contact_email
        label: Contact email
        hint: For correspondence
        type: email
        options: []
        required: true
      - id: 5
        name: accreditation_level
        label: Accreditation level requested
        hint: Choose the level you are applying for
        type: select_one
        options: [Level 1, Level 2, Level 3]
        required: true
      - id: 6
        name: supporting_documents
        label: Supporting documents list
        hint: Indicate documents attached for review
        type: text
        options: []
        required: false
      - id: 7
        name: declaration
        label: Declaration of accuracy
        hint: Type your name to declare the information is correct
        type: text
        options: []
        required: true
