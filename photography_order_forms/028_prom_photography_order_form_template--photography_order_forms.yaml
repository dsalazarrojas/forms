inputSchema:
  type: object
  properties:
    title: Prom Photography Order Form Template
    pages:
    - id: 1
      name: photography_details
      label: Photography Details
      hint: Select the type of photography service you would like to book
      type: select_one
      options:
      - Portrait
      - Event
      - Wedding
      - Other
      required: true
    - id: 2
      name: client_info
      label: Client Information
      hint: Please enter your name
      type: text
      options: []
      required: true
    - id: 3
      name: contact_info
      label: Contact Information
      hint: Please enter your email address
      type: email
      options: []
      required: true
    - id: 4
      name: photography_session
      label: Photography Session
      hint: Select a date and time for the photography session
      type: text
      options: []
      required: false
    - id: 5
      name: location
      label: Location
      hint: Please enter the location for the photography session
      type: text
      options: []
      required: true
    - id: 6
      name: session_duration
      label: Session Duration
      hint: Please select the number of hours for the photography session
      type: number
      options: []
      required: true
    - id: 7
      name: additional_services
      label: Additional Services
      hint: Select any additional services you would like to book
      type: select_multiple
      options:
      - Hair and Makeup
      - Wardrobe styling
      - Other (specify)
      required: false
    - id: 8
      name: special_requests
      label: Special Requests
      hint: Please enter any special requests for the photography session
      type: text
      options: []
      required: false
    - id: 9
      name: num_guests
      label: Number of Guests
      hint: Please select the number of guests for the photography session
      type: number
      options: []
      required: true
    - id: 10
      name: additional_details
      label: Additional Details
      hint: Please enter any additional details for the photography session
      type: text
      options: []
      required: false
    - id: 11
      name: confirm_photos
      label: Confirmation
      hint: Would you like to receive a copy of your photos after the session?
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: true
