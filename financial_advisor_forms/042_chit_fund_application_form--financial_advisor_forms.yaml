      name: chit_amount
      label: Desired Chit Fund Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 21
      name: chit_tenure
      label: Chit Fund Tenure
      hint: In months
      type: select_one
      options:
      - 6 months
      - 12 months
      - 18 months
      - 24 months
      - 36 months
      required: true
    - id: 22
      name: monthly_contribution
      label: Monthly Contribution Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 23
      name: financial_information
      label: -- Financial Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: existing_loans
      label: Do you have existing loans
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 25
      name: purpose_of_fund
      label: Purpose of Chit Fund
      hint: null
      type: select_one
      options:
      - Business investment
      - Home improvement
      - Education
      - Medical expenses
      - Personal use
      - Other
      required: true
