inputSchema:
  type: object
  properties:
    title: Investment Statement Communication Consent
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: Client Name
      type: text
      options: []
      required: true
    - id: 2
      name: contact_number
      label: Contact Number
      hint: Client number
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Client email
      type: email
      options: []
      required: true
    - id: 4
      name: address
      label: Address
      hint: Client address
      type: text
      options: []
      required: false
    - id: 5
      name: consent_given
      label: Consent Given
      hint: Client consent given
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: notes
      label: Notes
      hint: Additional comments
      type: note
      options: []
      required: false
    - id: 7
      name: communication_preferences
      label: Communication Preferences
      hint: How would you like to be contacted?
      type: select_multiple
      options:
      - Phone
      - Email
      - Mail
      - In-person
      required: true
