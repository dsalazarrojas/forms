inputSchema:
  type: object
  properties:
    title: Financial Application Form
    pages:
    - id: 1
      name: employment_status
      label: What is your employment status?
      hint: null
      type: select_one
      options:
      - Employed
      - Unemployed
      - Self-employed
      - Other
      required: true
    - id: 2
      name: education_level
      label: What is your education level?
      hint: null
      type: select_one
      options:
      - High school
      - College
      - Graduate
      - Some college
      - Other
      required: true
    - id: 3
      name: income_level
      label: What is your financial income level?
      hint: null
      type: select_one
      options:
      - Low
      - High
      - Moderate
      - Very high
      - Very low
      - Other
      required: true
    - id: 4
      name: income_frequency
      label: How frequently do you earn your income?
      hint: null
      type: select_one
      options:
      - Yearly
      - Monthly
      - Weekly
      - Daily
      required: true
    - id: 5
      name: property_type
      label: What type of property do you own?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: property_age
      label: How old is the property?
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: property_value
      label: What is the value of the property?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: property_city
      label: Where is the property located?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: property_state
      label: State?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: property_country
      label: Country?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: property_zip
      label: Zip?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: property_notes
      label: Additional notes about the property?
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: additional_property_notes
      label: Do you have any additional information about the property?
      hint: null
      type: note
      options: []
      required: false
