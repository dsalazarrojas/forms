inputSchema:
  type: object
  properties:
    title: Withdrawal Authorization Form
    pages:
    - id: 1
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: relationship
      label: Relationship To Student
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: true
    - id: 5
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: student_id
      label: Student ID
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: grade_level
      label: Grade Level
      hint: null
      type: select_one
      options:
      - '9'
      - '10'
      - '11'
      - '12'
      - 9-12
      required: true
    - id: 8
      name: school_year
      label: School Year
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      - '6'
      - '7'
      - '8'
      required: false
    - id: 9
      name: reason_for_withdrawal
      label: Reason For Withdrawal
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
