inputSchema:
  type: object
  properties:
    title: Personal Wealth Advisory Recommendations
    pages:
    - id: 1
      name: client_goals
      label: What are your main financial goals for the next 12 months?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: risk_tolerance
      label: How would you rate your overall risk tolerance level (1-6)?
      hint: null
      type: select_one
      options:
      - Risk level 1
      - Risk level 2
      - Risk level 3
      - Risk level 4
      - Risk level 5
      - Risk level 6
      required: false
    - id: 3
      name: investment_horizon
      label: What is your investment horizon (e.g., Daily, Weekly, Monthly, Quarterly,
        Semi-Annually, Annually)?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Semi-Annually
      - Annually
      required: false
    - id: 4
      name: investment_preferences
      label: Which type of investments do you prefer (e.g., Stocks, Bonds, Real Estate,
        Alternative Investments)?
      hint: null
      type: select_multiple
      options:
      - Stocks
      - Bonds
      - Real Estate
      - Alternative Investments
      required: false
    - id: 5
      name: additional_comments
      label: Do you have any additional comments or concerns about your financial
        goals or investments?
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: risk_tolerance_2
      label: What is your risk tolerance level for each type of investment (e.g.,
        Stocks, Bonds, Real Estate, Alternative Investments)?
      hint: null
      type: select_multiple
      options:
      - Stocks
      - Bonds
      - Real Estate
      - Alternative Investments
      required: false
    - id: 7
      name: investment_frequency
      label: How frequently do you plan to make investments (e.g., Daily, Weekly,
        Monthly, Quarterly, Semi-Annually, Annually)?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Semi-Annually
      - Annually
      required: false
