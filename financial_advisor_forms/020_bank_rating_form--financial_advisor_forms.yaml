inputSchema:
  type: object
  properties:
    title: Bank Rating Form
    pages:
      - id: 1
        name: customer_full_name
        label: Customer Full Name
        hint: Your name
        type: text
        options: []
        required: true
      - id: 2
        name: customer_email
        label: Email Address
        hint: For follow-up
        type: email
        options: []
        required: true
      - id: 3
        name: account_type
        label: Account Type
        hint: What type of account do you have
        type: select_one
        options:
          - Checking
          - Savings
          - Both
          - Business
          - Investment
          - Loan
        required: true
      - id: 4
        name: customer_since
        label: Customer Since
        hint: How long have you been with us
        type: select_one
        options:
          - Less than 6 months
          - 6 months to 1 year
          - 1-3 years
          - 3-5 years
          - Over 5 years
        required: true
      - id: 5
        name: overall_bank_rating
        label: Overall Bank Rating
        hint: Rate our bank overall
        type: select_one
        options:
          - 5 Stars - Excellent
          - 4 Stars - Very Good
          - 3 Stars - Good
          - 2 Stars - Fair
          - 1 Star - Poor
        required: true
      - id: 6
        name: trust_rating
        label: Trust Rating
        hint: How much do you trust us
        type: select_one
        options:
          - Completely Trust
          - Mostly Trust
          - Somewhat Trust
          - Slightly Trust
          - Do Not Trust
        required: true
      - id: 7
        name: value_rating
        label: Value Rating
        hint: Rate the value you receive
        type: select_one
        options:
          - Excellent Value
          - Good Value
          - Fair Value
          - Poor Value
          - Very Poor Value
        required: true
      - id: 8
        name: convenience_rating
        label: Convenience Rating
        hint: Rate convenience
        type: select_one
        options:
          - Very Convenient
          - Convenient
          - Neutral
          - Inconvenient
          - Very Inconvenient
        required: true
      - id: 9
        name: digital_banking_rating
        label: Digital Banking Rating
        hint: Rate online and mobile banking
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
          - Not Used
        required: true
      - id: 10
        name: customer_support_rating
        label: Customer Support Rating
        hint: Rate our support
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 11
        name: branch_rating
        label: Branch Rating
        hint: Rate physical branches
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
          - Never Visited
        required: true
      - id: 12
        name: atm_rating
        label: ATM Rating
        hint: Rate ATM network
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 13
        name: fees_rating
        label: Fees Rating
        hint: Rate our fees
        type: select_one
        options:
          - Very Competitive
          - Competitive
          - Average
          - High
          - Very High
        required: true
      - id: 14
        name: interest_rates_rating
        label: Interest Rates Rating
        hint: Rate our rates
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 15
        name: product_variety_rating
        label: Product Variety Rating
        hint: Rate product options
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 16
        name: security_rating
        label: Security Rating
        hint: Rate security measures
        type: select_one
        options:
          - Very Secure
          - Secure
          - Neutral
          - Insecure
          - Very Insecure
        required: true
      - id: 17
        name: recommend_rating
        label: Recommendation Rating
        hint: Would you recommend us
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Neutral
          - Probably No
          - Definitely No
        required: true
      - id: 18
        name: strengths
        label: Bank Strengths
        hint: What do we do well
        type: text
        options: []
        required: false
      - id: 19
        name: weaknesses
        label: Bank Weaknesses
        hint: What should we improve
        type: text
        options: []
        required: false
      - id: 20
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback
        type: text
        options: []
        required: false
