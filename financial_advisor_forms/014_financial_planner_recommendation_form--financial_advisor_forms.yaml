      - Long
      required: true
    - id: 10
      name: asset_allocation_target
      label: Asset Allocation Target
      hint: null
      type: select_multiple
      options:
      - Stocks
      - Bonds
      - Real Estate
      - Mutual Funds
      required: true
    - id: 11
      name: financial_goals
      label: Financial Goals
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: investment_objects
      label: Investment Objects
      hint: null
      type: select_multiple
      options:
      - Stocks
      - Bonds
      - Real Estate
      - Mutual Funds
      required: true
