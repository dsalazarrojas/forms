inputSchema:
  type: object
  properties:
    title: Personal Budget Tracking Form
    pages:
    - id: 1
      name: personal_budet_form_page1
      label: What is your monthly income?
      hint: Enter your monthly income.
      type: number
      options: []
      required: false
    - id: 2
      name: personal_budet_form_page2
      label: Monthly Expenses
      hint: Enter your monthly expenses.
      type: number
      options: []
      required: false
    - id: 3
      name: personal_budet_form_page3
      label: Where does your income come from?
      hint: Select your income source.
      type: select_multiple
      options:
      - Salary
      - Investment
      - Business
      - Other
      required: false
    - id: 4
      name: personal_budet_form_page4
      label: How much are your monthly expenses?
      hint: Select your expense level.
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 5
      name: personal_budet_form_page5
      label: What are your financial goals?
      hint: Enter your financial goals.
      type: text
      options: []
      required: false
    - id: 6
      name: personal_budet_form_page6
      label: How much progress you have made towards your financial goals?
      hint: Select your progress level.
      type: select_one
      options:
      - On Track
      - Behind Schedule
      - Ahead of Schedule
      required: false
    - id: 7
      name: personal_budet_form_page7
      label: What are your expenses for Rent?
      hint: Select your rent expenses.
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 8
      name: personal_budet_form_page8
      label: What are your expenses for Food?
      hint: Select your food expenses.
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 9
      name: personal_budet_form_page9
      label: What are your expenses for Transportation?
      hint: Select your transportation expenses.
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 10
      name: personal_budet_form_page10
      label: What are your expenses for Healthcare?
      hint: Select your healthcare expenses.
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 11
      name: personal_budet_form_page11
      label: What are your expenses for Entertainment?
      hint: Select your entertainment expenses.
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 12
      name: personal_budet_form_page12
      label: What are your total expenses for Miscellaneous?
      hint: Select your miscellaneous expenses.
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
