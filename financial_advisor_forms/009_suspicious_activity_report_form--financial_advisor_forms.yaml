inputSchema:
  type: object
  properties:
    title: Suspicious Activity Report Form
    pages:
    - id: 1
      name: suspicious_activity_report_form
      label: Suspicious activity report
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: reported_by
      label: Reported by
      hint: null
      type: select_one
      options:
      - First name
      - Middle name
      - Last name
      - Organization
      - Other
      required: false
    - id: 3
      name: date_of_report
