      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: location
      label: Location
      hint: null
      type: select_multiple
      options:
      - Bank
      - Office
      - Home
      - Other
      required: false
    - id: 9
      name: suspicious_activity_type
      label: Type of suspicious activity
      hint: null
      type: select_one
      options:
      - Suspicious activity 1
      - Suspicious activity 2
      - Suspicious activity 3
      - Suspicious activity 4
      - Suspicious activity 5
      required: false
    - id: 10
      name: description_of_suspicious_activity_2
