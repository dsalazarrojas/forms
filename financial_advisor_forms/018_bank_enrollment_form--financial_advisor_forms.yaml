inputSchema:
  type: object
  properties:
    title: Bank Enrollment Form
    pages:
    - id: 1
      name: applicant_full_name
      label: Applicant Full Name
      hint: Legal name
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: applicant_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 4
      name: applicant_address
      label: Mailing Address
      hint: Street, city, state, ZIP
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 6
      name: social_security_number
      label: Social Security Number
      hint: SSN or ITIN
      type: text
      options: []
      required: true
    - id: 7
      name: enrollment_type
      label: Enrollment Type
      hint: What program are you enrolling in
      type: select_one
      options:
      - Personal Banking
      - Business Banking
      - Premium Banking
      - Student Banking
      - Senior Banking
      - Investment Services
      required: true
    - id: 8
      name: account_preference
      label: Account Preference
      hint: Primary account type
      type: select_one
      options:
      - Checking
      - Savings
      - Both Checking and Savings
      - Money Market
      - Certificate of Deposit
      required: true
    - id: 9
      name: employment_status
      label: Employment Status
      hint: Current employment
      type: select_one
      options:
      - Employed
      - Self-Employed
      - Unemployed
      - Student
      - Retired
      - Other
      required: true
    - id: 10
      name: employer_name
      label: Employer Name
      hint: Company name
      type: text
      options: []
      required: false
    - id: 11
      name: monthly_income
      label: Monthly Income
      hint: Gross monthly income
      type: number
      options: []
      required: false
    - id: 12
      name: initial_deposit_amount
      label: Initial Deposit Amount
      hint: Opening balance
      type: number
      options: []
      required: true
    - id: 13
      name: funding_source
      label: Funding Source
      hint: Where will funds come from
      type: select_one
      options:
      - Transfer from Another Bank
      - Cash Deposit
      - Check Deposit
      - Direct Deposit
      - Other
      required: true
    - id: 14
      name: debit_card_preference
      label: Debit Card Preference
      hint: Card type
      type: select_one
      options:
      - Standard Debit Card
      - Premium Debit Card
      - No Card Needed
      required: true
    - id: 15
      name: online_banking
      label: Online Banking
      hint: Enroll in online banking
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 16
      name: paperless_statements
      label: Paperless Statements
      hint: Receive electronic statements
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 17
      name: overdraft_protection
      label: Overdraft Protection
      hint: Enable overdraft coverage
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 18
      name: additional_cardholders
      label: Additional Cardholders
      hint: Will others have access
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 19
      name: referral_source
      label: How Did You Hear About Us
      hint: Marketing source
      type: select_one
      options:
      - Advertisement
      - Friend or Family
      - Online Search
      - Branch Visit
      - Existing Customer
      - Other
      required: false
    - id: 20
      name: special_requests
      label: Special Requests
      hint: Any accommodations needed
      type: text
      options: []
      required: false
    - id: 21
      name: terms_acceptance
      label: Terms Acceptance
      hint: Do you agree to terms
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 22
      name: signature_date
      label: Signature Date
      hint: Date of enrollment
      type: date
      options: []
      required: true
