      name: risk_tolerance
      label: What is your risk tolerance
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: asset_allocation
      label: How do you allocate your assets
      hint: null
      type: select_one
      options:
      - Conservative
      - Moderately Conservative
      - Moderate
      - Moderately Aggressive
      - Aggressive
      required: true
    - id: 6
      name: retirement_goals
