      name: retirement_planning_questionnaire_1
      label: What is your expected retirement age
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: investment_experience
      label: How much investment experience do you have
      hint: null
      type: select_one
      options:
      - Stocks
      - Bonds
      - Mutual Funds
      - Other
      - None
      required: true
    - id: 3
      name: financial_institution
      label: Which financial institution do you currently use
      hint: null
      type: select_multiple
      options:
      - Fidelity
      - Charles Schwab
      - Vanguard
      - Robinhood
      - Other
      required: true
