inputSchema:
  type: object
  properties:
    title: investment_performance_report_form
    pages:
    - id: 1
      name: investment_start_date
      label: What is the start date of the investment?
      hint: Please enter the start date of the investment
      type: date
      options: []
      required: true
    - id: 2
      name: investment_end_date
      label: What is the end date of the investment?
      hint: Please enter the end date of the investment
      type: date
      options: []
      required: true
    - id: 3
      name: investment_start_value
      label: What was the initial investment value?
      hint: Enter the initial investment value
      type: number
      options: []
      required: true
    - id: 4
      name: investment_end_value
      label: What was the final investment value?
      hint: Enter the final investment value
      type: number
      options: []
      required: true
    - id: 5
      name: investment_net_value
      label: What is the net value of the investment?
      hint: Enter the net value of the investment
      type: number
      options: []
      required: true
    - id: 6
      name: investment_return_rate
      label: What is the return rate of the investment?
      hint: Enter the return rate of the investment
      type: number
      options: []
      required: true
    - id: 7
      name: investment_duration
      label: How long was the investment duration?
      hint: Enter the investment duration in days
      type: number
      options: []
      required: true
    - id: 8
      name: notes
      label: Are there any additional comments or concerns?
      hint: Please share any additional comments or concerns
      type: note
      options: []
      required: false
    - id: 9
      name: investment_compare
      label: How does this investment compare to others of similar type?
      hint: Compare to similar investments
      type: select_one
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neutral
      - Somewhat Disagree
      - Strongly Disagree
      required: false
    - id: 10
      name: investment_return
      label: What is the total return on investment?
      hint: Enter the total return on investment
      type: number
      options: []
      required: false
    - id: 11
      name: investment_expectation
      label: How does this investment's performance compare to your expectations?
      hint: Compare to your expectations
      type: select_one
      options:
      - Significantly Better
      - Somewhat Better
      - As Expected
      - Somewhat Worse
      - Significantly Worse
      required: false
    - id: 12
      name: investment_comments
      label: Any additional comments or concerns?
      hint: Please share any additional comments or concerns
      type: text
      options: []
      required: false
