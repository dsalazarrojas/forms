inputSchema:
  type: object
  properties:
    title: Tax Preparer Agreement Form Experto
    pages:
    - id: 1
      name: tax_preparer_agreement_form_experto
      label: Tax Preparer Agreement Form Experto
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: taxpayer_name
      label: Taxpayer Name
      hint: The name of the taxpayer
      type: text
      options: []
      required: false
    - id: 3
      name: tax_return_preparer_name
      label: Tax Return Preparer Name
      hint: The name of the tax return preparer
      type: text
      options: []
      required: false
    - id: 4
      name: preparer_agreement
      label: Preparer Agreement
      hint: null
      type: select_one
      options:
      - Taxpayer Agreement
      - Preparer Agreement
      - Tax Return Preparer Agreement
      required: false
    - id: 5
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: date_signed
      label: Date Signed
      hint: The date the form was signed
      type: date
      options: []
      required: false
    - id: 7
      name: date_preparer_signature
      label: Date Preparer Signature
      hint: The date of the tax return preparer's signature
      type: date
      options: []
      required: false
