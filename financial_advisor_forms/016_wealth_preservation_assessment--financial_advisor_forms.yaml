      - Moderate
      - Conservative
      required: false
    - id: 5
      name: risk_free_return
      label: Risk Free Return
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: investment_experience
      label: Investment Experience
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
    - id: 7
      name: asset_allocation
      label: Asset Allocation
      hint: null
      type: select_multiple
      options:
      - Bonds
      - Stocks
      - Real Estate
      - Cash and Equivalents
      required: false
    - id: 8
      name: financial_goals
