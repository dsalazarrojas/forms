inputSchema:
  type: object
  properties:
    title: FIA Suitability Assessment Form
    pages:
    - id: 1
      name: client_goals
      label: What are the client's primary financial goals?
      hint: Please describe the client's main objectives.
      type: text
      options: []
      required: true
    - id: 2
      name: risk_tolerance
      label: What is the client's risk tolerance?
      hint: Please select the risk level that best describes the client.
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 3
      name: time_horizon
      label: What is the client's time horizon for investment?
      hint: Please select the time period for the investment.
      type: select_multiple
      options:
      - 1-5 years
      - 5-10 years
      - 10-20 years
      - 20+ years
      required: true
    - id: 4
      name: risk_free_asset
      label: What type of assets do you currently have that are not invested?
      hint: Please list the types of assets.
      type: select_multiple
      options:
      - Bonds
      - Cash
      - Stocks
      - Real Estate
      required: true
    - id: 5
      name: income_type
      label: What is the client's income type?
      hint: Please select the income type.
      type: select_multiple
      options:
      - Salary
      - Self-employment
      - Business
      required: true
    - id: 6
      name: financial_status
      label: What is the client's financial status?
      hint: Please select the financial status.
      type: select_one
      options:
      - Retired
      - Inactive
      - Active
      required: true
    - id: 7
      name: tax_deficiency
      label: What is the client's tax rate?
      hint: Please select the tax rate.
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 8
      name: asset_allocation
      label: What is the client's asset allocation?
      hint: Please describe the asset allocation.
      type: text
      options: []
      required: true
    - id: 9
      name: cash_flow
      label: What is the client's cash flow?
      hint: Please select the cash flow.
      type: select_multiple
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 10
      name: investment_return
      label: What is the client's investment return expectation?
      hint: Please describe the investment return expectation.
      type: number
      options: []
      required: true
    - id: 11
      name: investment_period
      label: What is the client's investment period?
      hint: Please select the investment period.
      type: select_multiple
      options:
      - 1-5 years
      - 5-10 years
      - 10-20 years
      - 20+ years
      required: true
    - id: 12
      name: asset_type
      label: What type of assets do you currently have invested?
      hint: Please list the types of assets.
      type: select_multiple
      options:
      - Cash
      - Bonds
      - Stocks
      - Real Estate
      required: true
