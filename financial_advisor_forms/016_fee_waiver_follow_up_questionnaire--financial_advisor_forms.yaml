inputSchema:
  type: object
  properties:
    title: Fee Waiver Follow Up Questionnaire
    pages:
    - id: 1
      name: name
      label: Applicant Name
      hint: Please enter your name
      type: text
      options: []
      required: true
    - id: 2
      name: updated_applicant_details
      label: Updated Applicant Details
      hint: Please provide any updated details
      type: text
      options: []
      required: false
    - id: 3
      name: fee_waiver_status
      label: Fee Waiver Status
      hint: Select active or inactive
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 4
      name: uploaded_documents
      label: Uploaded Documents
      hint: Please provide any uploaded documents
      type: text
      options: []
      required: false
    - id: 5
      name: review_comments
      label: Review Comments
      hint: Please provide any relevant comments
      type: text
      options: []
      required: false
    - id: 6
      name: review_decision
      label: Review Decision
      hint: Please select school, court, non-profit, or service office
      type: select_one
      options:
      - School
      - Court
      - Non-profit
      - Service Office
      required: true
    - id: 7
      name: other_funding_sources
      label: Other Funding Sources
      hint: Please provide any other funding sources
      type: text
      options: []
      required: false
    - id: 8
      name: financial_support
      label: Financial Support
      hint: Please select if financial support is needed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: additional_comments
      label: Additional Comments
      hint: Please provide any additional comments
      type: text
      options: []
      required: false
    - id: 10
      name: other_financial_support
      label: Other Financial Support
      hint: Please list any other financial support
      type: text
      options: []
      required: false
