      hint: Value of liquid cash
      type: number
      options: []
      required: true
    - id: 7
      name: current_assets_receivables
      label: Accounts Receivable
      hint: Money owed by customers
      type: number
      options: []
      required: true
    - id: 8
      name: current_assets_inventory
      label: Inventory Value
      hint: Value of goods held
      type: number
      options: []
      required: true
    - id: 9
      name: current_assets_other
      label: Other Current Assets
      hint: Other liquid assets
      type: number
      options: []
