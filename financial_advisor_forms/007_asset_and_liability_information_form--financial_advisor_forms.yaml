      name: major_changes
      label: Major Changes This Year
      hint: Describe significant asset/liability changes
      type: text
      options: []
      required: false
    - id: 24
      name: significant_events
      label: Significant Financial Events
      hint: Any major purchases, sales, or events
      type: text
      options: []
      required: false
    - id: 25
      name: accountant_name
      label: Accountant or Preparer Name
      hint: Person preparing this statement
      type: text
      options: []
      required: true
