      name: intangible_assets
      label: Intangible Assets
      hint: Goodwill, patents, trademarks
      type: number
      options: []
      required: false
    - id: 14
      name: other_assets
      label: Other Assets
      hint: Any other asset categories
      type: number
      options: []
      required: false
    - id: 15
      name: total_assets
