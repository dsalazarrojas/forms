inputSchema:
  type: object
  properties:
    title: Asset And Liability Information Form
    pages:
    - id: 1
      name: business_name
      label: Business Name
      hint: Legal business name
      type: text
      options: []
      required: true
    - id: 2
      name: reporting_year
      label: Reporting Year
      hint: Year for this financial report
      type: number
      options: []
      required: true
    - id: 3
      name: report_date
      label: Report Date
      hint: Date of this statement
      type: date
      options: []
      required: true
    - id: 4
      name: owner_first_name
