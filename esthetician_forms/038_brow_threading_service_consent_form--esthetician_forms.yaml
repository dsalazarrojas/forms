inputSchema:
  type: object
  properties:
    title: Brow Threading Service Consent Form
    pages:
    - id: 1
      name: client_name
      label: Client name
      hint: Full client name
      type: text
      options: []
      required: true
    - id: 2
      name: appointment_date
      label: Appointment date
      hint: Scheduled date for threading
      type: date
      options: []
      required: true
    - id: 3
      name: skin_sensitivities
      label: Skin sensitivities
      hint: Note any sensitivities or reactions
      type: text
      options: []
      required: false
    - id: 4
      name: consent_confirmation
      label: Consent confirmation
      hint: Client confirms consent for service
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 5
      name: aftercare_notes
      label: Aftercare notes
      hint: Read only aftercare instructions
      type: note
      options: []
      required: false
    - id: 6
      name: photo_release
      label: Photo release
      hint: Permission to use images for promotion
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: technician_initials
      label: Technician initials
      hint: For service record keeping
      type: text
      options: []
      required: true
    - id: 8
      name: additional_comments
      label: Additional comments
      hint: Any other notes regarding the service
      type: text
      options: []
      required: false
