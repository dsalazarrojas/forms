inputSchema:
  type: object
  properties:
    title: Skin Care Consultation Request Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: birthdate
      label: Birthdate
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: medical_condition
      label: Medical Conditions
      hint: null
      type: select_one
      options:
      - Acne
      - Aging
      - Rosacea
      - Skin Cancer
      - Other
      required: true
    - id: 7
      name: skin_type
      label: Skin Type
      hint: null
      type: select_multiple
      options:
      - Dry
      - Oily
      - Normal
      - Combination
      required: true
    - id: 8
      name: preferred_method
      label: Preferred Method
      hint: null
      type: select_one
      options:
      - Virtual Consultation
      - In-Office Visit
      - Phone Call
      required: false
    - id: 9
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: medical_insurance
      label: Medical Insurance
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: false
