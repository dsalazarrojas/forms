inputSchema:
  type: object
  properties:
    title: Beard Growth Serum Patch Test Consent Form
    pages:
    - id: 1
      name: client_first_name
      label: First Name
      hint: Client first name
      type: text
      options: []
      required: true
    - id: 2
      name: client_last_name
      label: Last Name
      hint: Client last name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: Client DOB
      type: date
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 6
      name: consultation_date
      label: Consultation Date
      hint: Date of consultation
      type: date
      options: []
      required: true
    - id: 7
      name: esthetician_name
      label: Esthetician Name
      hint: Service provider
      type: text
      options: []
      required: true
    - id: 8
      name: serum_brand
      label: Serum Brand
      hint: Product being tested
      type: text
      options: []
      required: true
    - id: 9
      name: skin_sensitivity
      label: Skin Sensitivity Level
      hint: How sensitive is your skin
      type: select_one
      options:
      - Not Sensitive
      - Mildly Sensitive
      - Moderately Sensitive
      - Very Sensitive
      required: true
    - id: 10
      name: known_allergies
      label: Known Allergies
      hint: List all allergies
      type: text
      options: []
      required: true
    - id: 11
      name: current_medications
      label: Current Medications
      hint: Especially topical
      type: text
      options: []
      required: true
    - id: 12
      name: previous_reactions
      label: Previous Reactions to Products
      hint: Any bad reactions
      type: text
      options: []
      required: false
    - id: 13
      name: medical_conditions
      label: Relevant Medical Conditions
      hint: Skin conditions
      type: text
      options: []
      required: false
    - id: 14
      name: patch_test_location
      label: Patch Test Location
      hint: Where test will be done
      type: select_one
      options:
      - Behind Ear
      - Inner Arm
      - Neck
      - Other
      required: true
    - id: 15
      name: test_procedure_explained
      label: Test Procedure Explained
      hint: Do you understand
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: possible_reactions_explained
      label: Possible Reactions Explained
      hint: Were risks explained
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 17
      name: waiting_period_understood
      label: Waiting Period Understood
      hint: 24-48 hour wait
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 18
      name: consent_to_patch_test
      label: I Consent to Patch Test
      hint: Do you consent
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: client_signature
      label: Client Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 20
      name: signature_date
      label: Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
