inputSchema:
  type: object
  properties:
    title: Brow Styling Gel Trial Consent Form
    pages:
      - id: 1
        name: participant_name
        label: Participant name
        hint: Full name of trial participant
        type: text
        options: []
        required: true
      - id: 2
        name: contact_email
        label: Contact email
        hint: Email for trial communication
        type: email
        options: []
        required: true
      - id: 3
        name: known_allergies
        label: Known allergies
        hint: List any skin product allergies
        type: text
        options: []
        required: false
      - id: 4
        name: trial_consent
        label: Trial consent
        hint: Confirm willingness to participate in trial
        type: select_one
        options:
          - I consent
          - I do not consent
        required: true
      - id: 5
        name: expected_side_effects
        label: Expected side effects
        hint: Note potential reactions provided by clinician
        type: note
        options: []
        required: false
      - id: 6
        name: post_trial_follow_up
        label: Post trial follow up
        hint: Availability for follow up assessments
        type: text
        options: []
        required: false
      - id: 7
        name: photo_permission
        label: Photo permission
        hint: Permission for trial photography
        type: select_one
        options:
          - Yes
          - No
        required: false
      - id: 8
        name: clinician_signature_email
        label: Clinician signature email
        hint: Email of the clinician performing trial
        type: email
        options: []
        required: true
