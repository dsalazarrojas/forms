inputSchema:
  type: object
  properties:
    title: Grooming Appointment Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: appointment_datetime
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: service_required
      label: Service
      hint: null
      type: select_one
      options:
      - Hair Cut
      - Nail Service
      - Massage
      - Facial
      required: false
