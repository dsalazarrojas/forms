inputSchema:
  type: object
  properties:
    title: Skincare Client Agreement Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: medical_concerns
      label: Medical Concerns
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: service_agreed
      label: Service Agreement
      hint: null
      type: select_one
      options:
      - I have read and understand the terms and conditions
      - I have not read the terms and conditions
      - I do not agree to the terms and conditions
      required: false
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Cash
      - Gift Card
      - Insurance
      required: false
    - id: 8
      name: client_agreement
      label: Client Agreement
      hint: null
      type: select_multiple
      options:
      - I have read and understand the terms and conditions
      - I have read but do not understand the terms and conditions
      - I have not read the terms and conditions
      required: false
