      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: emergency_contact_info
      label: Emergency Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - '{''value'': ''I give my consent for my scalp treatment and consent to perform
        the treatment.''}'
