inputSchema:
  type: object
  properties:
    title: Online Professional Skills Course Poll
    pages:
    - id: 1
      name: course_goal
      label: What is the goal of this online course?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: course_type
      label: What type of course is this?
      hint: null
      type: select_one
      options:
      - Basic Knowledge
      - Advanced Knowledge
      - Expert Knowledge
      required: false
    - id: 3
      name: course_format
      label: What format would you like to take this course in?
      hint: null
      type: select_multiple
      options:
      - Video
      - Text
      - Live
      required: false
    - id: 4
      name: course_duration
      label: How long does this course last?
      hint: null
      type: select_one
      options:
      - Less than 1 hour
      - 1-3 hours
      - More than 3 hours
      required: false
    - id: 5
      name: course_schedule
      label: What time of day do you prefer for the course?
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      - Anytime
      required: false
    - id: 6
      name: course_language
      label: What language would you like the course in?
      hint: null
      type: select_multiple
      options:
      - English
      - Chinese
      - Spanish
      - French
      - Japanese
      required: false
    - id: 7
      name: course_pace
