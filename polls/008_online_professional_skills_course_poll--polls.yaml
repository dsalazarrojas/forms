      hint: null
      type: select_multiple
      options:
      - Office
      - Online
      - Mobile
      required: false
    - id: 9
      name: course_venue
      label: Where would you like to take the course in?
      hint: null
      type: select_multiple
      options:
      - Classroom
      - Home
      - Virtual
      required: false
    - id: 10
      name: course_instructor
      label: Who would you like to be your instructor?
      hint: null
      type: select_multiple
      options:
      - Male
      - Female
      - Other
      required: false
    - id: 11
      name: course_materials
      label: What materials do you need for the course?
      hint: null
      type: select_multiple
      options:
      - Printed
      - Digital
      - None
      required: false
    - id: 12
      name: course_fees
