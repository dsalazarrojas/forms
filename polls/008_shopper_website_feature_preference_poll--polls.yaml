inputSchema:
  type: object
  properties:
    title: Shopper Website Feature Preference Poll
    pages:
    - id: 1
      name: shopper_website_feature_preference_page
      label: What are your thoughts on our website feedback page?
      hint: Please share your thoughts about our website feedback page.
      type: text
      options: []
      required: false
    - id: 2
      name: website_features_page
      label: What features on our website do you find most important?
      hint: Choose the features that you find most important on our website.
      type: select_one
      options:
      - Very Important
      - Somewhat Important
      - Not Important
      required: true
    - id: 3
      name: overall_satisfaction_page
      label: How would you rate your overall satisfaction with our website?
      hint: Rate your overall satisfaction with our website (1-5 scale).
      type: number
      options: []
      required: true
    - id: 4
      name: improvement_priorities_page
      label: What are the top improvements you'd like to see us make to our website?
      hint: Choose the improvements that you'd like to see on our website.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 5
      name: email_page
      label: What is your email address?
      hint: We'll use this to contact you about any questions or concerns.
      type: email
      options: []
      required: true
    - id: 6
      name: phone_page
      label: What is your phone number?
      hint: We'll use this to contact you about any questions or concerns.
      type: text
      options: []
      required: false
    - id: 7
      name: comments_page
      label: Any comments about our website?
      hint: Share any thoughts or suggestions about our website.
      type: note
      options: []
      required: false
    - id: 8
      name: website_satisfaction_page
      label: How would you rate your website satisfaction?
      hint: Rate your satisfaction with our website (1-5 scale).
      type: select_one
      options:
      - Very satisfied
      - Neutral
      - Dissatisfied
      required: true
    - id: 9
      name: improvement_plan_page
      label: What is your improvement plan for our website?
      hint: Choose the improvements that you'd like to see on our website.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 10
      name: date_of_visit_page
      label: What is the date of your last visit to our website?
      hint: We're interested in knowing when you last visited our website.
      type: date
      options: []
      required: false
    - id: 11
      name: time_of_visit_page
      label: What is the time of your last visit to our website?
      hint: We're interested in knowing when you last visited our website.
      type: time
      options: []
      required: false
    - id: 12
      name: comments_page_2
      label: Comments Page 2
      hint: Share any thoughts or suggestions about our website.
      type: note
      options: []
      required: false
