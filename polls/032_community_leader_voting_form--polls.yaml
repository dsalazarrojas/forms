inputSchema:
  type: object
  properties:
    title: Community Leader Voting Form
    pages:
      - id: 1
        name: voting_instructions
        label: -- Voting Instructions --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: voter_name
        label: Voter name
        hint: For verification purposes
        type: text
        options: []
        required: true
      - id: 3
        name: email
        label: Email address
        hint: Optional for confirmation
        type: email
        options: []
        required: false
      - id: 4
        name: candidate_choice
        label: Select candidate
        hint: Choose one leader candidate
        type: select_one
        options:
          - Candidate A
          - Candidate B
          - Candidate C
          - Candidate D
        required: true
      - id: 5
        name: ranked_preferences
        label: Ranked preferences
        hint: Optionally rank candidates
        type: text
        options: []
        required: false
      - id: 6
        name: endorsement_comments
        label: Endorsement comments
        hint: Reasons for your selection
        type: text
        options: []
        required: false
      - id: 7
        name: eligibility_confirmation
        label: Confirm eligibility
        hint: I am a resident or eligible voter
        type: select_one
        options:
          - Confirm
          - Do not confirm
        required: true
      - id: 8
        name: proxy_option
        label: Use proxy vote
        hint: Indicate if submitting on behalf of another voter
        type: select_one
        options:
          - Yes
          - No
        required: false
      - id: 9
        name: proxy_details
        label: Proxy details if applicable
        hint: Name and relation of proxy
        type: text
        options: []
        required: false
      - id: 10
        name: submitter_signature
        label: Submitter signature name
        hint: Type name to confirm submission
        type: text
        options: []
        required: true
