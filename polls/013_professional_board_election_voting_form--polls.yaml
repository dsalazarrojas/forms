inputSchema:
  type: object
  properties:
    title: Professional Board Election Voting Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: Please fill out this form carefully.
      type: text
      options: []
      required: false
    - id: 2
      name: election_form_page_2
      label: Eligibility Check 1
      hint: Please confirm your eligibility to vote.
      type: text
      options: []
      required: false
    - id: 3
      name: election_form_page_3
      label: Election Preferences
      hint: Please select your preferred candidate.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: election_form_page_4
      label: Eligibility Check 2
      hint: Please confirm your eligibility to vote.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: election_form_page_5
      label: Voting Records
      hint: Please enter the number of votes you plan to cast.
      type: number
      options: []
      required: true
    - id: 6
      name: election_form_page_6
      label: Vote Options
      hint: Please select all options that apply.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: election_form_page_7
      label: Eligibility Confirmation
      hint: Please confirm your eligibility to vote.
      type: text
      options: []
      required: false
    - id: 8
      name: election_form_page_8
      label: Vote Summary
      hint: Please confirm your vote.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: election_form_page_9
      label: Additional Details
      hint: Please provide any additional details.
      type: text
      options: []
      required: false
    - id: 10
      name: election_form_page_10
      label: Review
      hint: Please review your form carefully.
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
