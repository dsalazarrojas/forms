inputSchema:
  type: object
  properties:
    title: Customer Loyalty Program Feedback Poll
    pages:
    - id: 1
      name: program_name
      label: Enter Program Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Your Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: feedback_type
      label: How do you rate your feedback experience with the loyalty program?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: feedback_reason
      label: What was the reason for your feedback?
      hint: null
      type: select_multiple
      options:
      - Not satisfied with rewards
      - Lack of communication
      - Rewards not aligned with my interests
      - Other
      required: false
    - id: 6
      name: suggestions
      label: Do you have any suggestions?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_us
      label: Want to be contacted for follow up?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: contact_info
      label: Your Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: comment
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
