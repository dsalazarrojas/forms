inputSchema:
  type: object
  properties:
    title: Customer Digital Banking Trust Poll Form
    pages:
    - id: 1
      name: home_page
      label: Home
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: introduction
      label: intro
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: customer_trust
      label: trust
      hint: How much trust do you have with digital banking?
      type: select_one
      options:
      - Very low
      - Low
      - Medium
      - High
      required: false
    - id: 4
      name: security_confidence
      label: security
      hint: How secure do you feel your data is with us?
      type: select_multiple
      options:
      - Not very secure
      - Somewhat secure
      - Secure
      required: false
    - id: 5
      name: satisfaction
      label: satisfaction
      hint: How satisfied are you with digital banking experience?
      type: select_one
      options:
      - Not satisfied
      - Neutral
      - Satisfied
      required: false
    - id: 6
      name: security_confidence_2
      label: security_confidence
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: satisfaction_2
      label: satisfaction
      hint: null
      type: select_one
      options:
      - Not satisfied
      - Neutral
      - Satisfied
      required: false
    - id: 8
      name: additional_comments
      label: additional_comments
      hint: Additional comments
      type: text
      options: []
      required: false
