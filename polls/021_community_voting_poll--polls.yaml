inputSchema:
  type: object
  properties:
    title: Community Voting Poll
    pages:
      - id: 1
        name: participant_name
        label: Participant name
        hint: Optional for public ballots
        type: text
        options: []
        required: false
      - id: 2
        name: participant_email
        label: Participant email
        hint: For verification if needed
        type: email
        options: []
        required: false
      - id: 3
        name: poll_topic
        label: Poll topic
        hint: Short description of the issue being voted on
        type: text
        options: []
        required: true
      - id: 4
        name: choices
        label: Voting choices
        hint: Select one option
        type: select_one
        options: [Option A, Option B, Option C, Abstain]
        required: true
      - id: 5
        name: comments
        label: Additional comments
        hint: Optional feedback on your vote
        type: text
        options: []
        required: false
