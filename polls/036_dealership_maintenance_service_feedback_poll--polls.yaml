inputSchema:
  type: object
  properties:
    title: Dealership Maintenance Service Feedback Poll
    pages:
    - id: 1
      name: introduction
      label: What was your overall experience at the Dealership
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: maintenance
      label: Was your vehicle's maintenance service completed on time?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not applicable
      required: false
    - id: 3
      name: feedback
      label: Additional feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact
      label: How would you rate the contact person's communication style?
      hint: null
      type: select_multiple
      options:
      - Effective
      - Not effective
      - Neutral
      required: false
    - id: 5
      name: rating
      label: How would you rate your experience at the dealership?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: rating_details
      label: What was the primary reason for your rating?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: visit_details
      label: Visit details
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: vehicle_type
      label: What type of vehicle was your visit for?
      hint: null
      type: select_multiple
      options:
      - Car
      - Truck
      - Motorcycle
      - SUV
      - Other
      required: false
    - id: 9
      name: customer_info
      label: Customer Information
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
