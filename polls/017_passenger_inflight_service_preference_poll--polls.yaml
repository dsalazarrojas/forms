inputSchema:
  type: object
  properties:
    title: Passenger Inflight Service Preference Poll
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email address
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: in_flight_meal_service
      label: Meal service on flight
      hint: null
      type: select_one
      options:
      - None
      - Snacks only
      - Full meal service
      required: false
    - id: 4
      name: seat_number
      label: Seat number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: travel_class
      label: Travel class
      hint: null
      type: select_one
      options:
      - Economy
      - Premium Economy
      - Business
      - First class
      required: false
    - id: 6
      name: cabin
      label: Cabin
      hint: null
      type: select_one
      options:
      - Front
      - Middle
      - Back
      required: false
    - id: 7
      name: satisfaction
      label: How satisfied were you with the in-flight meal service
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 8
      name: recommend
      label: Do you recommend our in-flight meal service
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Undecided
      required: false
    - id: 9
      name: suggestions
      label: Have any suggestions for the in-flight meal service
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: additional_comments
      label: Any additional comments
      hint: null
      type: text
      options: []
      required: false
