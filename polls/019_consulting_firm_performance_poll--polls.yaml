inputSchema:
  type: object
  properties:
    title: Consulting Firm Performance Poll
    pages:
      - id: 1
        name: respondent_name
        label: Your Name
        hint: Full name - optional
        type: text
        options: []
        required: false
      - id: 2
        name: respondent_email
        label: Email Address
        hint: For follow-up - optional
        type: email
        options: []
        required: false
      - id: 3
        name: company_name
        label: Company Name
        hint: Your organization
        type: text
        options: []
        required: false
      - id: 4
        name: engagement_type
        label: Type of Engagement
        hint: What type of project did you work on
        type: select_one
