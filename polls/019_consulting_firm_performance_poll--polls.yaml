          - Management Consulting
          - IT Consulting
          - Financial Advisory
          - HR Consulting
          - Operations Consulting
          - Multiple Services
        required: true
      - id: 5
        name: engagement_duration
        label: Engagement Duration
        hint: How long was the engagement
        type: select_one
        options:
