inputSchema:
  type: object
  properties:
    title: Digital Content Accessibility Poll Form
    pages:
    - id: 1
      name: poll_form
      label: Digital Content Poll Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: question_1
      label: Which of the following barriers have you encountered
      hint: null
      type: select_one
      options:
      - None of the above
      - Difficulty following text navigation
      - Difficulty using a keyboard or mouse
      - Other (please specify)
      required: true
    - id: 3
      name: question_2
      label: Which of the following barriers have you encountered
      hint: null
      type: select_multiple
      options:
      - None of the above
      - Difficulty following text navigation
      - Difficulty using a keyboard or mouse
      - Other (please specify)
      required: true
    - id: 4
      name: question_3
      label: Which of the following barriers have you experienced
      hint: null
      type: select_one
      options:
      - None of the above
      - Difficulty using a keyboard or mouse
      - Difficulty following text navigation
      - Other (please specify)
      required: true
    - id: 5
      name: question_4
      label: Other (please specify)
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: question_5
      label: Is there anything else you would like to mention
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: question_6
      label: How would you rate this experience?
      hint: On a scale of 1-5
      type: number
      options: []
      required: true
    - id: 8
      name: question_7
      label: How would you rate this experience?
      hint: On a scale of 1-5
      type: number
      options: []
      required: true
    - id: 9
      name: question_8
      label: Would you like to participate in this research again?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 10
      name: question_9
      label: How likely are you to recommend this service to a friend?
      hint: null
      type: select_one
      options:
      - Not at all
      - Not very likely
      - Somewhat likely
      - Likely
      - Very likely
      - Not applicable
      required: true
    - id: 11
      name: question_10
      label: How long did you spend on the poll?
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: question_11
      label: Was this the first time you encountered an accessibility issue?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
    - id: 13
      name: question_12
      label: Was this issue reported previously?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      - Not known
      required: false
    - id: 14
      name: question_13
      label: How often do you encounter accessibility issues?
      hint: null
      type: select_one
      options:
      - Daily
      - Several times a week
      - Weekly
      - Monthly
      - Never
      required: true
