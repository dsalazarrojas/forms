inputSchema:
  type: object
  properties:
    title: Community Election Ballot
    pages:
      - id: 1
        name: voter_name
        label: Voter name
        hint: Optional depending on ballot type
        type: text
        options: []
        required: false
      - id: 2
        name: voter_address
        label: Voter address
        hint: Address for voter eligibility verification
        type: text
        options: []
        required: true
      - id: 3
        name: position_1_choice
        label: Choice for position 1
        hint: Select one candidate
        type: select_one
        options:
          - Candidate A
          - Candidate B
          - Candidate C
        required: true
      - id: 4
        name: position_2_choice
        label: Choice for position 2
        hint: Select one candidate
        type: select_one
        options:
          - Candidate X
          - Candidate Y
          - Candidate Z
        required: true
      - id: 5
        name: ballot_comments
        label: Ballot comments
        hint: Optional remarks about the election
        type: text
        options: []
        required: false
