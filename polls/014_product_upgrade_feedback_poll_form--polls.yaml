      - 2 - Somewhat satisfied
      - 3 - Neutral
      - 4 - Somewhat dissatisfied
      - 5 - Very dissatisfied
      required: true
    - id: 4
      name: feedback_text
      label: feedback_text
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: product_upgrade_feedback_poll_form_comments
      label: product_upgrade_feedback_poll_form_comments
      hint: null
      type: select_multiple
      options:
      - Issue with functionality
      - Issues with performance
      - Other
      required: false
    - id: 7
      name: product_upgrade_feedback_poll_form_additional_comments
      label: product_upgrade_feedback_poll_form_additional_comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: submit
      label: submit
      hint: null
      type: text
      options: []
      required: true
