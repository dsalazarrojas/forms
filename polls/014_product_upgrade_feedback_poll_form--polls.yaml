inputSchema:
  type: object
  properties:
    title: Product Upgrade Feedback Poll Form
    pages:
    - id: 1
      name: product_upgrade_feedback_poll_form
      label: product_upgrade_feedback_poll_form
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: release_date
      label: release_date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: feedback_rating
      label: feedback_rating
      hint: null
      type: select_one
      options:
