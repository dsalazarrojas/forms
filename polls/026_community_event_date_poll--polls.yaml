inputSchema:
  type: object
  properties:
    title: Community Event Date Poll
    pages:
    - id: 1
      name: respondent_name
      label: Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: For poll results notification
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Optional contact number
      type: text
      options: []
      required: false
    - id: 4
      name: event_type
      label: Event Type
      hint: What type of event is this?
      type: text
      options: []
      required: true
    - id: 5
      name: date_option_1
      label: Availability for Date Option 1
      hint: First proposed date
      type: select_one
      options:
      - Available
      - Not Available
      - Maybe
      required: true
    - id: 6
      name: date_option_1_details
      label: Date Option 1 Details
      hint: Enter the specific date
      type: text
      options: []
      required: true
    - id: 7
      name: date_option_2
      label: Availability for Date Option 2
      hint: Second proposed date
      type: select_one
      options:
      - Available
      - Not Available
      - Maybe
      required: true
    - id: 8
      name: date_option_2_details
      label: Date Option 2 Details
      hint: Enter the specific date
      type: text
      options: []
      required: true
    - id: 9
      name: date_option_3
      label: Availability for Date Option 3
      hint: Third proposed date
      type: select_one
      options:
      - Available
      - Not Available
      - Maybe
      required: true
    - id: 10
      name: date_option_3_details
      label: Date Option 3 Details
      hint: Enter the specific date
      type: text
      options: []
      required: true
    - id: 11
      name: date_option_4
      label: Availability for Date Option 4
      hint: Fourth proposed date
      type: select_one
      options:
      - Available
      - Not Available
      - Maybe
      required: false
    - id: 12
      name: date_option_4_details
      label: Date Option 4 Details
      hint: Enter the specific date
      type: text
      options: []
      required: false
    - id: 13
      name: time_preference
      label: Time of Day Preference
      hint: When do you prefer events?
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Any Time
      required: true
    - id: 14
      name: additional_dates
      label: Suggest Additional Dates
      hint: Any other dates that work better?
      type: text
      options: []
      required: false
    - id: 15
      name: priority_level
      label: How Important Is This Event
      hint: Your priority level
      type: select_one
      options:
      - Very Important
      - Important
      - Somewhat Important
      - Not Important
      required: true
