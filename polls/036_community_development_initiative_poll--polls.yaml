inputSchema:
  type: object
  properties:
    title: Development Initiative Poll
    pages:
      - id: 1
        name: resident_area
        label: Resident area or neighborhood
        hint: Optional for anonymous polling
        type: text
        options: []
        required: false
      - id: 2
        name: priority_issue
        label: Top priority issue for development
        hint: Choose the most important topic
        type: select_one
        options:
          - Housing affordability
          - Local jobs and economy
          - Public safety
          - Parks and recreation
          - Transportation
        required: true
      - id: 3
        name: support_for_initiative
        label: Support level for proposed initiative
        hint: Indicate your support
        type: select_one
        options:
          - Strongly support
          - Support
          - Neutral
          - Oppose
          - Strongly oppose
        required: true
      - id: 4
        name: willing_to_participate
        label: Willing to participate in planning
        hint: Volunteer or attend meetings
        type: select_one
        options:
          - Yes
          - No
          - Maybe
        required: false
      - id: 5
        name: comments
        label: Additional comments
        hint: Open ended feedback
        type: text
        options: []
        required: false
