      options:
      - Caesar Salad
      - Garden Salad
      - Caprese Salad
      - Arugula Salad
      - No Salad
      required: true
    - id: 18
      name: side_dishes
      label: Side Dishes
      hint: null
      type: select_multiple
      options:
      - Roasted Vegetables
      - Mashed Potatoes
      - Rice Pilaf
      - Pasta
      - Grilled Asparagus
      - Bread and Butter
      required: true
