      name: section_desserts
      label: -- Desserts --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: dessert_selection
      label: Dessert Selection
      hint: null
      type: select_one
      options:
      - Cake
      - Pastries
      - Fruit Platters
      - Chocolate Mousse
      - Tiramisu
      - Cheesecake
      - Custom Dessert
      - No Dessert
      required: true
    - id: 24
      name: special_requests
      label: Special Requests or Dietary Accommodations
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: menu_confirmation
      label: I confirm my menu selections
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
