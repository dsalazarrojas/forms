inputSchema:
  type: object
  properties:
    title: Catering Stock Count Form
    pages:
    - id: 1
      name: counter_name
      label: Counter Name
      hint: Your name
      type: text
      options: []
      required: true
    - id: 2
      name: count_date
      label: Count Date
      hint: Date of count
      type: date
      options: []
      required: true
    - id: 3
      name: count_time
      label: Count Time
      hint: Time of count
      type: time
      options: []
      required: true
    - id: 4
      name: location
      label: Location
      hint: Where is the stock
      type: select_one
      options:
      - Main Kitchen
      - Satellite Kitchen
      - Storage Room A
      - Storage Room B
      - Walk-in Cooler
      - Freezer
      - Bar Area
      - Event Site
      required: true
    - id: 5
      name: category
      label: Category
      hint: Type of items
      type: select_one
      options:
      - Dry Goods
      - Canned Goods
      - Beverages
      - Dairy
      - Meat
      - Produce
      - Frozen Items
      - Disposables
      - Cleaning Supplies
      - Equipment
      required: true
    - id: 6
      name: item_name_1
      label: Item Name 1
      hint: First item
      type: text
      options: []
      required: false
    - id: 7
      name: unit_1
      label: Unit 1
      hint: Unit of measure
      type: select_one
      options:
      - Each
      - Box
      - Case
      - Pound
      - Kilogram
      - Liter
      - Gallon
      required: false
    - id: 8
      name: quantity_1
      label: Quantity 1
      hint: Count on hand
      type: number
      options: []
