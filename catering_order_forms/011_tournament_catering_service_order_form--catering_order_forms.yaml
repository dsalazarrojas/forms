inputSchema:
  type: object
  properties:
    title: Tournament Catering Service Order Form
    pages:
    - id: 1
      name: name
      label: Name
      hint: Full name of the client
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: Email of the client
      type: text
      options: []
      required: true
    - id: 3
      name: event_date
      label: Event Date
      hint: Date of the event
      type: date
      options: []
      required: true
    - id: 4
      name: event_time
      label: Event Time
      hint: Time of the event
      type: time
      options: []
      required: true
    - id: 5
      name: event_duration
      label: Event Duration
      hint: Duration of the event
      type: text
      options: []
      required: false
    - id: 6
      name: event_location
      label: Event Location
      hint: Location of the event
      type: text
      options: []
      required: true
    - id: 7
      name: catering_preferences
      label: Catering Preferences
      hint: Do you need catering services?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: catering_choices
      label: Catering Choices
      hint: Select your catering preferences
      type: select_multiple
      options:
      - Menu 1
      - Menu 2
      - Menu 3
      - Menu 4
      - Menu 5
      required: false
    - id: 9
      name: num_guests
      label: Number of Guests
      hint: Number of guests
      type: number
      options: []
      required: false
    - id: 10
      name: special_requests
      label: Special Requests
      hint: Any special requests?
      type: text
      options: []
      required: false
    - id: 11
      name: contact_name
      label: Contact Name
      hint: Name of the contact person
      type: text
      options: []
      required: false
    - id: 12
      name: contact_phone
      label: Contact Phone
      hint: Phone number of the contact person
      type: number
      options: []
      required: false
    - id: 13
      name: contact_email
      label: Contact Email
      hint: Email of the contact person
      type: text
      options: []
      required: false
    - id: 14
      name: contact_message
      label: Contact Message
      hint: Any message to the contact person
      type: text
      options: []
      required: false
    - id: 15
      name: event_type
      label: Event Type
      hint: Type of event
      type: text
      options: []
      required: false
    - id: 16
      name: special_requests_2
      label: Special Requests 2
      hint: Any other special requests
      type: text
      options: []
      required: false
    - id: 17
      name: confirm
      label: Confirm
      hint: Please confirm your event details
      type: radio
      options:
      - 'Yes'
      - 'No'
      required: true
