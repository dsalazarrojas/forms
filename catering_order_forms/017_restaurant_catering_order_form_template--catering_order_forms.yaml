inputSchema:
  type: object
  properties:
    title: Restaurant Catering Order Form Template
    pages:
    - id: 1
      name: main_page
      label: Main
      hint: null
      type: select_one
      options:
      - Apple
      - Banana
      - Orange
      required: false
    - id: 2
      name: name
      label: customer_name
      hint: Full name of the customer
      type: text
      options: []
      required: false
    - id: 3
      name: contact
      label: contact_number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: time
      label: order_time
      hint: Ordering time
      type: time
      options: []
      required: false
    - id: 5
      name: food_choice
      label: food_choice
      hint: null
      type: select_multiple
      options:
      - Chicken Wings
      - Salad
      - Soup
      required: false
    - id: 6
      name: quantity
      label: quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: customer_email
      hint: Customer email address
      type: email
      options: []
      required: false
