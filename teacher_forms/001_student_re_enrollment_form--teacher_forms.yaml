inputSchema:
  type: object
  properties:
    title: Student Re Enrollment Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Enter student's first name
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: grade_level
      label: Grade Level
      hint: null
      type: select_one
      options:
      - Freshman
      - Sophmore
      - Junior
      - Senior
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
