      options:
      - Home Pool
      - Pool Nearby
      - Pool Far From Home
      - Other
      required: false
    - id: 2
      name: swimming_permission_details
      label: Additional Information
      hint: Please provide more details about where your child can swim.
      type: text
      options: []
      required: false
    - id: 3
      name: swimmer_name
