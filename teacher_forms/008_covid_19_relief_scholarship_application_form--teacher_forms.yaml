inputSchema:
  type: object
  properties:
    title: COVID 19 Relief Scholarship Application Form
    pages:
    - id: 1
      name: application_date
      label: Application Date
      hint: Date of application
      type: date
      options: []
      required: true
    - id: 2
      name: student_first_name
      label: Student First Name
      hint: Legal first name
      type: text
      options: []
      required: true
    - id: 3
      name: student_last_name
      label: Student Last Name
      hint: Legal last name
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 5
      name: student_email
      label: Student Email
      hint: Email address
      type: email
      options: []
      required: true
    - id: 6
      name: student_phone
      label: Student Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 7
      name: home_address
      label: Home Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: City
      type: text
      options: []
      required: true
    - id: 9
      name: state
      label: State
      hint: State
      type: text
      options: []
      required: true
    - id: 10
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 11
      name: school_name
      label: School Name
      hint: Current school
      type: text
      options: []
      required: true
    - id: 12
      name: grade_level
      label: Current Grade Level
      hint: Grade or year
      type: select_one
      options:
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      - Undergraduate Year 1
      - Undergraduate Year 2
      - Undergraduate Year 3
      - Undergraduate Year 4
      - Graduate Student
      - Other
      required: true
    - id: 13
      name: gpa
      label: Current GPA
      hint: Grade point average
      type: number
      options: []
      required: true
    - id: 14
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 15
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 16
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: Email address
      type: email
      options: []
      required: true
    - id: 17
      name: household_size
      label: Total Household Size
      hint: Number of people in household
      type: number
      options: []
      required: true
    - id: 18
      name: household_income
      label: Annual Household Income
      hint: Before taxes
      type: select_one
      options:
      - Less than $25,000
      - $25,000 - $49,999
      - $50,000 - $74,999
      - $75,000 - $99,999
      - $100,000 or more
      - Prefer not to say
      required: true
    - id: 19
      name: covid_financial_impact
      label: How has COVID-19 impacted your family financially
      hint: Select all that apply
      type: select_multiple
      options:
      - Parent or guardian lost job
      - Parent or guardian had reduced hours
      - Parent or guardian had reduced pay
      - Medical expenses due to COVID-19
      - Death of family breadwinner due to COVID-19
      - Business closure
      - No significant financial impact
      - Other
      required: true
    - id: 20
      name: financial_impact_description
      label: Please describe how COVID-19 has impacted your family
      hint: Detailed explanation
      type: text
      options: []
      required: true
    - id: 21
      name: scholarship_amount_requested
      label: Scholarship Amount Requested
      hint: In USD
      type: number
      options: []
      required: true
    - id: 22
      name: intended_use_of_funds
      label: How will you use the scholarship funds
      hint: Select all that apply
      type: select_multiple
      options:
      - Tuition payment
      - Books and supplies
      - Technology or computer
      - Internet access
      - Transportation
      - Test fees (SAT, ACT, etc.)
      - College application fees
      - Other educational expenses
      required: true
    - id: 23
      name: academic_achievements
      label: List your academic achievements and honors
      hint: Awards and recognition
      type: text
      options: []
      required: false
    - id: 24
      name: extracurricular_activities
      label: List your extracurricular activities and community service
      hint: Clubs, sports, volunteering
      type: text
      options: []
      required: false
    - id: 25
      name: personal_statement
      label: Personal Statement
      hint: Why do you deserve this scholarship
      type: text
      options: []
      required: true
    - id: 26
      name: teacher_reference_name
      label: Teacher Reference Name
      hint: Recommender name
      type: text
      options: []
      required: false
    - id: 27
      name: teacher_reference_email
      label: Teacher Reference Email
      hint: Recommender email
      type: email
      options: []
      required: false
    - id: 28
      name: additional_comments
      label: Additional Comments
      hint: Anything else to share
      type: text
      options: []
      required: false
    - id: 29
      name: applicant_signature_date
      label: Applicant Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
    - id: 30
      name: parent_guardian_signature_date
      label: Parent or Guardian Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
