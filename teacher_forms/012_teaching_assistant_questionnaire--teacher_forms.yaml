inputSchema:
  type: object
  properties:
    title: Teaching Assistant Questionnaire
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: false
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: role
      label: Role
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: frequency_of_interaction
      label: Frequency of Interaction
      hint: null
      type: select_one
      options:
      - Rarely
      - Occasionally
      - Frequently
      - Always
      required: false
    - id: 7
      name: mode_of_interaction
      label: Mode of Interaction
      hint: null
      type: select_multiple
      options:
      - Phone call
      - Email
      - In-person
      - Other
      required: false
    - id: 8
      name: mode_of_interaction_other
      label: Mode of Interaction Other
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: assigned_tool
      label: Tool Used
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
    - id: 11
      name: other_tool
      label: Other Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: how_satisfied_with_service
      label: How satisfied are you with this service?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
