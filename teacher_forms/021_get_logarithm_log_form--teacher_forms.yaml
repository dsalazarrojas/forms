inputSchema:
  type: object
  properties:
    title: Get Logarithm (log) Form
    pages:
    - id: 1
      name: base_number_input
      label: What is the base number?
      hint: Enter the base number
      type: number
      options: []
      required: true
    - id: 2
      name: exponent_number_input
      label: What is the exponent number?
      hint: Enter the exponent number
      type: number
      options: []
      required: true
    - id: 3
      name: logarithm_result_text
      label: What is the result of the logarithm?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: base_select_one
      label: What base are you using?
      hint: null
      type: select_one
      options:
      - '2'
      - '10'
      - Natural
      required: true
    - id: 5
      name: logarithm_base_select_one
      label: What is the logarithm base?
      hint: null
      type: select_one
      options:
      - '2'
      - '10'
      - Natural
      required: true
    - id: 6
      name: is_result_correct
      label: Is the result correct?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 7
      name: logarithm_result_note
      label: Logarithm Result Note
      hint: null
      type: note
      options: []
      required: true
    - id: 8
      name: base_logarithm_input
      label: What is the base of the logarithm?
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: exponentiation_input
      label: What is the result of the exponentiation?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: logarithm_result_text_2
      label: Logarithm Result Text 2
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: exponentiation_input_2
      label: Exponentiation Input 2
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: logarithm_result_text_3
      label: Logarithm Result Text 3
      hint: null
      type: text
      options: []
      required: true
