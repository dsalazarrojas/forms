inputSchema:
  type: object
  properties:
    title: Classroom Observation Form
    pages:
    - id: 1
      name: section_header_basics
      label: -- Observation Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: teacher_name
      label: Teacher Name
      hint: Name of the teacher being observed
      type: text
      options: []
      required: true
    - id: 3
      name: observer_name
      label: Observer Name
      hint: Name of the person conducting the observation
      type: text
      options: []
      required: true
    - id: 4
      name: observation_date
      label: Observation Date
      hint: Date of the classroom observation
      type: date
      options: []
      required: true
    - id: 5
      name: observation_time_start
      label: Observation Start Time
      hint: What time did the observation begin?
      type: time
      options: []
      required: true
    - id: 6
      name: observation_time_end
      label: Observation End Time
      hint: What time did the observation end?
      type: time
      options: []
      required: true
    - id: 7
      name: subject_grade
      label: Subject and Grade Level
      hint: What was being taught and to which grade?
      type: text
      options: []
      required: true
    - id: 8
      name: number_students_present
      label: Number of Students Present
      hint: How many students were in the class?
      type: number
      options: []
      required: true
