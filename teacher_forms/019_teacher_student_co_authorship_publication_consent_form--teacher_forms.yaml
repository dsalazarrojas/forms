inputSchema:
  type: object
  properties:
    title: Teacher Student Co Authorship Publication Consent Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: teacher_department
      label: Teacher Department
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: publication_title
      label: Publication Title
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: publication_date
      label: Publication Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: co_authorship_type
      label: Co-Authorship Type
      hint: null
      type: select_one
      options:
      - Student
      - Teacher
      - Both
      required: true
    - id: 8
      name: student_consent
      label: Student Consent
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: teacher_consent
      label: Teacher Consent
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
