inputSchema:
  type: object
  properties:
    title: Math Survey
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: math_ability
      label: Math Ability
      hint: null
      type: select_one
      options:
      - Strong
      - Average
      - Weak
      required: false
    - id: 4
      name: math_interest
      label: Math Interest
      hint: null
      type: select_multiple
      options:
      - Algebra
      - Geometry
      - Calculus
      required: false
