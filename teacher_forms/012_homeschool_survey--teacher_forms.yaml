inputSchema:
  type: object
  properties:
    title: Homeschool Survey
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_grade
      label: Student Grade
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: student_subjects
      label: Subject Interested
      hint: Select all subjects you are interested in learning more about
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: parent_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: parent_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
