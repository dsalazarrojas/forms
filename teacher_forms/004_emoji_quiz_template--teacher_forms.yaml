      name: correct_answer
      label: Correct Answer
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: question_emojis
      label: Question Emojis
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
