inputSchema:
  type: object
  properties:
    title: Community Education Feedback Form
    pages:
    - id: 1
      name: participant_name
      label: Name (Optional)
      hint: Your name if you wish to share
      type: text
      options: []
      required: false
    - id: 2
      name: email_address
      label: Email Address
      hint: For follow-up
      type: email
      options: []
      required: false
    - id: 3
      name: program_name
      label: Program or Course Name
      hint: Which program did you attend?
      type: text
      options: []
      required: true
    - id: 4
      name: instructor_name
      label: Instructor Name
      hint: Who taught the course?
      type: text
      options: []
      required: false
    - id: 5
      name: completion_date
      label: Completion Date
      hint: When did you complete the program?
      type: date
      options: []
      required: true
    - id: 6
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Rate your overall experience
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 7
      name: content_quality
      label: Content Quality
      hint: Rate the course content
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: instructor_effectiveness
      label: Instructor Effectiveness
      hint: Rate the instructor
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: materials_quality
      label: Quality of Materials
      hint: Rate the provided materials
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not Applicable
      required: true
    - id: 10
      name: pace_rating
      label: Course Pace
      hint: Was the pace appropriate?
      type: select_one
      options:
      - Too Fast
      - Just Right
      - Too Slow
      required: true
    - id: 11
      name: difficulty_level
      label: Difficulty Level
      hint: Was the course too easy or hard?
      type: select_one
      options:
      - Too Easy
      - Appropriate
      - Too Difficult
      required: true
    - id: 12
      name: met_expectations
      label: Did Course Meet Expectations
      hint: Did you get what you expected?
      type: select_one
      options:
      - Exceeded Expectations
      - Met Expectations
      - Did Not Meet Expectations
      required: true
    - id: 13
      name: skills_gained
      label: Skills or Knowledge Gained
      hint: What did you learn?
      type: text
      options: []
      required: false
    - id: 14
      name: apply_learning
      label: Will You Apply What You Learned
      hint: How will you use this knowledge?
      type: select_one
      options:
      - Already Applying
      - Will Apply Soon
      - May Apply Later
      - Unlikely to Apply
      required: true
    - id: 15
      name: recommend_to_others
      label: Would You Recommend This Program
      hint: Likelihood to recommend
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 16
      name: future_courses
      label: Interested in Future Courses
      hint: Would you take more courses?
      type: select_one
      options:
      - Yes, Definitely
      - Maybe
      - 'False'
      required: true
    - id: 17
      name: course_topics
      label: Topics You Would Like to See
      hint: Suggestions for future courses
      type: text
      options: []
      required: false
    - id: 18
      name: improvements
      label: Suggestions for Improvement
      hint: How can we improve?
      type: text
      options: []
      required: false
    - id: 19
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
