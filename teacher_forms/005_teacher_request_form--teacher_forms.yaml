inputSchema:
  type: object
  properties:
    title: Teacher Request Form
    pages:
    - id: 1
      name: teacher_name
      label: Teacher Name
      hint: Student's Name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Student Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: request_type
      label: Request Type
      hint: null
      type: select_one
      options:
      - Online Tutoring
      - On-Site Tutoring
      - Phone/Skype Call
      required: true
    - id: 4
      name: preferred_days
      label: Preferred Days
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 5
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: duration
      label: Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: true
