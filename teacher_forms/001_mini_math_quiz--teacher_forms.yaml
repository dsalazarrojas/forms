inputSchema:
  type: object
  properties:
    title: Mini Math Quiz
    pages:
    - id: 1
      name: quiz_title
      label: Quiz Title
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: quiz_category
      label: Quiz Category
      hint: null
      type: select_one
      options:
      - Math
      - History
      - Science
      - Other
      required: true
    - id: 3
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: quiz_type
      label: Quiz Type
      hint: null
      type: select_one
      options:
      - Formative
      - Summative
      required: true
    - id: 5
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: grading_criteria
      label: Grading Criteria
      hint: null
      type: note
      options: []
      required: true
    - id: 7
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
