inputSchema:
  type: object
  properties:
    title: Parents Evening Form Template
    pages:
    - id: 1
      name: parent_information
      label: Parent Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: meeting_details
      label: Meeting Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: teacher_information
      label: Teacher Information
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: meeting_preferences
      label: Meeting Preferences
      hint: null
      type: select_one
      options:
      - Meeting with the student
      - Meeting with the parent
      - Meeting with both
      required: false
    - id: 5
      name: date_of_meeting
      label: Date of Meeting
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time_of_meeting
      label: Time of Meeting
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: meeting_location
      label: Meeting Location
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: parent_comments
      label: Parent Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: teacher_comments
      label: Teacher Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: meeting_status
      label: Meeting Status
      hint: null
      type: select_one
      options:
      - Confirmed
      - Pending
      - Cancelled
      required: false
    - id: 11
      name: meeting_type
      label: Meeting Type
      hint: null
      type: select_one
      options:
      - Parent-Teacher Meeting
      - Teacher-Parent Meeting
      required: false
    - id: 12
      name: meeting_attendance
      label: Meeting Attendance
      hint: null
      type: select_one
      options:
      - Student
      - Parent
      - Both
      required: false
    - id: 13
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
