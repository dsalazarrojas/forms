inputSchema:
  type: object
  properties:
    title: Online Course Idea Submission Form
    pages:
    - id: 1
      name: course_title
      label: course_title
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: idea_description
      label: idea_description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: target_audience
      label: target_audience
      hint: null
      type: select_one
      options:
      - High School
      - College
      - University
      - Professional
      required: false
    - id: 4
      name: submission_date
      label: submission_date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: course_format
      label: course_format
      hint: null
      type: select_multiple
      options:
      - Online Course
      - Offline Course
      - Workshop
      required: true
    - id: 6
      name: submission_by
      label: submission_by
      hint: null
      type: select_one
      options:
      - Teacher
      - Administrator
      - Student
      required: true
    - id: 7
      name: contact_information
      label: contact_information
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: contact_phone
      label: contact_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: course_length
      label: course_length
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: submission_file
      label: submission_file
      hint: null
      type: note
      options: []
      required: false
