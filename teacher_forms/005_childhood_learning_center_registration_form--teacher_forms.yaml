inputSchema:
  type: object
  properties:
    title: Childhood Learning Center Registration Form
    pages:
    - id: 1
      name: header_personal_info
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: child_full_name
      label: Child Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: preferred_name
      label: Preferred Name
      hint: Name child prefers to be called
      type: text
      options: []
      required: false
    - id: 4
      name: birth_date
      label: Birth Date
      hint: Child date of birth
      type: date
      options: []
      required: true
    - id: 5
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Primary contact for the child
      type: text
      options: []
      required: true
    - id: 6
      name: home_address
      label: Home Address
      hint: Street address, city, state and zip
      type: text
      options: []
      required: true
    - id: 7
      name: phone_number
      label: Phone Number
      hint: Best number for urgent contact
      type: text
      options: []
      required: true
    - id: 8
      name: emergency_contact
      label: Emergency Contact Name
      hint: Alternate contact for emergencies
      type: text
      options: []
      required: true
    - id: 9
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone for emergency contact
      type: text
      options: []
      required: true
    - id: 10
      name: allergies_medical_conditions
      label: Allergies or Medical Conditions
      hint: List any important medical information
      type: text
      options: []
      required: false
    - id: 11
      name: preferred_days
      label: Preferred Days of Attendance
      hint: Select days child will attend
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      required: true
    - id: 12
      name: additional_notes
      label: Additional Notes
      hint: Any other information to share with staff
      type: text
      options: []
      required: false
