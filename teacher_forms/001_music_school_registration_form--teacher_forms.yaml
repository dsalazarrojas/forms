inputSchema:
  type: object
  properties:
    title: music_school_registration_form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: preferred_class_days
      label: Preferred Class Days
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      required: false
    - id: 3
      name: start_time
      label: Start Time
      hint: null
      type: select_one
      options:
      - 08:00
      - 09:00
      - '10:00'
      - '11:00'
      - '12:00'
      required: false
    - id: 4
      name: instrument
      label: Instrument
      hint: null
      type: select_one
      options:
      - Violin
      - Guitar
      - Drums
      required: false
    - id: 5
      name: student_email
      label: Student Email
      hint: Enter student email
      type: email
      options: []
      required: false
    - id: 6
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: preferred_class_time
      label: Preferred Class Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: student_phone
      label: Student Phone
      hint: Enter student phone
      type: text
      options: []
      required: false
