inputSchema:
  type: object
  properties:
    title: Book Report Template
    pages:
    - id: 1
      name: student_name
      label: Student Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: grade_level
      label: Grade Level
      hint: Your current grade
      type: select_one
      options:
      - Grade 3
      - Grade 4
      - Grade 5
      - Grade 6
      - Grade 7
      - Grade 8
      - Grade 9
      - Grade 10
      - Grade 11
      - Grade 12
      required: true
    - id: 3
      name: teacher_name
      label: Teacher Name
      hint: Your teacher name
      type: text
      options: []
      required: true
    - id: 4
      name: class_period
      label: Class Period
      hint: Your class period or section
      type: text
      options: []
      required: false
    - id: 5
      name: book_title
      label: Book Title
      hint: Full title of the book
      type: text
      options: []
      required: true
    - id: 6
      name: book_author
      label: Book Author
      hint: Author of the book
      type: text
      options: []
      required: true
    - id: 7
      name: book_genre
      label: Book Genre
      hint: Select the genre
      type: select_one
      options:
      - Fiction
      - Non-Fiction
      - Mystery
      - Adventure
      - Fantasy
      - Science Fiction
      - Historical Fiction
      - Biography
      - Realistic Fiction
      - Poetry
      required: true
    - id: 8
      name: publication_year
      label: Publication Year
      hint: Year book was published
      type: number
      options: []
      required: false
    - id: 9
      name: page_count
      label: Number of Pages
      hint: Total pages in book
      type: number
      options: []
      required: false
    - id: 10
      name: setting_description
      label: Describe the Setting
      hint: Where and when does the story take place
      type: text
      options: []
      required: true
    - id: 11
      name: main_characters
      label: Main Characters
      hint: List the main characters
      type: text
      options: []
      required: true
    - id: 12
      name: protagonist
      label: Who Is the Protagonist
      hint: Main character of the story
      type: text
      options: []
      required: true
    - id: 13
      name: antagonist
      label: Who Is the Antagonist
      hint: Character opposing the protagonist
      type: text
      options: []
      required: false
    - id: 14
      name: plot_summary
      label: Plot Summary
      hint: Summarize the plot in 5-7 sentences
      type: text
      options: []
      required: true
    - id: 15
      name: main_conflict
      label: What Is the Main Conflict
      hint: Describe the central problem
      type: text
      options: []
      required: true
    - id: 16
      name: climax_description
      label: Describe the Climax
      hint: What was the most exciting part
      type: text
      options: []
      required: true
    - id: 17
      name: resolution
      label: How Was the Conflict Resolved
      hint: Describe the resolution
      type: text
      options: []
      required: true
    - id: 18
      name: favorite_scene
      label: Favorite Scene
      hint: Describe your favorite scene
      type: text
      options: []
      required: false
    - id: 19
      name: character_analysis
      label: Character Analysis
      hint: How did the main character change
      type: text
      options: []
      required: true
    - id: 20
      name: theme
      label: What Is the Theme
      hint: What message is the author conveying
      type: text
      options: []
      required: true
    - id: 21
      name: personal_connection
      label: Personal Connection
      hint: How does this relate to your life
      type: text
      options: []
      required: false
    - id: 22
      name: book_rating
      label: Your Rating
      hint: Rate the book
      type: select_one
      options:
      - 5 Stars Excellent
      - 4 Stars Very Good
      - 3 Stars Good
      - 2 Stars Fair
      - 1 Star Poor
      required: true
    - id: 23
      name: would_recommend
      label: Would You Recommend This Book
      hint: Would you recommend to classmates
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Not Sure
      - Probably No
      - Definitely No
      required: true
    - id: 24
      name: target_audience
      label: Who Would Enjoy This Book
      hint: What type of reader
      type: text
      options: []
      required: false
    - id: 25
      name: report_date
      label: Report Due Date
      hint: Date report is due
      type: date
      options: []
      required: true
