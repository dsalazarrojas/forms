inputSchema:
  type: object
  properties:
    title: course_survey_form
    pages:
    - id: 1
      name: survey_name
      label: Enter Survey Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: course_feedback
      label: How do you feel about this course?
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Neutral
      required: true
    - id: 3
      name: instructor_name
      label: Enter Instructor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: course_satisfaction
      label: How satisfied do you feel about this course?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: course_satisfaction_score
      label: Course Satisfaction
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: date_attended
      label: Date Attended
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: time_attended
      label: Time Attended
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
