inputSchema:
  type: object
  properties:
    title: curriculum_planning_form
    pages:
    - id: 1
      name: subject_areas
      label: What are the subjects to be taught?
      hint: null
      type: select_multiple
      options:
      - English
      - Math
      - Science
      required: false
    - id: 2
      name: total_classes
      label: How many classes are to be planned?
      hint: Enter a number
      type: number
      options: []
      required: false
    - id: 3
      name: class_names
      label: What is the class name?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: subject_periods
      label: What is the period for each class?
      hint: null
      type: select_one
      options:
      - First
      - Second
      - Third
      required: true
    - id: 5
      name: teacher_comments
      label: Any comments or remarks about the classes?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: assigned_user
      label: To whom will the classes be assigned?
      hint: null
      type: select_one
      options:
      - John
      - Jane
      - Other
      required: true
    - id: 7
      name: dates
      label: What are the specific dates of each period?
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: venue
      label: Will the classes be held indoors or outdoors?
      hint: null
      type: select_one
      options:
      - Indoors
      - Outdoors
      required: true
    - id: 9
      name: time
      label: Will the classes be conducted during the day or at night?
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: outcomes
      label: What are the expected outcomes of each class?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: resources
      label: Are there any specific resources to be used in the classes?
      hint: null
      type: text
      options: []
      required: false
