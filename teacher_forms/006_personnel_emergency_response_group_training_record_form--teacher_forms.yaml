    - id: 4
      name: training_location
      label: Training Location
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: training_instructor
      label: Training Instructor
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: training_time
      label: Training Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: training_duration
      label: Training Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: training_status
      label: Training Status
      hint: null
      type: select_one
      options:
      - Completed
      - In Progress
      - Cancelled
      required: false
