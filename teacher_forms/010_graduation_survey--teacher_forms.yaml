inputSchema:
  type: object
  properties:
    title: Graduation Survey
    pages:
    - id: 1
      name: graduate_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: graduate_major
      label: Major
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: graduation_date
      label: Graduation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: postgrad_plan
      label: Post Graduation Plans
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 6
      name: feedback_comments
      label: Feedback Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
