inputSchema:
  type: object
  properties:
    title: Online Course Evaluation Form
    pages:
    - id: 1
      name: overall_quality
      label: How satisfied are you with the overall quality of the course?
      hint: null
      type: select_one
      options:
      - Satisfied
      - Neutral
      - Dissatisfied
      required: true
    - id: 2
      name: course_relevance
      label: Do you feel that the course content is relevant to your goals and interests?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 3
      name: course_organization
      label: What are your thoughts on the course organization and structure?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: instructor_teaching_style
      label: How do you rate the instructor's teaching style?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: improvement_suggestions
      label: Do you have any suggestions for improving the course content?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: recommendation
      label: Would you recommend this course to a friend or colleague?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: future_likelyhood
      label: How likely are you to take this course in the future?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: course_time_of_day
      label: What time of day do you usually take the course?
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: other_comments
      label: Do you have any other comments or suggestions?
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: contact_information
      label: Contact Information
      hint: null
      type: email
      options: []
      required: true
