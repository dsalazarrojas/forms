inputSchema:
  type: object
  properties:
    title: K 8 School Application Form
    pages:
    - id: 1
      name: student_info
      label: Student Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: student_documents
      label: Student Documents
      hint: null
      type: select_multiple
      options:
      - Report Card
      - Birth Certificate
      - Immunization Record
      - Physical Health Record
      required: true
    - id: 4
      name: school_preferences
      label: School Preferences
      hint: null
      type: select_one
      options:
      - K-8 School
      - Other
      required: true
    - id: 5
      name: additional_info
      label: Additional Information
      hint: Please provide any additional information
      type: text
      options: []
      required: false
    - id: 6
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: submit
      label: Submit
      hint: null
      type: select_multiple
      options:
      - I certify that all the information I have provided is accurate
      - I am aware of the school rules and regulations
      required: true
