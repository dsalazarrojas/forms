inputSchema:
  type: object
  properties:
    title: Student Information Request Form
    pages:
    - id: 1
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: student_name
      label: student name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: course_name
      label: course name
      hint: null
      type: select_one
      options:
      - Math
      - Science
      - English
      required: false
    - id: 4
      name: school_year
      label: school year
      hint: null
      type: select_multiple
      options:
      - 9th
      - 10th
      - 11th
      - 12th
      required: false
    - id: 5
      name: teacher_name
      label: teacher name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: school_division
      label: school division
      hint: null
      type: select_multiple
      options:
      - Division A
      - Division B
      - Division C
      required: false
