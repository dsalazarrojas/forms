inputSchema:
  type: object
  properties:
    title: Teacher's Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: zip_code
      label: Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: role
      label: Role
      hint: null
      type: select_one
      options:
      - '{''name'': ''Teacher''}'
      - '{''name'': ''Trainer''}'
      - '{''name'': ''Instructor''}'
      - '{''name'': ''Lecturer''}'
      required: true
    - id: 9
      name: course
      label: Course
      hint: null
      type: text
      options: []
      required: true
