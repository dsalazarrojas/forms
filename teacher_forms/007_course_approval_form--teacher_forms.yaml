inputSchema:
  type: object
  properties:
    title: course_approval_form
    pages:
    - id: 1
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      required: true
    - id: 3
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: course_status
      label: Status
      hint: null
      type: select_multiple
      options:
      - Pending Review
      - In Progress
      - Approved
      required: true
    - id: 5
      name: course_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: course_time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: contact_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: course_file
      label: Course File
      hint: null
      type: text
      options: []
      required: false
