inputSchema:
  type: object
  properties:
    title: Learning Modality Survey
    pages:
    - id: 1
      name: page_one
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: page_two
      label: How do you usually present information to your students?
      hint: null
      type: select_one
      options:
      - Verbal
      - Visual
      - Auditory
      - Kinesthetic
      required: false
    - id: 3
      name: page_three
      label: What is the typical length of your lessons?
      hint: Please specify in minutes
      type: number
      options: []
      required: false
    - id: 4
      name: page_four
      label: What type of materials do you usually use to support your lessons?
      hint: null
      type: select_multiple
      options:
      - Handouts
      - Chalkboard
      - Whiteboard
      - Digital display
      required: false
    - id: 5
      name: page_five
      label: Do you use any other methods or tools?
      hint: null
      type: select_multiple
      options:
      - Video
      - Audio recording
      - Podcast
      - Online lectures
      required: false
    - id: 6
      name: page_six
      label: What types of technology do you use to support your teaching?
      hint: null
      type: select_multiple
      options:
      - Computer
      - Tablet
      - Smartphone
      - Laptop
      required: false
    - id: 7
      name: page_seven
      label: What type of feedback do you usually receive from students?
      hint: null
      type: select_multiple
      options:
      - Verbal
      - Written
      - Electronic
      required: false
    - id: 8
      name: page_eight
      label: How often do you usually receive feedback from students?
      hint: Please specify as a frequency
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Never
      required: false
    - id: 9
      name: page_nine
      label: What types of feedback do you usually give students?
      hint: null
      type: select_multiple
      options:
      - On progress
      - At the end
      - On completion
      - At evaluation
      required: false
    - id: 10
      name: page_ten
      label: How many students do you usually give feedback to?
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: page_eleven
      label: How do you usually communicate with your students?
      hint: null
      type: select_multiple
      options:
      - One-on-one
      - Group discussion
      - Email
      - Phone call
      required: false
