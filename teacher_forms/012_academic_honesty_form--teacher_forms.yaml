inputSchema:
  type: object
  properties:
    title: Academic Honesty Form
    pages:
    - id: 1
      name: honesty_intro
      label: Academic Honesty Pledge and Agreement
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: Full name of the student signing this pledge
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID
      hint: Official student identification number
      type: text
      options: []
      required: true
    - id: 4
      name: course_name
      label: Course Name
      hint: Name of the course for which this pledge applies
      type: text
      options: []
      required: true
    - id: 5
      name: instructor_name
      label: Instructor Name
      hint: Name of the course instructor
      type: text
      options: []
      required: true
    - id: 6
      name: academic_honesty_understanding
      label: Understanding of Academic Honesty
      hint: Do you understand what constitutes academic dishonesty?
      type: select_one
      options: ["Yes, completely", "Mostly", "Partially", "Need clarification"]
      required: true
    - id: 7
      name: plagiarism_definition_knowledge
      label: Knowledge of Plagiarism Definition
      hint: Do you understand what plagiarism means?
      type: select_one
      options: ["Yes, completely", "Mostly", "Partially", "Need clarification"]
      required: true
    - id: 8
      name: citation_practices_knowledge
      label: Knowledge of Citation Practices
      hint: Do you understand how to properly cite sources?
      type: select_one
      options: ["Yes, completely", "Mostly", "Partially", "Need clarification"]
      required: true
    - id: 9
      name: collaboration_boundaries
      label: Understanding of Collaboration Boundaries
      hint: Do you understand when collaboration is allowed versus individual work?
      type: select_one
      options: ["Yes, completely", "Mostly", "Partially", "Need clarification"]
      required: true
    - id: 10
      name: academic_honesty_commitment
      label: Commitment to Academic Honesty
      hint: Do you commit to maintaining academic honesty in all coursework?
      type: select_one
      options: ["Yes, I commit", "Yes, with reservations", "Need more information"]
      required: true
    - id: 11
      name: consequences_acknowledgment
      label: Acknowledgment of Consequences
      hint: Do you understand the consequences of academic dishonesty?
      type: select_one
      options: ["Yes, I understand", "Partially", "Need clarification"]
      required: true
    - id: 12
      name: resources_used_statement
      label: Resources Used Statement
      hint: I certify that I have properly cited all resources used in my work
      type: select_one
      options: ["Yes, I certify", "Some citations missing", "Need to review"]
      required: true
    - id: 13
      name: original_work_statement
      label: Original Work Statement
      hint: I certify that the work I submit is my own original work
      type: select_one
      options: ["Yes, I certify", "With collaboration noted", "Need clarification"]
      required: true
    - id: 14
      name: honor_code_familiarity
      label: Familiarity with Honor Code
      hint: Are you familiar with the institution's honor code or academic integrity policy?
      type: select_one
      options: ["Yes, very familiar", "Somewhat familiar", "Not familiar", "Need to review"]
      required: true
    - id: 15
      name: questions_or_concerns
      label: Questions or Concerns
      hint: Do you have any questions about academic honesty expectations?
      type: text
      options: []
      required: false
    - id: 16
      name: student_signature
      label: Student Signature
      hint: Type your full name as your electronic signature
      type: text
      options: []
      required: true
    - id: 17
      name: signature_date
      label: Date of Signature
      hint: Date when this pledge is signed
      type: date
      options: []
      required: true
