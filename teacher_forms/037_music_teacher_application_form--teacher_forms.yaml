inputSchema:
  type: object
  properties:
    title: Music Teacher Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: resume
      label: Resume
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: teaching_experience
      label: Teaching Experience
      hint: null
      type: select_multiple
      options:
      - Instrumental
      - Vocal
      - Music Theory
      - Music Theory and History
      - Other (please specify)
      required: true
    - id: 7
      name: available_days
      label: Available Days
      hint: null
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 8
      name: music_instruments
      label: Music Instruments
      hint: null
      type: select_multiple
      options:
      - Piano
      - Guitar
      - Violin
      - Other
      required: false
    - id: 9
      name: education
      label: Education
      hint: null
      type: select_multiple
      options:
      - Bachelor
      - Master
      - Ph.D
      required: false
