inputSchema:
  type: object
  properties:
    title: Music School Enrollment Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: student_phone
      label: Student Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: teacher_email
      label: Teacher Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: student_instrument
      label: Student Instrument
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: student_level
      label: Student Level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: true
    - id: 8
      name: class_time
      label: Class Time
      hint: null
      type: time
      options: []
      required: true
