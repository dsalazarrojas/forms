      - Translator 2
      - Translator 3
      required: false
    - id: 4
      name: target_language
      label: Target Language
      hint: null
      type: select_one
      options:
      - Lang 1
      - Lang 2
      - Lang 3
      required: false
    - id: 5
      name: translation_quality
      label: Translation Quality
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 6
      name: source_file
      label: Source File
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: target_file
      label: Target File
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: translation_review
      label: Translation Review
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
