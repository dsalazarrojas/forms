inputSchema:
  type: object
  properties:
    title: Language Validation Form
    pages:
    - id: 1
      name: translation_project_details
      label: Translation Project Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: project_leader
      label: Project Leader
      hint: null
      type: select_one
      options:
      - Leader 1
      - Leader 2
      - Leader 3
      required: false
    - id: 3
      name: translators
      label: Translators
      hint: null
      type: select_multiple
      options:
