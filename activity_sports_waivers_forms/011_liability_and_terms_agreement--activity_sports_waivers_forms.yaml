      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: business_information
      label: Business Information
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: terms_acknowledgment
      label: Terms Acknowledgment
      hint: null
      type: select_one
      options:
      - I understand and agree to the terms
      - I do not understand or do not agree to the terms
