      label: doctor_s_contact_number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: vaccine_dosage
      label: vaccine_dosage
      hint: Please select the dose of the COVID-19 vaccine that you have taken
      type: select_one
      options:
      - 10 mcg
      - 15 mcg
      - 20 mcg
      - 30 mcg
      required: false
    - id: 10
      name: vaccine_administered_date
      label: vaccine_administered_date
      hint: Please enter the date when the vaccine was administered
      type: date
      options: []
