      - I do not agree to accept the risks associated with the COVID-19 vaccine
      required: false
    - id: 12
      name: release_of_liability
      label: release_of_liability
      hint: Please check the box to release the liability
      type: note
      options: []
      required: false
    - id: 13
      name: signature
      label: signature
      hint: Please check the options you agree with
      type: select_multiple
      options:
      - I have read and understood the risks associated with the COVID-19 vaccine
      - I have not read and understood the risks associated with the COVID-19 vaccine
      required: false
