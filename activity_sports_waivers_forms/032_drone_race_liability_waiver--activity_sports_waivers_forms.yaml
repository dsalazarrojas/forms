      name: drone_speed
      label: Drone Speed
      hint: null
      type: select_one
      options:
      - Low Speed
      - High Speed
      - Very High Speed
      required: true
    - id: 20
      name: drone_experience
      label: Drone Experience
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: true
    - id: 21
      name: drone_license
      label: Drone License
      hint: null
      type: select_one
      options:
