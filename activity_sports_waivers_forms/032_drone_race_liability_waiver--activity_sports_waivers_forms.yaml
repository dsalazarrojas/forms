      - Team Organizer
      - Individual Organizer
      required: true
    - id: 23
      name: waiver_agreement
      label: Waiver Agreement
      hint: null
      type: select_multiple
      options:
      - I have read and understood the terms and conditions of this waiver.
      - I have read and understood the risks involved with drone racing.
      - I release and hold harmless all parties responsible for the event and the
        drone.
      - I am the parent or guardian of the participant and have the legal authority
        to sign on their behalf.
      - I am the participant and have read and understood the waiver.
      - I am an event organizer and have read and understood the waiver.
      required: true
    - id: 24
      name: waiver_date
      label: Waiver Date
      hint: null
