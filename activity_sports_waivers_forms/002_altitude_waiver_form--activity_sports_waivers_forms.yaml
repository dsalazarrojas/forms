inputSchema:
  type: object
  properties:
    title: Altitude Waiver Form
    pages:
    - id: 1
      name: full_name
      label: Full Name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      type: date
      options: []
      required: true
    - id: 3
      name: emergency_contact_name
      label: Emergency Contact Name
      type: text
      options: []
      required: true
    - id: 4
      name: emergency_contact_phone
      label: Emergency Contact Phone
      type: text
      options: []
      required: true
    - id: 5
      name: medical_conditions
      label: Medical Conditions
      hint: select all that apply
      type: select_multiple
      options:
      - Asthma
      - Heart Condition
      - High Blood Pressure
      - Pregnancy
      - Vertigo
      - None
      required: true
    - id: 6
      name: activity_type
      label: Activity Type
      type: select_one
      options:
      - Rock Climbing
      - High Altitude Trekking
      - Paragliding
      - Base Jumping
      - Zip Lining
      required: true
    - id: 7
      name: risk_acknowledgment
      label: Risk Acknowledgment
      hint: I understand that high-altitude activities carry inherent risks.
      type: select_one
      options:
      - I Acknowledge and Accept Risks
      - Other
      required: true
    - id: 8
      name: waiver_agreement
      label: Waiver Agreement
      hint: By selecting 'I Agree', you waive certain legal rights.
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
    - id: 9
      name: signature_date
      label: Date of Signature
      type: date
      options: []
      required: true
    - id: 10
      name: guardian_name
      label: Parent or Guardian Name
      hint: Required if participant is under 18.
      type: text
      options: []
      required: false
