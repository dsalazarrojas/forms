inputSchema:
  type: object
  properties:
    title: Riding Lesson Admission Form
    pages:
    - id: 1
      name: user_input
      label: Riding Lesson Admission Form
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: name_input
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_input
      label: Contact Person
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: student_age_input
      label: Student Age
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: student_experience_level_input
      label: Student Experience Level
      hint: null
      type: select_one
      options:
      - Horse riding prophets
      - Beginner
      - Intermediate
      - Advanced
      required: true
    - id: 6
      name: riding_equipment_input
      label: Riding Equipment
      hint: null
      type: select_multiple
      options:
      - None
      - Saddle
      - Bit
      - Bridle
      - Blanket
      - Halter
      - Other
      required: true
    - id: 7
      name: instructor_name_input
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: date_input
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: start_time_input
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: end_time_input
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 11
      name: instructor_phone_input
      label: Instructor Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: emergency_contact_number_input
      label: Emergency Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: emergency_contact_relationship_input
      label: Relationship
      hint: null
      type: select_one
      options:
      - Mother or Father
      - Brother or Sister
      - Spouse
      - Friend
      required: true
    - id: 14
      name: instructor_email_input
      label: Instructor E-mail
      hint: null
      type: email
      options: []
      required: true
    - id: 15
      name: total_time_input
      label: Total Time
      hint: null
      type: number
      options: []
      required: true
    - id: 16
      name: waiver_signed_input
      label: Waiver Signed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 17
      name: riding_lesson_admission_form_terms_of_service_input
      label: Terms of Service
      hint: null
      type: note
      options: []
      required: true
