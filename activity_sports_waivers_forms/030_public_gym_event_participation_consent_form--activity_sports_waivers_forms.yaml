inputSchema:
  type: object
  properties:
    title: Public Gym Event Participation Consent Form
    pages:
    - id: 1
      name: participant_details
      label: Participant Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: health_status
      label: Health Status
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: consent_form
      label: Consent Form
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: medical_info
      label: Medical Information
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: emergency_certification
      label: Emergency Certification
      hint: null
      type: select_multiple
      options:
      - Emergency Medical Technician
      - Paramedic
      - Other
      required: false
