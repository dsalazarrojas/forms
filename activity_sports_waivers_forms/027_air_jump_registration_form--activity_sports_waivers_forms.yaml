inputSchema:
  type: object
  properties:
    title: Air Jump Registration Form
    pages:
    - id: 1
      name: participant_first_name
      label: First Name
      hint: Participant first name
      type: text
      options: []
      required: true
    - id: 2
      name: participant_last_name
      label: Last Name
      hint: Participant last name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: Birth date
      type: date
      options: []
      required: true
    - id: 4
      name: age
      label: Age
      hint: Current age
      type: number
      options: []
      required: true
    - id: 5
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      required: true
    - id: 6
      name: height
      label: Height (feet/inches)
      hint: Participant height
      type: text
      options: []
      required: true
    - id: 7
      name: weight
      label: Weight (lbs)
      hint: Participant weight
      type: number
      options: []
      required: true
    - id: 8
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 10
      name: address
      label: Street Address
      hint: Mailing address
      type: text
      options: []
      required: true
    - id: 11
      name: city
      label: City
      hint: City
      type: text
      options: []
      required: true
    - id: 12
      name: state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 13
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 14
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 15
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 16
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: Relationship to participant
      type: text
      options: []
      required: true
    - id: 17
      name: jump_experience
      label: Air Jump Experience
      hint: Previous experience level
      type: select_one
      options:
      - First time
      - Beginner (1-3 jumps)
      - Intermediate (4-10 jumps)
      - Advanced (10+ jumps)
      - Professional
      required: true
    - id: 18
      name: jump_type
      label: Jump Type
      hint: Type of jump experience
      type: select_one
      options:
      - Tandem jump
      - Solo jump
      - Group jump
      - Training session
      - Competition
      required: true
    - id: 19
      name: preferred_date
      label: Preferred Jump Date
      hint: First choice date
      type: date
      options: []
      required: true
    - id: 20
      name: preferred_time
      label: Preferred Time
      hint: Time of day
      type: select_one
      options:
      - Morning (6AM-10AM)
      - Mid-morning (10AM-12PM)
      - Afternoon (12PM-4PM)
      - Late afternoon (4PM-7PM)
      - Sunset jump
      required: true
    - id: 21
      name: alternative_date
      label: Alternative Date
      hint: Second choice date
      type: date
      options: []
      required: false
    - id: 22
      name: medical_conditions
      label: Medical Conditions
      hint: Any conditions we should know
      type: select_multiple
      options:
      - None
      - Heart condition
      - High blood pressure
      - Back or neck problems
      - Recent surgery
      - Pregnancy
      - Epilepsy
      - Diabetes
      - Asthma
      - Other
      required: true
    - id: 23
      name: medical_clearance
      label: Medical Clearance
      hint: Do you have medical clearance if needed
      type: select_one
      options:
      - Yes, on file
      - Not required
      - Will provide before jump
      required: false
    - id: 24
      name: medications
      label: Current Medications
      hint: List any relevant medications
      type: text
      options: []
      required: false
    - id: 25
      name: previous_injuries
      label: Previous Jump Injuries
      hint: Have you been injured jumping before
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 26
      name: equipment_size
      label: Harness Size
      hint: Based on weight and height
      type: select_one
      options:
      - Extra Small
      - Small
      - Medium
      - Large
      - Extra Large
      - XXL
      required: true
    - id: 27
      name: photo_video_package
      label: Photo/Video Package
      hint: Would you like photos or video
      type: select_one
      options:
      - No thanks
      - Photos only
      - Video only
      - Photo and video package
      required: true
    - id: 28
      name: t_shirt_size
      label: T-Shirt Size
      hint: For event shirt if applicable
      type: select_one
      options:
      - XS
      - S
      - M
      - L
      - XL
      - XXL
      - XXXL
      required: false
    - id: 29
      name: liability_waiver
      label: Liability Waiver Agreement
      hint: I understand and accept the risks
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 30
      name: assumption_of_risk
      label: Assumption of Risk
      hint: I acknowledge the inherent risks
      type: select_one
      options:
      - Yes, I understand and accept
      - false
      required: true
    - id: 31
      name: health_declaration
      label: Health Declaration
      hint: I am physically fit to participate
      type: select_one
      options:
      - Yes, I declare
      - false
      required: true
    - id: 32
      name: participant_signature
      label: Participant Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 33
      name: signature_date
      label: Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
    - id: 34
      name: guardian_signature
      label: Guardian Signature (if under 18)
      hint: Parent or guardian signature
      type: text
      options: []
      required: false
    - id: 35
      name: payment_status
      label: Payment Status
      hint: Current payment status
      type: select_one
      options:
      - Paid in full
      - Deposit paid
      - Pending
      - Waived
      required: true
