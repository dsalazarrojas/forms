inputSchema:
  type: object
  properties:
    title: Basketball Team Sorting Activity Waiver
    pages:
    - id: 1
      name: activity_intro
      label: -- Team Sorting and Tryout Waiver --
      hint: Required for all participants in team placement sessions.
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: participant_dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: grade_level
      label: Current Grade Level
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: parent_name
      label: Parent or Legal Guardian Name
      hint: Required if participant is under 18
      type: text
      options: []
      required: true
    - id: 6
      name: emergency_contact_phone
      label: Emergency Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: medical_conditions
      label: Known Medical Conditions or Allergies
      hint: e.g. Asthma, Heart conditions, Nut allergies
      type: text
      options: []
      required: false
    - id: 8
      name: waiver_text
      label: -- Liability Release and Consent --
      hint: I hereby release the organization from any and all liability for injuries
        sustained during the sorting activity.
      type: note
      options: []
      required: false
    - id: 9
      name: waiver_acceptance
      label: I have read and agree to the liability waiver
      hint: null
      type: select_one
      options:
      - I Agree
      - Other
      required: true
    - id: 10
      name: medical_treatment_consent
      label: I consent to emergency medical treatment if necessary
      hint: null
      type: select_one
      options:
      - I Consent
      - Other
      required: true
    - id: 11
      name: photo_release
      label: Photo and Media Release
      hint: Consent to use photos from the event for promotion
      type: select_one
      options:
      - I Grant Permission
      - I Do Not Grant Permission
      required: true
    - id: 12
      name: signing_date
      label: Date Signed
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: relationship_to_participant
      label: Relationship to Participant
      hint: e.g. Mother, Father, Self
      type: text
      options: []
      required: true
