inputSchema:
  type: object
  properties:
    title: Expense Statement Generation Request Form
    pages:
    - id: 1
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: employee_email
      label: Employee Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: expense_type
      label: Expense Type
      hint: null
      type: select_one
      options:
      - Employee Expenses
      - Company Expenses
      - Travel Expenses
      - Meal Expenses
      - Others
      required: false
    - id: 5
      name: itemized_expenses
      label: Itemized Expenses
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: receipts
      label: Receipts
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: submit_request
      label: Submit Request
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: note
      label: Note
      hint: Additional information about the request.
      type: note
      options: []
      required: false
    - id: 9
      name: category
      label: Category
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: form_id
      label: Form ID
      hint: null
      type: text
      options: []
      required: false
