inputSchema:
  type: object
  properties:
    title: Budget Management Portal Registration Form
    pages:
      - id: 1
        name: applicant_name
        label: Applicant name
        hint: Full name for portal account
        type: text
        options: []
        required: true
      - id: 2
        name: contact_email
        label: Contact email
        hint: Work email for portal access
        type: email
        options: []
        required: true
      - id: 3
        name: department
        label: Department
        hint: Department or cost center
        type: text
        options: []
        required: true
      - id: 4
        name: role
        label: Role
        hint: Role in budget management
        type: select_one
        options:
          - Viewer
          - Editor
          - Approver
          - Admin
        required: true
      - id: 5
        name: requested_permissions
        label: Requested permissions
        hint: Specific permissions required
        type: text
        options: []
        required: false
      - id: 6
        name: justification
        label: Justification
        hint: Reason for portal access
        type: text
        options: []
        required: true
      - id: 7
        name: manager_approval_email
        label: Manager approval email
        hint: Email of manager approving access
        type: email
        options: []
        required: true
      - id: 8
        name: onboarding_notes
        label: Onboarding notes
        hint: Any notes for portal setup team
        type: text
        options: []
        required: false
