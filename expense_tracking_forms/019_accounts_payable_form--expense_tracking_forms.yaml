inputSchema:
  type: object
  properties:
    title: Accounts Payable Form
    pages:
    - id: 1
      name: vendor_name
      label: Vendor Name
      hint: Name of the vendor or supplier
      type: text
      options: []
      required: true
    - id: 2
      name: vendor_address
      label: Vendor Address
      hint: Complete address of the vendor or supplier
      type: text
      options: []
      required: true
    - id: 3
      name: vendor_tax_id
      label: Vendor Tax ID
      hint: Tax identification number of the vendor
      type: text
      options: []
      required: true
    - id: 4
      name: invoice_number
      label: Invoice Number
      hint: Reference number of the invoice
      type: text
      options: []
      required: true
    - id: 5
      name: invoice_date
      label: Invoice Date
      hint: Date when the invoice was issued
      type: date
      options: []
      required: true
    - id: 6
      name: due_date
      label: Due Date
      hint: Date when the payment is due
      type: date
      options: []
      required: true
    - id: 7
      name: amount
      label: Invoice Amount
      hint: Total amount of the invoice
      type: number
      options: []
      required: true
    - id: 8
      name: purchase_order_number
      label: Purchase Order Number
      hint: Reference number of the purchase order (if applicable)
      type: text
      options: []
      required: false
    - id: 9
      name: expense_category
      label: Expense Category
      hint: Classification of the expense
      type: select_one
      options:
      - Office Supplies
      - Utilities
      - Travel
      - Professional Services
      - Equipment
      - Rent
      - Insurance
      - Other
      required: true
    - id: 10
      name: department
      label: Department
      hint: Department responsible for this expense
      type: text
      options: []
      required: true
    - id: 11
      name: description
      label: Description of Goods or Services
      hint: Brief description of what was purchased or service received
      type: text
      options: []
      required: true
    - id: 12
      name: payment_terms
      label: Payment Terms
      hint: Terms of payment agreed with the vendor
      type: select_one
      options:
      - Net 30
      - Net 15
      - Net 60
      - Due on receipt
      - 2% discount if paid in 10 days
      - Other
      required: true
    - id: 13
      name: approval_status
      label: Approval Status
      hint: Current approval status of this payable
      type: select_one
      options:
      - Pending
      - Approved
      - Rejected
      - Paid
      - On hold
      required: true
    - id: 14
      name: notes
      label: Additional Notes
      hint: Any additional information about this payable
      type: text
      options: []
      required: false
